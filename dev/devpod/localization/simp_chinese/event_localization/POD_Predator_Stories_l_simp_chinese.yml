l_simp_chinese:
 POD_predatorstories_artifact: "[newly_created_artifact.GetName]"
 POD_predatorstories_beast_takeover_tooltip: "你血狂的心兽将带你到安全的地方"
 POD_predatorstories.1010.t: "傲慢的凡人"
 POD_predatorstories.1010.desc: "吸血鬼进食的目标很少能够反击。尖牙刺入人的皮肤会引发一种狂喜的感觉（称为“迷吻”），使大多数受害者变得温顺。显然例外总是存在的，不管是因为意志力特别坚强，还是因为外界干预打破了恍惚。\n今晚就是这种罕见的情况，你的潜在受害者正在试图反抗你。虽然对你这样有能力的人构不成真正的威胁，但他们的呼救声可能会引起错误的注意。"
 POD_predatorstories.1010.a: "让这个家伙闭嘴"
 POD_predatorstories.1010.c: "这不值得我花时间。"
 POD_predatorstories.1010.a.success: "沉寂"
 POD_predatorstories.1010.a.success.toast: "这家伙从来就没有机会"
 POD_predatorstories.1010.a.failure: "别喊了！"
 POD_predatorstories.1010.a.failure.toast: "被一个凡人打败？！"
 POD_predatorstories.1010.b.failure.toast: "尴尬……"
 POD_predatorstories.1020.t: "黄雀在后"
 POD_predatorstories.1020.desc: "这只是又一个夜晚，又一个要被吸血的受害者……直到你意识到，躲在暗处的其他人。原来，你的“受害者”是有备而来的，他们很可能是当地一伙研究过你进食习惯的猎人。\n幸运的是，你在情况变得危急之前就发现了他们的埋伏，给你留下了充足的反应时间。不过，一场旷日持久的战斗可能会让你的本性暴露在更多人面前，这是你不愿意看到的。"
 POD_predatorstories.1020.a.success.toast: "他们永远学不乖"
 POD_predatorstories.1020.a.failure.toast: "诅咒你！"
 POD_predatorstories.1030.t: "四牙"
 POD_predatorstories.1030.desc: "你追踪猎物以满足夜间的血液需求已经有一段时间了。他们特别谨慎，就像他们知道如何在黑夜中生存一样，这让你的好奇心达到了顶峰。\n这样的游戏玩了一段时间后，你的“猎物”终于把你逼到了墙角，露出了吸血鬼的真面目。他们认为你在追踪他们，寻找潜在的吸榨，可以理解的是，他们对你对这一误解的解释持怀疑态度。"
 POD_predatorstories.1030.a: "试图在和平地解决这个问题"
 POD_predatorstories.1030.c: "无视"
 POD_predatorstories.1030.a.success: "你缓和了局面"
 POD_predatorstories.1030.a.success.toast: "安抚"
 POD_predatorstories.1030.a.failure: "你未能缓和局面"
 POD_predatorstories.1030.a.failure.tooltip: "用獠牙来交际"
 POD_predatorstories.1030.b.failure: "他打败你"
 POD_predatorstories.1030.b.failure.toast: "可耻的表现"
 POD_predatorstories.1031.t: "局势升级"
 POD_predatorstories.1031.desc: "你的解释只会让他们更加怀疑你的意图。当你对这个死胡同感到沮丧时，你突然注意到他们眼中闪过一丝光芒。他们正准备攻击你。\n虽然他们不会对你的力量构成重大威胁，但他们毕竟是吸血鬼，如果你不小心，可能会造成一些窘迫的伤害。最好尽快结束这一切。"
 POD_predatorstories.1031.a: "蠢货！"
 POD_predatorstories.1031.a.success: "你打败他"
 POD_predatorstories.1031.a.success.toast: "獠牙已胜"
 POD_predatorstories.1031.a.failure: "很接近"
 POD_predatorstories.1031.a.failure.toast: "他们差点就杀了你！"
 POD_predatorstories.1040.t: "目睹攻击"
 POD_predatorstories.1040.desc: "从凡人身上觅食一段时间后就会变得很平常。尽管你是这方面的老手，但狩猎中缺乏刺激可能会导致一些尴尬的事件发生。今晚就是这样一个例子，你注意到一个凡人出现在你的视野中，当他惊讶地发现你正在吸干受害者的血时，显得十分惊恐。"
 POD_predatorstories.1040.a: "无视他"
 POD_predatorstories.1040.c: "#beast 死人不会泄密#!"
 POD_predatorstories.1040.d: "我的力量恰到好处"
 POD_predatorstories.1040.d.tooltip: "他们显然喝得太多了。"
 POD_predatorstories.1040.e: "他不会泄密"
 POD_predatorstories.1040.e.tooltip: "他们从未见过你。事实上，他们从未到过这里。"
 POD_predatorstories.1040.a.toast: "一个怪物！"
 POD_predatorstories.1040.b.toast: "一个恶魔！"
 POD_predatorstories.1050.t: "夜间护理"
 POD_predatorstories.1050.desc: "从凡人身上觅食一段时间后就会变得很平常。尽管你是这方面的老手，但狩猎中缺乏刺激可能会导致一些尴尬的事件发生。今晚就是这样一个例子，你注意到一个孩子在你的视线范围内，一脸惊恐地看着你，因为他惊讶地发现你正在深深地吸干受害者的血。"
 POD_predatorstories.1050.c: "#beast 床底下的怪物可不是假的#!"
 POD_predatorstories.1050.d.tooltip: "只是一个噩梦"
 POD_predatorstories.1060.t: "猎人干涉"
 POD_predatorstories.1060.desc: "由于该地区出现了一些粗心大意的吸血鬼，当地的一群年轻人组成了一支民兵猎人队伍，专门寻找夜间在社区里捕食的 “怪物”。虽然他们的威胁不大，但当你外出狩猎时，他们仍然是一个令人讨厌的问题。"
 POD_predatorstories.1060.a: "你试着避开他们并获取猎物"
 POD_predatorstories.1060.a.tooltip: "诡秘如影并获取猎物"
 POD_predatorstories.1060.b: "放弃掠食"
 POD_predatorstories.1060.a.success: "他什么也没看见"
 POD_predatorstories.1060.a.success.toast: "死之静默"
 POD_predatorstories.1060.a.failure: "他发现你了！"
 POD_predatorstories.1060.a.failure.tooltip: "潜行不管用的时候……獠牙派上用场"
 POD_predatorstories.1060.a.failure.success.toast: "你打败猎人但猎物却逃走了"
 POD_predatorstories.1060.a.failure.failure.toast: "他差点就杀了你！"
 POD_predatorstories.1061.t: "！"
 POD_predatorstories.1061.desc: "尽管你尽管你尽了最大努力，但这群不合群的当地猎人还是在你完全榨干你的目标受害者之前发现了你。当他们一边喊着增援一边向你冲过来时，你很快意识到，你必须尽快解决他们，否则就有可能把事情拖到无法挽回的地步。"
 POD_predatorstories.1061.a: "欢迎来到你的最后一次狩猎"
 POD_predatorstories.1061.a.success: "迅捷而高效"
 POD_predatorstories.1061.a.success.toast: "愚蠢的猎人，他们永远学不乖"
 POD_predatorstories.1061.a.failure: "缓慢而混乱"
 POD_predatorstories.1061.a.failure.toast: "真是一团糟"
 POD_predatorstories.1070.t: "吸血鬼盗猎者"
 POD_predatorstories.1070.desc: "作为领地的主人，你希望新来者在你的觅食地狩猎前向你报到。虽然大多数人都能理智地做到这一点，但总有一些傲慢（或愚蠢）的傻瓜认为他们可以无视您的存在。\n你发现了这样一个不守规矩的家伙，于是决心亲自出马，好好教训一下这个粗鲁的入侵者。"
 POD_predatorstories.1070.a: "了解你的位置"
 POD_predatorstories.1070.b: "哈，我一点都不在乎"
 POD_predatorstories.1070.a.success: "你应该跪下"
 POD_predatorstories.1070.a.success.toast: "跪得更低"
 POD_predatorstories.1070.a.failure: "你好大的胆子！"
 POD_predatorstories.1070.a.failure.toast: "他们怎么敢！"
 POD_predatorstories.1080.t: "暮光之恋"
 POD_predatorstories.1080.desc: "在寻找血液时，最简单的选择有时就是利用同样的凡人。饮血的行为（“迷吻”）让他们非常愉悦，许多人只想体验一下这种感觉。\n其中一个凡人已经成为你的目标有一段时间了，几乎已经被取悦你的需要所迷惑。如果你想找一个温顺的侍寝者的话，他们会是不错的选择。"
 POD_predatorstories.1080.a: "到我房里来……"
 POD_predatorstories.1080.b: "可笑！"
 POD_predatorstories.1080.c: "#beast 靠近点……#!"
 POD_predatorstories.1090.t: "掠夺金钱"
 POD_predatorstories.1090.a: "对，我是"
 POD_predatorstories.1090.b: "那将是一种罪恶！"
 POD_predatorstories.1090.c: "我超越了它"
 POD_predatorstories.1100.t: "闪耀的东西"
 POD_predatorstories.1100.a: "我闻到了金钱的味道"
 POD_predatorstories.1100.b: "一个新的墙饰"
 POD_predatorstories.1100.c: "[newly_created_artifact.GetName]会有用的"
 POD_predatorstories.1110.t: "血腥献礼"
 POD_predatorstories.1110.a: "确实“谦逊”"
 POD_predatorstories.1110.b: "这几乎是侮辱"
 POD_predatorstories.1110.c: "我不在乎这些物质问题"
 POD_predatorstories.1120.a: "拿去卖"
 POD_predatorstories.1120.b: "拿去展示"
 POD_predatorstories.1120.d: "这可能有用"
 POD_predatorstories.1130.t: "满足血狂"
 POD_predatorstories.1130.desc: "进食对吸血鬼来说是一种极度愉悦的感觉。血液是他们的生命，多吸一点的诱惑始终存在。即使是最有教养的该隐之子，也无法抗拒他们的本性。当这种情况发生时，吸血鬼往往来不及恢复理智，就会发现自己怀里抱着一个死去的受害者，被吸干了最后一滴血。"
 POD_predatorstories_conscious.1130.a: "我做了什么……"
 POD_predatorstories_conviction.1130.a: "这又怎样？"
 POD_predatorstories.1140.t: "瘟疫吸血鬼"
 POD_predatorstories.1140.desc: "致命的疾病除了让吸血体验不那么愉快外，对吸血鬼没有多大影响。在最坏的情况下，它们可能会成为疾病的携带者，并在进食时将其传播给其他凡人，但它们自己不会受到影响。\n尽管如此，当你注意到你的受害者有生病的迹象时，你应思考下一步的行动。从他们身上取更多的血可能会导致他们死亡。"
 POD_predatorstories.1140.a: "放他一马"
 POD_predatorstories.1140.b: "我可以帮助他们"
 POD_predatorstories.1140.c: "用魂健术治疗他"
 POD_predatorstories.1140.d: "我小心进食"
 POD_predatorstories.1140.e: "#beast 我要求更多血液！#!"
 POD_predatorstories.1140.d.toast: "因为你的缘故他很有可能不久于世"
 POD_predatorstories.1150.t: "逃跑的老鼠"
 POD_predatorstories.1150.desc: "有时候凡人会让你大吃一惊。当你今晚为狩猎挑选目标时，其中一个人看到了你眼中的某种东西（也许是捕食者面前对猎物的本能恐惧？），便冲向出口。追逐他们可能会很有趣。"
 POD_predatorstories.1150.a: "追上去！"
 POD_predatorstories.1150.c: "放过那恐慌的凡人"
 POD_predatorstories.1151.t: "死角的困鼠"
 POD_predatorstories.1151.desc: "以你超自然的速度，凡人没有机会。既然你已经追上了他们，他们乞求你饶恕一命。这并不重要，因为他们完全取决于你。"
 POD_predatorstories.1151.a: "放过他"
 POD_predatorstories.1151.c: "惊恐的血液……"
 POD_predatorstories.1151.e: "狩猎结束"
 POD_predatorstories.1151.a.toast: "尽管冒着破坏潜藏的风险，你展现出了仁慈"
 POD_predatorstories.1151.c.toast: "在进食后，尽管冒着破坏潜藏的风险，你展现出了仁慈"
 POD_predatorstories.1152.desc: "以你追捕与潜行的技巧该凡人根本毫无胜算。既然你已经追上了他，你打算拿他怎么办？"
 POD_predatorstories.1160.t: "血钱"
 POD_predatorstories_consensualist.1160.desc: "对于那些不追求猎杀快感的吸血鬼来说，与愿意为你献血的凡人合作有很多好处。不过，这也带来了一些独特的问题，比如必须好好照顾他们，这样他们才能继续帮助你。\n你的一位自愿献血者有严重的经济问题。如果你不帮助他，他一定会被殴打，甚至更糟，这可能会让他们永远离开你的联系。"
 POD_predatorstories_familias.1160.desc: "对于那些不追求猎杀快感的吸血鬼来说，与愿意为你献血的凡人合作有很多好处。不过，这也带来了一些独特的问题，比如必须好好照顾他们，这样他们才能继续帮助你。\n你牧群中的一位家庭成员有严重的经济问题。如果你不帮助他，他一定会被殴打，甚至更糟，这可能会让他们永远离开你的联系。"
 POD_predatorstories_cultist.1160.desc: "对于那些不追求猎杀快感的吸血鬼来说，与愿意为你献血的凡人合作有很多好处。不过，这也带来了一些独特的问题，比如必须好好照顾他们，这样他们才能继续帮助你。\n你的一个信徒正面临着严重的经济问题。如果你不帮助他，他一定会被殴打，甚至更糟，这可能会让他永远离开你的联系。"
 POD_predatorstories.1160.a: "我是一个慷慨的赞助者"
 POD_predatorstories.1160.b: "你的事自己解决！"
 POD_predatorstories.1160.c: "我想我认识你的债主……"
 POD_predatorstories.1160.d: "他们会忘记这件事的。"
 POD_predatorstories.1160.e: "是时候改变你的外表了。"
 POD_predatorstories.1160.f: "我会把事情平息下来。"
 POD_predatorstories.1160.g: "是时候让他们流点血了。"
 POD_predatorstories.1170.t: "有尖牙的恶魔"
 POD_predatorstories.1170.desc: "虽然大多数凡人都能本能地理解你不是他们中的一员，但很少有人能真正理解你的真实身份。因此，很多人把你归类为“恶魔”……这意味着，当你听说一些想成为猎人的人在找你时，你会感到好笑而不是惊讶。这本身并不是什么大问题，但这些小丑总是有可能引起更熟练、更危险的猎人的注意。"
 POD_predatorstories.1170.a: "这些谣言无伤大雅"
 POD_predatorstories.1170.b: "驱除它！"
 POD_predatorstories.1170.c: "让他们忘却。"
 POD_predatorstories.1180.a: "血流成河"
 POD_predatorstories.1180.c: "我将摧毁他们的心智"
 POD_predatorstories.1180.b.success: "正义得到了伸张"
 POD_predatorstories.1180.b.failure: "他们逃跑了！"
 POD_predatorstories.1191.t: "凡人干涉"
 POD_predatorstories_alleycat.1191.desc: "在外出觅食时，你不幸被守夜巡逻队的人发现，随后被制止。“喂，是你啊，这么晚了还在外面干什么。这样吧，如果你捐点钱，我就放过你……“他们停顿了一下，清了清嗓子，“保护费”"
 POD_predatorstories_bedlamite.1191.desc: "当你在疯人院裡潜行寻找血液时，不幸的是你被一名由警卫们陪同的工作人员发现并随后出声打断了你。“他闯入院区，把他赶走。”守卫们用威胁的眼神盯著你，同时把手伸向武器把手。"
 POD_predatorstories_cauchemar.1191.desc: "在外出觅食时，你不幸被守夜巡逻队的人发现，随后被制止。“喂，是你啊，这么晚了还在外面干什么。这样吧，如果你捐点钱，我就放过你……“他们停顿了一下，清了清嗓子，“保护费”"
 POD_predatorstories_cenobite.1191.desc: "當你在修道院裡潜行尋找血液時，不幸的是你被一名由警衛们陪同的修道院居民發現並隨後出声打断了你。“他闯入修道院，请把他从圣所趕走。”守衛們用威脅的眼神盯著你，同時把手伸向武器把手。"
 POD_predatorstories_footpad.1191.desc: "在外出觅食时，你不幸被守夜巡逻队的人发现，随后被制止。“喂，是你啊，这么晚了还在外面干什么。这样吧，如果你捐点钱，我就放过你……“他们停顿了一下，清了清嗓子，“保护费”"
 POD_predatorstories_gentry.1191.desc: "在一次贵族私人活动中，一对保镖似乎认为你潜入了活动现场，因此上前挡住了你的去路。其中一名保镖开口说道：“这是贵族的私人活动，请出示你的邀请函，否则将被强行带走。”"
 POD_predatorstories_graverobber.1191.desc: "当你在墓地徘徊寻找血迹时，不幸被墓地看守人的声音发现，并在守夜人的陪同下制止了你们。“他们在这个时间闯入墓地，逮捕他们。”守夜人气势汹汹地盯着你，他们的手正伸向武器的刀柄。"
 POD_predatorstories_phlebotomist.1191.desc: "当你们在医院里徘徊寻找血液时，不幸被发现了，随后，医院的一名工作人员在警卫的陪同下制止了你们。“他们擅闯医院，把他们带走。”卫兵们气势汹汹地盯着你，他们的手正伸向武器的刀柄。"
 POD_predatorstories_siren.1191.desc: "当地的犯罪头目似乎对你们的风流韵事产生了兴趣；当你们在当地熙熙攘攘的酒馆里觅食时，一对打手的声音打断了你们：“喂，亲爱的，这间酒馆和所有在里面工作的人都是老板的财产，要么付钱，要么挨揍”。"
 POD_predatorstories_farmer.1191.desc: "你在狩猎时不幸被发现，随后被国王卫队巡逻队的声音制止。“站住，乡巴佬！你违反了我们大人制定的狩猎法。你将被处以罚款或监禁。”"
 POD_predatorstories_alleycat.1191.a: "我认识守夜人的队长"
 POD_predatorstories_bedlamite.1191.a: "我是一名新来的药剂师"
 POD_predatorstories_cenobite.1191.a: "我是来品尝修道院的美酒的！"
 POD_predatorstories_gentry.1191.a: "你知道老子是谁吗？"
 POD_predatorstories_siren.1191.a: "我可能会给你的老板带来很多麻烦……"
 POD_predatorstories_farmer.1191.a: "我和领主大人是好朋友."
 POD_predatorstories.1191.b: "杀出一条路"
 POD_predatorstories.1191.b.success: "你击败了他们"
 POD_predatorstories.1191.b.success.toast: "你成功突破了凡人的阻拦，毫发无伤"
 POD_predatorstories.1191.b.failure: "他们打败了你"
 POD_predatorstories.1191.b.failure.toast: "你被凡人打伤，但你成功逃脱了"
 POD_predatorstories.1191.c: "我可以付钱让你睁一只眼闭一只眼"
 POD_predatorstories.1191.d: "我这就走"
 POD_predatorstories.1191.e: "用幻象分散他们的注意力"
 POD_predatorstories.1192.t: "窃取鲜血"
 POD_predatorstories.1192.desc: "无论是通过隐蔽的方式还是利用他人的身份，你都已做好准备，随时可以狩猎。"
 POD_predatorstories.1192.a: "饮血"
 POD_predatorstories.1192.b: "喝干他们的血"
 POD_predatorstories.1193.t: "多余的关注"
 POD_predatorstories_alleycat.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n在觅血的过程中，你不幸被守夜巡逻队发现了。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_bedlamite.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n当你在疯人院中徘徊觅血时，不幸被带着卫兵的一名工作人员发现。卫兵们认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_cauchemar.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n在觅血的过程中，你不幸被守夜巡逻队发现了。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_cenobite.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n当你在修道院徘徊觅血时，不幸被带着卫兵的修道院居民发现。卫兵们认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_footpad.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n在觅血的过程中，你不幸被守夜巡逻队发现了。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_graverobber.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n当你在墓地徘徊寻找鲜血时，不幸被墓地看守人发现了，他们还带来了守夜人。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_farmer.1193.desc: "不幸的诅咒给你的容貌留下了疤痕，让你很难冒充凡人。因此，当他们发现你出现在不该出现的地方时，往往会做出攻击性的反应。\n在觅血的过程中，你不幸被警卫发现了。警卫认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_invalid_feeding_type.1193.desc: "该掠食者类型对你不可用。你的容貌不准许你使用这方式进行掠食（你可能是石像鬼或诺斯费拉图）"
 POD_predatorstories.1193.a: "杀出一条路"
 POD_predatorstories.1193.a.success: "你击败了他们"
 POD_predatorstories.1193.a.success.toast: "你成功突破了凡人的阻拦，毫发无伤"
 POD_predatorstories.1193.a.failure: "他们打败了你"
 POD_predatorstories.1193.a.failure.toast: "你被凡人打伤，但你成功逃脱了"
 POD_predatorstories.1193.b: "让心兽接管一切"
 POD_predatorstories.1193.c: "用幻象分散他们的注意力"
 POD_predatorstories.1200.t: "媒人"
 POD_predatorstories.1200.desc: "你供养的一个家庭成员很想结婚。然而，他缺少支付嫁妆所需的资金。作为他族人们未曾说出口的资助人，他向您求助。\n不得不倾听这样的琐碎请求是让[POD_herd|E]提供血液的弊端之一，但至少没有人强迫你接受。"
 POD_predatorstories.1200.a: "我会被邀请吗？"
 POD_predatorstories.1200.b: "你以为我是谁？"
 POD_predatorstories.1200.c: "我知道有人已经够绝望的了"
 POD_predatorstories.1210.t: "不朽的监护者"
 POD_predatorstories.1210.desc: "由于你选择的进食方式是做为一个家族的赞助人，因此你在他们眼中是一个富有且有影响力的人。虽然他们大多数时候并不了解你的真正身份，但他们仍然认为你比他们更伟大，是他们所向往的。因此，您选中的一位家庭成员问您是否愿意收养他们的孩子。"
 POD_predatorstories.1210.a: "我将抚养他们"
 POD_predatorstories.1210.b: "我没有时间"
 POD_predatorstories.1220.t: "保证工作"
 POD_predatorstories.1220.a: "喝了它"
 POD_predatorstories.1220.b: "不喝它"
 POD_predatorstories.1220.a.success.toast: "只是水而已"
 POD_predatorstories.1220.a.failure.toast: "圣水？！"
 POD_predatorstories.1230.t: "行动说服"
 POD_predatorstories.1230.desc: "由于你喜欢让受害者自愿为你提供血液，有时你不得不面对人们并不特别愿意与一个不死的怪物分享他们的血液的情况。这意味着你必须发挥创意，或者至少要有足够的说服力，才能说服他们这么做。"
 POD_predatorstories.1230.a: "尊重他们的意愿"
 POD_predatorstories.1230.b: "做个交易"
 POD_predatorstories.1230.c: "做个不错的交易"
 POD_predatorstories.1230.d: "为他们改变想法"
 POD_predatorstories.1230.e: "用魅力让他们改变主意"
 POD_predatorstories.1240.t: "无稽预言"
 POD_predatorstories.1240.desc: "吸血鬼是天生迷信的动物，他们经常在任何地方都能看到预言。最近，你吸血过的一个凡人的胡言乱语让你很烦恼。这似乎是无稽之谈，而你的宫廷向你保证你是在杞人忧天。所以很明显，你是无罪的……\n……但万一呢？"
 POD_predatorstories.1240.a: "可能吧……"
 POD_predatorstories.1240.b: "哈，只是些胡言乱语罢了。"
 POD_predatorstories.1250.t: "真信者"
 POD_predatorstories.1250.desc: "当你走近这个凡人，想喝他的血时，你就觉得他有些不对劲。这主要表现为一种不安的感觉，而且越靠近越强烈。然而，当你开始喝他们的血时，你就明白了危险的真相。\n这个凡人是一个真信者，他坚定不移的信仰正从内心灼烧着你。你迅速缩回獠牙，重新审视局势。"
 POD_predatorstories.1250.a: "杀了他！"
 POD_predatorstories.1250.b: "跑！"
 POD_predatorstories.1250.c: "他们不会谈论这个"
 POD_predatorstories.1260.t: "血族规矩"
 POD_predatorstories.1260.desc: "今晚出现了一个不寻常的情况，你正在喝一个凡人的血。你注意到他已经有些精疲力竭了，并很快明白了原因，另一个吸血鬼最近已经吸食了他的血。\n这违反了血族规矩，虽然是无意的，但你可能想正式化解这种情况。"
 POD_predatorstories.1260.a: "尝试和平解决"
 POD_predatorstories.1260.b: "与他们战斗"
 POD_predatorstories.1260.c: "无视他们"
 POD_predatorstories.1260.a.success: "你化解了局面"
 POD_predatorstories.1260.a.success.toast: "他们加入了你的宫廷"
 POD_predatorstories.1260.a.failure: "你未能化解局势"
 POD_predatorstories.1260.b.success: "恐吓"
 POD_predatorstories.1260.b.success.toast: "他们是劣等的"
 POD_predatorstories.1260.b.failure: "不屈"
 POD_predatorstories.1260.b.failure.toast: "他们依然我行我素"
 POD_predatorstories.1270.t: "失礼"
 POD_predatorstories.1270.desc: "以贵族为食意味着你必须与他们打成一片，而这并不总是最有趣的事情。对吸血鬼来说，凡人的习俗和礼仪会以惊人的速度发展，而且这样的同伴不会轻易忘记你的失误。\n不幸的是，你今晚就犯了这样的错误，你很快就成了聚会的笑柄。如果你能让他们知道你的真实身份就好了……"
 POD_predatorstories.1270.a: "保持冷静……"
 POD_predatorstories.1270.b: "我相信我能从这次失败中挽回一些声誉"
 POD_predatorstories.1270.c: "这只是个笑话,相信我。"
 POD_predatorstories.1280.t: "独家活动邀请函"
 POD_predatorstories.1280.desc: "从贵族那里获取血液意味着您可以参加一些相当独特的活动。一些社会名流甚至认为，您参加这样的活动是社会地位的象征，因为您是如此神秘而引人入胜。你倒不是真的在乎这帮浮夸的凡人怎么想，但出席活动会对你有不错的影响。"
 POD_predatorstories.1280.a: "这一切都是你的荣幸。"
 POD_predatorstories.1280.b: "我懒得去管。"
 POD_predatorstories.1290.t: "神性质疑"
 POD_predatorstories.1290.desc: "当你利用密教来获得自愿供养血液的凡人时，你就必须在他们面前扮演神的角色。虽然这在大多数情况下相对容易做到（毕竟你有那些令人印象深刻的力量），但有时你的信徒们会要求你展示更华丽、更令人印象深刻的力量。有些能力，比如更高级的威仪术或古蛇术，特别适合愚弄那些容易上当的凡人。"
 POD_predatorstories.1290.a: "你胆敢质疑我！"
 POD_predatorstories.1290.b: "我的威仪术是神圣的。"
 POD_predatorstories.1290.c: "我有着神灵的面孔。"
 POD_predatorstories.1300.t: "神圣治愈"
 POD_predatorstories.1300.desc: "当你作为一群凡人崇拜的神灵，接受他们的血液时，有时你确实需要扮演一位神圣庇护者的角色。你的一个信徒找到你，恳求你用神力治好他们的病。其他人则围拢过来，观看你施展神力。"
 POD_predatorstories.1300.a: "你无法帮助他们。"
 POD_predatorstories.1300.b: "信仰会治愈他们"
 POD_predatorstories.1300.c: "一些“神圣”的草药会有所帮助。"
 POD_predatorstories.1300.d: "我确实有神圣的治愈力量。"
 POD_predatorstories.1311.t: "昂贵的血液"
 POD_predatorstories.1311.desc: "你今晚为满足血液需求而追踪的猎物出人意料地顺从和渴望取悦你。你对此一无所知，直到事成之后，她要求你为他们的时间付费。原来她以为你是个有奇怪癖好的嫖客\n啊，这就尴尬了。"
 POD_predatorstories.1311.a: "忽视他们"
 POD_predatorstories.1311.b: "嗯……好吧。"
 POD_predatorstories.1311.c: "这从来没有发生过"
 POD_predatorstories.1311.d: "#beast 这个血袋竟敢向我提要求！#!"
 POD_predatorstories.1312.t: "暗夜之恋"
 POD_predatorstories.1312.desc: "你今晚为满足血液需求而追踪到的猎物出奇地顺从和渴望取悦你。你对此一无所知，直到完成事后，她要求你下次再做一次，显然对你明显的“奇怪癖好”毫不介意。看来你有个爱慕者了。"
 POD_predatorstories.1312.a: "这只是一夜情罢了"
 POD_predatorstories.1312.b: "下次我们来点不一样的吧。"
 POD_predatorstories.1312.c: "#beast 为什么要等下一次呢？#!"
 POD_predatorstories.1320.t: "空旷的大地"
 POD_predatorstories.1320.desc: "也许是因为凡人的狩猎过多，也许是因为其他一些你不太了解的原因，最近在你的区域里可供捕食的动物越来越少。这让你的狩猎变得更加危险，因为深入森林会让你受到一些狼人的不必要的关注。"
 POD_predatorstories.1320.a: "买一些动物替代"
 POD_predatorstories.1320.b: "运用你的狩猎直觉"
 POD_predatorstories.1320.c: "运用你的力量"
 POD_predatorstories.1330.t: "反抗勒索"
 POD_predatorstories.1330.desc: "你今夜追猎的这个凡人颇为奇特，似乎对你的同类（或者特别是对你）了解得比大多数凡人要多。当他声称已经掌握了你的某个秘密时，你的怀疑得到了证实。  \n这怎么可能？要么是有人疏忽大意，要么是他暗中为你宫廷中的某位成员效力……无论如何，他们威胁说，如果你不放过他，就要将这个秘密公之于众。"
 POD_predatorstories.1330.a: "我没有什么可隐藏的"
 POD_predatorstories.1330.b: "我们陷入了僵局。"
 POD_predatorstories.1330.c: "他们不会说出去的。"
 POD_predatorstories.1330.d: "#beast 其竟敢尝试勒索我？！#!"
 POD_predatorstories.1340.t: "坦白从宽？"
 POD_predatorstories.1340.desc: "你通过敲诈和勒索来获取所需，这在大多数情况下是一种有效的手段。然而，这也让你“保护”下的凡人们惴惴不安，总想方设法摆脱与你达成的协议。  \n最近，你的一位被勒索的对象得到了一笔黄金。他提出用这笔钱作为交换，请求你忘记他的秘密，并放过他们。"
 POD_predatorstories.1340.a: "成交。"
 POD_predatorstories.1340.b: "我宁愿让他们用血来支付。"
 POD_predatorstories.1340.c: "我全都要、现在就要！"
 POD_predatorstories.1350.t: "支援组织"
 POD_predatorstories.1350.desc: "你通过敲诈和勒索来获取所需，这在大多数情况下是一种有效的手段。然而，这也让你“保护”下的凡人们惴惴不安，总想方设法摆脱与你达成的协议。  \n当你正在寻找一位被勒索的凡人目标时，突然遭到多名手持木桩的猎人的袭击。他们显然认为，如果你意外迎来最终的死亡，他们就能摆脱与你达成的协议。真是愚蠢。"
 POD_predatorstories.1350.a: "让我料理这些猎人。"
 POD_predatorstories.1350.b: "让心兽接管一切。"
 POD_predatorstories.1350.a.success: "小菜一碟"
 POD_predatorstories.1350.a.failure: "艰难的胜利"
 POD_predatorstories.1351.t: "上门拜访"
 POD_predatorstories.1351.desc: "猎人们已被击败，你发现了一张纸条，上面详细记载了伏击你的地点。你认出这张给猎人的纸条出自一位被你勒索的凡人之手。显然，他试图通过杀死你来摆脱勒索。  \n是时候去拜访他了。"
 POD_predatorstories.1351.a: "照常进食，但给予他仁慈。"
 POD_predatorstories.1351.b: "他值得流血而亡。"
 POD_predatorstories.1360.t: "膏肓之地"
 POD_predatorstories.1360.desc: "最近，你领地内的野生动物比往常多了许多。虽然你不确定这种令人欣喜的变化的原因，但这使得猎取动物血液变得更加容易和安全。你甚至不需要深入森林，在入口处就能找到充足的猎物。"
 POD_predatorstories.1360.a: "尽情享用吧。"
 POD_predatorstories.1371.t: "愤怒的小鸟"
 POD_predatorstories.1371.desc: "猎取动物并非总是易事。动物对吸血鬼毫无好感，虽然大多数动物在察觉到你的接近时会逃跑，但有些则会试图反击，往往导致难以预料的结果。这只公鸡已经决定不再容忍你的存在。  \n不过，这应该不是什么大问题。"
 POD_predatorstories.1371.a: "从公鸡身上获取血液。"
 POD_predatorstories.1372.t: "狼吻"
 POD_predatorstories.1372.desc: "猎取动物并非总是易事。动物对吸血鬼毫无好感，虽然大多数动物在察觉到你的接近时会逃跑，但有些则会试图反击，往往导致难以预料的结果。这只狼已经决定不再容忍你的存在。  \n不过，这应该不是什么大问题。"
 POD_predatorstories.1372.a: "坏狗！"
 POD_predatorstories.1372.b: "跑啊！"
 POD_predatorstories.1372.a.success: "你轻易击败了狼"
 POD_predatorstories.1372.a.success.toast: "胜利！"
 POD_predatorstories.1372.a.failure: "一场不雅的胜利"
 POD_predatorstories.1372.a.failure.toast: "你受伤了"
 POD_predatorstories.1373.t: "愤怒的熊"
 POD_predatorstories.1373.desc: "猎取动物并非总是易事。动物对吸血鬼毫无好感，虽然大多数动物在察觉到你的接近时会逃跑，但有些则会试图反击，往往导致难以预料的结果。这只熊已经决定不再容忍你的存在。  \n强大的动物不容小觑，尽管它们无法与大多数吸血鬼的超自然力量匹敌。"
 POD_predatorstories.1373.a: "仅靠我的双手就足够了。"
 POD_predatorstories.1373.b: "跑啊！"
 POD_predatorstories.1373.a.success: "你击败了熊"
 POD_predatorstories.1374.t: "巨蟒与圣杯"
 POD_predatorstories_sensebane.1374.desc: "当你外出寻找动物猎物时，偶然发现了一只兔子。然而，这只兔子有些异常。它周围布满了血迹和尸体，并且注意到了你。\n由于你具有侦测光环或侦测邪恶的高级能力，你知道这只兔子是被忌灵附身了。"
 POD_predatorstories.1374.desc: "当你外出寻找动物猎物时，偶然发现了一只兔子。然而，这只……兔子有些不寻常，它似乎被鲜血和尸体包围着，并注意到了你。\n这是你见过的最肮脏、最残忍、最邪恶的啮齿动物！"
 POD_predatorstories.1374.a: "好吧，那不是普通的兔子。"
 POD_predatorstories.1374.b: "那只兔子凶残至极！它是个杀手！"
 POD_predatorstories.1374.c: "我要驱除这只恶魔般的动物！"
 POD_predatorstories.1375.t: "最残暴的啮齿动物"
 POD_predatorstories.1375.desc: "那只兔子正朝你猛冲过来，它那排匕首般的牙齿此刻清晰可见，令人胆寒。它还能四处跳跃。看看那些骸骨！  \n这显然是魔鬼的造物。你能从这场可怕的遭遇中幸存下来吗？"
 POD_predatorstories.1375.a: "它朝着我们过来了！"
 POD_predatorstories.1375.a.success: "一场载入史册的胜利！"
 POD_predatorstories.1375.a.failure: "你逃离了这个地狱的产物"
 POD_predatorstories.1375.a.failure.toast: "到此为止"
 POD_predatorstories.1380.t: "血腥恩主"
 POD_predatorstories.1380.a: "我会帮他们。"
 POD_predatorstories.1380.b: "你自己解决！"
 POD_predatorstories.1380.c: "动物听从我的旨意。"
 POD_predatorstories.1390.t: "只是另一个受害者？"
 POD_predatorstories.1390.desc: "在外寻找血液时，你发现了一个合适的猎物。他有什么异常吗？……不，这只是你的想象。即使站在远处，他的血液也显得格外诱人，仿佛有一种“闪亮”的特质。  \n是时候露出你的獠牙了。"
 POD_predatorstories_auspexadvanced.1390.desc: "你敏锐的观察力让你能够判断出你选择的猎物其实是一个妖精[GetTrait('redcap').GetName( GetNullCharacter )]，而不是吸血鬼。\n\n你知道红帽子很可能善于战斗并能探测到看不见的东西。你也知道以妖精为食很可能会产生一些不利影响。"
 POD_predatorstories.1390.a: "你向受害者前进。"
 POD_predatorstories.1390.b: "也许我应该去找其他猎物……"
 POD_predatorstories.1391.desc: "当你将这位奇怪的受害者逼入角落时，你的心兽却出奇地安静，仿佛在思考吞噬这个奇怪的存在对你来说是福是祸。  \n现在你离得更近了，这才注意到你的受害者有着不寻常的外表，但你还没来得及细想，猎物已经发现了你，并摆出了攻击姿态。如果你现在不逃走，一场战斗将不可避免。"
 POD_predatorstories_auspexadvanced.1391.desc: "你逼入角落的受害者的血液，即使站在远处也显得格外诱人，仿佛有一种“闪亮”的特质。你的心兽却出奇地安静，仿佛在思考吞噬这个奇怪的存在对你来说是福是祸。\n现在你离得更近了，猎物已经发现了你，并摆出了攻击姿态。如果你现在不逃走，一场战斗将不可避免。"
 POD_predatorstories.1391.a: "闪耀的血液……"
 POD_predatorstories.1391.b: "这是个坏主意……"
 POD_predatorstories.1391.a.success: "你击败了他们"
 POD_predatorstories.1391.a.success.toast: "闪耀的血液！"
 POD_predatorstories.1391.a.failure: "他们击败了你"
 POD_predatorstories.1391.a.failure.toast: "该死的蝴蝶！"
 POD_predatorstories.1401.t: "捉迷藏"
 POD_predatorstories.1401.desc: "对你来说，这原本只是又一个寻常的狩猎之夜，直到某件事引起了你的注意。附近有一个你无法完全看清的存在，就像使用了混淆术的吸血鬼，但又有些……不同。在你的领地内，有人如此鬼鬼祟祟且拥有如此奇怪的力量，这绝对值得调查一番。"
 POD_predatorstories.1401.a: "再看一眼"
 POD_predatorstories.1401.b: "用观瞻术去看无法察觉的东西"
 POD_predatorstories.1401.a.success: "找到你了！"
 POD_predatorstories.1401.a.failure: "什么都没找到……"
 POD_predatorstories.1402.desc: "你找到了他，而他确实……与众不同。这是你从未见过的存在，而他的血液……闪闪发光？你的心兽却出奇地安静，仿佛在思考你是否应该吞噬这个奇怪的实体。无论如何，既然他已被发现，你将迎来一场奇异的遭遇。"
 POD_predatorstories_auspexadvanced.1402.desc: "你敏锐的观察力让你能够判断出你选择的猎物其实是[GetTrait('sluagh').GetName( GetNullCharacter )]，而不是[GetTrait('vampire').GetName( GetNullCharacter )]。\n\n[GetTrait('sluagh').GetName( GetNullCharacter )]可能会尽量避免冲突，并察觉到看不见的东西。\n\n你知道以妖精为食很可能会产生一些不利影响。"
 POD_predatorstories.1402.a: "找到你了！"
 POD_predatorstories.1402.b: "也许我应该再寻找一个猎物……"
 POD_predatorstories.1403.t: "发现了！"
 POD_predatorstories.1403.desc: "现在你离得更近了，你的受害者注意到你的一个不同寻常的吸血鬼外表。\n\n他吓了一跳，请求你收下一些金子以求生路。他奇怪的、超凡脱俗的血液呼唤着你，让你的心兽想知道它会是什么味道……"
 POD_predatorstories_auspexadvanced.1403.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )]吓了一跳，连忙请求您放过他们，以换取一些金钱。\n他奇怪的、或者说闪亮的血液在召唤你的心兽，它会想知道这是什么味道……"
 POD_predatorstories.1403.a: "接受这笔钱。"
 POD_predatorstories.1403.b: "闪耀的血液！"
 POD_predatorstories.1404.t: "给我回来！"
 POD_predatorstories.1404.desc: "当你拒绝了他的提议后，受害者惊慌失措，以惊人的速度逃跑了。他显然非常擅长奔跑和躲藏，你必须全力以赴，并利用你对这片区域的了解来抓住他们（最重要的是，正如心兽提醒你的那样，获取他那闪耀的血液）。"
 POD_predatorstories_auspexadvanced.1404.desc: "当拒绝了他的提议后，[GetTrait('sluagh').GetName( GetNullCharacter )]惊慌失措，以惊人的速度逃跑了。他显然非常擅长奔跑和躲藏，你必须全力以赴，并利用你对这片区域的了解来抓住他们（最重要的是，正如心兽提醒你的那样，获取他那闪耀的血液）。"
 POD_predatorstories.1404.a: "追上去！"
 POD_predatorstories.1404.j: "追赶其太费力了"
 POD_predatorstories.1404.a.success: "抓到了！"
 POD_predatorstories.1404.a.failure: "该死的妖精！"
 POD_predatorstories.1405.t: "另辟蹊径"
 POD_predatorstories.1405.desc: "这位不寻常的受害者显然紧张不安，急于与你达成协议，并愿意提供更多的黄金，只求你放他们一马。  \n然而，你的心兽并不赞同这个选择——与品尝如此独特、闪亮、跳动的血液相比，黄金又算得了什么？"
 POD_predatorstories_auspexadvanced.1405.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )]现在显然很紧张，急于和你做交易，他们提供了更多的金子，作为交换，希望你放过他们。\n然而，你的心兽不赞成这个选择，与品尝这种独特的食物的可能性相比，黄金算什么……闪亮的……脉动的血液？"
 POD_predatorstories.1405.a: "太迷幻了"
 POD_predatorstories.1405.b: "闪亮的血液归我了！"
 POD_predatorstories.1406.t: "梦幻般的战斗"
 POD_predatorstories.1406.desc: "这个奇怪的生物已经无处可逃。  \n是时候亲自见识一下这个奇怪生物的战斗力了。希望你能从他身上造成的伤口中获取一些血液。你（和你的心兽）已经迫不及待地想要体验这一刻了。"
 POD_predatorstories_auspexadvanced.1406.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )]无处可逃。\n是时候亲眼看看这个奇怪生物的战斗力到底是什么了。希望你甚至能从你给他们造成的伤口中吸取一些血。你（和你的心兽）迫不及待地想要开始这次体验。"
 POD_predatorstories.1406.a: "我的！"
 POD_predatorstories.1406.b: "转念一想……这只是一个误会"
 POD_predatorstories.1406.a.success: "胜利了！"
 POD_predatorstories.1406.a.success.toast: "蝴蝶和彩虹……"
 POD_predatorstories.1406.a.failure: "该死的妖精！"
 POD_predatorstories.1406.a.failure.toast: "撤退！"
 POD_predatorstories.1406.b.toast: "你没有那么勇敢"
 POD_predatorstories.1410.t: "沉睡的黄金"
 POD_predatorstories.1410.desc: "当你从沉睡的凡人身上获取血液时，你必须闯入他们的房子。虽然大多数时候这只是一件平淡无奇的事，但有时也会带来一些机会，比如今晚。  \n在你受害者的房子里，恰好有一大笔黄金。如果你有意，可以轻而易举地将其据为己有。"
 POD_predatorstories.1410.a: "现在是我的了"
 POD_predatorstories.1410.b: "我不是一个普通的小偷！"
 POD_predatorstories.1420.t: "沉睡的宝藏"
 POD_predatorstories.1420.desc: "当你从沉睡的凡人身上获取血液时，你必须闯入他们的房子。虽然大多数时候这只是一件平淡无奇的事，但有时也会带来一些机会，比如今晚。  \n在你受害者的房子里，恰好有一件传家宝。如果你有意，可以轻而易举地将其据为己有。"
 POD_predatorstories.1420.a: "把他们拿走卖了"
 POD_predatorstories.1420.b: "拿去展览"
 POD_predatorstories.1420.c: "把[newly_created_artifact.GetName]拿去用"
 POD_predatorstories.1010.bloodleech.t: "怜悯猎物"
 POD_predatorstories.1140.f: "将其转为血仆并进食"
 POD_predatorstories.1300.e: "将其转为血仆"
 POD_predatorstories.1340.d: "他们可以留下一些钱，转而为我服务。"
 POD_predatorstories_kiasyd.1391.desc: "作为一名[GetTrait('kiasyd').GetName( GetNullCharacter )]让你能够判断出你选择的猎物其实是[GetTrait('redcap').GetName( GetNullCharacter )]。\n你知道红帽子很可能善于战斗，并发现看不见的东西。你也知道以妖精为食很可能会产生一些不利影响。\n你的猎物已经发现了你，做出威胁姿态。\n\n如果不跑就准备战斗。"
 POD_predatorstories_maeghar.1391.desc: "作为一名[GetTrait('maeghar').GetName( GetNullCharacter )]让你能够判断出你选择的猎物其实是[GetTrait('redcap').GetName( GetNullCharacter )]。\n你知道红帽子很可能善于战斗，并发现看不见的东西。你也知道以妖精为食很可能会产生一些不利影响。\n你的猎物已经发现了你，做出威胁姿态。\n\n如果不跑就准备战斗。"
