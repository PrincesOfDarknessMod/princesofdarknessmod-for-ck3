 POD_predatorstories_auspexadvanced.1405.t: "斯珞俄急于达成交易"
 POD_predatorstories.1405.desc: "不寻常的受害者现在显然很紧张，急于和你做交易，以提供更多金钱作为交换条件，让你放过他们。"
 POD_predatorstories_auspexadvanced.1405.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )]现在显然很紧张，急于和你做交易，他们提供了更多的金子，作为交换，希望你放过他们。"
 POD_predatorstories.1405.a: "收下那笔钱"
 POD_predatorstories.1405.b: "我想要血"
