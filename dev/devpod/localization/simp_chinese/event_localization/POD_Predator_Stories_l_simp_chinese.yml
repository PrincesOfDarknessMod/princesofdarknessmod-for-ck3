 POD_predatorstories.1130.t: "进食中猎物死亡"
 POD_predatorstories.1130.desc: "被无法置信的饥渴压倒，你杀死了猎物。"
 POD_predatorstories_conscious.1130.a: "我做了什么……"
 POD_predatorstories_conviction.1130.a: "这又怎样？"
 POD_predatorstories.1140.t: "病重的猎物"
 POD_predatorstories.1140.desc: "你的猎物看上去重病缠身，如果你在其病中取食也许会杀死他。"
 POD_predatorstories.1140.a: "放他一马"
 POD_predatorstories.1140.b: "医治他"
 POD_predatorstories.1140.c: "用魂健术治疗他"
 POD_predatorstories.1140.d: "对他不幸的是我仍然渴望饮用其鲜血"
 POD_predatorstories.1140.e: "#beast 我要求更多血液！#!"
 POD_predatorstories.1140.d.toast: "因为你的缘故他很有可能不久于世"
 POD_predatorstories.1150.t: "猎物逃跑"
 POD_predatorstories.1150.desc: "你的猎物受到惊吓并冲进小巷"
 POD_predatorstories.1150.a: "追上去！"
 POD_predatorstories.1150.b: "追上去！"
 POD_predatorstories.1150.c: "放过那恐慌的凡人"
 POD_predatorstories.1151.t: "受困的猎物"
 POD_predatorstories.1151.desc: "以你追捕的技巧该凡人根本毫无胜算。他乞求饶命，既然你已经追上了他，你打算拿他怎么办？"
 POD_predatorstories.1151.a: "放过他"
 POD_predatorstories.1151.b: "放过他"
 POD_predatorstories.1151.c: "吸食他"
 POD_predatorstories.1151.d: "吸食他"
 POD_predatorstories.1151.e: "#beast 他胆敢跑！？他的血液全是我的#!"
 POD_predatorstories.1151.a.toast: "尽管冒着破坏潜藏的风险，你展现出了仁慈"
 POD_predatorstories.1151.c.toast: "在进食后，尽管冒着破坏潜藏的风险，你展现出了仁慈"
 POD_predatorstories.1152.t: "无知的猎物"
 POD_predatorstories.1152.desc: "以你追捕与潜行的技巧该凡人根本毫无胜算。既然你已经追上了他，你打算拿他怎么办？"
 POD_predatorstories.1152.a: "吸食他"
 POD_predatorstories.1152.b: "#beast 他胆敢跑！？他的血液全是我的#!"
 POD_predatorstories.1160.t: "受害者需要金钱"
 POD_predatorstories_consensualist.1160.desc: "你的一位自愿献血者有严重的经济问题。如果你不帮助他们，他们一定会被殴打，甚至更糟。你会帮助他们吗？"
 POD_predatorstories_familias.1160.desc: "你供养的一个家庭有严重的经济问题。如果你不帮助他们，他们一定会挨打，甚至更糟。你会帮助他们吗？"
 POD_predatorstories_cultist.1160.desc: "你的一个信徒有严重的经济问题。如果你不帮助他们，他们一定会被殴打，甚至更糟。你会帮助他们吗？"
 POD_predatorstories.1160.a: "给他们金钱"
 POD_predatorstories.1160.b: "不给他们钱"
 POD_predatorstories.1160.c: "你对债权人有一定的了解"
 POD_predatorstories.1160.d: "什么债务？"
 POD_predatorstories.1160.e: "给他们一个新面孔"
 POD_predatorstories.1160.f: "与债主顺利解决问题"
 POD_predatorstories.1160.g: "债权人将流血"
 POD_predatorstories.1160.c.toast: "你帮助了他们，但你也敲诈了某人"
 POD_predatorstories.1160.d.toast: "你帮了他们，债主还欠着钱，只是他们不知道而已"
 POD_predatorstories.1160.e.toast: "你帮了他们，债主还欠着钱，只是他们将永远不会被找到"
 POD_predatorstories.1160.f.toast: "他们将努力工作，以公平的方式向所有人偿还债务"
 POD_predatorstories_consensualist.1160.g.toast: "他们不会为攻击你的自愿献血者而后悔的"
 POD_predatorstories_familias.1160.g.toast: "他们不会为攻击你选择的家庭而后悔的"
 POD_predatorstories_cultist.1160.g.toast: "他们不会为攻击你的信徒而后悔的"
 POD_predatorstories.1170.t: "业余驱魔人"
 POD_predatorstories.1170.desc: "一名你惯常取食的猎物走向你并尝试用驱魔来治疗你。你被逗乐了，直到你发现他曾向数位知道治愈方法的人提及你的名字。你掌握了名单，在谣言传开前你会如何解决这问题？"
 POD_predatorstories.1170.a: "这些谣言无伤大雅"
 POD_predatorstories.1170.b: "很遗憾他告诉的人都得死"
 POD_predatorstories.1170.c: "什麽谣言？"
 POD_predatorstories_consensualist.1180.t: "吸血鬼攻击自愿献血者"
 POD_predatorstories_familias.1180.t: "吸血鬼攻击你掠食的家庭"
 POD_predatorstories_cultist.1180.t: "吸血鬼攻击你的密教"
 POD_predatorstories_consensualist.1180.desc: "一名血族侵犯你的权威，他胆敢掠食你的一名自愿献血者。你会如何应对如此侮辱？"
 POD_predatorstories_familias.1180.desc: "一名血族侵犯你的权威，他胆敢掠食你掠食的家庭之一。你会如何应对如此侮辱？"
 POD_predatorstories_cultist.1180.desc: "一名血族侵犯你的权威，他胆敢掠食你的一名密教成员。你会如何应对如此侮辱？"
 POD_predatorstories.1180.a: "血流成河"
 POD_predatorstories_consensualist.1180.b: "他们竟敢攻击我的一个自愿献血者？！"
 POD_predatorstories_familias.1180.b: "他们竟敢攻击我供养的家庭？"
 POD_predatorstories_cultist.1180.b: "他们竟敢攻击我的一个信徒？"
 POD_predatorstories.1180.c: "我将摧毁他们的心智"
 POD_predatorstories.1180.b.success: "你击垮了他们"
 POD_predatorstories.1180.b.success.toast: "这将向他们展示你的过界"
 POD_predatorstories.1180.b.failure: "他们击败了你"
 POD_predatorstories.1180.b.failure.toast: "他们几乎宰了你！"
 POD_predatorstories.1180.c.toast: "关于反对你们的人被诅咒的谣言不胫而走"
 POD_predatorstories.1191.t: "凡人干涉"
 POD_predatorstories_alleycat.1191.desc: "在外出觅食时，你不幸被守夜巡逻队的人发现，随后被制止。“喂，是你啊，这么晚了还在外面干什么。这样吧，如果你捐点钱，我就放过你……“他们停顿了一下，清了清嗓子，“保护费”"
 POD_predatorstories_bedlamite.1191.desc: "当你在疯人院裡潜行寻找血液时，不幸的是你被一名由警卫们陪同的工作人员发现并随后出声打断了你。“他闯入院区，把他赶走。”守卫们用威胁的眼神盯著你，同时把手伸向武器把手。"
 POD_predatorstories_cauchemar.1191.desc: "在外出觅食时，你不幸被守夜巡逻队的人发现，随后被制止。“喂，是你啊，这么晚了还在外面干什么。这样吧，如果你捐点钱，我就放过你……“他们停顿了一下，清了清嗓子，“保护费”"
 POD_predatorstories_cenobite.1191.desc: "當你在修道院裡潜行尋找血液時，不幸的是你被一名由警衛们陪同的修道院居民發現並隨後出声打断了你。“他闯入修道院，请把他从圣所趕走。”守衛們用威脅的眼神盯著你，同時把手伸向武器把手。"
 POD_predatorstories_footpad.1191.desc: "在外出觅食时，你不幸被守夜巡逻队的人发现，随后被制止。“喂，是你啊，这么晚了还在外面干什么。这样吧，如果你捐点钱，我就放过你……“他们停顿了一下，清了清嗓子，“保护费”"
 POD_predatorstories_gentry.1191.desc: "在一次贵族私人活动中，一对保镖似乎认为你潜入了活动现场，因此上前挡住了你的去路。其中一名保镖开口说道：“这是贵族的私人活动，请出示你的邀请函，否则将被强行带走。”"
 POD_predatorstories_graverobber.1191.desc: "当你在墓地徘徊寻找血迹时，不幸被墓地看守人的声音发现，并在守夜人的陪同下制止了你们。“他们在这个时间闯入墓地，逮捕他们。”守夜人气势汹汹地盯着你，他们的手正伸向武器的刀柄。"
 POD_predatorstories_phlebotomist.1191.desc: "当你们在医院里徘徊寻找血液时，不幸被发现了，随后，医院的一名工作人员在警卫的陪同下制止了你们。“他们擅闯医院，把他们带走。”卫兵们气势汹汹地盯着你，他们的手正伸向武器的刀柄。"
 POD_predatorstories_siren.1191.desc: "当地的犯罪头目似乎对你们的风流韵事产生了兴趣；当你们在当地熙熙攘攘的酒馆里觅食时，一对打手的声音打断了你们：“喂，亲爱的，这间酒馆和所有在里面工作的人都是老板的财产，要么付钱，要么挨揍”。"
 POD_predatorstories_farmer.1191.desc: "你在狩猎时不幸被发现，随后被国王卫队巡逻队的声音制止。“站住，乡巴佬！你违反了我们大人制定的狩猎法。你将被处以罚款或监禁。”"
 POD_predatorstories_alleycat.1191.a: "我认识守夜人的队长"
 POD_predatorstories_bedlamite.1191.a: "很抱歉没有早点自我介绍，我是一名新来的药剂师"
 POD_predatorstories_cauchemar.1191.a: "我认识守夜人的队长"
 POD_predatorstories_cenobite.1191.a: "这都是误会，我是来品尝修道院的美酒的。"
 POD_predatorstories_footpad.1191.a: "我认识守夜人的队长"
 POD_predatorstories_gentry.1191.a: "你知道老子是谁吗？如果你不放了我，你就没工作了"
 POD_predatorstories_graverobber.1191.a: "我认识守夜人的队长"
 POD_predatorstories_phlebotomist.1191.a: "很抱歉没有早点自我介绍，我是一名新来的药剂师"
 POD_predatorstories_siren.1191.a: "我是一个受人尊敬的公民，可以给你的老板带来很多麻烦"
 POD_predatorstories_farmer.1191.a: "我和领主大人是好朋友，我在他们的庇护下打猎"
 POD_predatorstories.1191.b: "杀出一条路"
 POD_predatorstories.1191.b.success: "你击败了他们"
 POD_predatorstories.1191.b.success.toast: "你成功突破了凡人的阻拦，毫发无伤"
 POD_predatorstories.1191.b.failure: "他们打败了你"
 POD_predatorstories.1191.b.failure.toast: "你被凡人打伤，但你成功逃脱了"
 POD_predatorstories.1191.c: "等等，我可以付钱让你睁一只眼闭一只眼"
 POD_predatorstories.1191.d: "放松，这里什么事都没有，我这就走"
 POD_predatorstories.1191.e: "用幻象分散他们的注意力，这样你就能逃脱了"
 POD_predatorstories.1192.t: "隐身大师"
 POD_predatorstories.1192.desc: "无论是通过隐蔽的方式还是利用他人的身份，你都已做好准备，随时可以狩猎。"
 POD_predatorstories.1192.a: "饮血"
 POD_predatorstories.1192.b: "喝干他们的血"
 POD_predatorstories.1193.t: "多余的关注"
 POD_predatorstories_alleycat.1193.desc: "你在狩猎时不幸被守夜巡逻队发现。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_bedlamite.1193.desc: "当你在疯人院中徘徊觅血时，不幸被带着卫兵的一名工作人员发现。卫兵们认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_cauchemar.1193.desc: "你在狩猎时不幸被守夜巡逻队发现。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_cenobite.1193.desc: "当你在修道院徘徊觅血时，不幸被带着卫兵的修道院居民发现。卫兵们认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_footpad.1193.desc: "你在狩猎时不幸被守夜巡逻队发现。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_graverobber.1193.desc: "当你在墓地徘徊寻找鲜血时，不幸被墓地看守人发现了，他们还带来了守夜人。守夜人认为你是怪物，或者是野兽，于是开始攻击你。"
 POD_predatorstories_farmer.1193.desc: "你在狩猎时不幸被国王卫队巡逻队发现。国王卫队认为你是怪物，或者是野兽，于是向你发起攻击。"
 POD_predatorstories_invalid_feeding_type.1193.desc: "该掠食者类型对你不可用。你的容貌不准许你使用这方式进行掠食（你可能是石像鬼或诺斯费拉图）"
 POD_predatorstories.1193.a: "杀出一条路"
 POD_predatorstories.1193.a.success: "你击败了他们"
 POD_predatorstories.1193.a.success.toast: "你成功突破了凡人的阻拦，毫发无伤"
 POD_predatorstories.1193.a.failure: "他们打败了你"
 POD_predatorstories.1193.a.failure.toast: "你被凡人打伤，但你成功逃脱了"
 POD_predatorstories.1193.b: "让心兽接管一切"
 POD_predatorstories.1193.c: "用幻象分散他们的注意力，这样你就能逃脱了"
 POD_predatorstories.1200.t: "家庭成员想要一个妻子"
 POD_predatorstories.1200.desc: "你供养的一个家庭成员很想结婚。但他缺少支付嫁妆所需的金钱。"
 POD_predatorstories.1200.a: "给他们钱"
 POD_predatorstories.1200.b: "拒绝给他们钱"
 POD_predatorstories.1200.c: "你知道有谁急着结婚不需要嫁妆吗？"
 POD_predatorstories.1210.t: "把凡人的孩子当作被监护人？"
 POD_predatorstories.1210.desc: "你选择的一位家庭成员问你是否愿意接收他们的孩子为被受监护者。"
 POD_predatorstories.1210.a: "我将抚养他们"
 POD_predatorstories.1210.b: "我没有时间"
 POD_predatorstories.1220.t: "凡人想治好你的病"
 POD_predatorstories_consensualist.1220.desc: "你的一个自愿献血者相信他们获得的圣水可以治愈你的吸血鬼诅咒，你愿意喝吗？"
 POD_predatorstories_familias.1220.desc: "你的一个自愿献血者相信他们获得的圣水可以治愈你的吸血鬼诅咒，你愿意喝吗？"
 POD_predatorstories_cultist.1220.desc: "你的一个自愿献血者相信他们获得的圣水可以治愈你的吸血鬼诅咒，你愿意喝吗？"
 POD_predatorstories.1220.a: "喝了它"
 POD_predatorstories.1220.b: "不喝它"
 POD_predatorstories.1220.a.success.toast: "只是水而已，你还是个吸血鬼"
 POD_predatorstories.1220.a.failure.toast: "那是真正的圣水，你仍是一个痛苦不堪的吸血鬼"
 POD_predatorstories.1230.t: "凡人需要更多的说服力"
 POD_predatorstories.1230.desc: "凡人对给你提供他们的血液心存顾虑。也许你能说服他们？"
 POD_predatorstories.1230.a: "尊重他们的意愿"
 POD_predatorstories.1230.b: "做个交易"
 POD_predatorstories.1230.c: "做个不错的交易"
 POD_predatorstories.1230.d: "为他们改变想法"
 POD_predatorstories.1230.e: "用魅力让他们改变主意"
 POD_predatorstories.1240.t: "凡人的预言"
 POD_predatorstories.1240.desc: "火焚末日临近"
 POD_predatorstories.1240.a: "我没搞懂"
 POD_predatorstories.1240.b: "我懂了"
 POD_predatorstories.1240.a.toast: "你不理解预言，不知道预言会让你烦恼"
 POD_predatorstories.1240.b.toast: "你理解了预言"
 POD_predatorstories.1250.t: "受害者是一位真信者"
 POD_predatorstories.1250.desc: "当你正准备喝下受害者的血时，你的感官被受害者真信的灼烧感袭击了。你痛苦地后退，用威仪术提醒受害者你的存在，你打算怎么办？"
 POD_predatorstories.1250.a: "杀了他们"
 POD_predatorstories.1250.b: "逃"
 POD_predatorstories.1250.c: "他们不会谈论这个"
 POD_predatorstories.1260.t: "蛰眠中的吸血鬼"
 POD_predatorstories.1260.desc: "你唤醒了一位蛰眠中的吸血鬼。你该怎么处理这事？"
 POD_predatorstories.1260.a: "尝试和平解决"
 POD_predatorstories.1260.b: "与他们战斗"
 POD_predatorstories.1260.c: "快逃"
 POD_predatorstories.1260.a.success: "你化解了局面"
 POD_predatorstories.1260.a.success.toast: "他们加入了你的宫廷"
 POD_predatorstories.1260.a.failure: "你未能化解局势"
 POD_predatorstories.1260.a.failure.tooltip: "言语无法表达的地方……只能靠獠牙来说话"
 POD_predatorstories.1260.b.success: "你击败了他们"
 POD_predatorstories.1260.b.success.toast: "他们不如你强大"
 POD_predatorstories.1260.b.failure: "他们击败了你"
 POD_predatorstories.1260.b.failure.toast: "你需要更谨慎地选择你的战斗，他们差点杀了你！"
 POD_predatorstories.1261.t: "事态升级"
 POD_predatorstories.1261.desc: "你的话进一步激怒了他们，准备战斗吧。"
 POD_predatorstories.1261.a: "战斗"
 POD_predatorstories.1261.a.success: "你击败了他们"
 POD_predatorstories.1261.a.success.toast: "在言语无法奏效的地方，獠牙占了上风"
 POD_predatorstories.1261.a.failure: "他们击败了你"
 POD_predatorstories.1261.a.failure.toast: "他们几乎杀了你！"
 POD_predatorstories.1270.t: "礼仪失误"
 POD_predatorstories.1270.desc: "也许是跟不上时代，也许是年少轻狂……但你在贵族聚会上似乎犯了一个最令人难堪的礼仪错误。"
 POD_predatorstories.1270.a: "我感觉非常羞耻"
 POD_predatorstories.1270.b: "我相信我能从这次失败中挽回一些声誉"
 POD_predatorstories.1270.c: "这不是一个错误"
 POD_predatorstories.1270.a.toast: "他们需要很长时间才能忘记这件事"
 POD_predatorstories.1270.b.toast: "情况可能会更糟……"
 POD_predatorstories.1270.c.toast: "他们不再认为这是礼仪上的错误"
 POD_predatorstories.1280.t: "独家活动邀请函"
 POD_predatorstories.1280.desc: "你被邀请参加一个凡人的专属活动"
 POD_predatorstories.1280.a: "这将是我的荣幸"
 POD_predatorstories.1280.b: "我拒绝了，其他事情需要我注意"
 POD_predatorstories.1290.t: "神性质疑"
 POD_predatorstories.1290.desc: "你的一些崇拜者对你是否真的神圣产生了怀疑。"
 POD_predatorstories.1290.a: "我是神圣的，我发誓！"
 POD_predatorstories.1290.b: "我的威仪术是神圣的"
 POD_predatorstories.1290.c: "我是神圣的"
 POD_predatorstories.1290.a.toast: "怀疑者离开了你的密教"
 POD_predatorstories.1290.b.toast: "现在大家对你的神性都确信了，事情也就解决了"
 POD_predatorstories.1290.c.toast: "所有人都向你无以言表的神性鞠躬致敬"
 POD_predatorstories.1300.t: "生病的密教徒"
 POD_predatorstories.1300.desc: "你的一个崇拜者找到了你。他们恳求你用你的神力治好他们的病。其他崇拜者也围拢过来，观看你的神力发挥作用。"
 POD_predatorstories.1300.a: "你无法帮助他们"
 POD_predatorstories.1300.b: "信仰会治愈他们"
 POD_predatorstories.1300.c: "对他们进行医治"
 POD_predatorstories.1300.d: "使用魂健术来治疗他们"
 POD_predatorstories.1300.a.toast: "你无法治愈他们，会让你的追随者产生怀疑"
 POD_predatorstories.1300.b.toast: "信仰治愈的奇观有助于消除疑虑"
 POD_predatorstories.1300.c.toast: "他们感觉好多了，但你的追随者仍有一些疑虑"
 POD_predatorstories.1300.d.toast: "他们被治愈了！你的追随者相信你是真正的神"
 POD_predatorstories.1311.t: "受害者是一位娼妓"
 POD_predatorstories.1311.desc: "你的猎物竟然是位娼妓。不幸的是，其以为你是嫖客，要求你支付服务费。"
 POD_predatorstories.1311.a: "逃"
 POD_predatorstories.1311.b: "付钱"
 POD_predatorstories.1311.c: "这从来没有发生过"
 POD_predatorstories.1311.d: "#beast 这个血袋竟敢向我提要求！#!"
 POD_predatorstories.1311.a.toast: "如果你是一位凡人，你的脸颊会是鲜红的"
 POD_predatorstories.1311.b.toast: "付款后，你离开时感到相当尴尬"
 POD_predatorstories.1311.c.toast: "其对所发生的事情一无所知"
 POD_predatorstories.1311.d.toast: "只有我提出要求"
 POD_predatorstories.1312.t: "受害者是一位娼妓"
 POD_predatorstories.1312.desc: "你的猎物原来是娼妓。幸运的是，其认为你很有吸引力，并免除支付所提供服务的费用。其还会问你以后是否想再做一次？"
 POD_predatorstories.1312.a: "这只是一夜情罢了"
 POD_predatorstories.1312.b: "下次我们来点不一样的吧"
 POD_predatorstories.1312.c: "#beast 为什么要等下一次呢？#!"
 POD_predatorstories.1320.t: "稀有的猎物"
 POD_predatorstories.1320.desc: "最近，在你的领地上可供你狩猎的动物越来越少了。"
 POD_predatorstories.1320.a: "买一些"
 POD_predatorstories.1320.b: "运用你的直觉"
 POD_predatorstories.1320.c: "运用你的超前直觉"
 POD_predatorstories.1330.t: "反抗勒索"
 POD_predatorstories.1330.desc: "你的一个猎物知道了你的一个秘密。他们威胁说，如果你不放过他们，他们就会泄露秘密。"
 POD_predatorstories.1330.a: "我没有什么可隐藏的"
 POD_predatorstories.1330.b: "我们陷入了僵局"
 POD_predatorstories.1330.c: "他们不会说出去的"
 POD_predatorstories.1330.d: "#beast 其竟敢尝试勒索我？！#!"
 POD_predatorstories.1340.t: "付钱？"
 POD_predatorstories.1340.desc: "你勒索的猎物最近得到了一些钱。作为金钱的交换，他们要求你忘掉他们的秘密，放过他们。"
 POD_predatorstories.1340.a: "有钱总是好的"
 POD_predatorstories.1340.b: "我宁愿让他们用血来支付"
 POD_predatorstories.1340.c: "老子全都要、现在就要！"
 POD_predatorstories.1350.t: "猎人伏击"
 POD_predatorstories.1350.desc: "在寻找一个被勒索的凡人猎物时，你被多个手持木桩的猎人围攻"
 POD_predatorstories.1350.a: "战斗"
 POD_predatorstories.1350.b: "让心兽接管一切"
 POD_predatorstories.1350.a.success: "你击败了他们"
 POD_predatorstories.1350.a.failure: "他们击败了你"
 POD_predatorstories.1350.a.failure.toast: "干掉那些被诅咒的猎人，他们差点杀了你！"
 POD_predatorstories.1351.t: "伏击源头"
 POD_predatorstories.1351.desc: "猎人被击败后，你发现了一张纸条，上面详细描述了伏击你的地点。你认出了这张给猎人的纸条，是其中一个被勒索的凡人写的。很明显，他们想置你于死地，以摆脱勒索。你将如何处置他们？"
 POD_predatorstories.1351.a: "照常进食，但给予他们仁慈"
 POD_predatorstories.1351.b: "因外力作用而死亡"
 POD_predatorstories.1360.t: "丰富的猎物"
 POD_predatorstories.1360.desc: "最近，你领地内的猎物越来越少了"
 POD_predatorstories.1360.a: "运用你的直觉"
 POD_predatorstories.1360.b: "运用你的超前直觉"
 POD_predatorstories.1371.t: "愤怒的动物"
 POD_predatorstories.1371.desc: "动物们不喜欢吸血鬼，这只特别的公鸡已经决定不再容忍你的存在。"
 POD_predatorstories.1371.a: "就像从公鸡身上获取血液"
 POD_predatorstories.1372.t: "愤怒的动物"
 POD_predatorstories.1372.desc: "动物们不喜欢吸血鬼，而这只特殊的狼已经决定不再容忍你的存在。"
 POD_predatorstories.1372.a: "战斗"
 POD_predatorstories.1372.b: "跑啊！"
 POD_predatorstories.1372.a.success: "你击败了狼"
 POD_predatorstories.1372.a.success.toast: "你杀死了狼"
 POD_predatorstories.1372.a.failure: "你被狼击败了"
 POD_predatorstories.1372.a.failure.toast: "你受伤了，但你设法逃脱了"
 POD_predatorstories.1373.t: "愤怒的动物"
 POD_predatorstories.1373.desc: "动物们不喜欢吸血鬼，这只特别的熊已经决定不再容忍你的存在。"
 POD_predatorstories.1373.a: "战斗"
 POD_predatorstories.1373.b: "跑啊！"
 POD_predatorstories.1373.a.success: "你击败了熊"
 POD_predatorstories.1373.a.success.toast: "你杀了那只熊"
 POD_predatorstories.1373.a.failure: "你被熊击败了"
 POD_predatorstories.1373.a.failure.toast: "你受到了残酷的伤害，但你设法逃脱了"
 POD_predatorstories.1374.t: "不同寻常的兔子"
 POD_predatorstories_sensebane.1374.desc: "当你外出寻找动物猎物时，偶然发现了一只兔子。然而，这只兔子有些不同寻常。它似乎被鲜血和尸体包围着，并注意到了你。由于你具有侦测光环或侦测邪恶的高级能力，你知道这只兔子是被忌灵附身了。"
 POD_predatorstories.1374.desc: "当你外出寻找动物猎物时，偶然发现了一只兔子。然而，这只……兔子有些不寻常，它似乎被鲜血和尸体包围着，并注意到了你。"
 POD_predatorstories.1374.a: "我要它的血"
 POD_predatorstories.1374.b: "这里好像有什么东西……我应该逃走"
 POD_predatorstories.1374.c: "我将以圣洁的热情消灭邪灵"
 POD_predatorstories.1374.c.toast: "兔子的邪灵被移除了，你可以安心进食了"
 POD_predatorstories.1375.t: "不同寻常的兔子战斗"
 POD_predatorstories.1375.desc: "兔子正朝你猛扑过来，一排排匕首般的牙齿现在清晰得可怕。"
 POD_predatorstories.1375.a: "战斗"
 POD_predatorstories.1375.a.success: "你击败了兔子"
 POD_predatorstories.1375.a.success.toast: "你杀了兔子"
 POD_predatorstories.1375.a.failure: "你击败了兔子"
 POD_predatorstories.1375.a.failure.toast: "你受到了残酷的伤害，但你设法逃脱了"
 POD_predatorstories.1380.t: "牺牲者需要金钱"
 POD_predatorstories_consensualist.1380.desc: "你的一个自愿献血者需要金钱才能购买牛。如果他们不尽快得到新的牲畜，他们肯定会遭受痛苦，甚至死亡。"
 POD_predatorstories_familias.1380.desc: "你被选中的一位家庭成员需要金钱来购买牛。如果他们不能尽快买到新的牛，他们肯定会受苦受难，甚至死亡。"
 POD_predatorstories_cultist.1380.desc: "你的一位信徒需要金钱来购买牛。如果他们不能尽快买到新的牛，他们肯定会受苦受难，甚至死亡。"
 POD_predatorstories.1380.a: "给他们钱"
 POD_predatorstories.1380.b: "不给他们钱"
 POD_predatorstories.1380.c: "召唤动物到你的牺牲者身边"
 POD_predatorstories.1390.t: "合适的受害者"
 POD_predatorstories_auspexadvanced.1390.t: "受害者是一个红帽子"
 POD_predatorstories.1390.desc: "在觅血的过程中，你发现了一个合适的猎物。"
 POD_predatorstories_auspexadvanced.1390.desc: "你敏锐的观察力让你能够判断出你选择的猎物其实是[GetTrait('redcap').GetName( GetNullCharacter )]，而不是吸血鬼。\n\n你知道红帽子很可能善于战斗，并发现看不见的东西。你也知道以妖精为食很可能会产生一些不利影响。"
 POD_predatorstories.1390.a: "你向受害者前进"
 POD_predatorstories.1390.b: "也许我应该去找其他猎物……"
 POD_predatorstories.1391.t: "不同寻常的受害者"
 POD_predatorstories_auspexadvanced.1391.t: "红帽子受害者"
 POD_predatorstories.1391.desc: "现在你离受害者更近了，你注意到受害者的外表很不寻常，但你来不及处理，因为猎物已经发现了你，做出威胁姿态。\n\n如果不跑就准备战斗。"
 POD_predatorstories_auspexadvanced.1391.desc: "现在你离得更近了，你的猎物已经发现了你，做出威胁姿态。\n\n如果不跑就准备战斗。"
 POD_predatorstories.1391.a: "战斗"
 POD_predatorstories.1391.b: "有点不对劲，快跑！"
 POD_predatorstories_auspexadvanced.1391.b: "转念一想，与[GetTrait('redcap').GetName( GetNullCharacter )]战斗可能是个坏主意，快跑！"
 POD_predatorstories.1391.a.success: "你击败了他们"
 POD_predatorstories.1391.a.success.toast: "他们不如你强大"
 POD_predatorstories.1391.a.failure: "他们击败了你"
 POD_predatorstories.1391.a.failure.toast: "你需要更谨慎地选择你的战斗，他们差点杀了你！"
 POD_predatorstories.1391.b.toast: "你太勇敢了……"
 POD_predatorstories.1401.t: "附近有猎物吗？"
 POD_predatorstories.1401.desc: "你想了一会儿，觉得自己看到了什么，也许附近有一只吸血鬼猎物正在使用混淆术躲藏。"
