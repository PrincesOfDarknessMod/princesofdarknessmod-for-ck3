 POD_predatorstories.1403.t: "受害者发现了你"
 POD_predatorstories_auspexadvanced.1403.t: "斯珞俄发现了你"
 POD_predatorstories.1403.desc: "现在你离他们更近了，你注意到受害者的外表对于吸血鬼来说很不寻常。\n\n受害者吓得跳了起来，请求你放过他们，以换取一些金币。"
 POD_predatorstories_auspexadvanced.1403.desc: "[GetTrait('sluagh').GetName( GetNullCharacter )]吓了一跳，连忙请求您放过他们，以换取一些金钱。"
 POD_predatorstories.1403.a: "接受这笔钱"
 POD_predatorstories.1403.b: "拒绝，这不够，得加钱"
