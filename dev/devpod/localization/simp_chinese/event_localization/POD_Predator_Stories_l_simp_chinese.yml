 vampire_attacks_on_domain_modifier: "领地被吸血鬼袭击"
 weak_fae_curse_modifier: "弱妖精诅咒"
 strong_fae_curse_modifier: "强妖精诅咒"
 drunkard_intoxicated_modifier: "感觉很好"
 intoxicated_modifier: "感觉飘飘然"
 POD_predatorstories.1090.desc: "今晚对你来说是一个平静的狩猎之夜，除了一件小事。你的受害者身上有惊人的大量金钱。从他们手中夺走它是儿戏，但你，一个强大的血族，真的开始诉诸于普通的偷窃吗？"
 POD_predatorstories.1100.desc: "今晚对你来说是一个平静的狩猎之夜，除了一件小事。你的受害者身上有一件非常昂贵的饰品。从他们手中夺走它是儿戏，但你，一个强大的血族，真的开始诉诸于普通的偷窃吗？"
 POD_predatorstories.1110.desc: "一段时间以来，你一直在培养那些符合你进食口味偏好的凡人。他们中的大多数人现在都很着迷，要么把你看作是一个讨人喜欢的赞助者，要么甚至把你看作一个神一般的人物。最近，他们中的一个人送给你一份礼物，希望用这份卑微的礼物来取悦你。"
 POD_predatorstories.1180.t: "保护你的牧群"
 POD_predatorstories.1180.desc: "大多数吸血鬼尊重你的权威，知道你的[POD_herd|E]是你的禁脔。然而，“大多数”并不意味着全部。最近，有一个这样的混蛋，要么想反抗你，要么是愚蠢，从你的凡人身上取了血。必须杀鸡儆猴。"
 POD_predatorstories.1180.b: "他们怎么敢！"
 POD_predatorstories.1220.desc: "你的一个[POD_herd|E]成员向你提出了一个奇怪的建议。他们买了一种药水，他们认为可以治好你的吸血鬼病。这个想法显然是荒谬的，但他们似乎为自己获得了这样一种“奇迹疗法”而感到自豪。也许你可以幽默他们一下。"
 POD_predatorstories.1380.desc: "当你从那些了解你本性（至少部分）的人那里取得血液时，他们已经把你看作是他们家的潜在的赞助者，以换取他们的血液。这会导致各种各样的帮助请求，这些请求可能会变得令人厌烦，但可以确保你的[POD_herd|E]在未来的繁荣。一个这样的请求已经出现，虽然你不想记住具体细节，但他们需要金钱来进行一些耕作。"
 POD_predatorstories.1430.t: "血腥宿醉"
 POD_predatorstories.1430.desc: "吸血鬼在吸食凡人的血液时，往往会受到凡人身体状况的影响。虽然疾病之类的问题与该隐的孩子们无关，但血液中混有各种物质，对吸血的吸血鬼来说可能是一种……奇妙的经历。\n今晚，当你准备进食时，你的受害者突然嘀咕起螃蟹来。\n这可能是一次相当不错的体验"
 POD_predatorstories_auspex.1430.desc: "吸血鬼在吸食凡人的血液时，往往会受到凡人身体状况的影响。虽然疾病之类的问题与该隐之子们无关，但血液中混有各种物质，对吸血的吸血鬼来说可能是一种……奇妙的经历。\n今晚，当你准备进食时，你的受害者突然嘀咕起螃蟹来。\n\n不过，由于你的观占术律能，你可以确定他们已经完全昏迷了。他们的血液中含有一些物质，如果你进食的话，这些物质可能会对你产生一定的影响。"
 POD_predatorstories.1430.a: "啊……就一点点"
 POD_predatorstories.1430.b: "我血醉了！"
 POD_predatorstories.1430.c: "最好不要。"