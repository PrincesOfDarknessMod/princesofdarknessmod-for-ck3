 POD_predatorstories.1110.t: "献礼"
 POD_predatorstories_cultist.1110.desc: "你的一名密教徒献上财富作为礼物。"
 POD_predatorstories_gentry.1110.desc: "一名士绅向你献上财富作为礼物。"
