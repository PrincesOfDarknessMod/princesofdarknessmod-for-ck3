 POD_predatorstories.1061.a.failure: "他打败你"
 POD_predatorstories.1061.a.failure.toast: "降灾给受诅的猎人，他差点就杀了你！"
 POD_predatorstories.1070.t: "吸血鬼盗猎者"
 POD_predatorstories.1070.desc: "在你狩猎的时候，你遇到了另一位在你地盘上盗猎的血族。"
 POD_predatorstories.1070.a: "给他点教训"
 POD_predatorstories.1070.b: "你的地盘有足够多的血液"
 POD_predatorstories.1070.a.success: "你打败他"
 POD_predatorstories.1070.a.success.toast: "这样足够让他知道厉害了"
