 POD_predatorstories.1030.a.failure: "你未能缓和局面"
 POD_predatorstories.1030.a.failure.tooltip: "言语不管用的时候……就用獠牙来交际"
 POD_predatorstories.1030.b.success: "你打败他"
 POD_predatorstories.1030.b.success.toast: "他比不上你的力量"
 POD_predatorstories.1030.b.failure: "他打败你"
 POD_predatorstories.1030.b.failure.toast: "你挑对象该更谨慎，他差点就杀了你！"
 POD_predatorstories.1031.t: "局势升级"
 POD_predatorstories.1031.desc: "你的言语只更加激怒他，准备战斗。"
 POD_predatorstories.1031.a: "战斗"
 POD_predatorstories.1031.a.success: "你打败他"
 POD_predatorstories.1031.a.success.toast: "言语不到之处，獠牙为胜"
 POD_predatorstories.1031.a.failure: "他打败你"
 POD_predatorstories.1031.a.failure.toast: "他差点就杀了你！"
 POD_predatorstories.1040.t: "凡人目击进食"
 POD_predatorstories.1040.desc: "在进食时，你刚好眼角余光瞥见一名惊恐的凡人。他似乎目击了你的进食过程。"
 POD_predatorstories.1040.a: "无视他"
 POD_predatorstories.1040.b: "无视他"
 POD_predatorstories.1040.c: "#beast 死人不会泄密#!"
 POD_predatorstories.1040.d: "如果我进食时被目击到，我会知道的"
 POD_predatorstories.1040.d.tooltip: "结果原来是他没缴税又看见了当地收税员"
 POD_predatorstories.1040.e: "他不会泄密"
 POD_predatorstories.1040.e.tooltip: "就像是他什么也没看到"
 POD_predatorstories.1040.a.toast: "你的独特外表给该名凡人留下深刻印象"
 POD_predatorstories.1040.b.toast: "你给该名凡人留下深刻印象"
 POD_predatorstories.1050.t: "凡人孩童目击进食"
 POD_predatorstories.1050.desc: "在进食时，你刚好眼角余光瞥见一名惊恐的孩童。他似乎目击了你的进食过程。"
 POD_predatorstories.1050.a: "无视他"
 POD_predatorstories.1050.b: "无视他"
 POD_predatorstories.1050.c: "#beast 床底下的怪物可不是假的#!"
 POD_predatorstories.1050.d: "如果我进食时被目击到，我会知道的"
 POD_predatorstories.1050.d.tooltip: "结果原来是他违反了宵禁又看到父母"
 POD_predatorstories.1050.e: "他不会泄密"
 POD_predatorstories.1050.e.tooltip: "就像是他什么也没看到"
 POD_predatorstories.1050.a.toast: "没有多少人会相信孩童看见床底下的怪物"
 POD_predatorstories.1050.b.toast: "我想知道他会向父母说什么？"
 POD_predatorstories.1060.t: "猎人干涉"
 POD_predatorstories.1060.desc: "猎人锲而不舍地猎杀吸血鬼，在你猎食时他们会发现你吗？"
 POD_predatorstories.1060.a: "你试着避开他们并获取猎物"
 POD_predatorstories.1060.a.tooltip: "诡秘如影并获取猎物"
 POD_predatorstories.1060.b: "放弃掠食"
 POD_predatorstories.1060.a.success: "他什么也没看见"
 POD_predatorstories.1060.a.success.toast: "死之静默"
 POD_predatorstories.1060.a.failure: "他发现你了！"
 POD_predatorstories.1060.a.failure.tooltip: "潜行不管用的时候……獠牙派上用场"
 POD_predatorstories.1060.a.failure.success.toast: "你打败猎人但猎物却逃走了"
 POD_predatorstories.1060.a.failure.failure.toast: "他差点就杀了你！"
 POD_predatorstories.1061.t: "猎人发现你了"
 POD_predatorstories.1061.desc: "正当你准备下口时，猎人发现你并开始进攻！准备战斗。"
 POD_predatorstories.1061.a: "战斗"
 POD_predatorstories.1061.a.success: "你打败他"
