l_simp_chinese:
 nick_scourge_of_sutekh: "赛特天罚"
 podnagaraja_send_childe_to_enoch_interaction: "送去以诺城"
 podnagaraja_send_childe_to_enoch_interaction_desc: "派这名那伽罗阇家族成员前往位于冥界的以诺鬼城单向旅程，他将在尸幕彼端为我们氏族的利益服务。"
 send_childe_to_enoch_effect_tooltip: "你的子嗣将前往冥界，永不归来。你将获得增益修正及宗族威望。"
 send_childe_to_enoch_not_primary_heir: "不能派你的第一继承人前往以诺城"
 podnagaraja.1.t: "涤除蛇类"
 podnagaraja.1.desc: "完成了。最后的底提耶及其赛特之子亲属已被逐出印度宫廷和吐蕃高原。苏泰赫的子嗣再也无法在次大陆统治者的耳边低语谎言。那伽罗阇的新时代已经到来，我们将成为祖先故土上无可争议的夜之主宰。"
 podnagaraja.1.a: "让世人世世代代传颂这场胜利。"
 podnagaraja.2.desc: "你得到消息，那伽罗阇统治者已经清扫赛特之子和底提耶从印度到吐蕃的影响力。该地区的势力平衡发生了巨大变化。"
 podnagaraja.2.a: "夜之世界改变了。"
 podnagaraja.10.t: "分开尸幕"
 podnagaraja.10.desc: "仪式已毕，准备就绪。当尸幕在你面前如冷雾般分开，冥界张开血盆大口。空气中弥漫着低语，温度骤降至冰冷的极致。通往以诺城的道路险象环生，难以捉摸，充满了连那伽罗阇都畏惧的事物。"
 podnagaraja.10.a: "开始下降。"
 podnagaraja.10.a.tt: "你前往冥界的朝圣开始......"
 podnagaraja.12.t: "进入幽土"
 podnagaraja.12.desc: "[UmbraGlossary('shadowlands')]是一片灰色的景象──你离开的世界的镜像，充满着不眠者和更可怕的东西。生者世界与更深邃的冥界之间的界线在这里变得模糊不清。你的那伽罗阇之血认同地回响着。"
 podnagaraja.12.a: "专心在路径上。"
 podnagaraja.12.b: "开启我感应死者的感官。"
 podnagaraja.12.b.success: "你的感官延伸，死者低语着有用的事实。"
 podnagaraja.12.b.failure: "一阵强烈的鬼灵感官冲击瞬间将你淹没"
 podnagaraja.13.t: "大风暴"
 podnagaraja.13.desc: "在[UmbraGlossary('shadowlands')]及冥界更深界域之间的是[UmbraGlossary('tempest')]—死灵能量的狂啸死涡，已经吞噬了数不尽的灵魂。受诅者的尖叫随风冲击你。有一些方法能通过，但没一个是愉悦的。"
 podnagaraja.13.a: "用血律通过。"
 podnagaraja.13.a.success: "你奋力穿越风暴最猛烈的部分。"
 podnagaraja.13.a.failure: "大风暴无情地猛击你。"
 podnagaraja.13.b: "用亡灵术平息死者狂风。"
 podnagaraja.13.b.tt: "高阶亡灵术保证成功。"
 podnagaraja.13.b.success: "你对亡灵的掌控平息了你周围的风暴。"
 podnagaraja.13.b.failure: "你的亡灵术知识不足以平息大风暴。"
 podnagaraja.13.c: "待其平息以通过。"
 podnagaraja.14.t: "溺殁者的低语"
 podnagaraja.14.desc: "在你感知的极限能感觉到幽灵聚集，被你偷来的生命力的温暖所吸引。祂们是几个世纪以来被那伽罗阇吞噬的亡灵，记得祂们所遭受的一切。祂们提供知识、警告和谎言。但你根本无法从中分辨。"
 podnagaraja.14.a: "命其指引我。"
 podnagaraja.14.a.success: "鬼灵屈服你的意志并揭示出有用的路径。"
 podnagaraja.14.a.failure: "鬼灵怀着怨恨抵抗你的命令。"
 podnagaraja.14.b: "无视他们继续前行。"
 podnagaraja.14.c: "为力量吞噬其灵质。"
 podnagaraja.14.c.tt: "用鬼灵精华满足你的饥渴。"
 podnagaraja.15.t: "伪之鬼城"
 podnagaraja.15.desc: "一座宏伟的城市自幽界的迷雾中拔地而起——高塔、城墙与城门，古老得近乎不可思议。有那么一瞬间，你的血液因认知而沸腾。以诺城？不。有什么地方不对。其比例存在着细微却明确的偏差，整体建筑虽然逼真，却终究只是精心伪造的赝品。这是陷阱，用来诱捕那些不识真正圣城的朝圣者。"
 podnagaraja.15.a: "小心调查，也许有些有用的残骸。"
 podnagaraja.15.a.success: "在残骸中，你找到一本由之前朝圣者留下的日志。"
 podnagaraja.15.a.failure: "伪城的防卫攻你不备"
 podnagaraja.15.b: "远远避开。"
 podnagaraja.15.c: "摧毁它，以免其他那伽罗阇上当。"
 podnagaraja.16.t: "鬼灵异常"
 podnagaraja.16.desc: "前方道路被一股原始的冥界能量阻挡──一股翻腾的鬼灵力量漩涡，扭曲着周围幽土的结构。亡者避之不及。就连死灵也对它敬而远之。"
 podnagaraja.16.a: "穿过去。"
 podnagaraja.16.a.success: "这股能量冲刷你，但让你更强大。"
 podnagaraja.16.a.failure: "异变撕裂你的本质。"
 podnagaraja.16.b: "绕过去。"
 podnagaraja.16.c: "从安全距离研究异变。"
 podnagaraja.16.c.success: "你累积了对冥界本质的认识"
 podnagaraja.16.c.failure: "此异变难以理解"
 podnagaraja.17.t: "死灵市集"
 podnagaraja.17.desc: "一群死灵聚集在大风暴的间隙进行交易。他们交易记忆、悔恨和生者世界的碎片。有些死灵早在罗马陷落之前就已在此栖身。他们用恐惧与饥渴交织的目光注视着你——那伽罗阇的名声在死灵之中很出名。"
 podnagaraja.17.a: "用黄金换取智慧。"
 podnagaraja.17.b: "吞噬其中一员。"
 podnagaraja.17.b.tt: "满足你的饥渴，但亡者们会记住。"
 podnagaraja.17.c: "无视他们继续前行。"
 podnagaraja.18.t: "丝路残响"
 podnagaraja.18.desc: "这条路穿过一座被摧毁的丝路城市的残响。幽灵商贩们仍在无尽的循环中兜售货物，浑然不知他们和其城市早在几个世纪前就已消逝。建筑闪烁着褪色的辉煌，在废墟深处，某种古老的东西正等待着。"
 podnagaraja.18.a: "搜寻废墟寻找被隐藏的知识。"
 podnagaraja.18.a.success: "你在鬼灵废墟中发现被遗忘的知识"
 podnagaraja.18.a.failure: "废墟中除了尘土与失望，什么都没有"
 podnagaraja.18.b: "调查这些幽灵居民。"
 podnagaraja.18.b.success: "鬼魂分享早已被遗忘的王朝的记忆"
 podnagaraja.18.b.failure: "鬼魂因你的出现而退缩"
 podnagaraja.18.c: "纪录所见并继续前进。"
 podnagaraja.19.t: "旅伴"
 podnagaraja.19.desc: "一道身影自幽界迷雾中浮现——另一位那伽罗阇，肩负着塔尔玛埃拉的使命，自以诺城归来。她形容枯槁，双眼因漫长旅途而深陷空洞；然而，她的举止间流露出一种沉静而笃定的自信——那是唯有真正从冥界深处生还者才会拥有的气度。她表示愿意分享自己所搜集到的情报。"
 podnagaraja.19.a: "自由交流知识—我们是亲族。"
 podnagaraja.19.a.tt: "有点微小风险，她可能并非表面看起来那样"
 podnagaraja.19.b: "交易情报。"
 podnagaraja.19.b.success: "公平的交易，你学到有价值的东西"
 podnagaraja.19.b.failure: "她没给你什么有用的东西"
 podnagaraja.19.c: "拒绝她的陪伴—独自旅行。"
 podnagaraja.19.d: "她看上去很饥饿—向她分享内脏补给品。"
 podnagaraja.19.d.tt: "你的慷慨将被氏族记住"
 podnagaraja.20.t: "以诺城的大门"
 podnagaraja.20.desc: "在你面前矗立的，是以诺城那古老得近乎不可思議的城門。第一城如今已失卻昔日榮光，僅剩冥界深處的一座殘影。空氣中震顫著一股比有文字記載的歷史更為古老的力量。在這裡，生與死的界線、知識與瘋狂的分野，皆逐漸消融。你正站在那伽罗阇一族所知最偉大的奧秘門檻之前。暗影之中，德尔罗的僕從正靜靜注視著你，衡量你是否配得上踏入此地。"
 podnagaraja.20.a: "进入并向德尔罗致敬。"
 podnagaraja.20.a.tt: "你将获得以诺城朝圣者特质、威望及宗族威望"
 podnagaraja.20.b: "进入并在布鲁赫图书馆学习。"
 podnagaraja.20.c: "留在以诺城服侍。"
 podnagaraja.20.c.tt: "你将陷入蛰眠，获得以诺城朝圣者特质及大量宗族威望"
 podnagaraja.21.t: "阴影中的背叛"
 podnagaraja.21.desc: "出事了。你与那位旅伴分享的情报出现在了不该出现的地方。要么她并非她自称的那个人，要么她把你的秘密出卖给了其他人。损害可能已经造成了。"
 podnagaraja.21.a: "调查背叛"
 podnagaraja.21.a.success: "在真正损害发生之前，你就识破了欺骗"
 podnagaraja.21.a.failure: "你的秘密已经泄露，损害已发生"
 podnagaraja.21.b: "随它去—有些资讯是可有可无的。"
 podnagaraja.100.t: "事前准备"
 podnagaraja.100.desc: "沉默密会需要谨慎的准备工作。信息必须通过其他血族无法追踪的渠道传递，仪式材料须从[UmbraGlossaryLocalized('shadowlands','冥界')]收集，还要确保举行地点的安全。这些工作令人厌烦却有必要。"
 podnagaraja.100.a: "开始事前准备。"
 podnagaraja.100.a.tt: "密会将在一月内召开"
 podnagaraja.101.t: "密会召开"
 podnagaraja.101.desc: "与会者接连入场，从阴影中现身，穿过尸幕而来。你的那伽罗阇同伴每人都带着自己领域的秘密与知识而来。沉默密会已召开，问题在于：会议重心应该是？"
 podnagaraja.101.a: "重心在阴谋和防御手段。"
 podnagaraja.101.a.tt: "密会将讨论防御手段及诡计"
 podnagaraja.101.b: "重心在亡灵学研究与仪式。"
 podnagaraja.101.b.tt: "密会将探索更深的死亡奥秘"
 podnagaraja.102.t: "祭品"
 podnagaraja.102.desc: "每一场沉默密会的核心，皆在祭品——一项唤用那伽罗阇与冥界独特联系的仪式。血肉必须被献上，以作为仪式运转的薪柴；此乃吾族之道。"
 podnagaraja.102.a: "慷慨大方的祭品。"
 podnagaraja.102.b: "象征性的祭品。"
 podnagaraja.103.t: "发现"
 podnagaraja.103.desc: "这次密会引起了注意。有人——无论是凡人还是其他存在注意到了这次聚会，并且可能目睹了一些本应隐藏的事情。必须在潜藏进一步破露之前处理掉这些证据。"
 podnagaraja.103.a: "付钱掩盖我们的踪迹。"
 podnagaraja.103.a.tt: "花费金钱来消灭证据"
 podnagaraja.103.b: "四下分散，希望不会出事。"
 podnagaraja.200.t: "异塔拉贾那修习者"
 podnagaraja.200.desc: "你搜寻异塔拉贾那术士的消息已经有结果了。一位古印度血术法传统的修习者被带到你面前。[new_sorcerer.GetHerHis|U]身怀的本土特有次大陆神秘知识可能非常有价值。"
 podnagaraja.200.a: "欢迎[new_sorcerer.GetHerHim]加入我们的事业。"
 podnagaraja.200.a.tt: "[new_sorcerer.GetShortUIName|U]将被血缚为你[ghoul|E]的并加入宫廷"
 podnagaraja.201.t: "术士研究"
 podnagaraja.201.desc: "你的异塔拉贾那术士[sorcerer.GetFirstName]一直在宫廷研究，深入探究印度神秘主义与亡灵术的交汇。[sorcerer.GetSheHe|U]带着[sorcerer.GetHerHis]发现来见你。"
 podnagaraja.201.a: "鼓励[sorcerer.GetHerHis]继续研究。"
 podnagaraja.201.b: "利用[sorcerer.GetHerHis]的知识立即获利。"
 podnagaraja.300.t: "无归之旅"
 podnagaraja.300.desc: "你站在你的子嗣—[recipient.GetFirstNameNoTooltip]面前，准备送其前去执行最庄严的任务—以诺鬼城的单向朝圣之旅。他将在尸幕彼端为氏族的利益服务，维持着生者所不能的联系。"
 podnagaraja.300.a: "去彼方世界为氏族服务吧。"
 podnagaraja.300.a.tt: "[recipient.GetFirstNameNoTooltip]将前往冥界，永不回归。你将得到威望并为你的家族带来荣耀。"
 podnagaraja.300.b: "我改变心意了。"
 podnagaraja.300.b.tt: "[recipient.GetFirstNameNoTooltip]留在你的宫廷"
 podnagaraja.400.t: "食肉者的风险"
 podnagaraja.400.desc: "饥饿正在啃噬着你。这并非折磨那些低等吸血鬼的单纯渴血，而是更深沉、更可怖的欲求——那种界定了那伽罗阇本质的诅咒：对鲜活血肉的需求。这份诅咒必须得到满足。而你压抑得越久，最终进食之时所引发的危险便越加难以控制。"
 podnagaraja.400.a: "谨慎进食，精准地跟踪猎物。"
 podnagaraja.400.b: "不顾一切进食，彻底满足饥饿感。"
 podnagaraja.400.b.tt: "你进食的迹证有被发现的风险。"
 podnagaraja.400.c: "吃我的血仆。"
 podnagaraja.400.c.tt: "安全，但你的血仆可不会喜欢"
 podnagaraja.400.d: "借纯粹意志忍耐饥渴。"
 podnagaraja.401.t: "迹证被发现"
 podnagaraja.401.desc: "你肆意进食的痕迹已经留下。有人发现了证据──或许是遗骸，或许是目击证人，或许是更糟的情况。这些证据有可能将你怪物本性揭露给那些不该知晓的人。"
 podnagaraja.401.a: "付钱销毁证据。"
 podnagaraja.401.a.tt: "花钱让问题消失"
 podnagaraja.401.b: "无视它。"
 podnagaraja.401.c: "嫁祸给别人。"
 podnagaraja.401.c.success: "你成功地嫁祸了别人"
 podnagaraja.401.c.failure: "你嫁祸他人的企图失败了"
 purge_serpent_india_decision: "清除印度毒蛇"
 purge_serpent_india_decision_tooltip: "将印度和吐蕃王廷中的所有赛特之子和底提耶统治者驱逐出去，以确立对次大陆的统治地位。"
 purge_serpent_india_decision_desc: "苏泰赫的追随者—赛特之子和底提耶长期以来缠绕在印度的宫廷和吐蕃的寺院散播其影响力。身为那伽罗阇，我们有责任清除腐化家园的势力，并确立我们对次大陆的统治地位。"
 purge_serpent_india_decision_confirm: "底提耶将明白何谓恐惧"
 purge_serpent_capital_requirement: "你的首都必须位于[GetGeographicalRegion('world_india').GetName]或[GetGeographicalRegion('world_tibet').GetName]"
 purge_serpent_no_setite_india: "没有赛特之子或底提耶在[GetGeographicalRegion('world_india').GetName]持有伯爵领或更高的头衔"
 purge_serpent_no_setite_tibet: "没有赛特之子或底提耶在[GetGeographicalRegion('world_tibet').GetName]持有伯爵领或更高的头衔"
 purge_serpent_effect_tooltip: "你将被誉为赛特天罚并获得大量奖励"
 pilgrimage_to_enoch_decision: "以诺城朝圣"
 pilgrimage_to_enoch_decision_tooltip: "穿越幽土前往以诺鬼城，并带回禁忌的知识"
 pilgrimage_to_enoch_decision_desc: "以诺鬼城深藏于之中[UmbraGlossaryLocalized('shadowlands','冥界')]，那里蕴藏着可怕的力量和禁忌的知识。凭借对亡灵术的精通和忠诚的[coterie|E]支持，你可以踏上前往那里的危险旅程，并带着超越凡人理解的智慧归来。"
 pilgrimage_to_enoch_decision_confirm: "进入幽土"
 pilgrimage_to_enoch_effect_tooltip: "开始前往位于冥界的以诺鬼城[journey|E]"
 convene_silent_conclave_decision: "召开沉默密会"
 convene_silent_conclave_decision_tooltip: "举办那伽罗阇长者的秘密集会来交流知识并执行黑暗仪式"
 convene_silent_conclave_decision_desc: "沉默密会是那伽罗阇的秘密集会，族人于此交换禁忌知识，并举行侍奉氏族的黑暗仪式。此类集会极为罕见，危机四伏，却又拥有无可估量的价值。"
 convene_silent_conclave_decision_confirm: "让我们一起集会"
 convene_silent_conclave_effect_tooltip: "举办那伽罗阇的秘密集会来交流知识并执行黑暗仪式"
 recruit_itarajana_sorcerer_decision: "招募异塔拉贾那术士"
 recruit_itarajana_sorcerer_decision_tooltip: "寻找异塔拉贾那血术法的修习者，并将之血缚为血仆来服务"
 recruit_itarajana_sorcerer_decision_desc: "异塔拉贾那血术法传承自印度教神秘主义，起源于次大陆。一位技艺精湛的修习者，若能被适切地血缚为血仆，将成为我们宫廷的宝贵资产。"
 recruit_itarajana_sorcerer_decision_confirm: "其知识将服务于吾等"
 recruit_itarajana_region_requirement: "你的首都必须位于[GetGeographicalRegion('world_india').GetName]、[GetGeographicalRegion('world_tibet').GetName]、[GetGeographicalRegion('world_middle_east').GetName]或[GetGeographicalRegion('world_steppe').GetName]"
 recruit_itarajana_max_cap: "你不能拥有超过3位#TOOLTIP:GAME_TRAIT,itarajana_sorcerer,[GetNullCharacter] #L 异塔拉贾那术士#!#!于你的宫廷"
 recruit_itarajana_ghoul_cap: "你已经达到[Concept('ghoul','Ghouls')|E][SCOPE.GetValue('ghoul_amount')|0]上限"
 recruit_itarajana_effect_tooltip: "一位#TOOLTIP:GAME_TRAIT,itarajana_sorcerer,[GetNullCharacter] #L 异塔拉贾那术法修习者#!#![GetTrait('ghoul').GetName(GetNullCharacter)]将加入你的宫廷"