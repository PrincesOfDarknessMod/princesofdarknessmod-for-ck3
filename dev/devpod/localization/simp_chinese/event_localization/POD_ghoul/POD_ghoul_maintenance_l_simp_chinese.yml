l_simp_chinese:
 POD_ghoul_maintenance.50.t: "被我的侍主所唾弃"
 POD_ghoul_maintenance.50.desc: "我的[Glossary('侍主','game_concept_domitor_desc')]已经不再支持我了。我也不再为他服务了。他不会再给予我吸血鬼的血了。没有这样的血液，我最终会变老并死亡。"
 POD_ghoul_maintenance.50.option.a: "我因这而恨他们。"
 POD_ghoul_maintenance.50.option.b: "也许这就是最好的。"
 POD_ghoul_maintenance.300.t: "遗传血仆化"
 POD_ghoul_maintenance.300.desc: "我成为了一位[Glossary('遗传血仆','game_concept_revenant_desc')]。"
 POD_ghoul_maintenance.300.option.a: "血的力量！"
 POD_ghoulthrall_release_option.tt: "将解除一位[ghoul|E]奴隶对你的服务。"
 POD_ghoul_maintenance.1.a: "我需要一位来自无依者阵营的盟友。"
 POD_ghoul_maintenance.1.b: "我需要一位来自福尔奇杀手团的盟友。"
 POD_ghoul_maintenance.1.c: "我需要一位来自圣潘特莱蒙骑士团的盟友。"
 POD_ghoul_maintenance.1.d: "我需要一名来自哈基姆的刺客盟友。"
 POD_ghoul_maintenance.1.back: "我改变主意了"
 POD_ghoul_maintenance.2.t: "精血在吾之静脉中。"
 POD_ghoul_maintenance.2.desc: "由于你使用角色编辑器成为了一名[ghoul|E]，你需要选择自身的[ghoul_greatest_vitae_ingested|E]。\n\n#X 如果你选择了一个高阶[Glossary('血律','game_concept_discipline_desc')]特质，选择四代以外的任何[Glossary('世代','game_concept_vampgeneration_desc')]都会立即将其修改至对应的正确等级。#!"