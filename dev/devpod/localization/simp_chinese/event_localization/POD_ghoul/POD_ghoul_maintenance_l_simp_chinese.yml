l_simp_chinese:
 POD_ghoul_maintenance.50.t: "被我的侍主所唾弃"
 POD_ghoul_maintenance.50.desc: "我的侍主已经不再支持我了。我也不再为他服务了。他不会再给予我吸血鬼的血了。没有这样的血液，我最终会变老并死亡。"
 POD_ghoul_maintenance.50.option.a: "我因这而恨他们。"
 POD_ghoul_maintenance.50.option.b: "也许这就是最好的。"
 POD_ghoul_maintenance.300.t: "遗传血仆化"
 POD_ghoul_maintenance.300.desc: "我成为了一位[Glossary('遗传血仆','game_concept_revenant_desc')]。"
 POD_ghoul_maintenance.300.option.a: "血的力量！"
 POD_ghoulthrall_release_option.tt: "将解除一位$pod_ghoul$奴隶对你的服务。"