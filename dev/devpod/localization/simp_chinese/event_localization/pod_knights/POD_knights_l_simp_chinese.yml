l_simp_chinese:
 pod_knights.1.t: "傲慢勇士"
 pod_knights.1.desc: "有人告诉你，你的一位勇士最近犯了大错。在卷入一场与凡人的战斗时，[knight.GetSheHe]使用了血之力来碾压他们，明显的违反了[the_masquerade|E]。或更坏，[knight.GetSheHe]随后还在城里吹嘘！\n这种行为肯定会引来不该有的裁判所目光，但如果你终止与这个令人讨厌的吹牛者的合作关系，你可能仍然能够挽救局面。"
 pod_knights.1.a: "滚出我的视线，蠢货！"
 pod_knights.1.b: "你这次被原谅了。"
 pod_knights.2.t: "狡诈勇士"
 pod_knights.2.desc: "你的一位勇士已经让你背痛了一段时间了。一波接着一波说谣言，你本以为[knight.GetSheHe]在准备一些针对你的阴谋，但经过仔细的调查，你很肯定，这人就是随便乱说，而不是别有用心。\n不过，这显然是对你信誉的威胁，你可能想要尽早采取行动。"
 pod_knights.2.a: "走开，你这个令人厌烦的八卦者！"
 pod_knights.2.b: "……很遗憾，这人太重要了，不能轻易放弃"
 pod_knights.3.t: "暴怒勇士"
 pod_knights.3.desc: "你不知道它是怎么开始的。但是你的一个勇士，以脾气火爆而闻名，因为一个小小的侮辱或类似的事情，在你的宫廷中央陷入血狂。你有两个选择，你可以召唤卫兵和你的其他战士来制服这个狂暴者。然而，这种社会羞辱可能意味着[knight.GetSheHe]再也不会回来为你服务。\n或者你可以让这人继续血狂，不关心可能的受害者……"
 pod_knights.3.a: "让这该死的莽兽滚出我的视线"
 pod_knights.3.b: "也该是时候清除一些封臣了"
 pod_knights.4.t: "怯懦勇士"
 pod_knights.4.desc: "你的一个勇士是个有名的懦夫。总是在寻找摆脱争斗的方法，[knight.GetSheHe]成了你宫廷里的笑柄，虽然没有人敢大声说出来……然而。你很清楚地预见到这很快就会改变，接纳这样一个人会给你的声望带来很大的污点。\n你可以忍受它，或者在它成为一个问题之前将懦夫除名。"
 pod_knights.4.a: "把这白痴吓出我的宫廷"
 pod_knights.4.b: "让他们说，我不在乎"
 pod_knights.5.t: "贪婪勇士"
 pod_knights.5.desc: "这已经是本月第四次你的勇士要求加薪了。你甚至不知道这是关于盔甲，武器还是马。又或者[knight.GetSheHe]这次甚至都不想掩饰它的贪婪。\n显然，你有权让它在此时此地停止，但也许你对军事勇武的重视超过了对金钱的重视？"
 pod_knights.5.a: "把这个贪心的混蛋赶出我的宫廷"
 pod_knights.5.b: "你会得到你那该死的马，或者盔甲什么的，随便了"
 pod_knights.6.t: "多疑勇士"
 pod_knights.6.desc: "你的一个勇士指控……嗯，几乎所有人都在阴谋反抗你的合法统治。无论是凡人、廷臣、封臣还是随便哪个路人。你很确定这是一个稍微过于简化的情况，但……也许[knight.GetSheHe]说的对。\n你的顾问让你把这个坏家伙赶出你的宫廷，但是……也许他们也参与了这个全面阴谋？！"
 pod_knights.6.a: "他们说的有道理……"
 pod_knights.6.b: "叛徒！无处不在！"
 pod_knights.7.t: "愤世嫉俗的勇士"
 pod_knights.7.desc: "永远的魔鬼辩护者，你的一个勇士不断地向宫廷和你提出心路的虚伪，以及心兽最终会不可避免地战胜所有的$pod_cainites$。在他的演讲开始侵蚀你的追随者的意志之前，你的一些廷臣已经要求你在随从中去掉该愤世嫉俗的角色。"
 pod_knights.7.a: "灵魂的救赎是无价的"
 pod_knights.7.b: "……但这可以再等一会儿"
 pod_knights.8.t: "记仇的勇士"
 pod_knights.8.desc: "一个勇士来到你面前，要求对[knight.GetSheHe]在附近城镇察觉到的怠慢进行报复。你知道该角色对这类事情过于偏激，并可能会做过火。但你也知道如果你不接受请求，[knight.GetSheHe]不会乐意……"
 pod_knights.8.a: "你自己弄好这个"
 pod_knights.8.b: "我会帮忙的，但我们不会把那地方烧成灰！……至少不是每一处"
 pod_knights.100.t: "$knight_culture_player_plural_no_tooltip$"
 pod_knights.100.desc: "$knight_culture_player_plural$只愿意为他们真正信任的领导人而战。毕竟，他们是在拿自己的生命冒险。\n\n最近，宫廷里有一些风言风语，说你的一些拥护者考虑离开，去其他地方寻找他们的财富。"
 pod_knights.100.tt: "如果明年这些$knight_culture_player_plural$的好感仍然低于[GetPlayer.MakeScope.ScriptValue('POD_loyalty_opinion')|0V]，他们就会因为缺乏[loyalty_with_icon|E]而离开你的宫廷："
 pod_knights.100.a: "令人担忧。"
 pod_knights.100.message: "$knight_culture_player$因缺乏[loyalty_with_icon|E]而离开"
 pod_knights.100.tt2: "或者，你可以#P;bold 授予头衔#!，或以其他方式保证[loyalty_with_icon|E]。"
 pod_knights.100.b: "我将解除你的作战义务。"