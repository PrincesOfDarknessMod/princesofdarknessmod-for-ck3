l_simp_chinese:
 ultimate_submission_objective_decision: "终极奉献"
 ultimate_submission_objective_decision_desc: "我人生的目标，便是成为我的主人、我的爱人、我那黑暗中的光明的有用之人。这就是我诞生的意义、相遇的缘由，以及深爱他们的理由。\n\n我唯有梦想能永远侍奉他们左右，在他们的陪伴下获得真正的不朽，通过他们悉心的教导，蜕变为尊贵的$POD_splat_vampire$。"
 ultimate_submission_objective_decision_tooltip: "永无止境的服务"
 ultimate_submission_objective_decision_confirm: "直到时间的尽头"
 ultimate_submission_objective_decision_custom1: "你必须为当前的[Glossary('侍主','game_concept_domitor_desc')]完成至少#V 10#!项[bound_ghoul_missions_with_icon|E]#weak （[GetPlayer.MakeScope.ScriptValue('POD_number_of_completed_ghoul_missions')]）#!"
 ultimate_submission_objective_decision_custom2: "你目前的[Glossary('侍主','game_concept_domitor_desc')]对你的看法必须达到#V 100#![opinion|E]！"
 ultimate_submission_objective_decision_effect1: "你将被[vampiresire.GetShortUIName]$pod_Embraced$。"
 pod1230objectives_ghoul.1.t: "终极奉献"
 pod1230objectives_ghoul.1.desc: "有人说，成为血仆是一种致命的成瘾——一场浮士德式的交易，以灵魂换取作为奴隶的永恒。或许，他们说得没错。\n\n但对你而言，自由这个概念似乎被高估了。无论你的主人心中真正的想法为何、又做过什么，你都感到被保护、被爱。要你回到遇见他之前那段充满不确定与混乱的日子，只会是无法承受的折磨。\n\n当你的指引之星一点一滴抽干过去的你，你却被另一种感受所填满——那是一种终于找到存在目的的安定清明。很快，你将会变得与他一样，而你为此感到由衷的喜悦。\n\n\n这是否能永远保持下去，只有时间知道。"
 pod1230objectives_ghoul.1.a: "毕竟过了这么久了"
 POD_fulfilled_lifes_goal_modifier: "实现了人生目标"
 POD_fulfilled_lifes_goal_modifier_desc: "该角色已实现人生目标"
 POD_ghoul_objective_mechanic_rebellion_strength: "#underline;TOOLTIP:POD_ghoul_objective_mechanic_rebellion_strength_desc 叛乱实力#!"
 POD_ghoul_objective_mechanic_rebellion_strength_desc: "[masterless_ghouls|E]在#V $ambitions_of_blood_objective_decision$#!之后的所有[Concept('decision', '目标')|E]都要求#bold 叛乱实力#!来达成\n\n叛乱实力是你麾下的[masterless_ghouls|E][prowess|E]总和，亦即每个[knight|E]，[vassal|E]和其[knights|E]。\n\n\n此外，叛乱实力可藉由完成特定[Concept('decision', '目标')|E]增加\n\n现今的叛乱实力是[GetPlayer.MakeScope.ScriptValue('POD_ghoul_objective_rebellion_strength')|0V]"
 POD_has_ghoul_rebellion_strength_trigger: "$POD_ghoul_objective_mechanic_rebellion_strength$必须超过[SCOPE.GetValue('required_rebellion_strength')|0V]#weak ([GetPlayer.MakeScope.ScriptValue('POD_ghoul_objective_rebellion_strength')|0])#!"
 POD_ghoul_increase_rebellion_strength: "$POD_ghoul_objective_mechanic_rebellion_strength$将增加[SCOPE.GetValue('increase_value')|0V]"
 ambitions_of_blood_objective_decision: "血之雄心"
 ambitions_of_blood_objective_decision_desc: "我们是血液的奴隶，是$POD_splat_vampire_plural$的奴隶。这始终是真相，无法逃避。但血仆永远可以做梦，而许多拥有相同梦想的血仆能够实现不可能之事。"
 ambitions_of_blood_objective_decision_tooltip: "因为我梦见了血"
 ambitions_of_blood_objective_decision_confirm: "一场梦？还是一则预言？"
 ambitions_of_blood_objective_decision_custom1: "你至少拥有#V 10#![courtiers|E]或[vassals|E]是[masterless_ghouls|E]#weak ([SCOPE.GetValue('num_of_ghouls_under')])#!"
 ambitions_of_blood_objective_decision_custom2: "你至少拥有一个高阶[Glossary('血律','game_concept_discipline_desc')]特质"
 ambitions_of_blood_objective_decision_effect1: "一旦成为[bound_ghoul|E]，你会立刻被杀死。这适用于你整个[dynasty|E]"
 ambitions_of_blood_objective_decision_effect2: "[Concept('ghoul','血仆')|E]会更容易接受[court|E]邀请和成为[scheme|E]共谋"
 ambitions_of_blood_objective_decision_effect3: "解锁新机制：#V $POD_ghoul_objective_mechanic_rebellion_strength$#!"
 FRIENDLY_GHOUL: "你是血仆叛乱的领袖：$VALUE|+=0$"
 pod1230objectives_ghoul.2.t: "血之雄心"
 pod1230objectives_ghoul.2.desc: "你已聚集了一小群像你一样的[masterless_ghouls|E]团队，你们有着共同的梦想。\n你小团队的消息已经传进某些不怀好意的耳里，但多数不过视其为不有趣的笑话。\n\n如此自满正是你的最大优势，不幸的是你也知道不会永远都如此。吸血鬼害怕改变，尤其害怕使之跌落王位的改变。你必须明智地利用接下来的时间。"
 pod1230objectives_ghoul.2.a: "我们的梦想会实现吗？"
 the_vitae_rebellion_objective_decision: "精血叛乱"
 the_vitae_rebellion_objective_decision_desc: "短短几年你便征集了越来越多同类，不是并入其他志同道合的[ghouls|E]团队，就是创建新的团队。\n\n但你是如何走到这步的并不重要，重要的是你已有足够实力来实现你的计划。你渴望为你的同类争取一席之地，挣脱$POD_splat_vampire$的压迫。"
 the_vitae_rebellion_objective_decision_tooltip: "毕竟这可是预言"
 the_vitae_rebellion_objective_decision_confirm: "我们将会自由！"
 the_vitae_rebellion_objective_decision_custom1: "你掌握至少#V 2#!门高阶[Glossary('血律','game_concept_discipline_desc')]"
 the_vitae_rebellion_objective_decision_effect1: "所有你[domain|E]中的[masterless_ghoul|E]将改信为[GetFaithByKey('unmastered').GetName]。"
 the_vitae_rebellion_objective_decision_effect2: "被[GetFaithByKey('unmastered').GetName][masterless_ghouls|E]所[imprisoned|E]的$POD_splat_vampire_plural$将更难逃离[prison|E]。"
 the_vitae_rebellion_objective_decision_effect3: "在吸食时降低[imprisoned|E]$POD_splat_vampire_plural$使用[Glossary('血律','game_concept_discipline_desc')]的机率：#P -75%#!"
 the_vitae_rebellion_objective_decision_effect4: "移除王国级[holy_wars|E]的冷却时间"
 the_vitae_rebellion_objective_decision_effect5: "解锁[character_interaction|E]，尝试将一名[bound_ghoul|E]从其[Glossary('侍主','game_concept_domitor_desc')]解放。"
 pod1230objectives_ghoul.3.t: "精血叛乱"
 pod1230objectives_ghoul.3.desc: "血仆永不衰老，几乎能愈合任何伤势，力量更是凡人时的两倍。听起来很美好。\n\n事实并非如此。\n\n血仆或许未受诅，但在许多方面，他们的命运反而更加悲惨。当摄入$pod_vitae$时，许多事情都会随之改变。吸血鬼的血狂诅咒开始纠缠他们，将其推向极端的愤怒与欲望；其他污秽也随之滋生，有时甚至导向疯狂。或许更糟的是，多数血仆被血缚所控制。这些无助的成瘾者会对他们的主人产生病态的迷恋——他们成了奴隶，也许最初是出于选择，但后来便非如此。一旦尝过那血，你再也没有选择。\n\n因此，若$pod_vitae$注定成为束缚我们的锁链，那它同时也必须成为我们的救赎。这场叛乱无法让我们摆脱血瘾，但或许能让我们离找回自我更近一步。"
 pod1230objectives_ghoul.3.a: "在精血中，我们重生。"
 contact_the_dispossessed_objective_decision: "联系无依者"
 contact_the_dispossessed_objective_decision_desc: "许多$POD_splat_vampire_plural$会前往圣城耶路撒冷。然而，并非所有血族都意识到自己将在那里面对的艰难处境，最终被迫仓皇逃离。在如此情况下，他们[ghouls|E]往往被弃置不顾，只能自生自灭。多数人就此死去，但也有少数幸存下来，转而加入其他有着相似背景的群体。这些人被统称为——无依者。\n\n只要我们能够累积足够的资源，并证明自己有能力庇护所有[ghouls|E]，便有机会说服他们加入我们的叛乱。"
 contact_the_dispossessed_objective_decision_tooltip: "不再无依"
 contact_the_dispossessed_objective_decision_confirm: "团结更强大"
 contact_the_dispossessed_objective_decision_custom1: "你有至少#V 400#!#TOOLTIP:MEN_AT_ARMS_TYPE,dispossessed_maa #L 无依者#!#![men_at_arms|E]#weak ([SCOPE.GetValue('number_of_the_dispossessed')])#!"
 contact_the_dispossessed_objective_decision_effect1: "你将能用[decision|E]招唤精通[diplomacy|E]的[ghouls|E]"
 contact_the_dispossessed_objective_decision_effect2: "若你已完成#V $the_vitae_rebellion_objective_decision$#![Concept('decision', '目标')|E]，其创建的[faith|E]将获得[GetFaithDoctrine('special_masterless_ghoul_dispossessed_doctrine').GetBaseName]。若你尚未完成[Concept('decision', '目标')|E]，此效果将延后，直到你完成该目标为止。"
 THE_DISPOSSESSED_CONNECTIONS: "你拥有[GetFaithDoctrine('special_masterless_ghoul_dispossessed_doctrine').GetBaseName]：$VALUE|+=0$"
 pod1230objectives_ghoul.4.t: "与无依者合一"
 pod1230objectives_ghoul.4.desc: "经过数轮谈判后，一度无依的[ghouls|E]正式加入我们，我们获得了又一个对抗\"主人\"暴政的优势。\n\n但这就足够实现我们的梦想吗？总之他们收容和保护被遗忘血仆的技能，将来肯定会非常有用。"
 pod1230objectives_ghoul.4.a: "我们正发展壮大"
 contact_the_folch_cutthroats_objective_decision: "联系福尔奇杀手团"
 contact_the_folch_cutthroats_objective_decision_desc: "在法兰西有着由我们同类组成的佣兵团伙。因对$POD_splat_vampire_plural$的仇恨而团结，这些暴徒将成为我们对抗\"主人\"战争中的另一个盟友。\n\n如果我们能证明我们比他们更强大，同时又能证明我们和他们一样憎恨吸血鬼，那么说服他们加入不过是走个过场。"
 contact_the_folch_cutthroats_objective_decision_tooltip: "在仇恨中团结"
 contact_the_folch_cutthroats_objective_decision_confirm: "团结更强大"
 contact_the_folch_cutthroats_objective_decision_custom1: "你至少拥有一块[county|E]位于[GetGeographicalRegion('ghw_region_southern_france').GetName][region|E]"
 contact_the_folch_cutthroats_objective_decision_custom2: "你已杀死至少#V 50#!名$POD_splat_vampire_plural$#weak ([SCOPE.GetValue('killed_vampires')])#!"
 contact_the_folch_cutthroats_objective_decision_custom3: "你已至少杀死一名[GetTrait('vampgeneration4').GetName(GetNullCharacter)]或[GetTrait('vampgeneration5').GetName(GetNullCharacter)]$POD_splat_vampire$"
 ghw_region_southern_france: "南法兰西"
 contact_the_folch_cutthroats_objective_decision_effect1: "你将能用[decision|E]招唤精通[martial|E]或[prowess|E]的[ghouls|E]"
 contact_the_folch_cutthroats_objective_decision_effect2: "若你已完成#V $the_vitae_rebellion_objective_decision$#![Concept('decision', '目标')|E]，其创建的[faith|E]将获得[GetFaithDoctrine('special_masterless_ghoul_folch_cutthroats_doctrine').GetBaseName]。若你尚未完成[Concept('decision', '目标')|E]，此效果将延后，直到你完成该目标为止。"
 FOLCH_CUTTHROATS_TACTICS: "福尔奇的兇殘戰術"
 pod1230objectives_ghoul.5.t: "共同仇恨"
 pod1230objectives_ghoul.5.desc: "福尔奇曾与我们许多人一样，都是冷酷主人的奴隶。不同的是，他的侍主之死并未让他失去人生的意义，反而将他彻底灌满了仇恨。\n\n本就身为老练佣兵、对法兰西吸血鬼世界了若指掌的他，很快便闯出了名声，并证明自己用处之大不能被随便地抹杀。\n\n然而，愤怒终究只能带人走到某个程度。由我们协助引导驾驭这股怒火，使其转化为真正有产出的行动，或许这将成为我们未来叛乱事业的成败关键。"
 pod1230objectives_ghoul.5.a: "目标明确的仇恨"
 contact_the_order_of_st_panteleimon_objective_decision: "联系圣庞大良骑士团"
 contact_the_order_of_st_panteleimon_objective_decision_desc: "威尼斯存在着一个异端团体，由一群[masterless_ghouls|E]所组成。尽管他们并未与我们共享对吸血鬼的仇恨，但他们仍可能成为极为理想的同道之人。毕竟，并非所有人都该被怒火蒙蔽——总要有人学习，而非一味战斗。\n\n然而，说服他们并非易事，他们缺乏我们的愤怒。但他们在该隐教会崩溃的动荡时期也许会需要盟友。"
 contact_the_order_of_st_panteleimon_objective_decision_tooltip: "异端协商"
 contact_the_order_of_st_panteleimon_objective_decision_confirm: "团结更强大"
 contact_the_order_of_st_panteleimon_objective_decision_custom1: "你已装备#FAMEDBLUE 名作级#!日记"
 contact_the_order_of_st_panteleimon_objective_decision_custom2: "你已装备#ILLUSTRIOUSPURPLE 卓越级#!日记"
 contact_the_order_of_st_panteleimon_objective_decision_effect1: "你将能用[decision|E]招唤精通[learning|E]的[ghouls|E]"
 contact_the_order_of_st_panteleimon_objective_decision_effect2: "若你已完成#V $the_vitae_rebellion_objective_decision$#![Concept('decision', '目标')|E]，其创建的[faith|E]将获得[GetFaithDoctrine('special_masterless_ghoul_order_of_st_panteleimon_doctrine').GetBaseName]。若你尚未完成[Concept('decision', '目标')|E]，此效果将延后，直到你完成该目标为止。"
 pod1230objectives_ghoul.6.t: "反叛知识"
 pod1230objectives_ghoul.6.desc: "圣庞大良骑士团曾主要作为该隐教会的抄写员与官僚体系存在。该组织几乎完全由血仆构成，在该隐大主教——威尼斯的纳尔塞斯的庇护下，过着平稳而无波的生活。然而，随着纳尔塞斯之死，以及该隐教会的缓慢崩解，这一切彻底被颠覆。\n\n骑士团的团长本人正是由纳尔塞斯血缚。随着他的灭亡，团长与许多团员一夕之间失去了稳定的血液供应。绝境迫使人们采取极端手段，一部分成员向你求助，希望你能出手清除那位仍对教会死心塌地的团长——你几乎未费吹灰之力便​​完成了此事。\n\n如今的圣庞大良骑士团仍远称不上是一支军事力量，但他们对该隐历史与宗教教义的深厚了解，无疑将成为你叛乱事业中极具价值的资产。"
 pod1230objectives_ghoul.6.a: "了解我们的敌人"
 contact_the_haqims_assassins_objective_decision: "联系伪哈基姆的刺客"
 contact_the_haqims_assassins_objective_decision_desc: "我们所知的最古老[masterless_ghouls|E]团体座落于惩罚之巢。由#weak 伪#!哈基姆\"创立\"，他们和我们一样憎恨吸血鬼，无论吸血鬼走到哪里，他们都会追杀他们。如此使其成为理想的伙伴，不论是实力还是策略方面。\n\n如果我们呈上一些阿刹迈的头颅作为礼物，也许可以巩固我们与他们的关系？"
 contact_the_haqims_assassins_objective_decision_tooltip: "惩罚之巢的刺客"
 contact_the_haqims_assassins_objective_decision_confirm: "一个不寻常的盟友。"
 contact_the_haqims_assassins_objective_decision_custom1: "你至少拥有一块[county|E]位于[GetGeographicalRegion('world_middle_east_persia').GetName][region|E]"
 contact_the_haqims_assassins_objective_decision_custom2: "你已杀死至少#V 25#!位[GetTrait('assamite').GetName( GetPlayer )]#weak [SCOPE.GetValue('killed_banuhaqim')]#!"
 contact_the_haqims_assassins_objective_decision_effect1: "你将能用[decision|E]招唤精通[intrigue|E]的[ghouls|E]"
 contact_the_haqims_assassins_objective_decision_effect2: "若你已完成#V $the_vitae_rebellion_objective_decision$#![Concept('decision', '目标')|E]，其创建的[faith|E]将获得[GetFaithDoctrine('special_masterless_ghoul_haqims_assassins_doctrine').GetBaseName]。若你尚未完成[Concept('decision', '目标')|E]，此效果将延后，直到你完成该目标为止。"
 pod1230objectives_ghoul.7.t: "喋血刺客"
 pod1230objectives_ghoul.7.desc: "\"伪\"哈基姆的故事向来令人困惑。他原本是一名隶属阿刹迈刺客的精明血仆，其主人于巴力战争期间殒命。自那之后，那位\"哈基姆\"的精神状态显然出现了裂痕，有时甚至会认为自己才是那个冠以「他」之名的吸血鬼氏族之主。尽管他的理智备受质疑，他的能力却无庸置疑。他成功渗透并掌控了传奇刺客组织阿萨辛，数个世纪以来始终是阿刹迈一族挥之不去的眼中钉。更讽刺的是，他的行事手段甚至赢得了不少阿刹迈战士的尊敬，到了如今，已有部分人开始模仿他的战术。\n\n此人行踪诡秘，说服起来更是困难重重，但最终，他同意为你的叛乱提供\"其氏族\"的服务。你毫不怀疑，只要置于一个更为稳定的领导之下，这股力量将成为你事业中不可或缺的关键资产。"
 pod1230objectives_ghoul.7.a: "我们自己的刺客"