l_simp_chinese:
 POD_imprison.002.title: "囚禁：[targetdefender.GetFirstName]"
 POD_imprison.002.desc: "你尝试囚禁[targetdefender.GetFirstName]，但是[targetdefender.GetSheHe]竟敢抵抗你，你该做什么？"
 POD_imprison.002.option.a: "[targetdefender.GetFirstName]将听从于我！"
 POD_imprison.002.option.b: "[targetdefender.GetFirstName]无法抵挡我的魅惑。"
 POD_imprison.002.option.c: "我将手撕[targetdefender.GetHerHim]！"
 POD_imprison.002.option.d: "[attacker_marshal.GetFirstName]会让[targetdefender.GetHerHim]明白自己的位置！"
 POD_imprison.002.option.e: "[attacker_marshal.GetFirstName]肯定知道怎么抓住这种魔物！"
 POD_imprison.002.option.success: "[attacker.GetFirstName]胜利"
 POD_imprison.002.option.a.desc: "支配的冲突"
 POD_imprison.002.option.b.desc: "性格的冲突"
 POD_imprison.002.option.c.desc: "勇武的对决"
 POD_imprison.002.option.d.desc: "一场勇武的对决，你的军事统帅代表你出战"
 POD_imprison.002.option.d.success: "[attacker_marshal.GetFirstName]胜利"
 POD_imprison.002.option.failure: "[targetdefender.GetFirstName]胜利"
 POD_imprison.002.option.a.tt.attacker_wins: "我支配了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.a.tt.attacker_lost: "[targetdefender.GetFirstNamePossessive]的意志过于强大无法支配"
 POD_imprison.002.option.b.tt.attacker_wins: "我魅惑了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.b.tt.attacker_lost: "[targetdefender.GetFirstName]对我的魅力免疫。"
 POD_imprison.002.option.c.tt.attacker_wins: "我在个人决斗中战胜了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.c.tt.attacker_lost: "我在个人决斗中败给了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.d.tt.attacker_wins: "[attacker_marshal.GetFirstName]在个人决斗中战胜了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.d.tt.attacker_lost: "[attacker_marshal.GetFirstName]在个人决斗中败给了[targetdefender.GetFirstName]。"
 POD_imprison.102.title: "新的囚犯"
 POD_imprison.102.desc.dominate: "你成功的将[targetdefender.GetFirstNamePossessive]的心智束绑在你的意志之下，现在[targetdefender.GetSheHe]将毫无意见的进入你的监狱。"
 POD_imprison.102.desc.presence: "你成功的使[targetdefender.GetFirstName]为了讨好你自愿进入[targetdefender.GetHerHis]的新监狱房间。"
 POD_imprison.102.desc.prowess: "你赢了。[targetdefender.GetFirstName]再也不能抵抗你。这将教会所有人反抗你的下场。"
 POD_imprison.102.desc.marshal: "[attacker_marshal.GetFirstName]战胜了[targetdefender.GetFirstName]。这将教会大家反对你权威的下场。"
 POD_imprison.102.option.a: "现在我该对你做什么？"
 POD_imprison.202.title: "战败"
 POD_imprison.202.desc: "你战败了，你的目标逃离了你。也许你该换个时机再次尝试？"
 POD_imprison.202.option.a: "这只是一次小挫折。"
 POD.imprison.302.title: "通过纯粹的意志"
 POD_imprison.302.desc.dominate: "你支配[targetdefender.GetFirstName]的尝试失败了。你可以尝试通过蛮力抓住[targetdefender.GetHerHim]。"
 POD_imprison.302.desc.presence: "[targetdefender.GetFirstName]抵抗住了你的魅惑。你可以尝试通过蛮力抓住[targetdefender.GetHerHim]。"
 POD_imprison.302.option.a: "[targetdefender.GetFirstName]逃不掉的！"
 POD_imprison.302.option.b: "我失败了……"
 POD_imprison.302.option.b.tt: "你的囚禁尝试失败了。[targetdefender.GetFirstName]将获得一个对你的弱牵制。"
 POD_imprison.002.desc.hunter: "你尝试囚禁一位地狱衍体，[targetdefender.GetFirstName]，但是蚂蟥不喜欢神的仆人抓他们。你该做什么？"
 POD_imprison.002.option.f: "现在是时候让[targetdefender.GetShortUIName]细数[targetdefender.GetHerHis]罪了。"
 POD_imprison.002.option.e.desc: "你的军事能力对抗蚂蟥的勇武"
 POD_imprison.002.option.e.success: "[attacker_marshal.GetFirstName]抓住了一只邪恶的恶魔"
 POD_imprison.002.option.e.failure: "[targetdefender.GetFirstName]想出了办法逃跑"
 POD_imprison.002.option.e.tt.attacker_wins: "[targetdefender.GetFirstName]将在你的监狱里腐烂！"
 POD_imprison.002.option.e.tt.attacker_lost: "[targetdefender.GetFirstName]逃走了"
 POD_imprison.002.option.f.tt: "[targetdefender.GetFirstName]将在中看到[targetdefender.GetHerHis]在你眼中极度清晰的[targetdefender.GetHerHim]的罪行倒影。"
 POD_imprison.102.desc.hunter: "[attacker_marshal.GetFirstName]成功地利用吸血鬼的弱点抓住了这只邪恶的野兽，[targetdefender.GetFirstName]。这将教会每一只地狱衍体不要反对你。"
 POD_imprison.202.desc.hunter: "[attacker_marshal.GetFirstName]失败了。[attacker_marshal.GetHerHis]的计划没有成功，现在该在世魔鬼——[targetdefender.GetFirstName]——逃走了！也许你该在来运的时候再试一次？"
 POD_imprison.002.option.g: "还不是时候"
 OD_imprison.002.option.f.desc: "使用神术——殉道者之泪"
 POD_imprison.002.option.g.tt: "你不会停下囚禁[targetdefender.GetFirstName]的尝试。"
 POD_imprison.102.desc.tears: "当[targetdefender.GetFirstName]瘫痪地站在你面前，被迫回忆[targetdefender.GetHerHis]的许多罪过时，你的手下小心翼翼地摆好姿势，准备制服[targetdefender.GetHerHim]。在[targetdefender.GetSheHe]完全恢复意识之前，[targetdefender.GetHerHis]的身体已被铁链紧紧地锁住，指向心脏的尖桩已经准备好在最轻微地挣扎前进行直刺。"
 POD_imprison.103.desc: "当[targetdefender.GetFirstName]瘫痪地站在你面前，被迫回忆[targetdefender.GetHerHis]的许多罪过时，你的手下小心翼翼地摆好姿势，准备制服[targetdefender.GetHerHim]。在[targetdefender.GetSheHe]完全恢复意识之前，[targetdefender.GetHerHis]的身体已被铁链紧紧地锁住，指向心脏的尖桩已经准备好在最轻微地挣扎前进行直刺。"
 POD_imprison.103.option.a: "审判之时到了。"
 POD_imprison.002.option.labyrinth: "符纸迷宫"
 POD_imprison.002.option.labyrinth.tt: "通过将符纸藏在房间里，然后念咒催动，就可以阻止[targetdefender.GetFirstName]离开。例如，如果[targetdefender.GetFirstName]爬出窗外，其就会发现[targetdefender.GetHerselfHimself]反而从门外进来，以此类推。"
 POD_imprison.002.option.coterie: "我的[GetPlayer.Custom('PODCoterieNoTooltip')]成员[prowess_duelist.GetFirstName]将制服[targetdefender.GetHerHim]。"
 POD_imprison.002.option.coterie.desc: "一场勇武的对决，你的[GetPlayer.Custom('PODCoterie')]成员代表你出战"
 POD_imprison.002.option.coterie.success: "[prowess_duelist.GetFirstName]胜利"
 POD_imprison.002.option.coterie.tt.attacker_wins: "[prowess_duelist.GetFirstName]在个人决斗中战胜了[targetdefender.GetFirstName]！"
 POD_imprison.002.option.coterie.tt.attacker_lost: "[prowess_duelist.GetFirstName]在个人决斗中败给了[targetdefender.GetFirstName]。"
 POD_imprison.102.desc.coterie: "[prowess_duelist.GetFirstName]战胜了[targetdefender.GetFirstName]。这将教会大家反对$POD_player_coterie$的下场。"
 POD_imprison.002.option.h: "我的裂隙噩梦将与他们为伴，直到我决定如何处置他们"
 POD_imprison.002.option.h.tt: "[targetdefender.GetFirstName]将无力抵抗，被永久封印在你的裂隙中"
 POD_imprison.102.desc.rift: "[targetdefender.GetFirstName]无法逃脱你的裂隙。这应该能让所有人知道与你作对的下场。"