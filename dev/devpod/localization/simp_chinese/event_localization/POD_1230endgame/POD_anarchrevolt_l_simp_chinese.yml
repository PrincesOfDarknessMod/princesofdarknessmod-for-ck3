l_simp_chinese:
 PODanarchrevolt.0002.t: "大反乱"
 PODanarchrevolt.0002.desc: "随着裁判所的大火席卷整个欧洲，情况对血族社会来说变得越来越可怕。被用作可燃肉盾来对抗天主士兵的年轻吸血鬼，已经愤怒地站了起来反抗他们的长者，这就是现在所谓的“大反乱”。\n到目前为止，大反乱主要由稚子、狂徒和布鲁赫以及一些机会主义者组成。但一些人担心，如果不采取措施，情况可能会像滚雪球一样继续壮大。这些叛党的每个个体是弱小的，但他们为了一种在血族中很罕见的东西而不懈地战斗：原则。"
 PODanarchrevolt.0002.a: "时间将会给这些年轻人教训。"
 PODanarchrevolt.0002.b: "世界上所有稚子们，团结起来！"
 anarch_revolt_effect_message: "大多数年轻吸血鬼，布鲁赫和狂徒将加入叛党的功业。他们变得更加大胆，难以遏制。"
 anarch_revolt_name: "大反乱"
 anarch_revolt_doctrine_name: "自由斗士"
 anarch_revolt_doctrine_desc: "叛党为一些很少有$pod_cainites$知道的事情而战：一项崇高的功业。"
 PODanarchrevolt.0004.t: "大反乱：勒森魃之死"
 PODanarchrevolt.0004.desc: "尽管很多人难以相信，但似乎最近在暗影之堡发生了一场灾难性的事件。勒森魃$pod_clan$的权力中心成了一群勒森魃叛党领导的大胆袭击的目标，他们得到了可怕的阿刹迈战士种姓中最优秀的手下的帮助。\n关于实际袭击的报道是粗略的，只有一位勒森魃活着从要塞出来，但如果他是可信的……那么勒森魃本人已经死了。这一事件鼓舞了世界各地的叛党，勒森魃$pod_clan$的绝大多数成员现在已经团结起来支持叛逆的子嗣的功业。大反乱夜复一夜地升温。"
 PODanarchrevolt.0004.a: "他们应该掂量一下自己的分量！"
 PODanarchrevolt.0004.b: "……也许我该反思一下我的立场。"
 lasombra_revolt_effect_message: "勒森魃$pod_clan$将加入叛党的功业。只有其中最强大的统治者会抵抗。"
 slayer_of_gods: "弑神者"
 slayer_of_gods_desc: "该角色，大概，杀死了一位至高全能的上古耆宿。其赢得了同份量的尊敬和恐惧。"
 PODanarchrevolt.0006.t: "大反乱：雅斯米利亚德之死"
 PODanarchrevolt.0006.desc: "不可能的事情发生了。\n在俄罗斯最深处的森林之一，一群诺斯费拉图叛党设法找到了他们声称的$pod_clan$的怪物始祖雅斯米利亚德的休眠之地。在与古墓的守护者进行了一场可怕的战斗后，只有一名袭击者幸存了下来，但如果他可信的话，他已经在这位[Glossary('上古耆宿','game_concept_antediluvian_desc')]还在睡梦中时杀死了他。在世界各地，诺斯费拉图$pod_clan$终于自诞生以来第一次获得了自由，现在集体加入了他们的英雄队伍。\n事件发生后，整个俄罗斯都能听到老妇人疯狂的笑声……"
 nosferatu_revolt_effect_message: "诺斯费拉图$pod_clan$将加入叛党的功业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0008.t: "大反乱：伊娜依娅之死"
 PODanarchrevolt.0008.desc: "可怕的消息从寒冷的北方传来，为了寻找他们$pod_clan$的始祖伊娜依娅而离开的冈格罗叛党回来了。或者至少是其中一个。\n这位痛苦但骄傲的幸存者讲述了奇迹与怪物的故事，背叛与战斗的故事，简直就像诸神黄昏一样。但是，在最后，这位战士谈到了伊娜依娅的死亡，在与古墓的守护者进行了可怕的战斗后，其在蛰眠中被杀死。显然，这种说法很难证实，但他们已经在冈格罗$pod_clan$中产生了强大的连锁反应，因为许多人加入了叛党的功业。大反乱夜复一夜地升温。"
 gangrel_revolt_effect_message: "冈格罗$pod_clan$将加入叛党的功业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0010.t: "大反乱：棘秘魑之死"
 PODanarchrevolt.0010.desc: "它又发生了。\n一群棘秘魑叛党对他们$pod_clan$的一些长者进行了一次突袭，其表面上的目标是保护[Glossary('上古耆宿','game_concept_antediluvian_desc')]的休眠之地。在得到这个消息后，他们的军队向斯莫格修道院进军，在那里与什拉赫塔守军展开了一场可怕的战斗。最终取得胜利的叛党设法驱散了古墓的魔法保护，他们的首领贪婪地吞噬了棘秘魑本人。\n这一惊人的胜利让古老的$pod_clan$陷入了大反乱的手中，他们声称自己是少数几个设法除掉其始祖的$pod_clan$之一。"
 tzimisce_revolt_effect_message: "棘秘魑$pod_clan$将加入叛党的功业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0012.t: "大反乱：亚力科之死"
 PODanarchrevolt.0012.desc: "亚力科，妥芮朵$pod_clan$的始祖，总是对[Glossary('上古耆宿','game_concept_antediluvian_desc')]的大棋表现冷淡。但这还不足以保护她免受大反乱的影响。\n有报道说，一股勇敢的妥芮朵叛党的军队袭击了她在克里特岛的藏身处，这显然是得到了一些老诺斯费拉图提供的信息的帮助。故事的其余部分是令人困惑的，一些幸存的成员声称亚力科那时还在休眠，而另一些人说有着一场伟大的战斗，但他们都一致认为以诺城的斗牛舞者已经因她自己的世系而陨落。\n受此消息的鼓舞，妥芮朵$pod_clan$现在在大反乱中扮演了更积极的角色。"
 toreador_revolt_effect_message: "妥芮朵$pod_clan$将加入叛党的功业。只有其中最强大的统治者会抵抗。"
 PODanarchrevolt.0014.t: "大反乱：梵卓之死"
 PODanarchrevolt.0014.desc: "即使是王者之$pod_clan$也未能幸免于大反乱的疯狂。在波斯深处的某个地方，一小群梵卓叛党偶然发现了其[Glossary('上古耆宿','game_concept_antediluvian_desc')]的古墓。一些人说他们在寻找阿刹迈的$pod_clan$哈基姆，但被他狡猾的子嗣误导了，其他人只是在谈论一种明显的、相当粗鲁的攫权。\n不管真正的原因是什么，这些梵卓回来了，声称杀死了他们失踪已久的始祖。尽管这一说法值得怀疑，但却导致了许多人投身大反乱，他们很容易就升入领导岗位上。大多数叛党担心这是对大反乱的实际意识形态的威胁，但他们并不真正处于否定向他们伸出如此强大的援助之手的地位。"
 ventrue_revolt_effect_message: "梵卓$pod_clan$将加入叛党的功业。只有其中最强大的统治者会抵抗。"