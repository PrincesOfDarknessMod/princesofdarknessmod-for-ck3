l_simp_chinese:
 PODthorns.0002.t: "荆棘大会"
 PODthorns.0002.desc: "由自在$pod_cainite$世界肆虐的大反乱，陪有仍然存在的裁判所，一件前所未有的事件发生了。几位来自不同氏族的长者呼吁召开一场和解大会，并为该血族建立一个新组织。\n这个组织，即秘盟，将是一个包罗万象的党派，它关心的是保护[the_masquerade|E]和维持长者与稚子之间的关系。许多血族，尤其是叛党们，对这一倡议持谨慎态度，但它已经是一个令人惊讶的政治成功，因为几乎整个欧洲的代表都聚集在了一起讨论这一提议。\n血族的未来，将可能在这英格兰小镇的邻近夜晚内决定。"
 PODthorns.0002.a: "改革即将来临"
 thorn_begins_effect_message: "每个$pod_clan$将会选择一个立场来对待这个提议。如果你足够强大，你就可以成为自己$pod_clan$的代表。"
 PODthorns.0003.t: "荆棘大会：梵卓"
 PODthorns.0003.desc: "旧习惯是永恒的，因此，梵卓$pod_clan$将迎接大会。许多人期望王者能找到一种方法来确保他们对任何新党派的领导。他们的选择也很可能影响到他们的传统对手，夜晚的统治者，勒森魃和棘秘魑。"
 PODthorns.0003.a: "秘盟就是未来。"
 PODthorns.0003.b: "我们永远不会成为这种疯狂行为的一部分！"
 PODthorns.0003.c: "中立性是我们生存的关键。"
 choose_camarilla_effect_message: "你加入秘盟，$pod_clan$的大部分人都会跟随你。"
 choose_opposition_effect_message: "你保持了你的立场，带着你$pod_clan$的大多数加入了叛党"
 choose_independance_effect_message: "你和你的$pod_clan$不进行任何改变。"
 PODthorns.0004.t: "荆棘大会：秘盟梵卓"
 PODthorns.0004.desc: "一个并不那么令人惊讶的决策，梵卓已经与新生的秘盟站到同一阵营，可能是希望在他们还可以的时候掌握权力。在其他代表讨论这一行动时，大会继续进行。"
 PODthorns.0004.a: "秘盟的胜利。"
 PODthorns.0004.b: "我必须加入他们！"
 PODthorns.0005.t: "荆棘大会：反方梵卓"
 PODthorns.0005.desc: "在荆棘大会的开始阶段，事态发生了令人惊讶的转折，当梵卓代表冲出谈判桌，称整个过程是一个悲哀的笑话。看来梵卓$pod_clan$将不会加入秘盟，并与叛党反方结盟，也许是希望给目前没有领导的运动带来秩序。"
 PODthorns.0005.a: "反方的胜利。"
 PODthorns.0006.t: "荆棘大会：中立梵卓"
 PODthorns.0006.desc: "在荆棘大会的开始阶段，事态发生了令人惊讶的转折，因为梵卓代表宣布在可预见的未来他的$pod_clan$会完全中立。也许梵卓没有资格领导这个新兴的党派？这是大胆的勒森魃和棘秘魑谈判代表所宣称的，他们现在嗅到了让自己担当领导角色的机会。"
 PODthorns.0006.a: "是什么让一个氏族得中立？"
 PODthorns.0007.t: "荆棘大会：勒森魃"
 PODthorns.0007.desc: "当勒森魃的代表准备他的声明时，许多人期望贤士们能站在梵卓的对立面。毕竟，一个党派里容不下这么多掌权氏族。"
 PODthorns.0008.t: "荆棘大会：秘盟勒森魃"
 PODthorns.0008.desc: "在一场充满激情的演讲中，勒森魃的代表宣布，他的$pod_clan$完全支持新生的秘盟。已经并为其机构概述了计划，显然是遵循凡人教廷的圣秩制度，许多人期望贤士们担当新党派的领导席位。"
 PODthorns.0009.t: "荆棘大会：反方勒森魃"
 PODthorns.0009.desc: "看来秘盟会有一个强大的敌人，勒森魃$pod_clan$。它的代表诅咒了已决定的提议，匆忙地离开了大会。围绕着叛党功业，贤士们已经在为他们自己的新党派准备草案。"
 PODthorns.0010.t: "荆棘大会：中立勒森魃"
 PODthorns.0010.desc: "看来勒森魃$pod_clan$已经结束了对夜晚的统治者宝座的窥视。当他们的代表宣布他们的中立选择时，其他人已经在推测贤士们现在会把精力集中在更神秘的事情上。"
 PODthorns.0011.t: "荆棘大会：布鲁赫"
 PODthorns.0011.desc: "作为原始叛党运动的大部分成员，布鲁赫$pod_clan$的成员对如何面对大会仍然存在很大分歧。一些人认为这是耻辱的投降，另一些人则认为这是签订体面的和平协议的可能。在这样一个分歧和充满激情的谈判前景下，他们的代表将成为决定的声音。"
 PODthorns.0012.t: "荆棘大会：秘盟布鲁赫"
 PODthorns.0012.desc: "终于，布鲁赫放下了武器。这是一个漫长而艰难的过程，但和平协议已经签署。这个$pod_clan$现在是秘盟不可分割的一部分，尽管其强硬派对此颇有怨言。"
 PODthorns.0013.t: "荆棘大会：反方布鲁赫"
 PODthorns.0013.desc: "战争从不改变，布鲁赫也不会。反叛的$pod_clan$拒绝下台并与新生的秘盟签署和平协约。大反乱仍将继续，但一些人正在考虑将分裂的运动改革成一个更有凝聚力的派别，以便更好地继续战斗。"
 PODthorns.0014.t: "荆棘大会：中立布鲁赫"
 PODthorns.0014.desc: "几乎没有人能预测到布鲁赫$pod_clan$谈判的结果。在一场坚定的演讲中，其代表只是说，他们永远不会再向另一权威俯首。因此，布鲁赫离开大会时就像他们进入大会时一样分裂。"
 PODthorns.0015.t: "荆棘大会：末卡维"
 PODthorns.0015.desc: "让我们说亮话吧。没有人知道末卡维$pod_clan$在大会上将采取什么立场，甚至可能连他们的代表都不知道。然而，尽管他们很危险，但不能低估这些疯子，聚集在这里的许多派别都在博取他们。"
 PODthorns.0016.t: "荆棘大会：秘盟末卡维"
 PODthorns.0016.desc: "末卡维$pod_clan$满足于危险的先知站在他们一边。"
 PODthorns.0017.t: "荆棘大会：反方末卡维"
 PODthorns.0017.desc: "看来末卡维$pod_clan$已经预见到了……关于大反乱的重要事情。他们的代表，用一种骇人听闻的方式描述了一件末日事件，正式召集了他的$pod_clan$加入了大反乱的功业。对于叛党而言，它们和其他人一样对这一突然的转折感到惊讶。"
 PODthorns.0018.t: "荆棘大会：中立末卡维"
 PODthorns.0018.desc: "作为一个由先知和议员组成的$pod_clan$，末卡维已经在持续的冲突中表明了他们的中立立场。看来每个人在将来都有可能享受到利用它们的乐趣。"
 PODthorns.0019.t: "荆棘大会：妥芮朵"
 PODthorns.0019.desc: "尽管米迦勒早已离去，妥芮朵仍然是一个强大的$pod_clan$，在欧洲有着坚实的权力基础。因为他们是第一个提出在秘盟实施强迫性[the_masquerade|E]的想法的人，他们很可能会选择这个党派。但是他们热情的天性也会使他们亲近大反乱……"
 PODthorns.0020.t: "荆棘大会：秘盟妥芮朵"
 PODthorns.0020.desc: "不出所料，妥芮朵$pod_clan$正式加入了秘盟，他们对执行[the_masquerade|E]的关心超过了他们的热情。"
 PODthorns.0021.t: "荆棘大会：反方妥芮朵"
 PODthorns.0021.desc: "当妥芮朵代表发表了激动人心的演说赞扬叛党功业时，燃烧的激情和情感赢得了那一天。看来妥芮朵与掌权氏族的传统联盟结束了，目前而言。"
 PODthorns.0022.t: "荆棘大会：中立妥芮朵"
 PODthorns.0022.desc: "令每个人惊讶的是，妥芮朵代表宣布在可预见的未来，他的$pod_clan$保持中立。也许玫瑰厌倦了战争和叛乱？"
 PODthorns.0023.t: "荆棘大会：睿魔尔"
 PODthorns.0023.desc: "魔法师爆炸性地进入了血族的政治世界，许多人都希望看到他们被永远地粉碎。他们很可能会加入秘盟，希望能在那里找到庇护，作为交换，他们掌握了强大的血术法供党派使用。"
 PODthorns.0024.t: "荆棘大会：秘盟睿魔尔"
 PODthorns.0024.desc: "就像大多数大会成员所期待的那样，睿魔尔宣誓效忠秘盟。许多人已经将他们视为这个新生党派的宝座背后的真正力量。"
 PODthorns.0025.t: "荆棘大会：反方睿魔尔"
 PODthorns.0025.desc: "大会上出现了令人惊讶的反转，因为睿魔尔宣布支持叛党运动。这是他们金字塔的失败，还是更宏伟计划的一部分？"
 PODthorns.0026.t: "荆棘大会：中立睿魔尔"
 PODthorns.0026.desc: "看起来魔法师将不会屈服于任何人，除了他们自己，因为他们的代表已经宣布他们在持续的冲突中保持中立。毫无疑问，他们作为雇佣兵的服务将会备受追捧。"
 PODthorns.0027.t: "荆棘大会：棘秘魑"
 PODthorns.0027.desc: "强大的东欧魔物$pod_clan$预计将采取立场，反对令人讨厌的大敌睿魔尔。许多年长的成员也认真考虑过保持中立，因为他们大多不关心他们阴暗城堡之外的世界。"
 PODthorns.0028.t: "荆棘大会：秘盟棘秘魑"
 PODthorns.0028.desc: "尽管争论很激烈，棘秘魑$pod_clan$还是同意加入秘盟。很多细节仍有待讨论，比如在特兰西瓦尼亚的$[the_masquerade|E]……"
 PODthorns.0029.t: "荆棘大会：反方棘秘魑"
 PODthorns.0029.desc: "困惑和愤怒在荆棘大会上蔓延开来，因为棘秘魑代表刚刚向他的对手丢了他的一块肥大的身体部位，然后冲了出去。看来棘秘魑对秘盟的提议不太满意。"
 PODthorns.0030.t: "荆棘大会：中立棘秘魑"
 PODthorns.0030.desc: "棘秘魑$pod_clan$最年长的成员似乎赢得了内部辩论，因为他们的代表刚刚宣布魔物在这场正在进行的战争中保持中立。许多人因特兰西瓦尼亚的[the_masquerade|E]状况而对该决定表示担忧。"
 PODthorns.0031.t: "荆棘大会：冈格罗"
 PODthorns.0031.desc: "冈格罗不能再否认了，他们的世界正在灭亡。不管他们在夜空下如何英勇，他们的凡人都在被十字架或新月所动摇。在这个快速变化的环境中，许多人都在寻找归属感。每个派系都想成为该归属地。"
 PODthorns.0032.t: "荆棘大会：秘盟冈格罗"
 PODthorns.0032.desc: "冈格罗代表勉强接受了加入秘盟。也许这个$pod_clan$现在会找到一个新的目标，成为这个党派的执行者和血之猎犬。"
 PODthorns.0033.t: "荆棘大会：反方冈格罗"
 PODthorns.0033.desc: "有些人会说，冈格罗已经屈服于他们野性的一面，因为他们选择承诺支持叛党功业，也许是为了寻求一场值得一打的战争。无论如何，这对叛党来说是一个巨大的福音。"
 PODthorns.0034.t: "荆棘大会：中立冈格罗"
 PODthorns.0034.desc: "机警的冈格罗$pod_clan$似乎已经受够了这个自己置身其中的陌生新世界。宣布了中立，只有它们才会选择下一个猎物。"
 PODthorns.0035.t: "荆棘大会：诺斯费拉图"
 PODthorns.0035.desc: "乍一看，诺斯费拉图似乎对秘盟很感兴趣。他们总是在寻找皮肤来对抗他们始祖的恐怖阴影，他们寻求数量带来的力量。然而，凭借精明的外交手腕，他们可以找到其他力量。"
 PODthorns.0036.t: "荆棘大会：秘盟诺斯费拉图"
 PODthorns.0036.desc: "当诺斯费拉图的代表宣布他的$pod_clan$完全支持新生的秘盟时，这并不令人惊讶。从现在起，这个新党派可以依靠一个忠诚而强大的线人网络。"
 PODthorns.0037.t: "荆棘大会：反方诺斯费拉图"
 PODthorns.0037.desc: "在荆棘大会期间，诺斯费拉图加入了叛党运动。许多人想知道隐匿之人是否有一些秘密信息打破了对秘盟的平衡局势……"
 PODthorns.0038.t: "荆棘大会：中立诺斯费拉图"
 PODthorns.0038.desc: "过了几个晚上人们才注意到这一点，但诺斯费拉图的代表已经从大会上消失了。看来隐匿之人不会参与党派的诞生。"
 PODthorns.0039.t: "荆棘大会：赛特信徒"
 PODthorns.0039.desc: "虽然他们已经被正式邀请加入秘盟，但没有人真的认为赛特的子嗣们会接受。他们神秘的行事方式使他们与新党派的框架非常不一致。"
 PODthorns.0040.t: "荆棘大会：秘盟赛特之子"
 PODthorns.0040.desc: "当赛特信徒代表在震惊的观众面前接受加入秘盟的提议时，所有人都在猜测这一选择背后的动机是什么。古蛇刚刚被允许进入庭园了吗？"
 PODthorns.0041.t: "荆棘大会：反方赛特之子"
 PODthorns.0041.desc: "秘盟，一个吸血鬼的中央集权机构的诞生，似乎比任何人想象的都更激怒了赛特之子。在谈到赛特作为“伟大的解放者”的看法时，他们的代表承诺要为叛党的功业奋斗。"
 PODthorns.0042.t: "荆棘大会：中立赛特之子"
 PODthorns.0042.desc: "赛特之子的代表礼貌地拒绝了秘盟半心半意的提议，却做了一件每个人都认为最有可能的结果：在持续的斗争中，确认了他的$pod_clan$的中立性。"
 PODthorns.0043.t: "荆棘大会：阿刹迈"
 PODthorns.0043.desc: "当奥斯曼帝国的扩张威胁到欧洲时，新生的秘盟在如何处理这一问题上存在分歧。阿刹迈在土耳其人的阴影下一直非常活跃，荆棘大会将是双方解决分歧的一个至少尝试机会。"
 PODthorns.0044.t: "荆棘大会：秘盟阿刹迈"
 PODthorns.0044.desc: "在两派令人惊讶的外交表现中，阿刹迈和秘盟达成了一项开创性的安排，使哈基姆的子嗣牢固地加入了新党派。东西方关系的新时代正在开启。"
 PODthorns.0045.t: "荆棘大会：反方阿刹迈"
 PODthorns.0045.desc: "秘盟和阿刹迈之间的谈判已经破裂。整个大会似乎使事情变得更糟，因为哈基姆的子嗣们承诺帮助叛党运动，以期望打破旧的和新的欧洲$pod_cainites$秩序。"
 PODthorns.0046.t: "荆棘大会：中立阿刹迈"
 PODthorns.0046.desc: "阿刹迈的代表离开了大会，不过什么也没改变。哈基姆的子嗣们对西方$pod_cainites$事务的脆弱中立仍在继续。"
 PODthorns.0047.t: "荆棘大会：卡帕多西亚"
 PODthorns.0047.desc: "死亡之$pod_clan$一直以来都四分五裂，并经历了多次的清洗和重组。但即使如此，它依然一直是个受人尊敬的$pod_clan$，虽然他们有隐居的习惯，但也收到了加入秘盟的正式邀请。"
 PODthorns.0048.t: "荆棘大会：秘盟卡帕多西亚"
 PODthorns.0048.desc: "经过长时间的讨论，秘盟和死亡之$pod_clan$似乎已经达成了协议。因此这新生派系又多了一个成员，并已经在为这个成就而自喜了。"
 PODthorns.0049.t: "荆棘大会：反方卡帕多西亚"
 PODthorns.0049.desc: "尽管没人清楚到底发生了什么，但秘盟和死亡之$pod_clan$之间的谈判已经完全翻转。这个$pod_clan$觉得自己受到了侮辱，于是选择加入到叛党的运动当中，而叛党对这种突如其来的支持感到相当惊讶。"
 PODthorns.0050.t: "荆棘大会：中立卡帕多西亚"
 PODthorns.0050.desc: "正如大会中大多数人所预料的那样，死亡之$pod_clan$已宣布在正在进行的冲突中保持中立。他们将一如既往地保持其神秘而隐遁的学者群体。"
 PODthorns.0051.t: "荆棘大会：萨洛比"
 PODthorns.0051.desc: "尽管有许多敌人，萨洛比仍然是一支不容小觑的力量。他们一直忍耐到今晚，显然有被邀请参加大会。大多数人认为他们会站在令人憎恨的睿魔尔$pod_clan$的对立面，但保持中立也是一个很大的可能性，因为无休止的战争已经让他们付出了沉重的代价。"
 PODthorns.0052.t: "荆棘大会：秘盟萨洛比"
 PODthorns.0052.desc: "秘盟庆祝萨洛比正式加入他们。他们已经承诺帮助遏制关于他们新盟友的虚假信息，并恢复他们作为医者$pod_clan$的真实地位。"
 PODthorns.0053.t: "荆棘大会：反方萨洛比"
 PODthorns.0053.desc: "复仇是萨洛比$pod_clan$当下的主题。他们想要为他们所忍受的一切恐怖报复，他们在叛党运动中找到了新的盟友。也许是共同的苦难让他们走到了一起。"
 PODthorns.0054.t: "荆棘大会：中立萨洛比"
 PODthorns.0054.desc: "他们的生存之战让萨洛比$pod_clan$付出了很多代价。是时候让他们的灵魂和身体都得到治愈了。他们的代表用这些话证实了$pod_clan$在目前的危机中的中立态度。"
 PODthorns.0055.t: "荆棘大会：雷伏诺"
 PODthorns.0055.desc: "对于西方的$pod_cainites$来说，雷伏诺一直是局外人，但随着印度$pod_clan$在欧洲越来越多地登场，这种情况正在迅速改变。尽管大多数人认为他们会在正在进行的战争中保持谨慎的中立，但他们还是被邀请参加大会，以示对这种新获得的力量的认可。"
 PODthorns.0056.t: "荆棘大会：秘盟雷伏诺"
 PODthorns.0056.desc: "在这重大的时刻，雷伏诺下了于欧洲迄今为止最关键的一步：他们决定加入新生的秘盟。该党派在宣布结盟时感到谨慎的乐观。"
 PODthorns.0057.t: "荆棘大会：反方雷伏诺"
 PODthorns.0057.desc: "出乎大家意料的是，雷伏诺$pod_clan$支持了叛党运动。这是他们刚到欧洲时受到西方亲王恶劣对待的结果吗？几乎没有人能回答，但叛党张开双臂欢迎它们的新兄弟。"
 PODthorns.0058.t: "荆棘大会：中立雷伏诺"
 PODthorns.0058.desc: "正如大多数人所预料的那样，雷伏诺已经证实了他们在长者和稚子之间的战争中保持中立。印度$pod_clan$距离这盘棋很远，仍在艰难地争取被这些遥远的土地所接受。"
 PODthorns.0059.t: "荆棘大会：劣族"
 PODthorns.0059.desc: "两个世纪前，劣族还只存在于传闻，一旦他们出现在城市里，就会被猎杀而死。但时代变了，他们不能再被忽视了。他们邀请自己参加大会，并希望帮助叛党运动，叛党运动与他们有许多共同的不满。"
 PODthorns.0060.t: "荆棘大会：秘盟劣族"
 PODthorns.0060.desc: "大会上出现了令人震惊的进展，劣族加入了秘盟。经过多次辩论，以及对拟议的官方党派宪法的修改，两派达成了一致。一个新的黎明为被蹂躏的$pod_cainite$种族而闪耀。"
 PODthorns.0061.t: "荆棘大会：反方劣族"
 PODthorns.0061.desc: "叛党运动发现自己得到了劣族的支持。这并不令人惊讶，因为他们大多都有同样的敌人和不满之处，但对稚子的功业来说仍然是一个巨大的福音。"
 PODthorns.0062.t: "荆棘大会：中立劣族"
 PODthorns.0062.desc: "劣族在大会上选择了谨慎的行动方针。尽管他们对秘盟有疑虑，但他们正试图通过宣布中立而不进一步与它对抗。"
 PODthorns.0063.t: "荆棘大会：结束"
 PODthorns.0063.desc: "当最后一批代表离开会场时，每个人都已经在计划下一步行动了。秘盟还没有达到它计划中的对血族的绝对统治。反方则正在讨论将叛党运动改革成一个全新的组织来对抗秘盟。最后，中立派正在准备协议和结盟，以确保他们的生存。一个充满不确定的未来新$pod_cainite$时代开始了。"
 PODthorns.0063.a: "这场大棋的下一步又将如何？"
 PODthorns.1001.t: "秘盟将会如何？"
 PODthorns.1001.desc: "关于秘盟的概念仍处于萌芽阶段，虽然许多人都认为有必要成立这个吸血鬼联合组织，但对于秘盟究竟应该代表什么却存在着许多争论。你会参与这些争论吗？"
 PODthorns.1001.a: "我的意见必须被听取！"
 PODthorns.1001.a.tt: "#R 你将参与投票，以确定秘盟的教义。#!"
 PODthorns.1001.b: "我不在乎细节。"
 PODthorns.1001.b.tt: "秘盟将保留目前默认教义。"
 PODthorns.1002.t: "投票机制：核心教义"
 PODthorns.1002.desc: "关于秘盟应该如何的投票程序已经确定。与该隐之子一如既往的做法一样，这涉及到许多政治手段和幕后交易。对你们来说，这没什么稀奇的。\n#R 在即将弹出的新窗口中，第一个选项卡将列出所有有争议并受投票的核心教义。第二个选项卡将列出你当前的投票，你可以自由更改。\n得票最多的三个核心教义将被保留并成为秘盟的核心。如果数个核心教义的票数相同，则会随机选择一个。\n你可以使用协商[character_interaction|E]，让目标角色投票支持你选择的核心教义，或者让其移除当前的所有投票（即弃权）。\n投票者被通过的核心教义就越多，其就越想加入秘盟。#!"
 PODthorns.1002.a: "我明白了。"
 PODthorns.1002.a.tt: "核心教义投票界面将立刻弹出。"
 PODthorns.1003.t: "投票机制：教义"
 PODthorns.1003.desc: "关于秘盟精神的争论仍在继续。虽然许多人主要是出于政治原因加入这场讨论，但这一选择仍然非常重要，因为有些选择不会被所有氏族接受，这也是情理之中的事。\n#R 你可以在第二个选项卡中更改您的投票，橙光代表你选择的选项，而打勾代表考虑到当前投票情况，哪项教义将成为最终教义。\n如果投票者的提议被采纳的数量少于10个，或者所选教义使其成为罪犯或忌讳，那么他们就会不高兴。\n你可以使用协商投票[character_interaction|E]，使目标投票与你的投票完全一致。\n肖像下标记有浮动提示窗，显示了其的教义投票。#!"
 PODthorns.1003.a: "我明白了。"
 PODthorns.1003.a.tt: "教义投票界面将立刻弹出。"
 PODthorns.2001.t: "秘盟的第二次聚会"
 PODthorns.2001.desc: "第二次聚会定于今年年初在维也纳郊外的一个小镇举行。在这次会议上，在此之前一直担任巡行裁决官的创始人们将发起一个由受邀的秘盟成员组成的小型密会，投票选举新的候选人来填补七个巡行裁决官的职位。之后，创始人们将成为内环，即整个秘盟的监督委员会。在场的许多人肯定会反对建立一个如此强大的团体，但创始人可以给予重要的恩惠来作为平衡，并任命自己为内环。"
 PODthorns.2001.a: "好提议。"
 PODthorns.2001.b: "没兴趣。"
 PODthorns.2001.c: "秘盟和他们无聊的政治。"
 POD_camarilla.110.title: "血猎"
 POD_camarilla.110.desc: "血猎背后的机制是同态复仇法，它可以概括为“以眼还眼”。当一名吸血鬼犯下严重罪行时，比如弑亲、啖魂、破漏潜藏、侵犯领地并导致上述罪行、对亲王权威的反抗，或者亲王认为任何行为对潜藏和整个城市的血族的安全构成足够的威胁时，通常会下达这样的命令。\n任何听到血猎命令的血族都被期望参与其中，尽管这并非正式要求。你会呼吁你的秘盟同僚加入这场战争吗？"
 POD_camarilla.110.a: "召集他们。"
 POD_camarilla.110.b: "我要独自狩猎。"
 POD_camarilla.200.title: "对秘盟的战争"
 POD_camarilla.200.desc: "[attacker.GetFirstName]怎么能对你这位高贵的秘盟[defender.Custom('CamarillaStatus')]发动战争？也许你应该召开一个密会，宣布[attacker.GetHerHim]为[GetTrait('anathema').GetName( GetPlayer )]！\n秘盟整体上回避成员之间的公开战争，因为这会让他们在面对魔宴或叛党等外部威胁时处于弱势。不过，每一次进攻都会被单独处理，而且要达成最终协议还可能涉及到不小的政治因素。"
 POD_camarilla.200.a: "进行传唤。"
 POD_camarilla.200.b: "没必要。"
 POD_camarilla.999.title: "内环聚会"
 POD_camarilla.999.desc: "内环聚会每13年举行一次，期间[Glossary('巡行裁决官','game_concept_justicar_desc')]职位可能会有所变动。"
 POD_camarilla.999.a: "我明白了。"
 POD_camarilla.1100.title_justicar: "巡行裁决官地位变动"
 POD_camarilla.1100.title: "巡行裁决官候选"
 POD_camarilla.1100.desc_justicar: "内环聚会每13年举行一次，期间[Glossary('巡行裁决官','game_concept_justicar_desc')]职位可能会有所变动。\n现在13年已经过去了，因此你可能会失去你的[Glossary('巡行裁决官','game_concept_justicar_desc')]地位。"
 POD_camarilla.1100.desc: "你被选为[Glossary('巡行裁决官','game_concept_justicar_desc')]候选。"
 POD_camarilla.1100.a: "我是不二之选。"
 POD_camarilla.1100.a.tt: "如果内环喜欢你，你就更有可能保住自己的[Glossary('巡行裁决官','game_concept_justicar_desc')]地位。"
 POD_camarilla.1100.b: "我将获得它。"
 POD_camarilla.1200.title: "秘盟达人秀"
 POD_camarilla.1200.desc: "选择哪个候选将会成为下一期[Glossary('巡行裁决官','game_concept_justicar_desc')]。"
