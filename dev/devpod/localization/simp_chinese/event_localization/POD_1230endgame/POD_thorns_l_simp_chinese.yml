 POD_camarilla.1220.title: "内环的意志"
 POD_camarilla.1220.desc: "#X 对可以成为[Glossary('巡行裁决官','game_concept_justicar_desc')]的同氏族角色使用互动，然后再在此事件中选择确认，就可以让其成为[Glossary('巡行裁决官','game_concept_justicar_desc')]。#!"
 POD_camarilla.1220.a: "我决定了。"
 POD_camarilla.1221.title: "内环的意志"
 POD_camarilla.1221.desc: "#X 你确定你要钦定[chosen_justicar.GetFirstNameNoTooltip]成为[Glossary('巡行裁决官','game_concept_justicar_desc')]？#!"
 POD_camarilla.1221.a: "就这么办。"
 POD_camarilla.1221.b: "我改变主意了。"
 POD_camarilla.2300.t: "秘盟的胜利"
 POD_camarilla.2300.desc: "对许多人来说，秘盟一直是吸血鬼社会的默认状态。从野蛮的魔宴到绝望的叛党，秘盟经历了无数次考验和反叛。没有人真正知道秘盟的力量究竟来自何处，尽管许多人都有自己的推测，但有些推测更为黑暗。\n无论如何，最近一系列军事和外交上的胜利将其竞争对手击退到几乎完全无关紧要的地步。对许多人来说，秘盟曾是血族社会中最不坏的选择。\n现在呢？它是唯一的选择。"
 POD_camarilla.2300.a: "一个紊乱的大家庭。"