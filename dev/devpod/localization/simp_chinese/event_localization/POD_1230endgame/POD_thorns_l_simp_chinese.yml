 POD_camarilla.1301.d: "[red_list_candidate_4.GetFirstNameNoTooltip]"
 POD_camarilla.1301.e: "[red_list_candidate_5.GetFirstNameNoTooltip]"
 POD_camarilla.1400.title: "更改教条"
 POD_camarilla.1400.desc: "内环聚会是讨论秘盟整体政治的地方。暗中的交易和数百年前的恩惠可能会导致党派组织发生巨变。\n你想改变教义吗？"
 POD_camarilla.1400.a: "是"
 POD_camarilla.1400.b: "否"
 POD_camarilla.2001.t: "梵卓受纳"
 POD_camarilla.2101.t: "秘盟梵卓"
 POD_camarilla.2101.desc: "作为梵卓的主要代表，你受邀成为对应你氏族的新[Glossary('内环','game_concept_inner_circle_desc')]成员。你将成为最强大党派的领军人物之一，这是莫大的荣耀。"
 POD_camarilla.2101.a: "我应得的"
 POD_camarilla.2201.t: "梵卓巡行裁决官"
 POD_camarilla.2201.desc: "梵卓赢得了拥有[Glossary('巡行裁决官','game_concept_justicar_desc')]的权利。按照传统，秘盟的每个成员氏族都有一位代表其内环成员意志的巡行裁决官。按理说，新成员氏族也有这种可能。"
 POD_camarilla.2201.a: "很好。"
 POD_camarilla.2201.b: "祝他们好运。"
 POD_camarilla.2002.t: "妥芮朵受纳"
 POD_camarilla.2002.desc: "你已接纳妥芮朵加入秘盟，他们的代表[toreador_justicar_candidate_1.GetFirstNameNoTooltip]感谢你的支持，并承诺该氏族将永远支持党派。\n便宜的场面话。"
 POD_camarilla.2002.a: "欢迎来到胜者的一方！"
 POD_camarilla.2102.t: "秘盟妥芮朵"
 POD_camarilla.2102.desc: "作为妥芮朵的主要代表，你受邀成为对应你氏族的新[Glossary('内环','game_concept_inner_circle_desc')]成员。你将成为最强大党派的领军人物之一，这是莫大的荣耀。"
 POD_camarilla.2102.a: "我应得的"
 POD_camarilla.2202.t: "妥芮朵巡行裁决官"
 POD_camarilla.2202.desc: "妥芮朵赢得了拥有[Glossary('巡行裁决官','game_concept_justicar_desc')]的权利。按照传统，秘盟的每个成员氏族都有一位代表其内环成员意志的巡行裁决官。按理说，新成员氏族也有这种可能。"
