 POD_camarilla.2001.a: "欢迎来到胜者的一方！"
 POD_camarilla.300.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
 POD_camarilla.300.desc: "我的领地是我自己的，除非我不这么认为。我承认你的权威，但也注意到你在滥用权力。你的“要求”被拒绝了。"
 POD_camarilla.300.a: "我将不得不看看其他选项……"
 POD_camarilla.999.desc_spoiler: "如果你拥有[Glossary('内环','game_concept_inner_circle_desc')]身份，你还可以将某人列入红名单或在秘盟发起教义变革。"
 POD_camarilla.1301.title: "红名单"
 POD_camarilla.1301.desc: "红名单是秘盟最希望看到从大地上清除的血族名单。红名单上的吸血鬼被称为咒逐，被视为持续受到血猎。秘盟通常将猎杀和消灭这些吸血鬼的任务交给阿拉斯托们。按照传统，它包含13个名字。\n目前红名单上的名字少于13个，因此你可以在方便的时候添加新的咒逐。"
 POD_camarilla.1301.a: "[red_list_candidate_1.GetFirstNameNoTooltip]"
 POD_camarilla.1301.b: "[red_list_candidate_2.GetFirstNameNoTooltip]"
