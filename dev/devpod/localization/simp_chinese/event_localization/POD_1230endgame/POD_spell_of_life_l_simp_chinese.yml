 POD_mummy_spell_of_life.1.t: "请求访问"
 POD_mummy_spell_of_life.1.desc: "为推进我们在永恒重生手段方面的研究，我们需要获得卡比洛斯的秘密手稿。当前持有者[writings_cabirus_owner.GetFirstName]已慷慨地给予我们会面机会。不过，[writings_cabirus_owner.GetSheHe]会希望以某种交换作为允许我们接触该文物的条件。"
 POD_mummy_spell_of_life.1.a: "我有书要交易。"
 POD_mummy_spell_of_life.1.b: "我将支持你的战争努力。"
 POD_mummy_spell_of_life.1.c: "我会为你的实验提供燃料。"
 POD_mummy_spell_of_life.1.c.fuel_experiments: "你的首都所在[de_jure|E][duchy|E]的所有伯爵领的[development|E]等级将降低5点，并且它们将在1年内获得[GetModifier('extinguish_life_modifier').GetNameWithTooltip]修正。"
 POD_mummy_spell_of_life.1.d: "作为内阁议会一员，我要求获得准入权"
 POD_mummy_spell_of_life.1.e: "成本太高了。"
 POD_mummy_spell_of_life.2.t: "最后的副本已被销毁"
 POD_mummy_spell_of_life.2.desc: "Through tight control, Horus hoped to safeguard the secrets of immortality, that no one unworthy of the gift would receive it. However, secrets have a way of becoming known. According to the tales, a young mummy called Cabirus traveled to Greece in the sixth century BC and traded a book to a mortal wizard, who returned home and slowly copied it himself. From there, it was distributed to a few other mortal wizards, and several mummies have been created based on the version of Osiris' great rite preserved in what become the #italic Secret Writings of Cabirus#!. Over the centuries, Horus and his servants have hunted down and burned nearly every copy. However, they failed to obtain all of the copies. One remained safely protected within the great mountain fortress Ceoris, citadel of the Tremere clan of vampires. They failed... until now.\n\nAs the fires of the Inquisition rage across Europe, neonates, Furores, Brujah, and more have risen up against their Elders in what is now being called the Anarch Revolt. Amidst the chaos, Horus saw opportunity. Gathering his forces of vampires, Fera, and mummies, he slaughtered his way through the halls of Ceoris. While not the cursed spawn of his uncle, their dark magics, cruel experiments, and heedless thirst for knowledge rendered them little more worthy of the Great Rite. As his magics brought sunlight into the darkened halls, he marched forward, not reveling in it like some of his companions, simply accepting the need. With each swing, his blade severed their heads from their foul bodies, and he came closer to their hidden vault. Their spells and rituals sloughed off of him, and even the vault's protections could not halt him. With a snap, a ravenous flame burst up around a specific book, the last copy of that text created by a fool so long ago. As the pages burned and curled in on themselves, as ash fell to the table and smoke filled his nostrils, as the fire crackled and flames spread, a slight smile crawled its way on to his face."
 POD_mummy_spell_of_life.2.a: "如此多的损失，转瞬即逝。"
 POD_mummy_spell_of_life.2.a.tt: "“$spell_of_life_stage1_cabirus_phase1_decision$”决议的要求已改变"
 POD_mummy_spell_of_life.3.t: "一部分已完成，另一部分已开始"
 POD_mummy_spell_of_life.3.desc: "既然已对生命神咒有了基本理解，你的导师便再无可教。他们告诉你，魔法这种东西必须靠自己去掌握，而非在课堂上学得。也许他们只是不愿再透露更多细节，但结果都一样。你需要游历世界，搜集古代文献，从他人的失败中汲取教训，并向那些对生命神咒略知一二的人求教。毕竟，从不同人口中听到同样的道理，在掌握一门学问时往往大有裨益。此外，你还需要花时间进行研究，慢慢翻译文献，并进行实验。\n\n#help 要达到生命神咒的90[trait_level_track_xp|E]并更进一步，你需要通过被动积累和完成[journeys|E]来获取经验。请参阅$POD_story_spell_of_life_explanation$的[story_cycle|E]以及角色下永恒重生追寻者特质的描述以了解更多。#!"
 POD_mummy_spell_of_life.3.desc.b: "既然已经对生命神咒有了基本的理解，纯粹的实验便无法再带你更进一步。魔法这门学问，必须通过实践来掌握，而非在课堂上传授。你需要游历世界，收集古老的记录，从他人的失败中汲取教训，并向那些对神咒略知一二的人求教。毕竟，从不同的人口中听到同样的教诲，往往在精通某项主题时颇具价值。此外，你还需要花时间进行研究，慢慢翻译记录，并进行更多实验。\n\n#help 要在生命神咒上达到90点[trait_level_track_xp|E]并进一步精进，你需要通过被动积累以及完成[journeys|E]来积攒经验。请参阅$POD_story_spell_of_life_explanation$ [story_cycle|E]以及你角色下“永恒重生追寻者”特质的描述以了解更多。#!"
 POD_mummy_spell_of_life.3.a: "我的旅程尚未结束……"
 POD_mummy_spell_of_life.4.t: "停下脚步的警告"
 POD_mummy_spell_of_life.4.desc: "某事正在发生……在变化……在撕裂。物质界与暗影界之间的尸幕出现了裂口。风暴吹过亡者之地，虽不足以标志新纪元，却也卷走了众多诸灵，将之带往黑暗之境。野兽崛起，怪物蔓延，诸灵聚集。一次日食遮蔽了太阳的面容，投下的阴影蕴含着深意。无论男女老幼，各种凡人遇见你时都会说出奇怪的话语，他们的眼中流转着金色，声音却透出一种与他们的年龄不相符的苍老。无论你望向何处，墙上都刻着神秘的信息，内容涉及不眠的死者。你能从中推断出，你制造木乃伊以及运用永恒重生背后的魔法，正在损害……#bold 它#!。"
 POD_mummy_spell_of_life.4.a: "确实，这是些奇异的音讯……"
 POD_mummy_spell_of_life.5.t: "漫漫长夜之旅"
 POD_mummy_spell_of_life.5.desc: "Perhaps this is a consequence of lacking restraint, of not leaving some things hidden. Perhaps this was your goal all along, when you sought out the magic behind the eternal rebirth. In the end, it doesn't matter. So little matters anymore.\n\nThere are many tales of time's end and many names for it too. Some saw a flood of blood, sweeping the world clean. Others predicted the rise of the avatar of ultimate evil. Few were right that it would end with the sundering of the veil between worlds.\n\nWhat once were tears are now great rents, leaving the Shroud as little more than scraps of a curtain. Rifts into the endless abyss ooze a sickly green fog, devouring the land. Nightmares roam, given shape by all our fears, fears with a new life in these darkened days. Living shadows, remnants of those that surrendered to the inner dark, stalk the fog-laden valleys and engulfed forests. Forms, possessed in mind, body, and spirit by horrors beyond mortal ken, roam the lands, enticing and tempting. A storm like no other swallows the lands of the dead, casting them into a maw that knows no satiation. Against such winds, even the seals upon the Abyss itself cracked. The winds' fury even stretches into the material world, consuming the sun's light and allowing those fearful of its rays to walk freely. Those whose bodies have long since become dust prowl the lands, looking for bodies to steal so that they become unliving immortals that feast upon blood and breath. Waters turn red with blood as the founts of the deep break open. Locusts with crowns of gold, faces of men, teeth of lions, and tails of scorpions scourge the lands, spreading in swarms so great that their wings alone are enough to deafen the dead.\n\nAmidst the horrors, mortals hear voices in their head and see messages upon the walls, imbuing them with the power to accomplish feats even the immortal would struggle to replicate. First among their targets are the Undying, those reborn eternally and whose creation led to this. With each strike, they seek to mend the tears. Rumors of two strange, glowing, winged beings continue to spread, aiding these hunters and actively trying to once more separate the dead from the living. Only time will tell whether their efforts bear fruit, but that is a tale for another day..."
 POD_mummy_spell_of_life.5.a: "一切就此告一段落，暂时如此……"
 POD_mummy_spell_of_life.5.a.tt: "世界正在走向终结，因为[umbra|E]继续与皮囊之地交融。#X 你所熟知的世界即将结束，游戏就此落幕。#!"
 POD_mummy_spell_of_life.10.t: "觐见荷鲁斯"
 POD_mummy_spell_of_life.10.desc: "$POD_debate_debate_strength_header$荷鲁斯独自掌握着生命神咒。他已经很长时间没有用这道咒语创造新的木乃伊了。以目前的情况来看，他肯定不会将这道咒语分享给你。\n\n然而，你之前的贡献足以让他赐予你一次面见的机会。如果你能提出足够有说服力的论据，或许能获得他在你探索中的援助，从而大大减轻你的任务难度。$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.10.a: "我将前往他的王庭。"
 POD_mummy_spell_of_life.10.b: "再想想……"
 POD_mummy_spell_of_life.11.t: "观众：管家还是商人？"
 POD_mummy_spell_of_life.11.desc: "$POD_debate_debate_strength_header$“那么……你就是那只渴望学习生命神咒的幼犬。你的功绩为你赢得了觐见的机会，但也仅此而已。”\n“记住，我并非寻常商贩。我无法被收买。我不会#italic 轻易#!出售生命神咒。我是强大知识的守护者。将生命神咒交予你，如同将王冠递给一个未经考验的统治者。有些愚者甚至可能借此企图与奥西里斯或玛阿特诸神平起平坐。有太多愚者渴望神性、渴望能让他们更强大的力量。实际上，这神咒将你束缚于你无法逃脱的后果，受你无法躲避的力量所监视，并为你复苏的每一次呼吸受到审判。”\n\n“你有何回应？”"
 POD_mummy_spell_of_life.11.a: "管家的工具依法而行。为我打造这样一件工具。"
 POD_mummy_spell_of_life.11.b: "若你拒绝一切，唯有不配者将拥有它。"
 POD_mummy_spell_of_life.11.c: "咒语即代价；无人能承受更重。"
 POD_mummy_spell_of_life.12.t: "观众：那怯懦呢？"
 POD_mummy_spell_of_life.12.desc: "$POD_debate_debate_strength_header$“无数千年以来，我一直在进行一场战争，一场对抗混沌与叛徒的战争。那些通过我母亲的生命神咒获得永恒重生之人，被召唤来协助这场战争。然而，也有背叛者和懦夫抛弃了我们的使命。他们数个世纪的轮回使他们变得冷漠而胆怯。有人自杀，抛弃了我们。其他人只关心自己短暂存续的眼前享乐，于是离去，在沙漠中游荡。”\n\n“那么，对于持咒者本身，这份责任又沉重多少呢？一个世纪后、五个世纪后、一百个世纪后，你将变成何种存在？你会保持忠诚吗？你会寻求真正死亡的解脱吗？当你首次见到赛特之子时，无论是嗜血者还是不灭者，你会因恐惧而逃走吗？”"
 POD_mummy_spell_of_life.12.a: "我曾与赛特之子交战以夺取上埃及之地，我何惧他们。"
 POD_mummy_spell_of_life.12.b: "我可不是稚子。我知道岁月会带来什么。"
 POD_mummy_spell_of_life.13.t: "观众：那背叛呢？"
 POD_mummy_spell_of_life.13.desc: "$POD_debate_debate_strength_header$“或许你会更直接地背叛我，嗯？刻茉媞里曾是我母亲追随者中的一员，但她是赛特的间谍。你是个间谍吗？当她向我展露真实意图时，我原谅了她。然而，赛特抓住了她，折磨了她许多许多个月。尽管她必须为她其他的诸多罪行受苦，我承认她没有把神咒交给他。你能做到同样的事吗？那个在我缺席时潜入我母亲祭司中的马其顿间谍又如何？他差点偷走生命神咒，只因自己的傲慢才功亏一篑。那造就了众人称之为‘忌灵’的怪物。\n\n你会落入这样的诡计吗？你自己的追随者会被渗透，让生命神咒被偷走吗？假如赛特给你一百万金币，或世上所有欢愉，他又不是没有这种力量。这样的诱惑会打动你吗？你会把生命神咒交给他吗？”"
 POD_mummy_spell_of_life.13.a: "我能抵抗任何事情，无论是折磨还是快乐。"
 POD_mummy_spell_of_life.13.b: "我行事谨慎，能保守秘密。"
 POD_mummy_spell_of_life.13.c: "以我真名起誓，以确保我的忠诚。"
 POD_mummy_spell_of_life.13.c.prohibited_from_teaching: "荷鲁斯禁止你将生命神咒传授给他人。"
 POD_mummy_spell_of_life.14.t: "观众：年龄视角？"
 POD_mummy_spell_of_life.14.desc: "$POD_debate_debate_strength_header$“在我缺席之际，我母亲的祭司们向许多不配之人许诺了永恒重生。他们没有保留最优秀最聪明之人，而是任由政治和金钱左右其决策。即便有时选中了当下一刻值得之人，他们也忽略了被选者的长期可持续性。许多此类被选者的心智与勇气历经千年已遭侵蚀。\n\n‘你是否会展现出那种程度的#italic 智慧#!？鉴于你年轻，是否可能缺乏远见？你会允许个人情感和情绪影响你的决策吗？你会为了维系关系和所爱之人而忽视合适性吗？”"
 POD_mummy_spell_of_life.14.a: "我绝不会！"
 POD_mummy_spell_of_life.14.b: "审判官会捕获不配之人。"
 POD_mummy_spell_of_life.14.c: "您愿意指引我。"
 POD_mummy_spell_of_life.15.t: "维持玛阿特？"
 POD_mummy_spell_of_life.15.desc: "$POD_debate_debate_strength_header$“生命神咒远非寻常法术可比。木乃伊的存在超越了自然秩序。一次又一次地回到同一具躯体，这并不合乎天道。相比于那些依靠血液或生命而存续的亡者，我们造成的危害要小得多。我们是玛阿特——平衡——的捍卫者，投身于一场[Glossary('永恒战争','podgloss.warofbalance')]。我们追猎并消灭那些企图破坏平衡、带来混乱的存在。然而，正因我们的存在本身，我们也成了阻碍平衡恢复的绊脚石。当数量稀少时，所造成的损害微不足道，且已被我们的征战大幅抵消。我们有办法控制损害，谨慎地释放那毒害。但终有一日，玛阿特将要求我们自戮，终结我们重生的循环。每多一位木乃伊，我们便纠缠扭曲死亡的轮回，将自身存在的矛盾投射于冥界之上。每一位新木乃伊都进一步扰乱了平衡，磨损着分隔冥界与生者之地的迷障。每一位新木乃伊都将我们终结之日拉得更近，直至那损害变得过重、过难逆转。\n\n“将生命神咒授予你，我便担保新的木乃伊会被创造出来，因为除此之外，再无理由去追寻它。我何以要冒此风险来助你？你能否弥补你所造成的损害？”"
 POD_mummy_spell_of_life.15.a: "传授该法术会减少独立重新发现的数量。"
 POD_mummy_spell_of_life.15.b: "你若教我，便能掌控后续。"
 POD_mummy_spell_of_life.15.c: "拒绝新的冠军对玛阿特伤害更大。"
 POD_mummy_spell_of_life.16.t: "观众：成功"
 POD_mummy_spell_of_life.16.desc: "\"好吧……你的论据很有说服力。如果你能证明自己，并展示你对战争的投入，我将在你追寻生命神咒的征途中助你一臂之力。我不会直接赐予你咒语。唯有你亲自获取，才能真正珍视并理解它。然而，我会给予一些指引，助你拼凑那散落四方的知识碎片。\""
 POD_mummy_spell_of_life.16.a: "我非常感谢您的指导。"
 POD_mummy_spell_of_life.17.t: "观众：失败"
 POD_mummy_spell_of_life.17.desc: "\"蠢货！我守卫玛阿特已逾六千年！你以为这些花言巧语便能动摇我吗？你当我是什么随波逐流的政客？还是见钱眼开的商人？\n\n或许再过几年或几十年，你会更加明智些。到那时再来吧！\""
 POD_mummy_spell_of_life.17.a: "好吧，那我稍后再来。"
 POD_mummy_spell_of_life.20.t: "内阁：该召集谁？"
 POD_mummy_spell_of_life.20.desc: "追寻生命神咒绝非小事，需要耗费我们大量的精力。若你能安排同僚们的支持，便能拥有更多时间和资源投入你的努力之中。即便只是承诺不干涉，也足矣。\n\n问题在于该召唤谁。你只能邀请最强大者，因此无法挑选具体的人选。相反，你必须考虑谁最有可能同意你的提议。谁又能提供最大的帮助？"
 POD_mummy_spell_of_life.20.a: "召集我们的家族。"
 POD_mummy_spell_of_life.20.c: "召集我们道途上的人们。"
 POD_mummy_spell_of_life.20.d: "再想想……"
 POD_mummy_spell_of_life.21.t: "内阁：开始的时候到了"
 POD_mummy_spell_of_life.21.desc: "$POD_debate_debate_strength_header$这花了一些时间。不过，你终于召集了一个由5名代表组成的议会。继续你的研究将耗费大量的时间和资源。你需要说服他们加入你的努力，并将他们的资源投入到你的事业中。这样的承诺将加快你的进展，并帮助你抵御外部势力。即使是不干涉的承诺也能降低风险。毕竟，你不想处理一些愚蠢的亲戚试图窃取你的研究。$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.21.a: "大家都坐下吧。有很多事要做。"
 POD_mummy_spell_of_life.21.b: "转念一想……"
 POD_mummy_spell_of_life.22.t: "内阁：他人失败之地"
 POD_mummy_spell_of_life.22.desc: "$POD_debate_debate_strength_header$\"The Spell of Life is a waste of time, a quest even more foolish than that for the Grail. Very, very few have ever held the Spell of Life, all of whom received it from another. Isis, one of the greatest mages in history, was gifted it by a being she called Thoth. Horus, one of only two who know it in the current age, learned it from his mother. Cabirus, the other of the two, practiced an incomplete and flawed version, modified from a copy he was gifted by an unknown Ishmaelite. The few other confirmed holders came from the Cult of Isis and were similarly taught by others. Anything else is mere rumor.\nMany, many have tried to acquire it through other means. Set spent countless centuries pursuing the Spell. Whether it was infiltrating the Cult of Isis or torturing a holder of the Spell of Life or conducting experiments of incredible scale, he, a [Glossary('Cainite','game_concept_cainite_desc')] [Glossary('antediluvian','game_concept_antediluvian_desc')], failed every time. The best he managed was the deeply flawed Bane Mummies. The Bane Mummies themselves spent centuries in the same fruitless pursuit. Several Ishmaelites have tried too. The closest they ever came was a spell that created vampires.\n\n\"Do you truly believe that you can create the Spell of Life without being gifted it? Do you consider yourself so special, so different that you will succeed where so many greater failed?\""
 POD_mummy_spell_of_life.22.a: "工具、知识与魔法，自那时起便已演进。"
 POD_mummy_spell_of_life.22.b: "这是一种包含多层结构和多种变体的法术。"
 POD_mummy_spell_of_life.22.c: "他们各自独立工作。因此你……"
 POD_mummy_spell_of_life.23.t: "内阁：代价是什么？"
 POD_mummy_spell_of_life.23.desc: "$POD_debate_debate_strength_header$“你想要金钱？资源？人力？进入我们图书馆的权限？甚至对我们来说最珍贵的时间？也许你没有注意到，我们这一类人始终处于内外交战的境地。猎人们变得越来越坚决、执着，数量也日益增多。我们中最年长的一些人已经消失、结束了生命，或被猎杀。我们的对手一直在发动越来越复杂的政治阴谋。我们自己的计谋和研究也越来越耗费资源。你不能认真地期望我们为了某种可能一无所获、只会失败的深奥追求而冒险动用我们本就捉襟见肘的资源。即使我们承认生命神咒在理论上是可能的，其机会成本也是不可接受的。”"
 POD_mummy_spell_of_life.23.a: "这是生存的解决方案，而非逃避生存的方式。"
 POD_mummy_spell_of_life.23.b: "你已经接受了符合你传统的冒险研究。"
 POD_mummy_spell_of_life.23.c: "比你想象的要少。"
 POD_mummy_spell_of_life.24.t: "内阁：奖励是什么？"
 POD_mummy_spell_of_life.24.desc: "$POD_debate_debate_strength_header$“我们有自己的事务要处理，自己的权力基础、领地、忠诚的追随者。我们需要牺牲一部分资源来援助你，这将削弱我们自身并留下可乘之机。如果你失败了，我们就会在一个愚蠢的差事上浪费宝贵的时间、金钱和精力。不过，暂且撇开这些不谈，假设我们接受你的论点。如果你成功了……那本身就是另一个问题。我们会削弱自己来让你变得更强大。现在，你顶多是个竞争者或更弱的角色。之后，你可能会成为有能力推翻我们的对手。相比之下，我们却一无所获。我们为何不索取资源？我们为何不从你那里偷走法术？简单来说，我们从中能得到什么好处？”"
 POD_mummy_spell_of_life.24.a: "我拥有大量的金钱。"
 POD_mummy_spell_of_life.24.b: "我会欠你人情。"
 POD_mummy_spell_of_life.24.c: "我将借给你我的兵力。"
 POD_mummy_spell_of_life.25.t: "内阁：引火烧身？"
 POD_mummy_spell_of_life.25.desc: "$POD_debate_debate_strength_header$\"许多其他存在曾寻求生命神咒，数量众多。此类存在寿命悠长，力量强大，绝不会轻易放弃这样的追求。若你能在他们失败之处成功，必将引起强大势力的注意。他们的关注只会带来灾难，对你……以及若我们助你，也对我们。你相信这样的力量能够抵挡吗？你能抵挡这样的力量吗？或许你自以为他们怕你而不敢干预？\""
 POD_mummy_spell_of_life.25.a: "他们早已远去，无需惧怕。"
 POD_mummy_spell_of_life.25.b: "我与我的骑士们将坚定立场。"
 POD_mummy_spell_of_life.25.c: "我们全体将共同抵抗他们。"
 POD_mummy_spell_of_life.26.t: "内阁：成功"
 POD_mummy_spell_of_life.26.desc: "\"好吧……你的论点很有说服力。我们会借给你一些资源来支持你的实验，但不会全力投入这个几乎注定失败的事业。别浪费了它们。\""
 POD_mummy_spell_of_life.26.a: "感谢您的援助。"
 POD_mummy_spell_of_life.27.t: "内阁：失败"
 POD_mummy_spell_of_life.27.desc: "\"蠢货！你要求太多而付出太少。我们不会支持你的愚蠢行径。\n\n或许几年或几十年后，你能证明自己有提出有力论据的能力。到那时再召集我们吧！\""
 POD_mummy_spell_of_life.27.a: "好的，我们稍后再谈。"
 POD_mummy_spell_of_life.30.t: "荷鲁斯的突袭"
 POD_mummy_spell_of_life.30.desc: "Horus has ever been the keeper of the Spell of Life, the only one currently alive that knows the full Spell. He lives by his code, the Wat Hor, and enforces it within the world. Tenet 6 bans the creation of mummies, inherently restricting access to the Spell of Life. He hunts the Secret Writings of Cabirus which leak only incomplete details regarding the Spell of Life. You have come very close to constructing the full Spell of Life, attracting Horus' fury upon you in measures far beyond what Cabirus' writings ever earned.\n\nNow, Horus and his mummy followers have arrived before your haven, planning to attack in the day when they are at their strongest and you are at your weakest. They are forming ranks, preparing to overwhelm your defenses. Their swords gleam in the noonday sun, eager to shed your blood. Their magicks are gathering around them, distorting the area like the haze of heat above a torch or masonry roof in the summer. On an unheard signal, they charge. You have no choice but to withstand their assault."
 POD_mummy_spell_of_life.30.a: "稳住！稳住！坚持住！"
 POD_mummy_spell_of_life.30.b: "求你了！饶我一命！我求求你了！"
 POD_mummy_spell_of_life.30.stage3.success: "不知何故，尽管历经万难，你依然屹立不倒，取得了胜利。"
 POD_mummy_spell_of_life.30.stage3.successful_groveling: "荷鲁斯接受了你可悲的恳求"
 POD_mummy_spell_of_life.30.stage3.failure: "你在镰刀下如麦子般倒下"
 POD_mummy_spell_of_life.30.stage3.successful_sale: "你把研究交给他们，以换取他们不再打扰你。"
 POD_mummy_spell_of_life.30.kemintiri_fight: "刻茉媞里的支持削弱了与你对抗的势力"
 POD_mummy_spell_of_life.30.kemintiri_begging: "刻茉媞里的支持很好地说明了你的可信赖程度。"
 POD_mummy_spell_of_life.30.stage3.successful_groveling.tt: "你在这条生命神咒任务上的进度将被重置。尽管你将保留此前所获得的支持，但你需要重新选择一条新的决议才能推进任务。"
 POD_mummy_spell_of_life_total_prowess_check: "你的[coterie|E]累计的[prowess|E]将与敌方比较，并根据其[faith|E]传播范围所反映的影响力规模获得加成。"
 POD_mummy_spell_of_life_total_learning_check: "你的[coterie|E]的累计[learning|E]将与敌人的进行比较，并会根据其[faith|E]传播范围所反映的影响力规模获得加成。"
 POD_mummy_spell_of_life_total_intrigue_check: "你的[coterie|E]累计[intrigue|E]将与敌方对比，并根据其[faith|E]传播所反映的影响力规模获得加成。"
 POD_mummy_spell_of_life_total_stewardship_check: "你的[coterie|E]累积的[stewardship|E]将与你敌人的进行比较，并根据其影响力规模（由其[faith|E]的传播所反映）获得加成。"
 POD_mummy_spell_of_life.31.t: "贤荷鲁的突袭"
 POD_mummy_spell_of_life.31.desc: "Horus has ever been the keeper of the Spell of Life, the only one currently alive that knows the full Spell. He lives by his code, the Wat Hor, and enforces it within the world. Tenet 6 bans the creation of mummies, inherently restricting access to the Spell of Life. He hunts the Secret Writings of Cabirus which leak only incomplete details regarding the Spell of Life. While Horus may be absent, you have come very close to constructing the full Spell of Life which has attracted the fury of Horus' followers upon you in measures far beyond what Cabirus' writings ever earned.\n\nNow, the Shemsu-Heru have arrived before your haven, planning to attack in the day when they are at their strongest and you are at your weakest. They are forming ranks, preparing to overwhelm your defenses. Their swords gleam in the noonday sun, eager to shed your blood. Their magicks are gathering around them, distorting the area like the haze of heat above a torch or masonry roof in the summer. On an unheard signal, they charge. You have no choice but to withstand their assault."
 POD_mummy_spell_of_life.31.a: "稳住！稳住！坚持住！"
 POD_mummy_spell_of_life.31.b: "求你了！饶我一命！我求求你了！"
 POD_mummy_spell_of_life.31.stage3.successful_groveling: "你可怜的恳求被接受了。"
 POD_mummy_spell_of_life.300.t: "荷鲁斯的信"
 POD_mummy_spell_of_life.300.desc: "你收到了来自荷鲁斯的一封信。这并非什么异常或意外之事，因为你们主要就是通过这种方式交流，同时你也在努力加深对生命神咒的精确理解。然而这次，信中并未附上那些晦涩难解、最终却能启人深思的远古文献——这些文献比你已知的大多数文明都要古老。\n\n“根据你进展的追踪，你应该快到将神咒与某个特定影界绑定的时候了。虽然我起初对你的求索心存犹豫，不愿容忍或支持，但时机成熟时，我建议你前往阿蒙提。我相信，你已经赢得了在玛阿特诸审判者面前陈述己案的权利。”"
 POD_mummy_spell_of_life.300.a: "嗯，有趣的见解……"
 POD_mummy_spell_of_life.32.t: "塞莱廷的提议"
 POD_mummy_spell_of_life.32.desc: "Once known as House Tremere among the mages of the Order of Hermes, they sought various means of immortality. Their initial research led them to vampirism. However, some among them never abandoned their search. Celestyn, the master librarian and a researcher comfortable in the field, developed a particular interest in mummies. He even acquired one of, if not the last, copy of the Secret Writings of Cabirus. You have come very close to constructing the full Spell of Life, attracting his full attention. In the hopes of attaining an immortality without the curses of vampirism, many Tremere field \"researchers\" and their gargoyle servants have arrived. Celestyn steps forward:\n\n\"We are fellow academics. To get this far and learn what you have of the Spell of Life, you are clearly one of great intelligence and intellect. Surely, you can see that we are far more powerful than you, capable of blowing your haven apart with our disciplines. However, such bloodshed is unnecessary. Give us your research, and we will leave you alone to continue your efforts.\""
 POD_mummy_spell_of_life.32.a: "你想偷我的作品？！"
 POD_mummy_spell_of_life.32.b: "拿去，别再来烦我了！"
 POD_mummy_spell_of_life.33.t: "睿魔尔氏族的提议"
 POD_mummy_spell_of_life.33.desc: "Once known as House Tremere among the mages of the Order of Hermes, they sought various means of immortality. Their initial research led them to vampirism. However, some among them never abandoned their search. The Tremere's master librarian developed a particular interest in mummies and even acquired one of, if not the last, copy of the Secret Writings of Cabirus. While he may be absent, you have come very close to constructing the full Spell of Life, attracting the Clan's full attention. In the hopes of attaining an immortality without the curses of vampirism, many Tremere field \"researchers\" and their gargoyle servants have arrived. One steps forward:\n\n\"We are fellow academics. To get this far and learn what you have of the Spell of Life, you are clearly one of great intelligence and intellect. Surely, you can see that we are far more powerful than you, capable of blowing your haven apart with our disciplines. However, such bloodshed is unnecessary. Give us your research, and we will leave you alone to continue your efforts.\""
 POD_mummy_spell_of_life.33.a: "你想偷我的作品？！"
 POD_mummy_spell_of_life.33.b: "拿去，别再来烦我了！"
 POD_mummy_spell_of_life.320.t: "卡比洛斯的援助"
 POD_mummy_spell_of_life.320.desc: "For millennia, Cabirus has been pressured on every side from those that sought his knowledge or those that wished to kill him for having it. Most recently, it has been the Tremere clan of vampires. Considering your ever-improving understanding of the Spell of Life, they likely would have turned their attention towards you. Thankfully, you broke their power base and prevented any concentrated efforts to acquire Cabirus' knowledge or your research. While Cabirus has always been reluctant to utilize his abilities for fearing of drawing attention, weakening the Tremere has allowed him to act more freely. The scattered forces are easily dealt with by one of his power. In addition, Cabirus has offered you the opportunity to tie your Spell of Life to Hades, using it as your shadow realm. While it would need stabilization and expansion, such efforts would be easier than carving out your own realm."
 POD_mummy_spell_of_life.320.a: "有趣的提议……"
 POD_mummy_spell_of_life.34.t: "刻茉媞里的打击"
 POD_mummy_spell_of_life.34.desc: "While they lack the overwhelming zealotry of Horus and the Shemsu-Heru, the Children of Osiris and Cult of Isis are nonetheless devoted to protecting the secret of the Spell of Life. While they have been infiltrated by Set on many occasions and nearly lost the Spell of Life to him, they remain loyal to the mission of preventing its abuse. Kemintiri herself suffered greatly at Set's hands, refusing to give him any information regarding it.\n\nNow, they have discovered your research and are moving against you. Where others might assault your haven with an army, they have sent assassins and Kemintiri herself to terminate your research. Unfortunately for you, that means terminating you too."
 POD_mummy_spell_of_life.34.a: "找到她！翻遍每一块石头，绝不放过任何线索……"
 POD_mummy_spell_of_life.34.b: "烧掉那些研究资料，祈祷她别来打扰我们！"
 POD_mummy_spell_of_life.34.stage3.successful_groveling: "你醒来时还活着，显然得到了宽恕。"
 POD_mummy_spell_of_life.34.horus_fight: "荷鲁斯的支持减少了针对你的刺客数量。"
 POD_mummy_spell_of_life.34.horus_begging: "荷鲁斯的支持充分说明了你的可信赖程度。"
 POD_mummy_spell_of_life.35.t: "奥西里斯之子的打击"
 POD_mummy_spell_of_life.35.desc: "尽管他们缺乏荷鲁斯与贤荷鲁那种压倒性的狂热，奥西里斯之子和伊西斯密教依然致力于守护生命神咒的秘密。尽管他们屡次被赛特渗透，并几乎将生命神咒输给他，他们仍然忠于防止其被滥用的使命。\n\n如今，他们发现了你的研究，正在对你采取行动。别人或许会用军队攻打你的避难所，而他们则派出刺客来终结你的研究。对你不幸的是，这也意味着终结你的性命。"
 POD_mummy_spell_of_life.35.a: "找到他们！不放过任何一块石头……"
 POD_mummy_spell_of_life.35.b: "烧毁研究，并祈祷他们放过我们！"
 POD_mummy_spell_of_life.340.t: "刻茉媞里的支持"
 POD_mummy_spell_of_life.340.desc: "As you leave your throne rooms, a tingle suddenly runs up your spine as the shadows in the hallway begin to move. They flow inwards, moving away from the sides and covering the floor. They start to coalesce into a pool before flowing upwards into a humanoid shape. It appears to be first a mannequin with crude features, then a statue with more precise cuts, before finally resolving into the flesh of someone you recognize: Kemintiri.\n\n\"I thank you for helping me restore my memory. To repay the favor, know that I have spoken on your behalf among the followers of Osiris and Isis. They will not interfere with your quest for the Spell of Life. In addition, you will receive the opportunity to speak with the Judges of Ma'at and to make Amenti your home.\""
 POD_mummy_spell_of_life.340.a: "感谢您的支持"
 POD_mummy_spell_of_life.36.t: "库弗尔·阿姆-赫鲁的围攻"
 POD_mummy_spell_of_life.36.desc: "赛特，一位古老的上古耆宿，耗费了无数千年追寻赋予他侄子的生命神咒。难以言喻的恐怖被施加。无数人在他的实验中丧生。无数计谋被构筑以窃取它。他最接近成功的一次是欺骗伊西斯密教的大祭司尼克洛斯，让赛特的一名仆从成为其门徒。然而，即便如此，他也只获得了生命神咒的一部分，导致了被称为忌灵木乃伊的孽物诞生。尽管赛特或许已经退隐，他的后代却未曾放弃他的追求。如今，赛特的斗士库弗尔·阿姆-赫鲁，率领大军伫立于你的避难所前。\n\n“将生命神咒交给我们，我们或许允许你继续你的研究。若抵抗，我们将从你碎裂的思维残片中提取所需的知识。我们必得所求；变的只是所需时间长短。”\n\n#clickable 你的[coterie|E]的实力为[GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0]。\n你敌人的[coterie|E]实力为[GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0]。#!"
 POD_mummy_spell_of_life.36.a: "准备防御工事……"
 POD_mummy_spell_of_life.36.b: "拿着吧……"
 POD_mummy_spell_of_life.37.t: "赛特之子的围攻"
 POD_mummy_spell_of_life.37.desc: "赛特，一位古老的上古耆宿，花费了无数千年追寻赋予其侄子力量的生命神咒。难以言状的恐怖被施加。无数人死于他的实验。他构筑了无数计谋以窃取它。他最接近成功的一次是欺骗了伊西斯密教的高阶祭司尼科洛斯，使赛特的一名仆人成为其门徒。然而即便如此，也只得到了生命神咒的残缺版本，导致了被称为忌灵木乃伊的异形之物。虽然赛特或许已经退隐，但他的子嗣并未放弃他的追求。如今，赛特之子们集结大军，站在你的避世居所之前。\n\n“将生命神咒交给我们，我们或许允许你继续研究。若抵抗，我们将从你破碎的思绪中提取所需的知识。我们终将得到所求；改变的只是耗时长短。”\n\n#clickable 你的[coterie|E]实力为[GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0]。\n你的敌人[coterie|E]实力为[GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0]。#!"
 POD_mummy_spell_of_life.37.a: "准备防御工事……"
 POD_mummy_spell_of_life.37.b: "拿着吧……"
 POD_mummy_spell_of_life.360.t: "盟友的支持"
 POD_mummy_spell_of_life.360.desc: "你的宫廷大臣和间谍总管呈上令人担忧的报告：赛特之子与忌灵木乃伊正集结力量，准备对你发动攻势。由于你自赛特本人以来最接近获得生命神咒，他们认为你有可能完成其未竟之业。然而，你联络盟友与支持者，依靠先前达成的协议，得以直接或间接地对赛特之子施加外交与军事压力。即便是那些无领地可守的游荡者，也发现自己缺乏向你出手的机会。"
 POD_mummy_spell_of_life.360.a: "良好。那些窃贼休想从我的成果中获利！"
 POD_mummy_spell_of_life.40.t: "与玛阿特的判官团的会面"
 POD_mummy_spell_of_life.40.desc: "$POD_debate_debate_strength_header$在你那两位死灵友人的协助下，你打开了一扇通往[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]的门。不幸的是，一片变幻莫测、难以理解的沙海与水域四面环绕着你，每当你的注意力集中其上，水便仿佛与沙互换位置。阴影将大部分区域笼罩于黑暗之中，遮掩着未知的危险与宝藏，令你难以窥见。某种你只能感知为记忆与纯粹能量风暴的存在在你周围盘旋翻涌，不断冲击着你。等离子体与不可名状的物质如雨点般落在你的头顶。你寸步难行，因为沙丘随你移动，海洋进退不定，狂风与你对抗，还有奇异野兽袭击你。前方唯有一条清晰的路径，那是一条你相信是[UmbraGlossary('river_of_death')]的河流。没有阿努比斯的援助，你无法继续前进。在他赶来调查你这非常规入口之前，你必须击退可能潜藏于沙海之中的一切怪物。$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.40.a: "我们等待着阿努比斯。"
 POD_mummy_spell_of_life.40.b: "让我们在门关上之前回去。"
 POD_mummy_spell_of_life.40.effect.success.desc: "你守住战线，直到他到达。"
 POD_mummy_spell_of_life.40.critical.failure.effect.desc: "怨灵们蜂拥而至，迫使你撤退。"
 POD_mummy_spell_of_life.41.t: "观众：阿努比斯的到来"
 POD_mummy_spell_of_life.41.desc: "$POD_debate_debate_strength_header$不知过了多久……也许几天？面前出现了一座巨大的门，由深色玻璃般的石头制成，横跨[UmbraGlossary('river_of_death')]。当你伸手去触碰门把手时，一个奇异的生物从你左侧流沙中升起。与大多数#TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L 死灵#!#!不同，它的身体仿佛既是液体又是固体，流动却保持着形态。那形态是一只半变形的、豺头#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L 狼族#!#!。它的肤色如焦油般漆黑，如同死亡本身。它手持一盏挂在长杆上的发光灯笼，用像空心井中岩石崩塌般的声音说道：\n\n“你胆敢闯入[UmbraGlossary('neter_khertet')]，连[UmbraGlossary('dark_kingdom_of_iron')]的死灵都不敢涉足之地，我为何不立刻处决你？我为何还要考虑护送你前往玛阿特审判者面前？”"
 POD_mummy_spell_of_life.41.a: "我与卡戎之间并无血缚之约。"
 POD_mummy_spell_of_life.41.b: "称量我的心，然后做出你的决定。"
 POD_mummy_spell_of_life.41.c: "我希望保护尼特–赫特。让审判者判定我不配吧。"
 POD_mummy_spell_of_life.42.t: "观众：你会保持忠诚吗？"
 POD_mummy_spell_of_life.42.desc: "$POD_debate_debate_strength_header$The gates swing open, and Anubis leads you through. As you walk through the land, you look around. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] bears echoes of the living lands, formed by the passions and desires placed upon the great cities, tombs and temples of the Kingdom. However, it is far more than mere ruins or echoes. The Kingdom's substance is easily worked by its inhabitants. Their millennia of time has given the Judges of Ma'at and the Shemsu-Heru that have returned more than enough time to create a stunning display of grandeur. Incredible peaks of gold and white limestone rise up in the distance, stretching above the dunes that surround you. Without anything discernibly changing, 42 people now stand encircling you and Anubis, garbed in ornate shendyt and holding pharaonic crooks. They speak in turn, each delivering the next sentence.\n\n\"The Spell of Life does not merely resurrect. It anchors a soul across innumerable cycles. You were not forged, trained, or broken into a vessel capable of sustaining that architecture. To grant you rebirth would invite your own corruption. If not tomorrow, then in a hundred, a thousand, ten thousand years. While we could cast you into Amemait, why should we take such a risk? You could do a great deal of harm before then. Worse, you seek rebirth not solely for balance, but for continuation of self, of will, of identity. Amenti are instruments of Ma'at, not survivors. Your desire to live leaves you vulnerable to the whispering of our enemies. One lifetime — even a righteous one — does not outweigh the long memory of the scales or prove your ability to remain steadfast.\""
 POD_mummy_spell_of_life.42.a: "我并非稚子，能抵御岁月的腐蚀。"
 POD_mummy_spell_of_life.42.b: "我无法抗拒你的裁决。"
 POD_mummy_spell_of_life_42_b_note: "如果法官比你强大，你的成功几率会增加。"
 POD_mummy_spell_of_life.42.c: "我会如先人那般，始终忠诚不变。"
 POD_mummy_spell_of_life.43.t: "观众：你们配得上吗？"
 POD_mummy_spell_of_life.43.desc: "$POD_debate_debate_strength_header$\"When the process was properly governed and overseen, the Shemsu-heru were chosen because they were proven worthy. Their skills deserved to be preserved. Their service to Ma'at was true and would span incarnations. Amen Khal, Hetch-Abehu, and Neith were skilled soldiers and tacticians that proved themselves on the field of battle. Sahu-Ra was a scribe and craftsman beyond compare. Tjehenu proved himself a mage of great potential. Merit-neferu was a merchant of remarkable skill and faithfulness. While she was a queen of political significance, Neferukhayt was chosen for her scholarship, erudition, and thirst for knowledge.\n\nWhat of you deserves to be preserved? What have you done to earn a place among the Shemsu-heru?\""
 POD_mummy_spell_of_life.43.a: "我发现了生命神咒的大部分内容。"
 POD_mummy_spell_of_life.43.b: "我同样是一位声名显赫的战略家。"
 POD_mummy_spell_of_life.43.c: "很少有工匠能比得上我的手艺。"
 POD_mummy_spell_of_life.44.t: "观众：你会分散注意力吗？"
 POD_mummy_spell_of_life.44.desc: "$POD_debate_debate_strength_header$\"You carry beliefs and memories separate from the crusade. You carry loyalties beyond the Undying to forces we are unaware of. You may tempt them into your schemes. You could involve us in foreign conflicts, distracting from the critical crusade against Set's get.\n\nOf equal concern, the balance among the Amenti is carefully maintained. Some, the so-called Ishmaelites, have broken from the proper path. However, they still spent many centuries loyal to the war before they became traitors. Your presence in this place of recovery would fracture our carefully-preserved unity of purpose. Ancient rivalries and schisms would be resurrected among the Undying, worsened by your external loyalties. They would turn their blades from the throats of Setites to each others' throats. Such factionalism and distractions would spell disaster.\""
 POD_mummy_spell_of_life.44.a: "我化解冲突，而非制造冲突。"
 POD_mummy_spell_of_life.44.b: "我的忠诚将进一步稳固这一平衡。"
 POD_mummy_spell_of_life.45.t: "观众：请愿者与阴谋家"
 POD_mummy_spell_of_life.45.desc: "$POD_debate_debate_strength_header$\"Let us say that we accept your arguments and allow you to use this realm. You would then tie your Spell of Life to the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]. However, such an action would allow anyone upon whom you cast your Spell of Life to enter our realm in unsustainable numbers, numbers that would strain the balance. Would you always select only the worthy to join our ranks? Seekers, supplicants, schemers will all approach you. Untold numbers of the ambitious will hunt you. Would you grant them all their wishes, whether it be immortality or the Spell itself? Would you show proper discernment when selecting those to gift eternal rebirth? Would you remain a steadfast protector of the spell's secret, or would it be stolen from you when you trust the undeserving? Every new Undying disrupts the Ma'at and must work to restore it. Will you overwhelm the Ma'at by offering eternal rebirth to too many?\""
 POD_mummy_spell_of_life.45.a: "我懂得如何识别有价值之人。"
 POD_mummy_spell_of_life.45.b: "我能保护咒语。还有什么要紧的？"
 POD_mummy_spell_of_life.46.t: "观众：成功"
 POD_mummy_spell_of_life.46.desc: "The Judges turn to each other and seem to have a debate amongst themselves. Despite them not leaving and the fact that you can see their lips moving, you cannot hear them or determine what they are saying based on their lip movements. At one point, Anubis joins their conversation. The ground almost seeming to rumble, though his words are obscured too. Eventually, they turn back towards you.\n\n\"Very well. We will grant you permission to utilize the [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] in order to regenerate yourself until you are ready to inhabit your body once more. Anubis will grant you the insights necessary to modify your Spell of Life as necessary.\""
 POD_mummy_spell_of_life.46.a: "感谢，我会善加利用的。"
 POD_mummy_spell_of_life.47.t: "观众：失败"
 POD_mummy_spell_of_life.47.desc: "诸神相视，似在彼此间进行一番辩论。尽管他们未曾离开，且你能看见他们的嘴唇在动，却听不到任何声音，也无法从唇语中判断他们在说什么。有一次，阿努比斯加入了他们的谈话。地面几乎都在震动，尽管他的话语也同样被遮蔽。最终，他们转过身来对着你。\n\n“我们已考虑过你的言论，发现其中缺乏智慧。允许你在[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]恢复，终将导致我们以及玛阿特本身的毁灭。作为一种仁慈，我们将允许你和平离开，由阿努比斯护送你。然而，若你再归来，阿努比斯将确保你不再以那些无价值之言打扰我们。”\n\n阿努比斯那豺狼般的口鼻部露出一丝捕食性的微笑，露出他锋利的牙齿。"
 POD_mummy_spell_of_life.47.a: "很好，我接受你的判决。"
 POD_mummy_spell_of_life.47.b: "你们这些腐朽的蠢货，当我推翻你们的王座时，会记住这一天的。"
 POD_mummy_spell_of_life_stage4_umbra_battles_strengths: "#clickable 你当前的军事力量为[GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|V0]\n[umbra|E]及#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!的军事力量估计为[GetPlayer.MakeScope.GetVariable('spectre_shadow_realm_force').GetValue|V0]#!\n\n"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_ADD: "你#P 获得#!$VALUE|0V$军事力量"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_SUBTRACT: "你#N 损失#!了$VALUE|0V$军事力量"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_ADD: "[umbra|E]以及#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!#N 获得#!$VALUE|0V$军事力量"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_SUBTRACT: "[umbra|E]与#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!#P 失去#!$VALUE|0V$军事力量"
 POD_mummy_spell_of_life.50.t: "战胜死灵"
 POD_mummy_spell_of_life.50.desc: "When [GetScriptedCharacterByHistoryID('792600').GetFirstName] first created his version of Spell of Life, he faced the issue of being unable to enter [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], the Ancient Egyptian realm of the dead where Mummies take the time to reconstitute themselves between each death. As such, he secured a very small portion of the [UmbraGlossary('shadowlands')] that he named \"Hades\" as his own [UmbraGlossary('shadow_realm')] and somehow managed to convince Charon, the leader of the [UmbraGlossaryLocalized('shadowlands','Underworld')], to accept this enclave. Some legends lay the credit at their shared Mycenaean heritage, with one text saying that Cabirus has a connection to the Ferrymen, many of whom are Mycenaean too. Regardless of the truth, [UmbraGlossary('hades')] is still a pitiful copy of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and barely able to help Mummies achieve their true immortality.\n\nIf we are to use [UmbraGlossary('hades')] too, we will need to expand its territory and stabilize it. Considering the difficulty [GetScriptedCharacterByHistoryID('792600').GetFirstName] faced, this will not be an easy task. The [UmbraGlossaryLocalized('shadowlands','Underworld')]'s rulers will need to be satisfied so they do not act against us. The #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! will need to be pushed back. The new realm will require defenders. So much to do...\n\n #R This battle uses a score named Military Strength. This score starts by looking at you your champions', and your [coterie|E]'s prowess. It will be raised or decreased during the conflict itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.50.a: "是时候开始了。"
 POD_mummy_spell_of_life.50.b: "这太冒险了。"
 POD_mummy_spell_of_life_hades_start_battle_tt: "[umbra|E]与其#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!的军事力量被#italic 估计#!为#V 1800#!"
 POD_mummy_spell_of_life.51.t: "甜言蜜语"
 POD_mummy_spell_of_life.51.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Somehow, Cabirus convinced Charon to permit an enclave. No one is certain how he achieved this. Thankfully, you do not need to convince him as an enclave has already been established. You need to speak with a local ruler to allow the expansion of [UmbraGlossary('hades')]. Marshals oversee and coordinate the patrols in a region so they will be the ones to encounter [UmbraGlossary('hades')]. The Inspectors and Ministers direct the administrative portions of the local bureaucracy. However, all of them lack the authority to authorize the expansion. Meeting with the local Council of Anacreons is your best chance to convince those with sufficient power to guarantee the matter.\n\nWith the aid of Cabirus and your allied wraiths, you are able to reach the nearest necropolis and begin filling out the forms to request an audience. The forms and procedures take days to complete. Then, the clerk hands you a number that will be called when it is time for your audience. The number is 10,712,461.\n\nAfter weeks of waiting, you are brought before the Council and begin to present your case."
 POD_mummy_spell_of_life.51.a: "首先，我来解释一下为什么……"
 POD_mummy_spell_of_life.51.b: "我相信我们可以达成协议。"
 POD_mummy_spell_of_life.51.effect.success.critical.desc: "他们会援助我们！"
 POD_mummy_spell_of_life.51.effect.success.desc: "明白了！"
 POD_mummy_spell_of_life.51.critical.failure.effect.desc: "冥顽不灵的蠢货……"
 POD_mummy_spell_of_life.52.t: "获取本地帮助"
 POD_mummy_spell_of_life.52.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$When a wraith dies, they enter the underworld covered in a plasmic cocoon called a caul. The caul keeps them docile until it is removed. While the caul is present, they remain in a placid, dreamlike state and generally unaware of their surroundings. During this period, they are extremely vulnerable to attacks, modification, enslavement, moliation, or soulforging. The caul can only be removed by another wraith, but we lack reapers of Stygia or Anubis' aid. Cabirus did find one willing wraith that has been responsible for removing cauls since then. However, this is insufficient to handle the influx of mummies you may introduce. This necessitates a large group of permanent residents in [UmbraGlossary('hades')] to remove cauls.\n\nUnfortunately, wraiths have a strange economy. They trade soulforged goods, soulfire crystals, liquid pathos, powdered angst, relics, Stygian paper, [UmbraGlossary('sunless_sea')] plasm, death ore, and similar items. None of these items could be efficiently and consistently obtained to pay any wraiths. We will need to find some way of obtaining and retaining their service."
 POD_mummy_spell_of_life.52.a: "我的束缚死灵足以应付。"
 POD_mummy_spell_of_life.52.b: "我的研究终将找到解决方案。"
 POD_mummy_spell_of_life.52.c: "我们会达成协议的。"
 POD_mummy_spell_of_life.52.effect.success.desc: "明白了！"
 POD_mummy_spell_of_life.52.critical.failure.effect.desc: "勉强够用，但也凑合了..."
 POD_mummy_spell_of_life.53.t: "断绝与世隔绝的联系"
 POD_mummy_spell_of_life.53.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and the [UmbraGlossaryLocalized('shadowlands','Underworld')] were trapped in a war for countless decades or centuries, only ending when Anubis negotiated a treaty. Before that treaty, while [UmbraGlossary('neter_khertet')] fell quickly, the smaller and less numerous inhabitants of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] still managed to hold their ground. If you replicate some of their defenses, you should be able to withstand any assaults from spectres. Even if the Anacreons revert their decision, you could survive until the problem was resolved.\n\nOne of their greatest feats was to cut [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] off from the rest of the [UmbraGlossaryLocalized('shadowlands','Underworld')]. It was no longer a simple location within a larger realm. Rather, it became a separate realm, only accessible via carefully maintained and controlled paths. Mimicking such a system would allow you to restrict access to [UmbraGlossary('hades')], limiting the threat posed by external forces. However, this would not be easy, cheap, or even possible to accomplish. After all, it was only previously done by Osiris, a vampire of immense power that somehow ascended beyond his vampiric nature, and Anubis, a wraith that exhibited a greater understanding of the [umbra|E]'s nature than the Ferrymen."
 POD_mummy_spell_of_life.53.a: "我会自己来。"
 POD_mummy_spell_of_life.53.b: "当然有负担得起的选择。"
 POD_mummy_spell_of_life.53.c: "成本不是问题。"
 POD_mummy_spell_of_life.53.d: "这是一场愚人之旅。"
 POD_mummy_spell_of_life.53.effect.success.desc: "成功了！"
 POD_mummy_spell_of_life.53.critical.failure.effect.desc: "我们很安全，但并未被切断联系……"
 POD_mummy_spell_of_life.54.t: "不知疲倦的部族"
 POD_mummy_spell_of_life.54.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The ancient records indicate that [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] and the [UmbraGlossaryLocalized('shadowlands','Underworld')] were trapped in a war for countless decades or centuries, only ending when Anubis negotiated a treaty. Before that treaty, while [UmbraGlossary('neter_khertet')] fell quickly, the smaller and less numerous inhabitants of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] still managed to hold their ground. If you replicate some of their defenses, you should be able to withstand any assaults from spectres. Even if the Anacreons revert their decision, you could survive until the problem was resolved.\n\n[UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]'s army consisted of vast legions of Ushabti. These animated statues served as a tireless workforce in peace time and a relentless force in war. Carefully chosen words of power, inscribed into their bodies, empowered these otherwise-common constructs of wood, metal, and stone. We could build constructs of our own or bind wraiths to establish a similar defensive force. If we are fortunate, you will gain enough to serve as more than simple guardians."
 POD_mummy_spell_of_life.54.a: "召集工匠。"
 POD_mummy_spell_of_life.54.b: "获取更高级的制造材料。"
 POD_mummy_spell_of_life.54.c: "准备好灵能者。"
 POD_mummy_spell_of_life.54.effect.success.desc: "看我的军队！"
 POD_mummy_spell_of_life.54.critical.failure.effect.desc: "勉强够用……"
 POD_mummy_spell_of_life_bound_wraith_strength_bonus: "每绑定一个死灵，便获得一份力量"
 POD_mummy_spell_of_life.55.t: "维系回忆"
 POD_mummy_spell_of_life.55.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The [UmbraGlossaryLocalized('shadowlands','Underworld')] is a realm of memories. Relics and places fade as they are forgotten. As the Greek afterlife and underworld, [UmbraGlossary('hades')] is inextricably linked with the Greek religion. With the rise of Christianity and the decline of Hellenistic culture, [UmbraGlossary('hades')] has declined with it. This has greatly contributed to the [UmbraGlossary('shadow_realm')]'s general decline and instability.\n\nTo our good fortune, Christianity uses the Greek word \"Hades\" to refer to a temporary holding area for souls, both good and bad, while awaiting judgment. Of the 3 portions of the Christian Hades, one recess is sometimes referred to as Tartarus. If you could strengthen that connection, you could establish [UmbraGlossary('hades')] in the minds of mortals and thereby stabilize it so long as Christianity remains in the popular consciousness. Unfortunately, such an action would weaken our ties to our Greek heritage."
 POD_mummy_spell_of_life.55.a: "与牧师交谈。"
 POD_mummy_spell_of_life.55.b: "我们将复兴希腊化文化。"
 POD_mummy_spell_of_life.56.t: "掠夺队"
 POD_mummy_spell_of_life.56.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The time has come. [UmbraGlossary('hades')]' current borders have been secured and stabilized as best we could. Your forces stand ready to march forth and push back the spectre hordes. Your wraiths are prepared to claim the territory and retrieve our souls when the time comes. Your soldiers are assembled to hold the territory once captured.\n\n[UmbraGlossary('hades')] has always existed in an isolated area of the [UmbraGlossaryLocalized('shadowlands','Underworld')], allowing spectres to run rampant beyond its borders. Before the assault begins, the option exists to send out raiding parties to harry them. If it worked, the raids would thin their numbers and make the upcoming conflict easier. However, such raids would carry great risks."
 POD_mummy_spell_of_life.56.a: "从左侧接近他们以……"
 POD_mummy_spell_of_life.56.b: "你们当中有些人可能会牺牲……"
 POD_mummy_spell_of_life.56.c: "不值得冒这个险。"
 POD_mummy_spell_of_life.56.effect.success.desc: "领主大人，他们的人数已减少。"
 POD_mummy_spell_of_life.56.critical.failure.effect.desc: "全军覆没了，我的领主。"
 POD_mummy_spell_of_life.57.t: "战斗已经开始"
 POD_mummy_spell_of_life.57.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$This is the last battle. If your Military Strength is lower than the forces opposing you by the end, your road will end here.#!\n\nYou lead your forces out of the protected enclave of [UmbraGlossary('hades')]. An endless horde of spectres await you, seeming to constantly push against the defenses you erected. Their pale, elongated forms immediately sense your emergence and begin swarming towards your army. The concentrated presence of Oblivion-taint is a tangible reek, polluting the air. The vast majority are skeletal figures with claws to rip flesh or icy black fires burning in their eyes. A few child-size beasts run between legs, cackling madly. Feral, bestial monsters with multiple rows of shark teeth and torn-apart masses of tissue hanging from misshapen skeletons march among the front ranks. Their lust, hate, and passion is readily visible, almost seeming to emanate from their hulking forms. All of them are eager to taste the blood of the living, steal some shred of that vitality, and cause pain and destruction. Despite that thirst, they act in concert, as a single mass, rather than rushing ahead. A few beings with patchy, seeping lesions and tumors drive them forward in organized formations according to some hidden plan.\n\nWhile they are being commanded and focused, these common spectres are not independently intelligent or capable of strategic response to quick action. If you can get the time and space to maneuver, a well-timed push could disrupt the horde and allow your forces to overwhelm a portion of them. Alternatively, your reserves, who mainly stayed in the mortal world so far, could be called upon. While they would serve as little more than cannon fodder, this could still make a difference."
 POD_mummy_spell_of_life.57.a: "我们现在不能停下！前进！"
 POD_mummy_spell_of_life.57.b: "召集我们的援军！把他们所有人都调来！"
 POD_mummy_spell_of_life.58.t: "被阴影吞噬的圣徒"
 POD_mummy_spell_of_life.58.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$The horde is beginning to weaken. Gaps are opening up in their lines, allowing you to push ever deeper into their formations. Only one obstacle stands in the way of expanding [UmbraGlossary('hades')], the spectre's leader.\n\nAfter chopping through innumerable spectres, you see a human with a mask patterned after the Greek mask of tragedy. They are dressed in ragged black robes spotted by leprous white patches and holding a shattered scythe. Tarnished and barbed spikes protrude through the robes with a viscous, black liquid slowly dripping off and splattering against the ground where it seems to sizzle. Protecting them are multiple gaping maws and wicked claws held together by a tangle of sinews and taut skin. Translucent tentacles emerge from some of their tumorous masses of flesh, whipping around and killing any spectres that get too close, reflecting their barely-contained violence. You and your allies close in for what will be a grand confrontation.\n\nEvery strike from the scythe-bearer is precise, and their blows fall upon your forces as inevitably as entropy. Each soldier struck seems to disassemble into a homogeneous blob of carbon, some metals, and a slowly expanding cloud of gases though even those quickly decompose into their invisible components before those too are annihilated in full. This is in sharp contrast to the monstrosities whose ground-shattering punches rain down around you. Each blow covers the repositioning of their master, allowing for more complex strategies. While plenty of emotions are exhibited by the beasts, none of those emotions are granting you insights to read or weaknesses to exploit. You manage to knock off the mask, but that provides little help. The blackened, eyeless, mouthless face of this living shadow reveals little, beyond the inevitable embrace of all things in the arms of the Void.\n\nEven as your forces sweep around you and begin to overtake the spectre horde, there is little doubt that this will be a fight for your existence, one that will push you to your limits. Should it win, the battle will turn against your army, and there will be little hope of success."
 POD_mummy_spell_of_life.58.a: "没有回头路了……"
 POD_mummy_spell_of_life.58.b: "冲锋！"
 POD_mummy_spell_of_life.58.c: "即便要付出我的理智！"
 POD_mummy_spell_of_life.58.d: "不惜一切代价！"
 POD_mummy_spell_of_life.58.effect.success.desc: "他们全都倒下了..."
 POD_mummy_spell_of_life.58.effect.failure.desc: "虚空的甜美虚无……"
 POD_mummy_spell_of_life.58.final_check: "将根据你的军事力量与怨灵的军事力量对比，来决定最终结果。"
 POD_mummy_spell_of_life.58.critical.failure.effect.desc: "孤寂而平坦的沙砾无尽延伸……"
 POD_mummy_spell_of_life.59.t: "历经艰辛，终获胜利"
 POD_mummy_spell_of_life.59.desc: "经过数小时（？）的激战，你终于将最后的野兽消灭，迫使持镰者节节败退。紧接着，在几乎不到一眨眼的功夫里，它的身体开始扭曲、模糊、变形、皱缩、折叠，最终只是……消失了。你喘着粗气，做出一个至少能安抚自己的手势，环顾四周。你目睹最后的怨灵被斩灭。你的士兵已经开始部署防御工事，以确保这片领土在你的人民能够正式接管之前不被侵扰。\n\n几天后，你看着[UmbraGlossary('hades')]的新边界在你面前稳定下来。它的疆域逐渐清晰，将永恒的灵魂风暴驱散殆尽，完整地占据了这片土地。死灵们随时准备收集并援助任何可能前来此地的木乃伊。至此完成，是时候返回家园，完成生命神咒的最后一部分了。"
 POD_mummy_spell_of_life.59.a: "那块符文正好能放进去，现在我只需要……"
 POD_mummy_spell_of_life.60.t: "战胜死灵"
 POD_mummy_spell_of_life.60.desc: "当[GetScriptedCharacterByHistoryID('792600').GetFirstName]初次创造他的生命神咒版本时，他面临着一个问题：无法进入[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]那个古埃及的死者界域，木乃伊在每次死亡之间会花时间重塑自身。为此，他在[UmbraGlossary('shadowlands')]中划出了一小块属于自己的区域，将其命名为“冥府”，作为他的[UmbraGlossary('shadow_realm')]，并设法说服了[UmbraGlossaryLocalized('shadowlands','Underworld')]的首领卡戎接受这片飞地。即便如此，[UmbraGlossary('hades')]仍然不过是[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]的一个拙劣翻版。\n\n尽管有诸多缺陷，你仍需复制卡比洛斯开创新[UmbraGlossary('shadow_realm')]的壮举。考虑到卡比洛斯当年面临的困难，这绝非易事。你与卡戎之间缺乏那种可以获批的关联，因此必须绕过或安抚冥河的势力，确保其不会对我们出手。必须将#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!击退。必须准备好法术来占领并守住这片领土。新的界域需要守卫者。令人烦恼的是，你必须在冥河发现你的存在并恢复元气发起进攻之前站稳脚跟。此外，在你完成使命之前，你的存在本身就会吸引越来越多的怨灵大军，所以任何拖延都会让最终决战变得更加艰难。要做的事如此之多，时间却如此之少……\n\n#R 这场战斗使用名为军事力量的分数。该分数初始取决于你、你的勇士以及你的[coterie|E]的勇武。冲突过程中，它会被提升或降低。\n你的初始军事力量为[GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.60.desc.b: "When [GetScriptedCharacterByHistoryID('792600').GetFirstName] first created his version of Spell of Life, he faced the issue of being unable to enter [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], the Ancient Egyptian realm of the dead where Mummies take the time to reconstitute themselves between each death. As such, he secured a very small portion of the [UmbraGlossary('shadowlands')] that he named \"Hades\" as his own [UmbraGlossary('shadow_realm')] and somehow managed to convince Charon, the leader of the [UmbraGlossaryLocalized('shadowlands','Underworld')], to accept this enclave. Even still, [UmbraGlossary('hades')] is still a pitiful copy of [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\nDespite its flaws, you will need to replicate Cabirus' feat of creating a new [UmbraGlossary('shadow_realm')]. Considering the difficulty Cabirus faced, this will not be an easy task. You lack such a connection with Charon to receive authorization so the Stygian government will need to be bypassed or placated to ensure they do not act against us. The #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Spectres#!#! will need to be pushed back. Due to the recent Great Maelstrom, they are particularly plentiful, though Stygia's distraction may aid us. Spells must be prepared to claim and hold the territory. The new realm will require defenders. Annoyingly, you have to establish yourself before the Stygian bureaucracy discovers your presence and recovers enough to attack. In addition, your mere presence will attract ever-greater hordes of spectres until the job is complete so any delays will make the final battle harder. So much to do, so little time...\n\n #R This battle uses a score named Military Strength. This score starts by looking at you your champions', and your [coterie|E]'s prowess. It will be raised or decreased during the conflict itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.60.a: "是时候开始了。"
 POD_mummy_spell_of_life.60.b: "这太冒险了。"
 POD_mummy_spell_of_life_independent_start_battle_tt: "[umbra|E]与其#TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L 怨灵#!#!的军事力量被#italic 估计#!为#V 2300#!"
 POD_mummy_spell_of_life.61.t: "夜间巡逻"
 POD_mummy_spell_of_life.61.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$你正准备踏上进入[umbra|E]的旅程。然而，如果你以为自己的努力即便成功也会迅速完成，那就大错特错了，而你无法在短时间内返回，因为这类工程在完成之前不能中断。反对你计划的死灵可能会进入[Glossary('皮囊之地','game_concept_skinlands_desc')]威胁你的界域。更为棘手的是，你的对手、敌人以及不忠的封臣必定会趁势攻击你的力量。有些人会觊觎你对生命神咒的研究，而另一些人则只想在你离开之际篡夺你的权位。这样的攻击会切断通讯和补给线，将你困在[UmbraGlossaryLocalized('shadowlands','冥界')]之中，使你无法获得援助。\n\n这给你留下两个选择。你可以离开，并希望你的界域能在没有你直接监督的情况下屹立不倒。或者，你也可以在此驻扎一部分兵力守卫后方，同时清楚知道他们在另一边会有所缺失。"
 POD_mummy_spell_of_life.61.a: "我的界域很强大。"
 POD_mummy_spell_of_life.61.b: "我们后方必须保证安全。"
 POD_mummy_spell_of_life.61.effect.success.desc: "我们团结一心！"
 POD_mummy_spell_of_life.61.critical.failure.effect.desc: "我们是否团结一致？"
 POD_mummy_spell_of_life.62.t: "区域地下世界"
 POD_mummy_spell_of_life.62.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$你广泛的研究展现了一个有趣的机会。[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]建立于[UmbraGlossary('neter_khertet')]之内，那是古埃及的冥界。[Glossary('断绝','podgloss.kakuri')]曾是阿伊努人的冥界，在[Glossary('艾玛·欧','podgloss.emmao')]——曾为阿伊努亡者守护者——将其转变为一个符合[Glossary('阎魔王','podgloss.yamaking')]身份的[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]之前。这些先例表明，区域冥界作为更大事业的立足点具有巨大潜力。它们相对较少怨灵侵扰，并能利用当地信仰来提供一定程度的稳定性。此外，它们的管理者、照料者和守护者也能辅助我们自己的努力。\n\n尽管基督教的支配地位已经消除了大部分此类界域，但仍有一些存续。冥河城可能宣称拥有所有西方冥界，但[UmbraGlossary('umi')]同样宣称拥有整个太平洋，却从未能彻底压制所有独立的灵界。如果你不找到一个区域冥界并妥善掌控它，你那个追求独立[UmbraGlossary('shadow_realm')]的疯狂探索将注定失败。因此，唯一的问题只是需要花费多长时间。"
 POD_mummy_spell_of_life.62.a: "搜查我们的记录！"
 POD_mummy_spell_of_life.62.b: "招募更多图书馆员来协助我。"
 POD_mummy_spell_of_life.62.effect.success.desc: "找到了！"
 POD_mummy_spell_of_life.62.critical.failure.effect.desc: "这么多延误……"
 POD_mummy_spell_of_life.620.t: "死亡诸神"
 POD_mummy_spell_of_life.620.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$当死灵死亡时，它们会进入冥界，被一层被称为胎膜的等离子茧所包裹。胎膜使其保持温顺，直到被移除。在胎膜存在期间，它们处于平静、如梦般的状态，通常对周围环境毫无察觉。在此期间，它们极易受到攻击、改造、奴役、塑形或灵魂锻造的影响。胎膜只能由另一名死灵移除，但我们缺乏冥河城的收割者或阿努比斯的援助。\n\n你所使用的区域冥界提供了一个有趣的机会：我们自己的阿努比斯。这样的界域已经包含了许多永久居民，并有一位死亡之神管理守护着它。他们可以收集刚来到此地的木乃伊，并补充你的防御力量。然而，他们的忠诚属于自己的人民，因此你需要争取他们站到你这边。这并不容易，因为他们可能会将你视为入侵势力，比冥河城那专横的官僚体制好不了多少。有助于你的一件事是，你不需要他们的整个界域，至少最初如此。"
 POD_mummy_spell_of_life.620.desc.b: "$POD_mummy_spell_of_life.620.desc$另一个助力是最近一次大死涡所造成的混乱。怨灵的涌入将使他们更加迫切地需要你的支持。"
 POD_mummy_spell_of_life.620.a: "我们为一个小地区提供保护。"
 POD_mummy_spell_of_life.620.effect.success.desc: "他们同意"
 POD_mummy_spell_of_life.620.critical.failure.effect.desc: "这么多延误……"
 POD_mummy_spell_of_life.63.t: "在混乱中钓鱼"
 POD_mummy_spell_of_life.63.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$古代记录显示，阿蒙提与冥河城陷入了一场持续数十乃至数百年的战争。[UmbraGlossary('neter_khertet')]很快陷落，而战争仅在阿努比斯赐予摆渡人一份不可思议的馈赠后才告终结。\n\n那已是久远之事，而冥河城愈发僵化。毫无疑问，冥河城绝不会容许新的[UmbraGlossary('shadow_realm')]诞生，也不会容忍附属冥界的独立。他们可能会派遣自身力量对付你，或者进一步煽动怨灵对抗你。无论如何，他们的干预将使局势大为复杂。然而，冥河城若要对你采取行动，他们需要及时察觉你的动向，并拥有可调动的兵力。\n\n这是一个削弱双方潜在敌人的良机。若能寻得怨灵“诱饵”，你可安排他们袭击附近的死城。但若你的同谋被擒，则可能暴露你的意图，使他们转而对付你。"
 POD_mummy_spell_of_life.63.a: "备好诱饵，给我找个死灵来施放它。"
 POD_mummy_spell_of_life.63.b: "我们将加剧大死涡的混乱。"
 POD_mummy_spell_of_life.63.effect.success.desc: "你的密探逃脱了，无人起疑"
 POD_mummy_spell_of_life.63.critical.failure.effect.desc: "你的密探被抓住了"
 POD_mummy_spell_of_life.630.t: "贿赂官员"
 POD_mummy_spell_of_life.630.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$附近的死城和冥河官僚或许会被分散注意力，但他们仍然构成威胁。你的行为是非法的，绝不会被公开允许。然而，他们的死亡并未使这些死灵变得廉洁。指挥官负责监督和协调区域内的巡逻，因此他们会首先遇到你。督察和部长则掌管地方行政机构的管理部分，并操控情报网络。一笔恰当的贿赂将确保巡逻队绕开你的领地，延迟官方发现。更多的贿赂能保证最初对我们的攻击只是象征性的。\n\n如今，要获得这样的服务，代价将会高昂。死灵有一种奇特的经济体系。他们交易魂锻物品、魂火晶体、液态执念、粉末状惧念、冥河纸、[UmbraGlossary('sunless_sea')]灵质、死亡矿石等类似物品，但这些物品要么难以获得，要么价值不足。遗物——当其穿越尸幕时记忆凝成的形态——是完美的选择。它们不会损坏，能替代易耗品，无法追查到我们，并且易于换购其他所需之物。\n\n如果你有能力，或许可以制造一些。死者什一税明确指出，有时用压入死者眼中的物品可以制造遗物，即使死者不是希腊人，也未信奉希腊宗教。某些魔法或许能消除这一过程的不确定性，甚至免除牺牲的必要。"
 POD_mummy_spell_of_life.630.a: "俑像可以穿透尸幕。"
 POD_mummy_spell_of_life.630.b: "把食物给囚犯们……然后，处决他们。"
 POD_mummy_spell_of_life.630.c: "带出囚犯，准备仪式。"
 POD_mummy_spell_of_life.630.d: "我那灵能者跑哪儿去了？"
 POD_mummy_spell_of_life.630.e: "召喚一名灵能者到我的宫廷。"
 POD_mummy_spell_of_life.64.t: "断绝与世隔绝的联系"
 POD_mummy_spell_of_life.64.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$古代记录显示，阿蒙提与冥河城陷入了一场持续数十乃至数百年的战争。[UmbraGlossary('neter_khertet')]很快陷落，而战争仅在阿努比斯赐予摆渡人一份不可思议的馈赠后才告终结。倘若你能复制[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]的部分防御手段，便应能抵御任何死灵的侵袭。即便冥河城最终注意到你，你也能撑到问题解决之时。\n\n其最伟大的壮举之一，便是将[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]与[UmbraGlossaryLocalized('shadowlands','Underworld')]的其他部分隔绝开来。那不再只是广袤界域中的一个简单所在，而成了独立的一界，唯有经由精心维护和掌控的道路方能抵达。模仿这样的体系，你就能限制他人进入你新的[UmbraGlossary('shadow_realm')]，从而降低外部势力构成的威胁。然而，此事并不容易，代价不菲，甚至未必可行。毕竟，此前唯有奥西里斯以某种方式超越其吸血鬼本性、拥有无上力量的吸血鬼与阿努比斯一位对[umbra|E]本质理解远超摆渡人的死灵——曾做到过。"
 POD_mummy_spell_of_life.64.desc.b: "$POD_mummy_spell_of_life.64.desc$幸运的是，最近的死涡略微削弱了[umbra|E]，使得对其进行篡改比平时更容易。"
 POD_mummy_spell_of_life.64.a: "我会自己来。"
 POD_mummy_spell_of_life.64.b: "当然有负担得起的选择。"
 POD_mummy_spell_of_life.64.c: "成本不是问题。"
 POD_mummy_spell_of_life.64.d: "这是一场愚人之旅。"
 POD_mummy_spell_of_life.64.effect.success.desc: "你在无日的海洋中漂浮……"
 POD_mummy_spell_of_life.64.critical.failure.effect.desc: "束缚于现实之中……"
 POD_mummy_spell_of_life.640.t: "不知疲倦的部族"
 POD_mummy_spell_of_life.640.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$古代记录显示，阿蒙提与冥河城陷入了一场持续数十乃至数百年的战争。[UmbraGlossary('neter_khertet')]很快陷落，而战争仅在阿努比斯赐予摆渡人一份不可思议的馈赠后才告终结。若你能重现[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]的部分防御手段，便应能抵挡任何死灵的侵袭。即使冥河城终究察觉到你，你也能支撑到问题解决。[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]的军队由庞大的乌沙布提军团组成。这些活化雕像在和平时期是不知疲倦的劳力，在战争时期则是无情的力量。精心挑选的权能之言，铭刻于其躯体之上，赋予这些原本普通的木、铁与石造物以力量。我们可以建造自己的造物，或束缚死灵，以建立类似的防御力量。若侥幸成功，你所得之物将远不止于充当简单的"
 POD_mummy_spell_of_life.640.a: "召集工匠。"
 POD_mummy_spell_of_life.640.b: "获取更高级的制造材料。"
 POD_mummy_spell_of_life.640.c: "准备好灵能者。"
 POD_mummy_spell_of_life.640.effect.success.desc: "看我的军队！"
 POD_mummy_spell_of_life.640.critical.failure.effect.desc: "勉强够用……"
 POD_mummy_spell_of_life.65.t: "逝者已矣，但未被遗忘"
 POD_mummy_spell_of_life.65.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$数世纪乃至数千年间，[UmbraGlossaryLocalized('shadowlands','冥界')]收集着众多灵魂，尤其是那些未了心愿或暴亡之人，往往化为死灵。可以断言，你昔日的一些勇士与盟友便在其列。若能将他们招至麾下，他们必是忠诚而强大的助力。他们的援助在即将到来的战斗中弥补你的兵力，并未来照料你的[UmbraGlossary('shadow_realm')]，都将价值无可估量。然而，毋庸置疑的是，他们的心智与躯体将遭受严重削弱，寻找并恢复他们还需耗费宝贵的时间。"
 POD_mummy_spell_of_life.65.a: "记住你曾经是谁……"
 POD_mummy_spell_of_life.65.b: "不值得花这个时间。"
 POD_mummy_spell_of_life.65.effect.success.desc: "欢迎回来"
 POD_mummy_spell_of_life.65.critical.failure.effect.desc: "浪费时间……"
 POD_mummy_spell_of_life.66.t: "掠夺队"
 POD_mummy_spell_of_life.66.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$时机已至。你的力量已整装待发，准备进军并击退怨灵大军。你的死灵已准备好夺取领土，并在适当时机取回我们的灵魂。冥界本土的死神已将其力量融入你的魔法之中。你的士兵已集结完毕，一旦攻下领土便立即驻守。\n\n你选择的冥界因远离任何冥府势力中心而始终存在于偏远之地，这使得怨灵得以在其边境之外肆虐横行。在进攻开始之前，你可选择派出突袭小队去骚扰它们。若此举奏效，将削弱其兵力，使接下来的战斗更为轻松。然而，这样的突袭也将带来巨大风险。"
 POD_mummy_spell_of_life.66.a: "首先，你需要..."
 POD_mummy_spell_of_life.66.b: "你们当中有些人可能会牺牲……"
 POD_mummy_spell_of_life.66.c: "不值得冒这个险。"
 POD_mummy_spell_of_life.66.effect.success.desc: "领主大人，他们的人数已减少。"
 POD_mummy_spell_of_life.66.critical.failure.effect.desc: "全军覆没了，我的领主。"
 POD_mummy_spell_of_life.67.t: "战斗已经开始"
 POD_mummy_spell_of_life.67.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$这是最后的战斗。若在结束时，你军事力量低于对方势力那么你的道路就此终结。#!\n\n你率领军队离开了你所选冥界中庇护飞地。无尽的怨灵大军在等待着你，似乎不断冲击着你所筑起的防线。它们苍白而拉长的形体立刻察觉了你的出现，开始如潮水般涌向你的军队。湮灭污染所凝集的威压化作可触的恶臭，污染着空气。绝大多数是利爪撕裂血肉的骷髅身影，或眼中燃着冰冷黑焰的怨灵。少数孩童大小的野兽在腿间穿梭，疯狂地咯咯尖笑。野狼般凶残的怪物，长着数排鲨鱼般的利齿，残缺的组织块从畸形骷髅上垂落，行于前排行列。它们的欲望、仇恨与炽情清晰可见，几乎要从它们庞大的形体中散发而出。它们全都渴望品尝生者的鲜血，窃取一丝生机，并带来痛苦与毁灭。尽管怀着这种渴望，它们却如一个整体般协同行动，而非贸然冲前。一些身上布满斑驳渗漏伤口和肿瘤的存在，按照某种隐秘计划，将它们驱赶成整齐的队形前进。\n\n尽管这些大众级怨灵被指挥且目标明确，但它们并非拥有独立智慧，也无力对快速行动作出战略回应。若能争取到时间和空间进行机动，一次恰到好处的突袭便能扰乱这股洪流，让你的军队击溃其中一部分。此外，你也可以召唤那些至今大多留在凡俗世界的后备军。尽管他们充其量不过是炮灰，但这仍可能扭转局势。"
 POD_mummy_spell_of_life.67.a: "我们现在不能停下！前进！"
 POD_mummy_spell_of_life.67.b: "召集我们的援军！把他们所有人都调来！"
 POD_mummy_spell_of_life.67.critical.failure.effect.desc: "孤寂而平坦的沙砾无尽延伸……"
 POD_mummy_spell_of_life.670.t: "被阴影吞噬的圣徒"
 POD_mummy_spell_of_life.670.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$那支大军开始显露出疲态。它们的阵列中出现了裂隙，让你得以更深地楔入其阵型之中。要创造[UmbraGlossary('shadow_realm')]，只剩一个障碍——怨灵的首领。\n\n在砍翻了无数怨灵之后，你看到一个人，戴着以希腊悲剧面具为原型的假面。他们身着褴褛的黑袍，其上点缀着麻风病般的白色斑块，手持一柄碎裂的镰刀。锈蚀而带倒刺的尖刺穿透袍服，粘稠的黑色液体缓缓滴落，砸在地上嘶嘶作响。护在其周遭的是众多大张的巨口与狰狞的利爪，由纠缠的筋腱和紧绷的皮肤维系在一起。半透明的触须从某些瘤状肉团中伸出，狂舞抽打，将任何靠得太近的怨灵碾杀殆尽，折射出其几近失控的暴戾。你和你的盟友合围而上，准备迎接这场惊天对决。\n\n持镰者每一击都精准无比，其攻势如熵增一般不可避免地倾泻在你的军阵之上。每个被击中的士兵似乎都分解为一团均质的碳、若干金属，以及一片不断膨胀的气体云，而那些气体也迅速化为无形组分，随即彻底湮灭。这与那些巨兽形成鲜明对比，它们的撼地重拳如雨点般砸落四周。每一击都为它们主人的重新部署提供掩护，使得更为复杂的战术得以施展。虽然这些怪物表露了诸多情绪，但没有一种情绪能让你找到可读的破绽或可用的弱点。你设法打落了面具，但那几乎毫无帮助。这张漆黑、无眼、无口的活影之脸揭示甚少，除了万物终将不可避免地被拥入虚空的怀抱。\n\n即便你的军势在四周席卷，开始压制怨灵大军，毫无疑问，这将是一场关乎你存亡的战斗，一场将把你逼至极限的较量。"
 POD_mummy_spell_of_life.670.a: "没有回头路了……"
 POD_mummy_spell_of_life.670.b: "冲锋！"
 POD_mummy_spell_of_life.670.c: "即便要付出我的理智！"
 POD_mummy_spell_of_life.670.d: "不惜一切代价！"
 POD_mummy_spell_of_life.670.effect.success.desc: "他们全都倒下了..."
 POD_mummy_spell_of_life.670.effect.failure.desc: "虚空的甜美虚无……"
 POD_mummy_spell_of_life.670.final_check: "将根据你的军事力量与怨灵的军事力量对比，来决定最终结果。"
 POD_mummy_spell_of_life.670.critical.failure.effect.desc: "孤寂而平坦的沙砾无尽延伸……"
 POD_mummy_spell_of_life.68.t: "历经艰辛，终获胜利"
 POD_mummy_spell_of_life.68.desc: "经过数小时（？）的激战，你终于将最后的野兽消灭，迫使持镰者节节败退。紧接着，在几乎不到一眨眼的功夫里，它的身体开始扭曲、模糊、变形、皱缩、折叠，最终只是……消失了。你喘着粗气，做出一个至少能安抚自己的手势，环顾四周。你目睹最后的怨灵被斩灭。你的士兵已经开始部署防御工事，以确保这片领土在你的人民能够正式接管之前不被侵扰。\n\n几天后，你看着[UmbraGlossary('shadow_realm')]的新边界在你面前稳定下来。它的疆域逐渐清晰，将永恒的灵魂风暴驱散殆尽，完整地占据了这片土地。死灵们随时准备收集并援助任何可能前来此地的木乃伊。至此完成，是时候返回家园，完成生命神咒的最后一部分了。"
 POD_mummy_spell_of_life.68.a: "那块符文正好能放进去，现在我只需要……"
 POD_mummy_spell_of_life.610.t: "活生生的噩梦"
 POD_mummy_spell_of_life.610.desc: "经过数小时（？）的激战，你终于消灭了最后一批野兽，迫使那名持镰者节节败退。然而，就在转瞬之间，它的身体开始扭曲、模糊、变形、皱缩、折叠，直至……彻底消失。趁你喘息之际，姑且当作一种安抚的举动，你环顾四周，目睹最后几个怨灵被斩落。你的士兵已开始构筑防御工事和堡垒，以坚守此地，直到你的人民能够妥善接管。\n\n数日之后，你能感受到新的[UmbraGlossary('shadow_realm')]在你周围趋于稳定。其边界逐渐清晰，将永不止息的灵魂风暴推拒在外。此番大功告成，是时候归乡了。\n\n然而不幸的是，你长期的缺席以及对你身死或衰落的揣测，已使朝廷内部的派系暗流涌动，而你的对手们也在觊觎你的领土。整个界域陷入动荡，各方势力争相图谋上位。更糟的是，他们都抱持同一个念头：趁你如今元气大伤之际除掉你，便能在这场暴力漩涡最终平息后，对残余的一切拥有最强有力的宣称。在一场最后的决战中，你伤痕累累的军队必须鼓起勇气或展现魅力，集结一切可能的忠诚残余，让这些蠢货忆起那把王座为何从一开始就属于你。唯有如此，你才有时间完成生命神咒。"
 POD_mummy_spell_of_life.610.a: "我的人民仍然坚定不移，忠诚可靠。"
 POD_mummy_spell_of_life.610.b: "我的同谋们了解谁忠诚可靠，可以除掉其余的人。"
 POD_mummy_spell_of_life.610.c: "我的战术天赋确保战场胜利。"
 POD_mummy_spell_of_life.610.d: "单挑将证明谁才是合格的宣称者。"
 POD_mummy_spell_of_life.610.e: "人民属于我。无人能抵挡这普通级别的浪潮。"
 POD_mummy_spell_of_life.610.f: "你不是历史上第一个试图这么做的人，所以我早有准备。"
 POD_mummy_spell_of_life.610.effect.success.desc: "你重建了某种秩序。"
 POD_mummy_spell_of_life.610.critical.failure.effect.desc: "给我回来！不！别那样做！"
 POD_mummy_spell_of_life.70.t: "荷鲁斯的恩典"
 POD_mummy_spell_of_life.70.desc: "你前来觐见荷鲁斯。“向您致意，我的领主。我知道您质疑过我的行动和动机。您认为我违背了您法典中的第六条戒律。长久以来，我一直在追查所有与曾创造我们‘贤荷鲁’的生命神咒相关的线索。我收集了各种保存有该神咒细节的历史和魔法记录。我曾在[umbra|E]中度过时光，以确定[UmbraGlossary('shadow_realm')]与生命神咒之间的正确联系。如今我的研究已完成，我已获得了大部分幸存的记录。我特意寻求您之外的替代来源，以确保收集尽可能广泛的资料。现在，我将这一切交给您销毁，并请求您从我的记忆中抹去生命神咒。”\n\n荷鲁斯静坐片刻，默默审视着你。“在你之墓遭到初次袭击后，我曾考虑过发动连绵不绝的攻击，直到你倒在更忠诚的会友面前，你的研究被焚毁。庆幸的是，我并未选择那条路，因为今日你已自我救赎。我感谢你的效力，并乐意销毁这些记录。然而，你的行为展现了极大的智慧。在众多失败者中，你证明了你能负责任地运用生命神咒。尽管我禁止你向他人传授此咒，但我会允许你保留对它的记忆，并依你所见加以使用。你已证明自己配得上这份考量。我甚至会助你完善生命神咒。此外，我将在贤荷鲁中颁布一道法令，保护你，守护这位对抗赛特战争中的忠诚助手，防止你的知识被窃取。做得好，我善良而忠实的仆人。”"
 POD_mummy_spell_of_life.70.desc.b: "你前来觐见荷鲁斯。“向您致敬，我的领主。如您所知，我花费了很长时间追寻所有与生命神咒相关的线索，那曾是用来创造贤荷鲁的神咒。在您的协助下，我努力理解这道神咒。我收集了各种历史与魔法记录，其中保存了关于神咒的一些细节。我在[umbra|E]中度过了时间，以确定[UmbraGlossary('shadow_realm')]与生命神咒之间的正确联系。随着研究完成，我已获得大部分尚存的记录。现在，我将一切交给您销毁，并请求您将生命神咒从我的记忆中抹去。”\n\n荷鲁斯静坐片刻，默默打量着你。“虽然我曾对你这项追求的明智性有所质疑，但现在我明白，当初决定协助你的工作是正确的。我感谢你的服务，并乐于销毁这些记录。然而，你的行动展现出了极大的智慧。在众多失败者面前，你证明了能够负责任地运用生命神咒。虽然我禁止你将神咒传授他人，但我会允许你保留对此的记忆，并按其判断加以使用。你已证明自己配得上这一考虑。我甚至会帮助你完善生命神咒。此外，我将在贤荷鲁中颁布法令保护你，在这场对抗赛特的战争中守护这样一位忠诚的助手，防止你的知识被盗取。做得好，我忠实而良好仆人。”"
 POD_mummy_spell_of_life.70.a: "感谢您，我的领主。"
 POD_mummy_spell_of_life_cant_teach_spell_of_life: "无法再传授生命神咒"
 POD_mummy_spell_of_life_make_only_shemsuheru: "如果你还没有获得生命神咒，现在它将为你创造贤荷鲁。"
 blessing_of_horus_modifier: "荷鲁斯的祝福"
 blessing_of_horus_modifier_desc: "作为对你卓越服务与忠诚的奖赏，荷鲁斯赐予你巨大的力量，这力量将随你的热忱与忠心一同增长。"
 POD_mummy_spell_of_life.71.t: "赛特先驱"
 POD_mummy_spell_of_life.71.desc: "“谁扰我安息？”\n\n“吾主。我前来向您献上从荷鲁斯血脉中盗来的生命神咒。”\n\n“你做到了我所有其他子嗣都未能做到的事。很好，你将得到奖赏。”\n\n“谢——谢谢您，吾主。”\n\n你感到一股精神上的拉扯，随后是完美的清明与宁静，仿佛有什么新的事物融入了你的意识之中。\n\n“末卡维毁掉自己肉身虽属愚行，但这种低等形式的联结自有其益处。你的心智如今与我的合而为一，以便你更好地作为我的特工效命。回到你的会友中去。提醒他们自己的使命，并为我的降临铺平道路。我的觉醒已近在咫尺。我将率领一支庞大的不死大军归来，赏赐我的忠信者，并诅咒我的敌人。”"
 POD_mummy_spell_of_life.71.a: "我将宣告你的名。"
 set_mind_control_tooltip: "随着赛特的意识吞没你的思想，你的人格也随之改变。"
 herald_of_set_modifier: "赛特的先驱"
 herald_of_set_modifier_desc: "有耳可听的，就应当听。我主赛特降临之日临近。一切不信者，颤抖吧，绝望吧。"
 sets_herald_tooltip: "所有[GetTrait('setite').GetName(GetNullCharacter)]及赛特的信徒更高机率接受附庸要求。"
 recreate_setite_empire_effect_tooltip: "凭借赛特之助，你重建了赛特之子帝国[title|E]。"
 transfer_setite_empire_effect_tooltip: "遵照赛特的旨意，你掌控了赛特之子帝国[title|E]。"
 POD_mummy_spell_of_life.72.t: "最后的盛宴"
 POD_mummy_spell_of_life.72.desc: "你尽情吞噬着囚犯们的恐惧、痛苦与折磨。就在此时，你通过那与自己融为一体的灵感到一种奇异的联系。你对生命神咒的知识流过心间，顺着这条联系传向隐藏的大师。\n\n当传输完成时，奇异的波动穿越世界，平衡随之崩塌。纯粹的愤怒、疯狂与恶意渗入世间凡人的心中。啃噬般的饥渴、贪婪与欲望填满了他们。绝望吞噬着他们，驱使他们在这场无可避免的全面崩塌之前寻求满足。忌灵与凡人的灵魂融合，正如你曾经的模样，借由新完成的生命神咒将其转化。你能感知到一场无与伦比的风暴席卷过[UmbraGlossaryLocalized('shadowlands','Underworld')]。无尽的巨灵碎片与灵魂穿越屏障，让你得以尽情吞噬。裂隙撕裂了[UmbraGlossary('pod_realm_labyrinth')]，令规模空前的怨灵大军倾巢而出。你大师的古老子嗣与仆从在混乱中苏醒。你大师自[UmbraGlossary('well_of_the_void')]之下升起，觉醒以吞噬世界本身。"
 POD_mummy_spell_of_life.72.a: "除了盛宴，什么都不剩！盛宴！盛宴！"
 POD_mummy_spell_of_life.80.t: "新名字"
 POD_mummy_spell_of_life.80.desc: "随着你的成功，是时候为你新的王朝命名了：#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L 不朽#!#!。贤荷鲁因荷鲁斯而获赐永生，并遵循他的戒律。卡比里由卡比洛斯的生命神咒创造。阿佩普则诞生于赛特那不完美的仪式。\n\n你希望如何命名那些通过你的生命神咒版本获得永恒重生之人？也许你们会自称伊南娜-埃内或巴尔德尔，以纪念那些死去又复生的神明。也许你们会以施行木乃伊化的群体命名，如沼泽木乃伊或烟熏木乃伊，或取名为无数故事中受诅咒的流浪者。也许你们会以那些不朽的圣人、苦行僧侣和伟大炼金术士命名，从巴鲁克到特蕾莎，从即身佛到弗拉梅尔，他们的遗体永不腐朽，有人说他们至今仍行走于我们之中。有许多名字可供你选择。"
 POD_mummy_spell_of_life.80.a: "选择该名字。"
 POD_mummy_spell_of_life.80.b: "使用默认名称#italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyName')])#!"
 POD_mummy_spell_of_life.81.t: "新界域"
 POD_mummy_spell_of_life.81.desc: "随着你的成功，是时候为你新的[UmbraGlossary('shadow_realm')]命名了。贤荷鲁死后会回归[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]，直至重生。卡比里则前往[UmbraGlossary('hades')]。\n\n既然你已开辟出自己的界域，你希望如何命名这片让追随者灵魂在重生之间安息的领域？或许你会称它为赫尔海姆、示俄勒、黄泉、伊尔卡拉、图奥内拉、绿岛、歌之居所、不死者之山、幽冥界、灵薄狱、等候室、归返之地或安息之厅。来世之名众多，你可尽情选用。"
 POD_mummy_spell_of_life.81.a: "选择该名字。"
 POD_mummy_spell_of_life.81.b: "使用默认名称#italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyShadowRealm')])#!。"
 POD_mummy_spell_of_life.82.t: "新道途"
 POD_mummy_spell_of_life.82.desc: "随着你的成功，是时候构筑一条引导追随者走向未来的道途了，制定规范他们行为的准则，确立他们在平衡之战中立足的立场，选定他们称之为家园的土地。请慎重选择，因为你的话语将被镌刻于石板之上，历经万古而不变。"
 POD_mummy_spell_of_life.82.a: "宣告我们的新道途！"
 POD_mummy_spell_of_life.82.b: "更简单的一条道途便足够了……"
 POD_mummy_spell_of_life.82.b.tt: "你的新[faith|E]是[GetFaithByKey('custom_mummy_dynasty').GetName]，并保留其当前的信条与立场。"
 POD_mummy_spell_of_life.82.b.tt2: "将[GetDoctrine('tenet_esotericism').GetBaseName]确立为制度和教义框架"
 POD_mummy_spell_of_life.82.b.tt3: "选择[GetDoctrine('tenet_reincarnation').GetBaseName]"
 POD_mummy_spell_of_life.82.b.tt4: "选择[GetDoctrine('tenet_preservation').GetBaseName]"
 POD_mummy_spell_of_life.82.b.tt5: "选择[GetDoctrine('doctrine_pluralism_pluralistic').GetBaseName]"
 POD_mummy_spell_of_life.82.b.tt6: "不参与[Glossary('平衡之战','podgloss.warofbalance')]"
 POD_mummy_spell_of_life.82.b.tt7: "你的新[POD_homeland|E]将是[GetGeographicalRegion('world_africa_greater_east').GetName]"
 POD_mummy_spell_of_life.82.framework: "框架"
 POD_mummy_spell_of_life.82.practice: "实践"
 POD_mummy_spell_of_life.82.radical: "激进"
 POD_mummy_spell_of_life.82.flexibility: "灵活"
 POD_mummy_spell_of_life.82.alignment: "阵营"
 POD_can_select_custom_religion_tenet_tt: "[current_location.GetName]并非#bold 位于#![homeland_region.GetName]地区，#bold 且#![current_culture.GetName|U][culture|E]并未#bold 拥有#!源自该地区的[heritage|E]。满足任一条件即可选择此[POD_homeland|E]。"
 POD_mummy_spell_of_life.82.mummy_caveat: "Take '$spell_of_life_find_new_home_decision$' [decision|E] to join your new Dynasty"
 POD_mummy_spell_of_life.82.splat_caveat: "Only $POD_splat_mummy_plural$ can join your new Dynasty. Perhaps you could become one..."