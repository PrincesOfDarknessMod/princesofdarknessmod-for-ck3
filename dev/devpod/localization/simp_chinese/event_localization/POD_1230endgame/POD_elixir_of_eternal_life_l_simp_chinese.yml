l_simp_chinese:
 POD_mummy_elixir_of_eternal_life.001.t: "请求援助"
 POD_mummy_elixir_of_eternal_life.001.desc: "\"The Way is inexplicable, the Path beyond teaching, the Road beyond speaking. To try or worse, to succeed, would be a curse upon your future. Not even the mighty tree can grow to its full height with stolen light. Only by learning do you prove yourself worthy to teach. Only through your own effort will you advance and truly approach the Third Incarnation. Nonetheless, we shall be as a whetstone to your blade. With each step you take, we will guide you so that you may take another, for the steps are your own.\""
 POD_mummy_elixir_of_eternal_life.001.a: "此人对你的指引表示感激。"
 POD_mummy_elixir_of_eternal_life.001.a.tt: "每当你完成一段[journey|E]旅程，八仙的洞见将会赋予#color_white 5.00#!额外的[trait_level_track_xp|E]经验值，用于长生不老药#weak （[GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]）#!"
 POD_mummy_elixir_of_eternal_life.002.t: "掌控内腑"
 POD_mummy_elixir_of_eternal_life.002.desc: "是时候改变自己，摆脱那些阻碍我的特质了。这条路固然艰辛，但却是必经之路。"
 POD_mummy_elixir_of_eternal_life.002.option.desc: "自我考验"
 POD_mummy_elixir_of_eternal_life.002.success: "你成功通过了考验。"
 POD_mummy_elixir_of_eternal_life.002.failure: "你未能通过测试。"
 POD_mummy_elixir_of_eternal_life.002.a: "酒精不会蒙蔽我的心智。"
 POD_mummy_elixir_of_eternal_life.002.a.tt: "你会设法摆脱[GetTrait('drunkard').GetName(GetNullCharacter)]。"
 POD_mummy_elixir_of_eternal_life.002.b: "我不会惩罚自己。"
 POD_mummy_elixir_of_eternal_life.002.b.tt: "你会试图摆脱[GetTrait('flagellant').GetName(GetNullCharacter)]。"
 POD_mummy_elixir_of_eternal_life.002.c: "也许我吃得太多。"
 POD_mummy_elixir_of_eternal_life.002.c.tt: "你将努力摆脱[GetTrait('comfort_eater').GetName(GetNullCharacter)]。"
 POD_mummy_elixir_of_eternal_life.002.d: "我不会让愤怒控制我的。"
 POD_mummy_elixir_of_eternal_life.002.d.tt: "你将努力摆脱[GetTrait('irritable').GetName(GetNullCharacter)]特质。"
 POD_mummy_elixir_of_eternal_life.002.e: "我不会让欲望左右我。"
 POD_mummy_elixir_of_eternal_life.002.e.tt: "你将尝试摆脱[GetTrait('rakish').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.f: "我无法逃避我的问题。"
 POD_mummy_elixir_of_eternal_life.002.f.tt: "你将尝试摆脱[GetTrait('hashishiyah').GetName(GetNullCharacter)]的影响。"
 POD_mummy_elixir_of_eternal_life.002.g: "贪婪并不良好。"
 POD_mummy_elixir_of_eternal_life.002.g.tt: "你会试图摆脱[GetTrait('profligate').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.h: "我是否在逃避需要做的事情？"
 POD_mummy_elixir_of_eternal_life.002.h.tt: "你会努力摆脱[GetTrait('craven').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.i: "我是否允许愤怒驱使我前行？"
 POD_mummy_elixir_of_eternal_life.002.i.tt: "你将努力摆脱[GetTrait('wrathful').GetName(GetNullCharacter)]这一特质。"
 POD_mummy_elixir_of_eternal_life.002.j: "我是否让欲望将我淹没？"
 POD_mummy_elixir_of_eternal_life.002.j.tt: "你会设法摆脱[GetTrait('lustful').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.k: "我是否过于追求自己的权力了？"
 POD_mummy_elixir_of_eternal_life.002.k.tt: "你将试图摆脱[GetTrait('ambitious').GetName(GetNullCharacter)]的特质。"
 POD_mummy_elixir_of_eternal_life.002.l: "我是否逃避了必须完成之事？"
 POD_mummy_elixir_of_eternal_life.002.l.tt: "你将尝试摆脱[GetTrait('lazy').GetName(GetNullCharacter)]的特质。"
 POD_mummy_elixir_of_eternal_life.002.m: "我爱金钱胜过爱他人吗？"
 POD_mummy_elixir_of_eternal_life.002.m.tt: "你将要摆脱[GetTrait('greedy').GetName(GetNullCharacter)]。"
 POD_mummy_elixir_of_eternal_life.002.n: "我会任由食物的欲望吞噬我吗？"
 POD_mummy_elixir_of_eternal_life.002.n.tt: "你将努力摆脱[GetTrait('gluttonous').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.o: "我是否以残忍为乐？"
 POD_mummy_elixir_of_eternal_life.002.o.tt: "你将会尝试摆脱[GetTrait('sadistic').GetName(GetNullCharacter)]。"
 POD_mummy_elixir_of_eternal_life.002.p: "没关系。"
 POD_mummy_elixir_of_eternal_life.003.t: "一部分已完成，另一部分已开启。"
 POD_mummy_elixir_of_eternal_life.003.desc: "已对长生不老药有了初步理解，原有的道路已不足以支撑你继续成长。要炼制此长生不老药，需洞悉己身与所居之宇宙。为此，你将周游世界，搜集古老典籍，从他人失败中汲取教训，并静心思索所集之悟。此外，你需投入时光进行钻研，缓缓译录古籍、调配药液，并夯实自身修行根基。\n\n#help 要达成90点[trait_level_track_xp|E]于长生不老药并更进一步，需被动积累并通过[journeys|E]获取。参阅[Concept('POD_elixir_of_eternal_life', '提示框')|E]及你角色下永恒重生追寻者特质的描述以了解更多。#!"
 POD_mummy_elixir_of_eternal_life.003.a: "我的旅程尚未结束……"
 POD_mummy_elixir_of_eternal_life.100.t: "永久束缚之酸"
 POD_mummy_elixir_of_eternal_life.100.desc: "A man in a perfectly tailored suit walks into your throne room, bypassing your guards. His hair is slicked back and so smooth and perfectly molded that it looks like a helmet placed upon his head. The pieces of metallic machinery protruding through his flesh only serves to enhance the crafted image.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [Glossary('Wicked City','podgloss.wickedcity')] and use your knowledge to create a force of Wu Kuei, mummies working towards the creation of a machine state. In exchange, he will help you transform your realm into one of mundanity and robotic work, maximizing profitability, minimizing losses, and continually innovating.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Would you really decline such a generous offer?"
 POD_mummy_elixir_of_eternal_life.100.a: "这笔交易值得做。"
 POD_mummy_elixir_of_eternal_life.100.b: "你永远得不到我的灵魂！"
 POD_mummy_elixir_of_eternal_life.100.c: "我的灵魂早已被剥夺。"
 POD_mummy_elixir_of_eternal_life.100.d: "我对魔法的精通使你在此地无能为力。"
 POD_mummy_elixir_of_eternal_life.100.d.tt: "酿造了诸多药剂并与[umbra|E]交流后，你能够抵御其地狱般的力量。"
 POD_mummy_elixir_of_eternal_life.100.effect.success: "你抵抗了特工的袭击。"
 POD_mummy_elixir_of_eternal_life.100.effect.failure: "攻心之战压倒了你的理智。"
 POD_mummy_elixir_of_eternal_life.100.effect.pactadvantage: "你与[Glossary('阎魔王','podgloss.yamaking')]的盟约将使您更容易减少其对手的袭击。"
 POD_eoel_mikaboshi_boon_modifier: "[Glossary('瓮星','podgloss.mikaboshi')]的恩赐"
 POD_eoel_mikaboshi_boon_modifier_desc: "[Glossary('妖邪之城','podgloss.wickedcity')]的领主知道如何从一个地区榨取尽可能多的利润。"
 POD_mummy_elixir_of_eternal_life.101.desc: "A pock-marked woman covered in ever-oozing pustules walks into your throne room, bypassing your guards. Her hair is slick with pus, and her skin is covered with a sheen of sweat. An acidic tang fills the air, burning your nose hairs.\n\nShe introduces herself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [GetFaithByKey('thousandhells_tou_shen').GetName]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Feverish Hell and use your knowledge to create a force of Wu Kuei, mummies working towards the spread of smallpox. In exchange, he will help you transform your realm into one of disease where pestilence and fear are profitable. He's willing to offer quite a bit for the chance to overcome Rangda.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Would you really decline such a generous offer?"
 POD_eoel_tou_shen_boon_modifier: "鬼神的恩赐"
 POD_eoel_tou_shen_boon_modifier_desc: "狂热地狱的领主懂得如何将恐惧转化为利益。"
 POD_mummy_elixir_of_eternal_life.102.desc: "A man in bushi-style armor walks into your throne room, bypassing your guards. A clipboard rests in his hand, and a bundle of rope and a whip laced with glass shards hang from his belt.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Wu Hua','podgloss.wuhua')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Pit of Salt and Iron and use your knowledge to create a force of Wu Kuei, mummies working towards perfect efficiency. In exchange, he will help you transform your realm into one of good order, peak production, and endless bureaucracy.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Would you really decline such a generous offer? After all, [Glossary('Wu Hua','podgloss.wuhua')] always rewards the loyal and destroys the disobedient."
 POD_eoel_wu_hua_boon_modifier: "乌邝的恩赐"
 POD_eoel_wu_hua_boon_modifier_desc: "The Lord of the Pit of Salt and Iron well knows that obedient slaves are profitable slaves."
 POD_mummy_elixir_of_eternal_life.110.t: "不断变化的污泥"
 POD_mummy_elixir_of_eternal_life.110.desc: "A hunched man seemingly crafted from blackened iron walks into your throne room, bypassing your guards. His three multi-faceted eyes glow with the red of a desert at twilight. Sand flows out of the joints, leaving a trail behind the creature.\n\nIt introduces itself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] [Glossary('Tou Mu','podgloss.toumu')]. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossary('hell_of_being_skinned_alive')] and use your knowledge to create a force of Wu Kuei, mummies working towards her ascension to the throne of the [Glossary('Demon Emperor','podgloss.demonemperor')]. In exchange, she will help you obtain revenge against all that wronged you, surpassing them in glory and torturing them for all eternity.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? She offers grand opportunities before granting you a swift death, a kindness compared to the world she will usher into being."
 POD_mummy_elixir_of_eternal_life.110.a: "我们可以达成协议。"
 POD_mummy_elixir_of_eternal_life.110.b: "你永远得不到我的灵魂！"
 POD_mummy_elixir_of_eternal_life.110.c: "我的灵魂早已被剥夺。"
 POD_mummy_elixir_of_eternal_life.110.d: "我滋养了我的界域。你在此毫无力量。"
 POD_mummy_elixir_of_eternal_life.110.d.tt: "既已掌控界域与家族，你便能抵御其邪恶之力"
 POD_mummy_elixir_of_eternal_life.110.effect.success: "你抵抗了特工的袭击。"
 POD_mummy_elixir_of_eternal_life.110.effect.failure: "攻心之战压倒了你的理智。"
 POD_eoel_tou_mu_boon_modifier: "[Glossary('斗姆','podgloss.toumu')]的恩赐"
 POD_eoel_tou_mu_boon_modifier_desc: "这位[UmbraGlossary('hell_of_being_skinned_alive')]的领主已经掌握了对其领地保持铁腕掌控的艺术。"
 POD_mummy_elixir_of_eternal_life.111.desc: "A man engulfed with shadows that seemingly glow and yet consume light fades into your throne room, bypassing your guards. His face is that of an innocent child darkened by eyes that have seen far too much. Oddly, there is something avian about his manner.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] Bao Zhong. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Hell of Undying Sorrow and use your knowledge to create a force of Wu Kuei, mummies working towards the extermination of all other [Glossary('Yama Kings','podgloss.yamaking')]. In exchange, he will help you create a new world free from the August Personage of Jade's tyranny, one where you are Bao Zhong's glorious champion.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? He offers such grand opportunities."
 POD_eoel_bao_zhong_boon_modifier: "包拯之恩"
 POD_eoel_bao_zhong_boon_modifier_desc: "The Lord of the Hell of Undying Sorrow remembers much as one of 4 Wan Xian to escape the August Personage of Jade's curse."
 POD_mummy_elixir_of_eternal_life.112.desc: "A man oozing with infernal influences walks into your throne room, bypassing your guards. Strange gems and baubles dangle from every piece of clothing, jingling with each step. An unusual power emanates from these items which presses down on you like an ocean's weight, a killing intent sending fear throughout you.\n\nHe introduces himself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Grandmother Witch. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Hell of Wretched Magic and use your knowledge to create a force of Wu Kuei, mummies working towards the collection of all magic, including those better left unknown. In exchange, she will grant you great knowledge and infernal power.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? She offers such grand opportunities."
 POD_eoel_grandmother_witch_boon_modifier: "巫婆祖母的恩赐"
 POD_eoel_grandmother_witch_boon_modifier_desc: "The Lord of the Hell of Wretched Magic has learned how to use her position to gather ever-more knowledge and magic."
 POD_mummy_elixir_of_eternal_life.120.t: "全听之雾"
 POD_mummy_elixir_of_eternal_life.120.desc: "A woman of unearthly beauty stalks past your guards, their eyes completely blind to anything beyond her. Like a statue carved from ice by a master, she is without flaw. Every step reveals a lethal grace, a cat preparing to pounce.\n\nShe introduces herself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to [Glossary('Kakuri','podgloss.kakuri')] and use your knowledge to create a force of Wu Kuei, mummies working towards an endless void of ice and snow. In exchange, he will grant you great power, transforming you into his knife in the dark. Little will stand against you with his aid.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Merely abandon the duties forced upon you by your uncaring master, the August Personage of Jade, and accept one that will actively aid you."
 POD_mummy_elixir_of_eternal_life.120.a: "出人意料，但值得欢迎。"
 POD_mummy_elixir_of_eternal_life.120.b: "你永远得不到我的灵魂！"
 POD_mummy_elixir_of_eternal_life.120.c: "我的灵魂早已被剥夺。"
 POD_mummy_elixir_of_eternal_life.120.d: "我已掌控自我。此处无你可施之力。"
 POD_mummy_elixir_of_eternal_life.120.d.tt: "既已身心皆修，你便能抵御其邪恶魔力。"
 POD_mummy_elixir_of_eternal_life.120.effect.success: "你抵抗了特工的袭击。"
 POD_mummy_elixir_of_eternal_life.120.effect.failure: "攻心之战压倒了你的理智。"
 POD_eoel_emmao_boon_modifier: "[Glossary('艾玛·欧','podgloss.emmao')]的恩赐"
 POD_eoel_emmao_boon_modifier_desc: "The Lord of the [Glossary('Kakuri','podgloss.kakuri')] has mastered the art of subterfuge."
 POD_mummy_elixir_of_eternal_life.121.desc: "A man bearing the imagery of a major religion walks into your throne room, bypassing your guards. Faith and zealotry shine from his eyes, barely dimmed by the red puckering covering every inch of visible flesh.\n\nHe introduces himself as the representative of the divine, voice of one known as Hen Tian. The divine has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossaryLocalized('hell_of_bitter_truth','Realm of Redemption and Truth')] and use your knowledge to create a force of Wu Kuei, mummies working towards the salvation of all and revelation of absolute truth. In exchange, he will help you spread that redemption in secret so that the enemies of truth cannot stop you.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Merely abandon the duties forced upon you by your uncaring master, the August Personage of Jade, and accept one that will actively aid you."
 POD_eoel_hen_tian_boon_modifier: "亨天之恩"
 POD_eoel_hen_tian_boon_modifier_desc: "The Lord of the [UmbraGlossaryLocalized('hell_of_bitter_truth','Realm of Redemption and Truth')] has mastered the art of suborning people for his own purposes, tricking them into accomplishing his ends."
 POD_mummy_elixir_of_eternal_life.122.desc: "A man whose skin is visibly and permanently stained with blood walks into your throne room, bypassing your guards. Resembling his master, multiple arms extend from his torso and back, each terminating in a mouth with gnashing teeth.\n\nHe introduces himself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Yargra the Many-Mouthed. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to Pueleko and use your knowledge to create a force of Wu Kuei, mummies working towards the creation of endless hells and the consumption of all things. In exchange, she will help you devour all that stand in your way.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Merely abandon the duties forced upon you by your uncaring master, the August Personage of Jade, and accept one that will actively aid you."
 POD_eoel_yargra_boon_modifier: "Yargra's Boon"
 POD_eoel_yargra_boon_modifier_desc: "The Lord of Pueleko sneaks up on her prey before devouring them."
 POD_eoel_yargra_vampiric_boon_modifier: "Yargra's Boon"
 POD_eoel_yargra_vampiric_boon_modifier_desc: "The Lord of Pueleko sneaks up on her prey before devouring them."
 POD_mummy_elixir_of_eternal_life.130.t: "吞噬一切的恶火"
 POD_mummy_elixir_of_eternal_life.130.desc: "A man wearing a Mongolian deel walks into your throne room, bypassing your guards. His body seems bloated with tainted energies, undirected hatred burning within his eyes. Rather than footsteps, his shoes produce the sounds of clinking chains and blood-curdling screams.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] and use your knowledge to create a force of Wu Kuei, mummies working towards crushing the last few holdouts preventing his ascension to [Glossary('Demon Emperor','podgloss.demonemperor')]. In exchange, he will infuse you with the power to crush your enemies and make them suffer.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Great power, well beyond the imagining of the decrepit fools in Heaven, could be yours. Is your dedication so fixed that you will decline it?"
 POD_mummy_elixir_of_eternal_life.130.a: "无限的力量！"
 POD_mummy_elixir_of_eternal_life.130.b: "你永远得不到我的灵魂！"
 POD_mummy_elixir_of_eternal_life.130.c: "我的灵魂早已被剥夺。"
 POD_mummy_elixir_of_eternal_life.130.effect.success: "你抵抗了特工的袭击。"
 POD_mummy_elixir_of_eternal_life.130.effect.failure: "攻心之战压倒了你的理智。"
 POD_eoel_dokhor_khan_boon_modifier: "[Glossary('多科尔汗','podgloss.dokhorkhan')]的恩赐"
 POD_eoel_dokhor_khan_boon_modifier_desc: "[Glossary('刺链地狱','podgloss.hellspikedchains')]的领主，通过碾压一切阻挡者而获得权力，往往行事非常鲁莽。"
 POD_mummy_elixir_of_eternal_life.131.desc: "A woman wearing very little, showcasing the rotting lesions covering her flesh, walks into your throne room, bypassing your guards. The smell of rot, the sound of squelching, the sight of seemingly-melting flesh and maggots squirming under her skin provoke an instinctual desire to retch.\n\nShe introduces herself as an agent of the [Glossary('Yama Queen','podgloss.yamaking')] Rangda. She has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the [UmbraGlossary('hell_of_burrowing_maggots')] and use your knowledge to create a force of Wu Kuei, mummies working towards the eternal agony of all living things. In exchange, she will render your men monsters, unable to experience the pain and decay they spread with every step.\n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Great power, well beyond the imagining of the decrepit fools in Heaven, could be yours. Is your dedication so fixed that you will decline it?"
 POD_eoel_rangda_boon_modifier: "让达的恩赐"
 POD_eoel_rangda_boon_modifier_desc: "The Lord of the [UmbraGlossary('hell_of_burrowing_maggots')] will bathe the world in maggots. Your soldiers are merely the first step."
 POD_mummy_elixir_of_eternal_life.132.desc: "A man with the scars of lashes and burns walks into your throne room, bypassing your guards. A nine-tailed whip embedded with glass shards drips blood from his waist. Upon his helmet rests a candle lit with a green flame burning wildly and causing wax to drip down on to him. Yet, the candle never diminishes.\n\nHe introduces himself as an agent of the [Glossary('Yama King','podgloss.yamaking')] Danoru Ka. He has heard of your quest for the Elixir of Eternal Life and wishes to make you an offer. You will bind your ritual to the Never-lit Cavern and use your knowledge to create a force of Wu Kuei, mummies acquiring spirits to complete his tunnel in the [UmbraGlossary('shadowlands')]. In exchange, he will turn your knights into overseers fit to handle vast hordes of slaves. \n\nThe [Glossary('Sixth Age','game_concept_sixth_age_desc')] will come so why don't you join the winning side? You don't need to live out your immortal existence in suffering or even crushed under the heel of Yomi lords, like the common masses, when you could live in comfort and luxury. Do you truly want to opt for untold centuries of life in hell just to preserve knowledge and wisdom that only a handful can truly appreciate? Is your duty to an absent Heaven really so important to you? Great power, well beyond the imagining of the decrepit fools in Heaven, could be yours. Is your dedication so fixed that you will decline it?"
 POD_eoel_danoru_ka_boon_modifier: "达诺鲁·卡的恩赐"
 POD_eoel_danoru_ka_boon_modifier_desc: "The Lord of the Never-lit Cavern has enslaved many beings and created many overseers to complete his tunnel. Theories abound regarding his destination..."
 POD_mummy_elixir_of_eternal_life.140.t: "最后一步"
 POD_mummy_elixir_of_eternal_life.140.desc: "Across history, the Elixir of Eternal Life has been discovered countless times, only for that knowledge to be lost. Some have theorized that the Eight Immortals intentionally enforce the cycle of rediscovery, using the quest as a test to identify those worthy of eternal rebirth. They allow the virtuous to drink of the Elixir and grant its recipe to the most worthy. It would not be the first time they have done so; for should the Third Incarnation exist, those enlightened Wu T'ian that have achieved it have forbidden from speaking of their accomplishments. After all, men cannot carve their own paths when they seek to follow roads paved by others.\n\nRegardless, having dealt with the [Glossary('Yama Kings','podgloss.yamaking')], you stand on the precipice of success. Collecting a few last things and making one last decision is all that stands between you and the final challenge of your quest."
 POD_mummy_elixir_of_eternal_life.140.a: "是时候为自己争取一席之地了。"
 POD_mummy_elixir_of_eternal_life.201.t: "宁静"
 POD_mummy_elixir_of_eternal_life.201.desc: "At the hour you were once born, you settle yourself into a comfortable position. You still your body, mind, and soul. Each beat of your heart comes ever slower, each thump ever quieter. Thoughts bounce off your mind, failing to intrude into the serenity. Concerns, fears, the troubles of this world flow away from your soul, settling into less than the trickle of a mountain spring. Each moment stretches into eternity as you lose all sense of the passing of time, until your eyes close.\n\nDespite lacking any body, you feel excruciating pain as your body, mind, and soul are ripped apart from each other. With your spiritual eye, you see three spheres spiraling around each other. As the orbits hasten, essence begins to flow between them as the spheres lose their coherent shapes and is cast off into a circling cloud. Only hastening with each moment, the red wisps of energy begin to circle inwards towards the unified white core that has formed, becoming ever-brighten as they approach the center. When all of it has coalesced into a single, infinitesimally small point, your form reappears such that you are able to see through your eyes once more, revealing the Gate of Heaven standing closed. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer_description$ #R The Immortals will consult the 6 elder, playable Wu T'ian that remain active among the supernatural, considering their opinion of you to determine the opposing Debate Strength, along with your past deeds such as how many people you have murdered.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.201.a: "我寻求长生不老药！"
 POD_mummy_elixir_of_eternal_life.201.b: "再想想……"
 POD_mummy_elixir_of_eternal_life.202.t: "最终酿造"
 POD_mummy_elixir_of_eternal_life.202.desc: "The time has come to brew the final elixir needed. You ascend to the highest peak on an auspicious day and armed with a talisman. You speak with the mountain's spirit to receive the Breaths of the Nine Heavens. Nine times subjected to fire at nine regular intervals of time, cycled between solid and vapor, such is the manner of the cinnabar's preparation. You let the sun's light flow through the vessel as you add the gold flowers, jade dew, sulphur, quicksilver, pine resin, peach pits, thistles, lead, dissolved pearls, the sediment of water and fire, remnants of beasts bygone, several deadly toxins, and your own blood. The many become as one, glowing with all the colors of divine light. You wash it to be as pure as the driven snow. You grind it to be as complete as cinnabar. You dissolve it into perfumed water and vermilion grass wine. Finally, you drink the liquid that shines with the color of the heavens so that it may sublimate the earthly and purify the flesh, leaving only the untainted.\n\nGreat weights tug on your eyelids, closing them as you feel yourself separate from the mortal realm. When the weight disappears and you are able to open them once more, you see the Gate of Heaven standing closed. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer_description$#R The Immortals will consult the 6 elder, playable Wu T'ian that remain active among the supernatural, considering their opinion of you to determine the opposing Debate Strength, along with your past deeds such as how many people you have murdered.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.202.a: "我寻求长生不老药！"
 POD_mummy_elixir_of_eternal_life.202.b: "再想想……"
 POD_mummy_elixir_of_eternal_life.203.t: "第二次降生"
 POD_mummy_elixir_of_eternal_life.203.desc: "With the aid of friends, you have conducted an intimate ritual, culminating in your suicide with a carefully-designed weapon. With your seat of life dislodged, your mind's eye flows down to your navel. A luminous galaxy spins, waiting for you to apply pressure and condense them into a new life. As you focus on it, you begin to cultivate and channel essence into it. As the essence returns to emptiness, the embryonic immortal awakens within you. With each cry, the infant grows into you. One element pushes, another pulls. So the wheel spins. So the new immortal is born. So you are born, standing before the closed Gate of Heaven. The gate has the structure of intricate wrought-iron but forged from red gold, the lock crafted from precious jade. Flanking it to either side are walls made of countless pearls, connected as if one being. Before the gates stand eight beings, human in appearance and yet so much more.\n\"Tell us, young one, what is it that you seek?\"$POD_debate_debate_explanation_footer_description$#R The Immortals will consult the 6 elder, playable Wu T'ian that remain active among the supernatural, considering their opinion of you to determine the opposing Debate Strength, along with your past deeds such as how many people you have murdered.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.203.a: "我寻求长生不老药！"
 POD_mummy_elixir_of_eternal_life.203.b: "再想想……"
 POD_mummy_elixir_of_eternal_life.21.t: "Audience: Burden of Immortality"
 POD_mummy_elixir_of_eternal_life.21.desc: "$POD_debate_debate_strength_header$\"You are not the first nor will you be the last to pursue such a quest. However, to climb a mountain is to carry its weight upon your back. Immortality, even one bound by the cycles of rebirth like our own, is a burden that reshapes the soul. With every step of your climb, you will collect loss, and your memories will erode. You will surrender all that grants meaning to the mortal. When the mountain has no peak, is there a meaning to the climb? Is there value in the endless struggle? Not for all. Such things are like a river carving a canyon. While the separation begins small, there comes a time when nothing can bridge the divide between you and the mortal experience. You will become detached from it, unable to fully partake in it. Such pain is only worsened when you have the power to grant immortality but know that you should not use it.\n\n\"This is a curse and a burden. Will you still see every individual snowflake within the blizzard, like so many before it and yet completely unique? Will you still love them, care for them, protect them? Can you bear it, or will you become a monster? Will you still use your knowledge with wisdom, only granting eternal rebirth to those who can bear it themselves?\""
 POD_mummy_elixir_of_eternal_life.21.a: "我们已背负着不朽的重担。"
 POD_mummy_elixir_of_eternal_life.21.b: "你赋予的目标，让一切不再虚无。"
 POD_mummy_elixir_of_eternal_life.21.c: "我们适应了，你们也能。"
 POD_mummy_elixir_of_eternal_life.22.t: "观众：维持平衡"
 POD_mummy_elixir_of_eternal_life.22.desc: "$POD_debate_debate_strength_header$\"Just as immortality and the ability to grant it transforms the relationship between yourself and others, so too does it transform your relationship with the world. Life and death, order and chaos, birth and decay. All exist in perfect balance, and we are its caretakers. With the creation of each Undying, we already skirt the edge of imbalance, shaking the tree. A few shakes will not threaten the world. However, granting you the knowledge to brew the Elixir creates the potential to shake the tree too often, leaving a leafless tree. Expanding our circle would not be a neutral act, serving only to strain the spiritual ecosystems. Should the strain grow too great, ripples would not do justice to describing the unseen debts and karmic entanglements.\n\n\"Will you maintain the balance between realms? Will you abuse the knowledge to create an army of the Undying, ripping a hole in death itself?\""
 POD_mummy_elixir_of_eternal_life.22.a: "平衡是不断演变的，而非一成不变。"
 POD_mummy_elixir_of_eternal_life.22.b: "你将继续调控我们的人口数量。"
 POD_mummy_elixir_of_eternal_life.22.c: "我们所造成的破坏比他人少，并修复他人造成的破坏。"
 POD_mummy_elixir_of_eternal_life.23.t: "观众：死亡的价值"
 POD_mummy_elixir_of_eternal_life.23.desc: "$POD_debate_debate_strength_header$\"There is more harm caused than simply that inflicted upon the balance or the strain from the burden of immortality. As we said before, immortality separates us from the mortals, leaving us detached from their world and without empathy. Without sand draining from the hourglass, we lack urgency or a need for growth. To remove the pressure of death and stopper the glass is to lose one's drive to become something new or greater, to change. Should we give you the Elixir of Eternal Life's recipe, you will use it to create more Undying, thereby robbing them of the chance to experience a complete human existence. Instead, you condemn them to a life of endless days, a never-ending monotony and exhaustion with a job they can never escape. Even should they desire it or seek you out for it, no one can truly understand the loss suffered from immortality until after they have already received it. You steal all of that from them without them ever comprehending their loss. There have even been those that used immortality to punish and torture their rivals, depriving them of a normal life.\n\n\"Are you willing to steal such potential? Would you abuse the power, without exercising thought or consideration for the pain caused? Will you cause harm and suffering?\""
 POD_mummy_elixir_of_eternal_life.23.a: "We preserve, not erase, humanity."
 POD_mummy_elixir_of_eternal_life.23.b: "Immortality is not the end, merely the start of a new journey."
 POD_mummy_elixir_of_eternal_life.23.c: "Mortality leads to suffering, ignorance, and wasted potential."
 POD_mummy_elixir_of_eternal_life.24.t: "Audience: Your Incompleteness"
 POD_mummy_elixir_of_eternal_life.24.desc: "$POD_debate_debate_strength_header$\"Knowledge is power. The Elixir of Eternal Life has the power to control the Wheel, to control the cycle of rebirth, to allow a man to persist far beyond his natural end. For mortals, power serves to do little more than reveal the inner truth, but it is far more dangerous for the eternal. You will be surrounded by magic, by power. To know that you could change things, that you could fix things, not many good people can bear that burden. To not succumb to that temptation to construct a perfect world, to that siren song is a draining endeavor that erodes one's will with every century that passes. Power invites the corruption of even the purest-hearted, of even those with the best of intentions. Only the best can handle it for while a mountain will one day erode away, it takes far longer than a pile of dust.\n\nTo grant you such power before you are ready is cruelty to you and the height of folly, little different than gifting omnipotence to a child. To bear the knowledge behind the Elixir's creation requires one that has learned certain lessons regarding detachment, humility, and harmony.\n\n\"You are not necessarily unworthy. Rather, you are as yet young and incomplete. Granting you that which you seek would be irresponsible. Why should we do so? what proof do you offer of your maturity and ability to resist the corruption?\""
 POD_mummy_elixir_of_eternal_life.24.a: "We have already proven ourselves by reaching this point."
 POD_mummy_elixir_of_eternal_life.24.b: "Perfection is impossible and growth eternal."
 POD_mummy_elixir_of_eternal_life.24.c: "Growth requires responsibility."
 POD_mummy_elixir_of_eternal_life.25.t: "Audience: Legacy of Power"
 POD_mummy_elixir_of_eternal_life.25.desc: "$POD_debate_debate_strength_header$\"Let us say we accept your worthiness and your ability to properly handle the power inherent to the Elixir of Eternal Life. This knowledge's power is a legacy as eternal as the beings it makes. Each change casts ripples through the pond of men, spreading ever further. By granting you the knowledge to brew the Elixir, we perpetuate that legacy, a legacy you will pass on to everyone that you transform or to whom you teach it. Trusting you now requires us to trust all that come after you, to trust the legacy you create. Even a small ripple may one day become a tidal wave beyond even our power to curtail. In the great poem of history, such rhyming lines are oft-repeated, and trust is rarely rewarded.\n\n\"Why should we extend such trust in this moment? Why should we trust those who come later? Even if your intentions are noble, will future generations share your virtues and values? Why should we take such a risk?\""
 POD_mummy_elixir_of_eternal_life.25.a: "Stagnation is its own danger."
 POD_mummy_elixir_of_eternal_life.25.b: "All traditions risk corruption, but they should not be abandoned."
 POD_mummy_elixir_of_eternal_life.25.c: "While difficult, safeguards can be established."
 POD_mummy_elixir_of_eternal_life.26.t: "Audience: Why..."
 POD_mummy_elixir_of_eternal_life.26.desc: "$POD_debate_debate_strength_header$\"One final question stands before us: you. What led you to stand where you now do? After all, yours was not an easy or short quest, nor one without difficulties. What gave you strength when you questioned your purpose? Beneath all of the practicalities, beneath all of the philosophical arguments, what was your intent? Do you seek control or to be remembered? Do you quest out of fear or in defiance? If so, satisfying your desires will only serve to amplify those flaws. Do you have a reason that surpasses such base impulses?\""
 POD_mummy_elixir_of_eternal_life.26.a: "保护世界。"
 POD_mummy_elixir_of_eternal_life.26.b: "超越极限。"
 POD_mummy_elixir_of_eternal_life.26.c: "在启蒙的道路上不断提升。"
 POD_mummy_elixir_of_eternal_life.26.d: "背负他人所不能承受的重担。"
 POD_mummy_elixir_of_eternal_life.26.e: "为了保存知识与使命。"
 POD_mummy_elixir_of_eternal_life.270.t: "观众：成功"
 POD_mummy_elixir_of_eternal_life.270.desc.internal: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Should you decline now and change your decision later, you will need to drink of it without our aid. Let us hope that our trust in you is well-placed.\n\n\"To begin brewing the Elixir of Eternal Life, collect your tears from 11pm to 3am, your sweat from 11am to 3pm, your saliva from 7am to 11am, your mucus from 3am to 7am, and your urine from 3pm to 7pm. Then, mix them over a flame for 15 minutes...\""
 POD_mummy_elixir_of_eternal_life.270.desc.external: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\n\"To begin brewing the Elixir of Eternal Life, grind jade into a fine powder and pour into a small amount of molten gold...\""
 POD_mummy_elixir_of_eternal_life.270.desc.nourishing: "\"After much consideration, we have accepted your proposal and shall fill the gaps within your knowledge. You may also drink of it, if you wish. Let us hope that our trust in you is well-placed.\n\n\"To begin brewing the Elixir of Eternal Life, perform the Five Animal Play technique with several trusted allies, each of you sending your essence, breath, and spirit towards a cauldron of boiling water. Then...\""
 POD_mummy_elixir_of_eternal_life.270.a: "此人对你的指引表示感激。"
 POD_mummy_elixir_of_eternal_life.270.b: "This one thanks you for the opportunity."
 eoel_become_mummy_wutian_tt: "You will become a Mummy which will radically change your gameplay, disable your buildings and destroy your higher realm titles.\nThis is likely to cripple your campaign if you aren't ready for it."
 POD_mummy_elixir_of_eternal_life.271.t: "Audience: Partial Success"
 POD_mummy_elixir_of_eternal_life.271.desc: "\"Like so many before you, we will not grant you the knowledge necessary to perfect the Elixir of Eternal Life. However, you have shown the wisdom necessary to drink of it. And so, we offer you the opportunity to leave your current form behind and attain a new life and a new purpose, one of eternal rebirth in service to the August Personage of Jade. Should you decline now and change your decision later, you will need to drink of it without our aid. Do you accept?\""
 POD_mummy_elixir_of_eternal_life.271.a: "This one thanks you for your generous offer."
 POD_mummy_elixir_of_eternal_life.271.b: "This one must decline your generous offer."
 POD_mummy_elixir_of_eternal_life.272.t: "Audience: Failure"
 POD_mummy_elixir_of_eternal_life.272.desc: "\"After much consideration, we have deemed you too young. You are a peach pit just beginning to sprout. Should we grant you the knowledge necessary to brew the Elixir of Eternal Life, we would bear the responsibility for it corrupting you. You might teach it to the unworthy. You could torture your rivals or steal mortality's advantages from those unprepared for such a loss.\""
 POD_mummy_elixir_of_eternal_life.272.a: "这位稍后会回来。"
 POD_mummy_elixir_of_eternal_life.272.b: "Decrepit fools! I shall found those who value my skill!"
 POD_mummy_elixir_of_eternal_life.30.t: "A Place Among Torments"
 POD_mummy_elixir_of_eternal_life.30.desc: "The Most-Wise Master has grand plans for you. Having descended to the Most-Puissant Master's domain and now standing before them, they present your next task. The Most-Prudent Master proclaims the need for more such as yourself. Such servants will need training and preparation under the Most-Dread Master's care. Unfortunately, the Most-Inscrutable Master's realm does not have a space dedicated to such a purpose. As such, the Most-Mighty Master instructs you to claim a fragment of their Hell to cultivate more servants. You do not want to disappoint the Most-Dread Master, but you will need to address your rivals among the Most-Dominant Master's other servants and the land's denizens.\n\n #R This endeavor uses a score named Military Strength. This score starts by looking at you and your champions' prowess. It will be raised or decreased during the effort itself.\nYour starting Military Strength is [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|0]#!"
 POD_mummy_elixir_of_eternal_life.30.a: "我会证明我配得上。"
 POD_mummy_elixir_of_eternal_life.30.b: "I shall gather my forces and return."
 POD_mummy_elixir_of_eternal_life.30.tt.east: "Your boon from an east-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life.30.tt.north: "Your boon from a north-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life.30.tt.west: "Your boon from a west-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life.30.tt.south: "Your boon from a south-aligned [Glossary('Yama King','podgloss.yamaking')] aids your efforts."
 POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt: "Your rivals' Military Strength is estimated at #V 2000#!"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_ADD: "You #P gain#! $VALUE|0V$ Military Strength"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_SUBTRACT: "You #N lose#! $VALUE|0V$ Military Strength"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_ADD: "Your rivals #N gain#! $VALUE|0V$ Military Strength"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_SUBTRACT: "Your rivals #P lose#! $VALUE|0V$ Military Strength"
 POD_mummy_elixir_of_eternal_life_military_strength: "#clickable Your current Military Strength is [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|V0]\nYour rivals' Military Strength is estimated at [GetPlayer.MakeScope.GetVariable('rivals_eoel_wk_force').GetValue|V0]#!\n\n"
 POD_mummy_elixir_of_eternal_life.31.t: "地狱的教训"
 POD_mummy_elixir_of_eternal_life.31.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Having accepted the Most-Sovereign Master's command, it is time to receive the Most-Profound Master's lesson. It shall be the guiding principle upon which your space is founded and around which new Wu Kuei shall be shaped. How well will you internalize and apply these words of such wisdom?"
 POD_mummy_elixir_of_eternal_life.31.a: "苦难是生命最终的归宿。"
 POD_mummy_elixir_of_eternal_life.31.b: "将苦难作为货币加以利用。"
 POD_mummy_elixir_of_eternal_life.31.c: "恐惧是最纯粹的利润。"
 POD_mummy_elixir_of_eternal_life.31.d: "破碎的诸灵有利可图。"
 POD_mummy_elixir_of_eternal_life.31.e: "控制必须绝对。"
 POD_mummy_elixir_of_eternal_life.31.f: "记忆即力量。"
 POD_mummy_elixir_of_eternal_life.31.g: "知识高于一切"
 POD_mummy_elixir_of_eternal_life.31.h: "谋略方能制胜。"
 POD_mummy_elixir_of_eternal_life.31.i: "利用盲人。"
 POD_mummy_elixir_of_eternal_life.31.j: "无形之中出击，吞噬万物。"
 POD_mummy_elixir_of_eternal_life.31.k: "粉碎你面前的一切阻碍。"
 POD_mummy_elixir_of_eternal_life.31.l: "散播腐蚀与痛苦。"
 POD_mummy_elixir_of_eternal_life.31.m: "通过奴隶制扩张。"
 POD_mummy_elixir_of_eternal_life.31.effect.success.desc: "教训深植于你的脑海之中。"
 POD_mummy_elixir_of_eternal_life.31.effect.failure.desc: "课堂的内容从你的脑海滑过，未曾留下痕迹"
 POD_mummy_elixir_of_eternal_life.32.t: "一个无主之坑"
 POD_mummy_elixir_of_eternal_life.32.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Having heard the Most-August Master's lesson and internalized it, you set off for the land allocated to you by the Most-Generous Master. The march is long and exhausting. While the size of your forces discourages the lesser beasts from troubling you, jealous fools among the Most-Merciful Master's followers seek to usurp your privileged position. Repelling their pointless assaults is little trouble for one so blessed by the Most-Mighty Master as yourself. However, such interruptions do tire the frailer parts of your force. Such weaklings are abandoned to the Hell's wilderness. The strongest among them will survive and complete the journey on their own so little is lost.\n\nWhile none of the other major servants of the Most-Eminent Master currently lay claim to the land, the pit now laying before is still inhabited by some of the lesser creatures that wander the Most-Exalted Master's realm. Driving them out would pose little difficulty, but little would be gained from it for the purposes of your current task. Alternatively, you could risk some of your resources and delay your efforts for the chance to enslave them and direct them towards supporting your efforts."
 POD_mummy_elixir_of_eternal_life.32.a: "把他们赶回荒野。"
 POD_mummy_elixir_of_eternal_life.32.b: "奴役他们，让其劳作。"
 POD_mummy_elixir_of_eternal_life.32.c: "用魔法束缚其。"
 POD_mummy_elixir_of_eternal_life.32.effect.success.desc: "威胁已处理。永久的。"
 POD_mummy_elixir_of_eternal_life.32.effect.failure.desc: "处理得当，但这样做浪费了一些资源。"
 POD_mummy_elixir_of_eternal_life.33.t: "Rivals in the Court of Hell"
 POD_mummy_elixir_of_eternal_life.33.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$With your pit claimed and its former denizens handled, your rivals within the Most-Imperious Master's court are taking more active steps to interfere in your task. For daring to disrupt in the Most-Inexorable Master's task, you should see that they are properly punished and humiliated in the Most-Perceptive Master's eyes. While eliminating them would be more satisfying, the Most-Prudent Master disapproves of wasting resources. Perhaps the Most-Generous Master would grant their souls to you for punishment and training. Before such considerations though, you must determine the best way to address their schemes. Perhaps you shall use it to promote your own legend or arrange for them to be punished for their carelessness in allowing you to discover their efforts. Alternatively, you could ignore them in simple spite."
 POD_mummy_elixir_of_eternal_life.33.a: "以其仇恨为燃料，铸就你的威名。"
 POD_mummy_elixir_of_eternal_life.33.b: "智胜并熬过他们。我会挺过这场风暴。"
 POD_mummy_elixir_of_eternal_life.33.c: "揭露其计谋。如此疏忽，必将受到惩罚。"
 POD_mummy_elixir_of_eternal_life.33.effect.success.desc: "其最宏伟的计谋不过是琐碎小事"
 POD_mummy_elixir_of_eternal_life.33.effect.failure.desc: "真是麻烦……"
 POD_mummy_elixir_of_eternal_life.34.t: "助长诅咒之火的燃料"
 POD_mummy_elixir_of_eternal_life.34.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$To fuel the torture engines of your pit, you require immense amounts of essence. This essence can only be extracted by inflicting immense pain and suffering on collected souls, squeezing out every last drop of lifeforce. You shall refine these raw resources into something more useful for the Most-Puissant Master's plans, immense vats of it. Every drop shall be carefully processed and treated, ready to be thrown into the furnaces to create a twisted form of steam that will energize the engines of destruction. However, mundane agony is inadequate for your purposes. If you do not wish to burn through massive quantities of souls for a single drop, you will need potent magic to amplify the misery and distill the essence you require. You eagerly await the symphony of destruction!"
 POD_mummy_elixir_of_eternal_life.34.a: "掠夺附近的地狱。"
 POD_mummy_elixir_of_eternal_life.34.b: "精炼现有的灵魂。"
 POD_mummy_elixir_of_eternal_life.34.c: "献祭凡人，以获取更多灵魂。"
 POD_mummy_elixir_of_eternal_life.34.effect.success.desc: "我们现在会有充足的燃料了。"
 POD_mummy_elixir_of_eternal_life.34.effect.failure.desc: "如此浪费资源"
 POD_mummy_elixir_of_eternal_life.35.t: "熔铸诅咒"
 POD_mummy_elixir_of_eternal_life.35.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Throughout the world, there are countless slums, decrepit regions, and impoverished lands. In every land and every place, the homeless, the hungry, the hopeless know the truth! There is no one that cares about them! There is no one even aware of their existence! They have nothing! They will never have anything... except their anger! Their hatred! Such delicious hatred! You shall take that spark and turn into an inferno that burns down the heavens themselves!\n\nHowever, stoking the flame will require quite the poker, and before they can serve the Most-Imperial Master, they must be forged into useful tools. How will you transform these pitiful scraps into what you need? Will you simply grant them equipment to compensate for the weakness of their flesh? Will you take only the greatest and hone them? Will you mold even the most wretched into something worth using?"
 POD_mummy_elixir_of_eternal_life.35.a: "我将采用残酷的驯化手段。"
 POD_mummy_elixir_of_eternal_life.35.b: "我将优化其训练。"
 POD_mummy_elixir_of_eternal_life.35.c: "我只招募最优秀的。"
 POD_mummy_elixir_of_eternal_life.35.d: "我将为他们配备最好的装备。"
 POD_mummy_elixir_of_eternal_life.35.effect.success.desc: "锻造成黑暗的完美"
 POD_mummy_elixir_of_eternal_life.35.effect.failure.desc: "许多人在程序完善之前就已死去"
 POD_mummy_elixir_of_eternal_life.36.t: "折磨横行"
 POD_mummy_elixir_of_eternal_life.36.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$As is only proper, the Most-Dominant Master holds absolute power within their domain. However, the pit you claimed is your responsibility to manage. Unfortunately, there have been many demands on your time, including your claimed territory among the mortals. This created an opportunity that has been exploited by your minions.\n\nSome of the lesser slaves are running about wildly, setting random fires and letting loose the beasts you had captured. Minions simply plot your demise while the more far-sighted seek to supplant you in the Most-August Master's eyes.\n\nThe fools pose little risk in the long-term. If nothing else, you are far too important to the Most-Perceptive Master's plans. However, they could prove to be inconveniences and delay your initiatives. How will you handle their foolish insurrection?"
 POD_mummy_elixir_of_eternal_life.36.a: "以武力重掌大权！"
 POD_mummy_elixir_of_eternal_life.36.b: "利用混乱来磨砺他们。"
 POD_mummy_elixir_of_eternal_life.36.c: "Perhaps the Most-Mighty Master's aid is necessary."
 POD_mummy_elixir_of_eternal_life.36.effect.success.desc: "一切尽在计划之中"
 POD_mummy_elixir_of_eternal_life.36.effect.failure.desc: "如此多的浪费！"
 POD_mummy_elixir_of_eternal_life.37.t: "Judgment of the Master"
 POD_mummy_elixir_of_eternal_life.37.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$After much labor, the pit you carved from the Most-Inexorable Master's Hell groans with torment. Chains rattle across iron causeways suspended over seas of screaming souls. Furnaces roar like starving lions with distilled agony as the first broken spirits are dragged toward the vats of corruption, their essence ready to be forced into mortal vessels.\n\nBefore you can obtain fools to infuse the spirits into it, you are called before the Most-Perceptive Master. As the Most-August Master's gaze settles upon you, the court falls silent. Your rivals eagerly await your humiliation while countless lesser servants collapse in quivering terror. It is time for the quality of suffering and torment you generate to be evaluated. Have you merely built another screaming pit among a thousand, or have you constructed a land of despair truly worthy of the Most-Exalted Master's realm? Will your efforts further the Most-Inexorable Master's grand ambitions or waste resources better suited for other endeavors? Only a trial by combat will determine you and your efforts' fate."
 POD_mummy_elixir_of_eternal_life.37.a: "展示你们的力量吧，我的仆从们！"
 POD_mummy_elixir_of_eternal_life.37.b: "我不仅招募了农民，还招募了我的勇士！"
 POD_mummy_elixir_of_eternal_life.37.c: "我发起了相当大规模的招募活动！"
 POD_mummy_elixir_of_eternal_life.37.d: "给我的仆从们上演一场好戏吧！"
 POD_mummy_elixir_of_eternal_life.37.effect.success.desc: "Even the Most-Implacable Master seems slightly impressed"
 POD_mummy_elixir_of_eternal_life.37.effect.failure.desc: "他们的表现只会强化对手的主张"
 POD_mummy_elixir_of_eternal_life.37.final_check: "将比较你与对手和敌人的军事力量，以确定最终结果。"
 POD_mummy_elixir_of_eternal_life.38.t: "至高地狱大师"
 POD_mummy_elixir_of_eternal_life.38.desc: "The Most-Wise Master has seen your value. With a single nod, they acknowledge your success.\n\nReturning to your pit, now truly your pit, you look out over it. Furnaces burn, factories churn. Smokestacks smolder, shadows spread. Chains clatter, curses crawl. Souls scream, spectres stream. Wretches weep, wraiths writhe. A smile flits across your face as grand ambitions crystallize in your mind. The Most-Generous Master has granted you this opportunity, and it would be rude not to fully exploit it."
 POD_mummy_elixir_of_eternal_life.38.a: "这么多灵魂，等待着化为诡宗。"
 POD_mummy_elixir_of_eternal_life.38.b: "我将成为他们中的第一人。"
 POD_mummy_elixir_of_eternal_life.39.t: "终极代价"
 POD_mummy_elixir_of_eternal_life.39.desc: "The Most-Exalted Master does not tolerate weakness, and your efforts proved insufficient. Your rivals now feast upon your failure, tearing apart the carcass of your pit. It matters little to you for the Most-Dread Master's disappointment lingers far longer than your existence."
 POD_mummy_elixir_of_eternal_life.39.a: "不。不。不！不不不不！！啊啊啊啊啊！！！"
 POD_mummy_elixir_of_eternal_life.40.t: "一本模拟人生的作品"
 POD_mummy_elixir_of_eternal_life.40.desc: "The screams of the damned surround you, merging into a single wall. Where others might feel it compressing them with a tangible pressure, it rejuvenates you. From their suffering, you have shaped mountains. From their regrets, you have carved rivers. From their guilt, you have built your realm. From their hatred, you have fed. Their torments are yours. Their bodies are yours. Their souls are yours.\n\nHowever, their souls remain trapped within your realm, useless to your greater ambitions. Even should they return to the mortal world as a [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], it will be as a crude facsimile of life. The Wu Kuei offer the potential to create immortal beings capable of true life, beings that will be reborn eternally. The Wu Kuei fill their niche but have certain... limitations, especially in comparison to their so-called \"righteous\" cousins. Should you complete the Elixir of Eternal Life, a proper counter to the Wu T'ian could be created.\n\n #R This endeavor uses a score named Experimental Knowledge. This score starts by looking at your knowledge and power. It will be raised or decreased during the endeavor itself.\nYour starting Experimental Knowledge is [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|0]#!"
 POD_mummy_elixir_of_eternal_life.40.a: "没有什么能阻挡我前进的道路！"
 POD_mummy_elixir_of_eternal_life.40.b: "我有数个世纪的时间来实现这个目标。"
 POD_mummy_elixir_of_eternal_life_diy_start_hunt_tt: "The Required Experimental Knowledge is estimated at #V 2500#!"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_ADD: "You #P gain#! $VALUE|0V$ Experimental Knowledge"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_SUBTRACT: "You #N lose#! $VALUE|0V$ Experimental Knowledge"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_ADD: "You #N gain#! $VALUE|0V$ Required Experimental Knowledge"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_SUBTRACT: "You #P lose#! $VALUE|0V$ Required Experimental Knowledge"
 POD_mummy_elixir_of_eternal_life_experimental_knowledge: "#clickable Your current Experimental Knowledge is [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|V0]\nYour Required Experimental Knowledge is estimated at [GetPlayer.MakeScope.GetVariable('opposition_eoel_diy_knowledge').GetValue|V0]#!\n\n"
 POD_mummy_elixir_of_eternal_life.41.t: "A Laboratory of a Thousand Agonies"
 POD_mummy_elixir_of_eternal_life.41.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Your past efforts have granted a great deal of knowledge, enough to even create Wu Kuei. However, mere knowledge is insufficient. Active experience and practical implementation are necessary. The furnaces shall be lit. The slaves shall labor. Souls shall be rendered into memory and essence. Life and death shall be dissected until they hold no secrets from you.\n\nMany failures may be required. Many resources may be spent. Those are costs that you are willing to bear."
 POD_mummy_elixir_of_eternal_life.41.a: "在受诅咒者身上进行实验。"
 POD_mummy_elixir_of_eternal_life.41.b: "有志者应踊跃自荐。"
 POD_mummy_elixir_of_eternal_life.41.c: "活着的臣民可以被获取。"
 POD_mummy_elixir_of_eternal_life.41.effect.success.desc: "多么……有趣啊。"
 POD_mummy_elixir_of_eternal_life.41.effect.failure.desc: "牺牲是不可避免的"
 POD_mummy_elixir_of_eternal_life.42.t: "第一次蒸馏"
 POD_mummy_elixir_of_eternal_life.42.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$实验已经开始了。一个持续的程序已经建立，每一个变量都被控制。每一个受试者都被分类，每一次失败都被记录。没有任何遗漏或遗忘，因为真相可能存在于任何地方。\n\n一百人死去。然后是千人。然后是万人。然后是十万人。大多数灵魂化为灰烬，甚至不如。极少数幸运者在过程中存活片刻，随后崩溃瓦解。\n\n每次失败，都学到了一些东西，因为留下了残余物。一个污点。你尚无法识别它。"
 POD_mummy_elixir_of_eternal_life.42.a: "进一步完善程序。"
 POD_mummy_elixir_of_eternal_life.42.b: "将成功的对象分离出来，以供进一步研究。"
 POD_mummy_elixir_of_eternal_life.42.c: "我自己来消费这些残留物。"
 POD_mummy_elixir_of_eternal_life.42.effect.success.desc: "原来如此！"
 POD_mummy_elixir_of_eternal_life.42.effect.failure.desc: "如此多被浪费的资源"
 POD_mummy_elixir_of_eternal_life.43.t: "悲伤的宝库"
 POD_mummy_elixir_of_eternal_life.43.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$After countless experiments, the missing ingredient has finally identified. Even better, you have found a reliable means of creating it. Unlike gold, it cannot simply be mined. Unlike silk, it cannot simply be harvested. Unlike goods, it cannot simply be purchased. Only moments of true, profound, life-altering suffering can form it. The sufferings of birth, old age, illness, death, encountering the unpleasant, losing the pleasant, and not receiving the desired. The sufferings of form, feeling, perception, formation, and consciousness. Regret. Betrayal. Obsession. Despair. Each moment creates a drop that can be distilled into essence, an essence you can use.\n\nFortunately, you possess an abundance of tragedies. The souls of akuma and their servants have been bound within jade ornaments and sealed within your treasury by ebony doors. Each represents a life willingly surrendered to corruption, often after a great deal of suffering, in life or in death. While they might contain the missing essence, it would cost a great deal so an alternative might be better."
 POD_mummy_elixir_of_eternal_life.43.a: "扩建折磨工厂。"
 POD_mummy_elixir_of_eternal_life.43.b: "设计全新的苦难形式。"
 POD_mummy_elixir_of_eternal_life.43.c: "从钰皇吝啬的掌控中夺取灵魂。"
 POD_mummy_elixir_of_eternal_life.43.d: "打开金库！"
 POD_mummy_elixir_of_eternal_life.43.effect.success.desc: "终于！精华足够了！"
 POD_mummy_elixir_of_eternal_life.43.effect.failure.desc: "这花费了他们太多人了"
 POD_mummy_elixir_of_eternal_life.44.t: "迷障之外的双眼"
 POD_mummy_elixir_of_eternal_life.44.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Already, rumors spread through the Shadowlands that your attention is focused elsewhere. Rival Devil Kings are sending spies and probing raids. Yellow Springs and its lord are asking questions. He has never forgiven the Yama Kings for stealing portions of the Shadowlands and has long sought to retrieve it.\n\nYour true aims will not remain hidden forever, in part due to the resources you have expended and are expending. However, those same expended resources weaken your position. Worse, the potential of acquiring such power may invite intervention before you achieve it."
 POD_mummy_elixir_of_eternal_life.44.a: "让他们来吧！"
 POD_mummy_elixir_of_eternal_life.44.b: "向其提供错误的结论。"
 POD_mummy_elixir_of_eternal_life.44.c: "牺牲几个无关紧要的走卒。"
 POD_mummy_elixir_of_eternal_life.44.effect.success.desc: "他们的注意力被转移了。"
 POD_mummy_elixir_of_eternal_life.44.effect.failure.desc: "有这么多废物要处理"
 POD_mummy_elixir_of_eternal_life.45.t: "不可避免的缺陷"
 POD_mummy_elixir_of_eternal_life.45.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$With the latest enhancements and the addition of that special ingredient, the test subjects no longer unravel into countless threads of flesh and bone. While those threads have been useful to craft eternally-screeching clothing, they never constituted the improved Wu Kuei you desire.\n\nRather than perishing, they are left with something less than life. Their wounds close. Their flesh endures. Yet, they are left as screaming abominations kept alive solely by your will. Should they ever leave your realm, their bodies would collapse into more threads. Even as their physical form persists, their minds degrade into madness, hunger, and despair.\n\nA flaw must remain hidden within the process."
 POD_mummy_elixir_of_eternal_life.45.a: "以律能强化臣民。"
 POD_mummy_elixir_of_eternal_life.45.b: "审视其欲望与野心。"
 POD_mummy_elixir_of_eternal_life.45.c: "在退化之前解剖他们。"
 POD_mummy_elixir_of_eternal_life.45.effect.success.desc: "原来如此！"
 POD_mummy_elixir_of_eternal_life.45.effect.failure.desc: "又是一些清理失败的案例。"
 POD_mummy_elixir_of_eternal_life.46.t: "叛逆原型"
 POD_mummy_elixir_of_eternal_life.46.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Finally, FINALLY, one of the subjects retains its original form rather than becoming a horrid monster that even you can barely tolerate to see. It speaks. It remembers. It reasons!\n\nAt first, it lets you perform your follow-up experiments. A few insights are gleaned, but then, it DARES to refuse a command! It DARES to act against your will! It CLAIMS to have #italic \"free will\"#!! #italic Supposedly#!, there are truths hidden from YOUR SIGHT! According to it, suffering is #italic \"insufficient\"#!, and #italic \"freedom\"#!, of all things, is necessary! As if your glory and might could ever be #bold insufficient#! for anything! The notion is absolute absurdity!\n\nRegardless, you need the prototype to continue your experiments."
 POD_mummy_elixir_of_eternal_life.46.a: "酷刑将摧毁其意志。"
 POD_mummy_elixir_of_eternal_life.46.b: "摧毁它并保存残骸。"
 POD_mummy_elixir_of_eternal_life.46.c: "提出一个条件。"
 POD_mummy_elixir_of_eternal_life.46.d: "它必将服从于吾！"
 POD_mummy_elixir_of_eternal_life.46.effect.success.desc: "你以为你能违抗我！"
 POD_mummy_elixir_of_eternal_life.46.effect.failure.desc: "我只好再做一个了。"
 POD_mummy_elixir_of_eternal_life.47.t: "最后一次测试"
 POD_mummy_elixir_of_eternal_life.47.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Every year of labor, every experiment, every failure, every sacrifice of resources, all of it has led you to this moment. You believe that you have successfully created the Elixir of Eternal Life, a formula capable of bestowing eternal rebirth. However, you cannot be sure unless you test the final version properly. It was difficult and extremely expensive to craft. Should you fail, it may be some time before you can collect the necessary materials to try again."
 POD_mummy_elixir_of_eternal_life.47.a: "在一个被诅咒的灵魂测试一下。"
 POD_mummy_elixir_of_eternal_life.47.b: "在一个强大的俘虏测试一下。"
 POD_mummy_elixir_of_eternal_life.47.c: "在一个忠诚的奴隶测试一下。"
 POD_mummy_elixir_of_eternal_life.47.d: "在最能干的仆人测试一下。"
 POD_mummy_elixir_of_eternal_life.47.effect.success.desc: "我的成功是不可避免的。"
 POD_mummy_elixir_of_eternal_life.47.effect.failure.desc: "其死亡……实属不幸。"
 POD_mummy_elixir_of_eternal_life.47.final_check: "将你的实验知识所需量与要求量进行比较，以确定最终结果。"
 POD_mummy_elixir_of_eternal_life.48.t: "永恒重生"
 POD_mummy_elixir_of_eternal_life.48.desc: "All live and die. Some return to the mortal realm in a state between them. Only a few live, die, and return to life as themselves. Your past work on the Elixir of Eternal Life allowed you to create a crude version of these Undying, beings you call Wu Kuei. However, they always had their limitations, and their souls lacked the intact state of the ones made by the arrogant Eight Immortals.\n\nNow, you watch as the subject dies under your instruments before rising again. Every test confirms that their body is alive and their loyalty is absolute. They are yours, and soon, they shall be legion."
 POD_mummy_elixir_of_eternal_life.48.a: "让天堂颤抖吧！"
 POD_mummy_elixir_of_eternal_life.480.t: "大污染"
 POD_mummy_elixir_of_eternal_life.480.desc: "Your laboratory falls silent. The formula, the calculations, the preparations. Everything was flawless! Your work was flawless! Yet, it failed! Worse, with each second, the flesh of your test subject sloughs off their bones, bones that are actively being liquefied. The pool of bronze flesh, crimson blood, ivory bone collects at your feet before it is violently scattered across the walls as the soul ruptures. Entire sections of the laboratory collapse into screaming wastelands. Portions of your realm and its barrier splinter as the explosion's spiritual shockwave crashes against them.\n\nIt will take time to repair the damage and once more strengthen your position among the Yama Kings. For now, the work must end..."
 POD_mummy_elixir_of_eternal_life.480.a: "但我有永恒的时间来完成它..."