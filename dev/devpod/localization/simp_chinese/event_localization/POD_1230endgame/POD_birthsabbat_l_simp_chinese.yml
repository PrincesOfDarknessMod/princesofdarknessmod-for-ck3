l_simp_chinese:
 PODbirthsabbat.0002.t:0 "新党派的诞生"
 PODbirthsabbat.0002.desc:0 "虚伪、无耻、傲慢的荆棘大会现已成为过去，新成立的“秘盟”认为他们已经取得了胜利，并确保了大反乱的结束。\n你应知道。这次运动唯一需要赢得的是一位强大又集权的领导。你的领导。从荆棘大会开始你就一直在思考这个问题，如果你能创建一个党派来反抗秘盟呢？\n大多数叛党已经加入了这个崭新又诱人的功业。魔宴正在崛起，而你愿意做它的先驱么？"
 PODbirthsabbat.0002.a:0 "该隐需要一位摄政。他需要我。"
 PODbirthsabbat.0002.b:0 "……这是一个很糟糕的主意。"
 sabbat_founder_modifier:0 "魔宴奠基人"
 sabbat_founder_modifier_desc:0 "这个角色是可怕的魔宴的奠基人之一。其总是受到无情的黑手的保护，在这个党派互战时代，他拥有相当大的权力。"
 sabbat_begins_effect_message:0 "大多数叛党都已经加入了新生的魔宴。"
 PODbirthsabbat.0004.t:0 "魔宴的诞生"
 PODbirthsabbat.0004.desc:0 "大反乱受到了荆棘大会和秘盟诞生的有力打击。然而，该运动并没有消亡，实际上它已经重生，变得更加……罪恶。\n这个自称为魔宴的新党派在心怀不满的叛党中积聚了巨大的动力。它的核心信条仍然是相当模糊的，但对秘盟的敌意是明显的，因此[masquerade|E]更松懈，而对该隐本人的崇拜则被允许。这些改革后的叛党是否只是新[cainite|E]秩序的一个小麻烦，还是能否能够再次改变夜晚的风景呢，仍需观察。"
 PODbirthsabbat.0004.a:0 "也许他们是对的?"
 PODbirthsabbat.0004.b:0 "他们根本没有机会。"
 PODbirthsabbat.100.t:0 "教化心路"
 PODbirthsabbat.100.desc:0 "从黑暗时代的心路中吸取教训，魔宴实验着新的教化心路。教化心路试图调和吸血鬼的信仰与道德和他们的不死族状态，给予他们的亡命一种与吸血鬼身体的需求和心兽的索求相一致的思维方式。教化心路将道德设定于主动模式，而人性之道则是被动。当处在人性之道的吸血鬼的道德倾向慢慢地被侵蚀，并在心兽面前失去地盘时，教化心路的追随者会与它战斗或接受它作为自己的一部分。我将如何决定？"
 PODbirthsabbat.100.a:0 "跟着直觉走。"
 PODbirthsabbat.100.b:0 "谨慎地研究备选方案。"
 PODbirthsabbat.200.t:0 "教化心路"
 PODbirthsabbat.200.desc:0 "在对自己的道德进行了深入的研究和思考之后，我选择追随……"
 PODbirthsabbat.200.a:0 "荣耀协约之道"
 PODbirthsabbat.200.b:0 "力量与心声之道"
 PODbirthsabbat.200.c:0 "心兽之道"
 PODbirthsabbat.200.d:0 "和谐之道"
 PODbirthsabbat.200.e:0 "清洁之道"
 PODbirthsabbat.200.f:0 "该隐之道"
 PODbirthsabbat.200.g:0 "死亡与灵魂之道"
 PODbirthsabbat.200.h:0 "春军心法"
 PODbirthsabbat.200.i:0 "蜕变之道"
 PODbirthsabbat.200.j:0 "暗夜之道"
 POD_sabbat.1001.t:0 "魔宴在希腊之胜"
 POD_sabbat.1001.desc:0 "魔宴在希腊已经占据了主导地位。\n在您的引导下，党派在这里蓬勃发展，无人能再否认您的权力。在这个时刻，宣布自己为枢机（党派中最高荣誉之一）是合乎情理的。\n在魔宴，强权即公理，而您已经充分证明了自己统治这个地区的权利。对于那些仍然留在此地的微不足道的秘盟成员或独立者，只有一个选择。他们可以向您下跪。\n或者去死。"
 POD_sabbat.1001.a:0 "应有的荣誉。"
