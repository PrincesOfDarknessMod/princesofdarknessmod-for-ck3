 POD_sabbat.1100.c:0 "We must counterattack!"
 POD_sabbat.1101.t:0 "Sabbat Triumphant in Greece"
 POD_sabbat.1101.desc:0 "The Sabbat presence in Greece has become dominant.[new_cardinal.GetFirstName] has claimed the seat of Cardinal for this region. This cements the triumph of the Sabbat in this area and will likely result in the destruction of the last non Sabbat holdouts remaining.\ntThe Sword of Caine claims this victory as an important stepping stone towards their ultimate triumph over the Antediluvians and their minions."
