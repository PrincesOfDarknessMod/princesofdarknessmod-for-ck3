 POD_sabbat.2001.t: "枢机聚会"
 POD_sabbat.2001.desc: "所有的魔宴枢机现在都已到齐，显示这是一个重大的事件。魔宴只承认该隐是他们的领袖，但在他辉煌归来之前，必须选择一位执政来领导该党派对抗众多敌人。\n所有的枢机基本上在进入房间之前就已经做出了选择，这可能是出于野心、自我保护和长远计划的综合考虑。然而，最终只有其中一位将被选中手握该隐之剑。"
 POD_sabbat.2001.a: "各位阁下，请进行表决。"
 POD_sabbat.2101.t: "候选：[candidate.GetFirstNameNoTooltip]"
 POD_sabbat.2101.desc: "[candidate.GetFirstName|U]发表了[candidate.GetHerHis]的演讲，你是否应该投票让[candidate.GetHerHim]担任执政？\n对于枢机来说，仅凭一次演讲就改变其计划中的投票行动是很罕见的，但有时候，这些演讲中可能含有足够含蓄的威胁或直接的承诺，足以影响一个犹豫不决的投票者。显然，使用血律手段被认为是粗暴的失策，很可能导致枢机被取消资格……至少原则上如此。"
 POD_sabbat.2101.a: "我赞同你。"
 POD_sabbat.2101.b: "我不赞同。"
 POD_sabbat.2201.t: "该隐的继承人"
 POD_sabbat.2201.desc: "投票已经结束，你被选为下一位执政。枢机们礼貌地赞扬你，有些人比其他人更热情，但至少你的胜利目前被接受了。随从提醒你，按照传统，你并没有绝对的权威，只是在等待黑暗之父亲自归来，领导他的子女们。\n然而，这是在魔宴阶级制度中能够达到的最高位置，这使你成为世界上最具政治权力的该隐之子之一。还有工作要做，但你可以为这个重大事件感到一丝自豪。"
 POD_sabbat.2201.a: "我手持该隐之剑。"
 POD_sabbat.2202.t: "该隐的继承人"
 POD_sabbat.2202.desc: "投票已经结束，[new_regent.GetFirstName]被选为下一位执政。枢机们礼貌地赞扬其，有些人比其他人更热情，但至少其的胜利目前被接受了。随从提醒其，按照传统，其并没有绝对的权威，只是在等待黑暗之父亲自归来，领导他的子女们。\n然而，每个大主教或主教会议最终都要对该权威负责，可以预见这次任命将对魔宴产生长远的影响。"
 POD_sabbat.2202.a: "唔，那就恭喜吧……"
 POD_sabbat.110.title: "狂猎"
 POD_sabbat.110.desc: "狂猎背后的机制是同态复仇法，它可以概括为“以眼还眼”。当一名吸血鬼犯下严重罪行时，比如弑亲、啖魂、侵犯领地并导致上述罪行、或对权威的反抗，通常会下达这样的命令。任何听到狂猎命令的吸血鬼都应该参与其中，尽管除非涉事吸血鬼犯下了真正严重的罪行，否则并非强制要求。\n你会呼吁你的魔宴同僚加入这场战争吗？"
 POD_sabbat.110.a: "召集他们。"
 POD_sabbat.110.b: "我要独自狩猎。"
 POD_sabbat.300.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
 POD_sabbat.300.desc: "我的领地是我自己的，除非我不这么认为。我承认你的权威，但也注意到你在滥用权力。你的“要求”被拒绝了。"
 POD_sabbat.300.a: "我将不得不看看其他选项……"
 POD_sabbat.2300.t: "魔宴的胜利"
 POD_sabbat.2300.desc: "与维持治安的秘盟相比，魔宴一直认为自己首先是一支军队。在他们的神学教义中，这支军队是为该隐本人准备的，当他最终结束流亡归来，与邪恶的上古耆宿作战时，他就可以挥舞这支军队。然而，对于更务实的人来说，这支军队主要是为了从对手手中夺取和巩固权力。\n这一事实，再加上使用残酷战术的意愿和经常激发的狂热，让魔宴最终战胜了对手。随着最后几股抵抗力量的屈服（或向太阳屈服），黑夜在一场血腥而奇妙的狂欢中迎来了它的新霸主，这场狂欢很快就会提醒凡人他们对潜伏在每个阴影背后的怪物的原始恐惧。"
 POD_sabbat.2300.a: "胜利的滋味如此甜美又血香。"