 POD_sabbat.1101.t:0 "魔宴在希腊之胜"
 POD_sabbat.1101.desc:0 "魔宴在希腊已经占据了主导地位。[new_cardinal.GetFirstName]已经宣布成为该地区的枢机。这巩固了魔宴在这个地区的胜利，并有可能导致最后一批非魔宴的抵抗者的毁灭。\n该胜利被该隐之剑视为迈向战胜上古耆宿吸血鬼及其爪牙的最终胜利重要里程碑。"
