 POD_sabbat.2001.t:0 "The Cardinal Conclave"
 POD_sabbat.2001.desc:0 "All Sabbat Cardinals are now present, showing that this is a tremendous event. The Sabbat only acknowledge Caine at its leader but until his glorious return, a Regent must be chosen to lead the sect against its numerous enemies.\nAll Cardinals likely have already made their choice before even entering the room, most likely from a combination of ambition, self preservation and long term schemes. In the end though, only one of them will be chosen to wield the Sword of Caine."
 POD_sabbat.2001.a:0 "Excellencies, proceed with the vote."
 POD_sabbat.2101.t:0 "Candidate: [candidate.GetFirstNameNoTooltip]"
 POD_sabbat.2101.desc:0 "[candidate.GetFirstName|U] has given [candidate.GetHerHis] speech, should you vote [candidate.GetHerHim] for Regent?\nIt is rare for Cardinals to change their planned vote from their chosen course of action based on just a speech but, sometimes, these can contain just enough veiled threats or outright promises to sway an undecided elector. Obviously, the usage of disciplines is considered a crass misstep and likely results in the disqualification of the Cardinal... at the very least."
 POD_sabbat.2101.a:0 "I choose you."
 POD_sabbat.2101.b:0 "I don't."
 POD_sabbat.2201.t:0 "Heir of Caine"
 POD_sabbat.2201.desc:0 "The vote count is done, and you has been voted as next Regent. Cardinals politely praise you, some with more enthusiasm than others, but at the very least your victory is accepted for now. The attendant reminds you, as is the tradition, that you do not have absolute authority and you are merely overseeing the sons and daughters of Caine until the Dark Father returns to lead his children himself.\nStill, this is the highest one can rise in the Sabbat hierarchy and that makes you one of the most politically powerful Cainite in the world. There is work to do, but you can accept a small moment of pride for this tremendous event."
 POD_sabbat.2201.a:0 "I wield the Sword of Caine."
 POD_sabbat.2202.t:0 "Heir of Caine"
 POD_sabbat.2202.desc:0 "The vote count is done, and [new_regent.GetFirstName] has been chosen. Cardinals politely praise them, some with more enthusiasm than others, but at the very least their victory is accepted for now. The attendant reminds them, as is the tradition, that they do not have absolute authority and are merely overseeing the sons and daughters of Caine until the Dark Father returns to lead his children himself.\nStill, each of the Archbishops or councils of Bishops is ultimately accountable to this authority and it is likely that this nomination will have a tremendous impact on the Sabbat for the years to come."
 POD_sabbat.2202.a:0 "Congratulations, I suppose."