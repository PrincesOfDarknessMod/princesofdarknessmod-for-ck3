 POD_anteshuntyamakings.55.t: "罗波那的恶魔要塞"
 POD_anteshuntyamakings.55.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\n尽管它曾经历过更好的时光，罗波那的堡垒依然是一幅可怕的景象。就像罗波那和他的恶魔仆从一样，这座宫殿无法保持一种形态，不断地从一种形状流动到另一种形状。访客们说，这座宫殿表现得像一个活物，一团静止的、搏动着的肌腱与血肉。即使是那些进出这座建筑的罗刹，也更多地是被吞噬或呕吐出来，而非被允许进入或离开。\n\n建筑本身带有很久以前焚毁这座城市的火焰留下的伤疤，尽管罗波那已经设法治愈了他心爱城堡所受的大部分损伤。毫不奇怪，此地的防御工事是那里最令人印象深刻的，罗刹精英们集结起来，在你接近他们的主人之前阻止你的推进。在这一点上，他们拥有所有优势，从防御阵地到要塞本身都在试图确保你无法接近。除非你动用你的个人预备队，否则这将是一场代价高昂的突击"
 POD_anteshuntyamakings.55.desc.b: "\n\n可怕的罗刹大将瑟拉特丽将亲率大军。她作为未来可能的[Glossary('阎魔女王','podgloss.yamaking')]，声名传扬四海。此役若与她为敌，战局必将更为艰难。"
 POD_anteshuntyamakings.55.a: "你们中的一些人可能会死..……"
 POD_anteshuntyamakings.55.b: "目标已然在望，自当一往无前！"
 POD_anteshuntyamakings.56.t: "恶魔之王，罗波那"
 POD_anteshuntyamakings.56.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\n在楞伽城的废墟要塞中，栖身着遭劫之主罗波那。他曾一度是所有阳属阎魔中最令人畏惧、最强大的存在。\n\n罗波那曾是所有[Glossary('阎魔王','podgloss.yamaking')]中最傲慢自私的一位。他深信在力量、智慧或残忍程度上，无人能出其右。这份傲慢使他极度危险，但也导致了他的覆灭。\n\n自遭劫以来，罗波那经历了蜕变。他变得阴沉内省，对可能彻底失败的恐惧造就了一个更为诡秘、驱动力更强的存在。据传言，他的宏图大计，其规模将超越其同侪曾尝试过的任何图谋。\n\n罗波那是千变万化的大师。与众多偏爱少数几种固定形态的[Glossary('阎魔王','podgloss.yamaking')]同侪不同，罗波那的面貌始终处于流变之中。他甚至可能在一次攻击过程中变换多次形态。罗波那所有形态中唯一不变的，是其骇人外貌与恐怖力量。任何因看似弱小而低估这位遭劫之主的人，都将很快被证明大错特错，且几乎没有时间哀悼自己的愚蠢。"
 POD_anteshuntyamakings.56.desc.b: "\n\n发现猴面战士孤身一人，罗波那发出狂怒的咆哮冲向哈奴曼。看来这位楞伽城之主仍未忘却昔日死敌。\n在这场决战中，这份执念必将成为你方的强大助力。"
 POD_anteshuntyamakings.56.a: "没有回头路了。"
 POD_anteshuntyamakings.56.effect.success.desc: "坚持住……"
 POD_anteshuntyamakings.56.failure: "我们还能赢..."
 POD_yk_chandra_add_100_ms_tt: "查古拉普夏的出现为你的阵营额外提供了100点军事力量。"
 POD_anteshuntyamakings.57.t: "恶魔之王，罗波那"
 POD_anteshuntyamakings.57.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\n这是最后一战了，若你的军事力量低于罗波那，你的前路便将在此终结。#!\n\n罗波那是个可怕的对手。他的战斗风格虽欠精妙，但因那持续不断的变化形态而全然无法预测。他形态中唯一不变的，是身上那些灼伤的疤痕——这是他过往败绩的残留，也是你们竭力想要充分利用的弱点。\n\n然而，利齿与尖爪掀起的旋风令此事极为困难，你麾下疲惫的部队正被缓缓逼退。你残存的力量，是否足以支撑到战胜这位罗刹王？整个楞伽城似乎都屏息凝神。"
 POD_anteshuntyamakings.57.desc.b: "\n\n你军中的雷伏诺氏族同样毫无保留。走进房间时，查古拉普夏看到罗波那变幻的形态，脸上掠过一丝讶异，或许是不确定他是否真是自己曾经熟识的那位兄弟。无论答案如何，这位永恒将军正倾其所有可观的伟力奋战，以求从这地狱中生还。"
 POD_anteshuntyamakings.57.a: "胜利？"
 POD_anteshuntyamakings.57.b: "如此接近……"
 POD_anteshuntyamakings.58.t: "兰卡第二次也是最后一次沦陷"
 POD_anteshuntyamakings.58.desc: "罗波那的败亡多少有些虎头蛇尾。这位[Glossary('阎魔王','podgloss.yamaking')]变回了或许是他原初形态的模样——一个相貌平平的男人，在兰卡围绕你震动的同时，瘫倒在地。随着这位破败之主的最终灭亡，幽冥的这一部分如今成了无主之地。尽管你很想将其据为己用，但这并非明智之举。一旦其他[Glossary('阎魔王','podgloss.yamaking')]听闻他们对手的败绩，便会蜂拥而至争夺此地的控制权，但愿这能让他们彼此之间重燃战火。\n\n兰卡本身已是一片废墟，在罗刹和罗波那被解决后更是如此，因此能为幽冥的领主们提供的资源少之又少。\n\n你的盟友们——无论是出于权宜之计还是信念——在洗劫了要塞的财宝后，正准备返回凡间。\n\n你是最后一个还站着的人，你看着罗波那逐渐消散的尸体，诡异的寂静笼罩了这片曾经饱经战火的兰卡。争夺[Glossary('魔皇','podgloss.demonemperor')]宝座的竞赛失去了一个最有力的竞争者，这让未来的前景看起来少了几分绝望。"
 POD_anteshuntyamakings.58.a: "战乱地狱已得安宁。"
 POD_anteshuntyamakings.40.t: "蛆虫滋生之地"
 POD_anteshuntyamakings.40.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n瘟疫母主让达统治着蛆虫穿掘地狱。作为最强大的[Glossary('阎魔王','podgloss.yamaking')]之一，她的疆域广阔，覆盖了幽冥中的一大片领地。不幸的是，让达也向来行事隐秘，善于混淆其地狱的入口，这构成了你此行的第一道障碍。你若想在此次猎杀中取得任何进展，首先需要知道该去往何处。\n\n有传言指向东南亚可能是一个潜在的地点，但这片地域太过广阔。而你花费的时间越长……让达就越有可能听闻你的行动，并为你\"准备\"好她的\"欢迎\"仪式。"
 POD_anteshuntyamakings.40.a: "循着病踪。"
 POD_anteshuntyamakings.40.effect.success.desc: "紧追不舍。"
 POD_anteshuntyamakings.40.critical.failure.effect.desc: "一场冷酷的猎杀。"
 POD_anteshuntyamakings.40.b: "用钱解决问题。"
 POD_anteshuntyamakings.41.t: "一份欢迎礼"
 POD_anteshuntyamakings.41.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n让达已经听闻你对她的地狱的调查，她的反应既在预料之中，也可能带来致命的后果。有报告称，她那令人畏惧的瘟疫使者正在行动，准备在你的王国腹地释放一种前所未见的致命疾病。\n\n现在追捕这些瘟疫使者，将这场灾难扼杀在摇篮之中，还为时未晚。然而，让达的恶魔数量众多且实力强大，因此你不得不分派一部分兵力去执行这项任务，同时你也很清楚，这些兵力在对[Glossary('阎魔女王','podgloss.yamaking')]的最后总攻中可能是至关重要的……"
 POD_anteshuntyamakings.41.a: "小题大做的发烧。"
 POD_anteshuntyamakings.41.b: "追踪他们。阻止他们。"
 POD_anteshuntyamakings.42.t: "我那带病之敌的——带病之敌……"
 POD_anteshuntyamakings.42.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n凭借疾病这般广阔的专精领域，让达绝非唯一试图垄断这片灵魂市场的[Glossary('阎魔女王','podgloss.yamaking')]。在她战胜所有对手之前，曾有许多较小的领主为此竞争。虽然他们中的大多数如今已沦为被遗忘的历史，但有一位例外。\n\n窦深，这位曾与兰达势均力敌的潜在对手，随着[Glossary('阎魔女王','podgloss.yamaking')]权势的日益增长，其威望与力量已大不如前。两者间的敌意，在幽冥的众领主中几乎无出其右，这并不出人意料。这一点，或许正可为你所用。\n\n只需将情报巧妙地送入某些人的耳中，你便可确保窦深对让达发动他自己的进攻。这显然将极大地削弱瘟疫女主人的力量，对你而言无疑是莫大的助益。"
 POD_anteshuntyamakings.42.a: "分而治之。"
 POD_anteshuntyamakings.42.desc.b: "\n\n由于你本人已致力于侍奉窦深，只需阐述你的计划并请求协助，便足以说服你的主人。"
 POD_anteshuntyamakings.42.effect.success.desc: "新的战线！"
 POD_anteshuntyamakings.42.critical.failure.effect.desc: "受挫..."
 POD_anteshuntyamakings.42.b: "协同攻击。"
 POD_anteshuntyamakings.43.t: "生物战"
 POD_anteshuntyamakings.43.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n尽管你已尽力在完成准备之前追踪它们，但一只让达的瘟疫使者还是设法潜入了你的宫廷。它所携带的瘟疫已经夺走了你一些次要廷臣的生命。如果任其传播，你随从中更重要的成员可能会成为下一批受害者。\n\n避免这种命运的一个选择是将你自己和你最信任的廷臣隔离起来。然而，这会被你的对手视为示弱的表现。毕竟，不能因为你正在筹划一场盛大的狩猎，日常的政治游戏就会停止。"
 POD_anteshuntyamakings.43.a: "我相信它会自行平息。"
 POD_anteshuntyamakings.43.b: "把门关上！"
 POD_anteshuntyamakings.44.t: "蛀蛆地狱"
 POD_anteshuntyamakings.44.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n当你踏入让达的地狱时，第一眼望去，此地乃是一片看似由细白沙砾构成的广袤荒原。这里没有太阳，但阴沉的天空也并非特别黑暗。许多初来者会对此景嗤之以鼻，以为他们侥幸逃脱了命运，或是觉得幽冥并不如传闻中那般可怕。\n\n直到他们意识到脚下的沙地正在蠕动，真相才豁然开朗。有时，当一条大象般庞大的魔蛆破沙而出，攫走某个擅闯入者时，此地的现实也会不言自明。\n\n再过片刻，腐烂的气味便会彻底侵袭所有旅人，那股衰朽的恶臭足以令任何不幸仍需呼吸者踉跄难行。整个领域充斥着蛆虫与其他食腐者，在这片疆域的任何角落，腐朽与衰败都无处可逃。\n此地仿佛无边无际，而让达究竟身在何处更是无从知晓。严酷的环境正不断消耗着你的补给，若想见到这位瘟疫母主，你必须将一切安排得井井有条。"
 POD_anteshuntyamakings.44.a: "莫扰沙下之物。"
 POD_anteshuntyamakings.44.effect.success.desc: "一切正常。"
 POD_anteshuntyamakings.44.critical.failure.effect.desc: "到处都是沙子……"
 POD_anteshuntyamakings.45.t: "孵化之坑"
 POD_anteshuntyamakings.45.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n在幽冥地狱中，当某个灵魂在蛆虫深渊中几乎被消耗殆尽，或是证明了自己有资格侍奉让达时，它就会被带到孵化池。池中涌动着污秽的阳气，并由让达最强大的仆从严密把守。这些仆从将选中的灵魂投入池中，随后封闭池口。\n\n一段时间后，池中的灵魂将经历蜕变。池内腐败的能量会扭曲受害者的躯体，使其最终转化为让达的仆从；有些会成为散播瘟疫与疾病的人形瘟源，有些则异变为巨大的蛆虫，成为让达那苍白软体大军中的士兵或监工。\n\n此地一直是你们进攻的重点目标。若任由让达拥有无限补充兵力的手段，你们的覆灭将只是时间问题。在计划阶段，你们提出了两种应对方案：\n\n其一，是设法误导孵化池的守卫。若能让他们忙于追击你们的侦察兵，而非专注于孵化新部队，战局将大为有利。\n\n其二，是投入你们的预备队强攻孵化池。虽然此举不太可能完全阻断敌方的兵源，但至少能重创瘟疫母主的大军，尽管代价几乎注定是预备队的全军覆没。"
 POD_anteshuntyamakings.45.a: "启动我们的佯动。"
 POD_anteshuntyamakings.45.effect.success.desc: "令人满意的结果"
 POD_anteshuntyamakings.45.critical.failure.effect.desc: "坑穴翻腾..."
 POD_anteshuntyamakings.46.t: "巨兽"
 POD_anteshuntyamakings.46.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n在蛀蛆地狱中，有一片形似白色巨山的构造。那里栖息着整个领域中最庞大、最污秽的存在。当访客靠近这片区域时，便会明白其中缘由——那看似山峦的突起，实则是远古时期死于此地的一头巨兽的遗骸。有传言说，这头巨兽甚至在让达人出现之前就已存在，其死亡的时间比这个世界存在的时间还要久远。\n\n无论如何，这头巨兽似乎要花上永恒的时间才能被完全吞噬，而那些以它为食的生物，无疑是这个领域中最大、最具攻击性的蛆虫。有些已长到蓝鲸般大小，最小的也至少有六英尺长。这些生物似乎还发展出了初步的智力和沟通方式，使它们能够协同行动。\n\n从某种意义上说，它们构成了瘟疫母主的最后一道防线，也是她作为[Glossary('阎魔女王','podgloss.yamaking')]最令人震撼的力量展示。这些巨兽不会被引诱离开，也无法用计谋欺骗，你必须正面迎战，通过在其最伟大的胜利之地给予其惨重打击，才能迫使你真正的目标现身。"
 POD_anteshuntyamakings.47.t: "瘟疫女王"
 POD_anteshuntyamakings.47.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n让达是少数极少现身的[Glossary('阎魔女王','podgloss.yamaking')]之一。她不似同族那般傲慢，更倾向于进行长远布局，除非万不得已绝不亲自现身。因此，你的部队能最终与她遭遇，某种意义上也算是一种“褒奖”了。\n\n让达的外表是一位美丽女子，但身上布满溃烂的疮疡。她长发乌黑，全身赤裸，仅腰间缠着一块破旧的缠腰布。尽管五官姣好，但那疾病缠身的模样足以让意志最坚定的人也感到极度厌恶。\n\n她战斗起来狂野不羁，毫无章法可言，只是凭借野蛮的力量随机地扑击、撕扯。她的每一次攻击，哪怕是最轻微的擦伤，都会让不幸的受害者感染上一种剧毒——其猛烈程度足以让你们中最强大的人也瞬间倒下。\n\n尽管你们在人数上占优，但这最后一战的结果，依然远未可知……"
 POD_anteshuntyamakings.47.a: "别让她碰到你！"
 POD_anteshuntyamakings.47.effect.success.desc: "就快到了……"
 POD_anteshuntyamakings.47.critical.failure.effect.desc: "#italic 咳咳……#!"
 POD_anteshuntyamakings.48.t: "女王与她的臣民"
 POD_anteshuntyamakings.48.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\n这场关键之战，取决于你这伤痕累累的军队能否挺过这最后的殊死一战。"
 POD_anteshuntyamakings.49.t: "治愈瘟疫国度"
 POD_anteshuntyamakings.49.desc: "当让达终于倒下时，你的军队明智地尽可能退到远处。毫不意外，这位瘟疫母主临死的哀嚎释放出了一股疾病洪流——你显然不愿亲身体验。幸运的是，她临终的时刻也意味着她麾下剩余的军队在她周围溃散瓦解，因为她与她的\"孩子们\"之间的共生关系不允许他们在她死后继续存活。\n\n地狱本身并未改变，似乎对这位女主人的死漠不关心。让达并非第一个将瘟疫划为自己权柄的[Glossary('阎魔王','podgloss.yamaking')]，也绝不会是最后一个。遗憾的是，很可能在不久的将来，就会有另一个势力崛起并接管这片区域，但他们将不得不从头开始。运气好的话，要再出现一个像让达这样强大的存在，恐怕需要数个世纪之久。\n\n世人将永远不会知晓，但就在此时此地，在这片[Glossary('阎魔女王','podgloss.yamaking')]尸身腐烂、融入土壤的污秽领域中，你为现实世界赢得了一段漫长的喘息之机。[Glossary('魔皇','podgloss.demonemperor')]的崛起，已被延缓。"
 POD_anteshuntyamakings.49.a: "……但并未停息。"
 POD_anteshuntyamakings.30.t: "铁血之路"
 POD_anteshuntyamakings.30.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n[Glossary('斗姆','podgloss.toumu')]被普遍认为是所有[Glossary('阎魔王','podgloss.yamaking')]中最直接了当的一位。她嗜战、易怒且报复心强，每当战事来临，她总会亲自率领她的恶魔军团，攻击那些她深恶痛绝的$鬼人$。\n\n不过，这并不意味着她愚蠢或鲁莽。作为最古老的[Glossary('阎魔王','podgloss.yamaking')]之一，[Glossary('斗姆','podgloss.toumu')]深知隐藏实力、不露底牌的价值。因此，她那\"剥皮地狱\"的入口实际上无人知晓，这也成了你此行的第一道障碍。\n\n你需要迅速行动，赶在[Glossary('斗姆','podgloss.toumu')]察觉你的干预并做好准备之前，找到那个入口。或者，你也可以从容行事，通过中间人来操作，以避免引起过多怀疑。"
 POD_anteshuntyamakings.30.a: "我们会给她一个惊喜。"
 POD_anteshuntyamakings.30.effect.success.desc: "速战速决。"
 POD_anteshuntyamakings.30.critical.failure.effect.desc: "功败垂成……"
 POD_anteshuntyamakings.30.b: "我们不必操之过急。"
 POD_anteshuntyamakings.31.t: "铁腕手段"
 POD_anteshuntyamakings.31.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n[Glossary('斗姆','podgloss.toumu')]已经听说了你在调查她的事。看来这位钢铁女皇，果然名不虚传，直接认定进攻就是最好的防御。伴随着一道噼啪作响的传送门，这位身披重甲的怪物赫然出现在你宫廷的正中央，随即挥舞着她那恶名昭彰的铁链，迅速解决掉了你那些惊呆了的守卫。\n\n你很快意识到，这仅仅只是[Glossary('斗姆','podgloss.toumu')]本人的一个化身，因为她不会如此轻易地离开自己的领域。尽管如此，即便这只是她力量的一部分，这个化身也比绝大多数曾行走于中原的恶鬼和邪魔都要强大。你若不想让你的追寻——以及你的生命——在此终结，就必须证明你并非一个能被一位[Glossary('阎魔女王','podgloss.yamaking')]的一小部分力量就轻易解决掉的角色。"
 POD_anteshuntyamakings.31.a: "我绝不会轻易认输。"
 POD_anteshuntyamakings.31.effect.success.desc: "坠入幽冥去吧！"
 POD_anteshuntyamakings.31.critical.failure.effect.desc: "是我太蠢了……"
 POD_anteshuntyamakings.32.t: "铁之契约"
 POD_anteshuntyamakings.32.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n在你猛烈的攻势下，[Glossary('斗姆','podgloss.toumu')]的化身节节败退。察觉到即将被你驱逐回幽冥，这位钢铁女皇暂停了战斗，用一种与方才激战时截然不同的、饶有兴趣的目光审视着你。她并未开口——毕竟她并非真身在此——但这位[Glossary('阎魔女王','podgloss.yamaking')]利用她化身残存的力量，在你脑海中构筑出种种景象。\n\n你看到[Glossary('斗姆','podgloss.toumu')]加冕为[Glossary('魔皇','podgloss.demonemperor')]，将其他[Glossary('阎魔王','podgloss.yamaking')]踩在她的铁蹄之下。你看到她将以暴力、恐怖与混乱统治世界，惩罚那些曾愚蠢信奉天庭慈悲的罪人。\n\n你还看到自己站在她的身侧，成为女皇珍视的伴侣，享有作为这创世中第二强大的存在所应得的一切尊荣。\n\n看来你给钢铁女皇留下了足够深刻的印象，以至于她向你发出邀约：与其试图遵循天条，不如与她一同在地狱称王。"
 POD_anteshuntyamakings.32.a: "没兴趣，恶魔！"
 POD_anteshuntyamakings.32.b: "……一场铁铸的婚约？"
 POD_anteshuntyamakings.33.t: "剥皮地狱"
 POD_anteshuntyamakings.33.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n若论天下是否有比剥皮地狱更惨绝人寰的去处，至今尚无人寻得。乍看之下，此地宛如一片荒漠星球的表面。曾踏足此境的访客声称，它集中原万般沙海之酷烈于一身。然而这争论毫无意义——因为[Glossary('斗姆','podgloss.toumu')]这方扭曲疆域的恐怖程度，远胜任何一片荒漠，甚至远超它们的总和。\n\n永不停歇的狂风在这片赤沙地狱中尖啸肆虐，足以在瞬息间将凡俗生灵的血肉从骨架上剥离。裹挟在音速烈风中的玻璃与金属碎片，其威力足以贯穿重甲；即便是$pod_kueijin$那坚韧的躯壳，也会在顷刻间被磨蚀殆尽。这暴风将山岩与台地雕琢成了狰狞可怖的嶙峋怪状。\n\n若有谁能在这永不停息的沙暴中视物，便能望见无数魔物正在折磨被拖入此地的魂魄，施以各种酷刑。然而受害者的惨嚎，尽数被狂风的呼啸所吞没。风势常化作龙卷，将黄沙与魂灵卷至数里高空，再任由其坠落在下方锋利的石峰之上。\n\n使这片荒芜景象更添凶险的是，[Glossary('斗姆','podgloss.toumu')]还备下了一支“迎宾队伍”——由她麾下身披重甲的魔怪组成。这些形似食人魔、山怪等扭曲怪物，誓要为钢铁女皇的荣光，将你的军队彻底摧毁。"
 POD_anteshuntyamakings.33.a: "这些拦不住我们。"
 POD_anteshuntyamakings.33.effect.success.desc: "前进！"
 POD_anteshuntyamakings.33.critical.failure.effect.desc: "一场惨胜……"
 POD_anteshuntyamakings.34.t: "最终决战之谷"
 POD_anteshuntyamakings.34.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n据说[Glossary('斗姆','podgloss.toumu')]可能是第一位[Glossary('阎魔女王','podgloss.yamaking')]。她曾受命惩罚贪婪与傲慢的罪人，却沉溺于腐化之气，图谋统治中原。在那遥远的过去，$pod_kueijin$仍是英勇的战士，正是他们中最伟大的雷祖击败了她，终结了她的计划。\n\n然而，好景不长，$pod_kueijin$自身也堕落了，而[Glossary('斗姆','podgloss.toumu')]得以复仇。她俘获了虚弱的雷祖及其战士们，正是在这最后决战之谷中，她将他们的躯体千次磨蚀、万次重塑，只为让他们开始领会她无边的愠怒。\n\n此谷是这片地狱中唯一无风之地。她手下败将的灵魂如今囚禁于此，这对[Glossary('斗姆','podgloss.toumu')]而言，正是力量的彰显。\n不过，雷祖本人从未真正屈服。这位昔日的伟大英雄就被困于此，轻易便可获释。然而，他对你的追寻是否还有用处？这就难说了。此人的心智已严重受损，若想助他重拾自我，乃至将其化为对抗钢铁女皇的有力盟友，势必要耗费宝贵的时间。"
 POD_anteshuntyamakings.34.a: "记住你曾经是谁。"
 POD_anteshuntyamakings.34.effect.success.desc: "欢迎回来"
 POD_anteshuntyamakings.34.critical.failure.effect.desc: "这没用。"
 POD_anteshuntyamakings.34.b: "我们没时间了。"
 POD_anteshuntyamakings.35.t: "凶险要塞"
 POD_anteshuntyamakings.35.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n在这片地狱的实际表层上，森严堡垒是少数矗立于此的建筑之一。这座巨大的宫殿以锈蚀的钢铁加固，扭曲成一副狰狞面目，与[Glossary('阎魔女王','podgloss.yamaking')]自身的面具如出一辙。整座堡垒涌动着源于不断劈落闪电的能量。外墙上捆绑着那些[Glossary('斗姆','podgloss.toumu')]特别\"青睐\"的受难者躯体——这些受诅咒的生灵不断承受着刺骨寒风与闪电灼击。然而[Glossary('斗姆','podgloss.toumu')]不会允许他们死去，即便在呼啸的风声中，他们的惨叫声依然清晰可闻。\n\n这种顽固特质或许能为你所用。既然她的大军已在入口处溃败，现在几乎无人能阻止你解救这些囚犯，并组织他们向地狱看守发起反击。\n不过，要将这些可怜灵魂从衰弱囚徒转变为有生战力，需要精湛的指挥艺术与宝贵时间——而这些时间本可用于直捣黄龙，在钢铁女皇准备好最终决战前发动突袭。"
 POD_anteshuntyamakings.35.a: "这是越狱行动！"
 POD_anteshuntyamakings.35.effect.success.desc: "自由！"
 POD_anteshuntyamakings.35.critical.failure.effect.desc: "他们没用……"
 POD_anteshuntyamakings.36.t: "凶险迷宫"
 POD_anteshuntyamakings.36.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n[Glossary('阎魔女王','podgloss.yamaking')]堡垒的内部区域宛如蜂巢般布满密室。即便是她最信任的仆从，也未能尽数知晓所有房间的存在，据信其中一些甚至可能在铁血女王统治此地之前便已存在。若果真如此，这座堡垒的某些部分或许潜藏着连[Glossary('斗姆','podgloss.toumu')]自己都未曾察觉的危险。\n\n遗憾的是，她的私人寝宫正坐落于这迷宫深处的某处，因此你必须设法尽快找到穿越之路。\n你麾下的一些勇士提议分头行动，希望能以速度换取在对抗[Glossary('斗姆','podgloss.toumu')]时的人数优势。若此计不合你意，你便只能设法参透这迷宫的规律，或是尽可能快地强行穿行而过。"
 POD_anteshuntyamakings.36.a: "一定有办法……"
 POD_anteshuntyamakings.36.effect.success.desc: "出口！"
 POD_anteshuntyamakings.36.critical.failure.effect.desc: "好迷茫啊..."
 POD_anteshuntyamakings.36.b: "我们分头行动！"
 POD_anteshuntyamakings.36.c: "只管拼命跑！"
 POD_anteshuntyamakings.37.t: "钢铁女皇"
 POD_anteshuntyamakings.37.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n[Glossary('斗姆','podgloss.toumu')]的三只蛇眼在她铁面具下怒视着，一眨不眨。\n她显现为一名身着精美铁甲的女性，戴着有角的铁面具，十八只手臂上都装备着利爪般的铁手套。她那长长的黑发从钢铁面具后倾泻而下，这是她允许自己保留的唯一一丝人性特征。\n\n在她十八只戴着铁手套的手臂末端，每只利爪都握着某种致命、污秽或奇异之物：一个喷吐火焰的龙首、一卷古老的卷轴、一朵莲花、一个婴儿的头颅、一面渗漏着湮灭污秽的黑色三角旗……这些物品大多都是[Glossary('斗姆','podgloss.toumu')]为巩固她对幽冥的掌控而收集的武器。当它们被协同运用时，能使她近乎无敌，即便是在剥皮地狱之外也是如此。\n\n全副武装、身着战斗盛装的钢铁女皇，其景象是如此骇人，甚至连其他[Glossary('阎魔王','podgloss.yamaking')]都畏惧不已，曾考虑联合起来阻止她。这从未发生过，因此今天，你和你的军队便\"有幸\"在战斗中面对这个恐怖的存在。\n即使你们在人数上远超于她，空气中的紧张气氛也毋庸置疑。你们在实力上被完全压制，在场的每一个人都心知肚明。"
 POD_anteshuntyamakings.37.a: "没有回头路了……"
 POD_anteshuntyamakings.37.effect.success.desc: "我们能行……"
 POD_anteshuntyamakings.37.critical.failure.effect.desc: "被活活剥皮……"
 POD_anteshuntyamakings.38.t: "不败女皇"
 POD_anteshuntyamakings.38.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n这是最后一战了。如果你的军事力量不及斗姆，你的前路将就此终结。#!\n\n你正逐渐在对抗[Glossary('斗姆','podgloss.toumu')]的战场上占据上风。兵力上的优势和你自身高超的勇武，足以阻止这位钢铁女皇肆意屠杀你的军队。\n这位[Glossary('阎魔女王','podgloss.yamaking')]的战斗风格极具侵略性，她依仗着那身看似坚不可摧的铠甲，完全放弃了防守。\n\n然而，这套恶名昭彰的铁甲，其作用远不止于保护[Glossary('阎魔女王','podgloss.yamaking')]免受其领域内蚀骨寒风的侵袭。它时常显露出拥有意识的迹象，有时甚至会自行移动，挡下她未能察觉的攻击。它还能从其黑暗的质体中，变幻出令人畏惧的各式兵器，包括旋转的利刃、末端带钩的铁链、手里剑、钻头以及金属触手。\n它简直就像是一个独立的恶魔实体，以某种方式束缚在[Glossary('斗姆','podgloss.toumu')]身上。无论其本质为何，这副铠甲都随着[Glossary('斗姆','podgloss.toumu')]的心意不断变幻形态，唯有标志性的暗铁色泽保持不变。\n\n在这场战斗中，铠甲至今毫发无伤，你知道打消耗战自己绝无胜算。但希望并未泯灭，你越来越多的部下正从险恶迷宫中脱身，加入战团。倘若他们有足够多的人幸存下来，你或许还有一线生机……"
 POD_anteshuntyamakings.38.a: "不要松懈！"
 POD_anteshuntyamakings.39.t: "冷铁"
 POD_anteshuntyamakings.39.desc: "即便是令人闻风丧胆的玄铁战甲和[Glossary('斗姆','podgloss.toumu')]那传奇般的勇武，也不足以战胜众人的技巧、数量与决心。随着这位女皇在一阵汩汩冒出的黑血中倒地，玄铁战甲从她的躯体上收缩剥离，证明了其自身拥有意识。失去了她珍视的甲胄，这位[Glossary('阎魔女王','podgloss.yamaking')]女皇看上去不过是个有些不起眼的女人，她所有的恶魔特征都随着生命的流逝而消散。\n\n随着她最后一口气的断绝，第一位[Glossary('阎魔女王','podgloss.yamaking')]，也是[Glossary('魔皇','podgloss.demonemperor')]宝座的主要竞争者，就此消失，地狱之风也渐渐平息。今天将被铭记为[Glossary('阎魔王','podgloss.yamaking')]之敌的胜利之日……但也同样是他们之中那些曾畏惧[Glossary('斗姆','podgloss.toumu')]、如今眼见一个可怕的竞争者被铲除之人的胜利之日。\n\n尽管如此，天庭的一个祸害已被清除，未来的地平线似乎也因此明亮了些许。"
 POD_anteshuntyamakings.39.a: "寂静宣告着我们的胜利。"
 tou_mu_consort_modifier: "斗姆天命配偶"
 tou_mu_consort_modifier_desc: "当第六纪元来临时，女皇将不再孤身统治。那位令她青眼有加之人，必将获得厚赏。"
 POD_anteshuntyamakings.20.t: "钢铁对尖刺"
 POD_anteshuntyamakings.20.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n[Glossary('多科尔汗','podgloss.dokhorkhan')]的崛起速度惊人。他利用蒙古大军的胜利，从一位边缘化的[Glossary('阎魔王','podgloss.yamaking')]一跃成为[Glossary('魔皇','podgloss.demonemperor')]宝座最有力的竞争者之一。他傲慢至极，凭借这次崛起将草原变成了自己的专属猎场，随着他腐化该地区能量的阴谋得逞，他的力量也越来越强。\n\n然而，这也为他树敌众多，其中最主要的就是他的[Glossary('阎魔王','podgloss.yamaking')]对手们。[Glossary('斗姆','podgloss.toumu')]被视为他顽固的敌人，因为她此前正是这片草原的掌控者。通过确保她的爪牙知晓你突袭[Glossary('多科尔汗','podgloss.dokhorkhan')]地狱的计划，你的任务会轻松许多，因为她很可能会自行开辟另一条战线。\n\n但一个潜在的问题是，这可能会在已经混乱不堪的战场上引发更多混乱。你的顾问们建议，如果你自信能独自取胜，不如将这次突袭行动保密。"
 POD_anteshuntyamakings.20.a: "我们或许正需要这种混乱"
 POD_anteshuntyamakings.20.b: "我们自己能应付。"
 POD_anteshuntyamakings.21.t: "瘟疫对尖刺"
 POD_anteshuntyamakings.21.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n[Glossary('多科尔汗','podgloss.dokhorkhan')]的另一个难缠的对手是瘟疫母主让达。关于他的受污染之气的实验，产生了一个副作用，即切断了让达制造瘟疫所需的秽物供给。而[Glossary('多科尔汗','podgloss.dokhorkhan')]为这些能量附加了一道只有他自己能使用的封印，这更是雪上加霜。自那以后，他的附属与让达的瘟疫使者便常在幽冥（偶尔也在凡间）发生冲突。\n与[Glossary('斗姆','podgloss.toumu')]的情况类似，当然你也有可能接触她的仆从，并灌输一个与你方进攻同时发动大规模袭击的念头。\n虽然这对你的整体实力无疑是有利的，但要在充斥着让达诸多瘟疫的战场上行动，无疑会让整个行动的协调工作变得更加困难。"
 POD_anteshuntyamakings.22.t: "刺链地狱"
 POD_anteshuntyamakings.22.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n[Glossary('刺链地狱','podgloss.hellofspikedchains')]是一片看似无边无际的荒原，地势平坦得仿佛地面一直向上弯曲至地平线。众多（自愿或非自愿）效忠于[Glossary('多科尔汗','podgloss.dokhorkhan')]的灵魂聚集于此，被划分为不同部落，陷入永无休止的战争，只为满足这位[Glossary('阎魔王','podgloss.yamaking')]扭曲的愉悦。\n这使得他们成为历经磨砺的战士，每一寸土地都必须经过艰苦争夺。你的部队在此地将难觅喘息之机。刚一踏入此地，首批面容扭曲、状如恶魔的部落战士便已向你冲来。"
 POD_anteshuntyamakings.22.a: "没有回头路了……"
 POD_anteshuntyamakings.22.effect.success.desc: "我们继续。"
 POD_anteshuntyamakings.22.critical.failure.effect.desc: "已经损失了这么多……"
 POD_anteshuntyamakings.23.t: "铁棘缠身之刑"
 POD_anteshuntyamakings.23.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n在这片无尽荒原上为数不多的显著特征之一，便是一处狂风呼啸的巨大洞穴。据从这地狱逃出的幸存者所述，囚犯们被带刺的幽冥铁链悬挂在钟乳石上。他们究竟是为取悦[Glossary('多科尔汗','podgloss.dokhorkhan')]而受折磨的灵魂，还是在此界永无休止的冲突中落败的部族成员，其实并不重要。若能解救这些囚犯，武装并组织他们加入你的队伍，无疑将是一大助益。\n\n然而，潜在的问题在于，这群混杂不堪、看似孱弱的俘虏几乎算不上是一支战斗力量。你必须在极短时间内，将他们转变为能为你的事业效力的得力帮手。"
 POD_anteshuntyamakings.23.a: "服从我，蛆虫！"
 POD_anteshuntyamakings.23.effect.success.desc: "全体前进！"
 POD_anteshuntyamakings.23.critical.failure.effect.desc: "你们一个个都没用！"
 POD_anteshuntyamakings.24.t: "分头行动，逐个击破。"
 POD_anteshuntyamakings.24.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n当你逐渐逼近[Glossary('多可尔汗','podgloss.dokhorkhan')]的宫殿时，你的部队所遭受的袭扰已变得几乎难以忍受。你正不断损失越来越多的兵力，而这地狱的无尽战士们却似乎永不疲弱。尽管如此，这种持续的战争状态也带来了机会。\n\n[Glossary('多可尔汗','podgloss.dokhorkhan')]的军队被迫持续作战，甚至彼此之间也不例外。虽然他们目前专注于你的入侵，但只要稍加误导，就足以重新点燃各部落间的纷争。\n如果一切顺利，这将减轻你部队所承受的压力，并在敌人的阵营中制造分裂。"
 POD_anteshuntyamakings.24.a: "他们在抢你们的功劳！"
 POD_anteshuntyamakings.24.effect.success.desc: "一切尽在掌握。"
 POD_anteshuntyamakings.24.critical.failure.effect.desc: "到处都是弓骑兵……"
 POD_anteshuntyamakings.25.t: "偏袒自己人"
 POD_anteshuntyamakings.25.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n在[Glossary('刺链地狱','podgloss.hellofspikedchains')]中最强大的部族是\"宠眷部族\"。这些被[Glossary('多科尔汗','podgloss.dokhorkhan')]亲自挑选的战士拥有充分自由去践踏其他部族，并对受害者施加难以言状的折磨。对这里的灵魂而言，成为宠眷部族是唯一的喘息之机，尽管随时可能失宠，而跌落的过程确实痛苦不堪。\n\n这种残酷的野心产生了一个副作用：最强大的宠眷者们会不断寻找方法进一步提升自己的地位，甚至包括可能推翻[Glossary('多科尔汗','podgloss.dokhorkhan')]本人。虽然这想法本身看似荒谬，但当你将地狱置于围困状态并逐渐逼近[Glossary('阎魔王','podgloss.yamaking')]时，这个前景就变得愈发真实可及。\n\n联系那些最具野心的宠眷者，并暗示在你对付他们的主人后，他们有机会取而代之，这将能让他们暂时站在你这一边。但是，你真的能信任这些被永恒的欺骗与战争所玷污的灵魂吗？"
 POD_anteshuntyamakings.26.t: "马贼头子的老巢"
 POD_anteshuntyamakings.26.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\n这是一场决定性的战役，如果你的军事力量不如[Glossary('多科尔汗','podgloss.dokhorkhan')]，那么你的道路将在此终结。#!\n\n[Glossary('多科尔汗','podgloss.dokhorkhan')]的最后一道防线，由他最核心的一批宠信[akuma|E]组成。这些恶鬼汲取了[Glossary('阎魔王','podgloss.yamaking')]在征服草原过程中占据的众多能量节点所散发的污秽能量，变得异常臃肿强大。他最近的一些宠物项目[Glossary('安达','podgloss.anda')]和[akuma|E]也出现在了战场上，尽管它们不稳定的外表暴露了其未完成的状态。看来[Glossary('多科尔汗','podgloss.dokhorkhan')]正在将所有仍然忠于他的人马和一切力量都投入来对抗你的军队，但令人意外的是，他本人至今仍未现身。\n\n这支由精英战士和半成品实验体组成的杂烩军队极难被击溃，尤其在你的部队后方仍受残余部落袭扰的情况下。这将是对你军队剩余耐力与战斗意志的终极考验。"
 POD_anteshuntyamakings.26.a: "滚出来！"
 POD_anteshuntyamakings.27.t: "幽冥马匪头子"
 POD_anteshuntyamakings.27.desc: "当你终于踏入宫殿，你终于见到了你的目标。\n[Glossary('多科尔汗','podgloss.dokhorkhan')]身躯臃肿不堪，正用由凡人胃囊缝制的袋子狂饮着酸蚀性的血液。在征服草原的过程中，他窃取了庞大的能量，此刻这些能量在他体内充盈鼓胀，让他整个人显得极不稳定，仿佛随时都会由内而爆。\n\n但这并未让他变得稍逊威胁。尽管他缺乏战斗技巧（更谈不上优雅），但其纯粹的力量足以弥补一切。而你若击中错误部位便可能引发连锁反应的担忧，更是让情况雪上加霜。"
 POD_anteshuntyamakings.27.a: "一步都没走错……"
 POD_anteshuntyamakings.27.critical.failure.effect.desc: "#italic 轰！#!"
 POD_anteshuntyamakings.28.t: "刺链地狱"
 POD_anteshuntyamakings.28.desc: "当[Glossary('多科尔汗','podgloss.dokhorkhan')]在你面前伴随着令人作呕的声响崩塌时，你迅速意识到你的胜利只是昙花一现。这位[Glossary('阎魔王','podgloss.yamaking')]的陨落，不仅释放了残存的部族，也引来了他的宿敌，幽冥之主们企图征服这片地狱。\n\n整个领域陷入一片混乱，残存的宠眷者们与让达的瘟疫使者、[Glossary('斗姆','podgloss.toumu')]的铁魔，在一场完全失控的暴力漩涡中厮杀。\n\n更糟的是，作为击溃[Glossary('多科尔汗','podgloss.dokhorkhan')]的人，所有这些派系都认为，除掉你将为他们接管此境提供强有力的宣称。你麾下这支元气大伤、疲惫不堪的队伍，此刻必须竭尽全力，或凭借战术天才，设法逃离这天堂地狱之下最危险的地方。"
 POD_anteshuntyamakings.28.a: "快跑！赶紧跑！"
 POD_anteshuntyamakings.28.effect.success.desc: "不知怎的，我们逃出来了。"
 POD_anteshuntyamakings.29.t: "成功逃脱，反败为胜"
 POD_anteshuntyamakings.29.desc: "当你的部队设法逃离已然化作混乱战场的[Glossary('刺链地狱','podgloss.hellofspikedchains')]后，终于能在物质界休整并庆祝胜利。你猛然意识到自己真的做到了——成功阻止了那位几乎要登上[Glossary('魔皇','podgloss.demonemperor')]宝座的存在。虽然他的陨落显然会导致其地狱被其他势力瓜分，但其他[Glossary('阎魔王','podgloss.yamaking')]恐怕需要数十年才能完全掌控，在此过程中他们也将因内斗而削弱。\n\n因此，你的胜利虽不足以彻底阻止终末的降临，却很可能将其推迟许久。\n\n更何况，既然连[Glossary('多科尔汗','podgloss.dokhorkhan')]这般强大的存在都能被击败，假以时日或许其他阎魔亦会步其后尘。这希望或许荒诞，但在你这场英勇胜利之后，它已显得无比真实。"
 POD_anteshuntyamakings.29.a: "恶魔王座上的一道裂痕"
 POD_anteshuntyamakings.10.t: "黑暗中不止我一人"
 POD_anteshuntyamakings.10.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n阎魔王被普遍视为[Glossary('阎魔王','podgloss.yamaking')]中最强大的一位。这位冷酷而有条不紊的存在，自其作为阿伊努亡者复仇之神的最初日子起，便一直在向[Glossary('魔皇','podgloss.demonemperor')]的宝座缓慢攀登。与大多鲁莽冲动的同辈不同，阎魔王行动迟缓，谋划长远。\n这使他取得了极大的成功，包括消灭了一些较小的对手，并将他们的疆域并入己有。\n\n这对你的计划构成了严重阻碍。坦率地说，没人愿意与阎魔王开战，因为这听起来像是一场自杀任务。更糟的是，即使试图引诱他的[Glossary('阎魔王','podgloss.yamaking')]对手们发起协同进攻，效果也微乎其微。阎魔王一向谨慎，从未与同辈结下不死不休的仇怨，只在有能力终结纷争时才会挑起争端。\n\n因此，只有一个增援你方进攻的方案可行：向每一个足够愚蠢或走投无路、愿意不顾胜算加入你方队伍的存在，大肆撒钱并许以好处。"
 POD_anteshuntyamakings.10.a: "我们需要你！还有你！"
 POD_anteshuntyamakings.10.b: "我的核心力量就足够了。"
 POD_anteshuntyamakings.11.t: "夜间巡逻"
 POD_anteshuntyamakings.11.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n你正在准备启程前往[Glossary('断绝','podgloss.kakuri')]，但若认为此次突袭，能速战速决，那便是愚不可及。你将要离开一段时间，而更糟的是，阎魔在凡间有许多爪牙，一旦你威胁到他们的主子，他们必将对你的疆域发动进攻。\n\n正如明智的将帅所深知，若补给线（此处指与凡世的联系）被切断，那整场战争便必败无疑。因此，你有两个选择：要么启程离去，期盼你的疆域在你无暇直接监管的情况下得以维系；要么留下一部分兵力守卫后方，同时心知肚明他们在彼岸的战线上将不可或缺。"
 POD_anteshuntyamakings.11.a: "我的界域很强大。"
 POD_anteshuntyamakings.11.b: "我们的后方必须确保安全。"
 POD_anteshuntyamakings.12.t: "分头行动，逐个击破。"
 POD_anteshuntyamakings.12.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n荒凉而充满敌意，无光且严寒，[Glossary('断绝','podgloss.kakuri')]正是阴之力最为腐化堕落的体现。你首先注意到的是这里的黑暗永无止境——没有任何光芒能玷污阎魔王所钟爱的永恒长夜，被囚于此的人永远等不到带来希望的黎明。\n偶尔，覆盖这片地狱的积雪会散发出微弱的白光，但这柔光仅够受刑者看清自己永无休止的肢解过程。\n\n[Glossary('断绝','podgloss.kakuri')]的寒风刺骨，裹挟着刀锋般的冰晶，撕开衣物、剐蹭皮肉。[Glossary('断绝','podgloss.kakuri')]的风还会令人失明，曾有不幸的旅人在猛烈的暴风雪中几分钟内便被剥得只剩白骨。\n多数时候，[Glossary('断绝','podgloss.kakuri')]本身的折磨已足够让阎魔王满意。即便偶尔点燃火焰，也毫无暖意，只会在苍蓝微光中摇曳片刻，随即被永不停息的风吞噬。\n\n果然如你所料，这位[Glossary('阎魔王','podgloss.yamaking')]选择将全部兵力撤回城堡，而非与你正面交锋。因此你的首要任务，便是建立通往凡世的补给线，准备在这片荒芜之地展开长期围困——毕竟此地，找不到任何资源。"
 POD_anteshuntyamakings.12.a: "守住入口，搭起帐篷。"
 POD_anteshuntyamakings.12.effect.success.desc: "按计划进行。"
 POD_anteshuntyamakings.12.critical.failure.effect.desc: "多么冰冷死寂……"
 yk_hunt_jizo_help_tt: "地藏的帮助在未来可能会起到关键作用。"
 POD_anteshuntyamakings.13.t: "高尚之人"
 POD_anteshuntyamakings.13.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n除了阎魔王及其仆从之外，只有一位存在能安然无恙地穿行于黑暗的[Glossary('断绝','podgloss.kakuri')]。其名为地藏菩萨，他具象着阎魔王所摒弃的崇高尊严。\n地藏菩萨显现为一位身形清瘦、身着黑色或橘黄僧袍的秃头僧侣。他曾援助并指引过无数困于此地的灵魂。他禅杖顶端的铜环在行走时会叮当作响，以此警示微小生灵避让，以免无意中伤害它们。\n\n从未有人见过地藏菩萨显露恐惧或愤怒，他在任何情况下都显得从容平静。据目击者称，他曾对胆敢追猎他的[Glossary('泉津','podgloss.shikome')]说过几句话，结果那些[Glossary('泉津','podgloss.shikome')]竟哭泣着逃窜。许多[Glossary('泉津','podgloss.shikome')]在听闻地藏菩萨的教诲后不久，便离开了阎魔王的麾下。\n\n在所有曾踏足[Glossary('断绝','podgloss.kakuri')]的存在中，地藏是唯一一位曾让阎魔王真正感到忌惮的。每当这位面带微笑、口哨轻响的身影出现在[Glossary('断绝','podgloss.kakuri')]，那位伟大的[Glossary('阎魔王','podgloss.yamaking')]便会退避到他的堡垒深处。\n\n你早已知晓此等声名，一直计划寻求这位奇异存在的帮助。所幸，地藏菩萨被你大军引发的骚动所吸引，已自行来到你的营地询问缘由。\n你已备好一番慷慨陈词以说服他加入你的事业——但坦白说，若有必要，你也做好了恳求甚至乞怜的准备。毕竟许多人认为，若得不到这位尊者某种形式的帮助，你的远征注定失败。"
 POD_anteshuntyamakings.13.a: "我们可以彻底阻止他！"
 POD_anteshuntyamakings.13.effect.success.desc: "谢谢。"
 POD_anteshuntyamakings.13.critical.failure.effect.desc: "老糊涂..."
 POD_anteshuntyamakings.13.b: "我们向您祈求，阁下"
 POD_anteshuntyamakings.14.t: "非得是蜘蛛不可"
 POD_anteshuntyamakings.14.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n你一进入这片领域，阎魔王就带着他最信任的仆从们退回了自己的城堡，而其他生物则在[Glossary('断绝','podgloss.kakuri')]的荒芜之地游荡。其中数量最多的是依附于阎魔王的女蜘蛛精。这些生物在领域最深处的阴影中占据了巢穴，尽可能地捕捉灵魂，并吸取这些倒霉受害者的气。\n这些丑陋的女猎手偶尔会充当[Glossary('阎魔王','podgloss.yamaking')]的猎人。她们的首领自诩为蜘蛛精的“女王”，并自认为是暗之大名的配偶。非蜘蛛精的生物认为她肆意妄想，但其中能强大到足以揭穿她的谎言并活下来的存在少之又少。\n\n蜘蛛精察觉到有机会在主人的眼中提升地位，于是发动了全面进攻，企图消灭你的军队。虽然你的军队实力强大到足以应对这些来袭的生物，你仍需保持谨慎。\n如果他们给你这一方造成过多伤亡，整个进攻计划都可能功亏一篑。"
 POD_anteshuntyamakings.14.a: "注意那些蛛网！"
 POD_anteshuntyamakings.14.effect.success.desc: "清理它们"
 POD_anteshuntyamakings.14.critical.failure.effect.desc: "该死的蜘蛛……"
 POD_anteshuntyamakings.15.t: "令人毛骨悚然之人"
 POD_anteshuntyamakings.15.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n艾玛·欧最著名的仆从，无疑是[Glossary('泉津','podgloss.shikome')]。\n\n艾玛·欧经过反复试验，打造了这支凶猛的女[akuma|E]军团，作为他的保镖、仆人和妃嫔。他残酷地训练他的仆从，直到她们成为理想的阴性杀手，既沉默寡言、冷酷无情以及诡计多端。\n每一位[Glossary('泉津','podgloss.shikome')]都由阎魔王亲自挑选，并精心诱骗成为他的[akuma|E]之一。她们之间有很多相似之处：每一位都拥有残酷的美丽，并且完全是反社会人格。大多数[Glossary('泉津','podgloss.shikome')]都是阴气和骸骨神体之术的大师。\n\n[Glossary('泉津','podgloss.shikome')]最危险的能力是操纵男人的技巧。[Glossary('泉津','podgloss.shikome')]像大多数$pod_kueijin$吸食气一样，以男人的意志力为食。女人天生厌恶[Glossary('泉津','podgloss.shikome')]并试图攻击她们，反之男人却会为她们做任何事，满足她们的一切愿望，甚至为她们而死，只为换取一个温柔的眼神（尽管他们永远也得不到）。\n\n显然，你在进入这个领域之前就已经尽你所能地训练你的力量来抵抗这种致命的操纵。看来这些训练即将接受考验。\n艾玛·欧并没有对你的营地发动大规模进攻，而是派出了他最精明的几个[Glossary('泉津','podgloss.shikome')]潜入你的围城，戏耍你的军队。在你反应过来之前，他们早已消失得无影无踪。虽然阎魔王在这场阴险的袭击中不会损失任何仆从，但对你军队的影响还有待观察。"
 POD_anteshuntyamakings.15.a: "都给我冷静下来！"
 POD_anteshuntyamakings.15.effect.success.desc: "危机解除"
 POD_anteshuntyamakings.15.critical.failure.effect.desc: "被洗脑了……"
 yk_hunt_ainu_help_tt: "寻找阿伊努冥界在未来可能会起到关键作用。"
 POD_anteshuntyamakings.16.t: "他最初的目的"
 POD_anteshuntyamakings.16.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n自你进入此界以来，阎魔王及其军队始终固守在那座坚不可摧的城堡中，这使你的选择余地越来越小。强攻无异于自取灭亡，因此设法迫使这位黑暗大名出城迎战才是更明智之举。但究竟什么能让如此冷酷精明的存在勃然大怒，以至于做出这般鲁莽之举？\n\n你的谋士提及一则传闻：阎魔王虽已成为[Glossary('阎魔王','podgloss.yamaking')]以报其族群受日本侵凌之仇，但他始终未曾忘却自己最初作为阿伊努亡者守护者的使命。\n若传闻属实，此界某处应藏有通往阿伊努冥界的真正入口，至今仍为那些值得进入的该族灵魂开放。如果能找到并威胁此处，或许足以令阎魔王那冰封的血液也为之沸腾。"
 POD_anteshuntyamakings.16.a: "到处看看！"
 POD_anteshuntyamakings.16.effect.success.desc: "给你..."
 POD_anteshuntyamakings.16.critical.failure.effect.desc: "只是谣言吗？"
 POD_anteshuntyamakings.16.b: "召集我们的后备力量，一同加入搜寻！"
 POD_anteshuntyamakings.17.t: "断绝宫殿"
 POD_anteshuntyamakings.17.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n\"断绝之堡\"是这片地狱中唯一辉煌的所在，它被精心构筑于一座巨大山峰的顶端，使其固若金汤。这是艾玛·欧的堡垒，其精心打造的黑曜石城墙与城垛，正是他虚荣与自负的证明。城堡由[Glossary('阎魔王','podgloss.yamaking')]麾下最强大的[Glossary('泉津','podgloss.shikome')]占据，她们侍奉在他左右，既是护卫也是嫔妃。\n\n被困于[Glossary('断绝','podgloss.kakuri')]的灵魂以及你自己的军队，都能听到从山上飘下的诡异声响，这让他们不禁猜想其中进行着何等堕落之事，同时也提醒着他们，那些尘世的欢愉或许再也无法体验。\n\n艾玛·欧在此地拥有绝对优势。作为灵体存在，他和他的恶魔可以无限期地承受围困，而你的军队显然做不到。发动强攻也绝无可能，因为整座城堡从建造到选址，都是为了抵御艾玛·欧的敌对[Glossary('阎魔王','podgloss.yamaking')]们整支整支的军团而设计的。"
 POD_anteshuntyamakings.17.desc.b: "\n\n幸运的是，你诱使阎魔王犯错的计谋奏效了。通过联合他的宿敌地藏菩萨，并威胁其钟爱的阿伊努冥界，这位素来冷酷精明的黑暗大名被激起了足以迫其出战的炽烈怒火。\n看到城堡大门洞开、涌出[Glossary('泉津','podgloss.shikome')]军团时，你虽稍感宽慰，却立刻提醒自己这仍将是一场前所未有的恶战。你的军队已在长期围困中损耗疲弱，而阎魔王的恶魔部队却毫发未伤。\n\n你只能指望残余的兵力足以再支撑片刻。\n\n#R 此为决战关头，若你的军事力量低于阎魔王，你的道路将在此终结。#!"
 POD_anteshuntyamakings.17.desc.c: "日子一天天过去，转眼已是数周，除了军中士气日益低落外，一切毫无变化。看来这位[Glossary('阎魔王','podgloss.yamaking')]甘愿等待，而他确实拥有等待的资本。无论怎样挑衅或示威，都无法撼动他分毫。\n\n你曾短暂考虑发动强攻，但很快打消了念头。这座城堡被铸就为[Glossary('魔皇','podgloss.demonemperor')]不朽的王座。你的军队已在[Glossary('断绝','podgloss.kakuri')]严酷环境的折磨下伤痕累累，绝无可能赢得这样的战役。\n\n随着军中不满之声日益高涨，你离开凡人世界的时间也令人愈发忧虑，剩下的唯一选择已不可避免。怀着沉重的心情，你下令撤军。\n\n阎魔王似乎很满意于用耐心赢得这场对峙，并未试图阻拦你。\n\n你回到了自己的领地。虽未竟全功，但至少希望这次行动能在[Glossary('阎魔王','podgloss.yamaking')]对于他们必然胜利的自信上，留下一道裂痕。"
 POD_anteshuntyamakings.17.a: "情况本可能更糟。"
 POD_anteshuntyamakings.17.b: "坚守阵地！"
 POD_anteshuntyamakings.17.c: "那是阎魔王本人吗？！"
 POD_anteshuntyamakings.18.t: "断绝之战"
 POD_anteshuntyamakings.18.desc: "即便被你的行为激怒，艾玛·欧也并未愚蠢到让怒火危及自身安危。他没有像某些更傲慢的[Glossary('阎魔王','podgloss.yamaking')]那样在王座厅等候或发表长篇独白，而是直接率领他的[Glossary('泉津','podgloss.shikome')]向你的军队发起冲锋。\n\n这使得局势变得远超预期的棘手。\n\n黑暗大名有着一股压倒性的力量，而他身边强大的[Glossary('泉津','podgloss.shikome')]更使得集中兵力围剿他成为不可能。因此，你必须在此扮演统帅的角色。艾玛·欧的突袭并未能让他轻易完成军队部署，而若你能保持军队纪律并善用此优势，希望或许尚未破灭。\n待吾最后一搏，胜负犹未可知。你尚可调动至今主要驻留于凡俗世界的后备部队。尽管他们充其量只能充当炮灰，但这仍可能扭转战局。"
 POD_anteshuntyamakings.18.a: "包围他们！"
 POD_anteshuntyamakings.18.effect.success.desc: "还没完成呢……"
 POD_anteshuntyamakings.18.critical.failure.effect.desc: "如此强大的力量……"
 POD_anteshuntyamakings.18.b: "召集我们的后备军！一个都不能落下！"
 POD_anteshuntyamakings.19.t: "暗之大名"
 POD_anteshuntyamakings.19.desc: "随着[Glossary('泉津','podgloss.shikome')]在你的军队面前逐一倒下，通往胜利的道路上仅剩最后一道障碍——艾玛·欧本人。\n\n你的对手身形异常高大，蓄着黑须，眼中满溢恶意。裸露在外的肌肤如黑曜石般漆黑，由至纯的阴物质构成。他身披精致的，绘有战争、瘟疫与死亡纹饰的阿伊努织袍。手中所持的至阴之刃，正是曾斩杀敌对[Glossary('阎魔王','podgloss.yamaking')]——阎罗的凶名赫赫之器。\n\n艾玛·欧的攻势迅捷果决。他动作凌厉，每次挥刃或攻或守，招式间全无情绪可察，亦无破绽可循。\n\n你正面对的，是近乎登临[Glossary('魔皇','podgloss.demonemperor')]之位的存在——注定在下一个纪元主宰全宇宙的君主。即便此刻他深陷重围，这场战斗却也无疑是你生命中最凶险的较量。"
 POD_anteshuntyamakings.19.a: "稳住……"
 POD_anteshuntyamakings.19.effect.success.desc: "完成了吗？"
 POD_anteshuntyamakings.190.t: "黑暗中的光芒"
 POD_anteshuntyamakings.190.desc: "阎魔王倒在地上，身体开始逐渐消散。然而……四周并未发生明显的变化。[Glossary('断绝','podgloss.kakuri')]依旧寒风凛冽，城堡巍然矗立然而[Glossary('泉津','podgloss.shikome')]也未能恢复原貌。尽管如此，一切仍让人感到截然不同。\n\n此地曾是阿伊努冥界，或许在未来某个时日将慢慢回归其最初的状态。阎魔王在崛起过程中吞噬的其他领域也将逐一复原，有望为地狱恢复些许平衡。\n\n最有力的[Glossary('魔皇','podgloss.demonemperor')]竞争者已然败亡，其他人想要达到阎魔王曾企及的高度，恐怕还需数个世纪。仅此一点便意味着，你已成功守护凡人世界，使其在漫长岁月里免于陷入绝望。希望你的壮举也能让其他[Glossary('阎魔王','podgloss.yamaking')]更加审慎行事，从而为将来可能取得更多的胜利赢得更充足的时间。\n\n当你拾起阎魔王的长刃时，你能真切感受到自己已然改变了这个世界。\n\n或许，这种改变将是永久的。"
 POD_anteshuntyamakings.190.a: "王座崩塌。"
 yk_death_faith_random_tt: "信仰已死阎魔的角色将皈依另一个“无量地狱”信仰。"
 yk_death_faith_yours_tt: "所有信仰已死阎魔的角色将会皈依你的信仰。"
 POD_anteshuntyamakings.56.critical.failure: "我们太傻了。 "