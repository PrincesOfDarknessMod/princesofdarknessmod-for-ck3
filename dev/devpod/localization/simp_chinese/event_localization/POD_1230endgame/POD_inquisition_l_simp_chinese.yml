l_simp_chinese:
 PODinquisition.0001.t: "裁判之年"
 PODinquisition.0001.desc: "令人担忧的报道已引起你的注意。所谓的“暗影裁判所”似乎已经受够了它名字中的暗影二字。他们突然获得了凡人的统治者和机构的支持，在世界各地引起了连锁反应。这一行动已经计划了几十年，甚至几百年，到目前为止，他们所有的攻击都只是进行遏制和收集信息。但此以吸血鬼为目标的阴谋的实际范围可能比你想象的要大得多。\n到处的凡人都在具有天赋的猎人的后面武装自己，决心打倒长期困扰他们的夜间怪物。\n业报来了。"
 PODinquisition.0001.a: "这肯定会过去的。"
 PODinquisition.0001.b: "教友们与修女们武装起来！让我们完成猎魔吧！"
 PODinquisition.1001.t: "暗影裁判：法兰西"
 PODinquisition.1001.desc: "裁判所就是从这里开始的。\n在清洁派起义期间，许多圣职人员在法兰西南部找到了出路，寻找异端。他们发现了更多。法兰西$pod_cainite$卷入了巴黎和图卢兹之间的阴谋，双方都乐于利用凡人和起义为自己谋利。\n他们没有料到教廷会有如此坚定的信心和决心。吸血鬼在阿尔比十字军东征期间被杀，而关于这个新威胁的信息被带回了圣座。剩下的就是历史了。\n正因如此，法兰西成为目前世界各地的公开裁判的早期主要目标也就不足为奇了。"
 PODinquisition.1001.a: "十字已来再次清洗法兰西。"
 PODinquisition.1001.player_warning: "不剩多少准备时间了。"
 PODinquisition.1002.t: "暗影裁判：大不列颠"
 PODinquisition.1002.desc: "裁判所的英格兰的工作总是会遇到困难。密特拉对这个国家的控制，以及这里人民的与世隔绝，使得天主的代理人很难完成他们神圣的使命。然而，他们从不妥协，于是找到了一个合适的解决办法：利用布列塔尼的白鼬骑士团作为净化英格兰的集结地。\n就这样，在他们的女大团长身后，忠诚又虔诚的布列塔尼人和英格兰人一起走入净化岛屿的道路。这是一次全面的攻击，教廷没有任何保留，并打算果断地打击那些不愿妥协的吸血怪物。如果这一大胆的策略奏效，英格兰或许还能得救。"
 PODinquisition.1002.a: "看起来教廷永不悔改，即使在这里。"
 PODinquisition.1003.t: "暗影裁判：德意志"
 PODinquisition.1003.desc: "虽然法兰西是裁判所的真正发源地，但德意志却是它跳动的心脏。当中世纪早期的暗影裁判所开始分崩离析时，是奥地利贵族利奥波德·冯·穆尔瑙召集了所有听从天主召唤的人加入他的秘密团体。这个“利奥波德社团”几个世纪以来一直是教廷攻势背后的主要力量，现在正在准备最后的攻击。\n然而，这个社团并不是军事势力，在一些妥协之后，它将听从于条顿骑士团前往神圣罗马帝国清除地狱的下仆。在充分了解了敌人的威力后，骑士们现在在多特蒙德有了立足之地，他们计划在那里慢慢地声张天主之怒的正义。"
 PODinquisition.1003.a: "条顿人能胜任这项艰巨的任务吗？"
 PODinquisition.1005.t: "暗影裁判：伊比利亚"
 PODinquisition.1005.desc: "伊比利亚一直是信仰的中心。因此，军事骑士团是众多的，这为暗影裁判所提供了一个非常坚实的机会。要说服各种各样的骑士团来清除伊比利亚的吸血怪物是很容易的，但要让他们真正合作就很难了。\n教廷用裁判所最早分支的创始人罗德里格·德·纳瓦拉的形象作为伊比利亚人的共识点。这个计划被证明是有效的，庞大的十字军骑士军势现在聚集在葡萄牙准备开始解放伊比利亚。所有的王国和骑士团最终携手合作，看来裁判所在这里的胜利已成定局。"
 PODinquisition.1005.a: "意料之中"
 PODinquisition.1006.t: "暗影裁判：斯堪的纳维亚"
 PODinquisition.1006.desc: "裁判所对斯堪的纳维亚的影响一直很有限。这片土地严酷而分裂，即使是最热心的裁判官也怀疑$pod_cainites$是否能在这里繁荣昌盛。因此，圣座最初的计划并不针对这个地区。\n正是一位北方人，阿尔伯恩，的奉献和真正的信仰，改变了教宗陛下的心意。阿尔伯恩为他的事业辩护，描述了斯堪的纳维亚上吸血鬼的阴险控制，特别是在遥远的北方。罗马已经决定派遣一支强大的远征队来帮助阿尔伯恩完成他的使命。时间会证明这是否是一个好的选择。"
 PODinquisition.1006.a: "十字甚至到达了世界的边缘。"
 PODinquisition.1007.t: "暗影裁判：意大利"
 PODinquisition.1007.desc: "裁判所把他最好的军队放在了意大利是不足为奇的。因长期以来被该隐的受诅咒的子嗣们所腐化，所以圣座想要对意大利人进行神罚，这是自圣经大洪水以来从未见过的。\n让·德·拉斯提克是罗德岛的著名捍卫者，也是医院骑士团的大团长，他的使命是烧毁所有他能找到的吸血鬼。他被指派了一股强大的力量来帮助他完成这神圣的努力。就罗马教廷而言，整个世界都悬在意大利之战的天平上。我们不会妥协，不会投降，不会宽恕。意大利会被拯救的，这是天主的要求。"
 PODinquisition.1007.a: "这就是意大利$pod_cainites$的终结了么？"
 PODinquisition.1008.t: "暗影裁判：黎凡特"
 PODinquisition.1008.desc: "十字军国家早已消失在黎凡特，但教廷从未忘记来自他们的令人不安的报告。很明显，即使在这块最神圣的土地上，受诅咒的$pod_cainites$也统治着夜晚。\n对暗影裁判所来说，在这里发动攻击一直是件不容易的事，因为这片土地已被敌人掌握，但是……这些充满敌意的敌人终究还是人。于是，一场漫长而艰巨的外交进程开始了。意大利最优秀的谈判代表夜以继日地工作，试图说服过去的敌人让他们在黎凡特开展行动。他们最终说服了他们，随着裁判所在各地兴起，一支献身而出的圣骑士队伍正准备拯救圣地免受最险恶的威胁。"
 PODinquisition.1008.a: "在圣地，$pod_cainites$联合了凡人对抗他们。"
 PODinquisition.1009.t: "暗影裁判：阿拉伯"
 PODinquisition.1009.desc: "虽然穆斯林世界长期缺乏骑士团传统，但这并不意味着它对$pod_cainite$的威胁视而不见。在很长一段时间里，麦加本身作为一个完美的保护，通过它散发出的纯粹的信仰来击退怪物。但时代变了，狡猾的吸血怪物们似乎想出了对策。\n然而，一切都还没有结束，一个由志趣相投的部落成员组成的小家庭开始组织猎杀活动。这个新社团，即精诚兄弟社，由于迄今为止的大量记录而迅速发展，现在已强大到足以对已知的$pod_cainite$阵地发动重大攻击。"
 PODinquisition.1009.a: "阿拉伯血族将终结于骄阳之下。"
 PODinquisition.1010.t: "暗影裁判：波斯"
 PODinquisition.1010.desc: "在更广泛的穆斯林世界中，猎人从未真正在波斯扎根，哈基姆$pod_clan$在该地区的完全控制是最有可能的罪魁祸首。不过对于一个有献身精神的猎人来说，组织并不是唯一重要的东西。因此，个人，甚至是小群体，总是该隐的子嗣们的眼中尖刺。\n当世界的其他地方都被吞噬在凡人的反击中时，几个小团体在波斯匆忙组成了联盟，想从周围的混乱中获利，希望能给夜中的怪物们致命一击。"
 PODinquisition.1010.a: "波斯比大多数人类所意识到的要古老。"
 PODinquisition.1011.t: "暗影裁判：印度"
 PODinquisition.1011.desc: "印度有猎杀怪物的悠久传统。然而，这一传统经常被一些比猎物本身好不了多少的团体用作前线，这种做法严重阻碍了一个统一组织的创建，就像在欧洲发生的那样。\n因此，即使西方世界陷入大火，印度也相对没有受到混乱的影响。有小报告称信德省周围聚集了一些志同道合的猎人，这可能会使印度真正的统治者谨慎行事。"
 PODinquisition.1011.a: "没有什么能真正改变这片永恒之战之地。"
 PODinquisition.1012.t: "暗影裁判：马格里布"
 PODinquisition.1012.desc: "远离基督教裁判所的影响，马格里布仍然饶有兴趣地注视着对$pod_cainites$的大规模攻击。长期以来，同样的威胁一直困扰着它的居民，他们形成了一支独立的猎人传承，古兰赛义德。\n这些猎人现在，第一次，希望联合起来，希望利用欧洲的混乱来猎杀那些在他们的海岸寻求庇护的$pod_cainites$。"
 PODinquisition.1012.a: "这里不接纳吸血鬼避难。"
 PODinquisition.1013.t: "暗影裁判：埃及"
 PODinquisition.1013.desc: "埃及人已经意识到怪物的存在很久了。正是拜巴尔斯本人，第一位马穆鲁克苏丹，发现了藏在他们土地上的古蛇崇拜者。他策划的大清洗至今仍能被赛特之子感受到，但遗憾的是拜巴尔斯自己被他们的一名手下杀害了。\n从那以后，$pod_cainites$回到了他们的寺庙，恢复他们失去的力量。但是在欧洲反抗该敌人的起义中，拜巴尔斯的遗产被一群年轻的马穆鲁克人所继承，他们决心为他们死去的祖先复仇。"
 PODinquisition.1013.a: "蛇们还能再忍受这风暴吗？"
 PODinquisition.1014.t: "暗影裁判：特兰西瓦尼亚"
 PODinquisition.1014.desc: "直到今天晚上，教廷仍然对大量的吸血鬼在特兰西瓦尼亚横行的报道感到震惊。有些人表现得像贵族，更糟的是，他们自称为神！遗憾的是，这个地区有争议的宗教情况从未让他们真正控制和收容这里的局势。\n所以他们必须做一些新的事情，以“授权”的形式将净化使命交给龙骑士团。龙骑士团非常了解吸血鬼之类的事物，到目前为止已经成为裁判所的重要盟友。但是，在罗马的各个角落，有些人怀疑，在他们的使命完成后，有必要对他们进行更近距离的观察……"
 PODinquisition.1014.a: "巨龙对抗吸血鬼。"
 PODinquisition.1015.t: "暗影裁判：希腊"
 PODinquisition.1015.desc: "自第四次十字军东征以来，暗影裁判所就知道希腊存在吸血怪物，这显然是他们的责任。不然怎么会出这么大的问题呢？在很长一段时间里，拉丁帝国被当作裁判所揭露真相时的进攻基地，但是……计划的这一部分显然出了问题。\n教宗陛下没有忘记东方的基督徒，尽管他们可能很任性。因此，他最近成立了圣母伯利恒骑士团，以正义的使命将肮脏的$pod_cainites$从这片失落的土地上清除出去。那么，也许，拜占庭能够在灵魂上得到拯救，而不是在肉体上。"
 PODinquisition.1015.a: "法兰克人回到了东罗马。"
 PODinquisition.1016.t: "暗影裁判：俄罗斯"
 PODinquisition.1016.desc: "东正教有自己的裁判机构，被称为边防军的猎人团体。即使是暗影裁判所也因其对正义的不懈追求而受到尊重，边防军也知道他们的西方同行对不死族发动大规模进攻的计划。\n经过一番说服和谈判，他们终于同意参与其中，收集有关俄罗斯$pod_cainites$及其手下的信息。这个情报现在会很有用，因为边防军的督主教自己正在莫斯科附近的战场上发动他们组织迄今为止最重要的进攻。"
 PODinquisition.1016.a: "他们来自俄罗斯……"
 PODinquisition.1017.t: "暗影裁判：东欧"
 PODinquisition.1017.desc: "暗影裁判所对东欧的看法很矛盾。虽然过去原始教徒的大量存在似乎表明了$pod_cainites$的影响，但他们在实际确认这一理论时遇到了困难。因此，罗马决定打持久战，在两个世纪前创建了多布任骑士团。\n这些骑士一直保持低调，甚至在一段时间后被正式解散，但他们真正的使命现在才刚刚开始。聚集了一群献身于信仰的战士，并在暗影裁判所组织的帮助下，骑士团成为了对吸血鬼的大裁判十字军的一部分，对那些邪恶可憎的东西发动了全面的攻击。"
 PODinquisition.1017.a: "即使是被遗忘的骑士团也归来战斗了！"
