 PODinquisition.1001.player_warningb: "在这段时间里出现的裁判官会接受你给出的要求臣服提议，如果你给的话。"
 PODinquisition.100.t: "无地裁判官"
 PODinquisition.100.desc: "作为天主教会的一个派别，即使你没有自己的土地，你也必然会受到罗马教廷的审查。你的大部分支持（无论是精神上的还是物质上的）都来自同情你事业的教会成员。如果你想保持你的神圣组织，你必须遵守教廷对你行为的审查。\n#X 作为一名无地裁判官，你有一个数值（你可以在同名的决定中查看），叫做教廷支持度，表明教会有多重视你的行动。你可以通过达成特定的合同或赢得与超自然者的战争来提高你的教廷支持度。你可以花费教廷支持度来获得各种恩惠（通过一个决议），这可以加速你达到最终目标：将地狱的仆从从欧洲和圣地驱逐出去。\n请注意，每次红衣主教选举新教皇时，教皇特使都会被派往你的阵营评估你的热情。如果他得知你使用未经批准的知识，如术法或恶魔学，他会不高兴的。如果你更进一步，比如以任何方式成为崇魔者或不朽者，你将被逐出教会。#!"
 PODinquisition.100.a: "我们需要罗马，罗马也需要我们。"
 POD_landless_inquisition_victory_decision_custom: "所有[independent_ruler|E]在[GetGeographicalRegion('world_europe').GetName]境内及#ONCLICK:GEOGRAPHICAL_REGION,world_middle_east_jerusalem #TOOLTIP:GEOGRAPHICAL_REGION,world_middle_east_jerusalem #L 圣地#!#!#!必须信奉[GetReligionFamily('rf_hunters').GetName][religion|E]"
 POD_landless_inquisition_victory_decision_custom_ex: "$POD_landless_inquisition_victory_decision_custom$#weak （无效统治者示例：[example.GetFirstName]）#!"
 POD_landless_inquisition_victory_decision: "最终圣约"
 POD_landless_inquisition_victory_decision_tooltip: "为了裁判所的胜利，他们必须从我们的领土上被清洗。"
 POD_landless_inquisition_victory_decision_desc: "暗影裁判廷的终极目标看似简单，实现难度却与其明晰度相当——要使从伦敦到耶路撒冷的基督世界，彻底摆脱那些以信仰为食的超自然恶兽的侵扰。"
 POD_landless_inquisition_victory_decision_confirm: "十字军凯旋"
 pod1230objectives.163.desc: "朝圣者在教堂祈祷，孩子们在街上玩耍，人们有时争吵，有时大笑……这就是你为之奋斗的。人类可能永远不会知道你和你的前辈们为他们做了什么。他们永远不会知道你所战斗的恐怖之物，你所杀死的怪物，你带入净化之光的古老邪恶。\n但是……这其实并不重要。你这样做不是为了荣誉，而是为了看到一个可以凭自身自由发展的人类社会。会有新的挑战和新的错误吗？当然，但自从上帝创造了这个地球以来，这是人类第一次可以自由地蹒跚前行，只靠自己。\n夜色依旧漆黑……"
 pod1230objectives.163.a: "……但不再充斥着险恶。"
 landless_inquisition_victory_objective_decision_effect_tooltip: "你现在将永远得到教皇的全力支持。你也被允许使用异端魔法（仅适用于这个角色）。\n你已经实现了无地裁判官之旅的最终目标。"