l_simp_chinese:
 PODadventurers.1001.desc: "你的手下最近的报告带来了名为加莱亚佐的年轻稚子的情报。这名年轻的吸血鬼似乎有着远大的抱负，为了一个未知的目的，他在意大利北部集结军队，欺骗那些容易上当的凡人（和不死族）统治者，让他们为他不断壮大的军队提供更多的支持。目前，他表现得过分聪慧而难以捉摸，这本身就令人担忧……"
 PODadventurers.1001.a: "我感觉这事不太妙……"
 PODadventurers.1001.player_warning: "做好准备，你很快就会听到更多关于他的事。"
 PODadventurers.1002.t: "亲王：加莱亚佐"
 PODadventurers.1002.desc: "#italic “我不是一个多情的人。是的，我认为米兰是我与生俱来的地盘，因为很久以前我就是米兰公爵，同样，意大利在我冷酷的心中永远占有特殊的位置。但是凯撒把他的野心停止在一座城市里了吗？甚至一个国家吗？我征服土地和头衔并不是为了更大的目标，甚至不是为了获得快感。完全不是。这里没有宗教，没有哲学，没有情感，只有游戏。智取对手，眼睁睁地看着他的计划在他还不知道你的名字之前就化为泡影，迫使他背叛他所珍视的一切……这就是我们生存的意义。记住，永远有比你更好的玩家。一个值得观察、学习、最后粉碎的人。而金字塔之顶？好吧，我们在那儿见吧，只要你活得够久。”#!\n经过精心收集情报和施加影响，加莱亚佐已经集结了一支庞大的军队，这支军队由他以前的契约佣兵人脉和心怀不满的年轻吸血鬼组成。他已经在征服意大利北部的战役中取得了进展。"
 PODadventurers.1002.a: "是时候教教这个傲慢的维斯康蒂一些谦虚了！"
 PODadventurers.1002.a.target.tt: "等时机到了，你就会对付他"
 PODadventurers.1002.a.not_target.tt: "你的领主现在正和加莱亚佐交战"
 PODadventurers.1002.b: "我要这个人站在我这边，不惜一切代价！"
 PODadventurers.1002.b.custom: "你将使野心勃勃的维斯康蒂臣服与你。这花费你很多，而他只会感激你一段时间……"
 POD_giangaleazzo.notification: "亲王行动了"
 POD_giangaleazzo.desc: "在意大利，加莱亚佐·维斯康蒂，一位野心勃勃的勒森魃，开始了征服之旅。他能撼动帝国的旧中心吗？"
 PODadventurers.1011.t: "大难临头"
 PODadventurers.1011.desc: "瓦特·泰勒的起义席卷了整个英格兰，他也开始影响到[cainite|E]的世界。关于他转变的吸血鬼中有一位侍僧的谣言越来越多，这位侍僧决定发起一场更……黑夜版的起义。"
 PODadventurers.1011.a: "我感觉这事不太妙……"
 PODadventurers.1011.player_warning: "做好准备，你很快就会听到更多的消息。"
 PODadventurers.1012.t: "起义者：泰勒"
 PODadventurers.1012.desc: "瓦特·泰勒的起义一直是英格兰[cainites|E]的烦恼，但它的涟漪似乎才刚刚开始。一位年轻的布鲁赫，博林布鲁克的帕特莉夏，已经以起义军的名义，开始催动失望的年轻[cainites|E]和其他暴民。这位脾气暴躁的女人似乎决心要终结暴政，不管他们是凡人还是其他什么人。随着她占领了她的第一个城市，越来越多的人在每个夜晚聚集到她的身边，英格兰的贵族们将选择如何处理她。是天鹅绒手套还是铁拳？"
 PODadventurers.1012.a: "又一位反叛者，又一注定要被粉碎的失败之行"
 PODadventurers.1012.a.target.tt: "等时机到了，你就会对付她"
 PODadventurers.1012.a.not_target.tt: "你的领主现在正和泰勒交战"
 PODadventurers.1012.b: "嗯……她有一些不错的观点……和一支庞大的军队"
 PODadventurers.1012.b.custom: "只有你加入泰勒的功业，她才会屈膝。这确实是个很侮辱人的提议，但同时你也会获得一位强大的盟友。"
 PODadventurers.1012.c: "我们是同一阵线的！"
 POD_tyler.notification: "义军进行了她的行动"
 POD_tyler.desc: "在英格兰，博林布鲁克的帕特莉夏奋起反抗暴君，企图获得自由，这是一场注定的失败……还是一场伟大革命的首片真正火花？"
 PODadventurers.1021.t: "大难临头"
 PODadventurers.1021.desc: "有传言说瓦拉几亚的著名统治者弗拉德·采佩什已经打听过[cainite|E]的世界。不知怎么的，他已经知道了你这种人的存在，并似乎很感兴趣。"
 PODadventurers.1021.a: "我感觉这事不太妙……"
 PODadventurers.1021.player_warning: "做好准备，你很快就会听到更多的消息。"
 PODadventurers.1022.t: "穿刺公：弗拉德·采佩什"
 PODadventurers.1022.desc: "瓦拉几亚的凡人统治者弗拉德·采佩什·德古拉一次又一次地展现了他不屈不挠的意志。他更喜欢按照自己的方式行事，因此他拒绝接受任何人的[Embrace|E]，他甚至变成吸血鬼之前就有着比许多上古者还多的对吸血鬼状况的了解。在他亡生的最初几年里，谣言四起。他的[Sire|E]是谁？他真的找到了血肉大教堂而毫发无损吗？他对谁保持忠诚？这些问题仍然没有答案，但自封的德古拉似乎已经受够了四处游荡。这位棘秘魑小辈已经在他的凡生之年聚集了一大群令人印象深刻的吸血鬼，血仆和士兵，完成了他的第一次征服。现在他给了你一个机会，承认他是你的宗主，就可以开始互惠互利的关系。拒绝……那么这样一位存在所构成的威胁不需要解释。"
 PODadventurers.1022.a: "暴发户终究是暴发户，即使有个炫酷的绰号"
 PODadventurers.1022.a.target.tt: "等时机到了，你就会对付他"
 PODadventurers.1022.a.not_target.tt: "你的领主现在正和德古拉交战"
 PODadventurers.1022.b: "一个你无法拒绝的交易"
 PODadventurers.1022.b.custom: "尽管承认一位小辈所带来的威胁是有代价的，但拥有著名的德古拉作为你的子嗣是一个诱人的提议。至少，这可能会在他背叛你之前为你争取一些时间……"
 POD_vlad.notification: "穿刺公进行了他的行动"
 POD_vlad.desc: "在特兰西瓦尼亚，弗拉德·采佩什继续着他血腥事业，但这次以不死族的身份。一位森林那边领地的新黑夜领主？"
 first_giangaleazzo_event_troops: "加莱亚佐的契约佣兵"
 first_tyler_event_troops: "泰勒的义军"
 first_vlad_event_troops: "弗拉德的穿刺者"
 PODadventurers.0003.desc: "The Visconti mortal family has been the centerpiece of Northern Italy politics for several generations now. They have produced many famous (and infamous) individuals as well as leaving their mark on the history of the region. They have stayed far away from the supernatural and avoided its interference... until now.\nOne scion of the family, Giangaleazzo, has recently been [Embraced|E] by an unknown Lasombra and has been quick to use both his family's gravitas and his shrewd political talent to gain a great influence in Lombardy in a surprising short amount of time. Previously trusted agents and loyal contacts have been turning against the local supernatural (and sometimes mortal) authorities to join his cause, seriously weakening the hold of the local rulers in this area."
 PODadventurers.0003.a: "Who does he think he is?"
 PODadventurers.0003.b: "Let us fight back his growing influence."
 visconti_contacts_modifier: "Visconti Contacts"
 visconti_contacts_modifier_desc: "Giangaleazzo's familial contacts prove useful in expanding your influence."
 PODadventurers.0005.desc: "In a surprising move, Giangaleazzo Visconti has come to your haven in person. Being no fool, you quickly understand that he didn't come alone, being backed by his growing army in a show of force that you can only respect. The young Lasombra has apparently singled you out as the most influential vampire in Italy (though you think that he might just be telling that to every vampire rulers he encounters) and wants to discuss a potentially mutually beneficial arrangement.\nHe is willing to leave Italy with his army, causing no further distress in the region, if you agree to provide him with resources and funds so that he can start his rise to power somewhere else. To sweeten the deal, he even offers some of his Visconti contacts to help spread your influence in the region if you accept. "
 PODadventurers.0005.a: "We have a deal, Milanese."
 PODadventurers.0005.b: "Presumptuous upstart! Out of my sight!"
 PODadventurers.0003.b.tt: "Buildings in the barony of Como will be destroyed."
 PODadventurers.0003.a.tt: "Buildings in the baronies of Lombardy, Brescia and Como will be destroyed."