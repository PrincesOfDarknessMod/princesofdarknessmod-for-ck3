 POD_asakku.0030.t: "Something in the Blood"
 POD_asakku.0030.desc: "You sense it before you understand it, a wrongness in the way your blood moves, as if something is testing the current. Someone is deeply, deeply wrong. The Vicissitude in your veins feels different tonight. Heavier.\n\nIn truth, it did not begin tonight. Small things like a taste in the back of the throat that did not belong to any feeding or a moment of disorientation when you reached for a familiar discipline and felt, for the briefest instant, that something else reached with you. Hands you did not own, moving in tandem with yours.\n\nYou do not know what is doing this to you. You only know that it is patient, and that it is closer tonight than it was the night before."
 POD_asakku.0030.a: "打吧。"
 POD_asakku.0030.b: "让它进来。"
 POD_asakku.0031.t: "挣扎"
 POD_asakku.0031.desc: "[defender.GetFirstNamePossessive|U] blood resists. Not with understanding, [defender.GetSheHe] does not know yet what moves through [defender.GetHerHim], but with the stubbornness of old $pod_vitae$ that recognizes a foreign will. You feel the rejection like pressure against a closed fist. You can push through it. The question is whether the cost is worth paying tonight."
 POD_asakku.0031.a: "突破抵抗。"
 POD_asakku.0031.a.success.desc: "The infection takes hold. [defender.GetFirstNamePossessive|U] resistance crumbles."
 POD_asakku.0031.a.failure.desc: "[defender.GetFirstName|U]抵抗住了它。血液排斥了种子。"
 POD_asakku.0031.b: "放弃尝试。"
 POD_asakku_cancel_scheme_tt: "Cancel the Soul Infection scheme."
 POD_asakku.0032.t: "The Seed Takes Root"
 POD_asakku.0032.desc: "It is done. The infection has taken hold. You can feel it, the way you feel your own heartbeat in someone else's blood. [defender.GetSheHe|U] does not know yet what has happened to [defender.GetHerHim]. [defender.GetSheHe|U] will.\n\nThe voice in your thoughts notes the completion the way a craftsman notes a finished piece of work. There is a satisfaction in it, of a kind, but the satisfaction is not entirely yours. You are the one who did the work. The entity is the one for whom the work was done. It is becoming difficult, on nights like this, to tell who held the reins."
 POD_asakku.0032.a: "世间更多的双手。"
 POD_asakku.0033.t: "抵抗"
 POD_asakku.0033.desc: "The attempt fails. Something in [defender.GetFirstNamePossessive] blood resists, not understanding, not faith, but the simple stubbornness of a Biblical curse sensing when something is deeply wrong and shouldn't be there."
 POD_asakku.0033.a: "[defender.GetSheHe|U]比预期更强。"
 POD_asakku.0034.t: "发生了变化。"
 POD_asakku.0034.desc: "你醒来时，听到一个不属于你的声音。它不以言语诉说，而是以饥渴、耐心，以及一种与信仰无关的确信在表达。你已被改变。\n\n那伴随你数个世纪的易变术如今感觉不同了，仿佛它记起了某些遗忘之事。今夜当你伸手触碰它时，有什么也在回应你。这门异能并未被夺走，它只是揭示了你从来都不是它唯一的主人。\n\n你仍然是你。大体上如此。那依旧属于你的部分已在试图辨认另一部分是什么，并已发现这问题远比它本应是的要棘手。"
 POD_asakku.0034.a: "我变成了什么？"
 POD_asakku.0035.t: "你抵抗了"
 POD_asakku.0035.desc: "有人试图在你的血液中植入什么东西。这一次，你抵挡住了。那侵入的记忆萦绕不散，如同一种难以辨别的味道。\n\n无论那是什么，它并非针对你本人，而是冲着易变术而来，而你不过是易变术恰好栖身的房间。这个念头并不令人心安。它暗示着，下一次尝试或许无需新的努力。房间仍在原地。而有人，已经摸清了门路。"
 POD_asakku.0035.a: "我会更加小心。"
 POD_asakku.0250.t: "一个提议"
 POD_asakku.0250.desc: "[attacker.GetSheHe|U] comes to you in the way that people who carry terrible knowledge come to others: carefully, with the specific patience of someone who has learned that most people do not want to hear what they have to say.\n\nThe evidence is not dramatic. A pattern of behavioral changes in $pod_cainites$ who carry Vicissitude. A series of court disappearances that map, when you lay them out, to a single radiating point in the Caucasus. Names that surface in intelligence reports and then stop surfacing, not because the individuals have died but because they have stopped being, in any meaningful sense, themselves.\n\nThe Elioud who brings you this does not look like a hunter. [attacker.GetSheHe|U] looks tired, like someone who has been carrying this knowledge alone for longer than is healthy.\n\n[attacker.GetSheHe|U] is asking you to carry some of it."
 POD_asakku.0250.a: "拒绝。这不是我的战斗。"
 POD_asakku.0250.b: "接受。让我看看是什么在追捕我们。"
 POD_asakku.0251.t: "一位新猎人"
 POD_asakku.0251.desc: "[defender.GetFirstName|U]接受了。不是带着热情接受，那才会令人担忧；也不是带着勉强接受，那将毫无用处。[defender.GetSheHe|U]以一种审视证据并理解其含义后的严峻清醒接受了。这便是那种持久的接受。\n\n你向[defender.GetHerHim]展示了那些条律。那套山田丹设计、用于标记腐化者的铁针。那些迹象，用以辨认一名$pod_cainite$的易变术已开始回应其主人之外的事物。还有那笼罩在已经感染深植的王庭之上的特有寂静。\n\n[defender.GetSheHe|U]将其尽数吸收。[defender.GetHerHis]值得称道的是，[defender.GetSheHe]并未退缩。当你讲完之后，[defender.GetSheHe]提出了每个新猎手都会问的问题，那个区分谁能坚持到底、谁不能的问题：“我们如何知道自己何时才算获胜？”\n\n你给[defender.GetHerHim]的回答，也正是每位资深猎手都会给出的：“我们并不知道。我们只知道自己何时尚未落败。”"
 POD_asakku.0251.a: "欢迎来到卡穆特。"
 POD_asakku.0252.t: "拒绝招募"
 POD_asakku.0252.desc: "[defender.GetFirstName|U] listens. [defender.GetSheHe|U] considers. And then [defender.GetSheHe] declines, in the way that reasonable people decline unreasonable requests, with the careful politeness of someone who has decided that the person speaking to them is either mistaken or unwell.\n\nYou cannot blame [defender.GetHerHim]. The evidence, laid out for someone who has not spent years learning to read it, looks like paranoia. Patterns in court disappearances. Behavioural changes that could be explained by a dozen mundane causes. A conspiracy theory about an ancient entity that rides in the blood of Vicissitude carriers. It sounds, to the uninitiated, exactly like the kind of thing a $pod_cainite$ tells themselves when the Long Night has gone on too long and the shadows have started to look like they have intentions.\n\nYou fold the evidence away. You thank [defender.GetHerHim] for [defender.GetHerHis] time. You walk out into the night knowing that the next time you see [defender.GetHerHim], you will be watching for the signs. Because the entity does not need believers. It only needs carriers."
 POD_asakku.0252.a: "还会有其他人。"
 POD_asakku.0301.t: "血脉起源"
 POD_asakku.0301.desc: "The entity that rises from the well does not give, it replaces. You open the vein and let the prisoner drink until [target.GetSheHe] is not empty anymore.\n\n[target.GetSheHe|U] resists at first. Then the taste reaches [target.GetHerHim], and the resistance ends. [target.GetSheHe|U] drinks, past the point where ordinary blood would have stopped being interesting. [target.GetSheHe|U] drinks until something in [target.GetHerHis] face changes, a small slackening at the corner of the mouth, a stillness in the eyes that was not there before.\n\nIn the morning [target.GetSheHe] will wake up, and something will be looking through [target.GetHerHis] eyes that was not there before. [target.GetSheHe|U] will not remember the change as a violence. [target.GetSheHe|U] will remember it, if [target.GetSheHe] remembers it at all, as a homecoming."
 POD_asakku.0301.a: "世间更多的双手。"
 POD_asakku.0302.t: "The Morning After"
 POD_asakku.0302.desc: "[target.GetFirstName|U] wakes disoriented, as you expected. What you did not expect is that [target.GetSheHe] looks at you the way a mirror looks, with no expression that is entirely [target.GetHerHis] own.\n\n[target.GetSheHe|U] speaks with a voice that might not be [target.GetHerHis].\n\nYou notice. And the voice in your blood notices that you have noticed, and there is a moment of something like shared amusement between you that you cannot quite locate the seam of. You are not sure, when you stop laughing, which of you started."
 POD_asakku.0302.a: "良好。"
 POD_asakku.0310.t: "Seeding the Garden"
 POD_asakku.0310.desc: "The blood sinks in faster than blood should. By morning the grass at the boundary of your holding has taken on a reddish cast. The voice in your thoughts is satisfied in a way it rarely is with people."
 POD_asakku.0310.a: "让它发展壮大。"
 POD_asakku.0320.t: "灵魂低语"
 POD_asakku.0320.desc: "你通过连接伸出手。这每次都需要更少的努力。透过你植入他们体内的血液，你感受到他们的感受，也学到了他们所学到的一切。"
 POD_asakku.0320.a: "知识就是力量。"
 POD_asakku_soul_infection_interaction: "灵魂感染"
 POD_asakku_soul_infection_interaction_desc: "通过易变术的媒介，将阿萨克的影响扩散到这个吸血鬼身上。"
 POD_asakku_only_one_soul_infection_at_time: "You can only run one Soul Infection scheme at a time."
