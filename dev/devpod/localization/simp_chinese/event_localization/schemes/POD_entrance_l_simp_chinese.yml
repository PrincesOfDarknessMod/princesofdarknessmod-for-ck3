l_simp_chinese:
 POD_entrance.100.t:0 "你被魅惑了"
 POD_entrance.100.desc:0 "你喜欢上了[schemer.GetTitledFirstName]。你真的非常非常喜欢[schemer.GetHerHim]。"
 POD_entrance.100.option.a:0 "竭尽我的意志去抵御魅惑。"
 POD_entrance.100.option.b:0 "抗拒魅惑。"
 POD_entrance.100.option.c:0 "接受魅惑。"
 POD_entrance.200.t:0 "魅惑[target.GetFirstNameNoTooltip]"
 POD_entrance.200.desc:0 "我感受到了我的神秘力量入侵[target.GetTitledFirstName]的脑海。[target.GetSheHe|U]正在抵抗我的魅惑。"
 POD_entrance.200.option.a:0 "激发血脉去魅惑[target.GetHerHim]。"
 POD_entrance.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip]掌握着坚韧术[discipline|E]并抵抗了我的能力。"
 POD_entrance.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip]发挥了[target.GetHerHis]意志来抵抗我的力量。"
 POD_entrance.200.a.success.desc:0 "成功"
 POD_entrance.200.a.tt_success:0 "[target.GetTitledFirstName]会被魅惑并对我有好感。"
 POD_entrance.200.a.failure.desc:0 "失败"
 POD_entrance.200.a.tt_failure:0 "[target.GetTitledFirstName]将会抵抗我的魅惑。"
 POD_entrance.200.option.b:0 "激起血液催动我的意志。我不受拒绝！"
 POD_entrance.200.option.b.tt.beast:0 "#R [target.GetSheHe|U]必须得爱我们！#!"
 POD_entrance.200.option.c:0 "放弃继续努力，我不再想继续魅惑[target.GetHerHim]。"
 POD_entrance.200.option.c.tt:0 "魅惑将会失败。"
 POD_entrance.300.t:0 "[target.GetFirstNameNoTooltip]被魅惑"
 POD_entrance.300.desc:0 "通过我的神秘力量，[target.GetTitledFirstName]已经被魅惑。"
 POD_entrance.300.option.a:0 "理所应当的，[target.GetSheHe]爱我。所有人都爱我。"
 POD_entrance.300.option.a.tt.beast:0 "#R 所有人都将仰视我们并绝望！#!"
 POD_entrance.400.t:0 "你已经到了"
 POD_entrance.400.desc:0 "你发现自己在[schemer.GetTitledFirstName]的宫廷中。"
 POD_entrance.400.option.a:0 "我的新家。"
 POD_entrance.500.t:0 "魅惑被抵抗"
 POD_entrance.500.desc:0 "[target.GetTitledFirstName]抵抗了我的魅惑。"
 POD_entrance.500.option.a:0 "挫败！"
 POD_entrance.500.option.a.tt.beast:0 "#R 拒绝我们就意味着死亡！#!"
 POD_entrance.600.t:0 "魅惑被抵抗"
 POD_entrance.600.desc:0 "你不再受到[schemer.GetTitledFirstName]的魅惑。"
 POD_entrance.600.option.a:0 "滚出我的脑海！"