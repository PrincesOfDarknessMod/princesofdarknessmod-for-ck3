l_simp_chinese:
 POD_entrance.100.t: "你被魅惑了"
 POD_entrance.100.desc: "你喜欢上了[schemer.GetTitledFirstName]。你真的非常非常喜欢[schemer.GetHerHim]。"
 POD_entrance.100.option.a: "竭尽我的意志去抵御魅惑。"
 POD_entrance.100.option.b: "抗拒魅惑。"
 POD_entrance.100.option.c: "接受魅惑。"
 POD_entrance.200.t: "魅惑[target.GetFirstNameNoTooltip]"
 POD_entrance.200.desc: "你感受到了你的神秘力量入侵[target.GetTitledFirstName]的脑海。[target.GetSheHe|U]正在抵抗魅惑。"
 POD_entrance.200.option.a: "激发血脉去魅惑[target.GetHerHim]。"
 POD_entrance.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip]掌握着坚韧术$pod_discipline$并抵抗了我的能力。"
 POD_entrance.200.a.tt_willpower: "[target.GetFirstNameNoTooltip]发挥了[target.GetHerHis]意志来抵抗你的力量。"
 POD_entrance.200.a.success.desc: "[target.GetTitledFirstNameNoTooltip]将被魅惑到喜欢上你"
 POD_entrance.200.a.failure.desc: "[target.GetTitledFirstNameNoTooltip]抵御了你的魅惑"
 POD_entrance.200.option.b: "激起血液催动我的意志。我不受拒绝！"
 POD_entrance.200.option.b.tt.beast: "#beast [target.GetSheHe|U]必须得爱我们！#!"
 POD_entrance.200.option.c: "放弃继续努力，我不再想继续魅惑[target.GetHerHim]。"
 POD_entrance.200.option.c.tt: "魅惑将会失败。"
 POD_entrance.300.t: "[target.GetFirstNameNoTooltip]被魅惑"
 POD_entrance.300.desc: "通过我的神秘力量，[target.GetTitledFirstName]已经被魅惑。"
 POD_entrance.300.option.a: "理所应当的，[target.GetSheHe]爱我。所有人都爱我。"
 POD_entrance.300.option.a.tt.beast: "#beast 所有人都将仰视我们并绝望！#!"
 POD_entrance.400.t: "你已经到了"
 POD_entrance.400.desc: "你发现自己在[schemer.GetTitledFirstName]的宫廷中。"
 POD_entrance.400.option.a: "我的新家。"
 POD_entrance.500.t: "魅惑被抵抗"
 POD_entrance.500.desc: "[target.GetTitledFirstName]抵抗了我的魅惑。"
 POD_entrance.500.option.a: "挫败！"
 POD_entrance.500.option.a.tt.beast: "#beast 拒绝我们就意味着死亡！#!"
 POD_entrance.600.t: "魅惑被抵抗"
 POD_entrance.600.desc: "你不再受到[schemer.GetTitledFirstNamePossessive]的魅惑。"
 POD_entrance.600.option.a: "滚出我的脑海！"
 POD_entrance.tt.pc.majesty: "你的[GetPerk('majesty_perk').GetName(GetPlayer)]能力稍微增加了你的成功概率"
 POD_entrance.tt.pc.presenceadvanced: "你对[GetTrait('presenceadvanced').GetName(GetPlayer)]的掌握增加了你的成功概率"
 POD_entrance.tt.pc.ironclad_command_perk: "你的[GetPerk('ironclad_command_perk').GetName(GetPlayer)]能力极大增加了你的成功概率"
 POD_entrance.tt.willpower_spent: "[defender.GetFirstNameNoTooltip]运用了意志力去抵抗你的心灵攻击"
 POD_entrance.tt.unswayable_mind_perk: "[defender.GetFirstNameNoTooltip]的[GetPerk('unswayable_mind_perk').GetName(GetPlayer)]能力稍微降低了你的成功概率"
 POD_entrance.tt.fortify_the_inner_facade_perk: "[defender.GetFirstNameNoTooltip]的[GetPerk('fortify_the_inner_facade_perk').GetName(GetPlayer)]能力降低了你的成功概率"