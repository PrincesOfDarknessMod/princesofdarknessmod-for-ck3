l_simp_chinese:
 POD_mesmerize.100.t: "你被支配了。"
 POD_mesmerize.100.desc: "[schemer.GetTitledFirstName]在支配你并索要一个人情。"
 POD_mesmerize.100.option.a: "运用我的意志力去抵抗支配。"
 POD_mesmerize.100.option.b: "抗拒支配。"
 POD_mesmerize.100.option.c: "接受支配。"
 POD_mesmerize.200.t: "正在支配[target.GetFirstNameNoTooltip]"
 POD_mesmerize.200.desc: "我以意志命令[target.GetTitledFirstName]。但[target.GetSheHe|U]正在抗拒我的支配！\n如果你想继续下去，你将需要克服他们的意志。意志坚强的人更难被打破心智，这强烈的心之力对抗可能会产生压力。"
 POD_mesmerize.200.option.a: "激起血液来支配[target.GetHerHim]。"
 POD_mesmerize.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip]掌握着坚韧术$pod_discipline$并抵抗了我的力量。"
 POD_mesmerize.200.a.tt_willpower: "[target.GetFirstNameNoTooltip]发挥了[target.GetHerHis]的意志力来抵抗我的能力。"
 POD_mesmerize.200.a.success.desc: "[target.GetTitledFirstNameNoTooltip]将欠你一个人情"
 POD_mesmerize.200.a.failure.desc: "[target.GetTitledFirstNameNoTooltip]将抵抗你的支配，并有概率免疫你对[target.GetHerHim]的催眠10年"
 POD_mesmerize.200.option.b: "激起血液然后发挥我的意志。我是主人！"
 POD_mesmerize.200.option.b.tt.beast: "#beast 我是你的主人！#!"
 POD_mesmerize.200.option.c: "这简直是在浪费时间，我不再想支配[target.GetHerHim]。"
 POD_mesmerize.200.option.c.tt: "支配将会失败。"
 POD_mesmerize.300.t: "[target.GetFirstNameNoTooltip]已受催眠"
 POD_mesmerize.300.desc: "通过使用我的支配术$pod_discipline$，[target.GetTitledFirstName]将听从我的命令。\n\n#X 提示：要使用你的命令，请使用命令傀儡[character_interaction|E]。\n有些命令需要一个被标记的针对对象，该通过标记针对对象[character_interaction|E]达成。#!"
 POD_mesmerize.300.desc.short_term: "\n\n由于你没有潜心暗导技能，你只有数天的时间来下达你的命令。"
 POD_mesmerize.300.option.a: "现在，我想让[target.GetHerHim]做什么？"
 POD_mesmerize.300.option.a.tt.beast: "#beast 血！我们需要血！#!"
 POD_mesmerize.400.t: "我无法拒绝的债务"
 POD_mesmerize.400.desc: "我欠[schemer.GetTitledFirstName]的。"
 POD_mesmerize.400.option.a: "我该怎么向[schemer.GetHerHim]交代呢？"
 POD_mesmerize.500.t: "抵抗支配"
 POD_mesmerize.500.desc: "[target.GetTitledFirstName]抵抗了我的支配。"
 POD_mesmerize.500.option.a: "这不可能！"
 POD_mesmerize.500.option.a.tt.beast: "#beast 打到其听话为止！#!"
 POD_mesmerize.600.t: "抵抗支配"
 POD_mesmerize.600.desc: "我已经摆脱了[schemer.GetTitledFirstNamePossessive]的支配之精神枷锁。"
 POD_mesmerize.600.option.a: "我有钢铁般的意志！"
 POD_mesmerize.700_toast_title: "支配已过期！"
 POD_mesmerize.700_toast_ct: "若你想命令[target.GetName]，你必须得启动一个新计谋。"
 POD_mesmerize.tt.pc.dominateadvanced: "你对[GetTrait('dominateadvanced').GetName(GetNullCharacter)]的掌握增加了你的成功概率"
