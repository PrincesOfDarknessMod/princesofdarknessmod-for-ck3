l_simp_chinese:
 POD_summon.100.t: "你正被别人召唤"
 POD_summon.100.desc: "你感受到了一种强烈的冲动，想跟[schemer.GetTitledFirstName]站到一边。这显然是不自然的，一位强大的吸血鬼正在利用该隐的赠礼来对付你！"
 POD_summon.100.option.a: "运用我的意志力去抵抗召唤。"
 POD_summon.100.option.b: "抗拒召唤。"
 POD_summon.100.option.c: "接受召唤。"
 POD_summon.200.t: "正在召唤[target.GetFirstNameNoTooltip]"
 POD_summon.200.desc: "我感受到我的神秘能量触碰到了[target.GetTitledFirstName]的心智，[target.GetSheHe|U]正在抵抗我的召唤。$pod_cainites$的天赋并不完美，它们只能达到你的意志力所能达到的程度。不过，这种联系还没有断开，我可以用我的血液和精神毅力来增强召唤力，使其更加不可抗拒。"
 POD_summon.200.option.a: "激起血液来召唤[target.GetHerHim]。"
 POD_summon.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip]掌握着坚韧术$pod_discipline$并抵抗了我的能力。"
 POD_summon.200.a.tt_willpower: "[target.GetFirstNameNoTooltip]用他的意志抵抗我的力量。"
 POD_summon.200.a.success.desc: "成功"
 POD_summon.200.a.tt_success: "[target.GetTitledFirstName]将会到达我的宫廷"
 POD_summon.200.a.failure.desc: "失败"
 POD_summon.200.a.tt_failure: "[target.GetTitledFirstName]将抵抗我的召唤"
 POD_summon.200.option.b: "激起血液，发挥我的意志。我的意志不可拒绝！"
 POD_summon.200.option.b.tt.beast: "#beast 很好！把其带过来！#!"
 POD_summon.200.option.c: "算了，我不想要[target.GetHerHim]了。"
 POD_summon.200.option.c.tt: "召唤将会失败。"
 POD_summon.200.option.c.tt.beast: "#beast 不！其要逃脱了！#!"
 POD_summon.300.t: "[target.GetFirstNameNoTooltip]受到了召唤。"
 POD_summon.300.desc: "通过运用我的神秘力量，[target.GetTitledFirstName]已经到达我的宫廷。现在是时候决定我将如何对待这位新客人了。以礼相待还是进行羞辱？\n无论如何，不要指望彼从一开始就能很好地接受它。通过使用纯粹的血之力，在没有彼的同意的情况下召唤过来，这不是很友善。"
 POD_summon.300.option.a: "欢迎来到我家，蜘蛛对苍蝇说道。"
 POD_summon.300.option.a.tt.beast: "#beast 夜宵时间到！#!"
 POD_summon.400.t: "你已到达"
 POD_summon.400.desc: "你发现你正处于[schemer.GetTitledFirstName]的宫廷中。"
 POD_summon.400.option.a: "我的新家。"
 POD_summon.500.t: "抵抗召唤"
 POD_summon.500.desc: "[target.GetTitledFirstName]抵抗了我的召唤。其的意志更强，其可能会在一段时间内不会忘记你的对其脑海的入侵。毕竟使用纯粹的血之力召唤人，并不友善。"
 POD_summon.500.option.a: "真是失败！"
 POD_summon.500.option.a.tt.beast: "#beast 让我们抓住并吃了他们！ #!"
 POD_summon.600.t: "抵抗召唤"
 POD_summon.600.desc: "你不再感受到[schemer.GetTitledFirstNamePossessive]的召唤。"
 POD_summon.600.option.a: "离我的心智远点！"
 POD_summon.10.desc: "你感觉到你的神秘能量触及到了[target.GetTitledFirstName]的心灵。\n召唤是一种侵入性的能力。除非你已经与[target.GetFirstNameNoTooltip]友好，否则他们会因为你对他们使用血之力量而怨恨你。如果成功，你需要继续召唤，直到[target.GetFirstNameNoTooltip]到达。"
 POD_summon.10.option.a: "来我这里！"
 POD_summon.10.crit_success.desc: "[target.GetFirstNameNoTooltip]会冲着你来。他们将想尽一切办法接近你。"
 POD_summon.10.success_desc: "[target.GetFirstNameNoTooltip]将按部就班地过来你这里。"
 POD_summon.10.failure_desc: "[target.GetFirstNameNoTooltip]将抗拒你的召唤，你将在10年内无法再次尝试召唤[target.GetHerHim]"
 POD_summon.10.botch_desc: "你的召唤会面临严重失败，50年内无法再次对[target.GetHerHim]进行召唤。"
 POD_summon.10.option.b: "我不想再召唤[target.GetHerHim]。"
 POD_summon.11.desc.crit_success: "你的召唤大成功。[target.GetFirstNameNoTooltip]正竭尽全力尽快地来找你。"
 POD_summon.11.desc.success: "[target.GetFirstNameNoTooltip]正按部就班地过来你这里。"
 POD_summon.11.desc: "在[target.GetSheHe]抵达之前，你需要继续消耗点血来推进召唤。"
 POD_summon.11.option.a: "好"
 POD_summon.500.desc.summon_failure: "\n\n#X 你在10年内无法尝试召唤[target.GetFirstNameNoTooltip]。#!"
 POD_summon.500.desc.summon_botch: "\n\n#X 你在50年内无法尝试召唤[target.GetFirstNameNoTooltip]。#!"
 temp_immune_summon: "由于你的上次尝试的失败，[recipient.GetFirstNameNoTooltip]免疫你的支配术到[GetCurrentDateWithDiff( GetVarTimeRemaining( recipient.MakeScope, 'immune_to_summon_from_actor') )]"