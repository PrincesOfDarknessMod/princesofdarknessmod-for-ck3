l_simp_chinese:
 POD_embrace.100.t: "初拥"
 POD_embrace.100.desc: "我精心安排了一切，使[target.GetFirstName]落入我的控制之下。在一处隐密的角落，[victim.GetSheHe]已无法逃脱。即使这对[victim.GetHerHis]意味着是诅咒，我也要授予[victim.GetHerHim]永生吗？[victim.GetSheHe]会感激我，还是[victim.GetSheHe]会永远怨恨我？我的[Glossary('尊长','game_concept_Sire_desc')]有过这些想法么？"
 POD_embrace.100.option.a: "$pod_Embrace$[target.GetFirstName]"
 POD_embrace.100.option.a.tt: "我会杀了[target.GetFirstName]然后将[victim.GetHerHim]转化为吸血鬼。这会扣除你的虔诚，还会有增加你的饥渴度和曝露[the_masquerade|E]的风险。"
 POD_embrace.100.option.a.tt.beast: "#beast 对！将其吸干然后给予一滴我们的鲜血。我们总能将其全部收回！#!"
 POD_embrace.100.option.b: "让[victim.GetHerHim]走。"
 POD_embrace.100.option.b.tt.beast: "#beast 不！不要让[victim.GetHerHim]跑掉！我已经等了这个时刻太久！我们已经等了这个时刻太久。#!"
 POD_embrace.200.t: "初拥"
 POD_embrace.200.desc: "该猎人，[target.GetFirstName]被关在一个严密保护的牢房里任你$pod_Embrace$。不幸的是，让他配得上这一切的那些猛人，会让这一过程变得困难。"
 POD_embrace.200.option.a: "强行$pod_Embrace$该猎人"
 POD_embrace.200.option.a.s.tt: "你抓住了猎人，并吸干了他们的血。"
 POD_embrace.200.option.a.f.tt: "猎人有个可怕的惊喜要给你。"
 POD_embrace.210.desc: "喉咙还在滴血，[target.GetFirstName]用愤恨的眼神看着你。该猎人会将你赐予的不死亡生会当做礼物接受还是会坚信这是一个可怕的诅咒呢，还有待观察。"
 POD_embrace.220.desc: "牢房的门被打开，你从房间的另一边跳向你的目标。在飞行途中，你发现你慷慨提供给囚犯的木凳少了只腿。[target.GetFirstName]展示了坚定的眼神，举起了一根锋利的木桩。你的爪子够到了受害者的身体，但你自己的惯性一直把你的心捅向木桩尖。"
 POD_embrace.200.option.b: "偷偷地接近猎人。"
 POD_embrace.200.option.b.s.tt: "一口咬进一位无准备者的脖子，一位熟睡的受害者。"
 POD_embrace.200.option.b.f.tt: "猎人只想睡觉……"
 POD_embrace.230.desc: "当在你靠近的时候[victim.GetHerHis]的脖子时，[target.GetFirstName]看起来睡得很熟。就在那一刻，你意识到牢房中强烈恶臭的来源。那是灯油吗？[target.GetFirstName]打开了[victim.GetHerHis]眼，抓住你的衣领，凑耳说“受死吧，魔物。”只有当你注意到火花时，你才意识到即将发生什么。"
 POD_embrace.200.option.c: "让其相信这是让其延续其存在的唯一办法"
 POD_embrace.200.option.c.s.tt: "你劝服了猎人说亡生可是美好的。"
 POD_embrace.200.option.c.f.tt: "猎人劝服了你什么……"
 POD_embrace.240.desc: "你试图说服即将成为你子嗣的人亡生是一种福报时，你过于急于回答问题。甚至连你自己都觉得难以回答的问题。这是真的吗？你已经绝望地失去了一切让生活变得可以忍受的东西吗？"
 POD_embrace.200.option.d: "这是个坏主意。"
 POD_embrace.200.option.d.tt: "世上有那么多凡人，为啥我要成为一个发誓要杀死血族的人的[Glossary('尊长','game_concept_Sire_desc')]？"
 POD_embrace.210.t: "就像从瞎乞丐手里拿走硬币一般。"
 POD_embrace.210.option.a: "放心吧，我的子嗣。"
 POD_embrace.210.option.a.tt: "[target.GetFirstName]成为了你的子嗣。"
 POD_embrace.220.t: "消失在黑暗中。"
 POD_embrace.220.option.a: "为啥？为啥是木凳？"
 POD_embrace.220.option.a.tt: "你死了。"
 POD_embrace.230.t: "被油浸透的床层燃起了熊熊烈火。"
 POD_embrace.230.option.a: "[victim.GetSheHe]是怎么弄到油的？"
 POD_embrace.230.option.a.tt: "你死了。"
 POD_embrace.240.t: "结果这根本就不是福报。"
 POD_embrace.240.option.a: "你需要点时间来考虑。"
 POD_embrace.240.option.a.tt: "你被这次谈话深深地扰乱了。"
 POD_embrace.301.t: "自愿初拥"
 POD_embrace.301.desc: "你花时间与这位潜在的子嗣长谈，详细解释了吸血鬼的本质以及这一可怕诅咒对灵魂的影响。[target.GetSheHe |U|]一直专注地聆听，尽管难掩恐惧。[target.GetFirstName]请求独处以消化这些信息。"
 POD_embrace.301.option.a: "让我们开始吧"
 unwilling_embrace_tt: "你将强迫$pod_Embrace$，不管其的意见如何。"
 POD_embrace.400.t: "初拥"
 POD_embrace.400.desc: "我已经策划了一些事件，使[target.GetFirstName]落入我的魔掌之中。现在，我所要做的就是打破[victim.GetHerHis]的意志。"
 POD_embrace.400.option.a: "[victim.GetSheHe|U]会照我说的做！"
 POD_embrace.400.option.a.success.tt: "你成功地支配了[victim.GetFirstName]，使其屈服。"
 POD_embrace.400.option.a.fail.tt: "你试图支配[victim.GetFirstName]的行动失败了。"
 POD_embrace.400.option.b: "没人可以拒绝我"
 POD_embrace.400.option.b.success.tt: "你成功地使用威仪术打破了[victim.GetHerHis]的意志。"
 POD_embrace.400.option.b.fail.tt: "你对[victim.GetFirstName]的魅惑尝试失败。"
 POD_embrace.400.option.c: "[victim.GetSheHe|U]不是我的对手！"
 POD_embrace.400.option.c.success.tt: "你成功地击溃了[victim.GetFirstName]，使其屈服。"
 POD_embrace.400.option.c.fail.tt: "[victim.GetFirstName]将你击退"
 POD_embrace.400.option.d: "实际上……算了吧"
 POD_embrace.400.option.d.tt: "你放弃了初拥[victim.GetFirstName]的尝试"
 POD_embrace.410.t: "初拥"
 POD_embrace.410.desc: "你成功地占了上风，现在[victim.GetFirstName]任你宰割。吸干他身上的血，你能感觉到生命是如何从[victim.GetFirstName]身上流失的。你知道你想做的事成功概率很低，但一想到你能创造的东西，你就会忘记那些愚蠢地担忧。\n拥抱化形者几乎总是不成功的，因为他们对吸血鬼的血液有防护。少数记录在案的受害者在这个过程中没有死亡，最后他们变成了可怕的[Concept('abomination','恶煞')|E]。"
 POD_embrace.410.option.a: "该行动了"
 POD_embrace.410.option.a.tt: "你试图初拥[victim.GetFirstName]"
 POD_embrace.410.option.a.fail.tt: "[victim.GetFirstName]在痛苦中死去"
 POD_embrace.410.option.a.success.tt: "[victim.GetFirstName]被成功初拥"
 POD_embrace.420.t: "怪物造主"
 POD_embrace.420.desc: "一段时间后，[victim.GetFirstName]睁开了[victim.GetHerHis]的眼睛。你可以看到[victim.GetHerHis]的脸上露出惊恐的表情，这时你意识到令人惊悚的事实。你已经成功了，你创造了一只怪物，一只现在是你的子嗣的恶煞。"
 POD_embrace.420.option.a: "终于成功了"
 POD_embrace.420.option.a.tt: "[victim.GetFirstName]不再是化形者，而成为[Glossary('Abomination','game_concept_abomination_desc')]。"
 POD_embrace.430.t: "初拥失败"
 POD_embrace.430.desc: "尽管你做了种种努力，[victim.GetFirstName]还是去了。当[victim.GetHerHis]的身体和灵魂猛烈地拒绝你的血液时，你只能听到[victim.GetHerHis]痛苦的尖叫声。而现在[victim.GetFirstName]真的走了。也[victim.GetSheHe]终究是幸运的？"
 POD_embrace.430.option.a: "令人失望"
 POD_embrace.430.option.a.tt: "你的初拥企图失败了"
 POD_embrace.440.t: "尝试失败"
 POD_embrace.440.desc: "[victim.GetFirstName]成功抵制了你的企图，占了上风。现在你能做的就是逃避[victim.GetHerHis]的怒火。"
 POD_embrace.440.option.a: "最终败局"
 POD_embrace.440.option.a.tt: "你未能初拥[victim.GetFirstName]。"
 POD_embrace_ongoing.tt.target_will_be_embraced: "[target.GetFirstName]将被[foe.GetFirstName]初拥"
 POD_embrace_ongoing.tt.ai_embraces_target: "[target.GetFullName]被[vampiresire.GetFullName]初拥"
 POD_opponent_may_use_willpower: "[defender.GetFirstNameNoTooltip]将发挥[defender.GetHerHis]的意志来抵抗你的能力。"
 POD_embrace_ongoing.t.mesmerize.success: "催眠尝试成功"
 POD_embrace_ongoing.1000.opening: "[rival.Custom2('AppropriateGreeting', ROOT.Char)]"
 POD_embrace_ongoing.1000.target_killed.desc: "你对凡人的品味真是令人失望。我已经帮你提高了你的标准。你真不该把[target.GetFirstName]这样的下等胚子带进我们的阶级。我相信你以后会感谢我的。"
 POD_embrace_ongoing.1000.target_killed.not_vampire.desc: "我知道你是什么样的怪物，与其让[target.GetFirstName]变成你这样的怪物，还不如死了算了！"
 POD_embrace_ongoing.1000.target_kidnapped.desc: "当我听说你对[target.GetFirstName]的意图时，我真的没能控制住。我擅自把[target.GetHerHim]请为我的贵宾。我现在已经把[target.GetFirstName]当成了家人。与[target.GetHerHim]分离会让我非常难过。不过我听说礼物可以让人心情愉悦。"
 POD_embrace_ongoing.1000.target_embraced.desc: "你以为我不会注意到你的跟踪吗？我已经把你认为属于你的东西变成了我的。"
 POD_embrace_ongoing.1000.option.a: "支付赎金"
 POD_embrace_ongoing.1000.pay_ransom.tt: "[target.GetFullName]会被送给你"
 POD_embrace_ongoing.1000.option.b: "不过是个凡人罢了"
 POD_embrace_ongoing.1000.option.c: "冒犯我是个错误！"
 POD_embrace_ongoing.1001.target_maimed.desc: "我非常喜欢[target.GetFullName]的陪伴。我们在一块玩的非常开心。"
 POD_embrace_ongoing.1001.returned.desc: "很高兴与你合作。"
 POD_embrace_ongoing.1001.option.a: "让我们看看我们未来子嗣的状况吧"
 POD_embrace_ongoing.1001.option.b: "[rival.GetFirstNameNoTooltip]最好小心[rival.GetHerHis]背部"
 POD_embrace_ongoing.1002.desc.target_maimed: "[rival.GetTitledFirstName]将[victim.GetFullName]还给了你，但不是[victim.GetSheHe]原本的样子。无论[victim.GetHerHim]遭受了怎样的恐怖，你现在都必须决定如何处理[victim.GetFirstName]。"
 POD_embrace_ongoing.1002.desc.target_returned: "[rival.GetTitledFirstName]已按约定将[victim.GetFullName]毫发无损地还给了你。至少这个坏蛋还能遵守[rival.GetHerHis]的诺言。现在，你必须决定如何处置[victim.GetFirstName]。"
 POD_embrace_ongoing.1002.t: "该如何处理[target.GetFullName]？"
 POD_embrace_ongoing.1002.option.a: "我改变主意了"
 POD_embrace_ongoing.1002.option.b: "我们本该干嘛了？"
 POD_embrace.ongoing.1002.tt.embrace: "你初拥[victim.GetFirstName]"
 POD_embrace_ongoing.1002.option.c: "这只被毁了，但还有其他用途……"
 POD_embrace_ongoing.1002.option.d: "这是令人印象深刻的作品。确实令人印象深刻！"
 POD_embrace_ongoing.1002.option.e: "业余爱好者！我来教你该怎么做！"
 POD_embrace_ongoing.1002.tt.transmogrify_option: "使用易变术塑形[victim.GetFirstName]将提升饥渴，耗费你的意志以及由潜藏曝露风险。"
 POD_embrace_ongoing.1010.t: "夜常纠缠"
 POD_embrace_ongoing.1010.desc: "在观察[target.GetFirstName]时，你发现自己并不孤单。你感觉到了另一位和你很像的黑暗存在。你想知道其是否也能感觉到你？你是否应该利用出其不意或其他手段来确保[target.GetFirstName]只属于你一个人？"
 POD_embrace_ongoing.1010.option.a: "安排一次会面"
 POD_embrace_ongoing.1010.option.b: "尝试伏击"
 POD_embrace_ongoing.1010.option.ambush_won.desc: "你成功赶走了竞争对手"
 POD_embrace_ongoing.1010.option.ambush_fail.desc: "[foe.GetSheHe|U]发现了你的所在。你现在必须与[foe.GetFirstName]对战"
 POD_embrace_ongoing.1010.option.prowess_lost.desc: "你被击败了"
 POD_embrace_ongoing.1010.option.c: "反正我也不想要[target.GetFullName]"
 POD_embrace_ongoing.1011.t: "会面"
 POD_embrace_ongoing.1011.desc: "你决定与[foe.GetFullName]会面，讨论[target.GetFullName]的未来。也许可以达成友好的解决方案？"
 POD_embrace_ongoing.1011.option.a: "你的仆人无权要求属于你的东西"
 POD_embrace_ongoing.1011.option.b: "奉承也有它的用处"
 POD_embrace_ongoing.1011.option.b.t.CRITICAL_SUCCESS: "巧舌如簧"
 POD_embrace_ongoing.1011.option.b.t.SUCCESS: "达成协议"
 POD_embrace_ongoing.1011.option.b.t.FAILURE: "无论如何，对话从来不是你的强项"
 POD_embrace_ongoing.target_will_be_embraced: "[target.GetFullName]将被[foe.GetFullName]初拥"
 POD_embrace_ongoing.1011.option.e: "[foe.GetFullName]欠我一个人情"
 POD_embrace_ongoing.1011.option.f: "每个人都有自己的价格"
 POD_embrace_ongoing.1011.option.c: "尝试催眠[foe.GetHerHim]"
 POD_embrace_ongoing.1011.option.d: "尝试魅惑[foe.GetHerHim]"
 POD_embrace_ongoing.1012.t: "偷袭"
 POD_embrace_ongoing.1012.duel_won.desc: "你成功击伤了[foe.GetFirstName]，赶走了他们。现在问题解决了，你可以重新集中精力对付[target.GetFullName]。"
 POD_embrace_ongoing.1012.duel_lost.desc: "你被打败了。你必须趁早逃走。"
 POD_embrace_ongoing.1012.option.a: "[target.GetFullName]是我的了！"
 POD_embrace_ongoing.1012.option.b: "忘掉[target.GetFullName]。[sc_defender.GetFullName]可以拥有[target.GetHerHim]。"
 POD_embrace_ongoing.1013.t: "魅惑[defender.GetFirstNameNoTooltip]"
 POD_embrace_ongoing.entrance_success: "[defender.GetTitledFirstName]将敬畏你的威严"
 POD_embrace_ongoing.willpower_spent: "激起血液催动我的意志。我不受拒绝！"
 POD_embrace_ongoing.t.entrance.success: "[defender.GetTitledFirstName]被魅惑"
 POD_embrace_ongoing.willpower_unspent: "激起血液"
 POD_embrace_ongoing.1014.t: "催眠[defender.GetTitledFirstName]"
 POD_embrace_ongoing.mesmerize_win: "你将成功在[defender.GetHerHis]的潜意识中植入催眠暗示"
 POD_embrace_ongoing.mesmerize_lose: "你将无法影响[defender.GetHerHis]的思想"
 POD_embrace_ongoing.1015.t: "催眠失败"
 POD_embrace_ongoing.1015.give_up.desc: "你决定不与[target.GetFullName]的宿命抗争。没有你的干预，[foe.GetFullName]已经初拥了[target.GetHerHim]。"
 POD_embrace_ongoing.1015.defiant_vassal.desc: "[foe.GetFullName]直接违抗了您的命令，没有把[target.GetFullName]交给您，而是初拥了[target.GetHerHim]。难道这种犯上行为不会受到惩罚吗？"
 POD_embrace_ongoing.1015.negotiations_failed.desc: "你与[foe.GetFullName]的谈判失败了。不仅[foe.GetSheHe]初抱了[target.GetFullName]，而且你在放弃了你未来的子嗣后，却什么也没得到。"
 POD_embrace_ongoing.1015.entrance_failed.desc: "你试图巧妙地魅惑[foe.GetFullName]的企图适得其反。[foe.GetSheHe|U]已经初拥了[target.GetFullName]，并且不会忘记你试图操纵[foe.GetHerHim]的企图。"
 POD_embrace_ongoing.1015.mesmerize_failed.desc: "你试图让[foe.GetFullName]服从你的意志，但失败了。血族不会轻易接受用这种力量对付其他血族的尝试。[foe.GetSheHe|U]已经初拥了[target.GetFullName]，不可能原谅或忘记你的尝试。"
 POD_embrace_ongoing.1015.option.a: "人不可能总是一帆风顺"
 POD_embrace_ongoing.1015.option.b: "如果我不能有[target.GetFullName]，那谁也不能有！"
 POD_embrace_ongoing.1015.option.c: "肯定还有别的办法"
 POD_embrace_ongoing.1020.t: "[target.GetFirstNameNoTooltip]不值得受赠"
 POD_embrace_ongoing.1020.desc: "在观察[target.GetFullName]的过程中，你不禁对[target.GetHerHim]感到失望。[target.GetSheHe|U]没有充分发挥[target.GetHerHis]的潜力。也许你误判了[target.GetHerHim]，[target.GetSheHe]并不真正配得上这份赠礼？"
 POD_embrace_ongoing.1020.option.a: "继续按计划进行准备"
 POD_embrace_ongoing.stop: "停止准备"
 POD_embrace_ongoing.1020.option.c: "这只只适合吃"
 POD_embrace_ongoing.1020.option.c.tt.suck: "#beast 好！把血带走。其不再需要了。我们需要！#!"
 POD_embrace_ongoing.1020.option.d: "[target.GetSheHe]不仅不值得受赠，而且……"
 POD_embrace_ongoing.1030.t: "[target.GetFullNameNoTooltip]给你留下深刻印象"
 POD_embrace_ongoing.1030.intro.desc: "在跟踪[target.GetFirstName]一段时间后，你得出结论：[target.GetSheHe]具有尚未开发的潜力。"
 POD_embrace_ongoing.1030.diplomacy_bonus.desc: "你会发现，无论[target.GetSheHe]遇到谁，[target.GetSheHe]都能通过闲聊让对方感到舒适和顺从。这种才能只会通过初拥得到提升。"
 POD_embrace_ongoing.1030.martial_bonus.desc: "[target.GetFirstName]是天生的领导者。你发现其他人都喜欢[target.GetHerHim]，并很容易成为[target.GetHerHim]的下属。"
 POD_embrace_ongoing.1030.stewardship_bonus.desc: "[target.GetSheHe|U]不畏艰难，设法使[target.GetHerHis]的财务状况井然有序。[target.GetFirstName]很容易达成商业方面的工作。"
 POD_embrace_ongoing.1030.intrigue_bonus.desc: "[target.GetSheHe|U]已经了解到，在人类事务中，诡计是一种有用的生存工具。在不死族的世界里更是如此。"
 POD_embrace_ongoing.1030.learning_bonus.desc: "很少有人真正懂得“知识就是力量”。然而，[target.GetFirstName]就是喜欢阅读。"
 POD_embrace_ongoing.1030.option.a: "不错的开始"
 POD_embrace_ongoing.1040.t: "[target.GetFirstNameNoTooltip]已经是吸血鬼！"
 POD_embrace_ongoing.1040.desc: "[target.GetFirstName]有潜藏的天赋。[target.GetHerHis|U]的伪装效果很好，一开始连你都被骗了。也许你还可以用[target.GetHerHim]做其他用途？"
 POD_embrace_ongoing.1040.option.a: "这真是浪费我的时间！"
 POD_embrace_ongoing.1040.option.b: "新的下属还是玩物？"
 POD_embrace_ongoing.1040.option.c: "杀了其！"
 POD_embrace_ongoing.1040.option.c.duel_won.desc: "你很快就顺利地打发走了这不够格的$pod_cainite$。"
 POD_embrace_ongoing.1040.option.c.duel_won.t: "决斗获胜"
 POD_embrace_ongoing.1040.option.c.duel_lost.desc: "你低估了[target.GetHerHim]"
 POD_embrace_ongoing.duel_outcome.LOST.1043.t: "一马送走一国君！"
 POD_embrace_ongoing.duel_outcome.LOST.1043.desc: "不可思议的事情发生了。[target.GetFirstNameNoTooltip]打伤了你。你必须在失去自尊之前迅速逃离。你会让[target.GetHerHim]逍遥法外吗？"
 POD_embrace_ongoing.1041.t: "朋友或敌人"
 POD_embrace_ongoing.1041.desc: "研究完其的日常作息后，你在[target.GetSheHe]肯定会去的地方等待。你与[target.GetFirstName]面对面，试图拉拢其加入你的宫廷。"
 POD_embrace_ongoing.1041.option.a: "其已经欠我一个人情"
 POD_embrace_ongoing.1041.option.b: "尝试催眠[target.GetHerHim]"
 POD_embrace_ongoing.1041.option.c: "尝试魅惑[target.GetHerHim]"
 POD_embrace_ongoing.1041.option.d: "我能说服[target.GetHerHim]加入我"
 POD_embrace_ongoing.1041.option.e: "我改变主意了"
 POD_embrace_ongoing.1041.tt.SUCCESS: "你成功地说服[target.GetFirstNameNoTooltip]加入了你的宫廷"
 POD_embrace_ongoing.1041.tt.FAILURE: "你没能说服[target.GetFirstNameNoTooltip]加入了你的宫廷"
 POD_embrace_ongoing.1042.t: "意外的敌意"
 POD_embrace_ongoing.1042.desc: "尽管你试图表现得不具威胁性，[target.GetFirstName]还是趁机攻击了你！"
 POD_embrace_ongoing.1043.option.a: "我认输"
 POD_embrace_ongoing.1044.duel_lost.desc: "尽管你很勇敢，[target.GetFirstName]还是打伤了你。你迅速消失在阴影中。"
 POD_embrace_ongoing.1048.entrance_failed.desc: "你的魅惑没有用[target.GetFirstNameNoTooltip]已经识破了你的魅惑企图，并不再与你交谈。"
 POD_embrace_ongoing.1048.mesmerize_failed.desc: "你试图让[target.GetFullNameNoTooltip]服从你的意志，但失败了。血族不会轻易接受用这种力量对付其他血族的尝试，也不可能原谅或忘记你的尝试。"
 POD_embrace_ongoing.1050.t: "[target.GetFirstNameNoTooltip]是狼人！"
 POD_embrace_ongoing.1050.desc: "这家伙比大多数同类都要聪明。[target.GetSheHe|U]能够向你隐藏[target.GetHerHis]的真实本性。也许你的鼻子出了问题，因为狼人的臭味现在已经清晰可辨了。"
 POD_embrace_ongoing.1050.option.a: "制造[Glossary('Abomination','game_concept_abomination_desc')]"
 POD_embrace_ongoing.1050.option.c.duel_won.desc: "你杀死了恶臭的怪物"
 POD_embrace_ongoing.1050.abomo_warning: "即使有可能做到，初拥狼人也会给自己和受害者带来巨大风险"
 POD_embrace_ongoing.1060.t: "[target.GetFirstNameNoTooltip]是猎人！"
 POD_embrace_ongoing.1060.desc: "在月光的照耀下，你发现这凡人并不简单。[target.GetSheHe|U] 在[target.GetHerHis]的脖子上佩戴着一个宗教标志，隐约让你有些熟悉。你跟随 [target.GetHerHim] 进一步观察，发现 [target.GetSheHe] 在[target.GetHerHis]的斗篷下隐藏着一条腰带，上面放着数件工具，专门用于摧毁你们这一族。"
 POD_embrace_ongoing.1060.option.c.duel_won.desc: "少了一个所谓的“吸血鬼杀手”要对付"
 POD_embrace_ongoing.1060.hunter_warning.tt: "初拥猎人伴随着固有的风险"
 POD_embrace_ongiong.1060.option.d: "将[target.GetHerHim]引向我的敌人"
 POD_embrace_ongoing.mesmerize_failed.1061.t: "催眠尝试失败"
 POD_embrace_ongoing.mesmerize_failed.1061.desc: "[target.GetFirstNameNoTooltip]已经能够抵御你对[target.GetHerHis]思想的控制。你已经向这一区域的猎人暴露了自己的身份，现在你已经成为众矢之的。"
 POD_embrace_ongoing.mesmerize_failed.1061.option.a: "我应该低调一段时间"
 POD_embrace_ongoing.mesmerize_success.1062.t: "谁说猎人一无是处"
 POD_embrace_ongoing.mesmerize_success.1062.desc: "你已成功向[target.GetFirstNameNoTooltip]植入了将十字瞄准线对准[picked_rival.GetFirstNameNoTooltip]的想法。运气好的话，猎人会杀死[picked_rival.GetFirstNameNoTooltip]，或者被[picked_rival.GetFirstNameNoTooltip]杀死，或者最好是同归于尽。"
 POD_embrace_ongoing.mesmerize_success.1062.option.a: "漂亮"
 POD_embrace_ongoing.1042.won.desc: "你战胜了[target.GetFirstNameNoTooltip]"
 POD_embrace_ongoing.1042.lost.desc: "[target.GetFirstNameNoTooltip]伤到了你"
 POD_embrace.300.t: "自愿初拥"
 POD_embrace.300.desc: "你的信仰教导你，$pod_Embrace$是庄严而沉重的事——毕竟这是在将另一个灵魂推入永恒的诅咒。因此，你被教导未经许可不得$pod_Embrace$。你已安排与[target.GetFirstName]会面，现在必须决定透露多少真相。"
 POD_embrace.300.option.a: "只告诉[target.GetHerHim]必要的信息。"
 POD_embrace.300.option.b: "[target.GetSheHe|U]应当知晓足够的信息以作出明智决定。"
 POD_embrace.300.option.c: "[target.GetSheHe|U]必须知晓一切！"
 POD_embrace.300.option.d: "我已经改变主意了。"
 POD_embrace.301.option.b: "让他自行抉择。"
 POD_embrace.310.t: "自愿初拥"
 POD_embrace.310.desc: "现在是[target.GetFirstName]给出答复的时刻。\n当未来的子嗣表示接受时，你（徒劳地，因你已死去）松了一口气。你履行了信仰的义务，现在可以开始$pod_Embrace$了。"
 POD_embrace.310.option.a: "可喜的日子。"
 POD_embrace.340.t: "自愿初拥"
 POD_embrace.340.desc: "现在是[target.GetFirstName]给出答复的时刻。\n看来你吓坏了这个凡人，他们拒绝了。按理你该放他们离开，让其短暂余生平安度过……但毕竟，没人能始终恪守信仰。"
 POD_embrace.340.option.a: "一路平安"
 POD_embrace.340.option.b: "忘却这一切。"
 POD_embrace.340.option.c: "这位[target.GetWomanMan]无法开口……"
 POD_embrace.340.option.d: "我不受拒绝！"
 willing_embrace_fully_accept.tooltip: "他们被说服了！"
 willing_embrace_partial_accept.tooltip: "他们正在考虑"
 willing_embrace_failure.tooltip: "他们拒绝了"