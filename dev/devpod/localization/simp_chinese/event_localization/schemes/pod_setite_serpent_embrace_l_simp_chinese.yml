l_simp_chinese:
 pod_setite_serpent_embrace.0001.t: "毒蛇之环步步收紧"
 pod_setite_serpent_embrace.0001.desc: "成了。\n\n这漫长的追求终于圆满。[target.GetFirstNameNoTooltip]今夜主动来到你面前，眼窝空洞，满载着你耐心拆解的一切确信、你慢慢毒化的每一份慰藉、你悬于彼方却不可及的每一丝欢愉。[target.GetSheHe|U]跪下的对象并非你，而是你夜复一夜低语进其灵魂的真理：世界早已抛弃他们，唯有赛特的智慧能让他们的苦难有了意义。\n\n[target.GetSheHe|U]以重生者颤抖的热忱念出皈依之词。蛇不击其猎物；它等待，它凝视，它知晓终有一日猎物会心甘情愿爬入其口中。你感到赛特的赞许如凉鳞划过背脊，又一个灵魂被引入绵长蜿蜒的黑暗，又有一盏明灯在上界黯淡。此番皈依的消息将传开，那些曾视[target.GetFirstNameNoTooltip]为坚定之人者，将开始思忖自身究竟有多坚定。\n\n赛特之道再纳一人。上界渐暗一分，巨蛇的盘绕渐宽一匝。"
 pod_setite_serpent_embrace.0001.a: "赛特奖赏祂忠心的仆人。"
 pod_setite_serpent_embrace.0002.t: "蛇之低语"
 pod_setite_serpent_embrace.0002.desc: "距离[scheme_owner.GetFirstNameNoTooltip]初次与你相遇，已过数月，或许更久。当时你未曾多想；一次偶然的邂逅，一壶美酒的馈赠，一番机智的交谈。而后是再次相遇。接着是一封信。再后来是一个静谧的夜晚，谈玄论道，笑声盈耳，却让你在不知不觉间，开始怀疑那些你从未质疑过的事情。\n\n今夜你终于恍然大悟。那些让你醒来时唇边挂着赛特名字的梦境。你试图背诵旧日信仰的教义时，它们却突然显得空洞无力的种种论调。当你闭上双眼时，那种奇异的确定感，仿佛头顶的世界不过是一层光鲜的谎言，覆盖着更深、更真实的黑暗。\n\n[scheme_owner.GetFirstNameNoTooltip]又来了，你终于明白[scheme_owner.GetSheHe]一直在做什么。蛇的盘绕已然将你缠紧。问题已不在于你是否会被转化，而在于你是否会将其视为启迪，接纳它，还是奋力挣脱这已半夺你灵魂的教义。"
 pod_setite_serpent_embrace.0002.a: "赛特的真相已寻得我。我将心甘情愿踏上暗路。"
 pod_setite_serpent_embrace.0002.b: "我不会被变成赛特的造物。"