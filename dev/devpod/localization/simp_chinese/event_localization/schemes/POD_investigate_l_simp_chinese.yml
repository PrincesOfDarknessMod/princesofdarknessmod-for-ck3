 POD_investigate.3.t.the_white_lady: "传记：白夫人"
 POD_investigate.1.t: "传记：[target.GetFirstNameNoTooltip]"
 POD_investigate.desc.790101: "也许是历史上最有影响力的梵卓，提图斯·梵卓鲁·卡米拉是一位前途无量的年轻罗马人，由最好的导师们——他未来的[Glossary('尊长','game_concept_Sire_desc')]科拉，罗马亲王吕山德，和斯巴达的阿尔忒弥斯·欧西雅——教导。强烈的掌权欲望和贪婪野心很快就结出了果实，卡米拉继承了[Glossary('尊长','game_concept_Sire_desc')]的权位，有人说是通过$pod_diablerie$。然后他在从共和时代到帝国时代一直统治着罗马，开创永恒元老院和避世的概念。也是他命令摧毁了迦太基，使他成为了布鲁赫的永恒之敌。\n更有名的是，卡米拉堕落入了原罪之路，成为了其中……最善于此道的行家。尽管卡米拉是不拘小节的，有时甚至是懒散的，但卡米拉还是成功地用其权力缰绳套住了大部分$pod_cainite$世界千年之久，这是之前和之后都没有见过的壮举。\n\n在罗马帝国时代的末期，他陷入了$pod_torpor$，$pod_cainite$世界的一切大统一假象也随着他一起消失了。他终于在1230年苏醒过来，并轻易地在罗马重新掌权。但是世界已经改变了很多，原罪亲王不太可能再一次统治欧洲。\n\n其在原作中的未来命运\n卡米拉在中世纪陷入$pod_torpor$，直到21世纪初才苏醒。一个旧敌将等待他的归来，为一项和罗马一样古老的仇恨而复仇。"
 POD_investigate.desc.505071: "密特拉曾是波斯的一名士兵，他为自己留下了不少传承。利用他自己的力量和无可争议的操纵与说服技巧，密特拉就这样制造了新的背景故事，也就是那同名的太阳神。这让他成为上古时代里最强大的梵卓之一，尤其是当他的密教传播到罗马帝国时。\n但基督教和他的众多竞争对手击败了他，令他带着追随者逃到了帝国的边疆，不列颠。这偏狭的地方让他很快地感到厌烦，并陷入了一个$pod_torpor$苏醒循环——苏醒就发现一切都因为摄政者的无能而变得一团糟，拨乱反正之后，又再度陷入$pod_torpor$。\n上一个周期是在1066年之后，野心勃勃的诺曼吸血鬼将他的权力基础从岛上赶走，迫使他再次苏醒并处理。到了1230年，太阳神又一次厌倦不列颠了，而他的影响力已经强大到可以考虑再次退回到年长之倦中。虽然据说后起之秀哈德施塔特，宣称自己是梵卓$pod_clan$的霸主，激怒了比他年长得多的族人。这可能是足够的理由，让他多醒一段时间……\n\n其在原作中的未来命运\n密特拉将保持苏醒一段时间，这让他在秘盟建立期间，成为了哈德施塔特的眼中钉。他再一次陷入了$pod_torpor$，终于在1996年他的前摄政者之一，瓦勒留斯在背叛了他的时候杀死了他。不过，据说他有着应急计划……"
 POD_investigate.desc.790103: "关于罗宾早年的事迹，人们知道的不多，有理论说他就是民间传说人物罗宾汉。他的行为当然也暗合了这一点，因为他可能是$pod_cainite$世界当中最著名的狂徒。\n他总是在反抗和对抗暴君，为自己聚集了不少追随者，甚至被英格兰的太阳神密特拉认为是一位值得尊敬的敌人。\n然而，李兰德的星光正逐渐暗淡，因为他最近在与密特拉的战斗中惨败，而且一次拉拢新盟友的计谋也以失败告终。罗宾有时会想，为什么密特拉没有像对付其他对手那样迅速解决他，也不知道伦敦之主对他心存敬意的传言是否属实，即他认为他是唯一值得“让他乐在其中”的敌人。\n\n其在原作中未来的命运\n李兰德将永远不会停止战斗。他仍然居住在诺丁汉，散发着智慧，持续袭扰不法份子，成为泰勒、杰里米·麦克尼尔或玛格丽特·福卡特等历史上最有影响力的叛党的模范形象。"
 POD_investigate.desc.505103: "唯一一名被睿魔尔允许加入为其魔法师圈子的女人，梅琳达在七人议会中保持中立.她是埃特里乌斯的密友，受到格拉崔克斯尊重，她参加了制造睿魔尔$pod_clan$的最初的仪式，从那时起，她一直努力为陷入困境的$pod_clan$寻找盟友。\n密特拉，英格兰的太阳神，作为萨洛比$pod_clan$的盟友，一直拒绝承认睿魔尔。因此，梅琳达正隐秘的在英格兰群岛上聚集追随者和影响力，目标是引导一个更容易掌控的国王掌权……\n\n其在原作中的未来命运\n梅琳达将与哈德施塔特的秘盟结盟，确保睿魔尔$pod_clan$在未来几个世纪的权力。她的报酬是北美摄政之位，在那她将拥有空前的权力和影响力。"
 POD_investigate.desc.790131: "美露莘，一位骄傲而又有些自大的女人，在安茹帝国的阴谋场中被锻练而出。作为妥芮朵$pod_clan$的后裔，她肆无忌惮地在法兰西的政坛上工作，使她被自己的血之姐妹伊思妲敌视，并最终被流放。\n来到了英格兰，她并没有什么改变，而是把自己塑造成一位密特拉的主要反对派，并以“吕西尼昂的仙女”的身份讲述她过去的宏大故事。她冷酷无情的脾气没有为她赢得任何朋友。\n\n其在原作中的未来命运\n不出所料，美露莘没有任何象征性的成就，很快就被历史遗忘。"
 POD_investigate.desc.790132: "作为一名野心勃勃的爵士，约翰出生于诺曼征服英格兰之后，他在$pod_cainite$的政治中表现优异。约翰在合适的时机背叛了他的[Glossary('尊长','game_concept_Sire_desc')]。由于维京[Glossary('英灵战士','game_concept_einherjar_desc')]的残党仍然没有被消灭，所以他需要专注于对约克郡的统治。约翰并没有忘记他过去的自由，他是反抗玛土撒拉统治的主要阴谋者之一。因此，他聚集了一群有心的封臣，包括美露莘·德安茹和梅琳达，耐心的等待着密特拉犯错。\n\n其在原作中的未来命运\n约翰对梅琳达的信任将导致他的失败。"
 POD_investigate.desc.790226: "玛格达是罕见而神秘的菈亚南之一，她被看作成一种可怕的自然力量，是爱尔兰古老传统的体现。她至今仍与罗马人、基督教徒、维京人、诺曼人……战斗着，这就是爱尔兰还没有落入密特拉手中的主要原因之一。\n她对战斗的欲望近乎疯狂，这使她被任何朋友或盟友疏远，也使她比曾经的德鲁伊女祭司更像一头野兽。\n\n其在原作中的未来命运\n有些微弱不堪的传言说，玛格达最终屈服于心兽，然后被狼人放倒。也有人认为她还在爱尔兰徘徊，成为过去时代的最后遗迹。"
 POD_investigate.desc.790438: "比约恩是一名维京[Glossary('英灵战士','game_concept_einherjar_desc')]，他长期抵御梵卓和妥芮朵的侵袭。尽管有忠心耿耿、精挑细选的盾友相助，但这位布鲁赫还是没能在挪威扭转颓势，不得不逃亡。比约恩与其他志同道合的战士滞留在苏格兰北部，正准备为他濒临灭绝的信仰进行又一场注定要失败的生存之战。\n\n其在原作中的未来命运\n比约恩将再次失败，并逃往文兰。几百年后，他成为了华盛顿特区的叛党领袖，对秘盟有严重的不满。"
 POD_investigate.desc.790134: "马库斯生前是罗马军团的一员，在见到他的神之前，他就已经是一位虔诚的密特拉教徒了。被密特拉亲手初拥对马库斯来说是一次真正的觉醒，于是他将自己的亡生献给了他所珍视的太阳神。从此，他就成了密特拉在英格兰的顶梁柱，在玛土撒拉不在的时候维持着密教，并猎杀任何对他的[Glossary('尊长','game_concept_Sire_desc')]和神明的统治有异议之人。不过马库斯仍然更多是担任军人，经常出现在战场上带领着密特拉的信徒们取得胜利，而不是待在宫廷或神殿里。\n\n其在原作中的未来命运\n这位罗马人将遭遇重大的信仰危机，然后会走上一条更黑暗的道路。"
 POD_investigate.desc.790534: "卡姆登领主出生于英格兰的一座小村庄，那时的他名叫罗宛，并与死者一直保持着特殊的联系。他作为镇上的真言师，吸引了一位最有影响力的卡帕多西亚——康斯坦西娅的注意，并成为她的学徒。他们在欧洲各地旅行，同时这位稚子也证明了自己是个精明的学生。他渴望并尽其所能地了解有关灵魂的一切及其与身体的相互作用，无论是活人还是死者。\n当卡姆登得知密特拉从$pod_torpor$中苏醒后，他便搬到了英格兰，然后开始与波斯太阳神结下了牢固的联系。\n\n其在原作中的未来命运\n卡姆登成为了执事，密教的主要领袖，甚至是密特拉的爱人。他在乔凡尼进行清洗期间伪造了自己的死亡，这位学者也在几个世纪内保留了密特拉的传承，以及灵魂。"
 POD_investigate.desc.790420: "生前是西哥特人的首领，西格弗里德以他的智慧和敏捷的智力吸引了罗马吸血鬼的目光。这位梵卓稚子勉强熬过了这段惨痛的经历，并对此大发雷霆，然后在这个过程中[Glossary('吸榨','game_concept_diablerie_desc')]了他的[Glossary('尊长','game_concept_Sire_desc')]。这个罪行让他被势力强大的罗马梵卓追杀了几个世纪后，其身份才被$pod_clan$式承认。\n西格弗里德对政治很敏感，于是他选择在各地流浪，直到遇到了另一個拥有日耳曼血統的梵卓——赫罗图尔夫。在对方的坚持下，西格弗里德被带去了英格兰，那是罗马梵卓另一位故敌的土地。\n\n其在原作中的未来命运\n西格弗里德将在保护了一个年轻的稚子后逃离英格兰。在美利坚，他将成为那里最强大的$pod_cainites$之一，作为温哥华的亲王。当他设法与狼人达成和平条约时，他的名声将成为传奇。"
 POD_investigate.desc.505072: "萨莉安娜在生时是位护火贞女，她的虔诚和纯洁引起了米迦勒，一位痴迷于神格的妥芮朵，的注意。她并不领情，而且很容易就看穿了她那怪物般的[Glossary('尊长','game_concept_Sire_desc')]的伪装。逃离君士坦丁堡后，她在中东地区游荡了一段时间，直到另一次事件迫使她逃到更远的西方，逃到新生的法兰西。\n在那里，她重建了自己的影响，并很快成为暴虐的梵卓统治者亚历山大的主要竞争者。当萨利安纳的得意子嗣洛林在愤怒中被亚历山大杀死时，这两个人之间的冷战就崩溃了。然后，她精心策划着他的灭亡，并在亚历山大的子嗣若弗鲁瓦·杜·坦普尔的帮助下，于1224年成功实现了这一目标。\n现在，萨莉安娜有生以来第一次真正掌握了权力。但是，狼群正围着她梦寐以求的位置打转，无论是被流放的亚历山大、叛逆的埃丝克拉蒙德还是若弗鲁瓦本人。\n\n其在原作中的未来命运\n萨莉安娜不会享受太久的胜利。当法兰西在裁判所的火力下崩溃时，她被她的朋友贝娅特丽克丝背叛，后者夺得了法兰西的亲王位。她的确切最终命运仍是未知数。"
 POD_investigate.desc.790138: "作为一名参加过第一次十字军东征的年轻法兰西骑士，若弗鲁瓦引起了法兰西的强大不死族统治者亚历山大的注意。他们的关系从来都算不上很好，而这位稚子在刻板专横的玛土撒拉掌下玩笑度日。\n在一次叛乱中，他参加了第四次十字军东征，在这个过程中他失去了自己的子嗣于格，为此他责备亚历山大。回到巴黎后，若弗鲁瓦急切地参与进了反对他[Glossary('尊长','game_concept_Sire_desc')]的阴谋，这为他赢得了巴黎亲王领。不过，大家都知道，萨莉安娜现在才是法兰西真正掌权者，而若弗鲁瓦又一次在一个比他更年长、更有权势的人物掌下玩笑度日。\n\n其在原作中的未来命运\n这位梵卓十字军战士将永远不会有太大的成就，他没法抵御那些源源不断且困扰他[Glossary('尊长','game_concept_Sire_desc')]的怒袭。他甚至无法保住巴黎，很快就在法兰西政治的大格局中失去了重要位置。"
 POD_investigate.desc.505102: "公元第一个千年结束前的某个时候，格拉崔克斯还是一名魔法师，年轻时在法国普瓦图被睿魔尔本人从火刑柱上救下后，被引入睿魔尔家族。他很快展现出才华、野心和决心，成为睿魔尔最亲密的盟友之一，但与睿魔尔的另一位学徒——一位名叫埃特里乌斯的瑞典人——产生了竞争关系。格拉崔克斯鄙视埃特里乌斯的自以为是和过度谨慎。\n\n成为世界上最强大的奇术师之一后，格拉崔克斯是主持将睿魔尔内部议会转向吸血鬼、创建塞奥里斯堡垒秘所以及催生石像鬼的幕后之人，所有这些都对睿魔尔$pod_clan$早期的生存至关重要。这位魔法师冷酷无情但富有魅力，在睿魔尔缺席期间，他与对手埃特里乌斯为控制$pod_clan$陷入冷战：格拉崔克斯主张大规模初拥剩余的睿魔尔凡人法师，而埃特里乌斯则建议采取更谨慎的策略。他最终在这场争斗中落败——睿魔尔短暂苏醒并将格拉崔克斯流放至法国。\n\n尽管心怀怨恨，他仍充分利用新职位，在鲁昂建立了一个强大的秘所，并构建了盟友网络。其中一些人包括王国的两位新权力之主萨莉安娜和若弗鲁瓦——在格拉崔克斯协助策划驱逐亚历山大的阴谋后，他们欠下了他的人情。\n\n其在原作中的未来命运\n格拉崔克斯在法国的影响力将持续增长，直到一次与圣殿骑士团合作的失败阴谋导致他被宣布为叛族者。成为魔宴的创始神父后，这位骄傲的睿魔尔成员将牺牲自己（或者，根据不同说法，被牺牲），以促成睿魔尔本人的回归。"
 POD_investigate.desc.505073: "埃丝克拉蒙德是一位真正的奥克人同时也是一名女贵族，无论是对抗摩尔人还是傲慢的法兰西人，她都为自己的祖国奋斗了一辈子，甚至是亡生之年。名义上是统治巴黎的爱之女王，这位公正统治者一直珍视自己的独立，并为此付出了沉重的代价。\n随着阿尔比派十字军在她的王国周围逼近，埃丝克拉蒙德已经被贪婪的北方人扔到了狼群中，但让他们感到惊讶的是，她再次在这个新的威胁中忍受并生存下来。即使周围的一切都在燃烧，“黑女王”也不准备放弃。\n\n其在原作中的未来命运\n埃丝克拉蒙德将奇迹般地捍卫她的国度，长达数十年地抵御十字军和北方人的侵袭。最后，是她好友贝娅特丽克丝的背叛，使她走向了灭亡。"
 POD_investigate.desc.790301: "《玫瑰传奇》的年轻作者已经在法兰西吸血鬼中掀起了风暴。许多妥芮朵人被他的风趣和对宫廷爱情的完美描述所迷惑，渴望得到$pod_Embrace$他的许可。令所有人惊讶的是，赢得“拍卖”的是一位她的美貌和魅力都很完美的外人。\n但该$pod_Embrace$对纪尧姆并不友好，他的精神被打碎了，他生动的想象力消失了，取而代之的是一种深不可测的绝望。被他的[Glossary('氏族','game_concept_Sire_desc')]所遗忘，这个坏掉的诗人的未来听起来确实很暗淡。\n\n其在原作中的未来命运\n有一晚，纪尧姆将改名换姓，站在$pod_cainite$的顶峰。只是他必须牺牲一切才能到达那里。"
 POD_investigate.desc.505081: "任性的伊思妲从来不让任何人妨碍她。在年轻的时候，她逃离了一场强迫性的婚姻，加入了另一个宫廷。一段时间后，她亲密地和一名老贵族搭上。她炽热的精神、无情的野心和迷人的美貌为她赢得了$pod_Embrace$。\n伊思妲像你所期望的那样迅速适应了吸血鬼的社会。她策划了她的姐妹美露莘和其他对手的流放或“失踪”，并登上了安茹的王位。在亚历山大流亡后，伊思妲抢夺法兰西的企图被挫败，对此她已经在计划对萨莉安娜进行血腥的报复。或其他没有被她牢牢控制的人。\n她性格中一个令人吃惊的怪癖（也是掩盖她冷酷无情一面的有效幌子）是她对建筑的热爱。她对彩色玻璃情有独钟，在沙特尔大教堂建成之初就为其提供了赞助。拥有雕塑、绘画和冶金技能的该隐之子更容易受到她的青睐。\n\n其在原作中的未来命运\n伊思妲将以她一贯的鲁莽态度驾驭法兰西的政治。因此，她最终加入了魔宴，在现代之夜推翻了秘盟对国家的控制。"
 POD_investigate.desc.505080: "萨莉安娜的继承人，海伦妮是一位风姿绰约的年轻女士，精通各种形式的艺术，也因此引起了母主的注意。然后，由于一场可能致命的热病，她在比原定年龄更小时提前被初拥了——这使得海伦妮保留了某种青年的豪爽和自信，却也让她的[Glossary('尊长','game_concept_Sire_desc')]相当满意。\n不过，这位年轻的香槟女王绝非愚钝之辈，她为其[Glossary('尊长','game_concept_Sire_desc')]提供了不少宝贵的建议，并精心维系着属于自己的情报网与盟友体系。与此同时，她仍乐于在宏伟厅堂中翩然起舞、聆听浪漫传奇。萨莉安娜似乎对这个心思多变的子嗣保护过度，但海伦娜的廷臣们可以证明她深谙自保之道。然而，她与其[Glossary('尊长','game_concept_Sire_desc')]的紧密联系，使她成为任何企图伤害母主之人的首要目标——而这样的潜在敌手，实在为数不少。"
 POD_investigate.desc.790315: "维罗妮克是个古怪的$pod_cainite$，传闻她对凡人过分热衷，甚至将他们视而平等。面对这些非议，这位布鲁赫只是耸耸肩，然后坚定致力于她所选择的道路。不过这种特立独行并未使她遭到排斥——早在参与推翻亚历山大的政变前，她担任茱莉亚·安塔西娅驻巴黎大使期间，就已展现出敏锐的政治嗅觉。\"维罗\"在这些事件中结识了不少新面孔：与阿纳托尔和佐伊萌发友谊，与艾默里克·德·卡巴雷陷入一段波折的恋情，同姆内纳赫有过令人惊愕的邂逅，还与格拉崔克斯惺惺相惜。\n不过在这个过程中维罗妮克也失去良多，尤其是让·巴蒂斯特·德蒙特龙的背叛——这几乎夺走了她所有珍视的随从。因此，她选择暂别巴黎政坛中，回到故乡奥尔良。但麻烦从未远离过维罗妮克这样的人。\n\n其在原作中的未来命运\n事实上，这位布鲁赫不会在奥尔良安静地度过她的亡生。历经几番命运波折，维罗妮克现在是澳门秘盟的亲王，在那里，她再次展现了其精妙的外交手腕。"
 POD_investigate.desc.790323: "阿纳托尔始终能听到上天的呼唤。当他被一位虔诚的[Glossary('尊长','game_concept_Sire_desc')]初拥时，听到天主的声音并向世界宣扬他的信仰对他来说就更容易了。在欧洲游荡时，该末卡维遇到了他的第一个终身朋友，阿拉贡的露西塔。这对奇怪的组合参加了苦难十字军及其后果，揭开了秘密、阴谋，并向世界宣扬了阿纳托尔的奇怪愿景。\n当他感到被一位年轻的孤儿稚子——雷伏诺的佐伊吸引时，两人终于分道扬镳。其带着她旅行，并一边教导着她，来到了法兰西，在那里，阿纳托尔在消灭被称为圣利斯的异端领袖中担任了重要的角色。现在，阿纳托尔和他的学生已经南下追捕剩余的异端，并互相学习了一段时间。\n\n其在原作中的未来命运\n安纳托尔永远不会停止流浪和交友，但他的信仰会逐渐减少，使他在晚年更像一位火焚末日的先知而不是一个圣人。他与露西塔的相伴和冒险将成为传奇。"
 POD_investigate.desc.505079: "这位唯一的正式“爱之王”因多种原因显得颇为古怪。许多人认为他肤浅且健忘，但他证明了所有人都看走了眼——其在亚历山大被流放之前，就精心操纵了亚历山大与埃斯克拉蒙德的公开冲突。从那时起，他的行为受到了更多的关注，特别是他与阿瓦隆南部残余势力的关系。无人确晓艾蒂安是这场宏大棋局中的兵或王。但当人们真正看清时，或许为时已晚。"
 POD_investigate.desc.505126: "德·鲁伊斯生活真正开始于科瓦东加，那一天，一支基督教军队首次击退了一支穆斯林军队。西尔维斯特此时是一名间谍，他发现了穆斯林所走的道路，并进行了大胆的举动，向他们提供服务，以确保他们无法逃脱终末。\n勒森魃静静地看着，是克莱俄布卢更快地$pod_Embrace$了这个现在这著名的游荡者。从那时起，西尔维斯特的升迁令人印象深刻，在不到500年的时间里成为夜之友最年轻的成员和伊比利亚地区的$pod_clan$领袖。他只需完成再征服，整个$pod_clan$就可能是他的。\n\n其在原作中的未来命运\n不幸的是，西尔维斯特找到了一个比他更优秀的千年圣战棋手，他自己的子嗣。1424年，蒙卡达发动政变，结束了德·鲁伊斯的美好生涯。"
 POD_investigate.desc.505125: "伊比利亚[Glossary('阿什拉派','game_concept_ashirra_desc')]最后的希望，拜德尔正在召集她的支持者，对入侵的基督徒进行最后的反击。但格拉纳达的苏丹已经用她的冷酷无情疏远了许多潜在的盟友，给其中许多人打上异端的罪名。\n更糟糕的是，她不得不用阴影的斗篷来掩饰自己的外表，她清楚，自己是一位女人的事实会打破她正在创造的脆弱共同目标。随着拜德尔越来越激进，越来越无情，很多人在这场战斗还没开始之前就离开了，让她的处境岌岌可危。也许拜德尔本身才是自己最糟糕的敌人。"
 POD_investigate.desc.505154: "蒙卡达一直是个矛盾的人。炽热的野心和彻底的无情与对神的真信混合在一起，形成了一种非常强大且被他很好地利用的潜力。蒙卡达首先是成为教廷的大主教，然后被勒森魃$pod_clan$的后起之秀初拥。\n尽管年纪轻轻，蒙卡达已开始超越他那显赫的[Glossary('尊长','game_concept_Sire_desc')]。他的影响从法国延伸到君士坦丁堡，许多人认为他才是“暗影收复运动”背后的真正掌权者。在他的异端对手纳尔塞斯倒台后，蒙卡达成为勒森魃基督徒无可争议的领袖，这一派系正迅速在$pod_clan$内部巩固权力。\n安布罗西奥决心为了神的荣耀去获得能掌握勒森魃$pod_clan$的终极权力，他将不惜一切代价来实现他神圣的目标。若非是某位独特的阿拉贡公主的眼神和灵魂……\n\n其在原作中的未来命运\n蒙卡达将实现他的野心，他为了神更大的荣耀，把勒森魃$pod_clan$合入魔宴并置于他的控制之下。没有什么事物能够阻止他，直到他那浪荡的女儿的背叛。"
 POD_investigate.desc.790178: "阿拉贡国王阿方索二世的女儿，露西塔从来就不适合做皇室成员。由于作为公主的角色，她受到种种限制，被交给一位名叫安布罗西奥·路易斯·蒙卡达的大主教照顾。这位勒森魃非常欣赏她的勇猛精神和不屈不挠的意志，很快就初拥了她。\n自那时起，露西塔就成了她$pod_clan$和[Glossary('尊长','game_concept_Sire_desc')]的重要资产，参与了苦难十字军及其后续，将威尼斯的阿丰佐带回到勒森魃内部，并组织参与对伊比利亚穆斯林的斗争。\n末卡维阿纳托尔，成为了她一生的挚友和重要的顾问，尽管他经常因为只有他自己才能理解的原因而分道扬镳。在君士坦丁堡与哈基姆圣裔刺客的短暂邂逅中，露西塔发现了一些其他的东西……她打算在某个时候去探索这些东西。\n阿拉贡的星光比以往任何时候都要耀眼，但在安布罗西奥的权威下，她又一次发愁了……\n\n其在原作中的未来命运\n露西塔将参与几乎所有$pod_cainite$世界历史上的重大事件，但她的信念和动力会出现动摇。为了寻求慰藉和救赎，她将背叛自己的[Glossary('尊长','game_concept_Sire_desc')]，却发现自己变得更像他。"
 POD_investigate.desc.505152: "埃列塞尔作为一个安静而沉着的骑士，花了一生来成为勒森魃。他对再征服运动不感兴趣，因为他能够欣赏摩尔人的文化和艺术，这使他树立了很多敌人，其中主要的是狂热的特乔·布拉沃。\n波朗科将托莱多作为基督徒和穆斯林之间的中立地来统治，这一事实使他被召到西西里岛的暗影之堡。他在这里看到的一切至今仍困扰着他，而这份困扰将在他的一生中挥之不去。\n\n其在原作中的未来命运\n埃列塞尔将加入魔宴，主要是为了推翻暗影之堡的恐怖。然后他将参加更多的魔宴十字军，并成为新一代勒森魃的教师和判官，其中包括阿拉贡的卢西塔。"
 POD_investigate.desc.505123: "第一批皈依伊斯兰教的阿刹迈之一，希勒尔的前途一片光明。作为一名强大而敬责的战士，在希勒尔的[$pod_clan$里具有影响力的派系当中，他自己甚至有资格成为下一任长者，鹰巢战士的主人。遗憾的是，阿刹迈的政治就像他们的兵刃一样致命，而希勒尔还没有准备好接受这一切。\n在失去了支持者之后，他以刚毅的沉着面对流亡，但却意志消沉。撤退到科尔多瓦后，由于希勒尔的战斗力和他抵御再征服运动的能力，他在被违背自身意愿的情况下被封为该城的亲王。希勒尔就算不尽忠职守，他也会保护科尔多瓦，但伊比利亚其他地区的命运，或者说世界的命运，都已经与他无关了。\n\n其在原作中的未来命运\n基督教徒对科尔多瓦展开的最后之围，将是希勒尔的最终决战。他将手握宝剑而亡，完成自己的使命。"
 POD_investigate.desc.791055: "约瑟夫斯是个狂信徒，但更糟的是，他似乎站在了“正义”一方。作为血侍，他发现了不少自己奇异信仰的古老经文，并将传播这些教义视为自己的神圣使命。而某种强大的存在，似乎也认同他的理念。\n约瑟夫斯几乎从内而外散发着信仰的光芒。种种奇迹不断在他身边发生，他的双手流着圣痕的血。很快，约瑟夫打算向罗马进军，将他信仰的荣光传到教宗宝座。\n\n其在原作中未来的命运\n在1240年左右，$pod_cainite$异端将对这一他们自身的异端发起攻击。约瑟夫斯将最后倒下，他的骨灰会被一阵强风卷走，风声宛如天国颂歌的悲鸣。"
 POD_investigate.desc.605104: "拉斐尔的一生就是在挫折和反弹中度过的。作为一个失败的牧师，他天生的魅力使他能够说服一些僧侣让他住在修道院里，他乐于制作微妙的色情艺术来取悦他的观众。这种轻松而轻快且离经叛道的生活让他感到满意，直到一位叫卡利斯蒂–卡斯蒂略的“本土异教女巫”对他产生了兴趣。\n拉斐尔本不想与强大的妥芮朵有任何瓜葛，但很快地卡利斯蒂就在违背他的意愿下初拥了他，来为她创造更多的艺术。不幸的是，他似乎并不是真正的艺术家，自己也没有什么天赋。拉斐尔的[Glossary('尊长','game_concept_Sire_desc')]因此陷入了愤怒，几乎当场杀了他，但柯拉蓉又一次成功地说服了对方，让他摆脱了麻烦。从此，他便开始处理那些他[Glossary('尊长','game_concept_Sire_desc')]渐远且相当大的影响力和权力。\n\n其在原作中的未来命运\n当拉斐尔被选为秘盟的妥芮朵领袖时，他将会上演$pod_cainite$政治中最大的骗局。这骗局还是在卡利斯蒂的庇护下而达成的……但显然，卡利斯蒂对这个计划一无所知。"
 POD_investigate.desc.790174: "塞维利亚苏丹是一个务实的女人。她生前是犹太人，死后改信伊斯兰教，以便更好地融入统治这座城市的[Glossary('阿什拉派','game_concept_ashirra_desc')]。这让她树敌颇多，犹太人对她的改教很反感，穆斯林则觉得她缺乏诚意。\n几乎是孤立无援的格鲁莎还没有犯关键性的错误，塞维利亚的王位还是她的。这说明她对政治有着敏锐的头脑，她的意图是利用拜德尔之役的战功来确保自己的地位，或者得到更好的。而如果一切都围绕着她而来，格鲁沙手里会有一张王牌，她也许可以用来发挥。\n\n其在原作中的未来命运\n格鲁莎将能够再坚持她的权力一段时间，甚至在巴力对其城市的阴谋中幸存下来。不过基督徒重新对塞维利亚的征服将使她被流放到格拉纳达，而她对人性的侮辱会让她很容易成为赛特之子操纵的猎物。"
 POD_investigate.desc.605113: "罗克也许是最有影响力的末卡维亲王之一，他是一个技巧娴熟（但做事很强迫性）的阴谋家和计划者。他保住自己封地的能力为他赢得了勒森魃$pod_clan$勉强的尊重，他在暗影再征服中扮演了自己的角色。\n最近，罗克正在应对大量迁入纳瓦拉的裁判官，其导致了他的子嗣的死亡。他对阴谋和阴谋的迷恋迫使他暗待，看他能否在摧毁敌人之前驾驭他们成为有用的东西。罗克的未来是不确定的，但如果他能控制住他的心魔，你可以在未来几个世纪里继续成为纳瓦拉的主要驱动力。"
 POD_investigate.desc.605134: "作为睿魔尔内部议会的成员，哈维尔至今都生活在他的伊比利亚人长辈——卡尔德隆的阴影之下。不过很少有人会怀疑他的素质，尤其是纯粹的应变能力和对阴谋的头脑，对尚在襁褓中的雏儿$pod_clan$来说是非常宝贵的。他所造成的不同影响也证明了他那敏锐的管理眼光和影响凡间政治的权谋之术。\n\n其在原作中的未来命运\n卡尔德隆死后，哈维尔将成为伊比利亚的议员，然后是南美的。就像其他人一样，他保护睿魔尔$pod_clan$在大陆上的利益，所以哈维尔将是非常令人印象深刻的。不幸的是，比这位睿魔尔更古老的势力将在二十一世纪初将他打倒。"
 POD_investigate.desc.605131: "扎姆拉的亡生诞生于一次对赌。她的[Glossary('尊长','game_concept_Sire_desc')]纳希尔认为他能在低贱的人群中找到一个比他的对手格拉齐亚诺在贵族阶层中更有前途的$pod_Embrace$候选。纳希尔的目光停在了扎姆拉身上，一位年轻的寡妇，以其凶猛的独立精神著称。\n纳希尔制服了这位寡妇，在违背她的意愿下初拥了她，但当他要求他的新子嗣吞噬自己的子嗣以证明她的忠诚时，双方撕破了脸。然后，扎姆拉花了很少的十四年时间，被赐誉为阿尔及尔亲王，并开始将她的影响力扩大到整个马格里布。纳希尔当然赢得了赌注，但他可能创造了一个政治怪物。\n\n其在原作中的未来命运\n在大反乱中，扎姆拉将不会站在任何一边，只会粉碎任何认为她软弱的人。她厌倦了不断的暗杀企图，随后将被骗入一个名为“遁世会”的教派，在那里她将获得一个更高的席位。但时间很快就证明了这份代价实在太大了，因为她渴望过去的自由。"
 POD_investigate.desc.605132: "索福尼巴出生在公元前八世纪之前的一个富有的腓尼基家庭。该家因丝绸贸易而闻名，而她成了一位古老吸血鬼的猎物，这个吸血鬼违背她的意愿初拥了她，以获得她家族的财富。但这个精明的女人很快就设法扭转局面，利用她的家庭来扳倒折磨她者。\n在布匿战争期间，索福尼巴与迦太基结盟，当罗马梵卓摧毁了她心爱的突尼斯和布鲁赫乌托邦时，她遭受了很多痛苦。她帮助了重建，突尼斯在她的带领下从磨难中走出来，比以前更加强大。索福尼斯巴是一个苛刻的统治者，众所周知，她对在她的城市里寻求迦太基的理想主义者布鲁赫没有耐心。他们曾经使突尼斯沦陷，在她担任苏丹期间不会再这样了。"
 POD_investigate.desc.790128: "玛阿特卡拉是是赛特之子$pod_clan$的圣显者之一，作为赛特之妾，拥有近乎是倾世无双的美貌。她拥有巨大的影响力，是她经常有分歧的兄弟姐妹中温和和团结的声音。在许多方面，她被看作是赛特在议会中的传声筒。她以神秘的方式行使这一巨大的荣誉。\n\n其在原作中的未来命运\n年长之倦已经追上了她，而她无精打采的身体会被更忠实的$pod_clan$成员紧密守护。"
 POD_investigate.desc.790569: "作为一名小有名气的梵卓，曼陀罗至今依旧无法出人头地。她更为人所知的点是她的娇气和复仇精神，如果曼陀罗想要她的事迹被历史记住，需要一个出人意料的转折。\n\n其在原作中的未来命运\n曼陀罗将设法宣称并掌控韦拉克鲁斯的亲王领，但使她闻名的是$pod_Embrace$了她二十世纪更有影响力的梵卓之一，奥拉夫·霍尔特（也被称为洛丁）。她与妥芮朵伊莱特丽雅失败的爱情故事将引发与她的孩子们的许多冲突，直到最终完全打破他们的三人团队。在洛丁逃跑和伊莱特丽雅退出整个局势后，曼陀罗将在一个对她来说过大的亲王领里孤独终老。"
 POD_investigate.desc.505094: "据说纳赫特尔赫布与赛特本人同属一个部落，他是赛特的第一个子嗣（虽然有些传言对此说法进行了辩论）。因此，自赛特失踪后，他一直是$pod_clan$的领导机构——圣显者的首领。\n纳赫特尔赫布是一个独断专行和持着传统主义的统治者，他鄙视非埃及人，一想到要听从其他圣显者的命令就牢骚满腹。不过，他还是赛特在埃及的摄政者，他的命令就是法律。\n\n其在原作中的未来命运\n纳赫特尔赫布将在现代之夜来临前陷入$pod_torpor$。有传言说他在乌干达的维多利亚湖附近出现。"
 POD_investigate.desc.790126: "势力仅次于纳赫特尔赫布的塞特普奈拉是庭尼斯的领主，也是赛特$pod_clan$内部议会的圣显者之一。他曾经是赛特本人曾属的部落中的一名术士。比他的近亲，赛特彭雷在宽容外来者这点上更为鼎鼎大名，他甚至还与雏儿$pod_clan$睿魔尔结成联盟。\n\n其在原作中的未来命运\n塞特普奈拉将会在终末之夜前一直处于$pod_torpor$状态。"
 POD_investigate.desc.710202: "公元130年，哈德良皇帝年轻时的情人为成就神性而自溺于尼罗河中，已死于非命。当时这人被称为安提诺乌斯，不过他并没有真正地死去，而是被一位强大的老梵卓所救下然后初拥，并教会了他政治和国术的内涵。\n安提诺乌斯很好地接受了老梵卓的指导，很快就为自己征服了开罗，促使他的[Glossary('尊长','game_concept_Sire_desc')]在这次成功后离开了他。从那时起，这位男孩国王巩固了他的统治，在赛特之子、[Glossary('阿什拉派','game_concept_ashirra_desc')]和阿萨迈之间小心翼翼地打交道，他们都对他统治下的名城虎视眈眈。\n\n其在原作中的未来命运\n在被一位名叫穆赫塔尔·贝伊的劣族迷住后，安提诺乌斯让的权力缰绳从他手中溜走了。在1406年，他在狼人（或赛特之子，取决于你问谁）的袭击下杀死。"
 POD_investigate.desc.790514: "阿蒙霍特普四世的女儿被赛特信徒绑架和[Glossary('初拥','game_concept_Embrace_desc')]，这大概是对她放弃埃及多神教而选择太阳一神教的报复。令人惊讶的是，对于一个如此年轻的人来说，内弗鲁为赛特提供了熟练、虔诚和智慧的服务。她是火之庭的领导人，一个充满奇异和禁忌的危险场所，在这里收集了过去各朝代的知识。但没有什么是免费的，很少有人能带着他们的人性离开这个地方。\n与卡西那的梦之庭相比，内弗鲁领导的宫廷有着在赛特之子信仰的核心信条方面的强烈正统性，在很多方面都是赛特之子知识中心的典范。\n\n其在原作中的未来命运\n内弗鲁至今仍领导着火之庭，她的信仰与以往一样不受束缚。有些人甚至低声说，她已经接近复活赛特本人了……"
 POD_investigate.desc.710502: "据说拉撒路在一座科普特修道院遇到了安琪莉柯，她是一场可怕的瘟疫的唯一幸存者。他将$pod_Embrace$赐予她，认为她通过眼看着自己的兄弟们枯萎和死亡的经历让其与死亡有了很大的亲和。\n事实证明，她是一个有价值的、忠诚的子嗣，她向她心爱的[Glossary('尊长','game_concept_Sire_desc')]学习，在讨厌的马库斯·穆萨·乔凡尼出手后，保护他的沉眠。她现在是他的守护者，愿意等到终末来看到他安全无恙，直到他回到她身边。\n\n其在原作中的未来命运\n安琪莉柯将实现她的愿望，拉撒路的苏醒将如她所预料的那样辉煌灿烂。她将在他的新组织中拥有一个任选的位置。"
 POD_investigate.desc.790194: "拉美苏是吒婆多修罗的子嗣之一，他很快就厌倦了他的$pod_clan$与印度的东方侵略者之间的永恒之战。因此，他选择在埃及定居，并得到当时正在进行的赛特之子和$glossary_osirian_league$之间战争的帮助。\n拉美苏征服了分心的赛特的子嗣们所拥有的大部分领土，建立了自己的迦提（种姓），名为亚历山得利特。从那时起，赛特之子重新集结并进行反击，但强大的玛土撒拉和他的子嗣仍然是对他们边境的主要威胁。\n\n其在原作中的未来命运\n拉美苏在文艺复兴时期将陷入$pod_torpor$。这一事件，加上他的子嗣们的一些非常糟糕的站队，会导致他的种姓几乎灭绝。"
 POD_investigate.desc.791153: "白珍珠女王是一位离经叛道并任凭自身决定来管理的统治者。这位虔诚的琐罗亚斯德教徒，通过运气和对手的失误，夺取了对摩加迪沙的控制权，并以谨慎的眼光看待不断涌入该城的伊斯兰教移民潮。\n鹰巢不会盯着她，既是对她能力的信任，也是因距离遥远而做出的务实选择。因此，如果她失败了，所有的责任都将落在她身上。但到目前为止，法尔娜扎已经很熟练地走好了这根紧绷的绳索，利用穆斯林对付非洲土著，充分利用了对手之间的矛盾。鹰巢如此信任她也许是对的。但这种巨大的自由让她感到漂泊，在她也许就不该在的地方寻找安慰……"
 POD_investigate.desc.791232: "关于这位以高卢战争女神命名的人，人们知道的神话多于事实。波乌狄纳生活在第二城，是一位具有无与伦比的精神的美丽女人。她同时受到布鲁赫和特洛伊尔的喜爱，但却偏爱前者，这一事实使她在特洛伊尔的背叛后陷入困境。她在布鲁赫被谋杀前被$pod_Embrace$，也许是布鲁赫本人或他的一个亲信。\n她逃过了清洗，并从那时起与不守规矩的$pod_clan$作斗争，对他们随心所欲地$pod_Embrace$感到愤怒，在她看来这是一种犯罪。在高卢定居后，她被尊为女神，参与了加洛林文艺复兴，在这个过程中挫败了亚历山大的许多计划。正是在那段时间里，她遇到了查理大帝的一位将军——赫门诺德，并违背了她永不$pod_Embrace$的承诺。虽然她并不后悔，她的子嗣已经不剩下什么完美的荣誉和忠诚，但这种对自己准则的违背让她迷失。她选择暂时离开法兰西，开始寻找远在撒哈拉沙漠之外的布鲁赫的失落知识，希望能拯救$pod_cainite$种族和她自己。"
 POD_investigate.desc.790348: "胡克罗斯于1200年前在非洲为莉莉丝之道贡献了发展。当他在探索废墟和收集吸血鬼传说的宝物时，遇到了一个知道血族秘密的凡人密教，并得知他们守护着古老的著作合集也就是莉莉丝之环。\n胡克罗斯和他的爪牙试图偷走这些著作，但被密教的恶魔击败。他设法逃了出来，并将自己的经历告诉了其他血族。很快，好奇的吸血鬼加入了他的行列，并在其他地方寻找这些著作。\n\n其在原作中的未来命运\n胡克罗斯对知识和文物的疯狂搜寻将对莉莉丝派的教义产生深远的影响，尤其是在塔尔玛埃拉重新挖掘出他的发现时。"
 POD_investigate.desc.790619: "传说最长者把登梅赫的身体内外翻转，眼睛陷入脑袋往里看。当最长者问他的怎么看时，他的回答说，这没什么特别的，因为所有聪明人都能看到自己的内心。最长者感到钦佩，给了非洲人一个$pod_Embrace$，两人分道扬镳。\n登梅赫冒险进入原始丛林，那里有一天会成为撒哈拉沙漠，并在他周围聚集了各种部落，这些部落将他视为睿智的萨满，统称其为阿哈加尔。他用血肉塑造了各种野兽来对抗居住在沼泽地里的爬行动物，为自己和他的子嗣开辟了一个国度，用铁腕统治了丛林。\n\n其在原作中的未来命运\n登梅赫陷入了$pod_torpor$，被忠诚的血仆和子嗣们小心翼翼地隐藏起来。直到他的子嗣西考拉克斯和她的后裔被约鲁巴的术者们置于严重的危险之中时，他才重新苏醒，但即使是他也无法在这场冲突中扭转局势，最终在维多利亚湖以西的一个隐秘山谷中陷入$pod_torpor$。"
 POD_investigate.desc.505070: "蒙塔诺以昂泰的名字出生在东非，他是勒森魃的第一位子嗣，在他[Glossary('尊长','game_concept_Sire_desc')]的残酷关注下幸存下来。在很多方面上，他都是一名典范的子嗣，并在确保勒森魃$pod_clan$作为罗马帝国第一黑夜势力的地位上起到了重要作用。\n他的[Glossary('尊长','game_concept_Sire_desc')]还创造出了更多的后嗣，但蒙塔诺依然一直是其中最强大、最受喜爱的。因此，当勒森魃决定需要一个安全的地方休息而暂时卸任的时候，自然是由蒙塔诺负责领导$pod_clan$。他上任至今，成绩喜忧参半，$pod_clan$之间的宗教分歧比以往任何时候都要大，同时梵卓在政治上较劲地领先优势。这位老战士需要抬高警惕，因为新血正在呼吁彻底改变政策。\n\n其在原作中的未来命运\n蒙塔诺将忍受大反乱并取得一定的成功，直至他血之兄弟格拉齐亚诺的背叛。因此，蒙塔诺失去了这个变得非常陌生的$pod_clan$的所有权力和信用，随后他成为了叛族者之首，并等待着复仇之夜。而此夜终于在二十一世纪初到来。"
 POD_investigate.desc.505018: "乔凡尼家族的族长是位长久不衰的意大利的，以及在这之前罗马的，亡灵术师世系的继承人。作为训练有素的商人，“乔凡努斯”一直很有影响力，但奥古斯都的好运将其推到了一个全新的等级。\n卡帕多修斯本人正寻找亡灵术师专家来帮助推进他的大计划——[Glossary('吸榨','game_concept_diablerie_desc')]天主，而威尼斯家族被选中承担这一任务。尽管几乎所有人都在劝说，[Glossary('上古耆宿','game_concept_antediluvian_desc')]还是选择了$pod_Embrace$奥古斯都，给了这只老狐狸想要的一切。有了不死之身、一个被提升为亡灵密教的家族、一个愚蠢的[Glossary('尊长','game_concept_Sire_desc')]和一个容易操纵的$pod_clan$供他支配，乔凡尼的野心将无可限量。\n其在原作中的命运\n他将走得很远。在策划以撒阴谋的过程中，奥古斯都将[Glossary('吸榨','game_concept_diablerie_desc')]自己的[Glossary('尊长','game_concept_Sire_desc')]，并发动对卡帕多西亚的清洗，确保他的新$pod_clan$成为他们的“替代者”。他赢得这场伟大棋局的总计划是拆掉保护冥界的尸幕，而他也“那么”接近于实现这一目标……直到逃过清洗的残余分子回来复仇。"
 POD_investigate.desc.790179: "除了“世上最美丽的女人”，荷马把故事的大部分都搞错了。海伦是一位迈锡尼公主，被嫁给了克里特的脾气暴躁的老国王米诺斯。尽管她的情人特洛伊的帕里斯做出了种种努力，海伦还是只靠自己才成功地从俘获她的人手中挣脱了出来，但这没发生在国王初拥她之前。\n海伦和她的情人在迦太基建立了关系，她卷入了布匿战争，很快发现对罗马梵卓的抵抗是徒劳的。为了达成协议，她背叛了她的第二故乡。她几乎不知道，这一行为将困扰她数千年，因为迦太基乌托邦的骄傲信徒——墨涅拉俄斯得知了此事，将摧毁这个叛徒作为自己永久的目标。从那时起，她们间的战斗就成了传奇。他们摧毁了庞贝古城，在一场位于西班牙的通宵战斗中几乎成功同归于尽，跨越整个埃及的战斗也毫无结果。看不到结束的迹象。\n\n其在原作中的未来命运\n战斗还将继续，当美洲被发现时，它将在新大陆上延续。他们将决定更多的人的命运，直到他们在芝加哥陷入$pod_torpor$状态。在20世纪末，他们都苏醒了，并很快重启了战斗，直到一个更大的事件引起了他们的注意。"
 POD_investigate.desc.790309: "墨涅拉俄斯，斯巴达的学者国王，经过几个星期的深谈，得到了特洛伊尔的初拥。他好奇的天性，和敏锐的哲学洞察力，使他完美适配于特洛伊尔的乌托邦——迦太基。\n那里，他完善了自己的教化心路，而且，还遇到了那个叫海伦的女人。在布匿战争期间，墨涅拉俄斯是迦太基最著名的外交官，他动员了所有能动员的人去拯救他心爱的城市。但依然杯水车薪，乌托邦沦陷了，他将这一事实归咎于海伦，因为在最后一战之前，妥芮朵将迦太基出卖给了罗马梵卓。从那时起，他们之间的战斗就成了传说。摧毁了庞贝城，在西班牙的一场夜战中几乎杀死对方，战过整个埃及毫无成果。完全没有结束的迹象。\n\n其在原作中的未来命运\n战斗将继续，在美洲被发现时，于新大陆上肆虐。他们将塑造更多的人的命运，直到双方都在芝加哥进入$pod_torpor$。他们在20世纪末苏醒过来，继续他们的战斗，直到一个更大的事件引起他们的注意。"
 POD_investigate.desc.790203: "法布里奇奥.乌尔菲拉从古罗马基督教的第一个夜晚开始就一直存在。生前，乌尔菲拉是尼科美底亚主教尤西比乌斯的弟子，而且他和他的老师一样，都曾是阿里乌异端的捍卫者。死后，他成为了教廷派，也就是认为权力该由教廷掌控的梵卓派别中最有影响力的成员之一。\n尽管几个世纪以来，教廷一直是$pod_cainite$密谋的战场，但法布里奇奥依旧从这些阴谋中幸存了下来，且仍然坚定不移地忠于梵卓的尊严原则。当然他也有犯过错误，那就是带头煽动教廷对抗朗格多克的异端分子。法布里奇奥曾希望这能给巴黎的妥芮朵一个无法恢复的打击。然而他所推动的阿尔比派十字军东征却激发了猎巫人的热情。他的长期目标是尽可能地扩大他在圣座和意大利的影响。\n\n其在原作中的未来命运\n法布里奇奥所犯的“小错误”将给血族带来灾难性的后果。朗格多克的猎巫人成为了暗影裁判所和未来的利奥波德协会的核心。他们将以惊人的成功率猎杀吸血鬼。不过，法布里奇奥基本上不会受到影响，直至如今的夜晚他仍然潜伏在教廷的阴影中。"
 POD_investigate.desc.505144: "格拉齐亚诺出生于意大利的贵族世家，维罗纳家族。他已经知道了关于掌握权力的所有优势，这在吸血鬼的政治很有用。他在意大利各城邦与神圣罗马帝国皇帝之间的艰难交易中发挥作用，但当他看到皇帝宫廷的耀眼光辉时，很快就选择了背叛他的意大利同胞们。这种为了贪婪和野心的卑劣背叛引起了勒森魃[Glossary('上古耆宿','game_concept_antediluvian_desc')]的注意，他们在操纵格拉齐亚诺接受$pod_Embrace$之前策划了他的堕落。\n作为$pod_clan$主人的宠儿。格拉齐亚诺对深渊秘术的常规使用感到欣喜，而且他希望自己立即得到尊重，他讨厌那种吸血鬼需要几个世纪才能获得高地位的想法。他开始嫉妒在勒森魃宫廷中他那因为军事上的胜利而很受欢迎的血之兄弟蒙塔诺。\n\n其在原作中的未来命运\n格拉齐亚诺将是大反乱的主要导火索。在对尊长所在的暗影之堡发动攻击和帮助正新兴的魔宴之后，他将获得巨大的名声和尊重。但格拉齐亚诺将迅速挥霍掉这些政治资本，开始了偏远而安静的大部分亡生。有人说这是为了不引起他那还没死透的尊长的注意——"
 POD_investigate.desc.790202: "阿里斯托福克勒斯在莉薇娅担任他的财产管理几十年后初拥了她。几个世纪以来，她一直是他的特使，保护罗马在意大利的利益。当伦巴第人在752年攻占拉文纳时，阿里斯托福克勒斯身受重伤，允许莉薇娅以仪式[Glossary('吸榨','game_concept_diablerie_desc')]他，以继续他的工作。她慢慢地渗透到她尊长的旧圈子里，她认为这些人应对他的死亡负责，她逐渐把他们赶出了拉文纳，直到她成为这个城市的实际领导人。\n以永恒元老院的名义，莉薇娅依然坚持着罗马帝国后期的理念，希望将意大利北部打造成一个可以与冒牌者争相抗衡的国家，展示出真正理想中的罗马。她已经开始与法兰克福的茱莉亚·安塔西娅对话，希望通过这个内部盟友，她可能会削弱德意志的篡位者，并将拉文纳化为一个真正的罗马城邦。"
 POD_investigate.desc.505099: "威尼斯亲王和挪得大主教纳尔塞斯，以吉列尔莫作为外交家和谈判家的明显才能为由，初拥了他。吉列尔莫有能力让任何人——甚至是他的对手——感到放心。因此，他成为了威尼斯亲王的“公众形象”。\n在第四次十字军东征之后，他开始怀疑纳尔塞斯对异端的奉献并不真诚。他就此与斯雷代茨的尼基塔结盟，召开了血之法庭，并被赋予了[Glossary('吸榨','game_concept_diablerie_desc')]他[Glossary('尊长','game_concept_Sire_desc')]的权利。此后，他顺利地接过了纳尔塞斯留下的权力，并以开发残败的拜占庭帝国的新威尼斯领土作为首要考虑。不幸的是，这让他对更近的威胁视而不见，因为正在崛起的暗影裁判所和乔凡尼家族都贪婪地盯着威尼斯吸血鬼那弱小的权力结构。"
 POD_investigate.desc.790201: "阿科尼亚·梅莎莉娜，那位在充满热情的同时又思维敏锐的女士，是古罗马原罪之道的创立者塔尼特巴尔·萨哈尔的弟子，她的故事起始于她与上级的一次冲突。在得知阿科尼亚加入了原罪之道后，她曾经的上级勃然大怒，在无尽的争执中，意识到自己无法平息这件事的阿科尼亚，最终离开了罗马。她以自己亲王的身份统治了安科纳，创作了那些足以奠基欢愉之路的诗歌。\n她选择了当地一处维纳斯神殿作为自己的居所，并开创了欢愉祭司的宗族。在她入了$pod_torpor$后，她的躯体也理所应当的被保留在了安科纳的维纳斯神殿的密室中。即使是在教宗统治意大利的时代里，在长夜之中，阿科尼亚·梅莎莉娜的子孙与信徒也一直追随着她的传承。"
 POD_investigate.desc.505085: "作为生活中的军事领袖，纪尧姆坚持对其领地内所有血族进行基本的战斗训练。他对进入勃艮第的入侵者十分警惕，那些被认为是潜在的麻烦制造者的人将被立即驱逐出境。暴力是被禁止的，任何违反这一规则的人都将面临驱逐。\n尽管如此，纪尧姆依然被认为是位和蔼可亲的统治者，在他的领地内，很少有人敢于挑战他庞大的朋友和同盟网。\n\n其在原作中的未来命运\n纪尧姆的钻研将在击退达克·赛琳娜及其亲信率领的袭击时派上用场。这次胜利后，他将逐渐从内政中消失，将更多的精力放在参与遁世会，以及对[golconda|E]的追求上。"
 POD_investigate.desc.505121: "马可纽斯是被称为吉雅希德的奇怪血系的始祖（自称），流有妖精血的血族，他的真正起源是一个神秘的故事，有许多不同的说法。吉雅希德自己声称，在$pod_Embrace$之前，马可纽斯是一位凡人法师，擅长炼金术，并与他的姐妹赫罗特苏塔一起办事，想创造出一个完美的存在。赫罗特苏塔涉足了深渊秘术，而马可纽斯则进入深渊本身并吞噬了他的姐妹，在此其中转变了自己。\n他迅速而果断地接管了斯特拉斯堡，与当地的妖精结盟，粉碎了梵卓的当权，从那时起他们就一直保持着这种世仇。尽管取得了这场胜利，但吉雅希德的处境却很不稳定，他的母氏族对他的实验感兴趣，而他的敌人也在向斯特拉斯堡靠近。\n\n其在原作中的未来命运\n马可纽斯的失足将是残酷的，几个世纪以来，他唯一的领地就是在暗影之堡的牢房里。在大反乱期间，他终于从囚禁中获释，重新征服了斯特拉斯堡，但长期的禁闭使他的理智受到了伤害。"
 POD_investigate.desc.505141: "卢修斯·埃利乌斯·塞扬努斯于公元前20年出生在西班牙。卢修斯为罗马征服者们提供了良好的服务，并加入了他们的军团作战。他很快就引起了新皇帝提比略的注意，他在这位年轻的伊比利亚战士身上看到了一种奇特的力量，以及对政治和阴谋的非凡头脑。提比略决定把卢修斯安排在罗马作为他的代表，而自己则在卡普里岛上过着奢华的日子。\n以提比略的名义，卢修斯建立起了一个秘密近卫军的组织，并通过恐怖手段控制着新帝国。塞扬努斯下令处决了数千人，随着时间的推移，他在执政方面掌控了越来越多主动权。最后，提比略感觉到他的伊比利亚副官对自身地位构成了威胁。\n提比略命令他的军团进入罗马，卢修斯对之发起了起义。当镇压反叛的军团到达时，他们遭遇了近卫军。但事实证明，罗马的近卫兵并不是久经战阵的军团士兵的对手。提比略的下属在帕拉丁山上找到了卢修斯·塞亚努斯，虽然卢修斯用最强角斗士的激情来战斗，但他们还是成功地把他斩杀。这位有机会成为皇帝的人最后被神秘的西比尔所救，不久就被留在$pod_cainite$政治世界里孤军奋战。到目前为止，他已经证明了自己对此相当熟练。\n\n其在原作中的未来命运\n卢修斯的故事才刚刚开始。在经历了无数次的战斗、失败的恋情和背叛之后，他将在一个连国王都不曾存在的地方，取得他应有的皇帝地位。"
 POD_investigate.desc.505083: "瑞吉斯生前是圣维克多修道院的僧侣，在一次与修道院长的旅行中被初拥。他逃离了自己的[Glossary('尊长','game_concept_Sire_desc')]，试图通过忏悔和朝圣来寻找救赎。然后，他去了罗马和耶路撒冷，伴游旅行的十字军，但依然没能找到慰藉。\n当他回到马赛时，他发现他的老修道院正受到当地吸血鬼亲王的腐化影响，于是决定采取行动来反对这种情况。随后他与苦烬骑士团结盟，共同打败了当时执政的亲王。瑞吉斯现在难与在信仰与自己身为新的亲王而不得不采取令人厌恶行为的职责之间作出调和。\n\n其在原作中的未来命运\n瑞吉斯的堕落将是骇人的。随着他信仰的减弱，以及在锡巴里斯的雷伏诺和狂徒的影响下，这位曾经虔诚的人将会对无辜的人们做出不可告人的行为。暗影裁判所将设法阻止他，但对于许多受害者来说实在太晚了。"
 POD_investigate.desc.790163: "最初，达克·赛琳娜是安东尼·勒·法努的盟友，一同努力压制一神教，在罗马崩溃的同时保护原始宗教传统。然而，两人互相鄙视，他们的合作没有成效，为此她指责勒·法努。\n由于嫉妒勒·法努更高的世代和血能，赛琳娜对她的[Glossary('尊长','game_concept_Sire_desc')]犯下了$pod_diablerie$来与他比肩，勒·法努认为这预示着他曾经的盟友只要有可能就会背叛他。赛琳娜参与了相信吸血鬼应该公开统治血畜的血族圈子，随着裁判所的力量增长，她越来越成为一个怪人和威胁。\n其在原作中的未来命运\n在荆棘大会之后，赛琳娜全心全意地致力于魔宴的功业。在18世纪针对瑞士亲王纪尧姆的政变失败后，通过她的子嗣罗曼·潘德拉贡，赛琳娜开始利用她不忠实的后代作为影响世界的手段。同时她躺在接近她与纪尧姆最后一战的某处进行$pod_torpor$。"
 POD_investigate.desc.505050: "哈德施塔特的具体出生地不详，不过是在现代巴伐利亚州的某个地方。他是$pod_clan$的重要成员，这是一个令人惊讶的事实，因为他的世系不来历不明。但所有人都得一致同意，他成功地将梵卓$pod_clan$的重心从罗马移到了德意志。\n考虑到哈德施塔特是这场豪华对局中的后来者，他的成就更为令人震惊。毕竟他年长得多的对手正在以惊人的速度失去政治信用，比如如亚历山大被流放到了法兰西，而密特拉的影响仍被限制在英格兰。他现在正带头发动两场攻势，一是在北边对抗溃散的[Glossary('英灵战士','game_concept_einherjar_desc')]，二是在东边帮助他新的睿魔尔同盟对抗冈格罗和棘秘魑。目前来看，这两场攻势都很有希望，这也要归功于他天赋异禀的子嗣，约根·冯·费尔登。\n随着神圣罗马帝国和黑十字的势力不断壮大，似乎应该很少有事件能够阻止哈德施塔特的崛起。\n\n其在原作中的未来命运\n事实上，这位德意志人将建立世界范围的血族组织，也就是秘盟来确保他作为现代最伟大的梵卓地位。不幸的是，即使是最强大$pod_clan$的非正式领袖，也将被证明其本身并不是真正的不死不灭，因为哈德施塔特将在15世纪被叛党的泰勒杀死。不过他传人的成就将远远超过他。"
 POD_investigate.desc.505096: "茱莉亚于公元前5世纪出生在罗马一个富裕的家庭。她同情平民的事业，为他们说话，甚至与一位平民相爱。人们猜测，她的政治敏锐性、修辞技巧、责任感、魅力、坚强的意志、常识和同情心是她受到她尊长关注的有效原因。\n当茱莉亚在罗马的永恒元老院为大家谋福的时候，公元前264年与迦太基的战争开始了，这一事件深刻地影响了这位理想主义的罗马人。在长达一个世纪的冲突中，茱莉亚看着她心爱的元老院陷入疯狂，因为罗马的无敌增长意味着领先者将能先抓住财富和权力。梵卓人人平等的梦想破灭了，茱莉亚也因此背弃了罗马，消失了几个世纪。\n当她最后的希望——一位名叫安吉瓦的诺斯费拉图长者在法兰克福北部的一座城堡里见到她时，她的旅程结束了。虽然他并不拥有她所寻求的信息，但两人形成了一个互利的契约。在她的管理下，那些希望实现她关于永恒元老院重生的愿景的雄心勃勃的年轻梵卓涌向法兰克福。茱莉亚的支持者们为了纪念她而自称安塔西亚派，拥护梵卓之间的平等，反对中世纪的、无情的黑十字，并视她为他们的保护者和向导。"
 POD_investigate.desc.505086: "约根的$pod_Embrace$是不寻常的，因为这位才华横溢、干劲十足的骑士能够在宣扬王权的哈德施塔特和宣扬神权的戈宗之间二选一。这位野心大于狂热的骑士选择了前者，他很快就在哈德施塔特的新职位上表现出色，成为哈德施塔特的得力助手。他的第一项工作是在凡人的剑士团中建立了个暗影骑士团，名为黑十字骑士团，一个由约根的忠实家臣卢克丽霞·冯·哈茨领导的$pod_cainites$和血仆组成的骑士团。\n在很短的时间内，约根已经取得了伟大的功绩，如夺取马格德堡，在几场激战中击败了棘秘魑的弗拉基米尔·罗斯托维奇，揭开了睿魔尔的阴谋，并在德意志猎杀了各种狂徒团伙。\n他的新目标是一个棘手的麻烦，在照顾不速之客——法兰西的亚历山大的同时，他必须粉碎立陶宛原始教徒势力的喀喇。\n\n其在原作中的未来命运\n约根将获得成功，对于他的尊长来说，过于成功了。1271年，哈德施塔特将召回他的放荡子嗣进行审判。约根收到的惩罚将远比死亡更严重。"
 POD_investigate.desc.790154: "阿明在原来的生活中是一名学徒，直到他被一位无情的[Glossary('尊长','game_concept_Sire_desc')]初拥，并给了他一个自杀性任务：那就是烧掉马格德堡亲王约根阁下的仓库。不出所料，布伦纳被抓住了，并被关押起来审问。然后阿明被一群误以为他是自由斗士的任性狂徒救出，阿明迅速利用这种情况为自己谋取利益，开始带领这群无知的帮派。\n现在，阿明指挥着他那被称为无声之怒的狂徒帮派，来对付马格德堡的$pod_cainite$，并挑选约根·冯·费尔登作为主要的缠扰目标。布伦纳那激进的思想在狂徒这圈子当中很有名，比如彻底拉下所有统治者状态并是一切变成无政府状态。这位充满了愤怒和仇恨又自诩为弑王者的人，在实现他的目标之前，他还有很长的路要走。\n\n其在原作中的未来命运\n阿明走得不远。1235年，他的帮派将被摧毁，然后再次被约根关押在监狱里。这一次，他并没有逃脱。"
 POD_investigate.desc.505110: "埃里克·艾格曼的子嗣，伊尔丝是著名的狡猾和渐进的统治者，随着裁判所的威胁在血族周围增长，她开创了一个早期版本的[the_masquerade|E]。\n伊尔丝有时被她的对手，甚至是子嗣视作是软弱的，原因在于尽管伊尔丝与哈德施塔特的领地之间存在争议，她至今依旧拒绝于对方发生表面冲突。\n\n其在原作中的未来命运\n伊尔丝将作为古斯塔夫·布賴滕施泰因的[Glossary('尊长','game_concept_Sire_desc')]而被人们所熟知，古斯塔夫·布賴滕施泰因是血族历史上最残忍的疯子之一。在他被$pod_Embrace$之后不久，伊尔丝就会倒在他的獠牙下，缩短了她那具有前途的领导地位。"
 POD_investigate.desc.505089: "约瑟夫在布拉格的犹太区出生和长大。作为一名拉比的儿子，他希望能继承父亲的事业。犹太人所遭遇的暴力并不少见，约瑟夫遭受的痛苦最为残酷，有一天晚上，一帮基督教男孩把他的半颗脑袋砸碎，鼻子摔断，下巴脱臼。如果不是因为他被诺斯费拉图的耶胡达$pod_Embrace$，他早就死了。这位$pod_cainite$问仍然在死亡边缘的约瑟夫想不想复仇，而约瑟夫的回答是不。随即耶胡达问约瑟夫是否会保护其他人免受这种残暴行为的伤害，于是他惟有握住这位诺斯费拉图的手作为回应。\n约瑟夫为争夺犹太区的领地而与鲁道夫·布兰德尔亲王不断进行权力斗争，最终导致最后通牒。已经成为诺斯费拉图的约瑟夫坚守阵地，当他逃进布拉格城堡下的地下墓穴，也就是布兰德尔的藏身处时，他的计划就开始实施了。约瑟夫一直等到天亮，并在白天的掩护下从地道里爬出来，趁亲王沉睡的时候杀了他。\n在随后的权力真空中，约瑟夫获得足够的盟友，为自己确保布拉格的安全。\n\n其在原作中的未来命运\n约瑟夫的统治确保了布拉格在接下来的740年里一直是欧洲犹太人的安全避难所，直到他在领导当地抵抗纳粹政权的时候，倒在了纳粹的火焰喷射器下。"
 POD_investigate.desc.505148: "诺伯特是个苦命人，在约根拒绝了戈宗的不死之身的提议后，他便作为“第二选择”被其[Glossary('尊长','game_concept_Sire_desc')]初拥了。自此，两位统治者之间的激烈竞争就开始了。\n冯·克桑滕曾经怀有夺取马格德堡的欲望，生前就曾是马格德堡的大主教。当他加入不死族的行列时，布鲁赫的塞德里克还是马格德堡的亲王，约根则是他偶尔的顾问。\n在一场大火夺走塞德里克后，诺伯特和约根都曾是堡主之位的竞争者，但在哈德施塔特的支持下，约根轻松获得了胜利。最终，诺伯特夺取了布伦瑞克亲王领，仍然是马格德堡统治者的眼中钉。"
 POD_investigate.desc.790151: "卢克丽霞曾经是追随第一次十字军东征的虔诚基督徒，她珍视秩序、权威和纪律。因此，她狂热地侍奉着她的[Glossary('尊长','game_concept_Sire_desc')]，后来又把这份忠诚转向他的领主约根。卢克丽霞迷恋于骑士精神信条，坚信荣誉和责任，宁死也不愿意让她的领主受辱。\n约根对她进行了武器技艺的训练，使她最终成为了梵卓控制下的条顿骑士团内秘密修士会的女大团长。她已经成为约根最有影响力的家臣，必要时直接在马格德堡为他服务，并担任他的元帅。迄今为止，她伴随着约根参与了所有战争。\n\n其在原作中的未来命运\n哈德施塔特暗杀了她的君主，卢克丽霞不会好受。由于对这种懦弱的行为感到不满，卢克丽霞将加入大反乱，后来她又加入了梵卓叛族者。"
 POD_investigate.desc.790946: "生育女神、战争领袖，和斯拉夫部落沃雷的萨满，莎格拉将部落带到西部，使他们摆脱了更大氏族的奴役。当部落经过故国的领土时，他们停下来为领主服务了一段时间。棘秘魑欣赏莎格拉的智慧和决心以及她部落的忠诚服务，初拥了她，用血誓将她与他们绑在一起，并派她去以他们的名义宣称新的领土。\n她帮助部落在波西米亚定居，选择了布拉格作为她某一夜苏醒的藏身处。在经历了漫长的$pod_torpor$之后，她与约瑟夫·兹维亲王（他只是被那个在他的城市下沉睡了这么久的怪物吓坏了）做了一个“商定”，再次参与到$pod_cainite$政治中。\n到目前为止，她已经决定从布拉格的基地支持弗拉基米尔·罗斯托维奇，破坏神圣罗马帝国梵卓的战争努力，并最终将梵卓自己赶出他们的领地。\n\n其在原作中的未来命运\n莎格拉将重新陷入$pod_torpor$，只是偶尔醒来，最后将在第二次世界大战期间遭遇灭顶之灾，她的藏身处被炸弹击中，将她烧成灰烬。"
 POD_investigate.desc.505111: "1220年被伊尔丝·雷纳格[Glossary('初拥','game_concept_Embrace_desc')]的古斯塔夫至今是血族社会中一个不起眼的补充。不过如果再往下看，可以注意到，即使以吸血鬼的标准来看，布賴滕施泰因似乎看起来有些神经质，而且他的想法和方法能让棘秘魑颜面扫地。\n其在原作中的未来命运\n古斯塔夫将会崛起，成为吸血鬼社会对整个世界释放的最大瘟疫之一。[Glossary('吸榨','game_concept_diablerie_desc')]自己的[Glossary('尊长','game_concept_Sire_desc')]，随心所欲地把人刺入木桩，创造出前所未有的恐怖暴政，也只是他罪行中比较轻的部分。他将会为了他的野心和自尊来支持字面意义上的世界大战。他肮脏的仕途将在1997年结束，被那时称为“血咒”的疾病将夺走他的亡生。"
 POD_investigate.desc.790105: "喀喇和他的[Glossary('尊长','game_concept_Sire_desc')]阿扎布在蒙古人中生活和狩猎，但是被草原上的原生吸血鬼——[Glossary('安答','podgloss.anda')]——驱赶到了西部。阿扎布进入了$pod_torpor$，而喀喇成为了利沃尼亚一群野者的“可汗”。一段时间过后，喀喇的部落与特亚维派睿魔尔结盟，冈格罗军阀让睿魔尔的德维拉成为了他的顾问和情人。\n从那以后，他成为了欧洲各地原始教徒的战斗口号，寻求像阿努尔夫一样有名的维京英灵战士或者野者的帮助。他的地位还远没有得到保障，因为他的“国度”只是被他的魅力所控制，而黑十字正在准备一场所谓的“十字军”来打破他的抵抗。\n\n其在原作中的未来命运\n尽管困难重重，喀喇将战胜第一波十字军并在决斗中亲手杀死巴黎的亚历山大。与约根·冯·费尔登的和平协议将使虚弱的野者免遭第二波袭击。胜利的代价将是高昂的，他同时失去了德维拉和阿扎布。喀喇将从历史上消失很长一段时间后才会以最具影响力的魔宴成员的身份回归。"
 POD_investigate.desc.790106: "德维拉以另一个名字出生在利沃尼亚，是一名崇尚特亚维的铁匠的女儿。她从小就对这个世界的运作很感兴趣，发展出了天赋，使得村里的一些人都窃窃私语说她是个女巫。一位名叫艾尔弗里克的睿魔尔术者在旅行时注意到了德维拉的天赋，并强迫她的父亲让她成为自己的学徒。\n当她在不久后才被导师转变成睿魔尔吸血鬼中的一员时，她很难接受自己所化的样子。她要求被调往到故乡利沃尼亚，以便学习棘秘魑的库都术法。\n他们转向原始教的行为，招致了睿魔尔同胞的怀疑，很快，德维拉手下的特亚维派睿魔尔发现自己受到了谴责和回避。德维拉寻找着盟友，并在1155年找到了来自蒙古的冈格罗，喀喇。和他一起，他们建立了一个凡人和吸血鬼的部落，在这里，凡人和吸血鬼彼此和谐相处，并与周围的灵魂保持一致。从那时起，他们就开始准备迎接睿魔尔和黑十字必然的报复。\n\n其在原作中的未来命运\n德维拉的魔法将在她的爱人与亚历山大的决斗中拯救了他，但是，虚弱的她将因此无法应付即将来临的睿魔尔的热尔韦的袭击并幸存下来。她最后的反抗行动将是确保一位特亚维派吸血鬼在清洗中幸存下来，来确保她人民的传承。"
 POD_investigate.desc.790107: "在他的凡生，阿努尔夫是一个哥特人士兵，据传他来自斯基泰时代甚至更早。他一直不明白为什么他的[Glossary('尊长','game_concept_Sire_desc')]选择了他。他只对自己的权威负责，他在东欧游荡，看着他熟悉的世界渐渐消失。在他心兽的毒牙下越陷越深，与夜间世界的交流变成了一种宗教体验。他的亡生被分解成它的组成元素：黑夜，他只需要战胜几个游荡的战士来维持自己的生命，白天，他就睡在森林的土壤里。\n有数个冈格罗反对他，他毫不留情地杀死了他们。他想摧毁文明，回到原始又简单的夜晚；野蛮人若放弃自己的力量，用城市的财富来养肥自己，就是最大的罪。他听说过喀喇号召原始教世界进行最后一战，尽管他能闻到蒙古领导人的软弱，但阿努尔夫不会错过这场世界上任何一场战斗。\n\n其在原作中的未来命运\n阿努尔夫将在即将到来的战争中幸存，甚至还勉强有点尊重喀喇。然后他将继续他那徒劳无功的战斗，和蒙古人一起对抗欧洲，然后和土耳其人一起对抗君士坦丁堡。最后，作为土耳其人进攻瓦拉几亚领地的幕后盟友，他将在一对一战斗中遇到弗拉德·采佩什。尽管阿努夫没能在随后的决斗中活下来，他的传奇故事甚至在现代夜晚也在冈格罗中流传。"
 POD_investigate.desc.790937: "作为一位斯拉夫酋长的女儿，拉兹科利纳在成长过程中清楚地知道别人对她的期望。虽然她结婚了，但没能为丈夫生下孩子。当他被一位棘秘魑$pod_Embrace$的时候，他和她分享了这个迷吻，把她变成了一位不死族。作为不死族之一，拉兹科利纳很快适应了新生活。她和她的丈夫很快就成为了部落真正的领袖，他们以最强大的战士为食，杀死任何胆敢反抗他们的人。\n基督教传教士于波兰的到来，表示了他们灭亡的开始。有一天，部落被恶魔统治的谣言传开了，骑士们在牧师的陪同下前来，与拉兹科尔娜和她的部落作战。她的[Glossary('尊长','game_concept_Sire_desc')]倒在了入侵者的刀剑下，但拉兹科利纳设法杀死了其余的攻击者，在之后为了逃避阳光，陷入了$pod_torpor$。\n醒来后，她发现一座繁华的贸易中心在她的头顶上建了起来。她声称这座城市是她的领地，并开始鼓励它的发展。1083年，克拉科夫成为了波兰的首都，拉兹科利纳成为了这个城市最著名的$pod_cainite$，她相信自己是这个地区最古老、最强大的不死族。\n\n其在原作中的未来命运\n在大反乱期间，她将被自己的子嗣吞食。"
 POD_investigate.desc.605111: "完全邪恶和狡猾的海德翁除了自己的权力之外，几乎不关心任何事情。几百年来，他的阴谋将他引向了权势的巅峰，却又将他打倒。\n海德翁认为所有人类的凡生（和血族的亡生）只有在服务于他的情况下才有存在的资格。他主要的藏身处，是在波兰的一座由什拉赫塔（通过易变术转变的血仆）守卫的城堡。他领内的村民是会被抓去当做各种卑劣实验的豚鼠。有的在他的地牢里充当活圈套，有的则在他城堡的房间内充当活的隔板。\n至于落入他势力范围内的血族，如果被直接榨干，那都算是幸运的，因为海德翁就如同其背后的$pod_clan$，以酷刑闻名。幸存下来的人甚至是海德翁他自己的子嗣会被他血缚，以利用这些受害者来推进他的阴谋。\n\n其在原作中的未来命运\n海德翁的势力将不断起伏，直到东欧共产主义结束后他才正式来到真正的巅峰。他将掌握旧棘秘魑联盟的势力，顺利控制整个地区。"
 POD_investigate.desc.505088: "维特正在打一场注定失败的战争，他知道这一点。这位骄傲的[Glossary('英灵战士','game_concept_einherjar_desc')]在他[Glossary('尊长','game_concept_Sire_desc')]$pod_torpor$后被委以崇高之主的地位，从此以凶猛的决心与基督教徒，梵卓和勒森魃作战。不过这一切都是徒劳的，因为凡人已经忘记了旧途，不少[Glossary('英灵战士','game_concept_einherjar_desc')]正在离开米德加尔德，寻找一个更安全的地方，或者是光荣的最后一站。很快，维特知道自己也会这样做。\n\n其在原作中的未来命运\n维特将会与立陶宛原始教军的喀喇决一死战。虽然维特在与十字军的战斗中幸存下来，但随后他将从历史中消失。"
 POD_investigate.desc.790270: "布伦希尔德出生于斯堪的纳维亚，她在自己的$pod_Embrace$中感受到了重生，并迅速组建了女武神，狂热地侍奉她的祖尊奥丁，认为自己是北欧神话的现实衍现。她勇敢地与基督教的侵蚀影响作斗争，试图阻止他们人民的古老传统发生任何改变。到目前为止，这还没有结果，但布伦希尔德是少数几位没有失去希望的人之一。\n虽然她尊重她的[Glossary('尊长','game_concept_Sire_desc')]，但她经常与他对他对命运的悲观看法发生冲突。她可怕的意志力、可观的战斗力和跟她志同道合的一帮战士，一直是梵卓不断的进攻的主要阻碍。\n\n其在原作中的未来命运\n经过200年的游击战，布伦希尔德将进入$pod_torpor$。直到第一次世界大战的血腥场面才最终唤醒她。她将改革女武神，使之成为一个渴望原始教和战争回归的团体。二战后，布伦希尔德将鼓励叛党活动，以颠覆当前的党派体系。她还将支持自由邦内的叛党，偶尔会招募年轻的冈格罗加入女武神的行列。\n当她找到奥丁的尸体时，她的奉献将得到回报。"
 POD_investigate.desc.790265: "比雅克岛首要的$pod_cainite$是强大的乌弗海登，她战斗时从不考虑自身的安危。她有着超自然的感官、敏锐的反应和她可靠的锤子——克里斯特巴尼——意为弑神者、弑主者或弑弱者——对凡人的手来说过于沉重的武器。\n老态龙钟、伤痕累累的维京冈格罗见证了交战王国的统一，然后是基督教化。她没有原谅任何一方。她征服了她的新王国，并着手恢复旧有的规矩，就像通过一面黑暗的、扭曲的镜子。\n就如曾经的维京人那般，她的大部分时间都花在突袭远征上，以雇佣兵契约和十字军为借口进行谋杀和掠夺。她最害怕的是$pod_torpor$的到来，那会把她的领地从她身边夺走，使克里斯特巴尼失去血色。她毫不怀疑，如果没有她强有力的臂膀来维护，那些旧有的规矩将会消亡。"
 POD_investigate.desc.790402: "阿努尔夫·赛门杜松是一位北欧商人，在9世纪时曾到过亚历山大。在那里，他被引入了一个崇拜古神赛特的血族密教，最后被赛特信徒赐予了$pod_Embrace$。\n当阿努尔夫回到斯堪的纳维亚时，以耶梦加得松的绰号而闻名，并以此建立了耶梦加得殿，作为崇拜尘世耶梦加得的末日邪教。尽管该教的影响从未普及，但他却在珠宝贸易领域中获得了一席之地，并在远离埃及的地方扶植了一个小型的赛特之子殖民地。\n\n其在原作中的未来命运\n由于许多血族误认为他和他的同伙们是妥芮朵，阿努尔夫最终将成为奥斯陆的[primogen|E]。在终末之夜，他将与自己的子嗣和洛基的子嗣发生冲突，他们的宗教狂热会让他感到不适。"
 POD_investigate.desc.791056: "被称为杂生惊恶的狂徒帮派的首领路德维克是一个扭曲的生物。在怨恨的刺激下，他寻求权力并不是为了权力，而是为了折磨那些折磨过他的人。\n这个勉强运作的帮派，最新计划是窃取斯堪的纳维亚老法师的聚居地——乌尔夫之殿的宝藏。\n\n其在原作中的未来命运\n杂生惊恶的整个帮派都将被殿里最年轻的法师贡纳尔·尼亚尔松几尽摧毁。路德维克将陷入血淋淋的$pod_torpor$，勉强活下来。"
 POD_investigate.desc.505084: "埃特里乌斯于公元850年出生在现在的瑞典哥德堡附近。他的父亲为德意志主教安斯加尔服务，在该地区进行了第一次基督教传教。埃特里乌斯被派往罗马朝圣，但他的队伍遭到袭击，他被抓去当奴隶。在君士坦丁堡，他被卖给一位感觉到他有特殊魔法天赋的人，一位叫睿魔尔的人。这人开始辅导这个年轻的瑞典人学习和赫耳墨斯技艺。这位年轻人的傲慢越来越大，因为他的魔力超过了他的同龄人，自认生无原罪，并成了睿魔尔最喜欢的学徒。\n当格拉崔克斯发现了能把他和其他人变成吸血鬼的魔药而胜过他时，埃特里乌斯起初表示抵抗，尽管这种情绪不会持久。他还负责带领睿魔尔前往扫罗的休眠之所，亲眼目睹了对[Glossary('上古耆宿','game_concept_antediluvian_desc')]的$pod_diablerie$，并亲自吸榨了许多萨洛比长者。在睿魔尔进入$pod_torpor$后，埃特里乌斯负责着金字塔和睿魔尔法典的大部分，塑造了$pod_clan$并领导它。他现在主要关注的是对棘秘魑的预兆之战和对赫耳墨斯秘会的魔煞之战。这两场战争都打得很辛苦，睿魔尔还远远没有稳固。\n\n其在原作中的未来命运\n埃特里乌斯将保留对睿魔尔$pod_clan$的控制权，当格拉崔克斯将自己流放为叛族者时，更是如此。事实证明，与秘盟结盟是明智之举，$pod_clan$将在他的统治下繁荣昌盛。一段时间内。"
 POD_investigate.desc.505053: "弗拉基米尔曾经是布拉托维奇的[Glossary('遗传血仆','game_concept_revenant_desc')]，他通过勤奋、强大和适度的背叛，继承了$pod_cainite$的衣钵、军督的头衔和他[Glossary('尊长','game_concept_Sire_desc')]的遗产。他甚至在还是凡人之身的日子里就已经声名显赫，与他$pod_clan$的许多敌人进行了无数次的战斗，弗拉基米尔在其[Glossary('尊长','game_concept_Sire_desc')]与狼人的战斗中倒下后，发起了对付他的对手加罪魁祸首——狼族的战争。\n在与影爵、入侵的梵卓、反叛的冈格罗、新起的睿魔尔和他们的石像鬼奴隶以及竞争对手棘秘魑的多次战争中，他证明了自己是一名凶猛的战士和狡猾的战略家。\n弗拉基米尔最近遭受了许多挫折。与约根·冯·费尔登的战争以屈辱的休战告终，并允许迈卡·维科斯在以前控制的领土上划出一个“缓冲国”。因此，他的权威比以往任何时候都更受争议，这让诺利兹或伊万·布兰科维努等军阀公开挑战他领导战争的权利。\n\n其在原作中的未来命运\n嫉妒弗拉基米尔的血亲将会密谋反对他，并安排影爵在他的城堡里埋伏然后杀死他所有的仆人和新娘。由此弗拉基米尔主要的担忧将是对抗被憎恨的狼人的报复。在意识到过去因果的情况下，他将追捕那些袭击他城堡的影爵的后代。2002年左右，罗斯托维奇谋杀了伊芙琳·君士坦丁的父亲。为了复仇，君士坦丁和她的后裔将召集几个人帮忙，而罗斯托维奇将在随后的战斗中被杀死。"
 POD_investigate.desc.790247: "沃拉克是最长者的第一批子嗣之一，也是这些子嗣中第一位（可能也是唯一一位）在现在被称为特兰西瓦尼亚的地区出生的子嗣。\n当最长者在大洪水之后的动荡时期失踪时，沃拉克是唯一留在特兰西瓦尼亚的最长者的孩子。在随后的岁月里，他与库帕拉以及约缚它的土地建立了联系。\n当最长者在萨洛比袭击后秘密$pod_torpor$休养时，沃拉克接任了棘秘魑$pod_clan$的军督之督的职务。他是一位虔诚的库都和蜕变者，试图促进$pod_clan$对阿兹·达哈卡的超然状态的理解。他很快就开始建造血肉大教堂，这项事务花了几个世纪，由于建筑的活化性，从未真正完成。\n\n其在原作中的未来命运\n最后，沃拉克的超然倾向和远见卓识的野心将成为他的败笔。15世纪，瓦拉几亚亲王弗拉德·采佩什——德古拉——引起了棘秘魑和其他特兰西瓦尼亚$pod_cainites$的注意，$pod_clan$内部和外部的神秘主义者都谈到了德古拉对不死族社会未来无可比拟的影响。沃拉克将唤来德古拉到血肉大教堂，在那里他将向军阀提供$pod_Embrace$。然而，大教堂选择在这个时候背叛它的主人——可能是由于库帕拉本身的直接影响——并将对它的维护者犯下$pod_diablerie$。"
 POD_investigate.desc.605124: "曾经，在很久以前，诺利兹、达米克和瓦雷斯卡，被认为是众生中的顶峰。而且，在罗马灭亡后，在他们的领导下，棘秘魑$pod_clan$曾一度繁荣昌盛。诺利兹甚至一度被认为是军督之督，但却堕入了颓废和消沉。\n他的目标是成为喀尔巴阡中最强大的生物。为了达到这个目的，他再造了一个子嗣军团，这些子嗣被指示尽可能多地吞噬吸血鬼的灵魂，稍加挑衅就会对对手发动战争，并被鼓励内讧以淘汰弱者而闻名。\n诺利兹最弱的子嗣成为他的工具；他最强的子嗣成为他的敌人，被用作提高他自己的军武能力。由政治冲突的烈火所锻造，他为自己和他的血缚子嗣军团准备好参与所有斗争中最伟大的斗争。\n\n其在原作中的未来命运\n讽刺的是，他最终会被他的子嗣科班所杀死。"
 POD_investigate.desc.790243: "文策尔是基督教骑士教育的产物，当盖萨国王邀请一支巴伐利亚骑士队伍成为他的私人保镖时，他来到了布达佩斯。赢得了[Glossary('初拥','game_concept_Embrace_desc')]作为对布尔斯库出色服务的奖励，文策尔最关心的是如何保住自己的地位，最大限度地提高自己的商业利益，并在这个可能很快成为战场的城市中维持和平。\n由于担心布尔斯库陷入堕落，随后$pod_torpor$，文策尔开始利用他的自然魅力吸引新的$pod_cainites$来到这个城市，对他首先表示忠诚的$pod_cainites$。\n即使成为不死族，里卡德仍然是一个有荣誉感的人，他因他曾是的样子而尊重他的[Glossary('尊长','game_concept_Sire_desc')]，并在睿魔尔和棘秘魑的战争中保持严格的中立，他认为这种战争是愚蠢和不必要的破坏性的。\n\n其在原作中的未来命运\n文策尔一向尽职尽责，他将看到并帮助布达佩斯作为一个伟大的闪耀城市的崛起。当布尔斯库最终觉醒时，他将再次出现在他身边。最终，他履行了对他尊长的职责，回到布达佩斯担任领导职务，如今他依然如此。"
 POD_investigate.desc.505087: "984年出生于科隆的罗萨琉斯在8岁时就加入了赫耳墨斯秘会。他迅速晋升，成为秘会最年轻的大师之一，然后开始作为秘会的外交官游历各地。1012年，他结识了埃特里乌斯，埃特里乌斯把他介绍给了睿魔尔家族。\n罗萨琉斯勉强接受了对方的$pod_Embrace$，之后又周游列国，充当$pod_clan$的外交官，去猎杀萨洛比。1032年，他被封为奥地利的大司祭，并受命将其打造成$pod_clan$的权力基地。\n他迅速从前任亲王瓦勒瑞安努斯手中篡夺了对维也纳的控制权，并将其改造成了睿魔尔一直保持到至今的堡垒。\n\n其在原作中的未来命运\n当睿魔尔正蛰眠中的身体将被转移到维也纳时，罗萨琉斯从他的亲王位上退下来，为统治维也纳的枢密院让路。在1529年被阿刹迈暗杀之前，他将成为这个议会的一部分，为期数年。"
 POD_investigate.desc.790113: "达瓦生前是居住在现代乌克兰的一名斯拉夫部落贵族。他是一位坚定的原始教徒，当统治基辅的瓦良格国王要求他的臣民皈依时，达瓦狠狠地拒绝了。他不情愿地接受了洗礼，并被迫支付了一笔巨额罚款，这笔钱被用来修建当地的大教堂。\n达瓦发过誓，他将亲手把大教堂和城市夷为平地，这让一位对新宗教有类似怨恨的棘秘魑长者感到很高兴。他要求达瓦继续为基辅的原始教徒功业服务作出承诺。\n现在，他用血来祭祀徘徊在基辅周围的“小祖母”芭芭雅嘎，并为即将到来的蒙古人对城市的猛攻做准备。\n\n其在原作中的未来命运\n虽然达瓦在1240年被蒙古人砍得粉身碎骨，但他还是设法活了下来，并对老妪保持忠诚。他将在90年代末老妪可怕的觉醒过程中帮助她，然后在她最终被打败时决定进入$pod_torpor$。"
 POD_investigate.desc.790244: "12世纪，诺娃·阿尔帕德最初被匈牙利的阿尔帕德梵卓所招募，以利用特兰西瓦尼亚快速的社会和政治变化。虽然诺娃傲慢自大、腐败自私，但仍然忠于她的$pod_clan$。几个世纪以来，她一直希望征服特兰西瓦尼亚的吸血鬼领主们以满足梵卓东方领主们的需要。\n就像诺娃的大部分努力一样，这个史诗般的计划完全失败了，导致她被囚禁了一小段时间。诺娃现在是许多东方领主的喉舌，代表她的$pod_clan$进行外交发言。当然，她意识到她现在被认为是可以被牺牲的。然而，无论如何，喀尔巴阡山脉以北也没有人信任她，所以她不太可能在其他地方找到栖身之所。\n\n其在原作中的未来命运\n尽管困难重重，她还是活了下来，并最终回到了她最初的领地——梅迪亚什，每晚与匈牙利贵族一起合作，将特兰西瓦尼亚从土耳其人手中解救出来。1687年，哈布斯堡接管了该地区，她获得了成功。随后，她将拥护哈布斯堡的领导者们带来的压迫，并在经历了200年的残酷统治后，在19世纪为此承担后果。"
 POD_investigate.desc.605112: "维利亚是易变术的大师之一，他曾是迈卡·维科斯的好朋友，尽管他们各自属于敌对世系。事实上，维利亚的[Glossary('尊长','game_concept_Sire_desc')]特里格拉夫曾是前往君士坦丁堡的信使，向迈卡的祖先——魔龙发出警告，说他们$pod_clan$的最长者有一个预言。由于对预言的内容感到愤怒并拒绝遵从，魔龙在一场史诗般的决斗中杀死了特里格拉夫。从那时起，这两个世系就成为了死敌。\n维利亚只是在玩一个漫长的游戏，慢慢地诅咒他的敌人和可恨的魔龙的后代。他本质上仍然是一个务实的人，如果能够实现互利，他以前也曾与敌人合作过。这种复仇的精神、强大的魔法和务实的观点相结合，使维利亚成为了一个非常危险的吸血鬼对手。\n\n其在原作中的未来命运\n维利亚的亡生将会向奇怪的方向转变，他与一位名叫伊琳·卡西迪的后嗣因一场前所未见的易变术壮举而合为一体。这对令人不安的组合现在担任了特兰西瓦尼亚的魔宴枢机，让维利亚再次与他最古老的敌人们对抗。"
 POD_investigate.desc.790920: "仄利俄斯出生于公元11世纪附近的一个富商家庭，他不追求舒适的特权生活，而是选择发展一门有用的手艺。他游历欧洲内外，学习建筑艺术和科学。\n仄利俄斯的洞察力展显了他的才华，因为只要给建筑师或工程师提几句建议，他就能改善任何设计的安全性和美观性。因此，仄利俄斯在贵族和工匠圈子当中名声大噪，很少有人意识到他优秀的洞察力是来自于对探地术这法子的认识。\n一名诺斯费拉图见识到了这个年轻人的潜力，决定将他带入$pod_clan$中，让他改善自己$pod_clan$居住的战地。从此，选择了永生的仄利俄斯沉浸在自己的手艺中，专门为$pod_cainites$的领主建造城堡，堡内还有一些客户完全不知道的暗室和秘密通道。\n\n其在原作中的未来命运\n仄利俄斯总是不甘心地成为许多重大吸血鬼事件的催化剂，包括建造罗马尼亚的库帕拉监狱，以及纽约市地下的巨大迷宫。尽管遭遇了一些挫折，但他将设法从这些考验中安然无恙地逃脱，直至今日仍在夜色中游荡。"
 POD_investigate.desc.790114: "以皇室之子在喀尔巴阡山诞生的迈卡·维科斯，自年幼起似乎就注定了他将成就不凡。当他还是一个孩童的时候，他对魔法的契合度引起了赫耳墨斯密会中睿魔尔家族的注意。在赫耳墨斯密会中，迈卡作为一名优秀的学生，很快就掌握了对于初级法术的运用，也正因如此，魔法师格拉崔克斯开始对他心生妒忌。妒火中烧的格拉崔克斯将迈卡出卖给了棘秘魑$pod_cainites$，但这非但没有害死他，反而让年轻的迈卡挤入魔物之列。\n尽管$pod_Embraced$迈卡的魔龙派棘秘魑西默盎与喀尔巴阡山的棘秘魑$pod_clan$并不属于统一战线，他们还是一起回到了君士坦丁堡。正是在这里，迈卡努力提升了自己的阶级，他终于得以接触血族政治，并在政治领域施展自己的才华。\n在君士坦丁堡陷落后，迈卡占领了一块军督领的土地，毫无疑问的，这引发了他与这片土地主人——军督之督弗拉基米尔·罗斯托维奇的冲突。鉴于军督领的天然劣势，迈卡向梵卓$pod_clan$提出了利用他的领土作为黑十字封邑与军督领的缓冲带的建议，而为了避免战争，处于临战状态的黑十字与军督领不得不接受了麦卡的建议。作为这片缓冲带的所有人，迈卡巩固了自己对于奥伯图斯的棘秘魑的掌控，使其真正成为了他$pod_clan$的所有物。自此，得以安稳的迈卡开始精心炮制他有关原罪之路的著作，也开始了他对于斯雷代茨的尼基塔的祖宗的真相的考证。\n\n其在原作中的未来命运\n他将得到的东西会比他期望的更多。随着迈卡清醒的时间越来越少，某种恐怖的生物正在逐渐取代他。"
 POD_investigate.desc.790261: "起初作为斯雷代茨社团里一名不重要的牧师，尼基塔在他职业生涯的早期就和异端有所接触并成为了异端的侍祭。在这群秘密的东方的波格米勒派的拥护者中，尼基塔的地位迅速上升并最终被赐予了$pod_Embrace$。\n与许多其他拥护异端的吸血鬼截然不同，尼基塔完全相信教派的信条并且在他的同胞中以虔信而闻名。他很快的爬上了一个高位——成为了驻于挪得教区的波格米勒派使节，还成为了保加利亚，匈牙利，克罗地亚，塞尔维亚以及波西米亚的主教。\n在苦难十字军和君士坦丁堡的陷落后，尼基塔开始反对纳尔塞斯。在绯红教廷将纳尔塞斯驱逐后，尼基塔在1212年被任命为新的挪得大主教。从此尼基塔开始活跃于稳固虚弱的异端，并在法兰西和意大利进行着他的行动。但是这些行动有时候总是弄的适得其反。\n\n其在原作中的未来命运\n尼基塔早已去世。被记仇的魔龙所杀，而古老的棘秘魑氏族正在通过冒充成大主教的方式缓慢摧毁$pod_cainite$异端。棘秘魑会巧妙的继承异端并在之后彻底抛弃异端这个无用的死尸。"
 POD_investigate.desc.790129: "安德烈亚斯曾经是巴勒斯坦的基督教一性论异端的牧师，之后正统教会宣布其为异端并开始狩猎他。安德烈亚斯随后逃到埃及，定居在了一个还在侍奉赛特的小村庄里。在和当地居民交谈了多次他们信仰的本质后，他最终改信赛特之子并研究其信仰的核心。当他最终被$pod_Embrace$，他被导师赐予安克赫瑟那坦的新名字作为对其过去的耻辱的印记。\n他很快以一个商业巨头而闻名，他将货物卖到了整个欧洲，并在整个中世纪旅游并传播了黑暗之神的教义。\n他最近的努力是护卫从君士坦丁堡到巴黎的大篷车的难民，并收养了年轻的孤儿梅里巴作为他的女门徒。他现在在保护马库斯·穆萨·乔凡尼去喀尔巴阡山脉执行一项危险的任务。\n\n其在原作中的未来命运\n安德烈亚斯将要在他的旅途终点遇到一连串灾难性的事件，他将考虑自身的生存以及保卫自己所爱的人们。但是马库斯·穆萨就不会这么幸运了。"
 POD_investigate.desc.790140: "安布罗吉奥作为私生子出生于乔凡尼家庭，他通过自己那凶残和纯粹的野心获得了家族长者的注意。即使是在他超常的生活中，他也是一名出色的亡灵术师，他经历过自己成为神的强烈愿景。这个目标会成为他的动力，并进一步激发他那狂妄自大的个性。\n当卡帕多西亚$pod_clan$开始初拥乔凡尼家族的成员时，他是少数被选作被迷吻的人。因此，他是极少数的乔凡尼$pod_cainites$之一，他的血统直属于卡帕多修斯而不是作为奥古斯都·乔凡尼的后裔。他对了解神格的兴趣将他吸引到了卡帕多修斯的研究上，但与该[Glossary('上古耆宿','game_concept_antediluvian_desc')]不同的是，安布罗吉奥并不相信有吸血鬼真的能[Glossary('吸榨','game_concept_diablerie_desc')]天主，但却相信吸血鬼可以获得神一样的力量。\n显然，奥古斯都已经给了他全权，让他去调查血族神秘而矛盾的过去。因此，他几乎不理会$pod_clan$的规范，当强大的乔凡尼与他接触时，他会以各种方式侮辱他们。他并不关心——他的私利和野心让他没有什么理由去交宫廷盟友。\n\n其在原作中的未来命运\n安布罗吉奥的研究永远不会真正地结束，直到他不得不背叛每一位乔凡尼。一个简单的选择。"
 POD_investigate.desc.505091: "一位在布达佩斯出生和长大的匈牙利法学家，贝拉对这个世界知之甚少。受过良好的教育，他对深奥的事物和精神的知识令人印象深刻。阿玛莉娅在午夜弥撒时遇到了贝拉，他很快就给她留下了深刻的印象，于是阿玛莉娅初拥了他，就此希望能找到一个值得信赖的伙伴。\n虽然贝拉对天主教的信仰并没有他对宗教的认识那么强烈，他依然迅速地沉浸在自己对于永生的新发现中。由于对$pod_cainite$的状况有着截然不同的看法，他和他的[Glossary('尊长','game_concept_Sire_desc')]很快就分道扬镳。\n贝拉很快就从一个密教徘徊到另一个密教，并终于找到了一个值得敬仰的存在，也就是特兰西瓦尼亚之怖——库帕拉。利用旅途中形成的人脉和盟友，还有该地区的混乱，鲁森科得以轻松填上长者巴希里奥留下的空白，成为索菲亚的亲王。对于保加利亚的$pod_cainites$来说，贝拉是一个指挥若定，动力十足，但行事单调的亲王。在闭门不出的情况下，贝拉进行的仪式会让大多数棘秘魑感到畏缩。他行动迅速，并小心翼翼，最终的目标是献祭索菲亚来召唤库帕拉，然后成为他在大地上的凡人宿主。如果他成功了，没有人知道这个世界是否能在这样的威胁下存活下来……"
 POD_investigate.desc.505098: "阿丰佐是一个威尼斯商人。他曾帮助纳尔西斯处理了一个阻碍其在西西里赚大钱的竞争对手，这之后阿方索便获得了他的青睐。在诺曼人威胁关掉通往爱琴海的通道之后，纳尔西斯赐予了他的门徒$pod_Embrace$。\n纳尔西斯之后介绍阿方索去君士坦丁堡担任拉丁区的牧师，尽管阿丰佐也受过该隐异端的神学教育，但是他实际上是被派去帮助威尼斯掠夺拜占庭的财富。\n在经过不同的异端形式的血宴后，阿丰佐让本地人更反对拉丁人了。当第四次十字军到达君士坦丁堡并屠戮了城市后，阿方索曾经想自立为君士坦丁堡亲王。\n他的统治摇摇欲坠，而他对仍然强大的暗影之海的忠诚帮助他摆脱了困境。尽管阿丰佐逐渐增长的多疑和生气鲁莽持续的威胁着他那饱受争议的统治。\n\n其在原作中的未来命运\n阿丰佐的盟友只会帮助他到这个程度。阿丰佐面临着很多来自他自己的氏族的反对声，包括一个因为他过分行为而被迫反抗的叛军和复兴的希腊人势力，他会在1274年被烧成灰烬。"
 POD_investigate.desc.790004: "她最初是君士坦丁堡的阿莱克修斯一世的长女，并受到了梵卓的杜卡斯的初拥。在大将军贝利撒留的指导下，她成为了君士坦丁堡的检察官和财政官，直到这场苦难十字军摧毁了这座城市，摧毁了幻梦。\n她从中世纪世界最大城市的灾难中幸存下来，最终成为尼西亚的亲王。此后，她与新君士坦丁堡亲王阿丰佐展开了激烈的竞争，主要原因是阿方索和拉丁人从她父亲的遗产中夺走了这座城市。\n她与另一位“流亡帝君”娜塔莉娅·斯维亚托斯拉夫的关系很紧张，但这两个女人正在考虑一起合作，以推翻篡位者。之后会发生什么就不得而知了。"
 POD_investigate.desc.790104: "作为俄罗斯亲王的女儿，娜塔莉娅在君士坦丁堡接受教育，她也爱上了这座城市。娜塔莉亚作为管理者的技能让她引起了布鲁赫的注意，她欣然接受了对方的$pod_Embrace$。\n随后，娜塔莉娅沉浸在建设一个新的迦太基的过程中，这既是她的$pod_clan$理想的体现，也是米迦勒的幻梦。\n十字军征服君士坦丁堡后，她逃到伊庇鲁斯的专制国，在那里她设法成为塞萨洛尼卡的亲王。她认为她的城市是一座有用途的后备阵地，但她梦想着从阿丰佐和拉丁野蛮人手中夺回君士坦丁堡。\n娜塔莉亚是一位真正的信徒，如果能促进$pod_cainite$的统一功业，她愿意放弃自己的权力和声望。\n\n其在原作中的未来命运\n这位俄罗斯人将在1274年成功收复君士坦丁堡。但这将是一场非常短暂而痛苦的胜利。"
 POD_investigate.desc.790020: "雅弗很早就被他$pod_clan$的始祖$pod_Embrace$（作为他的第二次或第三次$pod_Embrace$）。他和他的子嗣，康斯坦西娅，作为$pod_clan$的主要管理者，经常在出现问题后进行处理或维持$pod_clan$仅剩不多的秩序。\n雅弗始终忠于他的[Glossary('尊长','game_concept_Sire_desc')]，当拉撒路逃往埃及时，雅弗依旧留在他始祖的身边。尽管他心存疑虑，但他还是安排了奥古斯都·乔凡尼的$pod_Embrace$计划，将这位意大利的亡灵术师纳入麾下。\n他骨子里是个学者，并不太适合领导整个$pod_clan$的任务，因此，他更愿意长期呆在埃尔吉耶斯。\n\n其在原作中的未来命运\n雅弗对乔凡尼的猜疑是对的，但这并不能让他在1444年从克劳狄乌斯·乔凡尼的獠牙下幸免。死亡对于强大的玛土撒拉来说只是一个挫折，而乔凡尼再也没有听到有关他的消息——"
 POD_investigate.desc.790241: "阿娜佳在穆斯林占领和控制埃及期间的亚历山大港出生和长大。她的母亲是土生土长的埃及人，父亲是波斯裔的富商。她还没到结婚的年龄，就引起了贝利撒留的注意。虽然这位老罗马人正和当时的情人谢巴赫一起旅行，但他却看上了阿娜佳敏捷的头脑和独立的个性。谢巴赫同意$pod_Embrace$她，两人把她当成了共同的子嗣。\n他们在一起的日子里，贝利撒留和谢巴赫教会阿娜佳成为一名士兵和斗士。谢巴赫教她用她的女权主义作为武器，对付那些低估她力量的人。贝利撒留则教她战术和军纪。\n在旅行中，阿娜佳遇到了勒森魃彼得罗，这位勒森魃认识到阿娜佳拥有精明的智慧以及经过战士训练。彼得罗首先让阿娜佳加入了塔尔玛埃拉，并在她加入黑手的最初几年里担任她的导师。\n她现在从亚美尼亚开始统治，作为她导师所构建的新技能测试。\n\n其在原作中的未来命运\n阿娜佳是由最优秀的人教导出来的，这一点以后将会展现。她将成为塔尔玛埃拉的德尔罗（被服侍者），既领袖，世界上最强大的$pod_cainites$之一。"
 POD_investigate.desc.790217: "正如同佩塔尼奎亚自述的那样，她最初是波吕克塞娜——一位伊庇鲁斯的公主。她加入了侍奉西布莉——一个恶魔末卡维氏族的玛土撒拉的教派。她与伟大的征服者马其顿的腓力二世的婚姻使得她成为古代最有权势的女王之一，在她的儿子亚历山大出生的同时，她将自己的名字改为了奥林匹娅斯，一个在历史上闻名的名字。\n当腓力离家去征服整个希腊时，奥林匹娅斯则沉浸在她侍奉的西布莉女神的鲜血之中。她的女神让其萌生了对所有男性憎恨的想法，除了她宠爱着的儿子亚历山大，一个让她决心让其成为全世界的王的男人。\n奥林匹娅斯安排了对腓力二世的刺杀而且让她的儿子随后成为了马其顿的国王。为了做这些，她从她的女神西布莉那里获得了$pod_Embrace$。亚历山大的军队入侵并征服了波斯，而且之后继续去征服了他们已知的世界的许多部分。\n尽管奥林匹娅斯请求将她的儿子变成血族，但是西布莉禁止她这样做，之后亚历山大大帝死在了巴比伦，随后他的帝国也灰飞烟灭了。\n这是佩塔尼奎亚的缓慢痛苦陷入疯狂的开始，并一直持续到了现在。\n\n其在原作中的未来命运\n佩塔尼奎亚会成为被裁判所认为是有着第二大威胁的血族公敌。尽管她的妄想和早已崩溃的理智让她完全不在乎这些。"
 POD_investigate.desc.790021: "康斯坦西娅作为一名凡人在希腊出生。在她的$pod_Embrace$之后，她很快就成为了骸骨之道的女祭司和埃尔吉耶斯神庙的主母，该神庙是卡帕多西亚$pod_clan$的精神中心，也是[Glossary('上古耆宿','game_concept_antediluvian_desc')]卡帕多西亚本人的家。\n虽然她不像黑暗时代的许多$pod_cainites$那样是个冒险家，但她还是走遍了整个欧洲，甚至走到了非洲的黑暗大陆和亚洲的异域。康斯坦西娅在她访问过的每一片土地上都主动建立和培养联系，很少有夜晚不在信使手中出现来自远方朋友的至少一封信。\n康斯坦西娅的愿景告诉她，对神化的追求会摧毁卡帕多西亚。然而，她怀疑拉撒路是这种愚蠢行为的罪魁祸首，他将利用萨尔贡圣典来实现他的目标。同样，康斯坦西娅试图摧毁士坦丁堡的幻梦，她将把米迦勒视作大天使化身的崇敬当作亵渎行为。她成功地摧毁了前者，而后者则自行崩溃了。\n\n其在原作中的未来命运\n康斯坦西娅看到噩兆时已经晚了，她无法从乔凡尼的獠牙下救出她的[$pod_clan$，但却设法拯救了自己。康斯坦西娅将继续寻求并提供一些答案，直到终末之夜。"
 POD_investigate.desc.790158: "在西罗马帝国灭亡期间，稚儿期的赫克托就听着希腊和迦太基的荣耀故事。因同龄人缺乏实际行动的意愿，赫克托感到沮丧，他愤怒地四处寻找一些能给他的存在带来意义的事物。\n由于寻找无果，赫克托在阿提拉入侵的前后陷入了$pod_torpor$。直到最近他才苏醒，大多$pod_cainites$社会的崩溃让他可以自由行动，而不必担心长者的怒火。\n赫克托聚集了一群大多是年轻、心怀不满的$pod_cainites$。在他巨势的领导下，他们发动的叛乱迅速、血腥而且成功。\n从那时起，新拉科尼亚就开始繁荣起来。虽然这块地区与其他$pod_cainites$社区并没有太大的区别，但它的民主成分确实比平时强得多。\n不过，赫克托最麻烦的缺点也开始显露出来——他照部就搬地遵从着古老的迦太基习俗，包括巴力顾问和人祭……"
 POD_investigate.desc.790380: "马勒基出生于9世纪，是位君士坦丁堡原住民，长大后成为一名东正教的牧师。他遇到了一位恩人，即勒森魃的一位长者马格努斯。作为一位拥有强大的，甚至是神秘赞助人的[ghoul|E]，马勒基最终升至主教级别。不幸的是，他与马格努斯发生了公开争执，结果招致对方的愤怒。为了伤害马勒基的自尊心，马格努斯让他被一位名为瓦西里的诺斯费拉图初拥。\n重生为$pod_cainite$后，马勒基一直生活在绝望之中，直到他被君士坦丁堡的牧首，妥芮朵的米迦勒收留。他发了血誓，并获得了米迦勒的保护，成为米迦勒幻梦的仆人。他改名为马拉希底斯，也被称作“君士坦丁堡之石”，是东方麻风病人当中受人尊敬的长者。\n在第四次十字军东征期间，君士坦丁堡城市被他们的基督教十字军同僚洗劫一空。在随后的混乱中，米迦勒被巴力的黑之玛丽[Glossary('吸榨','game_concept_diablerie_desc')]。失去米迦勒的马拉希底斯为此大受打击。随后他离开城市多年，只为寻找新的希望。最终他在被称为魔龙的棘秘魑玛土撒拉那里找到了自己的目的。在他们会面后，马拉希底斯受到启发，因此回到了君士坦丁堡，将其从法兰克人的控制下解放出来，并使该城市恢复其以前的荣耀。\n其在原作中的未来的命运\n马拉希底斯将在君士坦丁堡和伊斯坦布尔取得巨大的影响力，直到他结束这里的工作。然后他将开始追捕剩余的巴力，仍在为米迦勒的死亡寻求报复。在这个新任务完成后，马拉希底斯将回到他所开始的地方并进行祈祷。君士坦丁堡之石永不会被移走。"
 POD_investigate.desc.790242: "作为一名年轻的骑士和克莱尔沃的于格的子嗣，贡多马尔在他的[Glossary('尊长','game_concept_Sire_desc')]和祖尊试图帮助命运多舛的第四次十字军东征时加入了他们。看到他的[Glossary('尊长','game_concept_Sire_desc')]在恶劣的环境中仍保持着骑士精神，他很欣慰，并发誓要帮助他把十字军东征，或者至少是不死族的部分，重新拉回正轨。\n贡多马尔很快就有很多机会证明自己的才能，因为于格成为了阿刹迈$pod_clan$暗杀的目标。而正是这位年轻的骑士亲自肃清了君士坦丁堡的所谓“刀锋之网”的巢穴。\n令人遗憾的是，贡多马尔的忠心并不足以拯救自己的[Glossary('尊长','game_concept_Sire_desc')]，因为于格被他自己的情人扳倒，贡多马尔只是在一瞬间来不及救他。\n没了于格魅力的领导，不死族十字军很快就摇摇欲坠，但是他孝顺的子嗣并没有放弃，反而带着最热心的，或者说是最绝望的，剩余成员向着东方，以及至今仍旧遥远的奖赏耶路撒冷前进。"
 POD_investigate.desc.790483: "维克多是第六代冈格罗，也是芭芭雅嘎的将军之一，暗夜军的首领，为鬼婆服务的吸血鬼，试图夺回对俄罗斯帝国的控制权。\n维克多与芭芭雅嘎血脉相连千年，在芭芭雅嘎进入$pod_torpor$之前，维克多的忠诚为他赢得了在她眼中的特殊地位。他很强大，这些年让他学会很多并掌握了关于战斗和生存的知识。虽然他又老又累，但他还是以狂热的态度为鬼婆服务。有传言说，他撕碎了自己那些没有对鬼婆表现出适当尊重的子嗣。\n唯一能与他对芭芭雅嘎加的爱相媲美的，是他对狼族的尊重。在另一世，他可以和他们交好。有时他会在战斗中对狼族手下留情，这一点芭芭雅嘎加并不知情，如果她知道了会很不高兴。\n\n其在原作中的未来命运\n维克托对狼族的尊重将会是白费力气。在圣彼得堡执行任务时，白夜开始了——每年六月，太阳连续三周日夜照耀俄罗斯北部，这是每年的一大盛事。为了避开太阳，维克多命令他的部下使用潜入地中融进土里。有者担心狼族会发现他们正处于睡眠然后趁虚而入。但维克多相信注重光荣的狼族是不会去攻击沉睡的敌人。然而他错了。"
 POD_investigate.desc.790274: "突伽·辛是基督教到来前不久的俄罗斯土著，他是母神教中的一个萨满。她的人民和他们的土地受到芭芭雅噶的攻击，其已经堕落到疯狂和残忍的地步。\n古老的鬼婆向提议突伽·辛以永生来换取对她的奴役，但被拒绝了。鬼婆被激怒了，她对突伽·辛下了一个诅咒，使她的外表变得苍老而虚弱，然后在撤退之前，又对俄罗斯本身下了另一个诅咒。\n在一次与基督教传教士的战斗中，突伽·辛受了致命伤，芭芭雅噶回到她身边，打算初拥她。然而，芭芭雅噶还有其他的敌人：雷伏诺的一个部族，他们制造了一个掩护，说是基督教军队正在进攻，趁这间隙他们把突伽偷走了，并违背她的意愿初拥了她。芭芭雅噶很快就陷入了$pod_torpor$，显然是被渐渐衰歇的魔力削弱了。不过，突伽·辛仍然活跃在$pod_cainites$的世界里，她的预言能力为她赢得了巨大的声誉。\n\n其在原作中的未来命运\n突伽·辛将继续成为芭芭雅噶身边最恼人的眼中刺，也是英雄们的导师。她将活着看到她的竞争对手被摧毁，并且仍然是当今欧洲最受尊敬的雷伏诺。"
 POD_investigate.desc.790120: "一个与比约恩·艾隆赛德一起南下寻找名利的说书人，卡尔在埃及亚历山大被一个不信邪的妥芮朵初拥。卡尔在和他的[Glossary('尊长','game_concept_Sire_desc')]相处了一段时间，并从阿拉伯人那里了解了一些故事之后就回家了，用他现在无尽的时间来编目北欧人的神话。\n卡尔极力推崇旧道，说服人们与基督教这一潮流宗教抗衡，但他的精神却因乌普萨拉的焚灭和奥丁的失踪而崩溃。\n为了寻找拯救自己心爱的文化的方法，卡尔提出了一个“时间胶囊”——芬兰自由邦的想法。在很多方面上，他是这个新实验的核心，追踪其他参与者，并与他们的邻居进行讨价还价，以在不可避免的报复之前省下更多的时间。\n\n其在原作中的未来命运\n卡尔将加入卡拉赫在立陶宛的最后一战。他将在这场战斗中幸存下来，但这场金字塔式的胜利将使他的决心变得沉重。"
 POD_investigate.desc.790633: "娄希在第一世纪时被末卡维的后嗣，勒特利马斯初拥了。作为一名隐秘的吸血鬼，她在$pod_cainite$历史上很少有记载。据悉，她曾经逼迫且让冈格罗的玛土撒拉——伊奇奈陷入了[Glossary('蛰眠','game_concept_torpor_desc')]。\n娄希担任了一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]的直接代理人——但她所侍奉的上古者的$pod_clan$并非众人所期望的末卡维。相反，她的主人是位勒森魃的[Glossary('上古耆宿','game_concept_antediluvian_desc')]，而在侍奉的时候，娄希寻求一种能将将世界笼罩在永恒之夜的神秘仪式。\n娄希的外貌是个老女巫，身上有几分炼金实验的味道，她总是带着一根刻有各种符文的黑色法杖。她使用奇术的能力甚至可以和睿魔尔最强大的长者们相媲美。"
 POD_investigate.desc.790119: "作为自由邦的主要出声者之一，乌尔夫斯多蒂尔显然是一位前女武神，但不会谈论她的过去。她只是请求允许陪伴新社区，并提供她作为战士的服务作为交换。\n这位美丽的冈格罗是崇高之主的直系子嗣，虽然还很年轻，但对战争和远行非常熟练。\n乌尔夫斯多蒂尔对她的新家已经相当警惕，并且肯定感受到了北欧文化的缓慢死亡。在一位名叫安布罗西奥·维塔利斯的勒森魃传教士的接近下，她开始进一步了解基督教的神。虽然她不打算皈依，至少现在还不打算，但她发现与这位僧侣的谈话确实非常有趣。"
 POD_investigate.desc.790199: "公元400年，玛瑟逊莎召集了一次大集会，多亏动物仆众传播了这个消息，许多冈格罗参加了这次集会。在那里，她击败了所有挑战她统治地位的人，并在野蛮人入侵罗马领土后带领参会的冈格罗反抗罗马的梵卓统治者。\n玛瑟逊莎的称霸一直持续到403年，当时她接受了一个不知名的$pod_clan$的玛土撒拉的挑战。两人一直打到阿尔卑斯山脉的孤山山顶，没一人回来。\n据说匈人在伤口痊愈、饥渴得到满足的情况下正在苏醒过来。她寻找冈格罗，对他们说起她打算召集的大集会。不过，时代变了。匈人在西方有竞争者，崇高之主统治着北方。此外，许多新的冈格罗对她所说的荣耀之夜一无所知，也不听她的话。因此，到目前为止，她决定只依靠她的子嗣和最信任的盟友，在蒙古汗帐的阴影下集结力量。"
 POD_investigate.desc.790744: "在一场野蛮人的入侵毁掉了莫罗双亲的农田之后，这位女孩被她的父母抛弃了。死神以一个潜伏在东欧的上古冈格罗——兽之阿努尔夫的形态找到了她。\n二十年来，这位冈格罗养育并培养了她，直到有一天他把她困在一个小领地里，然后开始猎杀她。不过，莫罗还是能躲过这只强兽好一阵子，但结果依旧是无法避免的对抗。第五天晚上，发生了一场激烈的战斗。她被阿努尔夫打伤，但在被对方制服之前，她成功地用匕首刺穿了冈格罗的脖子，使其受伤。第二天晚上，她独自醒来，成为了不死之身。\n莫罗向南前进，挣得了一个凶残战士的名声。这个名声帮助她聚集了她的冈格罗同胞。莫罗相信她的$pod_clan$要想在文明进步的过程中生存下去，唯一的办法就是合作，所以她鼓励冈格罗在巴尔干和匈牙利各地组成集群，并守护着$pod_clan$的大聚会。\n她成为了冈格罗和野生动物军队的首领，然后领导这些军员在火地群岛战役（一场以迈卡·维科斯谈判达成的各方休战而告的血战）中袭击了正在交战的梵卓（由约根·冯·费尔登领导）和棘秘魑（弗拉基米尔·罗斯托维奇和他的血奴）。"
 POD_investigate.desc.791143: "在权力和声望上，剌曷在草原上几乎无人能敌。他是凡人时期的多布鲁的孙子，同时也是吸血鬼时期的多布鲁的子嗣。他看守着他[Glossary('尊长','game_concept_Sire_desc')]的陵墓已经有几个世纪了，并负责防卫那些游荡的[Glossary('万鬼','game_concept_kuei_jin_desc')]和其他夜间的怪物。\n剌曷忠于他族人的诅咒，在草原上游荡，当有人向他寻求智慧时，他就致力于伸张正义。剌曷从不仁慈也不宽恕，他不止一次地杀死了一个个彰显的恶人，来寻求赦免。\n当不担任裁判时，剌曷会加入[Glossary('安答','podgloss.anda')]的战宴，或独自袭击游荡的万鬼。有人说他心存死志，但这并非完全正确；实则是无尽的漂泊正侵蚀着他的决心，而剌曷大多只渴望安定下来。由于多布鲁尔不在时他需统率战团，这一梦想目前难以实现，因此他仍在流浪"
 POD_investigate.desc.790220: "阿帕西亚还在世时，曾是欧亚的斯基泰人的奴隶。由于她没有其他兄弟姐妹，她的父亲最终对其提供了武器训练，使她成为一名战士。\n成为古代斯基泰国王坟墓的守护者，这是一个非常荣耀的职位，即使这意味着她永远不需要去打仗。\n她很快就对自己的职责感到厌烦，即将成为她[Glossary('尊长','game_concept_Sire_desc')]的马伦恰诺斯就利用了这一点。他进入其中一个白天作为休息点的墓穴，并初拥阿帕西亚让其成为他的守卫，然后神不知鬼不觉地离开，去响应$pod_clan$先祖的“号召”。\n随着时间的推移，阿帕西亚离开了她的族人，开始在欧洲和北非地区游荡，探索那里的许多民族。正是在这次流浪中，她第一次遇到了她$pod_clan$的其他人。这些年以来，阿帕西亚作为守卫服务了数位卡帕多西亚人，这都要归功于她的武技。阿帕西亚以黑色幽默的口吻说，她是一个不折不扣的卡帕多西亚人，但她在死灵相关这一方面也仅仅是制造死人。\n当她到达俄罗斯时，阿帕西亚被寒冷的西伯利亚汗国中被称作阿瓦尔的几个部族的人尊为女王。这些人赢得了她的心，因为她在他们身上看到了自己古老民族的影子。\n\n其在原作中的未来命运\n阿帕西亚的人生才刚刚开始。她将背叛她的$pod_clan$，然后加入魔宴，并创建一个全国性的摩托车帮派。"
 POD_investigate.desc.791295: "在威尼斯，吉勒摩亲王的一位子嗣被钉上木桩，丢在太阳下，他那些被铁链绑住的血仆只能无助地看着这场悲剧。在匈牙利东部，十二名僧侣在奥贝图斯修道院被毒害和玷污。在马格德堡，一位著名的勒森魃宾客被暗杀，促使黑十字和暗影之海之间的紧张关系加剧。在所有这些案件中，有一个名字在其中被人悄悄流传，语气间都充满了仇恨和恐惧：希波吕忒。\n希波吕忒，这位被大多数人认为是变节者雇佣兵的拉米亚，不但是众所周知的剑术专家和弓箭大师，还洞悉了她血系中最深处的秘密。传闻希波吕忒与凡人和$pod_cainite$的魔鬼崇拜者有联系，她有法师作为她的仆众，并以猎杀狼人为乐。但没有人知道真正的事实，而这位拉米亚也不打算说。"
 POD_investigate.desc.605122: "有传言说，苏莱曼最先在麦地那接触了穆罕默德，目的是让他成为对抗麦加强大的$pod_cainites$的棋子。苏莱曼自己复述说，在这一时刻，他看到了他内心的救赎的可能性，并服从于先知传播的新宗教。后来，在他的征服过程中，他站在他的身边，是沙里亚·萨玛的主要创始人之一。\n先知死后，他把尽可能多地改变$pod_cainites$的信仰，给予他们在真主面前获得救赎的可能性视为自己的主要目标。为此，他操纵并加强了之后崛起的各个穆斯林王朝，并试图将阿拉伯半岛的各个吸血鬼统一到他的旗帜下，尽管有数个甚至是他内部的人，如哈立德·伊本·萨赫勒，都反对他。\n\n其在原作中的未来命运\n苏莱曼·伊本·阿卜杜拉直到终末之夜仍是[Glossary('阿什拉派','game_concept_ashirra_desc')]的穆拉，在他的家乡麦地那附近有他的个人藏身处。"
 POD_investigate.desc.790213: "在崛起之前，塔利克是西班牙的一名血族，然后在伊斯兰教的黄金时代皈依了伊斯兰教。源于麦加一道被称作哀恸的神秘屏障完全挡住了血族的脚步，塔利克对这座“不可触碰”的城市非常着迷，于是他冒险来到阿拉伯半岛，凝视着穆斯林最神圣的场所。\n塔利克在新朋友宰亚特的帮助下，并在其他任何[Glossary('阿什拉派','game_concept_ashirra_desc')]对城市宣称之前，加固了麦加，随后他便开始祈祷真主的指引。据传，通过阿里巴廷的帮助，他创造了一个仪式，减轻了哀恸（阻止血族进入伊斯兰教圣地的灵光）的严防程度。\n塔利克声称，他和他的后嗣从此以后将成为伊斯兰教的朝觐者，守护者和麦加的管理者。\n\n其在原作中的未来命运\n塔利克将意识到，保护双圣城不受外部腐败影响的唯一方法就是建立一个国家来捍卫伊斯兰教。他将在其他[Glossary('阿什拉派','game_concept_ashirra_desc')]长者的帮助下，向沙特提供援助，他们后来建立了以他们的名字来命名的国家——沙特阿拉伯。"
 POD_investigate.desc.790214: "宰亚特是一位古老的突尼斯冈格罗。除了大家都知道的他是阿拉伯所有瓦希恩共同[Glossary('尊长','game_concept_Sire_desc')]或祖尊之外，对他还是瓦希恩靠山的过去知之甚少。\n很久以前这位玛土撒拉和西班牙一位改信伊斯兰的诺斯费拉图塔利克结盟，他们最终还成为最好的朋友。借由塔利克的帮助，宰亚特在其他[Glossary('阿什拉派','game_concept_ashirra_desc')]可以宣称拥有这座城市之前加固了麦加的防御工事。\n在12世纪，他们两人与萨拉丁联手成功击退了基督教十字军。然而，战争一结束，宰亚特和塔利克就回到了阿拉伯半岛，默默地看着蒙古人入侵新月沃地。中东地区的穆斯林已经分裂成四分五裂的部落，就这两个[Glossary('阿什拉派','game_concept_ashirra_desc')]而言，应该给他们一个教训。\n\n其在原作中的未来命运\n宰亚特、塔利克和拉赫曼的努力将让阿拉伯在第一次世界大战后统一，同时实现沙特家族的统治，沙特就是以这家族命名的。这三位[Glossary('阿什拉派','game_concept_ashirra_desc')]将设法建立一个堡垒，阻止许多富有野心的欧洲吸血鬼在该地区宣称权力。"
 POD_investigate.desc.790124: "在他的[Glossary('尊长','game_concept_Sire_desc')]阿卜杜勒·哈克消失后，撒米亚最近获得了强大的力量，经历了几个世纪的血缚后，他尝到了甜蜜的自由。这种自由的滋味令他十分满意，以至于他没有放弃自己占据亲王领的意图，即使他的[Glossary('尊长','game_concept_Sire_desc')]回归。\n作为一位非凡的能干的行政官员，他正在利用城市的资源和繁忙的港口为自己创造一个地位。\n每一他[Glossary('尊长','game_concept_Sire_desc')]不在的夜晚，撒米亚都在巩固自己的地位，并以大胆的方式证明他新获得的独立。"
 POD_investigate.desc.790211: "塔拉克是纳巴泰人，生活在图拉真领导的罗马征服时期。在纳巴泰人向罗马屈服前的最后一场战斗中，塔拉克单枪匹马杀死了十几名战士，表现突出。这打动了附近的一个阿刹迈，并决定$pod_Embrace$这个人类，再把他带到阿拉穆特进行进一步的训练。\n虽然塔拉克很快就功成名就，但他仍然为自己的人民在与罗马人的战争中失败而苦恼不已。他违背了长者的意愿，对罗马帝国及其东方的继承者拜占庭帝国进行了多次大胆的突袭。\n由于败给拜占庭将军阿莱克修斯，塔拉克开始重新考虑起自己的亡生。他启程至约尔达尼亚，寻找纳巴泰人的残余。在哪里，他发现了一个由纳巴泰人的血统组成的部落——纳巴族。塔拉克展示到他的人民面前，宣称自己是他们祖先的神，来这里是为了带领他们重获荣耀。然后，他带领部落来到佩特拉城，并将该城重新立为他们的总部。从那一刻起，塔拉克过上了危险的三面生活。这位冒充忠于阿拉穆特的阿刹迈，重新召集他的族人，继续对罗马和征服他祖国的赛特之子进行报复。\n\n其在原作中的未来命运\n塔拉克的未来相当疯狂，他是有史以来唯一一个从诅咒中解脱出来的吸血鬼。再次成为凡人的他不会享受太久，因为乌尔.舒尔吉只在阿拉穆特那里打了个响指，就立即将这叛徒撕成了两半。"
 POD_investigate.desc.790236: "在最后一次前往哥拉汛的旅途中，萨洛比战士萨麦尔只停留了一站。他发现自己被一个预景吸引到了一个小村庄，这里的村民遭受了一场可怕的瘟疫。那些幸存下来的人大多已经失去了所有的希望，抛弃了他们的家园和未被埋葬的亲人——除了一个人。萨米尔发现一位孤独的阿拉伯妇女正独自一人将她襁褓中的儿子、她的两个兄弟和她死去的丈夫的尸体搬到火堆上，看着她最亲近的人在火焰中消失。\n战士被迷住了，他问女人为什么不和其他人一起离开，而是选择一个人留下。那女人只是回答道，埋葬死者是她的职责，她知道瘟疫的源头是魔鬼，但只要还有一个人留在这里，事死如事生，事亡如事存，那么魔鬼就永远无法真正将这个城镇据为己有，路西法将会败在一个有信仰的女人手下。\n萨麦尔，萨洛比最伟大的战士，在听完这个女人的言论后深感震撼。他马上意识到这是神的启示。他明白自己是被神刻意引导到这个女人身边，也明白了他去哥拉汛的旅程将是他最后的旅途。\n六百年后，萨麦尔最后的子嗣在看见她的[Glossary('尊长','game_concept_Sire_desc')]和她[Glossary('尊长','game_concept_Sire_desc')]的[Glossary('尊长','game_concept_Sire_desc')]都被杀了之后，就回到了耶路撒冷。经过一周的谈判，一项协议统一了这片地区，巴勒斯坦地区属于和平和秩序的时代到来了。虽然卡维娅·加杜巴没有头衔，但没有人对她掌握圣城的最高权力并主持圣城的公义这些事抱有疑问。这个穆斯林萨洛比战士将以“耶路撒冷的雌狮”这个名号为大众所知。"
 POD_investigate.desc.790121: "卢修斯出身于意大利南部的一个小贵族家庭。比起安稳的生活，他更喜欢冒险行动，所以他的亲戚在公元57年安排他在利比亚担任军事指挥。在经历了一段杰出的军事生涯后，卢修斯回到家乡，并正好在致命的维苏威火山爆发期间证明了自己。他沉着冷静、有条不紊的努力帮助挽救了许多人的生命，经过几个长夜的讨论，梵卓以平等的条件赐予他$pod_Embrace$。\n尽职尽责但缺乏雄心壮志的卢修斯，从来没有真正适应过割据的$pod_cainite$政治。他在天主那里找到了慰藉，并急切地加入了第一次十字军东征，为自己的亡生找到新的目标。\n虽然现场的情况比卢修斯所希望的更为分歧，但这位老罗马人成功地保存了自己的荣誉，帮助了基督教界避开不必要的流血事件。1229年，当城市重新回到基督教的控制之下时，卢修斯几乎是顺理成章地被加冕为亲王。\n卢修斯与橄榄会议的关系紧张，但依旧可以控制。他虽然钦佩卡维娅的精神，但希望有一个更“基督教式”的领导。不过，卢修斯还是给出了效忠的承诺，且言出必行。\n\n其在原作中的未来命运\n不幸的是，他的荣誉举止和精神不会被他的子嗣继承。卢修斯将死在魔宴反乱期间，被自己的子嗣所[Glossary('吸榨','game_concept_diablerie_desc')]。"
 POD_investigate.desc.790125: "达舒夫的历史是由背信写成的。他曾经是名有些手艺的画家，并赢得了一名从君士坦丁堡流亡的米迦勒派妥芮朵“埃尼马乔”的注意。当伊斯兰教兴起时，达舒夫利用这个机会将他的[Glossary('尊长','game_concept_Sire_desc')]从权力中撤位出来。\n通过与哈基姆圣裔脆弱而摇摇欲坠的联盟，达舒夫就此保住了大马士革的苏丹之位。不幸的是，他和他的同僚们已经落入到了巴力安纳齐尔的腐蚀当中。他现在沉浸在仪式化的屠杀和令人不安的狂欢。\n阿刹迈现在非常接近于采取行动，而达舒夫知道自己的夜晚已经不多了。这位苏丹已经接受了这个事实和来临的惩罚。在最后一次回忆过去的自己时，他只希望他最爱的子嗣玛娜尔能从即将到来的报应中幸免。"
 POD_investigate.desc.605128: "在被初拥之前，艾哈迈德并不算特别的信教和虔诚，不过是个的黎波里的成功商人。他的[Glossary('尊长','game_concept_Sire_desc')]因为相似的宗教观点而选择了他，并教导他其$pod_clan$的技艺。作为最终考验，艾哈迈德应该潜入十字军的大营中偷取某样东西并刺杀掉守卫。不管他到底是发现了什么，这都彻底改变了他，让这个男人转变为了一名虔诚的基督徒。此后，他为加强阿刹迈对圣地的控制而不知疲倦地努力着。\n艾哈迈德心甘情愿地参与到了橄榄会议，自认是来自鹰巢的代表。他的基督教信仰使他更容易适应十字军国家不断变化的宗教氛围。"
 POD_investigate.desc.790545: "安纳齐尔是大马士革最强大的$pod_cainite$。在两千多年前希腊前哨站的岁月里，他还是名一直住在那里的年轻崇魔新兵。大马士革的巴力掌握着巨大的权力，这都要归功于安纳齐尔对被称作易卜劣斯至大的大机关的维护。\n一位叫达舒夫的妥芮朵控制了城市的统治家族。但安纳齐尔伪装成妥芮朵混了进去，慢慢腐蚀了达舒夫和他的血亲。当他们发现安纳齐尔的真实身份时，一切都来不及了。\n不幸的是，这种力量数百年来让安纳齐尔充满了妄想，他已经忘了让自己成为长者的精妙教训。现在，安纳齐尔已经不满足于安于暗处，只在远处影响事件的发展。其他的巴力担心安纳齐尔会牵危到他们并正在寻找处置他的方法，即使这意味着把他出卖给阿刹迈。"
 POD_investigate.desc.790146: "在十一世纪的左右，阿扎那利在疑似“活生生的阴影”的所在地发现了一个早已失落的通往哥拉汛的门径。为了打开这个门径，他向来自瓦伦西亚的勒森魃崇魔派寻求援助。巴力和他的新盟友在哥拉汛和纳姆塔尔之墓之下发现了一座新城市。勒森魃崇魔者和巴力教义，这种奇怪的组合就是黑天使的起源。\n阿扎那利号召所有巴力加入这项事业；大多数长者拒绝了他，但年轻的巴力响应了他的号召，这引发了巴力血系的内战。他希望将所有崇魔者纳入他的麾下，揭开哥拉汛的秘密。\n\n其在原作中未来的命运\n阿扎那利将会输掉这场战争，摩洛教团援引了阿西普的教义，摧毁了哥拉汛的废墟，并将阿扎尼尔和他的大部分后代困在一个用圣火和受祝土地包围的监狱里。但时间将站在阿扎那利这里，他终将升魔，并在今夜继续驻留在哥拉汛之中。"
 POD_investigate.desc.505095: "塔尼特是摩洛最信任的子嗣，以了解黑暗秘密而闻名。虽然塔尼特是她[Glossary('尊长','game_concept_Sire_desc')]的忠实追随者，但她没有参与其在迦太基的活动，而是留下来统治推罗。公元前332年，她利用亚历山大大帝的军队肃清了她的领地上所有不受欢迎的$pod_cainites$，这样她就可以按照自己的意愿来统治和塑造这座城市。\n塔尼特发誓，决不向她[Glossary('尊长','game_concept_Sire_desc')]所受的软弱妥协。她成为了摩洛教团和那些选择疏远崇魔的巴力的非官方领袖，也是她血系中一个致力于混淆黑暗神秘的密教的创始人。然而，塔尼特和她的[Glossary('尊长','game_concept_Sire_desc')]一样，也被纯真所吸引，并感到有玷污纯真的冲动。\n当阿扎那利接受了衰旦的称号后，塔尼特在宫廷里接见了他的使臣，听取了他们的意见，并悄悄做了放弃推罗的准备。\n\n其在原作中的未来命运\n塔尼特会因为一次伏击而陷入$pod_torpor$，并把推罗和摩洛教团的领导权交给了她的孙嗣萨哈尔·汉尼拔。"
 POD_investigate.desc.790145: "萨哈尔·汉尼拔出生在迦太基缓慢而痛苦的衰落年代，是一个卑微家庭中最小的儿子，毕竟除了他还有太多的嘴要喂。\n他被送到神庙献给众神时，塔尼特巴尔·萨哈尔就在那里看到了他，并选择他作为伙伴。不幸的是，塔尼特巴尔·萨哈尔当时正处于创造的阵痛中，并为后来的欲国之道制定了基本的信条。这种异端行为他树敌众多，有一天晚上，当萨哈尔·汉尼拔醒来时，他[Glossary('尊长','game_concept_Sire_desc')]的血味仍然粘在他的舌头上。痛苦的死亡还有计划外的$pod_Embrace$之夜是他最后一次见到他的[Glossary('尊长','game_concept_Sire_desc')]。\n在选择插入他和摩洛的愤怒之间的祖尊，塔尼特的照料下，萨哈尔·汉尼拔度过了亡生中第一个超现实、迷失方向的夜晚。当塔尼特离开迦太基并前往推罗时，萨哈尔·汉尼也跟了过去，以报答祖尊长对他的救命之恩。他作为塔尼特的左膀右臂服务了好几个世纪并掌握了战争的艺术，以便在迦太基陷落时巩固她作为长子的地位。\n\n其在原作中的未来命运\n萨哈尔·汉尼将在他的恩人倒下后领导教团，带领他们取得对阿扎那利的胜利，然后在塔尔玛埃拉当中找到新盟友。"
 POD_investigate.desc.790149: "玛丽原名马里，她是古叙利亚埃布拉城一个地方区长的美丽女儿。马里后来成为了一位名叫米卡勒（后称米迦勒）的妥芮朵的忠实弟子。\n最终，在阿卡德人袭击埃布拉期间，米卡勒抛下马里一人，逃离了这座城市。当城市受到攻击时，马里在最后的日子里在石板上写下了她的人生故事，刻下了自身的历史、知识和对主人所滋生的仇恨。当侵略者进入时，马里用她的剑挖出了自己的肠子，把自己的血洒在了石板上。\n一位名叫阿纳杜克的巴力发现了石板，他察觉到这片记录不单单只有文字，还附有马里的记忆。使用观占术后，阿纳杜克深深地陷入了马里的激情和仇恨。这使他疯狂地爱上了马里，并与一位黑暗实体达成协议，以让她复活。\n石板并不完整，这让复活的本体只有部分重现，于是马里的脑中充满着不连贯和局部的记忆，且被仇恨腐蚀。她在醒来后杀死了阿纳杜克，并大口大口地吸食他的鲜血，并在这个过程中变成了巴力。\n1204年，被称为黑玛丽的她，在君士坦丁堡内发现了米卡勒的下落。第四次十字军东征期间，她发动了攻击，[Glossary('吸榨','game_concept_diablerie_desc')]了这位玛土撒拉。\n陷入狂怒的玛丽在君士坦丁堡燃烧的街道上肆意妄为，有序地在城内猎杀米迦勒的后裔。之后，她逃到了推罗，在那里，她的同族塔尼特为她提供了庇护和保护，对付任何得知她参与米迦勒之死的$pod_cainites$。"
 POD_investigate.desc.790554: "大胜死亡是个怪人，他是穆斯林世界最强大的城市的亲王，来自一个被穆斯林吸血鬼鄙视的$pod_clan$。这一事实证明了他的能力。\n这位雷伏诺在成为巴格达的低级廷臣前，就已经与当地的亲王伊拉赫有了交集，他们之间正在酝酿一场严重的竞争。大胜死亡花了不少时间，在城市中强大的$pod_cainites$中争取支持，然后寻找亲王的弱点，即她的[ghoul|E]。\n狡猾的雷伏诺利用虚幻术的力量，诱使[ghoul|E]尝试刺杀亲王的另一位强大对手，然后在宫廷上与她对峙。\n被俘的[ghoul|E]被审问，只能透露她所了解的情况，即亲王命令她这样做。\n由于盟友不多，又有这一不利的证据，伊拉赫没有能力为自己辩护，而大胜死亡站了出来，成为亲王领的一致选择。\n虽然他对城市的控制得到了保证，但秃鹰已经在周围盘旋，大胜死亡开始了他维护自己统治的艰难旅程。"
 POD_investigate.desc.790530: "纳穆尔图姆是哈基姆的子嗣，于公元1214年意外地来到阿拉穆特。她花了十多年时间，在哈基姆不在时过渡成为阿刹迈的名义领袖。而在她之前，这个职位一直由隐居的大术士沙赫里担任。\n虽然纳穆尔图姆据说是道统的创始人，负责记录$pod_clan$的历史和维护其精神方向的历史学家，但她也是第一位担任山中老人的女性。许多年轻的阿刹迈勇士都对一位女性的领导能力提出质疑，不过很少在长者面前表露出来。\n与沙赫里相比，纳穆尔图姆在指导夜间事务方面扮演着更加积极的角色，但她的想法经常遭到战士和（令人有些意外的）维齐尔的抵制。\n对此感到不满的长者暗中派子嗣去寻找一位比纳穆尔图姆资历更老的阿刹迈，让他们可以唤醒和任命为最长者。\n其在原作中的未来命运\n \n事实证明他们将会成功。纳穆尔图姆的任期将非常短暂，很可能在她的到来后不久，沙赫里就会重新成为最长者。"
 POD_investigate.desc.605110: "在为圣地而战的圣战中，阿萨辛派的名字令人生畏。在所有阿萨辛派中，没有一个名字比贾迈勒的名字更伟大或更可怕。\n作为一名虔诚的穆斯林，贾迈勒在12世纪崭露头角，成为鹰巢的哈里发。他强大的军事勇武和鼓舞人心的信仰使他成为哈基姆派政治中“穆斯林”派系的非正式领袖，想与[Glossary('阿什拉派','game_concept_ashirra_desc')]运动建立更密切的关系。\n\n其在原作中的未来命运\n贾迈勒将在1497年，即可耻的推罗协议之后接任最长者。作为一个狡猾而追求效率的领导者，他的信仰将注定他的毁灭。当乌尔·舒尔吉出现时，贾迈勒将是第一个拒绝背弃其信仰的人。他的惩罚将是迅速而无情的。"
 POD_investigate.desc.790164: "作为凡人，忒弥斯是托勒密军队中的一名士兵，与克莉奥帕特拉及其罗马盟友作战。托勒密倒台后，角斗竞技开始流行。埃及人忒弥斯证明了自己是一位可怕的角斗士，然后赢得了一名富有的叙利亚布商的注意，并买下了他。就在这个时候，阿刹迈的萨赫里也注意到了这个有前途的新人。\n在能杀多少就杀多少罗马人的前景诱惑下，忒弥斯渴望得到$pod_Embrace$。到了12世纪，他已经成为刀锋之网的领袖。这个密教内部的非正式教派是为了纪念据说是哈基姆的先驱，乌尔·舒尔吉的回归。\n这个人物具有破坏性和虐杀事迹的故事使得刀锋之网，和忒弥斯本人，在阿拉穆特内部分裂出一个派别。他的立场与贾迈勒的穆斯林和阿什拉夫的旧卫都是对立的，而这位埃及人可以依靠他那些密教分子的狂热占据上风。\n\n其在原作中的未来命运\n忒弥斯的胜利会来得很慢，但将在2000年代初到来。随着乌尔·舒尔吉的回归和贾迈勒的覆灭，忒弥斯将占据他应有的位置，成为有史以来最强大的生物之一的心腹。"
 POD_investigate.desc.790166: "阿什拉夫曾经是一位凡人法师。作为恶魔猎手，他在还是凡人的时候就与哈基姆和他的后嗣结盟。而作为哈基姆的子嗣们中的活人，这激发了他们的嫉妒，他们密谋要杀死他。然而，事实证明，这位施法者是一位强大的对手，他一人杀死了10位攻击者，其中包括一位受宠的哈基姆本人的子嗣。认为阿什拉夫杀死他的子嗣是为了篡夺他的位置的[Glossary('上古耆宿','game_concept_antediluvian_desc')]大发雷霆，双方争吵不休，如果不是乌尔·舒尔吉出面调停，就将发生冲突。他平息了局势，消除了双方的偏见。哈基姆的反应是带走了阿什拉夫的左臂和眼睛，以补偿他失去的子嗣，并命令乌尔·舒尔吉通过$pod_Embrace$救他。\n从那时起，阿什拉夫担任了鹰巢的领头术者，参加了第二次巴力之战，并完善了山地要塞的奥术保护措施。当血咒被施加到$pod_clan$身上时，阿什拉夫经历了解除血咒的研究。他在他的$pod_clan$内成为一个令人敬畏和恐惧的人物，特别是在战士种姓中，他们不信任他，有时还把破解的缓慢进展归咎于他。然而，从阿什拉夫的研究中，产生了护身符和炼金术药水，可以创造出人造$pod_diablerie$。\n\n其在原作中的未来命运\n阿什拉夫将在2000年初他的尊长掌控鹰巢时离开。他将召集他的追随者，成立分裂派，并与秘盟结盟。"
 POD_investigate.desc.790167: "作为凡人时，特琪洛士曾在亚历山大大帝的军队中服役。作为$pod_clan$维齐尔种姓被$pod_Embraced$的一员，特琪洛士长期以来都相信着哈基姆的子嗣即是审判者的故事。他的大部分时间都在扮演这个角色：在$pod_cainites$之间的争端中作为匿名仲裁者，在优士丁尼法典编纂过程中待在拜占庭宫廷，或者像猎狼一样游荡，杀死他的敌人。\n特琪洛士曾担任过维齐尔，第一次是在1204年君士坦丁堡被洗劫后，但时间很短。他还曾在卷轴议会中担任过一段时间的尘与骨之席。虽然是维齐尔种姓，但他认为自己是个军事家，不管战士种姓的人对这种称呼有什么样的看法。\n特琪洛士一直表现出对军事历史和战术的天赋，与他作为一个语言大师的技能相媲美。\n其在原作中的未来命运\n \n在分裂时期，特琪洛士将成为阿什拉夫的得力助手。他敏锐的外交洞察力将使他成为秘盟的首位阿刹迈巡行裁决官。"
 POD_investigate.desc.790523: "在那个帝国既没有名字也没有边界的年代，伊希姆·乌尔·巴尔作为巴比伦一位术士亲王的第七个儿子而出生。在那时，怪物们仍然行走于人类之间。这个小王子从小就被长者们培养成神，通过每晚注入神性，使他获得了远超凡俗的寿命。各种各样的财富和荣华，凡人的规条和超凡的血律，统治将他视为神明的凡人们的方法——包括但不限于这些的知识都将帮助三重蒙福实现他的每一个愿望。\n从那以后，伊希姆一生都是以阿卡德先知、苏菲派诗人、科普特血神、波斯恶魔学家等身份度过的。\n在最后一次巴力战争中，他与阿刹迈最伟大的战士一同前往被遗忘的城市哥拉汛，并在之后被崇魔者俘虏。但巴力没有杀死他们，而是挑选了伊希姆和其他十二名战士，利用他们强大的生命力，向阿刹迈氏族的所有血族释放了第一个血咒，令他们的战士只能用血族的血液来缓解血渴。直到今夜，他仍然被囚禁在那里，但最糟糕的事情还远没有降临。\n\n其在原作中未来的命运\n伊希姆将会屈从于恶魔，他的真爱会被献祭，而这将让阿刹迈氏族获得比以往还要强大的诅咒。他将永远背离他的人民，但他会在阴暗的塔尔玛埃拉中占据一席之地，并利用他们实现自己都不感肯定的议程。"
 POD_investigate.desc.790168: "法蒂玛出生于阿尔莫哈德摩尔人的战士家庭，并在十字军东征期间与真主卫士并肩作战。她的热情和技巧引起了刀锋之网阿刹迈的注意。他们对法蒂玛印象深刻，然后经过反复辩论，他们决定打破不初拥女人的古老戒律。\n法蒂玛被带到鹰巢，被埃及的穆拉忒弥斯再造，并被训练成终极刺客。\n最近，法蒂玛以优异的成绩完成了她的第一个真正的任务，那就是带领一小众阿刹迈去破坏梵卓的第四次十字军东征。她勾引了他们的领袖，于格·德克莱尔沃，并成功杀死了他，同时摧毁了大多十字军的精神。也正是在那里，她遇到了某阿拉贡的卢西塔，他们的道路似乎注定要再次相遇。\n\n其在原作中的未来命运\n法蒂玛的事业才刚刚开始，她还有许多令人印象深刻的壮举。其中比较光荣的是刺杀大主教安布罗西奥.路易斯.蒙卡达。在阿刹迈分裂期间，她会自然而然地与乌尔·舒尔吉结盟，因为她对真主的信仰仍将一如既往地坚定。"
 POD_investigate.desc.790219: "记载称，阿诺什出生于古波斯。出身卑微且生来就有异象的他在凡人时期，为聚集在黄金之神（历史上称为琐罗亚斯德）身边的法师之一。\n他结识了一位对其异象非常感兴趣的抄写员，这一切都关系到一块流着血的奇石。于是他们便一同离开并出发寻找那块石头。他们越接近它，阿诺什的梦就越强烈。他们在夜里旅行，白天则根据学者的需要进行睡眠，当初的阿诺什还不明白这一点。最终，朝圣者们找到了石头，就在这一刻学者露出了他身为$pod_cainite$的本性，并初拥了年轻的预言家。\n两人随后前往非洲，阿诺什目睹了他的[Glossary('尊长','game_concept_Sire_desc')]如何在悲伤的幻觉中开始迷失自我，经常无法控制地哭泣数小时，并不顾一切地拥抱后代。在他少有的清醒时刻，泣之主悲痛地将自己和他的孩子称为“阿拉穆特的失落部族”。\n当他们回到泣石的所在地时，他开始越来越理解他[Glossary('尊长','game_concept_Sire_desc')]的负担，并开始记录他的呓语。在接下来的几个世纪里，失落部族不断壮大，并吸引了为数不多的其他人。\n当阿拉穆特的爪牙成功抓获泣之主时，达斯图尔接手了失落部族的领袖一职。\n\n其在原作中的未来命运 \n阿诺什的失落部族经不起时间的考验，并被一个更古老的势力，塔尔玛埃拉打倒。但阿诺什本人将幸存下来，并成为他们最危险的对手。"
 POD_investigate.desc.605127: "卡里姆在几个世纪前推翻了前任苏丹尼达尔后，一直统治着撒马尔罕。在他受$pod_Embrace$约600年后，他对魔法师和施咒者仍心存芥蒂，这可以追溯到他的凡人兄弟死于巨灵招来的沙暴中。\n当他向鹰巢报告时，他几乎不能容忍自己$pod_clan$的术士，并禁止他们到撒马尔罕来。与其他氏族倒的关系不错，只要他们不挑战他的权威。\n卡里姆对术士的不信任最近给他带来了麻烦。几年前，他亲自带领一小队哈基姆派来到一个术者出没的巢穴。其中一个人在临死前诅咒卡里姆要承受尸体般的麻木。苏丹已经开始失去触觉，这个诅咒可能很快就会吞噬他的甚至更多。"
 POD_investigate.desc.790736: "以腓尼基国王的身份出生，以斯玛鲁沙二世只为历史学家所知道他的空墓。对于吸血鬼的世界而言，他仍然是个在耳语中传说的故事，但这个故事基于一个他们都曾见过并感受到力量的生物。\n以斯玛鲁沙的$pod_Embrace$是一个失败的谦卑教训。为了压服这位国王，他的[Glossary('尊长','game_concept_Sire_desc')]试图掌控他。然而，以斯玛鲁沙拒绝退位，相信他的统治是神圣的命令。如果其他吸血鬼作为夜晚的暴君统治，他将成为他们所有人的神。他的计划被一群吸血鬼长者打断，被迫陷入这样的境地，他的愤怒并未消退。他被迫离开家园，对任何他认为是威胁的人进行攻击，成为一个看不见的捕食者，攻击之前或之后从未被发现。\n\n其在原作中的未来命运 \n黑之玛丽将招募他加入她打开地狱之门的计划，他将把她的阴谋视为重新主宰他人意志的绝佳机会。"
 POD_investigate.desc.790190: "就像他的玛土撒拉兄弟姐妹一样，查古拉普夏在几个世纪中经历了许多事情。他既是仆人又是征服者，既是救主又是怪物，既是野兽又是哲学家。然而，无论他的兄弟姐妹们扮演什么角色，提出什么要求，有一种责任在他们之间始终独属于查古拉普夏一人：忠诚。查古拉普夏的每个兄弟姐妹最终都背弃了吒婆多修罗的指令，只有他坚定不移地继续坚持他始祖的要求。\n他曾作为凡人的历史也许除了雷伏诺开创者的其他子嗣，早已湮没在岁月的长河中，被所有人遗忘。作为吒婆多修罗的军阀，他的职责是他唯一需要的角色。尽管更多具有批判精神的挪得学家可能会认为雷夫诺开创者讨伐[Glossary('万鬼','game_concept_kuei_jin_desc')]的神圣使命充其量只是自封的，最坏的情况是自作主张的虚构，但查古拉普夏并没有给出任何迹象表明他$pod_clan$的起源故事是不折不扣的事实。\n查古拉普夏浪费了足够的时间来满足他的喜好。剩下的最年长的雷伏诺无意见到自己的$pod_clan$被拆散，并希望将雷伏诺重建到比$pod_clan$以前所知的成就更高。\n\n其在原作中的未来命运\n查古拉普夏永远不会取得真正的胜利，但也从未真正地放弃过。他那浪荡的兄弟在现代之夜的归来将可能帮助他打破永恒之战的僵局。"
 POD_investigate.desc.790631: "以利米勒是圣经《路得记》述中拿俄米的丈夫。他受到一名不明身份的袭击者地攻击并赐予初拥。拿俄米发现她的丈夫在田野里游荡——一个冰冷的、不死的、空洞的躯壳。于是她把丈夫安放在一个无名浅坟里。三天后，以利米勒疯疯癫癫地爬起来，忍受着任何喷泉都无法解决的渴求。\n他外出寻找家人，最终在几个月后在另一个国家找到了他们。但疯狂冲昏了以利米勒的头脑而导致他撕开了他两个儿子的喉咙来杀死他们。当他恢复理智后，以利米勒诅咒自己和他那可恨的亡生。\n于是，他就判处自己过着孤独的生活，靠吸牲畜和熟睡的旅人为生。几代人过去了，以利米勒赫意识到自己的诅咒永远不会结束，老吸血鬼本就脆弱的心灵失去了对现实的掌控。\n以利米勒的旅行最终让他找到了真黑手。虽然组织认为他太不可预测，无法完全信任，但同时他也很老很强大，以至于他们无法拒绝他。\n\n其在原作中的未来命运\n以利米勒对理智的脆弱坚持终于会彻底打破，他终归会认为自己是一位塔尔玛埃拉的卑微[ghoul|E]仆从。"
 POD_investigate.desc.605123: "在凡躯之时，迦𫄨里璃是一名嗜血的战士，他以他非人道和侵略性的行为而闻名，为此他最终被初拥了。在迦𫄨里璃身上，长老发现了分享其后代感官的能力，然后让他秘密地成为了军团的一员，允许它在被选中的后代中寄宿，并收获他们探索的知识。\n他的[Glossary('尊长','game_concept_Sire_desc')]允许迦𫄨里璃按其想法行事。迦𫄨里璃试图顶替战神迦𫄨吉夜，却看穿了婆罗门把他们的真信当作武器的伪装。\n作为一个将整个印度视为其个人狩猎场的多臂玛土撒拉，迦𫄨里璃不允许任何吸血鬼进入它的领地，除非是被它血缚过的。闯入者会受到强大血仆的袭击，这些血仆被称为药叉，它们被塑造成猿猴的模样。在亚历山大大帝的征服下，迦𫄨里璃与入侵的$pod_cainite$进行了斗争。他与居住在斯里兰卡岛上诺斯费拉图避难所里的玛土撒拉作战，并取得了胜利。\n\n其在原作中的未来命运 \n迦𫄨里璃将陷入$pod_torpor$，并把他的领地留给他众多的子嗣们照顾。"
 POD_investigate.desc.791166: "在仍然活跃的提婆檀那婆中，基安的地位最高，他是数条奇术道途路径的大师，并利用它们来支持萨洛比的意志和阻挠睿魔尔。基安尊重罗德里尔，但他敏锐地意识到牧人并不认同他的信仰，对他的宗教仪式被商品化入另一位吸血鬼手中而感到不满。他知道自己也会在颤抖的獠牙下灭亡，所以他继续支持这个联盟，但不忠的种子随时都有可能发芽。\n随着他的长辈们在数年前遇到了终焉之死或沉入$pod_torpor$，基安发现越来越难以控制他的血系中的阿修罗派系。"
 POD_investigate.desc.791112: "达楠女皇在奥拉尔山附近的龙穴掌控着皇朝。模仿者居住在她皇朝大部分丛林中的凶民的传统，让每个访客都要带一份见面礼。\n她并非专制者或暴君，只要众人恪守应有的敬意，便乐于任其各自追寻道途。但她也绝非宽宥之人，至今仍对侵占她北部边界的黄帝皇朝心存怨恨。\n与一些雷伏诺的想法相反，达楠远非在永恒之战的对抗他们$pod_clan$的关键人物——她非常乐意处理内政，让她的年轻将军和激进派系们为她处理军事事务。\n\n其在原作中的未来命运\n为寻觅合格继任者而长期延缓自身启蒙的达楠，终将在某夜悄然消逝。而这将使朱雀皇朝陷入混乱，为披耶·帕永的血腥升华铺平道路。\n后世有推论认为，不告而别正是达楠对披耶的眷顾——唯有在混沌熔炉中，后者的哲学方能得以印证。"
 POD_investigate.desc.790161: "卢克丽霞是克劳狄乌斯·乔凡尼的曾曾孙女，她出生在意大利与瑞士交界的山地中。自记事起，卢克丽霞便被耳畔若有若无的窃窃私语折磨，并被关进一所精神病院当中，许多乔凡尼家族的成员去那儿寻找她并渴求$pod_Embrace$，尽管克劳狄乌斯毫不留情地驱赶他们。\n当克劳狄乌斯失宠于他的父亲，即$pod_clan$之长奥古斯都·乔凡尼时，卢克丽霞将自己的父母统统毒死，以报复幽闭之仇。随着克劳狄乌斯之星陨落，安布罗吉奥之星升起，当奥古斯都向后者降下恩宠时，他便请求将克劳狄乌斯预定的后嗣据为己有。\n卢克丽霞为安布罗吉奥完成种种神秘的任务，包括帮助他寻找如《光明录》和《萨尔贡残篇》等秘典，这使二人成为了坚定的盟友。然而，卢克丽霞也承受着迫在眉睫的求死愿望的折磨，这驱使她为了实现自己的愿望而不惜冒各种可怕的风险。\n\n其在原作中的未来命运\n卢克丽霞将站在她[Glossary('尊长','game_concept_Sire_desc')]的身边，直至痛苦之终，躲避她所寻求的死亡。"
 POD_investigate.desc.790557: "阿卡狄奥斯曾担任过驻扎在伦蒂尼恩的罗马军团的禁卫军司令官。他是马库斯·维鲁斯的指挥官、战友和情人。公元192年，密特拉$pod_Embraced$了维鲁斯，这位士兵立即转过身来，也向阿卡狄奥斯提供永生。这位禁卫军拒绝了，因为他不会放弃对罗马的责任。在他退休近三十年后，他终于接受了。\n阿卡狄奥斯轻松地接受了黑夜的衣钵，像曾经为罗马皇帝服务一样为密特拉服务。在维鲁斯的指导和密特拉之血的帮助下，他在密特拉密教的队伍中迅速崛起。不过，他傲慢的举止和不愿意适应当地的风俗习惯，使他在英格兰人中没有盟友。\n现在，阿卡狄奥斯是巴斯自由封地的执政官和密特拉教的教主，他既被视为不受关注的暴君，也被视为信仰的捍卫者。\n其在原作中的未来命运\n阿卡狄奥斯会忠心耿耿地服务，但却无法阻止阿瓦隆诸郡的缓慢衰落。在现代的夜晚，他是一个被遗忘的传奇。"
 POD_investigate.desc.790982: "尽管身为一名妥芮朵，贝娅特丽克丝在爱之皇庭中是个异类，因为她的后裔在法兰西并不多见。因此，这位狡猾而野心勃勃的政治家玩起了漫长的游戏，起初她拒绝了女王的头衔，以便在她的挚友埃丝克拉蒙德能为此在她需要时提供帮助。\n事实上，贝娅特丽克丝没有真正意义上的朋友，只有棋子。她的野心是无止境的，甚至是周围的一切都要被焚毁也在所不惜，她打算夺取图卢兹，再来是法兰西。\n其在原作中的未来命运\n在不到两个世纪的时间里，贝娅特丽克丝将实现她的目标，确保自己完全掌控法兰西。只有一场革命才能对她的权威产生影响……"
 POD_investigate.desc.790172: "尽管年纪轻轻，科英布拉的吉列尔莫亲王在他的亡生中已经取得了很多成就。他通过武力从他那身为穆斯林的前任手中夺取了亲王领，此后，他转而担任[Glossary('阿什拉派','game_concept_ashirra_desc')]和基督教徒之间的调解人。\n这位年轻的布鲁赫即受到双方温和派的尊重，也受到狂热派的鄙视，他很高兴拥有个慈善的称号，并成为了伊比利亚地区持续纷争的安全港。但有人窃窃私语说，这种仁慈的背后隐藏着恢复迦太基的意愿……"
 POD_investigate.desc.605129: "非斯的苏丹在建城之初就来到了这里。那时他还是个年轻的$pod_cainite$，但已经在寻找一个沉潜好学的地方，从那里记录世界上发生的大事件。随着其他吸血鬼进入这个城市，乌萨玛发现他需要承担苏丹的传统责任，以保持他所期望的宁静。\n很难想象一位更不情愿的君主。伊本·贾巴尔希望尽可能少地与其他$pod_cainites$打交道。因此，他得到了一众辅士的协助，这些人都是熟练的帮手，为他管理城市。与这支有能力的队伍，以及面对伊本·贾巴尔的愤怒的威胁，这城至今保持着和平。但非斯还没有面临真正的威胁。"
 POD_investigate.desc.790127: "关于她的过去了解甚少，但卡西那出现在开罗最严重的一次瘟疫期间。她成为幻梦的创始人之一，关注着沉眠之主（一位$pod_torpor$中的古老赛特人）的状况以及宫廷的内部结构。\n她发现了哈特谢普苏特制定的太阳王祭礼的机制，该祭礼可以放大任何形式的真信，并将其指向沉睡的玛土撒拉。这对她负责的使命构成了直接威胁，由于无法直接对敌人进行打击，她制定了一个新计划，通过一切必要手段侵蚀开罗居民的信仰。\n其在原作中的未来命运\n卡西那将会过晚地了解到，即使沉眠之主也有噩梦。"
 POD_investigate.desc.790648: "在易扬伽仍然是一个凡人的时候，她是一个古祖鲁人部落的萨满。她精准地掌握着多变的术法力量，她能够变形，并且精通通灵术。公元5世纪，一个被称为“埃及人”的吸血鬼开始以她的族人为食。为了保护她的族人，她利用她的术法和那个怪物展开了战斗，两人几乎同归于尽。直到她那和她不相上下的敌人在她濒临死亡时[Glossary('初拥','game_concept_Embrace_desc')]了她，才宣告了这场斗争的结束。\n在接下来的一个星期里，易扬伽和埃及人互相向对方传授各自的秘密；一周结束时，当易扬伽的[Glossary('尊长','game_concept_Sire_desc')]提出要回到她的族人身边，让他们成为他的牧群时，易扬伽用木桩刺穿了他的心脏，然后看着他在日出中燃烧。\n其在原作中未来的命运\n易扬伽的旅行癖将指引她前往陌生的新大陆。她最终将定居在芝加哥，并成为这座城市最有影响力的[primogen|E]。"
 POD_investigate.desc.790878: "马克·德·布拉班特出生于法兰西的十字军东征时代，在本笃会的修道院里长大。他16岁时离家出走，并迈入各种农业工作中艰难地度过一生。当他加入儿童十字军而来到马赛时，他的生活发生了变化。在那里，天真和理想主义的年轻流浪者们被无良的商人以提供前往圣地的免费通道的名义，给他们戴上镣铐，然后在北非的奴隶市场上把他们作为货物出售。他最后成了一个阿尔及利亚商人的仆从，而这名商人发现马克有非凡的记忆力。\n当他的主人试图欺骗将成为马克[Glossary('尊长','game_concept_Sire_desc')]的血族，布里斯托尔的梅根时，她立即让马克是要这位阿尔及利亚人耻辱死亡或将自己的财富和财产过继给他两者之间做出选择。接下来，梅根给马克提供了一个两条道路：作为独立商人生活下去，或者作为她的副手接受她的$pod_Embrace$。马克最终选择加入了不死族的行列。他和他的[Glossary('尊长','game_concept_Sire_desc')]还有祖尊长在欧洲和地中海盆地游荡，为一个贸易与银行的帝国奠定了基础。\n其在原作中的未来命运\n马克的帝国只会越来越强盛，使他成为有史以来最富有的$pod_cainites$之一。但他的道德观会受到影响，使许多人都会害怕这位暗影亲王。"
 POD_investigate.desc.605103: "阿达纳是一位身材娇小的金发女郎，有着狭长的蓝眼睛和尖锐的特征。她穿的是男式剪裁的衣服；人们希望她说话的时候能带点沙场的口音。她充当魔鬼的代言人，鼓励改变——但不是盲目地。阿达纳经常操纵他人宣布他们的立场，以便她可以站在反对的那一方。\n作为普罗米修斯派的死忠，阿达纳是一名精明的政治家，并赢得了哈德施塔特勉强的尊重，尽管他们的理念有冲突。\n其在原作中的未来命运\n阿达纳将成为秘盟的创始人之一，第一个布鲁赫巡行裁决官，而据推测她还是秘盟强大而隐秘的内环的成员。"
 POD_investigate.desc.790246: "伊扎克出生于布拉格，是一位犹太拉比的独子，他接受过几种语言的教育，拥有一个快乐的童年。由于恐惧布拉格日益动荡的局势，他和他的家人搬到了克拉科夫。10年后，在他的父亲去世时，伊扎克震惊地发现一个和他记忆中的容貌相差无几的妓女参加了葬礼。\n后来，他在和那名妓女的交流中知道了一些信息：他的父亲并不是她的顾客，而是她的一位同伴，他的父亲曾和她的同伴们谈过一些十分深奥的话题。很快，伊扎克发现自己被她的同伴们吸引了。几年后，娜塔希亚向他坦白了自己的本性，而伊扎克的第一反应是同情和关心，他认为没有人应该受到这样的诅咒。这一仁慈的言论使娜塔希亚产生了这样的想法:这种悲悯必须得到保存。于是娜塔希亚给予了他$pod_Embrace$。他现在游走在波兰各地，帮助那些需要帮助的人，以建设一个更美好的未来。\n其在原作中未来的命运\n尽管波兰将遭受许多挫折和无数苦难，但伊扎克从未停止过他的努力。这位有史以来最仁慈的$pod_cainites$之一将会在1939年的华沙大轰炸中迎来终结。"
 POD_investigate.desc.605121: "在棘秘魑的土地上出生和长大，鲁托尔是为战争而生的。而这就是他所去做的，他的主人认为他被血缚所控制。但鲁托尔对它有免疫，最终背叛了棘秘魑，获得了睿魔尔的$pod_Embrace$作为奖励。\n然而，在睿魔尔$pod_clan$固化的结构中，鲁托尔的不满和叛逆程度不亚于他在棘秘魑的表现。离开塞奥里斯后，他远赴东欧，创建了一个属于自己的根据地。他的目光投向了哥本哈根，他打算迅速采取行动，因为他知道睿魔尔很可能不会很快原谅他的背叛……\n\n其在原作中的未来命运\n他们的确没有。鲁托尔将在几个世纪内勉强躲过他$pod_clan$的怒火，逃往新世界且更远。讽刺的是，终结他的不是睿魔尔，而是另一个新起的$pod_clan$……"
 POD_investigate.desc.505107: "睿魔尔本人唯一的真正子嗣，古林格罗斯是睿魔尔家族的一名魔法师，他通过法师历史中一次重大的背叛赢得了他的$pod_Embrace$。事实上，古林格罗斯是被称为“前睿魔尔”魔法师，他在公元1210年迷雾峰陷落时也在场。迷雾峰的灭亡可以直接归功于他：他短暂地降低了盟誓之地的魔法防御，使迷雾峰的术者们在石匠兄弟会的大炮面前不堪一击。这一行为是新生的理性之子和赫耳墨斯秘会之间潜规则变化的催化剂。\n在原作中的未来命运\n在格拉崔克斯的背叛之后，古林格罗斯将被提升入七人议会，从他的罗马圣堂监督西欧。然后，他将成为第二次魔煞之战的掌舵人，对抗赫耳墨斯秘会。"
 POD_investigate.desc.790143: "马库斯·穆萨·乔凡尼是克劳狄乌斯最年轻的曾孙嗣，因其敏锐的好奇心和敏锐的智力而被纳入$pod_clan$。被$pod_Embraced$后，他就证明自己是位杰出的学者，最重要的是他是位优秀的历史学家。\n他被派往君士坦丁堡，与阿莱克茜娅·西乌萨一起帮助拉丁$pod_cainites$在该城建立一个基地。红胡子乔凡尼在苦难十字军中幸存下来，并在君士坦丁堡被洗劫后继续寻找被遗忘者的图书馆。他取得了某种程度的成功：他被复生者俘虏，并被带到拉撒路的巢穴，被引入了玛土撒拉的计划，以实现神化。然而，他设法逃脱了，并加入了康斯坦西娅的计划，携带着圣典到埃尔吉耶斯去。在接下来的斗争中，圣典不情愿地被拉撒路毁掉了，他砸碎了自己巢穴的天花板，带走了所有的入侵者。现在，马库斯与安德烈亚斯的商队一起旅行，任务是摧毁幻梦的残余。\n在这一努力中，他将在帮助迈卡·维科斯和他的小圈子揭穿玛土撒拉作为异端大主教尼基塔的诡计后，在面对魔龙时遭受终焉之死。在那时，棘秘魑[Glossary('上古耆宿','game_concept_antediluvian_desc')]占有了伊利亚什的身体，并徒手穿胸撕下了乔凡尼的心脏。"
 POD_investigate.desc.790155: "狄奥尼修斯是希腊一名酒商的儿子，在他的父母死于一场致命的疾病后，他继承了葡萄园。他决心找到一种方法再次联系他的家人，最终遇到了一个崇拜珀耳塞福涅的密教组织，据传该组织能够联系[UmbraGlossaryLocalized('shadowlands','冥界')]。\n他控制了这个密教，并允许所有来他们面前的人再次联系过世亲人。这吸引了卡帕多西亚的注意，雅弗亲自拜访了狄奥尼修斯。经过长时间的讨论，雅弗$pod_Embraced$了这位年轻人。然而，狄奥尼修斯并没有堕落入他$pod_clan$的病态习惯，他拒绝了骸骨之路，而选择了雅典条约建立的人性之路。\n他关心活人和死人，从他的葡萄园里免费给他们建立坟墓，埋葬穷人，并在活人、死人和不死族中保持着许多联系。最终，他被宣布为雅典亲王。随着君士坦丁堡的陷落，狄奥尼修斯寻找办法来确保希腊的独立，以对抗逃亡的$pod_cainites$，该其中有许多者之路的追随者和他心路的反对者。"
 POD_investigate.desc.790118: "埃里克·朗托斯也许是狂徒最暴力的打手之一，在斯堪的纳维亚的[Glossary('英灵战士','game_concept_einherjar_desc')]中是一位不朽的传奇。朗托斯因反对金发哈拉尔入侵挪威而被[Glossary('初拥','game_concept_Embrace_desc')]，他在$pod_Embrace$前后杀了近50人。\n埃里克在斯堪的纳维亚是一个被追捕的生物，只有他与自由邦的结盟才使他免遭报复。但事实证明他本身就是个问题，因为他勉强控制的愤怒开始沸腾了。埃里克想要杀死基督徒、梵卓、勒森魃——或其他任何没有现在杀死这些生物的人。\n其在原作中的未来命运 \n朗托斯将听从喀喇的召唤，成为原始教徒世界最后一战中的一部分。他将在倒下之前使许多敌人见到他们的上帝。"
 POD_investigate.desc.505082: "亚历山大于基督教诞生前的七个世纪在雅典被[Glossary('初拥','game_concept_Embrace_desc')]。随着年龄的增长，他变得过于自信并最终前往巴黎，然后在罗马灭亡后的许多个世纪里成为该城镇的亲王。在巴黎，他创建了自己的大皇庭，在几位妥芮朵长者的合作下，他利用恐惧和正义进行统治。公元800年左右，他将法兰克家族的查理曼置于自己的羽翼之下，支持神圣罗马帝国的建立，但随着时间的推移，他的统治变得暴虐，他的痴迷和嫉妒横行无忌。\n然而，在他的王妃洛林（萨莉安娜女王的子嗣）逃离他之后，他在一次嫉妒的愤怒中毁掉了她，他赢得了弑杀最爱之物的名声。这导致法兰西妥芮朵撤回对其大皇庭的支持，使他陷入孤立。在亚历山大的子嗣，若弗鲁瓦的帮助下，这位玛土撒拉终于在1222年被推翻，并被放逐出爱之王庭的领土。\n亚历山大前往约根领主统治的德意志城镇马格德堡避难，在那里他谋划着赢回自己的领地。\n\n其在原作中的未来命运 \n在寻求以赢得哈德施塔特的支持的过程中，亚历山大将对利沃尼亚野者发动战争。尽管亚历山大在那里取得了压倒性的初步成功，但他将在战斗中被野者的领袖且正在引导特亚维神的力量的蒙古冈格罗——喀喇打败并[Glossary('吸榨','game_concept_diablerie_desc')]。"
 POD_investigate.desc.790212: "在第一次十字军东征期间，哈立德是穆斯林的战争领袖，在十字军那里赢得血腥的声誉，并犯下了许多暴行。他被一个拜占庭的诺斯费拉图[Glossary('初拥','game_concept_Embrace_desc')]，后者认为将伊斯兰教的影响赶出巴勒斯坦最安全的方式就是腐蚀他们的领导人。哈立德对他$pod_Embrace$的第一反应是暴力的血狂，并夺去了他许多追随者的生命。随后哈立德被一位犹太隐士从太阳的光芒中拯救出来，并向他传授了有关他的现状和浩恩永生的知识。在他旅行到伊斯兰教的各个圣地时，他了解到[golconda|E]，并致力于这种摸索。从那时起，哈立德一直在寻找这样的状态，但每当他似乎要接近它时，他的心兽就会驱使他远离。\n其在原作中的未来命运\n哈立德将于1871年来到芝加哥，寻找遁世会中的一员。尽管他最初支持洛丁的亲王领，但他很快就会对洛丁产生不满，并投票推翻他。在一场洪水中，他将被赶出他的下水道领域，而狼人入侵芝加哥时，哈立德将是少数设法组织防御并亲手杀死许多狼人的血族之一。这次壮举之后，他将再次离开，像往常一样寻找[golconda|E]。"
 POD_investigate.desc.790955: "比斯塔克的心中充满了怨恨。鹰巢的长者们在发现她尊长在大马士革进行崇魔交易后强迫她目睹他[Glossary('尊长','game_concept_Sire_desc')]的毁灭。当她得知城中的妥芮朵卷入其中时，她发誓要向他们所有人复仇。\n如今她作为间谍被派往那座该死的城市，比斯塔克希望在慢慢摧毁他们之前羞辱他们并揭露他们的怪物身份。她现在仍在慢慢玩收集信息的游戏，但很快，她将开始她的梦，焚烧整个崇魔者的巢穴。\n\n其在原作中的未来命运\n因为一个老盟友前来牵制，比斯塔克将在没有太多友军火力的的情况下净化大马士革的邪恶。之后，她将以守护者的身份守护这座城市。她以不灭的热情执行这项任务直到今天。"
 POD_investigate.desc.790148: "阿里沙特是阿扎那利的第一位子嗣，他以阿扎那利为榜样，被哥拉汛投下的阴影所重塑。在她[Glossary('尊长','game_concept_Sire_desc')]的要求下，她被派往黑暗贤士的船员那里，由亚历桑德罗·马特尔–桑多瓦尔控制的尖嚎之道上的勒森魃海盗团。阿里沙特轻松地从他手中夺取了乐队的控制权，并控制了船上的风琴位。然后她充当了黑天使的大使。她因对幽暗术的出色掌控而闻名。"
 POD_investigate.desc.505093: "自从哈基姆离开后，被称为沙赫里的隐居术士一直是鹰巢的最长者。他能够手握这一危险的头衔是因为$pod_clan$中有着这样一个共识：他在$pod_clan$的政治中没有任何的作用。\n最近，哈基姆的另一个孩子纳穆尔图姆来到鹰巢，从沙赫里那里接过了最长者的头衔，沙希里很高兴地把它留给了她。但是这位新的最长者过于新潮的观点正在鹰巢的政治场中酝酿着麻烦，许多人正在密谋让沙赫里这位老巫师重新登上王位。\n\n其在原作中未来的命运\n纳穆尔图姆的统治是短暂的，沙赫里将夺回他的头衔，直到睿魔尔之咒。随着阿刹迈$pod_clan$的分裂，沙赫里也将自杀。"
 POD_investigate.desc.791152: "被称为米拉日巴的吸血鬼隐居在喜马拉雅山的高处，据说有可能成就了[golconda|E]。米拉日巴天生是个和平主义者（和他的大多数血系一样），他与居住在他休息的洞穴附近的藏族寺院（强大的圣地）的星占狼族享有和平甚至有些友好的关系。由于活着时候的荨麻膳食习惯，他在不死族状态下还保留着绿色的头发。\n他在他所知的火焚末日/怒嚎末日即将来临的最后岁月里扮演菩萨。米拉日巴有很强的自卫能力（但总是不杀生），他游历广泛，研究古代和现代科学。"
 POD_investigate.desc.790205: "特黎佛撒可能是古罗马最有影响力的末卡维，她是罗马不死族领袖卡米拉亲王的贴身侍卫。她扮演的这个角色所受到的极大尊重，都反映在末卡维$pod_clan$身上，毕竟当时的末卡维被认为是国王的顾问，而不是像现在这样的疯子。\n特黎佛撒最显著的成就是她不遗余力地想摧毁迦太基，也是她动摇了卡米拉来发动布匿战争，夷平了这座受诅之城的一切痕迹。\n特黎佛撒的目的已经达到，在卡米拉$pod_torpor$之后，她便退居二线，但仍然受到老一辈$pod_cainites$的尊重。\n其在原作中的未来命运\n特黎佛撒将在卡米拉$pod_torpor$后，代替卡米拉夺取罗马亲王领。她将参与大玩笑，剥夺末卡维$pod_clan$的疯狂术，最后在2013年被裁判官摧毁。"
 POD_investigate.desc.790229: "罗伯特名义上是密特拉的附庸，但事实上他是独立的，密特拉并不在意这一事实并只要求适当的尊重。只要爱丁堡的亲王在苏格兰的领地得到保障，他也不介意对密特拉大加赞赏。\n罗伯特是个狡猾的人，他从长计议，深知密特拉会再次感到厌烦，而阿瓦隆没有他的“神”就会崩溃。当这种情况发生时，罗伯特希望爱丁堡会足够强大，抵御风暴并因此变得更加强大，当然是要在他的领导下。如果需要的话，这位妥芮朵不介意结成不光彩的同盟和交易来达到这个目的……\n其在原作中的未来命运\n在某种程度上，罗伯特的计划将会实现。爱丁堡的确成为了密特拉之后的英格兰核心力量之一，但不由罗伯特本人掌舵。"
 POD_investigate.desc.790136: "埃翁为人时是布列塔尼的传教士，为$pod_cainite$时则表现出了非凡的能力。他是天生的演说家，野心勃勃，但又足够狡猾，在他短暂的亡生中，他成功地欺骗了比他年长得多的$pod_cainites$，如巴黎的亚历山大。在阿尔比派十字军期间，他被派去惩罚埃丝克拉蒙德，但埃翁反而在她的帮助下清除了异端的存在，并在没有得到巴黎的准许下自己促成了休战。\n虽然被打上了叛徒的烙印，但由于势力太大，根深蒂固，难以拔除，此后，埃翁在朗格多克的异端中大展拳脚，并将战利品据为己有。他的追随者越来越多，因为虔诚的$pod_cainites$们都被他那似乎无休止的结束异端的热忱所淹没。随着城市的沦陷和埃翁游击队的驻扎，他的影响力和野心的增长速度超过了许多老一辈$pod_cainites$的想象……"
 POD_investigate.desc.790300: "被称为梅琳达·加尔布雷思的女人是一个致命又狡诈的生物。她充分利用她那美丽而又冷酷的外表，还是一位冷酷无情的权力贩子，对达到目的手段几乎没有任何限制。\n不过梅琳达的结局只有她自己知道，因为她没有朋友可言。反正不会太久。少数几个设法接近她的人得谈一个疯狂的野心，疯狂到能摧毁她的任何剩余理智。\n\n其在原作中的未来命运\n梅琳达不会停止往上攀行，直到她站在世界之巅，并成为世界上最强大的党派之一——魔宴的领袖。但即便如此，也不足以满足她那无底线的野心……"
 POD_investigate.desc.790290: "现在回想起来，很难解释究竟是什么让他的[Glossary('尊长','game_concept_Sire_desc')]$pod_Embrace$了伊欧提乌斯，如果他真的是妥芮朵$pod_clan$的始祖，其带领着这位年轻的希腊人进入了黑夜。是他优雅的身体，是他卷曲的金发，是他天使般的声音，还是他对那些心中怀有难以用语言表达的渴望的人们的悲伤和担忧的倾听？现代血族可能永远不会知道。\n不久，伊欧提乌斯作为艺术家和众多有才华、有前途的凡人的赞助人而出名。他的旅途跨过欧洲西海岸到震旦的黄金之地。据说他从神秘的东方血族那里学会了如何从凡人那里取食而不用喝他们的血。据说，仅仅是血畜做爱时深沉而充满激情的呼吸就足以让伊欧提乌斯在这些夜晚感到满足。据传，血之密教会将他作为世界各地不同爱神的化身来祈祷。\n\n其在原作中的未来命运\n伊欧提乌斯于亡生中将继续慵懒地漫游历史，成为一名艺术家、插画家，甚至在现代的夜晚中成为色情片制作人。"
 POD_investigate.desc.790517: "纳芙蒂蒂曾是埃及公主，据本人所说，她在身败名裂之前还当过王后。有人说她是法老埃赫那吞的同名妃子，但其他尊贵的赛特之子（如内弗鲁）可能会质疑这种说法。\n在赛特通过$pod_Embrace$将纳芙蒂蒂从死亡中拯救出来后，她完全接受了自己在$pod_clan$中的新角色，并成为赛特宏愿的最大拥护者之一。纳芙蒂蒂是一个非常自信且知识渊博的血族，她认为没有什么问题是她不能解决的。她认为自己是赛特送给世界的礼物，不过她还没有证明过这一点。\n\n其在原作中的未来命运\n直到在现代柏林拙劣地实施阴谋，纳芙蒂蒂绝对不会做任何值得注意的事情，这证明了过度自信是一个缓慢而阴险的杀手。"
 POD_investigate.desc.790897: "狄俄倪西亚也许是$pod_cainite$历史上最大的骗子，几乎所有狄俄倪索斯的背景都可能是捏造的。如果依旧相信他的话，他其实是希腊神狄俄尼索斯的著名模仿者。他和双胞胎“俄耳甫斯兄弟”一起，潜伏在旧希腊的巴卡纳神秘崇拜中，并成功地在凡人中获得了一批边缘追随者。狄俄倪西亚本人声称自己是埃卢西尼奥秘的一部分，指导大众举行仪式，让珀尔塞福涅返回[UmbraGlossaryLocalized('shadowlands','冥界')]。\n其他著名的说法包括在巴力战争和布匿战争中发挥了关键作用，受到神圣血液的祝福，打破了“静态现实”，并穿越到一处被称为[UmbraGlossary('arcadia')]的界域。\n其在原作中的未来命运\n更多的故事将被该实体宣称，包括自称是末卡维$pod_clan$分割他们的疯狂术$pod_discipline$的仪式──大玩笑的主谋。"
 POD_investigate.desc.791288: "亚历山大大帝的乳母在她的哥哥克雷图斯被她从小照顾的男人处死时自杀了。就在那时，一位天使出现在她面前，为她缝补伤口，让她踏上了漫长的旅程，并结束于几个世纪后她发现了基督教。\n随后，她与最早的圣徒们一起走到了高卢，并将自己确立为这块土地上的亲王，这也是她和她哥哥死去的地方。从那时起，阿拉克里尼斯就成了天国之道信徒的指引，也是他们信仰的典范和最隐秘的导师。即使是她最具攻击性的对手，也无法幸免于围绕她四周的真信灵光。"
 POD_investigate.desc.790272: "兰斯出生于一个德意志的祖传贵族家庭，他认为将基督教和日耳曼法律的光芒带入未开化的世界是他的使命。兰斯的热切和显赫使他引起了德意志统领哈德施塔特的注意，并下令了他的$pod_Embrace$以获得利用奥托大帝新生帝国的工具。\n起初，兰斯被他的国家所排斥，但他开始欣赏这种可能性，以确保神圣罗马帝国和基督教在西方世界保持最高的地位，并安全地掌握在梵卓的手中。从那时起，他就成了哈德施塔特的前线代理人，寻找可能席卷他们领域的动荡和不稳定的来源。"
 POD_investigate.desc.790271: "霍斯特·德·诺瓦腊出生于一个小贵族家庭，是第四个儿子，他对贸易一直有着敏锐的感觉。在父亲的催促下，他听从十字军东征的号召，与异教徒战斗。然而，他的同伴却误入歧途，最终逝于布拉格，霍斯特选择了留在那里。\n在那里，霍斯特遇到了一个在自身对贵族义务的看法以及未来几年这些义务会怎样变化的方面上很感兴趣的人物，也就是自己未来的[Glossary('尊长','game_concept_Sire_desc')]鲁道夫·布兰德尔。于是布兰德尔初拥了他，但两人不知道该如何看待对方。\n当霍斯特与哈德施塔特交手时，由于对方作为长者不忍心看到一位梵卓无目的地流浪，便立刻将他血缚，然后派他去为$pod_clan$保障普鲁士的贸易路线。\n面对原始教徒时，霍斯特发现那些人对他们的崇拜比他对他的救主持着更多的信仰，他尽自己所能干好这份新工作，但却愈发退化成心兽的爪牙，因为自身的心路无法告诉他一个处理异教徒的方法。"
 POD_investigate.desc.790117: "根据他本人所说，他曾是隆德的大主教，也是丹麦最有权势的人之一，国王和$pod_cainites$都听他吹风。在死亡降临后，他崛起成为国家的吸血鬼主宰也是轻而易举。\n他早期的统治是成功的，他小心地平衡了南方的梵卓和北方的野蛮冈格罗。直到一场针对温德的睿魔尔的战役让阿布萨隆分心了几十年，因为他发现了一个可以改变他命运的强大秘密。\n没有他的细心指导，丹麦成了小军阀和流氓冒险家的牺牲品。但这不会持续太久，因为阿布萨隆现在准备回到他的土地上。"
 POD_investigate.desc.790360: "玛乌戈热塔是一个沦为农奴的罗马尼亚贵族的的第六个孩子。作为一个的小农奴，她被格拉崔克斯买下了。格拉崔克斯感觉到这个女孩身上有着强大的力量，便收她为徒。玛乌戈热塔变成了她的主人的粗糙的、不那么细腻的版本，模仿和夸大了他那些最显著特征。到13岁时，她已经成为了一名真正的法师。\n她的胆识和迅速崛起没有为她赢得多少朋友，但给她赢来了其他学徒的钦佩。她恳求格拉崔克斯让她像他一样永生，但格拉崔克斯被七人议会剥夺了$pod_Embrace$的权利。于是，他钻了个空子，把她变成了一位[ghoul|E]。几十年来，她一直恳求他游说睿魔尔议会让她获得真正的永生，最终她终于在曲折的75年后获得了$pod_Embrace$。漫长的等待使她对睿魔尔议会和埃特里乌斯产生了怨恨——她把主人的谨慎归咎于他们。\n当格拉崔克斯因为氏族政治而将被流放到法兰西时，玛乌戈热塔收到了她主人的命令：留下，以破坏埃特里乌斯的统治。当埃特里乌斯离开他位于塞奥里斯的秘所时，玛尔戈热塔开始违抗他的命令，并建立了她自己的忠诚追随者派系，幻想着有一天能取代他。\n\n其在原作中未来的命运\n玛尔戈热塔在大反乱中被捕，并被折磨得精神错乱。玛尔戈热塔会被格拉崔克斯丢在她的牢房里，在腐烂和疯狂中度过几个世纪。直到20世纪初，三个冒险家才让她从这无尽的折磨中得到永恒的解脱。"
 POD_investigate.desc.790142: "彼得罗·乔凡尼被$pod_Embraced$的时间很晚，因为他中庸的才能直到威尼斯商人快到50岁时才展现出来。他真心想学习亡灵术，但却从未表现出实际天赋。他也一直没有了解到“家族长者”的真面目，直到他的商业智慧有了起色。\n在即将沦为一个永远无法踏出平庸的商人时，彼得罗接连做了几笔布局合理的投资和买卖，既是靠运气，也是靠技巧。他在几条从中东穿越东欧的贸易路线上的赌注得到了丰厚的回报，这让家族里的所有人都感到意外。\n这只足以获得家族的血族成员的注意。彼得罗现在负责处理家族在东欧的大量贸易，且随着乔凡尼对该地区兴趣的上升，他自然而然地成为掌管匈牙利和特兰西瓦尼亚的人选。\n\n其在原作中的未来命运\n随着替代性贸易路线的发现，彼得罗在家族中的地位将迅速下降。之后，他将陷入隐姓埋名、默默无闻的境地，直到在第一次世界大战期间失踪。"
 POD_investigate.desc.790141: "克劳狄乌斯·乔凡尼既是奥古斯都·乔凡尼的儿子也是奥古斯都·乔凡尼的子嗣，在奥古斯都被死亡$pod_clan$接纳后不久就被[Glossary('初拥','game_concept_Embrace_desc')]。\n他是他父亲的帮凶，也是唯一一个受托于奥古斯都真正未来计划的人。这让他成为安布罗吉奥·乔凡尼的劲敌，这位出色的“表亲”每一步都在试图阻碍他，比如$pod_Embrace$卢克丽霞·乔凡尼的争夺。\n克劳狄斯相信，他对父亲的忠心耿耿，将会战胜安布罗吉奥那残酷的野心。\n\n其在原作中的未来命运\n克劳狄乌斯将是乔凡尼$pod_clan$大部分计划的一部分，甚至是创造者。他将策划以撒阴谋，导致卡帕多西亚的毁灭，并将亲自[Glossary('吸榨','game_concept_diablerie_desc')]雅弗。但最后，当他在奥古斯都的一次血狂中被毁灭时，他的忠诚和能力终都一文不值。"
 POD_investigate.desc.790249: "古特卡没有关于凡生的记忆，但她记得自己是一位忠于旧神而到森林里去迎接死亡的老妇人。相反，她却迎接到了赐予她$pod_Embrace$的鬼婆芭芭雅噶。\n她相信自己现在是母神的化身，她去寻找波兰的原始教徒然后那些人崇拜她，给予她血和盐的祭品。当她在后来成为克拉科夫的盐矿中陷入$pod_torpor$时，她失去了以人类的简易$pod_vitae$为食的能力，反而要以吸血鬼的血液来填补需求。\n她[Glossary('初拥','game_concept_Embrace_desc')]了多个矿工，并杀死了他们，让他们的尸体保存在她巢穴的盐内。待在矿井内，她变成了一个完全被盐晶包裹的存在，身体佝偻，头髮发霉，手脚虚弱。\n古特卡被自己的病情逼疯了，现在的她只求一死，想要找到自己的[Glossary('尊长','game_concept_Sire_desc')]将她从痛苦中解放出来。\n\n其在原作中的未来命运\n即使芭芭雅噶在1997年终于苏醒，古特卡也永远没能寻死。一个由盐晶制成的狂暴生物的传说一直流传至今。"
 POD_investigate.desc.790459: "在非常守旧的棘秘魑$pod_clan$中，卢戈是一个心生反叛，拒绝为长者之间的棋局而死的吸血鬼。他带领着一小队志同道合的$pod_cainites$，决心创造自己的命运，直到他能回到特兰西瓦尼亚，把那些阴暗的城堡——和它们的领主——全部焚尽，以绝后患。\n\n其在原作中的未来命运\n卢戈将成为棘秘魑$pod_clan$的大反乱之首。在众多长者当中开辟出一条血路，并创造出一种打破血缚的仪式，他亲自对棘秘魑的[Glossary('上古耆宿','game_concept_antediluvian_desc')]所造成的致命一击也将青史留名。当然，真相有些不同……"
 POD_investigate.desc.790568: "具有外交头脑的阿努欣·拉万是迦太基陷落后少数几个在布鲁赫袭击中幸存下来的中东梵卓之一。她完美的举止以及和蔼可亲的气概，隐藏着敏锐的管理和外交头脑。\n她将一个村子的渔民完全血仆化，制造了一队专精化的[Glossary('遗传血仆','game_concept_revenant_desc')]系列，被称作阿努欣·拉万的选民。这些生物作为奴隶、血皿和仆从服务于她。\n围绕着这个被挑选出来的世系，阿努欣小心翼翼地编织着一张谎言之网，她正准备揭开自己那伟大的计划。\n\n其在原作中的未来命运\n秘盟的诞生将给阿努欣带来她所需要的一切。她将在伊亚罗斯岛为$pod_cainites$打造完美的度假场所，其服务在数百年内千古流芳。而与此同时，她的遗传血仆会作为仆从被赠予世界各地……"
 POD_investigate.desc.505092: "艾蒂安从小就知道自己是由罪而生的，他周围的世界在天主眼中都显得不值。当十字军东征的号召发出后，艾蒂安为了获得宽恕，也加入了十字军。\n在前往圣地的路上，艾蒂安被他战友罪恶的举止所驱赶，当他目睹了1099年安条克的大屠杀时，他跪倒在地，亲见基督教和美德战士们所犯下的罪恶，其信仰受到了极大的动摇。就在这时，艾蒂安遇到了瓦西克，瓦西克给他提供了水，并帮助他埋葬死者。两人谈论了很久，有关天主，祂的计划和末日。当瓦西克给他一个机会，让他以永生者的身份为天主服务时，艾蒂安接受了。\n艾蒂安宣称亚柯是他的亲王领（因为没有竞争对手），并在城前定居，守卫着它，防止入侵者利用这个间隙达到自己的目的。随着时间的推移，他建立了一个线人网络，为有需要的吸血鬼提供庇护，且无论他们的宗教和种族。\n\n其在原作中的未来命运\n艾蒂安将忍受中东无数的麻烦，直到今夜仍然统治着亚柯，伪装成一个城边的乞丐。"
 POD_investigate.desc.790371: "米拉贝尔用了各种各样的别名来表明自己的身份，“米拉贝尔”可能不是她的真名。然而，她已经忘记了她过去的大部分细节，任何人都很难确切地知道关于她的任何事情。早在神圣罗马帝国时期，米拉贝尔就已经以随从的身份跟随勒森魃的阿什卡·宾特·加法里，她相信自己是勒森魃领导的教派的真正领袖，丝毫没有意识到他们仅仅只是让她当一个有名无实的官方角色。\n从那以后，米拉贝尔利用“她的”邪教组织实施了几项计划，以加速巴力所渴望的末日的到来，其中就包括为了摧毁塞利维亚而唤醒冈格罗的玛土撒拉。"
 POD_investigate.desc.790235: "卡立夫出生在一个支持原教旨阿萨辛的仆从家庭，他很快就学会了服从和沉默的价值。在他12岁的时候，卡立夫就知道如何使用刀子、绞刑具和剑刃。他还引起了一个名叫瓦希姆的阿刹迈的注意，他在这个男孩身上看到了那些能够承受不死诅咒的人所需要的那种奉献精神。最终，瓦希姆来找他了。\n卡立夫明白自己回不了据点，于是他迅速收集了一切能用的临时武器来抵御未知的跟踪者。这从一开始就注定了是一场失败的努力。整个夜晚，$pod_cainite$与男孩仆从玩起了猫捉老鼠的游戏，同时考验着他的反应能力、智慧、勇气和决心。有一次，男孩甚至给$pod_cainite$成功设了道陷阱，用一根削尖的棍子让他受了点伤。瓦希姆很高兴。以俘虏男孩结束了游戏，然后把他带到了鹰巢。当意识到对方将荣誉赐予他，卡立夫便愿意接受自己作为瓦希姆仆从的角色。\n此后，卡立夫忠实地履行了阿拉穆特的契约，成为阿刹迈的典范。\n\n其在原作中的未来命运\n卡立夫无法认同在屈膝于荆棘大会的主$pod_clan$，这使他将成为第一批叛族者之一。"
 POD_investigate.desc.791127: "冯开颖出生在汉初的封建贵族家庭，是个游手好闲之人，如果不是一场农民起义让他嚎叫着堕入[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]，他很可能会在床上平静地死去。死后，冯开颖发现了自己从未意识到的力量，从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]回归加入了玄武皇朝。\n困扰于缛礼烦仪和昏暗官场，他的亡生直到当他遇见庄子，内引道的创始人后才得以改变。他把新了解的信仰传播得很广，当其他大皇朝对他进行反击时，他吃了一惊，这激起了他内心的强烈愤怒。\n现在，这位传道士成了一名斗士。他带领着内引道的好战派——恨，打击对内引道的任何形式的威胁，无论真假。\n\n其在原作中的未来命运\n随着岁月的流逝，冯开颖的愤怒将继续沸腾，并将成为他亡生的全部目标。因此，内引道将被其狂暴的好战派系所分裂。"
 POD_investigate.desc.790260: "提图斯是位古罗马人，来自共和国时期，若他的说法属实，他在残酷的$pod_cainite$政治中游刃有余，他和蔼可亲的举止很好地掩盖了他的精明。没有人确切知道他的生平，但关于他的传言比比皆是。流传最广的说法是，他根本不是凯撒，而是凯撒的受释奴隶。如果那个时代的梵卓知道真相，他们也不会说出来。阿奎莱亚亲王博学多才，在这个世界上朋友很多，敌人很少，这是一个不容小觑的成就。\n提图斯一点也不拘谨。古老，他从容地保持着年轻的身体。高贵，他拒绝礼节性的距离。他强大，却蔑视仪式和敬意。他的形象是一个统治者，他是自己城市的主人，他不需要这些。\n乔凡尼家族的崛起让这位古罗马人感到担忧，他正在考虑是时候兑现一些旧人情，还是尝试与新崛起的威尼斯人达成协议。毕竟，他们是商人，而提图斯可能是进入新“市场”的一个宝贵的切入点。"
 POD_investigate.desc.790227: "阿尔弗雷德是$pod_cainite$异端的执事，是诺维奇地区最著名的吸血鬼。阿尔弗雷德没有正式的爵位，因为他的信仰几乎不被密特拉所容忍，但他仍然是伦敦地区不二的领主人选。\n事实上，诺维奇对$pod_cainites$来说是一个非常麻烦的地区，前任领主被不明势力谋杀，巴力和赛特之子的邪教在乡村肆虐。因此，至少到目前为止，尽管直言不讳地反对密特拉教，阿尔弗雷德仍然是这一地区领主的最佳人选，这也帮他逃离了危险境地。"
 POD_investigate.desc.791004: "“海盗亲王”是一位臭名昭著的船长，被称为无情且花天酒地的人，宣扬快乐和贪婪高于一切的雷伏诺异端。雅戈也许是他们当中最可怕的倡导者，因为他对财富和权力的不懈追求并没有使他的头脑变得迟钝。\n这位海盗船长确实作为一名精明的外交家甚至是熟练的操纵者而闻名，这帮助他在地中海的每个港口都有联系。最近，雅戈为他的舰队争取到了土伦作为安全港，许多人担心这只是一个突袭和掠夺的新时代起始。\n\n其在原作中的未来命运\n雅戈将会亲手杀了雅戈的亲王，然后再冒充他到邻近的宫廷。没有人会对此猜疑，直到雅戈·卡斯提尔真正掌管了浪潮。"
 POD_investigate.desc.790175: "鹰巢作为阿刹迈$pod_clan$的核心，将伊比利亚穆斯林后援的职责交给了泰贝莎这位可怕的战士和出众的将领。尽管她的使命是受宗教狂热驱使，但她本人并不是什么狂热份子，甚至还会饶了那些想逃离战场的人。\n迄今为止，泰贝莎接受了苏丹巴德尔的统一号召，但对格拉纳达的统治者心存疑虑。她知道任何不团结的事物都会给虔诚的信徒们带来灭顶之灾，所以她对自己的观察保持沉默。"
 POD_investigate.desc.605130: "阿拉兹曾经是伊比利亚的一位牧羊人，他不确定自己是如何流落到马拉喀什的。他可能在保护他的人民不受疯狂的魔物的伤害，也可能是他们中的一员。不过现在他在马拉喀什，阿拉兹看到了真相，玛土撒拉无处不在，随时可以出击。\n这种根深蒂固的信念使他成为一个比原来更不稳定的人，很少有人再挂念他。不过阿拉兹并不关心，因为他是唯一知道发生了什么的人。他并没有说出来。你可能是他们中的一员。"
 POD_investigate.desc.605133: "马塞卢斯曾经是一名为罗马帝国服务的士兵，他花了不少时间，才第一次以$pod_cainite$的身份做出宣称。他选择亚历山大作为他的目标，并利用拜占庭在629年收复该城的行动来掩护他的进攻。马塞卢斯在争夺权力的过程中获得了成功，他开始在这片充满敌意的土地上巩固他新建立的亲王领。\n事实证明，这位军人也是一位能干的经营者，因为他足够精明，避开了仍然一心想要收复埃及的赛特之子$pod_clan$的目光。马塞卢斯正在考虑加深与开罗的关系，以对抗他们在沙漠深处的共同敌人。\n\n其在原作中的未来命运\n马塞卢斯将继续用技巧和谨慎的态度来驾驭埃及的政治，直到他在1952年被残酷刺杀。"
 POD_investigate.desc.791175: "魔蛇鹫生前是一个强大的亡灵术师，与一个同样强大的生命女巫邦卡齐结婚。有一天，魔蛇鹫召唤出了一个强大到无法控制的灵，并间接被害死。邦卡齐哀悼她的丈夫并埋葬了他，但魔蛇鹫在第二天晚上又复活了，因为那个灵在他身上留下了一些力量。魔蛇鹫对自己的新力量感到兴奋，他恳求邦卡齐和他一起变成不死，但她拒绝了，说他们现在必须像太阳和月亮一样。即便如此，邦卡齐还是同意和魔蛇鹫在一起；尽管她认识到对方已经变成了一个怪物但仍然爱着他，心想事成。\n随着岁月的流逝，邦卡齐开始渴望有一个孩子，而魔蛇鹫已经无法满足她的需求。她考虑过为了一个凡人而离开魔蛇鹫，但她的心依旧牵挂着他。因此她转而寻求另一种方式。\n邦卡齐调用她强大的生命魔法，举行了一个伟大的仪式，使她和邦卡齐得以受孕。其结果是一个美丽的女婴，但这个仪式是有代价的。\n作为生与死的产物，这个女孩被他们命名为埃索纳，是一位[Glossary('遗传血仆','game_concept_revenant_desc')]。此外，魔蛇鹫和邦卡齐的精髓已经混合到如此程度，以至于邦卡齐和她的后代将永远对血缚免疫，而魔蛇鹫的世系除了他们之外，再也无法从任何人那里获得饱食。就这样，魔蛇鹫的血系就此开启。"
 POD_investigate.desc.790160: "薇拉是有权有势的纪尧姆的得意子嗣，她被很好的选上，而且被培养得更好。薇拉是一位能干的外交家，也是精明的管理者和公正的亲王，她对纪尧姆来说管理他的领地变得越来越重要。\n当她的[Glossary('尊长','game_concept_Sire_desc')]在关注精神方面的问题时，薇拉确保亲王领像钟表一样运转。而到目前为止，她几乎完美地实现了这一点。\n\n其在原作中的未来命运\n纪尧姆最终将从世俗事务中退休，并把他广泛而丰富的亲王领留给薇拉。她将保证不会让他失望。"
 POD_investigate.desc.605107: "米洛夫是一个非常安静的人，留有后力的象征。他的一双大眼睛会注意到每一个动作和声音，他认识到的东西远比大多数人想象的要多。米洛夫与哈德施塔特的派系关系密切，因其战略头脑和用简明扼要的演讲总结冗长论点的能力而备受尊敬。\n\n其在原作中的未来命运\n米洛夫将跟随哈德施塔特成为秘盟的创始人之一。但这并不能使米洛夫摆脱他最大的敌人：他自己。"
 POD_investigate.desc.790250: "在约兰塔还是个凡人的时候，她是斯拉夫原始宗教的女祭司。因为生前的这段经历，她在被$pod_Embrace$后，成为了她领土上原始宗教的保护者。她肆意地挥洒着基督徒的鲜血，以报复他们对残存原始教徒的迫害。\n在她亡生的早期，她享受着克拉科夫原始教徒的崇敬（以及鲜血）。然而，她的努力无法阻止这座城市的扩张，更无法阻止基督教的继续发展。\n\n其在原作中未来的命运\n约兰塔将变得越来越残暴，到16世纪中叶，她在任何一点上都看不出来像一个人类了。在她彻底陷入疯狂的时候，约兰塔将成为游荡的魔宴猎群的猎物，他们将出于自卫而拿下她，然后享用她强大的鲜血。"
 POD_investigate.desc.790644: "沃夫加在冰岛出生并长大，过着战士和水手的生活，直到他的[Glossary('尊长','game_concept_Sire_desc')]在一次突袭中[Glossary('初拥','game_concept_Embrace_desc')]了他，之后便将其抛弃。在多个夜晚里，沃夫加像野兽一样生活，最终他离开了冰岛，穿越中世纪的欧洲，并向其他受诅者学习，决心征服他内心的兽性。\n在斯堪的纳维亚，他学会了王者之道，并回到了自己的家乡，成为几座村庄的守护者，这些村庄会用他们的$pod_vitae$换取被血仆化。随着冰岛的人口越来越多，沃夫加初拥了几个后代，这使他越来越像一位真正的亲王，并拥有符合他身份的王国。\n\n其在原作中的未来命运\n沃夫加最终将再次离开冰岛，但这一次，他将永远不会再出现。"
 POD_investigate.desc.790870: "维斯塔尼亚是睿魔尔法师团中最年轻的学徒，达到了法师等级。但由于她太年轻，其他魔法师对待她的态度更像一个对待奇物而非同伴，因此她无法与其他魔法师建立友谊。于是乎，她开始转向自己创造同伴，并借此创造出了一些作为她宠物被饲养的构装体。\n在那之后，那些构装体中的一员从她的巢穴逃了出来，并在使女宿舍引起轰动，格拉崔克斯也因此发现了这个生物，并相信维斯塔尼亚已经成熟，可以在他的下一个项目中帮助他。维斯塔尼亚被格拉崔克斯$pod_Embraced$，又被格拉崔克斯带在身边教导一年。在这之后她被派去孵化第一只石像鬼。她让他们沐浴在坚定不移的爱中，他们对她的反应就像小鸡对妈妈的反应一样。\n随着时间的流逝，维斯塔尼亚变得比她任何一位睿魔尔同胞都更关心她的作品。她希望有一天他们能成为一个独立的种族，一个让法师和血族都害怕的种族。\n\n其在原作中未来的命运\n维斯塔尼亚将实现她的目标，带领她的孩子们进行一场起义，一场几乎终结睿魔尔$pod_clan$的起义。"
 POD_investigate.desc.790115: "西默盎曾是梵卓玛土撒拉安东尼乌斯的挚爱凡人，自其出生便养育他未来成为完美梵卓。格苏于西元703年$pod_Embrace$西默盎，就在其自身灾难性的$pod_Embrace$两年后，如此永远打碎了统治着君士坦丁堡的三位一体的团结希望。\n约在1200年，西默盎成为君士坦丁堡的棘秘魑派系共治，与其兄长、[Glossary('尊长','game_concept_Sire_desc')]——格苏一同治理奥伯图斯教团。格苏是精神领导，而领主西默盎则负责管理教团资产，他长袖善舞，效率卓绝。\n西默盎在君士坦丁堡的陷落时幸存，在流亡中与其子嗣——迈卡·维科斯共同领导奥伯图斯教团。\n\n其在原作中的未来命运\n在大反乱时期，他将参与和平谈判以团结棘秘魑弟兄，直到最终被其子嗣维科斯背叛并吸榨。据说维科斯借着重复反刍来折磨他。"
 POD_investigate.desc.790015: "贝利撒留最初是查士丁尼一世的护卫，但很快晋升为他最为信赖的将军之一，其在与萨珊帝国的战斗中大获全胜，最终夺回了北阿非利加和意大利的大部。但因查士丁尼滋生对他的怀疑之心，贝利撒留被迫与宦官纳尔西斯合作。\n在认识到了他的战略技巧后，安东尼乌斯于查士丁尼皇帝去世一年后给予贝利撒留$pod_Embraced$，令他成为梵卓$pod_clan$的一员。尽管贝利撒留对他的[Glossary('尊长','game_concept_Sire_desc')]献上忠诚，但他并不喜欢与魔龙派棘秘魑琐碎的斗争，并请求前往北非，即便那时阿拉伯人已经征服了这块领土。\n从对他的[Glossary('尊长','game_concept_Sire_desc')]负有的义务中解放后，贝利撒留在他的配偶和情人，阿刹迈的谢巴赫的陪伴下浪迹整片地中海地区。大约在同一时段，二人寻到了阿娜佳，并着手引领她走向伟大。\n\n其在原作中的未来命运\n贝利撒留致力于将阿娜佳培养得臻于完美，直到她准备好迎接并完成属于她的命运而离开。在那之后，贝利撒留和谢巴赫将从历史上消失无踪，只是不时会有人目睹他们彼此携行的身影。"
 POD_investigate.desc.791367: "拉普勒西斯是一位身材魁梧、性格凶猛的人，他领导拉脱维亚的冈格罗与十字军进行无望的斗争。其冈格罗和野兽的队伍困扰着许多有幸在战斗中幸存的十字军老兵的梦想。\n拉普勒西斯已经与无情的瓦塔所领导的本地棘秘魑结成了初步的联盟，希望能够战胜无休止的十字军浪潮。\n\n其在原作中的未来命运\n拉普勒西斯将加入利沃尼亚的喀喇呼吁原始教徒的团结，并成为了对抗梵卓针对联盟发动袭击行为的巨大资产。在战斗中幸存下来的拉普勒西斯将回到他的土地，继续战斗。但即使是他也无法永远阻止历史的脚步。"
 POD_investigate.desc.790787: "雅亿出生于现代俄罗斯大草原上驯马牧民部落。按照族人的习俗，雅亿学会了使用武器，并很好掌握了弓箭技巧。在被$pod_Embraced$为萨洛比后，只要雅亿遇到崇魔者，她就会把这些技巧用在和他们的战斗当中。\n据说雅亿曾多次前往危险地带搜索邪恶之仆的踪迹，其中一次旅途将她带到了一名医者之道的信徒，马蒂亚斯的身边。\n这对组合很快就成了亲密的朋友，因为马蒂亚斯是雅亿的记录者和顾问，同时也是她的忠实伙伴。他们与渗入教会的巴力和赛特之子交战，并在与巴力和其他崇魔者的战斗中留下了大量的萨洛比历史片段。\n雅亿和马蒂亚斯至今仍在世界各地旅行，在需要他们的地方与邪恶战斗。"
 POD_investigate.desc.790215: "哈罗恩是一位在中东的$pod_cainite$社会中广为人知的富人，在伊斯兰黄金时代前往开罗，希望与学者和他的同僚[Glossary('阿什拉派','game_concept_ashirra_desc')]讨论伊斯兰的本质。他挑战了对斋戒的传统解释，引起了轩然大波。正如哈罗恩提醒的，古兰经只禁止在白天进食。作为在夜晚醒来的吸血鬼，他们已经履行了这部分宗教义务，不需要戒绝$pod_vitae$。\n哈伦是[Glossary('阿什拉派','game_concept_ashirra_desc')]中第一位挑战伊斯兰教条的有影响力的长者。到目前为止，这使他成为初源之庭的眼中钉，尽管还没有达到公然敌对的程度。\n\n其在原作中的未来命运\n即使在终末之夜，他仍然是争议人物。一些人视他为阿什拉派现代化之父，其他人则认为他是信仰本身的污点。"
 POD_investigate.desc.790237: "身为塔木德学者，那鸿担心自己活不到能够真正理解犹太律法的那一天。扫罗无意间听到其祈求并初拥他。此后，他便成为声誉卓绝的学者及神学家，甚至将专业领域扩展至恶魔学之类的极端学科。\n自扫罗死后，那鸿一直担忧$pod_clan$无人领导，但现在欣然与卡维娅同一阵线。像她那样的无惧战士确实需要他谨慎的谏言，故那鸿一直尽可能地抗拒$pod_torpor$的招唤，担心若无他照顾其心灵，卡维娅不知会变得如何。\n\n其在原作中的未来命运\n那鸿无法避免$pod_torpor$太久，结果是橄榄会议崩溃。他会在之后不久苏醒，与[Glossary('阿什拉派','game_concept_ashirra_desc')]缔结契约以救出残余的萨洛比。"
 POD_investigate.desc.791070: "哈立德原本是阿拉伯边缘之地的一名战士，自从面对面见到先知穆罕默德后，他的人生发生了巨大的变化。身为被$pod_Embraced$的布鲁赫，哈立德在伊斯兰最初的夜晚与先知的军队并肩作战，表现得英勇无畏。那些年的夜晚和谐一片，哈立德还成为了[Glossary('阿什拉派','game_concept_ashirra_desc')]的最初小团体中受人尊敬的成员，与苏莱曼和塔利克齐名。\n然而先知登基后，这一切都被打破了，哈立德发现把哈里发的头衔交给凡人实在愚蠢至极。于是，[Glossary('阿什拉派','game_concept_ashirra_desc')]的第一次分裂诞生了。\n哈立德聚集了志同道合的$pod_cainites$，并成立了伊斯兰牧人，以捍卫远方的信仰为己任。他一直避免与苏莱曼和主流的[Glossary('阿什拉派','game_concept_ashirra_desc')]公开冲突，担心这会威胁到整个伊斯兰教。但炽烈的布鲁赫并不以耐心著称。\n\n其在原作中的未来命运\n哈立德的遗产和运动将永存。伊斯兰牧人将更多地退居幕后，开始关注伊斯兰教面临的外部威胁，比如埃及的赛特之子。"
 POD_investigate.desc.790671: "菲迪米亚生前是一个狂热的祆教教徒，即使是亡生她都在与黑暗势力作斗争。她像一个军营一样领导着她的领域，她以脾气暴躁和不关心自己的狩猎方法而闻名。\n最近，她感受自己正被监视着，几乎是被一个似乎是某种秘密组织所考验。她打算正面迎接他们的挑战，就像她在所有事情上所做的那样。\n\n其在原作中的未来命运\n菲迪米亚将与塔尔玛埃拉找到共同的事业，在那里她将领导他们的崇魔者势力。摩洛教团的加入将打破菲迪米亚对该教派的信任，她将采取极端措施来达成正义的胜利……"
 POD_investigate.desc.791130: "拉杰普特族的长者帕里克西特从火焰中汲取养分，学习了难以理解的真理。这位长者凤凰涅槃，回来是为了为自己创造传承，从惊恐的村庄中征收新娘，并指导年轻的战士们跟随他的脚步。\n他的宏伟计划是让他的后代，无论是精神上的还是其他方面的，都充满了阳刚之气，以至于他能够利用它，赋予他无限的力量。\n穆斯林对印度的入侵已经阻止了他的计划，因为他的后代现在正被入侵者削减。因此，帕里克西特现在正在寻找新的，或者可能是旧的联盟，来创建并帮助他重新控制他的拉杰普特族传承。"
 POD_investigate.desc.790512: "刻茉媞里出生于第十九王朝赛特一世统治的时期，是当时赛特的劲敌伊西斯的女祭司。她被赛特的追随者俘虏，忍受着肉体和精神上的折磨，守住了她女神的秘密。感到挫败的赛特为了惩罚刻茉媞里的顽固，便初拥了她。\n但赛特仍然无法完全控制刻茉媞里，于是刻茉媞里逃离了埃及。她在奥西里斯之子那里疗伤了一段时间，直到回到埃及，才发现伊西斯密教已被摧毁，赛特的子嗣们取得了胜利。试图拉拢盟友的刻茉媞里遇到了密特拉，两人享受了一段短暂的爱情后，她便回到了自己的故乡。\n自从和强大的赛特之子塔沃里特战斗后，刻茉媞里陷入了$pod_torpor$状态，直到最近才苏醒过来。\n\n其在原作中的未来命运\n刻茉媞里将继续与赛特作战，但她的冷酷无情会让她鲜有朋友，因为她将被列入“红名单”（通缉血族的最高名单）的首位。尽管如此，很少有人敢于尝试摧毁伊西斯的最后一位女祭司。"
 POD_investigate.desc.505109: "克瑞透斯出生于科林斯，寻求知识的他在这个世界游历了九年。克瑞透斯在一次知识分子间的竞赛中获胜，从而赢得了密特拉的$pod_Embrace$，并被封为大臣。\n之后，克瑞透斯参与了永恒元老院和塔尔玛埃拉的创建，使他成为罕见的帮助多个教派诞生的吸血鬼之一。他参与了密特拉教的发展，却无法阻止基督教取代他[Glossary('尊长','game_concept_Sire_desc')]的信仰。他最近的阴谋是唤醒卡米拉并帮助他夺回罗马，希望原罪亲王能够摧毁或腐蚀这座教会圣城，从而给可恨的基督教送上致命的一击。\n\n其在原作中的最终命运\n最新阴谋的失败将削弱克瑞透斯对密斯拉教的信仰，使其转而寻求[golconda|E]的救赎。在克瑞透斯的探索过程中，他帮助创建了第三个党派（遁世会），然后犯下了一个巨大的错误，让他和其他人付出了惨重的代价。"
 POD_investigate.desc.791034: "即勇敢又狡猾的格温莉安是一位来自东盎格利亚的一座无名村庄的女孩。当罗马人到来时，只有格温莉安一人在大屠杀中幸存。如果不是她的气质引起了一位还是雏儿的布鲁赫——兰诺西的注意，拿起武器的她就会和布狄卡的其他叛军一起死去。\n近两个世纪以来，格温莉安一直与她的[Glossary('尊长','game_concept_Sire_desc')]并肩作战——直到密特拉随着第二次罗马入侵到来。密特拉不假思索地杀死了兰诺西。密特拉本还打算摧毁格温利安，但格温莉安已悟得了她旧导师所说的道理：潜伏成长并等待时机。格温莉安觉得一切都会过去或消退——罗马的力量也不列外——学会这点的她在密特拉面前俯首称臣。\n几十年变成了几个世纪，即使罗马的力量在不断地消退，密特拉依旧是不可战胜的。曾经为了等待他而奉行的效忠逐渐变成了钦佩，然后是献身和忠诚。格温莉安在为密特拉服务的过程中终于学会了耐心的价值，并作为该教派最强大的外交官之一而就此崭露头角。\n\n其在原作中的未来命运\n密特拉对格温莉安的控制只会随着他愈发明显地毁灭而动摇。终于解脱的格温莉安所发动的最终叛乱将威胁到密盟本身。"
 POD_investigate.desc.790387: "佐伊是奇迹制造者格雷戈里的学生，一位在君士坦丁堡享有盛名的雷伏诺工匠，在1204年城市被十字军洗劫时受到了致命伤害。为了挽救她的生命，格雷戈里$pod_Embraced$了她。然后他们加入了赛特之子安德烈亚斯·埃古普托斯的商队，这将把他们带到巴黎。在旅途中，佐伊被赛特之子的梅里巴教导了不死族的生活方式，使她能够克服对自己新形态的厌恶。\n后来，格雷戈里被十字军俘虏并杀害，这激发了他子嗣的复仇欲望。她的复仇几乎变得自我毁灭，年轻的雷伏诺被末卡维的阿纳托尔救了出来，他收她为荣誉子嗣。\n在他们的旅行中，两人从彼此那里学到了很多，佐伊现在是一个明智但仍然充满活力的稚子。\n\n其在原作中的未来命运\n得益于她的导师，佐伊将在动荡的时期中幸存下来。一夜，她将回到一切开始的地方，君士坦丁堡。"
 POD_investigate.desc.505127: "这位巴塞罗那的亲王在她[Glossary('尊长','game_concept_Sire_desc')]逝去后接管了她的领地，并制定了宽容性政策。这一明目张胆的举动为她赢得了稚子的支持，但却引起了长者们的不满。但米雷亚作为伊比利亚最强大的梵卓，使其成为了$pod_clan$无法失去的人，她自己也知道这一点。\n在这种政策下，巴塞罗那成了一个炸药桶，该隐异端与[Glossary('阿什拉派','game_concept_ashirra_desc')]还有来自远方的使节一起在街上游荡。但令所有人惊讶的是，米雷亚迄今为止一直能够阻止任何暴力事件的爆发，此举标志着她是一个比大多数人给予她的评价更精明的亲王。"
 POD_investigate.desc.791087: "密尔索斯在与战士种姓发生冲突后，被迫了离开鹰巢要塞，随后他被突尼斯巫师兄弟会招募。作为其中最年轻的一员，他被赋予了艰巨的任务，即与罕见的访客会面，并保持兄弟会所控制的领土的安全。\n作为一位隐居的神秘主义者，密尔索斯也在寻找新成员来填补他目前的位置，并希望在完成后能回归到自己的研究。"
 POD_investigate.desc.790988: "被称为库弗·阿姆·赫鲁（在赛特之子黑话中意为“守护我的最强者”）的赛特之子声称自己是首位库弗·阿姆·赫鲁的后裔，他是赛特神选、保镖和顾问。从那时起，已经有三位库弗·阿姆·赫鲁在大地上行走，每当他们感到自己毁灭临近时，就会初拥一位子嗣。\n现任的库弗·阿姆·赫鲁是在阿契美尼德人入侵埃及时被[Glossary('初拥','game_concept_Embrace_desc')]的，被迫目睹赛特的神庙被焚烧和掠夺。自那以后，他大部分夜晚都在$pod_torpor$中度过，等待赛特的归来，再次为他服务。他只在他$pod_clan$的利益受到威胁时才会苏醒，而且从不长时间保持清醒。\n他参与了亚历山大大帝征服埃及后的谈判，确保了法老统治的生存，资助了许多艺术博物馆，在穆斯林围攻亚历山大港后，为了保存他的民族的古代文物和传统，他还在开罗围攻期间对抗了第三次十字军东征。\n\n其在原作中的未来命运\n在终末之夜再次苏醒，库弗将专注于全球市场，以实现对当前物质世界的毁灭，因为他对他$pod_clan$变成的样子感到厌恶。"
 POD_investigate.desc.790995: "安卡拉·荷泰普是位古埃及人，他伪装成强大的娜芙蒂蒂女王的情人，直到她发现安卡拉其实是个吸血鬼的真相，并得知他一直在利用她的身体和财富。娜芙蒂蒂知道后非常伤心，而此时的安卡拉早已消失得无影无踪。\n安卡拉陶醉于这种阴险狡诈的小计谋，在接下来的几个世纪里，他执行了更多这样的事，同时还招惹了一大批想要对他复仇的敌人，但没有一个娜芙蒂蒂更坚定。\n\n其在原作中的未来命运\n即使拥有惊人的力量，安卡拉也无法避开20世纪卢西塔尼亚号皇家邮轮上的爆炸，从而以$pod_torpor$迎来自己的结局。纳粹设法得到了安卡拉的身体，并将他带到柏林用于医学实验。娜芙蒂蒂最终会在这里找到他……           "
 POD_investigate.desc.791285: "尽管弗朗索瓦·德阿伦库的出身被蒙上了一层神秘的面纱，他曾是千禧年前后法兰西最强大的$pod_cainite$统治者之一。他的财富并没有持续下去，经过多次入侵，特别是诺曼人的入侵，他主要的领地现在大多被局限在法兰西东南部。\n即使有这些挫折，弗朗索瓦继严而有节地统治着他的土地，使他成为荣誉的典范，如果有必要，他将死守自己的承诺。弗朗索瓦对子嗣们的行为也非常关注，在他们的成长过程中采取积极的措施，以确保他们不会给德阿伦库该姓蒙羞。当子嗣们的教育完成后，他们在回到弗朗索瓦的领地并统治其中的小城市之前，被期望作为外交官服务于其他宫廷。\n作为一个有荣誉感的人，弗朗索瓦对萨丽安娜最近煽动的宫廷政变并不满意。不过，他现在是她的附庸，如果她和法兰西需要自己，他们只需要传召他。这属于贵族的义务。"
 POD_investigate.desc.790602: "伊卡捷琳娜在1150年在布拉格被$pod_Embrace$，此前她差点被一对由梵卓请来的雇佣兵强奸。这两名雇佣兵最终得到了应有的惩罚，但在此之前他们打碎了伊卡捷琳娜的下巴，当时她试图抵抗。她的未来[Glossary('尊长','game_concept_Sire_desc')]马休尔尽他所能修复了伤害，但当时的医学质量是一言难尽的。\n受到她[Glossary('尊长','game_concept_Sire_desc')]的故事的激励，她成为了一个激进的普罗米修斯派，并通过谎报年龄，声称迦太基为她出生地，吸引了大量的追随者。她真正的突破来自于她$pod_Embrace$了一位名叫克里斯托夫·罗慕铎的十字军战士。这位十字军战士比伊卡捷琳娜想象的还要能干，并且轻易地相信了她的谎言和哲学。\n在他的帮助之下，她在布拉格的影响力飙升，直到他在对抗一位强大的棘秘魑玛土撒拉的战斗中倒下。\n\n其在原作中的未来命运\n在终末之夜，伊卡捷琳娜将与她的杰出子嗣重聚。他们将共同击败一个强大的敌人，发现迦太基的秘密，然后定居在纽约，成为这座城市最重要的吸血鬼之一。"
 POD_investigate.desc.790359: "热尔韦出生在法兰西，是一名书记员的儿子，并被教导要跟随他父亲的脚步。他父亲为之工作的贵族安排热尔韦在巴黎接受教育，于当地睿魔尔家族的魔法师工作室，他在那里抄写了数个魔法文本。\n他被玛乌戈热塔收为学徒，被带到塞奥里斯，在那里他接受了赫耳墨斯技艺的教程，虽然他被证明在实践魔法方面并不突出，但他对神秘学计算有着敏锐的头脑，可以找到被称为“活力”的罕见的天然魔素，随着神话时代开始消逝，这些宝玉变得越来越稀少，它们也变得越来越有价值。仅仅五年后，热尔韦在格拉崔克斯的授意下通过玛乌戈热塔得到了$pod_Embrace$。\n从那时起，热尔韦就成为了$pod_clan$的外交官和阴谋家。在欺骗约根·冯·费尔登结盟失败后，热尔韦有了一个新的、危险的任务：消灭分裂分子——利沃尼亚的特亚维派。\n\n其在原作中的未来命运\n这项使命的意外胜利将给热尔韦带来巨大的声望，他将最终选择站在埃特里乌斯一边。此举将是他的终末，因为他将在1931年被格拉崔克斯的手下给毁灭。"
 POD_investigate.desc.791300: "多斯泰恩的凡生充满了灾难。他在一个贫困但充满爱的家庭中长大。但不幸的是，辛勤的劳动和恶劣的冬季给他带来了巨大的压力。多斯泰恩和他的双胞胎姐姐斯泰努恩帮助他们的母亲照顾年幼的兄弟姐妹，但却一个接一个地生病并死去，就连父亲也不列外。最终，斯泰努恩也死在了她弟弟的怀里，只留下了多斯泰恩和他的母亲。\n许多年后的一个寒冬早晨，一位旅行牧师来到他们的家中，提出自己能在多斯泰恩出外出时陪伴他年迈的母亲。牧师说出了令人振奋的话语，让多斯泰恩开始认为这位新兴的基督教的神是真正惊人的存在。然而，当他回到家时，发现房子里空无一人。牧师再也没有被见到过，但三天后，多斯泰恩在房子后面的雪地里发现了他母亲冻死的身体。\n他的心中燃烧着愤怒。他憎恶那个牧师。他憎恶那些不帮助他家人的村民。他憎恶他的家人死去并抛弃了他。当巴萨拉布来到村庄寻找士兵时，多斯泰恩自愿并证明了自己是一名出色的战士。巴萨拉布$pod_Embrace$了他，两人在一起度过了许多年，直到有一年，主的仆从们发现巴萨拉布在一次战斗后变得孤独和虚弱。他们把他烧成了焦炭——当多斯泰恩到达时，他除了哀悼什么也做不了。\n现在，多斯泰恩孤身一人，对这一点的认识侵蚀着他的灵魂。近年来，他回到了特隆赫姆，他把大部分时间都花在谋划这座城市的灭亡，以报复他所遭受的一切。"
 POD_investigate.desc.791012: "罗斯里尔的长期伴侣和情人是玛赫蒂尔，像她一样，也是他们血系创始人萨麦尔的曾子嗣。他们之间共享的纽带在他们的同僚中变得传奇。玛赫蒂尔是那个脾气暴躁的人，寻求对受人厌恶的睿魔尔进行报复，而罗斯里尔则试图平息她，思考扫罗真正想要的是什么。\n这对组合已经经历了许多冒险，并试图与他们$pod_clan$的其他幸存者重新建立联系。到目前为止，结果并不令人满意，绝望慢慢侵入他们的心中。\n\n其在原作中的未来命运\n他们不同的心态最终将导致他们分开，直到玛赫蒂尔在那个夜晚感受到他的求救。被睿魔尔的一群人逼入绝境，罗斯里尔在玛赫蒂尔能够介入之前失去了自己的生命。怀着悲痛，她最终字面意思上的与恶魔达成了一个契约。"
 POD_investigate.desc.790262: "阿多拉娜年轻时被送到修道院，在那里她受到修女的虐待，直到她精通了阴谋诡计。她利用修女们之间已经存在的裂痕，慢慢地使她们更加对立。成为修道院的中心人物后，阿多拉娜被派去向当地主教汇报，结果发现主教是一位$pod_cainite$异端。\n在他的帮助之下，她轻而易举地成为了修道院长，然后扩展了她的网络到新的修道院。被$pod_Embrace$之后，阿多拉娜的影响力只有增长，因为任何被送到她的修道院的贵族女儿很快就会经历一个充满疯狂术诱导的幻象的彻底“加工”，一旦她们回到贵族丈夫或父亲身边，就会成为她的完美间谍。\n她的最终胜利是在她回到她的家乡时实现的，她粉碎了她讨厌的兄弟的头骨，把那个很久以前把她送到修道院的人交给仆人强奸。"
 POD_investigate.desc.791463: "多米尼乌斯是一位高贵、充满贵族气质且极其富有的人，以一个曾经强大的帝国的权威说话。尽管他的决策是与一小群同僚军师和遁世会成员共同作出的，他却直接将1000多年的西方历史归功于自己。\n多米尼乌斯那压倒性的威胁气氛总是足以使任何怀疑这样宏伟主张的人沉默。他说话不多，并且将自己的宏伟强加于那些被期望尊重甚至为他服务的低等生物。\n\n其在原作中的未来命运\n多米尼乌斯将对一个名叫弗拉德·采佩什的凡人产生浓厚兴趣，视他为潜在的子嗣和遁世会的招募对象。决定这一切的晚会将成为传奇。"
 POD_investigate.desc.791958: "塞尼娅是诺夫哥罗德附近的一位$pod_cainite$小地主，对她的牧群来说是一位严格但充满爱心的女主人。因此，当她的庄园遭到袭击，他们全部被屠杀，她对自己居然怀念他们的事实大吃一惊。\n在遇到苦烬骑士团的时候，塞尼娅与他们达成共识，为她的人民报仇。她随后加入了他们的组织，并成为少数几个接受杯之$pod_Embrace$的女性之一。\n现在，塞尼娅走遍了整个领地，从那些在男人面前可能会对自己的秘密保持沉默的女人那里收集信息。她还特别想找到袭击她的庄园的真正始作俑者，但不幸的是至今还有没有任何收获。\n\n其在原作中的未来命运\n塞尼娅在裁判所进行猎杀的日子里通过对理想的妥协而存活下来，并失去了杯之$pod_Embrace$的好处。她迷失了方向，对难以捉摸的袭击者毫无头绪，于是她加入了新生的魔宴，至今仍是一名叛族者。"
 POD_investigate.desc.791145: "者勒篾是乌梁海氏族的铁匠之子，是可汗的亲身护卫，也是汗帐的著名军事家速不台的兄弟。然而，他对他们隐瞒了几十年的秘密——他实际上是由安答的吸血鬼，一个他们希望能派到大汗身边的线人。\n者勒篾在对成吉思汗的爱和钦佩与对[Glossary('安答','podgloss.anda')]的忠诚之间犹豫不决。幸运的是，他没有理由担心，因为[Glossary('安答','podgloss.anda')]满足于让成吉思汗随心所欲地肆虐。\n者勒篾是一位沉默寡言和严肃的人，非常怀念凡生及其简单的乐趣。自从他被$pod_Embrace$以来，他在任何战场上都成为了血腥恐怖，并多次保护了汗帐。\n他唯一的弱点是不愿意进入中原，这源于他亡生的早期与可恨的[Glossary('万鬼','game_concept_kuei_jin_desc')]致命的相遇，这也使他对他们产生了极大的恐惧。"
 POD_investigate.desc.790808: "阿卜杜勒·拉赫曼是一位话不多的[Glossary('阿什拉派','game_concept_ashirra_desc')]，他拥有很大的权力，并赢得了他遇到的大多数人的尊重。\n尽管他不是最初帮助建立初源之庭的小组成员，但阿卜杜勒迄今为止一直与他们保持着友好的关系。\n\n其在原作中的未来命运\n随着奥斯曼帝国入侵阿拉伯，阿卜杜勒的时代到来了，在那里他将证明自己是非常宝贵的，帮助确保[Glossary('阿什拉派','game_concept_ashirra_desc')]的地位，尽管有这些新来者。成为穆拉的圈子成员的朋友后，他将在19世纪的欧洲殖民主义期间再次帮助他们，在那里他将与新兴的沙特部落站在一起。\n直到今夜，他仍然是沙特阿拉伯背后的幕后主使，他的影响力扩展到阿拉伯世界的大部分地区。"
 POD_investigate.desc.790860: "玛娜尔在年轻时就遇见了她的[Glossary('尊长','game_concept_Sire_desc')]，达舒夫。这人对一位建筑师也就是她的父亲，产生了极大的兴趣，并看着她成长为一名聪明而美丽的年轻女子。他把她带到自己的身边并$pod_Embrace$她，是一位充满关怀和公正且让玛娜尔深深地爱着的[Glossary('尊长','game_concept_Sire_desc')]。\n然后巴力来了。\n在他们的影响下，达舒夫变成了一个可怕的人。她的求救声被派比斯塔克前去清剿城市的阿刹迈听到了。这时，玛娜尔知道自己犯了一个错误，因为她想让达舒夫恢复理智，而不是作为一名崇魔者被杀死。\n从那时起，玛娜尔就以极快的速度学习血族的欺诈之术，试图平衡大马士革的所有派别，以实现她的最终目标，那就是将达舒夫从他自己手中拯救出来。\n但即使是玛娜尔也知道，自己的秘密计划很快就会被揭露，她正在拼命寻找解决办法，以免她曾经深爱的[Glossary('尊长','game_concept_Sire_desc')]最终迈向死亡，或者更糟。"
 POD_investigate.desc.790216: "哈尼法作为谦虚的抄写员之女出生于阿勒颇，在公元962年希腊人入侵了她的家乡，使她生活中的平静被打破了。哈尼法的家人被屠杀，她被士兵抓去当奴隶和妓女。她在士兵中喝了一夜酒后，设法逃了出来，并为自己报了仇，杀死了几个正在睡觉的希腊人，其中包括那些侵犯过她的人。\n当哈尼法走到她以前的房子的废墟时，她将一把刀插入自己的胸口自杀。一位目睹了她的事迹并确信她的决心可以进一步用于对抗异教徒的布鲁赫$pod_Embrace$了她。他把她介绍到[Glossary('阿什拉派','game_concept_ashirra_desc')]，并教会她战争之术。随着十字军东征的进行，哈尼法认为保卫人民和保护他们的圣地是她的使命，但她愿意与任何渴望休战的$pod_cainite$讲道理。\n\n其在原作中的未来命运\n然而，多年来她会变得心不在焉，最终进入$pod_torpor$。她将在1917年阿拉伯起义期间苏醒，并加入保卫家园的行列，对抗土耳其人。她最终将在冲突中被一名受雇的阿刹迈摧毁。"
 POD_investigate.desc.790529: "朱哈出生于公元1025年的一个塞尔柱突厥家庭。他在1042年的塞尔柱突厥革命中参战并受了致命伤，当时他年仅17岁。在这场战斗中，他被一位阿刹迈——卡尚发现，卡尚给朱哈喂了精血，使他的伤口得以愈合。\n朱哈作为卡尚的[ghoul|E]服侍了14年，直到1056年被$pod_Embrace$。从那时起，朱哈不断磨练他的狩猎和潜行技巧，并已经为刀锋之网处理了几位长者。\n\n其在原作中的未来命运\n朱哈将犯下一个错误，他决定将目光集中在他能想象的最致命的猎物上——一位阿刹迈长者。在这一不忠行为中，朱哈将被彻底击败。长者伊希姆·乌尔·巴尔看到了朱哈身上的巨大潜力，他不但没有消灭朱哈，反而对他进行了惩罚，让他乖乖就范。\n跟随着新导师的脚步，朱哈最终会加入魔宴并成为塔尔玛埃拉的间谍，直到在一次对抗叛徒塔里克的任务中失踪。"
 POD_investigate.desc.791149: "在扫罗于东方的旅程中，他选择了两个人作为$pod_Embrace$对象。瞾贼，一个能够从无量地狱中窃取秘密的窃贼，和瞾学，一个能够破译这些秘密的学者。这三人在中原地区冒险，掠夺恶鬼的巢穴，偷取他们的计划。\n他们寻找能让$pod_cainites$在[Glossary('纪元之轮','podgloss.wheelofages')]的轮回大劫中幸存下来的知识。而当扫罗离去回到西方，他指示他的两个子嗣继续他的工作，创建一个新的种姓，被称为武瞾，或观者。\n瞾学是新种姓学者一系之父，尽管在他们的道路上有许多障碍，但还是尽职尽责地完成了扫罗的命令。"
 POD_investigate.desc.790208: "欧亨尼奥并不是一个高大的人，但毋庸置疑地有一种权威和权力的光环围绕着他。他的动作稳健而优雅，其肩膀上流露出近乎傲慢的自信。这些都是他努力压制的特征，因为它们放在一个神之人的身上似乎不怎么体面，尽管这些都可能是好的。\n克劳狄乌斯在梵蒂冈拥有巨大的影响力，他认为罗马本身就是他的王国，尽管他的君主制只存在于阴影和幕后。他觉得这对罗马的控制已经足够了。\n然而，并非所有的追随者都在与基督教的上帝交流。有些人完全拥有自己的上帝。克劳狄乌斯在神学层面上的要求并不像他在$pod_discipline$问题上那般苛刻。上帝并不是他的主要关注点之一，归根结底是因为他们最后的会面被无限期推迟了。"
 POD_investigate.desc.790876: "玻德茉尔是凯尔特神话中著名的骄傲战士。远在罗马到来前，她就已经在波伊斯的山间建立起自己的乐土。她在拉丁$pod_cainites$入侵下比大多数同宗活得更好，据说她与密特拉有秘密协议，这解释了他不愿意与她发生冲突的原因。\n不过这份协议并没有延伸成屈从密特拉，当其孙嗣罗德里试图扩张至波伊斯便得知了。这份雄心成了彻底的灾难，玻德茉尔屠杀了每一个他带去远征的[ghoul|E]和$pod_cainite$。在那时她羞辱罗德里，但认出在他身上的密特拉印章后饶了他一命。\n他们协议的真正内容，或是两人的关系仍是谜团。一个复仇心切的罗德里急于揭露的谜团。"
 POD_investigate.desc.791254: "在这个由妥芮朵和梵卓统治的国度中，布鲁恩豪特代表着布鲁赫最后的壁垒之一。她被她的尊长——远古“西哥特人”阿拉里克精心挑选，在他出征时替他统治。\n要让她的昂古莱姆城保持独立并不受皇庭的干涉已变得越来越困难，布鲁恩豪特也看到了这一点。她正在考虑向巴黎示好以确保她的亲王领独立，如果她的[Glossary('尊长','game_concept_Sire_desc')]知道这件事，一定会非常生气。\n但布伦诺特和他一样，首先是一个务实的生存者，阿拉里克很快可能会发现，这并不总是一个好子嗣的特质。"
 POD_investigate.desc.505124: "在[Glossary('阿什拉派','game_concept_ashirra_desc')]中流传着这样一句话，他们的错误不会困扰他们，反而会叫他们'[Glossary('尊长','game_concept_Sire_desc')]'。\n伊斯梅尔是休达的维齐尔家中一个非常守规矩的孩子。一天晚上，一个名叫易卜拉欣的男子来访，提出只要有人能在国际象棋上打败他，他便愿意献出他最珍贵的财宝。伊斯梅尔观察并记住了易卜拉欣与他父亲的对弈，他注意到易卜拉欣没有呼吸，也没有要求茶点。于是，当他击败易卜拉欣时，他要求得到永生作为礼物。\n易卜拉欣第二天晚上就离开了，但伊斯梅尔却迅速崛起。凶残而聪慧的他很快就尝到了$pod_diablerie$这个禁果，并发现自己对此欲罢不能。通过一系列的阴谋和恐怖手段，他很快登上了雷阿尔城的苏丹宝座。他煽动安达卢西亚吸血鬼的混乱，计划让所有其他[Glossary('阿什拉派','game_concept_ashirra_desc')]领主屈服，这样他就能领导午夜新月。即使是最冷酷无情的苏丹也会祈祷这个夜晚永远不要到来。"
 POD_investigate.desc.790918: "在罗马帝国还存在的时候就被$pod_Embraced$，达太被这样的想法所困扰：旧罗马神抛弃了他，因为他拒绝来到他们身边（即死亡）。达太沉溺于以牛为祭品的做法，以此来安抚他的神灵。\n除了害怕让他变得年轻的旧神不高兴之外，达太在保护自己的亡生和整个吸血鬼种族方面也非常谨慎。这引导他追踪了任何可能危及$pod_cainites$的威胁传闻，无论是古老的神话还是更现代的工具。\n\n其在原作中的未来命运\n达太将继续他的守夜。有一天晚上，他将在一个错误的尝试中毁掉吸血鬼救赎的最佳希望，以拯救他们。"
 POD_investigate.desc.790515: "盖迪原本是一名罗马角斗士，是狂热的赛特信徒，因其有能力渗透并使凡人密教和宗教转向崇拜他的$pod_clan$创始人而闻名。\n其在原作中的未来命运\n盖迪将前往海地，在那里他将利用当地的伏都教作为传播赛特的手段。他的成功将是巨大的，直到他自己的子嗣的背叛和一个敌对的密教的诞生将迫使他陷入一场漫长而痛苦的岛屿控制权战争。"
 POD_investigate.desc.710303: "法蒂玛在突尼斯遇见了她未来的[Glossary('尊长','game_concept_Sire_desc')]，这位吸血鬼在暗处看着她成长为女人，并爱上了她。当谢里夫搬到南方时，他把法蒂玛也带走了。从那时起，这位有天赋的子嗣学到了很多关于她的新状况和吸血鬼的政治知识。法蒂玛被勒森魃$pod_clan$的领导层注意到了，直到最近她被指派了首个任务：为她的$pod_clan$夺取摩加迪沙。这是一项艰巨的任务，因为她的许多族友在夺取珍珠城时都失败了。\n\n其在原作中的未来命运\n法蒂玛的成功和传奇将会不断增加，直到她的[Glossary('尊长','game_concept_Sire_desc')]被带走为止。法蒂玛将抛弃她的$pod_clan$，成为了最重要的勒森魃叛族者之一并培养出一个关系网，这使她成为了非洲最可怕的人之一。"
 POD_investigate.desc.790256: "很少有人真正了解难以捉摸的约翰内斯·卡斯汀的想法。他是一位没有什么感情的人，他似乎是一位罕见的，对为权力而掌权不感兴趣的梵卓。约翰内斯以没有任何理由就拒绝一些非常有利可图显然能扩大他的领土和影响力的机会而闻名。不过只有傻瓜才会指责约翰内斯懦弱，因为他的领地和关系网保存得很好，证明了他的政治敏锐性。\n\n其在原作中的未来命运\n阿姆斯特丹将繁荣起来，约翰内斯也将从中繁荣起来，就像他一直以来的那样小心翼翼。拒绝一些非常有声望的秘盟职位将确保他的神秘光环依然存在，没有人敢在他的家乡争夺他的霸权。"
 POD_investigate.desc.790302: "罗莎蒙，美丽的英格兰玫瑰，出生于伊斯灵顿的一个诺曼小男爵之家。她从小就美丽动人，受到一位吟游诗人的青睐，这位诗人向他的主人女王伊思妲·德·布莱斯夸赞了她的美貌。\n伊思妲的宫廷对这个年轻的女孩来说是一个令人兴奋的新世界，充满了挑战和法兰西淑女式的教育。她学会了读写、举止和礼仪，学会了如何观察和解读宫廷政治。她知道如何表现得既谦虚又娇媚，如何用她的机敏和笑靥来魅惑众生。\n她的第一次任务是前往马格德堡亲王约根·冯·费尔登的宫廷进行外交活动，尽管有一些阴谋玷污了她的名声，但罗莎蒙还是给梵卓领主留下了深刻的印象。\n罗莎蒙随后被引入巴黎宫廷，作为爱之皇庭将暴君亚历山大赶下王位计谋的一部分。事实证明，罗莎蒙对这位不安分的亲王的影响远远超出了所有人的预料。他对她如此着迷，以至于爱之女王们允许他带着罗莎蒙一起流亡，聊以慰藉，而罗莎蒙本人的意见却无人在意。\n古老的玛土撒拉，他那强烈的嫉妒心只有所爱的绝对崇拜和对其完全占有方可满足。然而，罗莎蒙发现自己的心再次被马格德堡亲王、领主约根所吸引，他是亚历山大流亡途中的东道主。但现在，她必须依靠她所学到的一切来帮助她熬过即将到来的无数个夜晚，因为当亚历山大妒火中烧，他会将他最爱的东西摧毁……\n其在原作中的未来命运\n多亏罗莎蒙的机敏，她幸免于亚历山大的疯狂，并嫁给了心爱的约根。但对于该隐的子嗣，幸福结局从未存在……"
 POD_investigate.desc.792017: "贝娜是克拉科夫一名妓女的女儿，在被自称为圣斯坦尼斯瓦夫的吸血鬼捡到之前，过着流落街头的生活。虽然有人猜测斯坦尼斯瓦夫可能是她凡人的父亲，但她为何会被吸血鬼看中，至今仍无定论。\n随着斯坦尼斯瓦夫的崇拜者越来越多，越来越多的人向这位死而复生的“圣人”献上血液，斯坦尼斯瓦夫变得越来越懒散和傲慢，也愈发妄自尊大。因此，贝娜承担了夜间的大部分生意。她变得善于扒窃来填满他们的小金库，并用娴熟的受惊吓的小女孩表演来引诱潜在的密教徒进入地下洞穴，她将不断壮大的密教组织培育成一个强大而团结的团体。\n据悉，近年来，斯坦尼斯瓦夫陷入了$pod_torpor$状态。这背后的原因不得而知，贝娜也不曾谈论。现在，她公开地运作密教组织，尽管是以谨慎的方式。而自从斯坦尼斯瓦夫不再公开露面后，密教人数大大增加。当然，贝娜现在似乎和她$pod_Embrace$之前一样相信她的[Glossary('尊长','game_concept_Sire_desc')]，但他失踪的情况表明，这个故事并不简单……"
 POD_investigate.desc.790130: "自斯蒂克拉斯塔迪尔战役以来，兰道夫一直是基督徒，并有着可以依靠的旧日盟友。如果不是因为他的同胞“毒蛇们”的阻挠，他本可以在斯堪的纳维亚变得更强大。曾经是冉冉升起的新星，但他的皈依为他招来了洛基之子的敌意，他们希望用一位更忠诚的赛特之子领主取代他。他们已经潜入他的宫廷，散布恶毒的谣言，试图削弱他的权力。\n兰道夫自封为赫拉迪尔亚尔，认为自己是凡人对应者的“日间雅尔”之“夜间雅尔”。虽然他只控制着挪威的一小部分，但他认为整个地区都是他的，尤其是瓦尔普尔加女王的领地比雅克岛。他希望在不消耗任何宝贵资源的情况下夺取它。因此，兰道夫目前正在寻找年轻的吸血鬼派遣到女王的宫廷担任间谍和破坏者。即使他们决定保留封地，他也知道赶走某个新贵会比推翻那位历经风霜的老女王要容易得多。"
 POD_investigate.desc.790462: "伊万是一位杰出的军阀，被称为“睿魔尔之锤”或“屠夫”，因对待被俘睿魔尔成员的手段异常残忍（是的，即使对于恶魔来说也是如此），他出身于诺利兹世系，以内讧著称。\n伊万知道弗拉基米尔·罗斯托维奇身败名裂后，而诺里兹正试图重振雄风。他对此并不喜欢……嗯，他既不喜欢他的[Glossary('尊长','game_concept_Sire_desc')]、也不喜欢他的叔叔或他的祖父，但他不得不屈从于血脉的意志，将主要精力集中在对抗睿魔尔上。\n\n然而最近，伊万宣称要将他的叔叔拉赫拉夫斩首，并为此复仇付出了极其专注的努力，只是受诺里兹干预而被阻止。\n\n虽然冷酷无情，但伊万依旧被认为是一名恪守其$pod_clan$传统的，光荣的棘秘魑。因此，他得到了许多强大的库都的拜访，而他自己也掌握了一些其$pod_clan$的古老血法术的皮毛。他的封臣和血仆也对他异常忠诚。\n\n其在原作中的未来命运\n伊万将于1233年接受与其世系其他成员的和约。利用这个机会，他将推动对睿魔尔的协同作战，并被委以指挥围攻强大的塞奥里斯要塞的重任。"
 POD_investigate.desc.790933: "“美人”伊利亚什打破了许多关于$pod_clan$个个都是冷酷、无情和畸形的神话。他能肆无忌惮地开怀大笑，并于喜欢与凡人为伴。他似乎真心珍视凡人，丝毫没有斤斤计较的行为或对领地的贪婪。除了好客的主人和愿意帮助他的人促进“旧信仰”的生存和发展之外，他并不谋求比他的$pod_cainites$同伴更多的好处。\n作为原始教徒之神贾里洛的祭司，伊利亚什非常认真地履行自己作为牧民的职责。伊利亚什目前是同为学者的迈卡·维科斯的挚友和恋人，两人很少在缺少彼此的陪伴下独处。\n\n其在原作中的未来命运\n伊利亚什的命运将是棘秘魑所能获得的最大荣誉。然而这只会让他付出一切代价。"
 POD_investigate.desc.790398: "作为凡人时，萨拉金是查士丁尼大帝宫廷中的一个小男孩，他看见世俗领主往往不按照圣经的正统观念生活，而是听从幕后的主人。凯塔尔[Glossary('吸榨','game_concept_Embrace_desc')]了他，因为他在这个男孩身上看到了自己的影子。然而，萨拉金并没有对这些感情做出回应。在1204年第四次十字军东征洗劫君士坦丁堡期间，萨拉金试图$pod_diablerie$他的[Glossary('尊长','game_concept_Sire_desc')]，但由于他的[Glossary('尊长','game_concept_Sire_desc')]对古蛇术的掌握，他只成功了一部分。\n自从那次遭遇后，他一直在躲避凯塔尔的老同伙，并掌握了创造新身份以掩盖其踪迹的才艺。\n\n其在原作中的未来命运\n萨拉金总是比他的对手领先一步，他将成为第一批前往澳大利亚的$pod_cainites$之一。利用他在潜规则方面的经验和有计划的行动，他将成为这片大陆上最强大的吸血鬼个体。即使是[GetTrait('kueijin').GetName( GetNullCharacter )]的入侵也不足以让他不安。"
 POD_investigate.desc.792051: "恩奇都出生于乌尔附近苏美尔文化的鼎盛时期，他被冈格罗[Glossary('上古耆宿','game_concept_antediluvian_desc')]为纪念月亮而建立的金字塔的幻梦所困扰。最后，这些幻梦变得如此强烈和具有威胁性，让他不得不冒险亲自前往寺庙，以挑战发送这些幻梦的存在。相反，他被纳入伊娜依娅的大家庭，被赐予$pod_Embrace$。他的伙伴们透露，他的尊长努力守住着由赛特创造的生物，被称为堤丰之兽的古老[ghoul|E]，在她的控制下，用兽性术将其封在自己的身体里。[Glossary('上古耆宿','game_concept_antediluvian_desc')]不会杀死它，因为它是最后一个物种。恩奇都被选为伊娜依娅的继承人，在他自己的身体里也含有其他稀有物种。\n恩奇都被训练了一个世纪，直到赛特之子为了获得堤丰之兽而进攻乌尔。两个氏族之间的战斗充满恶性和血腥，而尽管战斗很激烈，恩奇都还是得以从燃烧的城市中逃出来。在接下来的几个世纪里，他避开了文明，毫无悔意地猎杀血族和凡人，对他们都怀着强烈的仇恨。直到如今的夜晚，恩奇都仍在努力克制他体内堤丰之兽的冲动。\n\n其在原作中的未来命运\n恩奇都将在接下来的几个世纪继续他的职责，与整个$pod_cainite$世界为敌。他将被列入红名单，即吸血鬼的“头号通缉犯”名单，并在2000年代中期被一股强大的力量攻击。恩奇都将在那里被打败，并似乎被杀死，但他的尸体或骨灰永远不会被发现……"
 POD_investigate.desc.790782: "赫罗图尔夫只有18岁时，他的[Glossary('尊长','game_concept_Sire_desc')]——罗马人马里乌斯——随军团而来，在他的部落被击败的战场中，将他加入了不死族的行列。\n马里乌斯憎恨野蛮人，而赫罗图尔夫是最强壮的人之一。让最强壮的俘虏来满足他的每一个愿望，这让他很高兴，于是他将赫魯托夫血缚了50年。他嘲弄和虐待了这个战士几十年，最后终于突破了血缚的极限。不知何故，赫罗图尔夫设法向他的血主扔了一把刀，并用火把打断了他的背部。\n虽然他的[Glossary('尊长','game_concept_Sire_desc')]为他的亡生恳求，但赫罗图尔夫并不怜悯他，当时就把这个罗马吸血鬼消灭了。他的吸血鬼兄弟格拉西斯·诺斯丁在自己身上找回了勇气，试图为他们的[Glossary('尊长','game_concept_Sire_desc')]报仇，但他的才能却无法与野蛮人相比。然而，赫罗图尔夫拒绝杀死他的兄弟。\n在他杀了他的[Glossary('尊长','game_concept_Sire_desc')]之后，他的斗志就没有了。赫罗图尔夫喝了太多的酒，杀了太多的人，他决定只为生存而战——而不是为了财富或荣誉。再也没有什么荣誉了，也没有什么高贵的战斗留给战士了。他最后的英雄行为是向暴君马里乌斯复仇。\n\n其在原作中的未来命运\n他的血之兄弟不会忘记或原谅赫罗图尔夫。他们会发现自己在一块陌生的新大陆上再一次对立。"
 POD_investigate.desc.791097: "哈维德是一位非自愿的奴隶商人……并不是因为他对交易人类有任何顾虑，而只是因为他渴望旅行。几十年前，他从印度海岸来到沙那定居，并任意地选择了他的贸易专长，觉得他对人类的了解比对奇怪的植物或皮革工艺品更多。\n他是正确的，因为他的生意从那时起就飞速发展。这笔意外的财富的枷锁束缚着他，他不习惯把这样的财富留在身后，但留在原地也开始感到很不舒服。\n坎贝开始调查商人的儿子和女儿，寻找一个合适的子嗣，把他的利益留给他们。同时，要想让他打包走人，把他的财富留给偷窥的乌鸦，只需要花费很少的时间：一艘好船和一阵好风，在一个忧郁的日子里唱起一首疲惫的民谣，或者在某个遥远的城市里讲一个未被发现的财富故事。"
 POD_investigate.desc.790109: "琐罗亚斯德是土生土长的安条克人，在随亚历山大大帝的军队到中亚时，被一位后锡拉的散居老人[Glossary('初拥','game_concept_Embrace_desc')]了。“琐罗亚斯德”不是他的原名。他认为这是对他在当兵时碰到的那个人的教诲的敬意。\n在经历了凡生的漂泊之后，他在自己的家乡定居下来，并开始保护和改善它。在新的千年里，当他不在$pod_torpor$时，他继续这样做。当十字军东征时，入侵的军队穿过他的城市，他对凡人的政治和宗教有了足够的了解，从而有效地指导他的子嗣将掠夺的大军引向其他地方。\n琐罗亚斯德的首要关注点始终是安条克本身的地位、福祉和未来。他采取任何必要的措施来确保他的领地的神圣性不受干扰，而且他经常采取极端的措施来实现这究极的持续目标。许多$pod_cainites$都在他的手下丧生，甚至没有意识到袭击者是谁。\n\n其在原作中的未来命运\n琐罗亚斯德在他的目标上永不动摇，仍然在安条克统治到今夜。他将成为勒森魃$pod_clan$中的一个传奇，他将被追捧为指导和审判的模范。"
 POD_investigate.desc.791980: "马哈茂德是著名的哈立德·伊本·萨赫勒子嗣，他是早期穆斯林军队的$pod_cainite$战争领袖，他谦虚而优雅地承受着他[Glossary('尊长','game_concept_Sire_desc')]的姓氏的重量。他慢慢地但肯定地向他的同龄人（以及他自己）证明，他在各方面都配得上是他[Glossary('尊长','game_concept_Sire_desc')]的子嗣，他对这个声誉感到非常自豪。\n当不在内志沙漠的荒原上沉思他的[Glossary('尊长','game_concept_Sire_desc')]和他的事业的辉煌时，他就在圣地和阿拉伯各地为伊斯兰牧人处理教派事务。\n\n其在原作中的未来命运\n马哈茂德将取代他[Glossary('尊长','game_concept_Sire_desc')]的位置成为牧人的领袖。他将再次证明自己是一个有才华的人，虽然守旧，但也是众人的领袖。"
 POD_investigate.desc.790563: "一位年轻的萨洛比武者将那些要求对扫罗受到的$pod_diablerie$进行报复的人聚集在他身边，阿多乃带领他们对抗睿魔尔和任何庇护他们的$pod_cainite$。据传言，他手中有几份萨麦尔圣书的碎片。他把他的同胞们组织成一个松散的军事组织，在这里，地位严格通过在战争中赢得的战斗和杀死的敌人来获得。他的声望迅速提高，但他内心燃烧的纯粹的愤怒和仇恨使$pod_clan$剩下的长者们不愿与他联系在一起。\n\n其在原作中的未来命运\n与魔宴结盟后，阿多乃将继续他的讨伐行动。他将把萨洛比$pod_clan$的残余部分改造成一群一心想要复仇的嗜血怪物，他将以他$pod_clan$的所有灵魂为代价来实现他的部分目标。"
 POD_investigate.desc.791126: "当[Glossary('阎魔王','podgloss.yamaking')]罗波那在锡兰岛的堡垒中控制斯里兰卡和印度，他的罗刹奴仆恐吓凡人和[GetTrait('kueijin').GetName( GetNullCharacter )]时，创立涅凤焱[Glossary('心法','podgloss.dharma')]的传奇[Glossary('菩萨','podgloss.bodhisattva')]，伽陀罗迦摩，他从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]回归了。伽陀罗迦摩在接受了他的同胞们的指导后，选择不遵守学/血规定的五向道，而是回到了他的家族，继续照顾和保护他们。\n他召集了当地的兽妖王庭和其他几个鬼神，与其他以他为榜样的[GetTrait('kueijin').GetName( GetNullCharacter )]一起，最终将罗波那和他的堡垒放逐回[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]，重新恢复了岛上的自然平衡。\n这次胜利使他成为[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]中的传奇人物，导致了永雷皇朝的建立。\n\n其在原作中的未来命运\n据说，伽陀罗迦摩最终将通过简单的生活行为实现超脱。今日，他与他家人居住的村庄以他的名字命名。"
 POD_investigate.desc.792186: "从高贵的苏格兰氏族那里抢出名声和头衔的拦路强盗，“邓洛普伯爵”是一个冷酷无情的男人，喜欢随意使用暴力。邓洛普甚至在他的$pod_Embrace$之前就已经是一个可怕的怪物，他把自己的儿子们培养得和他一样凶残，他生命中唯一的一线曙光是他无辜的女儿。\n他的倒台来自于他的贪婪，他袭击了强大的密特拉的财产。梵卓的反应是迅速而无情的，他让邓洛普卑躬屈膝，并杀死了他心爱的女儿作为惩罚。邓洛普被迫屈服，并从密特拉的眼中消失了。但这个受委屈的“伯爵”并没有忘记或原谅，他每天晚上都在策划他对手的倒台。\n\n其在原作中的未来命运\n邓洛普将在维多利亚时代加入一个反对密特拉利益的阴谋。他的失败将导致他和他的 “家族”被驱逐出群岛。由于欠下安布罗吉奥·乔凡尼的债，“邓洛普伯爵”最终将成为一位比以前更崩溃的人。"
 POD_investigate.desc.790705: "谟涅摩出生在高卢的最后的独立日子里，被一个想要保护他们的文化和传统的诺斯费拉图[Glossary('初拥','game_concept_Embrace_desc')]。在他的指导下，她很快成为一名出色的女巫，并在卢泰西亚建立了自己的地盘，者不久后成为了巴黎。\n作为法兰西最古老的$pod_cainites$之一，谟涅摩的影响力和权力是众所周知的，她的支持对于将巴黎的亚历山大赶下台至关重要。不过，她的真正目标仍不明确，这使得她身上的神秘光环更让其他$pod_cainites$感到担忧。然而，谟涅摩感受到了$pod_torpor$的召唤，并希望她的[Glossary('尊长','game_concept_Sire_desc')]能尽快醒来，取代她的位置。\n与此同时，她正试图拯救她姐妹的记忆和思想，它曾被梵卓几个世纪的操纵所扭曲。"
 POD_investigate.desc.790999: "作为最年长的帕伊杜米特活跃分子，玛西娅为她的种姓的传承感到自豪，这是一个战士和骑士的种姓，有着荣誉和责任。但与她对知识的渴望相比，她对战斗的热爱就显得微不足道了。玛西娅承担了为她$pod_clan$撰写《伟大之作》的使命，她一直在努力收集有关她的不同同胞的信息。\n不过，她的一意孤行让她付出的代价越来越大，因为她可怕地看到雷伏诺家族陷入了颓废状态。她现在正考虑在政治上扮演一个更积极的角色。\n\n其在原作中的未来命运\n虽然玛西娅本人和她的种姓将从历史中消失，但她的作品不会，至今仍是对雷伏诺$pod_clan$最详尽的记载。"
 POD_investigate.desc.790975: "让·巴蒂斯特是喝醉了才参与了十字军，这是对他一时的宗教狂热的唯一解释。\n在西西里岛的墨西拿耽搁期间，他发现自己沉溺于各种堕落和异端邪说，自欺说是教宗曾承诺十字军战士的所有罪过都会得到宽恕。仅仅几个星期后，他就放弃了对十字军的责任，向赛特密教屈服。不幸的是，那不勒斯的神殿被毁了，他不得不逃回法兰西。\n从那时起，让·巴蒂斯特就成了巴黎夜生活之主，在这之中满足他每一个扭曲的欲望。他与布鲁赫的维罗妮克·德·奥尔良建立了奇怪的友谊，然后无情地背叛了她，主要是觉得好玩。他现在才考虑到他可能犯了一个错误，刺激了一个有影响力的布鲁赫，并试图争取更多的影响力，包括凡人和吸血鬼的影响力，以挽救他的小命。"
 POD_investigate.desc.791005: "卡门尼塔自意大利，她很快就对罗马雷伏诺的颓废行为感到失望。她搬到了葡萄牙，以便探索她[Glossary('尊长','game_concept_Sire_desc')]教给她的“矛盾之道”私密版本的精神层面。在不了解原始教义的情况下，卡门尼塔形成了这样一种观念：在世俗世界中能够茁壮成长的事物、概念等只能是有限的数量。\n她还热衷于无意识的犯罪行为和其他适合自我满足的行为，这在她的$pod_clan$中非常普遍，引发了曾经的同胞们对她的不满。她与自己的子嗣雅戈·卡斯提尔的恩怨越来越激烈，因为他越来越陶醉于他颓废的锡巴里斯传承。"
 POD_investigate.desc.791762: "对大多数人来说，卢卡斯可能会被误认为是一个神圣修士会的唱诗班成员。他无辜的外表掩盖了藏在下的狡猾怪物，这个怪物以地狱的名义系统性地腐蚀了天主的殿堂。\n作为一位凡人男孩，卢卡斯为自己的完美美貌感到骄傲，当一位流浪的诺斯费拉图$pod_Embrace$了他，来教他一些谦卑的时候，他感到了恐惧。绝望的卢卡斯说，他愿意做任何事情来恢复他的美貌。\n在地下深处，有什么听到了他的恳求，并提出了他的条件。为了满足他们的要求，卢卡斯控制了一座废弃的修道院，开始腐化和献祭无辜者的灵魂，以满足他的黑暗主宰的要求。\n\n其在原作中的未来命运\n卢卡斯将成功地完成他的交易。他胆大妄为，将把他的业务扩展到整个莱茵兰地区，创造了一片相当大的人间地狱。直到他越来越疏忽，把不对的（或正义的，取决于你的立场）注意带到溺亡修道院。"
 POD_investigate.desc.791240: "格雷戈尔生前是一名条顿骑士，以其残忍和粗心而闻名。被一个希望惩罚他的诺斯费拉图$pod_Embrace$后，格雷戈尔反而很容易适应了他的新生活。\n他深入黑森林，很快就因杀死狼人和毁灭了一位强大而古老的尼克图库而闻名。对于像格雷戈尔这样年轻的人来说，这两项壮举几乎都是不可能的，这让很多人相信，在森林的最深处，有些事情并不像它看起来那样。\n这是真的，格雷戈尔被一个神秘的生物迷住了，她被称为“荆棘女士”，是妖精中的一个强大实体。她利用格雷戈尔作为她的代理人，因为她本身就被困在森林里，只要他为自己的目的服务，就会给他巨大的力量。"
 POD_investigate.desc.790207: "春军是泰米尔皇帝大罗茶罗乍的女儿，被一位吸血鬼侍从长诅咒，慢慢消亡。一位流浪的末卡维向她提供了一个解决方案，她勇敢地接受了这个方案，向她的父亲揭露了侍从长的背叛行为，以她的生命作为了代价。她被她的拯救者带入不死族，开始周游世界。\n她宣扬反对血缚，拒绝对凡人抱有领主态度、传统的吸血鬼等级制度和所有失去自由意志的行为。她像刀锋一样挥舞着她的热情和魅力，她的名声迅速扩大。\n\n其在原作中的未来命运\n春军将成为魔宴的创始人之一，希望这个党派能带来受限制的秘盟所缺乏的自由。当这没有发生时，她将再次走自己的道，但这次她有一个强大的世系和追随者，无论走到哪里都会宣扬她的善言。"
 POD_investigate.desc.790641: "哈罗德·泽特勒是“三启示之环”的成员，这是一个由末卡维预言家、哲学家和神秘主义者组成的松散集体，他也是当睿魔尔开始摧毁萨洛比时的有力捍卫者。利用他所拥有的一点影响力来庇护和保护他们，但这不够，而且随着睿魔尔的清剿行动越来越深入，他变得越来越绝望。\n哈罗德恳求任何灵类实体甚至是神明帮助他，其中一位回应了。\n那天晚上，哈罗德·泽特勒重生了，成为他曾经珍视的一切的嘲弄者。\n\n其在原作中的未来命运\n自愿成为被称为“$glossary_wyrm$”的实体的棋子，哈罗德将成为在黑夜中行走的最可怕的$pod_cainite$之一。他的“经历”将真正达到全球规模，留下难以言喻的痛苦和绝望。"
 POD_investigate.desc.790476: "泰瑞姆纳曾经是格拉崔克斯的学徒，格拉崔克斯在她身上看到了固有的魔法火花，以及天赋和奉献精神。她很快就注意到了永生的机遇，并恳求她的主人$pod_Embrace$她，她的主人也照做了，然后让她成为睿魔尔$pod_clan$的正式刽子手，她对这个角色非常满意。\n然而，面对早期睿魔尔$pod_clan$被迫面临的诸多危险，她失去了希望。她现在正在与任何愿意倾听和包庇她的亲王做交易，她知道睿魔尔发现她的背叛只是时间问题。\n\n其在原作中的未来命运\n她的背叛被发现后，泰瑞姆纳将被她以前的盟友回避和追杀，不得不经常改变身份和靠山。尽管如此，她仍将忠于自己，直到终末之夜。"
 POD_investigate.desc.505156: "托马斯是一位小贵族的独生子，在去圣地朝圣之前，他一直是个冷酷无情的人。他的$pod_Embrace$和幸运地加入君士坦丁堡$pod_cainites$改变了他。\n在这个城市一些最伟大的人的教导和照顾下，托马斯成长为君士坦丁堡的尽职后裔，发誓要永远保护他的家园。当第四次十字军东征摧毁了这座城市并杀害了他的导师们时，他没能完成这项任务。\n托马斯从未像许多希腊$pod_cainites$那样流亡，他仍然在他的城市里游荡，希望能拯救它。而且，即使他的导师们会不同意，也要对拉丁人进行一些应得的报复。\n\n其在原作中的未来命运\n在未来数个世纪里，托马斯对君士坦丁堡的命运感到痛苦和怨恨，他将加入遁世会，而不知道他们也参与了对他心爱城市的破坏。"
 POD_investigate.desc.555022: "帕里斯曾经是小亚细亚的亲王，以其俊美闻名。一次，他偶遇一位美丽的女子带着侍女藏身于洞穴之中。那正是海伦，当时仍为凡人之躯，为躲避欲娶她为妻的米诺斯王而逃亡。这对璧人一见倾心。然而，米诺斯是吸血鬼，并非易与之辈。他轻易击败了帕里斯的守卫，掳走了海伦，并将帕里斯弃之如敝履，以为他已死。\n\n然而，帕里斯设法活了下来。在接下来的十三年里，他追寻着米诺斯和海伦的踪迹，最终在希腊的阿尔戈斯城找到了他们。彼时，米诺斯早已将海伦初拥为吸血鬼，置于其控制之下。在部下的协助下，帕里斯成功将一柄利刃刺入米诺斯的心脏。海伦抓住了这个稍纵即逝的机会，当场吸榨，吸干了米诺斯的精血。\n\n海伦随后告诉帕里斯，她已获得永恒青春，也可将此赐予帕里斯。帕里斯拒绝了，他对吸食活人鲜血的想法感到恐惧。于是海伦解释说，另有他法：通过吸饮吸血鬼的血液，凡人也可获得不朽之身，却无需被变为吸血鬼。帕里斯接受了这个提议。\n\n迦太基的覆灭之势无可阻挡，帕里斯无力阻止这一切，事件以海伦将城池出卖给罗马人、并与墨涅拉俄斯结下永世之仇而告终。自那时起，从庞贝到伊比利亚，再到法兰西，帕里斯始终守护在他的挚爱身旁，而这两位玛土撒拉之间传奇般的战争，至今未见丝毫缓和的迹象。\n\n\n其在原作中的未来命运\n帕里斯将继续为捍卫他的爱人而赴汤蹈火，从旧世界到新大陆，直至最终在对海伦避难所发起攻击的，在强大的狼人战斗中殒命。海伦将永远无法真正从他的逝去中恢复过来。"
 POD_investigate.desc.791694: "阿梅林是一个名声不佳且神秘莫测的$pod_cainite$，其原名是一个严守的秘密。他以某种方式维持着开曼群岛的领地，几乎没有发生明显的冲突。阿梅林是欢会​传统的倡导者，他宣布只要任何人持有他的邀请函，他的岛屿就对他们开放。关于阿梅林的身份和世系众说纷纭。未经证实的传言称他是萨洛比，甚至是巴力，但最普遍的说法是他是布鲁赫。有些人甚至认为他是神秘教派遁世会的成员。\n尽管他宣称自己是布鲁贾，但不知何故，他却在练习暗黑奇术和崇魔术，并声称自己的灵魂已经被没收。\n\n其在原作中的未来命运\n阿梅林仍然坚守在开曼群岛，他将专门庇护那些被猎杀和迷失的吸血鬼，努力弥补自己的所见所闻。"
 POD_investigate.desc.791774: "原本是一名西班牙贵族的佐卡洛，已经成为了赛特之子最致命的代理人之一。在欧洲的吸血鬼当中，佐卡洛的名字曾被用来吓唬稚儿，而他执行的方式涉及恐怖、误导和引诱。\n\n其在原作中的未来命运\n佐卡洛的名声和神秘感只会越来越大。他参与了高调的目标暗杀、恐怖袭击和文物盗窃，并将与其他著名的流氓和亡命之徒联系在一起，然后在20世纪突兀消失。"
 POD_investigate.desc.791157: "马齐格得知[Glossary('尊长','game_concept_Sire_desc')]的摩加迪沙被阿刹迈夺走后，便决心将这一污点从自己的世系中抹去。马齐格年老力衰，但她仍在努力将对手赶下台。\n当她的商人出海时，暴风雨肆虐；当她的船员完成清真寺的穹顶时，雷电交加；当她与哈维耶人结盟时，饥荒使他们遭受灭顶之灾。\n一个不那么聪明的女人可能会认为命运本身就在与她作对，但马齐格并不蠢到如此。她意识到有一股古老的力量在与她作对，于是派她的封臣去寻找并转化（或消灭）这股力量。"
 POD_investigate.desc.790938: "扎拉出生在一个[Glossary('遗传血仆','game_concept_revenant_desc')]家庭，为亲王拉兹科利纳服务，她目睹了亲王战争的巨大动荡，并开始相信变化是世界上唯一不变的东西，获得了蜕变的心态，但没有任何改变形式的能力。\n为此，扎拉得到了拉兹科利纳的初拥，并接受了古库都术法的指导。当她的子嗣熟练掌握了该隐之子社会的习俗后，她被派往其他棘秘魑的领地担任特使，在此过程中穿越东欧并访问了肉体大教堂。\n\n其在原作中的未来命运\n扎拉将在叛乱期间加入魔宴，然后成为蜕变之道最著名的学者。她将成为许多人尊敬的导师，但仍在寻求不断的改变，无论是与巴力作战，调查库帕拉还是尝试其他道途。"
 POD_investigate.desc.791706: "正如传说所言，阿迪萨是芙雷雅的女儿和女武神。她云游四地而后引起了波斯国王阿里曼的注意。国王命令她加入军队为其作战，但她不愿受此羁束。恼怒的阿里曼派出军队压制她，尽管女武神如此强大，却也无法抗衡如此压倒性的力量。她在任何条件下都不愿屈服，在持续抗令后的第三天阿迪萨被战士处决。\n芙雷雅降临来带她去弗尔克范格，但阿迪萨拒绝，于是芙雷雅同意给她时间来复仇。她成功了，甚至夺走了国王的真名，以致他的亡生将永远游荡迷失。芙雷雅又回来带她走，但这位女武神仍然拒绝。阿迪萨大仇得报，但还有其他女性受屈，她将帮助她们。她以阿里曼的名义召集她们，这是她征服的正当权力，作为对她使命的提醒。\n此后，阿迪萨便作为她们的领袖行在夜晚。"
 POD_investigate.desc.790460: "拉杜·桑托维奇出生于棘秘魑统治特兰西瓦尼亚的鼎盛时期。获得一位领主的青睐后，拉杜被选为对西方的外交使节。他的主人相信，这位才华横溢的年轻外交官能高效地为他提供信息。当这位[Glossary('遗传血仆','game_concept_revenant_desc')]得知梵卓计划在特兰西瓦尼亚建立七个领地，并由一群血族密党统治时，他的主人赐予他$pod_Embrace$，以便他能够渗透到议会之中。\n拉杜巧妙地让潜在的亲王们彼此对立，确保自己在“灰烬议会”的统治者中占据一席之地。通过定期与其他六个领地的统治者交谈，他迅速赢得了外交家的声誉。通过拉杜，数位棘秘魑贵族能够与欧洲其他地区保持外交关系。拉杜的权威不仅被他的氏族中的贵族和领主承认，也受到特兰西瓦尼亚血族的认可。\n\n其在原作中的未来命运\n拉杜将在谈妥自己的要求后加入魔宴，并成为该教派中守旧者最强大的支持者之一，充分运用他卓越的外交才能为其事业服务。"
 POD_investigate.desc.790252: "阿德罗贾从小就是个调皮捣蛋的孩子，长大后成为了他家乡原住妖精的重要盟友。他与大地的深厚联系引起了当地教派首领克里夫的注意，后者将他[Glossary('初拥','game_concept_Embrace_desc')]并收他为徒。\n当他的导师被一群流浪的西方人杀害时，阿德罗贾在妖精朋友的帮助下进行了报复。阿德罗贾复仇的故事传遍了立陶宛的各个地区，$pod_cainite$的大祭司们对此深感震撼，接纳了阿德罗贾，将他任命为克雷图瓦地区的大祭司。\n\n其在原作中的未来命运\n当条顿骑士团开始建立他们的堡垒时，阿德罗贾将成为最激烈的驱逐他们的人之一。然而，随着所有的诡计和幻术都未能动摇骑士们的决心，阿德罗贾逐渐陷入自己的疯狂中，最终使他对基督徒的战争变得愈加血腥和残酷。"
 POD_investigate.desc.790879: "像大多数冈格罗一样，迪米特拉喜欢新鲜的空气，并厌恶大多数人坚持在肮脏的建筑物中度过时间。她兴致勃勃地谈论杀戮的乐趣、追踪、草药学和其他此类问题，但她对任何与荒野无关的话题都没有耐心。\n在迪米特拉近乎野性的状态下，她几乎没有掩饰她对人类和他们法律的蔑视，这使她在与他们打交道时大多是无情的。\n\n其在原作中的未来命运\n这种无情将使迪米特拉加入以撒的阴谋，虽然这个努力本身会被证明是成功的，但迪米特拉会像她的同伙一样被复仇的秘盟追杀。"
 POD_investigate.desc.790382: "被扫罗与萨麦尔所珍爱，前者可能是出自于爱而$pod_Embrace$她，而后者则被描述为她的兄长。当萨麦尔在巴力之战被杀时，只有雷齐尔和末卡维能够抚慰扫罗的哀痛。在扫罗堕入最后的蛰眠后，雷齐尔便在该隐之子的社会中消失。有的相信她已被毁灭，但黑暗时期有一名族人回报曾在萨莱诺的一名凡人口中听过她的创作。\n\n其在原作中的未来命运\n雷齐尔将在扫罗犯下最大罪行之处陷入[Glossary('蛰眠','game_concept_torpor_desc')]，直到世界末日才会苏醒。"
 POD_investigate.desc.790239: "尼希米尚在人世时是一名渔夫，一场暴风雨让他漂泊不定，在海难中幸存下来后，他的勇气使他了某位血族的[Glossary('初拥','game_concept_Embrace_desc')]。作为第一个在塞浦路斯长住的$pod_cainite$，他成为了塞浦路斯真正的亲王。\n尼希米允许他人随意进出的政策让他在其他亲王中背上了好欺负的名声，但事实上，尼希米并不在乎。他更感兴趣的是发掘自己的血统，建立适合自己的心路系统。\n\n其在原作中的未来命运\n尼希米将创建新的心路，寻找[golconda|E]和伟大问题的答案。然而，他真正找到的只有绝望，直到 2001 年自杀。"
 POD_investigate.desc.790384: "在最古老的传说中未记载其名，仅仅称他为“背叛者”，但在黑暗时代以亚哈称呼他。他者宣称背叛者的名字被其氏族的历史中抹去，在巴力大战后被命名为“亚哈”以标志他的背叛行为——故不清楚他是否是犹大式的角色还是实有这位血族。\n据说亚哈在黑暗洞窟中借着出卖自己的战士兄弟给崇魔者以在巴力大战中幸存。根据萨洛比传说，他继续涉足崇魔学，有的甚至暗示扫罗被$pod_diablerie$在没亚哈的介入下是不可能实现的。\n天下之恶皆归他，有的甚至宣称是背叛者在萨麦尔背后给他致命一击。"
 POD_investigate.desc.790221: "关于阿庇乌斯·克劳狄乌斯·科尔乌斯凡人生活的记载最多也只能说是模糊不清。他是失落部族的成员，同时也是达斯图尔·阿诺什的副手。\n\n其在原作中的未来命运\n阿庇乌斯将在帮助魔宴诞生方面发挥关键作用。他同时针对勒森魃和棘秘魑进行攻击和反抗，而其行为的根源在于他隐藏的主人达斯图尔·阿诺什的操控。随后，科尔乌斯通过成为黑手的第三炽天使，成为失落部族在魔宴阴谋中的代表人物。\n他的灭亡则源于一次相当鲁莽的决定，即接受以利米勒的决斗挑战。至少，他的最终死亡是迅速的。"
 POD_investigate.desc.790945: "罗知槃是迦𫄨里璃的血之长嗣，也是斯里兰卡的棘秘魑君王。她疯狂地热爱自己的领地，并坚信它是一个活生生的、会呼吸的有机体，就像任何其他生物一样。她已经见识到了印度是如何用它庞大的人口基数同化外来入侵者，或者干脆最终将他们硬生生地排斥在外的。\n罗知槃从受印度压迫和遗弃的人群中吸纳她的牧群和追随者，成为那些低种姓者或是丧偶者的妻子。拉蒂-本将一座废弃的寺庙变成了她的避风港，并招揽了一批年长的老妪终日歌颂她的名号。她从这些经历莫大苦痛的人群中挑选血仆和$pod_vitae$。当她的的确确、罕见地$pod_Embrace$一个下仆后，这位后代会以比她更大的热情来摧毁这一让她多年以来深陷赤贫的制度。\n\n其在原作中的未来命运\n在卡迦𫄨里璃$pod_torpor$后，罗知槃将夺取他子嗣们的控制权。为了从那些比她根基更牢固的印度血族中篡夺权力，她将诉诸恐怖主义。她的策略将是卓有成效的，并确保棘秘魑在次大陆变得越来越强大。"
 POD_investigate.desc.791707: "戈捷的功绩是传奇性的。在圣地通过单挑杀死了一位阿刹迈，清除了许多君士坦丁堡的强大吸血鬼，通过在沙漠中的大胆逃亡拯救了圣十字，摧毁了一些最著名的清洁派异端傀儡……他是典范，是天主之光尚未离开这个可悲的世界的剩余。\n他对亚柯骑士的权威是绝对的，他们将追随他到地狱去……而且有些已经这样了。他是暗影裁判所的剑和盾，是与黑暗激战的光明。随着年龄的增长，许多人担心世界将再也看不到这样一个人。\n\n其在原作中的未来命运\n戈捷将像他活着时一样死去，手上有剑，心中有神。80岁时，在他的身体最终无力之前，他将在土伦消灭一群强大的吸血鬼。他的同伴们发誓看到一众天使恭恭敬敬地抬着他去天堂。"
 POD_investigate.desc.791708: "利奥波德是冯·穆尔瑙家族的一位次要后裔，体弱多病，被诅咒拥有一种奇怪的能力：能够真正的“闻”到邪恶的力量。头脑敏锐的利奥波德并没有害怕它，而是利用他的天赋帮助揭露了几起发生在他家里的吸血鬼阴谋。但他并没有就此止步，他很快就来到罗马，向新成立的亚柯骑士提供服务。\n从那时起，他就成为了创建暗影裁判所的主要推动力量，召集了所有试图与各种形式的邪恶作斗争的人。他的家族在他身后支持，利奥波德也许是裁判所最强的支柱，领导着所有夺回夜间的努力。\n\n其在原作中的未来命运\n当吸血鬼逼近他的同伴，暗影裁判所在他周围崩溃的时候，利奥波德将是最后一个站着的人。为了让某人某地知道他们的故事，他将建立“利奥波德协会”，以便在即将消亡的裁判所中生存下去。就算他最终被吸血鬼间谍杀害也不会改变什么。利奥波德协会将继续存在，并成为黑暗世界中的最后一抹亮色。"
 POD_investigate.desc.791713: "圣约翰修女会的现任领袖并不是该修士会的创始人，但她的意志与蒙福的前任特蕾莎修女一样坚定。她是她最初的追随者之一，她曾陪同她到圣地朝圣，在朝圣期间她得到了圣洁的祝福。\n她被称为行政天才，她的才能是实用的，使她能够有效地管理修士会的公共战线、审讯职责以及几乎所有与她擦肩而过的人的生活。说她个人厉害，就是暗示教宗只有一点点神圣。"
 POD_investigate.desc.791715: "维特多利亚是一位智力超常、对天主有强烈爱的女人，她是红修会的非正式领袖，也是暗影裁判所的研究人员。她拥有一种不可思议的直觉，知道什么时候打破规则，什么时候准确地按照东正教方式行事。\n她的智慧超越了她相对年轻的年龄，她在同龄人中拥有最好的声誉。她被一种使她的身体过早衰老的诅咒所困扰，她既要追捕给她施加这种恶毒诅咒的女巫，又要寻找治疗这种诅咒的方法。"
 POD_investigate.desc.791723: "这位欧西坦人间谍首领是神目的首领，该修士会是裁判所的眼与耳。艾格尼恩曾是罗德里格·德·纳瓦拉的中尉，并当该朋友拒绝加入暗影裁判所时而与其决裂。艾格尼恩哀悼他失去的友谊，但他知道圣座将需要一个足智多谋的间谍的强大力量。前盟友对他不屑一顾，新盟友仍对他不信任，艾格尼恩走着有所用处和被视异端之间的孤独道路。\n\n其在原作中的未来命运\n1231年，艾尼恩将被宗教法庭逮捕，并遭受酷刑，直到他承认自己是清洁派异端。尽管他从未透露过他的手下的下落，但这次背叛将预示着神目，以及后来整个暗影裁判所的终结。"
 POD_investigate.desc.791725: "罗德里格是第一位接触到不死族的基督徒，他活了下来，然后选择拿起武器与之对抗。他是纳瓦拉的一个小贵族，正是在清洁派异端期间，他目睹了世界上真正的邪恶。\n与戈捷·德·丹皮尔一起参加了第四次十字军东征，罗德里格的第一次努力是在毫无准备的情况下打倒了一名吸血鬼，在这次袭击中他失去了大量的朋友。\n从那时起，罗德里格就一直在疯狂地试图摧毁任何见到的吸血鬼衍生物……在他偏执的头脑里，这几乎是每个人。因此，他拒绝加入暗影裁判所，并按照自己的方式行动，与圣雅各伯之剑受其支配。\n\n其在原作中的未来命运\n罗德里格与暗影裁判所的松散联系将使他的骑士们在这个机构的垮台过程中免于受到最坏的影响。他们将继续履行自己的职责，直到现代……同时仍然拒绝与任何人交往。"
 POD_investigate.desc.505001: "黑暗之父，首位杀人犯，黑暗暴君。\n该隐是一位传说中人物，没有什么证据可以真正佐证他的许多著名或臭名昭著的事迹。人们普遍认为，他是亚当和夏娃的长子，也是亚伯和舍特的哥哥。他被天主和祂的天使诅咒患有吸血病，作为对他谋杀亚伯并向天主撒谎的惩罚。\n该隐也被认为是莉莉丝的情人，他从莉莉丝那里学会了驾驭现在被称为[Glossary('血律','game_concept_discipline_desc')]的血之力。然后他的故事继续发展到传说中的以诺城（第一城），在那里他$pod_Embrace$出了次代吸血鬼，后者又$pod_Embrace$出了三代吸血鬼，一切都很顺利，直到圣经的大洪水。\n它摧毁了以诺城和所有的“舍特子嗣”。该隐非常沮丧，于是不知所踪。他幸存的子嗣和孙嗣在找他，当他们找到他时，该隐却让他们离开。[Glossary('上古耆宿','game_concept_antediluvian_desc')]（先于大洪水者）只能自生自灭，最终“杀死”了该隐的次代子嗣。当该隐得知发生的一切时，他找到了已经重建了一个新城市（第二城）的[Glossary('上古耆宿','game_concept_antediluvian_desc')]。他们不知道的是，黑暗之父诅咒了他的后代让每个氏族都特有弱点。\n自那以后，该隐就再也没有出现过，只在传说里流传着。"
 POD_investigate.desc.505009: "哈基姆是一位来自游牧部落的猎手，因其敏锐的眼光和公正的思想而被$pod_Embraced$。在第一城和第二城，他都以在争吵的族胞中促进中立而闻名。成为城市的官方法律制定者后，哈基姆厌倦了不断发生的政治暗杀，并将自己和他新生的世系一起流放。在经历了艰难的出走之后，哈基姆和他的孩子们最终在阿拉穆特山区的鹰巢定居下来。这个地方成为阿刹迈的精神、物质和正式的家园。\n哈基姆创建了现在定义其$pod_clan$存在的三个种姓，在反抗可恨的巴力的战争中，他是主要参与者之一，这一事实使他的世系成为了那些受诅的崇魔者的永恒之敌。\n哈基姆在公元前121年左右失踪了，所有寻找他的努力都面临无果。\n\n其在原作中的未来命运\n虽然哈基姆本人再也没有出现过，但当他的故事被阿刹迈内部的一个狂热的异端组织过度扭曲时，人们将感受到他的存在。很快，他遗留下来的形象将化作恐惧和残酷的面貌。"
 POD_investigate.desc.791695: "巴力的祖先也许是最神秘的[Glossary('上古耆宿','game_concept_antediluvian_desc')]。许多该隐之子认为阿舒尔这一名称只是用来隐藏另一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]，或许是绰号，甚至是城市的名字。\n巴力血系的创立者身分最常被说是扫罗——萨洛比的创立者。然而，声称阿舒尔有第三只眼，因此可能是扫罗的说法被许多学者驳斥，认为是睿魔尔对付萨洛比的政治宣传。\n有的该隐之子相信阿舒尔是卡帕多修斯——卡帕多西亚的创立者。然而值得注意的是从未有人听说卡帕多修斯用过此名，只有在书面记载上将此名归于他。\n棘秘魑与哈基姆也曾被指出是阿舒尔真实身分的可能性。\n虽然没有人能确定真相，但最令人不安的理论是上述解释全为真实，崇魔的巴力是被许多[Glossary('上古耆宿','game_concept_antediluvian_desc')]在合作之下创造出来，基于某些深不可测的理由……"
 POD_investigate.desc.505015: "有时被称为伊利耶斯或特洛伊尔长者，他是该隐的[Glossary('上古耆宿','game_concept_antediluvian_desc')]孙嗣，创立了博学的$pod_clan$。\n在第二城，布鲁赫有着冷酷无情的名声。他$pod_Embraced$了一位名叫特洛伊尔的火热青年，其性别各有说法。经过数月的相处，他们之间的感情日渐深厚，布鲁赫对特洛伊尔的信任无人能及，甚至可能爱上了他/她。他对特罗伊尔的$pod_Embrace$直接违反了该隐的训诫。由于一个误会，特罗伊尔以为布鲁赫意图毁灭他/她，于是领导了一场第四代稚子的起义，杀死了其尊长，并取而代之成为布鲁赫氏族的领袖。\n这一事件导致了布鲁赫氏族的二元对立，他们既是传承自原初始祖的博学之士，也是传承自篡位者的火爆叛逆。"
 POD_investigate.desc.505016: "一位古老的$pod_cainite$，现代布鲁赫$pod_clan$的始祖。传说中，原始布鲁赫[Glossary('上古耆宿','game_concept_antediluvian_desc')]被其子嗣特洛伊尔[Glossary('吸榨','game_concept_diablerie_desc')]。随着氏族始祖的消失，特洛伊尔掌管了布鲁赫氏族，并被承认为第三代吸血鬼。\n特洛伊尔随后成为了迦太基最热情的支持者，创造了一个吸血鬼与凡人共存的理想社会，许多布鲁赫如今仍称之为完美乌托邦。与妥芮朵和末卡维氏族结盟的罗马梵卓却不敢苟同，他们称迦太基是一个崇魔者魔窟，并指出特洛伊尔与强大的巴力——摩洛之间的恋情就是证据。结果，布匿战争成为了一场灾难性的事件，以罗马的胜利告终。\n根据巴力的说法，特洛伊尔与摩洛相拥，使用变形术沉入地下以躲避罗马的攻击。罗马的吸血鬼将地面撒满盐并举行了一个仪式，把特洛伊尔和摩洛锁在地下，永世[Glossary('蛰眠','game_concept_torpor_desc')]。"
 POD_investigate.desc.505017: "卡帕多修斯是第一城的始祖，因其智慧和对死亡问题的兴趣而被选中。他一直是个神秘主义者和梦想家，这既导致了他计划的宏伟，也导致了他错误的深重。\n凡人时期的卡帕多修斯在担任祭司和信仰者的期间，曾与消失的灵魂打过交道，并时不时地与它们交谈几句，他也因此树敌无数。当[Glossary('上古耆宿','game_concept_antediluvian_desc')]在$pod_Embrace$的过程中短暂死亡时，那些灵魂在土地之下等待着他，它们试图紧紧抓住他，防止他在该隐的诅咒生效时回到自己的身体里。据说，在某种程度上，它们成功了。\n卡帕多修斯是一个异常活跃的[Glossary('上古耆宿','game_concept_antediluvian_desc')]；他信奉基督教（尽管有他自己的特别之处），并积极与他的子嗣们一起实现他所设计的宏伟计划。\n\n其在原作中的未来命运\n卡帕多修斯将于1444年被奥古斯都·乔凡尼[Glossary('吸榨','game_concept_diablerie_desc')]，这是他实现成神计划（通过[Glossary('吸榨','game_concept_diablerie_desc')]万能的上帝）的一部分。显而对他以外的人易见，这个计划将失败。"
 POD_investigate.desc.505013: "关于伊娜依娅的确切身份有许多不同的说法，$pod_clan$的分裂性质使得描述变得更加困难。\n某个传说中，伊娜依娅被称为“野兽”，是莉莉丝的孩子，并由一群狼抚养长大。\n另一个传说与苏美尔神话有关，伊娜依娅卷入了她、妥芮朵、吉尔伽美什和恩奇都之间的一场大阴谋。\n第三个传说中她是“虎后”，是罗波那的兄弟姐妹。两兄妹在亚洲爆发了一场大战，导致雷伏诺和冈格罗之间的冲突持续不断。\n最后一个则讲述了她和另一个名叫丘尔卡的兄弟姐妹之间的冲突。当战争对伊娜依娅有利时，她却被后来被称为莱本和菈亚南的血族背叛，导致由她而诞的冈格罗不得不向西逃亡。\n除了这些传说故事，几个世纪以来没有人见过伊娜依娅，而她的$pod_clan$，冈格罗似乎更愿意让她的形象停留在神话和故事中，而不是一个真正的领袖。"
 POD_investigate.desc.505019: "勒森魃们将他们先祖的凡生描述为“不值一提”。他总是接近黑暗，在大洪水来临时，阴影者陶醉其中。当洪水退去后，勒森魃加入了他在第二城的会友，直到对第二代的叛乱从而导致他们被该隐审判。\n第二城陷落后，勒森魃回到了海上，最终定居在地中海的一个岛屿，对岛上被称为海上民族的人进行掌控。\n泰拉火山爆发后，黑暗笼罩着天空，勒森魃离开了海洋，在土地上广泛游荡，访问陌生的文化，参与社会实验，为此寻找理想的子嗣。\n当勒森魃在罗马共和国的早期返回时，他居住在西西里岛，为自己建造了一座被他的后人称为暗影之堡的墓堡。在那里，他仍在蛰眠中，只有他最亲近的子嗣陪伴着他，沉思着伟大的深渊。\n\n其在原作中的未来命运\n在大反乱期间，勒森魃显然会被他的子嗣格拉齐亚诺[Glossary('吸榨','game_concept_diablerie_desc')]。比较可能的说法是，勒森魃为了将自己从肉体的桎梏中解放出来，允许自己的[Glossary('吸榨','game_concept_diablerie_desc')]。许多人担心他已经与深渊融为一体，并将试图使世界回到最初的黑暗中，即上帝创造光明之前。"
 POD_investigate.desc.505007: "[Glossary('上古耆宿','game_concept_antediluvian_desc')]末卡维只存在于神话和他的疯狂$pod_clan$留下的印象中。有人说他甚至不是人类，而是天使或是莉莉丝的后裔。故事唯一共同之处是他某种方式被无法治愈的疯狂所眷染，但他的疯狂让他能够透过现实的面纱，洞察其他人无法看到的真相。\n在第二城毁灭后，人们认为末卡维前往了佩特拉城。就在这段旅程中，有人认为最年长的末卡维遭到了攻击并被撕成碎片。袭击者是谁还不知道，但似乎很可能是另一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]试图摧毁他。即使他的身体被摧毁了，人们认为他的灵体仍然存活在他的子女们内部，在他死亡的地方聚集并喝下他流出的血液，将末卡维的本质带入他们的身体中，并使其免受阳光的照射。\n然而，其他的记载表明[Glossary('上古耆宿','game_concept_antediluvian_desc')]末卡维继续蛰眠在佩特拉古城下面，或者他睡在耶路撒冷下面。如果这是真的，他日益蔓延的疯狂可能是长期困扰该地区的地区不稳定的原因之一……"
 POD_investigate.desc.505011: "相传雅斯米利亚德是一位技艺高超、行动隐秘的猎人，他捕猎的技巧点燃了其女性[Glossary('尊长','game_concept_Sire_desc')]那颗早已死去的心。她追逐并$pod_Embrace$了他，但在随后的争斗中给他留下了轻微的伤疤。雅斯米利亚德是一个虚荣心极强的人，这微不足道的外貌缺陷让他陷入了执念，并萌生了杀害其尊长的念头。\n雅斯米利亚德被认为是屠杀第二代的罪魁祸首之一，他对始祖的仇恨引发了随之而来的暴力行为。因此他被该隐严惩，扭曲成了一个面目狰狞的人类。诅咒回荡在他的子嗣身上，影响到了他的每一个后代。\n从那时起，雅斯米利亚德就开始利用血缚子嗣“尼克图库”来追捕他的后代。他计划将他们的死亡献祭给该隐以求得宽恕。\n他曾追捕过芭芭雅嘎——为数不多的未被他血缚的后裔之一，直至俄罗斯，并迫使她与某些邪恶力量结盟以抵御他的追杀。自这场大战之后，他就再也没有出现过。\n\n其在原作中的未来命运\n雅斯米利亚德将会回归，一如既往地充满怨恨。他开始向芭芭雅嘎复仇，因为妥芮朵的美貌而试图谋杀她，并让他世系的亡生变成一个活生生的炼狱。"
 POD_investigate.desc.505020: "雷伏诺的[Glossary('上古耆宿','game_concept_antediluvian_desc')]是该$pod_clan$的传说祖先。它的本质环绕着谎言与半真半假的说法，比之多数[Glossary('上古耆宿','game_concept_antediluvian_desc')]更甚。\n一个传说记述他为雷伏诺，一个潜力十足的年轻男孩，在该隐与狼人的战争时被他亲自[Glossary('初拥','game_concept_Embrace_desc')]。\n另一个传说唤他为吒婆多修罗，一个由众神创造的怪物，用来追捕祂们堕落的勇士——[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]\n最后一个传说记述他为库尔卡——伊娜依娅的兄弟，与她久战最后取得胜利，迫使冈格罗逃向西方，由此导致两氏族间的持续冲突。\n无论真相如何，他已数世纪未曾现身，普遍相信他处于$pod_torpor$。\n其在原作中的未来命运\n吒婆多修罗将在1999年以血狂状态下苏醒。这次苏醒他将屠杀多数族人并几乎毁了整个地区。在最强大的[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]与尽可能找到最大武器的科技联盟合作下才勉强阻止。"
 POD_investigate.desc.505008: "扫罗的事迹隐晦不明，不过能总结为以下：在第一城，古老的以诺$pod_Embraced$了一位具有预言天赋的年青人。异于其他[Glossary('上古耆宿','game_concept_antediluvian_desc')]，这名先知表现出对吸血鬼状态的明显不安。不过扫罗还是尽了身为同族的职责并$pod_Embraced$了萨洛比——医者之氏族。这些血族因为富于同情心而独一无二，非自愿贡献的血液不能饮用，他们是$pod_cainites$与血畜的医者。\n在1133年，身为雏儿血系的睿魔尔希望借着占有一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]的血液寻求认可。经过大量的占卜和搜索，法师们发现了扫罗处于蛰眠形态。毫无防备且无法移动，这位相对被动的$pod_clan$领主，对于野心勃勃的睿魔尔来说是完美的下手目标。一队睿魔尔突袭了扫罗的墓地，族长亲自饮取该[Glossary('上古耆宿','game_concept_antediluvian_desc')]的精华。\n扫罗的某些传说也有更黑暗的诠释。扫罗黑暗的历史出现于数个地点，值得注意的是大多数关联巴力血系的怪异祖先。普遍认为该血系的创始人们是三个崇魔者，他们与吸血鬼血液一同被扔入献祭坑中，一位不以为然的血族长者称他们对邪恶的真实本质一无所知。巴力们声称该长者就是扫罗。\n\n其在原作中的未来命运\n在1995年，扫罗会夺回睿魔尔的身体控制权。正如同传说记载，他会再一次被同时视为救星与怪物。"
 POD_investigate.desc.505012: "与其他的[Glossary('上古耆宿','game_concept_antediluvian_desc')]不同，赛特的故事不承认该隐的存在，取而代之的是对埃及神话的大量借鉴。赛特在埃及的尼罗河畔出生，他是一位伟大的猎人和战士，只有他的兄长奥西里斯能与之匹敌，他们都是统一了上下埃及的酋长拉的孙辈。故事的接下来，赛特回到了埃及并推翻了国王奥西里斯和他的儿子荷鲁斯，成为了统治者。赛特靠强权统治，并且也许（也许不）试图将人类从拉制定的法律中解救出来。\n一些赛特之子拒绝相信赛特曾是凡人，或曾受初拥。相反，他们认为赛特，奥西里斯，伊西斯，荷鲁斯都是真正的神灵。这种信仰在赛特之子中延续了近千年，使赛特之子更像是一种宗教共同体而非真正的$pod_clan$。赛特自己在公元前33年之后便再未醒来，他的子嗣们为他的荣耀回归做着准备，到时赛特会赐予追随者扬升，或是……吃掉他们来壮大力量，这取决于如何解释。\n\n其在原作中的未来命运\n赛特的石棺会在大反乱期间遭受攻击，但他能够保卫自己。在现代的夜晚，忠诚的赛特之子们看到越来越多的迹象表明他们的神灵将要回归……"
 POD_investigate.desc.505006: "亚力科也被称为“雕塑家”亚力科或“舞牛者”伊什塔尔，这位[Glossary('上古耆宿','game_concept_antediluvian_desc')]建立了妥芮朵$pod_clan$。人们普遍认为她美丽、善变、虚荣，并与其他[Glossary('上古耆宿','game_concept_antediluvian_desc')]有染。雅斯米利亚德可能极其厌恶她，因为他既想得到她，又试图（现在仍然试图）摧毁她。当该隐回到第二城并对当时居住于此的[Glossary('上古耆宿','game_concept_antediluvian_desc')]降下诅咒时，他（据妥芮朵氏族记载）放过了亚力科，因为他认为亚力科是无辜的。\n根据记载，她后来成为了苏美尔的女神，直到与伊娜依娅发生冲突才被赶走。她之后再次出现在克里特，成为了弥诺陶洛斯（一位在这个故事中堕落为心兽的吸血鬼）的[Glossary('尊长','game_concept_Sire_desc')]，再然后她出现在叙拉古，成为了阿尔基亚斯亲王的顾问，之后便从历史中消失了。\n\n其在原作中的未来命运\n亚力科在终末之夜侥幸躲过了雅斯米利亚德的攻击，现在居住在克里特，是少数几个没有一心想要毁灭或征服世界的[Glossary('上古耆宿','game_concept_antediluvian_desc')]之一。"
 POD_investigate.desc.505022: "睿魔尔是一位由强大法师转化而成的吸血鬼。当他还是凡人的时候，他是赫耳墨斯秘会的创始人之一，也是睿魔尔家族的创建者，该家族最终成为了吸血鬼的$pod_clan$睿魔尔。\n他是一位以冷血、聪明和激进而闻名的东欧法师，也是秘会创始人中最年轻和最弱小的一位，他通过为他的家族建立起严格的军国主义文化来弥补这缺点，其结构像就一座金字塔。\n他测试了许多创造永生的法术，但发现它们都有致命的缺陷。最终他得出了结论，在不严重削弱魔法使用的情况下，唯一的永生形式是变成吸血鬼。在成为$pod_cainite$之后，他在公元1133年吸榨了扫罗。睿魔尔在吸榨过后几乎立即被打入了持续几个世纪的蛰眠状态。他的身体发生了怪异的变异，包括长出额外的眼睛和缩进身体的四肢。他只能短暂地出面并指导氏族，尽管不知道有多少指导是来自他本人，还是扫罗的灵魂通过他说话。\n\n其在原作中的未来命运\n睿魔尔最终将在与扫罗的战斗中面临失败。他将不得不占据格拉崔克斯的身体，以确保他的灵魂得以生存。到今天晚上，他仍然是‘格拉崔克斯’，领导着同名的小家族，但这仅仅是他曾经拥有的权力的一个影子。"
 POD_investigate.desc.505021: "[Glossary('上古耆宿','game_concept_antediluvian_desc')]棘秘魑，其后代通常称其为最长者，是所有[Glossary('上古耆宿','game_concept_antediluvian_desc')]中最难以捉摸的，因为它专注于蜕变的问题和在这条道路上前进的神秘要求。如果它曾经是人类的话，那么任何相关的部分都早已被抛弃了。\n关于他的生活和$pod_Embrace$的故事比比皆是，但所有的人都认为棘秘魑在成为$pod_cainite$之前就已经几乎不是人类了，有些人甚至说他是纯粹邪恶的体现。他在索取现在的特兰西瓦尼亚的土地时，与名为库帕拉的强大恶魔达成了协议（或进行了斗争，因为传说都不怎么清楚）。\n在巴力战争期间，最长者被萨麦尔袭击然后被正义之火杀死，但它设法把也一同攻击者带走。然后，棘秘魑利用自己的部分精华投入到它的子嗣身上，并在魔龙的肠子里改造了自己。最长者孩子般的身体被带到了肉体大教堂，由沃拉克照顾，同时它聆听了库帕拉的低语，并从恶魔那里学到了更多秘密。\n\n其在原作中的未来命运\n棘秘魑将附身于年轻的美男公·伊利亚什，以便能够再次旅行，然后在大反乱期间伪造他的死亡。然后他将冒充他所谓的“杀手”卢戈行至纽约，进入冥想状态，以达成蜕变。由于棘秘魑没有找到他所寻求的答案，他将在21世纪初再次环游世界。"
 POD_investigate.desc.505014: "根据多数梵卓对其始祖起源的描述，梵卓在第一城由以诺$pod_Embraced$，且很可能是第一个接受$pod_Embrace$的[Glossary('上古耆宿','game_concept_antediluvian_desc')]。有一种说法是，该隐在梵卓还年轻时就看到了他的潜力，于是将他收为养子，并最终交给以诺进行$pod_Embrace$。\n梵卓成为了该隐的左膀右臂并隶属于该隐之手组织，同时作为以诺的代理人在第一城的民众中行事。大洪水之后，十三位[Glossary('上古耆宿','game_concept_antediluvian_desc')]起义反抗并杀死了他们的尊长。由于参与了这场起义，梵卓与其他[Glossary('上古耆宿','game_concept_antediluvian_desc')]（也许除了扫罗）一样被该隐惩罚，赋予了独特的氏族弱点。\n在第二城的后期，梵卓被迫再次担任该隐之手的职务，因为他的兄弟姐妹们在第一次千年圣战中反对他的统治，并互相争斗。在特洛伊尔吸榨了布鲁赫之后，梵卓离开了第二城以寻找该隐。然而，他在城门外被其中一位手足击倒（可能是特洛伊尔，也可能是勒森魃、赛特，甚至是他自己的后裔）。不过，由于梵卓可能后来创造了像乌尔的阿拉库和亚历山大这样的玛土撒拉，所以有些人认为他一定以某种形式幸存了下来。\n\n其在原作中的未来命运\n梵卓再也没有回归，他的最终命运成为了一个谜。"
 POD_investigate.desc.790917: "根据传闻，普斯图拉出生于一个富裕的贵族家庭，最初为奴。他受到了良好的教育，并得到了优待，原本应当成为贵族子弟的导师，教授他们应当学习的一切知识。他对自己的大师极为忠诚，在一场两位$pod_cainites$之间的战斗中，他为了保护主人的子嗣而受伤。塞尔维乌斯被一名诺斯费拉图所救，并被赐予初拥$pod_Embrace$。这位诺斯费拉图向他揭示了那些袭击者的真相。得知此事后，塞尔维乌斯对高贵血统的吸血鬼怒不可遏，几乎陷入疯狂。若非他遇见了塔尼特巴尔-萨哈尔，他本可能因悲愤而踏上自毁之路，在复仇的战场上走向毁灭。\n在塔尼特巴尔的教导下，他学会了将愤怒倾注于讽刺诗歌之中。这种才华先是引起了罗马亲王卡米拉的兴趣，随后更赢得了她的友谊。卡米拉对这位“放肆的瘟疫之犬”用文字羞辱她的对手感到极大的愉悦。\n然而，当他的导师塔尼特巴尔神秘消失后，普斯图拉与卡米拉联手策划，向那些曾为塔尼特巴尔之敌的人复仇。在卡米拉陷入沉眠$pod_torpor$之前，她将这条心路托付给了普斯图拉。随后，普斯图拉离开了罗马，开始在各地传授他的心路，吸引了众多追随者，直到他自己最终也陷入沉眠。"
 POD_investigate.desc.790230: "相传当圣帕特里克来到爱尔兰时，那位被称为摩莉甘的玛土撒拉正饱受未来幻象的折磨。这位古老的血族自愿屈服，接受了其子嗣之一的$pod_diablerie$。艾琳正是其中一位吸榨者的孙嗣。\n她以血魔法师之名著称，且对此传言毫不辟谣。她深知，睿魔尔一族对查明真相极感兴趣。倘若她确实掌握着某种古老的血魔法，那种早于睿魔尔奇术的存在，睿魔尔一族很可能会不遗余力地设下陷阱，将她钉桩制服，并押解至德达勒姆进行解剖研究。反之，若她并无此能，她的名声（以及对野心勃勃的$pod_cainites$同僚所构成的潜在威胁）便会大打折扣。当然，这一切都是虚张声势。身为布鲁赫，除了大多数$pod_cainites$共通的[Glossary('血律','game_concept_discipline_desc')]之外，她并无其他特殊能力可用。\n尽管艾琳胆识过人，她仍每年向伦敦进献一份微薄的贡品，以换取密特拉不干预乌利德事务的承诺。艾琳的圈子由四人组成了血之“贵族制”，分别担任了男爵（艾琳本人）、总管、治安官及看护人。他们并不聚居一处，而是各自占据着沿着东海岸划定的狩猎领地。睿魔尔一族有意向北扩张势力，但艾琳已将他们派来的每一位使者尽数摧毁。"
 POD_investigate.desc.790170: "如果不是雷纳尔多的[Glossary('尊长','game_concept_Sire_desc')]$pod_Embraced$了他，曾是一名骑士的自己早就死在曼苏尔的进攻中了。为了报答，雷纳尔多全心全意致力于暗影再征服。他不相信通融或妥协的解决办法。他甚至资助那些希望在战斗中证明自己的年轻战士，以将这些新生儿的怒火引向那位差点置于他死地的[Glossary('阿什拉派','game_concept_ashirra_desc')]，并希望他们能在他的领地以外的地方大肆破坏。\n雷纳尔多亲王也对圣地亚哥骑士团加以控制，来确保他们不会干涉自己或勒森魃$pod_clan$的计划。不过，这已经引起了圣詹姆斯骑士团不必要的注意，他现在正在仔细考虑下一步行动。\n\n其在原作中的未来命运\n雷纳尔多非常幸运，他的敌人会自相残杀，这让他在未来的几个世纪里完全控制了加利西亚。作为奖励，他甚至还能找到真爱……或者至少是一种扭曲的形式。"
 POD_investigate.desc.790853: "扎姆拉是一名拥有深色皮肤的穆斯林女人，她的尊长训练她的个人格斗术，同时还允许她学习天文学和语言学。迦太基陷落后，扎姆拉与被称为科尼利乌斯兄弟的族胞稚子艾丹合作，从迦太基取回了一些旧信件，这些信件是她的[Glossary('尊长','game_concept_Sire_desc')]马勒古专门写的。\n除了年龄相差悬殊之外，艾丹和扎姆拉和的性格也几乎完全相反：他狡猾阴险，而她则更加直率；他是欧洲十字军，而她至少是个虔诚的穆斯林。他们的存在就能刺激对方，这也激发了两人身为布鲁赫的脾性。然而，巴力对这些文件所构成的威胁，以及持有这些文件的$pod_cainite$，帮助艾丹和扎姆拉克服了彼此的分歧，至少现在是这样。\n\n其在原作中的最终命运\n在艾丹的帮助下，扎姆拉成功打败了名为塞菲拉的巴力。在塞菲拉提到他们的尊长在迦太基时情同手足后，扎姆拉在血狂的状态下直接杀死了这位崇魔者。她和作为布鲁贾稚子的艾丹的在冒险的过程中结下了不可能的友谊，这让她深受震动，并从中找到了慰藉。"
 POD_investigate.desc.791197: "奴隶、毒品、$pod_vitae$和秘密是真加的货物，任何人都可以通过支付合适的价格购买。与土生土长的莱本保持良好关系，真加准备将埃及南部的土地宣布为她的正式领地，作为赛特之子在撒哈拉以南的非洲的行动基地。\n她还试图创建一支名为毕玛（尼罗语中的[ghoul|E]）的新[Glossary('遗传血仆','game_concept_revenant_desc')]血统，只服从非洲荒野中的赛特之子。毕玛计划取得了一些成功，诞生的血仆体型黝黑多毛，长有尖锐的犬齿和厚实的爪状指甲。\n\n其在原作中的未来命运\n真加后来将目光转向了蒙巴萨，继续她在非洲推行赛特信仰的工作。"
 POD_investigate.desc.790567: "与她的许多梵卓同代人不同，尼芙·美日·伊西斯从未坐上王位，而是更喜欢在非洲大陆上游荡。她的声誉是自给自足。当其他梵卓玛土撒拉用军队来解决问题时，尼芙·美日·伊西斯却自己亲自上阵。$pod_clan$内部的传说中，她曾单枪匹马地与赛特作战，并在赛特与她的尊长反目成仇后成功地使他丧失了能力。\n其在原作中的未来命运\n在现代之夜中，她是遁世会的一个积极组成部分，并监督赛特信徒的活动。"
 POD_investigate.desc.790108: "从小就好斗的亚历山德罗出生于马德里，后来他成为一名雇佣兵，并四处寻找战斗的机会。随着年龄增长，他的兴趣从战场上的厮杀转向了管理雇佣兵团，专门研究如何在冲突中选择最有利的一方。\n然而，在长期从事这一行后，他察觉到了战争的某种规律，并为此咨询了许多学者。这一发现似乎触及了某种危险的真相，最终引来了一个矮人的拜访。矮人告诉他关于异教徒军队及其不死主宰的秘密，随后剥夺了他的生命，将他转化为布鲁赫$pod_clan$的一员，使他成为暗影再征服夜战中的一名战士。\n但亚历山德罗很快对这场狂热斗争感到厌倦，转而开始思考暴力的本质。当他发现暴力的根源似乎深植于存在本身时，他选择了兽性之道来试图驾驭自己的战斗欲望，并离开伊比利亚，周游世界宣扬自己的理念。\n后来，他响应喀喇团结原始教徒的号召，加入了利沃尼亚野者，希望能记录他们传奇般的最后一战。\n\n其在原作中的未来命运\n亚历山德罗将在野者最后的战斗中崭露头角，既是学者，也是战士。他将成为少数幸存下来的原始教徒之一。"
 POD_investigate.desc.790269: "阿格尼瑟是一位平和的女人，被称为公平的统治者，与她最信任的顾问一起召开会议，但在饲养场和领土争端的问题上自己做出了裁决。阿格尼瑟经常把自己看作是一名协调者而不是一名亲王，尽管她并不回避这个头衔本身。\n作为梵卓“开化”斯堪的纳维亚的一部分，阿格尼瑟到目前为止对此事采取了谨慎的态度，把前线的战斗留给了她的朋友奥拉夫·维克伦。有些人认为她是个懦夫，但她平和的脾气为她在这片未开化的土地上赢得了更多的朋友，比其他入侵的梵卓所能夸耀的还要多。\n\n其在原作中的未来命运\n阿格尼瑟在梵卓入侵成功后将过渡到奥斯陆的亲王，是其最持久的参与者之一，直到今天晚上。"
 POD_investigate.desc.792235: "埃索拉出生在比斯特里茨郊外的一个麻烦家庭，他一直对战争很着迷。当他能够举起斧头时就成为了一名雇佣兵，他为葡萄牙的阿方索和弗雷德里希·巴巴罗萨作战，并在此过程中赢得了著名的声誉。\n在一次旅行中，他偶然遇到了一场蒙面人和似乎是来自地狱的怪物之间的战斗。在召集被围困的魔法师时，埃索拉把他们从死亡救了出来。\n他得到的回报是睿魔尔的感激和永生，因为他很快证明了自己的能力。此后，他成为睿魔尔领导层中不可缺少的一员，是他们迄今为止最熟练的战帅。虽然他忠于七人议会，但在$pod_clan$的严格金字塔下，他开始感到不安。他想$pod_Embrace$更多的战士，对棘秘魑的据点发动战争，因为他知道只有全面进攻才能结束预兆之战。他的主人不同意，认为他是一个头脑发热的野蛮人，只适合被指为打扰他们研究的东西。\n\n其在原作中的未来命运\n随着魔煞之战和预兆之战达到顶峰，埃索拉对睿魔尔的战争所作出的努力将越来越关键。他将英勇而忠诚地战斗，然后在秘盟形成和睿魔尔不再需要战帅时被遗忘。恼羞成怒的他将在1720年加入格拉崔克斯的睿魔尔叛族者。"
 POD_investigate.desc.790522: "米利巴生于安条克围城期间，她的母亲是第一次十字军东征时期的营妓，靠与骑士们厮混换取庇护。她因其生于罪恶与纷争之中而得名米利巴。\n因米利巴的母亲无力抚养，年幼的她被卖到亚柯为奴。穆斯林买下她并培养成法兰克人翻译官。十五岁那年，米利巴被君士坦丁堡犹大之子（一个脱离埃及神庙且将腐败凌驾于信仰之上的异端支派）的其中一员，苏泰赫安卡伦初拥。可惜苏泰赫安卡伦还未来得及向子嗣灌输教义，便殒命于安条克。米利巴勉强被主系$pod_clan$接纳，却始终格格不入。\n1205年，米利巴加入了同族盟友安德烈亚斯·埃古普托斯的商队。尽管深知圣显者仍会拒绝接纳并主张消灭她，米利巴仍渴望系统学习氏族的古老律法与语言。她甚至向安德烈亚斯献上自己，甘愿地最终被[Glossary('吸榨','game_concept_diablerie_desc')]以强化他的世代，作为对自身存在的赎罪。\n1208年，在商队遭遇红修会的袭击后，安德烈亚斯正式接纳了米利巴。在风暴之主见证下，她被重新命名为美瑞-巴，并开始系统学习古埃及语。\n如今她继续追随商队，寻找那些被$pod_Embraced$却遭遗弃、从未知晓氏族信仰与传统的稚子。"
 POD_investigate.desc.790385: "瓦西克出身于一个亚美尼亚家庭，因难以抑制的漂泊欲望而转向商人生涯，直到最终在大马士革定居。他凭借口才、巧手与天生的游历之心，引起了玛土撒拉巴希尔的注意，后者将瓦西克$pod_Embraced$为其七名门徒之一。\n他追随其尊长与同族弟子们游历中世纪世界，将矛盾之路的教义与《基督教启示录》的内容相融合，然而瓦西克很快便与他的尊长温和的观点产生了分歧。\n公元1101年，在十字军东征期间，另一名门徒遭遇终焉之死，瓦西克随即前往耶路撒冷，并投靠当地的勒森魃。他希望利用城中的混乱，将巴希里特教义传播给他更多的$pod_clan$，甚至其他$pod_cainites$，同时也凭借自身积累了庞大的财富，成为城中最具影响力的人物之一。\n然而，耶路撒冷的雌狮到来并迅速掌控了局势，瓦西克在城中的勒森魃盟友效应大幅削弱。感到威胁的他，如今只得在远方筹划下一步行动。\n\n在正史中的未来命运\n瓦西克对巴希里特的背叛，以及他屡次干扰古老玛土撒拉计划的不幸习惯，终将成为他覆灭的根源。"
 POD_investigate.desc.791047: "相科是一位古老的诺斯费拉图，以曾协助睿魔尔而闻名。他拥有一个广泛的情报网络，甚至是那些消息最灵通的诺斯费拉图也只能羡慕。他的声名显赫，且令人恐惧，这并非没有理由。传闻他是传奇的芭芭雅嘎的后裔，而没有哪个理智的诺斯费拉图敢与铁之鬼婆作对。\n然而，芭芭雅嘎为什么要帮助睿魔尔，至今无人能确定。有一种理论认为，她害怕传说中的库帕拉，因为库帕拉可能对芭芭雅嘎本身构成威胁，而他认为睿魔尔的血魔法是摧毁库帕拉的最佳方式。另一种理论则是他和芭芭雅嘎对棘秘魑怀有难以理解的宿怨，因此联合睿魔尔对抗他们。\n真实的故事或许永远是个谜，因为相科本人从未谈论过此事，而其他诺斯费拉图也不会主动去问。"
 POD_investigate.desc.790882: "朱纳凯多年在成吉思汗的旗帜下征战，逐渐对西方的$pod_cainites$产生了好奇。在同伴不情愿的祝福下，他在蒙古大军之前进入了东欧。伪装成中东的吸血鬼，朱纳凯成功假扮为一名流浪的外交官，甚至在尊敬的领主约根·冯·费尔登的宫廷中任职。\n\n这些年里，朱纳凯一直小心观察，并通过动物传递情报回到自己的族人，使他们在未来入侵时更加准备充分。随后，朱纳凯与匈牙利的绝望贵族诺娃·阿尔帕德达成交易，承诺他的族人会消灭她的敌人——他们本来就会这么做——以换取关于梵卓$pod_clan$的重要情报。\n完成任务后，朱纳凯如今正返回草原，准备率领安答的先锋军，迎战那些他已经非常了解的$pod_cainites$。"
 POD_investigate.desc.791979: "早在伊斯兰教兴起之前，阿拉伯就有三位姊妹女神。乌扎，激情女神和（不）活的金星化身；拉特，占星术、智慧和学习女神；以及玛纳特，财富和命运女神。然而，当先知（愿真主赐福之）来到麦加时，他推翻了麦加所有的伪神，从而扼杀了除真主之外所有其他神的崇拜中心。对真主的三个女儿的崇拜受到了最严重的破坏，这让她们以前的个人崇拜几乎消失殆尽。\n伊斯兰教几乎在一夜之间崛起，该地区的信仰水平也随之提高，这使得乌扎被永久地困在了自己曾经的神殿之下，而这个神殿现在则供奉着凡人的神。\n根据异教的教义，另外两个“女神”——在伊斯兰教的压迫下变得软弱无力——自愿在别处安息，等待伊斯兰教的信仰力量消退到一定程度时，她们就可以自由地解放出来，来帮助被埋葬的姐姐。这两位女神自上而下的所有努力都是为了实现这一最终目标。"
 POD_investigate.desc.791978: "$POD_investigate.desc.791979$"
 POD_investigate.desc.791977: "$POD_investigate.desc.791979$"
 POD_investigate.desc.790436: "在公元前230年接受$pod_Embrace$之前，阿吉夫本是亚历山大港一名心狠手辣、诡计多端的富商，主营香料生意。刚完成转化，他便立刻背叛了自己的[Glossary('尊长','game_concept_Sire_desc')]，将其[Glossary('吸榨','game_concept_diablerie_desc')]。这场叛乱引来了无休止的追杀，他被迫亡命天涯，财富散尽沦为穷光蛋，还得在变形者的追捕与日光的灼烧下艰难求生，数次险死还生。\n阿吉夫随后开始苦心积攒财富，一步步夺回了家族生意的控制权，只不过这一次他全程借由代理人幕后操持。他曾在不死诅咒的囚笼里茫然求索，试图为自己这遭天谴的人生寻得一丝意义；直到伊斯兰教崛起，他才终于觅得归宿，摇身成为这一信仰最忠实的守护者之一。\n公元1120年，阿吉夫迁居耶路撒冷。在萨拉丁对抗十字军的历次战役中，他暗中提供的财力支持起到了关键作用。如今，他正筹谋着一场清算，誓要将圣城之内那些令人憎恶的法兰克人余孽连根拔起，无论对方是凡人还是同为血族的怪物。\n\n其在原作中的未来命运\n阿吉夫的阴谋终将反噬自身。他对麾下子嗣的掌控本就薄弱，行事又向来张扬跋扈，不留余地。待到局势彻底失控的那一天，他会仓皇逃离耶路撒冷，狼狈地逃回亚历山大港。"
 POD_investigate.desc.790555: "伊拉赫是一位嗜血且雄心勃勃的女性，以冷酷无情的统治者闻名。为了巩固权力，她几乎无所不用其极。这种无情帮助她赢得了巴格达的亲王领，但她的权力一直被其他长者限制，城市中的各类吸血鬼因此陷入了一场不安的冷战。\n\n为了最终获得绝对权力，她策划了一场阴谋，试图摧毁凡人的哈里发政权，挑起内战和城市混乱，迫使其他吸血鬼别无选择，只能为了生存团结在她的麾下。然而，这个计划失败了，因为她的对手摩梨东社夜抢占了先机，诬告她谋杀了另一位宫廷成员。她对大胜死亡的狂暴攻击也没能帮助她，反而导致她被判处流放，结束了她短暂的巴格达亲王生涯。"
 POD_investigate.desc.792135: "曼德勒最初从东方，从尼布甲尼撒黑暗统治时期走出，伴随着并困扰着公元前538年返回耶路撒冷的数千名难民。有些人称他（或它？）为恶魔、怪物或“尘卷风”。\n他是阴影中的阴影，传奇中的传奇，即使在其他夜晚的猎人中也是一个可怕的神话。许多人试图猎捕他，或与他交友，无一返回。\n 一些谣言认为他是扫罗的子嗣和学生，另一些人认为他曾是克瑞斯，一个第五世代的棘秘魑，有些血仆甚至声称他是沙漠的精灵，沙尘暴的化身。这些谣言的真实性从未得到查证。 目前，曼德勒是耶路撒冷最令人恐惧的谜团之一。\n\n官方设定的未来命运 \n曼德勒继续在历史中时隐时现。宗教改革时期在波兰和德国见过他，拿破仑二世统治时期在墨西哥见过他。他始终是一个死亡的生物，其动机仍然不明。传闻他应对企图抓捕他的十一名乔凡尼的死亡负责，这些人怀疑他可能与卡帕多修斯本人有关。"
 POD_investigate.desc.791114: "1195年春天的一个早晨，白虎皇朝的范女帝在日出前几个小时离开了她的庄园。她在前往喜马拉雅山前的最后一句话是：“冰封的天空孕育着丰收，奔腾的洪流只带来痛苦；小心，永恒的火刀很快就会落下；我无法抗拒这种召唤，就像我无法抗拒我心头的热血。”\n她是一位谦逊而受人爱戴的统治者，她的离开使白虎皇朝陷入混乱，接近于内战。在这严峻的未来前，她的许多追随者和崇拜者都加入了她的自愿流亡，在山中建立了一个远离故乡的家。"
 POD_investigate.desc.791710: "鲍迪奥恩是贫苦骑士团中最卓有成就的骑士指挥官之一，也是一位在基督教世界各处暗夜冲突中饱经沙场的退伍老兵。他的骑士生涯始于作为戈捷亲手挑选的同伴之一。贝济耶的大屠杀曾令他感到厌恶，导致其信仰动摇；但在卡尔卡松的街道上，通过狩猎那些盘踞城内、不分天主教徒、清洁派或十字军一律捕食的暗夜恶魔，他的信仰得以重燃。\n多年后的今天，他信仰坚定、能力出众。在不跟随挚友利奥波德·冯·穆尔瑙及其宗教裁判所小组进行调查时，他致力于训练下一代骑士。\n\n其在原作中的未来命运\n戈捷死后，鲍迪奥恩顺理成章地成为了亚柯骑士团的新领袖。凭借与利奥波德的深厚友谊，他将骑士团打造成了冯·穆尔瑙家族的剑刃，并在这一过程中将骑士团更名为上帝之剑。"
 POD_investigate.desc.790709: "在支持英格兰起义军瓦特·泰勒的农民中，帕特莉夏成为了他的情人。不久后，她被抓获，被扔进了监狱，等待着死亡，这时一位名叫罗宾·李兰德的布鲁赫向她坦白了他对她的革命热情的钦佩。在对她的牢房结束访问时，罗宾[Glossary('初拥','game_concept_Embrace_desc')]了她。\n在她[Glossary('尊长','game_concept_Sire_desc')]的启发下，她最终成为叛党事业的主要领导人之一。1394年，她是攻击西班牙一座小城堡的队伍中的一员。在战斗中，她趁机吸榨了老哈德施塔特。这一事件巩固了她永远的名声。\n1493年，她去参加荆棘大会，以增强叛党的决心，同时也是为了刺杀小哈德施塔特，他在他的尊长去世后，为了维护秘盟的面子，很快地冒用了老哈德施塔特的身份。这一次她没有成功，现在正从寻求报复的秘盟手中逃亡。\n\n其在原作中的未来命运\n泰勒将被海伦彻底洗脑，在未来的几个世纪里成为她的无思想杀手。终于自由后，她在现代的夜晚努力调和她的行为与结果。她的后人继续战斗，希望有一夜能把她提升到她注定的伟大地位。"
 POD_investigate.desc.792357: "In life, Genevra was an Italian noblewoman, but by night she served the Giovanni as a minor retainer and a vessel of torment. Using her considerable intrigue skills, she managed to outsmart her master and forced him to $pod_Embrace$ her.\nGenevra repeated this success, this time leading Inquisitors to her weaker clanmates. Her assistance in rooting out so many vampires won Genevra the gratitude of the Inquisition, which she was able to parlay into a level of Giovanni influence within the Church itself. The emboldened Giovanni $pod_clan$ was thus able to turn the eyes of these Inquisitors towards rival vampires of other clans. Genevra exploited this unique influence as leverage to gain tutelage in the well-guarded art of Necromancy.\n\nFuture fate in Canon\nHer influence over witch-hunters will wane with the power of the mortal Inquisition; by the dawn of the 20th century, there remains only a small number of hunters who she could reliably call upon. Seeking to strengthen her position, she will turn to outside assistance, the Sabbat.\nTrading her necromantic lore in exchange for the souls of her Sabbat contacts' victims, Genevra will seek to accrue power outside of the Giovanni hierarchy that had ever resisted her. Ultimately, her elders learn of her varied indiscretions, and none other than Augustus Giovanni allows Francis Milliner, founder of the Milliner bloodline, to commit $pod_diablerie$ upon her in Boston in 1999."
 POD_investigate.desc.790456: "加莱亚佐被一名赏识其机敏与意志力的勒森魃修士[Glossary('初拥','game_concept_Embrace_desc')]。成为被初拥的不死者后，他迅速在暗夜贵族中崭露头角，沉醉于新生的黑暗权势。其[Glossary('尊长','game_concept_Sire_desc')]将他带至荆棘大会——因曾与猎巫者结怨，他成为极少数支持秘盟的勒森魃。魔宴成立后，他谨慎周旋于两派之间维持中立，直至将尊长出卖给魔宴才被接纳，并加冕为米兰大主教。\n\n其在原作中的未来命运\n二十世纪时，加莱亚佐终对魔宴粗野的屠戮感到幻灭，开始怀念生前权谋纵横的岁月。通过密使与内环达成协议后，他假借狂野仪典之名，将全城的魔宴血族诱至宅邸。加莱亚佐当众展开最后一份原始版《米兰公约》，并宣布米兰自此臣服秘盟。随着点燃的法典掷入咆哮的人群，他锁闭燃烧的宅邸扬长而去，一举焚尽城中魔宴势力。\n后续的血狩清剿了该派残存的影响，而加莱亚佐得以重塑秩序。如今他正致力于将米兰打造为秘盟的典范之城。"
 POD_investigate.desc.790458: "弗拉德·采佩什生前是瓦拉几亚的一位足智多谋而又残忍的大公，在他“死亡”之前的相当长一段时间里，他一直在饮用被他捕获并锁在德古拉堡中的吸血鬼的血液，并了解他们的秘密。\n由于对黑夜社会的好奇，弗拉德寻找一个能够给予他$pod_Embrace$的指路人——或受害人。他耐心地准备了一个计划，在他的城堡附近策划了一场秘盟与魔宴之间的战斗。一旦两股势力都被削弱，弗拉德就一举消灭他们，俘获剩下的最强大的吸血鬼为己所用。\n弗拉德·采佩什现在是一个非常年轻的吸血鬼，有很多敌人，但他们中的大多数人才刚刚开始了解他的才能。\n其在原作中的未来命运\n在随后的岁月里，德古拉将与魔宴与秘盟相互博弈，就像他的父亲背叛穆拉德苏丹以帮助西吉斯蒙德皇帝一样。他将掌握库都术法的仪式，甚至发现奇术之秘。作为该隐的子嗣之一，他将打破吸血鬼社会的所有规则，成为一位世俗力量和神秘成就的主宰。1897年，他将操纵布莱姆·斯托克出版一本以他自己的亡生为基础的小说，比迄今为止任何其他吸血鬼都更明目张胆地打破潜藏。从那时起，他在很大程度上远离了血族社会，专注于寻找一种方法来驾驭强大的恶魔库帕拉对特兰西瓦尼亚的控制，来为自己所用。"
 POD_investigate.desc.792380: "As a baby, Erianthe was left to her fate on the steps of Knossos Palace, and her parents never knew that she was taken in by an old woman who lived in the crumbling ruins. Theophania, a Malkavian prophetess, raised Erianthe and taught her the ways of the Oracle. When Theophania felt a call to leave Crete, she [Glossary('Embraced','game_concept_Embrace_desc')] Erianthe and left her to serve as the next Oracle.\nErianthe always acts with great dignity, yet she suffers from severe depression. After each successful prophecy, she falls into a deep gloom, and sometimes refuses to take shelter with the approach of dawn. There are times when she looks out over the sparking waters of the Aegean and long to plunge into the waves. Were it not for her faithful and devoted followers, this probably would have happened long ago.\n\nFuture fate in Canon\nErianthe will continue her duty, becoming more and more famous and sought after by powerful Mages to savages Werewolves. Despite this position of deep respect from most supernatural creatures, she will never find the peace she seeks, perhaps the price to pay for her visions and wisdom."
 POD_investigate.desc.790478: "喀什被认为曾是塞尔柱人哈桑·萨米尔，曼齐刻尔特的征服者，最伟大的将军，曾为新生的奥斯曼帝国的两个苏丹服务，土耳其人在诗句中赞美他：“萨米尔，伟大的萨米尔，不可阻挡的萨米尔，古老的蓝天下最强大的战士。”\n该隐之子的历史学家们讲述了不死之手与不朽意志之间的祥和聚会。就在那里，哈桑·萨米尔向一位自称是梵卓的哈德施塔特的不朽者宣誓永远效忠，他是人类和怪物的领袖，他的话语能动摇国家，并拥有不可思议的智慧，他知道话语并不总是足够的。哈桑·萨米尔发下誓言，成为秘盟战将喀什。\n不过，还有篇更阴暗版本的故事。它讲述了一个人为了某种邪恶的目的而变成两个不同的人……\n其在原作中的未来命运\n喀什将一直是秘盟的坚定捍卫者，他经常出现在前线，几乎在所有的战斗中都取得了胜利。当冈格罗$pod_clan$最终决定离开秘盟时，喀什不会。他将追踪叛徒，并在最终被阻止之前让付出了血腥的代价，忠诚到底。"
 POD_investigate.desc.790503: "佩特罗顿于凡生时为塞维利亚的阿隆索·克里斯托·佩德罗顿伯爵，1348年遭遇了那瘟疫；诺斯费拉图的克里斯托[Glossary('初拥','game_concept_Embrace_desc')]了他，救了他的命。\n佩特罗顿很快赢得了残酷镇压叛党的声誉。也许是秘盟最狂热的支持者之一，佩特罗顿甚至让他最忠诚的追随者都感到害怕，担心他们随时会被发现不符合他崇高的期望。\n\n在原作中的未来命运\n佩德罗顿将继续以他为世人所闻名的残酷和专注效力于秘盟，他会成为裁决官，并成为内环处理叛党的得力助手。他在这条道路上颇为成功，几乎摧毁了初生的叛党自由邦。然而，最终他于1997年死于一场更大阴谋的手中。"
 POD_investigate.desc.790998: "Phaedyme was originally a soldier in the army of Alexander the Great, masquerading as a man to escape the fate expected from her sex. In India, Phaedyme was [Glossary('Embraced','game_concept_Embrace_desc')] by Kali, and they traveled the world for a long time before establishing themselves in Gaul.\nThis earned them the enmity of the native Gangrel and the Roman Ventrue. The pair destroyed multiple Ravnos that tried to foray into their territory, mostly Sybarites, a rogue jati (bloodline) of Ravnos descending from Rome. During her travels, Phaedyme befriended multiple powerful vampires, like Zarathustra and Montano of the Lasombra, and Mithras of the Ventrue. She then dedicated herself to master warfare and honor.\nFascinated by the ideals of knighthood and chivalry, she was nonetheless forced into $pod_torpor$ for most of the Dark Ages. Now recently reawakened, she is infuriated to see the ideals she loved having faded away and is gathering her followers closer to India and far from the corrupt sects, hoping to preserve something of the chivalrous legacy in this new home.\n\nFuture fate in Canon\nPhaedyme will survive the almost complete destruction of her $pod_clan$. She currently conducts research into who could have been powerful enough to destroy the Ravnos [Glossary('Antediluvian','game_concept_antediluvian_desc')]."
 POD_investigate.desc.790472: "在生前，卡尔·施瑞克是维也纳一位令人生畏的猎魔人。他是一个有魄力的人，据说他曾让强大的埃里克·艾格曼陷入$pod_torpor$。\n他在一场艰难的斗争中被击败后，被他的[Glossary('尊长','game_concept_Sire_desc')][Glossary('初拥','game_concept_Embrace_desc')]。在裁判所的烈火中幸存下来（对于曾经猎杀恶魔的人来说，这是痛苦的讽刺），他得出结论，秘盟是血族历史上唯一最伟大的事件，并投身于此。\n卡尔在睿魔尔和秘盟中的声誉夜渐提高，许多低估他的魔宴或叛党都被烧在了篝火上。\n\n其在原作中的未来命运\n几个世纪以来，他一直充当秘盟对抗魔宴、叛党和神秘威胁的武器。他镇压或摧毁有关[Glossary('上古耆宿','game_concept_antediluvian_desc')]的知识，消除无数对潜藏的威胁，并且毫不留情地执行任务。他赢得了一批追随者，但敌人却很少。那些成为他敌人的人，都被他消灭了。如今，他是仅存的最年长的睿魔尔之一，并以他一贯的强硬立场领导着这个破碎的$pod_clan$。"
 POD_investigate.desc.790622: "穆赫塔尔·贝伊在凡生是位马穆鲁克，在亡生是强大的开罗亲王安东尼乌斯的保镖。这一切都在狼人的攻击下发生了变化，亲王被杀，留下了受人尊敬的穆赫塔尔，被誉为新的领袖。\n穆赫塔尔·贝伊统治着开罗，视作自由的城市，他没有效忠于不死族大党派，允许各$pod_clan$的血族和遗传在其边界内。\n尽管有各种末日论者要求消灭他，但他还是能够控制开罗的不同派别，而且他赢得了尊重，因为他的统治在政治风向的多次变化中都很稳定。\n\n其在原作中的未来命运\n穆赫塔尔的内疚将在现代的夜晚追上他，那时他将制定一个可怕的计划，为他没有理由弥补的东西寻找救赎。"
 POD_investigate.desc.791793: "生为洛肯，这位爱尔兰兽嫡小部落的亲王，在他们的狼人保护者被对手杀死后，被留下来领导他们。由于他对战争的快速掌握和领导能力，洛朗做得很好，帮助他的部落生存，直到神秘的伊思妲·德·布莱斯的吸血鬼特使突然到来。\n特使感到了机遇，并被洛朗的才能和天使般的美貌所吸引，把他带入血中，成了一位[ghoul|E]，帮助他对他的狼人敌人进行了一次有力的攻击。威胁结束后，他把洛朗介绍给了伊思妲本人，后者很快就看到了这个男孩的潜力，并担任了他的导师。众所周知，伊思妲的教导极其无情，最近被她重新命名为“洛朗”的他很快意识到，法国残酷的宫廷比起爱尔兰的荒野可能更加危险。\n然而，他别无选择，只能向前迈进，洛朗决心尽一切努力取悦他的新主人，并赢得在她身边的荣誉地位。"
 POD_investigate.desc.792066: "There was nothing Hugh liked more than the sound his sword made when it cracked bones, and he heard a lot of that during the First Crusade. Becoming a mercenary to continue his bloody work, he was soon brought into the service of a Ventrue lord. His considerable prowess and loyalty soon earned him enough blood to become a [ghoul|E].\nHugh's life changed again when his charge made too many enemies for even him to handle. Now masterless, Hugh continued selling his skills but was now paid in blood.\nWith his knowledge of $pod_cainite$ behavior, the sell-sword found new masters easily and he exchanged his brutal skills for a taste of their $pod_vitae$. Moving frequently, he soon also worked as a messenger of sorts, earning a reputation of a reliable go between.\nThis inevitably put him into contact with various factions of the Cainite Heresy. Repeated contacts led to his conversion and he now sees his condition as similar to Caine's; he too has to wander the Earth and carry with him the message and blessing of God.\nWith his combination of experience and familiarity, he is now one of the foremost preachers of the Heresy."
 POD_investigate.desc.555034: "曾是卡洛梅娜选民的劣族$pod_cainite$斯坦尼斯拉夫的[ghoul|E]奴隶，巴耶齐德和他的兄弟巴西尔发现他们的鲍格米勒信仰受到了不死族利益的侵蚀。1204年，斯坦尼斯拉夫在米迦勒的幻梦的破灭之中被毁灭，甘滕宾兄弟也从他们的血缚中被解放。从那时起，他们就称自己为“卡洛梅娜的弃民”，并带领着鲍格米勒的信徒在波斯尼亚各地攻击吸血鬼。\n在巴耶齐德看来，撒旦已经在地球上活动，而吸血鬼就是他的代理人。他的使命就是受诅者的灵魂实施可怕的报复——不，是正义。巴耶齐德已经为他想要消灭的生物的血液上瘾，这种矛盾日复一日地撕扯着他的理智，而这样的情况让巴西尔感到担忧。"
 POD_investigate.desc.791873: "莱拉是神秘和传奇的生物，据传是莉莉丝本人的女儿。因此，她的永生与吸血鬼的永生截然不同，她对背叛她的黑暗之母的$pod_cainites$怀有深深的憎恨。\n\n其他线索表明她喝了莉莉丝的血，也许是直接喝的，也许是通过一位古老而强大的指路人的中介。她与神秘的塔尔玛埃拉（强大的长者教派，其中一些崇拜莉莉丝本人）的松散联系加强了这一理论。\n\n此外，她与真布鲁赫氏族成员卡图帕多亚的关联也值得关注，这可能预示着对布鲁赫氏族的一项长远计划。\n\n无论真相如何，莱拉都是非常强大和危险的生物，比一般[ghoul|E]强得多，许多人都在悄悄猜测她的最终目标到底是什么。\n\n她当前的重心似乎围绕着布鲁赫$pod_clan$，在其中播撒不和与猜疑的种子，使得曾经骄傲的哲人王们日益沦为一盘散沙。她一直在\"协助\"冈德亲王迪德里克·雷彻瓦迪根，支持他那建立新迦太基的愿景。"
 POD_investigate.desc.792207: "这名[ghoul|E]，其本名早已湮没无闻，曾是阿刹迈武士在与巴力之战中的门徒。当其主人被毁灭时，血誓的反噬回落于他身上，击碎了他的心智，使他逃入荒漠。旁人皆以为这名[ghoul|E]已与其主人一同殒灭。\n然而他不但幸存，甚至不返回$pod_clan$，反而凭借自身的天赋与过往经验伏击多名$pod_cainites$，借此生存，并以此压制对$pod_vitae$的渴求。\n当他得知一处名为惩罚之巢及其凡人刺客教团时，便前往该处，从其手中夺取了领袖之位。时日一久，这名[ghoul|E]竟自称\"哈基姆\"——阿刹迈氏族的[Glossary('上古耆宿','game_concept_antediluvian_desc')]之名，以此作为对昔日主人阴暗的嘲弄。\n\n其在原作中的未来命运\n许多阿刹迈人将试图抹去这名伪\"哈基姆\"为氏族带来的污名，却无一成功。反过来，他的行径反而赢得了不少战士的敬重，他们开始效仿阿萨辛的恐怖战术。因此，\"哈基姆\"对整个$pod_clan$的影响，最终将远比他自己所能预料的更加深远......"
 POD_investigate.desc.792275: "福尔奇最初是一名跟随阿尔比派十字军的荷兰雇佣兵，出身卑微。从那时起，他就目睹了$pod_cainite$世界中的一切：欺骗、贪婪和虚假的承诺。尽管他为法兰西一些最强大的吸血鬼提供了一流（而且相当残酷的）服务，但福尔奇一直没能得到他渴望的$pod_Embrace$，因为他被认为是太过危险了。\n好吧，福尔奇证明了他们是对的，他背叛了他的新主人，让他走向灭亡。从那以后，这位白发老兵开始像以前被吸血鬼利用那样利用吸血鬼。如果他的血液供应有保证，他会毫不犹豫地背叛或伏击他们。\n\n作为严谨务实的硬汉，福尔克拥有发掘人才（或幸运儿）的灵赋，并能将这些人融入其简练高效的战术体系。雇主们公认他总能完成任务——即便其手段往往直接到近乎枯燥。\n\n其在原作中的未来命运\n福尔奇将继续他的职业生涯数年，以$pod_vitae$替代金币作为报酬，直至某次失败的伏击耗尽他的运气。"
 POD_investigate.desc.792292: "A devout Catholic and one of the Knights of the Order of St John in life, Antonio has a difficult time adapting his faith to his new vampiric condition. He finally found his calling in starting a long term project, the establishment of his mortal relatives as the dominant power in Malta. As Cardona can only feed from members of his mortal lineage, having their best interests at heart felt natural.\nAs such, Antonio is so far slowly learning the ways of the $pod_cainites$, while detaching himself as much as he can from their deadly politics until he is ready.\n\nFuture fate in Canon\nIn 1482, Antonio will achieve complete control over Malta and start looking outwards. His diligence and care for his family will see him prosper and become the first immortal patron of the infamous Mafia. An unexpected $pod_torpor$ will slow down his plans, but he remains a major, if secretive, force in Southern Italy to this night."
 POD_investigate.desc.790416: "生前并无瓦勒留斯之名，只有瓦尔赫尔——一位忠于哈罗德王的撒克逊小贵族。他与贤妻育有三子，皆健壮聪慧，治下百姓安居，土地丰饶。直到一日，哈罗德王召集诸侯，诺曼人入侵英伦，各地领主皆须举兵勤王。瓦尔赫尔毫无迟疑，镇定从容地踏入战场。他死于黑斯廷斯之战，一柄诺曼人的长剑刺穿了他的躯体。而他的亡生也自此开始。自此，他舍弃旧名，取名瓦勒留斯以示新生。最初的数十年，他随其尊长，学者宾杜萨拉修行，后又效忠于密特拉。\n如今他身为治安官，为其君主净化伦敦。\n\n其在原作中的未来命运\n瓦勒留斯曾一度如新星迅疾上升，却也陨落得更快。在密特拉$pod_torpor$期间，他被任命为摄政。然而其治下失误连连，待主君归来之后震怒非常，将他当众贬斥，令其蒙羞而退。此后，瓦勒留斯密谋刺杀主君，前一次未果，而1940年时的第二次则看似成功。\n终于得胜的他退居幕后，辅佐其子嗣与新任亲王安妮·波斯利。但那位太阳神，或许并非凡人所能轻易终结……"
 POD_investigate.desc.505153: "Tercio's personal history is shrouded in mystery. What is known is that he fought for years alongside El Cid, and had a reputation as the most bloodthirsty and skilled soldier in that band of warriors.\nThe $pod_cainites$ of Dark Ages Iberia believe that Tercio has been [Glossary('Embraced','game_concept_Embrace_desc')] two years before his warlord El Cid died (some say as part of an effort to lure El Cid himself into the $pod_clan$ Lasombra), but what is fact is that after El Cid's demise, Bravo has spent decades laboring for the cause of the so-called Shadow Reconquista.\nFor a time he stood beside the Prince of Toledo, as his advisor and general - a position that granted him a long reach among the Reconquista. But while an excellent tactician, Bravo was wedded to a strategy of unyielding attack that did not served him well in all cases, specially once his enemies gotten better at goading him into battles he could not win. Eventually he had to leave his post with the prince of Toledo under a cloud of disgrace, but that also meant Bravo was once again a free agent.\nOver the next century his record has grown increasingly erratic, as personal hatreds and long-simmering feuds with other Cainites have taken precedence over his strategic judgment. As a result, Bravo has been more and more thoroughly isolated and his few confidantes note that he often rambles about being conspired against."
 POD_investigate.desc.792003: "要不是因为$pod_cainites$普遍病态苍白的肤色，拥有年轻且带有希腊古典外貌的以萨迦可能会被误认为是一位年轻的凡人。他沉默而深思，指引并守护着迷失的血族，尤其是那些从未见过他们的[Glossary('尊长','game_concept_Sire_desc')]或被尊长虐待的稚子。他还被誉为一位公平但神秘的导师，喜欢通过沉默或晦涩的哲学进行教导。\n作为一位真布鲁赫，以萨迦对教育拥有布鲁赫血统的血族特别感兴趣，或许是希望他们能更接近布鲁赫，而不是某个名为特洛伊尔的篡位者。\n以萨迦最近的学徒是一个意志坚定的弗洛雷塔，一位他经过长时间的深思熟虑后原本计划亲自初拥的女性。不幸的是，弗洛雷塔被一位同是布鲁赫的竞争对手袭击，且在匆忙中[Glossary('初拥','game_concept_Embrace_desc')]，最终成为了劣族。\n在这场意外事件后，以萨迦离开了巴塞罗那，带着他的学徒正前往迦太基。他知道那里有某个东西或某个人在等待着他，但尚不确定自己应当感到恐惧还是欢迎这一重逢……"
 POD_investigate.desc.710501: "拉撒路是卡帕多修斯的不忠子嗣，一名拒绝其[Glossary('尊长','game_concept_Sire_desc')]愚蠢盛宴邀约并前往埃及的强大血族，自那时起他便摧毁每一个派来追捕他的特工。\n据称他生前是希伯来的死亡学家，因其足智多谋和对死亡的强烈兴趣被[Glossary('初拥','game_concept_Embrace_desc')]。根据许多认识他的人说法，拉撒路一度是卡帕多修斯最宠爱的子嗣，因其博学的思考和敏锐的见解而受到赞赏。\n他也知道尊长对神性的渴望，并努力透过破解萨尔贡残篇的秘密来超越之，萨尔贡残篇是卡帕多修斯亲自写下的包含神秘知识的巨著。\n凯亚斯·柯因内不满其不忠的迹象，于是前往拉撒路在埃及的根据地试图带他回去给氏族创立者发落。两者爆发战斗，藉由使用古蛇术，拉撒路杀了凯亚斯并存活下来。该氏族无力对这名叛乱的子嗣反击，于是任拉撒路与其后裔在埃及自生自灭。\n拉撒路从未受到其父的定罪，他仍然认为自己正在完成父亲的志业。他几乎要达成目标，但被康斯坦西娅和她的代理马库斯·穆萨·乔凡尼挫败。萨尔贡法典在战斗中被毁，而拉撒路陷入$pod_torpor$。\n其在原作中的未来命运\n拉撒路将在现代夜晚醒来，并在嘉布遣修士的伪装下，指导卡帕多西亚$pod_clan$重生为赫卡塔氏族。"
 POD_investigate.desc.791134: "在摩加迪沙，有一位孤身居住的[Glossary('万鬼','game_concept_kuei_jin_desc')]。来自宋朝的饥渴恶鬼白起乘坐商船抵达此地。他对与$pod_cainites$会面兴趣不大，并声称自己已经了解他们，尽管他愿意与莱本见面。然而，莱本们认为与这个孤独的吸血鬼交好或树敌都毫无意义，大多对他置之不理。\n纳伊卜法纳扎知道白起的存在，并一直关注着他的动向，即便她目前还没有理由对他采取行动。"
 POD_investigate.desc.790257: "卡米拉在她那素来专横的$pod_clan$中是个异类，因为她始终坚信合作才是实现$pod_cainite$稳定统治的途径。眼见法兰西的宫廷四分五裂、杀机四伏的现状与理想相悖，她迁居低地地区，并在一名神秘赞助人的扶持下，以异常年轻的资历获得了亲王之位。\n这位特立独行的统治者开始悉心实践理念，与[primogen|E]及周边领地保持密切协作。尽管不乏暴力分子企图颠覆其统治，但迄今为止，卡米拉的好运始终守护着这片独特的亲王领。\n\n其在原作中的未来命运\n卡米拉的改革将对低地地区的$pod_cainites$产生深远影响，最终促成联合体的诞生与区域的长治久安。可惜她无缘见证这一盛景。"
 POD_investigate.desc.790802: "克里斯托夫生前是法兰西西北部一名小贵族的次子，曾以剑之兄弟会成员的身份参与东征。公元1194年，在摩拉维亚山丘的一场战斗中，他的英勇为军队赢得了胜利，但自己却中箭重伤。\n克里斯托夫当时的伤势极其严重，大多数医护修女都认为他必死无疑，但最终还是康复了过来。当他听说布拉格在入夜后遭受可怖的什拉赫塔侵扰时，便前往它们位于波恩银矿的巢穴，将其全部剿灭，并击杀了它们的女主人，不死者阿兹拉。\n事后，布拉格本地血族，同时也是普罗米修斯派和布鲁赫的领袖，智者伊卡捷琳娜在暗巷中拦住了他。伊卡捷琳娜对他的功绩印象深刻，并抢在其他氏族之前初拥[Glossary('初拥','game_concept_Embrace_desc')]了他。克里斯托夫被带到伊卡捷琳娜在布拉格大学的居所后，他虽为自己失去的灵魂哀叹，但仍宣誓效忠于普罗米修斯派的事业。\n此后，作为伊卡捷琳娜的副手，克里斯托夫忠心侍奉，先后与卡帕多西亚、睿魔尔交锋，最终与强大的棘秘魑玛土撒拉老, 布克迪拉卡展开对决。这场战斗以双方同时陷入$pod_torpor$而告终。\n其在原作中的未来命运\n克里斯托夫在现代苏醒，向布克迪拉卡复仇。此后他将再度追随伊卡捷琳娜，参与新的冒险，包括击杀卢修斯·埃利乌斯·塞扬努斯以及发掘迦太基遗迹。"
 POD_investigate.desc.791369: "强硬、永不懈怠的冈格罗博罗维奇正带领普鲁士的异教徒对抗基督教及其德国梵卓的猛攻。尽管他们信仰坚定，战斗力强大，但普鲁士人和$pod_cainites$的异教生活方式前景黯淡。战斗尚未结束，但变得越来越艰难。\n博罗维奇的子嗣腾加尔试图说服他的[Glossary('尊长','game_concept_Sire_desc')]逃离并寻找新领地，但这位古老的冈格罗拒绝听从劝告。\n\n其在原作中的未来命运\n博罗维奇将参与在喀喇领导下的异教徒最后一战。他将英勇作战，并成为少数在与玛土撒拉亚历山大的致命战斗中幸存下来的人之一。"
 POD_investigate.desc.505055: "人们对崇高之主的生平知之甚少，只知道他冒险前往北方时已经年迈。他为日耳曼人担任祭司的期间被认为是北欧神话中的奥丁，而他也欣然接受了这一身份。他还尝试利用日耳曼的部落击溃正在崛起的罗马帝国。有人说这是出于对梵卓的怨恨，也有人说这是出于对整个文明的厌恶。\n帝国灭亡后，他搬到了乌普萨拉，在那里他被奉为活着的神，同时他在北方的各种变形者当中煽动纷争，以加强对居民的控制。在这些日子里，他走遍了斯堪的纳维亚半岛，收留了各个子嗣，后来组成了他的瓦尔基里。这些子嗣寻找英雄，并把他们带到他的神庙中充当血仆。在芬里尔战争中，他利用这些战士对抗狼族芬里尔仔兽。[Glossary('英灵战士','game_concept_einherjar_desc')]在崇高之主的命令下对抗敌人的侵袭，然后他派遣维京人前往南方国家烧杀抢掠。\n当基督教传入北方时，瑞典人民集体皈依了基督教。他们冲进崇高之主的神庙，用火焰、钢铁和真正的信仰将他赶走。随着他的消失，原始宗教和北欧吸血鬼的既定秩序分崩离析。\n\n其在原作中的最终命运\n1977 年，他的孙嗣布伦希尔德发现了他蛰眠中的躯体，并从此开始为他的归来做准备。"
 POD_investigate.desc.790457: "兰巴赫是东欧贵族出身的棘秘魑，专门为了成为不死生物而被抚养长大，并培养至掌握权力的时候。不幸的是，控制性培育的副作用造就兰巴赫脆弱的基因和薄弱的意志力，因此这位被宠坏的子嗣从来都没有信心和勇气来行使他的指挥权，这也使他成为了一个相当优柔寡断的吸血鬼领主。\n兰巴赫一生都生活在对不可避免的$pod_Embrace$的恐惧中，并竭力不去面对。由于他花了太多时间害怕被咬，当他的[Glossary('尊长','game_concept_Sire_desc')]，塔巴克吸干他的血时，他显得痛苦万分。作为一个吸血鬼，兰巴赫变成了一个焦虑不安、绝望和惶恐的恶霸。\n\n其在原作中的未来命运\n兰巴赫的奇异故事才刚刚开始。他将被臭名昭著的德古拉选中，成为他的[Glossary('尊长','game_concept_Sire_desc')]。兰巴赫将看到所谓“卢戈$pod_diablerie$了棘秘魑”的真相。他将了解纽约地下世界的秘密。而在这一切的过程中，没有人会相信兰巴赫，同时他将沉溺和消融在堕落中。\n但是棘秘魑会一直守护着他最爱的后代，直到世界的尽头……"
 POD_investigate.desc.790341: "在魔龙还是凡人时的居处地早已消失。不清楚为何最长者做了转化他的决定，但可以确定的是在魔龙很小时就决定了，直到他长大成人也未曾改变。异于他的许多子嗣，最长者在时刻到来时给他抉择：接受血之馈赠，或是像凡人一样经历生死，一个他不会干预其中的人生。据说这位上古耆宿爱他，不是男人对于情人的爱，而是父亲对于儿子的爱。\n魔龙自视为他尊长与人性联系的保护容器——能理解人类感情能力的残余。当最长者被萨麦尔所杀，魔龙便作为他重生的容器，[Glossary('上古耆宿','game_concept_antediluvian_desc')]在他腔内宛若胚胎般重塑自己。\n在第二世纪时，一次妥芮朵前往塞浦路斯岛的旅程中，他遇见了爱侣——米迦勒。他们迅速迷恋彼此，他也随后成为建立君士坦丁堡幻梦的一份子。在一连串背叛和误解后，他于888年离开该城，此后再也没人见到他。\n\n其在原作中的未来命运\n魔龙将渴望终焉之死，但却被棘秘魑本人拒绝。经过八百年的恐惧与疯狂后，他会被回归的米迦勒释放，两人最终破镜重圆。"
 POD_investigate.desc.505051: "米卡勒出生于美索不达米亚的埃布拉城。作为该城国王的文员，他吸引到亚力科的关注，因而获得$pod_Embrace$。在他恋人马里的陪伴下，此后五十年在埃布拉城被当作神灵一样崇拜。当埃布拉城被阿卡德人攻陷的那一天，他被掳去幼发拉底的基什城。失去马里的痛苦他从未缓和过。\n当天主教兴盛，他采纳之并改名为米迦勒。到了罗马失势后，他跟安东尼乌斯、魔龙一同离开前去拜占庭居住。三人建立了幻梦——持续千年最具影响力的血族政治理念。\n最终三巨头各家的紧张局势趋于极端，导致安东尼乌斯在796年死于盖乌斯之手。米迦勒与魔龙都哀悼安东尼乌斯之死。此后幻梦的统治失能导致米迦勒的逐渐疯狂和魔龙对于该城的弃置不顾。\n然而，他对于辉煌伟大的妄想使他相信自己是大天使。失去情人们无疑加重了他的精神不稳定，在第四次十字军的混乱中，他让他长久失踪的情人玛莉（现今为巴力一员）吸榨他。\n\n其在原作中的未来命运\n米迦勒的灵魂仍在玛莉体内坚守，他最终将在现代夜晚接管控制权，随后开始重建一个完美新幻梦的进程。"
 POD_investigate.desc.505075: "芭芭雅嘎是一个非常强大的诺斯费拉图玛土撒拉，其年龄超过了6000岁。她是著名的诺斯费拉图[Glossary('上古耆宿','game_concept_antediluvian_desc')]的子嗣，与她的尊长没有血缚。小祖母是影幕的维护者，有人认为她是整个诺斯费拉图[Glossary('氏族','game_concept_Clan_desc')]当前化身的祖先。\n芭芭雅嘎最初是谁已经没有意义。人们唯一知道的是她对她的尊长雅斯米利亚德所做出的残酷反叛。复仇心切的[Glossary('上古耆宿','game_concept_antediluvian_desc')]无情地追踪她，让她不得不与被称为$glossary_wyrm$的实体进行黑暗交易，释放出强大的戈里尼奇来对付他。这足以让愤怒的玛土撒拉陷入[Glossary('蛰眠','game_concept_torpor_desc')]，并使诺斯费拉图氏族免遭提前灭绝。\n然而，与魔鬼的契约已经造成了损失，芭芭雅嘎成为她曾经的一个苍白仿制品，现在是一个残忍和虐待狂的鬼婆，足以成为人们的噩梦。俄罗斯因芭芭雅嘎而变得黑暗，只有她陷入蛰眠，才能保护这片土地，避免她以自卫的名义释放出难以言喻的恐怖。从此，她忠诚的“孙嗣”们照顾着她的歇息地和她的领土。\n\n其在原作中的未来命运\n芭芭雅嘎将在1990年苏醒，传说是对事实的苍白模仿。她将彻底孤立俄罗斯，希望最终能一劳永逸地打败她那可怕的的尊长。无论好坏，雅斯米利亚德将在1998年取得胜利，结束了那个逃脱者的亡生。"
 POD_investigate.desc.790277: "传说很久以前蒂妮娅控制着伊特鲁里亚，被当成天空之神崇拜。她是$pod_clan$中第一批涉足意大利半岛的成员之一，并协助建立罗马。蒂妮娅与其他十三位该隐之子统治伊特鲁里亚，直到被其子嗣科拉废黜。\n据说她在到达权力颠峰时失去了创新能力，便开始向最优秀的凡人窃取想法。在榨取血畜全部有主见的想法后她开始感到无聊，动身去探索新的土地与未曾接触过的人们。\n蒂妮娅的后裔们时而表现出她的特质，亦即她探索的热情。当遭遇未知的事物时，他们对新知的渴望往往会战胜理智。"
 POD_investigate.desc.792116: "卡尼斯曾生活在巴格达、亚历山卓、开罗、安条克、迦太基、巴比伦，以及其间所有土地。在不同时期，她曾担任诸多中东$pod_cainites$、术士与等类的宠物、伴侣、守卫与信使。若非她明显具备高度智慧，多数人会将她误认为一只普通的狼或犬——因为她总是以这两种形态之一现身并进行交流。\n她通常率领一群被血仆化的流浪野兽行动，并以自身能力作为守护者或信使换取鲜血、庇护，或未来的人情。\n然而，卡尼斯最突出的天赋其实在于侦察。她天生便是无与伦比的追踪者，数世纪的磨练更使其本能臻于极致。一旦她锁定猎物展开追猎，唯有极为高明且运气极佳的该隐之子才有可能逃脱。\n\n其在原作中的未来命运\n卡尼斯最终在十七世纪向其心兽屈服。 1640年，她与其兽群被一支基督教猎人与术士组成的队伍围猎。对方更有精锐骑兵支援，历时三日追击，最终将她击倒。这位中东最古老的$pod_cainites$之一，在他们手中迎来了她的结局。"
 POD_investigate.desc.790923: "玛格达莱娜出生于威尼斯两大富商家族联姻之家，自幼接受贵族淑女教育，在各项名媛技艺上皆出类拔萃。惊人的美貌与显赫的家世使她成为全城最受追捧的闺秀。强大的吸血鬼纳尔塞斯虽然是她最狂热的追求者，却始终不愿用初拥玷污这份完美，直到玛格达莱娜家族的竞争对手策划谋杀，才迫使他出手转变了她。\n纳尔塞斯很快发现，转变后的玛格达莱娜依然完美如初。她迅速成为他最得力的顾问与忠臣，随后被派往耶路撒冷执行首个重要任务，成功为勒森魃扩张影响力……直到纳尔塞斯意外陨落。从那时起，玛格达莱娜正前所未有地享受着自由与独立的甘美。\n\n其在原作中的未来命运\n玛格达莱娜将发现自己比想象中更精于权术操纵，并在未来几个世纪里乐此不疲地参与政治游戏。大叛乱后，玛格达莱娜选择加入叛族者的阵营，毕竟在她眼中，过于野蛮而不合她口味的叛党与魔宴反叛者利于她的操控。"
 POD_investigate.desc.790582: "玛尼亚是一个来自遥远时代的遗物。她在萨珊波斯帝国统治时期被[Glossary('初拥','game_concept_Embrace_desc')]，从那时起便一直留在波斯。尽管她偏好定居不动，但她的影响力却绵延不绝。在她尚有呼吸之时，便已是年长且有能力的女巫，而吸血鬼$pod_vitae$的加入只使她的力量更加强大。\n她的灵体仆从四处活动，给任何威胁到她的人带来杀戮与混乱。尽管她涉足过崇魔，但她被深植的琐罗亚斯德教背景至今仍束缚着她。然而，随着她本土宗教的衰落，玛尼亚感到自己的决心逐渐动摇。或许距离她真正踏入黑暗魔法的深渊，已只是时间问题。"
 POD_investigate.desc.790356: "根据传说，乌尔·舒尔吉在第二次巴力大战其间首次现身。他凭借着对血魔法的掌控，以一己之力扭转了战局。讲述那场战争的大多数阿刹迈都会说是乌尔·舒尔吉摧毁了巴力的大军，甚至于天崩地裂，血流成河。随后他首次在其氏族前露面，皮肤烧尽，睚中无物。\n\n乌尔·舒尔吉既是难以置信的古老，力量更是难以言喻。他只对尊长尽忠，并改造其$pod_clan$使之对哈基姆更有用处，也因此，对于任何形式的崇拜，只要不是向哈基姆，他都怀着强烈恨意。其中一个例子是他不假思索就处决了第一位接纳琐罗亚斯德教的阿刹迈。此后，他的身影消失在阿刹迈记录下的传说中，也许是长期$pod_torpor$的关系。\n\n其在原作中的未来命运\n乌尔·舒尔吉将在现代夜晚苏醒。即使连根手指都抬不起来，他还是解除了睿魔尔的诅咒，随后杀了其$pod_clan$的现今领导，并继续指导着哈基姆的子嗣们走向黑暗而血腥的命运。最终复仇才刚刚开始……救赎可能永远也不会降临。"
 POD_investigate.desc.791113: "随着五大至尊皇朝的慢慢瓦解，朱雀皇朝陷入了无政府状态，腐败的官员与[akuma|E]争夺权力，同时从凶残的凶民保卫他们的领土，不被格杀勿论。\n虽然许多人已经放弃了反抗，或者干脆加入了混乱的行列，但魔虎披耶·帕永却没有。作为一位引人注目的人物和一位熟练的战士，披耶·帕永对自己的本性也有了深刻的理解，最终将其编入一套准则。\n当她看到一只螳螂在吞噬她的伴侣时，她经历了使她成为菩萨的顿悟时刻。她创立了自己的教派——炽血花，她的理念说，[Glossary('万鬼','game_concept_kuei_jin_desc')]必须像螳螂一样——危险，能够生出致命的幼崽，并愿意在他们的用途枯竭时处理掉她的伴侣。披耶·帕永教导说，女性形态是创造的宝库，“妇女的精华”能使人生育。生命的三个真理被普遍认为是其基本信条；消费、消化和生殖\n随着追随者日益增多，军事胜利接连不断，赤龙已然蓄势待发，准备拯救东南亚，并将这片土地重塑为她理想中的模样。。\n\n其在原作中的未来命运\n披耶·帕永，与她的屋室一起，最终将打败崇拜魔鬼者，并将当地的[Glossary('万鬼','game_concept_kuei_jin_desc')]重组为黄金皇朝。她将在1700年升入百云，但她的遗产——庞南加兰，将继续存在。"
 POD_investigate.desc.791716: "巴黎圣丹尼斯隐修院院长热尔韦斯的声望仅次于维特多利亚修裁判所女。作为黯影裁判所的创始人之一，他曾与挚友伊西德罗共同将红修会打造成圣座的得力助手。1220年，伊西德罗在该隐子嗣的伏击中不幸殒命，热尔韦斯虽击杀血族首领后侥幸生还，却因此深受打击。\n在塞西莉娅修女的怀抱与爱意中（这段双方都深以为罪的禁忌之情反而坚定了他们的信念），热尔韦斯寻得慰藉。这位虔诚的修士以上帝与教会之名，成为盘踞巴黎夜幕的黑暗生物们最恐惧的审判者——他精擅神术，言辞犀利更令人闻风丧胆。\n其雷厉风行的作风为红修会赢得了亚柯骑士的支持，双方都一同奉行先斩后奏的激进准则。\n\n其在原作中的未来命运\n功勋卓著的热尔韦斯最终惨遭身为血族内应的亲信背叛，其死亡直接导致红修会的瓦解。"
 POD_investigate.desc.792406: "法兰西贵族出身的伊琳现统领睿魔尔对黑暗大陆的研究调查（尤其针对赛特之子的魔法秘宝与流亡萨洛比的传闻）。她实则是第三位受命此职的议员——前两任男性同僚皆在诡谲情况下失踪。有传言称他们因故丧失理智，退化成了野兽。尽管睿魔尔内部仅被告知这些议员只是“离职”而去，但众人普遍认定他们已殒命。\n她最具争议的政策是近期推行的本土初拥计划：甄选具有魔法潜质的当地子民进行初拥。此举虽初见成效，却引发强烈反对。\n反对者以伊琳近月深居阿尔及尔修道院不与外界联络为由，斥责其计划荒诞。但另有传言称，伊琳已进入计划新阶段——据闻她正巡行领地，物色兼具魔法天赋与领导潜质的人选。\n\n其在原作中的未来命运\n这些传言终将应验。进入二十世纪后，伊琳会永久消失，令睿魔尔高层对非洲发生的局势彻底陷入困惑。"
 POD_investigate.desc.791036: "几个世纪前，彼得罗曾使用另一个名字，只有奥古斯都和年轻一代中的最长者还记得它。真正重要的是他现在的名字，这个名字是经过精心构造的历史伪造，用以建立他家族的社会资本，声称其血统可以追溯到罗马帝国和朱庇特崇拜。许多比萨的商人相信他的主张，居住在他城市中的年轻血族更是全心全意地相信。\n数十年来，彼得罗将其巨大的财富全部投入到提升比萨共和国的力量上。他非常清楚地了解地中海政治的动向——这也是为什么他对最近威尼斯人的举动极为不满的原因。威尼斯人以友谊之名掩护自己，却可疑地忽视了热那亚的威胁。他的兄弟们采用了他的商业策略，却背弃了他，这一事实不会被他轻易放过。\n清算的时刻即将到来。"
 POD_investigate.desc.790224: "塞伦曾是高傲、凶猛且能力出众的威尔斯王后，协助国王管理王室。但其丈夫与儿子们殒身于连年的封建战争中。丧亲之痛让塞伦退隐到修道院，直到战况发生逆转，她有机会宣称德赫巴思女王的合法地位。\n然而她没能坚持多久，一场路边埋伏使她命在旦夕，是一名卑微的末卡维$pod_Embrace$了这位高傲的未来女王。塞伦在亡生中找到了新目标，她突然将诺曼人的崛起视为对其威尔斯“臣民”的更大威胁，并在帮助新崛起的密特拉摆脱当地的强大血族三巨头方面发挥了重要作用。\n为了回报其忠诚，密特拉亲自任命她为格洛斯特女爵士，迄今她已出人意料地证明自己既是称职的管理者也是魅力十足的亲王。氏族诅咒的疯狂在她身上以亢奋且混乱的行动体现，但当她更加平静时，她确实是令人敬畏的存在，永远不会忘记她终究是一位侍奉上帝的女王，正如她生前理应如是的那样。"
 POD_investigate.desc.791233: "赫门诺德出身铁匠世家，自幼随父学艺，却对书籍与学问情有独钟。从军期间，他因在战场上为保护查理曼大帝挡箭负伤，由此与君主缔结深厚友谊。受封为欧塞尔伯爵后，他成为查理曼大帝最信赖的将领与幕僚，直至在对抗撒克逊人的战役中遭受致命重伤。\n垂死之际中，波乌狄纳发现了他，此后数百年间向他传授布鲁赫昔日的荣光。以多重伪装的身份活动期间，赫门诺德始终心系故土欧塞尔，最终成为法国宫廷举足轻重的政治人物。骨子里仍是理想主义者的他，虽周旋于权力核心试图引导当权者恪守正道，却常在局势恶化时退回研究室或铁匠工坊寻求慰藉。\n历经数世纪淬炼，被称作艾尔的他，既是不死者世界首屈一指的铸剑大师，亦是沉稳老练的亲王。然而他眼中永远闪烁着未竟的渴望，那个触手可及……却始终遥不可及的理想世界。"
 POD_investigate.desc.791302: "巴雷斯奎达作为一名[ghoul|E]被引入了该隐之子教派。当他的[Glossary('尊长','game_concept_Sire_desc')]转向该隐使徒的极端教义时，巴雷斯奎达紧随其后。如今，他是这一新兴教派的狂热信徒，他从不逃避冲突，而他也是该隐使徒在葡萄牙势力扩展的主要推动力。\n他的教派目标很简单：在末日审判之前，将所有$pod_cainites$转化为信徒。届时，世界将被火焰净化，只有忠诚的使徒们能继承该隐的王国。\n尽管如此，巴雷斯奎达像一位大法师一样谨慎而有算计。他很少会轻举妄动或不经深思熟虑行事。正是这些特质，使得他成为基督教和该隐之子教派双方的眼中钉。"
 POD_investigate.desc.792005: "弗洛雷塔一直质疑一切：她作为女人的社会角色、基督教以及世界的运转规律。这种好奇心，加上她的急脾气和污言秽语，使得在适婚年龄为她找到丈夫变得极为困难。而正是这些特质引起了$pod_cainites$的注意，使她成为多个[Glossary('尊长','game_concept_Sire_desc')]争夺的目标。\n对弗洛雷塔而言，这一切以悲剧收场。她被克里斯托巴抓捕并折磨，后来被以萨迦和他的血裔卡塔林救出，带到巴塞罗那的宫廷接受审判。她被判处暂时作为书记员，为该隐之子服务，受到他们的监视。但没过多久，克里斯托巴尔便以武力夺走了他无法通过同意获得的东西，并诬陷她犯下她未曾犯下的罪行。\n在即将迎接日光的时刻，弗洛雷塔再次被以萨迦和卡塔林救出。然而，她暴力的$pod_Embrace$并未真正成功，结果使她在不死的生命中变得比生前更加边缘化。\n尽管如此，有着神秘导师和挚爱的卡塔林相伴，这位满口脏话的哲学家如今比以往任何时候都感到更加自由。"
 POD_investigate.desc.710402: "When Amr ibn-al-As sent his two best strategists to the fortress of Babylon to negotiate the terms of surrender, Al-Muntaqim was one of them. A battle hardened veteran and one of the very first converts of Islam, he still wasn't prepared when the undead patron of Babylon took him, literally, out of time by making him one of the so called 'True' Brujah, masters of time and secrets.\nAl-Muntaqim was never suited for the quiet contemplation that is the modus operandi of his $pod_clan$ though and when words reached him years later that his [Glossary('Sire','game_concept_Sire_desc')] has been killed by one of Troile's hated brood, he flew into a rage. Despite killing many 'false' Brujah since then, that rage never ended, it just cooled down to the point that Al-Muntaqim is now planning more grandiose ways of ending the hated usurpers of Troile once and for all...\nFuture Fate in Canon\nAl-Muntaqim will wander East, and with the help of a mysterious teacher, will usher a new plan. Returning to Cairo, he will set up a safe haven for the Caitiff, hoping to sacrifice them all on the night of Gehenna, giving him enough power to finally take the fight to Troile herself."
 POD_investigate.desc.790369: "Sahar was born in the Phoenician city of Tyre, serving in the temple of Melqart as a praise-singer to the god. His beautiful voice, as well as his lyrical talent, attracted the notice of Tanit, the ancient vampire that had chosen Tyre as her domain. After several nights of long talks about history, philosophy, and religion that intrigued the methuselah, Tanith offered him immortality to continue his studies forever. Sahar accepted and chose the name Tanitbaal in honor of his sire.\nSahar wandered for over 300 years seeking the answers to life and humanity before settling in Carthage. There he spent years in seclusion, compiling what he knew into what would become the main philosophies of the Road of Sin.\nHe was invited by Titus Venturus Camillus, the Ventrue Prince of Rome, to share his teachings. He quickly became his lover, and taught him the ways of the Road of Desire, which would soon be known as the Road of Sin. Camilla and his followers in Rome eagerly embraced the new Road, and it spread quickly from there.\nSoon after, Tanitbaal-Sahar was summoned to Tyre by his [Glossary('Sire','game_concept_Sire_desc')]. He disappeared on the journey – his final fate was never known. However, he is reported to have been active in the 13th century, with Safirah claiming to act at his behest."
 POD_investigate.desc.790292: "作为卡拉卡拉统治时期的古老遗物，尤路斯俯瞰黑暗中世纪世界时，满脸厌恶地唾弃这一切。在他看来，这一切都无法与古罗马相比。然而，他仍以自己的方式，尽力成为这悲惨局面的一丝微光。\n在世时，他是一位颇有声誉的冶剑师。其工艺无可挑剔，声望更是无与伦比。但他的政治手腕稍显欠缺，最终卷入了罗马精英的一场阴谋，被送入角斗士竞技场。凭借他那把完美的剑，他赢得了不少胜利，也因此获得了一位不死崇拜者的$pod_Embrace$。\n自此，他成为不死世界中最受追捧的铁匠之一，再次树立了令人瞩目的声誉。具有讽刺意味的是，这份重要性几乎让他免受不死世界的阴谋伤害——任何试图击倒他的人，都会被他众多且强大的赞助者所排斥。\n于是，尤卢斯夜夜在自己的熔炉前敲打金属，梦想着往昔的辉煌岁月，并一点一滴地在他那闻名遐迩的武器中重现那些荣光。"
 POD_investigate.desc.505090: "米甸是不详出身的末卡维，约9世纪时随萨克森人来到汉堡。不久他开始与当地教会发展关系，并与新兴的商人阶级和其不死族支持者——卢修斯·科尼利乌斯·西皮奥形成竞争。在这场台面下的争斗中取得优势后，米甸于1054年自立为亲王。之后当地教会的力量削弱，大主教搬迁至不来梅，徒留米甸陷于苦涩忧郁的绝望中。\n随着商人的影响力增强，米甸仅仅是其操纵的傀儡。在理解到丧失所有权力后，他的心智终于崩溃了。也因此，他开始了暴行。米甸会[Glossary('吸榨','game_concept_diablerie_desc')]任何进入“他的”城市的$pod_cainite$，将他们的灵魂融入到他的破碎心智蜂巢中，从而创造出他从未拥有过的宫廷。\n现在米甸孤身坐在灰色石塔的空旷宴会厅中，沉思着并与众多廷臣进行复杂的谈话，他们只存在于他的想像中……或许还在他的血液中搏动。"
 POD_investigate.desc.790794: "威廉明娜是北方大地一名凶猛的女猎手，曾是比约恩的一名盾女。当她听说自己的战队阵亡后，便踏上了复仇之路。她首先杀死了烧毁比约恩长屋的凡人，然后开始追杀参与其中的$pod_cainites$。她的足迹遍布整个欧洲，很快，与她无情复仇有关的人都对她的名字感到恐惧。\n喀喇对异教徒团结的号召并没有被这位悍妇忽视，她加入了喀喇的行列，希望能在德意志人的攻击者中找到一些她的猎物。\n\n其在原作中未来的命运\n威廉明娜将是喀喇战争中的巨大财富，但她的脾气会让她吃不了兜着走。在关键的最后一战中，她陷入疯狂，杀死了一名自己人，然后羞愧地逃离战场。她几乎完全堕落为野狼，后来为了赎罪，她将狼化归来。"
 POD_investigate.desc.792012: "关于这位黑发美人的信息所知甚少，她在斯堪的纳维亚和波罗的海之间游荡。人们猜测她是一名疗愈者，她年事已高，并且在使用观占术方面极其精通。她的目标似乎是保护普通凡人免受其他吸血鬼的邪恶侵害，并致力于消灭像巴力和北欧赛特之子（亦称为“耶梦加得追随者”）这样的团体。\n她在丹麦和德意志对波罗的海的十字军征战期间的行动，招致了许多显赫$pod_cainites$的不共戴天之恨，包括长者哈德斯塔特。然而，阿克西妮娅的预言能力至今使她能始终领先敌人一步。"
 POD_investigate.desc.791435: "A princess of Galicia Volhynia in life, Theodora was send to Constantinople for a political marriage and was as such present when the 4th Crusade came. As the Latin crusaders closed in on her, she tried to take her own life but was 'saved' by Edward Fairfax, one of the vampires lurking among the crusaders.\nFairfax soon proved to be a cruel and uncaring [Glossary('Sire','game_concept_Sire_desc')] however, and merely used her as a blood bonded trophy to parade around. Theodora's chance came when Fairfax was forced to flee and join Andreas Aegyptus' caravan. The dutiful Setite, always looking for bonds of domination to sever, slowly helped Theodora understands her new condition, and how to make the best out of it.\nAndreas expected improvements, but he was surprised when, several months later, he noticed that Fairfax and the other crusaders' who were tormenting Theodora were now firmly in her thrall, having been outwitted by the cunning princess.\nAndreas then let Theodora leave for Hungary, their friendship a little soured by the new bonds of domination she created thanks to him, but the princess still promising that she would repay her debt one night.\nSince then, Theodora has wasted no time winning the power and prestige she should have had in life, leaving Andreas to wonder if he has not made a mistake helping the once poor and frightened refugee break out of her chains."
 POD_investigate.desc.790144: "A brute among the outwardly docile $pod_clan$ , Ignazio spent the majority of his mortal life as a strong right arm for the family’s less ethical pursuits. None too intelligent, Ignazio was nonetheless effective at his line of work, and the incestuous Giovanni branch of the Cappadocians [Glossary('Embraced','game_concept_Embrace_desc')] him as insurance. He is one of the increasingly rare ghouls who has been brought into the Cappadocian clan as a reward for exceptional service.\nIgnazio has acquired some distinction by working closely with the Lasombra prince of Venice as well as with the Doge. In addition to his responsibilities to the $pod_cainite$ part of the family, Ignazio controls several local bands of brigands, lending their use to the prince and the Doge in return for favors and other considerations.\nIgnazio’s tremendous physical power and fearsome reputation have earned him the grudging respect of other vampires, but he is quite unpopular among the more insular Cappadocian mainstream. With the aid of his gabellotti lieutenants, he helps to keep Venice clear of criminal elements -the ones who aren’t permitted, that is. He is also instrumental in warding off the rampant lupine population outside the city.\n\nFuture fate in Canon\nIgnazio's faithful service to his family will be his undoing. During the Hecata's bloody birth in the 2010s, Ignazio will be killed by one of his descendants, like many other elders Giovanni."
 POD_investigate.desc.790553: "莫林是一位年轻的巴力，接受了传统的训练，曾在穆斯林哈里发尚未发迹的北非生活。她靠利用早期穆斯林的异端思想过着舒适的生活，直到一次图阿雷格人的袭击让她失去了所有追随者，并被困于沙漠的洞穴中。\n经过大量的研究，赫克托发现了她，并邀请她成为他新拉凯达蒙尼亚的女祭司。莫林看到了这个机会，迅速同意了。自从她苏醒后，便在赫克托的乌托邦中发展自己的信众。虽然他们目前还不是崇魔者，但莫林正在下盘大棋。赫克托似乎非常致力于重现昔日的迦太基，如果他想成为这个新时代的特洛伊尔，那么莫林也愿意成为他的摩洛克。\n\n其在原作中的未来命运\n莫林对赫克托乌托邦的缓慢破坏将比她预期的速度更快，不到40年，她将成为腐化后的“新拉科尼亚”的真正首领。"
 POD_investigate.desc.790762: "这个怪物自称为加比亚，但知晓其名的人寥寥无几，更少有人相信它就是与之同名的火焰女神。据传，加比亚是一名几近野兽的$pod_cainite$，徘徊于波罗的海的迷失灵魂之间。然而，真相比传闻更加阴险：加比亚并非野兽，而是最可怕的那种怪物——聪明的怪物。他深谙$pod_cainites$的行事方式，了解他们的限制、恐惧与弱点。通过伪装成野兽，他让对手低估他。而一旦对方大意，那往往便是他们最后的错误。加比亚唯一尊敬的，是比这片土地本身还古老的真正主人。至于其他人？他们只是他的猎物。\n\n其在原作中的未来命运\n加比亚将对埃格莱与诺亚施展他的诡计。这两个吸血鬼妄自尊大，敢在他的领地中自封为亲王。伴随着他们的惨叫声，任何入侵者在未来几十年里都将被彻底吓退。"
 POD_investigate.desc.505101: "传说称多布鲁可能是大地女神伊图根之子，甚至是伊娜依娅的直系血裔。当伊图根遭到[Glossary('万鬼','game_concept_kuei_jin_desc')]袭击时，多布鲁与其他兄弟誓死守护母亲，与恶魔强盗展开长达数日的血战。正是他坚守阵地掩护女神撤退，最终却被夏魔萨满的诅咒击中，从天而降的火球将他轰入地底深处。这场爆炸未能杀死他，反而让恶魔的诅咒与大地母亲的拥抱交织，将他重塑为强大的玛土撒拉。\n无法真正回归家族的他，在安答中培育出一支适应灵界的亡灵战士，并将对夏魔的刻骨仇恨灌输给他们。如今他蛰眠的躯体由子嗣（可能还有其他[Glossary('万鬼','game_concept_kuei_jin_desc')]）守护，周围还有大量怪诞变异的巨型野兽。\n\n其在原作中的未来命运\n他最终在[Glossary('第四纪元','game_concept_fourth_age_desc')]末期被[Glossary('万鬼','game_concept_kuei_jin_desc')]击败，这场战役几乎全歼围攻他庇护所的五个屋室。幸存者将他的躯体运往哈拉和林，[Glossary('万鬼','game_concept_kuei_jin_desc')]通过仪式召唤所有安答血裔进行屠杀，这场清洗在1388年前彻底灭绝了整个血系。但有传闻称多布鲁本人逃脱，至今仍在策划血腥复仇。"
 POD_investigate.desc.791095: "巴哈特正在逃亡中。他对赋予他新名字的[Glossary('尊长','game_concept_Sire_desc')]及$pod_Embrace$前的记忆非常模糊，只隐约觉得自己曾被血液治愈了某种疾病，但他的记忆也因此受到了影响。不久后，巴哈特的尊长被毁灭，他被迫逃亡。现在，他唯一清楚的是，即便是他这一奇异种族的其他成员也痛恨他，并想将他除掉。他从未遇见过其他拥有像他一样的第三只眼的$pod_cainite$。\n很快，他发现自己在逃亡方面颇为在行。亚丁是一座偏僻而安静的城市，自那时起，他保持低调，避免与其他$pod_cainites$接触。他试图通过力所能及的小善举为自己的存在找到一丝意义，同时尽量不引人注目。"
 POD_investigate.desc.792484: "谢珀原本是一名埃及商人，在拜占庭统治时期穿越大马士革时，成为巴力的[ghoul|E]信使。当哈基姆圣裔攻击并摧毁了大量位于黎凡特的巴力巢穴时，谢珀在向主人发出警告方面发挥了关键作用，并因此获得了$pod_Embrace$的奖赏。\n从那时起，他一直隐藏在暗处，目睹大马士革的成长。他也看到安纳齐尔因过于大胆的举动犯下了不可饶恕的错误，危及整个巴力的存在。谢珀决定采取行动，等待合适的时机将他的长者扔给阿拉穆特的狼群……而不暴露自己的身份。"
 POD_investigate.desc.792488: "Brenda hails from Latin parents who settled in the Levant shortly after the First Crusade. She grew up more Arab than European. In fact, she displayed such an ability of understanding both sides that the Lasombra [Glossary('Embraced','game_concept_Embrace_desc')] her as an intermediary between the Christian and Muslim branches of the divided $pod_clan$.\nBrenda's even manner and ingratiating attitude earned her a place within the Muslim courts, where she remained as an ambassador. With the eventual dissolution of the Kingdom of Jerusalem, Brenda converted and started calling herself [Glossary('Ashirra','game_concept_ashirra_desc')].\nSince her conversion, she has risen to unprecedented power within Baghdad. She has successfully nurtured contacts with the powerful Persian Banu Haqim and the influential Ray'een al-Fen.\nIn many ways, Brenda is setting herself up as a likely compromise candidate between all the powerful factions of the region. A tenuous position, but one with great potential rewards."
 POD_investigate.desc.790524: "恩卡拉出生在底格里斯河畔的塞琉西亚，作为一个奴隶女孩。她被伊希姆·三重蒙福选中，他是一位著名的阿刹迈战士种姓成员。他给她取名为“恩卡拉”，在早已被遗忘的苏美尔语中意为“武器”，并花费了八个世纪的时间将她锻造成一名战士。\n作为一名保守派，她不同意伊斯兰教在她的$pod_clan$内壮大，同样也不赞成刀锋之网的扩张以及其灭绝$pod_cainite$的教义。在第二次巴力战争结束时，她已经凭借着自己的力量成为了一位受人尊敬的长者。在她强大的尊长，伊希姆·乌尔·巴尔失踪于一次针对哥拉汛的远征之后，她亲自率领一支由十五名阿刹迈战士和三十个血仆组成的远征队前往那座崇魔者的堡垒，并找到了堡垒的南部入口。\n她到达了哥拉汛的心脏地带。在那里，她发现至少十二名巴力和几百名凡人聚集在这里，正举行一个召唤恶魔纳姆塔尔的仪式。虽然恶魔的召唤仪式最终被打断，但伊希姆和其他十二名阿刹迈战士也迷失在了纳姆塔尔手中。\n\n其在原作中未来的命运\n不顾大术士阿什拉夫的阻拦，恩卡拉将在1242年再次开启她拯救伊希姆的远征。这将是是哈基姆圣裔犯下的最可怕的错误，因为它将引爆一场可怕的背叛并导致一个恐怖的诅咒在恩卡拉的同胞中传播。而对恩卡拉本人而言，她将承受有生以来最大的痛苦。\n无处可逃，就算是死亡也无法拯救她。"
 POD_investigate.desc.791167: "罗德里尔在曼加卢尔已经有将近900年。他是圣托马斯基督徒，接受了他的$pod_clan$的西方命名法，在皈依时取了一个希伯来名字。与他的许多族人不同，罗德里尔走的是王者之路，他认为统治是牧养死亡和保护土地的最佳方式。如果他动摇了，檀那婆和那伽罗阇会吞没一切，将灵魂献给他们原始教徒的神，并吞噬剩下的肉体。\n尽管有这样的信念，但他对印度教和那伽罗阇的怪异方式还是给予宽容和了解。他仅靠赞美来维持和平，并担心目光短浅的睿魔尔会对该地区做出什么。"
 POD_investigate.desc.791709: "亚柯骑士的大多数成员从未见过让爵士，因为他是戈捷大师的左手。这位骑士头脑冷静，言辞犀利，从体质上讲不喜欢受愚，是骑士团的主要战略家、战术家、后勤专家和情报整合官员。除了在战场上指挥部队，他什么都做，这更多的是对时代偏见的让步，而不是他自己的任何缺陷。\n如果骑士团意识到戈捷的左手不是一位特别能干的男人，而是一位特别能干的女人……整个地狱肯定会崩溃。"
 POD_investigate.desc.790448: "Born in England, 1324 CE, Edmund was a Kinfolk to a family of aberrant and foul werewolves dedicated to despoilment and savagery. He was to become a knight, to be taught the language of battle, of noble service, and the art of diplomacy. In time he developed a reputation as a loyal warrior and accomplished hunter - while not at war, Edmund hunted fierce game, purportedly including Lupines, which he trapped and slew with relish. He served with distinction during the Hundred Years' War against France and was recorded in history books as one of the most tactically brilliant soldiers of his age.\nIn reality, his [Glossary('Sire','game_concept_Sire_desc')], Valdemar, gave him the $pod_Embrace$ ruthlessly and treated him as little more than a tool to be wielded. From that point on, the vampire that would be known as Talley acted as bodyguard to many notable Lasombra, including his ancient ancestor Boukephos. He followed the $pod_clan$ in its journey to the Sabbat, and even served Archbishops and Cardinals in whichever vile and inhumane ways they directed.\n\nFuture fate in Canon\nTalley's story is only beginning. His rivalry with his 'colleague' Lucita of Aragon will be legendary. He will also serve the Sabbat faithfully for centuries, before switching sides to the Camarilla, or to Lucius Sejanus by other accounts. In any case, Talley might be the most feared and accomplished assassin still active in the modern nights.\nExcept maybe Lucita, but don't tell him that."
 POD_investigate.desc.792593: "归来的王。活法老。复仇者。荷鲁斯有很多特点，但首先，他是奥西里斯和伊西斯的复仇之子。\n荷鲁斯的一生都在于他的叔父赛特的战争中度过。有过许多挫折，但更多的是胜利。他失去了自己的眼睛，但让赛特付出了沉重的代价。\n死亡对他这样的生命来说没有任何意义，他用生命神咒重生，永远地重生，直到有一天，对抗赛特的最终胜利终将属于他。从开始，荷鲁斯就组织了他忠诚的木乃伊军团，发动了永恒的战争，以恢复这个世界的平衡。\n\n其在原作中的未来命运\n荷鲁斯的复仇将以多种形式继续，但永不会真正结束。赛特将逐渐被逼退，而新一代的英雄们将如他应得的那样，向这位复仇之子致敬。"
 POD_investigate.desc.792557: "海伦从修道院被召唤到盖亚的道路上，是一位极具侵略性和智慧的女性。她不仅能够保护自己，还能创作歌词，并在谈判中毫不留情，是一个复杂而富有挑战性的人物。\n她长期以来一直寻求增加黑怒在声望卓著的日耀族群圣地的影响力，并利用了其年迈的前领袖纪尧姆的衰老。她温和而坚定地将纪尧姆青睐的继承人银嚎推到一旁，如今面临着在一个主要由银嚎部族组成的圣地中巩固自己领导地位的艰难任务，同时还必须确保那些可恶的吸血鬼不会利用这个潜在的弱点侵占他们的土地。"
 POD_investigate.desc.792531: "露西尔是一位鲁莽、开朗而又残忍的年轻啮骨者，她追求荣耀和名声，不在乎在过程中谁会受到伤害。她的战术相当粗暴直接，这使她成为一个与众不同但战果颇丰的部族成员。露西尔拒绝接受狼族为她的族人设定的“异类”传统角色，决心证明自己可以和任何自命不凡的“狼人贵族”一样好，甚至更好。\n在制造了一连串在英格兰臭名昭著的“壮举”后，她最近出现在星域族群的圣地，这让人颇为惊讶，尤其是考虑到该圣地在不久前对附近裁判官的灾难性袭击后正处于凋敝状态。更令人意外的是，她至少在一定程度上扭转了星域族群的衰落。当地的狼族现在谨慎地等待着她的新动作，心中暗自揣测这个莽撞的年轻人是否真的得到了盖亚本人的祝福来拯救他们。"
 POD_investigate.desc.792585: "蒂莫和他的挚友伊利亚是最受尊敬的盖亚之子中的两位。他们以荣誉和责任感领导着白海族群的圣地，但对敌人毫不宽容，这使得他们赢得了其他部族的勉强尊重。\n\n其在原作中的未来命运\n蒂莫和伊利亚将成为部族的传奇人物，被尊敬为在动荡时期平衡领导的典范。"
 POD_investigate.desc.792526: "Bladdud comes from a troubled lineage, and lived his whole life to transcend it. He left Wales and traveled the Isles, never revealing his name or lineage. He fought alongside the Fianna in many battles, slaying a Thunderwyrm in the bogs of Ireland and ending the unlife of an ancient vampire in the Scottish Lowlands.\nHe reclaimed an ancient Fianna caern in Northumbria from the Fenrir by trickery and bravery, outwitting the caern’s crafty totem and then facing a Fenrir champion in single combat. In his 21st summer, he challenged the highest chieftain of the Welsh Fianna to single combat and took the Antler Crown from his fallen rival. He made his defeated foe his closest advisor, and then worked to bring unity to the fragmented and fractious Fianna packs of the British Isles. However, his ambition is greater still.\nBy uniting all the remaining Garou in the British Isles, Bladdud hopes to form an unheard of united front against the invaders.\n\nFuture fate in Canon\nBladdud will make sure that the British Garou survive the difficult times ahead. He won't be able to overcome the one foe that cursed his lineage however and will die Klaive in hand, and his family's name restored by his bravery."
 POD_investigate.desc.792503: "伊萨博在法国被作为一名体面的淑女抚养长大，由于过早经历的原始觉醒以及魂怒带来的微妙威压，使她年纪轻轻就掌控了家政大权。她凭借强硬手段嫁给了一位软弱的小贵族，并很快在海外领地获得一笔意外遗产后随夫前往圣地。\n自那时起，伊莎博便成为光誓圣地的重要成员。她代表着不断崛起的年轻创新派，渴望将领土扩展到亚柯城区之外。作为一名满月化形者，她精通恐吓、勒索且拥有强悍的肉体力量，这使她成为了圣地真正的支柱。\n\n其在原作中的未来命运\n伊莎博没能从光誓圣地的陨落中幸存。尽管她竭尽全力，仍无法阻止崇魔者教团占领亚柯。她最终被受教团摆布的亚柯骑士杀害，但在牺牲前，她亲手解决掉了大部分骑士……这反而在客观上为崇魔者的最终胜利铺平了道路。"
 POD_investigate.desc.792570: "伊冯娜是芬里尔仔兽年轻却才华洋溢的眉月狼，当部族与奥丁的大战发生时，她正在远方的英格兰执行任务。到她回乡时，战后稀少的倖存者用庆祝胜利和向大量阵亡将士致敬迎接她。\n伊冯娜很快理解到她所处的圣地如履薄冰。奥丁的爪牙在南方仍然强盛，加上大量英勇战士的阵亡，芬里尔的勇士们必须用尽一切智慧才有可能生存下来。这次危机需要更具策略性的头脑，充满耐心的伊冯娜将很快发现自己正处于芬里尔仔兽崭新事业的前沿。"
 POD_investigate.desc.792574: "赤爪的新月狼，脏玻璃因在天主教会继承了她部族小型圣地的周遭土地时后做的事赢得了她的绰号（和她的名字）。当教会开始往森林辟路，长老提议杀光所有人类，但脏玻璃却有不同想法，知道此举只会引来更多（且更危险）的人类。她反其道而行假装成人类，冒险进入村庄，像鬼魂般哀号并指着教堂大声警告邪恶蛰伏其中。\n村民跟随她进入教堂，她运用欺诈的天分，使意志薄弱的人类相信自己见证了神迹。不久，村民便拆毁教堂，竖立起森林天使的小型祭坛，永远不敢再靠近她深爱的森林。"
 POD_investigate.desc.792578: "作为布洛维兹的一名年轻贵族，伊丽莎白灵活的头脑使她的前途一片光明，直到她的原始觉醒发生。伊丽莎白的家族有着悠久的影爵血统，但她的父亲试图与狼群保持距离。因此，她被囚禁在一个舒适的，甚至是偏远的塔楼里。\n但这并不足以阻止附近的领主们注意到这个女孩，他们很快就把她“救”了出来，并把给她介绍了狼族的生活。介绍完毕后，伊丽莎白回归并控制了她的庄园，确保她的家族再次向影爵的事业宣誓效忠。\n因此，当剥皮瘟疫和棘秘魑来袭并摧毁她的部族时，伊丽莎白正在远方。随着大多数长者的离去，保护整个部族的未来就落在了她年轻的肩上。"
 POD_investigate.desc.792537: "永远蒙福于猎鹰，尤里与双胞胎妹妹——索菲娅一同降生，并且两人都经历了原始觉醒。仰赖胞妹的明智建议，尤里很快便取得了俄罗斯银牙族长的合法统治地位。此后在他的统治下领地繁荣发展，同时麾下勇士寻找并摧毁每一个胆敢现身在他领地中的$glossary_wyrm$怪兽。通常摧毁妖兽的任务由索菲娅亲自带领，她不是为兄出征，就是辅佐于侧，永远鼎力扶持。\n\n其在原作中的未来命运\n最终妖蛆为了对付他们会派出祂最强大的仆人之一——被称作残忍者·沙卡拉的戈里尼奇。当它蹂躏破坏与数个狼群讨伐失败的消息传到双胞胎耳中后，尤里便走下王座并呼唤战群成员随他参战。之后的战斗将会是狼国有史以来的最大胜利，但也付出了极高代价。索菲娅与尤里一同赴义，而他们的英勇牺牲将为人铭记直到世界终结。"
 POD_investigate.desc.792579: "乌普奥特是部族与赛特密教在黑土之国的战争后期中一只古老的寂静漫游者狼人。当赛特诅咒寂静漫游者们，强迫他们离开祖乡时，同时也切断了他们与祖灵的联系，乌普奥特寻找着能免于族人遗忘所有部族传承的方法。他最终与不朽的荷鲁斯达成协议，为了回报作为贤荷鲁一员的木乃伊化，此后乌普奥特将侍奉荷鲁斯。他希望借此能成为寂静漫游者历史的活体图书馆。\n起初，他似乎未能成功。在他第一次死亡后，猫头鹰亲自向乌普奥特启示，警告他永生不朽的死而复生违反了盖亚对狼族的安排。这一次乌普奥特会复生，但如果他再次死亡，他将成为死灵永远困在[UmbraGlossaryLocalized('shadowlands','冥界')]。但猫头鹰还是认可了他的奉献，自此以后便引领他帮助被放逐的部族找到新的希望。\n\n其在原作中的未来命运\n1978年，在经过了千年的努力后，乌普奥特终于创造了让一只寂静漫游者幼狼得以连结她其中一位祖先的仪式，尽管这是其他部族视为理所当然的事。"
 POD_investigate.desc.792582: "尚卡尔是星占一位睿智而著名的导师。她的教诲主要是解释$glossary_weaver$是真理真正的敌人，而$glossary_wyrm$只是她最明显的受害者。\n尚卡尔延续了她圣地的悠久传统，与她的陌生邻居──吸血鬼米拉日巴──进行了富有成效的共存。几个世纪前他帮助对抗妖蛆入侵者的往事仍然受到尚卡尔的尊重并深深记下，特别是当她喜欢与这位隐居的哲学家长时间交谈时。\n\n其在原作中的未来命运\n尚卡尔将有幸成灵。在她死后，星占会在冥想或需要保护自己不受腐蚀影响的时候呼唤她的名字。"
 POD_investigate.desc.790204: "吕山德生前是伯罗奔尼撒战争的斯巴达将军，击沉了雅典舰队并围攻该城邦。雅典的投降不仅使斯巴达胜利，也让他赢得了女神阿尔忒弥斯·欧西雅的初拥。\n\n与罗马的卡米拉缔造坚固的友谊后，吕山德行游意大利与地中海，作为罗马的眼目与硬手处理血族事务。罗马梵卓面临一个巨大的问题──迦太基，吕山德看见了这个北非城市对于罗马的危险，也正是他理解到布鲁赫为潜在威胁。\n\n在他代表罗马的行游中，吕山德便已听过许多传说──布鲁赫公开地行走在迦太基血畜间，宛若众神般统治并要求血税与牺牲。吕山德亲自前往该城以验证谣言真伪，却震惊地发现全为不虚。他回去向卡米拉回报他的发现，但罗马亲王却蜗行牛步，他们的友谊因此恶化。\n\n不过卡米拉最后还是发动了布匿战争，而吕山德无役不身先士卒。在最终决战中许多人伤亡（包括阿尔忒弥斯），吕山德伤痕累累却无大碍，亲自拿下最后布鲁赫的项上头颅。在他的命令下，罗马军队将该城夷为平地，处决了成千俘虏并奴役了残余的。他们在土地上撒盐，使无物能再次破土而升，包括了蛰眠的该隐之子。与迦太基的战争就此终结。\n\n其在原作中的未来命运\n吕山德将与特黎佛撒和阿达纳亚组成持续对抗崇魔者的团队，有朝一日被称为约西亚派。\n传言还称他是哈德施塔特的秘密支持者，因此，他可能是秘盟崛起背后的关键力量。"
 POD_investigate.desc.790824: "卡特拉出生于约维克一个强大的维京酋长家庭，她狡黠的智慧与战士般的心性很快引起了该城亲王的执事索兰德的注意并得到了$pod_Embrace$。对于这个不情愿接受的转变，卡特拉耗费多年才终于适应，并立誓永不再受制于人。此后她很快卷入了其[Glossary('尊长','game_concept_Sire_desc')]的阴谋，并与时任亲王朱利安·塞拉利斯争夺约维克的控制权，最终于980年的一场战斗中陷入$pod_torpor$。\n在两个世纪后苏醒的卡特拉找到了新任亲王约翰·德·约克要求决斗。然而约翰精明过人，成功说服她联手对抗更大的威胁，也就是密特拉对不列颠诸岛的霸权。\n\n其在原作中的未来命运\n密特拉终将获胜，而卡特拉则逃往新世界，成为名为新阿姆斯特丹的小殖民地的亲王。尽管她将成为新生的美国当中最强大的长者之一，但厌倦与心兽本性的侵蚀终将压倒她。1990年代，她将沦为无意识的尸妖，最终被（艰难地）消灭。"
 POD_investigate.desc.791269: "沃罗西乌斯曾是布伦努斯的军队在进军罗马时中的一名战士，后来他被赏识他的玛瑟逊莎[Glossary('初拥','game_concept_Embrace_desc')]。回到高卢后，沃罗西乌斯勇敢地与凯撒的军队（及其$pod_cainites$支持者）作战，但最终因寡不敌众而被击败。从那时起，他就开始帮助任何有能力阻碍罗马进步的势力，包括罗马的叛徒（他认为西格弗里德这个避之唯恐不及的野蛮人是唯一值得尊敬的梵卓）。\n在西哥特人、维京人和诺曼人的入侵中，沃罗西乌斯参与了每一场对抗文明的战斗，但即使是他自己也明白，只有自己还不足以扭转局势。但这并不意味着他很快就会停止尝试，而法兰西要想不再惧怕奥弗涅的吞噬者，依然有很长的路要走。"
 POD_investigate.desc.505150: "马塞卢斯出生于罗马商人世家，却厌倦了都市生活，选择加入了罗马军队。马塞卢斯傲慢地以为家族名望能庇护自己，却未料敌人为巩固权势而设计擒获他，最终被卖到拉斯梅杜拉斯矿场为奴，而所有人都以为他死于蛮族袭击。\n尽管多数奴隶在繁重劳作与监工虐待中死去，马塞卢斯却顽强生存，始终以家族传说中的高贵品格自勉，拒绝像奴隶般屈辱地死去。这种心志最终救赎了他：强大的勒森魃布傅切佛斯造访矿场时，被他倨傲的仪态与缜密心思所折服并将其初拥。\n马塞卢斯虽追随他的[Glossary('尊长','game_concept_Sire_desc')]游历四方，却总被矿场牵动心神。获释后他重返故地，虽极少参与血之法庭和其他$pod_clan$事务，但总会审判那些他认为不配属于氏族的子嗣。暗影再征服期间，作为虔诚的朱庇特信徒，他拒绝选边站队，只为所有愿放弃争斗者提供庇护。\n\n其在原作中的未来命运\n守护领地数世纪后，1936年西班牙内战让他对现代世界的卑劣冲突彻底厌恶，最终选择陷入$pod_torpor$，等待更荣耀的时代降临。"
 POD_investigate.desc.505140: "人们对西比尔知之甚少，勒森魃$pod_clan$大多数人甚至不知道她的存在。勒森魃自己曾说过，他从未[Glossary('初拥','game_concept_Embrace_desc')]过任何女人，这使得她要么是个潜在的吸榨者，要么是她[Glossary('尊长','game_concept_Sire_desc')]眼中的“私生子”。\n但有一点是众所周知的，那就是她憎恨着[Glossary('上古耆宿','game_concept_antediluvian_desc')]和他们对$pod_cainites$的控制。她对卢修斯·埃利乌斯·塞扬努斯的$pod_Embrace$伴随着一个预言，那就是他将在某天夜晚帮助所有该隐之子从他们祖先的可怕魔掌中解放出来。\n\n其在原作中的未来命运\n在策划和帮助塞扬努斯的过程中，她将看到他成为华盛顿特区的亲王。在这一事件中，她将瞥见该隐之子这一种族的潜在救赎之路：美国的核发射密码。塞扬努斯在完成他的任务之前将被阻止，但西比尔将再次介入，继续她无止境的探索。"
 POD_investigate.desc.710403: "当阿姆尔·伊本·阿斯派遣两位最优秀的战略家前往巴比伦要塞谈判投降条件时，阿尔·蒙塔西尔便是其中之一。作为一位才华横溢且耐心十足的学者，他因其留给人完美的印象而被授予$pod_Embrace$，使他能够致力于传播关于被诅咒者特洛伊尔及其伪布鲁赫血系的真相。\n然而，当他的[Glossary('尊长','game_concept_Sire_desc')]死于特洛伊尔手下的密探时，这一打击深深动摇了阿尔·蒙塔西尔。在被遗弃在开罗城后，长达几个世纪的孤独开始对他的精神造成沉重负担，但他的使命却未曾放过他。作为神秘的塔尔玛埃拉在埃及的耳目，他必须保持清醒，继续观察。因此，阿尔·蒙塔西尔在漫长的精神折磨中等待着不可能到来的解脱。\n\n其在原作中的未来命运\n阿尔·蒙塔西尔最终将通过原谅特洛伊尔的后裔，并理解关于迦太基的真相而找到内心的平静。然而，这份胜利是短暂的，因为不久之后，他的子嗣西尔维斯特·马洛会将他杀害，这一事件奇妙地重演了当年布鲁赫被特洛伊尔所杀的历史。"
 POD_investigate.desc.791178: "法基尔本身并非特别出众的吸血鬼，但他将成为关于莱本血系传说的核心人物。根据这个故事，莱本源自于他——一位在某个漆黑夜晚独自从沙漠中走出的古老吸血鬼。传言推测他可能属于冈格罗或阿刹迈的血脉。\n这个传说将导致欧洲$pod_cainites$普遍误解为莱本血系是一个统一的血族。然而，事实是莱本更像是一个广义的术语，用于描述居住在非洲的众多吸血鬼血系。\n莱本乐于鼓励这种误解，视欧洲人对他们文化的无知为一项可以加以利用的弱点。"
 POD_investigate.desc.790255: "阿尔琼·沃里斯是个沉静且能干的人，在荷兰被视为有能力但无威胁的典范。他的领地治理稳固、公平且相对繁荣。在许多方面，他被他那些更强大的德国亲族视为理想的管理者——足够优秀以至于有用，但又不足以构成威胁。\n\n其在原作中的未来命运\n阿尔琼将与低地国家的其他亲王们结盟，组建一个联合体，他的声望一度如日中天，为他赢得“荷兰亲王”的头衔。然而，不久之后，他将被魔宴欺骗，并在睿魔尔与乔凡尼的羞辱下黯然退场。最终，在布拉格公约签订后不久，他将惨死于叛党之手，湮没于历史的阴影中。"
 POD_investigate.desc.790152: "生于罗马帝国，并在此接受[Glossary('尊长','game_concept_Sire_desc')]的初拥，卢修斯·科尼利乌斯·西皮奥是一位技艺高超的修辞学家，怀有崇高理想与不羁的魅力。这些特质很快让他成为一群志同道合的$pod_cainites$的小团体的领袖，并赢得了卡帕多西亚的佩涅洛佩的爱慕。在拉文纳的一次冒险失败后，卢修斯与他们一起迁往新兴的汉堡，随后加入了汉萨同盟。他不久便巧妙地智胜了当时的亲王——疯狂的米甸，并帮助汉堡成为繁荣的象征，成为有望重现新迦太基的潜在家园。\n然而，卢修斯很快发现了自己计划中的一处隐患：被边缘化的米甸变得暴力且极具破坏性，甚至开始大规模进行$pod_diablerie$。卢修斯本可以轻易推翻他，但他选择保留米甸的地位，以便在汉萨同盟遭遇真正的危机时，将米甸当作替罪羊。\n尽管这一策略在政治上无可挑剔，但其在道德上的败坏让卢修斯每晚都备受折磨。如果他想要保全自己，以及他心爱的乌托邦，他或许很快就不得不采取行动。"
 POD_investigate.desc.790874: "阿斯蒂出生于波罗的海附近的一个小部族。在丈夫去世后，她将自己奉献给了有角之神——韦列斯。某个夜晚，她在狩猎后迷失了方向，结果被一只巨狼追捕。当黎明将至时，那只狼最终追上了她，并化作一名长着鹿角的男子，宣布她将在死后为韦列斯效力。\n随后，他袭击了她，吸干她的血，并赐予她$pod_Embrace$，使她重生为媚娃的一员。多年间，她忠心侍奉她的神，直到西方的基督徒入侵，将信仰旧日之道的追随者屠戮殆尽。在这绝望时刻，阿斯蒂被任命为韦列斯的大女祭司，以抵抗条顿骑士及其梵卓主子的侵略。\n她深知这场战斗可能会失败，因为骑士们强大，而她的族人羸弱且内部分裂。然而，他们仍必须战斗，因为韦列斯不是弱者之神，而为保卫家园而战死，是最为高贵的死亡。"
 POD_investigate.desc.790821: "An Ostrogothic soldier who had joined a Roman Legion, Hilderic was a follower of Mithras when his [Glossary('Sire','game_concept_Sire_desc')] Cretheus found him. His drive and intelligence earned him a place at Cretheus' side, and the two studied thaumaturgy and served their god for the next centuries.\nThey drifted apart however when Cretheus started inquiring about Saulot and [golconda|E], two occupations too spiritual for the still soldier at heart Hilderic. Instead, he choose to try to reverse the Dark Ages all by himself, fighting in many wars to change History to no avail.\nTremere's $pod_diablerie$ of Saulot disgusted him, and he soon added the Magus to his list of things to 'fix'. Hilderic is but one man however, and his anguish at seeing all his efforts being in vain gnaws at him more each passing night.\n\nFuture fate in Canon\nDemoralized, Hilderic will once again join Cretheus, this time to form the Inconnu sect. Cretheus' numerous mistakes will usher a new discord between the two men and a bitter and petty Hilderic will then dedicate his unlife to scheme against his once friend."
 POD_investigate.desc.790245: "In his mortals days, Geza engineered a brilliant deception as King of Hungary. While helping spread Christianity, he also practiced pagan rituals in secret. He was [Glossary('Embraced','game_concept_Embrace_desc')] by the powerful Bulscu as a reward for his lifetime of commitment to the kingdom. This event was deeply traumatic for Geza however. Feeling that his God has forsaken him to an eternity of thirsting for human blood, he soon saw himself as a fallen angel, one to test the faith of the holy.\nGeza retreated to Esztergom and, while he still considers himself a Christian, he became more and more fascinated by dark, older, gods. Just as God condemned Lucifer as part of His plan, so too is Geza condemned to serve in the infernal forces of this land. Torture, desecration, defilement and sacrifice of the innocent... nothing is off limits for the agent of God now.\n\nFuture fate in Canon\nThe Church will fight back against Geza's mad agenda. One night, he will simply disappear, never to be seen again. The Sabbat will continue his unholy work in Esztergom however."
 POD_investigate.desc.605101: "诺曼底的安德鲁是一位神秘的玛土撒拉，也是黑暗中世纪时期最强大的异端团体之一——黑蔷薇骑士团的教主。被称为“天使长”的安德鲁，曾是法国、苏格兰和圣地的挪得主教，之后创建了黑蔷薇骑士团作为他的私人军队。\n安德鲁将该隐异端视为引发新十字军东征的工具，但其背后的原因仍然不为人知。随着该隐教会的逐渐崩溃，安德鲁正在考虑他的选择，寻找摆脱这艘沉没之船的方法。\n\n在原作中的未来命运\n安德鲁将迁往圣地，试图维持异端手中残余的影响力。然而，他的努力将徒劳无功，最终他的名字也将从历史中逐渐消失。"
 POD_investigate.desc.790325: "作为1185年君士坦丁堡屠杀中唯一幸存的拉丁吸血鬼，加布里埃拉受到了同族的怀疑。她则对威尼斯的阿方佐作为亲王的能力毫无信心。在加布里埃拉眼中，君士坦丁堡是一块富饶却四分五裂的宝地，她认为她的$pod_clan$应该协助重建这座城市，而不是掠夺它的财富。一个复兴的拜占庭帝国，当然还要有热那亚盟友的支持，可能会成为无尽财富的源泉。\n由于她曾受阿方佐的命令被捕，最终只能靠幸运与精明的外交手段自救，她也在密谋让现任亲王遭受缓慢且痛苦的死亡。她的副手们私下担心，她的复仇计划已经凌驾于重建君士坦丁堡的宏图之上，因为每一个未加冕的夜晚过后，加布里埃拉就愈加嗜血且不耐烦。目前，加布里埃拉对拉丁皇帝鲍德温二世有着极强的影响力，但这位软弱而鲁莽的统治者不仅难以控制，还几乎带来不了任何实际利益。如果近期无法见到成效，加布里埃拉一贯的缓慢而谨慎的策略或许会发生改变。"
 POD_investigate.desc.791049: "拉斯普京·谢苗诺夫率领他的诺斯费拉图小团体在前基辅领土上大开杀戒。凡人的贵重物品、鲜血和生命都被剥夺殆尽，甚至孤独的$pod_cainite$旅行者也在他的肆虐下沦为阶下囚。\n当地的吸血鬼很少有人愿意站出来反抗掠夺者，因为他们害怕招来拉斯普京的[Glossary('尊长','game_concept_Sire_desc')]（传言是芭芭雅嘎本人）的愤怒。\n事实上，谢苗诺夫的尊长是一个潜伏在诺夫哥罗德的大街小巷，很久以前就死在拉斯普京的毒牙之下的诺斯费拉图。拉斯普京其实不认识什么芭芭雅嘎或圣母玛利亚。他单纯只是一个机会主义者，看到有用的谣言就会辨别出来。\n当然，还有一些祖母真正的子嗣潜伏在周围，迟早有一天，他们中的一个可能会对谢苗诺夫的小游戏感到不快……"
 POD_investigate.desc.790488: "她的原名早已被遗忘，但$pod_clan$中一些更疯狂的人认为它是个苏美尔名字。氏族传说声称末卡维在给她$pod_Embrace$时试图保留她体内的某些东西，也许是在这位甜美的女人身上看到了他已故的[Glossary('尊长','game_concept_Sire_desc')]洗拉的某些东西，但那火花被他的血熄灭了，末卡维离开了她，并深感失望。\n瘟疫新娘也属于加冕者——末卡维本人的子孙，他们吞噬了在第三代逆反期间末卡维为保护自己并顺便传播他的疯狂而分离的掺血泥土。瘟疫新娘仍然被她死去的尊长和爱人的记忆所困扰，她试图与全人类分享它，用疯狂感染他们并试图弄清楚为什么她的尊长抛弃了她。\n\n其在原作中的未来命运\n据传她仍在地上行走，尽管使用不同的化名；伤寒玛丽、疯狂的简和简·彭宁顿是她最近经常使用的一些化名。"
 POD_investigate.desc.792118: "A dashing and strong petty king of Norse Norway, Hakkon's bravery and zeal smote the Valkyrie Thorhalla. She revealed herself to him and proposed the $pod_Embrace$, which he accepted. Their dalliance continued until Thorhalla's duties called her back. Hakkon then started his journeys.\nIn Constantinople, he was soon disgusted by the scheming vampires there. All their was for a brave man was a senseless death in someone's else war. Then came the Middle-East where Hakkon forged himself a reputation as a powerful and reliable, if bloodthirsty, mercenary.\nWhen the crusaders came, the Norse enters into a contract with them, and has since been in the fringes of the Levant's politics, lending his axe to whoever is willing to pay. Recently however, he has learned of his homeland's fall to Christianity and is worried about Thorhalla. He is now gathering enough gold for the long journey back.\n\nFuture fate in Canon\nHakkon will return North and fruitlessly search for decades for his beloved Thorhalla. He will then enter $pod_torpor$, only awakening to the modern world when the Valkyries themselves do, once again looking to be reunited with her."
 POD_investigate.desc.791306: "亚历克西亚·马夫罗马提斯是塞浦路斯一位学者遗孀的女儿，自幼在书籍中长大。为了逃离束缚她的家庭，年轻的亚历克西亚遇到了一位巫师，成为了他的学徒。当巫师被召唤到塞奥里斯并了解睿魔尔的存在后，他对其感到厌恶和排斥。然而，雄心勃勃的亚历克西亚却被睿魔尔深深吸引，并以忠诚的姿态在她导师的背后刺了一刀。\n在有影响力的热尔韦的[Glossary('初拥','game_concept_Embrace_desc')]后，她很快被派往塞浦路斯，建立睿魔尔的秘所。进展缓慢但稳步推进，直到热尔韦召回她参与一场失败的计划，试图在梵卓和妥芮朵之间制造裂痕。自那以后，她回到了塞浦路斯，尽力挽救局面并重建自己的影响力。\n\n在原作中的未来命运\n尽管经历了数次挫折，亚历克西亚最终成熟为一名真正的睿魔尔幸存者。在现代的夜晚中，她已成为米兰一支颇具影响力的力量。"
 POD_investigate.desc.791072: "在大医院建立之前，伊沙克曾是一名巴格达的医师，一直觉得有责任帮助穷人和病人。然而，在工作中他染上了会使人逐渐衰竭的疾病，被遗弃在那些他曾帮助过的人群中腐烂。就在这时，他的[Glossary('尊长','game_concept_Sire_desc')]注意到了他，并将他从这屈辱的死亡中拯救出来。\n自那以后，伊本·凯拉特便一直参与阿兹迪医院的工作，并受到医护人员的公开接纳。在行医的同时，伊沙克依靠自愿献血的医护人员或治愈后的感恩病人维持生存。尽管巴格达的政治局势在他周围快速变动，但伊沙克对此毫不关心。他无法想象自己有其他命运，除了这条充满慈善与仁爱的道路。"
 POD_investigate.desc.790901: "尼克罗斯于公元前320年接受了[Glossary('初拥','game_concept_Embrace_desc')]，传闻他是一位经验丰富的奇术师，但大多数人认为这可能只是误导性的宣传。关于尼克罗斯的其他传闻还包括他掌握了[golconda|E]的秘密，或能够打破血缚。尼克罗斯的氏族诅咒以多重人格的形式显现，这些人格会根据外界刺激不断变化。这使得与他交流变得极为困难，而任何试图了解其情况的尝试都以失败告终，因为每个人格似乎都有各自的议程。没有人真正知道尼克罗斯何时何地出现，或他的计划是什么。事实上，大多数时候连他自己也无法得知。\n\n其在原作中的未来命运\n在遥远的未来，尼克罗斯将出现在温哥华，被大量诺斯费拉图崇拜，并看守“大图书馆”——北美大陆上最大的神秘学知识宝库。"
 POD_investigate.desc.791148: "在扫罗于东方的旅程中，他选择了两个人作为$pod_Embrace$对象。瞾贼，一个能够从无量地狱中窃取秘密的窃贼，和瞾学，一个能够破译这些秘密的学者。这三人在中原地区冒险，掠夺[akuma|E]的巢穴，偷取他们的计划。\n他们寻找能让$pod_cainites$在[Glossary('纪元之轮','podgloss.wheelofages')]的轮回大劫中幸存下来的知识。而当扫罗离去回到西方，他指示他的两个子嗣继续他的工作，创建一个新的种姓，被称为武瞾，或观者。\n瞾贼是新种姓窃贼一系之父，尽管在他们的道路上有许多障碍，但还是尽职尽责地完成了扫罗的命令。"
 POD_investigate.desc.791720: "Otto is the current von Murnau liaison with the Shadow Inquisition. He is the second eldest son of the head of the family and has suffered from the 'middle child' syndrome. To be noticed, Otto has a habit of trying a little too hard in any task he is given.\nNot especially graced with personal piety, Otto is instead known as a level headed individual and a good organizer. While Leopold is the true soul and heart of the von Murnau family, Otto is its busy mind. Indeed, Leopold himself wasn't really keen on the Shadow Inquisition project at first, and it took Otto passionate defense of the concept to convince his uncle of the righteousness of the cause.\nHis first active mission was in assisting the Knights of Acre in purging Magdeburg of Cainites, mission in which Otto encountered only mixed success and the fright of his life when he met with a vampire face to face for the first time.\n\nFuture fate in Canon\nAfter this close call and dangerous mission in Magdeburg, Otto will inherit a difficult burden when Leopold himself is murdered. While his contribution to the future Society of Leopold is less known that the one of his uncle, he will still be instrumental on saving the ailing Inquisition."
 POD_investigate.desc.790480: "Born Xavier de Calais, he was [Glossary('Embraced','game_concept_Embrace_desc')] in his native France during the Hundred Years' War. Abandoned by his sire after the Embrace, Xaviar traveled north to Scandinavia, where he remained a solitary monster-hunter for several decades. Eventually, he traveled to Germany's Black Forest, where he became a renowned Lupine hunter. During this time he first became acquainted with the Camarilla and the Masquerade. After some time in Kindred society, Xaviar's wanderlust led him to the Middle East and, from there, Africa.\nThe ill-tempered exterior he shows the world conceals both voracious intellect and ruthless ambition, nonetheless, he is known to stay true to his friends and considers himself a noble beast of the night.\n\nFuture fate in Canon\n At the dawn of the 18th century, he will travel to North America, where he will track down and destroy the Gangrel Justicar Elijah, who had succumbed to his Beast. When he will present the Conclave of 1704 with evidence of this deed, he will be made an Archon on the spot, and will be appointed to be the clan's new Justicar at the next Conclave, seven years later. He will serve his clan as a Justicar intermittently for centuries. Finally, after a terrible encounter in 1999, Xaviar will withdraw from the Camarilla and most of his $pod_clan$ will follow him soon after. Xaviar himself won't survive to see this victory however, but his legend will endure and he remains the most venerated champion of his own $pod_clan$, the one who saw the truth before any other."
 POD_investigate.desc.505105: "这位被称为勒杜克的法兰西法师是睿魔尔家族新兴的巴黎赫耳墨斯秘所的主人。作为睿魔尔家族为数不多的大法师之一，他被视为睿魔尔本人最亲密的顾问之一，因此他是被选中的八名原始法师之一，他们在格拉崔克斯的篡位仪式中施法并变成了吸血鬼，从而诞生了睿魔尔$pod_clan$。\n当瑞典人（埃特里乌斯）和格拉崔克斯之间的竞争开始加剧时，勒杜克选择站在了埃特里乌斯这边，同时他也参与了睿魔尔历史的其他重要事件，如塞里奥斯的献祭和扫罗的$pod_diablerie$。因此，他是著名的 “七人会议”（睿魔尔的统治议会）成员之一。然而，在1133年左右，这位法兰西人在原因不明的情况下被他的主人命令离开巴黎秘所，而代替他的是格拉崔克斯。\n\n其在原作中的未来命运\n勒杜克将在未来艰难的几个世纪中幸存下来，但他将在现代之夜中失去他在内部议会中的位置。"
 POD_investigate.desc.790814: "As a mortal, the duke was a member of one of the oldest royal families in England. He was polished, intelligent and active – seemingly perfect candidate for $pod_Embrace$ by the Ventrue. He and his wife came to Mithras' attention and he [Glossary('Embraced','game_concept_Embrace_desc')] them in the hope that they would prove to be his greatest childer. In secret, Amber plotted to usurp his [Glossary('Sire','game_concept_Sire_desc')] and gain the princedom himself.\nDespite warnings from Lord Camden, Mithras entrusted Amber and his wife with several duties. These responsibilities inflated their already impressive ego and the couple is now enjoying their 'deserved' place as rulers of the night.\n\nFuture fate in Canon\nThe 'ducal couple' will be entrusted as Regents of Mithras during the Renaissance and will fail spectacularly. They will be demoted in favor of Valerius, and will then indulge in hunting other $pod_cainites$ for sport and gorging themselves in blood. Finally, in 1666, Mithras will deal with them for good."
 POD_investigate.desc.790815: "$POD_investigate.desc.790814$"
 POD_investigate.desc.791275: "Rumored to have been Queen of the Franks in her mortal days, Mathilde d'Ostergo is an ambitious young Ventrue. She has, with a well planned coup, ridiculed the Prince of Dol to a point that Alexander himself (the Prince of Paris at this time) accepted her brazen coup d'etat, something very rarely seen in the well mannered Ventrue courts.\nShe has since then surrounded herself with other young vampires, each of them a master in the more 'underhanded' tactics of the rulers of the night.\nDespite the outright hostility of the other princes of Brittany and Normandy, Mathilde has already made moves to conquer Avranches in the chaos following Alexander's exile. She has also made inquiries about the location of her [Glossary('Sire','game_concept_Sire_desc')] as she would like to 'thank' him properly for the way he raised her.\nMathilde is moving at a blazing speed for the slow thinking vampires surrounding her, and this advantage might be enough for her to be truly unstoppable."
 POD_investigate.desc.790828: "纳斯塔西奥生前是奥维耶多附近的加利西亚乡绅之子。身为兵法天才，他年仅二十六岁就被拔擢为御马队长，更在与穆斯林的战斗中不断地证明自己。他最终前往法兰西以佣兵为生，并赢得了不少作为战士与领袖的声名。当他在1066年服务艾尔男爵时，不知自己卷入了一名梵卓和一名勒森魃的冲突之中。结果是他将该勒森魃钉上木椿并烧死，如此打动了他未来的[Glossary('尊长','game_concept_Sire_desc')]，足以让他赢得$pod_Embrace$。\n此后他周游世界，卖与武艺予各色梵卓领主，对于亡生没有一丝悔恨。在1205年，他被暗影再征服的大主教蒙卡达招募来对抗穆斯林。蒙卡达暗示他的家乡也许是夺取的最佳良机，只要他能把蒙卡达的对手，该地现任亲王——马布埃纳驱逐走。\n\n其在原作中的未来命运\n暗影再征服对于纳斯塔西奥是伟大胜利。他将征服奥维耶多并成为半岛上的主要势力。他也将成为秘盟的首批巡行裁决官之一，并阻挡魔宴对其城市的袭击直到1930年代死于扎兰·阿扎布之手。"
 POD_investigate.desc.790490: "Jacob (obviously not his original name) is a distinguished looking gentleman that seems almost harmless to people who first met him. Enslaved by Arabs while a teenager, he grew up in Muslim lands, where he learned his only dignity could come from his appearance.\nAs a childe of Abd ar-Rahman, he has a Middle Eastern look and actually thinks he is both the biblical Jacob as well as his brother and archenemy, Esau; both are personalities he created when he was [Glossary('Embraced','game_concept_Embrace_desc')]. The two have waged a war lasting centuries, unaware that one is a personality of the other.\n\nFuture fate in Canon\nIn Modern Nights, he spends most of his unlife in a house on the border of the Kindred-dominated region in the suburb of Greensdale, Wisconsin. His madness subtly but undeniably permeates his domain. He will be mostly known as the [Glossary('Sire','game_concept_Sire_desc')] of the infamous Jeanette/Therese Voerman who will share his derangement."
 POD_investigate.desc.790981: "卢克曼·本·瓦希德·巴辛出生于亚历山大港，是一位香料商长子的娇惯继承人。他的父母对他的要求百依百顺，让他把人生视为一场奢靡享乐的盛宴。在父母于神秘的情况下去世后，卢克曼继承了他们的财富，但因其奢华的生活方式和缺乏经验，很快将家业败光。\n他随后落入了一名赛特之子的掌控之中，被这位女主人榨干了所有财产。为了讨她欢心，卢克曼开始努力工作，并最终接管了一位当地商人的商业帝国，这让他的女主人十分满意，并赐予了他赛特的智慧。不久之后，卢克曼成为一名旅行商人，在旅途中广泛传播赛特的教义，常常伪装成一位流浪的妥芮朵。如今，他对十字军东征产生了浓厚兴趣，希望借此机会驱逐埃及境内的穆斯林势力。"
 POD_investigate.desc.792344: "Eshmunamash was born in ancient Tyre and became a skilled doctor. After being embraced by the Brujah Gersakkun of Tyre, Eshmunamash found it much harder to accept the blood-thirst and the Brujah curse. He was still fighting this struggle eight centuries later when an old colleague in the $pod_clan$, Shalmat, told him about the Brujah experiment in Carthage, and invited him to the city.\nFor a time Eshmunamash was happy in Carthage, or as close to it as he could remember being. He established a temple and brought ancient Egyptian and Phoenician learning back into mortal prominence. Greek and even Roman doctors made the hazardous sea-journey to come study at his knee.\nThen came the infamous rites of Baal-Hammon, and with them the human sacrifices, which troubled the old Brujah. Furious about the debauchery and the violence of the Baali infested Carthage, Eshmunamash left the city and went directly to Rome, giving vital information about the city defenses to the Roman prince Camilla. After the fall of Carthage, the Methuselah was full of doubts and spiritual malaise, and started searching for [golconda|E] and enlightenment. His initial suspicions of the promise of [golconda|E] melted away after a handful of face-to-face meetings with Saulot himself. When Saulot was murdered, however, he had to pin his hopes instead on Saulot's self appointed apprentice, Cretheus.\n\nFuture fate in Canon\nFollowing Cretheus, Eshmunamash will become one of the Twelve leaders of the Inconnu, and will be trapped inside Hunedoara like the rest of them."
 POD_investigate.desc.791239: "梅斯、图勒与凡尔登的“骑士亲王，阿达尔吉斯身为黑十字的一员，是权势滔天的哈德施塔特最信赖的副手之一。他是哈德施塔特式骑士精神的典范，将人类视作需要铁腕管束的争吵孩童，因此对茱莉亚·安塔西娅及其对待凡人的“仁慈”方式深恶痛绝。\n阿达尔吉斯虽非极具魅力的领袖，却是黑十字西部边境勤勉尽责的守护者。他希望通过恪尽职守，助力哈德施塔特将$pod_cainites$团结于麾下，从而扼杀凡人及桀骜的稚子任何反抗的苗头。"
 POD_investigate.desc.605105: "约瑟夫·冯·鲍恩是一位沉静而深思熟虑的人，是将哈德斯塔特的小团体凝聚在一起的纽带。在发言前，他总是慎重权衡，因此他的言辞颇具分量。最重要的是，他以厌恶浪费资源著称，无论是影响力、金钱还是凡人，这一点常常让他与哈德斯塔特的强硬手段产生分歧。他备受尊敬，常驻慕尼黑，但能随时调动遍布德国的诺斯费拉图的援助。\n\n其在原作中的未来命运\n约瑟夫将成为秘盟的创始人之一，也是他$pod_clan$中最有影响力的成员。他始终保持着一贯的沉稳性格，而他深思熟虑的推理将成为维系内环的关键之一。"
 POD_investigate.desc.790326: "Kosczecsyku held considerable power over his territory, earning the title of Voivode among his $pod_clan$. He was also very interested in blood magic and underwent several journeys to obtain knowledge of the various schools of sorcery among the undead. He was allegedly slain by the Shadow Lords in 983 CE. After the Final Death of Kosczecsyku, his childe, Vladimir Rustovich, eliminated his brood mates to become his successor.\nThe truth is that Kosczecsyku feigned his own death by the hands of the Lupines and tricked his eldest childer to leave him alone. Along with his apprentice and favored childe, Vrisa, the Voivode dedicated himself to the art of fleshcrafting books of thaumaturgical knowledge. Kosczecsyku possesses a collection that includes a tome on Hermetic Mathematics, a tome on Sielanic Thaumaturgy, another on Setite Sorcery, a Necromantic tome, a Dur-An-Ki tome and, finally, a book on infernalism.\n\nFuture fate in Canon\n Kosczecsyku is still hidden from the world at large and his collection keep growing, most notably with an Abyss Mysticism book, probably carved out of one of the childer of Cardinal Moncada."
 POD_investigate.desc.790267: "罗森克兰茨是哈德施塔特的子嗣，他在会友赫尔曼·拉多夫的领导下被委以重任，担任挪威梵卓侵入行动的副指挥官。虽然罗森克兰茨对这样不光彩的角色感到不满，但他还是帮助赫尔曼取得了侵入战争第一阶段的胜利。\n然而，从那时起，赫尔曼就被证明是一个在战场外举步维艰的领导者，很难平定这个仍然相当敌对的地区。罗森克兰茨现在正在等待时机，培养自己在挪威宫廷中的影响力。直到时机成熟，他才会去争取自己应得的一切，证明自己在他那著名的[Glossary('尊长','game_concept_Sire_desc')]眼中的价值。\n\n其在原作中的未来命运\n虽然罗森克兰茨自己没能取得什么成就，但他的子嗣却成为了挪威最有影响力的吸血鬼之一，也是哈德施塔特“青年”最信任的副手。"
 POD_investigate.desc.790363: "塞莱廷出生在伦敦附近的一个村庄，那时的他还叫卡尔诺，是一个古怪贵族元老的儿子。他接受了贵族教育，并很快知道了住在附近的魔法师。当他站在他们的秘所前请求术法技艺的教育时，被此举打动的法师们接纳了他。\n999年，塞莱廷因其出色的图书馆管理能力而被召入塞奥里斯。他的工作是下令研究睿魔尔家族的永生计划。\n在认真履行新职责的同时，塞莱廷还利用业余时间游历特兰西瓦尼亚和塞奥里斯周边地区。他为这一地区周围奇特的暗夜族裔编目，这对早期睿魔尔了解棘秘魑至关重要。为此，埃特里乌斯决定授予他$pod_Embrace$。正如塞莱廷的名字一样（Celestyn有天空的含义），他很快就开始了研究占星术如何与该隐诅咒相互作用的项目。他希望他们与黑夜的新联系也能让他们对星星有更多的了解，并利用这些知识来确定为什么有些吸血鬼能比其他夜族更早崛起。塞莱廷继续闯入存在棘秘魑的国家，经常假扮成他们中的一员，参加他们奇特的仪式，并向他在塞奥里斯的[Glossary('尊长','game_concept_Sire_desc')]汇报情况。\n\n其在原作中的未来命运\n从新世界到亚洲，塞莱廷将继续周游世界，为他的$pod_clan$揭开神秘的面纱。他的其中一个发现将有助于阻止雅斯米利亚德在1998年实施的灾难性阴谋。"
 POD_investigate.desc.790939: "“被遗忘的图书馆”的守护者身世成谜。她始终与这座图书馆相伴，负责典籍的整理与抄录监管。无人知晓的是，她一直与魔龙保持联系，即便在其离开后，仍知晓其行踪并定期向他通报君士坦丁堡的局势变迁。1204年第四次十字军东征的劫掠中，当图书馆与格苏的居所（圣约翰·斯图迪乌斯修道院），一同被戈捷·德·丹皮尔焚毁时，她随着费鲁男爵撤离这个地方。自此，她带着残存的典籍游历欧洲各地，成为这些珍贵文献的永恒守护者。"
 POD_investigate.desc.790018: "For many in his entourage, Anakletos is an example of what a prince shouldn't be. Temperamental, arbitrary and with a poor grasp of politics, his ascension to the throne of Trebizond is mostly due to the very cutthroat nature of $pod_cainite$ politics in the area. Many younger vampires are hoping for a bloody rebellion, which would be easy enough if Anakletos' entourage wasn't preparing for this occurrence.\nThe recent arrival of a haughty Genoese Lasombra named Selvaggia is a threat to Anakletos' rule as well. The Genoese is finding many friendly ears at her thinly veiled attempts of preparing a coup against Anakletos without resorting to the neonates' violence. Anakletos' himself is trying to curtail her authority but, as with most things he tries, is currently failing to really achieve anything."
 POD_investigate.desc.791003: "作为一名罗姆人，伊兹多尔在年轻时就学会了许多不寻常的战斗策略，以及如何诈骗和玩弄花招。在旅行期间，他对塔尔托斯家族，特别是对瓦西里·塔尔托斯产生了敌意。伊兹多尔在君士坦丁堡安排了对瓦西里同伴的屠杀，事后被他的叔叔艾伦多·托雷努初拥。之后，他带着他的坎帕尼亚在东欧漫游，偷窃和寻找永恒的家园。他与幸存下来且被雷伏诺氏族[Glossary('初拥','game_concept_Embrace_desc')]的瓦西里的竞争，在这段时间里经久不衰，并得到了繁荣。虽然他认为瓦西里已经得到了报复，但伊兹多尔仍然憎恨他，认为他是其人民的叛徒。\n\n其在原作中的未来命运\n伊兹多尔最终将带领他的人民来到特兰西瓦尼亚，在那里他们中的大多数人将被奴役或杀害。由于伊兹多尔将自己的人民带入这片新的敌对土地，他被他的人民诅咒，随后在14世纪中期自杀。"
 POD_investigate.desc.790784: "She, like a number of her clanmates, is cursed with an exceptionally vicious form of their $pod_clan$'s weakness upon her $pod_Embrace$. Where others of her clan would normally have a deathlike pallor, she resembles a decaying corpse – a zombu. Mocking $pod_cainites$ soon gave her the name \"Troglodytia\", which she bears as a sort of martyr's badge of honor.\nShe took up company with a group of Nosferatu, but her mastery of Obfuscate is not advanced enough to hide her appearance. But true to her martyr self, she has made the best of her lot, becoming a mercenary, acting as a broker for the Cappadocians and Giovanni, procuring dead bodies for experimentation, odd herbs and alchemical ingredients, as well as strange artifacts that come to her attention. She has become a veritable black market all by herself.\n\nFuture fate in Canon\nHer activities and whereabouts following the Dark Ages and the ascendancy of Clan Giovanni are unknown, but it is implied that she will be an ancestor of (or possibly the progenitor of) the Samedi bloodline. It has been speculated that she invoked boons owed to her by powerful elders to escape to the Americas during the height of the Giovanni clan's purge of the Cappadocians."
 POD_investigate.desc.790956: "查韦斯出生于巴塞罗那的郊外，是一名柏柏尔穆斯林和伊比利亚妇女的私生子，这个妇女根据伊比利亚的掌权者一一献上她的效忠。查韦斯很快就鄙视了他母亲的前后不一，并尽快离开了她，加入了倭马亚王朝。他被训练成一名潜入者，他的技能以及他的决心引起了刺客大师塔里克的注意，他安排查韦斯巧妙地对付哈里发。\n查韦斯决心结束自己的生命，因为他确信只要自己开始反对哈里发，他就会遭受处决，于是塔里克找到了他，告诉他关于哈基姆和掠血之路。查韦斯向塔里克宣誓，并经过十年的训练后被引入了$pod_clan$。公元975年，他被派往埃及观察法蒂玛王朝哈里发的发展，并报告任何赛特之子的参与。\n第一次十字军东征后，查韦斯被派往耶路撒冷，亲眼目睹了基督教徒的野蛮行为。然而，在萨拉丁征服该城后，查韦斯发现自己与异教徒受到的公平待遇不一致。这使他对穆斯林信仰产生了幻灭感，也更加坚定了自己对掠血之路中详述的正义信条的承诺。\n\n其在原作中的未来命运\n查韦斯将通过远离基督教控制的土地而在大叛乱中幸存下来，但在经历过血咒后变得越来越鲁莽。在16世纪末，当他的脾气已经对氏族的安全构成威胁时，道统最终派他去执行自杀任务。"
 POD_investigate.desc.790914: "Originally a traveling craftsman named after a Canaanite god, Kothar contracted leprosy and was banished into the Valley of Hinnom. He accepted his banishment with dignity, believing in a higher purpose. Teaching his craft to the lepers, Kothar became the figurehead of their small community.\nA short time after the Jewish conquest of Israel, Kothar was visited by a wandering preacher, a leper like himself. The leper told him that he bore the mark of God's curse upon the first murderer and that lepers were His chosen, suffering for the sins of the world until a new world would arise from the fires of Hinnom. Kothar became his disciple and was eventually rewarded with the $pod_Embrace$.\nKothar continued to whisper God's word to the lepers under his care. Carefully grooming a network of childer that stretched from Rome to Delhi, the Nosferatu gathered information about important $pod_cainites$ that he deemed to be useful on Judgement Day. Kothar himself believes with absolute conviction in the coming of the apocalypse, but maintains the Jewish faith of his [Glossary('Sire','game_concept_Sire_desc')]. He leaves Hinnom only on rare occasions, mainly to punish those that had preyed on those in his care and his own childer when they had feed too often.\n\nFuture fate in Canon\nDuring the Black Death, Kothar will fall into torpor and be dutifully watched by his childer until his awakening in the Modern Nights. He will then be hard at work protecting his brood from Malkav's spreading madness in Jerusalem."
 POD_investigate.desc.790965: "德雷尼斯出生在2世纪末一个繁荣的酿酒师家庭。作为这家庭唯一幸存的儿子，他的家人在15岁时就包办了婚宴。但仅仅两个月后，战争就降临到他这等人民身上，这位年轻人在试图保卫他父亲的土地时被敌方士兵殴打和轮奸。\n德雷尼斯的家人对此事件保密，以避免他的婚姻被取消，但德雷尼斯从未设法履行他作为丈夫对家庭的责任。他没有继续让他的家庭蒙羞和妻子蒙羞，而是逃跑了，得到了西布莉女祭司的庇护，她们也是生为男人，但为了服务伟大的母亲，她们象征性地变成了女人。\n正是在那个地方，德雷尼斯遇到了她们的领袖阿苏纳纳米尔，一位奉行一种更为古老形式的西布莉与阿提斯仪式的卡帕多西亚。年轻人对她的[Glossary('初拥','game_concept_Embrace_desc')]作出了惧怕的反应。从凡人身上饮血让她感到恶心，就像很久以前面对她以前的新娘一样。尽管如此，她依旧会进食，但从未毫无保留地享受过。当密教灭亡后，德雷尼斯开始流浪，因为她从未从她的[Glossary('尊长','game_concept_Sire_desc')]那里得到满意的答案，甚至连埃尔吉耶斯最聪慧的死亡祭司也无法回答与吸血鬼状况相伴的残忍、嗜血和痛苦的必要性。\n\n其在原作中的未来命运\n仍然在寻找答案的德雷尼斯将落入克瑞透斯新生的遁世会小圈子。在克瑞透斯犯下致命的错误后，她将像其他人一样被禁锢在胡内多阿拉。"
 POD_investigate.desc.790612: "Originally, Andeleon was a pharmakos in Ancient Greece, who practiced human sacrifice to power his magic. The Eldest, envious of this art, [Glossary('Embraced','game_concept_Embrace_desc')] Andeleon and made him his emissary to the protectors of Enoch.\nOnce accepted into the Tal'mahe'Ra, Andeleon set off to explore the [UmbraGlossary('tempest')] with five companions to find the reflection of Eden within its depths. He reasoned that, if the First City could be found in the [UmbraGlossaryLocalized('shadowlands','Underworld')], than surely some remnant of Paradise would also be here. During his travels, he reached Stygia, Swar and eventually the Labyrinth. Within it, he found a forest that whispered with human voices inhabited by Spectres.\nAndeleon believes that this is D'hainu, the garden of Lilith. Other versions speak of the \"roots of Mount Meru\" or the \"starless end of the sky\". After pressing forward, he reached the center of the forest. A court of thirteen thrones ringing a bottomless well awaited them, where Andeleon stepped to the well and whispered into its depths. In the cause of this, his form rippled, while another version claims that a shapeless creature came up the well and that Andeleon fed from it. Afterwards, he returned and mastered Vicissitude at an amazing speed, retreating back into the slums of the First City with his brood.\n\nFuture fate in Canon\nOne fateful night, when the Tal'mahe'ra come to investigate, they will find only horrors wearing the faces of Andeleon's progeny and vessels, with no trace of the Methuselah itself. Then legends will start to spread about the true nature of Vicissitude..."
 POD_investigate.desc.791147: "At first glance, Sundervere is just a small, skinny man in late middle age, with a shaved head, a V-mark on his forehead and a white robe. Then you see his eyes – black, magnetic, burning with fanatical will. The void stares back at you.\nAn Indian mastermind, Sundervere prefers to work only with other Daitya, or his mortal Indians and various strange and secret cults scattered around the world. He not only commands the allegiance of several doomsday cults, he may create new ones to order. $pod_clan$ rumor holds that he and the similarly mysterious Qufur am-Heru, self-proclaimed \"Set's Champion\", have an understanding and work together on occasion.\n\nFuture fate in Canon\nSundervere will become a legend for European vampires during the Victorian Age. He will push back foreign invaders before striking at Mithras himself in London, nearly killing him. Sundervere will also prove himself a master of impossible escapes, returning from seemingly certain Final Death no less than three times. In the Modern Nights, he will prepare new plans to distract the unbelievers from his true plot as all the murderous ingenuity of Man shall pale when the ancient sorcery of India throws wide the Gate and Lord Shiva opens his third eye to annihilate the world."
 POD_investigate.desc.792594: "在奈斯还活着的时候，她是伊西斯密教的成员，也是赛特信徒的坚定反对者。由于奈斯和赛特血仆战斗的英勇事迹，她被授予了生命神咒，并作为贤荷鲁中的一员回归。\n作为荷鲁斯最伟大的战士之一，以及他的贴身守卫和刺客，奈斯已经掌握了上千年的战争技巧，并迅速适应了新的杀人方法。可悲的是，她的嗜血癖在她的多年亡生中侵蚀了她的心智，使她对胜利感到冷漠和不屑。只有最血腥、最艰难的战斗才能点燃奈斯的兴趣。\n最后，每场战斗的走向都是一样的，奈斯取得了胜利却异常冰冷，对她来说自己无法品尝到一次艰难胜利的喜悦。在战场上的任何失败之前，她可能就已经失去了为自己的人性而战的能力。\n\n其在原作中的未来命运\n随着第六次大死涡的摧残，奈斯将成为伊姆库，荷鲁斯为新的时代做准备，亲自挑选的13位木乃伊的一员。"
 POD_investigate.desc.792412: "Little is known about Ulugh Begh, not even his true name. Rumors tell that he founded the Children of the Pyramid, was part of leading circle of the Elite and a member of the Order of Quaesitori. What is known that he was recruited by Meerlinda into House Tremere and later [Glossary('Embraced','game_concept_Embrace_desc')] by her.\nUlugh Begh was a major participant in the Salubri pogrom, hunting and diablerizing dozens of the Healer Clan. Afterwards, he fulfilled diplomatic duties for the Tremere. Some unsavory rumors infer that he is in league with Baba Yaga's cultists, but this has never been proven.\n\nFuture fate in Canon\nUlugh will continue serving the Tremere with honor, earning himself the title of Pontifex. He will fight with Karl Schreckt for the Justicar post, but will be by-passed in favour of Anastasz di Zagreb, which he will resent greatly, as he fell he is more powerful and fit for the job than di Zagreb, who had reached the office mainly by the recommendation from his mentor."
 POD_investigate.desc.792611: "在为赛特服务而重生之前，赫赫提是一个放荡贪吃的奴隶贩子，甚至吃掉了索贝克的神圣鳄鱼。这一彻底的越轨行为为他赢得了赛特的尊重，并使他成为所谓忌灵木乃伊的现任领袖。\n作为赛特军队的战略家和阴谋家，赫赫提重生后的邪恶欲望与日俱增。他现在被称为肆无忌惮的食人者，其身上散发出的恶臭本身就是一种武器。这让赫赫提与同为木乃伊的吞噬者阿门成为了一对奇怪的至交，两人经常进行食人比赛。\n\n其在原作中的未来命运\n随着时间的推移，赫赫提将把工作重心转移到财务方面。他将成为赛特木乃伊的财务总管。当然，赫赫提的饮食习惯仍然是他的业余爱好。"
 POD_investigate.desc.792600: "Long after the Spell of Life was created and Horus and his followers waged their war against Set and his minions, some of the Mummies grew tired of their seemingly futile war and became Ishmaelites, who wanted to be independent from Horus and his war. During the following years, one of them taught a gifted mage named Cabirus the principles of the Spell of Life.\nCabirus used this to create his own Spell of Life and created his own immortals who know nothing of Osiris and Ma'at — much to the horror of Horus' loyalists. They destroyed the scripts of Cabirus and as a result, only a handful of European mummies still exist, including Cabirus himself. He and his few followers have learned the value of hiding inside other supernatural communities, offering some semblance of shelter against Horus and Set's eternal war.\n\nFuture fate in Canon\nTrue survivors, Cabirus and his associates will (barely) survive the ages to come. Even the cataclysmic Sixth Maelstom won't be enough to wipe them out. Horus still hasn't forgiven them however, and being a Cabiri is as hard in modern nights as it has ever been."
 POD_investigate.desc.792595: "A Queen and a scholar before her First Death, Neferukhayt was selected by the Cult of Isis for her political status and her considerable erudition. She soon proved to care little for Horus' Crusade however, finding her thirst for knowledge a far more interesting prospect to spend her eternal life.\nHorus took it as well as expected, and she has since departed as far as Egypt as she could with other like minded Mummies to find her true calling. In this, she has once again became a Queen of sorts, ruling with the grace and elegance she once was known for long ago.\n\nFuture fate in Canon\nNeferukhayt will manage to live comfortably for a while, changing her story and occupation as time goes on, but always with the grace befitting her station. The Sixth Great Maelstrom and Horus' loyalists renewed efforts to hunt down 'rebels' will put her in a more precarious position however."
 POD_investigate.desc.792592: "虫修女不喜欢露天。她出生于巢穴，隧道对她而言就像草地和树木之于其他人一般自然。她知道如何避免触发陷阱。她的兄弟曾愚蠢地掉进银尖刺的深坑中丧命。而虫修女很聪明，她学会了与妖蛆和有害之灵交流，所有的地下生物都乐于与她为伴。\n$glossary_wyrm$希望她居住在地下，于地表之下潜行蠕动，出其不意地打击祂的敌人。现在，妖蛆告诉她有一个伟大之灵的行动正在进行。祂提到有一个受祝之子需要她的帮助。虫修女必须释放它。只有那时，虫修女才会在妖蛆的注视下得到升华。"
 POD_investigate.desc.790368: "内尔伽勒、摩洛与无名者同属一个崇魔部落。他们将人类献祭给地面的一口井。一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]发现了他们，出于对他们幼稚恶行的盛怒而屠戮了该部族。他将三人吸干并把他们抛入井中。[Glossary('上古耆宿','game_concept_antediluvian_desc')]为了让他们能幸存下来吸取教训而把自己的血洒进井里，这些血液被内尔伽勒和另外两人吸收。[Glossary('上古耆宿','game_concept_antediluvian_desc')]离开后，三人从井里出来，变成了吸血鬼。\n然而，内尔伽勒自私自利，自认为是神明。他渴望唤醒被他原部落一直维持睡眠状态的沉睡者，在凡间获得神一般的力量。在恶魔告诉他有一个这样的存在沉睡在城市的地下时，他决心召唤它并学会它的[Glossary('真名','podgloss.truename')]。\n内尔伽勒的计划将引发臭名昭著的“巴力战争”，他的军队将遭遇到[Glossary('上古耆宿','game_concept_antediluvian_desc')]空前团结的对抗。两次，内尔伽勒都险些被击败并被认为已经死亡，但作为恶魔崇拜和崇魔学的始祖，他的遗产将永存。\n\n其在原作中的未来命运\n内尔伽勒在两次失败中幸存下来，并撤退到了一个陌生的异域大陆。伪装成阿兹特克神灵的他将被鲜血淹没数个世纪，直到科尔特斯殖民队和亡灵保护者设法将他逼入$pod_torpor$。但即使在沉睡中，他也将对$pod_cainite$种族的未来产生巨大影响。"
 POD_investigate.desc.790367: "摩洛、内尔伽勒与另一位都曾是将人类献祭于地面井中的崇魔部落一员。一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]发现了他们，出于对他们幼稚恶行的盛怒而屠戮了该部族。\n为了某些人能够幸存以学到教训，他将他们的肉体丢入至该部落的井中，随后让自身的血流入其中。隔夜，摩洛、内尔伽勒与另一位成为吸血鬼从井中现身，即初代巴力。\n与内尔伽勒公开和鲁莽的行为相比，摩洛更喜欢采用一种更微妙的方式：他在民众中培养邪教和教团，以满足自己的利益。他对内尔伽勒的评价很低，甚至称他为“巴力的娼妓”。\n当内尔伽勒崛起并团结巴力血系于其旗帜下时，摩洛禁止子嗣加入，但他拒绝采取进一步行动，他从被赋予的未来景象看见巴力将遭受可耻的失败。被血系中许多年轻成员指谪为懦弱后，他允许那些要抛弃他的人离开，并带着带着最忠诚的子嗣前往“新城”殖民地，也就是后来的迦太基。\n在迦太基，摩洛成为特洛伊尔的知己，理解她的黑暗渴望并推波助澜。很快，巴力成为该城中最具影响力的血系之一，向凡人居民要求献祭与信仰。在摩洛的影响下，特洛伊尔变得更加阴晴不定，吸榨敌人的$pod_vitae$，为了啖魂而初拥子嗣。摩洛其他后裔不知两人最终结为爱侣。\n当迦太基殒灭时，摩洛与特洛伊尔携手作战抗击入侵者，直到两人在终末之拥中沉入土下。"
 POD_investigate.desc.791150: "据说奥西里斯是盖布和努特之子，赛特长兄。他们居住在埃及尼罗河旁，在其祖父拉的统治下。赛特离开埃及，以苏泰赫为名，在前往亚述旅途中被[Glossary('初拥','game_concept_Embrace_desc')]。在拉死后，奥西里斯接管了埃及的统治并被[Glossary('上古耆宿','game_concept_antediluvian_desc')]堤丰初拥。\n千年之后，苏泰赫以赛特的身分回到埃及。在发现其兄弟仍然存活，像他一样被初拥成血族，他很有可能因此勃然大怒。他向古老的兄长奥西里斯发起战争，将其切碎成十四块。并将其身体部位分散至全埃及。\n奥西里斯之妻伊西斯用了一个空前绝后的强大咒法设法复原他。奥西里斯被永远的改变了。他超脱了堤丰对他施加的诅咒，再一次获得真正的生命。他随后下降至[UmbraGlossaryLocalized('shadowlands','冥界')]，在那承担监护[UmbraGlossary('沙之冥府')](埃及的冥界)的职责。他仍然在那里，蛰伏了千年。\n\n其在原作中的未来命运\n奥西里斯将在终末之夜回归，帮助其子荷鲁斯和其受选战士升华至真正的不朽。随后，他将做出终极牺牲来强化凡俗世界对于魔邪势力摇摇欲坠的防护。"
 POD_investigate.desc.710201: "安东尼乌斯在成名前是位高卢军阀，与乌鲁伊奇（艾格曼）一同统治当地，直到罗马入侵该地。他认同罗马阵营下的同族人的理念（还有对强大妥芮朵贝什特的兴趣），于是离开高卢加入永恒元老院，导致他臣民终被征服的命运。当贝什特着迷于新兴信仰天主教时，正是安东尼乌斯提供建议与支持使得幻梦的设想成为可能。\n当贝什特（现在自称为米迦勒）痴迷于神迹时，安东尼乌斯则提出建造强大的崭新帝国的具体细节。他们的关系并非没有隐患，最严重的就是一位名为魔龙的强大棘秘魑的到来，他也很快与米迦勒成为恋人。\n安东尼乌斯忙于打造崭新帝国的同时，一边还试着重新获得米迦勒的全神关注。他在三位一体中第一个支持君士坦丁及其目标，使其恋人注意到这位凡人将军。幻梦繁荣了数世纪，归功于米迦勒巧妙地操弄其恋人们彼此竞争来维持三位一体的平衡。\n然而，这样的平衡最终还是破裂。西元717年，安东尼乌斯支持利奥三世登基并发动反圣象运动来对抗魔龙领导的血之宗教。反圣象斗争不论是凡俗方面还是血族方面，最终至于极端导致了安东尼乌斯于796年死于盖乌斯之手。安东尼乌斯之死使米迦勒和魔龙哀痛不已，也造成幻梦的统治失能，使得米迦勒愈加疯狂和魔龙的弃之不顾。"
 POD_investigate.desc.790779: "恩加洛·乌姆贝克曾是统治拉文纳吸血鬼群体的一员，如今作为努比亚贤者，他代表自己在[Glossary('阿什拉派','game_concept_ashirra_desc')]的同胞，向勒森魃$pod_clan$传递信息。恩加洛身材高大，外貌如战士和王子，心智却如学者。在当前勒森魃的内战中，他成功迷惑了神圣罗马帝国皇帝腓特烈，这位皇帝在不知情的情况下，可能成为一位强大的盟友。\n然而，这也使得拉丁派系的领袖傅切佛斯和厌恶任何外部势力干涉南意大利的蒙塔诺成为他的敌人。如今，暗影之海依旧强大的力量正逐渐逼近恩加洛及其追随者，或许不久后，阿什拉派在意大利的最后一丝存在也将彻底被抹除。"
 POD_investigate.desc.790872: "Originally a Saxon thane, Aethelwulf met his end on the battlefield against the native Britons. He was [Glossary('Embraced','game_concept_Embrace_desc')] because of his courage and maintained some of it in his first years, where he lived more like a beast. His [Glossary('Sire','game_concept_Sire_desc')], however, was an ardent follower of the Road of Kings and the Cult of Mithras and introduced Aethelwulf into both, when he managed to keep up with him.\nAethelwulf became a missionary, traveling across Europe and attempting to spread the faith of his god. He had few successes and when he returned to Britain, he found the local Cult almost gone. His refusal to accept Christianity brought him to conflict with the local authorities, both kindred and kine, and he was forced to go to Chester, whose prince, Marcus Verus, shared his faith. When Aethelwulf met the Ventrue overlord who shared the name of his god, he submitted to him immediately, believing in his inherent divinity.\nAethelwulf since then serves Mithras as a very loyal enforcer and warlord.\n\nFuture fate in canon\nAethelwulf will fall during an uprising against Mithras' rule during the War of the Roses, causing Mithras himself to enter the fray and staking the murderer of his agent to let him burn in the sun."
 POD_investigate.desc.791210: "艾默里是来自阿基坦的一位年轻小贵族，他没有野心，平静而富有同情心，这使得他被一位萨洛比僧侣[Glossary('尊长','game_concept_Sire_desc')]。随后他们一起旅行，边走边学习并帮助他人，直到他的[Glossary('尊长','game_concept_Sire_desc')]被巴力残忍杀害。过了一段时间，艾默里在布尔日亲王那里找到了友谊，直到睿魔尔的到来。\n亲王拒绝将艾默里交给睿魔尔处死，结果在睿魔尔对城市的袭击中丧命。在两位神秘石像鬼的帮助下，艾默里为朋友报了仇，并控制了这座城市。从那时起，他一直是一位公正而尽职的亲王，与法兰西的妥芮朵势力合作良好。尽管他依旧富有同情心，但任何睿魔尔胆敢踏入他的城市并期望获得宽恕的，都将受到严厉的教训。"
 POD_investigate.desc.791293: "A devotee of Neoplatonic philosophy in life, Flavius Sidonis fought all his unlife to cling to his dying philosophy. First persecuting the early Christians, he then switched sides when the Visigoths came, finding them even worse than the followers of Jesus. Allying with the Church, Flavius managed to curb the Visigothic's power... but was curbed in turn by the Christians, becoming a puppet ruler.\nThen, the Muslims and their [Glossary('Ashirra','game_concept_ashirra_desc')] benefactors arrived. Allying with them, he tried unsuccessfully to become relevant again but was soon ignored once more by the two factions. The current mortal Reconquista gave him a new chance though, and he quickly pushed the weakened [Glossary('Ashirra','game_concept_ashirra_desc')] out of his city. With this political move, Sidonis has earned the grudging respect of the Christian Lasombra... much to his annoyance, as he still sees them as uncouth invaders. But at least for now, Flavius is once again the most powerful and influential $pod_cainite$ in Zaragosa."
 POD_investigate.desc.790278: "An Ancient Greek pre-Socratic philosopher, Democritus was an advocate for logical reasoning over subjective observation. He is renowned for his scientific approach to politics, diplomacy, negotiation. Many who have met him consider the vampire to be the most calm, rational, and level-headed individual that they have ever met. He is also known as the mentor of a controversial figure in Brujah's history, Etheyra, who is said to have betrayed the secrets of Carthage for her safety, and may have even suggested salting the ground as the city was burned by the Romans.\n\nFuture fate in Canon\nDemocritus will serve as the second ever Ventrue Justicar from 1504 until, at least, the 16th century. His relationship with his Laibon brethren is also getting more strained by the night, as they are starting to see him as a lapdog to the invading [Glossary('Ashirra','game_concept_ashirra_desc')] and their Muslims mortals."
 POD_investigate.desc.791187: "对开罗的$pod_cainites$来说，犹八一直是一个谜团，自苏丹安东尼乌斯掌控这座城市以来，他便一直陪伴左右。其他人因背叛、野心或仅仅是糟糕的建议而纷纷离场，而犹八则耐心地上前承担了更多责任。他无意统治这座城市，满足于作为安东尼乌斯的首席顾问。\n然而，最近的事件正在考验犹八那传奇般的耐心。赛特之子变得越来越胆大，更糟的是，安东尼乌斯开始逐渐忽视他的建议，甚至公然无视他。他开始怀疑显而易见的原因——赛特之子的影响——并正在寻找微妙的方法以控制他们日益增长的权力。"
 POD_investigate.desc.790620: "作为一位强大的棘秘魑女巫，西考拉克斯选择诺克文化作为她的臣民，但她的统治立刻遭到了约鲁巴人及其阿左贡巫师的挑战，他们认为西考拉克斯和“卡根追随者”是亵渎的存在。在非洲大地上，她遭到骚扰并被迫逃亡，最终不得不唤醒她的尊长来助她一臂之力。与此同时，奴隶贸易极大地伤害了约鲁巴人，这更加激起了阿左贡的仇恨。\n\n其在原作中的未来命运\n尽管与外来吸血鬼缔结了条约，西考拉克斯和德姆德梅赫仍无法扭转$pod_clan$的局势。最终，西考拉克斯将被一些幸存的阿左贡杀死，非洲的棘秘魑将被迫沿区域或边缘地带扩散。"
 POD_investigate.desc.790832: "Born to a silversmith who dabbled in academics, Dominique proved to be his most promising student. Nobles and merchants sought her company, and her quick wit dazzled all who met her. Sons of noblemen vied for her hand, trampling past many prettier, richer and more women to woo her. She took little interest in their attention, which only inflamed their ardor.\nAt twenty-five, the bright, fiercely independent, and happily unmarried young woman attracted more than ardent suitors; she incurred the wrath of the pre-Inquisition clergy. Sentenced to death by hanging for unsanctioned reading of Greek classics, she was rescued by a Ventrue lord who wanted to benefit for her wisdom. Dominique, however, was furious that she had been denied the right to stand up for her beliefs. Her [Glossary('Sire','game_concept_Sire_desc')], not understanding that some people would actually sacrifice themselves for their ideals, was baffled, but soon resorted to the Blood Bond to bring his childe to heel, something that fuels Dominique's resentment for the elders even more.\n\nFuture fate in Canon\nDominique will eagerly join the Anarch Revolt and become one of the most successful early Sabbat strategists. She will be offered great rewards but will refuse them, always believing that freedom is the only worthy goal, not power or honor. To this night, she is still often called 'the Conscience of the Sabbat' and is respected by her friends and foes alike."
 POD_investigate.desc.699999: "安吉瓦是美茵河流域的原住民，于石器时代时生活在芬里尔仔兽所保护下的部落之中。一夜，他发现一名少女坐在美茵河床上，泣血涟如。安吉瓦倾听她的故事并相信了她。被他的真诚感动，于是少女$pod_Embrace$他。\n约莫西元前400年，他来到尼尼薇，该地统治者——名为阿努图的末卡维心怀谋杀意图而邀请他出席血宴。由此导致的冲突结果是阿努图被摧毁，他的神庙亦隳灭。怀着对南方文明的厌恶安吉瓦归乡，未曾察觉阿努图的子嗣——伊南娜誓言复仇。\n这就是他们漫长又苦涩的冲突开端，伊南娜投身罗马而安吉瓦则协助当地日耳曼部落抵抗。在110年的胜利后，安吉瓦将注意力转至尼克图库——猎杀诺斯费拉图的恶怪。尽管取得了些胜利，但他会因为重伤不得不撤退至法兰克福。就在那里他遇见了茱莉亚·安塔西娅，不久便着迷于她对$pod_cainite$社会的理想愿景，立刻决定献身她的事业。\n\n其在原作中的未来命运\n伊南娜的回归会迫使安吉瓦数百年采取守势。然而，即使在至暗时刻，他也永远不会停止引导和保护诺斯费拉图同伴，这使他成为受诅咒者间的传奇。"
 POD_investigate.desc.POD_Rock_Lord_01: "The first Gargoyle ever made to be considered a success by Goratrix and Vistania was named Chaundice. It was to become typical of its kind, be it in looks or utter loyalty to the Tremere. Chaundice served faithfully for five years until he didn't came back from a mission and the Tremere never saw him again, considering him dead from this point on.\nVirstania however soon started to believe that Chaundice has escaped and created his own brood of independent Gargoyles beyond Tremere control. This tale of the \"Rock Lord\" soon became a favorite legend among the Gargoyles.\n\nFuture fate in Canon\nOne night, the Gargoyles will win their independence and the \"Rock Lord\" title will be reused by another legend among their kind. The first \"Rock Lord\" however, will end up with the most tragic of fates: back in chains and servitude."
 POD_investigate.desc.790268: "奥拉夫·维克伦个人实力不凡，但权力却并非如此，对斯堪的纳维亚维梵卓的影响力很小，主要体现在他与更具野心的阿格尼瑟·桑斯特的友谊上。奥拉夫首先是一名士兵，他发现自己与亲王的职责格格不入，但在与英灵战士的战争中，他迄今为止还是让一切顺利进行。\n\n其在原典中的未来命运\n梵卓战胜英灵战士后，奥拉夫将把斯德哥尔摩作为他的权力中心。他的统治将毫无特色，并在近代早期逐渐淡出历史。"
 POD_investigate.desc.791455: "The eldest daughter of a minor Aragonese noble family, Liseta's beauty attracted many suitors, including her future [Glossary('Sire','game_concept_Sire_desc')]. She soon became his most trusted aide, seducing and charming powerful men to help his cause. She went too far however and wronged wives soon told the Christian knights about the \"devil seductress\". The consecutive attack killed her [Glossary('Sire','game_concept_Sire_desc')] and left Liseta bitter for revenge against the Church.\nFinding it too entrenched in Western Europe, she has moved to Hungary and has been hard at work molding the nascent clergy to her corrupted designs.\n\nFuture fate in Canon\nLiseta will be betrayed by her ally Geza Arpad. Chained and tortured by the Inquisition, she will burn in the daylight long before they can bring her to the stake. She will use the ensuing confusion to escape but will never recover mentally and physically from this ordeal. Masquerading as a Nosferatu, she will become one of the most proficient Sabbat templars."
 POD_investigate.desc.505108: "Before the Romans came, Danika lived in the city of Sarmizegetusa, capital of Dacia. At the age of fourteen, she was betrothed to an undead voivode named Damek Ruthven. She was educated, and her [Glossary('Sire','game_concept_Sire_desc')] visited her only once a year. After her training, she ruled her own domain in service to Damek, who was engaged in the process of grooming a new bride for himself; Danika soon learned she was not the first and would not be the last. Although she does not claim credit for engineering her sire's fall from power at the hands of his Tzimisce enemies, she quickly offered her fealty to the victors, thus retaining the holdings she had been given, including Hunedoara Castle.\nBy the time the German Ventrue began their incursions in the Land Beyond the Forest, she had both a sizeable brood and a vast storage of koldunic learning, and was able to hold her own against them as well. As she witnessed how paganism gave way to Christianity however, she grew restless, seeking a reason to continue her unlife beyond simple feeding and stargazing. She is now seeking an answer and a goal.\n\nFuture fate in Canon\nDanika will find this answer in the nascent Inconnu that will convene in her very own castle. When Cretheus' great mistake happen, she will be chained to a demonic pact like all the others."
 POD_investigate.desc.790731: "伊莱特丽雅生为斯巴达小贵族的一员，那时罗马业已征服斯巴达。在斯巴达的全盛时期她是不可能如此追求艺术的，但她现已成为著名的艺术家，特别受外国旅者与商人欢迎。终于，斯巴达人民对于罗马入侵者的仇恨达到了临界点。一夜，下层阶级与民主派起义反叛罗马。因为伊莱特丽雅与入侵者交往过密，自然成为斯巴达人民的仇恨对象。\n在帕里斯的坚持下，海伦救了伊莱特丽雅，旋即血缚她数百年，直到厌倦了她才释放。此后伊莱特丽雅游历欧洲，只在创作时才停下脚步，而后又再次离开。\n\n其在原作中的未来命运\n海伦会在前往新世界的旅程时召唤伊莱特丽雅作为血畜服侍，一直到被派往维拉克鲁兹统治。与老朋友曼陀罗决裂后，伊莱特丽雅又会被海伦召回芝加哥再次为奴。然而在21世纪初期海伦的虚弱，伊莱特丽雅会第一次开始考虑一个对她长久陌生的概念——反叛。"
 POD_investigate.desc.790153: "Little is known of Wallenberg's early existence, other than the identity of her sire, Baba Yaga. It is known, however, that she used her command of Obfuscate to interact with the mortal world frequently, often comforting those who shared physical deformities and were shunned by their compatriots in exchange.\n\nFuture fate in Canon\nShe will travel Europe for a long time until she and her childe and lover, Ellison Humboldt, decide to settle in Berlin, despite the wishes of Prince Breidenstein. She will dwell there for an undefined period of time, until collapsing sewers during the bombardments in World War II send her into torpor. She will stir with the call of Baba Yaga, and at behest of her reawakened [Glossary('Sire','game_concept_Sire_desc')], she will coordinate Nosferatu activities in Berlin through Ellison and fight a silent battle to make Wilhelm Waldburg the sole prince of the city.\nIt is speculated that she also struggle to stop the machinations of the Setite Methuselah Nefertiti. When all was said and done, she would hand control over Berlin to her sire."
 POD_investigate.desc.790948: "Urdo was a Tzimisce of great renown and influence in Eastern Europe during the early Dark Ages, known as the Master of the Hellhounds and Sculptor of the Flesh of Thousands. In his position as Viceroy of the Council of the Voivodes, he was the herald of $pod_clan$ Tzimisce back in that period.\nThrough Urdo, the Council issued proclamations demanding that Voivode Vukodlak presented himself to before them to explain the truth of his actions regarding a blasphemous decree, where Vukodlak claimed he was performing conjurations in order to usurp the mantle of their Grand-sires, the [Glossary('Antediluvians','game_concept_antediluvian_desc')]. Vukodlak naturally refused the summonings and thus prompted Urdo to propose his destruction, and the seizing of all his domain for dispersal among the remaining Voivodes as payment not only for the war effort, but for the unwanted attention that Vukodlak attracted to clan Tzimisce in the region as well. However, mindful of the considerable risks of waging war against such a powerful foe, the Council of the Voivodes decided to blight Vukodlak with a mighty conjuration using Koldunic Sorcery, to plunge the disloyal Voivode in a state of $pod_torpor$ that lasted twenty centuries.\nUrdo's power quickly dwindled after this incident as many political rivals of his time, such as Noriz, used what they considered as a show of weakness to sideline him, reducing the once proud Viceroy to a forgotten frontier lord."
 POD_investigate.desc.790816: "Born Elias Andronicus, Elihu has been the Inconnu Monitor for the Levant and Arabia for centuries, keeping a close watch on current events for his reclusive masters. It was there that he met Rebekah, a young refugee that he felt in love with. Soon becoming her [Glossary('Sire','game_concept_Sire_desc')], they started travel the world and learn from each other.\n\nFuture fate in Canon\nFate and ill fortune will trap them in the wrong time and place: Barcelona, staging ground for the Spanish Inquisition. Rebekah and Elihu will quickly find themselves little better than prisoners, besieged on all sides by race-based persecution and rapidly tightening nets of witch-hunters. Their rescue will come in the form of Rafael de Corazón, Renaissance craftsman and father of the august body history would later call the Camarilla.\nThe Toreador will offer them membership in his fledgling order in exchange for their withdrawal from the mortal world. Although Rebekah will want to refuse his offer and challenge what she perceives as de Corazon's cowardice, Elihu will unhesitatingly pledge their cooperation and support.\nThe particulars following this first and fatal disagreement between sire and childe will not be publicly known, but Rebekah will leave the city of Barcelona alone and unfettered. Elihu will never be heard from again."
 POD_investigate.desc.505168: "Born to a rich merchant family in Genoa, Paliuro was introduced into the church from an early age. His intelligence and eagerness were very welcomed by his superiors, his sharp tongue and egocentric arrogance not, as he presumed to be more educated in matters of faith than his teachers. Enraged by the Muslim occupation of Jerusalem, he began preaching against them. This and his connections to the Genoan merchant families earned him the attention of a Lasombra, who began tutoring him.\nWhen Pope Urban II called out for the Crusades, he immediately joined in, in order to create a new anchorhead of Lasombra control. Together with his childe, he followed to Crusades and joined the siege in 1099 in a monumental Frenzy, slaying everyone in his way. During this time, he was also seared by the True Faith of the cathedrals within the city, scarring his mind deeply. In the period of Christian control of Jerusalem, he ensured a steady flow of wealthy pilgrims to rebuild the cathedrals and churches within. After the Muslims under Saladin managed to reconquer the Jerusalem, he plotted to expel them.\nWith the recent return in power of the Christians, Paliuro tried to conquer the Princedom once again but was foiled by Lucius Trebus Rufus who is, according to him, a pawn of the Diet of Olives and its Muslim leaning leader. Paliuro is since then plotting both of their downfall, hoping to finally usher a \"true\" Christian rule in Jerusalem.\n\nFuture fate in Canon\nHis plans, however, will fail and he will meet Final Death when the Sepulcher will be desecrated in 1244."
 POD_investigate.desc.790817: "As a street urchin of illegitimate parentage in first-century Judea, Rebekah spent her childhood in Roman-occupied Jerusalem. A rebellious spirit at heart, she joined with the radical political assassins known as the Sicarii. Rebekah soon acclimated to this notion of a double life by collecting missives and snippets of overheard conversation from her master's chambers and redistributing them among her newfound brethren.\nShe was finally forced to flee when the Romans begun an extensive search for her and ended up in the mysterious Elihu's care. The pair soon became lovers, then [Glossary('Sire','game_concept_Sire_desc')] and childe. Learning everything she can about her new condition, Rebekah is now traveling the world.\n\nFuture fate in Canon\nFate and ill fortune will trap them in the wrong time and place: Barcelona, staging ground for the Spanish Inquisition. Rebekah and Elihu will quickly find themselves besieged on all sides by race-based persecution and rapidly tightening nets of witch-hunters. Their rescue will come in the form of Rafael de Corazon.\nThe Toreador will offer them membership in the Camarilla in exchange for their withdrawal from the mortal world. Although Rebekah will want to refuse his offer, Elihu will unhesitatingly pledge their cooperation and support.\nThe particulars following this first and fatal disagreement between them will not be known, but Rebekah will leave the city of Barcelona alone and unfettered. Elihu will never be heard from again.\nAfter that event, Rebekah will wander the world looking for answers before joining a sect of reclusive elders. Her wanderlust and thirst for justice and rebellion will catch up to her in the end."
 POD_investigate.desc.791170: "作为一位有才的法师和卡巴拉学者，阿米亥在他的$pod_Embrace$之后，他的魔法天赋完全消失了，但他在支配术和观占术方面的能力却显示出非凡的才华。由于无法在家族和不断壮大的金字塔中取得进展，他的[Glossary('尊长','game_concept_Sire_desc')]将她的尴尬之处转化为机遇，派遣她前往印度。\n阿米亥融入了科钦犹太人群体中，成功地迷惑了曼加卢尔的几位重要凡人，充当商队的赞助人。他缺乏魔法技能使得檀那婆对他不屑一顾，尽管如此，他与印度的雷伏诺保持着一种随意而友好的关系。"
 POD_investigate.desc.791714: "修会中最著名的神秘主义者与预言者，约安娜·玛达肋纳修女的才能仅次于圣母特蕾莎，作为一位神圣的先知，备受推崇。她自幼便开始经历异象，这些异象随机降临，每次都令她身心俱疲，情感崩溃。\n她的家人认为她疯了，在绝望中向当地修道院寻求帮助。幸运的是，圣约翰修女会在了解情况后帮助她找到了内心的平静，也使她能够稍微控制自己的天赋。\n如今，约安娜修女致力于完善冥想技巧，使修女们能够在异象降临时集中注意力，并努力解开特蕾莎修女临终时最后一系列异象的谜团。"
 POD_investigate.desc.792382: "莎贾尔·杜尔最初是一名土耳其女奴，由前任苏丹为其妻子买下。苏丹去世时，他唯一的继承人正远在他乡抵御第七次十字军东征对哈里发国的进攻。由于担心马穆鲁克发动政变，莎贾尔·杜尔向公众隐瞒了苏丹的死讯，并在继承人不在场的情况下自立为苏丹。\n在民众起义后，她被迫成婚，其丈夫建立起了埃及境内的第一个马穆鲁克政权。她的计策最终失败了，在丈夫离奇死亡后，她遭到对手随从的毒打并被丢入护城河。然而，居住在城堡护城河中的诺斯费拉图——乌姆·马特救了她，随后便让她自谋生路。\n莎贾尔·杜尔重返公众视野后，发起了一场针对开罗境内非穆斯林诺斯费拉图所受待遇的抗争，并为所有想要躲避哈吉以及控制该城市的马穆鲁克亲王的人建立了一个避难所。这一运动自称为“阿尼兰”。经过几个世纪的发展，他们已壮大到足以反抗哈吉的冷酷统治。甚至有人怀疑她是某个末日邪教的秘密领袖。"
 POD_investigate.desc.790200: "迦太基陷落后，罗马的布鲁赫被迫忍受各种屈辱：缴纳赋税、履行屈服仪式，并在任何政治动荡中沦为替罪羊，即便他们并非始作俑者。一百年前，诺斯替主义者色雷克斯来到罗马，带着一个简单的使命：考验这个堕落的学者氏族，直到他们重新找回理想，否则便将其毁灭。\n她发现罗马的统治十分冷漠。他们夺取领地，却被视而不见。他们伏击、刺穿并据信杀害了妥芮朵贵族，而克瑞透斯对此毫无作为。卡米拉苏醒后，宣称色雷克斯的所作所为是“极佳的消遣”，并不顾其意愿任命她为城市大法官；尽管如此，色雷克斯仍觉得自己有责任维持和平。\n色雷克斯是当地学者氏族事实上的领袖。她已将其中许多人转化为纯洁派。色雷克斯现在相信自己或许能改革宫廷，并向“伪教皇”卡米拉发起挑战。\n\n其在原作中的未来命运\n她大错特错。在卡米拉的扭曲和操纵下，色雷克斯最终将自己的信仰堕落为恐怖的清洁之道，彻底变成了她曾经坚守的一切的讽刺。"
 POD_investigate.desc.791106: "斯蒂芬妮来自古代马其顿，是一名神秘的冈格罗，定居于不列颠群岛，尤其对威尔士情有独钟。她很快成为当地芬尼安狼人部族的强大敌人。斯蒂芬妮认为与这些化形者玩弄权术极具乐趣，交替展现出战争的伟绩和阴谋的精妙。\n她成功引诱了他们部族的国王，这位国王为爱放弃了自己的生命、部族和灵魂，而狼族对他的复仇堪称传奇。他如今仍在影界某个被遗弃的角落苟活，痛苦将伴随他度过余生。\n然而，斯蒂芬妮对此并不在意，她已经将目光锁定在国王的孙子——一位强大且富有魅力的芬尼安狼人布拉达身上。她正期待用更加精致的手段去摧毁他。"
 POD_investigate.desc.790673: "安托瓦内特·索维泰尔是一位强大的存在，拥有大量盟友和欠她人情的人。她的愿望很少被忽视或拒绝，对那些不遵从她命令的人毫不耐烦。她在必要时可以表现得礼貌且得体，但她对莉莉丝的崇拜使她对除了最亲密的盟友之外的任何人都变得残酷和轻蔑。\n其在原作中的未来命运\n安托瓦内特的影响力将继续增长，逐渐成为法兰西的重要角色。她将加入神秘的塔尔玛埃拉，成为莉莉丝教派的领袖。她在全球范围内的广泛关系将为她赢得秘盟和魔宴双方的尊重。她的陨落将发生在她最终试图掌控塔尔玛埃拉的时刻，这一举动将导致她的最终毁灭。"
 POD_investigate.desc.791396: "纳琪拉出生于第二次十字军东征的动荡年代，自幼便立志将异教徒赶出圣地。纳琪拉杀死的第一个基督徒士兵引起了哈基姆圣裔的注意，然后她在这个氏族的说服下成为他们中的一员。纳琪拉很难在她的不死之态和她对上帝的信仰之间作出调和，但这样的她仍然成为了一名强大的女术士。\n训练结束后，纳琪拉请求加入为安达卢西亚而战的行列，以便同时为她的$pod_clan$和信仰服务。纳琪拉很快就与巴德尔结盟，并帮助她巩固对午夜新月的统治。\n然而，最近纳琪拉对这项事业的信心却在减弱。她认为伊比利亚的穆斯林最终会灭亡，而她能做的就是在为时已晚之前保护他们的文化。\n\n其在原作中的未来命运\n纳琪拉对伊比利亚穆斯林的命运感到恐惧，并将其归咎于[Glossary('阿什拉派','game_concept_ashirra_desc')]。保护伊比利亚最后一个穆斯林据点格拉纳达成为了她真正的使命，她在 1492 年重建伊比利亚的最后一场战役中牺牲。"
 POD_investigate.desc.790305: "来自提尔的格萨坤在$pod_Embrace$后，一度安于他的凡人家族。然而，作为特洛伊尔子嗣的愤怒情绪常常压倒他，让他在不知不觉中伤害了那些他想珍视的人。在一次这样的爆发中，格萨坤遇到了埃斯穆纳马什，一位以温和姿态接受病人和客人而闻名的著名医生。深受感动的格萨坤认为这位医生能忍受该隐的诅咒，便[Glossary('初拥','game_concept_Embrace_desc')]了他。不幸的是，事情并没有如他所愿。\n埃斯穆纳马什的温和天性不足以抵抗吸血鬼可怕的诅咒，他很快就与格萨坤渐行渐远。由于感到受伤且为将一个善良的人推入永恒折磨而自责，格萨坤退出了血族的政治游戏，从此再未现身。"
 POD_investigate.desc.791757: "柳德米拉·范·德尔·霍尔斯特——毫无疑问这绝非她的真实姓名——比她所声称的年龄要古老得多。她在那个地区居住的时间远远早于第一个高卢-罗马定居点的建立。这位末卡维从一开始就决定，绝不允许外来的血族毁坏她的家园——而她对吸血鬼能力的娴熟掌控，以及强大的血脉，足以让她的愿望成真。\n如果有人知道范德霍尔斯特的巨大力量，那将是令人恐惧的——或更确切地说，应该是恐惧的。不过，到目前为止，她只将自己的力量用来让血族的阴谋在她的领地内保持沉寂，甚至容许梵卓的卡米拉·杜申继续掌权。\n如果她有一天决定在该地区的政治舞台上变得更为活跃，那么霍尔斯特将成为一股几乎无法阻挡的力量，谁也无法肯定她不会在不久的将来这么做。\n毕竟，她是末卡维。"
 POD_investigate.desc.790102: "Giselher's [Glossary('Sire','game_concept_Sire_desc')], Agrippa, had built the city of Cologne, Germany at the height of Rome's power and made it his home. When the legions of Rome retreated across the Rhine river in the year 401 CE, the $pod_cainites$ went with them. The city was abandoned to the Franks. It was this time when Agrippa [Glossary('Embraced','game_concept_Embrace_desc')] Giselher, a Burgundian prince, but it would be 400 years before this new childe would be set on the task of reclaiming his beloved city on the Rhine.\nIn 860, Giselher and a coterie retook the city from a group of Christian mages. They used a gang of mortals to burn the mages out of their cathedral-chantry. The city was reclaimed for the childer of Caine once again, with Giselher as the new Prince.\nAt some point before 1230, members of Clan Lasombra attempted to usurp his power. This earned the Lasombra his resentment, granting them no audience or succor in his domain while he ruled. His connections with Clan Nosferatu are particularly strong; he protects and supports the Lepers in his domain. He rules with a calm, even hand, as taught to him by his grandsire, Julia Antasia, who rules in nearby Frankfurt. Because of this, Cologne became a center of commerce for the Kingdom of Germany and a meeting place for Cainites across Europe in the Dark Ages.\n\nFuture fate in Canon\nGiselher will abdicate an unknown period of time later, but will maintain his haven in the city. He will be known for his strong ties to Friedrich Barbarossa of Frankfurt, with whom he shares a reformative view on the Camarilla."
 POD_investigate.desc.792154: "作为一位基辅罗斯农民的长女，利欧亚一直认为自己是诗人或说书人。生活艰难，而她的灵魂渴望更多未知，这驱使她在黄昏时分走入神秘的森林。这引来了恶意的关注，幸得冈格罗伊蕾内及时相救，她才逃过痛苦的死亡，而伊蕾内也迅速对她产生了好感。\n伊蕾内告诉她，自己是一名游荡者，自由地在大地上漫游，不受任何人约束。她问利欧亚是否愿意加入她的行列。利欧亚毫不犹豫地答应了。\n接下来的十年里，她们一起游历，利欧亚很快学会了新族群的方式，并成为了一位的说书人。最近，她加入了强大军阀喀喇的队伍，希望这样一个强大的野者部族能让她学到更多。她也开始担任野者孤儿的导师，期望以此回报伊蕾内曾对她的恩情。"
 POD_investigate.desc.791352: "古德伦曾是挪威最受尊敬的女巫和先知之一，如今却成了一个枯萎的老卡帕多西亚，变成了一个已逝传统的最后残余。但正是在这种身份中，她找到了意义。她抛下符文，开始提供神秘的、只言片语式的预言，这些话语真假难辨，有时是可信的预言，有时则是单纯的操纵人心。\n作为一名性格古怪的老妇，古德伦已经放弃了大多数世俗的算计——现在，她真正的目标是为自己的信仰带来体面的终结，并出于娱乐目的，给其他$pod_cainites$带来痛苦或微小的烦扰。她对不死生活已经厌倦，并非常乐意帮助那些渴望改变现状的年轻吸血鬼，只要他们展现出足够的智慧与巧妙。即使对她出言不逊，只要带着机智，古德伦也会欣然接受。"
 POD_investigate.desc.790741: "Mitru began his unlife as an arrogant and overconfident 'defender of the innocent'. He once believed that the only weapons he needed to defend the village where he was born were his bow and a few hand-crafted arrows. Thus, he stalked the beast that had preyed upon his people. He crafted 13 arrows to slay the vampyr known as Nova Arpad; three arrows in Nova's chest forced her into $pod_torpor$.\nWhen Arnulf heard of this legendary accomplishment, Mitru received an unholy reward: his baptism into darkness. As the prince of Napoca, Mitru is fanatic about guarding his domain from other supernatural threats. He trusts in himself, but he is already growing suspicious of the beliefs of the other members of his $pod_clan$.\nHe often hunts prey in the woods outside the city, but occasionally, he finds a mortal who seems worthy of becoming a ghoul. Silently, Mitru harries the prospective servant through his lands to test the mortal's abilities. Those who fight with great puissance are [Glossary('Embraced','game_concept_Embrace_desc')]; those who run are destroyed. In the same manner, he tests those who pass through his domain with fire and clothyard shafts. The growing legend of his campaign against Nova has made him somewhat arrogant, but without his self-confidence he would perish.\n\nFuture fate in Canon\nMitru will have to resort to some unsavory alliances to continue protecting his domain in the nights to come. He will become Dracula's attack dog and enjoy some success in this role but, more importantly, make many new enemies. No longer useful to his master, Mitru will be finally caught and killed in the early 1990s."
 POD_investigate.desc.791451: "侯赛因是一位富商的次子，他从集市上成群的流浪儿那里学会了潜行和扒窃。凭借惊人的潜行天赋，他在经历了七年的学徒生涯后最终被吸纳，成为了一名阿刹迈。\n侯赛因也展现出了卓越的外交才能，这使他成为了阿拉穆特，鹰巢派往保加利亚巴希里奥亲王处的正式使节。然而，真实情况是侯赛因被预先安插为刺客，目标是在哈基姆圣裔进入该地区时杀掉巴希里奥。\n但侯赛因很快对巴希里奥亲王产生了情谊，并热衷于与他长谈，这使他对自己的秘密任务产生了动摇。最终他采取了行动，但为了保护巴希里奥，他故意搞砸了刺杀。这次尝试惊动了亲王并使其逃离了城市，侯赛因目前正努力安抚鹰巢对此失败深感愤怒的高层。\n\n其在原作中的未来命运\n侯赛因将完成救赎，执行包括大胆袭击强大的格拉崔克斯在内的艰巨任务。凭借这些战绩，他被选为哈基姆圣裔的代表之一，参加了意义重大的荆棘大会"
 POD_investigate.desc.790537: "多年来，拉米亚密教一直向那些践踏人类命运的暴君、元老和国王保守秘密。然而，不死族的耳朵能听到许多事，因此，卡帕多西亚的拉撒路在一个无月之夜偷偷来到一座隐藏的神庙，在那里拉米亚在黑暗之母的雕像前举行仪式。\n拉米亚的博学和热情，也许还有其他品质，触动了盗墓者内心深处隐藏已久的东西。于是，他从阴影中现身来到拉米亚面前，在黑暗之母乌木雕像不赞成的目光下将她压倒。\n黎明到来时，拉撒路躲在神殿里，醒来后将他的新子嗣带入了不死族的世界。他暁喻这位美丽的女祭司将永远沉思死亡，即无人能逃脱的黑暗之母。拉米亚微微一笑，同意陪伴他——直到她在其仁慈的[Glossary('尊长','game_concept_Sire_desc')]耳边低声说了些自己的秘密，拉撒路才停下来听着。\n她告诉他的事情，他从未记录下来。自从初拥她的那晚以来，拉撒路就再也没有和该子嗣说过话，而且找了好些借口来避开她的陪伴。当情况迫使尊长和子嗣接触时，拉米亚会微笑看着拉撒路，嘴里发出几个难以理解的音节，使拉撒路尸体般的面容变得更加苍白。\n拉米亚的子嗣紧随其尊长世系，充当卡帕多西亚的战士和保镖。\n\n其在原作中的未来命运\n在卡帕多西亚大清洗期间，拉米亚将被奥古斯都·乔凡尼亲自吸榨。但一如既往，她会笑到最后。"
 POD_investigate.desc.790450: "A dour and eccentric little man, Timofiev was an alchemist in life with an extraordinary confidence in his own skills that attracted his prospective [Glossary('Sire','game_concept_Sire_desc')]. Since discovering the politics of the undead, Timofiev has been somewhat humbled, but only by a little, now considering that the Castle of Shadows never game him a proper shot at leadership, despite his now considerable age.\nAs a consequence, the spurned man has started aligning himself with Gratiano's 'youngsters', hoping that a few elders will be washed away by the fire of the youth, leaving him a spot to comfortably take over.\n\nFuture fate in Canon\nTimofiev will be an important participant in the Anarch Revolt and the birth of the Sabbat, but will always fell just short of achieving true power. Outsmarted by his (often way younger) peers, he will learn some humility before finally achieving the rank of Cardinal. During the capture of Lucita of Aragon in 2000 in what should have been his crowning achievement, he will be cornered by an Abyssal monstrosity and choose to take his life instead of being devoured."
 POD_investigate.desc.792050: "凡人时期的吉尔伽美什曾是公元前四千年古苏美尔乌鲁克城邦的国王。根据妥芮朵学者的说法，妥芮朵[Glossary('上古耆宿','game_concept_antediluvian_desc')]和冈格罗上古耆宿之间曾为争夺命运石板的所有权而结怨。\n在几场激烈的战斗之后，亚力科（妥芮朵）找到吉尔伽美什，并提供了$pod_Embrace$他这个凡人的建议，如果他愿意帮助她对抗恩奇都的话。然而，吉尔伽美什当时已经受到了伊娜依娅的诱惑，选择了站在冈格罗一边。\n据说，妥芮朵上古耆宿不得不逃离这对组合，但在此之前，他们遇到了一个被称为“天牛”的巨大凶兽。恩奇都成功地杀死了它，吉尔伽美什却在战斗中陷入了[Glossary('蛰眠','game_concept_torpor_desc')]。"
 POD_investigate.desc.792139: "作为 8 世纪入侵伊比利亚的阿拉伯与柏柏尔军队的一员，拉希德曾走遍半岛各地，并与许多西哥特冈格罗会面。通过倾听他们的见解并融入自己的思考，拉希德形成了对 $pod_cainite$ 处境的独到理解，并构建了后来被称为塔里克·贝都因，即游牧之道的体系。\n得益于与之接触的诺斯掠夺者，拉希德的思想得以进一步传播，并由此衍生出了游牧之道的北境分支。\n北境人已不再记得拉希德，但伊比利亚的野兽们依然深切地怀念着他。为了进一步深究自己的哲学，拉希德隐退到了阿拉伯的荒漠之中，有时那些渴望求道的初学者会前往那里寻觅他的踪迹。"
 POD_investigate.desc.790390: "作为仍是凡人时的小偷和杀人犯，埃斯库特在他的[Glossary('尊长','game_concept_Sire_desc')]撕裂他的喉咙时，以为自己即将死亡。他呢喃着祈求宽恕的祷告，心中则充满惊恐的尖叫，因为在他获得了重生的同时，他的眼前浮现出了由$pod_cainite$长者引发的末日幻象。\n从那时起，他作为一名有信仰的野兽为上帝和大马士革的基督徒服务。为了净化自己的灵魂并找到解决他初拥时所见幻象的答案，埃斯库特坚守沉默的誓言。尽管他为自己的中立立场而自豪，但埃斯库特正在考虑更多地干涉大马士革的政治，因为他认为巴力的蔓延可能是末日即将到来的征兆之一。"
 POD_investigate.desc.790594: "魅力非凡且热情洋溢的康布雷的加百列在一处圣地遭遇到崇魔者勒森魃后，才开始直视真正的危险，随即便创立了晨星骑士团。他着手寻找其他有着和他类似经历的人，并将他们磨练成足以真正应对崇魔者的威胁。迄今为止，该骑士团取得了少数成功，但康布雷个人的目标仍然是消灭黑天使，他首次遇到的黑天使是亚历桑德罗·马特尔–桑多瓦尔。\n\n其在原作中的未来命运\n康布雷将继续他自命的十字军东征，每一夜变得愈发残酷。与塔尔玛埃拉结盟后，他将完善自己“艺术”的专长，好让崇魔者发出悦耳的尖叫声。"
 POD_investigate.desc.790958: "以利亚·艾哈迈德从神圣先知穆罕默德的时代开始就行走于烈日炙烤的沙漠上。作为一名虔诚的穆斯林，他很难将自己的信仰与对[Glossary('尊长','game_concept_Sire_desc')]忒弥斯的责任协调起来。当以利亚的血胞法蒂玛选择默默地反抗忒弥斯时，他自己试图将自己的立场介于中间，那就是在坚持自身信仰的同时，也为刀锋之网助力。\n\n其在原作中的未来命运\n当忒弥斯进入$pod_torpor$时，以利亚被选为贾迈勒哈里发的继任者，而不是还在制造矛盾的法蒂玛。尽管如此，当乌尔·舒尔吉苏醒时，以利亚的温和立场也无济于事。由于以利亚无法放下真主和伊斯兰的信仰，玛土撒拉会先夺回这位哈里发身上的哈基姆之血，再唤出炽热的沙漠之风将他烧死。"
 POD_investigate.desc.791129: "庄子师从老子，但对世间万象纷杂的体验毫无准备。他偏离了“道”，过上了享乐的生活直至死亡降临，让他为自己的失衡而受苦。然而，智慧终究归来，庄子找到了新的寻道之路：在阴阳之间的刀锋上，在自身矛盾的风雨中，向内寻求“道”。\n转生为[Glossary('万鬼','game_concept_kuei_jin_desc')]的庄子很快就成了诸皇朝中的奇才，注定要有大作为。但他否定了老祖的精神权威，驳斥了天道和五行之道，因此很快就被同辈们打上了[akuma|E]的烙印。逃离中国后，他的话语仍如星星之火般燃烧，内引众随他的足迹传播开来。\n摒弃了天道、天条和其他精神层面的观念，庄子的众多弟子很快便追随他开始了对平衡的追求，他们沉溺于各种体验，但却无一深陷其中。"
 POD_investigate.desc.792599: "生于古埃及军人世家，阿门·哈勒在拉美西斯大帝征战亚洲期间担任军官。阿门·哈勒的一生几乎都献给了战争，这也成为他永恒的兴趣爱好。他几乎为每一个国家效力过，参与过大多数历史上的重要战役，也包括一些未被记录的战斗。\n他常将自己的军事天赋贡献给弱势一方，这既是为了挑战自我，也带有某种正义感。他被证明是荷鲁斯最值得信赖的顾问之一。在需要直接行动的时刻，荷鲁斯会依靠阿门·哈勒来组织必要的准备工作。\n\n其在原典中的未来命运\n阿门·哈勒将在最后的岁月中继续研习战争的艺术，并被科技优势将如何改变战争的方式所吸引。尽管如此，他的洞察力仍将对荷鲁斯的圣战起到至关重要的作用。"
 POD_investigate.desc.790471: "卡纳最初是一名出身于机能不全家庭的农家女孩，后来被一位睿魔尔亲王收为血奴并带回了他的住所。她与这位昔日情人度过的时光极其痛苦，因为他反复虐待她，随后为了吸食牧群中其他人的血而将其抛弃。一天深夜，他因遭到氏族上层轻视而满腔怒火地闯入她的房间。愤怒之下，他将卡纳$pod_Embrace$作为报复，认为她在氏族中的地位会比他还要低下。\n在被带往维也纳后，卡纳努力争取自己在氏族内的地位，最终甚至成功获得了对马赛的统治权。\n\n其在原作中的未来命运\n随着时间的推移，她对千年圣战感到幻灭，并担忧这场战争可能永无止境。其他氏族成员因这些观点而嘲笑她，随后她被调往密尔沃基。\n卡纳在默默无闻与绝望中苦苦挣扎，直到她找到了打破睿魔尔血缚的方法。这引发了一系列导致睿魔尔氏族本身分崩离析的事件，而曾经那个卑微的农家女孩，最终作为领袖之一，出现在了那些曾轻视她的氏族残余势力之中。"
 POD_investigate.desc.792729: "瓦沙克被戈尔康达一个腐化的耆那教信徒从地狱召唤而来，并被禁锢在一颗价值连城的巨大钻石中。在这座闪耀的囚笼中，他带领着他的食红花者教派走向繁荣，并统治了遮娄其地区的邻里。但随着耆那教在印度教、佛教和伊斯兰教的三方夹击下开始衰落，该教派的力量也随之萎缩。\n为了重振自己的权力根基，瓦沙克命令信徒从他的钻石圣物中切割下碎片，并在其中灌注了自己恐怖的力量。教徒们将许多碎片带离印度，进入小亚细亚；几个世纪以来，这些碎片被不断买卖和交易，最终进入了各国君主和教皇的藏宝库。每一块碎片都是通往瓦沙克灵魂的媒介，让他能够感知并操纵凡人。许多碎片被镶嵌在权贵佩戴的首饰中，使他们在梦境与梦魇中听到瓦沙克的低语和诱惑。\n瓦沙克是一个代表嫉妒的恶魔，他以目睹凡人的梦想和希望化为灰烬与苦艾为乐。与许多其他恶魔相比，他的力量更为微妙，尽管缺乏血腥与火焰的壮观场面，但其效果同样显著。他能洞察凡人的宿命与结局（以及如何阻止这些命运的实现）。他掌控着梦境与梦魇、幻象与征兆；他能读取凡人的思想与记忆，并用不幸与疯狂的诅咒折磨他们。\n\n其在原作中的未来命运\n瓦沙克将继续他理解并腐化人类的征途。他最终将被困在一个猎人的体内，变得虚弱无力，直到审判之日的到来。"
 POD_investigate.desc.792731: "欧若博司在几千年前被召唤，并被禁锢在一座潮湿、黏腻的砂岩雕像中。随后，他的教派被摧毁，圣物匣也随之遗失。直到13世纪10年代左右，一位好奇心过重的瓦勒度派学者在阅读了关于一个可憎教派的古代教会文献后，在德国的一处沼泽中发现了埋藏于此的恶魔圣物匣。他随后陷入的疯狂，正是这名恶魔重获非自然生命所需的扭曲信仰。\n欧若博司被归类为暴食恶魔，他专注于肉体愉悦，但其权能也涵盖了小型动物、毒药、身体排泄物以及各种饥渴。\n他的教派路西法派潜伏在德国的村镇之中。该教派宣扬的教义十分直白：肉体至上，且成员有权放纵每一种粗俗、令人作呕的欲望。这群人最初是瓦勒度派信徒——这是一个类似于法国清洁派的基督教异端运动——但在欧若博司的影响下，他们在二十年间逐渐堕落并陷入疯狂。\n欧若博司打算利用他们将宗教裁判所吸引过来。他甘愿让教徒被剿灭，以换取腐化部分裁判官的机会，从而将自己的影响力渗透进教会内部。"
 POD_investigate.desc.792760: "贝撒列尔曾是纳姆塔尔之一，一位死亡之天使。在堕落之后，他很快对自己收割凡人灵魂的任务感到痛苦，并试图使自己在无助的灵魂面前看起来尽可能的和善。但无论他伪装得多么天真无邪，他都无法减轻他们在死亡时的恐惧和痛苦。随着战争的推进，贝撒列尔带着苦涩的决心与天军作战。他希望人类能像亚伯教派爱戴忠诚天使那样爱他，信任他。\n然而，尽管哈拉库在战斗中表现出了令人生畏的实力和打开其他界域门户的能力，但他们还是像其他叛乱者一样被打入了深渊，贝撒列尔就是其中之一。数千年后，他终于被一位粗心的崇魔者召唤出来，但这枚棋子却服务于一个更强大的女主人。\n贝撒列尔发现自己被迫为一个极其邪恶的不死生物效力，与之相比，恶魔都几乎相形见拙。这位女巫在人类的传说中被称为芭芭雅嘎，她向堕天使喃喃自语着那些不成熟的计划。于是，贝撒列尔被束缚在这个鬼婆身边，依靠她的原始力量维持才不至于尖叫着回到深渊中。\n因此，贝撒列尔在扮演着忠诚的将军。作为命运与死亡天使，他知道宿命总有一天会追上铁之鬼婆。而他打算为那一夜做好准备。\n\n其在原作中的未来命运\n随着芭芭雅嘎在1999年的毁灭，贝撒列尔将获得自由，尽管他突然失去了力量。在俄罗斯的废墟中，他将创建属于自己的密教和权力基础，命运终于似乎站在了血天使这一边。"
 POD_investigate.desc.792733: "作为古希腊的战神，阿瑞斯是暴力、嗜血和虐待狂的化身。对他的崇拜更多的是一种安抚行为，只是为了抵御神灵的愤怒，而不是任何形式的奉献。\n虽然阿瑞斯首先被希腊人召唤，但在他作为罗马战神玛尔斯的任期内，他真正成为最强大的恶魔之一。依靠罗马军团对征服的暴力渴望，阿瑞斯的密教和权力几乎可以与地狱中最强大的大公相媲美。\n然后基督教来了。\n尽管阿瑞斯（和其他恶魔）尽了最大努力，但他们还是无法腐蚀第一批十字架信徒的信仰，玛尔斯很快就成了一个逐渐消失的记忆。如今，这个曾经强大的恶魔沦落到在希腊最偏僻的地方争夺信仰的地步，就像他被召唤的那天一样虚弱。\n\n其在原作中的未来命运\n战争当然不会改变，但阿瑞斯会。随着时间的流逝，他将不断变换伪装，成为从准军事组织到雇佣兵公司等不可靠士兵们所敬畏的守护神。"
 POD_investigate.desc.792734: "拉玛什图曾被亚述人召唤，随后以抹除之女之名受人崇拜。她曾被束缚于一个名为提亚马特的高阶恶魔之下，并一直密谋除掉对方。两者的激战导致拉玛什图的大量信徒丧生；尽管她最终战胜了提亚马特，但也因此元气大伤。\n被困于深海并几乎被拖回深渊之际，拉玛什图动用了最后的法力救下了欧内西洛斯——一名反抗波斯统治的伊奥尼亚希腊人。她在欧内西洛斯身上找到了一个心怀感激的仆人，并凭借他的信仰得以在人间存续。随后，她试图利用他迁往亚柯，因为她感应到那里潜藏着巨大的力量，但未能成功。\n从那时起，拉玛什图开始布局长线。她的教派规模虽小，但足够忠诚，使她终于能向这个世界施加部分力量。利用这些信徒以及黎凡特地区目前的动荡局势，她意图最终夺取亚柯的控制权，并寄希望于城市下方埋藏的神秘力量，能让她一举晋升为高阶恶魔。\n\n其在原作中的未来命运\n拉玛什图的教派将成功从狼人与裁判官手中夺取亚柯的控制权。然而，由于内斗和领导力缺失，该教派的统治并未维持太久，最终未能为他们的女神献上她梦寐以求的力量。"
 POD_investigate.desc.792735: "世界之王、马尔杜克、巨匠造物主、伊达波思……玛门有很多面目，但他真正的身份只有一个：世俗权力和物质主义的化身。事实上，玛门不需要寻求新信徒，他们会自然而然地来到他身边，愿意为金钱、权力和名声做任何事情。他们自行来到他身边，挥舞着相当程度的社会影响力，并且无情到足以粉碎挡在他们面前的任何人（或任何东西）。\n玛门的崛起只是被早期基督教及其对美德（通常是贫穷）生活的强调所减缓。陷入沉睡的“世界之王”最近苏醒过来，惊讶地发现他曾经最大的敌人——教会，即使没有他的干预，也已经堕入了贪婪的恶习……\n其在原作中的未来命运\n贪婪是好事，玛门的生意在未来的夜晚将空前繁荣。当世界自我吞噬时，玛门将冷眼旁观，享受着每一个为他献身的灵魂。\n不论是有意还是无意。"
 POD_investigate.desc.792736: "作为一名前星光与苍穹的天使，尼卡努拉努在上帝宏伟计划的工具箱里，本质上是一个可靠但相当不起眼的小件。他本满足于仰望星辰并顺应宏大设计，但出于对这种奇特模式变化的纯粹好奇，尼卡努拉努加入了路西法的叛乱。和其它的叛军一样，他堕落了。\n几乎是作为一种事后的补充，他被投入了深渊囚牢。直到最近，尼卡努拉努才逃脱出来，发现自己被束缚在特兰西瓦尼亚胡内多阿拉一座不起眼的城堡里。然而，由于没有信徒崇拜他并提供急需的信仰，他深知深渊囚牢很快就会再次将他拽回，届时他将再次远离他挚爱的星辰……\n其在原作中的未来命运\n当一支由古老且强大的吸血鬼组成的圈子与尼卡努拉努达成契约时，他将迎来转机。由于容易受骗且身处绝境，他会将他们束缚在自己的城堡中，并利用他们对自身力量的“信仰”（尽管考虑到各种因素，这种信仰其实微乎其微）来维持自己的存在。随着这一盟约的订立，秘盟就此诞生，而尼卡努拉努将继续仰望星辰，直至审判日的到来。"
 POD_investigate.desc.792776: "费罗克斯生前是不列颠一位凯尔特王子。在反抗罗马统治者的叛乱中，他与其部族在布鲁赫煽动者的协助下洗劫了卡姆罗多努。当由梵卓支持的援军镇压起义时，他不仅对抗他们，也阻止企图$pod_Embrace$其母布狄卡的吸血鬼，竭力守护她。\n布鲁赫氏族的长者对这名青年的凶猛气概深感印象，遂将他转化为血仆，并带往曼岛。当该岛沦陷于征服者之手时，费罗克斯奋战至最后，最终被俘并交由梵卓审讯。他始终缄默不语，而梵卓竟将此视为一种高贵之举，允许他保留血仆身份，之后他再次成为年长吸血鬼的守护者。\n\n在罗马末期，费罗克斯以惊人的热忱皈依基督信仰。梵卓遂利用此点，将他安排为其在教会体系中的重要代理人法布里齐奥·乌尔菲拉的侍从。然而，他对于自己信仰被玷污的不安，也每夜不断加深。\n\n\n其在原作中的未来命运\n费罗克斯的信仰将愈发狂热，直至梵卓为了摆脱他而将其交予睿魔尔。\n在协助石像鬼反抗其主人之后，作为回报他被转化为其中一员。此时，他也逐渐深信诺斯费拉图乃天堂叛乱的领袖，并开始对其展开无情猎杀。他在教会中的人脉亦成为新兴裁判所的重要助力，而他更乐于将矛头指向同族受诅者。\n\n此后数世纪间，他始终是$pod_cainites$传说般的人物——同时传播上帝的爱与愤怒。最终，他的名字将登上整个$pod_cainite$族群的最高通缉名单，成为对其种族存续的重大威胁之一。"
 POD_investigate.desc.790222: "正式头衔为埃克塞特男爵的休通过忽视外界来应对广阔的世界。伦敦，无论掌权者是谁，似乎总是忘记康沃尔，而休对此现状感到十分满意。相反，他更感兴趣的是与法国宫廷的联络以及与爱尔兰和地中海世界的贸易。\n埃克塞特在政治上相对弱小，但休的宽松统治使他得以维持权力，因为当地大多数人更愿意接受他们熟悉的（弱小的）恶魔，而不是未知的威胁。然而，这位男爵并非愚人，他正在与阿瓦隆中其他边缘附庸势力培养商业和政治联系，比如阿基坦的赫拉德和“苍白地”的爱德华·德·沃伦。\n以防万一，有朝一日广阔的世界最终波及康沃尔。"
 POD_investigate.desc.790234: "波尔多男爵是阿瓦隆在法国最后一块强力据点的亲王，而这一地位是一把双刃剑。一方面，由于法国收复领土导致大量密特拉富有影响力的追随者流离失所，赫拉德的宫廷因这些人的加入而实力大增。但另一方面……要让一个人去应付这么多满怀怨恨、一心复仇的$pod_cainites$，确实绝非易事。更糟的是，密特拉对他这位封臣的处境几乎没有提供实质性的支持。诚然，这位阿瓦隆之主偶尔会做出一些象征性的姿态，但综合来看，他似乎更关心英格兰本土的情况，以及维持与爱之皇庭的合作关系。\n历史上，赫拉德对阿基坦的统治也一直受到强大的该隐异端和初生的裁判所的挑战。种种因素使得这位男爵落下了软弱、容易摆布的名声，而赫拉德对此并不介意。被低估反而对他有利，他近期与邻城普瓦捷的接触展现出了大多数人绝不会联想到他身上的狡黠。无论密特拉是否在意，赫拉德正计划确保英国对法国的枷锁在短期内绝不会有所松动……"
 POD_investigate.desc.790173: "Muhammad ibn Farouk is the efficient, if unremarkable, Lasombra Sultan of Silves that has ascended to this role after the death of his [Glossary('Sire','game_concept_Sire_desc')] in the Christian raid on the city in 1151. Or so it seems.\nIn truth, 'Muhammad' is a Baali that has been following the Almohad invasion and took notice of the Ashirra weakening situation for a while now. Sensing an opportunity, he and his followers slew the former Sultan of Silves during the chaos of the Christian raid and masqueraded as the erstwhile Prince's childe ever since.\nIntending on turning Silves, then Andalusia, into a Baali stronghold, 'Muhammad' is spreading his tendrils throughout the peninsula. He is betraying key [Glossary('Ashirra','game_concept_ashirra_desc')] intelligence to the Christians to hasten their fall into despair (and, from here, corruption). On the Christian side, he is the shadowy patron of several heretical cults, including the infamous Apostles of the Third Caine, using them as cat's-paws to divert the attention of the inquisitive Ambrosio Luis Moncada from his affairs. His last area of influence is Lisbon, where he is keeping the city's Cainites weak and divided until the time to claim the area for his demonic masters is right."
 POD_investigate.desc.790319: "Alchias ruled the strategically important city of Syracuse in ancient times. So important was his city, that it hosted the Toreador Antediluvian Arikel and the Ventrue methuselah known as Artemis Orthia.\nIn 265 BCE, when the Carthaginians attacked, a Brujah envoy descendant of Dominic visited the Prince and demanded that he should bow to Carthaginian sovereignty. Alchias flew into a rage and decapitated the messenger. After advising with both Arikel and Artemis, Alchias pleaded with general Lysander to go among his Roman allies to marshal soldiers, helping to initiate the First Punic War.\nIn the following battles and other wars to come, Alchias personally took to the battlefield to protect his city, and through his diplomatic efforts brought many other clans into the fold. During the final siege that destroyed Carthage, however, Alchias was hurt so badly that he succumbed into a $pod_torpor$ from which he hasn't awakened ever since."
 POD_investigate.desc.790977: "格利康于12世纪的埃及接受了[Glossary('尊长','game_concept_Sire_desc')]，那时埃及已历经四个世纪的外族入侵和阿刹迈的侵扰。围绕埃及的战争愈演愈烈，最终连吸血鬼们也互相厮杀。凡人格利康恰巧闯入了一场这样的战斗，对战双方是一名貌似马穆鲁克的入侵者与一位埃及圣人。\n格利康对这位祭司出手相助。尽管在人类看来这场干预似乎微不足道，但在使用远古力量的吸血鬼战斗中，他的出现刚好分散了阿刹迈的注意力，为赛特之子祭司争取到了足够的时间斩下敌人的头颅。这位圣人对格利康的援助表示感谢，并洞察了这位年轻人虔诚的灵魂。于是，这位祭司将他收为门徒，向他讲述了赛特与其兄奥西里斯之间的仇恨。随后，格利康被[Glossary('尊长','game_concept_Sire_desc')]赛特之子的战士阶级，并凭借其出众的技艺和忠诚赢得了火之宫廷与尼芙璐的赏识，自此一直为他们效力。"
 POD_investigate.desc.790993: "Amaravati is an accomplished sadhu and learned in the ways of the Mayaparisatya, the true Path of Paradox. Leaving her homeland behind and traveling to the west, she became disgusted with the excesses of the Sybarites and the tenets of the false Path of Paradox, Amaravati remained a vehement follower of the true doctrine of Mayaparisatya, willing to teach those Ravnos who sought to learn more about their heritage. She was also a contemporary of the Phaedymite Ravnos Marcia Felicia Licina and taught her much of the customs of the Indian main branch of the $pod_clan$.\nShe is to this night still disciplining adherents of the false Path of Paradox to accept the true Path. She has become quite sought after as a teacher but can be difficult to locate for prospective students, as her wanderlust is also quite famous among her brethren.\n\nFuture fate in Canon\nAmaravati will fall into $pod_torpor$ and reawaken in the modern age in Irak, where she will resume her teachings. Like many of her $pod_clan$, she will disappear during the Week of Nightmares, never to be seen again."
 POD_investigate.desc.605116: "无人重视安特卫普的迷失之子，法兰西的黑暗领主们仅仅视其为稀奇玩意。但这位孩童般的血族可不像看上去如此简单。\n因为纯洁与天真，他在孩童时就被[Glossary('初拥','game_concept_Embrace_desc')]，末卡维的氏族诅咒使他获得了感应他者弱点的能力。借能力得来的知识，他使[Glossary('尊长','game_concept_Sire_desc')]沦为工具并利用他巩固权位。身为操纵人心的大师，朗方用体面与智慧的伪装隐藏他反覆无常与腐坏的本性。然而，只有极少数人切真地认识到迷失之子的堕落程度，更没人疑心到他最近改宗至魔鬼之道……\n其在原作中的未来命运\n在未来的夜晚，这位安特卫普亲王将以恶劣者朗方为人所知，他的宫廷将被裁判所处以火刑。然而直到1832年他才会真正失去治下城市，此后消失在历史中。"
 POD_investigate.desc.790900: "伊南娜生于尼尼微，并成为了伪装成城市之神的吸血鬼的情人和子嗣。当安吉瓦来到这座城市时，他对末卡维的血祭感到厌恶，伊南娜的尊长与他为敌。在冲突中，神庙被摧毁，只有伊南娜幸存下来。她对失去情人的愤怒和悲伤使她发誓要向那个给她的城市带来痛苦的陌生人复仇。\n后来，她作为罗马亲王卡米拉对抗迦太基的支持者之一再次露面。她战斗勇猛，从永恒元老院那里获得了几项特权，包括吸榨敌人的权利。伊南娜居住在阿奎马蒂亚科伦，并利用自己的影响力远征帝国边境之外来寻找安吉瓦。罗马人在条顿堡森林战役中战败后，决定放弃日耳曼尼亚省。伊南娜被迫前往罗马向永恒元老院求情，却发现自己卷入了罗马的政局当中。公元83年，伊南娜率领一支新的远征军攻占了陶努斯。这次的袭击让安吉瓦大吃一惊，从而被迫向北逃亡。当安吉瓦在110年与阿勒曼尼人一起返回时，伊南娜再次与他再次交战。安吉瓦重创了这位末卡维，迫使她陷入了$pod_torpor$。\n伊南娜在1160年再次苏醒，现在正在慢慢积蓄力量。\n\n其在原作中的未来命运\n伊南娜将在1520年的一场艰苦战斗中差点杀死安吉瓦，但没有成功。之后她将暂时成为法兰克福亲王，但再也找不到她的克星了。"
 POD_investigate.desc.792265: "米尔科于 835 年在冰岛出生，是维京人和织工的儿子。他在一个名叫第尔格的吸血鬼统治和保护的小村庄里长大。他很快成为第尔格的得意弟子，并获得了$pod_Embrace$。米尔科宁在尊长兼导师的指导下并经过多年的学习后，便离开村庄然后流浪于欧洲各地。无论战争在哪里爆发，米尔科宁都会把自己置身于鲜血和荣耀最浓烈的战场之中。偶尔，他对战斗的渴望会让他陷入长时间的$pod_torpor$，但他每次都能重振旗鼓，随时准备迎接新的挑战。\n其在原作中的未来命运\n米尔科宁将会成为秘盟名义上的支持者，并鄙视魔宴的弑尊行为。米尔科一直渴望更多的荣耀，有人曾向他推荐辅政官的职位，但他婉言拒绝了，转而流浪到新世界，参与秘盟和魔宴之间的战争。最后，米尔科宁搬到了西海岸，他将成为鬼人入侵时最顽固的敌人之一。这并不是因为他与鬼人之间存在什么分歧，仅仅是因为他觉得与他们作战非常有趣。"
 POD_investigate.desc.790401: "[Glossary('Embraced','game_concept_Embrace_desc')] into the materialistic Hall of Jörmungandr, Valdis intends to revitalize the spiritual aspect of the Norse Setites. A striking figure with red hair and half her face painted corpse-blue in honor of the goddess Hel, her personal charisma greatly exceeds her [Glossary('Sire','game_concept_Sire_desc')], Arnulf Jörmungandrsson.\nHer own cult, the Children of Loki, revere Loki as a mask of Set, emphasizing his infiltration of the Aeons, while spreading the seeds of chaos and calling upon chthonic powers to bring about Ragnarok. Valdis claims that she has rediscovered aspects of a cult that had been to Scandinavia long before Arnulf's arrival. Her movement has earned her the disfavour of her own [Glossary('Sire','game_concept_Sire_desc')] but this hasn't stopped her efforts to spread it so far."
 POD_investigate.desc.790362: "A native of Prague, Ardan was apprenticed to a local alchemist at a young age. Discovering a latent talent for magic, Ardan journeyed to the Order of Hermes and choose to become a member of the House of Tremere. He was well on his way to mastery when the summon to Ceoris came.\nFound capable and loyal enough, Ardan was [Glossary('Embraced','game_concept_Embrace_desc')] by the renowned Celestyn and ordered to act as a supply master of sorts between Prague and Transylvania, in case Ceoris' position would be compromised. Honored to have been chosen and offered true immortality, Ardan is doing his best to please his new masters.\n\nFuture fate in Canon\nArdan will become the byword for loyalty and efficiency in the Tremere $pod_clan$. He will be entrusted with keeping Ceoris safe after the departure of the Council and will do so admirably, weathering the Tzimisce, Hermetics and even the Nazi and Communist regimes. Truly earning the respect of the Council, Ardan will finally be given the guardianship of the Tremere's greatest treasure."
 POD_investigate.desc.790801: "In life, Pakourianis was a skilled painter who came to the attention of Michael since his adolescence. After being [Glossary('Embraced','game_concept_Embrace_desc')], Pakourianis acted as his sire's muse of paintings.\nPakourianis was deeply influenced by his sire, believing him to be a literal manifestation of the archangel. When the methuselah became more and more withdrawn, Pakourianis feared that he would leave without him and became obsessed with flying. Most often, he flung himself frustrated into the ocean.\nPakourianis survived the sack of Constantinople in 1204 CE, but it took a toll on his sanity. He continued his quest to learn how to fly, striving to follow Michael into heaven. His meditations tempered his anguish, but the flight of birds, Tremere gargoyles and other winged things fascinated him. Together with his broodmate Paul Bathalos, Pakourianis founded the Nephilim, also known as the Children of Michael.\n\nFuture fate in Canon\nIn the modern nights, Pakourianis will rule over Johannesburg, in South Africa, hoping to restore the Dream in the city, create a new utopia for Kindred, and a possible template for further domains. In a ironic twist however, his grand view will be opposed by the Cainite Heresy, the very same that precipitated Michael's fall so long ago."
 POD_investigate.desc.790159: "科林斯亲王对凡人事务保持超然态度，对干涉凡人的行为深恶痛绝，认为这有辱该隐之子的身份。相反，佩里安德更希望 $pod_cainites$ 能够抛弃他们在受 $pod_Embrace$ 之前所熟知的世俗羁绊，转而专注于更高层次的追求，例如许多布鲁赫长老所寻求的吸血鬼乌托邦。为此，佩里安德对新拉科尼亚表现出了浓厚的兴趣，并希望其能成为科林斯效仿的典范。"
 POD_investigate.desc.792288: "A creature with feral eyes and a flesh the texture of smoked heat, Ravik is often mistaken for a Nosferatu but his prowess in battle and usage of [Glossary('Disciplines','game_concept_discipline_desc')] quickly correct any potential mistakes. Ravik moves with a sizable pack of Gangrel and his goal seems to be the protection of his region from werewolves and any other outsiders he identifies as threats. As far as politics are concerned, Ravik is content to let Princes be Princes, as long as he can keep doing his own form of 'justice'. The reason of such stubbornness is unknown but often rumored to be tied to his deformities.\n\nFuture fate in Canon\nMoving to Norway, Ravik will partner with Prince Agnethe Sannrste of Oslo to become a powerful force in the region. Refusing any titles or honorifics, he will continue administering his feral justice following a pattern only he understands."
 POD_investigate.desc.791117: "蒲寿庚统领着一个日薄西山的皇朝，而他心知肚明。\n玄武皇朝素以内部倾轧闻名，又因游牧出身备受中原皇朝讥讽。如今随着成吉思汗的征服，[Glossary('安答','podgloss.anda')]冈格罗带来的压力骤增。越来越多的年轻[Glossary('万鬼','game_concept_kuei_jin_desc')]陷入绝望，更甚者开始崇拜[UmbraGlossary('hell_of_spiked_chains')]的[Glossary('阎魔王','podgloss.yamaking')]多科尔汗。南方同样不会施以援手——承认这种腐化存在将令玄武皇朝声誉扫地。\n蒲寿庚明白败局已定，[Glossary('第五纪元','game_concept_fifth_age_desc')]的黑暗洪流将至，而玄武皇朝终将湮灭其中。眼下除了祈求奇迹、备战至暗时刻，他已别无选择。\n\n其在原作中的未来命运\n玄武廷的腐化将蔓延至仅存少数真正的[Glossary('万鬼','game_concept_kuei_jin_desc')]。南逃的幸存者警示其他皇朝后，各方联军将北进肃清其全部痕迹，最终将所有记载其耻辱存在的文献尽数焚毁。"
 POD_investigate.desc.791099: "萨坎是一个沙漠部族首领的女儿，原本即将被迫接受一场没有爱情的婚姻，但阿卜杜勒·哈克心血来潮将她掳走。这位年迈的[Glossary('阿什拉派','game_concept_ashirra_desc')]对这位美丽的女子生了爱意，几乎未曾考虑后果便[Glossary('初拥','game_concept_Embrace_desc')]了她。对于他而言，此事并未带来任何后果。他在萨坎的生命中稍纵即逝，几乎转瞬即逝般消失，只留下她独自生存。幸运的是，作为首领之女，萨坎并非毫无依仗。\n她凭借美貌和温柔的举止从同辈中获得了基础的阿什拉派教育，并借此结交了一些盟友。萨坎知道关于她[Glossary('尊长','game_concept_Sire_desc')]的真相，这一真相若公之于众，足以让她在也门的该隐之子中赢得诸多好处。然而，她拒绝出卖他。尽管他突然离去，但他曾对她非常仁慈，将她从一场悲惨的命运中解救出来。萨坎还不愿为了权力而忘却她对他的感激之情。\n至少，目前如此。"
 POD_investigate.desc.790940: "Alexus Simocatta was a scholar in Constantinople who also acted as an illustrator and architect. Although his position weakened during the Iconoclast controversy, he was an influential artist and worked on a myriad of projects. During one of the works he supervised, a collapsed scaffolding led to a long fall onto a stone floor, which nearly resulted in his death.\nSimocatta was saved through the blood of the Keeper of the Faith, who believed him to be too useful to die. Though he worked in the Library of the Forgotten, he never felt quite at home in the underground crypts. As a result, he was retained to act as an agent of both his [Glossary('Sire','game_concept_Sire_desc')] and the Dracon. He was sent into the Holy Land following the upheaval of the crusades in order to alert his sire of recent developments, cultivating a network of spies and informants that stretched over the whole Middle East.\nThis assignment saved him from the massacres of the Fourth Crusade and the sacking of Constantinople.\n\nFuture fate in Canon\nHe will continue to correspond with his sire for a long time, until his assassination by an unknown Assamite in 1481."
 POD_investigate.desc.790962: "After her $pod_Embrace$, Shabah was abandoned by her [Glossary('Sire','game_concept_Sire_desc')] in the North African mountains, testing if she had the potential he had seen in her. After failing to contact her family (who believed her to be an evil ghost), she eventually pursued him and was brought to Alamut for formal recognition.\nShe was sent into the West to learn the ways of the Franj. During her travels, she met Belisarius, a Ventrue from Constantinople, and the two became lovers and married, sharing a Blood Oath with each other until Shabah was called back to Alamut. By that time, her knowledge of the West and the disguise provided by her gender (as others believed all Assamites to be male) have made her quite a proficient assassin, to an extent she even killed Emperor John II Komnenos in 1143, oblivious to the fact that he was one of Belisarius' protegés.\nDuring the rule of Saladin, she was sent to Constantinople, acting as an envoy to Michael to gain his favor and alliance in Alamut's struggle against the various hostile factions (supernatural as well as mortal) within the Middle East. There she met her old lover Belisarius again and reconciled with him, while acting as a professional assassin for the city's various Cainites.\nAfter the fall of Constantinople, she and Belisarius left the city for good and wandered until they met an orphaned neonate, Anadja. Sensing potential in the young woman, they decided to adopt her and start preparing her for the bright destiny they see in her.\n\nFuture fate in Canon\nShabah will prepare Anadja well but won't see the results of her teachings. The chaos of the Anarch Revolt will be her end."
 POD_investigate.desc.790959: "Born into a tribe of nomads in early 9th century Arabia, Habiba was the only child of the tribe's butcher and was quickly taught by her father to think and act for herself. Soon gaining a reputation as the fierce lioness of the tribe, her destiny was cut short when she had to take the life of one of her suitors who used physical abuse to try to 'tame' her. She was saved from her tribe's retribution by a Banu Haqim warrior who has been monitoring her for a while.\nHabiba took to her training as an undead assassin with ease and confidence. After serving her apprenticeship, she was placed in Jerusalem, a position of honor for any young Assamite. Since then, she has not disappointed, fulfilling any assignments sent by Alamut with ruthless efficiency. Few Banu Haqim know that Habiba has developed a taste for $pod_diablerie$ during her tenure in the Levant however, and the secretive Web of Knives has been approaching her with this information in mind to entice her into joining their ranks.\n\nFuture fate in Canon\nHabiba will become one of the all-time great assassins of the Banu Haqim. Succumbing to her taste for diablerie however, she will shed the remnants of her mortal Muslim faith and truly embrace the teachings of the Web of Knives in the years to come."
 POD_investigate.desc.791125: "在亚洲的传说中，[Glossary('万仙','game_concept_kuei_jin_desc')]曾是中原的万千仙神。他们最初保护中原免遭[Glossary('阎魔王','podgloss.yamaking')]和其他威胁的蹂躏。他们是由玉皇大帝选中的凡人，通过了各种考验以获得以气为生的能力，从而拥有了强大的力量。在凡间的日子里，万仙不断学习并积累力量，直到他们开悟以飞升天庭。之后，玄龙和朱雀会从凡人中任命一位接替者。\n虽然[Glossary('万仙','game_concept_kuei_jin_desc')]骁勇善战，但他们并非完全无从腐化。传说中，摩诃那伽·毗波落腻成为了第一个[akuma|E]。在[Glossary('阎魔王','podgloss.yamaking')]的影响下，他最终学会了如何吸收其他生命体的气为己用。随着时间的推移，追随他的万仙变成了暴君，通过剥削凡人臣民并吸干他们的气来互相征伐。精心策划的阴谋导致了耻辱之战的发生，凶民自相残杀，而万仙则占领了他们的圣地以哺育自己。他们扭曲了创造新任万仙的考研，使卑鄙但狡诈强大的凡人得以违背这些测试的本质来获得永生。据说他们的后代静海试图阻止父母的过激行为，结果遭到屠杀。\n于是，万仙开始堕落，逐渐成为[Glossary('万鬼','game_concept_kuei_jin_desc')]，许多人将这种堕落归咎于摩诃那伽·毗波落腻。"
 POD_investigate.desc.792765: "Gulfora is one of the few remaining succubi on Earth. As far as she is concerned, she has existed nearly as long as the earth itself. She claims she came into being on the fourth day of Creation, when God created the beings of the sea and air. However succubi (like all demons) are great liars, and anyone who believes their stories would do well to never trust a sand merchant in the Sahara.\nGulfora's history is a long and bloody one. The Sumerians were the first people to write about her, and their cuneiform warnings about her powers date back to 2300 BCE. Other civilizations, from the Egyptians to the Chinese, have feared her, and rightly so. There is probably no vampire who can match her murder for murder. People of the Western traditions believe she was created along with the other angels, and fell from grace. People of Eastern traditions tend to consider her one of the malevolent forces of nature.\nIn the end, Gulfora's true goals are only known to herself but she has been cornered into serving greater demons from time to time. However, those that end up binding her always seem to meet with some unfortunate accident shortly after...\nFuture fate in Canon\nGulfora's depredations will never truly end. She will follow where pain and misery tread until settling in Chicago, intrigued by the presence of other powerful creatures in the area."
 POD_investigate.desc.792692: "Kazimier Piast, son of Jagiello, is a warrior born, never learning mercy or temperance. When he set his eyes on the Polish werewolves' crown, none hesitated to get out of his way but many claimed him too young to rule. But Kazimier is a Shadow Lord and thus, he hatched a devious plan.\nStealing the crown jewels of the Polish werewolves, he planted the rumors of Teutonic knights being the true culprits and rode in town to announce that he would chase the thieves and bring back their treasure. To his surprise however, the jewels were stolen from him while he was away. Three Fenrir, accursed German wolves followers of the Teutons, had planned to reveal Kazimier's treachery to Poland. But Kazimier is a Shadow Lord and thus, he jumped into battle.\nUsing strength and cunning both, the would be king triumphed over his foes and came back to his people with the jewels and no one left alive to tell of his deception. They cheered for their hero and made him King.\nAnd Kazimier is a Shadow Lord and thus, he rules."
 POD_investigate.desc.792283: "An unremarkable vampire by most accounts, Eugenio Vicente de Olisipo's main asset to survive the cutthroat politics of the night seems to be his sheer stubbornness. Neither the brightest or most courageous of the accursed race of Caine, Eugenio has dealt with many of his troubles by simply pushing through until they give up or disappear.\nWhile he is mostly a figure of amusement for the much older Cainites of Iberia, Eugenio's spite might carry him farther than they think.\n\nFuture fate in Canon\nThe chaos of the Reconquista and the Anarch Revolt will redraw the Iberian's board and Eugenio will emerge as the Camarilla Prince of Lisbon thanks to it. Isolated against perhaps the most powerful Sabbat presence in the old world, Ambrosio Luis Moncada, he will still manage to hold on to Lisbon for several centuries until being finally killed... and coming back as a wraith to continue ruling his princedom from the shadows. There are no limits to where stubbornness can get you it seems."
 POD_investigate.desc.505149: "Boukephos was a Greek tyrant and philosopher active in the Aegean Sea before the rise of Alexander. After his $pod_Embrace$, he stayed for a while in his homeland before becoming the face of $pod_clan$ Lasombra in the powerful Eternal Senate of Rome. Like his [Glossary('Sire','game_concept_Sire_desc')], Boukephos is a notorious wanderer, often absent from politics while educating his childer and grandchilder.\nHe has a reputation of keeping current with the times much more than your average elder, keeping a keen interest in mortal matters. This is what pushed him to $pod_Embrace$ Richard the Lionheart's infamous brother, Geoffrey of Brittany. Content with his childe's involvement in precipitating the Cainite Heresy's fall, Boukephos has now come back to Sicily where he tries to deepen his already impressive mastery of Obtenebration.\nAs one of the most active childer of Lasombra and one of the only three members of his clan to master the dreadful power of Tchernabog, Boukephos is quite the force to be reckoned with.\n\nFuture fate in Canon\nBoukephos will join the Sabbat, keeping in his tradition to follow the latest trends. He will become a mentor figure to many promising young Lasombra, such as Talley, before being finally destroyed during the Sabbat-Camarilla conflict on the East Coast of the United States in 1999."
 POD_investigate.desc.790711: "One of the main Toreador powers in Scotland's Toreador politics, Lady Besse is the spitting image of one would expect of a Toreador Prince. Cultured, refined and attentive while her subtle look of superiority reminds you of the favor she gives you by listening to your petty problems. While Scotland isn't as renowned as a cultural center as others, Besse sees this as an opportunity. While this fledgling nation starts to create its own identity, she fully intends to be the power behind it, making Scotland the rival of England or France in due times.\n\nFuture fate in Canon\nAfter Robert's disappearance, Besse will become Edinburgh's Prince and Scotland's foremost vampire. Edinburgh will flourish for a time but her hold to power will always be shaky at best. Conflicts with Mithras and the Dunsirn family will weaken her further until Roger de Camden's final blow in 2012, taking the city from her in Mithras' name."
 POD_investigate.desc.791245: "身为声誉稳固的布鲁赫长者，迪德里克·雷彻瓦迪根的目标并不令人意外——他企图在自己的故乡弗兰德斯重建一座新的迦太基。虽然许多普罗米修斯派支持他的努力，但更多的狂徒派却对这位守旧老迈的长者统治心生不满，并不断提醒他：迦太基曾是一个由人民领导、为人民而存在的共和体制。这使得迪德里克的选择至今始终受限——他勉强维持着脆弱的和平，却逐渐被附近的梵卓边缘化，而后者正冷眼旁观这位布鲁赫的失败，暗中讥笑。\n迪德里克正日益走向绝望——而陷入绝望的布鲁赫，往往不是明智的决策者……\n其在原作中的未来命运\n迪德里克将迎来一位出人意料的访客——一名来自海外十字军领地、神秘而充满诱惑力的女子莱拉。她向他承诺，自己能解决他所有困境，并揭示迦太基真正的意义。\n至1244年，迪德里克失踪，使萨莉安娜得以接管他的旧领地。"
 POD_investigate.desc.790482: "沙巴卡出生于努比亚帝国的首都纳帕塔，距基督诞生已有1400年。他是当地神王的皇家猎人，由于他的身手不凡的他被神王转化成了血仆，让他追踪各种猎物，以满足主人的狩猎欲望。\n公元前1290年，努比亚帝国被赛特信徒征服，其前$pod_cainite$领主被赶入沙漠。沙巴卡在权力更迭中受了重伤，但通过某个冈罗格的[Glossary('初拥','game_concept_Embrace_desc')]获救。在他的[Glossary('尊长','game_concept_Sire_desc')]告诉他关于他曾经侍奉的“活神”的真相后，沙巴卡便独自漫游到撒哈拉沙漠深处，在那里他与危险的生物战斗，也偶尔猎杀赛特之子。\n正是在此期间，沙巴卡感受到了伊斯兰教的力量，并为之震撼，从沙漠中走出来后便再次旅行，希望能实现自己的目的。公元10世纪，他来到安达卢西亚，与科尔多瓦苏丹希勒尔·马萨里频繁交谈，最终选择皈依了伊斯兰教。公元1005年，这位努比亚人凭借他的年龄、辈分和技能，激励着他的其他族人也皈依了伊斯兰教。\n以他为榜样的人被称作泰法冈格罗，并从兽性掠夺者变成了学者战士。当这场运动蔓延时，沙巴卡仍留在安达卢西亚，因为他无意成为泰法冈格罗的领导者。不过，沙巴卡很高兴自己的行为激励了更年轻的该隐之子，但他坚信每个吸血鬼都必须独自面对真主。"
 POD_investigate.desc.790284: "梵卓氏族自豪地宣称，这位吸血鬼战斗少女确确实实是他们始祖的挚爱，并且是他第一次$pod_Embrace$的对象。\n第二城衰落后，她流落于伯罗奔尼撒。在那里，她遇到了斯巴达的凡人哲学家吕库古。他成功地搭讪了她，谈论他对斯巴达人梦想的愿景。她吸取了同族梅敦被毁灭的教训，预见到了吕库古梦想中的潜在威胁（和机遇）。她决定采取行动，像许多后来的梵卓所效仿的一样：与其试图反对或支配凡人机构日益增长的力量，不如与之共进，加入斯巴达的振兴，影响历史的进程。\n为此，她取了一个至今仍作为斯巴达守护神被世人所知的名字。不久，其他梵卓也来到伯罗奔尼撒并服从她的统治。在伯罗奔尼撒战争中，阿尔忒弥斯跟随她的子民对抗雅典，但斯巴达获胜后的衰落令她大失所望。\n公元前4世纪，阿尔忒弥斯和她的后嗣吕山德来到意大利，她在由阿尔基亚斯亲王统治的锡拉库萨定居。然而，在受到迦太基布鲁赫的威胁后不久，末卡维氏族的亲王唤醒了她，以便策划罗马参与即将到来的战争。她和她的后嗣以及阿尔基亚斯一起，不断敦促卡米拉摧毁迦太基。阿尔忒弥斯亲自率军首次突袭该城，但在战斗初期被一群血狂的布鲁赫撕成了碎片。\n\n其在原作中未来的命运\n无人知晓的是，欧西雅显然在布匿战争中幸存了下来，她实际上陷入了$pod_torpor$，并被带到一个安全的地方。一个名为破碎长矛的邪教围绕她的形象而创立，但她的安息之地要在许多世纪后才会被发现。"
 POD_investigate.desc.791930: "A Genoese [Glossary('Embraced','game_concept_Embrace_desc')] for her knowledge and sharp mind, Julianna took with great zeal to uncovering the true mysteries of death. She traveled with her [Glossary('Sire','game_concept_Sire_desc')] for a time before going on her own with her trusted friend and ghoul, Ricardo Rinaldi. Her sharp wit and sharper tongue often gets her into trouble, but she manages to to stay on the good side of (most) of the $pod_cainites$ she meet.\nA zealous follower of Lazarus' interpretation of Cappadocius' folly, Julianna is an advocate for closer ties with the Tremere as these fellow outcast scholars could prove a great help in furthering their mutual knowledge. To this end, she has started being the go between the two factions, bearing messages between Egypt and Transylvania as often as she can."
 POD_investigate.desc.791182: "被古鲁希授予一片相当广阔领地的马加吉，尊陀掌控着一群无法对他施加影响的年轻莱本。尊陀恶名昭著，习惯于在他的吸血鬼臣属和当地凡人面前展示暴力和危险的力量。权力的不平衡使他能够肆意满足自己最扭曲的欲望。尽管他极不受欢迎，但至今没有人鼓起勇气反抗他。\n\n其在原作中的未来命运\n某个夜晚，尊陀将在自己的领地内当着臣民的面被一头鬃毛浓密的狮子肢解。正如尊陀昔日领地中的人们所言，这样的事情很少是偶然发生的。"
 POD_investigate.desc.791375: "Genevieve is a young Aesthete known as the mistress of arts in Strasbourg, and the one secretly in charge of the Cathedral's construction. The most troubling rumor about her however is her apparent parentage with the faerie folk, which puts her in a strange position with Marconius, the Prince of Strasbourg and infamous sometimes ally and sometimes foe of the Fae. So far they managed to work together, Genevieve seemingly more preoccupied by her search for [golconda|E] than any political matters.\n\nFuture fate in Canon\nThis will change as Genevieve's testimony will be instrumental in Marconius' fall in the late 13th century. She will then transition into becoming one of the most respected art critics worldwide and headmistress of the greatest Toreador art school. Her accomplishments will be rewarded with a prestigious [primogen|E] position in Paris itself."
 POD_investigate.desc.790819: "Claiming to be the famous Holy Roman Emperor and secretly backed by Julia Antasia and Angiwar, Friedrich Barbarossa tells that he had been a ghoul in Antasia's service for a long time before being [Glossary('Embraced','game_concept_Embrace_desc')] at Ikonion and then leaving his [Glossary('Sire','game_concept_Sire_desc')] to wander the world.\nAntasia herself never confirmed nor denied her implication however, leaving the matter unclear.\n\nFuture fate in Canon\nBarbarossa will stay mostly hidden to $pod_cainite$ society until the Anarch Revolt where he will embrace the Camarilla's cause with great zeal, earning him the position of Archon. Reestablishing order in a beleaguered Frankfurt, Barbarossa will assume Princedom over this city for several centuries where he will try his best to push towards the Antasian ideals of humanism, equality of all vampires and an absolute ban on killing mortals. This will create an unending feud with the Prussian vampires led by the ruthless Gustav Breidenstein who will at several times attack his domain. Barbarossa's ideals will end making him a pariah of the more feudalistic Camarilla and numerous other Princes will openly or secretly start to support the Prussian side.\nThe war will be going on for centuries behind the mortal's own squabbles until Barbarossa's ultimate defeat in 1998, leaving Breidenstein's puppet, Vinzenz von Stalburg, as sole Prince of Frankfurt."
 POD_investigate.desc.791470: "An oddity among the scholarly minded Tremere, Antal Garaboncias mainly sees the workings of thaumaturgy as a way to achieve dominance over the battlefield. As such, he is perhaps the most experienced veteran among the magus in the war against the Tzimisce, an honor that has served little to improve his standing in the cutthroat politics of the Tremere. As such, officially, Antal Garaboncias is simply a teacher of Via Ignis in the chantry of Bistritz. While this role was seen as a way to ensure that he never \"rose above his station\", Antal has grown to like it more and more, earning a reputation as a fair (if sometimes strict) and competent teacher for young apprentices. In truth, Antal is haunted by the vision of every apprentice he had to send to their doom in the bloody wars against the Tzimisce. While he knows he will never atone for what he had to do, he would at least like to never do it again.\nTo the surprise of most Tremere, Antal has recently asked for his official resignation as a warmaster, hoping to fully transition into this new role. This request has been accepted on one condition: helping Jervais' punitive expedition against the heretical Telyavel succeed.\n\nFuture fate in Canon\nDuring these events, Antal will once again prove his mastery of war, being instrumental in the final battle against the Ferals of Livonia. As agreed, he will be rewarded with a permanent posting to Brandeburg, finally far from any battlefield.\nThe nightmares and the guilt will never truly stop however, fueled by the new names added to his list of losses after the war against the Telyavelic."
 POD_investigate.desc.790792: "阴郁而骄傲的埃尔兰德是为数不多的非冈格罗和非英灵战士的亲王之一，早在基督教传入之前，他便在斯堪的纳维亚立足。因此，他深知在敌对环境中维持权力所需的斗争。南方梵卓的到来让埃尔兰德感到颇为烦恼。虽然他们确实减轻了他独自面对英灵战士的巨大压力，但他们毕竟是梵卓。而任何骄傲的布鲁赫都明白，梵卓的信任无法长远存在。\n因此，目前埃尔兰德忧虑地注视着大陆，决心再次保护他的岛屿。无论他需要达成怎样的奇异联盟……"
 POD_investigate.desc.605125: "根据其氏族的传说，比洛博格被[Glossary('上古耆宿','game_concept_antediluvian_desc')]$pod_Embraced$是因为他是这位存在见过最狂野的凡人，它好奇“白神”在被初拥后的变化。已知的是，他成为了一个强大的库都，掌控他领域内的水域——他可以控制沼泽生物、雾气，尤其是冬季肆虐大地的皑皑白雪。\n比洛博格是行走于物质界的最强大的棘秘魑之一，但他对氏族的政治持冷漠态度。像沃拉克一样，他也印证了上古耆宿尊长的担忧，即其后代会沉迷于完全深奥的追求中，因为他们都退隐到了各自的领域中，几乎互不来往。\n比洛博格标志性的白肤会成片脱落，随风飘散到他的领地，将里面的一切都“标记”为他的财产，从而与受害者建立起神秘的联系。有些人声称他创造了一个叫哈茲的回魂系，专门为满足他的需求而培育。其他传闻称他驾着一艘魔法小艇四处航行，身体看起来像陷入瘟疫的尸体。\n\n其在原作中的未来命运\n当条顿骑士团入侵东欧时，据说其中一个哈茲回魂会背叛他的主人，引导猎魔人前往比洛博格在平斯克沼泽的藏身之地。经过这次争斗，虚弱的比洛博格将在大反乱初期被被卢戈·破血者[Glossary('吸榨','game_concept_diablerie_desc')]，对当地的棘秘魑势力造成沉重打击。"
 POD_investigate.desc.790789: "Paul, though not a great sculptor in comparison to masters, was still sufficiently proficient to warrant attention and it was love at first sight for Michael. It was not his skill, however, that brought about his Embrace, but a longing in Michael that harkened back to his past. He believed that Paul was a reincarnation of Ma-ri – his beloved ghoul from Ebla – based on some startling but coincidental similarities in his general build, effeminate manner and soft beauty.\nFearing that their relationship might hamper Michael's \"ascendance\", Paul sacrificed his treasured beauty to preserve the divinity he believed Michael the Patriarch held within, denying them both a love that neither realized was predicated upon a fantasy.\nNow a hideous monstrosity and with Michael gone, he leads his fellow grieving Toreador in melancholic worship of the Archangel, perceived by these deluded devotees as a celestial martyr who gave up his earthly seat in exchange for the glories of Heaven and paved the way for them to follow."
 POD_investigate.desc.505106: "Abetorius was first sent to Greece in the 12th century by none other than Tremere himself. Upon arriving in the region, he was initially based in Constantinople under the tentative patronage of the Michaelite Toreador. His official mission was to establish diplomatic ties while his true assignment was to hunt down a Tremere runaway, Theresa Kymena, and investigate the rumors of a Salubri hiding in the city. With the 4th Crusade shattering Greece, Abetorius has thrown his lot with Anna Comnena, hoping to gain a strong ally once he helps her reclaim the City of the World's Desire.\n\nFuture fate in Canon\nAbetorius will expand the clan's interests beyond the Byzantine Empire into Asia over the following several centuries, and will be elevated to the Council of Seven. He and his followers will be forced to fall back to Constantinople during the Anarch Revolt, when Assamite Anarchs will destroy several chantries and slay their occupants. Despite having essentially failed in his mission, he will remain on the Council of Seven.\nHe later will participate in the Tremere ritual that laid the blood curse on the Assamites following the Treaty of Tyre. He will finally be slain in 2008 during the Second Inquisition's attack on Vienna."
 POD_investigate.desc.790746: "叶夫根尼亚是一位典型的俄罗斯贵妇，似乎在俄罗斯贵族的边缘徘徊了很长时间。她像真正的古代贵族一样管理着她的领地，举办宴会，以皇家口吻自称“我们”，并俨然高居于众人之上。与许多自认为牢牢掌握领地的亲王一样，叶夫根尼亚拒绝承认对其统治的任何威胁。当敌人聚集在她的四周和身侧时，这位亲王依然在夜晚尽情舞蹈，自信贵族终将如其所愿地战胜一切。\n\n其在原作中的未来命运\n当十月革命席卷圣彼得堡时，叶夫根妮娅将经历一次非常突然（且痛苦）的觉醒。"
 POD_investigate.desc.791144: "In life, Yesira was Chinkhai's mother. In death, she is his sister, as Dobrul saw in her a fierce loyalty he could use. Chinkhai and her have been tasked with protecting Dobrul since their $pod_Embrace$, a task they have proven more than capable of handling.\nSince then however, Dobrul has fallen into $pod_torpor$ and Chinkhai has assumed leadership over the [Glossary('Anda','podgloss.anda')] in his stead, which left Yesira as the only warden of their progenitor's tomb. She still guards it to this night, helped by a a legion of gargantuan, hideously mutated ghouls animals.\n\nFuture fate in Canon\nSome accounts place Yesira's fall alongside her [Glossary('Sire','game_concept_Sire_desc')] during his climatic last battle in 1388 against the [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]. Others think she survived, and managed to hide Dobrul before his fall and is now waiting for his apocalyptic return..."
 POD_investigate.desc.792470: "In the bitter wars fought between Cainites backing the Crusades and those opposing them, Yasmin is a leading force among the [Glossary('Ashirra','game_concept_ashirra_desc')]. Her daring raids have managed to push back the backers of the First Crusade, Andrew of Normandy and Fabrizio Ulfila, from the Levant. This victory has earned her the respect of the Banu Haqim who were surprised by this attack and unable to mount a proper defense in these early Crusades nights.\nSince then however, they have started inquiring more into the past of this Malkavian heroine. It seems Yasmin had once been blood bound to Andrew himself, and the two were lovers before a brutal fallout. The Banu Haqim have concluded that Yasmin's ferocity stems for this old feud and not personal conviction as they once thought. They are still debating about what to do regarding this information, some being fearful that the old lovers might reconcile and stab them in the back in the future."
 POD_investigate.desc.791305: "Born in Armenia to a family of small traders, Aram was on a road for all his childhood, learning the craft of a merchant. His father, a pious man, taught the young boy much about Christianity and its early days in Armenia. Sadly for him, Aram was less than impressed with the outside world, growing cynical and seeing corruption everywhere, not the vaunted purity his father spoke of.\nAfter his old man's passing, Hovannes became a masterful swindler, using his mask of piety to fool naive priests into his web of deceit. One night, he caught the biggest prey of all, the devout Ravnos named Varsik was impressed by Aram's public piety and started talking to him about the \"true\" revelations of Caine and the vampires' place in God's plan. Aram couldn't care less, but played the game long enough to obtain the prize--immortality. Since then, Aram has been a \"loyal\" right hand man to Varsik, hiding his intentions and waiting for the moment to claim the power he so desires.\nHis recent plans to obtain control over Acre have been foiled by the surprisingly perceptive Etienne de Fauberge, but Aram accepted defeat begrudgingly. Time is on his side after all."
 POD_investigate.desc.790674: "Pietro originates from somewhere along the Mediterranean Sea. To hear him tell it, he grew up in the sea itself. Most know better than to question that claim, as the ancient vampire is sometimes prone to bouts of rage when it comes to remembering his youth. What is known is that Pietro was a soldier for the Roman army before his $pod_Embrace$, and he spent a considerable amount of time afterward sailing the Mediterranean with his [Glossary('Sire','game_concept_Sire_desc')].\nHis strangely likable personality and ability to lead any ragtag group made him a favorite among the younger vampires. He controls a large number of the Tal’Mahe’Ra’s asset and is fascinated by the recent arrival of Anadja into the sect. He has been her most loyal supporter since then, confident in Anadja's promised future as the one who will sit on Enoch's throne.\n\nFuture fate in Canon\nPietro won't be disappointed. He will successfully infiltrate the Sabbat and become perhaps the most influential leader in the Tal'Mahe'Ra. His bond with Anadja will never fade and they will rarely be seen without one another, even after Anadja's destiny comes to bear."
 POD_investigate.desc.790355: "An Ethiopian spearmaster and One of the early Elders of the Banu Haqim, it was during Mohara's time that other vampires discovered the value of the warrior caste as assassins and began to hire them, a practice that Mohara himself reviled. When his own childer were hired by a particular distrusted Lasombra, in disgust, he allegedly said--\"If you must sell yourselves so cheaply, the least you can do is send me a portion of the gold you will earn, that I may be compensated in some small measure for the curse of undeath that you whore for no good cause.\".\nMohara's childer took his sarcasm at face value and sent him a fifth of their earnings every year. Other warriors, seeing the Elder's own progeny doing this, began to curry favor with their own sires and superiors by tithing in a similar manner. This marked the beginning of tithing a fifth of the earnings of an assassination to one's elders."
 POD_investigate.desc.790275: "梵达多是一位古老而强大的梵卓$pod_clan$的$pod_cainite$。檀那婆血系声称他是他们的创始人，并且相信他们才是最初的梵卓。此外，据说梵达多还是“王者之道”的创立者。\n伦敦的强大吸血鬼密特拉也称梵达多为其[Glossary('尊长','game_concept_Sire_desc')]，这一事实使得许多人开始认为梵达多可能就是梵卓始祖的化名。然而，这一理论因已知的马尔萨斯的存在而受到质疑——马尔萨斯是第五代梵卓，也是梵达多的血裔之一。这也为密特拉的真正初始代数留下了一些疑问。\n最终，梵达多仍然是一个受到严密保护的谜团，与梵卓氏族一些最具争议的秘密紧密相连。"
 POD_investigate.desc.792608: "在世时，阿门是一名赛特的祭司，是一个通过贪污和敲诈积累了巨大财富和权力的腐败之人。因其声名显赫，在他死后被选为忌灵木乃伊之一。如今，阿门为巨蛇效力，担任斥候和刺客。他独特的体质确保猎物的遗骸几乎不会留下痕迹。尽管他力量强大且感知敏锐，但行动较为缓慢，常需要赛特更聪明的仆从引导他到达指定地点。\n阿门是赫赫提的宠爱之友，后者欣赏他相比其他更具阴谋心计的忌灵木乃伊的简单与直接。他们经常一起参与食人竞赛。"
 POD_investigate.desc.792527: "A warrior poet of the Fianna, Ossian is fair of mind and body. He is an exemplar of what the Garou should be. Thus he was chosen by a faerie curse, and thus he will be undone.\nOne night, Ossian led his pack against the Witch of Connaught herself and ended up the only (barely) survivor. Wandering half mad, he ventured into a Faerie glen where he was healed and tended for years by a Faerie Princess who felt in love with him. But Ossian was proud and refused her love, instead fleeing to return to the Garou.\nThey didn't welcome him, suspicious of his \"fae-touched\" manners and his long disappearance. Left alone, he started to despair and think again of the Faerie Princess.\nOssian is destined to venture into that faerie wood once again, and destined to die alone and lost hundreds of years from now. Deep in his heart, he knows this. But he will not go quietly. He intends to fight this magic and the infatuation that threatens his sanity. He would scour the fae from the Earth if it could save him. His people, the Fianna, want no part in his conflict. Ossian is searching for allies, warriors who can fight to undo the curse.\n\nFuture fate in Canon\nOssian will have his revenge, but his bloody crusade will never end and the being he will become to achieve it would have horrified his past self."
 POD_investigate.desc.790454: "In his lifetime, Charles was a young knight who fought in the Albigensian Crusade – on both sides, which earned him the attention of a Lasombra who chose to $pod_Embrace$ him rather than letting him die of fever. During the Anarch Revolt, he again fought on both sides, until his [Glossary('Sire','game_concept_Sire_desc')] warned the other elders of his double-dealings, which forced Charles to side with the Anarchs.\nIn the aftermath of the formation of the Sabbat, he joined a small pack that rampages through southern France. Charles double-dealings extend to his unlife. He uses the various factions within the Sabbat to his advantage and drops them when they are no longer useful. In his heart, however, he strives to discipline the Sabbat, not only in response to the threat of the [Glossary('Antediluvians','game_concept_antediluvian_desc')], but also to the various other supernatural phenomenons that haunt the night. Charles also believes that the Sabbat has to invest more into mortal infrastructures in order to maintain its ground against the Camarilla. He is a staunch opponent of blood magic and supports the Sabbat Inquisition in their hunt against infernalists.\n\nFuture fate in Canon\nHe will become Bishop of Montréal and later Archbishop of French Guiana. As the result of an intrigue of his enemies, he will be promoted to Cardinal of South America, a dangerous post that had claimed five other Cardinals before. To everyone's surprise, he will hold the post for 150 years until his promotion to Priscus under Regent Galbraith. After her death, he will make an unsuccessful run for the Regency against other important Sabbat leaders such as Polonia or Touraine."
 POD_investigate.desc.790621: "Landulf earned his legacy in the 9th century CE as a black magician in the Arthurian grail legends. Named the third most important man in the kingdom of Emperor Louis II, he controlled land from Naples to Calabria until the Vatican allegedly excommunicated him in 875. Rather than suffer under Carpathian influence, Landulf allowed an African Fiend, who claimed lineage from the methuselah Demdemeh, to $pod_Embrace$ him. As a Tzimisce, Landulf maintains the castle Calot Enbolot in Sicily, where he studies koldunic sorcery and earns a reputation as a torturer among the local populace. Landulf fosters these false accusations, if only to keep the curious away from his haven.\n\nFuture fate in Canon\nJoining with neither the Camarilla or the Sabbat, Landulf will protect his neutrality with an alliance with the Giovanni. He will continue his occult experiments, sometimes to dramatic effects on mortal society, but will be mostly known as a bridge between European and African Tzimisce."
 POD_investigate.desc.790422: "Lantla was born in ancient Sumer several millennia before the birth of Christ, she was a crafty witch before being [Glossary('Embraced','game_concept_Embrace_desc')] by the Ventrue Arakur. Horrified by her new existence, she tried to kill herself before being forced to a bloodbound by her [Glossary('Sire','game_concept_Sire_desc')]. Then came the warlord Urion who quickly conquered the city and threatened Arakur himself. In a zealot frenzy to save him, Lantla summoned and soon became possessed by the demon Drakonskyr and found herself standing above the slaughtered people of her city, including both Arakur and Urion. In her last moment of sanity, Tiamat threw away the demon's reliquary, the Sword of Nul.\nShe has kept the demon imprisoned within herself ever since and assumed the name Tiamat. Her evil and cruelty are legendary, stemming partly from demonic possession and partly from herself losing more and more of her soul to Drakonskyr. She – or more accurately Drakonskyr – had her hand in many of the wars and other terrible things that plagued mankind during the ancient times, until she managed to control herself long enough to flee as far as she could and entomb herself (and Drakonskyr) far from civilization and locked away forever.\nOr so she hopes.\n\nFuture fate in Canon\nThe Sword of Nul will cleave a bloody history in the Cainite's world, always trying to reunite with Drakonskyr and unleash him once more into the world. Despite some very close calls, he and Tiamat are still sleeping undisturbed to this night."
 POD_investigate.desc.791292: "[Glossary('Embraced','game_concept_Embrace_desc')] by a mystic Tzimisce during a long and complex ritual, Zirlany was once a princess of a forgotten tribe in Dacia. This extensive ritual forced into her a fragment of the soul of Zirnitra, an ancient and powerful entity seeking resurrection. Participating with her [Glossary('Sire','game_concept_Sire_desc')] in this cult of Zirnitra, she then heard the call of another fragment of her master's soul somewhere far away, in the Alps.\nThe long journey concluded in victory when Zirlany slaughtered a tribe of fallen Lupines to acquire the second part of Zirnitra's soul into herself. Since then, Zirlany is waiting for the call of the last soul fragment, trying to extend her influence and her cult in the area until the right moment comes.\nWith each passing night, Zirnitra is growing stronger inside of her and it might not be too long until Zirlany's own soul is fully consumed. She is sure it will be a glorious event, but is worried that it might happen before Zirnitra's last soul fragment is found, which could have dramatic consequences for her patron. As such, she is still trying to resist this alluring pull for now."
 POD_investigate.desc.791020: "易卜拉欣原是倭马亚王朝的臣子，他与阿卜杜勒·拉赫曼·伊阿德·达希尔一起逃离大马士革，并帮助建立了安达卢西亚第一个独立的酋长国。作为一名能干的诗人和管理者，他的努力是早期穆斯林（和[Glossary('阿什拉派','game_concept_ashirra_desc')]）胜利的关键组成部分。\n虽然易卜拉欣是一个虔诚的穆斯林，但他也懂得欣赏生活中的美好事物，穆拉比特王朝和穆瓦希德王朝带来的混乱让他略感不悦。尽管如此，自战争开始以来，他一直坚定而巧妙地对抗着暗影再征服。然而，易卜拉欣仍然对当前的局势感到愤懑，冷酷无情的巴德尔苏丹和柏柏尔入侵者有时甚至比基督徒还不光彩。有人会说，易卜拉欣对埃列塞尔·德·波朗科和安布罗西奥·路易斯·蒙卡达这两位基督徒怀有的深深敬意对阿什拉派来说是一个严重的问题。许多人担心，如果失去了易卜拉欣在战斗、外交和行政方面的才能，这场战争可能会变得徒劳无功。\n\n其在原作中的未来命运\n易卜拉欣将逐渐远离再征服战争，他与安布罗西奥·路易斯·蒙卡达的友谊为他在魔宴中赢得了一席之地，并最终统治马拉喀什。然而，这也将成为他的末路，因为法蒂玛·法卡迪为了探知蒙卡达的秘密巢穴，将对他进行审讯并最终将其杀害。"
 POD_investigate.desc.790623: "石人的过去对所有听闻其存在者而言皆是谜团。有人声称，他曾成功[Glossary('吸榨','game_concept_diablerie_desc')]过一位上古耆宿；也有人说，他其实是远行至东方的失落二代。\n他对迦太基的兴衰、罗马的覆灭，以及血族历史中的诸多重大事件皆能侃侃而谈，仿佛亲历其中。传闻他自行开创出一整套独特的血律力量，并愿意传授给那些符合其标准的无氏族者。\n对大多数氏族成员而言，石人不过是神话般的存在——是无氏族者用以自我安慰的虚构传说。石人也从不与他们会面。唯有劣族与那些不依附[Glossary('上古耆宿','game_concept_antediluvian_desc')]血统者，才被允许见到他。\n虽然石人表面上独立于千年圣战之外，他仍偶尔被卷入其中。他最为人所知的行动，是现身保护那些遭氏族残酷迫害的劣族。\n\n其在原作中的未来命运\n仍在暗中活动的石人，将主持一系列仅限特殊血系血族参与的奢华密会。与会者宣称，他正与被排斥的血系合作，策动各大教派的崩溃——试图再次煽起裁判所的烈焰，借此清洗传统氏族，让血系重新取得其应有地位。\n而第二次裁判所确实会在2010年代末兴起——或许正只是这位无氏族守护者宏大棋局中的又一步。"
 POD_investigate.desc.790913: "A lowly street urchin who had taken up residence outside the dying Saladin’s palace, Ibn Ja'far was a leper touched by God. Largely unaffected by his condition, his genuine love of God shone like an inner light that gave everyone pause as they passed by. Upon his death bed, Saladin bestowed upon the beggar boy the holy golden coin of Muhammad, saying that no one in either his family nor his own courtly retinue was deserving of the precious artifact. Only the pious leper-child — one who did not forsake Allah even after being stricken with such blight — was deemed truly worthy by the dying sultan.\nRather than $pod_Embrace$ the frail old sultan, the Hajj Nosferatu decided that the boy’s inheritance was a sign from God, and they decided to bring him into the fold instead. Their leader, Tarique, himself rejoiced from his ancestral home in Mecca, instructing Ja’far to take his new childe to Cairo, the city of Saladin’s greatest triumph, where the Nosferatu had grown numerous but languid. Once in Cairo, the neonate, thereafter known as Ibn Ja’far, soon surpassed his [Glossary('Sire','game_concept_Sire_desc')] in his devotion to the faith.\nIbn Ja’far is the very model of religious authority — beneficent, capable and kind.\n\nFuture fate in Canon\nOne night, Ibn Ja'far will lose the golden coin and, with that loss, his entire world will crumble. God's favor is fickle even to the most faithful, it seems."
 POD_investigate.desc.791159: "An ancient creature steeped in death, he was first found on the Swahili coast where locals named it \"devourer of human flesh\" or \"Mla Watu\". Often sought after by those looking for forbidden knowledge, Mla Watu is known to seek control over the dead, both body and soul. Many Laibon find this practice utterly repulsive, and many others fear potential subjugation of their soul after meeting Final Death, so as a result, Mla Watu generally gets the solitude he desires. The disappearance of the few who have tried to hunt him (out of righteous indignation at their subjugation of the dead) has also helped to guarantee his independence. One obvious side effect of giving Mla Watu a wide berth is that most other Laibon do not know very much about him. Those who have spoken to him usually report a quiet vampire, claiming to be quite old, and in many cases with a scholarly personality.\n\nFuture fate in Canon\nMla Watu's brood will expand its influence in Africa, becoming a full fledged legacy of the Laibon. From there, some will try to rediscover their lost parentage with the Cappadocian $pod_clan$."
 POD_investigate.desc.791373: "The margrave of Metz was once a companion of Heinrich Walpot, first grandmaster of the Teutonic Order. [Glossary('Embraced','game_concept_Embrace_desc')] in 1192 by Adalgis von Mainz, he is very young to occupy such a lofty position but his loyalty, strength and combat expertise make him a perfect lieutenant to his [Glossary('Sire','game_concept_Sire_desc')]. It's not easy however maintaining order in a city where the Brujah presence is historically strong. His most skilled opponent is Otto von Speyer who advocates for the independence of the region from the Fiefs of the Black Cross.\nTensions have turned into fighting at some point and Adalgis has been forced to step in, which weakens Friedrich's authority further. The young Ventrue still tries to prove himself to his superiors but the road ahead if appearing to be way longer and harder than he anticipated."
 POD_investigate.desc.790880: "Born among a Saxon tribe that worshiped a dark god within the woods, Ikkenai gathered the attention of this god after she tried to defend his sacred grove from desecration by the Romans and their Ventrue masters. She watched as her god and the lord of the Romans clashed, and though she tried to aid him, she found herself powerless. For her bravery in battle, the god revealed to her the truth: that he had once been mortal and had not the power to protect their tribe from the Romans indefinitely. Ikkenai offered herself to him in sacrifice and the Gangrel accepted, draining her and Embracing her afterwards.\nWhen the first Christian missionaries arrived, Ikkenai was furious. When her tribe tried to attack the new faith, retaliation from the new king of the Franks, Charlemagne, resulted in the execution of anyone who refused to convert. Falling into a terrible Frenzy, Ikkenai launched an assault against several newly founded monasteries, but was held back and nearly killed by one the Palatine Knights of the Messianic Voices.\nAfter having regenerated from her wounds, Ikkenai traveled to Aix-la-Chapelle, hoping to build a coalition against the Palatine Knights. She found the Cainites mostly disinterested in this new threat and left soon afterwards, traveling through Flanders, Burgundy and Alsace before returning to the city, hoping that the situation there will finally turn to her advantage.\n\nFuture fate in Canon\nAligning herself with the Camarilla, Ikkenai will become a potent asset of the sect. After a climatic battle against the insane witch Louhi, Ikkenai will be sent into a $pod_torpor$ from which she has not yet recovered to this night."
 POD_investigate.desc.790253: "A young Prince, Geidas appears as a formidable foe to those trying to get in his way. This is compounded by the powerful looking Vozhd that protect his domain. The truth is, Geidas is but a pawn to his [Glossary('Sire','game_concept_Sire_desc')], Vysia, a long time rival of Vladimir Rustovitch for control of $pod_clan$ Tzimisce. When he is threatened by someone who sees behind his facade, Geidas is quickly shielded by his powerful sire until the threat is gone, keeping the charade going with no witnesses to disprove it.\n\nFuture fate in Canon\nGeidas will meet his end during Jürgen von Verden's attack on Livonia. The Ventrue will see behind the masquerade and manages to thwart Vysia's attempts of deception. Geidas will be forced to drink Jürgen's blood and becomes his vassal, a tenure he will occupy for merely one night before being assassinated by another ambitious Tzimisce, his once right hand man."
 POD_investigate.desc.790266: "赫尔曼·拉多夫幸运地得到了他的亲王领。勒森魃在卑尔根已根深蒂固，他们对虔诚的凡人牧杖党的控制确保了他们对该地区的统治。当牧杖党最终在反对哈康·哈康森的加冕礼的冲突中发挥作用时，他们最终的失败粉碎了他们的力量……以及勒森魃的力量。\n在此之前仅限于影响挪威的商业力量，让梵卓看到了进军该国的机会，希望在此过程中也能帮助他们在瑞典的努力。赫尔曼·拉多夫是被派来完成这项工作的人，值得称赞的是，他成功地夺取了卑尔根的公国，没有太多问题。真正困难的部分对他来说刚刚开始，然而像罗森克兰茨这样的本地竞争对手对他的到来感到愤怒，还有他周围的勒森魃和冈格罗打算在赫尔曼巩固他的地位之前收回他们的土地。"
 POD_investigate.desc.790615: "原先是出身达尼斯拉夫的家传血仆，马雷尔以其善于进献睿智谏言于$pod_cainite$领主们而闻名。伯爵拉杜曾向她寻求对付领土中冈格罗的方法，该冈格罗使用狼群恐吓居民并煽动当地狼人对抗拉杜。\n在一次对拉杜城堡的失败袭击后，马雷尔发现该冈格罗是阿努尔夫的臣属，这名传奇长者血族以其对文明的厌恶出名。出于担忧，拉杜$pod_Embrace$了马雷尔，冀其在接下来的冲突中保持忠诚。马雷尔开始向该冈格罗发动战争，伴随着日益增长的狂热。最终该冈格罗退缩了，但马雷尔毫不在乎，并将之雕塑成畸怪并弃至附近的狼人领土。\n马雷尔变得如此野蛮以至于拉杜无法再忍受看到她。她享受折磨其他活物，而当她绑架人类婴孩来做研究时，拉杜最终解除了她的服侍。她无动于衷，旅行至南方并向蜕变之道大师沃拉克效忠。在对付狼人的经验中受到启发，她开始专注以狼群为实验对象。\n\n其在原作的最终命运\n马雷尔会继续保护血肉大教堂直到它背叛维护者。她会晋升成德瓦的魔宴大主教，而其残酷直到今夜仍被当地狼人所恐惧。"
 POD_investigate.desc.791982: "如果耶和撒巴的自述可信，她已经历并见证了无数事迹。她讲述的故事精彩且令人信服，经常展示她对血液中力量的掌控，足以让血诺斯替主义者和不信者畏惧。她声称异端的敌人无法对她产生任何影响，因为她直接与该隐沟通。她自称在担任祭司时，该隐会亲自回应她的召唤。然而，实际上，她的$pod_cainite$远不如这种身份所应具备的水准，但她的言辞坚定有力，足以让他人相信她的力量。\n\n其在原作中的未来命运\n在未来的几十年中，耶和撒巴会做出正确的决定，在该隐异端崩溃之际进入$pod_torpor$。她将在现代之夜苏醒，凭借她那令人敬畏的年岁和无法证伪的自我夸耀故事，成为重生的该隐教会的先锋。"
 POD_investigate.desc.791051: "这位年轻的布鲁赫是赫克托最早的追随者之一。在过去的几十年里，安提俄科斯一直是敦促赫克托建立起更可持续政体的提倡者。此举令他在某种程度上已经失宠。作为一名虔诚的东正教基督徒，安提俄科斯也对赫克特和他的亲信在宙斯雕像面前卑躬屈膝的行为感到恼火。不过他还能忍受，如果他发现了赫克托那位巴力朋友的真相，情况就不会是这样了。\n虽然安提俄科斯在议会中仍有重要的发言权，但过多的争端让他失去了过去所拥有的卓越声望。最近，安提俄科一直避开群岛，转而前往欧洲指导反叛派系。他这样的举动是在冒不必要的风险，但如果不这样做，他帮助建立起来的社区就会四分五裂。如果没有结果没有迎来任何改变，那么安提俄科迟早会迎来终焉之死，而新拉科尼亚改革的最后希望也将随他而逝。"
 POD_investigate.desc.792789: "埃兹梅勒达是一位美丽的女子，双眼闪烁，秀发如丝，并带有新月形的胎记。她行事神秘，过去无人知晓。她的预见充满力量，思维敏锐，而每当她现身时，她的影响力总是非凡。她总是成为她所参与（或创造）的故事中的女英雄，而所有试图探寻她真面目的人无不以失败告终。埃兹梅勒达如同神话一般，而她正书写属于自己的传奇。\n\n其在原作中的未来命运\n埃兹梅勒达的传奇将传扬至凡人的世界，成为他们眼中的神秘人物。最终，没有人能够知晓真相。"
 POD_investigate.desc.791011: "Matthias is the son of a weaver and took holy orders upon the creation of a Benedictine monastery near his home in Bath, England. After the $pod_Embrace$, he followed the path of the healer and was quite renowned for his abilities.\nOne night he met a female Warrior Salubri Yael coming to him seeking healing, and the pair quickly became close friends. He acts as her chronicler and advisor as well as a constant companion. Time and circumstance have conspired to tie these two closely and they are like twin lanterns set before a doorway. If one were to lose the other, their entire world would likely crumble.\nThey fight Baali and Setites who had infiltrated the Church, and also write a great deal of the history of the Salubri in their battle against the Baali and other infernalists.\nWith the Tremere's purge increasing in intensity however, they are pushed back farther and farther for their own safety, something that the fiery Yael could stop to accept at any time, leading to potentially rash actions on her part."
 POD_investigate.desc.790926: "海达尔是一个在神秘环境下转化成吸血鬼的阿拉伯少年。就人们所见，海达尔在本质上无法对任何事物产生不安感。对他而言，一切都只是谜团，他会从中筛选出模式，并将其与自身的经历及历史研究进行比对。\n海达尔拒绝一切头衔与地位，但附近通常至少会有一位目光敏锐的强大吸血鬼，能够欣赏并重视他的见解。\n\n在讨论中，他很少发言，但在事后，他会向当前的庇护者报告年轻吸血鬼中任何可能导致叛乱的预兆。\n其在原作中的未来命运\n在大反乱期间，海达尔将庄严地协助屠杀长老，并为了自保而投靠魔宴。他的洞察力将受到大主教和枢机主教的一致青睐。"
 POD_investigate.desc.792486: "在被$pod_Embrace$之前，巴尔卡特是一位技艺高超的木工。然而，他很快展现了语言和提出明智建议的天赋，这为他赢得了在苏丹达舒夫身边的席位。不论达舒夫去往何处，雄心勃勃的巴尔卡特都紧随其后，哪怕这意味着直入安纳齐尔的掌控之中。如今，巴尔卡特比苏丹还要堕落。\n他作为达舒夫的代言人，为这位孤立无援且恐惧的苏丹传达旨意，并向他报告外界的消息。虽然巴尔卡特名义上为达舒夫发声，但实际上他是奉安纳齐尔的命令行事。巴尔卡特已经不再满足于做一个走狗，他认为自己正在利用巴力的力量，以获得苏丹的权力。\n然而，事实上巴尔卡特只是安纳齐尔的工具，他对恶魔崇拜者的服务远超他们对他的帮助。安纳齐尔计划利用巴尔卡特作为统治大马士革的代理人，或者至少将他作为一个分散哈基姆圣裔注意力的棋子。"
 POD_investigate.desc.710102: "In life, Antara's constant was his love for his wife Abla. Despite being the son of a slave, he proposed her hand and when her family rejected him, he proved his worth by becoming one of the deadliest warriors of their tribe. One of the most heroic figures of pre-Islamic Arabia, he drew the attention of various vampires who began to court him for the right of $pod_Embrace$.\n\nAn agent and influential figure of the Tal'Mahe'Ra, known as Nabonidus, eventually brought him to the fold, but Antara found that unlife without his wife was shallow and void. He [Glossary('Embraced','game_concept_Embrace_desc')] her, under the condition that he would become the leader of the Tal'Mahe'ra in Egypt. Inserting himself in the fortress of Al-Aksar near Cairo, he ventured forth to drive the Followers of Set out of Egypt, who avenged themselves by turning his wife against him, so that she eventually stepped into the sun.\n\nAlthough Antara nearly followed her, a message from his [Glossary('Sire','game_concept_Sire_desc')] assured him that his wife continued to exist in the [UmbraGlossaryLocalized('shadowlands','Underworld')] and that she wanted him to continue his war against the spawns of Set until Gehenna and God's judgment would reunite them. As such, Antara is now preparing for his next work on behalf of the reclusive Magnus Nigrum.\n\nFuture fate in Canon\nAligning himself with the elders during the Anarch Revolt, Antara will be shunned by his clan for his double loyalties and left alone by the disappearance of the Tal'Mahe'Ra. He will start looking desperately for new allies."
 POD_investigate.desc.790165: "阿摩罗伐底很荣幸自己既是阿什拉夫的门徒，还是他的子嗣。考虑到这一尊贵的世系，他成为一名出色的术士也就不足为奇了。然而，与他的导师形成鲜明对比的是，阿摩罗伐底对政治舞台也并不陌生，他经常参加阿拉穆特的各种辩论。这使得尊长和子嗣之间的关系开始疏远，甚至有人说这两位术士已经不和了。\n\n其在原作中的未来命运\n阿摩罗伐底将在乌尔·舒尔吉觉醒后与之结盟，来对抗他的尊长阿什拉德，从而结束两人之间长期而激烈的竞争。由于这次的背叛，阿摩罗伐底将被选为忠诚术士的新任阿姆鲁。"
 POD_investigate.desc.790192: "雷伏诺氏族声称哈济梅尔生于“遥远北方”，原先是在一位致力对抗[Glossary('上古耆宿','game_concept_antediluvian_desc')]的女神的麾下护卫。[Glossary('上古耆宿','game_concept_antediluvian_desc')]的反击是策使哈济梅尔杀了女神。癫狂的哀痛使他拔出自己的眼睛并逃入山间，在那他被吒婆多修罗发现。该[Glossary('上古耆宿','game_concept_antediluvian_desc')]向他提供复仇机会，哈济梅尔接受了并为了罗刹称号舍弃自身之名。据说他将自己挖出来的眼睛作为邪眼护符使用，使他能够看穿虚伪。\n雷伏诺史诗记录了罗刹很快厌倦战争并因此与其尊长对抗。两者的冲突使罗刹成为吒婆多修罗的第二劲敌，据说他将自身命运押在其尊长的更强大敌人伊娜依娅身上。在传说某些版本中，他离开印度前往非洲或中原，而在其他版本中，吒婆多修罗从他身上夺走了眼睛并监禁之直到他悔改。其他说法称罗波那在崇魔后背叛了他，因为他的眼睛可以看穿他的欺骗。\n此后哈济梅尔之名成为被遗忘的存在，完全由其称号代称。\n\n其在原作中的未来命运\n经过多次冒险后，哈济梅尔会重获自身之眼并再次醒来。与其兄长查古拉普夏和好，他们将领导雷伏诺进行崭新的永恒之战。"
 POD_investigate.desc.792602: "作为法老斯尼夫鲁之妻及法老胡夫之母，赫特弗拉丝曾是古埃及权倾一时的政界女性。历经诸多政治波折，她得以与伊西斯教团取得联系，并在荷鲁斯沉睡期间获得了永生。然而，她现在——至少在潜意识里——后悔那个决定。\n她在埃及的生活曾充满世俗享乐，而如今作为一名永生者，她徒劳地寻找着各种新奇的满足感，试图以此不断刺激她那空虚乏味的人生。\n她对[spirit_world|E]有着极深的造诣，如果能从中获得乐趣，她将成为他人的巨大助力。"
 POD_investigate.desc.792524: "约翰·菲茨威廉是治理韦克斯福德的诺曼小领主三子，属于银牙部族。在他少时被送往英格兰接受教育，他的原始觉醒较晚。菲茨威廉经常拜访英格兰贵族宫廷，其中的银牙们很早便视其为一份子。他们派出灵体追寻他的祖先，发现他是严竣之嚎家族的贵胄。在原始觉醒后，他在狩猎探险中迷惘，在睡眠时不知觉地化形，位于索尔兹伯里平原保卫圣地的银牙们收留了他。菲茨威廉证明自己是出色的战士，能够在圣地栅界防卫吸血鬼袭击，于是便被作为领袖培养。\n到了成年，菲茨威廉宣称家族头衔，并形成了爱尔兰芬里尔与银牙的小型战群。该战群是暂时性的，作为未来领导者的试验场，但出奇有效。成员们在爱尔兰南部屠杀许多$glossary_wyrm$之属，收获了不少名望。\n严竣之嚎的约翰·菲茨威廉最近回到英格兰，年近三十的他有着威武的名声。他加入了位于怀特岛的小型银牙战群，藉由他的领导与战斗能力更为他的名声添上令人畏惧的成分。他的相对年轻和纯正血统使他成为不列颠群岛银牙王位的潜在继承人。"
 POD_investigate.desc.792423: "Born as the third son to a lord, Vincent's life seemed to be destined for the church. Having no interest in becoming a priest, he fled to France and joined the Templars. Soon he was on his way to the Levant to battle heathens, but the brutal stalemate that they had to endure gnawed as Vincent's faith. When the Templar's were forced to retreat, he went to Rome to find solace. During this time in 1307 CE, Philip IV accused the Templars of heresy and Vincent left the order as fast as he could, returning to England and the side of his father.\nWhen he was [Glossary('Embraced','game_concept_Embrace_desc')], he finally saw the truth of Cainites influence running rampart in the world, centered among a few influential elders who centralized all the power for themselves. While he was a Ventrue of a distinguished lineage, descended from Mithras himself, Vincent seemed to gain nothing from that reputation. His sire taught Vincent enough to act as both a guardian and a messenger. Vincent was often sent on long, dangerous journeys to deliver important missives to other Ventrue throughout Europe.\nWhen the Anarch Revolt came, he joined with true fervor, vowing to end the oppression of the old over the young. When the Camarilla was founded, Vincent only laughed. It was the same oppression as before, only with another mask. Full of anger and idealism, he joined the nascent Sabbat, earning himself a name as a warrior.\n\nFuture fate in Canon\nVincent will serve as the General of the Sabbat Inquisition, Templar and Paladin and his reputation will make him one of the most feared among this station."
 POD_investigate.desc.792175: "An old and potent Sinner, Valentina della Torchia is a staunch adherent to the Path of Pleasure and an unashamed pagan all at once. Descended from Aconia Messalina herself, Valentina was ousted with her mentor from Rome a long time ago by the more orthodox Lasombra. She is an unliving annoyance to those pious Magisters who cling to Christianity and would like nothing more than seeing her destroyed.\nUnfortunately for them, her grip on her domain is exceptionally secure, girded by her influence over both mortal maritime trade, political structures and her brazen tendency to fight to the finish for something she considers hers. More than a few self righteous Lasombra have been expelled from Ancona, wishing to never cross again the devious and decadent mistress of the Aphrodisium.\nTrue to her Sinner roots, Valentina's celebrations of the Aphrodisiac are famed by both living and unliving, having so far avoided the eye of the Inquisition who is still looking at the cause for the sudden bursts of licentiousness and carnality in the city."
 POD_investigate.desc.790423: "Gotsdam was presumably a Germanic barbarian warrior who was captured by the Romans when Rome waged war in middle-Europe. His future [Glossary('Sire','game_concept_Sire_desc')], Tiamat, who happened to be traveling through that area and enslaved him to take his blood in numbers of cruel ways, only Embracing him when she needed a pawn to use against her enemies. When Tiamat no longer needed Gotsdam, she simply abandoned him.\nKnowing very little about being a $pod_cainite$, Gotsdam fled from Rome and spent the next several hundred years along the Rhine, living in caves and feeding on animals and occasional tribesmen. He feared the Lupines who ruled the woods, and learned how to fight them, and importantly, hide from them. Only when civilization finally encroached on the wilderness did Gotsdam join the world of civilized Kindred and started traveling.\nHis considerable skills in disciplines are aimed at making Kindred and other supernatural creatures leave him alone. He also has a habit of pretending madness to dissuade other Kindred from talking to him.\n\nFuture fate in Canon\nBy siring the infamous Dylan Bruce in the late 20th century, Gotsdam will set into motion the events surrounding the Sword of Nul. He will remain unscathed by them for his part however."
 POD_investigate.desc.791814: "Embraced by a Flemish Brujah for his skills as a merchant and as a diplomat, Eudes quickly proved himself adept at managing the fairs and soon was a valued agent of the local Cainites.\nGathering like minded Cainites around him, Eudes quickly monopolized arrangements for travelling Cainites and their entourages. Using that trust and influence, he gained independence from his sire. Because he maintains a strict neutrality in his dealings, Eudes is respected as a mediator.\nHe respects the power of the nobles, but has only scorn for those who abuse or waste this power. As such, he tries to stay away from Cainite politics, only truly getting involved when his beloved fairs are targeted by some scheme."
 POD_investigate.desc.790169: "据说，巴利阿里群岛的四座岛屿均在帕尔马的苏丹贾斯明的统治之下，她是源自穆瓦希德王朝的哈基姆之子女术士。她成功地重新激发了岛上阿什拉派的活力，但在让他们认识到基督教威胁方面却进展不大。阿什拉派信徒根本不相信收复失地运动会对他们构成危险。\n贾斯明与在伊维萨岛上游荡的古老冈格罗尤利乌斯建立了友谊，但凯西布因为嫉妒苏丹的地位，诬告尤利乌斯是阿什拉派的威胁。如果贾斯明惩罚尤利乌斯，她将失去一个宝贵的盟友，并成为凯西布野心的目标。如果她不这么做，凯西布则会向鹰巢报告她的行为，并借机将她赶下台。\n不过，尤利乌斯已经接近揭露凯西布的阴谋，正试图说服贾斯明意识到这个新生的威胁，保全她的统治。"
 POD_investigate.desc.790209: "在北非出生的马拉伊是萨满的女儿，擅长与亡者的幽灵沟通。她的天赋和冷静的性格吸引了蒙塔诺的注意，后者认为她适合接受$pod_Embrace$。尽管受她的尊长信任，但她是一个神秘的隐士，并不热衷于参与勒森魃的政治活动。\n\n其在原作中的未来命运\n当勒森魃一族反叛其长者时，玛莱伊将逃往维也纳，寻求埃特里乌斯的庇护。作为交换，她将以自己的知识换取庇护，使她免受魔宴的骚扰和袭击。"
 POD_investigate.desc.790513: "女神塔沃里特通常与生育、分娩和黑魔法有关。她的创始神庙“面纱宫殿”位于哈尔加绿洲，因其对赛特之路的极端诠释而闻名。人们对塔沃里特的实际活动知之甚少，只知道她与刻茉媞里结仇，并试图从她那里夺回最后一滴$pod_vitae$。两位玛土撒拉在红海的一场战斗中，塔沃里特在忠诚的赛特术士的协助下击败了刻茉媞里，尽管他们没能夺回这个赛特之子的身体。\n\n其在原作中的未来命运\n塔沃里特会在供奉她的神庙里陷入$pod_torpor$状态，直到今天晚上，她的一个世系成员仍在管理着这座神庙。"
 POD_investigate.desc.791164: "Arcus is a Malkavian, one of the first of his Clan to arrive in Africa, who believes the continent holds the secret to Cainite origins. Africa is a very big place and Arcus isn’t sure where he should look, but he reasons Mogadishu is as good place as any.\nAs the Children of Malkav pile up and loiter around the city, the Na’ib becomes increasingly eager for Arcus to leave. Mazigha is of a different view. The Ramanga was initially merely gleeful at another Cainite making trouble for the Na’ib, but she has come to take him seriously ever since Arcus spoke of “Sarapion of the line of Loz.” She doesn’t know who Loz is, but she does know Sarapion is the old city underneath Mogadishu.\nBoth names send chills down her long-dead spine, and she is determined to know more.\n\nFuture fate in Canon\nArcus will find much more than he bargained for. Disappearing in 19th Century Congo, he will become a folk tale among Malkavians scouring Africa to find him and his wisdom."
 POD_investigate.desc.790162: "Born Pollius Felix Maximus in Gaulish territories during the early Roman Empire, Antoine soon came to despise the occupiers. The $pod_Embrace$ gave him the weapons to actively work against them and their vampiric overlords and he quickly established a vendetta against the Roman Nosferatu Trajan.\nLe Fanu backed several weak emperors in order to weaken the foundation of the Empire and after Rome had collapsed, he left Italy in order to strengthen paganism against the growing threat of Christianity. He allied with Dark Selina, tried to fight Charlemagne and Christendom – and thinks their failure is her fault, starting a centuries long between them.\n\nFuture fate in Canon\nIn his ongoing struggle against Trajan, he will attack the informants of his rival, collapsing his Web of informants and leaving him vulnerable, all the while exposing his machinations to the Elders of the Camarilla. Currently, Le Fanu operates undercover on the American West Coast, examining the growing threat of the [GetTrait('kueijin').GetName( GetNullCharacter )] influx in Kindred territory."
 POD_investigate.desc.790324: "Aristotle was born in the 12th century in Paris, a city where he still maintains his primary haven and library. As the son of a metal trader, Aristotle turned early to scholastic approaches and enlisted in the famed Sorbonne University. He became an adherent of Pierre Abelard's theories and was influenced by his passion for history and antiquity.\nThe exact date of his $pod_Embrace$, as well as the identity of his [Glossary('Sire','game_concept_Sire_desc')], are unknown. As a member of the Mnemosyne (or Memory-Seekers), he spends his entire unlife searching for and translating all fragments of the Book of Nod that he can find. This quest took him all over the world, introduced him to hundreds of different languages and cultures, and put him in contact (and conflict) with powerful vampires from all clans.\nAristotle describes several of his adventures in the commentary of his edition of the Book of Nod. He is particularly wary of the [Glossary('Antediluvians','game_concept_antediluvian_desc')] and those who serve them. He claimed to have learned the true name of the Brujah clan founder (presumably Troile), and woke the following evening with his own name carved into his forearm, and thereafter foreswore searching for the names of Antediluvians. Nevertheless, he remains somewhat paranoid to this night.\n\nFuture fate in Canon\nAristotle will continue his quest and finally publish his masterpiece, an English translation of the entire Book of Nod. He will become a mentor to the famous Noddist Beckett and use renowned agents such as Lucita of Aragon and Anatole to continue looking for the elusive truth."
 POD_investigate.desc.792141: "A second son of a minor noble family, Gerard fought as a mercenary of the White Company until he excelled a little too much in protecting one of his charges, a Tremere named Lucinda. Taken as a faithful servant, ghoul then neonate of the Tremere, Gerard was tasked with a difficult first mission: find a way to control the Beast, a Cainite oddity that the Tremere were ill prepared to deal with after their transformation. He chanced upon a feral lorekeeper, Liolya, and became fascinated by her and her stories.\nHe became her apprentice, first in the hopes of fulfilling his mission, then with growing conviction in her way of unlife. Brought to the wizened being known as \"Grandfather\", Gerard undertook the rites and emerged as a new follower of the Road of the Beast. He then participated in his first Feral gathering, where he was welcomed as a member of Qarakh's followers.\nThe Tremere did not take to his betrayal kindly however and soon mustered a force to capture him and use him on their experiments. It was, in the end, their loss when Qarakh, Liolya and Grandfather stormed the chantry, leaving only ashes behind as they freed Gerard from captivity, earning his undying trust in the process."
 POD_investigate.desc.791294: "A minor lord participating in the the Ventrue's attack in Scandinavia, Sundafyllir earned his fame by a bold claim: being the one to have the ashes of the All-High Odin in his possession and, by extension, taking credit for the attack on Uppsala that resulted in Odin's (final?) disappearance. This has resulted in many challenges from furious young Einherjar that he, so far, has won. Since no Valkyrie or Einherjar elder has come to fight Sundafyllir yet, most of Europe think that he is lying.\nStill, this action that could have been deemed reckless has put Sundafyllir on the map, and he intends to use it to its fullest to carve his own domain in war torn Scandinavia."
 POD_investigate.desc.790464: "作为棘秘魑领域边缘的一位相对无足轻重的领主，戈登斯特以冷静的统治和罕见的外交敏锐度而闻名，这在通常冷酷无情的棘秘魑氏族中极为少见。\n\n其在原作中的未来命运\n在大叛乱期间，戈登斯特巧妙地参与政治博弈，并最终成为魔宴的重要领袖。他在阻止第一次魔宴内战中的关键贡献为他赢得了教派的摄政之位。\n在他的领导下，魔宴取得了丰硕成果，不仅征服了墨西哥城，还在美洲建立了坚实的权力基础。凭借他强大的威望和坚定的意志，他成功避免了在秘盟反攻期间再次爆发内战。然而，1863年，他在一次自杀式袭击中被暗杀，这场事件最终将魔宴再次推向内乱的深渊。"
 POD_investigate.desc.790976: "Dehaan was born into the retinue of the Setite traveler Ankhesenaten (known to Europeans as Andreas Aegyptus) and raised to revere Set as the one true god, even in the largely Christian Flanders. When he turned ten, he chose to follow his master's caravan, to tend to his grandmother, the high priestess Ljudumilu. His grandmother tutored him in medicine and over what moved the hearts of men, as well as parts of Setite doctrine. As all, he was marked by the common symbol of a Setite ghoul – a serpent coiled around the hieroglyphs for Thunder, Set's domain.\nWhen the caravan was stranded in Spalato, Ljudumilu sacrificed herself in a Setite ritual to summon a storm, in exchange demanding that Dehaan would become one of the undead. Ankhesenaten, who had sworn to himself to never have childer, instead let Dehaan try to teach the orphaned Meribah the basics of the language of Ancient Egypt.\nWhen the caravan was attacked near Chambery by members of the Red Order and Knight Templars in 1208, Dehaan fought to drive them off with the rest of the mortal retinue, but was overwhelmed. Working to free those taken prisoner, he scouted the fortress of the Order during the daylight to allow his Cainite masters to enter. After they managed to flee from the fortress, Dehaan covered their escape. For this deed, Ankhesenaten found a compromise: Dehaan would be Embraced by Meribah and adopted by himself, so that in the eyes of the clan elders, he would have a respected lineage, but not the stigma of a high generation.\nHe then resumed his travels with Andreas and Meribah, now called Mre-Ba."
 POD_investigate.desc.605114: "西诺佩亲王以先知闻名，还有他那陷入长达数月仿若$pod_torpor$般的昏睡，醒来带着未来预言的举止。在他昏睡时，其管家子嗣——沙瓦尔什代他治理。拉姆齐克的预言准确性令人不安。他上次预言是西诺佩将于1214年沦陷于塞尔柱土耳其，这使得该隐之子能预先准备凡人的猛攻。\n大量末卡维在其治域安身，忧郁地等待着他下一个预言，恐惧（或预期）那可能是火焚末日的开始。"
 POD_investigate.desc.792026: "哈尔巴耶斯·玛尔·斯威夫特，色雷斯的亚马逊战士与强盗公主，在给予她的五个子嗣$pod_Embrace$的当晚，用獠牙与利爪将他们逐出她的森林。她的后裔中，许多人仍然延续这一传统。\n许多冈格罗声称与她有世系关系，尽管其中很少有真正的证据。无论她的存在最终是真是假，她都是许多传说中的创始者之一，狂野的冈格罗尤爱讲述关于她的故事，有些人甚至声称亲眼见过她，或者见过冒充她的人。"
 POD_investigate.desc.791141: "Jamugha was born in the Jadaran, a sub-tribe of the Khamag Mongol confederation, and was an [Glossary('Anda','podgloss.anda')] (i.e. blood brother) to Temujin. In 1201, the leaders of the thirteen remaining tribes hostile to Temujin (among them the Merkits, Tatar, and Naimans) and the Mongol tribes not allied with him (Jadaran, Taichuud, and others) assembled a kurultai and elected Jamugha as Gur-khan, universal ruler, a title used by the rulers of the Kara-Khitan Khanate. Jamugha's assumption of this title was the final breach between him and his blood brother, leading Temujin to form a coalition of tribes to oppose him.\nIn the fall of that year, a great battle broke out between Jamugha's alliance and the Keraite-Khamag Mongol alliance at the Ergune valley. This decisive battle, known as the Battle of the Thirteen Sides, ended with Temujin's victory and eventual ascension as Khan of all united Mongol tribes.\nJamugha was less successful in building a coalition. For example, he did not recruit shepherds who lacked tribal status in the Mongol tradition, which allowed Temujin to recover from a series of military defeats inflicted by Jamugha and to emerge victorious. Following the Battle of the Thirteen Sides, Jamugha was betrayed and captured by his own men, who submitted him to the now-victorious Temujin. Due to one of the laws which Temujin came up with (\"Never betray your Khan\"), he had the men immediately executed and later Jamugha interrogated. Jamugha was given a choice to live and join Temujin, but he instead requested to die in his blood-brother's hands, and thus was soon after executed \"without spilling any blood\".\nAnda legends said that his death was faked and Jamugha returned later on to offer immortality to the dying Genghis Khan. His refusal was the final parting between the two blood brothers."
 POD_investigate.desc.790580: "In a time where the word \"Nabatean\" denoted a man as \"poor\" or even \"bastard\", they worked as faithfully and hard as they could, bowing before the Roman authorities, but also keeping true to the ways of their people. This was noted by a traveling Lasombra named Antipater, who began to take an interest in them.\nWhen Petra was finally destroyed during an earthquake in 737 CE, this Lasombra saved one of the temple workers and took him under his wing to preserve the line of the Nabateans. As Antipater had converted neither to Christianity nor to Islam, his standing in his very clerical Clan was quite low. This brought them serious problems, when they were guests by a fellow Lasombra sultan of the Ashirra in Málaga. Antipater was challenged to a contest by the sultan in order to force his conversion and lost. When the Nabatean's sire still declined any attempt to convert him, the matter was brought before the Amici Noctis, who put him between the choice of honoring his word and converting or facing Final Death.\nKnowing his [Glossary('Sire','game_concept_Sire_desc')] would never convert to a faith he did not love, the Nabataean, who had stayed silent through the matter, made a bold and decisive move. He offered his own unlife in exchange. To his surprise, neither his sire nor the sultan objected, nor even reacted with especial dismay. The sultan accepted at once, and sent word to the tribunal that the sire's verdict was to be voided, provided his Nabataean childe remained true to his word. After almost three centuries years together, sire and childe parted ways with nothing more than a lone knowing nod and a somber valediction.\nThe Nabatean, however, was sentenced not to death, but to an eternal slumber.\n\nFuture fate in Canon\nThe Nabatean will be tossed around various Princes and Sultans as a trophy piece for centuries until finally awakening in 2011. He wanders now, as in nights of old — wanders and wonders if he is indeed the last of his kind."
 POD_investigate.desc.792137: "A ruthlessly dedicated advocate of the Crusades and a supporter of efforts to weed out heresy, Vicelin's passion for Christendom is only matched by Lucius' own growing fervor, so it was a happy meeting of minds. What his [Glossary('Sire','game_concept_Sire_desc')] doesn't realize is that Vicelin is completely amoral. As a child he practiced random cruelty, as an adult he looked for the institution that would provide him with the most opportunities and protection to do the same and settled on the Church.\nWhen he heard about vampires, he did his best to make himself attractive to them. In due time, he will turn on others of his $pod_clan$ but for now he is continuing to earn respect and play the waiting game.\n\nFuture fate in Canon\nVicelin will love the Anarch Revolt and its violence. Finally diablerizing his own sire and blood brother, he will then embroil himself in Sabbat politics. Unfortunately for him, he soon finds that he isn't as nearly as good as others in it. Around 1700, he finally perishes as food for more effective plotters."
 POD_investigate.desc.790875: "曾经是人性之路的狂热追随者，扎法尔是巴格达的一位荣誉感十足的居民，凭借足够的聪明才智赢得了该隐之子的尊重。不幸的是，扎法尔极度害怕自己的心兽，每当即将被其战胜时，他以强大的兽性术将其放逐到敌人身上。然而，在一次战斗中，其中一名敌人被杀时，扎法尔的心兽仍在其体内，导致他陷入$pod_torpor$。\n扎法尔在12世纪初苏醒时，心灵已然破碎，缺乏心兽使他只能依赖他人的施舍，才能勉强获得进食和夜晚苏醒的欲望。随后，扎法尔的[Glossary('尊长','game_concept_Sire_desc')]纳伊玛前来试图拯救他。然而，当她将自己的心兽送入扎法尔体内时，扎法尔陷入狂暴，失控之下杀死了纳伊玛。在被多年忧郁折磨后的这场突如其来的暴力爆发中，扎法尔彻底堕落为一个完全非人的存在，在荒野中肆虐。"
 POD_investigate.desc.792331: "Silat has lived in the city of Bukhara in the Khwarezmid Empire since the days of his Embrace, cultivating a strong network of spies and scholars within the city. A devout Muslim, he enjoyed the state of Bukhara as a central trading point and immersed himself in the intellectual pursuits the city offered.\nWhen Genghis Khan laid siege to the city, Silat fell into torpor and when he awakened he found his city under Mongol rule. Embittered, he began a campaign to oust the Mongols and the vampires that had followed them from the city, believing them to be ploys for an unknown faction originating in Asia.\nAs far as Silat is concerned, vampires from the West and East are conspiring to bring clan Assamite and the Muslim faith down. He knows that he cannot do much against such a vast conspiracy but he has decided that the time for books is at an end. He has started the night war by murdering a younger member of the invaders and drinking his blood. It tasted good, perhaps better than he expected or wanted it to. And it's only the beginning."
 POD_investigate.desc.790193: "在雷伏诺的创世神话中，罗波那是始祖的第四个子嗣，据传他与真正的恶魔达成交易，换取了远超其[Glossary('尊长','game_concept_Sire_desc')]所能给予的力量。虽然文中说他在达成交易后就消失于世间了，但具体细节却少得可怜。后来的传说描述了他如何利用那不劳而获的地狱之力破坏[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]的美德，并将他们引诱至其麾下，就如同他们曾经引诱他一样。\n传闻称，罗波那在地狱之力的驱使下将数百名[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]引向绝路，并许诺给他们以其他方式无法获得的荣耀和力量。据一篇未经证实的记载，罗波那曾向吒婆多修罗现身，向他许诺了连神明都无法给予的力量。罗波那声称他能在阳光下行走，享受凡人的乐趣。吒婆多修罗一拳挥向他，却打了个空。随着罗波那嘲弄的笑声渐渐消失，吒婆多修罗开始思索这个提议及其可能的意义。不久之后，他陷入了第一次长时间的蛰眠。\n其他传闻称他成为了[Glossary('阎魔王','podgloss.yamaking')]，是地狱灵界最可怕的领袖之一。"
 POD_investigate.desc.792601: "Born during the period of the Hyksos invasion, Hetch-abehu grew in fame as a soldier and tactician against the foreigners. His fierce devotion caught the attention of the Reborn and he was selected as an early candidate for mummihood. After becoming immortal, the zeal of his youth slowed down, leaving him a more calculating and methodical thinker, which only helped hone his talents further.\nHis talents quickly made him rise as one of the most respected Mummies, favored by Horus himself when the Avenger is in need of tactical advice or a solid sword arm.\n\nFuture fate in Canon\nHetch-abehu will continue assisting Horus with dedication and diligence. As a reward, he will become the Vizir of North America for Horus' faithfuls, where he still operates to this day from Chicago. Ironically, Hetch-abehu will find that financial success has a lot in common with ancient warfare and will end quite the successful businessman."
 POD_investigate.desc.792554: "Silver-Howl is a relation of Guillaume Sun's Glory through his sister, a Silver Fang who later mated with a Kinfolk wolf. She experienced her First Change, her Rite of Passage and both of her rank challenges within the bawn of the Sun's Glory and she has never known any leader besides Guillaume.\nThe aging Silver Fang recently revealed a prophecy that she should be the next Sept Leader, which has terrified her. Silver-Howl is a capable warrior and a superb tracker but she does not think of herself as an alpha. Guillaume thinks she must somehow learn that a true leader is not always the strongest or the fastest, but simply the best suited to lead.\nHer indecisiveness so far has allowed the ambitious Black Fury Helen of Genoa to grow in influence over the Sept. If Silver-Howl doesn't act fast to counter her, the prophecy revealing her ascension will never come to pass."
 POD_investigate.desc.790737: "An insidious practice among the sultans who assumed the Ottoman throne was the slaughter of all male relatives who could pose a threat to their absolute rule. Thus, the women of the harem who had young sons feared for their children’s lives. So it was with the mother of young Mustafa. Whether or not her son vied for the throne was immaterial to her; she simply wanted him to live a normal life. She spent a fortune in bribes to have her baby smuggled out of the harem and to have a dead child buried in his tomb.\nWhat the woman didn’t know, however, was that the boy was taken to a Ventrue stronghold on Malta, and then was groomed and raised by ghouls there, solely for the purpose of being returned to Istanbul to take the throne from John Paleologus, a powerful Byzantine Tzimisce who continued to rule despite the Ottoman conquest. The Ventrue wanted someone under their control in the city, and what better person than a prince of actual Ottoman descent? Mustafa was quite agreeable to the plan; he was [Glossary('Embraced','game_concept_Embrace_desc')] and managed to retake Istanbul with the help of the Ventrue and a Toreador named Vashtai.\nBut then, his power and control started to wane. Mustafa grew content to sit on his past glory and let Vashtai handle daily affairs of state. She was more than happy to do this, the stark truth is that Mustafa is merely a figurehead for the true rulers of the city, the Toreador.\n\nFuture fate in Canon\nMustafa will be passed down as a figurehead from puppet master to puppet master, all the while never having any power of his own. In the early 21th century however, the sheer horror displayed by his new mistress will push him to finally try to act."
 POD_investigate.desc.790111: "One of the two rival Princes of Florence, Anicius is allied with the Guelph party and with Bandecca Manelli of clan Brujah, the patron of the popolo. His competitor Panfilio naturally supports the Ghibellines instead and visitors to the city try to avoid being drawn into their conflict. The struggle between them has driven out many Cainites from the city, leaving Florence's influence a shadow of what it could be in nightly Italian politics.\n\nFuture fate in Canon\nWhen the city's Ghibellines are expelled in 1258, the balance of power will shift in Anicius' favor. Panfilo himself refuses to leave the city, and dies at the hands of Anicius who leave him staked and tied to the Roman statue of Mars to greet the sun. Anicius will then enjoy Florence's prosperity and becomes an important Sabbat member until his death before the 19th century.\nHis afterlife won't be pleasant however. The shades of Anicius and Panfilio will find each other in the [UmbraGlossaryLocalized('shadowlands','Underworld')] and come together in a savage embrace. Whether it is their exquisite hatred, their mastery of the forces of Oblivion, or some other force of perdition that fuse them together, who can say? They are forever locked together, clawing and biting into eternity, like two event horizons devouring one another. They should not be. They should have each fallen, alone, into Oblivion. Yet the gravity of their mutual hatred pulls each to each, like two growths wedged and clogging the drain, keeping each other from slipping over the edge. In damnation, Panfilio and Anicius complete one another."
 POD_investigate.desc.791348: "巴斯城的古名为苏尔，亦是古威尔斯人、当地血族及其他神秘存在崇拜的神灵名。对那些踏上苏尔据点的人来说苏尔土地是神圣的，即便是遇到向来龃龉的人也能抛下流血的想法，打破斋戒并享受其他文化的传说。在罗马军队穿着凉鞋征服她前，苏尔一度非常重要，那曾是适于成为血魔法学者的美好岁月。\n罗马的显贵打着平安喜乐的旗帜欺骗当地凯尔特人。克劳狄一世的军队不知何故不受苏尔和平主义约束的影响。于是罗马通过欺骗和屠杀占领该城。他们仿照当地人向苏尔女神祈求，但跟自己信仰的密涅瓦联系上，最终合并两者，重命名该镇为阿奎苏利斯，意即苏尔之水。罗马人挪用此名以为侮辱。\n当马库斯·维鲁斯$pod_Embraced$退休禁卫军阿卡狄奥斯时，他也为巴斯创造了一位密特拉执政官。苏尔的至高女王一夕之间消失。她的名字曾是伊恩弗莱德，但她的$pod_clan$现在已从记录中删去。即使在今夜，伊恩弗莱德的密教还存在，尽管他们的女主人难以寻找。野心勃勃的不从者为了寻乐穿过沼地与城镇下方猎杀他们\n许多血族在这些追猎中失踪。"
 POD_investigate.desc.790428: "In his mortal days, Aimeric was a talented harpist, singer, and knight of Toulouse. After his $pod_Embrace$, he became a counselor and grandchilde of Esclarmonde, and found himself in the role of ambassador for the Courts of Love, playing a crucial role in the fall of Alexander, the longtime Prince of Paris. Aimeric was also sent to negotiate with the crusader Eon de l'Etoile and, after a very rocky start culminating in his capture, managed to convince the Breton Ventrue to join Esclarmonde's cause instead.\nAimeric also deployed considerable efforts to curtail his brother in blood Lozois' influence since the latter has been more and more troubled after Esclarmonde's alliance with the northerner Eon. He also started something of a relationship with his fellow knight Josselin de Poitiers but the two working for potentially competing mistresses didn't allow for more.\nHe met Veronique d'Orleans (or \"Vero\" as he calls her) before Alexander's fall and has found himself smitten by the earnest Brujah, something that he fears might interfere with his duties to Esclarmonde.\n\nFuture fate in Canon\nA vampire of many talents, de Cabaret will act as a soldier and diplomat for Veronique after Esclarmonde's fall, rumors holding the two became lovers.  These tales led to his distancing himself from her court, becoming an Archon in 1835, primarily operating in East Asia.\nVeronique taking control of Macau's princedom will ironically bring them closer together once again, showing to Aimeric that fate (and love?) can't be easily escaped."
 POD_investigate.desc.791415: "Tancred (or Saleh, as his parents in Cordoba knew him) was a bodyguard for his [Glossary('Sire','game_concept_Sire_desc')], the Muslim Lasombra potentate Ibrahim, for many decades before being sent to infiltrate the fanatical Christian zealots of the Lions of Rodrigo. Posing as a mercenary, he joined the forces of the Prince of Barcelona and performed credibly, showing skill and a taste for bloodshed as he has been told to. It took almost a decade, but Tancred got his opportunity to join the Lions.\nEver since, he has been manipulating them to be as dangerous to their side than to his own. It was Tancred that pushed the Lions' leader, Felipe, into targeting Christians supposedly \"lacking in faith\". A no small number of his sire's enemies (not all Christians) have also suddenly become very important targets for the Lions.\nWith the Reconquista going more and more in favor of the Christians despite his best efforts however, Tancred is now gathering all his resources in preparation for his role in whatever Ibrahim deems fit to do next."
 POD_investigate.desc.791328: "Born in Baghdad, Nasir was reborn as Sutekhuser when Set found him. Before this event, Nasir was a nobleman's son, a dabbling scholar and a failed poet. Only the strength of his conviction was able to attract the attention of the Followers of Set.\nOnce immortal, Nasir made his unlife purpose to track down the Book of Hidden Stars, a fabled tome rumored to contain accurate prophecies of the future. From Ctesiphon to Constantinople, Nasir painfully uncovered the stories of these tablets that were later compiled into the elusive book. The trail has lured him to Tunis, where he now must contend with an uncooperative clanmate and the hostility of the powerful Elders of the city.\n\nFuture fate in Canon\nNasir will navigate Tunis' night with skill and guile. He will leave the city with his clanmate dealt with, the Elders grateful for his assistance and, most importantly, the book he was looking for in his hands."
 POD_investigate.desc.792046: "内布玛阿特苏泰赫是一位精通赛特血律的高手，凭借这一律能的精湛造诣，她能够召唤塞特曾帮助拉抵御怪蛇$glossary_wyrm_apep$时所欠下的债务。当拉在穿越[UmbraGlossaryLocalized('shadowlands','冥界')]时，阿佩普试图吞噬他，塞特曾为拉提供了保护。\n尽管后来奥西里斯命令拉诅咒塞特，但塞特的后裔仍可以在巨大的代价下，唤起曾经存在于拉和他们始祖之间的联盟。当内布玛阿特苏泰赫于数十年前从$pod_torpor$中醒来时，她证明了这一传说的真实性，向纷纷聚集到她身边的追随者展示了她的力量。"
 POD_investigate.desc.791154: "从实力上来看，查库塔无疑能比拟长者。但他自己也完全糊涂了，几乎不知道自己身处何时何地。他并不熟悉伊斯兰教的教义，还说自己是吃了外国人的舌头才学会伊斯兰语的。\n他力量强大，是一位出色的哲学家（比一般宗教的胡言乱语有趣得多）。\n即使是强大的法纳扎无法将查库塔控制在自己的宫殿里。他晚上在城市里游荡，热衷于吞噬路过的吸血鬼或与它们交谈。\n查库塔滔滔不绝揭示了有关自己的一些真实身份。他是来自伊费王国的约鲁巴人。在猎人的狂怒唤醒他之前，查库塔在$pod_torpor$中度过了漫长的岁月，他甚至怀疑猎人比他年长得多。查库塔声称自己没有任何家族，这让他感到非常尴尬。几个世纪以来，他拥有许多头衔，其中包括缠戈，赞戈还有桑戈。\n\n其在原作中的未来命运\n某个夜晚，查库塔的家族将以“桑戈”之名，成为非洲莱本强大的组成部分。"
 POD_investigate.desc.790150: "Cocceius was born as the son of a slave and a Roman senator. His mother raised him to hate the Romans for enslaving her and after her death, Cocceius asked to be transferred to the arena to fight as a gladiator. During the training, Cocceius met with a Greek slave named Yorgos, who became his mentor and tutored him in several languages. When Yorgos was slain in combat, Cocceius doubled his efforts and after forty years of service in the circus, he had enough money to buy his freedom.\nAs a freedman, Cocceius worked to enter politics to reach his former master. To his misfortune, the senator had received the $pod_Embrace$, and after an Cocceius' attempt to take his life had failed, the vampire visited and drained him. Cocceius was saved by a political rival of the senator, a Brujah named Dysos. The two left Rome and traveled to Carthage, until the Punic Wars reached the city. Cocceius fought in its defense, but was forced to flee.\nHe hunted the senator to the city of Aquis (which would be later known as Aachen and Aix-la-Chapelle), where he undertook the work of undermining his influence by supporting Charlemagne and the Merovingians. When the Roman vampires tried to leave Aquis, Cocceius was ready and killed his former master.\nCocceius resided in the city until the coming of the Messianic Voices. Reacting to the presence of the magi within the city, the Brujah mobilized several Cainites against them, but found that he could not stand against their magic. Cocceius was sent into $pod_torpor$, in which he rested until two hundred years later. Using his influence, he undermined the ruling Trinity of Cainites and installed himself as Prince after a covenant of Baali was uncovered in their midst.\n\nFuture fate in Canon\nCocceius will rule Aachen until his Final Death at the hands of his rivals, in 1647."
 POD_investigate.desc.792827: "Part of the Salubri Warrior caste before Samiel's last battle on Earth, Xavier was entrusted with a part of the Code of Samiel before his [Glossary('Sire','game_concept_Sire_desc')]'s departure for his last mission, showing the respect he enjoyed from him. Samiel's death shook Xavier to his core however and the warrior drifted hollow for a while before finding a new cause to believe in, the nascent Christianity. Soon however, Xavier came to despise the Church as an organization for misinterpreting God's message for its own temporal goals.\nAs such, the warrior wanders across Europe, enacting his deadly vengeance against the Baali and the Tremere who destroyed his clan. He finally found common cause with the Order of the Bitter Ashes, trying to reconcile his faith with his duties to his dead sire and clan. His legend grows, and Princes are starting to fear his coming, indicating that a Baali infestation could be taking root in their city.\nAachen has been his last target, leaving the city purged of its Baali conspiracy and some more ashes to collect for Xavier's growing collection.\n\nFuture fate in Canon\nXavier will move to France and, according to some, fight a terrible battle against a truly evil foe. He will never reappear afterwards."
 POD_investigate.desc.791453: "Born in the early 10th Century in a small village of Southern Poland, Kazimierz's family was one of the first to adopt Christianity. Fascinated with the concept of eternal life after death, Kazimierz joined the Benedictine as an enthusiast new convert. Learning all that he could from his fellow monks, he drew the attention of a Cappadocian scholar who [Glossary('Embraced','game_concept_Embrace_desc')] him.\nAt first horrified by what he had become, Kazimierz came to terms with it, relishing the opportunity for an eternity of studying. Moving to Krakrow, he took residence in the crypts behind an abbey where he tends to the dead and their (sometimes) restless spirits. So far, Kazimierz has not made his presence to Prince Razkoljna known, but is growing concerned about the tunnels network he uncovered behind his crypt. Sensing something terribly evil here, he is debating trying to uncover it himself or ask for help.\n\nFuture fate in Canon\nKazimierz's desire to cleanse the mine of its malevolence leads him to a confrontation with Gutka. His power is no match and he becomes her finest sculpture. He remains entombed in salt (and $pod_torpor$) until his discovery in the 17th century by a team of Giovanni ghouls. Recognizing him for what he is, the ghouls bring him from darkness into the light."
 POD_investigate.desc.791351: "From far-off Ireland Mikkel came to Bjarkarey to find a place where his terrifying violent rages would not hamper him. Here, they bring him great honor in battle and laughter in court, and he likes it.\nHis violent episodes make him the most feared and hated $pod_cainite$ in the domain among the mortal population, most of whom have lost someone to this Gangrel. More than any other thing, his unprovoked spells of rage cause discontent among the kine, and push them towards rebellion.\nSo far, Queen Valborg has shown no signs of caring about this issue and Mikkel sits at a position of honor during her raids, and oversees the patrols and defense of Bjarkarey when staying in land."
 POD_investigate.desc.790941: "科班是在其未来[Glossary('尊长','game_concept_Sire_desc')]——诺利兹袭击村庄下的几位幸存者之一。那个恶魔强迫村民相斗以供娱乐，而村庄的占卜师之子——科班是最后的胜利者，顽强地反抗那不死怪物早已安排给村民的命运。\n被逗乐的诺利兹初拥这名青年便离他而去。尽管如此，科班却迅速在军督领中晋升，用父母传授的知识来推进库都魔术。当君士坦丁堡的棘秘魑们试着在特兰西瓦尼亚立足时，他抗衡之并最终屠杀了其领袖祖博尔。\n身为能力出众的统治者和督军，科班却一举一动都根据隐晦的神秘仪式。一些血族认为这是其弱点，但科班已在军督领谋得一席之地，就连诺利兹现在也密切关注他。他最近赢得对托斯家的竞争，这也是他跟著名的迈卡·维科斯第一次交手。\n\n其在原作中的未来命运\n在大反乱时，科班将与迈卡·维科斯并肩对抗诺利兹直到其尊长毁灭。讽刺的是科班稍后也将死在自己其中一个子嗣手里。"
 POD_investigate.desc.790403: "A firm believer in the fight between light and darkness, Amalia understands through the Bogomil teachings that she is a creature of darkness but that salvation is always a possibility. Her encounters with the preacher Pätryn have deteriorated the sanity of both of them however. Patryn became fascinated with the world of the undead, and soon became Amalia's ghoul, while Amalia herself now believes she must free all Bulgarian Cainites from their sins. Some, she hopes, will confess and repent but she knows that the others might have to be persuaded by more... extreme means. And for those truly lost, the cleansing light of the sun will be their last hope.\nThe top of Amalia and Patryn's purging list is none other than Bela Rusenko, childe of Amalia herself. They have noticed the descent of the failed childe into infernalism of the darkest sort and already know that only fire can save his soul.\n\nFuture fate in Canon\nAmalia and Patryn's descent into darkness will continue until Amalia accepts her place as the goddess of a cruel death cult that excels in bizarre tortures. Both her and Patryn will meet their ends during the Giovanni's orchestrated purge in the 15th century."
 POD_investigate.desc.790684: "Irina was born and raised in a small village in Macedonia ruled by a Tzimisce, Radovan. Everyone in town knew he was a vampire, but it was of little concern, as the village prospered due to his influence. Irina was a beautiful child and grew to be a stunning young woman. She caught the lord’s eye and he made her a ghoul at age 17. To be chosen by Radovan was among one of the greatest favors he could bestow on the lowly villagers, and her family was pleased to see her go. Irina was not as thrilled as her family by the prospect of being Radovan’s eternal slave.\nIrina did not suffer under Radovan for long. He kept her for only fifty years before Embracing her. He then tired of her company and sent her out into the world. Irina did not waste her newfound freedom. She traveled all across Europe following scholarly pursuits.\nWhen the Tal’Mahe’Ra contacted her, she had already started a large library on the nature of vampirism, Caine, and Lilith. It didn’t take much to convince her to join their ranks, especially since Radovan had joined only 100 years earlier in hopes to help stamp out what he referred to as the Vicissitude scourge. Her interests mainly lay with the Bahari and the study of Lilith’s role in the vampire nature."
 POD_investigate.desc.790783: "Showing the exterior of a highly efficient and experienced agent to many prominent princes, Anna Petrova hides her raw cruelty behind a carefully crafted facade of calm. Few know the real Anna however and the sheer contempt she has for humanity (or her delight in exploiting them) is still a secret for a world at large. She intends to keep it that way, no matter the cost.\n\nFuture fate in Canon\nAnna will prosper, becoming one of the most respected Archons of the Camarilla, even earning the honorific of Praetor. She will align herself with a vast conspiracy seeking to enslave humanity (with a touch of infernalism on the side) before being discovered by Theo Bell in 2003. Tricked by the prince of Denver, she will be staked and left to greet the sun."
 POD_investigate.desc.791142: "Yesugei was the son of Bartan Baghatur, who was the second son of Khabul Khan. Khabul was recognized as a khagan by the Jin Dynasty. After the Khamag Mongol confederation khan Hotula died, the confederation had no elected king, but de facto Yesügei ruled the confederation.\nHis major mark on history was to be the father of Temujin, later known as Genghis Khan. When Yesugei was on his way home after leaving Temüjin with Borte's family, he noticed an encampment where the Tatars were celebrating a feast. He wanted to join their feast, but he knew he can not reveal his real identity since he was known, among the Tatars, as the person who killed their relative (called Temujin Uge) in a battle eight years earlier. Yesugei tried his luck but someone recognized him and offered him poisoned food under the guise of hospitality. Although quite ill, Yesugei managed to escape back to his family's camp.\nFor his relatives, Yesugei died three days later. For the [Glossary('Anda','podgloss.anda')] however, he was [Glossary('Embraced','game_concept_Embrace_desc')] before his end.\nDecades later, while his son having achieved the conquest of the greatest empire known to man was finally lying in his deathbed, Yesugei offered him the Embrace. Gengis refused however, and soon went quietly into the afterlife."
 POD_investigate.desc.792112: "One of the oldest vampires in Jerusalem, Abraham arrived around 450 BCE. While he left the city for some extended periods of time, he has basically been in residence for seven and a half centuries. For more than 400 years, Abraham's focus has been the studying of the Black Torah, a scroll supposedly penned in white ink on blackened parchment and which contains noncanonical revelations by the prophet Elijah.\nDespite hundreds of notes and the $pod_Embrace$ of promising students, Abraham is still far from mastering the subject matter. He has a firm belief that faith, struggle and death have far deeper meaning in the Holy City than anywhere else. Understanding the place of death in the universe, and perhaps his own place in unlife, is all that truly matters to him and he is aware that most think him mad at this point.\nAbraham doesn't care, and opens yet another book in his traps filled library every night, hoping that the key might finally be here.\n\nFuture fate in Canon\nAbraham fades into obscurity in the coming years which allows him to survive the Giovanni's purge. He resurfaces as a Harbinger of Skulls in the modern nights, still tending to his labyrinthine library."
 POD_investigate.desc.792136: "与卢修斯有着同样的责任感和勇气，勒弗鲁伊在西吉贝尔特统治时吸引到[Glossary('尊长','game_concept_Sire_desc')]的注意。他不可动摇的信仰引起卢修斯的兴趣，不久便利用他作为尝试媒介，以应对自己对于天主教越来越多的疑问。勒弗鲁伊乐于促成此事，很快便将卢修斯带进自己正义信念的道途，而后是十字军行动。至今终至耶路撒冷，勒弗鲁伊代表卢修斯处理军政，但私底下经常不满尊长对于异教徒的宽容与外交方向。勒弗鲁伊是真信者，在他的世界观不存在灰色地带。\n\n其在原作中的未来命运\n就像其尊长，勒弗鲁伊将在魔宴反乱伊始被维塞林[Glossary('吸榨','game_concept_diablerie_desc')]。"
 POD_investigate.desc.790147: "被称为西布莉的怪物在克诺索斯迷宫的黑暗回廊中被初拥，该地是巴力有史以来的最大要塞。她是自称为衰旦的内尔伽勒的子嗣。第二次巴力大战随着泰拉火山的爆发结束，西布莉是少数幸免于难的巴力。同族的摩洛背叛他们，因此她对他及其子嗣的仇恨无穷无尽。\n她在希腊社会作为生殖女神巩固势力以等待时机。当马其顿腓力二世开始向希腊发起征服时，他与伊庇鲁斯的公主——波吕克塞娜缔结了政治联姻。然而对西布莉密教而言，她是以教名茉特尔为人所知，茉特尔晋升为腓力二世的王后使西布莉得以发挥巨大影响力。她将成为古典世界最有权势的女人之一——亚历山大大帝的母亲。西布莉初拥她，而后她将以佩塔尼奎亚闻名于世。\n两百年后，西布莉重现于世并伪装其血系以便支持罗马梵卓对迦太基的歼灭。在那座腓尼基城市，特洛伊尔和摩洛意图建设出足以匹敌第二城的$pod_cainite$乌托邦。正是西布莉的仪式永远禁锢两者于迦太基撒了盐的土地之下。其后她又再次消失，据称前往克里特岛的克诺索斯废墟。\n传闻西布莉会在一千年后在哥拉汛的易卜劣斯至大的献祭坑最后一次现世，来帮助安纳齐尔及其他巴力用渴血诅咒降祸予阿刹迈。西布莉自称是纳姆塔尔的仆从，也许就像她的尊长一样最终成就了魔性。"
 POD_investigate.desc.792751: "When a foolish Banu Haqim Vizier gave the $pod_Embrace$ to a trio of sisters, all priestesses of Bacchus, who had gifts of prophecy, he should have conducted better research. Indeed, the sisters made their best prophecies with the entrails of still warm subjects and they merrily used their [Glossary('Sire','game_concept_Sire_desc')] withered innards to better understand their new condition.\nThey continued their usual practices for two centuries until a Banu Haqim sorcerer gave them a more thorough introduction to their $pod_clan$. Visiting Alamut and (after making many Banu Haqim uncomfortable by talking about their body's \"prophetic potential\") the sisters choose to become judges... something that the then male dominated Haqimite society took with derision and mockery.\nThe sisters bade their time, and contacted fellow daughters of Haqim in the hopes of creating an informal society, the Sisterhood of the Erinyes. Its influence has waxed and waned during the centuries, mostly depending on Alamut's current stance on women, but the sisters still act as judges to those who accept their authority... and to a number of those who don't.\nSoftening with the centuries, they are now more attuned with a roughly mortal human compass, which has helped making them attractive to younger daughters of Haqim.\n\nFuture fate in Canon\nThe Sisterhood will endure and will naturally align with Al-Ashrad schismatics during the breaking up of the Banu Haqim. No sane sister is known to acknowledge Ur-Shulgi as anything other than a madman."
 POD_investigate.desc.792752: "$POD_investigate.desc.792751$"
 POD_investigate.desc.792753: "$POD_investigate.desc.792751$"
 POD_investigate.desc.790996: "The Black Mother, also known as the Old Lady of the Ravnos and Marizhavashti Kali, is the first childe of the Ravnos Progenitor. She became famous for her perception and understanding of all layers of reality, and was a renowned prophetess. The stories say that she could sense the deepest inner thoughts of an individual from hundreds of leagues away, and kept a list of sinners and saints among her peers.\nAfter she abandoned Zapathasura and his war, her [Glossary('Sire','game_concept_Sire_desc')] ordered her name stricken from all records – therefore she is often confused with Kali Ma, the Hindu goddess of death, destruction, and the end of the world.\nShe was prepared for the coming of Alexander the Great and Embraced one of his soldiers, Phaedyme. She accompanied her childe and traveled Europe for centuries, finally establishing herself in southern Gaul. During this period, Kali's visions became overbearing and she almost succumbed to her Beast. A Salubri healer, Dushyanta, found her during the 1st century and started trying to heal her broken mind. To achieve such a feat however, Dushyanta had to see for himself the visions plaguing Kali and has been threatened to lose his own sanity because of them multiple times.\nStill, the healer endured, and after more than a millennium of care, he is almost ready to awaken the (hopefully healed) Ravnos Methuselah.\n\nFuture fate in Canon\nKali will survive the difficult times to come and when her two siblings finally reconcile, she will be their first target to finally bring back the Ravnos together."
 POD_investigate.desc.792772: "Decarabia refers to himself as the Great Marquis of the Christian Hell, though he is undoubtedly more venerable than that faith. The demon claims to lead legions of diabolic minions, and to understand the secrets of poisons and alchemy. He has mastered the ability to shift form between humanoid, a flock of birds, and a pentagram tattoo on the skin of his summoner.\nWhen appearing as a humanoid, the Marquis’s brown skin radiates a sick, grey mist. He stands tall and broad like a woodsman, hefting a great, bloody axe over his shoulder. Across his face, the Marquis wears a bone visor comprised of the fingers of a dozen children. He speaks with a rich accent, fluent in every language and happy to converse about any subject.\nAccording to the Marquis, he escaped a labyrinth in which thousands of his kind are held. The veracity of this claim is hotly disputed and researched by infernalists, many of whom have been led to Hell by the Marquis in search of his peers. No infernalists who accompany the demon return to the world of the living."
 POD_investigate.desc.792695: "黑森林圣地由血拳族群占有，其领袖——洛克什·雷嚎以单枪匹马摧毁一群试图定居该森林的扭曲怪物而成名。部族的眉月狼骄傲地宣称在他生时还会有更伟大的成就，而他的死甚至更光荣。这些预言只加剧了洛克什的自尊心……还有向外界挑战来增添自身传奇色彩的意愿。"
 POD_investigate.desc.792426: "A childe of the Inquisition years who first saw the potential return on investments in the back end of new industries and ventures, he is an aide to Hardestadt and travels throughout Europe as a part of Democritus' retinue. He ushers in the era of wealthy Ventrue, gaining the clan's modern reputation as the richest of clans. However this newfound wealth somewhat backfires, as it serves to reinforce the division between the Ventrue and their antitribu counterparts in the Sabbat.\n\nFuture fate in Canon\nKross will be a pioneer in the art of investment into new industries, mainly in the Netherlands, where he will build up his domain and manage to amass a fortune with sea trade. In the meantime, his childe Juan-Miguel Ramirez will duplicate his successes in Spain, an investment that will literally paid off in tons of gold diverted from the Spanish Empire.\nIn the 19th century Hardestadt and other prominent Teutonic Ventrue will follow after the models that Kross had established, taking advantage of the growing industrial movement and nationalist sentiment.\nKross will leave Europe in the decade following World War I, and focus instead on new avenues and industries in the United States. However, his childe Juan-Miguel Ramirez will be quick to back the growing fascism movement in Spain, just as other young Ventrue where doing the same in Germany and Italy. Later, Kross will work with other Ventrue leaders such as Lodin to help stem the tide of Anarch power during the first spread of the Anarch Free States.\nIn the wake of the Final Nights, Kross will join a movement within his Clan’s Elders that center around finding and awakening lost Methuselahs of their Clan, mainly legendary figures like Camilla or Lysander in the hopes of finding a charismatic leader as an alternative to the shadowy Ephorate."
 POD_investigate.desc.790210: "A mysterious childe of Lasombra himself, Khanom Mehr's origins are shrouded in mystery. She never interferes in politics and the few that actually know of her existence wager that she is serving as Lasombra's bodyguard or some other form of ceremonial role. There is also the matter of her being a woman, while Lasombra is known to have said to have never [Glossary('Embraced','game_concept_Embrace_desc')] one, leading some to believe that she is might not be a direct childe but instead a diablerist.\nWhatever the truth of all these mysteries is, Khanom Mehr stays in the Castel del Ombro night after night, accomplishing a purpose only she knows about.\n\nFuture fate in Canon\nKhanom Mehr will defend Lasombra during the Anarch Revolt and Gratiano's invasion of the Castel. Despite claiming the life of many attackers, she will fall to them all the same."
 POD_investigate.desc.791014: "Perhaps the greatest warrior remaining to the Salubri, Nuriel was a champion dedicated to Mithras during his life, and caught the attention of his [Glossary('Sire','game_concept_Sire_desc')] after the two battled each other – his Embrace became the stuff of legends among younger generations of Salubri. All seek to become the \"next Nuriel.\"\nThere is an abiding hope among the Salubri that Nuriel might be the one most likely to assume a mantle of command such as the one Samiel once bore. He however gives little credence to such matters when inquired of him.\nHe is also known to have codified the history of his caste, though some debates have arisen about the extensiveness of his work with the sudden appearance of the mysterious Qawiyya el Ghaduba, a direct childe of Samiel, in Jerusalem."
 POD_investigate.desc.791290: "Aurelius Flavius Iovianus's life story is one of unending tragedy. A scholar of the powerful Iovianus merchant family in Rome, he lost his wife and children in the great fire of 64. Devastated, he turned to Necromancy to try to contact their souls... but soon realized they had been already consumed by his elder brother, the patriarch of the family, for a petty power gain.\nThen his best friend died, brutally murdered, and Aurelius took his friend's young daughter under his care.\nShe got murdered a year after.\nAurelius finally understood the depths of his brother's cruelty but was powerless to stop him. While he was awaiting for his own death, he was saved by the soul of his best friend's daughter, Titia Sabina, who took her revenge on her murderer. Aurelius' trials weren't over however.\nEmbraced by a callous Cappadocian who wanted Titia's powerful soul for his own, Aurelius managed to escape with her ghostly help and fled Italy. Aurelius then bound Titia's soul to his treatise on Necromancy, the Codex Mortis, to make sure she could withstand the dreaded oblivion always looming for restless spirits such as hers.\nAurelius lived as a hermit for centuries before learning that the descendants of his brother's line, the Giovanni, have been welcomed into clan Cappadocian. Hated and hunted down by the both of them, Aurelius knows that his days are numbered but Titia's spirit, now an impressively powerful wraith on her own, has so far succeeded in defending him against those that managed to find him."
 POD_investigate.desc.791391: "Once a qadi in Egypt, Umar moved west early in his unlife to the Atlas Mountains and the Maghrib. There he saw the potential in the Berber people and decided to use them to further Alamut's goals and his own power. Convincing his superiors that the Almoravids invasion of Iberia was a great opportunity, he led the first big influx of Assamite warriors into the peninsula. Soon, Umar arrived to Cordoba as a potential new great leader.\nUmar managed to smartly shift his support from the Almoravids to the Almohads when they took power over his former partners. For a time, Umar might have been the most politically influential $pod_cainite$ in Al-Andalus for decades, but his fortune didn't last. His patron in Alamut, the vizier Khaldun, lost his position and Umar lost most of his clan support alongside him. The Almohads proved ineffective in rallying the Iberian Muslims' against the Christian Reconquista as well and Umar decided to shift his focus to damage control.\nHe gave his support to the Lasombra Badr in her takeover of the Midnight Crescent hoping she would prove a generous patron if she won... or a hopeful scapegoat if she doesn't. In the end, Umar only cares about power and playing the long game doesn't bother him."
 POD_investigate.desc.790501: "伊玛在大洪水前[Glossary('初拥','game_concept_Embrace_desc')]。曾为学者的他公正地对待血畜，而不是追随其尊长的猎杀。他以与诺亚类似的方式预见大洪水，并撤离到地下洞穴来度过灾难。\n伊玛的命运有两种矛盾的传说。其一是诺斯费拉图的氏族诅咒撕裂了他的心智，令其在充满作为食粮的动物与人类领域中发狂残喘。另一则是该隐深情地回忆起玄嗣并宽恕了他，使他成为唯一没有受到诅咒的诺斯费拉图。许多诺斯费拉图耗费亡生尝试找出伊玛并得到他的血，因为据称只有伊玛的血能够治疗诺斯费拉图的丑恶外表。\n对于伊玛有无受到氏族诅咒有大量的辨论。光是诺斯费拉图的玛土撒拉没有受到诅咒的可能性就足以在氏族中引发无休止的争论。归根究底，伊玛之于诺斯费拉图就像圣杯之于天主教骑士。"
 POD_investigate.desc.792430: "Ionna is a remnant of the Greek presence in Egypt: a native Greek, born in the early 7th century, as Byzantine rule was waning. She, like so many other Toreador, was [Glossary('Embraced','game_concept_Embrace_desc')] more as an act of whim than intent, and her already breathtaking beauty was only enhanced after her Embrace. However, she possessed a keen mind and proved herself to be far more than mere pulchritude.\nFor centuries Ionna was a member of Alexandria’s primogen, counseling Marcellus as she saw fit. At the same time, she undertook to learn as much about her world - both mundane and supernatural - as possible, and she claims to possess many books from the Alexandrian Library, currently thought to be either lost or destroyed.\n\nFuture fate in Canon\nIonna will take over as Prince during Marcellus' absence in the early 20th century. She will not enjoy the role much however and after Marcellus' confirmed destruction, she will relinquish the title and instead retreat to her elaborate - and exquisitely tasteful - subterranean complex where she will spent her nights in study and meditation."
 POD_investigate.desc.791184: "萨拉皮翁古老得难以衡量，他早在哈维耶人出现的数千年前就已经存在。这位存在遍历了非洲大陆的广袤土地，漂洋过海来到波斯和欧洲，但其对后者印象不佳。\n当萨拉皮翁回到家乡休息时，凡人在它的头顶上建造了萨拉皮翁城，并从那时起它便感受到自己与这个地方的联系。萨拉皮翁引导着这片领地从其最初形态走向后来辉煌的摩加迪沙，并操纵阿刹迈推翻了它曾经的（且不知情的）拉曼加管家。\n萨拉皮翁不与当地的吸血鬼见面，它们在它眼里如同蝼蚁，但这位存在的梦境确实渗透进了它们的噩梦。\n萨拉皮翁仍然清醒。依然活跃。该存在不承认自己的血统或世系，提到“斗日者卡根”只会引来它的苦笑。这位莱本是古老且不可估量的。即使在非洲的广袤土地上游荡，它仍然称摩加迪沙为家。\n萨拉皮翁对摩加迪沙的影响微妙而持久。它是通过阿刹迈和拉曼加术法涓涓流下的陶醉毒药，造成了像癌症一样扩散的朦胧瘴气。它是拒绝接受真主的耳语，让赛特和古鲁希的崇拜在夜晚中滋生。它是非洲真正的统治者，摩加迪沙是其皇冠上的明珠。"
 POD_investigate.desc.792820: "Born to the Batavi tribe, Volker learned early in his life to sell his allegiance and became a renowned mercenary. Working for the Franks, he fought in a disastrous battle against the Langobards and was rescued by a vampire impressed by his battle prowess.\nVolker never retrieved his lust for battle after this fateful night and instead decided to work in the shadows, a task well suited to his clan. He quickly proved adept at it and his lack of allegiance between the various factions (besides his own people) makes him the most respected information broker (or spymaster at times) of Aachen.\n\nFuture fate in Canon\nVolker will be content with his new life and continue for centuries until Napoleon's invasion of Germany. He will serve as a mediator between the invading French Cainites and the local German ones. After Napoleon's defeat, he will be accused of betrayal by the unforgiving prince of Berlin, Gustav Breidenstein, and apparently forced to flee to Paris.\nSome whisper however that this is just a ploy, and that Volker is using this story as a cover to spy on the powerful prince of Paris, Francois Villon."
 POD_investigate.desc.791317: "Once a minor Ethiopian prince, Mararah was [Glossary('Embraced','game_concept_Embrace_desc')] by the Roman Octavius who was intrigued by his ambition and crafty mind. The Ventrue was honest about what vampirism would entail and said as such to Mararah: \"I can only promise struggle, servitude, and a painful end. Eventually. What we carve out between those times is all ours.\"\nThat painful end came quickly for Octavius however as they were both summoned by the then prince of Rome, Andronikos. The callous but politically weak ruler saw an opportunity to affirm his power and sentenced his elder to a painful final death on the grounds of unauthorized Embrace. He then exiled Mararah, claiming that a \"mongrel lord\" from a land never touched by Rome could never be fit to be a Ventrue.\nMararah choose to bid his time and found counsel in his fellow foreigner Pelamina. Together, they devised a plan. Mararah started feeding information about Andronikos' supporters to Rome's hunters, resulting in many deaths and unease among the local Cainites. He then used what he learned about those hunters to deal with them conclusively, while bringing some of them to his side.\nIn the end, Mararah marched on Andronikos' palace with the proof of the Prince's incompetence and the proof that he alone dealt with the results of this incompetence. Andronikos had no choice but to acknowledge Mararah as a full fledged member of clan Ventrue, knowing full well that his tenure as Rome's prince was now on borrowed time.\nFinally properly acknowledged by his peers, Mararah is poised to show the Cainite world what it means to be young, gifted and Ventrue."
 POD_investigate.desc.791471: "A venerable lorekeeper of the Road of the Beast, \"Grandfather\" is a bard and a priest all at once. A wizened figure, he looks like an old man but springs like a hunting cat with slitted eyes and fur covered arms and hands. His mind is sharp and his wisdom considerable, making him a respected mentor to newcomers to the Road and an advisor to powerful pack leaders such as Qarakh of Livonia.\nGrandfather is known to be fond of mysterious tests, pushing neonates to find answers for themselves and speaking in riddles at times.\n\nFuture fate in Canon\nGrandfather will be critical in helping Qarakh and the ferals of Livonia fight against the Black Cross' invasion. During the climatic battle however, he will be decapitated by a frenzied Wilhelmina as he was trying to help calm her down."
 POD_investigate.desc.791354: "这个看似由坚实的大理石构成的奇怪生物在某一天夜晚从海中浮现，自称是大天使以色列。它提供了圣餐，许多人喝下了掺有它精血的杯中之物。从那以后，以色列多次现身，总是公开露面，总是提供它那盛满鲜血的圣杯供人欢饮，而瓦尔普尔加女王的手下始终未能抓住它。  \n事实上，以色列知道自己并非天使，但它相信只要自己从事天使的工作，二者之间的区别便无关紧要。它赢得了许多追随者，却没有盟友。有传言称瓦尔普尔加女王圈子的成员也参与了以色列的圣餐，但目前看来这似乎只是传闻。然而，以色列的时间不多了——瓦尔普尔加女王已经放出话来，任何杀死这个“天使”的稚子将赢得她的青睐。野心勃勃的团体决定为自己争取一位长者级别的靠山，只是时间问题罢了。"
 POD_investigate.desc.790863: "Curaferrum grew up under the name of Yan in Minsk. His older brother, Frantsyk, was a traveling merchant who traded with reliquaries. Yan entered his brother's business and soon learned that some patrons were interested in more than saints' bones; they also sought other rare pieces, like unicorn horns, basilisk venom, and similar exotic goods. After his brother was killed in 1125, Yan focused solely on these goods. Through a client's tip in 1128, he learned of a chantry in Transylvania, Umor Mons, that would buy all of his relics. When he arrived, Yan managed to persuade one of the local magi, Iusta, to take him as an apprentice. He renamed himself Curaferrum.\nWhen Umor Mons was destroyed by Tzimisce in 1135, Curaferrum was among those that fled to Ceoris. Here, he cut ties with the mages from Umor Mons and instead cultivated a friendship with Etrius. Etrius, glad to have a capable supporter in the hostile climate of Ceoris, revealed the conspiracy within House Tremere to him. Curaferrum accepted and Etrius chose a [Glossary('Sire','game_concept_Sire_desc')] for him to be Embraced. Only six years later, he appointed him as Castellan, against the protests of Malgorzata and her supporters.\nSince then, Curaferrum serves House and Clan faithfully, although his insistence of rank makes him the subject of mockery within Ceoris, with both mortals and vampires shunning him.\n\nFuture fate in Canon\n In 1250, due to an intrigue of Malgorzata, he will be stripped of his office after a Gangrel penetrated Ceoris and nearly managed to reach the inner chambers. After five years of periodic torture, he will be officially forgiven by Tremere himself, and reinstated as the castellan. He will fulfill this office until the Gargoyle Revolt hit the chantry. Curaferrum will be diablerized by the leader, Virstania, as a sign of disdain against the Pyramid."
 POD_investigate.desc.790839: "No one would describe Caelestius as a quiet or timid man. In his youth as a lay monk, he spent more time arguing over religion than actually studying it. With his stubborn insistence, he gained a reputation as a man counted on for a night of heated debate. It was then that he met Pelagius, and Caelestius was impressed by the man's ideas and charisma and became his disciple.\nTheir heresy took root in Carthage but was soon under fire by the local clerical authorities and Caelestius refused to recant, ending with him being banned from clerical office. It was during this trial that he attracted the attention of a local Brujah and was [Glossary('Embraced','game_concept_Embrace_desc')].\nCaelestius quickly adapted to his new condition and merged his Pelagian leaning with the Noddist lore of the Cainites. He then boldly declared that he would travel to the Pope, present his theories and receive the Papal blessing. His [Glossary('Sire','game_concept_Sire_desc')] was the first to try to stop him and was left behind in $pod_torpor$ after a difficult battle. Learning of his plans, the Italian Cainites united to make sure he would never make it, as revealing vampires existence to the Pope would have disastrous consequences. So far, they have managed to hinder Caelestius enough to avoid that outcome, but never to fully destroy him.\nThe safety of all Cainites is actually in danger should he actually achieve his aims. The resources of various clans are being put on watch across Europe, as none know exactly where the Heretic might appear next. The only certainly is that the well-being for all of Caine's childer demands that he be stopped."
 POD_investigate.desc.790928: "Born as Solomon, the man who would be later known as the \"Dark One\" was always driven and dedicated. As Eugenio's most gifted childe, Montrovant showed early a disdain for Cainite politics and a tendency of doing whatever he pleased. This doesn't mean that he didn't care a lot for his clan's well-being but rather that he found other ways to contribute.\nMontrovant's goal in unlife was to be the Holy Grail. With its miraculous (rumored or otherwise) properties in his hand, he was convinced that clan Lasombra would ascend to the top of the Cainite world. And so he searched for it for centuries.\nHis best attempt came when he sponsored one minor French noble, Hugues de Payens, into creating what would become the Order of the Temple. Once in Jerusalem, the Templars stumbled upon the treasure cache of an old mummy that contained the Holy Grail among others. Montrovant was close to finally have it but was foiled by the mysterious ancient, Kli Kodesh, who toyed with him for his entertainment.\nMontrovant is now tracking down Kodesh around Europe, hoping to claim his prize and his revenge at the same time.\n\nFuture fate in Canon\nDespite his dogged determination, Montrovant will never find the Grail. Outwitted by Kli Kodesh several times in the coming centuries, he will end up as a sacrificial pawn in the mad Nosferatu's games."
 POD_investigate.desc.790273: "An influential Nosferatu methuselah, native to the ancient city of Rome, Trajan tried to establish his own realm beneath the city, but his dreams were shattered by local Ventrue. He blames the Malkavian Antoine Le Fanu for his downfall, and the two vampires are bitter rivals.\nHe went on a self-induced $pod_torpor$ until the 12th century. Upon waking, he realized that his plans had failed because he had lacked information on his enemies. Subsequently he wove an intricate net of spies, contacts, and informants which he calls \"the Net\".\nFuture fate in Canon\nTrajan will follow the activities of his Malkavian rival to New England and gain powerful allies there as well through the presence of his grandchilde, Stanford Warwick. The old Net will be connected to the SchreckNet and become one of the most important sources of information to clan Nosferatu."
 POD_investigate.desc.792855: "Born and [Glossary('Embraced','game_concept_Embrace_desc')] during the climatic events of early Christianity, Kli Kodesh's true origins are mysterious. What is known is that he was a fierce opponent to the Roman occupation of his Levantine homeland and, despite quickly understanding that he couldn't do anything about it, held a grudge against Rome and its heirs for all his existence.\n\nIt seems that he was the first vampire to drink (and survive) from the fabled Holy Grail, which explains his lack of deformities for a Nosferatu, his lack of need for blood and his ability to withstand the sunlight far more than usual. Armed with these powerful abilities, Kli Kodesh contemplated the eternity stretching in front of him... and only found boredom in the prospect. In his mind, nobody could truly challenge his newfound powers and, without challenge, there is no joy to be had in this immortal existence.\n\nHe thus decided to always seek entertainment instead of raw power to keep his mind grounded. Kodesh has thus been the perpetrator of intrigues ranging from the laughingly petty to the worryingly world shattering throughout the centuries, targeting all manners of mortals, supernaturals and organizations.\nHis latest scheme has been to orchestrate a Templar raid on a mummy treasure cache to disperse some old and powerful artifacts throughout the world and enjoy the chaos that will certainly ensue.\n\nFuture fate in Canon\nAfter having his fill of fun by manipulating the Templars and Montrovant, Kodesh will aim higher and usher a centuries long conspiracy to fulfill a prophecy heralding Gehenna.\nWhile he will ultimately succeed (and ends Montrovant for good in the process), the prophecy will turn out to be bogus.\nKodesh's reaction to his plot (that included manipulating millennia old mummies, vampires and engineering a blood plague) being for naught will be a characteristic shrug of his shoulders."
 POD_investigate.desc.790579: "In a time where the word \"Nabatean\" denoted a man as \"poor\" or even \"bastard\", they worked as faithfully and hard as they could, bowing before the Roman authorities, but also keeping true to the ways of their people. This was noted by a traveling Lasombra named Antipater, who began to take an interest in the people.\nWhen Petra was finally destroyed during an earthquake in 737 CE, this Lasombra saved one of the temple workers and took him under his wing to preserve the line of the Nabateans. As Antipater had converted neither to Christianity nor to Islam, his standing in his very clerical Clan was quite low. This brought them serious problems, when they were guests by a fellow Lasombra sultan of the Ashirra in Malaga. Antipater was challenged to a contest by the sultan in order to force his conversion and lost. When Antipater still declined any attempt to convert him, the matter was brought before the Amici Noctis, who put him between the choice of honoring his word and converting or facing Final Death.\nKnowing his [Glossary('Sire','game_concept_Sire_desc')] would never convert to a faith he did not love, the Nabatean temple worker, who had stayed silent through the matter, made a bold and decisive move. He offered his own unlife in exchange. To his surprise, neither his sire nor the sultan objected, nor even reacted with especial dismay. The sultan accepted at once, and sent word to the tribunal that the sire's verdict was to be voided, provided his Nabataean childe remained true to his word.\nAfter almost three centuries years together, sire and childe parted ways with nothing more than a lone knowing nod and a somber valediction."
 POD_investigate.desc.792129: "In 12th century BCE Tyre, Zaaru-Heyan earned a reputation for himself as one of the finest builders of temples in the world. The sacred spaces he planned, it is said, pleased the Gods more than the work of any other man. Rich, respected and doing what he loved, Zaaru-Heyan sadly contracted a mysterious illness that shrouded his mind and body with weakness. Finding no purpose in a life without architecture, Zaaru-Heyan walked to the sea to end it.\nIn truth, his \"illness\" was the result of a Toreador trying to leech off his creative humor through his blood. When seeing that his parasitic behavior brought Zaaru-Heyan to the brink of death, the Toreador repented, [Glossary('Embraced','game_concept_Embrace_desc')] the dying architect before arranging for him to receive instruction in the Cainite ways. He then departed, never to be seen by Zaaru-Heyan again.\nThe newly created Toreador adapted to his condition well, and became a shadowy patron to the many gifted architects of Jerusalem throughout the centuries. Sometimes, he plans a minor project himself and use a crafted persona to present it to the mortal world.\nZaaru-Heyan is now old and powerful but is still patient, contemplative and apolitical. As far as Jerusalem's Cainites are concerned, he is as much part of this city as the many buildings he helped create all those years.\n\nFuture fate in Canon\nHe will continue his quiet existence until the Renaissance. In 1555, his many assistants ghouls will tire of him never vying for power and will drain him dry of $pod_vitae$."
 POD_investigate.desc.790984: "In his mortal days, Pentweret was a minor bureaucrat for the Ptolemies who dabbled in the workings of the ancient magician-priests. A Follower of Set was attracted by him and blood bonded him to have an agent in the government of Egypt. He served his new master for 20 years, learning the philosophies of the Clan as well as Akhu. When he was finally [Glossary('Embraced','game_concept_Embrace_desc')], he was an honored member of the Clan, until he grew weary of the many layers of deception the cult of Set used to snare people in. He felt that, like other religions, that a message of salvation should not remain a mystery, but be accessible for everyone with the strength to endure its tests.\nHis first preaching attempt horribly backfired as a mob destroyed his temple and massacred his congregation. In hiding, Pentweret met Saulot, who sympathized with the Setite's message. He also assumed that Cainites were responsible for the mob, as most vampires feared Set and its teachings. Embittered, Pentweret swore to drop out of vampiric politics and devote himself to [golconda|E], which had several similarities to the original teachings of Set. And when he would finally achieve it, he would return to his Clan and show them the truth and no mysteries.\n\nFuture fate in Canon\nPentweret will join the nascent Hunedoara Inconnu in their search for [golconda|E]. He will be one of the few to not fall for the demon Nikanuuranu's tricks but will still be unable to escape like the others, leading him to growing despair."
 POD_investigate.desc.790960: "A young farmer and native of Jerusalem, Rashid hid when the crusaders attacked the city in 1099. Screams of terror and death echoed across the plain and had a profound effect on the young man, turning him from barely tolerant to ideologically obsessed. Rashid led a group of friends in vain attempts to hinder the Franks until he ran into a wounded Assamite warrior and tended to her.\nGrateful, she explained her state of being and Rashid eagerly joined in her unending fight against the Franks and their Western Cainites allies. Since then, little has changed for Rashid, always looking for the best allies and most efficient ways to kill the infidels. There is no place left for gray areas in his world.\n\nFuture fate in Canon\nRashid will prove too zealous for his own good. During the 16th century, the Banu Haqim leadership will disavow him and he will fade from history, never to be seen again."
 POD_investigate.desc.792062: "因从埃德萨的图书馆中偷走了圣书而被卡帕多西亚驱逐，勒森魃的学者托马斯逃往东方。在那里，他伪造了“阿特·陶姆”的身份，并出现在一位12岁的巴比伦王子——摩尼——面前。他向这位少年揭示了一项启示，告诉他自己是先知血脉的最后传人，并指引他在24岁生日时向世人显现。\n摩尼如托马斯所言而行，其创立的摩尼教迅速传播，直到波斯国王将摩尼作为危险的叛乱者逮捕。公元276年，托马斯在波斯监狱中对摩尼施以初拥，随后师徒二人沿着丝绸之路东行，与印度和中原的圣人交流学习。这一经历使托马斯的真实身份更加扑朔迷离，有人甚至强调他与托马斯·迪迪默斯（即所谓的“印度使徒”）之间的联系。"
 POD_investigate.desc.792858: "A mage in ancient Egypt, Astrokhen, like many before and after him, longed for true immortal life. He turned to the powerful mummies who wandered in the region at this time and asked (some say ordered) Horus to use the Spell of Life on him.\n\nIt went as poorly as one could expect.\n\nAstrokhen escaped with his life and looked for another solution, which he found when hearing of the mage Cabirus who apparently pieced together (or stole) the Spell of Life some time ago. Astrokhen used all his resources to track him down and managed to corner the mage turned mummy long enough to finally attain the immortality he wanted. For a time, all was right in his world... then Horus came back and expressed his serious \"disapproval\" of the way Astrokhen obtained what should be his only to bestow.\nHorus considered destroying this wayward mummy but was impressed by the sheer determination he has shown so far and, as such, decided to give him a task instead. He gifted Astrokhen with a slew of powerful and forgotten artifacts with the command that he should defend them with his life and make sure they never end up in the hands of mortals or potential enemies of the mummies. Then, he sealed this pact with a curse, making sure that the unlikely guardian would take this end of the bargain very seriously.\n\nAnd so it was for centuries, Astrokhen donning several personas throughout the ages to create cults helping him in his unwilling duty and smiting any would be adventurer coming too close for comfort. Then Kli Kodesh came and manipulated the young Order of the Temple into raiding Astrokhen's cache under Jerusalem, using the ensuing confusion to make it out with an important part of the treasure.\nAstrokhen has been tracking him down since then, Horus' curse still hanging over him barely restrained by the small handful of artifacts he managed to save.\n\nFuture fate in Canon\n\nDuring the climatic events leading to the fall of the Templars, Astrokhen will be forced to take extreme measures that won't save him from an unfortunate fate."
 POD_investigate.desc.792588: "迥异于多数星占遗世独立于群山间沉思诸天奥秘，佩玲更偏爱地面景色。无尽苍穹于其上展开，她有如归之感。她云游世界，或与狼人结伴，或与人类同行，但极少与族人共游。对于世界启发的新知她乐在其中。\n最终从中国到西伯利亚皆能听到神秘狼女的传说，其中一则是她运用诸天的启示养活了一个村庄，另一则是她用自身存在的难题使一只怪物困惑思索至饿死。\n蒙古可汗科尔沁用了一整年的时间追寻传说留下的轨迹，最终导引他找到佩玲。她已与可汗交战许多次，本以为这次也无不同，但取而代之的是可汗向她提出一个谜题。他立下誓言如果她能解谜，他将臣服于她，任其差遣。不过在那之前，她将先做他的臣属。她接受了挑战，迄今已服侍达十年之久。\n该势力的一些人认为她不久前就发现了答案，只不过不愿回答。这并非实情，但佩玲也没有明言。"
 POD_investigate.desc.791775: "瓦实提是该隐之子君士坦丁堡历史上一位神秘的人物，有人传言她是米歇尔的子嗣，但如果真是如此，这位牧首从未真正将她引荐给他的皇庭。这可能是因为瓦实提似乎更适合在阴影中行动，并且拥有一个令人印象深刻的、遍布欧洲各地的间谍和线人网络。一些人推测她正在等待一个决定性的事件来释放她真正的力量，也许是已故米歇尔应急计划的一部分。\n\n官方设定的未来命运\n瓦什泰将在奥斯曼征服君士坦丁堡期间崛起。她将在哈基姆和梵卓之间进行调解，最终任命了一个傀儡亲王——穆斯塔法，而她自己则掌握了该地区的实权。她的统治将在第一次世界大战期间结束，届时她将在那个时代的混乱中被赛特之子谋杀。她的子嗣纳克希迪尔，一个从可怕命运中被救出的凡人，并且极其忠诚，将取代她的位置并寻求为她复仇。"
 POD_investigate.desc.792605: "The mummy known as Inauhaten was once an architect, but after his rebirth he began the study of death to learn more about himself and the afterlife.\nIt is said that it was him who told the mages of the Tal'Mahe'Ra about the nature of Enoch when they first met him in Egypt. In exchange for the protection of his body while Inauhaten was waiting for resurrection, he reported back to them the things he saw in the [UmbraGlossaryLocalized('shadowlands','Underworld')], including knowledge of wraiths and their arcane society. Most importantly, he spoke of a realm named Enoch, where beings called the Aralu lay entombed. He was accepted into the sect after he led them to the city in the [UmbraGlossary('shadowlands')] and helped them capture it.\nInauhaten is now a high-ranking member of the Tal'mahe'Ra and while not technically a member of the Council of Thirteen, he sits on the council holding equal position with them. It was him who gave them the Guarded Rubrics – a distillation of necromantic praxis - that allowed the sect to thrive in the hostile [UmbraGlossary('shadowlands')].\nIn the end, his true goals are unknown to all but him. Even the Tal'mahe'Ra itself doesn't know what their mysterious benefactor wants but they feel deeply indebted to him.\nA debt they fear they might have to repay in full some day."
 POD_investigate.desc.792157: "Death has always fascinated Laura. Born in the last months of a plague, scarcely a week went by during her childhood where she did not attend a funeral. Asking questions about the soul and death at the local Church didn't satisfy her and she masqueraded as a man, obtaining entrance at the newly founded University of Salerno and gained entry into a world of learning.\nWhen a teacher saw through her disguise and forced himself upon her, Laura struck back with her dagger and, fascinated, watched him slowly die. A Cappadocian observed her and, thinking her too good of a prospect to abandon to mortals' idea of justice, [Glossary('Embraced','game_concept_Embrace_desc')] her during this event.\nLaura found her new existence difficult to live with, having great trouble in keeping her bestial urges in check. So she did what she always did before and started studying this new subject. Nothing seemed to work though, from meditations to forced starvation in between adhering to strict moral codes and Laura only found peace when she gave up on the cities she knew so well and spent time in the wilds instead.\nThere she initiated herself in the Road of the Beast and finally found the peace of mind she longed for, at the cost of now being an outcast to her own $pod_clan$ for which this Road is a strange and almost alien belief."
 POD_investigate.desc.790881: "在踏入亡生不久后，伊利亚纳便得知了狼人存在的消息。她对此深感着迷，并试图接近他们。经过数次惨痛的挫折后，她终于找到了一支愿意容忍她的狼群。相比与同类相处，伊拉娜更喜欢与狼人的陪伴，并只在需要进食时才进入城市。\n伊利亚纳避开文明社会，在她所在区域几乎没有与其他吸血鬼的联系，实际上她认识的血族也寥寥无几。另一方面，她在一些较为温和的狼族中却拥有一定的影响力。她只会在荒野中栖身，通常可在狼族社区附近找到她的踪迹。\n\n其在原作中的未来命运\n在游牧生活了几个世纪后，伊利亚纳最终定居于温哥华，享受着当地吸血鬼与狼人之间罕见的友好关系。"
 POD_investigate.desc.791226: "Adoptive son of the Emperor Hadrian, Lucius Aelius Caesar officially died of poison in 138 before he could ascend to the throne. Like another man that almost became Emperor, he was [Glossary('Embraced','game_concept_Embrace_desc')] by the mysterious Sybil and left to fend for himself. Having trouble adapting to the cutthroat politics of vampiric Rome, he traveled to Tricassium, the town where he once lived with his adoptive father. Thanks to his considerable personal power, he quickly became Prince of the city.\nHe soon found in this burgeoning area a new purpose for this unlife and worked as a tireless protector of it against the various invaders that threatened the newly named Troyes. During Attila the Hun's siege of the city, Lucius was almost surprised by the sun and destroyed, forcing to leave his corporeal body behind to took refuge in the [umbra|E] using his considerable mastery of Auspex. It took him more than four centuries to navigate the [umbra|E] and reintegrate his body but, by then, Lucius noticed some some serious changes. His $pod_clan$ discipline of Obtenebration didn't work anymore and he seemed to be unable to leave Troyes at all, the mere process of trying being painful.\nOn the flip side, Lucius' bestial urges are no almost non existent now and he doesn't need to drink blood anymore. After some research, the Roman understood that he, quite strangely, achieved Golconda in a roundabout way and can keep this state of being if he doesn't try to leave his city.\nAnd so it is since then, Lucius being quite content on keeping his beloved Troyes safe. After all, his soul literally depends on it."
 POD_investigate.desc.791951: "唐娜·卢帕·曼里克以前是古老卡斯蒂利亚贵族的掌上明珠，现在是妥芮朵的窈窕淑女。她领导着以勇敢和荣誉闻名的该隐之子骑士团——白色军团。曼里克带领军团朝着特定方向发展，这些高贵的骑士并没有在沙漠中漫无目的地追逐撒拉逊人，而是留在离家更近的地方，为违背真理和荣誉的罪行复仇。他们特别憎恨各种形式上的破誓，众所周知他们竭尽全力毁灭那些未能恪守重誓的该隐之子和凡人。\n吟游诗人赞美曼里克于比武大会展现的致命武艺并不比赞美其优雅和令人望之生畏的高贵要来得少。然而，有些血族质疑她不懈的奉献精神，並推測她輝煌的事业更可能出自過去的一些个人悲剧而非纯粹的理想主义所能造就。"
 POD_investigate.desc.790393: "Had the Scorpion King been victorious in his mighty battle with the Eye of Ra, who knows what would have occurred. When Sakhmet smote him into nothingness at last, however, she may as well have done likewise to all those whom the Setite lord had ever sired, as all such individuals were instantly and eternally subjected to her wrath in the form of a terrible blood curse. One such childe, a mere neonate at the time, was the very individual who would grow to become the Lord of the Dream Court resting beneath the city of Cairo — a creature known in the millennia between as the Sleeping Lord.\nThe creature initially found that by entering $pod_torpor$, it could delay the pestilential rot that overwhelmed its once-human body. Whenever it slept, thus putting the activity cycle of its undead form into stasis while refreshing its mental and spiritual fortitude, it found that it could concentrate its power more effectively. During sleep, it focused its energies toward the mystical subjugation of Sakhmet’s curse, hoping to eventually best the wretched spell altogether.\n\nFuture fate in Canon\nSakmet's curse will grow stronger with the centuries and the Sleeping Lord will despair as his unlife is slowly taken away from him. The arrival of the fabled Last Daughter of Eve, the Herald of Gehenna itself, in Cairo will be his ultimate chance of survival."
 POD_investigate.desc.792870: "安普曾是奥西里斯在与赛特抗争时的盟友。他的后代支持荷鲁斯的$glossary_osirian_league$并与狼族的寂静漫游者和凡人伊西斯密教有着强烈联系。\n他和其后代原先由奥西里斯指派守护生命神咒，但后来被伊西斯的祭司们送走，他们不愿让如此多强大的吸血鬼接近。安普听从，而数百年后赛特腐化了仪式，忌灵木乃伊于焉诞生。在羞愧中，他命令子嗣保护残余的密教并协助埃及免于$glossary_wyrm_apophis$的腐化。\n他们盟友所指派的任务是保护一位初代贤荷鲁——前女王哈特谢普苏特，以确保她休息不受打扰并继续太阳王祭礼，千年来门徒们从未动摇自身的职责。众所周知，他们从[UmbraGlossaryLocalized('shadowlands','冥界')]一个名为阿努比斯的神秘存在接收梦境片段。当地游牧部族知悉并接受他们的存在，甚至有时送去供品。开罗知情的该隐之子也接受其存在，只要门徒们留在他们自己的沙漠神殿里。"
 POD_investigate.desc.790593: "卡利达于西元前260年生于罗马帝国叙利亚的腓尼基行省，时值三世纪危机，帝国陷入军阀割据的无政府状态。她曾是献身于阿波罗（俄里翁）的女祭司，直到二十岁时被伪装成该神的妥芮朵在阿芙萝黛蒂（维纳斯）祭坛夺去童贞并授予$pod_Embrace$。\n在初拥后，她与名唤盖乌斯的梵卓成为情人。两者定居于罗马殖民地阿奎伊斯（今日亚琛）。在盖乌斯担任亲王期间，她在维持德意志众多派系之间的脆弱和平方面发挥了重要作用。当盖乌斯面临终焉之死时，卡利达陷入重度抑郁并逃入亚琛附近的森林里。就在那里她找到了浩恩永生。\n卡利达此时退出政治舞台，虽然仍然渴望找出杀害盖乌斯的凶手。现今她一般是独来独往，唯一的例外是有时会与法师格蓓尔佳商量。\n\n其在原作中的未来命运\n在1507年，她将与名为艾因哈德的梵卓查理曼编年史学家离开亚琛，并定居爱尔兰。直到二战时为了抢救一些珍贵的艺术品而短暂回到德意志。"
 POD_investigate.desc.791363: "After an early childhood with an abusive father that ended when he plunged a knife in his heart, Albin once again became the victim of abuse when stronger boys beat him and usurped his shelter. He was saved by a dark shadow who killed his bullies and then made him a creature of the night. For years, he could not understand what he had become, not until he encountered Cainites and learned that he was not alone.\nYet again, Albin became the wretch of his kind – this time of the shadowy world of vampires. Magdeburg's Cainites ridiculed Albin for fearing what he had become rather than reveling in his predatory powers. They nicknamed him \"The Ghost\" because he carried on more as a shade than a vampire. While they feasted on kine, Albin drained rats and stray dogs.\nWhen Jürgen von Verden took over Magdeburg, he saw a potential for Albin's deep knowledge of the city and used him as an informant. Albin's resentment still runs deep however and he has been feeding information about Jürgen to both his [Glossary('Sire','game_concept_Sire_desc')] Hardestadt and competing Tremere for a while now.\n\nFuture fate in Canon\nAlbin will escape one imprisonment and continue betraying Jürgen as best as he can. This time, he will be in league with the rebels of the Silent Fury and launch an attack on Jürgen's beloved, Rosamund. Finally caught, Albin will spent an unpleasant couple of last nights telling everything he knows to the Ventrue before finally meeting his end."
 POD_investigate.desc.790310: "In his mortal life, Dominic was a Carthaginian general. His [Glossary('Sire','game_concept_Sire_desc')], Samal, Embraced him as Carthage burned at the hands of the Roman legions. The responsibility for the destruction of their great city, a Promethean utopia, fell on the heads of Clan Ventrue. For Dominic, this atrocity would never be forgiven and he would forever hate the Ventrue as a result. Though Samal met Final Death that night, Dominic fought for days until he fell into torpor at the hands of Roman soldiers. His body secreted away and interred by loyal Carthaginians, he would arise again into a very different world.\nIt was not until the 5th century CE that Dominic would awaken. Though Rome had already been sacked by mortal barbarians, he would not allow the immortal Ventrue to escape his retribution. For the next five hundred years he waged a personal war against the Clan of Kings.\nOne of his ghouls, a Hungarian chieftain named Bulscu, was offered the Embrace, but just before the deed, Bulscu staked Dominic and revealed his allegiance to his hated Ventrue enemies. All of Dominic's plans fell to ruin before his paralyzed body and he remained in $pod_torpor$ for the next two hundred years.\nLoyal Brujah rescued Dominic from torpor during the 12th century in Budapest. His hatred for the Ventrue remained unabated and he secretly began a new personal crusade against the traitor Bulscu. However, while searching for allies against his foes, Dominic was convinced that he would find a worthy partner in vengeance in the Tzimisce methuselah Yorak. This proved to be a trap and Dominic soon became a part of the Tzimisce Cathedral of Flesh.\n\nFuture fate in Canon\nAfter a last campaign of rampage in the modern day against the Ventrue, Dominic will finally end Bulscu's life. In doing so however, he will lose his only reason for carrying on and fall to his Beast, and later on to Vlad Dracula's sword."
 POD_investigate.desc.791058: "Just another villager in a small town of Eastern Europe, Tshaya had the misfortune of living near a castle of a typical Tzimisce and, like many others, served as food for him. One night another a mysterious individual came to the village and Tshaya told him everything... and more, inadvertently convincing him that she had powerful visions. Soon after, the Tremere had killed the Tzimisce Voivode and \"rescued\" the \"prodigy\" Tshaya from a life of servitude.\nThe Tremere soon noticed that Tshaya was an average student at best with no special ability at all. Still, she reveled in her newfound power and the freedom it gave her. So much so that she soon fled from the oppressive Tremere Pyramid to throw her lot with a band of misfits like her named the Bar Sinister. The Tremere, for their part, don't seem to really care, or even to have noticed her departure.\n\nFuture fate in Canon\nTshaya will be one of the few survivors of the disastrous Bar Sinister's assault on Ulf's Hall. Her ill gotten treasure will only earn her a vengeful spirit and a curse in the end."
 POD_investigate.desc.505052: "Bulscu was a charismatic Hungarian chieftain known as the Man of Blood, capable of rallying his people against their enemies to the north. His zest for life was surpassed once he learned of undead beings and their greater powers. He religiously submitted himself to a vampire named Dominic.\nBeyond the veil of sleep, though, another Cainite called to the depths of Bulscu's mind. Bulscu dreamed of power, but the triumph of a strong warrior was not enough for him – he desired the absolute power of a king, and thus, his thoughts were influenced by an ancient Ventrue. Bulscu betrayed Dominic and drove a stake into his chest, earning the $pod_Embrace$ into clan Ventrue and soon becoming a powerful ruler of Eastern Europe's nights.\nSince then Bulscu has realized just how much of his free will he gave up to his master – the guilt and despair of his current situation is nightly buried under a massive amount of blood, orgies, and exotic drugs. In the long nights of the 12th century, Bulscu's humanity has faded away as the exploitation of his mortal slaves becomes increasingly grotesque. The Beast within devises ingenious tortures for his herd and Bulscu has begun to employ vivisection as an aid to his feeding.\nA great deal of the influence he still retains in the 12th century comes from the nobility of House Arpad. He is well informed, but he rarely exerts his powers. He was still in the peak of physical condition as he was the night he was Embraced, but his increasing addictions have clouded his mind and weakened his authority.\nThroughout the 13th century Bulscu's influence in Hungary has finally faded. By his own hand the Ventrue now sleeps in $pod_torpor$, guarded by his dutiful childe, Vencel Rikard.\n\nFuture fate in Canon\nBulscu will arose, purged and reborn anew, in the 16th century. He will once again become a dominant power in Eastern Europe until his final battle, and defeat, at the hands of his eternal rival Dominic."
 POD_investigate.desc.790951: "A very old and ambitious Tzimisce, Vukodlak desired to overindulge himself with the $pod_vitae$ of the [Glossary('Antediluvians','game_concept_antediluvian_desc')] and conceived a diabolical plot to find and eventually destroy the members of which the Third Generation consists. His contemporary Voivodes regarded the pursuit and the execution of his ambitions dangerous to the Voivodes and their holdings, revolting and essentially treacherous to clan Tzimisce. Thus the Voivodes unanimously retaliated and purged the entourage, servants and legions of what they deemed to be a wayward Voivode from the ancestral Tzimisce lands. Vukodlak was cursed and placed in a deep $pod_torpor$ that would last eons.\nHis remaining obedient servants carried the body of their dreaded lord across eastern Europe, persecuted and bereft. Eventually the servants of Vukodlak found a safe haven in Prague and Vysehrad Castle became their new dark demesne.\nHis long awaited return in the 12th century has been thwarted during a climatic battle where Christof Romuald and his coterie managed to bury his resting place once more.\n\nFuture fate in Canon\nVukodlak will soon awaken but the curse the Voivodes placed on him will hamper his power. Slowly amassing strength during the following centuries, he will finally relocate to New York and create his very own Cathedral of Flesh in the bowels of a ruined church. Finally close to his ascension, Vukodlak will be thwarted once again, and this time killed for good, by Christof Romuald."
 POD_investigate.desc.790405: "Byzar has involved himself with Byzantium's history for as long as any $pod_cainite$ can remember. From within his haven, Byzar directed the city's growth, and considered himself Byzantium's shepherd. He drew the greatest artists and architects from across the known world to build Byzantium, a jewel on the road to the east.\nEmperor Constantine brought a definite end to the effort. His forces razed Byzantium to the ground, enslaved the surviving population and declared himself ruler. Byzar himself nearly fell into torpor from grievous wounds inflicted in a battle with Roman Cainites. Three methuselahs accompanied the invaders that would later become known as the Byzantine Trinity and erase Byzar from the city's history.\nRather than face this formidable trio directly, Byzar left to gather strength and knowledge with which to combat them. He met the one who would change the course of his unlife forever at the heart of some city along the Mediterranean. Byzar tried every possible trick to convince this Cainite to aid him in his quest, but nothing worked. When he tired of these games, he found he could not move to strike down the creature. He realized then that no force at his command could move this being, and he offered to learn from the mysterious vampire instead. The Cainite opened a third eye and introduced himself as the prophet Saulot.\nSaulot guided Byzar on the path to Golconda for several decades until his departure. Bereft of this guidance, Byzar returned to Constantinople... only to be betrayed and left in $pod_torpor$ by his own childe now working for the Trinity.\n\nFuture fate in Canon\nByzar will awaken to a new world and choose to focus on his quest for Golconda. Using the name Mahatma, he will monitor Constantinople, then Istanbul, for the centuries to come, rarely interfering in Cainite politics."
 POD_investigate.desc.790318: "曾被称为“被阳光灼盲却能洞悉一切的先知”，他曾徘徊于靠近耶路撒冷那片炙热而荒芜的废土之上。如今，拉姆迪尔以一名十几岁少年的裸身形象现身，自血红的月下，从水中升起。除了这些零星的描述，以及他所遗留下的世系信息外，人们对这位末卡维血裔几乎一无所知。\n"
 POD_investigate.desc.792856: "A simple innkeeper's daughter in a small town, Gwendolyn's life changed when she noticed that the family patriarch was hiding something. Learning that he was a vampire, Gwendolyn begged him to make her one as well so that immortality could be hers. He refused however, arguing that the vampiric curse was something too horrible to be ever worth it.\nThe scorned Gwendolyn continued her life until a mysterious stranger came to the inn and she recognized all the signs marking him as a vampire as well. Trying her best to seduce him, she ended up being seduced herself but this man, Montrovant, also refused to $pod_Embrace$ her.\nHer wish would finally come true when Montrovant's enemy, Kli Kodesh, would $pod_Embrace$ her soon after as a means to get some entertainment out of an angry Montrovant. Luckily for her, Kodesh's blood was purified by the Grail and thus Gwendolyn, while being a Nosferatu, wasn't afflicted by their curse.\nSince then, she has been used by Kodesh as a servant and messenger but it seems the strange Methuselah is getting bored of her, worrying Gwendolyn about her fate under his thrall.\n\nFuture fate in Canon\nGwendolyn will manage to escape Kodesh's leash (mostly because he will stop caring at this point) and reunite with her beloved Dark One, Montrovant. While he will never reciprocate her feelings, she will help him against her [Glossary('Sire','game_concept_Sire_desc')] even though it will all ultimately be in vain."
 POD_investigate.desc.790296: "The longtime Sultan of Aden was known to his city as an benign ruler. Surrounded by a large progeny that seemed to at least have some modicum of talent and respect for him (if not love), Abd al-Haqq was a Sultan who knew when to delegate and that his city could live on its own. This has helped the region grow as a center of trade for $pod_cainites$ as well as mortals. Sadly, this has also allowed some of the most unsavory vampires to thrive and has earned the reputation of Yemen as a lawless backwater to the [Glossary('Ashirra','game_concept_ashirra_desc')] world.\nRecently, Abd al-Haqq has taken a fancy in a tribal chieftain's daughter, Sakan, and [Glossary('Embraced','game_concept_Embrace_desc')] her in the hopes of making her one of his brides. Soon after starting her education however, he suddenly vanished.\nIn his absence, his most talented childe, Shamit ibn Yasir, took the reins of power, seemingly for a regency at first then more and more as a ruler of his own.\nThe recent rumors of Abd al-Haqq's reappearance in the east have sprung whispers in the court of Aden, some wondering if the indolent peace of Yemen will be shattered by a conflict between [Glossary('Sire','game_concept_Sire_desc')] and childe."
 POD_investigate.desc.790891: "Born as the son of the Caliph of Cairo and a Christian, Al-Hakim's life was always torn between his two different lineages. When he eventually succeeded his father, he was not a very successful Caliph, but managed to attract the attention of the Malkavian Hassan abu Khalid, who disliked the influence of the various religious minorities within Egypt, and made the caliph his ghoul.\nUnder the orders of his domitor, Al-Hakim ordered churches and synagogues to be destroyed and even began to destroy mosques when his subjects began to protest against this. Under the maddening influence of his domitors $pod_vitae$, he began to believe that he himself was Allah and all Muslims should direct their prayers to him. In the following riots, he was [Glossary('Embraced','game_concept_Embrace_desc')] by his domitor, who quickly came to regret this decision as he was diablerized by his frenzied childe minutes later.\nLeaving Cairo behind with his ghouled retinue, he ventured off to Jerusalem, where he proclaimed his godhood to the world. He is, however, forced to keep a low cover, as the Lasombra and Ventrue presence within the city is a dangerous prospect even to him. He continues to sow dissent against other religions, persecuting Jews, Muslims and Christians alike in his mad attempt to prove his own divinity (with aid from various Setites, who try to use the madmen for their own schemes).\nFuture fate in Canon\nHe will meet his end when, so convinced of his divine status, he will think he can challenge the ancient bane of Caine's get and face the sun directly. To no one's surprise except his own, he will fail."
 POD_investigate.desc.792468: "This crafty English rogue has begun to make a name for himself among the libraries. Jack's past is mysterious, as he doesn't want to talk about his [Glossary('Sire','game_concept_Sire_desc')], apparently to not shame them. His biggest claim to fame is the many precious manuscripts and relics tied to Salubri history that he liberated from their new owners, those often being the Tremere.\nThe Magisters have also been particularly strident about demanding his capture but each increase of the bounty of his head only seems to spur him to greater feats of daring. While Jack seems to think of himself as an outcast, many Salubri see him as being loyal to the blood in his own way and greatly enjoy the tales of his bold adventures to save the Salubri's legacy."
 POD_investigate.desc.791751: "During his mortal days, Bertrand was a crusader who was present during the call to reclaim the Holy Land. He was among those who participated in the siege of Jerusalem and slaughtered countless innocents in the battle. He stayed in the Holy Land to claim some land for his own until he was struck by a Saracen assassin. When he draw his sword, he recognized his assailant as a woman and saw the bitter hatred and sorrow in her eyes.\nStruck deep into his heart by the revelation of his crimes, he dropped his weapon, collapsed to the ground and whispered \"I'm sorry\", something that moved his attacker to instead $pod_Embrace$ him, granting him eternity to atone for his sins. He was taken to Alamut, where he was trained in Islamic theology, philosophy, and art. Bertrand entered the Banu Haqim as an ignorant outsider and left it as a man of great erudition and greater sorrow. He returned to Jerusalem to now protect the very Muslims he once persecuted, especially dedicating himself to the poor.\nWith quiet approval, elders of Alamut note that it seems that even the most abhorrent of the Franj can find redemption and a noble purpose."
 POD_investigate.desc.790191: "Gayal is the Ravnos who recorded the teachings of Chandraputra and Zapathasura into the Path of Mayaparisatya, using the patterns discovered in the [Glossary('Dharma','podgloss.dharma')] of their hated enemies to encompass the search of vampiric svadharma as well as patterns seen in mortal Hinduism.\nClan legends tell that he is a terrifying warrior, who is known to have killed scores of Cathayans by himself, and a great scholar who came to admire the culture of their enemies. Critics of his formalization of the path claim that this act destroyed the personal approach that was before the most important part of the Path."
 POD_investigate.desc.792767: "Before the rebellion, Chelniel was a pioneer of the concept of leadership. The alpha wolf, the strongest ape, the lion who leads the pride — these creatures were his work. Despite the misery that followed Lucifer's rebellion, Chelniel wasn't disappointed in humanity. While the vast majority of them were weak, there were always a few who rose up and claimed the crown, the scepter or whatever else might be appropriate in the face of adversity. When he was cast into Hell, he felt that humanity would survive despite it all.\nChelniel found himself called from the Abyss and bound into a circle of stones around the same time that Geshua of Nazareth was born, hundreds of miles away. The people who summoned him had called out for a champion, someone to lead them in a war against another tribe. Chelniel refused to lead, of course, but he guided the tribe’s leaders to war and then watched as the humans killed each other with ferocity and tenacity that surprised even a demon.\nFor hundreds of years, the Picts worshiped him, calling on him for advice in times of strife, until finally their civilization fell. Always able to recognize the strongest of humans, Chelniel saw the end coming and asked that his stone circle be converted into a broch, a small stone tower of such strength that even a siege engine had difficulty breaking it. His circle is located on a hilltop far away from anything that invaders need, and so like many of the other brochs, it remains standing.\n\nFuture fate in Canon\nChelniel will find the modern world, so devoid of direct man to man conflict, boring until a pack of werewolves suddenly attack his cult. Finally finding a good challenge, he will lead his followers in making honorable war with these worthy foes."
 POD_investigate.desc.790505: "In her mortal days, Rabbat was an old woman native to the Ch'in Empire in the early 13th century. When the Mongols under Genghis Khan ravaged her homeland, they spared her, proclaiming her to be the ugliest woman to have ever lived. They brought her to Karakorum, as a gift for the Khan, who was amused by her deformed face. She was allowed to live as a curiosity of the Khan, but when Genghis died and his sons inherited and split up his realm, she was dismissed.\nHer fortitude and grim fate earned her the notice of Sabanu, an agent of Baba Yaga, who Embraced her when she begged for the mercy of death. Cursing her [Glossary('Sire','game_concept_Sire_desc')], she wandered west, eventually settling in Constantinople. There, she was discovered by her Clan and properly educated in the politics of the Damned. Eventually she relocated to Prague, where her advice saved the life of an influential Malkavian elder during the Inquisition, gaining the respect of the Clan in the progress. She traveled further to Venice, where she assumed a guiding role of her Clan members.\nWhen the Plague devastated Europe, Rabbat had no qualms about drinking the contaminated $pod_vitae$, resulting in the Scourge, a virulent disease that affected Kindred, when she created her first childer. This granted her the enmity of the Camarilla and the Giovanni who called out a Blood Hunt against her. Having become a living infection dangerous to the kine, she was welcome nowhere and wandered from domain to domain, cursing her existence.\nRabbat bears the strange dichotomy that she is a greatly respected Elder within her own Clan, who is nonetheless forced to surrender her to the Red List. The Justicars are worried about the possibility of other diseases mutating to impact Kindred, as well as the possibility that she has found a way to cure herself and is on the run because she is forced to."
 POD_investigate.desc.POD_fae_character_25: "韦兰是夏之王廷的至高匠师，是夏妖精无可争议的强大领袖，也是在四季之战中赢得恐惧和尊敬的著名战士。对于凡人，韦兰很少有善意的举动。\n他喜欢出现在人类面前，为他们提供丰厚的回报，以换取他们的誓言。他在遵守困难誓言和惩罚那些未能履行誓言的人类中获取极大的满足感。\n虽然他的宫廷主要由尚武派妖精组成，但至高匠师接纳任何来到他领地的访客。韦兰是少数几个在誓约休战上签字的人之一——那天，他是带着痛苦的颤抖在羊皮纸上落笔的。\n其在原作中的未来命运\n韦兰的命运不明，他极有可能流亡到了[UmbraGlossary('arcadia')]。在大复还之后，七岁的亚伦·基尔马丁和他的母亲在观看《磨坊主的故事》演出时遭到了一群弗摩尔族和疯狂狼人的袭击。亚伦的母亲将一坩埚的熔银倒进了一个黑旋舞者的嘴里，杀死了它。在将她开膛破肚之前，弗摩尔族让她眼睁睁地看着他们扭断了亚伦的脊椎。多诺万领主和他的骑士们来得太迟，没有救下亚伦的母亲，但他带回了这个男孩，并亲自监督他的治疗以表彰亚伦母亲的勇敢。亚伦瘫痪了，他们所有的治疗技术都无法改变这一点，但工坊的梦华也唤醒了这个男孩的换生灵本性。多诺万监督了韦兰的破蛹和赋名仪式，并为他取名为“韦兰”，锻造工坊的永契堡诺克还送给了他一套银色的外骨骼。\n多诺万收韦兰为学徒，后者作为游历工匠走遍了肯考迪娅。他辗转于一个又一个大师之间，但没有任何一门手艺或技术对他有吸引力；他的乐趣来自于指导学徒。韦兰因无法找到工作而感到沮丧，他回到多诺万身边，认为自己是个失败者。多诺万向他展示了所有他曾服务过的大师们的报告。虽然他的作品从未出众，但他对学徒的出色培训却始终受到赞赏。多诺万让他成为自己的管家，并最终将他任命为杜伽尔世家的导师。"
 POD_investigate.desc.POD_fae_character_26: "黑矮人的首领，克罗德领主已经去世。他的几位副手正在争夺空缺的王座，每个人都展示着自己在欧洲各地的强大势力。其中首屈一指的是妮克内文女士。她是守护者议会的支柱，但她的忠诚最终完全属于冬之王廷。有传言称，最近对美丽的哲人女王发动的刺杀企图几乎成功，妮克内文女士现在为了自己的安全而隐居起来。\n她被赋予许多名号——骨母、盖娅·卡琳、苏格兰的赫卡忒、巨大妖婆、农民们的母巫——她的影响力沿着黑路蔓延。如果有关她曾经是至高匠师韦兰的情人的传闻属实，那么现在她似乎对他怀有极大的敌意。在她众多的敌人名单中，神秘的德雷尔也在其中。据说她是斯卡哈的女儿。\n其在原作中的未来命运\n妮克内文的命运不明，她极有可能流亡到了[UmbraGlossary('arcadia')]。迄今为止，她没有随着大复还回归——亦或是她已经回来了？"
 POD_investigate.desc.POD_fae_character_24: "作为黄昏议会中备受赞誉的成员之一，阿娜女王与她的同僚们对于四季之战有着相同的观点，这种态度在凯莎莉聚会的成员中也很受欢迎。向人类展示足够的力量，使他们尊重和珍视妖精，然后将他们的信任作为即将到来的战争的武器。作为誓约休战的签署者之一，她自然不愿看到条约破裂。\n具有讽刺意味的是，阿娜让秋之王庭远离四季之战的最大障碍是她自己令人厌恶的前夫洛克里奇和与洛克里奇生下的可憎、怪物般的后代。这位违逆之主渴望更多的破坏、苦难和污染。她的孩子们与她对立，而这些孩子的怪物后代也随之其后。为了在遵守誓约休战和对她邪恶的前夫进行应得的复仇之间取得平衡，阿娜将不得不做出可怕的选择。\n其在原作中的未来命运\n阿娜的命运不明，她极有可能流亡到了[UmbraGlossary('arcadia')]。迄今为止，她没有随着大复还回归——亦或是她已经回来了？"
 POD_investigate.desc.POD_fae_character_28: "Several remote villages across Western Europe have a strong and binding oath to the White Lady. She and her subjects heal or gently repose every sick human infant in the villages as long as certain rituals are performed and certain bans upheld. Pressyne is an respected ancient of the Spring Court from her seat in Promise of the Faerie Well and leads it with benevolence and a humanist outlook. A kinain scholar, Sir Gareth, claims that Pressyne is the daughter of Morgan le Fay, and thus descendant of Avallach and Beli Mawr. If the White Lady is the daughter of Morgan le Fay, then the daughter is the compassionate mirror to her mother's cruelty. Its also said that her eldest daughter, Melusine, was born kinain, ghouled by a vampire before ultimately being embraced into clan Toreador.\n Future fate in Canon \n The White Lady's fate is unknown, most likely she went into exile in [UmbraGlossary('arcadia')]. There are still sightings of her in Lorraine, Normandy and the Pyrnees. In Dutch and German mythology she is called 'Witte Wieven' and 'Weiße Frauen'. In 1870, Thomas Keightley wrote of her in his work 'The Fairy Mythology--Illustrative of the Romance and Superstition of Various Countries'. So far, she has not returned with the Resurgence--or has she?"
 POD_investigate.desc.POD_fae_character_27: "One of the most infamous of Fae, his background is shrouded in mystery. Drail was the child of Summer firstborn fae who rebelled against the oppressive structure of their court. He became ambitious for power and disrespectful of those who kept it from him. Branded Solstice and exiled, he developed relationships with other Solstice-kin. He hatched a plan for a united Solstice Court that would rule over the Seasons. Drail gained support from fae assassins and mercenaries, extracted oaths from the lowest rungs of societies like beggars, thieves, couriers and  courtesans. Allegedly, his plotting and covert actions led to the War of Seasons. One of his saboutuers was captured and tortured by the Summer Court, which revealed Drail as the mastermind of the conflict. Hunted by all the courts, he disappeared. Rumors stir that this or that solstice uprising has Drail as its hidden master. While many seek Drail's head, Nicnivin of the Black Road seems particularly interested in his death.\n Future fate in Canon \n Drail's fate is unknown, most likely he went into exile in [UmbraGlossary('arcadia')]. So far, he has not returned with the Resurgence--or has he? Did he ever truly exist at all?"
 POD_investigate.desc.POD_fae_character_39: "Every bridge in the world creates a portal to the twisted [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')] of Underbridge, a starless land of eternal night lit only by sputtering torches and eerie will o' the wisps. The most gruesome members of the Winter Court call Underbridge home. The expansion of human civilization has caused rapid growth in this nightmare realm, as new trade routes and cities spawn more and more bridges. During the War of Seasons, Winter armies moved quickly through Underbridge to strike at poiints across Europe.\nRumors claim that beyond a Sidhe, Taulandryn is an inanimae born of darkness itself or some monstrous creature of the abyss such as a T'arrkel or other bestial aberration of Underbridge. This Winter-kin firstborn lives at the heart of Underbridge, deep in the void.\n Future fate in Canon \n Taulandryn's fate is unknown, most likely he went into exile in [UmbraGlossary('arcadia')]. So far, he has not returned with the Resurgence--or has he?"
 POD_investigate.desc.POD_fae_character_34: "A changeling rising quickly to prominence after the Battle of Ice, the small taste of status fueled his ambition.  During the battle, Davidian who held the Crystal Fortress, had defied orders and refused to fight the Spring fae on account of his spring lover Kapherah. Tandoor quietly gathered a large group of Summer Court changelings and staged a coup that managed to depose Davidian and took control of the Fortress. After their coup, Tandoor leveraged his victory to demand recognition from the Summer Court of the changeling contribution to the battle. Tandoor was given the first Medal of the Sun, marking him as a Summer Court hero.  Becoming increasing militant during the Dim Times, he is anxious for the Oath-Truce to end.  He still holds the treasured Crystal Fortress as his domain.\n Future fate in Canon \n Tandoor's fate is unknown, as a changeling, he most likely died sometime before the Black Death. Perhaps his fae spirit has passed on to another changeling."
 POD_investigate.desc.POD_fae_character_23: "泪之使者通过签署誓约休战，暂时中止了四季战争，给妖精的世界带来了变化。\n其在原典中的未来命运\n加莱恩的命运是未知的，最有可能的是他流亡到[UmbraGlossary('arcadia')]。到目前为止，他没有随着大复还返回——又或者，他已经悄然归来？"
 POD_investigate.desc.POD_fae_character_01: "A great warrior and a prophet, Jalendrel is troubled by his dire visions of the future. He weeps for those terrible things he can foresee, but can not change. He once foresaw a terrible monster would destroy a village of his kin. He set out to slay the beast–and not only did he fail but he lost his hand to a withering darkness. Later, he followed his vision to slay the monster and save Lord Gwydion, but the price of that victory was watching the village of his kin be destroyed. To change things that he could, Jalendrel founded a noble house from among the prophets of the Sidhe in Occitania in the small hilltown of Marvejols.\n Future fate in Canon \n Odd for a seer, Jalendrel's fate is unknown, most likely he went into exile in [UmbraGlossary('arcadia')]. So far, he has not returned with the Resurgence--or has he?"
 POD_investigate.desc.POD_fae_character_03: "Gwydion is a masterful warrior and an accomplished sorcerer besides. When Gwydion was young, foolish, and full of pride he and a band of robbed the household of his uncle Math Mathonwy — Caer Dathal. Mathowny challegned Gwydion to fight Mathowny's daughter Keredwyn. She defeated him as she fought her father and Gwydion only for himself. Mathowny transformed Gwydion into a stag, a boar and a wolf in turn — each hunted by hunters. He survived the ordeal a changed fae — Gwydion became a righteous and powerful defender of the people of Cymru against wicked lords and brutal ogres. He chose to build a house of like-minded warriors. He held an open challenge to others to try an best him combat, through such challenges he recruited 300 loyal warriors among those he defeated. Eventually, Math's daughter  Keredwyn also came to challenge him. Barely, this time, he defeated her. They fell in love and have been together ever since.\n Future fate in Canon \n Gwydion's fate is unknown, most likely he went into exile in [UmbraGlossary('arcadia')]. So far, he has not returned with the Resurgence--or has he?"
 POD_investigate.desc.POD_fae_character_05: "作为一名工程师，他是他世家的典型代表，以长时间的沉默而闻名。他倾向于少问问题，然后让那些喋喋不休的人继续发表演讲，这常常激怒他的廷臣们。与埃斐和莫兰恩一起，他是杜伽尔世家中最早宣誓效忠杜伽尔宣誓的领主之一：“我的心属于杜伽尔。我的手臂将拿起他的锤子。我的身躯将承担他的重担。我的心将秉承他的意志。我会为他奋斗，直至生命的尽头。”多诺万的热情在于建造庞大的机器。尽管以他的攻城器械而闻名，他也喜欢制造精巧的奥秘建筑设备。他利用自己令人印象深刻的锻造魔法武器和护甲的能力，支持夏之王廷在季节之战中的事业。暗中，多诺万被人类巫师侵犯[UmbraGlossary('arcadia')]主权的梦所困扰着。\n其在原作中的未来命运\n随着大碎溃的到来，多诺万撤退到了桃源。他随着大复还重回物质界，成为苹果王国的高领主。据说他制造的攻城武器漏洞百出，导致杜伽尔世家被流放出了桃源。"
 POD_investigate.desc.POD_fae_character_02: "The sages say she embodies passion from both young lovers; invincible battlelust from the boy's victory and an alluring sadness from the girl's broken maidenhead. These attributes have become the hallmark of her own people; a house also thriving on lust, willfulness, and delight. Fiona also built friendships with the walking dead, speaking with restless spirits, and dancing around the pagan wizard's solstice fires. Especially beloved by her are the Prodigals called Garou and of all these, dearest to her heart are the Fianna; their inner fires and love of oaths and songs easily match her own. More than a little of her passions mix with those Fianna and even with others calling themselves Gaia's Children.\n Future fate in Canon \n The High Lords and Ladies of [UmbraGlossary('arcadia')] finally relented and welcomed Fiona to return to the safety of Arcadia before the last trods closed for Shattering. Fiona refused to return. Protected by her commoner court, she hid herself away from the agonies of Banality in a waking dream until the sidhe walked the lands during the Resurgence. Fiona came forth only then, in a land still known as Hibernia.  Fiona had forgiven during her long exile the lover who betrayed her, and she sought his tomb. She could find no trace of it. She became an old woman that day and though they searched valiantly for her, the loyal commoners never saw her again. some believe she found her way to Arcadia, while others think she perished from the overwhelming waves of Banality that she could not face. Queen Glynis claims Fiona disappeared in a torrent of tears, while relating her tragic tale."
 POD_investigate.desc.POD_fae_character_14: "Brooding daughter of Alynyad, she was the first of the fae to foresee the coming Sundering: a future where mortals have cast dreams aside and live in despair; a world with no place for Fae, or for anyone who dares to dream. Though her skill with prophecy and divination magics is unequaled, few have heeded her warnings. Even her dear brother Alil has dismissed her vision, and their quarrels became so great in time that Eiluned took leave of Ailil's court. With her companions, fae and otherwise, she founded a kingdom of her own several leagues hence, and though they have not always believed the things this strange lady has said, it was not long before the other kings and queens have come to recognize her as one of their own.\n Future fate in Canon \n Eiluned's fate is unknown. Most likely with her prophetic visions of the future, she went into exile in [UmbraGlossary('arcadia')]. So far, she has not returned with the Resurgence--or has she?"
 POD_investigate.desc.POD_fae_character_08: "Dark and brooding, powerfully attractive, with a keen intelligence, Ailil has a fierce passion for both love and war. His great flaw is an inability to remain aloof from the world of mortals. Some believe that Ailil sought mortal glory and power to distract himself from the ominous warnings of his beloved sister, Eiluned. Time and again he has donned mortal flesh and entered the stream of human history, taking lovers and leading armies with his irresistible charm and guile.\n Future fate in Canon \n Ailil did not return to [UmbraGlossary('arcadia')], but remained on Earth. The belief that Ailil may have survived the Shattering as one of the Lost Ones has grown into one of House Ailil's most persistent myths. Rumors abound that, from his hiding place within his Dream-shrouded lair, he has continued to exert his will, through dreams and visions, upon the world, and particularly upon members of his house. He may have forgotten more than he remembers, but bound to the island of Hibernia, his madness caued him to lose his identity while sustaining his eternal life.  Ailil may be the Lost One King now known as Meilseoir."
 POD_investigate.desc.POD_fae_character_16: "Liam has become obsessed with the Christian Church–-the beauty of its art, architecture and particularly its music. So enthralled, he has risked possible persecution as a ‘demon’ just to hear a few notes of its choirs. He became enraptured with the singing of Sister Melisande at a local abbey. Duke Haleson ap Gwydion heard of Liam’s fascination, and worried such obsession would bring down the wrath of the Church upon the Fae. Haleson and his faction conspired dressed as clergy to kidnap Melisande from her nunnery. When Liam returned to the nunnery to find Melisande disappeared, he fell into a psychotic rage driving many of the nunnery insane with his glamour. After forcibly extracting the memories from the Mother Superior, he soon set upon Duke Haleson. Liam in his blind rage was handily defeated by Haleson. The Duke then had Liam face trial by the Arcadian Fae.For his violation the Right of Demense and for attracting the ire of the Vatican, Liam and his entire house have been forever exiled from Arcadia!\n Future fate in Canon \n While Liam's final fate is unknown, his exile from Aradia was not lifted. With the Shattering, Liam likely lost his immortality due to increasing banality. Perhaps his fae spirit has been reborn in the body of a new changeling."
 POD_investigate.desc.POD_fae_character_21: "One of Bobh Dearg two beautiful daughters, Daireann is a renowned herbalist. She is said to having poisoned to werewolf hero Fionn MacCumhail in revenge for the lupine choosing to favor Daireann's sister Sadbh. Daireann gained noble title and founded a house by curing the goutish foot of Adwyr ap Gwydion. Daireann herself is not much of a warrior and knew it would be hard to prove the house's worth in the most visible way; on the battlefield. Some say she is skilled with the bow and sling, but that is stretching things a bit. The true growth of the house, with the founder's blessing, came with the birth of her son, Conchobhair the legendary warrior. \n\nFuture fate in Canon \n Daireann's fate is unknown, most likely she went into exile in [UmbraGlossary('arcadia')]. So far, she has not returned with the Resurgence--or has she? And what has become of her warrior son, Conchobhair?"
 POD_investigate.desc.POD_fae_character_15: "她被称为“百灵鸟之歌”，因为她的声音纯净而清澈，她的头发如同镀银的阳光，她的脸庞美丽如黎明本身。她背叛了她的爱人菲尼利亚，对菲尼利亚的凡人情人艾丹进行乱梦，将国王的吟游诗人引向死亡。无所顾忌和冲动，只顾自己的欲望，恋难舍被菲尼利亚的仪式性自杀所诅咒。菲尼利亚的永生之力会逐渐消失，除非她定期乱梦一位梦种。她的整个世家都分享了她的诅咒。世家隐藏了这个真相，声称是菲尼利亚在嫉妒中杀死了艾丹。她的世家也共享着她超凡脱俗的美丽和魅力。\n其在原作中的未来命运\n随着散断时期缓慢而不可逆的发展为大碎溃，恋难舍在漫长的岁月中变得愈发孤僻。她在试图戒除对那种压倒性需求的依赖的同时，痛苦地衰老着。她再也无法忍受伤害那些通过梦境塑造了她的人。她的世家把她带到进入[UmbraGlossary('dreaming')]的门径前，将她安放在她珍爱的那片绿色大地上。他们的吟游诗人用竖琴和笛子奏起悲伤的歌谣，他们中最年轻的少女尽力为她梳妆打扮，将白玫瑰缠绕在她脆弱的头发中。战士们同时拔剑斩下，以至于事后没有一个人可以说自己是杀害恋难舍的凶手。当她死去时，玫瑰花全都变黑了，只有她胸前的一朵纯白花苞依然纯洁无瑕。他们希望她的灵魂能穿越梦界，最终找到平静和安宁。为了寄托这一希望，该世家将那朵白玫瑰珍藏至今，它像刚摘下时那样纯白如雪，成为了他们最珍贵的宝物之一。"
 POD_investigate.desc.POD_fae_character_19: "He is the bright and handsome son of the Slavic gods Miesiac the Moon and Dazbóga the Sun. They ordered the spirits to find his perfect love. Dazbóga turned to the sluagh and she placed a geas upon them, commanding that they must search until the most perfect of all maidens could be brought to her son. Charodei, the sluagh sorceress, fashioned a Snow Madien out of ice to seduce Varich. Varich loved her instantly upon sight, but in his embrace she melted away. So distraught with the loss, he is now incapable of ever giving his love to another. Varich has ruled his house for many centuries with an even hand and a just temperament, although he has never lost the darkness and pain he felt. He knows well who betrayed him and does not allow his hatred to cool with the centuries — no sluagh is ever allowed within the Varich freeholds without swearing the most powerful of oaths.\n Future fate in Canon \n Varich has ruled his house for many centuries with an even hand and a just temperament, although he has never lost the darkness and pain he felt. With the Shattering, he went into exile, but returned centuries later with the Resurgence. He remembers everything and still yearns for his impossible love. He knows well who betrayed him and does not allow his hatred to cool with the centuries. For him, it was only yesterday, and the time spent in [UmbraGlossary('arcadia')] did nothing to calm him. Upon his return to the mortal world, he chose to take the body of a dancer in a professional theater group... an inspired choice, since he now gains Glamour from the patterns he helps to create on stage. He owns a fine Queen Anne-style mansion overlooking the bay in San Francisco. His greatest wish is to understand and conquer the pattern of the Endless Winter so that he may drive the Fomorians away when they arrive. Still, he fears what he sees in the pattern of the future."
 POD_investigate.desc.POD_fae_character_37: "The Oath-Truce bores the Hand Eater. He is a competent if sadistic warrior who, unsurprisingly from his sobriquet, is fond of eating the sword hands of enemies. For an Unseelie, he's forthright and even coarse, a fact that makes his speech prone to cause offense eve as it attracts interest. Over the past century, he's honed his tale-telling skills to occupy his court and receive visitors.  Still, its a poor substitute for war, and he's eager to return to the old days of blood and killing frost.\n Future fate in Canon \n During the Shattering, it is not known whether Malgirich fled to [UmbraGlossary('arcadia')] or adopted the Changeling way. It is not known what face he now wears and what name he is now known, if he is alive at all."
 POD_investigate.desc.POD_fae_character_31: "One of the elusive Ghille Dhu, Lailoken is obsessed with omens and prophecies of the coming doom of banality approaching the Fae. He is desparate to protect his magical nature and the sanctity of his home the Pine Stand, a Glade in the Trossachs of Caledonia.\n Future fate in Canon \n With the Shattering, Lailoken remains behind, hidden in his beloved Glade the Pine Stand. After century, he has gone mad. Despite his madness he has taken on  Eoghan, another Ghille Dhu, as a mentee. Few other fae have seen Lailoken, and he seems bored by the politics of Caledonia. His goal is the rebirth of the Tuath Glas Cu, the Barren Pool of Scotland. Fearing his own Winter before his mission can be completed, he sends Eoghann to combat Dr. Erskine and his Dauntain, but Eoghann has so far been unsuccessful. Lailoken's greatest enemy is the Bedlam which always creeps at his heels."
 POD_investigate.desc.POD_fae_character_35: "He has moved with the Bazaar as long as memory, and some speculate it was he who forged the oaths that govern the tent city. Salih peddles information. The Inanimae of Sand supposedly knows the secrets of life and death, of magic and the origins of the fae, of alliances and conspiracies. His knowledge comes with a heavy price. Some who have dealt with Salih have died in pursuit of some bit of knowledge he asked in trade. The risks of dealing with Salih are great, and precious few come away from the encounter with more than they brought, but there are always those desperate enough for answers.\n Future fate in Canon \n During the Shattering, it is not known whether Salih fled to [UmbraGlossary('arcadia')] or adopted the Changeling way. It is not known what face he now wears and what name he is now known, if he is alive at all."
 POD_investigate.desc.POD_fae_character_40: "The Cidrerie de Bacchus is a Satyr lord of a large a jovial court. The revelry there is supplied by copious amounts of 'griggling' apples. Grale is a kindly elder who welcomes any and all into his community. A staunch humanist, the Satyr hesitantly advocates a return to the War of Seasons simply because he is optimistically believes the other Courts will see sense when evidence of his good relations with the humans becomes apparent to all — but perhaps that is just the mead talking. His court is quite renowned due to its numerous ambassadors and diplomats who travel to other courts to extol its virtues (and sample its intoxicants).\n Future fate in Canon \n During the Shattering, it is not known whether he fled to [UmbraGlossary('arcadia')] or adopted the Changeling way. It is not known what face he now wears and what name he is now known, if he is alive at all. Wherever Grale is, he's probably drunk."
 POD_investigate.desc.POD_fae_character_50: "The Lady of Legends, the Mistress of Veils, is a paragon among the Eshu. She is one of the earliest and greatest of the Kith to attain Orisha status. The story goes that the monarch Shahryar, on discovering that his first wife was unfaithful to him, resolved to marry a new virgin every day and to have her beheaded the next morning before she could dishonor him. Eventually, the vizier could find no more virgins of noble blood and, against her father's wishes, Scherezade volunteered to marry the king. Each night, she would tell the king a story but stop in the middle. So each night, the king spared her life to hear the end of the story the next Night. After 1001 nights, Scherezade finally told the king that she had no more tales to tell him and asked to be able to say goodbye to the three sons she had given him during those years. During the preceding 1,001 nights, however, the king had fallen in love with Scherezade. He spared her life and made her his queen.\n Future fate in Canon \n After she won the Sultan's favor she became his wife and bore five children--Two sons and triplet daughters with a gift for prophecy. One of the Sultan's other, jealous wives, however, cursed the girls to bring misfortune wherever they traveled. They caused so much havoc that Scherezade had to plead with the Sultan to spare them with the finest story of her life. He spared their lives but decreed they must be forever separated, otherwise they would destroy his kingdom.\nThe daughters, all elegbara, were bitter and returned the curse with one of their own--a curse sealed with blood--If three of their children were ever to come together, they would bring down the entire Middle East. Uttering the curse they vanished from the earth while their mother whispered tales to the wind every night for their safety but never saw them again.\nScherezade's own fate is unknown."
 POD_investigate.desc.POD_fae_character_32: "An Ondine worshiped as a pagan goddess by several coastal villages along the Baltic Sea, the growing faith in the One God worries her. The mortals float offerings across the waters, and in return the sea washes precious amber upon the shores. Some claim the amber is shards of her palace, while others say it comes from her tears. She has said to have once fallen in love in with a mortal fisherman who the thunder god, Perkūnas, then killed. Her court at the Amber Palace has windows that leads to every shore of the Baltic Sea. Autumn-kin changeling merchants find the palace especially useful, as do many Humanist scholars who reside within. The palace has many fae visitors seeking to use it as a means of quick travel, though Jurata requires all who visit to partake in her hospitality for one night before departing.  She makes a point of meeting her visitors at dusk when they enter, and keeps a close eye on the comings and goings through her realm. She remembers every face that passes through her palace, and quite a few find such information exceedingly valuable.\n Future fate in Canon \n Jurata's fate is unknown, most likely she descended into her freehold of the Amber Palace, shutting it off from the world. If so, she joined the Long Slumber of the Inanimae, entering a state of hibernation to await the time when Glamour would resurge. When the Resurgence actually came in 1969, only a few Inanimae managed to awaken.\nJurata and Kastytis is one of the most famous and popular Lithuanian legends and tales.  The first time it was recorded was in 1842, in the writings of Liudvikas Adomas Jucevičius. The Palanga coat of arms was designed having the legend in mind. The amber beads represent the ancient business of amber processing. The silver crown represents the goddess Jurata. Jurata remains a popular Lithuanian female name."
 POD_investigate.desc.POD_fae_character_82: "House Balor began with Cathal, the son of Lugh of the Long Arm, grandson of Balor of the Evil Eye. He has made certain pledges to the [UmbraGlossary('dreaming')] in return for power and the protection of his line. One such pledge was that the house and all its members would remain steadfastly Unseelie. Thus would their role in the pageant always be fulfilled. To the house, the role is that of the consummate hero: brave warriors for individual rights and the redressing of wrongs against their people, while to the Seelie, they are the villains of the story. Cathal has sought and found many powerful treasures that he held in trust against the day when the Balor will be strong enough to overthrow the other noble Sidhe houses. The fomorian-born sidhe have powers associated with his 'deformity' such as some tolerance of cold iron.\n Future fate in Canon \n Assassins from House Eiluned working on behalf of House Gwydion killed Cathal when his popularity threatened their rule. Cathal predicted his own death and took care to hide the mighty treasures so they would never fall to the Seelie. They have been a sacred trust to the Royal Guardians ever since. House Balor's most cherished lore teaches that Cathal will return to lead them in the final days before Evernight occurs. His battle wisdom, puissant skills in sorcery, and charisma will make him known to the house at the right time. House Ritualists say that Cathal shall be reborn when a red star known as Balor's Eye appears in the heavens of the Dreaming. If this is true, Cathal must even now be among them, waiting to take up the reins of leadership and crush the Children of the Tuatha forever."
 POD_investigate.desc.POD_fae_character_20: "A legendary wanderer, notoriously hard to locate even among the Elegbara, and has a habit of disappearing for a dozen years or so at a time then reappearing with a new face over his old soul. Some of the younger Eshu think this is a result of constantly dying and being reborn in rapid succession and makes him a comedic figure of misfortune. He is in fact one of the Síocháin; one of those rare changelings who have perfectly balanced the twin halves of their nature and so become effectively immortal. His staggering lifespan has allowed him to become fluent in hundreds of languages, master of more than a dozen Arts, walker of every trail and trod on Earth and in the [UmbraGlossary('dreaming')].\n Future fate in Canon \n Dice does not flee the earth with the Shattering. He is one of the Síocháin--one of those rarest fae who have perfectly balanced the twin halves of their nature and so become effectively immortal. His last incarnation was actually nearly a thousand years ago. He began switching faces frequently to keep his friends and enemies alike from guessing his secret. Currently he has the face of a young ile-titu which speaks volumes about his attitude towards others expectations both in and out of the Tribe. His staggering lifespan has allowed him to become what every Elegbara dreams of being--fluent in hundreds of languages, master of more than a dozen Arts, walker of every trail and trod on Earth and in the Dreaming, and witness to more acts and teller of more tales than most folks have hairs on their head. His irreverence is his way of handling the weight of so many years and conceals a noble soul dedicated to teaching and guiding his fellow elegbara toward what he has attained."
 POD_investigate.desc.POD_fae_character_22: "Two courts of noble Sidhe emerged from dreams of the Norse — the mystical Vanes and the martial Aesir. After bloody war, they merged to form the Aesin. The Aesin has given some of their magical power to mortal worshipers and encouraged them to go viking against the Christian Church. The Aesin has been losing its shadow war against the Church, as one Norse kingdom are Christianized. Some voices call for a retreat from Midgard (Earth) to Alfheim ([UmbraGlossary('arcadia')]).\nRagnelf is a calm and gentle woman who has seen her share of tragedies. After her sister Ingirun died, the throne of Aesin went to her. Since then, she has created a strong house out of the ashes of a war-torn family. Her kindness is widely known among members of House Aesin, and although she is well-versed in most Arts, she realized a long time ago that her mind is her greatest weapon.\n Future fate in Canon \n During the Shattering, Ragnelf and House Aesin retreated to Alfheim. With the Resurgence, during the House's return from Alfheim to Midgard, she vanished without a trace when her people were attacked by monstrous creatures of the [UmbraGlossary('dreaming')], probably the Fell. The sadness she has left behind her is hard to bear. When Queen Ragnelf vanished Magnhildr, a member of the Virtue Council, took the throne and now acts as ruler of House Aesin."
 POD_investigate.desc.POD_fae_character_87: "Uathach's name (the terrible) came from a prophecy by the old Tuathan wizard Mathgen, who served as Scathach's mentor and vizier. Uathach exhibited sorcerous skills that outstripped those of the clan's oldest magicians.\nWhen Mathgen finally succumbed to the call of the other departed Tuatha de Danaan and left, Uathach took his place as Malik and head of the Morphean Oracles. She grew in that role and, if she sometimes pursued unhealthy studies into the nature of the eldest of the Elder Darks, she also served the house loyally and well for centuries as her mother's right hand.\nScathach decided that she and the rest of her house would undergo the Changeling Way — Uathach refused. It is said that mother and daughter spoke harshly and that they even came to violence over the matter. Some short years before the War of Trees, Uathach and several like-minded followers departed for the [UmbraGlossary('sea_of_silver')] in pursuit of their destiny. What she has found there she has revealed to few if any. Since her return, Uathach now leads the house.\n Future fate in Canon \nSince Uathach and her followers refused Scathach's perscription to adopt the Changeling Way, during the Shattering Uathach returned to [UmbraGlossary('arcadia')] to further explorer the Silver Sea. Driven by obscure portents and her own hubris, Uathach sought knowledge of the oldest Elder Darks, those of the so-called Emerald Dream. That even such a powerful sorceress as she would dare to investigate beings to whom even the mightiest of the fae are as but gnats would seem absurd. Perhaps. But Uathach never had much appreciation for her limitations. Who can say what, if anything, she found, but this can be said. Some of her number, or perhaps their descendants, have arrived in the [UmbraGlossary('near_dreaming')] (along with those of the other missing houses) and may even walk the streets of the Waking World. The ultimate fate of Uathach) remain unknown even to the Scathach of the Waking World."
 POD_investigate.desc.POD_fae_character_36: "Callicantzaroi is a renowned general who commanded several thousand soldiers in the Battle of Stone; when the retreat sounded, he organized a skillful fighting withdrawal that spared many of his troops' lives. The Blind Lord's court in southern Italy is renowned for being a hotbed of political backbiting and violence. It seems that ambassadors from every Court are welcome here, and the Blind Lord patiently listens to each and every petition, offer of alliance and general request. In truth, Callicantzaroi detests the other Courts, and is mustering the remains of one of the famed Lost Legions, housing them as a tactical advantage to be deployed when the Oath-Truce fails.The blind prince, for all his urban veneer and patient charm, is not a benevolent ruler. Most Winter fae of the court are well aware that he has murderous intentions for the many visitors to his domain.\n Future fate in Canon \n Callicantzaroi's fate is unknown, most likely he went into exile in [UmbraGlossary('arcadia')]. So far, he has not returned with the Resurgence--or has he?"
 POD_investigate.desc.POD_fae_character_07: "Nockers are the artisans among the Kithain, able to craft the stuff of dreams into whatever they desire. Their creations are always flawed, however, and their knowledge of this curse makes them irritable and quick to anger.\nLord Morann the Nocker is a master of the forge. When Dougal came with Cold Iron to forge the legendary blade Anweyth, Morann was one of three fae who stayed with him. When Dougal died making his nonpareil, Morann was named one of the first three Lords of House Dougal. Some Sidhe in House Dougal resent the prominence of this \"Commoner\" Lord.\nMoraan is hard working and tenacious to almost a fault. He can be a difficult task master for both the workers in his forge and his vassals. He doesn't share the enthusiasm for renewing the War of Seasons, finding the conflict a distraction from more productive and profitable endeavors.\n Future fate in Canon \n When the Sidhe flee Earth during the Shattering, Morann stays behind to lead the House Dougal on Earth. Morann managed the House well for numerous years after the bulk of the sidhe left but in time, the few sidhe masters of the house who chose the Changeling Way began to resent being led by a Nocker. When he suffered his first death, the House of Dougal was thrown into a crisis. There had been no discussion of how to pass down leadership. While some argued for a new triumvirate, it was decided to create the position of Grand Master of House Dougal who would reign until Morann, in his new incarnation, should return. Two times in the Interregnum Morann's fae soul never awakened before his human seeming died. During the last change of power, the most tumultuous events happened. A Nocker named Cranad became the Grand Master. He was a master of Simulacra. When Morann awoke, Cranad had him killed and put a simulacra in his place under his own control--the False Morann. Morann sleeps again and Lord Donovan, having cast out Cranad and the simulacra, rules over Morann's Freehold--the Freehold of the Forge."
 POD_investigate.desc.POD_fae_character_29: "斯珞俄女术士相信她可以为瓦里克领主打造一个完美的伴侣，远比他们在现实中找到的任何人都要好。她用雪、冰和魔法塑造了一位。瓦里克很快就迷恋上了雪姑娘，但在他们交合之后，奇魅消融了，让瓦里克心痛不已，他的父母——月神米西亚克和太阳女神达兹博加愤怒不已。众神试图惩罚夏洛代伊，但她知道如何悄然溜入最隐秘和阴暗的地方。最后，他们对她和她的同类施加了三重诅咒：她永远不能创造或拥有完美；她永远不能看到太阳或月亮的光芒而不感到恐惧；所有其他人都会认识到她是一位背叛者。\n其在原作中的未来命运\n夏洛代伊的命运不得而知。在大碎溃期间，她是逃到[UmbraGlossary('arcadia')]，还是采用了换生灵之道，不得而知。如果她还活着，也不知道她现在是什么样子，叫什么名字。"
 POD_investigate.desc.POD_fae_character_30: "The oak strong, the oath breaker and ultimately the ocean heart. A legendary troll, Ottmar was the oathbound companion to the beautiful Sidhe Breanna ab Corwyn Fiona. Together with the Troll's sword and the Sidhe's magic, they defeated the foul Beast of Exmoor. Ottmar became madly, passionately enraptured with Breanna, but he never revealed his infatuation to her. Another Sidhe, Sean the Silver of House Gwydion, successfully romanced Breanna, much to the Troll's chagrin. Enraged, Ottmar forsake his oath to protect Breanna and abandoned her and her lover to being captured by a band of Unseelie. The Tuatha de Danaan cursed Ottmar and all trolls that a breaking of their oaths would both sap them of their Titan's might and also fill them with rage. Ottmar was greatly shamed by this curse upon his entire Kith, and restored his oath by rescuing Breanna and Sean. \n\nFuture fate in Canon \n  At the births of Breanna and Sean the Silver's children, he swore to protect each the children with his life. He was renowned for his duty and kindness ever after. He never took a lover or even another companion. During the Shattering, when Breanna and Sean the Silver and their children left for [UmbraGlossary('arcadia')], Ottmar accompanied them to defend them along the Silver Road. With the Resurgence, it is unknown whether this oath circle has returned to the Earth following the Changeling Way."
 POD_investigate.desc.790791: "In 1053 CE, Rhys ap Ieuan was being crowned king of Rhufoniog (a region of Wales) by the Saxon King Edward the Confessor at Westminster Abbey. However, the heir fell ill, and sent his brother Owain in his place. Sometime later, it was revealed that the sickness was actually a trap designed to kill Owain, who was in love with Angharad, the bride of Rhys. Owain's assassin was a Ventrue that [Glossary('Embraced','game_concept_Embrace_desc')] him. Accompanied by his ghoul Gwilym, Owain returned home in 1093 to wreak vengeance. He killed his brother and pitted his two nephews, Morgan and Iorweth, against each other by linking them and then having Morgan murder Iorweth. To prove his virtue and competence, Morgan set out on a quest to slay a monstrous Gangrel who lived in a cave – a wolf-like creature called Blaidd, who had been ravaging flocks of sheep of the kingdom. Surprisingly, Morgan succeeded by putting a stake through his heart, giving Owain the opportunity to commit $pod_diablerie$ on a powerful elder. After the deed, he quickly lost interest in his family and departed, but not before saying goodbye to Angharad, now an old woman in her 60s who has been living in the abbey of Holywell.\n\nFuture fate in Canon\nOwain will live an eventful life, from his quest for the Grail to his participation in the Anarch Revolt. He will have influence over the Order of the Temple, make friends with the founding members of the Sabbat and act as a spy for them in America.\nBut one cannot escape their fate forever and Owain's destiny was sealed for him from the beginning. Once he will finally understand that, in the final nights, he will be the unwilling Kinslayer of prophecy, traveling the world to free Cainites from the dreaded Blood Curse."
 POD_investigate.desc.791343: "Otto’s madness isn’t that he’s the rightful Holy Roman Emperor. By some measures he really is; he was the son of Otto II and claimed the Eternal City itself in the late 10th century. His delusion is that he still reigns over Germany and Italy as the rightful heir of Charlemagne. Suggestions to the contrary prompt his clarifications: As a vampire, he is forced to operate through mortal catspaws (which do not exist) and he respects the suggestions of “advisors” such as Camilla (who do not serve him). Sometimes Camilla tells him to declare himself ruler for Cainite visitors, and even pretend to be Camilla himself.\nHe’s a skilled warrior, a creative practitioner of Dementation, and skilled at manipulating those who believe he’s a deluded, pathetic figure. He relies on the city’s true rulers for favor; Rome’s ancillae despise him, since many were once the mortal aristocrats Otto stepped on during his mortal days. Otto’s sire is a mystic and vagabond who travels under the name Stephen of Kent, but is actually a far older Phoenician vampire who was the childe of Tryphosa, Camilla’s advisor from pagan times."
 POD_investigate.desc.791264: "A Gallic warrior of the Bituriges tribe, the man born as Cobos illustrated himself during several battles against the Roman invaders. A Lasombra $pod_cainite$, impressed by his skills, defeats and $pod_Embrace$s him. Renamed Victorius by his new master, the newly created vampire is offered a complete education culminating in him visiting Alexandria and making acquaintances with a mysterious Banu Haqim named Dastur Anosh. He then travels with his \"Lost Tribe\" for a while before parting ways.\nStill craving for knowledge, Victorius learns of the possibility that the city of Enoch survived in the [UmbraGlossary('shadowlands')] and dedicates his unlife to learning more about it... until his hatred for the Romans is rekindled once they invade Alexandria.\nComing back to his home region, he divides his time between his revenge and his research until the fall of the Roman Empire. Finally free (seemingly) of his thirst for vengeance, Victorien made great progress in his search for Enoch and was contacted by the secretive Tal'mahe'Ra who, after a lengthy discussion, assured him that all would be revealed in due time.\nAnd so, for now, Victorien is waiting for their return. In the meantime, he has taken a keen interest in Bordeaux and considers the prospect of trying to take control of the city from the English invaders.\nThe spirit of vengeance never truly dies it seems, simply taking new forms as time goes on."
 POD_investigate.desc.790177: "Murcia was once ruled by a reclusive Nosferatu named Yasar al-Nahyan from Damascus. When Cordoban authority collapsed, the Lasombra of Castile moved in but were convinced by the sultan to let him rule alongside an \"advisor\" of their choice. The domain thus remained independent until the Banu Haqim convinced Omar al-Aziz, the sultan's vizier, to act on their behalf. He was never comfortable with his liege and was easily convinced that the city would be better served with a more faithful ruler.\nOmar made his move during the Almohads attack on the city in 1172, killing both Yasar and his Lasombra advisor in the chaos before declaring himself sultan. This execution of a clansmate, without consulting the Amici Noctis, is one of the indignities that has lead this august body to support the Christian cause in Iberia and ignite the current civil war.\nOmar's rule is shaky at best following these events with Yasar's remaining supporters gathering against him. He has however the backing of his Banu Haqim's allies that have kept him safe for the time being."
 POD_investigate.desc.699998: "美杜莎，又被称为蛇发女妖和女族长，是一位逃脱了被她的[Glossary('尊长','game_concept_Sire_desc')]雅斯米利亚德血缚的诺斯费拉图玛土撒拉。\n有人猜测，“女族长”可能只是那位小祖母芭芭雅嘎的另一个外号，尽管她的$pod_Embrace$发生在芭芭雅嘎据称被$pod_Embrace$前的整整一千年。无论如何，传说她居住在欧洲，大多数在那些土地上被$pod_Embrace$的诺斯费拉图都可以追溯到她的血脉。她最早的后嗣之一安吉瓦曾说，他在莱茵河畔见到了他的尊长，尊长泣血哀悼，说她的“兄弟姐妹”想要她死，她的尊长恨她。\n据说，所有没有追溯到尼克图库血脉的诺斯费拉图都可以追溯到女族长的后嗣。"
 POD_investigate.desc.791151: "The Undying mummies tell the tale of Khetamon, a wise ghul (as they call vampires) who turned from the path of darkness and cast himself before Osiris. According to legend, the god-king looked into Khetamon's heart and saw that he truly wished to cease feasting upon the living, but that he could not.\nThe First Pharaoh blessed the repentant Khetamon and taught him how to fight against the corruption that lurked within his spirit (implying that the discipline of Bardo was born out of this event). It is rumored that Osiris even let Khetamon drink his blood for purification, and upon seeing the god-king's mercy, other \"blood demons\" sought redemption for themselves. Since Osiris' strict religious discipline and deep philosophical teachings gave them new meaning, the repentant ghuls began to call themselves the Children of Osiris.\nAfter their Setite enemies struck against Osiris and the Children lost their lord to Set's treachery, Khetamon acted as cult leader for centuries.\n\nFuture fate in Canon\nThe snakes will have the last laugh, ending Khetamon's unlife in the future to come."
 POD_investigate.desc.791161: "The self-appointed leader of the Ravnos in Mogadishu is a woman named Amaria, whose melodious bass voice is the only remnant of her birth-assigned gender. Amaria holds a wealth of information on who’s who in Mogadishu, and she’s surprisingly willing to share with any newcomers. All she asks in return is a friendly conversation — a gambit that turns out well for visitors who can steer the subject to philosophy or religion (subjects Amaria loves to discuss) and poorly for visitors who end up talking about themselves. Amaria’s sharp wit and natural charm mask a darker nature, as she is responsible for slave trade from Mogadishu to her childe Sridhar in Mangalore.\nShe runs the Hanging Gardens in Shangani, and everyone is welcome here. Most end up fawning over her or noticing the danger and running away quickly however."
 POD_investigate.desc.791231: "The beloved childe of Julia Antasia has been [Glossary('Embraced','game_concept_Embrace_desc')] in the early 9th century, a time where Julia was still coming to terms with the fall of Rome. In 1173, Irmgard is sent to Chalons as an ambassador to ease the rising tensions between the Ventrue of the German Black Cross and the French Grand Court. She is targeted by the then Prince, a partisan of Hardestadt, in a brutish murder attempt. Irmgard manages to thwart it and used her considerable position to oust the now isolated Prince from the city.\nSince then, she acts as \"Regent\" of Chalons, surrounded by a Ventrue council. In regards to French politics, Irmgard firmly supports Geoffrey du Temple, believing that a strong Grand Court is necessary to the stability of vampiric Europe. She thus acts as an intermediary between him and Julia Antasia, hoping to foster a large alliance including perhaps even the politically inactive Gaius Marcellus, another childe of Alexander of Paris.\nThis activity has left Irmgard in very poor standing with the other Ventrue Princes of nearby cities who are almost all strong supporters of Hardestadt. Though none have dared trying to oust her again.\nSo far at least."
 POD_investigate.desc.792363: "Gottfried was a foundling and never learned anything of his parents. Until he was seven, he was raised in a small abbey; when the priest there died of pneumonia, however, Gottfried and the other children found themselves on the street. They begged and stole to survive, and when Gottfried was nine he was beaten nearly to death for pick-pocketing.\nHe was discovered by Rutold Bloodfist, who Embraced him despite his broken bones. Bloodfist even taught Gottfried to ghoul his beloved dog, Johann. Gottfried became an unparalleled spy for Bloodfist and Ikkenai, as no one ever regarded a limping, filthy urchin with a similarly scruffy mongrel dog at his side. Even other vampires often suspected he was a Caitiff rather than a Gangrel loyal to the Forest Faction.\n\nFuture fate in Canon\nNo one will continue to pay any attention to him, so it will become very easy for him to gain access everywhere. He will know many secrets, which in time, will bring him a great deal of power. With time, he will also develop a good understanding of politics in Aachen. He will often play the role of consultant to both sides - the city faction, and the forest faction.In 1611 he will become primogen.\nIn 1762, a cabal of Magi will notice him. Technocrats building a base in Aachen, due to the industrialization forced by Frederick II of Prussia. The Magi will close in on him, and Gottfried will escape only with the aid of a Prussian Ventrue. He will return to Aachen after the coast is clear. In 1875, due to overwhelming pressure, he will become Aachen's seneschal.\nFinally, he and Johann will be destroyed in 1941, during the bombing of the city."
 POD_investigate.desc.790295: "温塞斯拉斯是一位面容严峻的老人，他与人交谈时总是咄咄逼人，交替使用威逼和恭维。他特别钟爱与年幼孩童相处，他们的身体与精神纯洁激发了他独特的兴趣和美学欲望，是其他任何美丽都无法取代的。然而，他在所有事物中都追求真正的艺术性，并严苛地要求他人，对于让他失望的人毫不留情。\n其在原作中的未来命运\n \n温塞斯拉斯将加入命运多舛的“以撒阴谋”，如同其他成员一样，他将品尝短暂的成功，却最终迎来极其惨烈的结局。"
 POD_investigate.desc.791297: "在分裂的斯堪的纳维亚，这片火药桶般的土地正陷于入侵的梵卓与本土冈格罗之间的纷争，一支由勒森魃和妥芮朵组成的小团体正在火上浇油。他们的领袖名叫贡纳尔·雅各松，意图利用这阴云密布的紧张局势谋取利益。\n这位勒森魃渴望重获他们曾经掌握的权力，当年他们是最早抵达此地的基督徒之一，但如今这些权力已落入梵卓之手。与妥芮朵盟友一道，他们计划在掌权的战将与本地低等氏族之间引发一场公开的宗教战争，期望在混乱之后收拾残局，攫取权力。为推动这一计划，他们策划了多起针对著名该隐之子异教徒的袭击，企图将梵卓基督徒牵扯其中，制造暴力冲突的假象。"
 POD_investigate.desc.790467: "Szechenyi originally was born in the service of $pod_clan$ Tzimisce through the Vlaszy family – a Hungarian breed of revenants who once rebelled against (and were destroyed by) their vampiric masters.\nNicknamed as the Mother of Horrors because she helped develop a purely discipline-based method of generating the terrible Vozhd war ghouls, Jolan is one of the most loyal defenders of the Tzimisce clan.\nShe prefers to look young, beautiful, and somewhat human, but with some differences. Her body has avian wings and the legs of a harpy. Her hair often has a snake-like Medusa appearance. She seldom wears more than a simple white robe. Jolan also keeps a half-dozen ghoul bodyguards nearby, which she reshapes to look like icons of masculine beauty from Ancient Greece or semi-human mythological creatures.\n\nFuture fate in Canon\nJolan will join the Sabbat eagerly and become one of the most knowledgeable practitioner of vicissitude of the world. Relocating to the heart of the sect, Mexico City, she will create many new horrors to help the Sword of Caine achieve its goals."
 POD_investigate.desc.791479: "As any old woman in Salento can tell you, if you wish to know if your son will return from battle or if he’s lying dead on foreign land, you must travel to Calimera and find Yannis. His daughter will find you and lead you to him, and he will only speak to you at night, from behind a veil. He will ask you terrible details and secrets, and after three nights, you will find a stone on your doorstep — white for life, black for death.\nRumors about Yannis made their way to the ears of Frederick II, who doesn’t care much about the risk of excommunication and such other papal fits when he needs all the information he can get. As it turns out, Yannis is the real deal. He has provided Frederick with intelligence he could not acquire by any other means. All he asks for is a femur from one of Frederick’s countless enemies once in a while, and a jar with their blood. This working arrangement has proven itself quite agreeable for both parties so far, but Frederick’s going to die soon, and any protection Frederick provides Yannis will die with him."
 POD_investigate.desc.791325: "Egle is the widowed bride of a dead lord who once ruled Voruta with an iron fist, blood bonding those in his domain. His disappearance saw Egle step in as a ruler, using a mixture of the fear her late husband still inspired with a more lenient rule to cow the other pretenders to the throne.\nHer rule is still shaky at best, relying on a council of elders in the domain that she can hardly go against in the fear of being summarily removed. She bides her time then, using the Setites' known talent at amassing favors (or outright blackmail) to grow her actual influence in Voruta while shielding herself being the old laws of the land.\n\nFuture fate in Canon\nElge will meet her end when she is forced to act against Gabija, a Tzimisce living at the edge of her domain. The monster will play her own game against her, continuing his bloody actions while still respecting the law of the land. When she will be finally coerced to pronounce a judgment against him, it will be an unlawful one. Gabija will prove it and his own sentence of her lapse of judgment will be a long and painful one."
 POD_investigate.desc.792624: "龙梦曾是一位哲学家，但在遇见他的师父后，人生轨迹彻底改变。很久以前，龙梦的师父——一位古老而现已逝去的[GetTrait('kueijin').GetName( GetNullCharacter )]，曾遇到名为“瞾喇”的西方吸血鬼。此人是叛徒与窃密者，盗取了[GetTrait('kueijin').GetName( GetNullCharacter )]的诸多秘术并加以扭曲以谋私利。龙梦从师父那里继承了使命：让瞾喇的恶名永不湮灭，并设法弥补这卑劣之徒造成的部分伤害。\n孤独的追寻让伦孟踏遍世界，搜寻关于此獠下落的线索。他得知西方人称之为“扫罗”，而深入了解宿敌的这一化身，正是他当下赋予自己的使命。\n\n其在原作中的未来命运\n龙梦将积累大量关于瞾喇的珍贵情报，但最终给予这位大敌致命一击的，将是他的弟子英雷"
 POD_investigate.desc.792055: "有些妥芮朵学者向该隐之子社会展现另一种历史，在该版本中伊娜依娅被描述为男性。据说在大洪水后，上古耆宿们起义并屠杀了他们的二代尊长。该隐从自我放逐回来并因此罪行诅咒其后代。妥芮朵氏族宣称该隐诅咒了所有上古耆宿，除了伊什塔尔，她还是保持倾国倾城之色。\n该隐相信她未参与对其子嗣的谋杀。但他对妥芮朵的怜悯激怒她的所有血之手足，特别是被诅咒成为“野兽”的伊娜依娅。因此伊娜依娅开始着手谋杀上古耆宿妥芮朵，一路追踪她到古苏美尔文明。\n伊娜依娅在那以“恩奇都”为名并$pod_Embrace$名为埃列什基伽勒的女性来协助他对上古耆宿妥芮朵的袭击。伊什塔尔的情人——搭模斯英勇地以自己的生命为代价，提供该上古耆宿逃脱埃列什基伽勒的方法。伊什塔尔逃脱并向国王吉尔伽美什提议初拥，但他早就被伊娜依娅诱惑，选择站在冈格罗一方。\n据说最终伊什塔尔召唤出被称为天牛的巨大凶兽以逃出苏美尔。伊娜依娅则决定留在那里，“他”在那再造了一大群冈格罗。"
 POD_investigate.desc.792131: "The only survivor of a village struck by a plague in Asia Minor, the young Duyal was saved by a traveling Sicilian monk who took pity on the boy. Receiving a monastic education, he discovered a real talent for calligraphy and illumination. This earned him a place as an assistant to the famous naturalist Idrisi who was working for Roger of Sicily at the time. Found shortly after by a traveling patron of the arts Toreador, Duyal was [Glossary('Embraced','game_concept_Embrace_desc')] and started wandering the world alongside his new mentor. Coming to Jerusalem, Duyal was enthralled by the architecture and art of the Holy City and decided to stay.\nNowadays, he does secular and religious work both, from calligraphy on ceremonial documents to decorations on lintels and mantels. He is an apolitical and generally well liked figure of nightly Jerusalem.\n\nFuture fate in Canon\nDuyal will take action when his beloved art is threatened by the despoiler Marcus before being forced to leave the city during a renewed assault by witch hunters during the 14th Century.\nSettling down for a time in Madrid, he will flee when the Reconquista becomes too pressing. Sadly for him, he will fall into Tzimisce hands in the 16th century. His end will be agonizingly slow and painful."
 POD_investigate.desc.792142: "位于圣地北部的一处隐秘而肥沃的山谷中，据说“该隐之谷”是上帝为了纪念亚伯及其令祂喜悦的献祭，而特意保留下来的伊甸园遗迹。来到此地意味着经历某种独特的体验——心兽与理智之间的完美平衡。\n可惜的是，没有人能够永远停留在那里。尽管山谷郁郁葱葱、猎物丰富，但却无法真正捕获任何生灵。除非选择蛰眠，否则访客终将渴求鲜血。\n约伯是通往此地的唯一向导，也是最伟大的守卫者。他自己从未踏入过山谷，但声称亲眼目睹了许多人进入，并在他们离开后听过他们的故事。\n当然，那些故事仅来自于仍有意志离开的人——而非那些在山谷中陷入永恒幸福的蛰眠者。"
 POD_investigate.desc.791068: "Alam is consumed by visions granted by the djinn in his blood. He sees the coming hordes of Hell riding over barren plains to destroy Samarkand. He has a broad and deep variety of visions, most of them are delusions: While Alam occasionally receives flashes of insight or visions of the future, for the most part he is wrapped up in scenes of the impossible.\nEvery six or seven days, however, Alam regains his senses. Usually this is when his vampiric hunger has gotten a bit of insistence and edge to it. Alam is a ruthless and swift hunter: His awareness of the undercurrents of fear and madness that drive humans’ activities at night pulls him to likely prey, and he rarely bothers to spare a life.\nAlam’s head is bald. He is of indeterminate age; the lines around his eyes and mouth are the products of madness, not decrepitude. His eyes are sunken and somewhat hollow, but they burn with an inner light."
 POD_investigate.desc.792885: "An unblinking adherent to the teachings of Osiris, Abu al-Intiqam is a peaceful and sheltered individual, willing only to live by the creeds he believes in.\n\nFuture fate in Canon\nBecoming the leader of the Children of Osiris, Abu will be given the greatest gift of all in 1999, Osiris' blessing. He will be redeemed before his God's gaze and returned to life as a mortal.\nHis unthinking adherence to the tenets of his progenitor will be rewarded with the lifting of the Curse of Caine from his soul, bestowing upon him the gift of life anew. Rather than die instantly, however, he will simply begin to age normally from that point on. What’s more, he will had full recollection of his considerable time as one of the undead.\nMortal once again, Abu al-Intiqam will be determined to turn the world of the undead on its ear, single-handedly, if necessary. He will view the rest of his allotted life span (brief by way of comparison) as a countdown — the ticking clock upon his newfound purpose. In the few short years that he has left, he will use all he has learned in his centuries of existence to ensure that the damned Childer of Caine come to know the peace that can only be found in the utter annihilation of the Beast Within.\nHe will know firsthand what awaits those who are worthy, and he will vow to show them the way before it is too late for them. As for the rest… those who willingly choose to embrace the darkness rather than lead their unlives in search of light shall know the judgment of the Lord.\nAs a vampire, Abu al-Intiqam had been the unquestioning head of a house of peace. As a mortal, he will become the unforgiving hand of God."
 POD_investigate.desc.792761: "贝撒列尔的第三个恶魔仆从，与其说是仆从，不如说是知己。在战争期间，贝撒列尔与内列尔曾是朋友，甚至在某种意义上是恋人。像贝撒列尔一样，内列尔也是死亡天使，但她并未像她的爱人那样深切感受到凡人恐惧的刺痛。从地狱获释后，她最初因再次见到贝撒列尔而欣喜若狂——随后却被他变成的样子震惊。她留在他身边，一方面是因为他知道她的[Glossary('真名','podgloss.truename')]，理论上能召回她；另一方面，她迫切希望能够拯救他。然而，她心中几乎没有真正的希望。虽然她曾知晓他的[Glossary('真名','podgloss.truename')]，但由于他与芭芭雅嘎的纠缠，贝撒列尔已被严重扭曲，连这一最本质的部分也被玷污与腐化。"
 POD_investigate.desc.790761: "赫尔辛基的血族局势独树一帜。许多吸血鬼将人类作为仆从和代理，这些受诅者——血仆——通过吸食主人之血获得邪恶的力量。大多数血族视这些存在为奴隶或玩物，最好的情况不过是将其当作有趣的宠物对待。然而，在赫尔辛基，血仆被视为平等的存在。托莫·马库斯·萨姆普萨亲王主持着一个类似长老会的议会，其中由三位血族和三位血仆组成。萨姆普萨自己的血仆伊娃更是以亲王的名义发言。\n赫尔辛基的血族——乃至整个芬兰和大部分斯堪的纳维亚地区的血族——大部分时间都在沉眠。每年夏天，太阳数月不落，使血族在这段时间内完全依赖于他们的凡人仆从。尽管血族之血通常会使饮用者产生邪恶的忠诚，但萨姆普萨确保了他的地位稳固，正是因为他保障了这些仆从的欲望与忠诚。"
 POD_investigate.desc.790426: "When Caesar's legions invade Massalia in 49 BC, the ruling Prince, Demetrius of the Ventrue, is furious. Accusing the (completely innocent in this matter) vampire Gaius Fabricius of masterminding this attack, he starts a feud of epic proportions between them and their lineages. After centuries of petty fighting, Gaius strikes a decisive blow by hiring Assamites assassins during the sack of Marseilles by the Saracens in 838, forcing Demetrius to flee his city. Finding only contempt when he tries to appeal to Alexander of Paris for help, Demetrius is exiled from France and flees to Aquileia for support.\nStrengthened by this victory, Gaius Fabricius starts another project: ousting Alexander of Paris from the French throne. To this end, he notices the potential of his grandchilde, Saviarre, and forces her to [Glossary('Diablerize','game_concept_diablerie_desc')] her own [Glossary('Sire','game_concept_Sire_desc')] before reshaping her memories. Now a perfect pawn for his plans, Gaius send Saviarre to Alexander's side where she proves to be truly skilled, manipulating the Methuselah and becoming the true power in France for several decades. Before Gaius can makes his final move however, Salianna and Geoffrey foment a palace coup that removes Alexander from power and (seemingly) kill Saviarre. With his plan thwarted, Gaius Fabricius hasn't noticed that his old foe Demetrius has been slowly gathering enough power to restart their old feud anew.\n\nFuture fate in Canon\nDemetrius and Gaius' feud continue to this night. Neither of them gain the upper hand for long and they neutralize each other so well that they have become mostly inconsequential in vampiric politics."
 POD_investigate.desc.791340: "Rhiannon was a beautiful child. Her mother — a minor noblewoman in the court of Powys — likened her voice to that of an angel. Music was her life and through it she could get her heart’s desires — clothes, sweetmeats, pets — as much of the court fell in love with the delicate music of the young girl.\nDespite her skill, her sex blocked her path onward — in a young girl the pursuit of music was charming, but as she grew into womanhood it was an eccentricity to put aside. For long years Rhiannon wandered, cast out by her family and shunned by society. She fought, fornicated and feasted, taking in every experience her young body could survive. Her songs changed, no longer the simperings of a girl-child but biting satires from which none escaped. Rhiannon’s metamorphosis pleased an old vampire, Angharad of the Gangrel, who saw in her feral behavior an ideal “daughter” for the clan.\nAt first the world of Cainites shocked Rhiannon but soon she came to revel in the new reality that surrounded her, finding in the Cainites and their politics a bottomless well of tales to be told and notables to be brought low. In the centuries since her Embrace, Rhiannon has variously praised and ridiculed most of the Cainite notables in the Isles, though she frequently singles out her distant kinswoman Baroness Seren and Prince Mithras, leading to her being unwelcome in both Gloucester and London. Instead, Rhiannon wanders the Isles, visiting the barons’ courts and other sites that pique her interest, all the while seeking new experiences for her undead body."
 POD_investigate.desc.790139: "Born Suleviae of the Parisii, \"Saviarre\" was a bright and beautiful woman consumed by envy for her sister Mnemach. While she had everything else she wanted, she never could have the respect Mnemach, as a favorite of the druids, enjoyed. Suleviae schemed to get the power she craved but the Roman invasion of Gaul put a stop to her plans. Noticed by the cruel Ventrue Titus Gaius, Suleviae was mentally broken and remade into a creature of cold and sadistic demeanor, the memories of her old life purged in the process.\nThe newly christened Saviarre endured her master's ruthless teachings until her grandsire, Gaius Fabricius, noticed her and took her \"training\" to another extreme, forcing her to [Glossary('Diablerize','game_concept_diablerie_desc')] her [Glossary('Sire','game_concept_Sire_desc')] before conditioning her for his own purpose. Joining the court of Alexander of Paris, Saviarre quickly became the real power in France as she encouraged Alexander's lapses into mental instability. Before she could strike the coup de grace however, Salianna and Geoffrey launched their own palace coup, exiling Alexander and delivering Saviarre to her sister Mnemach, the price for the latter part in the coup.\nNow under Mnemach's care, Saviarre has started remembering who she really was and all the horrors she endured, and made others endure. Despite Mnemach's best efforts, Saviarre's psyche is reaching a breaking point alarmingly fast and the once most powerful vampire in France could soon be reduced to a monstrous and mindless wight."
 POD_investigate.desc.790979: "Born into a family of wealthy slavers in Baghdad, Salah grew up knowing nothing but wealth. He became a quite adept slaver, bringing wealth and influence alike to his family. He suffered, however, under psychotic rage attacks that he acted out against his wife and children.\nWhen he met his sire, the two fell in love and began a relationship that was accompanied by a slow introduction into the cult of Set. Salah first became his sire's ghoul and acolyte and was later rewarded with the Embrace for his faithful services and released him to spread the word of the Dark God.\nSalah bore a particular ill will against the [Glossary('Ashirra','game_concept_ashirra_desc')], and traveled to Sevilla and al-Andalus in 1202 to undermine their rule. By cataloging the weaknesses and vices of the local Ashirra leaders, he managed to give Christian invaders useful information that led to the liberation of the city. He has also made contacts with influential Christian Lasombra such as Lucita of Aragon, hoping to ingratiate himself with several of these ambitious lords by revealing to them the vulnerabilities of the Ashirra power structure. In this way, he hopes to spread the cult of Set into Christian Europe.\n\nFuture fate in Canon\nHowever, he had made a powerful enemy in the Gangrel methuselah Shabaqo, who will eventually hunt him down and kill him in the latter half of the thirteenth century."
 POD_investigate.desc.790992: "Sobek is a large, bald, bull-necked man in his early 40s. His face looks as if it is carved from sandstone and is often as enigmatic as the Sphinx itself. His smile is a little sly, which is a habit he cannot seem to break. His ceremonial garb is green and gold, and he carries a long golden staff with a cobra coiled around it.\nEmbraced into a high position within the $pod_clan$, Sobek uses his position and wealth to further his Clan's goals among mortal society. Loyal to his mistress, the child-methuselah Neferu, Sobek acts as her emissary to visitors of the Court while he overlooks the Typhonic ceremonies.\nWithin the Fire Court, he is not well liked, as some believes him to be a buffoon. Sobek is known to indulge in nearly all vices and perversions. His most well guarded weakness is his fascination for Neferu, an unholy lust burning inside him that he dares not consume knowing full well the folly of such an attempt."
 POD_investigate.desc.791158: "Every linen merchant worth his salt traces his business to Aphobis, whose control over fabric trade to Egypt is indomitable. Aphobis abhors the slave trade, since he views the subversion of freedom an abomination against $glossary_wyrm_apep$, but his best efforts to stop it have been futile.\nHe also owns the Jade Horse inn, which serves as a gathering place for vampires disenchanted with Mogadishu’s balance of power. Patrons believe the big-bellied Egyptian is a dupe for assuming hosting duties (and potential blame) for a group so eager to dethrone the Na’ib, but Aphobis is keenly aware of the risks and rewards of his position.\nHis current project is inciting the Toreador and Lasombra in rebellion against the Na’ib. Aphobis is eminently subtle, though, and the Na’ib (while she does suspect him) can’t retaliate lest she appears tyrannical and fuels the Lasombra and Toreador’s simmering resentment.\n Aphobis offers aid to all Cainites making their first forays into Mogadishu. He demands a modest fee in return, which is entirely a smokescreen for his true purpose: to sow dissent and create chaos. Without the Setite’s careful nudges the Toreador and Lasombra might have given up on Mogadishu already.\nAphobis is a true adherent of $glossary_wyrm_apep$ and preaches freedom in all things. Faithful must cast off the shackles of society, morality, and (finally) of self. He is a remarkably apt teacher, who pushes his students well beyond their limits, but not (or at least since his arrival in Mogadishu) beyond their breaking point."
 POD_investigate.desc.792873: "Noirceuil is one of the most well guarded secret of the Church. A vampire hunting and killing his own kind, far more efficiently than most Inquisitors. A man without a past, sometimes rumored to have been a priest before becoming one of the Damned.\nOne lonely night, three damned souls rotting back to dust in the wake of their passing, a traveling companion had broached the subject of the past. He’d gone so far as to ask the hunter why—why the pain, the fire… the darkness? It was a mistake he’d never repeated. One glance into those cold, deep, empty eyes, had been enough answer for a lifetime. For several lifetimes. Noirceuil had not said a word. Nothing. He only continued killing, going more extreme in his methods and his fanaticism with each vampire falling to his hungry blade.\nNo amount of success would quell that one’s hatred. No amount of revenge would end his pain, whatever it might be.\nNoirceuil’s mind is so attuned to the Damned he hunts that his habits mimick theirs at times. His violence grows with each hunt, his ability to ferret them intuitively from behind their clever disguises and the many masks they wear is unparalleled.\nNoirceuil's eyes burn with the fire of the fanatic, dreaming of the next prey that will be consumed by his righteous rampage. All for the glory of Rome.\n\nFuture fate in Canon\nNoirceuil will meet his match during his hunt for the infamous Montrovant. Despite overpowering his opponent, he will be ambushed and killed by unexpected reinforcements using his weakening state to get rid of the vampire hunter."
 POD_investigate.desc.792809: "胡安是萨拉曼卡大学的法律系学生，一直痛恨富人的专横作风。尽管出身富裕家庭，他却努力为穷人发声，这种激情吸引了一位布鲁赫，并因此获得了$pod_Embrace$。在查理曼统治期间，他随这位布鲁赫来到亚琛，但不久后便对查理曼及其统治心生厌恶，认为他对撒克逊人的反击不过是另一种形式的欺凌。\n这让胡安对撒克逊公主伊奇奈爱慕不已，并最终坠入爱河，暗中帮助她对亚琛的吸血鬼们展开复仇。然而，他仍将自己的同族科西乌斯视为一位有荣誉感的人，认为他或许能为亚琛的该隐之子带来正义。这种分裂的忠诚逐渐成为胡安心灵的重担。\n\n其在原作中的未来命运\n胡安在追求正义的道路上变得愈发狂热，但仍因调解该隐之子争端的能力而备受追捧。然而，对伊奇奈的单恋最终促使他在18世纪前往美国。19世纪返回欧洲后，他发现自己无力阻止第三帝国的崛起，便迁往新奥尔良和明尼阿波利斯，在那里，他至今依旧执掌着自己独特的正义之道。"
 POD_investigate.desc.791467: "An unremarkable scion of an unremarkable member of the Arpad vampire family, Istvan came to the attention of Alexander of Paris when he was introduced to Jurgen's court while accompanying his [Glossary('Sire','game_concept_Sire_desc')] on a diplomatic mission. Seeing something in the man, Alexander \"requested\" that Istvan was put under his care and soon confirmed what he thought upon first seeing him: Istvan is a monster ready to be unleashed.\nUnder Alexander's tutelage, the young Ventrue soon found his calling in perfecting the art of torture and the many ways to make people suffer. Grateful to Alexander for allowing him to run rampant, Istvan soon became one of his favorite lieutenants during his exile much to the discomfort of other members of the court. As the campaign against the Ferals of Livonia is being planned, Istvan already has, under Alexander's orders, started rampaging upon the mortals of Livonia.\n\nFuture fate in Canon\nIstvan will become a major thorn on the Ferals' side who will fail to stop him several times. His final task for Alexander will be to desecrate the tomb of Aajav, the beloved [Glossary('Sire','game_concept_Sire_desc')] of the Ferals' leader Qarakh. Hunted down by Qarakh himself as he was trying to flee, Istvan will be caught by the Gangrel's wolf form and savaged to death."
 POD_investigate.desc.791350: "Charismatic and likable, the horrifically scarred Asgeirr is the face of Valborg’s band to the world of mortals. He earned his unhealing scars when he accidentally set himself on fire during a raid in Karelia, and his comrades find that fact hilarious. As the mockery piles up, so does Asgeirr’s bitterness — one night, it might go too far, especially if some new Cainite warrior decides to egg on the jokes."
 POD_investigate.desc.791460: "A woman of distinction, Arianne was always fascinated with the hidden side of courtly life. At the turn of the 12th century, the Arpads wanted to emulate the culture of the Westerners. Through careful diplomacy, Arianne gained the opportunity to travel and learn the ways of the Parisian courts. What she saw changed her forever.\nArianne was turned in the year 1120 in Paris by an unliving lover. Though she fell madly in love, her [Glossary('Sire','game_concept_Sire_desc')] saw her as a mere amusement. He began to school her in the ways of courtly love, educating her in its intricacies. When her sire rejected her for a mortal who had engaged his interest, she sought revenge. At first she acted jealous, playing fully into the rules of courtly love. Then she became curiously complacent and even offered to arrange a secret tryst between her sire and his lover.\nOne evening, her sire’s beautiful young mortal lover awaited him in an elegant bedroom. The elder stormed the room to take his lover, body and soul. As he savored the mortal’s blood, he found it intoxicating. But, just as ardor burned in his breast, the young woman’s blood burned on his lips. The poisons Arianne had steeped in the mortal’s blood infected his bloodstream, and he fell into a torturously painful $pod_torpor$. Love and death, after all, are often intertwined.\nReturning to Hungary, Arianne quickly became an important addition to the Hungarian Cainites.\nShe has retained one vice: an amusement with courtly love. When she plays this game however, she does so with a vicious edge. The rules are always twisted to her advantage. The loss of her first love forces her to see flaws in any budding romance, and driving such alliances to destruction fulfills her. Thus is her taste for romance consummated. As the Romans have said, all is fair in love and war.\n\nFuture fate in Canon\nThe Szantoviches will learn a great deal from her tutelage. Her infamy and rejection from her own clan will one night make her one of the first Toreador antitribu."
 POD_investigate.desc.791457: "Ruxandra began working in her father’s tavern at the age of 15. Though her father had taught her the value of hard work, he was rarely thankful for what she did. Nonetheless, she was the recipient of other interest. She knew how often the gaze of drunken old men lingered over her body. At first she was ashamed, but soon she became amused by how she could use this gift to her advantage.\nAnother frequent visitor to the inn, Marusca of Clan Nosferatu, also learned of her talents. Many a time, Marusca would enter the inn in disguise. Within a few months, Ruxandra’s charm and beauty impressed another visitor. Olithio Szantovich was a lackey to Nova Arpad, one with an eye for beautiful women. She accepted his offer to work for him.\nWhat she experienced scarred her for life and beyond. Within the private chambers of the Arpad household, the revenant slave lord conditioned Ruxandra to submit fully to her master. Through careful Domination, her memories of these nights were eradicated from her mind, but the scars and bruises were not so easy to hide.\nIntent on freeing the young woman from servitude, Marusca abducted and Embraced the girl. To Marusca, Ruxandra’s liberation was a blessing. To Ruxandra, the hideous transformation she underwent was a curse. Abuse had destroyed her self-esteem, psychic torment had destroyed her mind, and the $pod_Embrace$ of her Nosferatu guardian angel had destroyed her beauty. There were only two condolences from her Dark Gift: the ability to Obfuscate and the opportunity for revenge.\nThe more horrified she grew from her disfigurement, the more she studied various tactics of manipulation. Over time, memories of her abuse began to resurface, and the Beast within her harnessed that pain. She did manage to achieve vengeance for a time, kidnapping Nova Arpad and impersonating her before she was freed. Nova has now declared a blood hunt on Ruxandra who see this as a challenge and potential entertainment for the centuries to come."
 POD_investigate.desc.790374: "Ansen was born a low but very promising noble in England. His father owned land, possessed a title and gave his son all that he could. Of course, this meant that Ansen was sent in his aging father's stead when the pope called the First Crusade. He did not believe in the cause but he could not disobey the call.\nThe Crusade awakened in him something that neither he nor the Church that sent him expected: a true thirst for violence and plunder, and a penchant for sadism. His noble life had shielded him from such things, and his first taste of them in the Holy Land proved far too seductive. He took full advantage of the blanket remission of sins for Crusaders, and killed, plundered and raped with a viciousness that defied his normally calm and uncaring visage. During the siege and conquering of Jerusalem, his bloodthirsty actions caught the eye of a Baali.\nThe Baali's group of infernalists was attempting to unleash a demon with help from the heightened emotional craze of the Crusaders, but Ansen's actions seemed unforced, almost as if he were willing. They quickly subdued and [Glossary('Embraced','game_concept_Embrace_desc')] him. He awakened to his new state with a mix of terror and fascination. Vampirism was beyond his realm of belief, and the demonic acts of the Baali even further. However, the sect of infernalists had chosen their childe well. Ansen quickly saw where the power of perversion led and accepted it completely.\nHis sanity quickly began to suffer. His sadism waxed, and he reveled in the blatancy of the Baali. He also began obsessing over secrets, the unknown names in the world that hid the truth from even him. He was a vampire, with the powers of demons behind him, and yet he knew little more about the world than what he had when he was mortal.\n\nFuture fate in Canon\nTravelling to Transylvania to guard and worship the demon Kupala, Ansen will end up devoured by his master's Cathedral of Flesh."
 POD_investigate.desc.790533: "在愚蠢盛宴之前，恩热是卡帕多西亚氏族中一位能够左右局势的玛土撒拉，直到其与族人被困于[UmbraGlossary('shadowlands')]之中。这些血族后来以骸骨预告者为人所知。为整个血系被阻隔于尸幕之外而愤怒，恩热陷入长达近两个世纪的疯狂。但恩热不是那种只会沉溺于过去悲剧的角色。\n以在[UmbraGlossary('shadowlands')]唯一能找到的$pod_vitae$维生——也就是同样被困的该隐之子族人——恩热习得强大的死亡魔法。如此强大以至于她能突破尸幕联系其尊长，告知他其子嗣所面临的困境。起初雅弗很抗拒，声称阿舒尔(即卡帕多修斯)后裔的命运不该被逆转。然而随着与乔凡尼家族的交手越来越多，一道巨大的溃疡在他的灵魂中滋生，他开始意识到，那些死灵术士今日的显赫地位，其实都是他们欠他的债。雅弗与恩热达成了一项脆弱的协议，他同意帮助恩热举行仪式，使他们摆脱邪恶的陷阱，但前提是恩热必须按照他设定的规则行事。\n\n其在原作中的最终命运\n只有雅弗与恩热各在尸幕两端使用黑魔法才能打开足以让骸骨预告者再次回归人间的传送门。\n而那将会是一场何等的回归啊。\n在能够发动那场难以捉摸、复仇的关键一击之前，骸骨预告者将耐心地陪着长老血族们下这盘棋，从各个可能的方向操纵魔宴，使其一步步走向他们真正的目的。恩热本身就是诡计大师，她甚至不惜将对手的灵魂困在他们终末之死后的骨头或灰烬中，以便继续利用他们。关于她的可怕传闻在派系中流传，但她毫不在意。毕竟，时机成熟后，她将成为所有人的主宰。也就是当她和其尊长达到神明的地位之后…..."
 POD_investigate.desc.792126: "Born in Jerusalem under Muslim rule, Shahara was outside of the city when the crusaders slaughtered everyone inside the walls in 1099. She was [Glossary('Embraced','game_concept_Embrace_desc')] by a Setite recruiter explicitly looking for prostitutes willing to use both words and body to gain power in the changed city. Shahara proved skilled at this, learning how easy it was to turn men away from their lofty ideals and drag them into the depths of their personal torments.\nShahara is now plying her trade towards the corruption of much more difficult targets: the Cainites of Jerusalem. Her best prospect so far has been the childe of the prince, Vicelin, with Shahara finding it almost too easy to encourage him to act on his barely restrained instincts...\nFuture fate in Canon\nWhile Vicelin's corruption will prove a success, Shahara will then be hunted down by her clan's traditional enemies, the Banu Haqim. Fleeing Jerusalem and moving from place to place, she will finally settle in Rio de Janeiro in the middle of the 20th century where she will become a major player."
 POD_investigate.desc.791100: "Yusri al-Margil was once a craftsman, a man with a family and responsibilities. Then he was a servant to a powerful creature of the night — a position that came with responsibilities all its own and allowed him to improve his family’s lot. With the withdrawal of the Seljuqs and his benefactor, Yusri has fallen on hard times. He has corrupted his family, leaving his youngest children to scrabble for sustenance in the destroyed quarters of Baghdad while dragging his oldest sons with him at night in the mobs that hunt down unwary Cainites to feast on their blood.\nWith every passing night, Yusri grows less trustworthy. He meets with vampires to trade them blood for information, but lately he has taken to evaluating his benefactors as potential targets, regardless of his given word of truce. He also grows more careless of the truth — finding desirable information takes time away from his desperate hunt for blood.\nYusri is currently frozen at an age that might be called “respectable” if he weren’t running through the midnight streets like a torch-wielding hooligan. He is tall and strong from a lifetime of hard work, but his face and body carry some hideous scars earned at the claws and fangs of dying Cainites."
 POD_investigate.desc.792262: "德高望重的以利亚·艾哈迈德选中了热心的哈基姆圣裔艾拉成为自己的子嗣。艾拉作为一名十字军战士，她尽职尽责地执行长者们的命令，为自己赢得了不少声誉。然而，除了严厉的外表，许多人还发现艾拉的目光中有一种近乎梦幻的特质，仿佛她总是在寻找什么遥不可及的东西。\n\n其在原作中的未来命运\n艾拉的职责将一直持续到二十世纪。她将参加第一次和第二次世界大战，1911年11月，她将遇到未来的图森亲王莱托卡明斯基。他们将成为恋人，但彼此的关系最终会渐行渐远。\n她将会对飞行着迷并开始自己驾驶飞机，但这个快乐的时刻也不会持续太久。在她生命的某个阶段，可能是在1945年之后，艾拉将遭遇危机：她会开始质疑血族的方式，以及自身的存在。即使是莱托也无法将她从抑郁中解救出来。\n她这样的状态会愈加严重，直到她被另一个哈基姆之子朱利安辛和他指导的信使发现。朱利安在看到艾拉精神错乱的状态后试图亲自[Glossary('吸榨','game_concept_diablerie_desc')]艾拉，但他在最后一刻退缩，并鼓励信使动手——他们很乐意。\n正如朱利安在与莱托的最后交锋中所说，艾拉在他发现她之前就已经死了，显然，吸血鬼或许有不死的躯体，但没有不朽的灵魂。"
 POD_investigate.desc.792365: "甘朔生活在残酷的秦朝，他渴求个人权力，其残暴程度堪比始皇帝本人。当汉朝推翻秦朝时，甘朔被折磨了七天才被处死。进入[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]界后，他再次受到[Glossary('阎魔女王','podgloss.yamaking')][Glossary('斗姆','podgloss.toumu')]的折磨，直到他挣脱束缚，作为[GetTrait('kueijin').GetName( GetNullCharacter )]重返中原。\n他被发现并分配了一个[Glossary('屋室','podgloss.wu')]和导师，但甘朔在政策和程序的束缚下感到不满且渴求权力。这种通过他人痛苦带来的权力，即使是在他在[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]界的经历也没有减少对其的渴望。他开始以折磨他人所产生的气为食。他的行为使其声名狼藉，并被送上法庭接受审判。他被宣布为[akuma|E]，并被判处湮灭。然而，他逃脱了刽子手的追捕。现在，他在中原四处游荡，死亡和恐怖如影随形。\n\n其在原作中的未来命运\n最终在18世纪中叶，他找到了他所需的一切。那就是在南蛮横行的香港岛上的一个永久居所。甘朔将利用香港的混乱局面，巧妙地在愚昧的凡人和志同道合的鬼神中编织出一张同盟之网。他的腐败与罪恶之网都是为了满足他的堕落欲望。他希望将省内所有不同派别玩弄于股掌之间，让自己成为命运的主人。\n而在[UmbraGlossary('hell_of_being_skinned_alive')]中，[Glossary('斗姆','podgloss.toumu')]大笑不已。"
 POD_investigate.desc.POD_wraith_01: "卡戎，冥河初代摆渡人兼唯一帝王，是黑暗世界最具关键性的人物之一。这位来自迈锡尼古文明的亡者，缔造了死者国度的诸多制度体系——包括摆渡人组织、冥河城及冥秩官僚体系。\n\n据传由圣经中的夏娃化身\"命运女神\"选定，卡戎在初亡时便被告知：他将为[UmbraGlossaryLocalized('shadowlands','幽土')]的不眠者们开辟通往终焉的航路。在其庇佑下，他完成了诸多壮举：从[UmbraGlossary('pod_realm_labyrinth')]救出努德里，建立冥河圣城。\n作为冥河城最高建筑缟玛瑙塔的主人，卡戎手持镰刀\"西克洛斯\"执掌[UmbraGlossary('dark_kingdom_of_iron')]近两千年。与其他死灵相同，他也受黯影诱惑乃至操控，但这位帝王失控的黯影造成的灾祸远非常人可比——究竟哪些决策出自卡戎的艰难抉择，哪些是其黯影的残忍游戏，至今仍是未解之谜。\n\n其在原作中的未来命运\n这场内在挣扎将以强力呵斥仪式为终，剥离的黯影遁入[UmbraGlossary('pod_realm_labyrinth')]，成为魔君戈鲁尔的混沌核心。1945年第五次死涡爆发时，戈鲁尔破狱而出。卡戎亲征鏖战，最终与巨兽同坠[UmbraGlossary('weeping_bay')]底，自此音讯全无。随着帝王消失，死者国度陷入空前混乱。\n转生为凡人的虚弱卡戎，仍为守护冥河城燃尽最后余力，终以超脱之姿升华。"
 POD_investigate.desc.792893: "荷鲁斯，贤荷鲁众木乃伊之领袖，因赛特信徒的存在而对吸血鬼几无好感。即便如此，他仍认可部分吸血鬼的虔诚与价值，例如奥西里斯之子与阿努比斯的门徒。而妮托克莉丝的憎恶在众追随者中亦属于极端，甚至令荷鲁斯不得不将其逐出追随者之列。\n这位神秘的木乃伊对该隐子嗣怀揣如此深重的敌意的原因，已湮没于历史长河中。自离开荷鲁斯后，妮托克莉丝几乎从所有记载中消失，多数人认为她已陨落在转生轮回中或悄然隐退。但真相更为险恶——妮托克莉丝正进行着一场跨越千年的博弈。\n得知吸血鬼的末世预言——火焚末日及其加速降临的预言后，她将引导这场终局定为永恒使命。为此需要一位“屠尽凡人与该隐族裔的弑亲者”，她通过阴谋将奥韦恩·阿普·叶延塑造为成为这枚棋子；又需要一位“背叛血脉者”，她自认自己可担此大任，因她既背叛了荷鲁斯，也背叛了毫不知情的亲生儿子奥韦恩；最终她还在寻找“兽之化身”。当一切就绪时，她只需将棋子置于命定之位，即可开启基哈纳终章。\n她选定的棋盘正是亚瑟王传说。化身神话中的“安加拉德”，她利用圣杯的诱惑与传奇的故事，将毫无戒备的棋子引向预设的祭坛。\n\n其在原作中的未来命运\n一切终将在1999年准备就绪。然而，即便棋盘的布设完美无缺，“安加拉德”终将明白：预言从不是任人摆布的小姑娘……"
 POD_investigate.desc.792895: "Merit-neferu was born in the days when Egypt's power was spreading beyond its own borders. She married young, to the wealthy merchant Horem-rebkt. The two headed a business of lucrative caravans and sailing expeditions. They gave generously and numerously to the pharaoh and his ministers and when Horem-rebkt suddenly died the result was a great funerary honor usually only bestowed upon members of the Royal Court of Egypt.\nAfter her husband's death, Merit-neferu refused several offers of marriage and instead vowed to continue her husband's business as though he were still alive. She doubled her enterprise's profits with shrewd intuition and quick intelligence. This allowed her to continue her practice of making large donations to the Pharaoh, over and above the regular taxes.\nThe Cult of Isis saw the devotion that Merit-neferu had for her husband and her Pharaoh and offered her immortality. In return for her services to their cause, of course. Merit-neferu decided to accept the priestesses offer. She believed it would give her the chance to search for her beloved husband in both the lands of the living and dead. And thus a simple yet extravagantly rich woman joined the ranks of the Shemsu-Heru and became one of the Reborn.\nThroughout all her lives, Merit-neferu has used her skills to ply her trade, even when that defied social convention. She amassed great wealth in which she has been able to access each time she returns from the Land of the dead.\n\nFuture fate in Canon\nWhen the British will acquire the island of Hong Kong and establish it as a center for world trade in the East, the appointment of Merit-neferu as Asia's vizier will seem particularly appropriate. Just before the turn of the 21st century, she will uncover writings that hint of the existence of uniquely Asian mummies, whose immortality derive from a similar process to the Great Rite that creates the Shemsu-heru. She will be searching for proof to this discovery while navigating Hong Kong's dangerous politics."
 POD_investigate.desc.792896: "Nian Shun was an early follower of Lao-Tzu and sought for the perfect balance of the Tao. Though it always eluded him. No matter what he did to seek to accept the existence of pain and sorrow, Nian Shun could not help but cry at the sight of anyone so afflicted. Even hardened criminals tortured and executed moved him to tears.\nHe would inflict pain and hardship upon himself in order to become immune to it in others. But this method failed. So he took to avoiding the sight of suffering and pain by wandering the Middle Kingdom's most isolated and desolate places. This only brought knowledge that others outside his immediate awareness were also in pain and suffering. Since then he has been trying to do everything within his means to alleviate pain so he studied the human body and the ways of healing.\nThis brought him to the attention of Lung Li, a traveling alchemist and self-created immortal. Lung Li offered to take Nian Shun as his apprentice.\nNian Shun was an eager and rapid learner and Lung Li gave him a choice: he could attempt to awaken the sleeping Enlightened One that was within Nian Shun and thus make him a Mage, or he could gift Shun with the means for immortality.\nNian Shun finally decided that immortality would lead him closer to his goal of alleviating suffering. Nian believed in the Great [Glossary('Wheel of Ages','podgloss.wheelofages')] and reasoned that as the it turned from cycle to cycle things would only get worse. He wanted to be there at each turn and do whatever he could to ease that pain for as many innocents as possible.\nLung Li was there when Nian Shun was transformed into one of the Immortals. Nian Shun has never ceased his wanderings since. He still studies new ways to ease the pain of mortals but he has come to the realization that his search is a never ending futile one. His laughter masks his inner sorrow and his humor lifts his often bitter observations.\nHe hopes that he will find the answer to his lifelong quest or else he will imbibe his latest creation, the Elixir of Blissful Oblivion."
 POD_investigate.desc.605106: "One of the founding members of the Camarilla, Fanchon represented $pod_clan$ Tremere during this critical period of Cainite history. A master manipulator, Fanchon understands speech and its uses far better than any of the other Founders, Hardestadt included. Strong-willed and thaumaturgically talented, she seeks to disarm opponents by confusing them, commanding verbal trickery and a rapier wit. She prefers to be in control during any situation. She proposed that the unruly Anarchs be blood bound both to their immediate sires and Clan Tremere as the price of their re-admission to Cainite society, so that she and her clanmates may keep a close eye on them.\n\nFuture fate in Canon\nAround the 17th century, Fanchon will become obsessed with the Sargon Fragment, an obscure text promising Apotheosis that the powerful necromancer Ambrogino Giovanni was searching for. She will be one of the few occultists to have relearned Chaldean, the long extinct language of the Fragment."
 POD_investigate.desc.POD_fae_character_55: "他的宫廷曾经是所有国度中最重要的之一，他保护着靠近他的森林边界的人类定居点。许多人类将他崇拜为自然的神灵——木与叶之神，相信他带来甘霖，驱散严冬。人们开始称他为“绿人”。他与这些村民缔结了强大的誓约，他们也明白永远不可深入森林太远。作为春之王廷的坚定捍卫者，他曾与奇幻生物进行搏斗，与其他王廷进行小规模冲突，但他对死亡感到厌倦。他退隐到森林的阴凉和庇护之中，等待着四季之战的最终结局。他将许多灵纳入自己的王庭，并如父亲般保护他们。\n其在原作中的未来命运\n当他关闭自己的国度与凡世隔绝时，他给了所有人离开、加入其他宫廷的机会。然而，他所有的子民都选择了留在他身边。"
 POD_investigate.desc.792915: "卡尔·施瑞克是一位孤身执行任务的人，也许是他那个时代最臭名昭著的独立猎人。尽管他更喜欢广泛地自称为“猎魔人”，但他的主要猎物一直是吸血鬼。与大多数独立猎人不同，他不只追捕那些稚嫩且威胁性不大的稚子。他最为人称道的壮举，是与四代梵卓，古老而强大的埃里克·艾格曼的战斗，并最终取得胜利，将埃里克置于$pod_torpor$状态。\n这位严肃的巴伐利亚人已经牢牢吸引了德国吸血鬼的注意，他们不惜一切代价想要杀死他，或者更好地将他转化为己用。然而，卡尔对此毫不在意，依旧像当初的那个夜晚般孤独且坚定地继续狩猎。\n\n其在原作中的未来命运\n1235年，卡尔最终被狡猾的睿魔尔——罗萨琉斯——逼入绝境并施以[Glossary('初拥','game_concept_Embrace_desc')]。然而，这并非他的故事的终结，他将在吸血鬼世界中变得和他当初作为猎人时一样臭名昭著。"
 POD_investigate.desc.792910: "While history remembers names like Subadei and Jebe, Qorjin’s deeds remain blanketed in silence. His present career was launched at the Battle of Samara Bend, where he alone refused to yield before the men-who-became-wolves, creating a diversion that allowed the rest of his arban to withdraw to safety. Upon returning home to Karakorum, he was summoned before Chinghis Khan himself, who impressed upon him a new sacred duty.\nIn the intervening years he has studied the unseen world, learned to use the fears and superstitions of his enemies to his greatest advantage, and brought the creatures of myth to bay before the Mongol Empire. Qorjin has chosen to ally himself with the enemies of his enemy, resulting in the formation of the \"Bey's Hand\", a pack of Garou ostensibly loyal to him and the Mongols.\nChinghis Khan is dead now, but Qorjin’s task remains the same: Ensure that the next time the Horde marches upon Volga Bulgaria, there is no repeat of Samara Bend.\nQorjin is measured, but decisive. He rarely reacts rashly or impulsively; he’s contemplated every contingency, so while you may catch him off guard, it’s rare to ever truly surprise him. Most times, he knows exactly what needs to be done and does it. It is said he can tell at a glance the strength of a man’s resolve, and it’s in that fashion he chose his army. He prizes loyalty and duty above all other things, but realizes that others sometimes require different motivations...if he needs you to do something, he will find your motivation. Pei Ling calls him, \"the leaf gently dancing at the center of the typhoon.\" It seems an apt description."
 POD_investigate.desc.792278: "马义媛无疑是一位出类拔萃的士，她虽身为猎人，却活跃于宋朝的上流社会。作为一名小官的妻子，马义媛常受邀出席各类社交场合，也屡遭被精怪所扰的贵族登门求助。自然，鲜有人（或妖）能料到她竟如此足智多谋。许多妖魔直到为时已晚才发现，她所携带的双扇正是她的主要武器。马义媛将双扇运用到了出神入化的地步，不论走到哪里，她总能迅速消除威胁贵族安全的邪祟。"
 POD_investigate.desc.792903: "伊沙克的第一任妻子和孩子是被一个嗜血冲昏头脑的吸血鬼闯进了他们的家杀死的。让伊沙克永远感到羞愧的是，他一看到那东西当下就惊慌失措地只顾自己逃命去了。为了弥补自己的过错，他开始猎杀吸血鬼，并希望通过死在吸血鬼手中来洗刷自己的罪孽。在他幸存的家人的支持下，伊沙克一直在培养他们了解超自然的真相，并在他死后代替他拿起武器。\n\n其在原作中的未来命运\n作为古兰赛义德的伊沙克和他的家人只取得少许的进展，却还是顽强地坚持下来，并被苏丹穆罕默德二世注意到。苏丹穆罕默德二世将剩余的古兰赛义德收归麾下，并将他们与西帕希合并，形成一个强大的新猎人组织。"
 POD_investigate.desc.792899: "受利奥波德的末世狂热与十字军精神的启发，法兰西的女先知让娜·鲁莱开始招募女性加入与利奥波德相同的事业。让娜信仰坚定，她和她为数不多的追随者以与利奥波德追随者同样的奉献精神与力量对抗敌人的军队。不幸的是，她们的事业经常被忽视，使得让娜的团体仅仅被教会和裁判所认可，而未能得到完全的支持。\n\n其在原作中的未来命运\n让娜的死亡将导致更大的分裂。尽管教会不承认她的圣徒身份，她的追随者仍然会在非官方层面将她封为圣人。随后，他们会组建“圣贞德骑士团”，并继续开展他们的工作。到了15世纪，利奥波德会的新兴势力会与他们接触，并与骑士团结盟。然而，骑士团会拒绝被完全并入利奥波德会，并一直保持这种立场至今。\n在现代之夜，圣贞德骑士团的追随者愈加神秘难测，逐渐远离裁判所的掌控。而利奥波德会日益冷酷的作风将使他们与骑士团之间的紧张关系愈加严重。"
 POD_investigate.desc.791778: "Once a kinfolk, Viorica was ostracized because of her infertility. Overcome by hatred, she swore vengeance and was noticed by the powerful Tremere councilor of France at the time, LeDuc, who was hoping to use her knowledge and extraordinary abilities to fight the werewolves roaming around his chantry. When LeDuc was recalled to Ceoris, he left Viorica behind which she regarded as a personal slight. His replacement, Goratrix, quickly noticed Viorica's power and resentment over the Tremere pyramid and this common ground started a promising association between the two.\nFully supported by Goratrix, Viorica has made some very impressive headways, managing to create Gargoyles from lupus of the werewolves tribes and learning a darker form of blood sorcery thanks to her pact with Vassago, a demon bound to her by his powerful reliquae.\nViorica utter callousness is starting to worry Goratrix however as the exiled councilor would prefer to move more subtly and with more foresight than simply consorting with demons and leaving a trail of blood behind him. He has as such \"promoted\" Viorica to become regent of the chantry of Tours, hoping to disassociate himself from her. Viorica hasn't figured this and took the promotion in stride, now working with the full capabilities of an entire chantry on her latest project: using the flaying plague to overcome werewolves' natural defenses to the $pod_Embrace$, hopefully allowing her to enact the most heinous revenge she can upon her once tribe.\nThe Prince of Tours has noticed this new arrival and is growing concerned but Viorica recently found an unlikely new patron, Isouda de Blaise. The two women have found a fast friendship over their mutual sadistic tendencies and this powerful patron has so far shielded the \"Scarlet Witch\" from her many enemies."
 POD_investigate.desc.792329: "爱丁堡的治安官米雷蒂·赛义德远离她在西班牙的领地。她是最近才加入罗伯特·杜兰德亲王宫廷的新成员，由杜兰德的尊长萨莉安娜推荐，接替了前任治安官——其遗体如今被钉在爱丁堡城堡的地下深处。\n米雷蒂·赛义德对自己的职责并不陌生，她曾为多位亲王效力，无论这些亲王是生者还是亡者。她笃信伊斯兰教，并认为自己接受初拥是为了对受诅者实施正义，将他们约束于规则之内。米雷蒂·赛义德行事谨慎，言辞斟酌后才会出口。尽管她的态度严厉，爱丁堡的吸血鬼们仍然对她充满敬意，正是由于这种尊重，当地的该隐之子们才未陷入堕落的本性之中。事实上，米雷蒂·赛义德更进一步，在履行职责的同时还收留了年轻的吸血鬼。她对这些稚子怀有怜悯之心，深知许多尊长在未给予足够训练时便将他们抛弃。这种责任感让她在执法的同时也成为了他们的引导者。"
 POD_investigate.desc.791225: "An ex Gnostic having fallen to Via Voluptarius, Nicodemus is proud to be the incarnation of the Seven Sins. Despite his utter disdain for the Catholic Church, Nicodemus is first and foremost an enemy of the Cainite Heresy, abhorring their hypocrisy. It's indeed his pivotal role in rooting out the Heresy from Champagne that has earned him the title of Prince from Queen Helene who has formally ordered her subjects to not interfere with the peculiar ruler of Reims.\nFrom his massive throne in a subterranean chapel, surrounded by hundred of false relics and dozens of lascivious ghouls, Nicodemus presides over a depraved cult that even his main lover, the Setite Nahash, finds exquisitely impressive.\nNicodemus fancies his current nickname of the Great and Glorious Morningstar as an insult to the Church and a prayer of respect for the actual Morningstar, Venus, the planet of love and desire.\nDespite his eccentricities, Nicodemus is no fool however and any novice hedonist thinking they can do whatever they want in Reims will be quickly dealt with. The Prince knows that Helene's patience will have serious limits if the Masquerade was to be breached, especially now that he has learned that Geoffrey du Temple is applying pressure on her to remove him from office."
 POD_investigate.desc.791416: "The baptized son of Muslim slaves, Benedict stumbled into trouble early. Smart and cunning, he quickly moved from street thief to member of a gang specialized in raiding tombs, ruins and churches. Benedict's fame grew and he soon became a renowned art dealer, especially for those with more gold than ethics. This earned him the attention of the French Toreador Portia who [Glossary('Embraced','game_concept_Embrace_desc')] him.\nBenedict quickly loathed the new world he was thrust into however. Toreador respected him when he was a purveyor of fine art but now they mistreated him as a common thief and unruly neonate. Portia took pity on her childe and allowed him to return to Iberia to do what he truly excelled at. And thus, since then, Benedict has earned his fame as one of the rare Cainites bold enough to steal from other Cainites before selling his prizes to the highest bidder. He has so far restricted his heists to Al Andalus, thus courting the passive favor of the Shadow Reconquista and the enmity of the Ashirra Cainites.\n\nFuture fate in Canon\nBenedict will prosper until the end of the Reconquista and become a leading Toreador figure in Spain. The New World will be a siren call to him however and he will left for new ruins to plunder. In 1720, he will disappear for good in Peru, having finally probably raided the wrong tomb."
 POD_investigate.desc.792883: "While a baby boy-child was being born unto Joseph and Mary in far away Bethlehem, an aged Kurdish shepherd was making his way towards his home. Suddenly, from all around him the world began to shake, and a nimbus of white light appeared. Time itself seemed to first slow and then stop completely, as a dark figure appeared to him.\nWith a voice like boiling water across ice, the shadowy being spoke. It knew of the state of the shepherd’s darling Mara, who even now began to enter labor in expectation of the birth of his first child. The figure spoke to him of family and of a line — the shepherd’s own — and of a grand plan involving both. Abdallah, the entity explained, was the first father of a line that would eventually come to produce a man whom it referred to as the “Doorway,” the last descendant, and the one through whom all of his kind would unite during the end times.\nThe entity further explained that Abdallah would be brought into “life everlasting,” that he may serve as the eternal monitor of this most important of prophecies, for who better to see the signs for what they are than the mortal progenitor himself?\nFor over a millennium, Abdallah wandered the Middle East, waiting for a hint of the first sign and growing ever wearier at the agonizing passage of time. In the interim, only the rise of Islam kept him sane and focused on his task. It seemed to Abdallah as if the Prophet spoke directly to him, and he grew to see how his own mission fit seamlessly into God’s plan.\nThen, in the late 12th century, came a man of Abdallah’s line by the name of Salah “the Righteous.” Salah al-Din. Abdallah knew that he had found the one, soon following in his descendant’s footsteps in making the City Triumphant his new home.\n\nFuture fate in Canon\nThe rise of the Caitiff Prince, Mukhtar Bey, will be the second sign awaited by Abdallah. Joining the Inconnu in the modern nights, the wait for the third sign will slowly erode his sanity and cause him to make several key mistakes."
 POD_investigate.desc.791183: "埃兹是最臭名昭著的古鲁希之一，他以公开的战将身份存在，从不掩饰自己的超自然身份。他令凡人和莱本同样感到恐惧，以残暴的手段征战，一步步夺取对这片地区的支配权。他对秘盟毫不在意，将邪恶的力量和强大的意志主要用于对付那些为其军队服务的外来者。在“恶魔之王”的领域内，当地凡人则不受侵扰。\n埃兹创造了大量血仆，作为贴身护卫或刺客。他亲自寻找敌对的莱本，急切地吞噬他们的灵魂，以增强自己的力量。\n\n其在原作中的未来命运\n16世纪期间，在屠杀了无数葡萄牙入侵者之后，埃泽最终触怒了某个强大的存在或势力。他突然消失，所有凡人历史中的相关记录也随之被抹去。这一事件背后的力量身份，将永远无人知晓。"
 POD_investigate.desc.792817: "Born in a struggling minor noble family, Benedetto was always consumed by envy for the easy and cozy life of the more powerful lording over his once noble house. Envy turned to hatred soon enough and this resentment lashed against his own father that he despised as a weakling, ending with Benedetto cutting his throat in the dark of the night. His younger brother soon earned the same dark fate.\nBenedetto quickly worked on restoring his family's name and barely noticed when his mother killed herself after learning of what he has done. Impressed by his sheer ambition and cruelty, a Setite [Glossary('Embraced','game_concept_Embrace_desc')] the young noble who took very easily to the more depraved brand of Set's worship that his Sire followed. His zeal and appetite for corruption soon earned him a prestigious appointment, the heart of the Holy Roman Empire in Aachen. Posing as a Toreador, he has started acquainting himself with the city and found it to his liking so far.\n\nFuture fate in Canon\nBenedetto will blow his Toreador cover in 1398, resulting in his decapitation in 1400 by the leading powers in Aachen. By that point however, the Setite presence in the city will already be assured."
 POD_investigate.desc.791318: "The oldest son of a long-dead Roman senator, the Ventrue possesses chiseled patrician features, an Aquiline nose, and a tongue born for the eloquence of a career politician. As courageous as he is licentious, he spends as much time on the battlefields as he does in pleasure houses. Rumors divided as to which of those adventures cost him his eye. A gray star crosses the black of his pupil, impairing his vision.\nA direct childe of the once Prince of Rome Collat, Andronikos lived in the shadow of his blood sibling Camilla who became the master of the Eternal City and most of the Cainite world for centuries. After Camilla's fall into torpor, Rome fell from grace and became a barely relevant backwater, which allowed Andronikos to seize the city for himself.\nLiving in the ruins of the once mighty empire of his blood sibling with other relics of more glorious nights, Andronikos proved himself a weak Prince and a petty bout of anger against a fellow Ventrue proved his undoing. This young outsider, Mararah, bode his time before coming back to Rome, ridiculing Andronikos by killing his henchmen and threatening the unlife of the entire ruling Cainite elite of Rome.\nShamed, Andronikos was forced to concede and the loss of credibility costed him Rome before making him vanish from history, still barely a footnote to his blood sibling."
 POD_investigate.desc.792155: "Born and raised in Iberia, Rodrigo is an oddity among his feral brethren, some would even say an heretic. The road of the beast has always prized itself on being solely reliant on oral tradition but Rodrigo, perhaps driven by his inquisitive Brujah blood, has taken to write as extensive a treatise on his road (from history and current practices to common rites and respected mentors) as he can. This has made him an unwelcome sight at more traditional ferals gathering but Rodrigo has been quick to prove that he is a feral through and through, having traveled and fought alongside some of the most respected practitioners of the road such as Qarakh and Liolya.\nSome of the traditionalists that have accused him of cowardice (for using the pen, the tool of weak minded priests) have quickly realized that the Iberian is also very adept with his claws.\nA mark of shame that only his closest friends are aware of is the loss of his burgeoning book to a Tremere raiding party. While it was quickly recovered by a feral war party and avenged in the blood of an entire chantry, Rodrigo fears that this incident might embolden his critics if it was to be wildly discovered."
 POD_investigate.desc.791060: "安德烈亚斯出生于挪威的一个无名渔村，如果不是幸运之神给了他一个机会，他很可能会继承父亲的衣钵。某天，有一艘商船停靠在村子里修理船帆，而年轻的安德烈亚斯在好奇心的驱使下偷偷上了船。很快，安德烈亚斯就顺着来到了伦敦，并被这座大城市深深吸引。\n观察这片土地的一切后，很快得出结论的安德烈亚斯认为这不是一种像样的生活方式，并觉得自身民族所持有的传统要优越得多。出乎意料的是，他在那里找到了善于倾听且守旧的末卡维，最终他被赐予了$pod_Embrace$。\n很难说安德烈亚斯在成为末卡维之前是否已经疯了，但现在的他肯定是。一方面，他是征服之道的追随者，坚信该隐之子应该带领人类回归其应有和原始的位置，因此他渴望能够成为这样的领导者。但另一方面，他又渴望回到登上那艘命运之船之前的简单生活。\n\n其在原作中的未来命运\n安德烈亚斯将在杂生惊恶（位于乌尔夫之殿）灾难性的探险中毫发无损，但精神上却受到了极大的打击，这对他已经破裂的心灵毫无帮助。"
 POD_investigate.desc.790251: "In life, Claas aspired to rise above his station as an apothecary's son through study. He learned Latin, Greek, Hebrew, Slavonic, and Arabic, and was interested in occultism, which brought him to the attention of House Tremere.\nClaas became a translator and then a spy thanks to his knowledge of languages. He was eventually sent to Poland by the German Empire, in order to assess the Polish strengths and weaknesses. When the elders of clan Tremere finally decided to Embrace him, Ardan summoned his prótegé to Prague, Embraced him, and passed on his knowledge in Thaumaturgy. He was then assigned to Krakow.\n\nFuture fate in Canon\nIn time, he will succeed in forming a chantry in Krakow, unknown to Prince Razkoljna. In the late 15th century, he will receive a summons to Ceoris to meet with his sire, Ardan of Golden Lane, now head of the secluded chantry. His vast knowledge and connections will make him one of the most valuable Tremere residing in Ceoris.\nHis duties will encompass several momentous fronts. In mortal society, Claas will participate in numerous diplomatic dealings between Hungary, Transylvania, and the Holy Roman Empire. In Kindred society he will not only keep track of the comings and goings of the local Tzimisce, but also help to conduct any attacks on them (he will even manage to acquire Dracula's sword from its legendary owner), but he will also held a careful vigil for any news of the renegade Tremere Goratrix.\nClaas will still support Ardan throughout the centuries, and will eventually sire a Tremere Justicar himself."
 POD_investigate.desc.791480: "Growing up in a rich Balarm family at the height of the Fatimid Caliphate gave a brilliant young woman like Amina all the opportunities she deserved. Her tutors doted on her boundless ability to retain new languages and concepts, her proficiency in Greek, Hebrew, and Latin, and her penchant for botany and herbalism. At eighteen years of age, she was one of the most successful students at the medical school of Salerno, where she went on to become a lecturer. That’s how she met her [Glossary('Sire','game_concept_Sire_desc')], people say, but nobody knows for sure.\nAmina has been moving around southern Italy quite a lot in the past couple of centuries, both to avoid suspicion, and because her services are highly valued by the barons when their wives suffer from pernicious ailments. She has also kept a tight grip on the sizeable family estate and its mulberry crops — one of the few sources of silk in Europe. Her craftsmen reel only the finest cocoons and produce her trademark cloth for bandages and drapes. In her fields and workshops, a handful of women follow Amina’s instructions to grow medical herbs used to produce concoctions, which are highly prized in the upper echelons of society throughout the peninsula."
 POD_investigate.desc.790799: "Once, a Frankish second son of noble birth coveted his elder brother’s inheritance and plotted murder. The plot failed, but the marquis’ advisor was a Ventrue who saw potential in the frustrated young man and Embraced him. Josselin of Touraine devoutly believed God punished him with the curse of Caine for trying to kill his brother, and vowed to atone. The neonate joined the Fourth Crusade in Venice and made the sea voyage to Constantinople cooped up in a ship’s hold. Watching the kine despoil and burn Christendom’s greatest treasure poisoned his faith — how could true Christians act thus, out of base greed? He agonized over the answer until the papacy’s reversal of its excommunication order for the Latins made it clear to him: religion was naught but a lie, a tool at the bidding of humanity’s narcissism.\nJosselin mingled with the Romaioi, learning about the Dream and the Patriarch. The veneration in their eyes as they spoke of Michael amazed him. Here was a vampire turned to dust, who hadn’t been active in over 300 years, and they still adored him! From then on he fashioned himself as Josselin the Blessed. His blood cult is predicated upon the idea that he achieved consecration, then returned from death to guide the flock as an unliving saint. He enacts twisted versions of the Catholic sacraments, presiding over a Eucharist that offers his own $pod_vitae$ in lieu of wine and using his Disciplines to wring awe and fear from penitents. He invites mortal sinners to “make confession” by allowing vampires to drink from them in ritual blood orgies. Then, the vampiric sinners fast in chains under his chapel to repent. He pushes the boundaries on perversions of liturgy ever further to see how far he can warp their faith and still receive their worship."
 POD_investigate.desc.791324: "An eminent vampire in the domain of Voruta, Nojus is respected for his wisdom and knowledge of vampiric laws. Mainly concerned with his own brood, he enjoyed Zilvinas' reign as Prince of this city as the Setite proved himself easy to influence. This has not been the case with Zilvinas' successor, his childe Egle, and the two have been coldly at odds since her ascension to the throne. Nojus fancies himself a respectable elder however and as such has been binding himself to tradition and not attempted anything rash so far.\n\nFuture fate in Canon\nAfter the \"monster\" Gabija makes his move on Nojus sphere of influence, the Brujah will seek reparations from Egle. The two of them will confront Gabija but will be outsmarted by the Tzimisce who never truly broke the laws of this land. Nojus will succumb to his Brujah anger at this moment, ultimately leading to his and Egle's deaths at the hands of their well mannered monster of a host."
 POD_investigate.desc.791123: "在他逝世那一年的早些时候，伟大的成吉思汗将斥责不忠及宣战的文书送向西夏。不儿罕——党项人的首领携九对童男童女、九匹骏马和九头骆驼前往王帐，向大汗乞求怜悯。成吉思汗收下了礼物，但他旋即将不儿罕杀死，其领国随后一同被夷为平地。\n成吉思汗最终只将九位童女之一纳为了小妾，她名为博尔泰，是一位豪富地主的美丽女儿。这名不甘于接受命运的囚徒与擒获她的蒙古人百般争斗，好几次都成功毒死了看守她的卫兵并尝试逃跑，但从未成功地逃离。\n然后，成吉思汗驾崩。包括博尔泰在内一共40位少女被护送至他的大墓，并在一场仪式上被悉数屠杀，最终与大汗同葬。博尔泰已经丧失了那段关于她是如何逃出[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]的记忆，她只记得自己很快就从坟里悄悄爬了出来，最终被玄武皇朝的郊区人所发现了。在花了数个星期的时间恢复理智后，她开始了作为一名[Glossary('万鬼','game_concept_kuei_jin_desc')]的旅途。\n在皇朝的日常生活中，博尔泰很快从闲言碎语里推断出一件至关重要的大事：成吉思汗陵墓的位置仅为她一人所知。她知道自己必须充分利用这些信息，前提是时机已经成熟。"
 POD_investigate.desc.792133: "An ambitious student in a minor Baltic Tremere chantry, Mara quickly noticed something unusual about her master. Her inquisitive nature, alongside her beauty and natural magical talent, earned her the $pod_Embrace$ instead of a quick death when she was caught spying around. She burgeoned as a Tremere neonate and achieved great success until her promising career was cut short by the death of her sire at the hands of a Tzimisce. Ceoris then relocated Mara to an important, but remote and highly dangerous post, Jerusalem.\nWith severely limited resources at her disposal, Mara has done surprisingly well. Using contacts among the Crusader States, outsmarting the rival Giovanni merchants, investigating the numerous occult phenomenons of the city... The only part of her assignment that isn't working as well is the investigation of local Salubri, who proved far too powerful and entrenched to act directly against. Mara is eager for glory but she is no fool and has as such limited herself to information gathering on them.\nThe Inner Council has noticed Mara's achievements and has chosen to recall her. She has earned the reputation of one capable of establishing a solid presence in very hostile regions and they intend to use her to her full potential.\n\nFuture fate in Canon\nMara's promising career as a Tremere problem solver will be cut short in 1261 when she is recalled to deal with a dangerous alliance of Tzimisce lords in central Europe. She will be destroyed while leading an expedition against them."
 POD_investigate.desc.791091: "Samsi is the most outgoing of a large brood of Mutasharidin (the Nosferatu [Glossary('Ashirra','game_concept_ashirra_desc')]) nesting under Aleppo’s citadel mount. She, and the other childer of her sire, were all natives of Aleppo, and all have been Embraced in recent years. Due to their ancient Assyrian sire’s overpowering desire to replace the offspring lost to the crusaders’ siege, Samsi and the others have adopted Assyrian names, manners of dress, customs and language. This is all done without complaint to please their sire, but Samsi herself has found the charade rather amusing.\nIn spite of her full knowledge of her sire’s obsession with his historical roots, his conversion to Islam along with the rest of the brood seems completely natural to her — after all, she has felt the same irresistible draw, and the same sure knowledge that the Muslim faith is the right path for her.\nSamsi is unmistakably Mutasharid, when not employing her Obfuscate arts. Her face and body are enormously swelled, hiding her eyes among reddened folds of skin while exaggerating the rest of her features to disgusting proportions."
 POD_investigate.desc.790952: "巴雅泽是一位肤色黝黑、五官棱角分明的男子，与人交谈时语气温和，同时十分生动。他的动作总是迅捷而无声。他喜欢与死亡共舞，只尊重那些能够机智而优雅地面对死亡的人。\n巴雅泽常让人联想到蜘蛛或蛇——既迷人又极度危险。即便是最随意的谈话中，他也本能地寻找他人道德上的弱点，并乐于将他们引入腐化之路，而这往往轻而易举。他最喜欢的猎物是神职人员与僧侣，将那些“圣人”的伪善一一揭露。\n\n其在原作中的未来命运\n巴雅泽将加入臭名昭著的“以撒阴谋”，推动黑暗世界中一些最重要事件的发生。然而，如同阴谋中的所有成员一样，他最终也将被追捕，并毫无体面地被处决。"
 POD_investigate.desc.791168: "与那伽罗阇打交道并不容易，这需要极大的耐心、顺从和大量的血肉。作为一个“不可接触者”，作为一个从未在意传统种姓的地方出生的人，斯里达尔轻松适应了自己作为使者的角色，即使如此，在面对罗德里尔的无礼时他也会感到棘手。尽管那伽罗阇的死灵法师们常常提出琐碎的服从要求，他们却一直对斯里达尔表现出友善和关怀。\n斯里达尔与他的[Glossary('尊长','game_concept_Sire_desc')]——摩加迪沙的阿玛利亚——密切合作，她为他提供那些不情愿成为那伽罗阇朋友“餐点”的牺牲者。随着权力的天平逐渐偏离传统的黛娃/萨洛比联盟，斯里达尔谨慎地站在一旁，等待在混乱中获得利益。或者，至少要确保血肉的供应不断，让他的钱袋愈发充实。"
 POD_investigate.desc.505005: "洗拉是一位第一城的女人，她俘获了该隐的心，她当然深知这一点。然而，不知何故，她却能抗拒该隐的爱，以至于该隐向老妪寻求魔法来让洗拉爱上他。老妪通过血缚的力量让该隐的血液变得强大。于是，该隐偷偷地把自己的血给了洗拉，让她与自己结合。\n根据诺斯费拉图氏族的说法，洗拉再造了他们的上古耆宿先祖，他是一个强大的猎人，一个英勇非凡的猎人，他想猎杀世界上最强大的生物。但当他面对洗拉时，他被狠狠地打败。由于他的勇敢，洗拉决定给他初拥。\n洗拉还被怀疑拥有“预言天赋”，就像扫罗一样，这可能是某种观占术。在第一城，她甚至有一个以她的名字命名的小水池——“洗拉之池”，池中的水清澈见底，据说知道如何看见未来的人能通过这汪泉水看到未来的景象。\n失落部族讲述的则另一个故事，根据他们的传说，三代血族成功杀死了他们的两个祖先——“智者”以诺和“强壮者”以拿。当洗拉得知她的兄弟们都已死去，而下一个死去的会是自己时，她哭泣着向父亲该隐求救。该隐听到了她的请求，怜悯地把她变成了一块石头，这样她就不会被人找到并杀害。但她对兄弟的哀悼仍在继续，她的血泪不断从石头中流出，就像今天晚上一样。品尝这块石头，就是品尝这代忠实血族仅存的血液。\n石头上的血是父亲该隐给他心爱的洗拉的承诺，即当一切都得到弥补时，她将再次同他一起漫步于黑夜。失落部族把这一点铭记于心，这就是为什么他们也会自称为“洗拉之泪”。他们严格保守着石头的秘密，只向少数对父亲该隐绝对忠诚的人透露。"
 POD_investigate.desc.505003: "作为第一城的国王，以诺和他的子民崇拜着该隐，他们看到了该隐身上的标记和力量。当这位初代血族回到凡人世界时，以诺将王位传给了该隐，让他成为第一城的新任统治者。之后，以诺出于对这种力量的渴望，向该隐乞求获得$pod_Embrace$。该隐违背了天使长乌列尔的意愿，将“智者”以诺$pod_Embrace$为自己的第一个孩子。为了纪念他，该隐将第一城更名为以诺城，并一直统治它直到大洪水来临为止。以诺的智慧让该隐受益匪浅，他因此成为了该隐的顾问。\n根据大多数梵卓族人对其始祖起源的描述，梵卓是在第一城被以诺$pod_Embrace$的，他可能是第一个接受$pod_Embrace$的上古耆宿。有一种说法，该隐在梵卓还是个孩子的时候就发现了他的潜力并收留了他，视如己出地将他抚养长大，最终将他交给了以诺赐予$pod_Embrace$。在另一种说法中，梵卓是一名外来贵族，他在没有该隐指引的情况下接受了以诺的$pod_Embrace$。\n至少有一个棘秘魑氏族的传说认为他们的“最长者”是某种实验的产物。以诺为了驱除自己的兽性，将自己的腐蚀化作$pod_Embrace$，通过一种经过修改的变形术异能，最终创造出了被称为“最长者”的生物。\n有些人认为以诺的灵存活在所谓的“以诺之刃”中，这是一件神话中的宝物，以其抑制（甚至消灭）心兽的特性而闻名。一些传言甚至说，这把剑能够一击杀死任何布鲁赫族人，这也为以诺在三代血族起义中被布鲁赫氏族杀死的说法提供了可信度。"
 POD_investigate.desc.792768: "Verakuk is a Malefactor, one of those demons who pioneered the Lore of the Forge during the war and constructed weapons of surpassing craft and power for the rebels. Imprisoned in the Abyss, he marveled bitterly at how perfect a prison Hell was. It contained no materials to work with or wear down; it was completely apart from matter. The time in Hell changed Verakuk. He decided that if he ever escaped, he would work toward that sort of perfection — an earthly prison that not even an angel could escape. He had some angels in mind, in fact.\nThen, a circle of Egyptian spell-casters summoned the demon forth to aid them in crafting jewelry and gifts to appease the Pharaoh. He did, but he formed a cult around himself, posing as the protector god Sopd. While Verakuk enjoyed worship in the Eastern Desert, he never ascended to the same level of power as such Earthbound as the five archdukes. Eventually, his reliquary — a man-sized statue built in Sopd’s image, with eyes of turquoise — was stolen and carried west, across the Nile. The thieves barely made it across the river when Verakuk, enraged at their temerity, killed them all… and then discovered that he had no way to contact his followers. He lay there in the sand for millennia, barely awake as the world passed around him.\n\nFuture fate in Canon\nPerhaps drawn to Verakuk's resonance, a prison will be built upon his resting place by the Egyptian state in 1987. The demon will waste no time taking over this perfect staging ground for his new plan. If God had seen fit to withdraw the angels from the world, Verakuk would find a way to call them back. He would hold the virtuous in his prison, and when the angels responded to this travesty, he would be ready."
 POD_investigate.desc.792425: "During the final days of the hated Inquisition, Katarina Kornfeld was born the bastard child of one of the very priests who so desired the end of the Kindred. Her mother was to be one of Gustav's servants in that time, and a servant she did indeed become, but only after Katarina's birth.\nIn those days, Gustav was constantly on the move, constantly leaving for other parts as the Camarilla came into existence. He often boasted of how powerful the Camarilla would be and how they would one day crush the Inquisition and the Church, gathering revenge for all that the upstart kine had destroyed.\nKatarina was an inquisitive spirit and asked questions about this to Gustav. To his credit, the German answered them all truthfully. It was during her 21th birthday that Gustav officially offered her the $pod_Embrace$ and she gleefully accepted. The night of passion leading to her death and rebirth is still her fondest memory to date.\nKatarina has already proven to be one of Gustav's most capable servants and, while he constantly downplays her abilities due to his sexism, she has been unshakably loyal to him so far.\n\nFuture fate in Canon\nAnd she will stay that way for centuries to come, becoming Gustav's right hand woman (even if he would never admit such a thing). Her constant loyalty will end up being rewarded with the post of Primogen of East Berlin."
 POD_investigate.desc.POD_fae_character_1000: "[GetScriptedCharacterByHistoryID('POD_fae_character_1000').GetFirstName]，又名达纳，是达南神族的母神。传说中达南神族赋予了人类做梦的能力。反过来，人类也给了神族创造传奇纪元所需的原材料。从神族那里，所有其他戚系都涌现出来，并在梦界中繁衍生息。达努要求她的孩子们在冬至和春分时节为她举行庆祝活动。"
 POD_investigate.desc.POD_fae_character_5080: "After the great God Olorun, the greatest Orisha, conceived of the world and had his two sons, Obatala and Orunmila, design and order it, he sent another Orishas named [GetScriptedCharacterByHistoryID('POD_fae_character_5080').GetFirstName], his linguist and messenger, to collect sacrifices for him. Eshu is the orisha with authority over roads and gateways and who loves to cause mischief. He is neither good nor evil, he is simply himself. He plays tricks because it is his way. The good learn from his tricks and the wicked suffer. While on earth he also sired many children who would later become the Eshu, sharing his name and duties. His progeny, unfortunately, happened to steal his name for themselves, if without malice, and when Eshu heard that the mortals were treating his kin as him he new he had to punish his wayward children or others would loose their names as well and the world would be undone. He did this even though he was just a little proud of all his children had accomplished and how much they had learned from him. So, after observing to come up with the best punishment, he called all his children together and told them a great and powerful secret and made them his messengers to the world, commanding them with weighty words to teach their children to follow his ways as well. Then he flew back into the sky laughing. The joke and punishment? He got his kids to do his job for him and to enjoy it."
 POD_investigate.desc.POD_fae_character_83: "马索努伊是格温内斯之王、卡尔·达塔尔的领主和达南神族的大术士。他的故事是洛奇四部曲中的第四部。"
 POD_investigate.desc.792937: "巴希拉是芭丝特中以学识闻名的部族，常充当同族间的外交官和裁判。托拉将这些特质发挥到了极致。为了为芭丝特族引入新的精神契约，这位年轻的黑豹开始与以顽固著称的印度灵体——蛇王展开谈判。托拉与蛇王一同消失了数周，这让许多人担心这位巴希拉的安危。\n所幸，托拉最终安然无恙地归来，并声称蛇王已同意从此庇佑巴希拉。据说这是托拉通过辩才与说服力赢得的结果。当有人指出他们已连续交谈数周时，托拉只是耸了耸肩，表示时间对真正渴望学习的人来说毫无意义。"
 POD_investigate.desc.792931: "极具文明气质的阿南卡是一位优雅而颓废的布巴斯提。那些如古埃及时代那样敬奉她及其族人的人，会发现她是一位精通痛苦与享乐的能手。即便是她部族的传统敌人，只要能取悦她，也能在她的宫廷中逗留享乐。然而，任何威胁她地位的人都会被迅速而果断地处理，让所有人牢记为何布巴斯提会被视为猫族中最强大的巫师。\n\n其在原作中的未来命运\n阿南卡将成为少数破解永生秘密的布巴斯提之一。她将退隐至[umbra|E]，并接管“生命形态洞窟”界域，自称“时光女神”，将该地塑造成一个栩栩如生的古埃及纪念物。在这里，人类将像过去那样，对他们的影猫主宰怀有敬畏与恐惧。"
 POD_investigate.desc.792958: "来自印度尼西亚的软步行者是可汗虎族中一位活力十足的战士。他天性好奇，所以四处旅行探索未知。一次偶然间，他发现了一场针对忽必烈汗的刺杀企图，并果断阻止了这次暗杀，从而赢得了这位亚洲最强凡人的友谊。据说，正是出于对软步行者的尊敬，忽必烈才最终选择协助某位岛屿的王位觊觎者建立满者伯夷帝国，而非如原计划般惩罚这位野心勃勃的新王。\n不论真相如何，软步行者依然在旅途之中，最近他受到西藏同族的欢迎。他的名声不断扩展，而他也乐在其中，向人们讲述自己的冒险故事，并接受年轻芭丝特战士的挑战决斗。然而，这位不知疲倦的可汗虎族勇士已在期待下一次冒险，不管那将是什么挑战。"
 POD_investigate.desc.792972: "塔·姆林巴是辛巴目前公认的统治者，这一头衔是他在完成了一项壮举后获得的：将吸血鬼驱逐出豪萨兰。对于自豪的辛巴狮子们来说，这已经重新点燃了他们的斗志，誓要将整个撒哈拉以南非洲视为自己的正当领地。其他芭丝特被期望臣服，而吸血鬼和其他变形者则被视为必须消灭的对象。\n即使在天生威严的辛巴中，塔·姆林巴本人也显得格外强大。对他的许多臣民来说，他是他们的典范，是一位强大且毫不妥协的国王，准备向世界展示唯有狮子才有资格统治。"
 POD_investigate.desc.793001: "尼奥洛是一名英俊的斯瓦拉，在他的部族中颇有名气。大多数豹人都会努力保护那些他们熟悉的灵界区域，而尼奥洛更进一步，还会帮助一些较为陌生或不那么传统友好的灵体。这使他结识了一位名为希娅的强大水之幽魂，她对这位富有魅力的勇士产生了浓厚的兴趣。希娅向尼奥洛承诺，如果他放弃游牧生活，选择留在她身边，她将给予他财富和权力。然而，她也明确表示，“不”将不是她乐于接受的答案。尼奥洛目前正在拖延时间，思考如何最好地应对这个充满诱惑却并非他所愿的关注。"
 POD_investigate.desc.790378: "撒该是一位活跃于罗马的强大纳斯费拉图情报贩子。尽管他声称在血族的政治中保持中立，但他对该隐异端的厌恶众所周知。他在地下墓穴和下水道中保存了许多异端的秘密，以备未来之需。此外，他也以重金收购有关异端在拉特兰宫内影响力的消息、深红教廷内部政治的细节，以及任何可能被异端敌人利用的信息。"
 POD_investigate.desc.505097: "In his mortal days, Narses was an Armenian in the service of Justinian I. During his service as leader of the emperor’s bodyguards, he was eventually selected to aid the Byzantine campaign to conquer Italy alongside Belisarius. The two men disliked each other and Narses was even ordered back to Constantinople one time, because their rivalry had led to the fall of Milan.\nNonetheless, Narses proved to be the superior tactician and was awarded with the Exarchate of Italy. Justinian's successor, however, removed him from the post and Narses retreated into a villa near Rome, brooding and embittered. He was soon visited by a Lasombra, who hoped to use Narses in order to undermine Byzantium.\nNarses found that his old rival, Belisarius was also found among the undead, and began a long and bitter rivalry with him. His disdain for Constantinople led him to retreat to Venice, where he hoped to gain a power base to avenge himself on Byzantium for giving his rival the gift of immortality. During this time, Narses also came into contact with the Gnostic heresy and quickly advanced in its ranks. His hold over the Heresy from Venice was primary directed in corrupting the Catholic Church and direct it against Constantinople, as Narses never believed in anything but his own power and strength of will.\nDuring the council that prepared the Fourth Crusade, Narses gladly gave his own domain as a place for discussion of the vampires all the while subtly influencing the course of the crusade and directing it against the Dream of Byzantium.\nOnly a short time after the sacking of Constantinople and the execution of his vengeance, Narses was approached by his fellows within the Crimson Curia in 1212 and thrown out of his office and his princedom, as any suspected involvement of his actions in the Heresy could mobilize various Cainites in reaction for the destruction of Michael.\nNarses was diablerized in 1215 in a Court of Blood by his childe Guilelmo Aliprando, who also succeeded him as the prince of Venice."
 POD_investigate.desc.792317: "A Scottish Toreador recently pledged to Robert of Edinburgh’s service, MacLeann has secretly had her eyes on his throne for decades. Though she holds no official position in Robert’s court, the Toreador has made herself indispensable to him, by allying the Scottish neonates unhappy with the fact that Salianna’s “lackey” occupies a throne that should be maintained for their interests, not the French’s.\nMacLeann believes Robert is an easy mark to betray, as his flowery speeches to induce a sense of clan loyalty always include taking land and power from rival Princes, like Marcus Verus of Chester. She’s convinced Robert is a poor excuse for a Prince, and his failing leadership threatens to take the rest of the clan down with him. What MacLeann doesn’t realize, is that Robert often plays the fool to appear weak to his enemies.\nDespite her [Glossary('Sire','game_concept_Sire_desc')]’s many warnings, MacLeann has begun to find co-conspirators who will help her stage a coup. Then, once the throne in Edinburgh is secure, she’ll prepare for war to do what Robert could not: overtake Verus once and for all. After all, she has plenty of fledging childer who’ve already pledged allegiance to her, a detail she believes Robert has forgotten.\n\nFuture fate in Canon\nCait will be embroiled in a conspiracy against Robert that will result in her political downfall. She will survive the fall out of this blunder but her political capital will never recover."
 POD_investigate.desc.791208: "Once the count of Anjou under the name Foulques III, he was known to be as cruel as he was zealous. One such evidence was when he burned his wife after learning of her adultery then burning the city of Angers itself in the wake of his wrath... before commissioning the construction of numerous monasteries and churches to earn his redemption. Foulques officially dies in 1040 during his third travel to Jerusalem but is in truth [Glossary('Embraced','game_concept_Embrace_desc')], soon becoming a major asset for the Lasombra in France.\nFoulques was already a proven politician as a mortal, having several times added new cities to his domain, and he continued this tradition as a vampire. Ousting the Ventrue Prince of Tours, Foulques made this important city his capital and is now one of, if not the, most influential Lasombra in France.\nDespite being ruthless against any form of heresy, he himself has subtly drifted away from the main Catholic teachings. Foulques now believes in \"Gnophos\", a creed created by Gregoire de Nysse in the 4th century that teaches that true spirituality can only be found, fittingly for a Lasombra, in complete darkness."
 POD_investigate.desc.790366: "Originally from Hungary, Nagy was forced into a monastery after being caught being a bully one too many times, where his quick wits and cunning won the attention of House Tremere. He was introduced to the arts of the Order of Hermes and became a quiet, headstrong magus who preferred physical confrontation to scholarly pursuits. Combined with his lack of Intellectual discipline, this made him few friends. Eventually, he was ordered off to Cordoba in order to built a new chantry there.\nIn time, he was introduced into the vampiric Clan that fostered amidst the order. Nagy gladly gave his life for the powers the vampiric condition granted him and returned to Cordoba, now with the intent on strengthening the hold of the Clan over the Iberian Peninsula, heading his own chantry.\nIn truth, he was a decoy. His brash attitude served as a distraction for the enemies of House Tremere while its more skilled (and subtle) agents used this cover to act unseen.\nViktor isn't a complete fool however and has managed to appear just manipulable enough to outmaneuver some of the Spanish Tremere's enemies by himself. He often tires of the cloak and dagger game though and dreams of visions of conquest and destruction.\n\nFuture fate in Canon\nAs the scapegoat for Tremere's actions in Iberia, Viktor's fate was sealed from the start. He will be eventually killed, some say by the Banu Haqim, others by the Lasombra."
 POD_investigate.desc.791965: "Urraca was [Glossary('Embraced','game_concept_Embrace_desc')] into clan Setite after a long battle of wits with her [Glossary('Sire','game_concept_Sire_desc')] as he could not seduce her any other way. Once welcomed into the followers of the snake god however, Urraca proved to be a very eager convert in all manners of corruption. Her expertise soon revealed itself in her skill of infiltrating various political entities and slowly twisting them into helping the cause of Set.\nHer most recent assignment has been with a large group of European Prometheans who proved to be an easy prey, eager to welcome all into their egalitarian utopia. She is also an expert in forgeries, having an impressive collection of mystical books that she delivers to the right (and often gullible) target. By spreading an interesting \"historical fact\" to the correct person, she has already been able to create several feuds between Princes. Her dreamed masterpiece of instigating an all out clan war is still out of reach so far however. She continues her work diligently, one more deception at a time, each grain of sand wearing down the Sphinx of truth.\nAll for the glory of Set, as it should be."
 POD_investigate.desc.790991: "Also known as Alsezir, Setnakhte is a Setite in the service of the Red Temple of Thebes. Of Moorish origin with gold-flecked eyes, he was sent as an agent of the Temple to observe the advances of his clanmate Ankhesenaten (known in the west as Andreas Aegyptus) to unlock the secrets of Khay'tall's scarab amulet, which had protected that elder's essence from being devoured by his own childe during the fall of Constantinople.\nHe met with Ankhesenaten's caravan in Aquileia, where he also met the young Meribah, who Setnakhte was ordered to eliminate, as she was seen as a disgrace to the Setites she was embraced into as she was not properly educated by her [Glossary('Sire','game_concept_Sire_desc')] before his death. Setnakhte also used the opportunity to observe the Giovanni envoys in Aquileia.\nThrough an agreement with Ankhesenaten where he took Meribah as his adopted childe, Setnakhte left the city quickly to return to his Theban duties."
 POD_investigate.desc.791165: "Mogadishu holds two official vampire gatherings called dar al-salam, meaning “home of peace.” The names are steeped in Muslim faith — another sign of Prince Farnaza's uneasy reliance on the religion. Two Quadis, judges appointed by Farnaza, oversee the dar al-salam and they have complete autonomy in granting or denying access.\nSaruuro of Clan Ramanga rules the Red Sky in Hamar. Her position is both a leftover from her clanmate Arawelo’s nights as Prince, as well as an olive branch offered to the Ramanga by Farnaza. Red Sky is the oldest dar al-salam, and a second home to the rich and powerful. Saruuro judges supplicants on their personal worth, age, and power, and does not seem to care much about clan. Saruuro can supply temporary havens as well as blood dolls on request, though she considers such dependency a sign of weakness."
 POD_investigate.desc.791031: "Bartholomew has maintained a quiet, contemplative existence since his $pod_Embrace$. He is 7 feet tall with a thin build and all the unusual physical and psychological features of the Kiasyd. Sometimes he is mistaken for a Nosferatu. Bartholomew, normally a pacifist, will act to defend himself if he’s in danger. He is on good relations with the local Garou and Fae communities.\n\nFuture fate in Canon\nJoining the Inconnu, Bartholomew will continue his quiet existence. His supernatural friends will take a more active role in protecting him. There will be a pack of werewolves called the Sunstringers who will protect his haven. They consider him one of the few Kindred deserving of an existence, respecting his pacifism and his connection to the Earth.\nMeanwhile, the Fae still consider him one of their kind despite his undead status. There will be seven Goblins who will aid him as much as they can, without jeopardizing their own existences."
 POD_investigate.desc.792819: "Born to a rural hamlet near Modena, Aniello was always fascinated by the cities, full of knowledge and education. Acting upon his dreams, he moved to Venice and became a student in biology. He was soon [Glossary('Embraced','game_concept_Embrace_desc')] by a member of clan Cappadocian and was thrilled to learn more about death and its secrets... before encountering the Giovanni family. It was hate at first sight and Aniello tried to warm his Cappadocian brethren of the threat they presented but none would listen.\nFinding more and more doors being closed to him due to his personal vendetta, Aniello fled to Germany. As he feels the Giovanni's fist tightening around his throat, Aniello has given up on saved his clan, he now only wants salvation for himself and Ana, his Lamia bodyguard and soulmate, before the Venetians inevitably try to silence them for good.\n\nFuture fate in Canon\nAniello will disappear from public sight soon. Many, including the Giovanni, will think him dead. Unconfirmed sightings of him and Ana even as far as the 20th century leave some hope for the true ending of their story however."
 POD_investigate.desc.791754: "In his mortal days, Streck was a Prussian Junker who was a strong supporter of Emperor Frederick's expansion into Sicily. An early Renaissance man, he was both a philosopher and a politician. He followed his king into the crusade and during this time, the German Ventrue decided to add him into their Clan, most prominently Hardestadt, who considered Embracing the young man himself.\nIt all happened differently, when a Brujah rival of Hardestadt, Marchettus, decided to rob the hated patricians of their prize and gave Streck the Embrace himself. Streck's aristocratic demeanor collapsed under his fits of rage and the indoctrination on part of his sire and he came to hate the false facade of civilization he had supported before.\n\nFuture fate in Canon\nHe will join in with the antitribu and the nascent Sabbat, becoming a voice of extreme Sabbat anarchism in the 19th century. An accomplished author, his texts over revolution and rebellion will won many anarchs to the Sabbat cause. Streck himself will be behind various rebellions, making alliances with various independent Clans in order to overthrow local Camarilla societies."
 POD_investigate.desc.792160: "Born in Danzig, Leonard was a quiet man, fond of the stories the many seafarers told around his father's home. He finally decided to travel and see the world but his caravan was ambushed and he was left for dead. Rescued by a passing Toreador who saw the flame of revenge burning in the eyes of the dying Leonard, he found and tore his \"killer\" limb from limb.\nAfter this traumatic event, Leonard struggled to come to terms with his new nature until a Lorekeeper of the Road of the Beast noticed him and taught him how to live in harmony with his Beast.\nTransformed by this revelation, Leonard became the finest Lorekeeper to currently walk the Earth, listening and retelling stories like no other. He is an eternal wanderer, always welcomed in every festival where his rich voice carries a song without need for accompaniment."
 POD_investigate.desc.790432: "Katherine's mortal life began in the year 1116 CE. Young Katherine occupied herself with needlepoint, house management, and something of a secret apprenticeship with a young painter.\nThe sudden death of her father saw her being hurriedly married to a debtor of her older brother, a cruel and possessive man. This man, Hubert, soon orchestrated the death of her brothers, leaving her as the sole heir. Hubert had little patience for her outspoken ways and expressed his displeasure with slaps, kicks, and (when sufficiently angered) a blow from a mailed fist that cracked three of Katherine's ribs.\nKatherine tried to make peace with her situation. Unable to see any of her old friends (for Hubert gave her little freedom) she comforted herself with her arts. Hubert was pleased with her embroidery, but when he discovered her secret cache of paintings, he was enraged. He refused to believe that they were her works and insisted that she must have been hiding a lover. He burned the paintings, then beat her unconscious and did not stop striking her until both her eyes swelled completely shut.\nPoison was her solution and Hubert was soon driven mad, leaving an empowered Katherine as mistress of the home whom she transformed into a prestigious house for artists. It was there that her Toreador [Glossary('Sire','game_concept_Sire_desc')] introduced her to unlife, a new normal that she took with confidence, soon becoming a well respected member of the Parisian court.\n\nFuture fate in Canon\nKatherine will live a full unlife, becoming a lover of Dante Alighieri, overseeing the construction of cathedrals and dabbling in politics. It will be during her inquiries about one Leonard de Vinci that the Inquisitors will find and stake her. It will not be until 1999 that Katherine will be found and awakened to the strange (and exciting) new modern world."
 POD_investigate.desc.790337: "Damek had already been a Voivode when Dacia was ruled by King Decebalus and even centuries later would excert control over the ruins of the ancient Dacian capital - a prize that any medieval Tzimisce warlord would crave.\nHe is the Voivode of Sarmizegetusa, and owns the stronghold that one night would become Hunedoara Castle, where he secretly protects the torpid form of the Tzimisce Antediluvian. He is one of the most knowledgeable genealogists and scholars of the history of the clan, a skilled koldun in the Spirit Ways and a noted warlord in his own right.\nThe voivode maintains a number of settlements populated by an extensive herd and numerous revenants to carry his will while he rests inside his fortress-temple, sits on a throne carved entirely of fused and reshaped bones, draped in thick, dark furs. The skulls of his defeated enemies ring the dais on which that throne stands, and only a few of them are other than $pod_cainite$.\nAs a habit, he is very fond of grooming young brides; he will have a virgin girl-child instructed in her wifely duties while growing into adulthood, before turning her into a ghoul and finally, on their wedding night, granting her the $pod_Embrace$. He will proceed to use those women as vassals and simply discard them, when another catch his eye.\n\nFuture fate in Canon\nDamek will be eventually destroyed in the interminable internecine clan conflicts that plagued the Dark Medieval era, and much of Damek's lands were inherited by his most notable child-bride, Danika Ruthven, who quickly realized she would also be replaced as soon as Damek grew bored of her, and pledged her loyalty to her sire's rivals."
 POD_investigate.desc.792065: "巴比洛声称自公元二世纪以来便一直在利用“吸血鬼天使”的传说。他公开享受人类的崇拜，甚至在某些情况下，他可能也相信自己的神话。作为诺得教区的成员，他的专长领域是德意志帝国，但他可能有些力不从心，夹在独立意识强烈的佛兰芒血仆与梵卓攻势之间。尽管如此，巴比洛在自己的氏族——勒森魃中仍然保持着极好的关系，并且他在即兴发挥和政治方面展现出了一定的才华，适合担任高层职务。"
 POD_investigate.desc.790156: "Durazzo was once held by Geseric, a Vandal finding it hard to navigate the mortal politics that have left his tribe long forgotten. The Norman Herleva was his attempt to grasp the new landscape of his city. She soon proved to be his favorite childe, with an eye for decorum that made Durazzo a center of Cainite culture.  She alloyed the raucous gaiety of the Norman Sicilies, papal pageantry, local vitality, Greek sophistication, Arab learning, and Turkish lavishness-all the cultures pressing on Durazzo’s interests, and all the friends hiding daggers up their sleeves.\n\nWhen Geseric stepped down, Herleva naturally assumed the throne and soon showed that she was much more than an artistically minded Brujah. She works to return the Sicilians to power in the coastal city which has made her an enemy of Greek Cainites who vowed to destroy Latin power. Cainites who openly oppose her position suffer mightily, which has created a small rebellion against her rule, spearheaded by a Greek Lasombra named Asander.\nThe fighting between vampiric factions has become so fierce of late that it's attracted the attention of mortal hunters, some of whom understand the significance of the curse of Caine."
 POD_investigate.desc.792122: "A leper caring for his fellows before the Assyrians defiled Solomon's temple in Jerusalem, Ephraim was saved from despair by his future [Glossary('Sire','game_concept_Sire_desc')] Kothar. It took centuries but he found hope in his heart when the restoration of Jerusalem started at Cyrus' orders.\nEphraim is a master of disguises and serves as the eyes and ears of his Sire in Jerusalem, pointing those that prey on the weak and needy and deserve punishment. Over the centuries, he had contact with many of Jerusalem's most powerful $pod_cainites$ but only Kothar truly earned his respect. He also enjoys contacts with all the mortal religious communities in the city, keeping himself and his Sire appraised of what could happen before many more powerful Cainites.\n\nFuture fate in Canon\nKothar will fall into $pod_torpor$ during the Black Death and Ephraim will keep a careful watch over his mentor, all the while continuing to change identities as the centuries pass him by. He now operates as Ephraim Goldstein, US immigrant studying medical history."
 POD_investigate.desc.792490: "Moussa ibn Yacoub has always known Damascus as his home, from his mortal years as a child, past the $pod_Embrace$ and into tonight. There is no other domain where he would rather be, but he fears that the current situation might destroy the city he loves.\nIbn Yacoub began life as a successful shop owner and earned the Nosferatu’s attention because of his Roman clientele and the secrets they shared with him. Once Embraced, he entered one of Damascus’ more venerable clans and became part of the shadows. Over the centuries, ibn Yacoub has seen the stream of both mortal and Cainite sultans flow past the city gates. In that time, he has come to lead the Nosferatu after the Baali destroyed his [Glossary('Sire','game_concept_Sire_desc')]. Their destruction is his personal vendetta, and it is a trophy he is unwilling to share with the Banu Haqim or Mannal. As patriarch, he forbids the other Nosferatu to aid the Banu Haqim Bistakh or even explain their clan’s position.\nIbn Yacoub isn’t blind, however, and is caught between pursuing a blood feud and helping Damascus survive the coming nights. What the latter entails is a mystery given that ibn Yacoub does not trust Bistakh anymore then he does the Baali. Although not a Muslim himself, he has considered sending for an Arabian clanmate to provide some advice and insight into the various Muslim minds around him."
 POD_investigate.desc.790635: "In his mortal days, Lados was one of the Greek soldier princes that jockeyed for territory after the death of Alexander the Great. He was [Glossary('Embraced','game_concept_Embrace_desc')] by a Malkavian philosopher. It was then that Lados first knew true fear, for nothing in all the battlefields he had witnessed could have possibly prepared him for the shattering Kiss of Malkav's blood. Over a year passed, in which the mad prophet tormented his childe with extended bouts of abandonment that resulted in Lados being paralyzed by fear when left on his own.\nWhen he returned, he found that his army had all but dispersed. With no true choice left, Lados took a position in the court, hoping not to attract attention. Unfortunately, the local Brujah saw him as an unwanted invader and tried to oust him. When word of the planned action against him reached his ears, Lados, however, turned the intrigues of the Greek Kindred against their architects. With the aid of a Tzimisce, he fleshcrafted one of his servants into an exact copy of himself and used a combination of Auspex and Dominate to convinced his slave that he was the true Lados.\nHiding himself beneath a cenotaph to Alexander, the Malkavian used his slave to expose his rival Kindred before the court, their slumbering bodies bursting into flames in the rays of the sun. The Regent awarded him with more and more power in court.\nLados rise to power was interrupted by the arrival of the Persians, led by a vengeful Brujah named Jaxartes, who had survived his original purge. Their battle resulted in Lados' fall into $pod_torpor$.\nFuture fate in Canon\nLados will awaken in the early 2000s, convinced that the End Times have come considering the strangeness of this new world. His already fragile mind will fracture more and more into paranoia and fear of what's to come."
 POD_investigate.desc.791169: "作为罗德里尔的血仆被血缚的柴特拉始终是他意志的代行者。她不仅在蛮力术上极为出色，在虚幻术上也同样熟练。柴特拉在曼加卢尔长大，少年时成为一名血仆，由于缺乏合适的萨洛比战士，她成为了罗德里尔的血裔。\n尽管她表面上对这位名义上的亲王保持狂热的忠诚，但她的讽刺言辞常常让人难以分辨这份忠诚到底是源于血缚还是别有原因。结果，她发现自己在氏族中日益被孤立，因为越来越多的族人开始与底提耶和睿魔尔结盟，而非与达努和扫罗的子嗣保持关系。"
 POD_investigate.desc.505004: "根据挪得学者的记载，以拿曾是那个时代最嗜血的战争狂徒，其战场武勇与统率之能赢得了首位谋杀者该隐的赏识，并受其$pod_Embrace$。作为第二代血族，他统领该隐大军长达难以计数的世纪，只要战场能浇熄他永不餍足的血渴，便始终对尊长与血亲忠心不贰。然而当上古耆宿们掀起对第二代的叛乱时，以拿身上发生了某种转变。少数自称亲历那场战争的血族记载一致表明：他竟调转兵锋对抗以诺、洗拉，以及数量存疑的其他第二代血族。\n直至今夜，其动机仍众说纷纭。有学说认为他认定第三代能提供比尊长与手足更丰沛的血源；亦有传言称该隐轻蔑地视其为\"不过一介屠夫\"，激得以拿誓要证明自己何等致命。无论真相如何，这位战神终究未能逃过第三代对第二代的屠戮，不过某些典籍暗示他是最后陨落者，当这位为上古耆宿奉献一切的统帅迎来终幕时，连背叛者们亦为之震惊。"
 POD_investigate.desc.791721: "当她的兄弟不在时，弗兰齐斯卡是穆尔瑙领地无可争议的统治者。她意志坚定，从不胡言乱语，并且频繁守寡——她的丈夫们总是遭遇最糟糕的运气，如马匹事故、高处坠落或被尖锐物体伤害。她也不幸没有子嗣，极为富有，在匈牙利和勃艮第都拥有庄园，并且愿意为任何引起她兴趣的不幸年轻审判官提供大量的指导和物质支持，因为她有着过剩的母性本能需要发泄。"
 POD_investigate.desc.792354: "Edward Scott originated in Cornwall, where he was a rival lord involved in dynastic struggles. During the conflict, a knight named Sir Lorence came to his castle and managed to gain his trust. In a cruel fit, the knight killed his family and then [Glossary('Embraced','game_concept_Embrace_desc')] the enraged Scott. This event cemented an enormous hate against elders and their authorities within the young Brujah, who swore to himself to watch over the interests of young vampires.\n\nFuture fate in Canon \nEven now, several hundred years later and an elder himself, Edward Scott continues to support the Anarch Movement over the Camarilla. Having taken up residence in Milwaukee, Edward Scott is called \"The Prince\" by the Anarchs, given his high position within the Camarilla and his sympathies for them. Scott does not mind, indeed, he enjoys it. Both Anarch gangs within the area respect him and Scott often defends them from the elders. Most of them disregard his opinions with open disdain."
 POD_investigate.desc.POD_fae_character_200: "作为艾力和爱伦涅德的姐妹，费奇一直嫉妒他们之间的亲密关系。她策划破坏他们的关系，并试图篡夺艾力世家的控制权和冬之王庭的王冠。\n\n其在原作中的未来命运\n费奇说服她的情人希里安勋爵拖延艾力足够长的时间使他无法到达通往阿卡迪亚的剩余门户之一。不论原因如何，艾力最终未能回到阿卡迪亚。据推测，费奇成功回到阿卡迪亚，并在那儿继续统治艾力世家。"
 POD_investigate.desc.POD_fae_character_202: "作为费迪利米德之子、艾力世家的长子，埃达斯被认为有朝一日可能会统领艾力世家。从婴儿时期起，他便接受了贵族式的培养，在外交、阴谋和战争的艺术中成长。同时，他也非常热衷于环游世界。\n\n其在原作中的未来命运\n和大多数仙族一样，在大碎溃期间，埃达斯离开了凡世，前往阿卡迪亚。当大消隐开始时，他重返堕落世界，成为艾力世家的首席发言人，并在“梦之议会”中占据一席之地。他游历各地，传播反抗喜乐廷垄断权力的信息。在巨魔护卫与有潜力的年轻贵族的随行下，他计划以冬之宫廷的名义成为肯考迪娅的至尊之王。"
 POD_investigate.desc.POD_fae_character_211: "作为费迪利米德之子、艾力世家的长子，埃达斯被认为有朝一日可能会统领艾力世家。从婴儿时期起，他便接受了贵族式的培养，在外交、阴谋和战争的艺术中成长。同时，他也非常热衷于环游世界。\n\n其在原作中的未来命运\n和大多数仙族一样，在大碎溃期间，埃达斯离开了凡世，前往阿卡迪亚。当大消隐开始时，他重返堕落世界，成为艾力世家的首席发言人，并在“梦之议会”中占据一席之地。他游历各地，传播反抗喜乐廷垄断权力的信息。在巨魔护卫与有潜力的年轻贵族的随行下，他计划以冬之宫廷的名义成为肯考迪娅的至尊之王。"
 POD_investigate.desc.POD_fae_character_212: "A leader of the celts, she fended off an attack by Rome led by Sarinius of House Balor. The two quarreled for years, back and forth. First Sarinius would win, the Kasmeara would retaliate. Neither could gain the upper hand for long. The two hated one another with a passion bordering on mania; so much so that when Kasmeara was finally captured by Sarinius' troops, she slew herself rather than face his treatment of her. Playing the game along with her, he fell upon his sword as well, sending them both back into the Dreaming. They met again much later, after Christianity had almost conquered the lands they once knew. Once again on opposite sides, they harried one another, foiling each other's plans and disrupting each other's life through constant harassment. They dance a complex step of intrigue and one-upmanship.\n\nFuture fate in Canon \nDuring the Shattering, Kasmeara and Sarinius join hands and cross into Arcadia to continue their twisted games. With the Evanescence, they return to earh as infant twins and grow into bitter rivals. As fate or the Dreaming had decreed that they be tied together in mortal life, so it arranged for both to experience the Chrysalis at the same time. Together, they formed the Duchy of Shadows in Washington, D.C. and took on the names of the gods Kali and Shiva. When not attacking someone else, they turn on one another. Neither will yield precedence; neither will call a truce. Wrapped up in their love-hate struggle, they are as likely to destroy one another as their Seelie prey. Finding few threats to themselves, they indulge in games of superiority, but should a real threat make itself known, they stand against it together as if joined at the shoulder."
 POD_investigate.desc.POD_fae_character_213: "One of House Ailil's leading military strategists. Declan demonstrated a remarkable skill in weapons of all kinds as well as a tenacious grasp of tactics. Inducted soon after his Saining into the Guardians of the Silver Dragon, he soon distinguished himself in tournaments and other martial competitions. Declan's primary failing lies in his inability to avoid confrontations with members of House Gwydion, although he manages to restrict open combat against Gwydion knights to formal duels or the tournament ground. He abides by the Oath Truce.\n\nFuture fate in Canon \nDuring the Shattering, Eregannon ap Dougal saves Delcan's life, a debt that Declan repays after the Evanescence when he rescues Gannon in Silverwood in Virginia's Shenandoah Valley from a motley of six cold iron wielding commoners. More intrigues courtesy of his old friend Lady Arlana follow, and through it all Declan shows his own perverse sense of honor."
 POD_investigate.desc.POD_fae_character_214: "A potent sidhe sorcerer, Vogon is feared by many of the fae. He often attempts to play the commoners against the Seelie Sidhe nobility. He is also known to tempt Seelie to descend into decadence with his honeyed words. He is suspected by some to have unsavory contacts amogn the Prodigals and even, some whisper, the Fomorians. \nFuture fate in Canon \nDuring the Shattering, Vogon returns to Arcadia. He returns to the Autumn World with the Evanescence. In the Kingdom of Pacifica, he worms his way into a seat in the Parliament of Dreams. Somehow, he is able to gain Queen Aeron's favor and seduces her into flirtations with the Shadow Court. Among his future plots is the kidnapping of Lady Sierra, the oathmate of the assasinated High King Dafyll ap Gwydion of Concordia. "
 POD_investigate.desc.POD_fae_character_215: "A minor noble in the Sidhe courts, she desires an end the War of Seasons and the rightful return of rotation of the crown. She openly claims the primary obstacle to return to tradition is the lack of 'honor' among the Seelie courts. For a devotee of the Winter Court, she is often noted for her generous hospitality. Though that hospitality is often used for her to spin her own elaborate intrigues.\n\nFuture fate in Canon \nFleeing to Arcadia with most Sidhe, she finds herself returned to Earth with the Evanescence. She becomes one ofthe few landed Ailil in Concordia with her freehold in Silverwood of Virginia's Shenandoah Valley in the Kingdom of Willows. She slows her aging by only leaving her freehold when neccessary, though this behavior courts bedlam. It is rumored she may have had something to do with the disappearance of High King David Ardry. To avoid a summons delivered by Sir Gannon of the Red Branch, she employs her old friend Declaniel ap Ailil in a ruse."
 POD_investigate.desc.POD_fae_character_217: "作为艾力世家中倾向于使用武力的后裔，她以激烈的言辞和建立一个由妖精恐吓凡人以获取梦华的平等社会的愿景而闻名。在她眼中，誓约休战是阻碍她粉碎喜乐廷计划的累赘。\n\n其在原作中的未来命运\n在大碎溃期间，她将离开地球前往阿卡迪亚。然而在大消隐后，由于她不断破坏妖精社会的秩序，她被逐出阿卡迪亚。多伊兰纳拉选择返回爱尔兰，并前往托里岛，在那里与同谋者们建立了一支哀怒廷军队和暗影王庭。她将利用“北爱尔兰冲突”的恐怖活动掩盖他们的行动，并指派好友洛伦佐腐化阿尔斯特国王芬恩。"
 POD_investigate.desc.POD_fae_character_218: "艾力的妹妹之一，这名巫婆极度自私冷血，奸诈狡猾。她花在探索梦界噩梦界域的时间，几乎与她在希贝耳尼亚的时间一样多。\n\n其在原作中的未来命运\n大碎溃时，她逃离秋暮世界。但并没有直接去阿卡迪亚，而是在不利岱尔荒野定居下来，并创立了沼泽女巫集会。当其他女巫和荒野的各种生物花费大多数时间彼此算计 (或是防备算计)，十二女巫则得以从容沉溺在自己古怪的癖好中。人人都知道如果她被攻击，她会召唤女儿们。最终，在自己的永契堡的长久隔离使她陷入极度狂乱。她将接待一支由怪异访客组成的军队。奈洛会以她的领地为据点，对田野居民与破碎的暗精灵领地同时发动攻击，并寻求与哑巴哈罗特结成据称的盟友关系。"
 POD_investigate.desc.POD_fae_character_219: "莱诺拉·艾力的长女，这名女巫保持青春美丽的外表，透过施行一种古老的交换仪式——以魔法恩惠换取年轻而美丽的身体部位。\n\n其在原作中的未来命运\n大碎溃时，她逃离秋暮世界去往噩梦界域的不利岱尔荒野。与其母巫婆莱诺拉一起创立了沼泽十二女巫集会。她们搁置了彼此的微小分歧并形成了一个松散互助的社群。当其他女巫和荒野的各种生物花费大多数时间彼此算计 (或是防备算计)，十二女巫则得以从容沉溺在自己古怪的癖好中。人人都知道如果她被攻击，她会召唤姊妹们。"
 POD_investigate.desc.POD_fae_character_220: "老巫后莱诺拉·艾力的女儿之一，阿勒哈拉否定其姊乌瑟放荡不羁、虚荣自负的行为。她转而向天主教会寻求精神性的灵感并发誓守贞。不过她的哀怒廷出身使她对圣经的解读相当非正统。\n\n其在原作中的未来命运\n君士坦丁派也没能幸免于大碎溃的板讷，阿勒哈拉被亲情呼唤并跟随家人去往噩梦界域的不利岱尔荒野。与其母巫婆莱诺拉一起创立了沼泽十二女巫集会。她们搁置了彼此的微小分歧并形成了一个松散互助的社群。当其他女巫和荒野的各种生物花费大多数时间彼此算计 (或是防备算计)，十二女巫则得以从容沉溺在自己古怪的癖好中。人人都知道如果她被攻击，她会召唤姊妹们。"
 POD_investigate.desc.POD_fae_character_221: "巫婆莱诺拉的三女，巴克塔沙有着贪馋又怪异的胃口。也因此在她的女巫同类中她也以极其实验性的厨师身分而闻名。\n\n其在原作中的未来命运\n大碎溃时，她并没有采取换生灵之道，而是与家人一同去往噩梦界域的不利岱尔荒野。与其母巫婆莱诺拉一起创立了沼泽十二女巫集会。她们搁置了彼此的微小分歧并形成了一个松散互助的社群。当其他女巫和荒野的各种生物花费大多数时间彼此算计 (或是防备算计)，十二女巫则得以从容沉溺在自己古怪的癖好中。人人都知道如果她被攻击，她会召唤姊妹们。"
 POD_investigate.desc.POD_fae_character_251: "拥有神秘的出身和王族血统，哈拉尔德曾生活在凡人之间。9世纪时，他以摄政之名统治英格兰，成为哈罗德一世国王。他因出色的外交才华而闻名。然而，在短短五年的统治后，他对凡人的政治感到厌倦，便伪造了一场神秘的疾病以假死，并回归了妖精社会。\n\n其在原作中的未来命运\n随着大碎溃的发生，哈拉尔德逃离了米德加尔德，在大消隐从亚尔夫海姆重返尘世。他在日德兰半岛建立了自己的王国，该王国包括丹麦、法罗群岛和格陵兰岛。哈拉尔德国王允许一个活跃的议会在决策中发挥影响力，王国欢迎平民与仙族贵族平等共存。"
 POD_investigate.desc.POD_fae_character_252: "作为一名年轻的仙族，他通过支持1174年围绕挪威王位觊觎者埃斯泰因·梅拉组建的叛乱党派，参与了凡人政治。起初，叛军穷困潦倒，以桦树皮制作鞋子。最终，他协助哈康·哈康松于1217年登上王位。\n其在原作中的未来命运\n \n在大碎溃后，他被放逐至亚尔夫海姆，随后随着大消隐回到米德加尔德。他率领一支队伍夺取了阿萨世家的祖传领地，并在挪威和瑞典建立了达拉纳王国，他在利勒哈默尔郊外的冰城永契堡中统治。"
 POD_investigate.desc.POD_fae_character_253: "作为女王拉格纳夫的孩子，阿萨世家称伊格林娜为“艾西恩之女”。与她擅长外交的母亲不同，她偏爱战争。尽管她酷爱掠夺，或许正因如此，她冰冷的心也被莱夫·米科尔森的爱所融化。\n\n其在原作中的未来命运\n在与情人退至亚尔夫海姆后，他们随着渐隐一同返回米德加尔德。他们向北冰王国的女王劳拉尔宣誓效忠。女王授予他们驯鹿堡的封地，他们在那里作为一小群驯鹿的守护者。"
 POD_investigate.desc.POD_fae_character_255: "House Aeisn feel that legends, songs, stories, and music would be lost forever without the Skalds. Skalds are the bards of the Norse, and Gunter Sorenson has trained for a century at his craft. His talent with words and song have made him a rising star in the house. \nFuture fate in Canon \nGunter Sorenson along with the rest of House Aesin departs Midgard along the Bifrost to return to Alfheim during the Shattering. He returned to Midgard with the Evanescence, but the memory of the stories of what happened in Alfheim had disappeared from his mind. Chicago’s sizable German and Scandinavian population draw members of House Aesin to establish a base there. Sir Gunter Sorenson claims the Freehold of Heartsong in Chicago’s theatre district. Here, he hopes to gather skalds and folklorists of his house to form a cultural center in Concordia’s heartland."
 POD_investigate.desc.POD_fae_character_257: "虽然他父亲灵魂中的春天表现为对战争的执着，但对于莱夫而言，春天则绽放出他对遥远表亲伊格林娜的一段意外爱恋。莱茵兰王室的莱夫与冰岛战士公主伊格林娜之间的浪漫故事，正如他曾祖父母——格比卡的冈瑟与其妻布伦希尔德的旧日传奇。  \n其在原作中的未来命运\n与爱人一起退隐至亚尔夫海姆后，他们在大消隐后重返米德加尔德，并向加拿大北冰之国的劳拉尔女王宣誓效忠。女王授予他们“疾驰驯鹿堡”作为封地，他们在那里守护着一群小型驯鹿群。"
 POD_investigate.desc.POD_fae_character_258: "Eldest son of Iron-faced Magnhildr, she grooms him for courtly etiquette leadership among the Aesin Sidhe. He is known for his good-hearted revelry and common touch with all the kithain. It is as likely to find him sharing a pint with a troll or a boggan as to see him debate politics among the Sidhe. He seems to have little interest in the War of Seasons. \nFuture fate in Canon \nFollowing the High King's call to retreat from Midgard during the Shattering, he travels the Bifrost with his house to their holdings in Alfheim. With the Evanescence, he returns to Midgard as part of his mother Magnhildr's company. With Ragnelf's mysterious disappearance, Magnhildr easily establised Bjorn as a baron. The possession of mortal flesh as a changeling may have become too much for him to handle. When commoners ambush one of the first Aesin freeholds, he turns on the house. Some Aesin will believe that the impurity of mortal flesh caused him to identify with the weaker commoner Kithain. If apprehended, he will stand trial and face judgement so that the matter can be put to rest."
 POD_investigate.desc.POD_fae_character_300: "Possibly the oldest of the Five Great Beasts who battle for the Triumph Casque of Sorrows in Kureksarra. Harroth is most notable for being the only one of the Five to have served the fomorians during the Tessarakonta. The Casque is a weapon of legendary destructive potential. It was used by the Fomorians during the War of Trees. It was wielded by the Red King, until he was betrayed by the Lords of the Mound, ancient cousins of the Trolls, who were extinguished for their betrayal. Dominion of war without end, Kureksarra is the homeland of dreams of struggle, competition, victory, and revenge. \nFuture fate in Canon \nIt is a curious development that Harroth has recently retired from the field, leaving the battle to Icthyus, a competent if uninspired fir-bholg chieftain of the Dark Vale. With the rumored awakening of the fomorians imprisoned under Kureksarra and the Splintered Mountains, many believe that he has again taken up his old position among the Red Court. If true, he has not used this newfound power to crush his Red Plains opponents in the field, but has instead moved his troops into a defensive posture while the other Beasts continue to fight. Reliable rumors have placed Harroth in the Autumn World, a possibility most troubling to both the Seelie Court and the leadership of House Balor. Other faerie luminaries also fear that, because of his renewed relationship with the Red Court, Lord Harroth may be immune to the Mists, retaining his full memories and Dreaming aspect. If so, his rumored return to the Waking World may soon vastly tilt the balance of power toward the Shadow Court."
 POD_investigate.desc.POD_fae_character_301: "Despite the eerie red gleam that emanates from her eyes, many Balor account Lady Eithlinn as the most beautiful of all the women of the house. Certainly, she leads the list of ruthless generals in her capacity as a spymaster. A master of disguise as well as an expert in all forms of espionage and surveillance, she serves as leader for the Eyes of Balor and so knows the most intimate secrets not only of her house, but of the other fae houses as well. Her memory for detail and her ability to recall entire conversations serve her well when it comes to planning covert strikes and acts of sabotage. \nFuture fate in Canon \nShe left with the rest of House Balor to Arcadia during the Shattering. After the war in Arcadia, the Balor seemed to have backed the wrong side, and she found her self exiled back to the Autumn world during the Resurgence. Rather than return to Caledonia, she is sequestered most of the time in her fortress high in the Adirondack Mountains in the Kingdom of Apples, Lady Eithlinn occasionally travels to other parts of Concordia, always in disguise, to pay official visits to other house notables. As Head of Security, Lady Eithlinn sits on the Tower Council and holds the internal safety of House Balor in her capable hands. She sits at the center of a vast network of covert operatives and sleepers that spends its time observing and gathering information on the other houses so that Balor may make its decisions based on accurate and up-to-date intelligence. The importance of her work cannot go without saying, for without her firm grasp of the big picture, the house would flounder in a sea of conflicting rumors, unable to sort out truth from falsehood. Because of her, Balor need not fear that their Unseelie cousins have unpleasant surprises hidden within their freeholds."
 POD_investigate.desc.POD_fae_character_302: "作为巴烙世家的无情战士，他因在战场上的怒火声名远扬。  \n其在原作中的未来命运\n在大碎溃期间，他离开了秋暮世界，将时间花在阿卡迪亚的训练和小规模冲突上。毫无疑问，在复兴前的激烈冲突中，他曾参战，但尽管他战力非凡，他们那一方似乎仍输了战争。随着巴烙世家的其余成员一起，他不情愿地流亡回到秋暮世界。戈德温将统帅由巴烙世家成员组成的精英军队。他的职责不仅包括监督家族军队的训练，还要规划在“永夜”之后对非巴烙世家领地的征服。他负责策划巴烙世家部队的战略部署，并担任无法离开堡垒亲自指挥的高领主李-提利的战地指挥官。"
 POD_investigate.desc.POD_fae_character_303: "A noble son of Cathal,he is a dazzling apologist for the Unseelie viewpoint, and has an inherent understanding of the political implications of events. Personally appealing and charismatic, he excels in making others feel important and appearing to agree with their opinions. \nFuture fate in Canon \nWith the rest of House Balor, he returns to Arcadia with the Shattering. After the Resurgence, he will be discovered hiding in Arcadia long after most of his house had been exiled. He will steal the body of a 15-year-old computer wizard named Gerald Owens in Tennessee. Gadiel will remember nothing of Arcadia, except recaling his exile. He will burn with revenge against the Seelie who cast him out. He murders Gerald's parents and establishes himself as a drug dealer in Knoxville. He will then violate Count Oakleaf's hospitailty, kidnapped the count in his sleep, and abandoned him in the Far Dreaming from which Oakleaf never returned. Gadiel will take the freehold for himself, renaming it 'Twisted Oak'. Masquerading as a Modernist in the Parliament of dreams, he establishes an inner circle of conspirators called the 'Children of Annihilation' that seek the complete erradication of all Seelie. He will be  brought many childings to train, and those he will regard as failing will be buried in a mass gave in the dirt-floor cellar of the Twisted Oak. He will pledge vassalage to King Meilge in exchange for backing his defacto claim upon the Twisted Oak freehold."
 POD_investigate.desc.POD_fae_character_304: "卡哈尔的儿子，他被可怕的塔林怪物训练成了一名战士。\n\n其在原典中的未来命运\n和巴烙世家的其他成员一样，他将在大碎溃时逃离秋暮世界，返回阿卡迪亚。据推测，他在阿卡迪亚的战争中战败，随后在大复还期间被流放回地球。他将担任巴烙世家中最艰难的职位之一，指挥塔林族的杂牌军队，时刻冒着生命危险与那些无法预测和控制的被遗忘的梦境之子（或者更准确地说，噩梦之子）为伍。与这些生物的持续接触很可能最终使他彻底疯狂。"
 POD_investigate.desc.POD_fae_character_305: "The youngest daughter of Cathal, Rowhenne seems to spend as much time in other Unseelie courts of Hibernia as she does with her own family in Caledonia. In particular, she treats with the seducers of the Leanhaun and the courtiers of Ailil perhaps because of their hold on the Isle of Dreams and Court of All Kings.\n\nFuture fate in Canon \nWith the retreat of Houses Balor, Ailil and Leanhaun to Arcadia with the Shattering, she fled the Autumn World through Silver's Gate. With the Resurgence, she found herself returned to Earth. For the Balor, she will become the Lady General of the Forces, and act as the representative of House Balor to the armies of the Shadow Court. Her expertise in dealing with the warriors of Ailil and Leanhaun (such as they are) will ensure the cohesion of the Unseelie army."
 POD_investigate.desc.POD_fae_character_306: "Despite his lack of a left hand, Raghnall has more than proven his worth as a warrior and leader within the house. He spends more time with the Prodigals than he does with other fae, causing him to demonstrate some peculiar mannerisms. He has been known to break into wild bursts of howling at the full moon, a habit derived from his association with various groups of Black Spiral Dancers. He has also acquired a taste for drinking blood, something he learned from his allies among the Children of Lilith.\n\nFuture fate in Canon \nRather than staying with his beloved Prodigals, he goes with the rest of the Balor to Arcadia during the Shatteringer. With the Resurgence, he can finally return to earth and renew his relations with Vampires and $glossary_wyrm$ worshiping Werewolves. He will live in a high rise penthouse in the suburbs of Chicago. From his freehold in the Kingdom of Grass, Raghnall will oversee the ranks of Prodigal allies who have pledged themselves to join Balor's fight against the children of the Tuatha de Danaan in return for Balor's assistance in their own versions of Doomsday. Whether or not he intends on fulfilling his obligations will remain unclear. Many of the house will believe that The Dancemaster waits to see whether or not the arrival of Evernight precedes the cataclysms of the werewolves or vampires before he commits any house troops to foreign struggles."
 POD_investigate.desc.POD_fae_character_307: "Foul in the extreme, no crime is too hideous for Dooley. He has raped children, tortured helpless captives, stolen food intended for a hungry, given poison to a 12-year-old just to see what would happen, all in the pursuit of Glamour. He makes an art form of pain and torture, delighting in causing mental anguish in equal measure. Because of his particular deformity (a hideous-looking black and putridly rotting tongue), Black-Tongue cannot speak. He communicates either by gesture or through writing out his questions, answers, and thoughts. Nor can he taste food. In his fae mien, his hair becomes a tangled knot of graying brown and the stubble masquerades as a short beard. His mouth is a brown slash in his face, and his black tongue lolls half out of it, dripping saliva down his chin. When he manages to pull his tongue in, he looks almost normal, though still ugly for a sidhe.\n\nFuture fate in Canon \nHe returns to Arcadia with the rest of the Balor during the Shattering, only to return again with the Resurgence. Once exiled to Earth, he meets with Doireannara of House Ailil and becomes her most ardent recruit. He will be at his most effective as the silent, sinister figure who lurks behind Doireannara whenever she addresses the troops. They will respect and fear her, but they will be terrified of Dooley. He will need only to lick his lips with his putrescent black tongue to command instant obedience. He will delight in inflicting little tortures even on his comrades-in-arms, requiring them to stand perfectly still for half an hour while balancing on their toes, for instance. Alternatively, he occasionally will require 'favors' to refrain from such pastimes. Inability (or refusal) to perform will be met with swift and painful punishment. Unknown to him, however, Doireannara will begin watching him and be prepared to squash him like a bug."
 POD_investigate.desc.POD_fae_character_308: "Edana has made it her task to find the necessary gold and treasures to support House Balor's shadowy war for the Ever Night. A dark-haired beauty with a natural eloquence that enables her to charm others into giving her gold and promising favors, she has become one of the Shadow Court’s chief recruiters and apologists. Those Kithain to whom she speaks find themselves longing for the freedoms and camaraderie she promises as members of the Shadow Court. Some have embraced their Unseelie natures simply to be allowed to remain in her vicinity. Such is her charisma that many believe she is in love with them, too — even in the face of proof to the contrary. She embodies the picture of Irish beauty. The skirts also conceal the deformity that is part of her birthright as a member of House Balor — a twisted ankle and foot. Wearing a special boot, she manages to move gracefully despite the slight limp she cannot hide and the slowness of her progress.\n\nFuture fate in Canon \nWith the Shattering, she retreats with the rest of her House to Arcadia. When she returns to the Autmun World with the Shattering, she choses the body of an heiress of a prominent Anglo-Irish family from County Derry, Edna Bayler will enjoy the luxuries of the privileged class while secretly siphoning off portions of the family wealth to purchase munitions, weapons, explosives, and other supplies for her current favorite terrorist groups. She raises capital to support armed insurrection in Northern Ireland and a half-dozen other countries. In addition, her talent for fundraising (both in Europe and America) will benefit the Shadow Court as well, allowing its members to stockpile their own caches of specially made iron weapons."
 POD_investigate.desc.POD_fae_character_309: "费尔南·阴郁之子，巴烙世家的畸形诅咒在戴维因身上体现为一对从背部长出的巨大的黑色乌鸦翅膀。他凭借这些特征成为一名出色的刺客，并在炼金术和毒药制作上颇有造诣。其中最可怕的毒药名为“烂眼”，它不会直接杀死受害者，而是使他们的眼睛在眼窝中腐烂。\n\n其在原作中的未来命运\n在与维多利亚·阿普·格威顿夫人及范雄·阿普·菲奥纳爵士策划的一场绑架与暗杀的双重背叛中，戴维因被伊奥兰瑟·阿普·斯卡萨赫杀死。他的尸体被遗弃在布利代荒地的一处悬崖底部。"
 POD_investigate.desc.POD_fae_character_310: "Lorenzo is tall and painfully thin, more like a sluagh than a sidhe. As a member of House Balor, he has a deformity. His is physical and is represented by his extremely gaunt frame and hungry-seeming eyes. His hair has more body, almost a life of its own. His eyes are a piercing grey and look as though they would suck the life out of whatever he turns his gaze on. He is always hungry... for food, excitement, treasure, Glamour, pain, pleasure, or praise. He can never get enough and he always hungers for more, even when he has just been sated. \nFuture fate in Canon \nLorenzo will sent from Arcadia to Earth to prepare for the takeover by House Balor. He will be geased to work on their behalf to bring down the Seelie courts of Hibernia. Since he will be under a geas, even he will sometimes not know why he does what he does. He arrives in Ulster with no memories, but quickly comes into contact with Doireannara who tasks Lorenzo with insinuating himself into the court of King Finn of House Fiona. Supposedly gathering glamour through marking talented mortals for musing, he is actually a ravager who brings back tainted Dross for Finn. Finn designates Lorenzo his secret champion. Eventually, Lorenzo starts stripping glamour from the dark pleasure of the Troubles. When the geas conflicts with orders from Doireannara, he will just shut down for a little while until the conflict goes away. Since the goals of House Balor and Doireannara are similar, this is often not a problem."
 POD_investigate.desc.POD_fae_character_311: "An ambitious Balor lordling, he once had a scheme to lead a Roman legion to Gaul and conquer a Kingdom for himself, but his campaign was thwarted by Kasmeara ni Ailil. The two quarreled for years, back and forth. First Sarinius would win, the Kasmeara would retaliate. Neither could gain the upper hand for long. The two hated one another with a passion bordering on mania; so much so that when Kasmeara was finally captured by Sarinius' troops, she slew herself rather than face his treatment of her. Playing the game along with her, he fell upon his sword as well, sending them both back into the Dreaming. They met again much later, after Christianity had almost conquered the lands they once knew. Once again on opposite sides, they harried one another, foiling each other's plans and disrupting each other's life through constant harassment. They dance a complex step of intrigue and one-upmanship.\n\nFuture fate in Canon \nDuring the Shattering, Kasmeara and Sarinius join hands and cross into Arcadia to continue their twisted games. With the Resurgence, the return to earh as infant twins and grow into bitter rivals. As fate or the Dreaming had decreed that they be tied together in mortal life, so it arranged for both to experience the Chrysalis at the same time. Together, they formed the Duchy of Shadows in Washington, D.C. and took on the names of the gods Kali and Shiva. When not attacking someone else, they turn on one another. Neither will yield precedence; neither will call a truce. Wrapped up in their love-hate struggle, they are as likely to destroy one another as their Seelie prey. Finding few threats to themselves, they indulge in games of superiority, but should a real threat make itself known, they stand against it together as if joined at the shoulder."
 POD_investigate.desc.POD_fae_character_312: "埃达纳之子苏尔托克是巴烙世家军队中的一位寡言的战术家，他专注于训练年轻的仙族以及平民的战争技巧。\n\n其在原作中的未来命运\n在大碎溃时期，苏尔托克参与了巴烙世家从秋暮世界的“战略撤退”，并花费几个世纪的时间为带来永夜的战争进行训练。随着大复还的到来，他返回地球，来到加利西亚联盟（德国），并占据了埃博尼尔永契堡。苏尔托克被高领主李-提利指派，作为平民戚族与巴烙世家之间的联络官。在这个角色中，他将有前途的巨魔格罗多夫收为徒弟，训练其战术和战争技能。最终，苏尔托克将被一名激进的格威狄昂成员刺杀。而如今已成为巴烙世家平民军队指挥官的格罗多夫，誓言要为他的导师复仇百倍。"
 POD_investigate.desc.POD_fae_character_313: "洛伦佐的女儿坦吉瑞亚经常在喜乐廷和凡人之间担任间谍。她时刻留意着有潜力的凡人孩童，并将他们绑架以转化为换生灵。\n其在原作中的未来命运\n在大碎溃导致阿卡迪亚封闭之后，坦吉瑞亚将在大返还时期回到秋暮世界。她将在加利西亚联盟（德意志）的一座喜乐廷永契堡中继续她的间谍身份。在为巴烙世家物色有潜力的孩子时，她发现了一个异常高大强壮的孩子。当她察觉到他即将破蛹时，她绑架了这个将被称为格罗多夫的巨魔。在守门者们的帮助下，她通过仙路逃往由祖托克领主统治的埃博尼尔永契堡。祖托克将训练格罗多夫，成为巴烙世家平民军队的巨魔指挥官。"
 POD_investigate.desc.POD_fae_character_201: "亦以醉人女王闻名，她是意志坚强、野心勃勃，既狡猾又风流的艾力之妻。她因曾带领人民发动战争而臭名昭著，堪称一位典型的战士女王，也有些人相信她是主权女神的化身。她渴望窃取阿尔斯特王的宝贵公牛，于是开启了库利牛长征记的故事。鲁格之子，库胡林试图阻止梅芙的军队，但女王仍设法偷走了公牛。然而库胡林给了公牛致命一击，使梅芙失去她的战利品。在盛怒下，梅芙派出多名杀手来刺杀库胡林，甚至包含了其兄费迪亚。最终，在摩莉甘参予的诡计下，库胡林破了誓并被绑在石柱上杀死。梅芙仍然对其前夫康纳尔怀恨在心并企图消灭他。梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。随后她重新命名每一位儿子为“梅因”。\n其在原作的最终命运\n在奎克岛的水池里洗澡时，她被弗德贝尔的投石索所投掷的一块起司击中头部而亡。靠近斯莱戈郡，诺克纳雷亚山顶上有一大型石堆据传是康诺特女王梅芙的墓冢 (爱尔兰西部和西北部的其他一些巨石遗址也宣称此等殊荣)。从五个郡外都能清楚地看到这座巨大的石堆（重达近 4 万吨），当然那是在爱尔兰变幻莫测的天气允许的情况下。尽管这座石冢对考古学家来说极具诱惑力，但从未被探索或挖掘过，即使如此，许多到访该地区的游客仍然会花一个小时攀登到诺克纳雷亚山顶，近距离亲眼目睹它。按照传统，每位前往石堆的朝圣者都要带一块石头来增加其体量，多年来，这种习俗使得探寻石堆内部的想法越来越不可能。梅芙死后，由于莎士比亚的“罗密欧与茱丽叶”，她将成为最著名的仙后之一。"
 POD_investigate.desc.792015: "阿奇博尔德生前，有时被人不甚友善地称作“呆子”。确实，他言辞笨拙、思维迟缓，比起埃克塞特其他男孩们的胡闹，他更偏爱独处的宁静，但他的直觉力却不可思议。\n他开始在卫队长的指导下学习剑术，并且实际上展现出了非凡的天赋。不幸的是，他永远也没能成为骑士，甚至连卫兵都没当成。从布里斯托尔来的路上，强盗袭击了商队，整个商队无人生还。当受伤流血的阿奇博尔德试图逃进树林时，那些嗜虐的匪徒尾随而至，像猎杀猎物一样追捕他。\n他们不知道的是，自己正逃入玛格达琳的领地——一位来自埃克塞特、定期巡逻以确保道路安全的布鲁赫。她轻易地杀死了那些强盗，正要对这个男孩施以解脱时，他却说出了四个简单的字：“我原谅你，玛格达琳。”震惊与触动交织，她$pod_Embraced$了他，自己也说不清缘由。\n被初拥后，阿奇博尔德变得更加野性，过着游荡的生活，从一个地方迁徙到另一个地方。若不是他执着于骑士礼仪，人们很容易将他误认为冈格罗。多年来，他在荒野中流浪，最终来到了康沃尔以及那群有些吸血鬼声称是传说之地里昂内斯遗迹的岛屿群。很少有该隐子嗣能在此地安家；他们太常被妖精驱赶。然而，妖精们似乎并不介意阿奇博尔德的存在。尽管如此，他也很少在那里久留，只在需要休息和恢复时才返回。\n近来，在埃克塞特，人们流传着关于一个幽灵般的年轻骑士在森林中扯下强盗和战士头颅的故事。这与事实相去不远，因为阿奇博尔德其余的时间都在荒野中漫游，帮助保护旅人、对抗邪恶，并且他有一种奇特的禀赋，总能恰好出现在需要他的地方。"
 POD_investigate.desc.791824: "Sold as a boy slave to Constantinople, Amadeo's life was saved by the Toreador Marius who was intrigued by Amadeo's uncanny faith despite his difficult situation. Marius brought him to Venice and $pod_Embraced$ him, proving to be a diligent [Glossary('Sire','game_concept_Sire_desc')] by teaching the boy writing, reading and the holy scriptures. Separated from Marius after a fire in Venice, Amadeo started wandering the world and forged a strange friendship with the Tzimisce Mircea Fratescu. Under the Carpathian noble tutelage, Amadeo committed his first $pod_diablerie$ and discovered many new things... that shook his faith to its core. Determined to mend his broken spirit, Amadeo made a pilgrimage to the Saint Sepulcher and managed to survive the aura of faith in the church, rekindling his own one at the same time.\nContinuing his travels, Amadeo established himself in France, becoming a patron of the burgeoning guilds and now turning his attention to the rumors of an ancient sect having found a state even higher than his own faith : Golconda. He is also trying to find disciples to pass on his knowledge of the divine but, so far, all of his apprentices fell from the road one way or another as if someone was trying to make them fail...\nFuture fate in Canon\nAmadeo will be contacted by the Inconnu and will join them in their quest for Golconda."
 POD_investigate.desc.792308: "Even as a child, Qasim has always experienced visions. He was also blessed by impressive religious insight but lacked the understanding of mundane intrigue and ended up abducted by an unscrupulous Imam. Rescued and $pod_Embraced$ by a Malkavian named Dabir, Qasim's visions became darker with the new vampiric blood cursing through his veins. Now he sees the deeds of the wicked and thinks himself bound to punish them. This righteous fury earned him quite a reputation in Andalusia and made zealot [Glossary('Ashirra','game_concept_ashirra_desc')] look for his help while secretly fearing that any missteps on their part might make them Qasim's next target. Even Sultan Badr of Granada has sometimes requested his help through her motives always ended up more political than righteous in nature.\nFor his part, the Malkavian isn't concerned with the theological implications of his visions. He only follows because they are part of his obligations to God.\nRecently, Qasim has been following his visions north to Pamplona where he feels like his destiny is. Prince Roque seems ready to help him make some sense of the visions of his tortured mind."
 POD_investigate.desc.792159: "Constantine lived by the Mediterranean. Even in death, he remains by his beloved sea. A devout child, he entered the priesthood and was eventually ordained in Constantinople, where he looked forward to spending the rest of his life serving God. But he did not find the peace or rewards he had hoped for. Outraged by the corruption he saw in the Church, he became something of a radical, and his outbursts against his superiors eventually saw him ejected.\nHe wandered the slums of the great city, preaching to the desperate and destitute and taking pride in his piteous state. His health collapsed, and he spent his last months of life in a state of near-frenzy, attempting to tend to the sick even as fevers and chills wracked his body. A voice came to him, promising God's reward if he could prove himself a little longer. When he rose, he felt a terrible hunger within. Somehow, he found himself amidst the very beggars and outcasts he had ministered to. Then the Beast took over and he slew them all, hungrily feasting on their blood.\nStavros, the “angel” who blessed him, explained that the Beast inside was all his sins. His sacred task was to take the sins of others into his soul by draining them of their blood. When his soul was full and he could take no more, God would open his arms and all the sins he carried — his own and those of his victims — would be washed clean by the blood he had spilled.\nConstantine accepted his mission eagerly. He has, over the centuries, gained a measure of control over the Beast and now chooses his victims with some care. He typically lives in a city for several decades, selectively murdering the wicked and the wealthy, often seducing them, sometimes hounding them in a terrified flight through the wilderness.\nConstantine is one of the foremost scholars of the Road of the Beast, and he welcomes students. They must hunt with him, however, and he puts them to harsh physical, mental and moral tests."
 POD_investigate.desc.790807: "Valerian has been a senator all his life and unlife. First as a mortal in Rome then as an immortal in the vampiric Eternal Senate. His eloquent speeches, calm demeanor and seemingly lack of further political ambition made him many friends and something of a neutral party between the feuding factions of the senate.\nWhile Rome is long gone, Valerian didn't change much in the following centuries, still carrying himself with the gravitas of the distinguished senator he is. It was Alexander of Paris who first sought his allegiance during the early Dark Ages and Valerian accepted, becoming the official diplomat of the powerful Grand Court. His long experience in diplomacy and peerless reputation were instrumental in establishing the Grand Court as the most powerful Ventrue power since Rome.\nValerian was on a mission in Constantinople when the Fourth Crusade happened. While he managed to avoid the fighting, he had to rely on an old acquaintance of his, Andreas Aegyptus, to go back to Paris with his caravan. Andreas welcomed his old friend, knowing that Valerian's connections with Princes along the road would serve his reputation well.\nOnce back in France, Valerian participated in the coup leading to Alexander's exile, first to curtail Saviarre's influence then to protect himself from Alexander's paranoia. Knowing that this event meant that Ventrue power in France was shattered, Valerian made his way towards Germany and the rising star of his $pod_clan$, Hardestadt. Even an hardliner German might have need of a diplomat after all."
 POD_investigate.desc.791482: "Serena was the prize childe of Garinol, abbot of the Petrin Hill Monastery in Prague. In 1141, he released her from his charge in order to serve Ecaterina the Wise, in partial repayment for the boon of dealing with his deceitful childe Mercurio.\nShe accompanied Christof Romuald in his coterie during his journey to Vienna and back, acting as an advisor to him. Because she too left behind many things she loved in the mortal realm, she says, she has an understanding of the pain that is in his heart. They became separated after their first encounter with Vukodlak at Vysehrad Castle.\n\nFuture fate in Canon\nSurviving both this disaster as well as the later Giovanni purge, Serena will emerge in modern nights in Jerusalem after the formation of Clan Hecata, now assuming the surname \"Praha\"."
 POD_investigate.desc.791353: "A levelheaded and soft-spoken young Nosferatu ancilla, it is Ormr who most draws the scorn of the Viking court. In secret, though, he is a passionate believer in Jesus of Nazareth, and the head of Bjarkarey’s hidden $pod_cainite$ Heresy. He is an ally of Gudrunn, and they both work toward the end of the old faith in Bjarkarey. He is charismatic and dignified when away from Valborg’s warriors, with features that are unusually symmetrical for one of his Clan. When under the Queen’s eye, he is servile and pathetic, acting as the court’s jester, but this is an act, and one he does not mind — after all, he is outwitting her.\nHe has a collection of hiding places all over the island, and uses some of these for his masses. There are around a dozen Cainites in Bjarkarey, and Ormr is not the only one of that number present at his sermons. Some of the Queen’s blood-thrall hirdmen and a few mortals attend this hidden church, where open rebellion against the Cainite rule is preached.\nGudrunn often uses Ormr, who becomes bolder and uses the Queen’s absence to try and shore up the Christian cause in his beloved hometown, often traveling to nearby settlements to build alliances, as well as building secret tunnels and underground chambers within the island’s bedrock. The gifts of his blood allow him to go where he wishes unseen, and he willingly lends this ability to Gudrunn’s mischief in exchange for her help with his plans."
 POD_investigate.desc.791462: "In his breathing days, Roland was content to live a life of pleasure. The consequences of his actions never disturbed him, for the moment was everything. Handsome and commanding, he took what he pleased and never feared the consequences. His arrogance attracted the interest of a Parisian sybarite, a Setite who admired his flair. At first, feeding on $pod_cainite$ blood was merely an exotic perversion, one he eagerly cultivated. Soon he came to savor the wine of his master’s veins, and he found the life of a Setite ghoul to be much to his liking.\nRoland’s sire tired of the thrill of the hunt, and thus employed his ghoul in the enterprise of finding mortals for his entertainment. Each week, Roland was to outdo himself in securing a new liaison. Thus did he learn the means of seducing the noblewoman at the courtly ball, the value of insouciance when slumming among the taverns of the poor, and the intercourse of slavers and blackmailers.\nGifted by his Setite master to a Ventrue, Roland was soon $pod_Embraced$ and given a new mission, infiltrate Bulscu's court in Budapest. At first, the mission proved laughably easy as Bulscu was as, if not more, hedonist as Roland was and soon relied on him to provide him with new nightly \"entertainment\". Bulscu's fall into $pod_torpor$ (in no small part due to Roland divulging critical information to the Hungarian's rivals) and the frugal Vencel Rikard's ascension to the princedom saw his fortunes dwindle very quickly however. The new Prince is looking into whether or not Roland was behind Bulscu's worsening state while his own Ventrue masters are now finding him much less useful with Bulscu not being around anymore.\n\nFuture fate in Canon\nThe Holy Roman Ventrue will reject Roland. Despondent, he will be willing to ally with anyone who can afford his services. Eventually he will take service with the Setite mastermind Count Jocalo, helping him infiltrate many of Europe’s noble houses."
 POD_investigate.desc.791437: "A solitary and reclusive Gangrel, Hadeon found the need to change his lifestyle when he learned of the Tremere using his clanmates as ingredients for the creation of their slave soldiers, the Gargoyles. Coming close to Constantinople during the aftermath of the Fourth Crusade, Hadeon choose to contact the caravan master Andreas Aegyptus and the two came to an understanding. Hadeon would serve as a scout for the caravan while he could retreat to it when the need arose.\nHadeon's intuition of not traveling completely alone soon proved sound as werewolves prowled the countryside following the collapse of the vampiric Dream. He illustrated himself during several battles against them though was grudgingly forced to accept that he wouldn't have survived without the help of Andreas' caravan.\nArriving in Aquileia, Hadeon made contact with the Tzimisce Djula for his ambition to take revenge upon the Tremere.\nWhile the results of this alliance are unknown, Andreas earned the respect of Hadeon during the caravan's journey and the Gangrel entertained the idea of taking the role of a scout perhaps more permanently in the future."
 POD_investigate.desc.793030: "Ignatius Jacobi is, in many ways despite his relatively young age, a relic of older times. The Prince of Split is a liar, a monster and an arrogant being that rules through fear and terror. His numerous childer are all bloodbonded husks that are only capable of approving whatever he commands. His rule over the mortals of the city is completely open and the mortals here have long learned to fear the shadows that take anyone disagreeing with Jacobi.\nThis way of doing things have left Split as something of a pariah in vampire politics and Jacobi's little fief is most of the time left alone. In many ways however the Lasombra's strength is an illusion. While hosting Andreas Aegyptus' caravan and trying to force them to stay under his rule, he was outwitted by a simple ploy and made to look like a fool.\nThis sudden showcase of weakness has interested the Venetians Giovanni and while their first attempt to take the city has been foiled, there is little doubt in anyone's mind that Jacobi's little princedom of darkness will soon come to an end."
 POD_investigate.desc.791426: "Qalhara was fascinated by death since her childhood days in Nubia. As a child, she found her cousin having fallen to his death in the wilderness and decided to study him, coming back day after day to see how his corpse started to decay. This morbid curiosity continued until she was noticed by a traveling Lamia, Indira, who took her under her wing before embracing her. Qalhara excelled during her training, becoming the perfect embodiment of the Lamia, as deadly with a spear as she was loyal to the teachings of Lilith.\nWhen the night came for her to be assigned to a Cappadocian, she received the honor of becoming Constancia's bodyguard. Despite the two women lack of patience for social graces, they soon valued each other and Qalhara became the oracle's advisor when matters of a more practical nature when at hand.\nShe recently accompanied her mistress in her journey towards Egypt to confront Lazarus and she once again proved herself, protecting Constancia during this dangerous adventure and against Lazarus himself. Some tension was felt between the two women however when Qalhara noticed that Constancia became more and more withdrawn, barely listening to her advice anymore (which resulted in several close calls). After the success of their endeavor, she confronted the oracle about it who promised to be more attentive in the future, mending their relationship.\nWith Constancia back at her mountain home of the Erciyes, Qalhara is once again guarding the entrance of the most important sanctuary of the Cappadocian and the resting place of Cappadocius himself."
 POD_investigate.desc.791431: "Sirh Saad is a man following his own path. While he never officially cut ties with Alamut, the reclusive sorcerer choose to live in the desert and associate himself as little as he could with other people. He sustained this way of unlife until his visions started to warm him of an impending disaster if he didn't reconnect with his $pod_clan$. Thus he did just that and was soon affected to a mission under the leadership of a young warrior, Fatima al-Faqadi.\nSihr Saad had as many difficulties working with others as he anticipated, coming very close to just give up on the mission at several points because of Fatima's indecisiveness. Still, his sense of duty always prevailed and he ended up begrudgingly appreciating Fatima's more careful and thoughtful approach.\nDuring their mission, Sirh came into contact with a cell of the Web of Knives and tried to warn them of an impending attack. His warnings fell into deaf ears and he was imprisoned by the Web members, confirming to the sorcerer that Alamut was still gangrened to its core. He thankfully managed to flee during the ensuing battle.\nAt the climax of their mission, Sirh was the only one able to thwart their target's powerful magic, saving Fatima from a slow and painful Final Death in the process.\nWith their task accomplished, Sirh considered his part in the vision done and stated his hope of returning to his reclusive lifestyle. He nonetheless accepted this newfound friendship with the young warrior, not excluding the possibility of the two working together again."
 POD_investigate.desc.790577: "An unremarkable young man from Venice, Matteo had the dubious honor of being chosen by Alfonzo of Venice to be his servitor. The Lasombra bishop is known for his short temper, lack of any mercy and very quick turnover of minions. Lack of loyalty, making errors or just being in the wrong place at the wrong time was never tolerated in his household. Still, where many quickly fall to become one of Alfonzo's parties \"entertainment\", Matteo instead thrived. His docile demeanor, good head with numbers and intuitive knowledge of when to leave Alfonzo's alone earned him ghouldom and a promotion to become the head of his household's personnel.\nMatteo continued loyally his work for centuries, accompanying Alfonzo to Constantinople and growing in responsibilities as the bishop acquired more and more power in the city. During this time, Matteo was promised the $pod_Embrace$ as a reward for his diligence but was always passed on for Alfonzo's latest fancies. This finally changed in 1208 when Lucita of Aragon made contact with Alfonzo and the two worked to secure his hold over the fallen Constantinople. Matteo was instantly smitten by the beautiful Iberian and, luckily for him, this potential breach of trust towards Alfonzo was accepted by the Venetian as his budding alliance with Lucita was more important to him at the time. When said alliance proved fruitful and secured Alfonzo's princedom of Constantinople, he choose to offer Matteo to the Aragonese princess thus securing their partnership while getting rid of his potentially compromised administrator, a result Matteo himself could only have dreamed of.\nHe has been kept in Alfonzo's service to train his successor... and as a collateral to solidify this new alliance."
 POD_investigate.desc.790286: "Chosen by Geoffrey du Temple for his just and chivalrous mindset, Hugues de Clairveaux was a Templar himself before his $pod_Embrace$. Becoming a vampire changed little about his perspective on things and he dutifully accompanied his [Glossary('Sire','game_concept_Sire_desc')] to the 4th crusade, hoping for a godly victory over the walls of Jerusalem. Then Geoffrey was called back to Paris and the crusade was diverted to Constantinople and became a sordid assault on fellow Christians. Hugues did his best to contain (and often personally punish) the worst offenders but was soon abducted by a Lamia who corrupted his mind to make him think she was the Virgin Mary.\nWith this new \"revelation\" in his mind, Hugues took control of the aftermath of the sack of Constantinople and gathered support for a new expedition to Egypt where Mary called to him (in truth, where the objective of the Lamia was). His charisma and stern behavior rallied many to his cause.\nEnter Fatima al-Faqadi, a Banu Haqim assassin sent to stop him before he could pose a threat. Fatima however soon fell in love with the Templar and tried to reason with him, hoping to have him stop the crusade and perhaps even convert to Islam. She ended up finding the Lamia's influence over Hugues and was able, with the help of her coterie, to defeat her. Sadly, the last vision the dying Lamia sent to Hugues was \"Mary\" asking him to kill his love for her which he tried to do when Fatima reunited with him. After a grueling fight, the Banu Haqim ended up victorious, killing Hugues and accomplishing her mission somewhat despite herself."
 POD_investigate.desc.792857: "Jean le Duc is a man that doesn't yield to the control of others. It is the story of his early life, the rebellious flight from one master to another until one day he became a mercenary guard for a group of French knights going to the Holy Land. Jean could see that these men were not like the others, they were not driven by money or lust but by faith and so, when they became the creators of the Order of the Temple, le Duc joined them. Old habits die hard however and the ex mercenary could not find the same zeal in his heart as they did. When the Lasombra Montrovant started using these early templars for his search for the Holy Grail, le Duc choose to side with him hoping for immortality and power in this world instead of salvation in the other.\nMontrovant soon saw that the grim determination of this warrior could be of use to him and $pod_Embraced$ him.\nLe Duc was... ambivalent about the experience. Immortality was a nice perk but Montrovant now for all intents and purposes had control over his destiny, something the Frenchman didn't like. Still, he was wise enough to know that open rebellion against a being as powerful as Montrovant would be suicidal and thus choose to be the loyal childe.\nJean noticed that a strange characteristic of his life didn't change after his \"death\". Every time he enters battle, a crimson fury takes over his senses and guides him through the conflict. He thought of it as a stronger survival instinct than most.\nDuring their centuries of partnership, Montrovant and le Duc have come to an agreement of sorts. Jean will help his [Glossary('Sire','game_concept_Sire_desc')] until the Grail is found then will go on his own way. He has thus redoubled his efforts to help Montrovant, almost tasting the immortality of freedom he so desires...\nFuture fate in Canon\n ...which will never happen. As Kli Kodesh ran circles around Montrovant's quest for the Grail, le Duc will die an inglorious death at the blade of one of Kodesh's traps during the fall of the last templars in 1511."
 POD_investigate.desc.792123: "A severely crippled young girl of Jerusalem, Hannah was $pod_Embraced$ by the city's Nosferatu as an act of mercy to bring her relief. Very much to their surprise however, Hannah is not entirely filled with gratitude at her new state. She had a hard, bad life, full of abuse and torment, and she resents the thought that watchers in the shadow could have helped earlier but did not. She also feels that this sense of mercy should be spread far and wide. However, she also fears what “justice” Kothar, the elder of the Nosferatu community, might serve should she sire childer of her own.\nHannah considers herself at least partway outside the leper community. She was never one herself, and retains much of the prevailing superstitious dread of leprosy even though intellectually she understands it holds no peril for her. So she spends very little time in Hinnom, preferring to mingle with the beggars and paupers she once counted herself among.\nHannah has an exhaustive understanding of the lower classes in Jerusalem. She’s also got an ever-growing depth and breadth of insight into the Cainite population of the area. Once she began encountering vampires beyond Kothar’s circle, she supplemented overt encounters with spying, and she’s good at it. She hasn’t penetrated any of the deeper, inner machinations of the elders, but she usually knows at least as much or more about what childer are up to than their sires do.\n\nFuture fate in Canon\nHannah’s conflicting impulses remain unresolved for a while. Finally, early in the 14th century, she decides that she’d benefit from time away, to resolve her conflict by herself. She heads off into the East. That’s the last the Jerusalem vampires see of her. From time to time over the next eighty years she sends messages back, carried by other vampires, ghouls or other messengers. But the last one comes in 1399. After that, it’s silence."
 POD_investigate.desc.792121: "Jeanette was born to a merchant family in Avignon in 1125. She was a fey child, living much of the time in her own fantasy world and given to disturbingly wild inspirations of insight which were more often true than not.\nA loving husband and a charming daughter managed to keep her centered on this world until one night she had a vision of her daughter's death which came to pass a couple days later. Jeanette lost her mind — or more precisely, she lost half of her mind. Unable to reconcile herself to the loss of her child, a portion of her existence is now spent returning to the fanciful existence of her childhood.\nNeither “child” nor “adult” Jeanette remembers the details of the $pod_Embrace$\n.It was her “child” however, who decided that it would be exciting to wander south with the pilgrims heading to the recaptured Holy Land. They seemed like an interesting and exciting band after all.\nTravelling with a Ravnos band for a while, Jeanette honed her skills as a seer, relying on her intuition and her own perception of reality more and more. She chose to stay in Jerusalem when they finally arrived.\nThough she has come to some understanding of her Cainite nature, Jeanette also privately still hopes for redemption. The City of Holies still may hold the blessings that free her — and the youth — from the curse of Caine, allowing them to live again and return to a normal existence.\n\nFuture fate in Canon\nJeanette will become a casualty of Jerusalem's political games that she had no understanding of. Her Final Death will simply be another move in the Great Game."
 POD_investigate.desc.792120: "Bernardus always seems lost and confused. At some point in his past, he did join a group of monastic Christians, and he does know that he is affiliated with the Church. It seems unlikely, however, that the Church chooses to be affiliated any longer with Brother Bernardus. He was driven out of the monastery after losing his temper — in spite of numerous reprimands — and shrieking at his brother monks when they were not sufficiently penitent for sins he decided they had committed.\nBrother Bernardus is, nonetheless, deeply spiritual in his own peculiar way. He believes that the Holy Spirit has blessed him with the gift of tongues, or glossolalia, so that he can speak with the language comprehensible to all others of God’s children. His “gift” also drives him to preach (not always in a language understandable to mere mortals) in an attempt to convert unbelievers to the True Faith.\nIn his feeble attempt at coherent thought, Bernardus concludes that he must save the souls of the unbelievers, lest they fall prey to a Cainite’s feeding. It seems to escape his attention, however, that he is the Cainite who most endangers his listeners. Unfortunately, Bernardus tends to lose his temper with those who do not understand how very important it is that their souls be saved.\n\nFuture fate in Canon\nBrother Bernardus never regains his sanity, nor does he ever achieve any kind of balance between the competing demands his psyche places upon him. He is eventually destroyed, several centuries down the road, by a couple of Ravnos who are tired of him spooking the horses."
 POD_investigate.desc.792119: "Pacifico is from the most powerful family in a very small town outside of Rome, close enough to know about the political maneuverings of the city, but too far away to actually play a role in it. Shortly after Pacifico’s father died, the young man found himself first admired and then $pod_Embraced$ by Paliuro, when the former began a bold move to vastly increase his family’s holdings.\nPacifico Grillati has been set to a task that he finds somewhat demeaning: he passes his time as a translator in the al-Bismaristan al-Salahi Hospital in the Tanner’s Quarter, gathering information and providing the occasional safe haven to feed for other $pod_cainites$. He drives a clever and shrewd bargain with those in need, but also understands that many have long memories and honor that will not forget a ‘favor.’ However, he is beginning to resent being kept away from the main action of Cainite city politics, and sees his ambitions as frustrated by Paliuro’s single-mindedness.\n\nFuture fate in Canon\nPacifico thinks he will have sufficient political strength to tackle the Lasombra power structure in Jerusalem in, oh, seventy or ninety years. In fact, he returns to Genoa after Paliuro’s demise, eventually entering the Sabbat and falling during that sect’s civil war."
 POD_investigate.desc.792930: "帕布拉卡尔是城中少数属于这个罕见阶级的成员之一，尽力确保一切顺利进行。虽然檀那婆的奇术可以洞察轮回并判断目标的业力之路，唯有帕布拉卡尔对观者魂健术的精通才能揭示并消除奇术范围之外的威胁。作为一位虔诚的印度教徒，帕布拉卡尔始终对他的祖尊罗德里尔的基督教情结和对檀那婆缺乏尊重感到不安。"
 POD_investigate.desc.792769: "新生儿对恶魔来说是一种冒犯。他们对善恶一无所知，因此无法被引诱并堕落。许多恶魔会被婴儿的哭声驱逐，但有些恶魔，比如“无声人”，更倾向于采取直接的方式。据记载，普鲁图早在巴比伦时期便已被提到，堪称父母的噩梦。被婴儿的哭声吸引而来，这只恶魔化为迷雾，缓缓将婴儿窒息。一些恶魔可能会认为死亡的孩子是一种浪费（因为他们的灵魂会回归天堂），但普鲁图对此毫不在意。父母的愤怒与绝望足以弥补这一点。\n有人猜测，正是父母自己引来了普鲁图。哭泣的婴儿成为负担，而恶魔则来“解决”问题。自然地，一个曾在心里希望孩子安静下来的父母，在孩子死后便会在悲痛中平添一份愧疚。于是，普鲁图同时杀死了孩子与父母——直接杀害孩子，而父母则因缓慢的痛苦而死去。\n还有什么是比这更让恶魔向往的呢？"
 POD_investigate.desc.793064: "A successful bandit of the Anatolian mountains, Iskender only truly found a purpose and a direction for his life when he met his future [Glossary('Sire','game_concept_Sire_desc')] who taught him about the meaning of his existence as told in ancient Mayaparisatya teachings. Iskender proved to be a talented pupil and enjoyed a deep connection with his Sire until she was killed by one of her rivals. Resorting to his old tactics, Iskender seduced and deceived said rival before killing her in revenge.\nMoving to Constantinople with his band of (mostly) redeemed outlaws, Iskender entered the service of Verpus Sauzezh, leader of the scouts for the immortals of this powerful city. He was away when the Fourth Crusade doomed the city and joined Verpus to protect the refugees from Constantinople as they looked for a new home. After several years of failing to find a new cause, the refugees started the long journey towards France. Verpus left at this moment however, leaving Iskender as the chief guardian of this large group.\nThanks to his diligence and the help of his band, the caravan arrived at Paris without too much trouble. This is where he met Zoe, a fellow Ravnos lost to a dream of vengeance against the Inquisitor who killed her [Glossary('Sire','game_concept_Sire_desc')]. Understanding very well her plea, Iskender grew closer to Zoe until they became lovers and joined her quest.\nThis ultimately was his downfall as the ambush he and his band sprung on the inquisitors turned against them, ending with him being beheaded but managing to save Zoe."
 POD_investigate.desc.791430: "A Malkavian oracle of consideration reputation, Takhoui was active in Greece as the 4th Crusade struck. Like many others, she decided to leave the area and choose to follow members of the Cainite Heresy as they flew towards France. Takhoui soon adopted their faith as she thought her visions were encouraging her to do. In truth, many people think Takhoui is a skilled oracle... but a bad interpreter of her own visions. She is known to change allegiances quickly depending on them.\nDuring her travels towards France, Takhoui became a convinced zealot of the Heresy, going as far as threatening other refugees to convert and almost killing Anatole and Zoe, the former of which being a friend before her latest conversion.\nIn the end, Takhoui will see first hand that her visions were false (or rather misinterpreted) when Anatole debate the Heretic bishop St. Lys literally to death in Notre Dame. Apologizing for her actions beforehand, she then left France once more."
 POD_investigate.desc.791792: "The only one postulant who ever turned the Red Order down is known as Fridebraht von Graft. He gave only one explanation: “God has granted me greater wisdom than you offer.” Two days after the rejection, in May of 1225, the Eye assigned to watch him lost track of him entirely. She frantically asked questions of known friends and acquaintances and discovered that few of them even remembered him. In the end, she abandoned the attempt and reported what had occurred to her superior.\nIt was two years before the errant postulant reappeared. He rescued Sister Vittoria Santini di Parma from an assault by practitioners of the Malefic Arts, through a display of what appeared to be a variant on the Holy Arts. He has reappeared several times since, sometimes in company, sometimes alone, each time aiding a Theodosian (and once a Knight of Acre) in a moment of dire need. What exactly he knows about the Inquisition and why he seems so keen on rescuing its agents remains a mystery.\nWhatever the case, he is considered a very skilled hunter and a staunch ally of the Inquisitors, though one who likely has secrets to hide."
 POD_investigate.desc.793089: "As expected with her reputation of fostering close ties with humanity, Veronique d'Orleans used many ghouls servants during her tenure as an ambassador for Julia Antasia in Paris. She more specifically ran a bathhouse where she sheltered young women looking for a place to belong. Such a place obviously drew a lot of attention and needed protection which Veronique found in the young Sandrin.\nThis prospective knight soon served as the muscle for Veronique's girls and as a bodyguard for the Brujah herself though both knew that she didn't really need such help. As with most of Veronique's entourage, Sandrin took a deep liking to his mistress but was worried with her often too trusting attitude. His worries would prove correct during the palace coup against Alexander where Veronique's bathhouse was burned to the ground by her supposed friend Jean-Baptiste de Montrond. As he was with Veronique at the time, Sandrin was the only one of her ghouls to survive this betrayal.\nHe then followed her during the resolution of the coup, only leaving her side when she ordered him to do so before she confronted Saviarre. While he understood that it was for his own protection, Sandrin still participated in the events by helping Geoffrey's knights secure Paris. After success was finally achieved, he was reunited with a visibly very relieved to see him alive Veronique."
 POD_investigate.desc.791831: "Isouda's favorite male childe is the gallant Josselin de Poitiers. This French knight embodies everything one would expect from a Toreador gallant, loyalty, bravery and being easily distracted by matters of the heart. Josselin started his ambassador career in Esclarmonde's court where he met Aimeric de Cabaret, starting a fiery but ultimately doomed romance between the two. It is also where he $pod_Embraced$ his only childe, Lucien de Troyes, that ended up embroiled in a Tremere plot against Jürgen von Verden.\nJosselin true (platonic) love is for his blood sister, Rosamund d'Islington, who he ended up serving as a champion during her tenure at Alexander of Paris' court. When the exiled Prince abducted Rosamund and came to Germany, Josselin was instrumental in protecting her from the methuselah's worst tendencies despite the massive power gap between them.\nIn Magdeburg, Josselin illustrated himself as a competent champion and confidant for his blood sister, he also participated in the second Tzimisce war where he lost his beloved ghoul squire Fabien during the fighting. Another tragedy happened when he was reunited with his childe Lucien and forced to execute him as part of Alexander's petty revenge against his interference which left a deep scar on his mind.\n\nFuture fate in Canon\nJosselin will stay by Rosamund's side until Alexander's death. Reporting to Isouda's the events that transpired in Germany, he will then go back to his blood sister's side, staying as ever the loyal and gallant knight."
 POD_investigate.desc.792019: "The Savages are a group of undead knights who no longer adhere to the rules of chivalry or codes of knightly conduct. Instead, they form nomadic bands that travel from village to village, taking whatever strikes their fancy and punishing anyone who dares to suggest that a given cauldron/ornate gold cross/young woman isn’t theirs for the taking. Most of the Woodwose Savages take particular delight in tormenting any mortal knights that they come upon, and they often challenge knights to tests of strength or courage. Usually, public humiliation is enough to content them, although in a few cases the Cainite in question wasn’t satisfied with anything less than taking a “souvenir” such as the knight’s armor, horse or sword hand.\nThe Savages currently have one female member, an Iberian Brujah named Urraca. Of all of the Savages, she is the most boisterous, argumentative and assertive. Although she was not a knight during her lifetime (obviously), she lost her entire family in the First Crusade, and she and her fellow Savages deal cruelly with anyone who dares to suggest that she has not earned her place in the group."
 POD_investigate.desc.791405: "$pod_Embraced$ in the midst of the bloody battle with the Muslims when he was only eighteen, Felipe is the closest thing to a leader the Lions of Rodrigo have. It isn’t intelligence or tactical skill that causes the other Lions to follow his lead, but rather his mindless fanaticism and taste for blood. This attitude is what attracted Pelayo, the founder of the Lions, to the young warrior. Empowered by his Embrace, Felipe has become even more manic and aggressive over the years, especially following Pelayo’s death at the hands of the powerful Muslim Gangrel Shabaqo the Nubian outside Madrid in 1135. Having already diablerized older $pod_cainites$, Felipe is more powerful in blood than many elders realize and is looking forward to sating his taste for the $pod_vitae$ of other Cainites in the battles to come."
 POD_investigate.desc.791755: "The Knights of Avalon are led by the Norman Sir Godfrey d’Auffay, who never considered himself an idealist when he breathed. Knighthood to him was a means to an end, a road by which a younger son could attain wealth and a name for himself. Alas, his $pod_Embrace$ in the mid-12th century changed his circumstances drastically.\nSeeking to control his own bestial impulses, he learned that neither struggling to exist in the wild, nor seeking refuge in holy orders, offered him peace; instead he found his answer in the songs of the troubadours. Taking as his guide the epic Chanson de Roland and the Historia regum Britanniae, he proposed an order of Cainite knighthood to Mithras in London. Though some other members of the court scoffed — there were already Cainite Orders for knights, though none likely to accept a Gangrel — the prince did not. Mithras approved the order, naming it the Order of the Knights of Avalon, and charging it with the slaying of monsters wherever they might be found.\nAfter several missions in Britannia, Godfrey answered the call for help from the Norman Cainites to push back the pagan Alliance de l'Orme. While he is genuinely believing in this cause, he also wants to take the opportunity to increase his order's influence in his birthplace in the process."
 POD_investigate.desc.505100: "Joachim was born to war. His father was a career mercenary, and he was raised in the company of fighting men. As a boy, he sharpened blades, fletched arrows, and otherwise learned fitting crafts for one who would one day live and, in all likelihood die, by the sword. It was, by his own account, a good life for a simple boy of no great means.\nHe took to the life with earnest passion, neither a bad warrior nor an excellent one. It could not be said that Joachim enjoyed killing, for he was not a cruel or hurtful young man; instead, he saw himself as a craftsman whose medium was war. It was ignorance, and not active malice, that made of him a killer.\nIt was in the shadow of a fortress that no longer stands that Joachim lost his life. His heart was pierced by a stray arrow and what strength he had quickly fled him.\nRebekah could never adequately answer for Joachim why she had chosen him of all the fallen on that battlefield. He would never receive an answer and, truth be told, cared precious little.\nJoachim quickly learned of the cause of Saulot’s demise and turned his fury upon the usurping Tremere. Though it did not bring him any sense of fulfillment, such violence at least gave him direction. Sadly, he watched many of his kin fall to their own anger, losing themselves to the Beast. At last, Rebekah herself broke, transformed into a ravening monster. For the first time in his existence, Joachim knew what needed to be done. He hunted down his own [Glossary('Sire','game_concept_Sire_desc')] and when he found her, a farm girl broken and bloodless in her arms, he struck her down.\nThat night, Joachim abandoned the blood-feud against the Tremere. Over the years since then, he has gathered those Prodigals who, like him, feel that the House of Caine must be kept in order. Joachim remains the spiritual head of the Twilight Order, though only a very few knights even know of him now. All told, he is happier with things being that way, for he knows that the Order will survive him when at last the Usurpers come to finish the bloody work they started."
 POD_investigate.desc.791827: "Salianna's spymaster is her only confidant and perhaps the only $pod_cainite$ she truly trusts. This noble knight was once a ghoul serving under the Ventrue until, for unknown reasons, he betrayed them for the Toreador. Rewarded with the $pod_Embrace$, Antoine considers Salianna to be an incarnation of Toreador perfection and the future of the $pod_clan$.\nFirst working to create a spy network that now reaches from London to Magdeburg, Antoine has more recently taken the leadership of the Vigiles Francia, ostensibly a military order dedicated to protect Toreador interests but in truth only serving Salianna. With this new asset, he hopes that Salianna will be able to get rid of Geoffrey, preferably in a slow and painful fashion and with him by her side."
 POD_investigate.desc.791870: "The Knights Hospitaler have close ties with certain Toreadors. Unbenownst to all but a select few mortals, the powerful Toreador Alphonse des Rosiers sponsors a secret sub-order within the Hospitalers, the Knights of the Sable Rose. A group of highly accomplished ghouls make up this inner clique, and they are loosely tied to a wholly vampiric Brotherhood of the Sable Rose based in Flanders. Both of those work under the Church of Caine (or \"Cainite Heresy\") overall leadership.\nAlphonse fears that other Cainites have taken an interest in the Hospitalers. Indeed, in 1158, the talented Grand Master de Puy vanished mysteriously from Verona, during a tour of Europe on which he was warmly received by numerous heads of state and lavished with gifts. Des Rosiers used all his resources to find the vanished Grand Master, convinced the Lasombra side of the Cainite Heresy had \"recruited\" him, but never did.\nThe recent slow collapse of the Church of Caine's influence has been noted by Alphonse who is now pondering if this sinking ship is worth dying for or not."
 POD_investigate.desc.790293: "Carel vanden Driessche is the current Grand Master of the Brotherhood of the Sable Rose, the militant order of the Cainite Heresy that has infiltrated the Knights Hospitaler. He inherited this responsibility when the previous leader (and founder of the order) Andrew departed to the Holy Land to try to salvage what is left of the Church of Caine's influence there.\nA skilled politician and warrior, he has forged careful alliances with some Toreadors of Islamic stock and, through them, with members of the vizier caste of Assamites. This has hardly made for peace between Muslim and Hospitaler, but it has helped keep the most militant Assamites from focusing their attention on the Brotherhood or the order as a whole. If the Hospitalers ever realize the extent to which the secret knights in their midst have altered the course of their battles, it is difficult to predict whether they will be pleased or infuriated.\nCarel himself resides in the duchy of Brabant where he wields a considerable amount of influence which he uses to prepare for the now inevitable collapse of the Church of Caine.\n\nFuture fate in Canon\nThese preparations will bore fruit in the 13th century when the Templars' possessions will be confiscated and given to the Hospitalers, greatly strengthening Carel's wealth and power in the process."
 POD_investigate.desc.791919: "Named after the Occitan knights displaced by the French crusaders, the Faydits are the sword arm of Esclarmonde, wearing a bloody surcoat and an Occitan Golden Cross on their tabard to represent their dedication to avenging their land. They are mostly Toreador but a few Aragonese Lasombra and some Brujah joined them.\nUncommonly for a knightly (even $pod_cainite$) order, the Faydits are lead by two women, Bellisenda and Ermisenda. Nicknamed \"harpies of the battlefield\", they are as merciless as their mythological counterparts."
 POD_investigate.desc.791920: "Named after the Occitan knights displaced by the French crusaders, the Faydits are the sword arm of Esclarmonde, wearing a bloody surcoat and an Occitan Golden Cross on their tabard to represent their dedication to avenging their land. They are mostly Toreador but a few Aragonese Lasombra and some Brujah joined them.\nUncommonly for a knightly (even $pod_cainite$) order, the Faydits are lead by two women, Bellisenda and Ermisenda. Nicknamed \"harpies of the battlefield\", they are as merciless as their mythological counterparts."
 POD_investigate.desc.791953: "The order of Chanticleer is comprised of zealous demon-hunters and slayers of Baali. Many vampires of different clans have set aside their differences and joined this order in their passion to rid the earth of demonic taint. These knights often alienate other Cainites with their aggressively violent piety. In Europe, the Order of Chanticleer is trapped in limbo, torn between their goal and the desires of a few Toreador elders not happy to see their accomplices in hedonism persecuted. Infernal occultists have managed to identify and destroy knights while they were helplessly enmeshed in the snares of clan politics.\nOne of the members of the Order of Chanticleer, Edythe Swift, has so angered elders throughout England with her outspoken criticism of what they consider wise restraint that they have declared a blood hunt against her. Edythe truly has been a thorn in the side of many Cainites, and it seems likely that at least some will respond to the call. It remains to be seen whether the order will close ranks around her or even if other vampiric orders will come to her aid. This blood hunt has the potential to become a political disaster entangling knights of many different clans, especially if Edythe refuses to disappear quietly."
 POD_investigate.desc.791900: "A poet, warrior and shrewd politician, Guillaume des Epines leads the military order that was created in the early 10th century to push back the Muslim invasion. This threat being long gone has allowed Guillaume to mold his Centurie into a political tool to help his (considerable) ambitions. The first step was his conquest of Aix where he is now Prince (although he mostly still roams with his Centurie instead of staying put) but Guillaume has much bigger ambitions.\nThe true prize is Toulouse and Occitania as a whole. While Guillaume couldn't care less about the \"courts of love\", he is playing the political game, allying Salianna and Francois d'Alencourt to strengthen his claim, while also trying to back Esclarmonde into a corner, perhaps forcing her into a political marriage with him. He is just waiting for the right time to strike.\n\nFuture fate in Canon\nSaid time will come in 1244 with the fall of the last Cathar stronghold in Montsegur where the Centurie will play a critical role. Emboldened by this victory, Guillaume will march on Toulouse to claim \"his\" prize but will fall short. Esclarmonde will skillfully sideline him and a bitter Guillaume will retreat back to Aix to plot his revenge against his rival."
 POD_investigate.desc.791952: "William Grey, an English Toreador who followed the First Crusade, claims he received a vision of the Virgin Mary, Queen of Heaven, while traveling through Syria. Taking the apparition to heart, he founded the Fellowship of our Lady dedicated to the Virgin and gave it the mission to protect and assist women. He and his fellows believe their holy task will eventually free them from vampiric taint. The Fellows wear the mark of the white lily but are seldom met with.\nGrey not only carefully scrutinizes the character of those who seek to join the Fellowship, he refuses even to consider any who were not knighted as mortals. He has even gone so far as to reject those he thought were elevated for unworthy reasons. Grey places humans above Cainites in almost all things, and this policy has stirred up no small amount of rancor among more traditional vampires.\nGrey and Ogier Fouinon, the Ventrue prince of Avignon, have had a bitter falling-out. Some suspect that the dispute arose over the ramifications of Countess Saviarre’s potential patronage of or affiliation with the order. Others claim that Grey, in his blithe disregard for politics and diplomacy, declined to admit to the order a knight favored by Fouinon. As a result of the feud, the Fellowship’s name has been besmirched by accusations of heresy, which conveniently tie in to the decline of Marianism in the mortal world."
 POD_investigate.desc.791841: "Count Humbert maintains the first of the order of the Bitter Ashes’ Provençal strongholds but was born a commoner. A Gatherer using the name Montferrat rescued Humbert from the wilds after a deranged Gangrel $pod_Embraced$ him shortly before the First Crusade. Montferrat had been studying the Dideaux family’s collection of paintings of the saints, some of which contain symbolic clues to the saints’ graves. The Gatherer helped Humbert understand his new condition and arranged a new identity for the young vampire. The last of the Dideaux had died in a plague, and their name became Humbert’s.\nThe order came into being not very much later, and Humbert volunteered his services to maintain his acquired castle. Humbert, raised on the estate, knew how to oversee renovation and maintenance. The Gatherers gladly accepted his offer and used their network to add to the pedigree of the Dideaux family, giving it a chain of false genealogies and other documentation running back to Charlemagne. They also circulated the tale of a terrible family curse: Only one of the male lineage may inhabit the castle at a time. When it becomes time to replace one identity with another, Humbert goes off and returns as his own heir.\nAs times became more desperate and the Albigensian Crusade ended up with his castle going up in flames, Humbert fleed to Scotland and took the Grail Embrace. Despite this success, Humbert is still struggling with his condition as a Cainite and the loss of his estate added on to that growing melancholia.\n\nFuture fate in Canon\nAs a Grail Knight, he will watch the rise of the Inquisition and finally surrenders to the Sun in the 14th century."
 POD_investigate.desc.791955: "Khentik-Khert was a young man when Akhenaton took the throne, and the Gatherers quickly accepted the new teachings of Aton as the sole god. His [Glossary('Sire','game_concept_Sire_desc')] was a Brujah embittered by lifetimes of struggle in an ideological battle he never explained fully to Khentik-Khert. He knows only that his $pod_Embrace$ was a sort of desperate move, a test to see whether he could retain his fundamental good cheer as a vampire. His sire said that he would continue to watch his childe and act to reward or destroy Khentik-Khert once the sire felt the issue of vampiric optimism had been settled. Khentik-Khert has never seen his sire since.\nKhentik-Khert has been fascinated by Jewish thought ever since the Exodus and diligently studies developments in Christian theology; for him, the Sun remains fundamental, and he treats new insights as further clues to Aton’s plans. Khentik-Khert believes he’s retained his good cheer but worries that he may yet prove unsatisfactory to his sire. The order is in part a way of earning more merit in the eyes of that unseen watcher.\nThe Egyptian travels pilgrimage routes, talking with pilgrims about their motives for going to holy sites. He listens in particular for tales involving holy artifacts. In his guise as an earnest young man seeking signs of God’s presence, he gathers information about where relics worth protecting now lie, then passes the necessary details on to relic-harvesting Grail Knights. Khentik-Khert was an early advocate of the idea of founding the order and gives it his enthusiastic support."
 POD_investigate.desc.791999: "吕西安是一位富有魅力的诺曼青年，带着浓重的法语口音。他无法忍受任何缺乏品味的装束，也绝不购买劣质衣物。他是天国之路的追随者，也是怨烬骑士团的准成员。\n吕西安并非最勤勉的准成员，他最近被英格兰上演的一出名为《叛逆天使的堕落》的新剧所吸引。该剧参考了《以赛亚书》、《启示录》和《路加福音》的篇章，将路西法的堕落解读为内心骄傲的结果，导致他及其麾下的天使们在没有被逐出天堂的情况下便自发堕落。舞台设计上方为天堂与上帝的宝座，下方则是人间与地狱。\n由于剧本原本就是从法语翻译而来的，吕西安打算修改剧中上帝与路西法之间对话的某些部分。在他的改动中，上帝将放逐“所有该隐的子嗣，并将他们归于你（路西法）的一方”；而路西法则会宣称：“吾不收纳此类人，因那些寻求汝之名号者，必将再次重获汝之圣洁并再次侍奉汝，凡被打上怨烬烙印者，终将寻得汝之怜悯……”如果这些台词在未来的演出中被原封不动地流传下去，恐怕将很难从文本中被彻底清除。\n如果计划成功，吕西安希望这一策动能让他的教团在流行观念中被视为唯一值得救赎的该隐子嗣。"
 POD_investigate.desc.793093: "彼得在成为罗莎蒙的管家之前曾是一名僧侣。他因精于计算、忠诚且尽职尽责而被选中。这位僧侣很快适应了新生活，并与罗莎蒙的侍女玛杰里坠入爱河。然而，这段关系由于玛杰里曾沦落风尘，而彼得仍想恪守包括守贞在内的僧侣戒律而变得错综复杂。\n在罗莎蒙被巴黎的亚历山大强行流放期间，他们一直追随着她。亚历山大很快便从折磨罗莎蒙的家仆中寻得了一种变态的快感：他强迫玛杰里侍寝，随后施展支配术控制彼得，令其产生被背叛的幻觉，从而永远地玷污了他们之间的关系。\n玛杰里最终选择了自尽。随着术法解除，彼得意识到自己曾对她说过那些伤人的话，并陷入了深深的自责。亚历山大并未就此罢休，他变本加厉地强行施展支配术，从彼得口中榨取了罗莎蒙的所有秘密，彻底摧毁了他的神智。\n彼得沦为了一个精神崩溃的空壳，由幸存的随从和罗莎蒙本人照料。由于亚历山大对他失去了兴趣，他得以缓慢地恢复神智。尽管罗莎蒙坚持让他继续疗养，但他仍坚持回到岗位，继续为她效力。"
 POD_investigate.desc.793090: "An unremarkable French $pod_cainite$ knight stationed in Paris when Geoffrey's coup against Alexander took place, Marques made the choice to stay by the Prince's childe, Olivier, as the events were going down. This made him one of the very few vampires to willingly accompany Alexander in his exile.\nAs they entered Germany and received the news that Hardestadt wouldn't help them, Alexander killed Oliver in a fit of rage, leaving him with only Marques as a potential lieutenant. Now blood bonded (and thus protected) by his new liege, he soon proved to be judgmental, of poor temperament and lacking in useful skills besides flattery.\nWhen Alexander arrived in Magdeburg, he was made Prince of Finsterbach as part of the arrangement between his liege and Jürgen von Verden, though the title was purely ceremonial in nature. He then accompanied Alexander to the second Tzimisce war, though staying mostly away from the battlefield. He is also took part in the ambush that killed Renaud, the late Oliver's ghoul, because he chose to give his allegiance to Jürgen instead of Alexander after his master's death.\n\nFuture fate in Canon\nMarques will accompany Alexander during the campaign against the Ferals of Livonia. Early on the war, he will sate his bloodlust on innocent farmers before being confronted by Whilhelmina. Despite being nine against her, they will lose and he will end up captured. Qarakh will let him go free at the condition that he could escape him while having a lead on horseback.\nHe couldn't."
 POD_investigate.desc.791746: "Simpkin Cotter was a London boy like a thousand others, growing up in a large family, many of whom didn’t survive childhood. As he reached manhood, he had to choose between apprenticeship and poverty and wisely went for the former. He spent the next two years of his life in his master’s carpentry shop or the local chapel. Perhaps it was the skill of the local preacher, or perhaps it was the profession that Jesus and Simpkin shared — carpentry — that awakened the lad’s faith.\nUncovering a corrupt priest not long after, Simpkin was noticed by the local inquisitors. Simpkin spent the next six months of his life learning how to read and write English and Latin, while also learning the mechanisms of the Shadow Inquisition. He proved a quick learner and an able spy. By Easter the following year, he was back on the streets of London, in the pay of the Inquisition. He was serving God, and he was happy.\nBy 1215, Cotter was approaching middle age and had become the Inquisition’s most senior spy in London. The transition to serving the Oculi Dei made little difference in his life until the day the London chapter-house was destroyed in an hour of violence and blood. Simpkin was the first to find the bodies and the last to visit the house after it was emptied. The experience has given the quiet man a harder edge and an absolute loyalty to the Inquisition. Many of his fellows underestimate him because of his lowly background, especially the Normans. Simpkin doesn’t mind: It’s his information that’s important, not his self-esteem. After all, isn’t pride a sin?"
 POD_investigate.desc.791304: "Born to a North African merchant, Akuji was an adventurous child that loathed her planned future as a married woman. Before it could happen, she hid herself in a traveling caravan and was soon noticed by its owner, Seje, who quickly made use of her uncanny ability as a storyteller to entice potential customers. Another trader became jealous of Seje's sudden success and ended in a scuffle with him. Seje died trying to protect Akuji who fled to Ceuta on her own.\nShe lived here for a while, a pitiful life filled with sorrow, until an European Nosferatu, Kristoff, noticed her. Taking a liking to the crestfallen girl, he made her follow him in his travels in Europe and Akuji found back the joy of discovering new places and tales. After a while and with her permission, he $pod_Embraced$ her.\nKristoff was in fact a courtier of one of Hardestadt's vassals and presented his new childe to the master of the Black Cross' court. This is where Akuji met Jürgen von Verden. The ambitious, reckless but ultimately well meaning Ventrue reminded her of Seje and the two became allies, then trusted friends in the coming century. In 1115, with Kristoff's approval, Akuji became Jürgen's spymistress, a role she has been occupying ever since."
 POD_investigate.desc.791217: "Arngrim is a proud Norman Brujah said to be a descendant from Rollo himself. While the Norman Brujah (including his [Glossary('Sire','game_concept_Sire_desc')] Gudbjorn Hrafnsson) once ruled the region as inheritors of the Vikings, their influence has been slowly reduced by the coming of the Ventrue, Toreador and lately the Tremere. Arngrim first acted on his own against that tide before creating in 1204 a blood pact with the local Gangrel (lead by Runi) at the feet of the Orme tree where Rollo created his realm. Thus the \"Alliance de l'Orme\" was born.\nTheir first victory was a daring attack against Caen where they used the conflict between French and English Ventrue to conquer the city, apparently with the quiet help of the local Nosferatu. Arngrim is now eyeing the city of Bayeux where several seers have located the torpid body of his [Glossary('Sire','game_concept_Sire_desc')]."
 POD_investigate.desc.791218: "Runi was once an outlaw before becoming the informal leader of the Norman Gangrel. Faced with the encroaching of the Ventrue, Toreador and Tremere clans on her land, she accepted the offer of the Brujah Arngrim to create the Alliance de l'Orme. She proved instrumental during the first victory, the conquest of Caen, for this new coalition. This battle was the first time Runi gorged herself on Cainite blood and she took a dangerous liking to it.\nThe truth of Runi's involvement with the situation is more complicated than it seems however. She is a friend of the mage Völuspá who is looking for a magical runic stone stolen by Arngrim's [Glossary('Sire','game_concept_Sire_desc')], Gudbjorn. Runi has thus been leading Arngrim towards his beloved sire's resting place in the hopes of awakening and interrogating him for the location of the artifact.\nShe knows that Völuspá then intent to kill Gudbjorn, Arngrim and their entire lineage after that point, something Runi is still unsure about as this would mean the ultimate triumph of the \"noble\" clans in Normandy."
 POD_investigate.desc.793085: "作为巴力血系三大始祖之一，第三位的名讳与性别始终笼罩在迷雾之中。内尔伽勒与摩洛对其手足的存在讳莫如深，但凡有人提及第三始祖，必会引发二者的暴怒。有传言称第三位是其中一位（或两位）的血脉情人；亦有学者以古代泛神信仰中的雌雄同体神祇为证，声称其实为在血肉熔炉中融合的情侣双生体。\n最主流的假说认为第三始祖为女性，但对其名讳的争论从未止息。部分秘典指认其为洗拉，更有胆大妄言者宣称是夜之魔女 莉莉丝本尊。另有一派认为她本无名者，仅以“老妪”为世人所惧。\n千百年来，数十位僭越者以帕祖祖、阿里曼乃至巴力等神名自封第三始祖，最终皆被揭穿伪貌并湮灭于血火之中。尽管关于这位虚无存在的猜想层出不穷，但某些历史禁忌终归不宜深究——多舌之徒的咽喉往往难逃利刃之吻。\n另一派学说将“第三始祖”与塞克尔的传说相勾连。这位据称是扫罗长子的存在，曾在历史长河中以不同名讳惊鸿一现。有秘闻称她暗中操弄时局（最著者当属睿魔尔氏族的崛起），意图以未知缘由抹除扫罗；另有禁忌抄本记载她与名为谢迪姆的域外实体缔结盟约，妄图征服（或摧毁？）此世。这些相互矛盾的传说真相，恐将永葬于时光墓穴。\n或许，连她自身也早已迷失在永恒的迷雾之中。"
 POD_investigate.desc.791466: "作为驻扎在普鲁士的一名不苟言笑的黑十字骑士，吕迪格只能眼睁睁地看着对利沃尼亚野者的第一次袭击以灾难告终。他亲自向约根·冯·费尔登报告了这一消息，并主动请缨领导下一次战役，但由于政治原因，他很快被迫在流亡的亚历山大亲王手下工作。吕迪格的任务是确保黑十字在利沃尼亚取得胜利，从专业层面上讲，他仍然是那里所有骑士的领袖，但所有人都知道，如果两人发生冲突，亚历山大的年龄和权力将很快取代这一孱弱的权威。\n\n其在原作中的未来命运\n吕迪格和亚历山大的关系会像他担心的那样糟糕，甚至更糟。值得称赞的是，吕迪格会坚守阵地，努力保护他的部下不受亚历山大那冷酷无情的伤害。在第二次利沃尼亚战争中，他将亲自率领部队发起第一次进攻，并在与强大的冈格罗·威廉明娜的决斗中勉强幸存下来。然而，他没能逃过亚历山大对这次失败的不满，在他的骑士们（借助超自然力量）听命与亚历山大之前，他将被流放的亲王处死。"
 POD_investigate.desc.793117: "A man with ambition in life, Rikard felt during his $pod_Embrace$ as if his destiny has come true. Feeling his newfound strength, he was quickly disillusioned to find that he was just one of many vampires and that others could still lord over him even in this new state. He was even more annoyed when his [Glossary('Sire','game_concept_Sire_desc')] tried to teach him how to respect mortals as a good hunter respects the prey. He was however pleased when she was killed by the Christian armies encroaching in Livonia.\nRikard heard of the Ferals of Livonia not long after and hoped to finally find the \"kingdom of the night\" where he could openly rule above weak mortals. He was once again soon disillusioned when he was made to understand that the mortal tribes were to be respected. He now serves as a sentry for the Ferals, a far cry from his dream of vampiric domination.\n\nFuture fate in Canon\nRikard will be found slacking at his post and Qarakh will issue a stern remainder that will have the opposite effect from its motivating intent. Taking advantage of the chaotic war for Livonia, Rikard will let loose his worst tendencies, draining and killing children of the tribe before betraying the Ferals to Alexander. While the exiled Prince will value the knowledge, he won't do the same with the messenger. Stating that a betrayed can never be trusted again, he will offer Rikard to Istvan as a plaything. His death will be slow and painful."
 POD_investigate.desc.791465: "Once a zealous crusader in life, Hermann's fate changed when he was $pod_Embraced$. While his zeal didn't falter, he soon noticed that he could only feed from people that didn't accept Christ as their Lord. This puts him in a conundrum where every conversion he makes, and every pagan he slays, brings him closer to the night where he won't be able to find a suitable prey, something that haunts his dreams. Hermann has come to terms with this situation however and accepted that his ultimate victory, the day where the last infidel perishes or converts, will also be his last moment on this Earth.\nWith this grim outlook, Hermann is reputed as a no nonsense but capable commander of the Black Cross and someone Lucretia and Jurgen depends on when the situation grows dire.\n\nFuture fate in Canon\nAfter the defeat of Alexander in the war for Livonia, Hermann will be selected by Jurgen to escort the second wave of attackers spearheaded by the Tremere. Hermann's relationship with the Tremere will be complicated but his sense of duty will prevail and he will succeed in protecting the magus and helping them deal the final blow to the Telyavelic allies of the Ferals of Livonia."
 POD_investigate.desc.795038: "白虎皇朝曾是一个稳固的堡垒（尽管高度分权），但在范皇后自我放逐后陷入混乱。最终，是达——一位来自华鹤派的回鹘人——成功说服了足够多的西方万鬼支持他继承范氏的地位。\n\n达从来不是谦逊之人。他迅速入驻了一座满是金银财宝的华丽宫殿，身边围绕着阿谀奉承的凡人与不死仆从。这使他难以稳固地掌握权力。\n\n达的政策是铲除地方势力，迫使他们迁往他处。因此，他虽不直接对抗对手，却确保他们在远离权力根基的地方被削弱。他的支持者声称，他不过是在试图为混乱的白虎皇朝建立一个合理的结构。\n然而，他的努力最终失败。掌权不到十年，白虎皇朝便分裂为三个独立的政权。\n\n其在原作中的未来命运\n这次分裂与安答的崛起将标志着白虎皇朝的终结。在现代，其曾经的疆域已脱离万鬼掌控，几乎成为传说中的存在。"
 POD_investigate.desc.793141: "No one has ever seen Ibara-sama's face. This tool of [Glossary('Mikaboshi','podgloss.mikaboshi')] hides itself in the buildings and the streets, watching everywhere at once yet never being anywhere at all. Its power, obviously, lies in the psychological torture of its subjects: everyone is so afraid of its anger that they move about in a constant state of panic and frenzy.\nSouls here whisper that Ibara-sama does not punish anyone, only absorbs them — swallows them up and binds them into the fabric of the [Glossary('Wicked City','podgloss.wickedcity')] of its master without losing their consciousness. If that is the truth, the souls taken by Ibara-sama spend eternity as part of a humming demonic machine, aware of every other soul trapped with them.\nIt is small wonder, then, that this hell is so feared even in the Middle Kingdom."
 POD_investigate.desc.793143: "田本半古是毗沙门最伟大的将军之一，乃是一位传说中拥有非凡智慧与绝强$pod_kueijin$力量的魔虎战士。田本半古深受麾下兵士敬仰，亦被广泛视为日本不死界最强大的守护者。\n然而，真相往往比传闻更加复杂。\n\n其在原作中的未来命运\n1274年，田本半古将率军抵御朝鲜与中国$pod_kueijin$的入侵，终结与大陆青龙皇朝的决裂。随后，他被控与[Glossary('阎魔王','podgloss.yamaking')]艾玛·欧共谋，但却在审判前神秘失踪。\n数十年后，日本不死族得知田本半古竟曾闯入阎魔王的宫殿，亲手夺回了自己被赐予的灵魂。至今，[Glossary('阎魔王','podgloss.yamaking')]仍重金悬赏这位叛逃代理人的消息。\n但无人能得其踪迹，日本至今仍困惑于这位既是护国武神，亦是最大叛徒的传奇人物究竟该被如何评价。"
 POD_investigate.desc.793182: "被誉为革命先驱的部落民既是崇拜者眼中的谜团，也是敌人心中的疑影。他（或她？）的宣言以多种形式流传，伴随繁复神秘的仪式，使其踪迹难以追寻。虽有人自称为部落民，但皆遭到驳斥，引得世人纷纷猜测：部落民或许是阎魔密使，或是隐秘教团的代理人，亦或是为大业护持而降世的菩萨。\n真相或许永远无从得知，因为无人曾真正见过其真容。\n他的著作展现出非凡的智慧与学识，启迪了无数后生从中汲取远见卓识。\n\n其在原作中的未来命运\n部落民将持续保持神秘，却日益壮大影响力。纵观“竹王子”现象，多半可追溯其源头，尽管他本人始终刻意与这场革命中更为激烈的部分保持距离。"
 POD_investigate.desc.793216: "黑様生于平安初期，乃是魔法师刺客家族五剃刀牙家中的一名雷民。虽具卓绝谋略与暗杀之术，却终未攀至权势巅峰，甘心为师，潜心传道。然三名心怀怨恨的弟子反戈一击，背叛于他，令其遭受羞辱且惨痛的死亡。\n于[Glossary('断绝','podgloss.kakuri')]中，黑様得地藏菩萨亲自点化，赐予其转生。复生后的首要之举，便是迅速向那些杀害他的叛徒复仇。\n作为吸血鬼，黑様与凡人无异。其冷峻的性情使他进步神速，但其缺乏野心，注定成为传道授业之师而非领袖。他隐退于大雪山荒野，化身为日本$pod_kueijin$中技艺最精湛刺客的导师。其为人严苛无情，吸取生前惨痛教训，凡不能达成修炼之徒必将被他精准地终结生命，以求减少痛苦。\n\n其在原作中的未来命运\n黑様将成为$pod_kueijin$刺客中最受追捧的导师。虽多持超然立场，淡泊政治，却培养出一众令世人闻风丧胆的日本不死族，其中尤以声名狼藉的伊贺与甲贺家最为著称。"
 POD_investigate.desc.793224: "作为日本$pod_kueijin$中备受敬重的师者，近江曾过着宁静平凡的生活，直至为守护村落而战死于盗匪之手。他复活为不死族后的首要之举，便是以赤手空拳，将那群盗匪血洗殆尽。\n此后，近江谦逊而沉稳地投身于日本午夜政局，言称血欲已尽，心境澄明。身为勤学好问的学子，他乐于涉猎诸般技艺，曾化身乞丐、僧侣乃至医者。然而，他真正的天赋依旧在剑术之道，于是他安坐讲堂，耐心且慈爱地教导那些渴望掌握剑道的学徒。\n\n其在原作中的未来命运\n二十世纪妖魔横行之时，近江名声鹊起，亲自投身狩猎[akuma|E]的行动之中。即便是华夏$pod_kueijin$亦不得不对他在此事上展现出的卓越功绩心存敬意。"
 POD_investigate.desc.793243: "野心勃勃的浅子纪子是日本千面雷宗宗主，其供奉百万诸灵的奢靡横滨神宫正是她攀登至今之高位所赖之助力。庙中日夜宾客不断，会晤频繁，浅子也已无可争议地成为日本最具影响力的超自然调停者。\n她树敌众多，然身后更有无数诸灵、心怀梦想的青年，甚至位高权重的文吏官员予以倚仗。正因如此，许多对手反倒认定她终将自毁于贪婪与野望之中，遂不屑亲手推翻她的地位。\n\n其在原作中的未来命运\n浅子将满怀激情地投入新时代的浪潮之中，成为诸灵与科技世代之间首屈一指的沟通者。她的影响力甚至扩展至日本之外的疆域，令人惊异的是——包括她自己也时而感到不可思议——她仍屹立不倒，种种暗中交易竟迟迟未反噬于身。\n目前为止。"
 POD_investigate.desc.795044: "至黑之夜的领袖、最显赫的毗沙门——三浦康民，或许是当今日本最具政治权势的$pod_kueijin$。表面上，他仍隶属于朝鲜主导的青龙皇朝，然日本早已渐行渐远，而三浦对此态势显然乐见其成。\n不过，近期令他忧心的反而是凡人间的异变。他紧随源赖朝幕府迁至镰仓，已暗中搜寻许久，意欲找出是否有超自然力量介入人间政局。身为上升中的毗沙门，他绝不容许此等秩序外的力量左右大势。至今，他仍成功将此担忧隐藏于幕后，维持着一位掌控全局之领袖的沉稳形象。\n在毗沙门与整个日本的鬼人政治格局中，三浦堪称温和派。他乐见与青龙皇朝的渐行渐远，但并不主张正面冲突——他更倾向于将宝贵资源用于巩固日本自身的$pod_kueijin$体系，使之成为自成一体、引领一方的真正皇朝。\n至于是否建立一个完全由毗沙门主导的日本？三浦完全同意。但他也明白，各大氏家终将在未来的风云中扮演各自的角色。对此，他一如既往地寻求平衡之道——确保毗沙门居于统领之位，但也给其他氏家留下足够的（较次要的）职责和位置。"
 POD_investigate.desc.795053: "Danrin-no-Nukekubi is one of Japan’s greatest mistresses of Flesh Shintai, as well as a profound exponent of the Way of the Resplendent Crane (even though the Nukekubi Clan now practice all orthodox [Glossary('Dharma','podgloss.dharma')]).\nFollowing their founder’s example, all Nukekubi strive to learn the Long-Neck power of Flesh Shintai at the very least. Their affinity for this Discipline is partly known even to mortals, who speak of legendary creatures called Nukekubi who look partly human, but sport impossibly long, flexible, gravity-defying necks. Those who cannot learn Flesh Shintai in their own uji sometimes travel south to the Nukekubi’s demesne in Kyushu and negotiate for tuition.\nThey seek guidance in Danrin-no-Nukekubi’s dictum that Heaven and Hell’s true servant acts without wrath or greed, leaving no trace of her influence. The Nukekubi try accommodating Japan’s metamorphosis, changing sides in the Bishamon-Genji rivalry several times. They do so with their founder's blessing, who appears once every few decades to examine her followers' progress."
 POD_investigate.desc.791111: "历史上最负盛名且备受尊敬的[Glossary('万鬼','game_concept_kuei_jin_desc')]之一，血/学（此为化名，其真名已湮没于历史长河）为迷失的万仙开辟了重返天庭之路。他的传奇旅程与伟大发现被弟子意整理编撰，构成了当今多数[Glossary('万鬼','game_concept_kuei_jin_desc')]正统修行体系——[Glossary('心法','podgloss.dharma')]的基石。\n除意之外，学还教导了数位弟子，他们基于其教诲开创了各自的[Glossary('心法','podgloss.dharma')]流派——唯有一人例外：瞾喇。在某些人眼中，这是血/学生平唯一的败笔（尽管多数指责应归于瞾剌自身），因其未能领悟师尊真谛，最终成为[Glossary('万鬼','game_concept_kuei_jin_desc')]最憎恶的仇敌之一。\n\n无论如何，血/学是首位[Glossary('云开雾散','podgloss.hundredclouds')]的存在，向世人昭示救赎的可能。他的典范与遗产至今仍照耀着黑夜，其意义无论如何强调都不为过。若无这位[Glossary('大罗汉','podgloss.arhat')]提供的道德准绳，饿殍或许早被视作魔物剿灭殆尽——甚至根本不会存续至今。"
 POD_investigate.desc.793238: "现存最古老的$pod_kueijin$之一，“母亲”与血/学生活在同一时代，并聆听过他的教诲。无论是飞鸟掠空的简单景象，还是人际关系的复杂脉络，生命的光辉总能让她顿悟。她迅速成为备受爱戴的导师，尤其因她帮助每位弟子寻找独特道路，而非灌输狭隘教义而闻名。\n这位集威严、优雅与炽烈于一身的导师，倡导着践行、内省与体悟的修行之道。在被称为\"撒种之仪\"的传奇事件中，她倾囊相授所有悟道真谛，确保从不将启迪之秘据为己有。\n千百年来，她始终过着天人合一的生活，周身笼罩着静谧祥和的气场。虽早可飞升云开雾散，却甘愿驻世为众生铺就觉醒之路，直至尘世再无此需。\n\n其在原作中的未来命运\n母亲将永为史上最受尊崇的菩萨。她将批准她最喜欢的门徒黑土郎出征讨伐苏醒的[Glossary('上古耆宿','game_concept_antediluvian_desc')]雷伏诺。\n目睹弟子在这场惊天之战中牺牲将令她痛彻心扉。有人说她因此陷入消沉，亦有人言她正密谋对抗魔皇的终极行动。"
 POD_investigate.desc.793246: "关于千鹤母最受敬重的门徒早期历史所知甚少，仅知他在焚书时期曾是其弟子。有推测认为其名源自（或可能是起源？）某个民间传说。  \n作为强大的存在，黑土童子并非热衷权术之辈，但仍活跃于其[Glossary('心法','podgloss.dharma')]与$pod_kueijin$整体事务中。身为玉神体与阳炁的大成者，他以在战斗中挥舞巨棒闻名——尽管鲜有需要亲自作战之时，其威名已足以震慑四方。  \n\n其在原作中的未来命运：\n玄土童子将成为三位迎战末世的[Glossary('菩萨','podgloss.bodhisattva')]之一，这场末日以[Glossary('上古耆宿','game_concept_antediluvian_desc')]雷伏诺的苏醒为形态。虽将获胜，童子却会消失无踪。有人期望他已在终局前飞升[Glossary('云开雾散','podgloss.hundredclouds')]，亦有人筹备前往黄泉的远征以期解救其于桎梏。"
 POD_investigate.desc.793277: "在秦朝统一六国的前一百年，她曾是一位潜珠采玉的女潜客。后来，这位被称作“恒赴”之人死于一场瘟疫，被丢入倒罪地狱。据传，正是在那里，她首次真正看清了世界的广阔与真貌，从而顿悟。\n她作为$pod_kueijin$归来，自此踏上西行之路，从未回头。一路求学、传道、战斗，她逐渐成为华鹤道中的传奇。每一次她归返中土所带回的片语只言都令诸老祖争论不休。\n但这位菩萨似乎从不在意这些，她始终追随日轮之行，一如往昔。\n\n其在原作中的未来命运：\n恒赴将在末日之际停下脚步——雷伏诺[Glossary('上古耆宿','game_concept_antediluvian_desc')]降临之日。她将与另外两位[Glossary('菩萨','podgloss.bodhisattva')]一同抗劫，阻止了魔物，但三位皆身陨。"
 POD_investigate.desc.793223: "影颂罗汉是一位颇为神秘的存在。她寡言少语，远离政治纷争，似乎只专注于守护那些可能在魔皇崛起时失传的智慧。尽管如此，她仍是当今[Glossary('心法','podgloss.dharma')]造诣最为高深者，而她拒绝踏入云开雾散之境以济世度人的选择，反而赢得了众多[Glossary('万鬼','game_concept_kuei_jin_desc')]的崇敬。\n传说她本是秦朝一位学者的女儿，因骄纵败德而被父亲亲手处决。直到师从庄子研习\"无为\"之道时，她才真正获得顿悟。作为当世最精擅阴气的大师，她偶尔道出的只言片语——往往以谜偈的形式——总能引发数十年的论辩与诠释。\n\n其在原作中的未来命运：\n这位尊者唯一的改变，是逐渐对神秘的该隐子嗣产生兴趣，尤其关注他们当中精通亡灵术的高手。"
 POD_investigate.desc.793222: "The ruler of the Bone Court of Chongqing is among the most celebrated of the Bone Flowers. Gifted with a perfect memory, she was once a simple beggar murdered by a minister who found her too ugly to be on the streets. Returning as a $pod_kueijin$, she took her revenge with patience and coldness, terrorizing and slowly draining the minister of his Chi.\nKu Zu is very conservative. She finds emotions to be an hindrance and only when completely expunged of them can one master the Song of Shadows. The best way to achieve this state is, according to her, pain. Her students soon learn that her methods of instruction are truly difficult to forget.\n\nFuture fate in Canon\nKu Zu will navigate the turn of the Wheel with skill, ensuring that the Bone Court become one of the founding courts of the Quincunx.\nCultivating the Court's isolationism in the centuries to come, she will stay the undisputed political leader of the Song of Shadows and uses the gravitas given by the Bone Library to enshrine her position as one of the most respected (and feared) Chinese $pod_kueijin$."
 POD_investigate.desc.793212: "这位贤者是最受尊崇的魔虎菩萨之一，曾历焚书之劫而不死。他主张尽可能维持凡人王朝的延续，希冀藉由尘世政权的持久与秩序，锻炼出足以抗衡魔皇的世间意志。\n\n其在原作中的未来命运：\n在噩梦之周中，他将与其他两位菩萨一同对抗[Glossary('上古耆宿','game_concept_antediluvian_desc')]雷伏诺。最终他们虽皆战死，却成功阻止了灾厄巨兽的降世。魔虎众传颂其英勇无畏，但也悄然哀悼一位[Glossary('阎魔王','podgloss.yamaking')]之敌的陨落。"
 POD_investigate.desc.793213: "Despite her age and considerable enlightenment, No-Shadow Raven refuses to let her station interferes with the way she carries out her duties. Said to have been a successful courtesan and woman of influence (at least until her torture and execution) in her life, she consistently continues to expand her range of interests.\nSometimes a thief, sometimes the informal leader of the Crimson Tiger Mercantile Cartel, No-Shadow Raven sees the war against the [Glossary('Yama Kings','podgloss.yamaking')] as something that should be expanded to many more forms than just claws and swords. Her constant reinvigorating of herself has made her quite popular among younger $pod_kueijin$ while the older generations wonder if she will ever settle and become a \"proper\" Devil-Tiger.\n\nFuture fate in Canon\nTo their disappointment, she won't. From stealing and using chemical warfare against the agents of the [Glossary('Yama Kings','podgloss.yamaking')] to bankrupting their operations in a boardroom, No-Shadow Raven will stay the same. She won't even truly realize that she is becoming more enlightened after each of her new fancies put a dent in the [Glossary('Yama Kings','podgloss.yamaking')]' agenda."
 POD_investigate.desc.793139: "据说，最初的[Glossary('阎魔王','podgloss.yamaking')]之一——廖初功（学者们称之为“游暗”）曾向其他[Glossary('阎魔王','podgloss.yamaking')]揭示了吞噬腐化之气的秘密，以此换取在中原的庞大权柄。起初，廖初功沉醉于新盟友赐予的力量，但在漫长岁月中躲避旧主设下的陷阱与折磨，令他变得满怀怨恨、一心复仇。\n\n他知晓天庭对[Glossary('阎魔王','podgloss.yamaking')]的嘱托，也目睹了他们如何逾越界限，因此寻求将[Glossary('阎魔王','podgloss.yamaking')]彻底逐出中原之法。这位“游暗”会抓住一切机会破坏任何[Glossary('阎魔王','podgloss.yamaking')]的谋划，并以此为乐。"
 POD_investigate.desc.791128: "Perhaps the most influential scholar of the Inward Way, Ghumava was an official of the Scarlet Phoenix Court when Chuang-Tzu's philosophy entranced him. His knowledge and oratory skills are legendary and even those not interested in the Inward Way are eager to see and debate him.\nGumava, for his part, is content to accumulate knowledge and opinions about Chuang-Tzu's philosophy, as he thinks he didn't truly grasp the extent of it with access to only the secondary sources he had at the time.\n\nFuture fate in Canon\nGhumava will settle for the life of a scholar until his traumatic discovery of the Spirit Lands. Noticing an increasing demonic activity in this place, he will look for the source of it far and wide.\nWhen no conclusive evidence will turn up and with the demons' numbers increasing, Ghumava will resort to more desperate actions to try to save the Tau.\n\nActions that might have cataclysmic consequences."
 POD_investigate.desc.795045: "As the Ancestor of Kashi for the White Tiger Court, Jiang Shahua has the debatable honor of being the frontier with the world outside of the Middle Kingdom. She chooses to turn a blind eye to dealings with foreign supernaturals as long as they don't endanger the secrets of the $pod_kueijin$, reasoning that she can't realistically police every encounter in her vast city.\nWhile she ostensibly act as a stern judge when the interests of the $pod_kueijin$ are threatened, it is quite possible to bypass her. Jiang Shahua and her court enjoy precious and exotic gifts as much as the next vampire and a suitable offering obviously demonstrates a grasp of culture that can redeem an offender in her eyes.\n\nMore worrying are her dealings in private quarters with a subset of foreign supernaturals, the Wu Zao. Nobody truly knows what happens behind those closed doors, except that Jiang ends up giving her token to allow them to travel to the Middle Kingdom. This has irked emperor Da of the White Tiger Court so much that he thought about recalling Jiang Shahua... but then the civil war happened.\nAs far as the ancestor of Kashi is concerned, this newfound lack of oversight is clearly a sign of the Heaven's favor and so she continues as she always did, keeping the door to the Middle Kingdom much more open than most would like."
 POD_investigate.desc.795036: "One of the most influential man of the Azure Dragon Court is an ex Thrashing Dragon elder that has been creating a new thesis outlined in his book: \"On the True Nature of the Emperor's Curse and the Honorable Return to Power\". Kang's encyclical has a single thesis: the Wan Xian fell from their place of honor not because they dealt with the [Glossary('Yama Kings','podgloss.yamaking')] but because they abused their power over mortals.\nThus, Kang states that the $pod_kueijin$ must openly seize the thrones of mortal kingdoms and return to a wise, benevolent, rule from immortal masters. This righteous action will attract the Heavenly Emperor's attention and, after a proper time to see if they are truly repentant, the curse will be lifted.\nKang is a charismatic speaker and, while he doesn't have many followers yet, he has the tacit support of many western mandarins that see this nascent philosophy as a way to weaken the Azure Dragon Court.\n\nFuture fate in Canon\nKang's movement will die with him, a victim of the Sky Serpent purge during the fall of the Azure Dragon Court."
 POD_investigate.desc.793207: "In her mortal life, the one that will be named Marble Gong was a faithful and dutiful wife, bearing many children to her husband only to die in childbirth. Her husband didn't observe the proper mourning period and quickly took a new wife. Fueled by a mix of anger at her husband but love for her children, Marble Gong found a strength she didn't know she had and fought her way out of Yomi.\nFound by a Thousand Whispers master, she became a diligent student and took her new name. Her first mortal masks were an exhilarating experience, opening worlds of new possibilities that she never knew existed.\n\nAll of that stopped when, as she wore the mask of a Chinese officer, she stumbled upon a dying soldier and learned that he was his grandson from her child that she died in bearing. This was her first moment of enlightenment. Since then she strives to become a force of harmony, peace and balance despite the hardships of the age.\n\nFuture fate in Canon\nMarble Gong will become a renowned messenger, diplomat and force of good in the August Courts. Her most vaunted achievement will be avoiding an all out war between the August Courts and the Beast Courts by shaming the ruling Quincunx for their selfish behavior.\nIn the modern days, she is rumored to be in the Jade Court's territory but who can say for sure? She could be wearing any one of a thousand masks."
 POD_investigate.desc.793171: "The infamous Devil-Tiger Tien Lu was an unknown entity until his sudden arrival in the Jade Court. Despite his savage nature, his strange understanding with Hengeyokai made him a valued member of the court. He was absent often however, apparently taking long trips to better understand his [Glossary('Dharma','podgloss.dharma')]. Many suppose that it was during these times that he fell to the [Glossary('Yama Kings','podgloss.yamaking')].\nTien Lu has been on the move since then, taking part in many seemingly minor conflicts unrelated to the [Glossary('Yama Kings','podgloss.yamaking')].\nFuture fate in Canon\nThe truth will only be revealed much later. Tien Lu was surgically targeting $pod_kueijin$ who knew or have been studying weaknesses of his master, [Glossary('Wu Hua','podgloss.wuhua')], lord of the Pit of Salt and Iron.\nFinally considered a priority target by the Quincunx after masterminding the death of 50 supernaturals during China's first atomic test, Tien Lu will have to flee to his master realm where, at least he hopes, great rewards will await him."
 POD_investigate.desc.793140: "[Glossary('Wu Hua','podgloss.wuhua')], Lord of the Hell of Iron and Salt, entrusts the mechanics of his mines to this cold servant. Zhou-En's origins are unknown, but his current position is made painfully familiar to every soul — and every lesser demon — caught in [Glossary('Wu Hua','podgloss.wuhua')]'s hell.\nDressed in bushi-style armor that resembles the shell of a monstrous beetle, the foreman visits each mine to ensure that progress is being made according to the supreme wishes of [Glossary('Wu Hua','podgloss.wuhua')]. His schedule is never the same and never announced — things must be in good order and peak production at all times, just in case he drops in. Zhou-En's visits are opportunities for demon overseers to offer up the worst of the troublesome souls to a worse fate than they could hand down themselves.\nIn turn, the overseers must be careful not to attract his ire, as Zhou-En is as quick to bind a demon to a rock, flay it and expose it to the salty winds for eternity as he is to use a difficult P'o as a chisel in the mine.\nThe surest way to incur Zhou-En's displeasure to be sloppy or inefficient in one's work, and by the foreman's standards everyone is sloppy and inefficient."
 POD_investigate.desc.795105: "This gaunt demon is one of [Glossary('Tou Mu','podgloss.toumu')]'s most trusted subordinates, if anyone can be said to truly trust anyone else in Yomi. Lo Fan is the embodiment of dour Yin energy. He appears in a male form in balance to [Glossary('Tou Mu','podgloss.toumu')]'s female; his skin is black and his body skeletal.\nIn a realm where imprisoned souls' only shelter comes from forcing or convincing demons to look the other way while they hide from the scouring winds, Lo Fan is mercilessly alert and moves unscathed through the sandstorms to capture and punish the demons who aren't performing their duties properly.\nOf course, this discourages the demons from helping the souls find shelter, which in turn breeds hate among the damned for the lieutenant. Were he ever to show an instant's weakness, the huddled masses of souls he torments would gladly rise up and destroy Hsian Lo Fan.\nHe is careful, as a result, never to show weakness."
 POD_investigate.desc.793145: "Perhaps the most famous Devil-Tiger philosopher, Shan-bo asserts that there is a fundamental flaw in the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')]'s plan for the Wan Xian: They were not created for compromise. As creatures who could not appreciate moderation, it was inevitable that they would discover the ability to drain others of their Chi. And they thus were fated to exploit it. The August Personage of Jade's subsequent punishment was an admission of his own failures and it was for that reason, shame, that he retreated from the Middle Kingdom.\n\nTo no one's surprise, the Courts censured Shan-bo and ordered that he recant his heresy on pain of Final Death. True to his creed, Shan-bo answered that compromise was for weaker creatures and declared that he could no more change his mind than a tree could march across the Gobi desert. With the current decline of the Courts, Shan-bo has been free to continue teaching and preparing his expedition beyond the Wall, where he intends to ask the August Personage of Jade for the truth of the matter.\n\nFuture fate in Canon\nShan-bo will depart for his quest and will never be seen again. His heresy however will survive, remaining surprisingly popular among Devil-Tigers to this night."
 POD_investigate.desc.795039: "在中国，本应最具政治影响力的[Glossary('万鬼','game_concept_kuei_jin_desc')]却出人意料地是一位看似疯癫的千呤道。事实上，作为近乎达到云开雾散境界的存在，王洪本始终处于变化之中，使得悟性不足者难以与之正常交流。尽管他的[Glossary('心法','podgloss.dharma')]修为值得称道，但这种特质让这位“皇帝”难以真正履行帝王之责。\n\n在许年轻不朽者眼中，王洪本并非开悟而是癫狂——但谁又能分辨其中区别？确凿的是，他身边围绕着一群谄媚的朝臣（多为他自己领导的屋室金玉会成员），这些人作为他权力的（拙劣）代理人行使职能。在这种实质性的领导缺位下，黄帝皇朝的治理权已下放至地方朝廷，而后者对如此疏离的统治方式颇为满意。\n\n当前朝廷的主要隐忧在于：其一是河北平原的“武士团”——一个被广泛认为暗中支持金国的女真屋室；其二是临安的“极乐冰刃会”，这个屋室追随南宋朝廷流亡至临安。这两股势力都可能成为僵化的黄帝皇朝内部大规模分裂运动的开端。\n当被问及这些问题时，王洪本从未给出任何（连贯的）答复。\n\n\n其在原作中的未来命运\n1240年代，王洪本被不明刺客暗杀。金玉会的无能成员迅速使局势恶化，黄帝皇朝在其崩塌前就已自行瓦解，最终被安答血系扫入历史尘埃。作为这个曾经最强大的皇朝终结的预兆，许多人将王洪本之死视为纪元之轮转向的标志，这也成为他留下的唯一遗产。"
 POD_investigate.desc.793236: "A seemingly young immortal working from the shadows to maintain the balance in the Korean Courts, Shadow Puppet is an enigma to many. She acts as a spy, messenger and assassin for the ancestors but also seems to strive to maintain her own vision of equilibrium throughout the Azure Dragon Court and beyond.\nDespite having acted against their interests from time to time, no Korean ancestors ever voice displeasure at her actions. If anything, it seems they fear her reputation instead. Always dressing in black and blending with the shadows, her usual modus operandi is to observe matters of concerns then report it to the ancestors. If further action is required, she is known to leave her calling card, a small black cloth puppet, somewhere close to her target. This allows them to repent their ways or, failing that, put their affairs in order. After accepting an assignment, Shadow Puppet has never failed.\n\nThe truth is, Shadow Puppet is not a single individual. It is instead a title bestowed upon a small number of women at the will of some powerful ancestors. These women then use the deception of only being one individual to their advantage, thus appearing in several places at once or attacking powerful foes as a group when needed.\n\nFuture fate in Canon\nThe \"Shadow Puppet initiative\" will survive the fall of the Azure Dragon Court and will continue in the Green Courts, staying a fearsome and potent weapon in the Korean ancestors arsenal to this night."
 POD_investigate.desc.795046: "A founding father of the Koryo kingdom, Wang Kyu had a difficult time quashing his own desire to rule after the death of king T'aejo. He plotted the assassination of two kings before General Wang Sing-nyom, commander of the P'yong'yang garrison, hunted him down and executed him. On drawing his Second Breath, Wang Kyu made his way to P'yong'yang to wreak his vengeance on General Wang and his family.\n\nThe Azure Dragon Court, still recovering from the chaos in mortal Koryo, has yet to confirm Wang Kyu as Ancestor of P'yong'yang. He knows that, due to his youth and lack of Dharmic progression, it is unlikely that the court will ever sanction his position. Wang Kyu is as ambitious in death as he was in life, however; he has resorted to his old tactics of sowing dissent and murder to consolidate his position as best he can in these chaotic times.\nHe is not without local opposition, and while the deceitful \"Hojil\" is as unlikely a candidate as he is, Wang Kyu has been hard at work to undermine his position before the agitator can undermine his."
 POD_investigate.desc.795047: "Once a disciple of the agitator Myoch'ong, the Buddhist monk named Hojil was spared the flames of 1136 by virtue of a side trip to Hell. Appearing in P'yong'yang, he has established his base in the Taehwa palace at Imwon. A candidate for the post of Ancestor of P'yong'yang, he has successfully appropriated the name and position of his one time mentor, Myoch'ong.\nThe face he presents to the city is horribly scarred (from the fires set by the invading armies he claims); in his monk's robes and bearing Myoch'ong's talismans of rank, no one has thought to challenge his identity.\nHe also has the strength of his Buddhist leaning to support him, while he obviously fell from the Eightfold Path in life, he has the theoretical underpinnings to rise quickly along the Way of the Resplendent Crane."
 POD_investigate.desc.793164: "她的本名早已湮没于历史长河之中，但“孙离”之名却在$pod_kueijin$之间广为流传，被尊为战策之最。她的故事始于吴王宠妃之列。彼时，吴王意图考验孙武的兵法威能，便命妃嫔为“军”，孙离即作为“卒长”位列其中。然众妃无视军令，嬉笑不止，孙武遂斩孙离以示惩诫，杀一儆百。\n\n便在刹那之间，她顿悟了。\n\n她自幽冥归返，心中已通战争之本质。从转生之始，孙离便隐身幕后，专研“国之大事”——兵者，战也。\n有传言说，孙武死后未归正是因为孙离早已候于幽冥。\n此后，孙离著书立说，其兵法之书几成所有$pod_kueijin$研习兵事者之必读经典，甚至连原不涉军事者亦翻读一二。然亦有密语流传，称其最锋利之策从未落笔纸上。\n\n直至今日，孙离仍是世间难以捉摸的谜影。她从未定居某廷，中原地区一直流传着这样的故事：当[Glossary('屋室','podgloss.wu')]陷入存亡危局之际，总会有绝世佳人凭空现身，以暗藏玄机的诗句为绝境中的武者指点兵机。"
 POD_investigate.desc.795015: "Radha, known to many simply as \"The Usurper\", is among the few to steal a real goddess's name. The Celestial Tribe however had little luck dealing with her lack of propriety, especially since it means contending with her extensive cult and proclaiming to mortals that someone in their pantheon is fallible. Instead, they leave Radha to her domain in Vrindavan, the City of Widows.\n\nOnce known as Sadina, she faithfully drowned herself after her husband's death. After taking the Second Breath however, she took the persona of Radha, fully believing to be one of Laskhmi's incarnations (wife of Khrishna). She journeyed to her \"husband\" birthplace in Vrindavan and slowly gathered a following of destitute women.\nThis has put her in opposition with the Tzimisce Ratti-Ben who also made her home in Vrindavan. Both women regard each other as bitter rival and their battles often bring great destruction."
 POD_investigate.desc.795005: "关于他，世人知之甚少，事实上仅有极少数人知晓他的存在。但偶尔会有人看见——一个在旧木屋旁垂钓生活的朴素老者。这位老人却藏着惊天秘密。\n\n狄风诞生于传奇纪元，父亲是万仙，母亲为凡人。他的事迹已成为神话：降伏可怖魔物、完成惊世赌约、谱写无数风流。世界曾是他的游乐场，而他纵情嬉戏。直到万仙的傲慢与腐化降临。\n冯帝试图规劝同族，失败后选择了逃离。其他黄金子嗣则留下对抗父母，最终悉数殒命。\n这场逃亡成为他永生之憾。\n\n随后的千年岁月漫长孤寂。狄风独行世间，既惊骇于万仙的堕落，又痛恨自己的怯懦。直到他遇见第一名半鬼人——这个拥有黄金子嗣灵魂的存在，让他看到了希望。这些曾为阻止腐化先祖而牺牲的勇者后裔，或许能与他共同开辟更好的未来。\n而他也终将弥补当年的懦弱之罪。"
 POD_investigate.desc.795104: "Besides [Glossary('Emma-O','podgloss.emmao')] and his servitors, there is only one being capable of wandering the darkness of [Glossary('Kakuri','podgloss.kakuri')] unscathed. His name is Jizo-Bosatsu, and he embodies the very honor that Emma-o denies.\nAppearing as a slight, bald man who wears the black or saffron robes of a monk, Jizo-Bosatsu has aided and advised innumerable souls trapped here. The brass rings at the top of his walking stick jingle when he walks to warn small creatures of his coming, so that he does not inadvertently harm them: At no point has Jizo-Bosatsu been known to show either fear or anger, and he appears calm in all circumstances.\nWitnesses have stated that he has spoken words to [Glossary('Shikome','podgloss.shikome')] foolish enough to hunt him, and that the shikome have fled, weeping, as a result. Many of these shikome leave Emma-o's service shortly after hearing the words of Jizo-Bosatsu.\n\nOf all beings that have ever wandered Kakuri, Jizo has the singular honor of being the only one ever to intimidate Emma-o. Whenever this smiling, whistling figure is seen, the great [Glossary('Yama King','podgloss.yamaking')] withdraws into his fortress and orders his shikome to seek the wanderer out.\n\nWhy the [Glossary('Yama King','podgloss.yamaking')] allows this to happen in his own realm where he is, for all intents and purposes, omnipotent, is beyond conjecture. Emma-o goes to any lengths necessary to see that this bit of information does not escape Kakuri.\nWere the other [Glossary('Yama Kings','podgloss.yamaking')] to learn of his... odd behavior in this regard, they would be less likely to find him a suitable candidate for the position of [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_investigate.desc.793178: "Hao is an extremely deliberate being. In his mortal life, he was a minor member of the bureaucratic multitudes but the Second Breath focused his mind marvelously. It is possible he could have been among the great minds of China if only he had not needed death to awaken him to his own potential.\nHe revels in subterfuge and double meanings and is as patient as dust when the need arises. He is known to value younger $pod_kueijin$ more than your average Ancestor, though many think it is a facade he cultivates to grow a fanatic powerbase.\n\nFuture fate in Canon\nHao will become a driving force behind the Quincunx and one of the most politically powerful $pod_kueijin$ of China. Some will say he will even dictate the politics of the Quincunx as a whole.\nHe won't be without competition however and he thus will mastermind the \"Great Leap Outward\", a bold attack on territories from Australia to California to shore up his position and prestige once and for all.\n\nDespite early successes, the resilience of the California Free State and the scheming of competing factions at home will turn Hao's invasion into a disaster. For this failure, he will honorably choose to face the sun one last time."
 POD_investigate.desc.793275: "Wang Ping lived in a small village near the banks of the Yellow River. One night, a group of bandits broke into her home and kidnapped, repeatedly raped and then murdered her and her family. She took the Second Breath with a mind full of vengeance which she exacted.\nHands full of blood and head full of an overpowering need to remove such wickedness from the world, she was soon discovered by a Resplendent Crane who took her and trained her in the ways of his [Glossary('Dharma','podgloss.dharma')].\n\nReturning to her village as a $pod_kueijin$ and wanting to think that her death had a purpose, she started her own journey towards purity. There she experimented from the outside, bringing money and influence to an area that was only mud and straw huts. She built shrines to her parents, protected her descendants and endlessly manipulated the actions of village residents. Over time, she communicated her findings to fellow Resplendent Cranes and the Three Mountains Village was approved as a site for research and study of the effects of various rules and proclamations as applied to mortals. Somewhat isolated, the village provided the perfect site to test various laws.\n\nFuture fate in Canon\nWang Ping will die in a tangle with some local Hsien (faerie folk). Her experiment will easily outlive her however and take a darker and darker tone as time passes."
 POD_investigate.desc.793208: "The self proclaimed Grand [Glossary('Arhat','podgloss.arhat')] Hon Li stands in blazing violation to everything the August Courts stand for. And many still think he will be the one to actually triumph against the [Glossary('Demon Emperor','podgloss.demonemperor')].\n\nIn truth, Hon Li is simply expressing publicly a sentiment shared in secret by many, that the very complex and suffocating political system of the August Courts is an hindrance to the true goal of the $pod_kueijin$, stopping the rise of the [Glossary('Demon Emperor','podgloss.demonemperor')].\nThe reaction of the Courts was predictable. Branding Hon Li an [akuma|E] and servant of the infernal, they declared his society, the Searing Wind, heretical and tried to silence him.\n\nHon Li was no mere rebel however and joined by a few (but secretly helped by many more), he used his extraordinary charisma and splendid battle skills to gather followers from some of his pursuers while destroying those who wouldn't convert. And thus the Searing Wind exists on the fringes of $pod_kueijin$ society, preaching war against the [Glossary('Yama Kings','podgloss.yamaking')].\n\nFor all intents and purposes, it is an army readying itself for a battle that might only come in centuries from now. Hon Li's plan is simple, when the [Glossary('Demon Emperor','podgloss.demonemperor')] finally appears, he will be at his weakest. That will be the moment to strike.\nWhen that moment comes, Hon Li hopes that the rest of the $pod_kueijin$ will see sense and rally behind him for this final battle.\n\nFuture fate in Canon\nThe Searing Wind will have ups and downs until the coming of the westerners will flood its ranks with $pod_kueijin$ seeing their appearance as a sign of the end.\nThen, the Searing Wind and Hon Li will simply disappear from China. Some will say they moved to Himalaya, others to Afghanistan or even to another realm altogether.\nWhatever the case might be, many will secretly hope that they will return in time for the now imminent rise of the [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_investigate.desc.792849: "Mathias was born in 888 AD to the von Greifenstein family, a proud noble house with a history going back to Charlemagne and Theodoric. As the firstborn son and heir, he was expected to carry himself with dignity and bring honor to his family name. His integrity and leadership skills ultimately earned him the $pod_Embrace$.\n$TAB$Unfortunately for him, his [Glossary('Sire','game_concept_Sire_desc')] turned out to be a cruel master who treated both his childe and the mortals of his domain with contempt. Mathias remains altruistic at heart and seeks to avoid the constant intrigue and backstabbing of his fellow $pod_cainites$.\n\nFuture fate in Canon\nMathias' existence ends up a tumultuous one. He finally murders his sire during the Age of the Inquisition and joins the Camarilla, rising up to the rank of Archon. However, word of his crime caught the ear of the Tal'Mahe'Ra, who recruit Mathias as a double agent by appealing to his idealism. He then joins [GetScriptedCharacterByHistoryID('790819').GetFirstName] to quell the Anarch Revolt in Frankfurt and founds a [coterie|E] called the Gryphons, who act as the Camarilla's enforcers in Frankfurt to this day."
 POD_investigate.desc.792375: "In her mortal days, Myriam was a pagan priestess and #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Sorceress#!#! with ties to the Fae. Contrary to her youthful appearance, she had stayed in [UmbraGlossary('arcadia')] for centuries at a time, finding upon her return that only a year had passed in the real world.\n$TAB$What happens after is a blur. Myriam's village was raided and she was sold into slavery. Her Fae friends were nowhere to be seen. A [GetTrait('malkavian').GetName(GetNullCharacter)] who heard stories of her sorcerous powers grants her the $pod_Embrace$ and her freedom, but ultimately abandons her.\n$TAB$Now, Myriam's $glossary_clan_curse$ manifests as dissociation. She will spend most nights in a daze, eyes glazed over, daydreaming about her carefree past in the Fae world. Yet sometimes, she gets wrenched back to a stark and lonely reality, where she exists as an unliving creature with terrifying power.\n\nFuture fate in Canon\nMyriam settles down in Frankfurt and finds kinship with the inhabitants of the city's mental asylums. Her highly developed [GetTrait('auspex').GetName(GetNullCharacter)] grants her great insight into the deepest secrets of the city, but her seeming absentmindedness makes her true goals inscrutable. The Inconnu are keeping a close eye on her."
 POD_investigate.desc.792847: "Ajhan always wanted to be a legendary hero. He experienced his first battle at the age of 12, in service of the Hunnic king Attila.\n$TAB$One fateful night, Ajhan witnessed an enemy soldier visiting his encampment, apparently conspiring with one of the Huns before a battle was to happen. Smelling a traitor, Ajhan attacked the stranger with 30 of his compatriots.\n$TAB$The stranger massacred them all.\n$TAB$Ajhan, the only survivor, cursed the stranger and asked for the release of death. His wish was granted... through the $pod_Embrace$. The stranger turned out to be none other than the ancient [GetTrait('nosferatu').GetName(GetNullCharacter)] [GetScriptedCharacterByHistoryID('699999').GetFirstName].\n$TAB$Finally, Ajhan had met a legend in the flesh.\n\nFuture fate in Canon\nAjhan swears an undying Blood Oath to Angiwar and becomes his staunchest defender, following his sire through hell and high water, and aiding his one-man war against the Nicktuku. He never leaves Angiwar's side... except for one occasion, which turned out to be a fatal mistake.\n$TAB$In the 16th century, Angiwar sends Ajhan on an errand to retrieve important scrolls from Cairo. Plagued by visions of his sire's impending death, Ajhan returns just in time to find Angiwar ambushed and driven to $pod_torpor$. Since then, he has been standing guard over his sire's motionless body, waiting desperately for his return."
 POD_investigate.desc.795016: "God and commander of the monkey warriors (according to mythology), the $pod_kueijin$ Hanuman is an enigma. Some say he is an Usurper brazenly stealing Godhood while others think he is the source of the myth.\n\nHanuman, however, isn't saying.\n\nOften looking like a monkey with yellow fur, a red face and a long blazing tail, some believe he is a monkey that took the Second Breath somehow. While unlikely, the fact is he appears more simian than human and more divine than simian.\nDressing like a monkey king, he is also a poet and many seek his apparently infinite wisdom. Few find it however, as his jungle stronghold is hidden very well.\n\nHanuman's true claim to fame however will always be his bold attack on Lanka, the terrifying [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] of Ravana. In a feat never seen before or since, the monkey king managed to single-handedly devastate the realm to its core and pushing the [Glossary('Yama King','podgloss.yamaking')] Ravana to retreat, wounded, to his castle.\n\nThis bold feat started the Face of the Gods [Glossary('Dharma','podgloss.dharma')] where others try to mimic Hanuman's apparent divinity and achieve enlightenment. He himself taught a few disciples, helping spread his teachings (and fame) far and wide.\n\nThanks to this (indirect) creation of a now widespread [Glossary('Dharma','podgloss.dharma')] and the purging of Lanka, Hanuman might be one of the most influential $pod_kueijin$ still active."
 POD_investigate.desc.505147: "Gotzon was a priest and deemed a crusader of the Lord by his peers (some would even call him an \"inquisitor\"). In truth his crusades were many. If asked, he would probably say only that he does the Lord's work, but the manner of work that God demands is bloody indeed. Pagans, heretics, even demons and infernalists – all have fallen before him. Gotzon never answered direct questions about his plans and trusted in God to direct him in all things.\n\nThe truth is, Gotzon found God only after the shadows found him. For a reason that he now longer remembers, Gotzon was part of the Lasombra that enacted the terrifying ritual Cry That Slays Light, bringing forth an eclipse upon the world. After that day, he promised himself to never uses his shadowy powers ever again and instead focus on his godly work.\n\nHardestadt and Gotzon were longtime companions when they met a young knight named Jürgen von Verden. Both $pod_cainites$ wanted to $pod_Embrace$ the promising mortal, but could not reach an understanding about which of them was better suited to bestow the curse of Caine upon him. \n\nEventually, the pair decided it would be up to Jürgen himself to choose whether he would do God's work through Gotzon's teachings on the Road of Heaven, or throw himself in the path of glory through the Road of Kings, favored by the Ventrue Hardestadt.\n\nThe knight wanted to be a conqueror, even if he rationalized that by doing so he was actually serving God's will. Gotzon was deeply disappointed by the outcome of events, but acquiesced nonetheless. He had not given up on his protégé, however, and followed Jürgen in his adventures acting as his confessor, patiently trying to convert the Scion to the Via Caeli.\n\nFuture fate in Canon\n\nGotzon's friendship with Jurgen will continue for a while, the Lasombra helping him in his mysterious manner, until Jurgen's commitment to his love for Rosamund will break them apart.\nAn argument will see their bond broken, ending with Jurgen banishing his confessor from his lands."
 POD_investigate.desc.795111: "Perhaps the oldest being active, Mokolé-Mbembe, the Crowning son of Two Thumbs, was the first Mokolé to be born after the age of the Dinosaur Kings. Founding the Congo Clutch on Lake Tele deep inside Africa, tales have it that through life-extending Gifts and his sleeping the Sleep of the Dragon, Mokolé-Mbembe has prolonged his life to the present, though living most of it in the [umbra|E].\n\nHe warded the jungle home of the Mokolé with deadly Fever-spirits to save his people. He saw the First City, then Egypt, Sumer, Rome rise and fall, and has sired endless hatchlings with his Kinfolk mates. He taught his lineage to be wise, but also to be warriors, for the Mother's foes can only be outsmarted so many times. His spear, apparently carrying a part of his power, is both a peerless weapon and a symbol of pride for his people.\n\nAs with beings as old as he, Mokolé-Mbembe does not think in the same timeline at others and rouses himself to act only on select occurrences. When he does however, the world sees a glimmer of the past glory of the Dinosaur Kings of old."
 POD_investigate.desc.795200: "Rumored to have the form of a massive albino crocodile, Sobek is mentioned in the Isis Fragments as the chieftain of the crocodile-folk who lived in the river Nile, in a time when gods walked the Earth. He teamed up with the vampire Wadjet and the Sons of Bubasti to protect Isis and her son Horus when the pair sought refuge in the island of Chemmis after the imprisonment of Osiris. Set eventually found them and took the pair of gods as captives.\n\nIf Sobek still exists at all, he is rumored by the elders of the Followers of Set to be a Mokolé Abomination, severed from Helios' grace by dark magics cast by Set, and damned to exist as an unholy mockery of all what his kind stands for.\n\nHe is reputed to be slumbering in a Founding Temple of Faiyum, surrounded by a retinue of ghouled crocodiles. One of these crocodiles is said to be over a thousand years old, and to give oracles from Set's childe to the Abd'al-Sobek, a Setite cult centered around worshiping him.\n\nThe Hem-Ka Sobk, a group of assassin mages, also still venerates him, though more in his older form as a pre-pharaonic crocodile deity. In older times, they also served as cultists to the Mokolé as well, as they saw them as the \"Children of Sobek\"."
 POD_investigate.desc.791342: "Before Maginardo the position of Roman Aedile, master of buildings and lairs, had fallen into as much disrepair as the Eternal City itself. Maginardo’s [Glossary('Sire','game_concept_Sire_desc')] Marco knew a bit of masonry and carpentry but could most of all be counted on to keep his mouth shut, since the Aedile traditionally vows to keep his knowledge a secret. He wasn’t a very skilled builder, however; havens and catacombs crumbled as they aged, and as rival Cappadocians and Nosferatu renovated and destroyed structures in a war for the undercity. Hearing of his fame as an architect, in 1032 Marco $pod_Embraced$ Maginardo in Ravenna and presented him to Cretheus.\n\nIn the centuries since, the new Aedile has renovated many underground spaces and even broken through into places that even the elders have forgotten. In the process he all but ended the battle for the undercity, as both sides came to realize that, under their crude care, they’d lost more than they could gain in victory. Yet peace has opened up new secret spaces and rumors of threats in the lightless dark, from which rats and worms flee.\n\nThe vampire’s face resembles cracked and smashed marble, distorting the features of a man in his 20s."
 POD_investigate.desc.791444: "The daughter and only child of a noble in Carlisle, Eloise was destined to marry well and inherit her father's estate. Rebuking all suitors, she spent her time struggling to learn methods by which she could maintain her father's power for her own, rather than relinquish it to a husband. Ultimately, Eloise's mother gave birth to a son, and any inheritance immediately dissolved into a simple dowry.\n\nIntelligence and ambition forced Eloise into a frustrated life, having no opportunity for success in a world dominated by wealth, and more importantly by men. After intimidating one potential husband with talk of philosophy, she drew the attention of Harris Beauchamp, her suitor's chief advisor.\nIn the midst of Eloise's training, Harris was destroyed by a $pod_cainite$ rival and the girl fled to York for sanctuary.\n\nThe newcomer's potential was immediately recognized by John, Baron of York, who adopted her as his own childe and groomed her for greatness. Within a decade of exemplary service to the baron, Eloise rose to the position of seneschal, drawing ire of many $pod_cainites$ far her senior. Partly to see how she handled responsibility and partly to remove her from an increasingly hostile environment, John established Eloise as his representative to Meerlinda in Durham.\nYoung and brash, Eloise's efforts to deceive Meerlinda have so far been unsuccessful though her vigilance still gives her more insight into the English Tremere than many others."
 POD_investigate.desc.791266: "Bastard child of Guillaume IX, Guilhem de Peitieus changed his name to Ebles, the name used to designate bastards in his family. A very strict religious and administrative education crumbled when Ebles was found in a passionate relationship with a woman of the cloth and sent to the Holy Land for penance. He came back changed by the horrors he saw and committed there.\n\nSolace came in the form of the Promethean Ventrue Gaius Marcellus who shared in Ebles' sorrow then dreams. $pod_Embraced$ by Gaius, Ebles soon became a powerful political animal in his own right, leading the (few but dedicated) Prometheans of France. Alexander's exile offers an opportunity for the ambitious Ventrue. He plans to conquer Etienne de Poitiers' domain then ally with Esclarmonde to conclude the collapse of vampiric France and usher its rebirth into something new and better, worthy of old Carthage.\n\nWith the help of his prestigious [Glossary('Sire','game_concept_Sire_desc')] and budding alliances with Quentin de Senlis and Esclarmonde, Ebles is quickly becoming an important power player in France. Perhaps too quickly, the threat of acting rashly and making a target of himself recently pushed him to limit his public appearances and instead acts through his ghoul, Philippe des Douves, instead."
 POD_investigate.desc.791388: "Vicente was an ambitious man, the son of a wealthy merchant. He saw firsthand how men could easily be bribed, threatened or cajoled, and this made a great impression on the boy.\n\nAll this changed in 1164. A routine trip turned ugly when bandits overtook the caravan and wreaked bloody havoc upon it. Vicente saw his proud father begging for his life, and saw the bandit chieftain laugh as he struck the senior de Cardona down. Vicente himself escaped with a ruined right hand and a scarred face, presents from the bandits.\n\nVicente survived his injuries, and even succeeded at rebuilding his father’s commercial empire. However, he was never loved as his father had been; instead, his brooding demeanor, savage temper and insistence on vengeance for even imagined slights made him a very unpopular man.\n\nThis combination of drive, achievement and odd personal habit quickly brought him to the attention of the Lasombra, and he was brought into the clan in 1182. Rather than continuing to expand his mercantile operations however, Vicente let them slide. Instead, he began lobbying his elders to extend their authority to Portugal. While doing so had a certain appeal to them, they saw Vicente’s lobbying for what it was: a transparent attempt to extract some sort of vengeance.\n\nEventually Vicente’s sire wearied of his fractious childe and gave him precisely enough rope with which to hang himself. Vicente was ordered to go to Lisbon and not to come back until all of Portugal was in Lasombra hands. Vicente himself, however, has decided this means that his sire recognizes his worth. With a combination of high hopes and black-hearted thoughts of vengeance, he has relocated and set about trying to destabilize the Portuguese Brujah.\n\nFuture fate in Canon\n\nVicente’s plan for Silves goes off without a hitch, catapulting this less-than-skilled manipulator to the post of lord of southern Portugal. Muhammad ibn Farouk becomes a trusted advisor, and Vicente never quite realizes that he has become the pawn or that his \"clanmate\" is in fact a disguised Baali. Vicente’s childe Rodrigo Toca does, however, and presents evidence to that effect to the Amici Noctis. He commits $pod_diablerie$ and takes Vicente’s place in Portugal."
 POD_investigate.desc.505130: "Born Ueruic, this Ventrue and Antonius (then named Antiorix) came to Gaul around the time of the founding of Massilia. Quickly establishing themselves, they ruled over the Aedui until Antiorix sided with Rome and brought about the fall of Gaul. Ueruic fled to Germany, where he renamed himself to Erik Eigermann.\n\nBecoming the first known $pod_cainite$ to reside in the area of modern Berlin, he openly ruled the region until the late 12th century when he was hunted down and badly wounded by the hunter Karl Schrekt. Now in $pod_torpor$, Eirik is said to still influence the Brandenburg region, making sure a Ventrue of his lineage always hold dominion there.\n\nEirik being the [Glossary('Sire','game_concept_Sire_desc')] of the famous Hardestadt is a disputed theory as the man himself never confirmed it. Still, informed parties think him the likeliest candidate, also thus explaining how the young and politically isolated Hardestadt could achieve his hegemonic rule over Germany in so little time.\n\nFuture fate in Canon\n\nEirik's subtle influence will ensure Ventrue's dominance over Berlin for centuries. The arrival of a new Malkavian Prince in 2017 will greatly displease him however and Berlin's vampires will soon be plagued by images of destruction as the old Saxon stirs..."
 POD_investigate.desc.795132: "Having never known his [Glossary('Sire','game_concept_Sire_desc')], Jovirdas was coerced by the Tzimisce elder Visya to serve as Geidas' Tysiatski (\"sheriff\"). Geidas is Visya's childe and an incompetent puppet Prince, leaving Jovirdas to actually do the administrative work of the domain, all the while resenting the hold Geidas and Visya have on him.\n\nFuture fate in Canon\n\nJurgen von Verden's arrival will change Jovirdas' fate. The Ventrue humbled both Geidas and Visya, leaving an opportunity for Jovirdas to kill the former and break free of his bonds. He was then fully prepared to be killed in turn by Jurgen but the German asked him to swear fealty instead, intrigued by that the fact that Jovirdas apparently taught himself the Road of Kings.\nThe former sheriff will accept and share his experience of the Road with Jurgen before being taught more formally by the Ventrue's consort, Rosamund of Islington. He will go on to serve as a loyal base of operations for Jurgen's next campaigns in the region."
 POD_investigate.desc.791355: "一位名叫凯尔特的萨米族猎人兼斥候从北方归来。她此行是为了追随瓦尔普尔加女王，试图阻挡基督教扩张的脚步。然而，凯尔特本质上是一个理想主义者和浪漫主义者，她的内心正因血畜所遭受的苦难而滴血。\n她已对自己的领主产生了深深的厌恶，内心深处渴望看到最终死亡降临在女王身上——或者，她干脆想彻底离开北方荒土，远赴米克拉加德，即君士坦丁堡，在拜占庭皇帝的瓦兰吉卫队中寻求自己的命运。任何来到比雅克岛意图颠覆女王统治的人，都将得到她的助力。尽管她的言行已难以掩盖其动摇，但瓦尔普尔加及其宫廷成员因与她相识已久，仅将其表现视为这位狂热者性格中的固执成分。然而，对于刚加入的新血而言，或许一眼就能看穿她内心的真实想法。"
 POD_investigate.desc.791015: "In his mortal days, the man who would become Rothriel lived in the Bronze Age Harappan city of Dholavira on the Indian subcontinent. His inquisitive soul, as well as his progress with the sword, brought him to the attention of a traveling Salubri warrior named Ezrael, who took him as a bodyguard and later as an apprentice.\n\nWhen Ezrael offered the young man the $pod_Embrace$ and the Blooding, he emerged under the name Rothriel. He fought valiantly against the followers of Moloch and the swarms of Chorazin, often acting as a bodyguard for the Healers of his Clan. It is said that he was privileged enough to have once sat and learned at the feet of Saulot himself.\n\nDuring his travels, he met a younger childe of his own [Glossary('Sire','game_concept_Sire_desc')] named Mahtiel, with whom he shared a bond that became legendary among his peers. Though their love and dedication to one another was boundless, when the Salubri [Glossary('Antediluvian','game_concept_antediluvian_desc')] was [Glossary('diablerized','game_concept_diablerie_desc')] by Tremere, Rothriel was among the few who disavowed violence, believing that preserving the legacy of their forefather would be more important than avenging him. Rothriel chose to seek the Golconda, frustrating Mathtiel and creating a disagreement that eventually made her leave their haven for a month. When she returned, Rothriel was gone.\n\nFuture fate in Canon\n\nRothriel will befriend Danika Ruthven and help her retake Hunedoara Castle from the Tremere. He won't survive the battle however, his death sending a fiery agony that will turn the Gargoyles against their masters and strike Mahtiel with terrible grief."
 POD_investigate.desc.790198: "Born to the family of powerful merchants in Genoa, Maria Isabella d'Agostino grew up with the sensibilities of one born to rule. Genoa was beginning its growth as a trading power, and the wealth brought to House d'Agostino bought her servants, rich clothes of silk from Constantinople and all the things that she grew to regard as her rightful due.\n\nAlthough she was taught that a woman's proper place was as a wife, mother and household supervisor, Maria was fascinated with trade and the arts of commerce. She showed an aptitude for mathematics and business, which was considered unseemly by many in her family. Her father, however, indulged her, not the least because she wanted more apt pupil than her dolt of an elder brother, Rogerio, the nominal heir.\n\nWhen her father suddenly died and her brother tried to sell her to the Fieschi family, Maria stabbed him through the heart. The night before her execution, she was visited by the one who would become her [Glossary('Sire','game_concept_Sire_desc')].\n\nShe soon thrived as a Lasombra, taking control of her family power and wealth from the shadows until the Lasombra elders noticed her talent and sent her to the Holy Land to support their interests there. However, despite her best efforts, she was unable to thwart Jurgen von Verden influence and takeover of Acre.\nThis setback saw her being redirected to the crumbling Byzantine world, where she is now determined to prove herself worthy of her elders' high expectations."
 POD_investigate.desc.790396: "众所周知，提奥图卡皮斯曾活跃于大马士革，为当地的阿刹迈提供援助，协助他们搜寻据传位于城市下方的巴力大型巢穴。她曾与阿刹迈维齐尔马哈茂德·阿斯兰通力合作，并随后遵照长者的意愿与其接洽。\n\n赛特之子渴望与哈基姆之子结盟，以铲除犹大之子——这是一个源于君士坦丁堡的异端教派，他们沉溺于恶魔崇拜，将赛特贬低为效命于撒旦的又一头地狱魔兽。随着该异端在君士坦丁堡陷落后以惊人的速度在欧洲蔓延，圣显者寻求驱使阿刹迈去对抗他们，以及那些与之同流合污的巴力。\n\n作为交换，赛特氏族向阿拉穆特，鹰巢提供援助，以化解公元636年被下的巴力血咒，并支持激励阿拉伯民众将异教徒驱逐出中东。"
 POD_investigate.desc.790308: "Perhaps the most well known Sophist in his mortal days, Critias' incisive questioning and intense wit earned him exile from Athens. It was the day before his departure that he met his biggest fan, the Brujah Menele.\nEngaging in vigorous debate over the nature of life, death, and the role of philosophy in both. Critias became the victim of his own method, and he realized that his own edicts and philosophy were real, substantial, and worth dying for. Or, perhaps, worth living for, for the first time. After admitting defeat, Menele offered Critias a new choice: die for the truth, right then and there, or live for eternity and act the gadfly to the world. Critias chose the $pod_Embrace$.\n\nThe pair traveled the world until arriving in Carthage. They used the city to plan for a new golden age of Kindred and kine, where philosopher-kings would rule with logic, respect, and democratic debate. Critias was quickly swept up by the grand vision, and he became passionately devoted to the cause. Sadly, he was exploring China when he heard the news of Carthage’s fall, as well as rumors of his [Glossary('Sire','game_concept_Sire_desc')]’s death.\n\nSince then, Critias has been aimless, despairing to see the Brujah devolving into thugs and bandits instead of the philosopher-kings of old.\n\nFuture fate in Canon\n\nCritias will move to the New World, unbeknownst to him because of Melene's subtle summons. Settling in Chicago, he will participate in the politics there and found the Entelechy School... until Menele's true death and the snap of his blood bound.\n\nCritias will panic over the realization that he might have been manipulated by Menele for millennia, forcing him to take drastic and unpleasant measures to make sure his life is still his to live."
 POD_investigate.desc.792764: "Sarisel was once a member of the House of the Fates, one of the angels responsible for creating patterns between facets of creation. He worked in close tandem with the Wild House, inventing ways for plants to spread their seed, since he always considered the clumsy method of sexual reproduction to be laziness on someone’s part.\n\nWhen the rebellion began, many of the angels serving him were surprised to see him join. They had always thought him a Loyalist. Indeed, while being cursed as one of the Neberu, he cried that he never should have joined the rebellion at all. Lucifer didn’t exactly cast him out for his weakness, but the rest of the host treated him as something of a deserter from there on out. Yet, after the Civilization of Ashes fell, he was cast into Hell just like the rest of the Fallen.\n\nEven today, Sarisel isn’t sure how a small cabal of Chinese wizards managed to summon him, but he isn’t one to look a gift horse in the mouth. Freed from Hell several centuries before Christ was born, Sarisel bound himself to a verdant garden and reaped a harvest of faith from the wizards and their descendants. His rise to power was much slower than that of the more powerful Earthbound in other civilizations, but Sarisel also did not find himself in danger of extinction with the rise of Christianity.\nLike an oak from an acorn, the Fiend grew slowly, instructing his followers in the use of plants as divining tools and poisons, waiting for an opportunity.\n\nFuture fate in Canon\n\nSarisel will endure and slowly rise in power until the 20th century. Preparing to unleash his ace in the hole, the \"soul orchid\", Sarisel will wait for the perfect time to make his presence known to the world."
 POD_investigate.desc.792273: "In the grand scheme of France's politics, Jehanne is an insignificant player and she knows it. Considered as a somewhat useful pawn by her betters, Jehanne has started her career blood bonded by Saviarre and sent to do small errands.\nShe soon proved a talent at intrigue and spying that elevated her a little in the eyes of the then powerful Saviarre. She gave her more and more difficult missions, thinking that the challenge would help Jehanne's talents steadily grow.\n\nIn truth, Jehanne is terrified. The heretics, the crusaders, the vampire lords, her own mistress... she is willing to do any betrayal, torture or massacre as long as she can save her own skin.\n\nSent by Saviarre to spy and hamper Esclarmonde's rise to power in the south of France, Jehanne blood bonded the Ghoul mercenary Folch and tried to use him to ambush the prospective Queen of the Golden Courts. The failure of his attempt left Jehanne with two powerful enemies, an enraged by her failure Saviarre and an embittered by her betrayal Folch.\nJehanne has been on the run ever since.\n\nFuture fate in Canon\n\nA spy too gifted to ever get a domain, Jehanne will be \"recruited\" by Salianna to spy on the Inquisition. When the tide will turn against her new mistress, Jehanne will flee and barely avoid capture by a Salianna determined to get rid of her before her secrets could be spilled. Finding refuge under Beatrix, she will become a key participant in the future Queen of Undead France's ascension."
 POD_investigate.desc.792618: "这位托雷努氏族的罗姆女性在12世纪末旅行前往东欧。雷伏诺氏族的伊兹多尔·托雷努与他们同行并领导着这支队伍。黛丽兹别塔当时是他的血仆。\n她还天赋异禀，掌握着真实魔法，并觉醒了预言能力，在队伍中担任占卜师。在君士坦丁堡和布达佩斯停留了一段时间后，这支旅队勘察了特兰西瓦尼亚地区，试图为族人寻找新的家园。\n\n其在原作中的未来命运\n\n当他们进入该地区后，原本看似天堂的地方却变成了噩梦，他们很快便沦为奴隶。尽管黛丽兹别塔恳求伊兹多尔不要自责，但因将族人带入如此困境而产生的绝望，使伊兹多尔一心求死。在跳入夏末节的火堆前，伊兹多尔对黛丽兹别塔进行了初拥，使她成为了一名雷伏诺，并在此过程中摧毁了她的化身。\n他委任她守护雷伏诺氏族，随后纵身跃入火海赴死。\n\n伊兹多尔的死让黛丽兹别塔悲痛万分，但她下定决心要竭尽所能成为一名守护者。在她的帮助下，许多被奴役的罗姆人摆脱了束缚，再次成为四处游历的民族。如今，黛丽兹别塔带着她的大部分族人在特兰西瓦尼亚各地穿行。每当夜幕降临，她依然会为人占卜。"
 POD_investigate.desc.795166: " 'Wherever it is forbidden to tread, you shall walk. Whatever is prohibited to utter, you will speak. Whatever is taboo, you will revel in.' So Lucifer charged the Silver Legion; so Belphegor the Defiler acted. She designed her palace to house her flock and assist her experiments upon them.\n\nThe palace was constructed from the crater of a volcano, sealed off for her convenience. The rock walls were hardened and sharpened to razor points at their height. between them shimmered a continual storm of fire, lightning and poison vapor, creating a veil of deadly rainbows. Within was a hundred square miles of fertile land and a sparkling lake which the wings and colonnades of flesh-colored stone embraced in graceful curves.\nDown through the earth they went and up into the walls, until the entire demesne was truly her palace. It would seem beautiful, until the observer smelled the rank scent on the wind, heard the cries rising from the fields and pavilions, and noticed the strange devices and the real composition of the building at the crater's center.\n\nBelphegor tested the ability of humans to pass traits on to their offspring. She designed rituals to expedite and influence the process. her flock included prodigies of beauty and strength, the dreadfully deformed and half-bestial chimeras, all retaining the human capacity for faith. Although the storm and the strength of its walls were the palace's main defense, she also bred humans for battle and housed these forces in the lower reaches of the walls.\n\nBelow the surface of the crater were levels that were not for humans, in which no human could survive. These were for the extreme edges of the Defiler's pleasure, and also formed an inner defensive ring of tracts of fire, acid and freezing cold. Beyond these were her own chambers where only her most trusted allies were entertained, and who reported marvels of sculpture and arrangements of light and shade and color into living paintings in which the guest participated.\n\nSuch was the Palace of Sighs, destroyed as thoroughly by the Heavenly Host that the volcano itself was rubble scattering a plain of ash."
 POD_investigate.desc.790813: "Demetrius was among the Greek colonists who founded the ancient port city of Massilia long before Rome rose to power. A distinguished member of the Ventrue clan, Demetrius sat as the Prince of Massilia for centuries after taking the area from Brujah aligned with Carthage.\n\nHowever, when the entire south of France fell under Roman authority centuries later, Massilia held out as a free city for quite some time. Eventually, though, when Julius Caesar conquered Gaul there was no escape, and although he had worked with his clanmates in Rome, helping them when required, the autonomy of his beloved city was gone when Roman troops stormed its gates in the first century B.C. - a slight that Demetrius would never forgive.\n\nHe went into a rage and blamed one of the elder Ventrue in Rome, Gaius Fabricius, for failing to make Julius Caesar into a pawn. At first Gaius bore the Greek no ill will, but he quickly took up the feud on his own in retaliation for Demetrius' constant attacks.\n\nDemetrius had to flee the city in 838 when she is pillaged by the Saracens and barely avoid final death at the hands of assassins sent by Fabricius. Going to his [Glossary('Sire','game_concept_Sire_desc')], Alexander, to ask for help, he was instead quickly exiled as a punishment for his weakness. He has since then taken refuge under Titus Brutus Caesar and plots his return to the throne of Marseilles, or even France itself.\n\nFuture fate in Canon\n\nDemetrius will achieve neither of these things and instead fested in his feud against Fabricius. Their acrimony will even extend to their progeny, their progeny's progeny and so on. Although both are reputed Cainites of a powerful generation, they will be known to take out their aggression on lowly neonates who can claim a rival's lineage. As often as not, the rival doesn't even know that the poor descendant even exists."
 POD_investigate.desc.792312: "A Ventrue of considerable power and influence, Merwynn Hayward has fought her way to prominence in Verus’ court. Hayward has misinterpreted Verus’ recent actions, however, and feels betrayed that the Baron of Chester has secretly called in favors with inexperienced outsiders unfamiliar with their local politics and customs. The Ventrue courtier firmly believes she should be the one to succeed Verus and has spent much of her unlife working towards this goal.\nThough she is a recent addition to Verus’ court, she has been carefully planning her ascension for decades.\n\nEver the consummate courtier, Merwynn Hayward utilizes her own network of spies. She has come to the mistaken conclusion that her thousand-year-old Prince is not fit for rule, for his recent acts are more confusing and erratic than usual. Worse, she has recently gotten word from her [Glossary('Sire','game_concept_Sire_desc')] of troubling news. If Marius’ claims are true, then Marcus Verus does not uphold the Traditions as he should, for he considers his [Glossary('Sire','game_concept_Sire_desc')] to be a god!\nIf the failing leader is reluctant to punish unbelievers who violate the First Tradition, because he himself is a pagan-worshipping fool, Hayward is convinced this blasphemy leaves everyone in Chester vulnerable to attack from heathens and miscreants.\n\nFuture fate in Canon\n\nMerwynn's heavy handed plot against Verus will backfire, ending with her exile from Avalon."
 POD_investigate.desc.791822: "Some say Sarmis has seen and know everything. There is at least some credence to that, as the Ravnos can expertly recount Alexander's conquests, Carthage's fall or even the Trojan War. The patient scholar is persuaded that he can find Golconda, as long as he doesn't ever stop his quest for knowledge.\n\nLiving far from most $pod_cainites$, Sarmis mainly seek the company of mortals or his own books, having reputedly authored several thousands historical chronicles. All of those accounts are found in this \"Great Book\", a magical grimoire that appears when it is needed, which is more often than not as Sarmis is always eager to put to paper the stories of the most humble of commoners or the greatest of kings.\n\nWhat few people know is that Sarmis has been cursed. Turned into a vampire long ago in Thracia, an unknown magic makes it so people start behaving irrationally and aggressively around him the longer he stays in one area. While he has no idea of the origin of this curse, Sarmis is very mindful of it and thus is always on the move, his only fear being that this might only be the tip of the iceberg hiding a much darker truth..."
 POD_investigate.desc.792302: "In an effort to make up for the sins of his boorish [Glossary('Sire','game_concept_Sire_desc')], Rodrigo makes an astonishing effort to be the Lasombra’s Lasombra. He is courteous, devilish, graceful, proud and formal, and he is never less than utterly polite to his betters. In social situations, he makes it perfectly clear that while he has the utmost respect for the sire-childe relationship, he considers Vicente to be an idiot.\nAll of this wins him points with Amici Noctis, who privately refer to Toca as “the rose on the dunghill of Lisbon.”\n\nIn life, Toca was a child of wealth and privilege whose father traded with the de Cardona family. He saw and envied Vicente’s freedom, and made a point of sustaining the business relationship when both his father and Vicente’s passed on.\nDe Cardona remembered this and, when he was $pod_Embrace$d, sought to repay perceived favors that Toca had given him.\n\nRodrigo is well aware of the disdain others have for his [Glossary('Sire','game_concept_Sire_desc')], and he long ago grew disillusioned with the figure he once thought so heroic. He has rapidly been distancing himself from de Cardona, both politically and geographically.\nCurrently, he makes his home in Santarém, and he’d move farther away if he dared. However, Toca is very wary of de Cardona’s increasing paranoia, and moves very slowly so as to avoid sparking his [Glossary('Sire','game_concept_Sire_desc')] to any rash action.\n\nFuture fate in Canon\n\nWhen Vicente makes a deal with the devil, Rodrigo will be there to report it to the Amici Noctis. He will be rewarded with Portugal and, sweeter still, his foolish [Glossary('Sire','game_concept_Sire_desc')]'s blood."
 POD_investigate.desc.790967: "Garinol was born sometime in the late 11th century. Before he converted to Christianity, Garinol was raised as a follower of the cult of Mithras in mortal life. After watching his family die of plague as a child, his fascination with morbity began. Like most orphaned children, he was deposited in the care of the Church. Garinol converted to Christianity and became a monk.\n\nHis fascination with death did not cease, however, as he would kill small animals and attempt to raise them from the dead. Though his peers had no idea in regards to his hobby, his actions did not go unnoticed. Brother Jervais, a Cappadocian, $pod_Embrace$d the 22-year-old Garinol and welcomed him into the ossuary under the abbey. In time, Garinol was made abbot. Then he became the advisor and ally of the Ventrue Prince of Prague, Rudolf Brandl, although his allegiance remained first to his $pod_clan$.\n\nThe abbot Garinol had great influence over the church affairs of Prague and was respected among mortal church leaders as a learned scholar and holy leader. Even if they did leave his company feeling a little fatigued.\nA run in with the Golem of Prague in the Jewish Quarter sparked an obsession with Kabbalistic magic and uncovering the secrets of golemcraft in order to enhance his $pod_clan$'s knowledge of animating the lifeless. To this end, he developed a relationship with Josef Zvi (the lord of the Jewish Quarter, who later replaced the Ventrue as Prince of Prague). More horrifically, he began kidnapping innocent mortals clandestinely to experiment with his new theories.\n\nGarinol also contracted a debt to Christof Romuald for uncovering and stopping the plot of his childe Mercurio, a debt he repaid by asking his other childe, Serena, to accompany Christof.\n\nFuture fate in Canon\n\nUltimately, Garinol was forced to flee the Old World and set out for the New World in a bid to escape Final Death or $pod_diablerie$ by his clan-cousins, the Giovanni. His ship never arrived, however, and Garinol was lost to $pod_torpor$ at the bottom of the Atlantic Ocean, while the fish of the deep waters consumed his flesh."
 POD_investigate.desc.791061: "Known as a coterie of deluded misfits, the Bar Sinister is home to perhaps the most apparently out of place Setite.\n\nThe French Juliote de Sost, from the outside, looks like a fair rose stranded in the cold and harsh north. Juliote has precious little interest in power for herself, but she requires monies and resources if she is to succeed in her eventual goal of infiltrating one of the $pod_cainite$ French Courts. Juliote is blonde, ravishingly beautiful — a fact only enhanced by her mastery of Presence — and not at all above using her appearance, or any other advantage she might have, to obtain what she wants.\n\nFuture fate in Canon\n\nJuliote would be instrumental in the early successes of the Bar Sinister against Ulf's Hall, gathering intelligence, poisoning the village's well and seducing the local priest.\nShe would make the same mistake as the others however, thinking the last survivor of the mages, the apparently lowly apprentice Gunnar, to be an easy prey for their combined might.\nHer beheaded body reduced to ashes would be the result of said mistake."
 POD_investigate.desc.555040: "Born into the Basarab revenant family, Dragomir was always a touch unstable. An overly sensitive child, he seemed shaken by every rockslide and each cutting of nearby trees. As he was quite intelligent and looked upon his grandfather with great affection, his small aberration was overlooked as a natural connection of a ruler to his ancestral lands.\nIn actuality, Dragomir was experiencing a call from Kupala to enter the demon’s service.\n\nEducated as a knight and a voivode, Dragomir served his grandfather (an elder Tzimisce named Vintila Basarab) as a personal aide for several years. Finally, Vintila $pod_Embrace$d Dragomir and taught him several Tzimisce Disciplines. Once Embraced, however, Dragomir became ever more strange. His connection to the land led him down dark pathways toward madness. His mental illness became even more pronounced on Kupala’s Night.\nIn an attempt to cure him, Vintila tried to perform a special ritual one Kupala’s Night. It failed, leaving the elder Tzimisce exhausted and at the mercy of his crazed childe. Dragomir diablerized his [Glossary('Sire','game_concept_Sire_desc')], gaining in generation while his sire’s essence combined with his own to send him over the edge into full-blown madness.\n\nDragomir has existed since that time alone except for one ghoul, shut away from the world. Kupala has attempted to influence the young $pod_cainite$ to travel and spread the demon’s influence, but Dragomir’s guilt over his sire’s death prevents him from doing so.\n\nFuture fate in Canon\n\nDragomir grows more and more deranged during the early nights of the Sabbat and the reckless indulgence therein. Rather than let him compromise their plans (he develops an odious habit of shouting at the top of his lungs when speaking would suffice), several fellow Tzimisce throw Dragomir to the Inquisition."
 POD_investigate.desc.792064: "Felice de Berengar is an eighth-generation Lasombra connected by blood (either human or vampiric) to almost every noble house in the Languedoc, Aragon and Navarre. Her $pod_Embrace$ in 914 C.E. came after her visceral contempt for Christianity — and her consummate skill at hiding same — impressed a Magister in the court of Septimania. Her resentment of the Church stemmed from its denigration of women, and she delights in using her connections and formidable intellect to pervert its works for Heretical purposes.\nShe supervises the Pays de Cathars and Spain. At her suggestion, the Albigensian Cathars have allowed women a prominent role in their church, a development quite the reverse of what their theology’s sexual phobias might indicate."
 POD_investigate.desc.790474: "A master of the ephemeral arts of dreams and mind magic, Theresa did not realize the transformation of her house until she herself found her $pod_Embrace$d during a covenant in 1139. Knowing that her old House damned itself with its decision, she had to be blood bonded by the Council for sub-service.\nShe was sent to Greece to establish a chantry there, but when she had a terrible nightmare that showed her the diablerization of Saulot and the following ostracism of the Salubri, she left for Constantinople, where she was welcomed by Gesu and met the Salubri Achmet, who had sent her the dream visions she had experienced.\n\nExperimenting with the dreams and thaumaturgical rituals and paths, she became a member of the Dream Circle, hiding herself from Abetorius, who was sent as an envoy of Ceoris. To complete her development of the Path of Dreams, however, she eventually diablerized Achmet, when she lost her own soul to the perils of blood magic."
 POD_investigate.desc.791772: "Aisha was living a quiet life in Antioch, when Achmet the Dreamer wandered through on his extended tour of the region. As Achmet tells it, he recognized her inherent ability to heal and $pod_Embrace$d her. As other tells it, Achmet saw in her something he lacked; a thorough pleasure in helping and nurturing other people.\n\nHer relationship with Achmet changed drastically in 1133 when Tremere diablerized Saulot, causing Achmet to question his own purpose and methods. Nonetheless, Achmet and Aisha continued traveling until 1140, when the former decided to return to Constantinople. There he remains, dreaming as he searches for Golconda. Aisha concluded that her [Glossary('Sire','game_concept_Sire_desc')] betrayed God's calling. She has therefore broken with him and his Dream Circle in Constantinople and has made her way to Jerusalem.\n\nWhile she works her way among the ailing citizens of the city, she is also serving as a contact point for surviving Salubri. Essentially, she is running a Salubri underground, getting others of her $pod_clan$ to safe places and passing information and messages as people drift through the city. Salubri are directed toward safety, friends and trustworthy allies. After all, who bothers to make sure that a pilgrim leaves the city traveling in the same direction from which he entered?\n\nHowever, Jerusalem has too many $pod_cainites$, too many wagging tongues, for her to go unnoticed by the Tremere. In 1216, they found her.\nStill, she managed to save many of her brethren, at least for a while."
 POD_investigate.desc.710101: "A Persian $pod_cainite$ impressed by the tales of the then named Babylon-in-Egypt, Nabonidus came to seek its master, Agonistes, for mentorship. According to legend, the two quietly convened in Agonistes’ modest quarters inside the fortress, speaking in hushed tones long into the warm Egyptian night. At dawn, having talked of many things, Nabonidus offered to leave Babylon should his gracious host wish it. Agonistes declined, instead offering extended hospitality to his unlikely Persian guest, and in so doing, embarking on a partnership that would grow into something neither of them had ever dreamed.\n\nIn AD 450, Nabonidus left Babylon to return to his own homeland for the first time in nearly a thousand years. Things were simmering down in Egypt, and Nabonidus had urgent business to attend to back east.\n\nThe truth was that Nabonidus was a founding member of the secretive faction known as the Tal'mahe'Ra, specifically its Keepers of the Lore branch, and that the sect had entered a period of civil war. Nabonidus found himself overextended, his two childer left behind in Babylon unable to contain the Followers of Set. He thus choose to $pod_Embrace$ the renowned Antara to supervise the region in his stead. Despite several setbacks since then, Nabonidus continues to serve as a patient mentor to the often conflicted poet-warrior."
 POD_investigate.desc.795161: "One of the mightiest demons summoned by arrogant infernalists of the Roman Cult of Mercury, Nubarus is said to be the Grand Vizier of one of the infernal regions. Invoked during a botched ritual that saw the death of the summoners, he marked a common soldier, Valerius, as his anchor before leaving. Switching between an human and crow form while on Earth, he is known as a generous patron, granting powerful investments to those serving his cause.\n\nAround those equal to his station, he is the consummate politician. Around those below him, they are seen as servants to be dominated, be it by force or corruption. Everything he does is part of the structure building up to his ultimate goal. There is only one tier, the archdukes, above Nubarus' power and he dreams of the day he will ascent to this lofty group.\n\nFuture fate in Canon\n\nNubarus' anchor, Valerius, will be $pod_Embrace$d into clan Tremere. The demon will make the most of this opportunity, breaking Valerius' mind and making him a very useful tool to spread his cults to new frontiers."