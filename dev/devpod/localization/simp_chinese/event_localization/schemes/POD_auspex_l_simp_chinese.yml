l_simp_chinese:
 POD_auspex.100.t: "精神入侵"
 POD_auspex.100.desc: "[actor.GetTitledFirstName]正在尝试从你的脑海中获取你的秘密。利用他们对观占术的掌握，即使在很远的距离，他们也能撬开你的思想。幸运的是，这样的尝试很难说是隐秘的，你可以尝试抵制这种公然侵犯精神隐私的行为。"
 POD_auspex.100.option.a: "运用我的意志力去抵抗心灵攻击。"
 POD_auspex.100.option.b: "抵抗精神入侵。"
 POD_auspex.100.option.c: "接受精神入侵。"
 POD_auspex.200.t: "读心[recipient.GetFirstNameNoTooltip]"
 POD_auspex.200.desc: "是时候来入侵[recipient.GetTitledFirstName]的精神了，但是[recipient.GetSheHe]在抵抗。"
 POD_auspex.200.option.a: "激起血液来监视[recipient.GetHerHim]。"
 POD_auspex.200.a.tt_willpower: "[recipient.GetFirstNameNoTooltip]发挥了[recipient.GetHerHis]意志力来抵抗我的心灵能力。"
 POD_auspex.200.a.tt_fortitude: "[recipient.GetFirstNameNoTooltip]掌握着坚韧术$pod_discipline$并抵抗我的操控。"
 POD_auspex.200.a.success.desc: "成功"
 POD_auspex.200.a.tt_success: "[recipient.GetTitledFirstNamePossessive]的秘密将会为我所知！"
 POD_auspex.200.a.failure.desc: "失败"
 POD_auspex.200.a.tt_failure: "[recipient.GetTitledFirstName]抵抗了我心灵窥视的尝试。"
 POD_auspex.200.option.b: "激起血液，发挥我的意志。我的心灵会看到一切！"
 POD_auspex.200.option.b.tt.beast: "#beast [recipient.GetSheHe|U]必须被我的心灵威能所压垮！#!"
 POD_auspex.200.option.c: "放弃继续努力，我不再想要心灵窥视[recipient.GetHerHim]。"
 POD_auspex.200.option.c.tt: "心灵感应将失败。"
 POD_auspex.200.option.c.tt.beast: "#beast 如同猎物一样，我们瞎了！#!"
 POD_auspex.300.t: "[recipient.GetFirstNameNoTooltip]的心灵被攻破了"
 POD_auspex.300.desc: "我从[recipient.GetHersHis]心灵的低语中得知了[recipient.GetTitledFirstNamePossessive]的秘密。"
 POD_auspex.300.option.a: "正如其所应当。"
 POD_auspex.300.option.a.tt.beast: "#beast 现在，该用这美妙的知识做些什么？#!"
 POD_auspex.400.t: "你的心灵被攻破了"
 POD_auspex.400.desc: "在于意志之战输给了[actor.GetTitledFirstName]后，你的秘密现在被[actor.GetHerHim]所知晓。"
 POD_auspex.400.option.a: "我的心灵不再是我的庇护所"
 POD_auspex.500.t: "抵抗了心灵窥视"
 POD_auspex.500.desc: "[recipient.GetTitledFirstName]抵抗了我心灵窥视[recipient.GetHerHim]的尝试。"
 POD_auspex.500.option.a: "挫败！"
 POD_auspex.500.option.a.tt.beast: "#beast 让我们得到更多鲜血并再次尝试！#!"
 POD_auspex.600.t: "抵抗了心灵窥视"
 POD_auspex.600.desc: "[actor.GetTitledFirstName]已经放弃了[actor.GetHerHis]心灵入侵的尝试。"
 POD_auspex.600.option.a: "我的心灵属于我！"