l_simp_chinese:
 POD_murder_outcome.1001.t: "直视太阳"
 POD_murder_outcome.1001.desc: "杀死吸血鬼，就其核心而言，相当简单。太阳每次都会毫不费力地做到这一点。棘手的部分是，当上帝的光辉照耀这个世界时，要真正确保目标本身在外。\n对于这点，你选择了'拆除'的方法。如果屋顶本身在夜间被拆除，就不需要移动正在睡眠的吸血鬼。你只需要一些优秀的人能够在[target.Custom('PODDomicile')]里制造混乱来转移注意力，以便你的专业团队能够开始工作。\n会出什么问题呢？"
 POD_murder_outcome.1001.a: "经典，真的"
 POD_murder_outcome.1001.b: "现在还不是时候"
 POD_murder_outcome.2001.t: "直视太阳"
 POD_murder_outcome.2001.opening_1: "杀死吸血鬼，就其核心而言，相当简单。太阳每次都会毫不费力地做到这一点。棘手的部分是，当上帝的光辉照耀这个世界时，要真正确保目标本身在外。\n对于这点，你选择了'拆除'的方法。如果屋顶本身在夜间被拆除，就不需要移动正在睡眠的吸血鬼。你只需要一些优秀的人能够在[target.Custom('PODDomicile')]里制造混乱来转移注意力，以便你的专业团队能够开始工作。\n会出什么问题呢？\n\n如果可以的话，[target.GetTitledFirstName]应该感谢你，因为许多$pod_cainites$在$pod_Embrace$之后都梦想着再次见到太阳。好吧，也许不是想被它惊醒，伴随着尖叫和噪音，说不定还在想“我的屋顶去哪了？”。总之，没人说过亡生就不苦短了。"
 POD_murder_outcome.2001.owner_is_known_1: "\n\n不幸的是，你的一名手下在离开[target.Custom('PODDomicile')]之前被发现，手里拿着一块相当显明的屋顶碎片。他很快暴露了你在整个事件中的参与。"
 POD_murder_outcome.2001.no_awareness_1: "\n\n你的手下在[target.Custom('PODDomicile')]的其他人能够集结起来之前就早已离开了，没留下任何能让你入罪的证据。"
 POD_murder_outcome.2001.a.discovered: "是时候仔细检查我的屋顶了。"
 POD_murder_outcome.2001.a: "赞美太阳！"
 murder_outcome.5001.vampire_sun: "我是被肉体燃烧的气味唤醒的……就来自于我自己的肉体。太阳仍然高挂在天空，由于某种神秘的原因，我的屋顶似乎已经消失了。结果是快速但痛苦的。上帝的诅咒是不容玩弄的，我争先恐后地寻找一个避难所，因为我像一个活生生的火炬一样着火了。\n我疯狂的挣扎过晚了，我很快就变成了余烬。"
 POD_murder_outcome.4001.t: "直视太阳"
 POD_murder_outcome.4001.failure_declaration_1: "杀死吸血鬼，就其核心而言，相当简单。太阳每次都会毫不费力地做到这一点。棘手的部分是，当上帝的光辉照耀这个世界时，要真正确保目标本身在外。\n对于这点，你选择了'拆除'的方法。如果屋顶本身在夜间被拆除，就不需要移动正在睡眠的吸血鬼。你只需要一些优秀的人能够在[target.Custom('PODDomicile')]里制造混乱来转移注意力，以便你的专业团队能够开始工作。\n会出什么问题呢？\n\n"
 POD_murder_outcome.4001.failed_attempt_1: "你的手下能够创造一个让人分心的机会，但时间不足以让你的拆除小组在目标明显加固的屋顶上开一个洞。"
 POD_murder_outcome.4001.disastrous_attempt_1: "\n\n很快一些卫兵赶到了，他们抓住了你的一些手下，揭露了你在整个事件中的参与。"
 POD_murder_outcome.4001.unknown_so_far: "\n\n卫兵们出现时，你的人不得不快速逃离，但至少掩盖了你在这整个计谋中的参与。"
 POD_murder_outcome.4001.a: "这只是一次计划中的屋顶检查，我发誓！"
 POD_murder_outcome.4001.b: "这些日子你很难找到好的建筑师。"
 murder_outcome.5002.vampire_sun: "我是被肉体燃烧的气味唤醒的……就来自于我自己的肉体。太阳仍然高挂在天空，由于某种神秘的原因，我的屋顶似乎已经消失了。结果是快速但痛苦的。上帝的诅咒是不容玩弄的，我争先恐后地寻找一个避难所，因为我像一个活生生的火炬一样着火了。\n我的救赎在于附近的一个谷仓，在扑灭火焰后，我坐在一个黑暗的角落里。这不是一个很有尊严的方式来打发这一天，但这仍然意味着我至少可以暂时活下来。"
 POD_murder_outcome.1002.t: "猎人在猎"
 POD_murder_outcome.1002.desc: "有很多人喜欢杀吸血鬼，你甚至可以找到一些致力于这一事业的组织。他们的范围从单纯的烦扰到值得正视的为敌，但也许他们在今夜之事上也将有用。如果你向一些感兴趣的第三方透露你目标的[target.Custom('PODDomicile')]位置，你可以肯定会有事发生。\n这可能是一个不错的方法，既不至于牵扯太多，又能确保事成。谁说凡人对吸血鬼毫无用处？通过正确的引导，每个人都将有自己的位置……"
 POD_murder_outcome.1002.a: "我是一名傀儡大师"
 POD_murder_outcome.1002.b: "现在还不是时候"
 POD_murder_outcome.2002.t: "猎人在猎"
 POD_murder_outcome.2002.opening_1: "有很多人喜欢杀吸血鬼，你甚至可以找到一些致力于这一事业的组织。他们的范围从单纯的烦扰到值得正视的为敌，但也许他们在今夜之事上也将有用。如果你向一些感兴趣的第三方透露你目标的[target.Custom('PODDomicile')]位置，你可以肯定会有事发生。\n这可能是一个不错的方法，既不至于牵扯太多，又能确保事成。谁说凡人对吸血鬼毫无用处？通过正确的引导，每个人都将有自己的位置……\n\n一群训练有素的凡人似乎以某种方式追踪到了你目标的位置，并对[target.Custom('PODDomicile')]发起了全面攻击。\n他们只留下了燃烧的废墟和守卫的尸体，包括你的目标的尸体。这真是一场悲剧，他们就不感到可惜吗？"
 POD_murder_outcome.2002.owner_is_known_1: "\n\n不幸的是，其中一名猎人在逃跑过程中被抓获，并透露了你参与了“神奇”的[target.Custom('PODDomicile')]揭露……"
 POD_murder_outcome.2002.no_awareness_1: "\n\n由于猎人逃得一干二净，在这件事上没有什么能让你入罪。"
 POD_murder_outcome.2002.a.discovered: "我只是来帮忙！"
 POD_murder_outcome.2002.a: "向继承人们致以我的问候"
 murder_outcome.5001.vampire_hunters: "虽然来自猎人的袭击并不罕见，但这一次让你大吃一惊。没有任何前兆，没有他们中的一个人四处嗅探，试图找到你的[ROOT.Char.Custom('PODDomicile')]，只有突然而精确的攻击，仿佛他们早就知道……但你现在没有时间考虑太多，因为你的亡生正处于危险之中。\n尽管你尽了最大努力，但他们人数太多，组织得太好……而且他们似乎还拥有一些超自然盟友，这证实了有人在这次袭击幕后。但这为时已晚，你只能希望他们会在某夜为自己招来猎人而后悔。"
 POD_murder_outcome.4002.t: "猎人在猎"
 POD_murder_outcome.4002.failure_declaration_1: "有很多人喜欢杀吸血鬼，你甚至可以找到一些致力于这一事业的组织。他们的范围从单纯的烦扰到值得正视的为敌，但也许他们在今夜之事上也将有用。如果你向一些感兴趣的第三方透露你目标的[target.Custom('PODDomicile')]位置，你可以肯定会有事发生。\n这可能是一个不错的方法，既不至于牵扯太多，又能确保事成。谁说凡人对吸血鬼毫无用处？通过正确的引导，每个人都将有自己的位置……\n\n"
 POD_murder_outcome.4002.failed_attempt_1: "一群训练有素的凡人似乎以某种方式追踪到了你目标的位置，并对[target.Custom('PODDomicile')]发起了全面攻击。\n但即使这样也功亏一篑，坚固的[target.Custom('PODDomicile')]防御系统击退了这次袭击，使整个计划彻底失败。"
 POD_murder_outcome.4002.disastrous_attempt_1: "\n\n更糟糕的是，一些猎人被抓，并迅速透露了他们所知道的一切，包括你人脉的名字……"
 POD_murder_outcome.4002.unknown_so_far: "\n \n 至少，那些幸存下来的猎人能够逃脱，确保没有人能够知道你的参与。"
 POD_murder_outcome.4002.a: "我得自己一人干这些事情吗"
 POD_murder_outcome.4002.b: "说真的，凡人都很没用。"
 murder_outcome.5002.vampire_hunters: "虽然来自猎人的袭击并不罕见，但这一次让你大吃一惊。没有任何前兆，没有他们中的一个人四处嗅探，试图找到你的[ROOT.Char.Custom('PODDomicile')]，只有突然而精确的攻击，仿佛他们早就知道……但你现在没有时间考虑太多，因为你的亡生正处于危险之中。\n幸运的是，你[ROOT.Char.Custom('PODDomicile')]的防御措施固若金汤，甚至足以击退这袭击。这是一场艰苦的战斗，到处都有险情，但没有什么会让你败北。现在，去找出这背后的真相……"
 POD_murder_outcome.1003.t: "狼群在门"
 POD_murder_outcome.1003.desc: "即使像吸血鬼这样可怕的捕食者也会不时地成为猎物。令人恐惧的“狼族”或狼人就是这种情况，他们是凶猛的化形者，对吸血者有着深仇大恨。这是你可以利用的东西。\n通过泄露你的目标在森林地区附近即将出行的信息，你能确保他们的队伍会遭受袭击。然后，这些野兽的野蛮和可怕的战斗力可能足以为你解决这个问题。"
 POD_murder_outcome.1003.a: "放出战犬！"
 POD_murder_outcome.1003.b: "现在还不是时候"
 POD_murder_outcome.2003.t: "狼群在门"
 POD_murder_outcome.2003.opening_1: "即使像吸血鬼这样可怕的捕食者也会不时地成为猎物。令人恐惧的“狼族”或狼人就是这种情况，他们是凶猛的化形者，对吸血者有着深仇大恨。这是你可以利用的东西。\n通过泄露你的目标在森林地区附近即将出行的信息，你能确保他们的队伍会遭受袭击。然后，这些野兽的野蛮和可怕的战斗力可能足以为你解决这个问题。\n\n狼人对吸血鬼只剩下憎恨。即使是最微小的可杀迹象，也足以让他们准备对你的目标进行全面的伏击。\n正如预期的那样，这是场大屠杀。强大的野兽在短时间内解决了守卫，虽然你不知道[target.GetTitledFirstName]到底发生了什么，但你敢打赌，它是快速但血腥又痛苦的。"
 POD_murder_outcome.2003.owner_is_known_1: "\n\n不幸的是，在离家较近的地方，你的一位用于跟狼人打交道的中间人的手下被抓获，并透露了你对伏击的参与。"
 POD_murder_outcome.2003.no_awareness_1: "\n\n无论是你目标的继承人还是狼人本身，都没有任何关于你参与其中的线索。"
 POD_murder_outcome.2003.a.discovered: "我敌人的敌人……"
 POD_murder_outcome.2003.a: "好狗狗。"
 murder_outcome.5001.vampire_werewolves: "临近森林的旅途对吸血鬼来说是件危险的展望，因为那里有潜伏在树丛中并对你种族深恶痛绝的狼人和凶残的化形者。你采取了一切可能的预防措施来避免引起他们的注意，但这显然是不够的。当他们用獠牙和利爪击溃你的队伍时，你很好奇他们怎么会知道你的旅途路线？\n你或许永远不会知道答案，因为那些狼人轻易地压制住你的护卫队并接近了你。尽管你的力量无疑是强大的，但面对如此众多嗜血成性的杀手，你也无能为力。你将成为你们种族之间永无休止的战争中的又一位受害者。"
 POD_murder_outcome.4003.t: "狼群在门"
 POD_murder_outcome.4003.failure_declaration_1: "即使像吸血鬼这样可怕的捕食者也会不时地成为猎物。令人恐惧的“狼族”或狼人就是这种情况，他们是凶猛的化形者，对吸血者有着深仇大恨。这是你可以利用的东西。\n通过泄露你的目标在森林地区附近即将出行的信息，你能确保他们的队伍会遭受袭击。然后，这些野兽的野蛮和可怕的战斗力可能足以为你解决这个问题。\n\n"
 POD_murder_outcome.4003.failed_attempt_1: "狼人对吸血鬼只剩下憎恨。即使是最微小的可杀迹象，也足以让他们准备对你的目标进行全面的伏击。\n遗憾的是，尽管战斗很艰苦，你的目标还是设法从埋伏中开出一条路来，并在几天后的晚上重新出现在其的[target.Custom('PODDomicile')]，仍然保有亡生。看来要摆脱其还需要更多的努力。"
 POD_murder_outcome.4003.disastrous_attempt_1: "\n\n更遭的是，在离家较近的地方，你的一位用于跟狼人打交道的中间人的手下被抓获，并透露了你对伏击的参与。"
 POD_murder_outcome.4003.unknown_so_far: "\n\n无论是你目标的继承人还是狼人本身，都没有任何关于你参与其中的线索，令人安慰。"
 POD_murder_outcome.4003.a: "我敌人的敌人似乎是无用的。"
 POD_murder_outcome.4003.b: "坏狗狗！"
 murder_outcome.5002.vampire_werewolves: "临近森林的旅途对吸血鬼来说是件危险的展望，因为那里有潜伏在树丛中并对你种族深恶痛绝的狼人和凶残的化形者。你采取了一切可能的预防措施来避免引起他们的注意，但这显然是不够的。当他们用獠牙和利爪击溃你的队伍时，你很好奇他们怎么会知道你的旅途路线？\n不过你也是一股不可忽视的力量，当你的护卫队为保护你而死去时，你设法在战群中开辟出一条道路。接下来的夜里和日里，你在任何你能找到的偏远地方躲避阳光，最后才回到你的[ROOT.Char.Custom('PODDomicile')]。是时候了解在其后真正发生了什么……"
 POD_murder_outcome.1004.t: "归尘"
 POD_murder_outcome.1004.desc: "除了太阳，任何吸血鬼的最大天敌大概就是火。不过，无论尽多大的努力，躲避任何易燃物往往并不比躲避光线更难。因此，你正在考虑让你的目标的[target.Custom('PODDomicile')]陷入火中。\n你将需要手下来引起骚动，并需要足够的可燃物来确保所有东西都燃烧起来。这是一个粗暴的、简单而有效的可行解决方案，可以除掉该地方的任何东西。"
 POD_murder_outcome.1004.a: "给我找一些纵火狂！"
 POD_murder_outcome.1004.b: "现在还不是时候"
 POD_murder_outcome.2004.t: "归尘"
 POD_murder_outcome.2004.opening_1: "除了太阳，任何吸血鬼的最大天敌大概就是火。不过，无论尽多大的努力，躲避任何易燃物往往并不比躲避光线更难。因此，你正在考虑让你的目标的[target.Custom('PODDomicile')]陷入火中。\n你将需要手下来引起骚动，并需要足够的可燃物来确保所有东西都燃烧起来。这是一个粗暴的、简单而有效的可行解决方案，可以除掉该地方的任何东西。\n\n你下属中的一群分散了一些卫兵的注意力，而其他人则准备了火把和可燃物。很快，整个场地都在燃烧。\n你们的手下尽可能地呆了很久，报告说没有人从火狱里逃生，因为他们阻止了任何救援的到来。他们告诉你，从[target.Custom('PODDomicile')]下方传出了巨大的、野蛮的哭声。希望这是你最后一次听到[target.GetTitledFirstName]。"
 POD_murder_outcome.2004.owner_is_known_1: "\n\n不幸的是，你的一名手下在逃跑前被抓获，并被迫透露了你的参与。"
 POD_murder_outcome.2004.no_awareness_1: "\n\n你的手下顺利逃脱，隐瞒了任何可能将你与这个计划联系起来的证据。"
 POD_murder_outcome.2004.a.discovered: "我要在我的[ROOT.Char.Custom('PODDomicile')]每个地方都放满水！"
 POD_murder_outcome.2004.a: "尘归尘"
 murder_outcome.5001.vampire_fire: "火。你对这种变幻莫测的元素的本能恐惧唤醒了你的知觉，使你充分意识到你所处的可怕危险。不知何故，你的[ROOT.Char.Custom('PODDomicile')]在燃烧。是意外吗？晓得你有无数的敌人，大概不是。但现在不是考虑这个的时候。\n你竭力想从熊熊燃烧的火狱中找到一条出路，但无济于事。很快，你的心兽接手了，疯狂地跑到一个角落。无路可逃，赋予生命的火焰很快就会给你带来终焉之死。"
 POD_murder_outcome.4004.t: "归尘"
 POD_murder_outcome.4004.failure_declaration_1: "除了太阳，任何吸血鬼的最大天敌大概就是火。不过，无论尽多大的努力，躲避任何易燃物往往并不比躲避光线更难。因此，你正在考虑让你的目标的[target.Custom('PODDomicile')]陷入火中。\n你将需要手下来引起骚动，并需要足够的可燃物来确保所有东西都燃烧起来。这是一个粗暴的、简单而有效的可行解决方案，可以除掉该地方的任何东西。\n\n"
 POD_murder_outcome.4004.failed_attempt_1: "行动已以扎实的效率展开。你下属中的一群分散了一些卫兵的注意力，而其他人则准备了火把和可燃物。很快，整个场地都在燃烧。\n然而这还不够，你的手下很快就被记仇的[target.GetTitledFirstName]撕碎了，其设法找到了逃离熊熊大火的机会，逃到了城市深处。你输了这一轮。"
 POD_murder_outcome.4004.disastrous_attempt_1: "\n\n更糟的是，你的一名手下在逃跑前被抓获，并被迫透露了你的参与。"
 POD_murder_outcome.4004.unknown_so_far: "\n\n你的手下顺利逃脱，隐瞒了任何可能将你与这个计划联系起来的证据，令人安慰。"
 POD_murder_outcome.4004.a: "炽热复仇的开始？"
 POD_murder_outcome.4004.b: "显然，只是一个意外。"
 murder_outcome.5002.vampire_fire: "火。你对这种变幻莫测的元素的本能恐惧唤醒了你的知觉，使你充分意识到你所处的可怕危险。不知何故，你的[ROOT.Char.Custom('PODDomicile')]在燃烧。是意外吗？晓得你有无数的敌人，大概不是。但现在不是考虑这个的时候。\n在压力下保持坚强，你设法找到了一条离开火狱的路，没有受到太大的伤害。习惯性地松了（没必要的）一口气，你想知道在燃烧的废墟中是否能找到线索，了解其中到底发生了什么……"
 POD_murder_outcome.1005.t: "突如其来但意料之中的背叛"
 POD_murder_outcome.1005.desc: "在任何吸血鬼的藏身处里，总有一个薄弱环节。它可能是位想要被初拥的[ghoul|E]，或者是那个被打了太多次的从者，甚至是那个对从属于受诅的该隐之子有疑问的警卫。如果你能找到那个薄弱环节，那就只需要安排让吸血鬼的棺材见晨光即可。\n你对你的敌人的宫廷有一些洞察力，可能会用它们来开始这样的行动。"
 POD_murder_outcome.1005.a: "贿赂、哄骗或威胁他们"
 POD_murder_outcome.1005.b: "现在还不是时候"
 POD_murder_outcome.2005.t: "突如其来但意料之中的背叛"
 POD_murder_outcome.2005.opening_1: "在任何吸血鬼的藏身处里，总有一个薄弱环节。它可能是位想要被初拥的[ghoul|E]，或者是那个被打了太多次的从者，甚至是那个对从属于受诅的该隐之子有疑问的警卫。如果你能找到那个薄弱环节，那就只需要安排让吸血鬼的棺材见晨光即可。\n你对你的敌人的宫廷有一些洞察力，可能会用它们来开始这样的行动。\n\n大成功。你的内线从未被发现，之前他巧妙地派遣警卫去办事，并确保[target.GetTitledFirstName]直面日出。\n真简陋的计划，但有时这已经很足够了。"
 POD_murder_outcome.2005.owner_is_known_1: "\n\n不幸的是，你的目标的死亡回响传得很远，你的人还没来得及逃走就被抓住了。你被揭露是这个计划的幕后策划者。"
 POD_murder_outcome.2005.no_awareness_1: "\n\n理所当然的，你事后灭口了你的内线，确保没有人能够知道你参与了这个计谋。"
 POD_murder_outcome.2005.a.discovered: "我只是在帮忙，没别的！"
 POD_murder_outcome.2005.a: "如今世道很难找到好帮手"
 murder_outcome.5001.vampire_betrayal: "你正在死亡。\n这是当太阳照在你脸上时，你脑子里的第一个想法……并被变成一只活生生的火炬。你怎么会落到这种地步？\n然后你看到了他。那个卑微的守卫、从者……或者[ghoul|E]？在你被吞噬的时候，他带着满意的表情看着你。有人故意做的，有人帮助这个卑鄙的叛徒杀了你。而那个人现在可能正得意洋洋，享受着你灭于燃烧。"
 POD_murder_outcome.4005.t: "突如其来但意料之中的背叛"
 POD_murder_outcome.4005.failure_declaration_1: "在任何吸血鬼的藏身处里，总有一个薄弱环节。它可能是位想要被初拥的[ghoul|E]，或者是那个被打了太多次的从者，甚至是那个对从属于受诅的该隐之子有疑问的警卫。如果你能找到那个薄弱环节，那就只需要安排让吸血鬼的棺材见晨光即可。\n你对你的敌人的宫廷有一些洞察力，可能会用它们来开始这样的行动。\n\n"
 POD_murder_outcome.4005.failed_attempt_1: "这行动是一场灾难。你的内线笨手笨脚，而且意图太明显，导致他在接近你的目标之前就被阻止。"
 POD_murder_outcome.4005.disastrous_attempt_1: "\n\n更糟的是，他随后被抓，并透露了你对这一计谋的参与。"
 POD_murder_outcome.4005.unknown_so_far: "\n\n至少，他设法逃脱了。当他试图在你的宫廷避难时，你及时将他灭口了，掩盖了你的踪迹。"
 POD_murder_outcome.4005.a: "好吧，这只是个挫折"
 POD_murder_outcome.4005.b: "这些日子可不能信任任何人。"
 murder_outcome.5002.vampire_betrayal: "你的一位小侍从昨天出了个丑。在你睡觉的时候，他试图接近你，似乎，想把你带到太阳下。显然，你的卫兵在他造成任何伤害之前就阻止了他，但这引起了一个问题，他是自作主张吗？\n你可以想象，你的众多敌人中的一位在背后对你的亡生进行了微弱的阻碍……"
 POD_murder_save.0001.t: "$murder_save_header$防日"
 POD_murder_save.0001.desc: "杀死吸血鬼，就其核心而言，相当简单。太阳每次都会毫不费力地做到这一点。棘手的部分是，当上帝的光辉照耀这个世界时，要真正确保目标本身在外。\n对于这点，你选择了'拆除'的方法。如果屋顶本身在夜间被拆除，就不需要移动正在睡眠的吸血鬼。你只需要一些优秀的人能够在[target.Custom('PODDomicile')]里制造混乱来转移注意力，以便你的专业团队能够开始工作。\n会出什么问题呢？\n\n你的阴谋运作得非常好，太阳开始燃烧你的目标……但即使这样也不够。利用其强大的生理能力，[target.GetTitledFirstName]甩开了光线，取得足够长的时间找掩护。很快，卫兵们回来帮助其等的主子，整个事情到最后，是个巨大的失败。"
 POD_murder_save.0001.a: "我放弃"
 POD_murder_save.0001.b: "我要再试一次！"
 POD_murder_save.1001.t: "$murder_save_header$防日"
 POD_murder_save.1001.desc: "我是被肉体燃烧的气味唤醒的……就来自于我自己的肉体。太阳仍然高挂在天空，由于某种神秘的原因，我的屋顶似乎已经消失了。结果是快速但痛苦的。上帝的诅咒是不容玩弄的，我争先恐后地寻找一个避难所，因为我像一个活生生的火炬一样着火了。\n幸运的是，我对血之力的掌握足以帮助我忍受这种折磨，足以找到掩护。我的卫兵很快就到了我身边，危险也消失了……至少现在如此。这显然不是意外。"
 POD_murder_save.1001.a: "我会查到是谁做的！"
 POD_murder_save.1001.b: "幕后主使显而易见！"
 POD_murder_save.0002.t: "$murder_save_header$意外猎杀"
 POD_murder_save.0002.desc: "有很多人喜欢杀吸血鬼，你甚至可以找到一些致力于这一事业的组织。他们的范围从单纯的烦扰到值得正视的为敌，但也许他们在今夜之事上也将有用。如果你向一些感兴趣的第三方透露你目标的[target.Custom('PODDomicile')]位置，你可以肯定会有事发生。\n这可能是一个不错的方法，既不至于牵扯太多，又能确保事成。谁说凡人对吸血鬼毫无用处？通过正确的引导，每个人都将有自己的位置……\n\n一群训练有素的凡人似乎以某种方式追踪到了其的位置，并对[target.Custom('PODDomicile')]发起了全面攻击。\n遗憾的是，他们不是[target.GetTitledFirstName]可怕实力的对手，并被轻易消灭了。你的整个阴谋都是失败之作。"
 POD_murder_save.0002.a: "我放弃"
 POD_murder_save.0002.b: "我要再试一次！"
 POD_murder_save.1002.t: "$murder_save_header$意外猎杀"
 POD_murder_save.1002.desc: "虽然来自猎人的袭击并不罕见，但这一次让你大吃一惊。没有任何前兆，没有他们中的一个人四处嗅探，试图找到你的[ROOT.Char.Custom('PODDomicile')]，只有突然而精确的攻击，仿佛他们早就知道……但你现在没有时间考虑太多，因为你亡生正处于危险之中。\n不过你有足够的能力来处理这，很快这些猎人就只剩下非自愿的玩物了。而你知道如何粗暴地调教。"
 POD_murder_save.1002.a: "我会查到是谁做的！"
 POD_murder_save.1002.b: "幕后主使显而易见！"
 POD_murder_save.0003.t: "$murder_save_header$与狼共舞"
 POD_murder_save.0003.desc: "即使像吸血鬼这样可怕的捕食者也会不时地成为猎物。令人恐惧的“狼族”或狼人就是这种情况，他们是凶猛的化形者，对吸血者有着深仇大恨。这是你可以利用的东西。\n通过泄露你的目标在森林地区附近即将出行的信息，你能确保他们的队伍会遭受袭击。然后，这些野兽的野蛮和可怕的战斗力可能足以为你解决这个问题。\n\n狼人对吸血鬼只剩下憎恨。即使是最微小的可杀迹象，也足以让他们准备对你的目标进行全面的伏击。\n遗憾的是，这还不够，你的目标利用他们相当大的野性力量迷惑了狼人足够长的时间来寻找逃跑的机会。这个阴谋已经被挫败了。"
 POD_murder_save.0003.a: "我放弃"
 POD_murder_save.0003.b: "我要再试一次！"
 POD_murder_save.1003.t: "$murder_save_header$与狼共舞"
 POD_murder_save.1003.desc: "临近森林的旅途对吸血鬼来说是件危险的展望，因为那里有潜伏在树丛中并对你种族深恶痛绝的狼人和凶残的化形者裔。你采取了一切可能的预防措施来避免引起他们的注意，但这显然是不够的。当他们用獠牙和利爪击溃你的队伍时，你很好奇他们怎么会知道你的旅途路线？\n幸运的是，你掌控着一些强大的野性力量，使你能够迷惑狼人足够长的时间，使你能够找到逃生的机会。这仍然算得上是九鼎一丝。"
 POD_murder_save.1003.a: "我会查到是谁做的！"
 POD_murder_save.1003.b: "幕后主使显而易见！"
 POD_murder_save.0004.t: "$murder_save_header$防火"
 POD_murder_save.0004.desc: "除了太阳，任何吸血鬼的最大天敌大概就是火。不过，无论尽多大的努力，躲避任何易燃物往往并不比躲避光线更难。因此，你正在考虑让你的目标的[target.Custom('PODDomicile')]陷入火中。\n你将需要手下来引起骚动，并需要足够的可燃物来确保所有东西都燃烧起来。这是一个粗暴的、简单而有效的可行解决方案，可以除掉该地方的任何东西。\n\n行动已以扎实的效率展开。你下属中的一群分散了一些卫兵的注意力，而其他人则准备了火把和可燃物。很快，整个场地都在燃烧。\n不过还不够快，不足以让你的目标真正受难。利用其相当强大的能力，其设法抵挡火势，在太晚之前迅速逃离火狱。这个计划没有成功。"
 POD_murder_save.0004.a: "我放弃"
 POD_murder_save.0004.b: "我要再试一次！"
 POD_murder_save.1004.t: "$murder_save_header$防火"
 POD_murder_save.1004.desc: "火。你对这种变幻莫测的元素的本能恐惧唤醒了你的知觉，使你充分意识到你所处的可怕危险。不知何故，你的[ROOT.Char.Custom('PODDomicile')]在燃烧。是意外吗？晓得你有无数的敌人，大概不是。但现在不是考虑这个的时候。\n不过，利用你相当强大的生理能力，你能够抵御火势，足以逃离燃烧的火狱。不过，这仍然算得上是千钧一发。"
 POD_murder_save.1004.a: "我会查到是谁做的！"
 POD_murder_save.1004.b: "幕后主使显而易见！"
 POD_murder_save.0005.t: "$murder_save_header$预期中的背叛"
 POD_murder_save.0005.desc: "在任何吸血鬼的藏身处里，总有一个薄弱环节。它可能是位想要被初拥的[ghoul|E]，或者是那个被打了太多次的从者，甚至是那个对从属于受诅的该隐之子有疑问的警卫。如果你能找到那个薄弱环节，那就只需要安排让吸血鬼的棺材见晨光即可。\n你对你的敌人的宫廷有一些洞察力，可能会用它们来开始这样的行动。\n\n好吧，这并不奏效。[target.GetTitledFirstName]不知为何似乎预见了即将发生的背叛，也许是由于其相当强大的预言能力。你的手下甚至在他真正将计划付诸实施之前就被阻止了。所有这些都白费了。"
 POD_murder_save.0005.a: "我放弃"
 POD_murder_save.0005.b: "我要再试一次！"
 POD_murder_save.1005.t: "$murder_save_header$预期中的背叛"
 POD_murder_save.1005.desc: "在你相当强大的预言能力的警告下，你得以知道一个针对你的亡生的阴谋。你的一个小侍从计划在你睡着时移动你，让你直面太阳，大概率的杀死你。\n你处理了他，但这个阴谋的背景显然比一个心怀不满的奴才更深……"
 POD_murder_save.1005.a: "我会查到是谁做的！"
 POD_murder_save.1005.b: "幕后主使显而易见！"
 POD_murder_save.0006.t: "$murder_save_header$完美胜利"
 POD_murder_save.0006.desc: "雇佣刺客，虽然本身不是一个坏主意，但可能从一开始就是一个注定失败的计划。面对[target.GetTitledFirstName]这样的强者，再多的准备工作也是不够的。尽管出其不意，而且计划执行得很仔细，但刺客们还没来得及造成任何伤害就被轻易地宰了。\n看来你需要的不仅仅是蛮力。"
 POD_murder_save.0006.a: "我放弃"
 POD_murder_save.0006.b: "我要再试一次！"
 POD_murder_save.1006.t: "$murder_save_header$完美胜利"
 POD_murder_save.1006.desc: "今晚有几个傻瓜想杀你。好吧，他们现在已经死了，因为你用你强大的实力轻松处理了他们。\n这仍然引出了疑问，谁策划了这次袭击？其的下一次袭击可能就不那么容易对付了……"
 POD_murder_save.1006.a: "我会查到是谁做的！"
 POD_murder_save.1006.b: "幕后主使显而易见！"
 POD_murder_save.0007.t: "$murder_save_header$迷人魅力"
 POD_murder_save.0007.desc: "你的谋杀阴谋有了潜在的突破口。你的目标即将前往一个人口稠密的地区，而你的探员报告说，这个地区的凡人已经接近崩溃的边缘。耳边的一些话语和手中的贿赂可能会引发一场非常动荡的暴乱。\n\n这想法本可能很有效……如果[target.GetTitledFirstName]不是一位如此熟练有素的精神系法术修炼者的话。他们很容易让人群回到自己身边，迅速处理任何敌意，毫发无损地回到其的宫廷。\n太有魅力而不能死于这，真正意义上的。"
 POD_murder_save.0007.a: "我放弃"
 POD_murder_save.0007.b: "我要再试一次！"
 POD_murder_save.1007.t: "$murder_save_header$迷人魅力"
 POD_murder_save.1007.desc: "今晚发生了一个小事件，该地区的凡人因某些事……或某些人挑拨而反抗你。利用你相当强大的精神力量，你轻松地对付了他们，但煽动者的问题仍然存在。\n如果这是某种阴谋，他们的下一次袭击可能比这一次更危险。"
 POD_murder_save.1007.a: "我会查到是谁做的！"
 POD_murder_save.1007.b: "幕后主使显而易见！"
 POD_murder_save_physical: "该谋杀方式不太可能突破过强的物理防御，例如高阶坚韧术。"
 POD_murder_save_perception: "该谋杀方式不太可能突破过强的感知防御，例如高阶坚韧术。"
 POD_murder_save_fighter: "该谋杀方式不太可能对过强的高勇武斗士起作用。"
 POD_murder_save_charisma: "该谋杀方式不太可能突破过强的魅力防御，例如高阶威仪术。"
 murder_outcome.5001.a: "永恒的终结。"