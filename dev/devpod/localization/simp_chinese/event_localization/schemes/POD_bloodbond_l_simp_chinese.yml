l_simp_chinese:
 POD_bloodbond.100.t:0 "血之束缚"
 POD_bloodbond.100.desc:0 "[schemer.GetTitledFirstName]试图血缚你。"
 POD_bloodbond.100.option.a:0 "运用我的意志力去抵抗血缚。"
 POD_bloodbond.100.option.b:0 "抵抗血缚。"
 POD_bloodbond.100.option.c:0 "接受血缚。"
 POD_bloodbond.200.t:0 "血缚[target.GetFirstNameNoTooltip]中"
 POD_bloodbond.200.desc:0 "计谋对[target.GetTitledFirstName]血缚，但是[target.GetSheHe]在抵抗。"
 POD_bloodbond.200.option.a:0 "我将压制[target.GetHerHim]，强迫[target.GetHerHim]饮用我的血"
 POD_bloodbond.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip]发挥了抵抗血缚的决心。"
 POD_bloodbond.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip]掌握着坚韧术[discipline|E]并抵抗了我的操控。"
 POD_bloodbond.200.a.success.desc:0 "[target.GetTitledFirstNameNoTooltip]将被你血缚"
 POD_bloodbond.200.a.failure.desc:0 "[target.GetTitledFirstNameNoTooltip]抵抗了你对[target.GetHerHim]的血缚尝试"
 POD_bloodbond.200.option.b:0 "激起血液催动我的意志。我不受拒绝！"
 POD_bloodbond.200.option.b.tt.beast:0 "#R [target.GetSheHe|U]必须得爱我们！#!"
 POD_bloodbond.200.option.c:0 "放弃继续努力，我不再想要血缚[target.GetHerHim]。"
 POD_bloodbond.200.option.c.tt:0 "血缚将会失败。"
 POD_bloodbond.200.option.c.tt.beast:0 "#R 我们应该获得鲜血，而不是付出！#!"
 POD_bloodbond.300.t:0 "[target.GetFirstNameNoTooltip]被血缚了"
 POD_bloodbond.300.desc:0 "[target.GetTitledFirstName]已经被我血缚了。"
 POD_bloodbond.300.option.a:0 "正如其所应当。"
 POD_bloodbond.300.option.a.tt.beast:0 "#R 现在，应该对他们做些什么？#!"
 POD_bloodbond.400.t:0 "你被血缚了"
 POD_bloodbond.400.desc:0 "在喝下[schemer.GetTitledFirstName]的血后，你被[schemer.GetHerHim]血缚了。"
 POD_bloodbond.400.option.a:0 "我将遵照[schemer.GetHerHis]的意志。"
 POD_bloodbond.500.t:0 "抵抗了血缚"
 POD_bloodbond.500.desc:0 "[target.GetTitledFirstName]已经抵抗过我血缚[target.GetHerHim]的尝试。"
 POD_bloodbond.500.option.a:0 "挫败！"
 POD_bloodbond.500.option.a.tt.beast:0 "#R 让我们得到更多鲜血并再次尝试！#!"
 POD_bloodbond.600.t:0 "抵抗了血缚"
 POD_bloodbond.600.desc:0 "[schemer.GetTitledFirstName]放弃了[schemer.GetHerHis]血缚你的计谋。"
 POD_bloodbond.600.option.a:0 "我不会成为[schemer.GetHerHis]的血奴！"
 POD_bloodbond.200.tt_unswayable_mind_perk:0 "[TARGET_CHARACTER.GetShortUINameNoTooltip]的[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]能力降低了你的成功概率"