 POD_podlore.100.desc.POD_fae_character_203: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。费德利米德成为了梅因·阿特拉迈尔（“如同他的父亲”）。"
 POD_podlore.100.t.POD_fae_character_203: "民间传记：费德利米德"
 POD_podlore.100.desc.POD_fae_character_204: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。凯布尔成为了梅因·马斯拉米尔（“如同他的母亲”）。"
 POD_podlore.100.desc.POD_fae_character_205: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。欧凯德成为了梅因·安多（“迅速”）。"
 POD_podlore.100.desc.POD_fae_character_206: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。欧凯德成为了梅因·塔伊（“寂静”）。"
 POD_podlore.100.desc.POD_fae_character_207: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。瑟特成为了梅因·莫尔戈（“伟大的义务”）。"
 POD_podlore.100.desc.POD_fae_character_208: "\n该角色源自民间传说，且无既定官方命运。\n梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。塞恩成为了梅因·米尔斯科塔奇 （“甜言蜜语”）。"
 POD_podlore.100.desc.POD_fae_character_209: "梅芙和艾力有七个儿子，都叫梅因。他们原本都有其他名字，但当梅芙向一名德鲁伊询问她哪一名儿子会杀死康纳尔时，对方回答“梅因”。由于梅芙没有一名儿子叫做梅因，所以她为七个儿子分别赐予新名字。戴瑞成为了梅因·莫埃皮特（“不可名状”）。"
 POD_podlore.100.desc.POD_fae_character_210: "艾力和梅芙的女儿。作为女儿，她不属于德鲁伊关于梅芙的哪个儿子将杀死康纳尔的预言。因此，她没有被重新命名为“梅因”。她名字的字面翻译意思是“白色幻影”。她的母亲梅芙将她用作可能给予任何愿意对抗库丘林之人的奖品。在他被杀后，梅芙也利用她来吸引与其他领主的联盟。\n这个角色基于民间传说，没有已知的原著命运。\n她最后且或许是真心爱慕的对象，罗哈德·麦克·费赫曼，在最后一场大战前加入了阿尔斯特的军队。为了说服他不与康诺特作战，梅芙利用女儿的感情达成了休战协议。芬娜薇与罗哈德共度一夜，最终这个消息传到了芒斯特七位国王耳中——他们也都曾被许诺以芬娜薇换取他们的效忠。他们向艾力的儿子们抱怨，导致了一场战斗并最终造成700人被杀。芬娜薇听闻自己如何被利用以及如此多的人因她而死，羞愤而死。“因此有了芬娜薇·斯莱比这个名字，即山上的芬娜薇。”"
 POD_podlore.100.desc.POD_fae_character_250: "拉格内夫与八字胡斯温之子的两世纪后，他决定尝试统治凡人。被称为克努特大帝的他，统治着英格兰、丹麦及挪威组成的北海帝国，直至公元1034年。为统治这些近期（按妖精纪年）皈依基督教会的民众，克努特学习了该信仰的仪式与教义。他过分效仿虔诚者，最终加入了君士坦丁的事业，尽管带着\"凛冬\"特有的诠释，作为一心征服的维京掠夺者之王。其皈依时刻记载于《克努特与潮汐》的故事中：国王将王座置于海岸边，命令上涨的潮汐停止，不得沾湿他的双脚与王袍。为此他施展强力魔咒，而在真正信徒眼前……他的魔法动摇了。潮汐如常继续上涨，无视其王室身份冲刷他的双脚与腿。克努特向后跃起说道：\"让世人皆知王权何等虚妄无谓！因除却那位以永恒律法统御天、地与海者，无人配得此名。\"随后他将金冠悬挂于十字架，永不再佩戴\"，以礼敬全能的上帝之王\"。厌倦掠夺与凡人统治后，他假死并回归阿萨世家，将君士坦丁信仰传播至先祖之族。"
 POD_persistentpodlore.1.t: "传记：[target.GetFirstNameNoTooltip]"
 POD_persistentpodlore.1.desc: "[Localize(Concatenate('POD_persistentpodlore.desc.',target.GetHistoryId))]"
 POD_persistentpodlore.desc.793278: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n贯穿蒙古历史，其众多无足轻重的成员被流放至邻国乃常态。对多数人而言，被逐出家园是可怕之事。但对巴特巴雅尔而言，他再欣喜不过。巴特巴雅尔自幼对艺术怀有深切热爱。从制弓与箭羽制作起步，他宁可将时间用于编织挂毯与雕刻而非狩猎。如此沉浸艺术，以致当部族遇袭、一名战士闯入其蒙古包欲杀他时，他因醉心手艺竟浑然未觉战役已败。他成功逃脱，向西南逃往伊朗高原。彼处，他痴迷于当地艺术品，热切磨砺工匠技艺。正是于此，他引起哈基姆圣裔注目，作为维齐尔一员被纳入其阵营。\n\n巴特巴雅尔是攫住维齐尔们的创作狂热的写照。然如今其作品遭破坏。随着蒙古人深入伊朗，某些将领带来的毁灭令他惊骇。更甚者，[Glossary('安答','podgloss.anda')]随其阴影而至。巴特巴雅尔憎恨其进军，欲保护那些伟大作品。故他决心代表氏族坚守战线，宁死不让[Glossary('安答','podgloss.anda')]摧毁他长久竭力守护之作。"
 POD_persistentpodlore.desc.793279: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n无论生前还是死后，纳夫尼特与道路都是紧密的朋友。她生于向西迁徙的印度达利特流亡者中，阿格拉亚是其族群中首批目睹君士坦丁堡城墙者。立遭敌视并被急切铐锁，若非有位女子夤夜相迎，邀她探讨哲学，纳夫尼特本计划与族人逃往欧洲内陆深处。尽管漂泊于途，纳夫尼特渴望故土。她企盼一方天地，让家族能畅快自由呼吸，无枷锁无重负。她描述梦想之境，悲叹若得力量必将此愿化为现实\n当纳夫尼特言说其完美世界时，那女子认定她将成为完美的布鲁赫。\n\n自被初拥以来，纳夫尼特频繁迁徙，寻求可建立族人希望之地；此愿景经其尊长所述迦太基乌托邦淬炼而明晰。然蒙古帝国崛起后，她窥见机遇。她视草原深处为潜在净土，欲融合迦太基与梦想庇护所，为终将得名罗姆之民筑造天堂。"
 POD_persistentpodlore.desc.793280: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n傅生于汉朝庆阳，自幼好学，而后致力投身仕途，渴望为汉效力来赢得声名与荣耀。他的辉煌时刻源于楼兰王安贵暗杀数名外交使节。彼时傅只是马厩仆役，却被选中前往刺杀国王。然而他另辟蹊径，以礼物诱醉安贵，趁机令其护卫处决国王。因功受封爵位，傅甚为自豪，专心治理新职务。\n但其心底仍有所牵挂，他怀念读书时光。虽已成名，仍觉不满足，渴望学问长进。\n机缘巧合，他遇见一位夜半来访、身披厚袍讲述生死之道的知音。在生命末年，二人结为挚友。当他渐渐衰老，那位旅者赠予他礼物，使他得以以另一种形态重续前生之缘。傅欣然接受，遂被初拥为一位卡帕多西亚。\n\n此后，傅以钻研学问为乐。然而，随着蒙古铁骑逐渐南下，死者骤增，傅誓要有所作为。蒙古军的行径令他忆起曾经的楼兰，他深知对亡者的扰动祸害深重，于是决定挺身而出。毕竟，他不愿再做书呆子。毕竟，若会轻易被杀，身为继王又有何益？"
 POD_persistentpodlore.desc.793281: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n生于跨越乌拉尔山脉的行军途中，铁木伦天生体弱多病且瘦小。自出生起，他在草原的生活便是持续挣扎。始终病弱，公开遭同伴厌弃，铁木伦的人生始终处于边缘，并遭大家族其余成员公然嘲笑。当家族参与劫掠欧洲的队伍时，他常因身体过弱无法正常使弓，故在此类征伐中被视作废物。\n然某次侵袭中，他们误攻了错误的教堂。当夜，教堂在黑暗中爆炸，吞噬其中所有人。铁木伦竭力奔逃，那夜成为他生命中最糟且最后的时刻。纵无可能生还，他仍如既往直面，于绝境中挣扎，拒绝屈服等死。此态令袭击者动容，遂将铁木伦纳入勒森魃。\n其教化仅强化了铁木伦的生存意志及恨意。最甚者，他憎恨那始终视其为弱者的体系。而今他已然强大。于凡人眼中他如神明，并沉醉于此刻对其拥有的客观优越性。他贪恋置于头顶的黑暗冠冕，唯求使之永恒，向所有曾弃他者昭示己强。"
 POD_persistentpodlore.desc.793282: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n在妥芮朵中，诸多艺术形式为其所护。挂毯、音乐、雕塑、绘画、乐器、建筑及无数物质与情感艺术皆属寻常。然奥特根巴雅尔视优良繁育的动物为远胜绘画之美。\n凡人时期，奥特根巴雅尔乃其氏族马匹与牲畜之主照料者。每次配对皆由其择定，目睹氏族牧群于数代动物间改良，她深感满足。其纯种马如此卓越，以致于城市贸易途中，某个夜幕中的人影因醉心其作，不忍任此艺术家在创造杰作前逝去。\n总体而言，初拥未使奥特根巴雅尔改变多少，因如今她有永恒时光完善其科学与艺术。其牧群属世间至臻，经数世纪管控配对以育完美后代。然当其凝视完美牧群，她欲迈入下一阶段。她回望周遭人类，思索着，或许于此纷争之世，同类之事亦可施于人……"
 POD_persistentpodlore.desc.793283: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n作为塞奥里斯石像鬼巢穴较晦涩的造物之一，德尔塔与同批石像鬼组成群体，奉睿魔尔之命东行调查蒙古人。然旅途中，其睿魔尔监管者遭逢终焉之死，德尔塔遂率群体避入乌拉尔山脉获得安全，继而东飞。\n如今挣脱血缚携誓伴逃亡，德尔塔妒守新获的自由。草原的夜幕世界混沌，其独擅凭双翼与遁地之能存身此域。然而更加害怕的是，睿魔尔寻此失落群体，即使觅得亦属徒劳。故她妒守共享庇护所，他们共同狩猎永不分离。当[Glossary('安答','podgloss.anda')]之乱迫近，她被迫抉择：\n要继续隐藏？抑或筑就长久存续之物以自护？"
 POD_persistentpodlore.desc.793287: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n作为塞奥里斯石像鬼中较晦涩的存在之一，欧米茄是尤为奇异的造物，因超越其理解之由与德尔塔配对。随其战群东遣时，睿魔尔监管者死于蒙古干预令其自由，因无处可去，她紧附德尔塔深入草原。  \n欧米茄乃其战群之心，更是全组对德尔塔最狂热忠诚者。德尔塔不单是石像鬼巢穴中欧米茄的保护者，更容她近身。欧米茄虔诚，且在血缚缺失下更深入德尔塔怀抱，以求其提供的明晰与庇护。  \n然而欧米茄忧其战群。当[Glossary('安答','podgloss.anda')]及草原该隐子嗣环伺，欧米茄恳求德尔塔筑一藏身之所而不用如牲畜般匿迹，而像旧主人那样统御。她渴望见冠冕加于德尔塔之首，并愿为战群首领倾尽所有。唯盼德尔塔同怀此愿。  "
 POD_persistentpodlore.desc.793289: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n贾延德拉生于印度诡谲之时。作为帕罗帕米萨代的沙什古普塔之子，他目睹家园遭西方而来异常成功且癫狂的征服者威胁。然而其父对亚历山大犹疑不定时，贾延德拉早知其必为祸端。违父所愿，他即刻率部抗希腊军，袭击亚历山大缺席之处。多战告捷，然当其势如破竹，一夜忽遭可怖疯兽伏击，以骇人魔法与狂乱击溃其军。贾延德拉拒逃，反冲锋穿地狱火与疯癫洪流，其击未中，反被击倒。\n若非贾延德拉打动旁观的另一存在，他本应毙命。\n\n初拥贾延德拉之人立即使他的技艺效力。身为外交官兼将领，他于永恒战争屡战屡胜，然其不服管束常与尊长争执。故当大蒙古国扩张及[Glossary('Anda','podgloss.anda')]进军之讯传至剎帝利，查古拉普夏遣贾延德拉为使兼军事顾问。\n对于贾延德拉来说，这最好不过，因他渴求改变对抗鬼人之节奏。他希望于现在学习新的策策，热切期待风向所指。"
 POD_persistentpodlore.desc.793290: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n次仁出生在青藏高原的一个小村庄，按任何标准都注定度过平凡一生，每天重复相同的生活。但即使在小时候，她骨子里的叛逆性格就非常明显，正是这股劲头最终永远改变了她的命运。\n她从小东西开始偷起，比如妈妈的头绳和村长的鞋子，后来胆子越来越大。直到干了一票最大的：她溜进一座被认为是废弃的寺庙，偷走了一块由老人看守的玉符。结果那老人当场变成恶魔，她只能拼命逃跑。躲回村里刚松口气，魔鬼们就冲进村子找她。于是她用尽盗贼本事逃回荒野，却被一个早就盯上她这票买卖的人拦住了。\n这个同行盗贼提出训练她，让她变得超乎想象的厉害。次仁全心接受，最终成为了武瞾萨洛比盗贼的一员。\n\n次仁擅长这行，也热爱这行。变成吸血鬼后，她追求越来越大的\"买卖\"，每次都要超越前一次。现在她把目标锁定蒙古，因为她从没偷过王座，而[Glossary('Anda','podgloss.anda')]正在横扫世界。也许是时候干票新的大案，一次更胆大包天的行动了。\n毕竟，还有什么比王座更值钱呢？"
 POD_persistentpodlore.desc.793291: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n无论怎么看，姜都该是历史中的小人物。她生在东汉王朝衰败崩溃的年代，亲眼目睹并亲身经历了帝国崩塌下的生活。军阀榨干了她村庄的所有粮食，当她的父兄被迫当土匪求生时，又被军阀抓住处死。村民们抗议屠杀，拼命强调他们从没抢劫过领主，结果军阀直接放火烧光了整个村子。幸存者寥寥无几，江是其中之一。这场惨剧彻底激怒了她，她决心摧毁那些害她家破人亡的军阀和整个腐朽王朝。\n\n她和结义姐妹郑一起起事。但她们势力弱小，唯一出名之处就是女人当土匪头子。当她们被曹操的军队击败后，很快就被判了死刑。\n但有双眼睛一直盯着她们。在经历了狱卒的残酷折磨后，江被一声尖叫惊醒，一个三眼人打开了她的牢门。这个叫曌学的家伙靠近她，将她初拥进了武瞾一族。但姜怒火中烧：这个装腔作势的小偷竟敢教训她！是他杀了她，还在她被折磨时袖手旁观，放任世间一切罪恶发生！\n一有机会，她就和同样被转化的郑逃入黑夜。流浪途中，她们遇见另一个游荡者，此人宣扬的理念正合她们心意：建立一个没有神明也没有主人的世界。三人立下血誓，要让她们新创的血系实现这乌托邦。\n无论前路如何，姜都将为她的革命奋斗到底。不惜任何代价。"
 POD_persistentpodlore.desc.793292: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n混乱催生变革，这是郑从动荡人生中领悟的真谛。东汉末年，她出生在华北小村庄，靠打猎尽力养活乡亲，而当地军阀却榨干了村子的一切。但厄运终究降临：部分村民为求生当了土匪，引发连锁惨剧。某天郑打猎归来，撞见村民逃往深山，翻过山丘却看见村庄在燃烧。惊恐与愤怒中，她决心挽弓复仇，不惜代价为毁灭的家园讨公道。于是她加入幸存者姜的队伍，投身反抗朝廷的激战。\n尽管郑熟悉地形，但她们这支土匪小队根本敌不过曹操日益壮大的势力。兵败被俘后，郑被判死刑。内心彻底崩溃的她，像机器般麻木地度过最后几天。某夜遭遇狱卒暴行后，一个三眼人闯进牢房，更让郑恐惧的是，这人杀死她后又将其变成吸血鬼复活。\n郑陷入前所未有的恐惧：她求死不得，家园覆灭，事业粉碎，连生命都被剥夺。而凶手竟称这是\"恩赐\"，还因她的悲愤惩罚她！于是她与生前挚友姜，趁夜逃亡，拼命寻找能填补内心空洞的东西。直到遇见那个来自日本的流浪者，此人追求黑夜中没有主子的社会，她才重燃生命之火。如今她誓要让这火焰永不熄灭。"
 POD_persistentpodlore.desc.793293: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n萨蒂是拉克坦骑手和俄罗斯俘虏的女儿，生来平凡，注定过着普通生活。部落因她的血统对她傲慢苛刻，但相比战乱草原上更悲惨的命运，她对自己的生活还算满意。\n一切在瞬间改变：一个俄罗斯梵卓为\"获取情报\"派兵入侵她的家园。突袭中萨蒂被俘，并获得了不怎么光荣的殊荣，因母亲缘故能说蹩脚俄语，她被选中接受初拥，为她的不死族女主人讲解部落文化。\n萨蒂照做了几年，很快被尊长遗忘，对方本就没打算培养她。当某夜她离开时，无人阻拦甚至无人察觉。\n\n尽管对吸血鬼事务知之甚少，年轻的梵卓明白俄罗斯乃至更西边遍布比她尊长更强的怪物。她想起小小的拉克坦部落似乎从未有过吸血鬼，于是决心寻亲。在熟悉且无同类的环境中生活，似乎是最佳选择。\n\n出乎意料的是，计划相当顺利。她找到部落残部，运用新能力轻松回归。\n随后的岁月里，萨蒂首次开始享受\"人生\"（或者说死后生活）：用影响力壮大部落，抵御外敌，并约束部落的恶劣习气。\n\n当随着蒙古大军的[Glossary('Anda','podgloss.anda')]部族派使者要求小部落（包括她的）臣服或死亡时，萨蒂多年来首次与其他不死族领主交涉。她做出唯一理智的选择：向强权屈膝，使族人免遭毁灭。\n如今她在草原的角落静静等待，期盼与族人熬过这场风暴。"
 POD_persistentpodlore.desc.793294: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n阿兰生于纯净水源之地，在不儿罕合勒敦山长大。她本是个普通姑娘，唯独因绝世美貌和过人智慧在部落中闻名。经历过两次婚姻，育有五个常互相争吵的儿子。为防儿子们自相残杀或孤独死去，她设宴让儿子们挨个折断单支箭。待他们完成后，又递上五支捆紧的箭让他们折断。儿子们失败后，她点明了团结的重要，这个教诲被儿子们铭记于心，后来他们成为蒙古民族的先祖，正如《蒙古秘史》记载的那样。但还有位听众也听进了这个道理。\n\n[Glossary('Anda','podgloss.anda')]的耶西拉找到阿兰，问她是否愿用智慧在黑夜中守护子孙血脉，换取他们在白昼的保护。身为母亲，阿兰视此为至高荣耀，便加入[Glossary('Anda','podgloss.anda')]。在这里她找到了愿为之奉献身心的事业：每个行动、每次抉择都为守护子孙家族。后来她更成为多布鲁的贴身护卫，成为草原上连暗夜生物都畏惧的幽灵。\n她无所畏惧，享受夜空，为后代谋求更伟大的未来。她创立了黑风先锋，这支[Glossary('Anda','podgloss.anda')]战士团将成为所有侵害蒙古的恶魔的克星。\n\n未来命运：阿兰屡战屡胜，却输掉了整场战争。当[kuei_jin|E]突袭多布鲁长眠地时，她因深陷[kuei_jin|E]领地无力救援尊长。\n她拒绝赴死，带着黑风先锋逃往西伯利亚，从此销声匿迹，只留下悚然传闻：当第六纪元降临，她将重回多布鲁身侧。"
 POD_persistentpodlore.desc.793295: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n万物终逝，迪莱对此深有体会。\n\n她作为马萨格泰人的萨满长大，比常人更通晓超自然世界。波斯与马萨格泰的战争阴影下，她在宫廷的职位让她目睹无数秘密与恐怖。但迪莱直面恐惧，当刺客袭击女王时，她将树枝刺穿对方胸膛，并饮其血获力。白日为祭司，黑夜化杀手，她竭力铲除潜入国境的刺客，却终究寡不敌众。\n因在宫廷失宠，她被流放草原。在迪莱绝不向屈辱低头的抗争中，引起了阿兰的注意，就在迪莱即将死于荒野之际，遂被初拥。\n\n当阿兰赋予她向嗜血怪物永恒复仇之力时，迪莱抓住机会立誓：定让啜饮心头血者自食恶果。加入黑风先锋后，伊朗的刺客与审判者将在无尽苍穹下直面重生战士女王，此地便是他们的葬身之所。"
 POD_persistentpodlore.desc.793296: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n许多冈格罗自称荒野大师，但极少有人像维尔蒂亚娜这样终生与严酷环境搏斗。身为西伯勒克的兽嫡且来自西伯利亚腹地，她比该隐后裔中多数人更习惯这种生活。\n\n维尔蒂亚娜的成长始终围绕生存与奉献。西伯勒克的生活方式极其残酷，故意居住在世界屋脊最荒凉之地，还将几乎所有收获献给部落里寥寥无几的狼人。\n她已尽力适应，但忍耐终有限度。某夜当醉酒的西伯勒克男子强逼她交配，无视她的抗拒时，震惊之中爆发的怒火让她碰巧摸到一件异国银叉，猛地刺穿对方下颌直贯头颅，当场毙命。\n深知等待自己的只有死刑，维尔蒂亚娜仓皇逃亡，竭力隐藏气息。但即便土生土长者，西伯利亚也能摧毁任何人。倒在草原边缘时，她因冻馁奄奄一息。\n若非[Glossary('Anda','podgloss.anda')]的迪莱早已关注她，故事本该在此终结。当迪莱展现给她超越部落的强大力量时，维尔蒂亚娜接受了强加于身的该隐子嗣本性。\n\n在黑风先锋中，她将自己锻造成\"狂暴之民\"的猎杀者。这份高危职责因她的西伯拉克血亲经历而独具优势：她通晓狼人真相而非流言。如今她沉醉其中，甘愿成为令西伯勒克闻风丧胆的\"黑狼\"。"
 POD_persistentpodlore.desc.793297: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n昔日同僚皆言唆鲁禾帖尼已然堕落，但手段虽变，初心未改，她仍诛杀恶魔。无论用何方式，夏朝妖魔的灭亡皆是天理。\n\n作为匈奴部族罕见的恶魔猎人，唆鲁禾帖尼生于附属部落，师从汉地大师。知晓世间黑暗后，她选择以烈火抗争。但独行诛魔、不聚同道的教条令她愤懑。\n即便身为狂热诛魔者，她也厌恶同僚的作风。于是她打破了教条，开始向族人传授诛魔之术。此举激怒其师，此人屠尽受训者，最后才对付唆鲁禾帖尼。他讥讽她的努力，重申独行之要。得意忘形之际，却未察觉身后逼近的身影，阿兰将其撕成两半，救下唆鲁禾帖尼。阿兰随即提出简单邀约：加入她，超越生死诛魔。答案不言自明。\n\n如今唆鲁禾帖尼是[Glossary('Anda','podgloss.anda')]先锋军中对抗[kuei_jin|E]最炽烈的战士。自少女受训诛魔起，她便以灵魂憎恨这些邪物。作为专精者，她已将诛魔千法精炼为艺术。纵有恶魔猎人前来追剿，她也坦然以待。\n因其境界早已超越彼辈。"
 POD_persistentpodlore.desc.793298: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n对知晓法师威能者而言，专精猎杀他们简直疯狂，但桑嘎偏精于此道。\n\n她成长于小部落，家族活在自比神明的法师暴政下。此人行使初夜权，优先挑选族中青年，蓄养大批侍妾，其堕落行径令铁腕暴君都作呕。桑嘎在持续恐惧中长大，父亲因煮焦旱獭被倒转头颅，母亲因侍寝不殷遭断肢嫁接驴颈。\n恐怖统治令多数族人屈服，桑嘎除外。双亲死后，她隐于暗处蛰伏，静候复仇良机。当法师召唤闪电毁灭他族时，她自山丘后射出金属箭矢贯其眼窝，引闪电劈爆其首。\n大仇得报后，她坦然卧地待死。\n\n苏醒时她已成异类，夜之造物守候在侧。当对方赋予她诛杀各族之敌的使命，她视此为崇高事业而加入。成为黑风先锋后，她研发出对抗现实扭曲者的战法，永绝后患。"
 POD_persistentpodlore.desc.793299: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n莎拉雅生于摩诃摩迦瓦哈那王朝疆域，成长于孔雀王朝倾覆的阴影中。她的人生大部分时间就是个普通村民，特别花心思照顾老人：送水做饭、陪他们说话，在老人被遗弃时给予安慰。她对老人的关爱如此深厚，以至于有天夜里看到小老虎袭击老人时，她毫不犹豫地抢过守卫的弯刀，一刀劈开了老虎的脑袋。\n这般泼辣勇猛的举动，引起某个希腊征服者遗留势力的注意，还有些藏在暗处的存在也盯上了她。其中一个认定这个\"护老杀虎人\"最适合继承自己的血脉，当晚就把莎拉雅变成了一个拉弥亚。\n\n但莎拉雅完全不像她尊长预期的那样适应初拥。她在族内的学习困难重重，尤其因为她拒绝放弃自己的沙克蒂信仰去崇拜莉莉丝。主人试图强迫她改变，结果有天夜里两人獠牙相向大打出手，莎拉雅被迫逃亡。\n她漫无目的地流浪，最终停在卡帕多西亚族傅介子的避难所门前。想到守护这位研究死亡的学者，或许正是自己命中该做的事，她主动提出当保镖，对方爽快答应了。如今世道越来越乱，但人们总能在于阗克星身边找到他的\"杀虎护卫\"。"
 POD_persistentpodlore.desc.791510: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n别勒古台绝非[Glossary('Anda','podgloss.anda')]的精英典范，实际上恰恰相反。这个爱吹嘘的蒙古骑手仅有尚可的武艺，却让未来尊长动了心，指望永生能磨练他的本事。可惜事与愿违。\n变成吸血鬼后，别勒古台敷衍度日，表现勉强够躲过责罚。直到某天与[kuei_jin|E]激战时临阵脱逃，彻底毁了他的死后生活。按律该当处决，但走运碰上[Glossary('Anda','podgloss.anda')]需要向新附庸拉克坦部落派驻\"大使\"。这苦差事没人愿接，别勒古台就被打发去充数直到有进一步通知。\n他很快故态复萌，仗着背后强权自封部落统治者。拉克坦部落实际掌权的吸血鬼萨蒂敢怒不敢言，怕得罪[Glossary('Anda','podgloss.anda')]。如今她只能指望别勒古台的懦弱本性，让他永远不敢真动手夺权。"
 POD_persistentpodlore.desc.793300: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n和多数族人一样，别格鲁克从小视萨蒂为部落唯一的永生守护者。他因精通算术得她赏识，乐意为她和部落效力，直到别勒古台到来。\n这个傲慢的蒙古人很快证明，萨蒂不过是众多永生者之一，而且相当弱势：她根本不敢对抗别勒古台背后的主人。别勒古台随后初拥了别格鲁克，显然只为炫耀自己\"凌驾萨蒂的权威\"。成为吸血鬼的头几夜，别格鲁克惊恐万分，尤其他的尊长完全没打算教导他适应新身份。幸亏萨蒂告知他生存守则，主要是防止他被族人伤害（也防止他伤害族人）。\n别格鲁克正慢慢走出阴影。他恨别勒古台的所作所为，却也怨萨蒂没能在蒙古人面前保护好大家。这股怨气或许会让他将来闯下大祸。"
 POD_persistentpodlore.desc.793301: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n狼天生不屈膝，那是狗的活法。伊尔克最恨的，就是被迫成为[Glossary('Anda','podgloss.anda')]。\n生于科马克汗国黄金时代，伊尔克生前是顶尖猎手。专猎群狼避之的猛兽与食人熊，收入颇丰。胆大包天的他最终盯上怪异食人兽，却啃了硬骨头，撞见未来尊长。对方惊异于他的胆识，决定不浪费这好苗子，便唤出他体内怪物公之于世。\n\n伊尔克憎恶这副新躯壳，羞愤之下试图弑主。但再也逮不到对方，只能无能狂怒。他带着血仆野兽群在科马克汗国割据称王，守着\"暗夜可汗\"的最后尊严，直到被[Glossary('Anda','podgloss.anda')]逼入绝境，屈膝臣服。如今他蛰伏等待复仇良机，不惜代价。\n\n未来命运：当[Glossary('Anda','podgloss.anda')]势衰，伊尔克突袭五行宗夺权。他积极清洗[Glossary('Anda','podgloss.anda')]残部，将其献给[kuei_jin|E]。而回报恰如其分，被木桩钉穿，锁入棺材，沉入最深海沟。从此踪迹全无。"
 POD_persistentpodlore.desc.793125: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n马瓦尔是比永最忠实的同伴，患难与共，从最初便是如此。\n\n生前她只是平凡主妇：照料家务，抚养子女，任劳任怨。但内心从未真正快乐，仿佛缺失了什么。厌倦了死水般的生活后，讽刺的是，直到死亡当日她才感受到生命活力：厌倦老妻的丈夫将她剁成碎块抛入大海喂鱼。死后她堕入焚海地狱。\n\n但暴力让玛瓦尔重获新生。伤痛与施暴，杀戮与被戮，搏杀与受戮，那肾上腺素点燃了她的生命之火。她化作顶尖掠食者，踏着尸山血海重返人间。回归之际，她与某位魔鬼鏖战平手。癫狂的肾上腺素狂潮恰好匹敌对方的顽强意志。此战让双方神智清明，结为血誓姐妹。\n\n自此马瓦尔永伴比永身侧。\n原著未来命运：\n比永晋升[Glossary('Hundred Clouds','podgloss.hundredclouds')]后，马瓦尔将成为最显赫的[Glossary('Penangallan','podgloss.penangallan')]。她将作为黄金皇朝的实际代言人，吸引顶尖战士（及纵乐者）汇聚其宫廷。至2000年代初，她距自身晋升仅一步之遥。"
 POD_persistentpodlore.desc.793124: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n因檀的悲剧从开始就注定了。她出生在海盗洗劫她的村庄九个月后，还不会说话就被扔进丛林。在荒野中挣扎求生的岁月里，她被文明抛弃，终日与饥饿和追猎为伴，每活过一天都是奇迹。\n路人只当她是游荡林间的泥鬼，在林地中潜行，吃她能获得的任何食物，直到她误捕了不该碰的猎物。村民放火焚林围剿，抓住这个野性未驯的少女时，她连求救的话都不会说。被拖到村中央吊起时，她像落入陷阱的老虎般撕咬挣扎。乱石砸落中，嚎叫声渐渐微弱。当瞳光彻底熄灭，他们把尸首抛回了丛林。\n\n但死亡没能改变因檀。她骨子里只剩生存本能。即便坠入倒吊地狱，在罪人倒悬的诡谲世界里，怪诞感被她心中的确信逐渐克服。凭借着她坚定不移的韧性，她找到了回来的路。她回到了她年轻时的丛林，屠杀着她路径上的任何与所有东西。\n直到名为比永的女人出现。这个拥有同等恶魔之力的强者降服了因檀，带她回到神庙，赐予名字与语言。漫长的驯化后，因檀终于融入养母的世界。她依然为生存而战，但这次，终于能活得像个真正的人了。"
 POD_persistentpodlore.desc.793126: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n弥逻底出生在沿海小村庄，人生大部分时间相当平凡。作为渔女帮助家人，她安静生活且不愿引人注目。如果村庄两侧的两位领主没有为村庄归属权争执，这或许就是她的一生。当士兵到来时，村民试图劝离他们，但一个被扔出的水果和易怒的守卫导致村庄被洗劫、掠夺并烧成平地。梅拉蒂与其他许多人一起遭受士兵暴行后被杀害，成为村中央成堆焚烧的无名尸体之一。\n\n弥逻底发现自己身处盐铁深渊，生前最后时刻在恐怖中不断重演。但她内心的愤怒磨砺成残酷的匕首。她等待时机。最终在恰当时刻，她从铁青楼杀出一条路，拼命逃回人间。她终于重获自由。当比永找到她时，她有了目标。\n\n弥逻底仍极度愤怒。但与同伴不同，她耐心。她有条不紊。她是潜伏者。她亲身学会鲁莽的代价。她不会再经历那种事。"
 POD_persistentpodlore.desc.793127: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n西蒂出生为富裕农民的女儿，相比现代同龄人，她生于类似的优裕环境。但当然，她的生活远非理想。14岁时被许配给年龄三倍于她的富裕地主，远嫁他乡后，她迅速发现曾经的舒适不过是镀金的笼子。尽管对行政管理有好奇心，每次尝试学习读写或理财都遭到暴力对待。多年婚姻无子后，某夜丈夫直接砍下她的头，另娶新妻。西蒂在恶魔城醒来，被迫加入帮派，陷入形而上具象化的暴力循环。\n\n西蒂在兰卡格格不入，但尽管遭遇不公，已发生的事不能是她故事的终点。她不情愿地变强，变得凶残，寻找自身遭遇的缘由。最终她通过利用地狱之墙的漏洞搏杀出一条路，找到裂缝潜逃而出，后被比永发现。而在她即将展开的宏图里，一个通晓建筑与基础设施细节的女人将价值非凡。\n\n西蒂如今接受了自己必须战斗，但也终于能实现长久被否定的梦想。"
 POD_persistentpodlore.desc.793128: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n瓦蒂不仅代表两种极端，也代表女性特质的双面：一个杀手和照顾者。一个恶魔和保卫者。一个怪物和母亲。而这些都来自一个原本与这些无关的人。\n\n瓦蒂曾只是个厌恶自己倒影的男孩。厌恶自己身体的虚弱。他崇拜母亲，将她沉静的力量视作美妙超凡的美丽，只想成为她那样的人。某天与母亲交谈后，母亲让他试穿她的裙子，他感到无比自由。但这样的快乐未能长久。\n一天他穿裙外出，巡逻队误将独行的他认作美丽少女。发现判断错误后，他们残杀了他，活剥其皮，弃于丛林任其流血致死，尸体被野猪啃食。\n\n当瓦蒂在剥皮地狱醒来时，曾经的温和柔软被吞噬一切的愤怒取代。痛苦折磨淬炼了她的决心。她誓要复仇。她潜行于荒芜之地，杀死所有遇见者，嚎叫着凶手姓名以铭记。\n最终她找到通往人间的洞穴，寻获凶手并活吃了他们。魔鬼追捕她，她连魔鬼也吃掉。她在暴怒中狂欢，变得骄傲而傲慢。\n比永找到她时，她是头难驯的野兽。但比永理解。经过塑血化肉后，比永建议瓦蒂生育孩子。犹豫应允后，那个婴儿如同她的狂欢般打开了她的双眼。作为怪物兼母亲，她感到满足而完整。她无比渴望终于获得幸福。"
 POD_persistentpodlore.desc.795048: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n姚玮原是中国北元地区邻近朝鲜的普通村民。她曾祈求丰收满桌与风调雨顺，但海盗风暴回应了她的村庄。他们洗劫家园，杀死她大部分家人与所有相识者，并将她作为若干新鲜“奖品”之一掳走。\n海盗开始下一次劫掠时，有人发现她被掳数月后已怀孕。海盗不愿处理婴儿，便用尽全力将她捆紧，拴上石头抛入海中。\n\n姚玮昏迷溺亡后，惊恐地发现自己处于相同状态，但此刻身处沸海地狱，不断下沉与溺毙。然而那块曾杀死她的石头，却以诡异方式成了救赎。它带她持续下沉，直至她再度苏醒，无需呼吸即可存活水下，但身躯化为魔物，轻易撕裂绳索游回人间。\n当[Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')]发现她时，她已被纳入美德之瓣组织。\n\n此番经历彻底动摇了她。生命如此短暂，她自身如此渺小，轻易就能被掐灭。她绝不让此事重演。不，她绝不能再渺小。\n她必须辉煌、壮丽、邪恶，且强大到永不溺亡。对如此年轻者而言，不，她必须光芒四射。她会成为值得铭记与恐惧的恶徒。她绝不敢再渺小。\n原著中的未来命运\n姚玮的热情与狂热助她崛起。海盗事业的成功使她最终被未来的五行宗擢升，成为极其成功的亡灵海盗。即便对抗英国海军，她仍连胜连连，直至现代之夜已富可敌国。"
 POD_persistentpodlore.desc.795052: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n在黑暗世界中，印度次大陆的永恒战争鲜有外人成功介入。尽管人类征服者成就斐然，穆斯林对印度的征伐在吸血鬼间却少有成功，绝大多数死于雷伏诺幻术师的威能或受诅者的魔鬼技艺。但有一位将潜伏于该地区最伟大人类征服者的阴影中。\n\n舒贾是加兹尼的马哈茂德之女，其父曾任加兹尼王朝的重臣以及后来的苏丹。虽接受贵族女性的正统教育，舒贾本将注定成为他族领主之妻，但首批阿什拉派试图进军印度次大陆的行动率先影响了她。\n因与父兄分离却仍具学识才干，她成为初拥的明选。被阿什拉派初拥并教导后，她未获长期支持，面对雷伏诺的威势，阿什拉派迅速西逃。\n但舒贾不会不战而弃家园。凭借生前优势与死后特权，她击溃了雷伏诺对其领地的首轮袭击，并迅速崛起为阿什拉派苏丹。虽孤立无援，她顽强不屈、胆大攫取。纵使出身帝国崩毁，她亦不崩溃。不，她将长存。\n原著中的未来命运\n尽管遭受雷伏诺的狂怒及后续饿殍的报复，舒贾未如诸多所谓的阿什拉派苏丹般溃败。虽最终被逐出阿富汗，她成功从雷伏诺手中夺取孟买，并在印度次大陆建立并巩固了阿什拉派的核心权力中心。"
 POD_persistentpodlore.desc.795055: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n桂英是王宏本麾下最为忠诚、资历最老的侍从之一。他活力充沛、勤勉不息，总在设法为主君多做些事。然而他并非出于职责感，而是因深深爱慕王洪本，甘愿为博得其一眼回眸而不惜一切——即便这份痴念严重损害了黄帝皇朝的运作。\n\n桂英出身自中国南方丛林部族，被归为板楯蛮。他鲜少提及自己的凡人过往，只言曾被猛虎撕咬，尚存一息时亲身感受虎舌舔肉剥骨之痛，由此堕入剥皮地狱。而当他从地狱中挣脱之后，反倒生出一股炽烈的对生命的热爱，以及，对其[Glossary('屋室','podgloss.wu')]首领王洪本的狂热情感。\n他坚定支持王洪本在朝堂上的崛起，并巧妙地推动着腾龙舞的推行。当王登上黄帝朝廷大位时，他将亲信安插于各要职之上，桂英亦被派往南方主持事务。\n\n然而，桂英却成了南地的祸源。他贪婪好欲，勒索当地老祖以饱私欲，又屡屡嘲讽朱雀皇朝，常以男体为尊来贬抑女子之美。\n当不在南地时，他亦不停地在王洪本耳边低语，不遗余力地博取宠幸。为了王的注视，他与昔日[Glossary('屋室','podgloss.wu')]纷争不止，而南方百姓则在他无尽的色欲、食欲与贪欲中日益凋敝。\n\n其在原作中的未来命运\n王宏本遭刺杀后，桂英如遭雷殛。他退居己庭，整月哀哭不止。直至某日哭声停歇，侍从前去察看，却发现他早已无影无踪，自此再未现身于世。"
 POD_persistentpodlore.desc.795056: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n自马家塬而来者，曾是真正的死亡大师。但此日早已沉落，如今这头老虎只在帝王足畔低鸣，仅为获得更多关注而渴求不止。\n\n白来自黄帝皇朝西部，系西戎人中的马家塬成员。据其自述，她本是无名之辈，死于热病后堕入蛀蛆地狱，侥幸逃脱已是万幸，更遑论被王宏本的[Glossary('Wu','podgloss.wu')]收用。\n其谦卑与耐心，辅以死亡技艺，曾使她成为卓越的影歌者。尤其在[Glossary('Wu','podgloss.wu')]中，众人寄望王宏本的晋升黄帝皇朝能改善与白虎皇朝的关系。然事与愿违。\n\n白过分谨慎、倦怠且对王宏本过度顺从。王宏本的怪癖因她变本加厉，她只求执行主君命令。即便游牧入侵者威胁宫廷，她仍静候王宏本的命令方肯介入，始终畏越界，永不主动。一切只为换取领主更多垂青。\n\n原著中的未来命运\n王的遇刺摧毁了白。她于房中死寂不动数年，仅被动吸收气，空洞凝视虚无。数年间无事发生后，她径自步入喜马拉雅山脉，再无踪迹。"
 POD_persistentpodlore.desc.795057: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n金朝焚毁之际，此地众人缄口不言局势恶化。因他们知晓，言及此，李必毫不犹豫前来灭声。\n\n李生于氐人，占据中国正北区域的北方民族。作为最早堕入[Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')]的亡者之一，逃脱后的他仿佛蜕变，欣然接纳中国文化，积极摒弃出身。\n视其[Glossary('Wu','podgloss.wu')]首领王宏本为典范，李成为狂热、盲从而冷酷的执行者，并深获满足。他对游牧民族的憎恶，令玄武皇朝的外交举步维艰；但派遣整队[Glossary('Wu','podgloss.wu')]对抗[Glossary('Anda','podgloss.anda')]使他倍感成就。\n不幸的是，他在军事追求上极差，是个鲁莽的执行者。当对抗[Glossary('Anda','podgloss.anda')]的战争愈发不利于饿殍时，他仅以斧头消声所有异议来维持战线。\n\n他必须胜利，因这是王的命令。他绝不接受次等结果。\n\n原著中的未来命运\n王遇刺震惊了李。霎时间，失去黄帝皇朝撑腰的他，遭北方众多[Glossary('Wu','podgloss.wu')]公然反抗其高压鲁莽之策。\n李勃然暴怒，全力追剿他们，甚至将派往对抗[Glossary('Anda','podgloss.anda')]的整支[Glossary('Wu','podgloss.wu')]部队（无论忠叛）皆立为惩戒范例。所幸当他追剿某[Glossary('Wu','podgloss.wu')]时，遭[Glossary('Anda','podgloss.anda')]特遣队\"黑风先锋\"伏击，自此音讯全无。"
 POD_persistentpodlore.desc.795058: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n一方面，开悟是万鬼所追求的崇高理想。但另一方面，当行此道者为魔虎，且又听命于如王这般性情暴烈的君主时，观之往往令人不寒而栗。清虽一无是处但忠诚无二，她也绝不愿被人视作他样。\n\n清生于中国东海岸，属于东夷。原属渔村一隅，她曾遭遇一场噩梦般的死劫——如她所述，一名骇人男子自深海而来，伴随鲨鱼掠影，抽尽她血脉，只留下如木乃伊般的尸骸沉没海底。其魂魄坠入沸海地狱，她并非凭诡计逃生，而是撕剥一只魔鬼之皮骨，借其骨骼引路，得以脱险。\n她狂热而残暴的本性令她轻易跻身魔虎中，尤以对权力的恐怖渴望而著称。为此，她常殷勤倾听王的指令，以期攫取更多权势。\n\n惩戒罪恶之时，清感到了生命的极致澎湃。她施刑无度，手段之残酷令其他魔虎长者亦为之掩鼻。她毫无偏私，常问王是否有“罪人”需受惩罚。虽有流言说她暗中阴谋，但她似乎甘于被赐予王的所有囚徒，不论其品德。\n\n其在原作中的未来命运\n王被刺杀后，众人目光皆聚焦于清。她竭力守护黄帝皇朝东境老祖之位，但终被驱逐，遂欲逃往南方，投奔她所认为志同道合之人。然而，据随从所述，最后目击她时正被拖入水中，惊叫着：“别又是他！求求你们，谁都行除了他！”自此杳无音讯。"
 POD_persistentpodlore.desc.793302: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n当阿什拉派随人类商人及伊玛目抵达时，对印度支那与南海诸岛的最初期望，对多数阿什拉派而言过于雄心且注定失败。其胆识决心遭遇当地黑夜居民的强烈反击，苍白野兽与鬼魂领主、内陆涌出的饿殍兽群、深潜浪下的猎杀之物，致使派往此区域的绝大多数阿什拉派遭遇最终死亡。\n\n迄今，哈菲兹行走于致命政治的钢丝上取得巨大成功，尚未沦为肉泥。\n\n生前的哈菲兹是商人，他颇爱此业。但当他在阿拉伯海开辟新航线时，被印度商人雇佣。启程后，几乎所有可能出错之事皆发，帆船偏航、导航失灵、风暴、嗜血的诡异凶兽、寻常海盗... 抵港历程几近夺命。但他成功了，合作方深为触动。因其坚韧，他被初拥并获真正使命：\n将阿什拉派带往新土地，在无数失败之地传播教义。其尊长舒贾确信，他在生还者中能完成他人未竟之业。别无选择下，他再度启航。\n\n未来命运\n哈菲兹将在无数同族殒命处取得成功。他谨慎处理与本地血族关系，避免触怒黄金皇朝，终获准在区域内传播阿什拉派。至今他仍以阿什拉派苏丹身份统治，纵然身处黄金皇朝阴影下。公允而言，此位置正是勒森魃所求。"
 POD_persistentpodlore.desc.795059: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n朱雀皇朝衰微之际，无数崇魔者、异端及其他污秽孽种于南海黑夜扎根。然此深渊自古栖居一恐怖存在，其古老堪比最年长的[akuma|E]，且位列至怖之一。\n纵在遥隔的玄武皇朝，亦流传着某污化者的耳语，其力可怖，或能挑战[Glossary('Yama Kings','podgloss.yamaking')]。此乃骇人征服者、全觉醒者，然其可怖顿悟将使世界屈膝。她被简洁而传神地称作一个野兽，噬焰者此名当之无愧。\n\n噬焰者起源不明，据信曾是摩诃那伽门徒，是万嚎道首批行者。其肌肤永覆焦痕，故有推测谓其出自滚油地狱，然此皆臆测，凡问询者无人生还。仅知她贪欲无度，专狩至险之猎物：其他[kuei_jin|E]、稀有的吸血鬼、$glossary_fera$、法师、诸灵、魔鬼及万千生灵。纵能汲体外之气，她却更喜欢吞嗜鲜肉的甘美。\n她通过吞噬某恶虎老祖获得了这个名声。此老祖以火圣体焚她未果，反助其慢条斯理肢解猎物。如今她再离沉眠，聚火之邪教与劫掠海盗为军。\n一切皆为污化顿悟，或作盘中餐，或充肉欲器，或榨受害者哀嚎，凡此百种，她皆将引出万嚎。\n\n原著中的未来命运\n纵此怪物凶威滔天，朱雀皇朝残部终以人海战术压制。\n然而他们未能诛杀她，遂将其深缚地底，囚禁至今。但是不幸的是，香港竟无意间在其囚牢上方崛起。城市命脉渗入她的隐藏监狱，令她重燃对杀戮盛宴之渴念。当第六纪元迫近，她渐次苏醒。"
 POD_persistentpodlore.desc.795061: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n有时，即便行事在理论上全然正确，情境微妙仍可致人深陷麻烦。\n\n蒂特夸是尊贵的比永的门徒之一，对其道途热忱虔信，堪称典范。自沸海地狱逃脱后，她死于某位\"开化者\"海民之手，继而皈依比永的解放哲学，其狂热与恒心甚至超越部分得意门生。\n然而蒂特夸或过于热忱，无视炽血花身处的政治现实。她常自发猎杀鬼魂，无论其生前如何，只为安息亡者并护佑世间免于死亡。此举甚至波及比永庇护下的印尼\"鬼魂\"群体。\n某次她意图诛灭的目标，却展现出远比她所认知的更强大的实力，以强大死灵术、对野兽的绝对掌控及诡谲闪避重创其几近殒命。比永震怒于此外交事故，派遣蒂特夸北上除灭恐怖存在噬焰者以证明自己。蒂特夸愤于比永庇护鬼魂，决意以此功业自证，并待功成后请命诛灭群鬼。\n\n原著中的未来命运\n蒂特夸取得部分成功。她借其他老祖的力量，瓦解噬焰者邪教，击败却未能诛杀之。然而当其凯旋，比永已投身灵性事务，而马瓦尔无意应对蒂特夸爆裂脾性。\n受辱愤懑之下，她秘密祭奉钢铁女王，意图成首名诱其进入陷阱者；同时刻意纵容她认定可祸乱黄金皇朝的血饮者。此系列愚行终致其1913年殒命：被继任香港老祖的安国春困在燃烧的建筑中纵火焚毙。"
 POD_persistentpodlore.desc.795101: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nFor the most part, the Order of the Bitter Ashes has seen the threat that the [Glossary('Anda','podgloss.anda')] and, by and large, the Mongol Empire pose, and for the most part, have little ability (or quite frankly, desire) to act against them until they begin to actively threaten the holdings of the Order. However, one knight has taken it upon himself the uncover the true extent and nature of the Mongolian Shadow over the world.\n\nTancred is a knight of rather meek blood, that despite his diligence and bravery, has not gone far in most Cainite Military Orders since his embrace due to his origin among not the nobility, but of the common folk. Among the Toreador of the Courts of Love, he felt truly out of place, and the gnawing coldness of the Beast perturbed him greatly.\nHis own sire a monstrous flesh shaper amongst artists, he eventually forsook the decadence of his homeland's world of night. And among the Grail Knights, he took to them with a determined tenacity that impressed many, even to the extent that he volunteered to investigate the Mongolian Empire first hand, and judge what kind of response the [Glossary('Anda','podgloss.anda')] would need. Some among the Order suspect that his pride is the main force acting rather than duty, but time will tell what becomes of Tancred's Expedition.\n\nFuture Fate\nTancred's intentions would later prove to be... less than noble. Tancred's goals would become less scouting force and more 'conquer and defeat the [Glossary('Anda','podgloss.anda')] on his lonesome for the sake of his own pride'.\nHe would eventually lose the blessings of the Grail, and respond to it by turning to infernalism, disappearing within Russia. The Order would disavow Tancred, and scrub him from their histories."
 POD_persistentpodlore.desc.795102: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nIn 1229, the Court of the Black Tortoise, the [kuei_jin|E] institution that oversaw the northern reaches of the world was thrown into a bit of confusion, as a woman with little resemblance to the man who set into motion the conquest of the world came before the Ancestors of the Court and made a truly bold claim. That she was once he, the Oceanic Lord, Genghis Khan once Temujin.\nThey claimed that on his funeral pyre her body was destroyed, and in their escape from Hell they were forced to take a new body and a new name. And so he had moved on from one breath into the next.\n\nDespite the absurdity of the claim, the Ancestor of the Court that Tömörbaatar presented themself too has not chosen to truly verify their claims, and thus instead had Tömörbaatar continue along with the standard initiation rituals that is considered standard. Tömörbaatar rankles against this, feeling snubbed and denied what should be their proper place.\nBut their boldness has always known little bounds, in some shape or another. And they long for an empire as great as one they held in life, at least so they believe.\n\nFuture Fate in Canon\nUnfortunately for Tömörbaatar's story, among the [kuei_jin|E] was Bortai the Fair, one of Genghis Khan's consorts. Publicly shaming Tömörbaatar for the farce of posing as the Khan of Khans and credibly shredding Tömörbaatar of their title, Tömörbaatar was quietly moved to the front against the [Glossary('Anda','podgloss.anda')], where she disappears utterly from the record.\nBut they would establish a tradition among many newly dead who would claim to be Temujin returned. While the [kuei_jin|E] would be more thorough for future claimants, it would be hard to forget the first one to do so."
 POD_persistentpodlore.desc.793303: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nLong, long ago, there was a Jōmon scholar and a Jōmon witch. Both seekers of wisdom at heart, the Scholar went to schools of magic and steel, while the the witch went afar seeking rumors of creatures in the night. The witch traveled far at the behest of the scholar, finally reaching a terrible figure of roiling flesh and veracious terror.\nThe witch however came seeking not conflict, but an exchange of power. She professed loyalty to the flesh shaping demon, and requested they embrace her. The flesh shaper, wanting to see what would happen to a mage transformed by their curse, readily did so. And then, as the witch was slain and tasted the monster's blood, the scholar's magic whisked her away back to their shared home. And when she returned, she found the scholar was no longer a mere mage, but a king of devils.\nShe gave herself back to her true master, as both laughed beneath the stars out of pride for their ambition. And so Kagaseo became the first [akuma|E] of the one who would become [Glossary('Yama King','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')].\n\nSince then, Kagaseo has been setting plans into motions for millenia. Carefully waiting, she selected three mortals to take into her own embrace, and have them kneel before [Glossary('Mikaboshi','podgloss.mikaboshi')]. Her Great Clan was a tool of her lord, and to that end she would shape her lineage to act where her master cannot. She has received ample rewards for her enduring loyalty, including the forbidden knowledge allowing her to grow closer to Caine.\nAnd now, as the [kuei_jin|E] Azure Dragon Court recedes from Japan and the next Age draws near, she begins to galvanize her lineage in their adherence to her master. She aims to remake Japan in her master's image, and be the one to crown him the [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793304: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n美夜子是众多生活在大和政权崛起之前的日本民族中的一员。但当她还是个少女时，她就看到他们开始进军她的家园。她自己的领主自称是须佐之男的后裔，率领她的人民反抗大和。\n他们惨败了。\n她领主麾下的许多士兵被斩杀，敌军开始践踏他们的土地。于是，美夜子，一个普通的乡村女孩，不断地祈祷，祈求拯救、力量、抵抗的能力。但没有一位神明回应。而在她的村庄被焚毁的那晚，一些士兵盯上了她。\n当他们把她的脸按进灼热的炭火中时，他们还在大笑。但接着，在一阵模糊中，他们安静了下来。她抬起头，只看见一个眼中闪烁着雷霆的风暴。\n她快要死了，脸上的皮肤开始大块大块地焦灼脱落。她恳求他帮助。于是他俯下身，张开了嘴。第二天晚上，美夜子醒来，皮肤冰冷，心脏静止，胸中燃烧着狂怒的火焰。\n\n她的拯救者已无处可寻。但就在那天，她立下了一个誓言。此刻在她体内咆哮、震颤的狂怒将被锤炼，化作一把凶猛的利刃。她将成为黑暗中的正义之刃，这是像她这样的人曾经所缺少的。她将成为首位武士该隐派，风暴之子嗣。\n\n自那夜起，美夜子独自在日本游荡，如同夜间的幽灵，斩杀暴虐的领主，刺杀那些袭击被征服者的士兵。随着时间的推移，她发现夜晚被一个拜占庭般复杂的宫廷系统所统治，她发誓他们容忍白昼之恶的行为必将以血偿还。\n她将以天草为中心，其他被黑夜放逐者将聚集到她的麾下。\n她的子嗣将被挑选出来，凭借他们胸中对暴政燃烧着的热忱与坚定，与她并肩而立。如今，随着她的血系在宫廷衰落之际日益强大，她的清算时刻终将到来。"
 POD_persistentpodlore.desc.793305: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe Seventh Son of Emperor Kanmu and Court Lady Ki no Wakako, Asuka was never going to inherit the throne. However, he was still afforded the comprehensive and extensive education of the imperial palace, and grew into a capable and competent young man, a powerful voice at court who could spin many a tale and tell a hundred more.\nIt was here that he caught the attention of of an enigmatic figure who called himself Hiruko. When Hiruko met Asuka in the night, he asked to tell him a tale. Asuka obliged, and spun him a story so immaculate and enrapturing that Hiruko sat there all through the night.\nHowever, as morning dawned, Hiruko begged Asuka hide him in his room, away from sunlight. A noble sort, Asuka obliged. And when night fell again, so impressed by Asuka's honor, that Hiruko 'shared' with him his gift before he departed, and ordained that while Asuka would never rule Japan like his brothers in the day, he could rule it in the night. All he had to do was wrest it from the hands of foreign interlopers.\n\nAsuka soon found that the world around him was filled with other things that stalked the night, but uniquely he held the power to make his stories real. Perception, Illusion, even the very Soul could all be shaped by Blood. And it would be a wonderful tale, were the Seventh Son of an Emperor to claim a birthright he could never have and become an Emperor in his own right.\nSo, he began to spread his reach, and play his cards. A smiling face in the shadows, with ambitions of a throne and the world he sought to make. All he would need is allies.\n\nOr so the story goes, as Asuka tells it. And it is a mighty fine story."
 POD_persistentpodlore.desc.793306: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe founders of the Ika and Koga are tied, just as much in life as they are in death. Yasu and Yū are identical twin brothers, and originally competing heirs to a minor clan whose name has been lost to history. Where Yasu was cunning, Yū was brash. However, both brothers would come to violently resist the introduction of the Taihō Code, an initiative by Prince Osakabe to try and make Japan more Confucian.\n\nBoth brothers violently resisted what they saw as foreign influence. Both were captured and designated for death, but the intervention of strange beasts delivered them to safety. Kagaseo offered them a similar deal - violently tear out the influences in Japan from foreign shadows and serve her, and be rewarded by her and her master with life everlasting. Both brothers accepted.\n\nEarly in his unlife, Yū began to use eternity hone his skill as a weaponmaster. Unlike his more subtle brother, he found a great deal of fulfillment as [Glossary('Mikaboshi','podgloss.mikaboshi')]'s sword. Placed in the more present roles of the Great Clan's ambitions, Yū swiftly became feared by the few [kuei_jin|E] who knew of the Great Clan [akuma|E].\nHowever, his growing frustrations with his brother and the other childer of Kagaseo, Michiko, led to rifts beginning to grow within the Great Clan. While he knows that acting against them when Kagaseo is around is functional suicide, he longs for the chance to strike at Michiko for her pretension and at his brother for his shadow loving cowardice.\n\nAnd perhaps soon, that time may finally present itself..."
 POD_persistentpodlore.desc.793307: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe founders of the Ika and Koga are tied, just as much in life as they are in death. Yasu and Yū are identical twin brothers, and originally competing heirs to a minor clan whose name has been lost to history. Where Yasu was cunning, Yū was brash. However, both brothers would come to violently resist the introduction of the Taihō Code, an initiative by Prince Osakabe to try and make Japan more Confucian.\n\nBoth brothers violently resisted what they say as foreign influence. Both were captured and designated for death, but the intervention of strange beasts delivered them to safety. Kagaseo offered them a similar deal - violently tear out the influences in Japan from foreign shadows and serve her, and be rewarded by her and her master with life everlasting. Both brothers accepted.\n\nEarly in his unlife, Yasu excelled as [Glossary('Mikaboshi','podgloss.mikaboshi')]'s assassin. A phantom, he struck at any loose ends that began to become aware of the Great Clan's true nature, and was by and far the most competent user of fleshcrafting among Kagaseo's childer. And for that, he and his lineage were feared as a horror that goes bump in the night.\n\nHowever, the sneers from Michiko and brashness of his brother aggravate him immensely. He is not stupid though, and knows that Kagaseo is watching them. So, he instead bides his time and waits. Quite eagerly for the moment that, when the monster is away, the assassin will play."
 POD_persistentpodlore.desc.793308: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMichiko of the Soga Clan, founder of the Chibo, was a daughter of Soga no Emishi. Alive to see the fall of her clan firsthand in the Isshi incident, she would have disappeared into obscurity along with her family, had she not, as she was fleeing the Isshi Incident, run into a silver haired woman with bloody eyes in the night. The woman was Kagaseo.\n\nKagaseo offered her a choice. Die in obscurity like she was doomed too, or finish the work of her family, and work to uproot the traditions of Japan in the shadows. Michiko, angry and spiteful, accepted. Kagaseo embraced her, and bade her to create a line of progeny all her own. Michiko would then found the Chibo of the Great Clan from her line.\n\nMichiko takes her role as the eldest of the Great Clan after Kagaseo deeply seriously. She is a master of Hoshi No Ryōiki, second only to Kagaseo, and her childer carry on its practice.\nAn intense presence on the clan, Michiko accepts nothing less than perfection. And it is for that reason she cannot fathom why Kagaseo would embrace Yasu and Yū. As far as Michiko is concerned, she is all that Kagaseo needed, and Yasu's untrustworthiness and Yū's headstrong zeal is dangerous when they need to stay hidden and not break from the path.\nBut she knows her sire will not listen to her when she begs for their death, so she instead waits and continues guiding her sages. Because she knows, in due time, Yasu and Yū's time will come."
 POD_persistentpodlore.desc.793309: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nNgải has always stalked the South China Sea.\nHis mortal life is largely a mystery to his lineage. He is one of the oldest Cainites in East Asia, and his own sire is equally mysterious. He speaks of her as she rose from the sand as he was fishing in the night, and pulled him beneath the waves. When Ngải returned to shore, he descended upon his fellow fisherman in a crazed bloodlust, and drained them dry.\nHe disappeared back into the ocean, stalking the seas as scourge in the night. However, on occasion, he would lurk near the shore. He always felt a special affinity with fishermen, and watched a few. On a hunch, he drained one underwater, bit open his own wrist, and let the corpse drink it. When it stirred and became like him, he understood.\nHe embraced several more, as he began to direct them across the seas. The skarks in these waters stalked his favorite peoples, and he would not tolerate it.\nHis line would stalk the shores, and return to the waves to fight these monstrous man sharks. And so Ngải founded the Anh Bloodline of Gangrel, a lineage of Mariners that stalk the South China sea and make war against the Same-Bito."
 POD_persistentpodlore.desc.793310: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nNaja was told she was a lord. Even if in life she never felt the part.\n\nNaja was the daughter of a minor Khitan Chieftain under a name now lost to time, originally born in the western reaches of where her people dwell. One night, her clan was attacked, their holdings sacked in the night. She took her horse and rode hard in flight, but as she passed through the wilderness, one night she finally collapsed of exhaustion in her flight.\nA strange woman of red hair and pale complexion took her, and embraced her. She educated Naja on what she was, the history of their kind. This explorer then invested in her own destiny, a fierce wanderlust that then gripped Naja.\nNaja then skulked in the shadows of influential Khitans, urging them to ascend and become kings. But when the Liao Dynasty rose, as she traveled, she resolved she would build something for herself. Quietly directing the construction of a stronghold in the Hamgyong Mountains, there she would choose folk of a mindset such as herself, and surround themselves.\nHere her lineage would thrive, sequestered and the architects of their own path. And here she would take a name from the tongue of the locals, Naja.\n\nCome these modern nights, Naja greatly worries about the portents on the wind regarding the [Glossary('Anda','podgloss.anda')]. She had begun to consolidate further, calling her lineage to take a firm grip on the mountains. She contemplates if now is the time to end their isolation, and become kings not through conquest, but diplomacy, and throw the [Glossary('Anda','podgloss.anda')] back."
 POD_persistentpodlore.desc.793311: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n因达是一个幽灵，但黑夜中所有生灵都知晓她的存在。\n\n她曾是印尼一位农家美丽的女儿，在村里以美貌著称。某个夜晚，她遇见一位蒙面女子在黑暗中奔逃。当追捕者询问女子去向时，英达出于担忧撒了谎。但当她转身时，那模糊的身影向她道谢，却又歉声说：\"我太饿了。\"\n\n她被吞噬了，死在那里。但蒙面女子为报答恩情，赐予了她自己的血液。于是因达在剧痛中重生，身躯逐渐透明，如同实体化的幽灵，从此背负对鲜血的渴望与对阳光的厌恶。\n\n因达被诅咒游荡在印尼各地，但她以幽灵的方式存在。天生孱弱的她并不依靠力量，而是借助隐匿能力和动物伙伴。亡者们视她为同类，与她为友。当某次她过度吸食血液陷入恐慌时，发现自己能将他人转化为同类——这些拥有相同天赋与诅咒的存在，成为了昆蒂拉娜，印尼传说中的吸血鬼，山林中与亡魂和野兽秘密共处的\"白衣男女\"。"
 POD_persistentpodlore.desc.793174: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nA trapped goddess, the bastard daughter of sages, a dragon in mortal form, Ahn has claimed to be all these things and more, but the truth of such matters eludes even herself.\n\nAhn has no memory of her mortality. All she knows is her memories only go as far back as the Thousand Hells. She remembers waking up in the depths of the Hell of Boiling Oil, a chain around her neck as her soul was cooked over and over again in human fat. Every scream filled her lungs with boiling oil, every tear cooked her flesh, and every spasm deprived her undying muscles of the oxygen they craved.\nBut she thrashed, oh how she thrashed. In her spasms and agony throes the water churned several relics to her. And finally, in the haze of the hells, she finally broke her chains with a single black scale, and swam as hard as she could to the surface, breaching it with a burning feather in hand, that whisked her back to the world of the living, and into the world of the [kuei_jin|E].\n\nAhn has been meditating on her two relics since her escape deeply and intensely. She knows not where she found this black scale or burning feather, but she is convinced they are gifts from the Ebon Dragon and Scarlet Phoenix. Why she has them and no one else does eludes her, but she feels a great sense of duty from this gift.\nShe will find the truth of herself, for all her tall tales may pale before what she actually is.\n\nFuture fate in Canon\nShe will become something of a legend among Korean supernaturals, her eagerness to share her many adventures (though most are doubtful of the truth behind said tales) and her strict neutrality in politics will make her the most favored peaceful meeting grounds of the region.\nSome will still be convinced that she holds the key to a great mystery that perhaps she choose to forgot."
 POD_persistentpodlore.desc.793153: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nWhere there is great power, one would hope there is great wisdom. And while Xiao may claim to have both, both claims are easier said than proven.\n\nOriginally a minor magistrate who hoarded wealth in his mortal life on such a scale he accidentally caused a famine, Xiao had seen the end of his first life when the peasants stormed his manor and force fed him to death on his hoarded raw grain, thusly sending him hurtling into the Hell of Boiling Oil. How he escaped is unknown, however he was educated quite well in the Yellow Emperor Courts.\nAn eager student who became obsessed with austerity and reservation, Xiao was seen as model paragon of piety. So, when the former Ancestor of the Azure Dragon Courts had left for the Thousand Clouds, the Yellow Emperor Court had petitioned heavily for Xiao to take the reigns.\nDespite the protest of the local [kuei_jin|E], threats of conflict largely brought them into line as Xiao took court.\n\nHowever, Xiao's trauma from the Hell of Boiling Oil doomed his reign from the start. Dismantling his authority and oversight over the Courts of the Azure Dragon and his lack of direct action in mitigating the damage the Genpei Wars had on the Court's ancestors, the Azure Dragon Court has entered an unfortunately predictable downward spiral.\n\nFuture Fate\n\n Xiao wouldn't change. A last ditch effort to bring Japan's disobedient Ancestors in line would fail miserably and he would eventually be ousted by his remaining vassals from his holdings, and would disappear into obscurity, only his edicts of decentralization and his name remembered."
 POD_persistentpodlore.desc.795103: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nIt is said the road to hell is paved in good intentions, a truth that Ru understands on a deeply personal level.\n\nAn attendant of the early Han in life, Ru grew up into a servant role within the Imperial Court, going day to day the same without any change for most of his life. But one day, a foreign delegation from another nation claiming to be an empire arrived, with a fleet of gifts, soldiers, and attendants of their own. One of the slaves of these foreigners, a man named Lucien however caught Ru's attention, as Ru likewise caught his.\nHowever, the impeding scandal of a slave and palace attendant was something neither empire wished to have, so Lucien was crucified and Ru was buried alive. Ru, in the terror of his death, would awaken in the Hells of Being Skinned Alive.\nHe tore through its wastes in a crazed delirium, seeking the touch of his beloved. However, when he found his way into the Hell of Upside Down Sinners, he found his beloved in the palace of [Glossary('Tou Mu','podgloss.toumu')].\nSeeing an interesting opportunity, it is said that Ru was forced to contend with some kind of impossible choice\n\nWhen Ru returned to the mortal world, he was able to reclaim his sanity by force of will. He would go onto found the Jade Court, where he became renowned for his ferocious zeal in tormenting sinners and incredibly diligence in collecting texts and literature.\nBut in spite of it all, strange rumors surround Ru, and his readings. Some Ancestors have even claimed that perhaps he went to far in his encounter with [Glossary('Tou Mu','podgloss.toumu')], but few dare voice that.\nFuture fate in Canon\nQiang's being revealed as an [akuma|E] would be what many consider to be the turn to the Fifth Age. By the time Piyau Piyung tore her way through the southern courts to battle Qiang Ru in Changan, it will be discovered that the vast majority of the Jade Court had already fallen to corruption, horrifying the other [kuei_jin|E] to their core."
 POD_persistentpodlore.desc.793336: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMany of the Dhampyr across the Nusantara speak in hushed whispers of a terror that stalks the jungles, hunting them specifically. A [kuei_jin|E] infernalist of the Hell of Burrowing Maggots who had developed a particularly virulent taste for the children of the [kuei_jin|E]. And Bachtiar would personally have his reputation no other way.\n\nIn life, Bachtiar was his village's healer, the primary backbone of their health in safety. However, while his mentor was teaching him, Bachtiar was instead fooling around with the younger girls of his home, paying no mind to his studies.\nHowever, when the time came for him to get to work, he put his limited experience to work not to heal, but give the illusion of relief. Using oils pressed from snakes, random herbs, and well known alleviators of pain, many would die under his care, but not until they left it.\nHis due would come though, as he would later die a lonely and horrible death from Lover's Pox. And he would be rightly sent to the Hell of Burrowing Maggots.\n\nBachtiar was weak. He would escape, but largely through begging and quack medicine. And when Rangda would eventually recapture him, rather than either attempt to fight his way out or flee, he instead begged her to spare him and offering her anything in return.\nShe took the opportunity to gain another [akuma|E], and sent him back out, where he immediately began over indulging himself again. He would find his favorite targets would be Dhampyr, specifically the younger ones, both to slake his lust and his hunger.\nAt his throne is littered the bones of countless devoured Dhampyr, while he gorges himself on their essence after death, deliriously content in his power."
 POD_persistentpodlore.desc.793337: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWithin the Indonesian Jungles, there is a shaman preaching a radically divergent doctrine. He speaks of an enigmatic god who will show them all the path to salvation by giving themselves over to the those who willingly failed so as to enlighten the world on earth.\nMany die in ritual suicides, feeding their prophet. And it is in that power base one would find the [akuma|E] named Cahaya.\n\nCahaya was always a man of faith, in both life and death. Originally a follower of traditional Javanese religion, his wild spirituality however burned with an intense fury. He found the presence of outside religions to be a threat, so from the age of 14, he began seeking out foreign holy men, and killing them in the wilderness in acts of spiritual cleansing violence, as he saw it.\nHis zeal was off-putting though, as many found the man utterly insane, even among his family. So he had to kill them too so they would not stop him in his seeking of revelations.\nEventually though, the problem would fix itself, as in a test of his faith he mediated in the hills for a week, where he finally met his end after being devoured by a crocodile.\n\nBut his death only emboldened him. In the Hell of Upside-Down Sinners, Cahaya embraced it, professing himself to the god that ruled it, unaware or simply not caring. Through embracing it, he accidentally escaped the Hell.\nHe naturally interpreted it as being a prophet of the master of the Hell, and began preaching once more, and killing again."
 POD_persistentpodlore.desc.793339: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThey say money is the root of all evil. Harta is one of many to prove such an assertion.\n\nIn life, Harta was a merchant, and an unrepentant miserly one. Every worker had to be worked to the bone, every deal had to be gouged, every poor farmer had to be extorted, and every bribe doled out to the authorities in order to continue. Choosing mainly to ply his trade in foodstuffs and using hired muscle to extort the farmers, Harta became fantastically wealthy.\n\nAnd in spite of all of his wealth, it did nothing for him when he was ran through with a spear in an alleyway and thrown into a river, where he died vacating his bowls face down in sewage.\n\nHarta however applied all his arts as he went spiraling into Hell. While it took awhile, he was eventually able to steal enough to bribe his way out. He realized though that he would have nothing, and such a state of existence was worse than death. So instead, he went to the Unnamable Lord of the Hell of Boiling Oil, requesting power in return for being an agent of hers.\nWhen he returned with infernal investiture, he immediately put his pact obtained resources to use. He swiftly cornered several local markets, and then made sure the man who killed him was found, his entire family killed, him being forced into poverty, and then skinned alive. His revenge fulfilled, Harta returns to what has always been what he sees as the highest purpose in life.\n\nMaking more money, as much as possible, no matter the cost."
 POD_persistentpodlore.desc.793340: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMany would say that power can be expressed in ways beyond just control. Intrigue, Influence, Coin, Religion, are countless means to control people. Purnama finds that all a farce. The only power is strength, pure and simple. And she wants to rule, and she has the power to do so, so if someone wants to stop her, they just need to kill her.\nSurely the mortals she has conquered would be happy with this, right?\n\nPurnama's mortal life has been rendered a haze in the process of her death. To the best of her knowledge, she was always a seeker of power, until men who could not handle her unjustly killed her with a clean decapitation. Within Lanka, she saw Ravana's pure expression of power, and in that moment understood the way of the world. She made a series of pacts to many [Glossary('Yama Kings','podgloss.yamaking')], seeking to keep her own soul free, for the day she can claim a Hell of her own, and then her ordained place as the [Glossary('Demon Emperor','podgloss.demonemperor')].\nTo this end, she used her new power as a [kuei_jin|E] to abduct numerous men, and once she had a son, she dealt away with all of them, and would use only which she created to obtain power. And to that end, she would ensure her children are cowed into line.\nIn those who resisted, it was easy enough to make them into Demons.\n\nThe world will be a beautiful thing to claim."
 POD_persistentpodlore.desc.793341: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile Dhampyr are said to overrun the jungles of Nusantara by the reckoning of the Yellow Emperor Court, when many on the mainland think of the follies of their Dhampyr, it is often Putra that comes to mind.\n\nPutra was the son of an unnamed man and Purnama, and from birth, he was groomed to be the ideal husband, a perfectly servile general, and obedient yet fearsome warrior. And to that end, Purnama is highly pleased with her son, and for his virility. However, to say that Putra is unstable as a result of it is an understatement.\nHe is utterly reliant on his mother's praise, willing to indulge in greater and greater acts of terror for even a single sentence of praise. Willing to follow any order no matter how foul or profane just for a touch.\n\nA boy just wants to make his mother proud is all.\n\nFuture Fate\nPutra was by and far more terrible an opposition than his mother was to Piyau's conquests.\nWhile his name was forgotten, he would become the greatest incarnation of the folly of male weakness in Dhampyr, and reinforce the Penagallan practice of not breathing life into their sons, and to a greater extent their usual restraint from having children. As while the world has forgotten Putra himself, the Golden Courts have not forgotten his Crusades of Consternation."
 POD_persistentpodlore.desc.793342: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe son from some of the earliest Muslim arrivals in Malaysia, the King of Ashes remembers little past that. He remembers he had died young, and violently. His memories of the of the Demon City are similarly foggy, although he remembers he was good at fighting there.\nSo much that the Raksha for a brief time had to track his movements and report to Ravana. Yusuf cared little. He simply wanted to fight.\n\nThings changed when the Raksha stopped engaging him. He began to grow bored, aggravated, desperate. Finally, in a crazed rage, he stormed into Ravana's palace, and was promptly trounced.\nRavana gave him a single choice, either he could strip him from his limbs and reduce him to a chew toy for the Raksha, or be given an endless number of enemies to fight as one of his [akuma|E].\n\nAs Yusuf marches at the host of his devils, his choice is abundantly clear. He wants war. And only war."
 POD_persistentpodlore.desc.793343: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nSometimes you can put a Devil in a sheep, but it doesn't stop it from being a sheep. And Wira is the perfect encapsulation of that line of wisdom.\n\nWira was a simple shoemaker in life, but by and large he was always skittish and isolationist. Most of his work was sold on behalf of his sister, while he hid making his shoes. He was good at it, and dedicated himself quite fervently to his work, but all that came to an end when a gang of thugs attacked his shop.\nWira, in this hour of need, instead offered to sell them his sister, give them his little store, and do whatever they asked of him if they didn't hurt him. Much to everyone's shock, his sister, so horrified by it all, grabbed one of the thug's spears and put it through his eye.\n\nEven when he ended up in the Hells, he was frightful and fearful and hid from everything, willingly giving up numerous others to final death for the sake of ensuring his own hide was never touched.\nWhen he was finally caught, he immediately folded, begging to be made an [akuma|E] for the sake of being spared. Seeing him largely as harmless and a potential additional issue for any [kuei_jin|E], he was sent back to the world of the living, where he hides and sends out devils to try and kill any threat to him."
 POD_persistentpodlore.desc.793344: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nVoracity incarnate, several isolated villages tucked away around a temple bring sacrifices before a horrible creature at a host of demons demands offerings of both great amounts of food and maidens, lest they be sacked in the night. At at the temple, desecrated in blood, spoiling food, and mortal women and captured [kuei_jin|E] alike, is the hated [akuma|E] Sabri.\n\nIn his mortality, Sabri was a womanizing monster of a nobleman, caring for little past what he could achieve and how fast he could get it. He would make a habit of touring his fiefs, and taking any woman he took a liking too as a consort, happily killing their husbands or fathers if they protested, and their sisters and mothers as more consorts if they resisted.\nBut as was due, a miserable life warranted a miserable death, so he died of sepsis, alone on his couch, after he, too obese to get up, was left to rot to death in his own excrement.\n\nHowever, his depravities would not end there. As a devil, he swiftly began exercising his will once more with demonic strength, and several other ones he broke to his service were bad to sacrifice themselves for his own way out.\nAnd even then, with labor so alien to him, he immediately began to broker with the [Glossary('Yama Kings','podgloss.yamaking')], wanting women and treats in exchange for being their hand in the world of the living. All he had to do was increase the suffering of those around him, which given the kind of man he is, he was more than happy to oblige."
 POD_persistentpodlore.desc.793345: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong women of the night, there are rumors of a secret master, taking their fair share of coin to protect them from terrible clients. Some are granted greater gifts, from greater beauty, weapons to protect themselves, or even stranger boons. And at the heart of it all, the secret spider at the center of that web, is Nurhayati, transmitting devils through her networks of sex workers and brothels.\n\nNurhayati is extremely close lipped about her path, and by her own version of the story she was simply a wife who happened to die of infection, a quite common death for peasants. However, her extensive knowledge of the lifestyle and administration of sex workers speaks to a more grim mortal life, a fate not altogether unknown to many [kuei_jin|E].\nNonetheless, her own flight from the Pit of Salt and Iron and her time in the Iron Brothels changed her into who she is now regardless. Upon escape, she immediately forwent the [Glossary('Dharma','podgloss.dharma')], and instead clung to mortality, and to that end, threw her lot in with the [Glossary('Yama Kings','podgloss.yamaking')] for bodyguards.\n\nTo her own ends, Nurhayati uses her sex workers to spread devil spirits into their clients, turning them into loyal Bakemono. It is slow going, but Nurhayati's experience and patience has shown a strong basis for success.\n\nAnd if she has the time, she may be the [akuma|E] to unite Nusantara."
 POD_persistentpodlore.desc.793346: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile it is standard doctrine among the august courts that the [akuma|E] are without failure those utterly broken into madness by their infernal masters, few embody it as much as Kasih\nWherever she appears from her hidden retreats populated by the mad and devils, she is always cackling, maddened by whatever transpired in the Hells. Through pain and pleasure, weal and woe, fanaticism and fatalism, Kasih greets it as she greets everything - eyes wild, mouth agape, dripping with gore, and frenzied in the ecstasy of slaughter. Beyond that, she is a mystery.\n\nIn her lucid moments in her retreats, she is always whispering, always speaking of times to come. Of flesh and blood, of femininity crowned in gore. Perhaps she sees herself in it.\nOr perhaps she sees another force beginning to rise out of the jungles..."
 POD_persistentpodlore.desc.793313: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nHideaki remembers his mortal service fondly, even if it was doomed. Considered the far more presentable of Miyako's original childer, he is august, tactful, and respectable. But a shadow hangs over him, a smoldering fire that refuses to go out.\n\nHideaki was one of the Emishi people. He was a soldier under the Emishi chief of the Isawa, considered barbarians by the Yamato.\nThrough thick and thin, Hideaki fought with his lord loyally and proudly. However, when Aterui surrendered, Hideaki was horrified and furious. He sought out his lord, to beg him to reconsider.\nBut the night he did so, as he was making his way to his lord's camp, he was ambushed by a terrifyingly skilled weaponmaster and warrior. The weaponmaster known only to him as 'the Sword of the Great Clan' thoroughly humiliated and trounced Hideaki, who rendered him in a hundred cuts before seizing on him to drain him of blood.\nBut as Hideaki lay dying, a bolt of lighting struck the Sword of the Great Clan back, and he fled before a masked warrior. The warrior offered him a deal, to either die and move on, or embrace the night and fight tyrants evermore. Hideaki accepted, and Miyako Embraced her second childer.\n\nDeath changed Hideaki. He learned that directness was dangerous, and reserved it for when it was needed. He was charismatic, proud, and dominated the room.\nBut this was all to advance the aims of the Blood Tribe. The same fire for revenge for the people trampled by conquerors burns in him, albeit more subtly.\nHe aspires to win, by any means he can, beyond just that of the more direct methods of his sire."
 POD_persistentpodlore.desc.793312: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nGiven her sire, Yoshino is a sharp turn from what one would expect. Lecherous, impulsive, and headstrong, the Eldest childer of the Founder of the Bushi is often considered an impertinent cow, but beneath it is an anger all too familiar to her sire.\n\nYoshino was one born to Emishi parents among a Yamato city in Miyagi. Born to nothing and treated as an outsider, Yoshino out of necessity became a sex worker from a young age, every day a struggle to be fed time and time again.\nHowever, when the Yamato began to crack down on wider Emishi resistance, Yoshino was called out by the guards as a potential Emishi spy. Stolen and dragged away in the night, she was beaten repeatedly by the guards, who had demanded she unveil any secrets she was believed to have had.\nAs she had nothing to tell them, they kept going until death was all but assured.\nBut as she was dying, a strange storm began to blow in, and as soon as the rain began to fall, she noticed how strange it was that it was red.\nShe lost consciousness, and when she awoke, her lips were blooded and her sire Miyako was over her.\n\nSince being given a second chance at life, Yoshino has used it to indulge herself in the things she had always been denied. Fighting and killing sword in hand, sex on her own terms, and the power to not take shit was hers.\nShe relished her gift, and treasured the second chance she was given."
 POD_persistentpodlore.desc.793314: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMasami was mostly a nobody. Just a young woman who was once in the way of a far more powerful woman. Once a shrine maiden, originally part of an early delegation sent to the recently conquered Emishi lands following the Thirty Eight Years War.\nIn that time, she and the rest of the temple staff sent there had hired a rather strange warrior, who never left at day and instead watched over them diligently in the night. Some of the attendants who poorly treated the Emishi disappeared in the night, but Masami's own tired kindness to them endeared the warrior to her.\n\nHowever, one night, as she was preparing a rite, she heard a scream, as a horrifying figure with horrifying elemental magic was tearing through the shrine. This shrine had somehow offended her, so the woman, calling herself the Sage of the Great Clan, was rendering all the attendants there to blood.\nMasami was the last, as she begged and pleaded for anyone to save her. The Sage merely laughed, and simply drained Masami of blood, and left her dying on the altar. But as she pleaded to anyone who would listen to save her, the warrior crawled in, wounded but still standing.\nThe warrior heard her prayer, and raised a wound to Masami's lips, and Embraced her into the Bushi.\n\nMasami's study had proved useful. Among the leaders of the Blood Tribe, she had come to become the primary arcane specialist. In part because of the routines and rituals coming comfortably for her, but also out of a desire to overcome her attempted killer.\nThe same fire that burned them in all did so in her too, just differently.\nAnd she will have her revenge, or die trying."
 POD_persistentpodlore.desc.795014: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nIndra, from the moment she drew her second breath, was not to be afforded anything but the storm.\n\nThe second 'child' of Sita and fellow disciple to Shiva-Ohm, Indra-gha was among the founding members of the Face of the Gods, there from the start. Remembering little from her mortal life, and even less from her time in the Thousand Hells beyond a horrible flaying wind and storms of iron, she would come to deeply treasure the new family she was brought into.\nBut where her fellow disciples isolated themselves in their pursuit of enlightenment, she chose to ingrain herself into the center of their collective. This is where many would have faltered, either from the lack of presence, lack of will, and lack of skill to bring a path centered around exultation of the self above all.\n\nBut Indra-gha found herself at home in the Storm's Eye. So much so it became the divinity she sought.\n\nShe would eventually become the center of temporal power within the Celestial Tribe. Through a combination of ambition, tenacity, and charisma, she would manage to keep them together. While she was not a general, her ability to balance those who were and those who wanted to be and picking and choosing battles allowed the Celestial Tribe to withstand assaults on all sides within the Eternal War.\nAnd as the world moves ever onward to the next Age, she continues this wild dance as titans clash in the storm around her, as she continues chasing its heart for the sake of her new family and her own grandeur.\n\nFuture Fate in Canon\nndra-gha's arrogance within the heart of the storm that is the Eternal War was at least not without merit.\nEven through the tumult of the Long Night, Scourge of the [Glossary('Anda','podgloss.anda')], formation of the Quincunx, and even the Week of Nightmares, Indra-gha would lead the Celestial Tribe into modernity, with enough political power and diplomatic savviness to send envoys to their traditional enemies for the sake of uniting against the threats of the Final Nights."
 POD_persistentpodlore.desc.793335: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nDespite being born as a means to an end, a mere means to enlighten her mother, sometimes all it takes is the right pushes to elevate a person to a greater cause.\n\nBorn to Wati and an unnamed and not particularly important man, Nidhi was, from the moment her mother first cradled her, showered with endless love and affection. Despite her mother's reputation as a blood drenched berserker dripping in the entrails of any [akuma|E] Piyau throws her way, she would become a radically different person when holding her daughter, who she vowed to give the world too.\nNidhi was raised among the Flaying Monkeys, and taught their ways. Despite most of their own reservations about children, Nidhi became a daughter to them all. She was cared for, knew none of the pains her mother or her sworn companions faced, and despite being of no noble blood, lived like a princess.\nTutored in enchantment and given the best education her mother could manner, she was groomed for the best life that Wati could give her.\n\nAnd it was for that reason she found the notion of a preacher, telling of the fallen nature of the [kuei_jin|E], and that the Dhampyr were wretched reflections of a higher power, that Nidhi finally learned of the rage that burned in her mother's heart.\nWho were these impudent wretches to dare question their parents? What madness did they preach that the people who gave her a perfect world were corrupt degenerates of some more noble power? What an insult that they dared to call such beloved children degenerates? What profanity to say her mother never loved her?\nNo, once Nidhi heard this, she sought out the preacher with an axe, seeking to split their head open then and there. And when they fled, they swore to find them and strangle them with their own tongue for such an insult.\nIn time, Nidhi's rage evolved, to see the Golden Children the Dhampyr once were as self righteous fools, the echoes of which needed to be expunged for the sake of saving them in the now.\n\nAnd if she would need to chase them into the bowels of hell to end their lies, then she will split, tear, maim, kill, burn, and butcher, until it is done."
 POD_persistentpodlore.desc.795030: "此角色隶属[world_of_darkness|E]设定，但故事背景极为简略，故由PoD开发者加以扩展，赋予其更多深度。\n\n武则天，这个名字早已无需赘述。其父为木材官员，母乃贵族之后，武则天自幼便被鼓励读书识字。凭借狡黠、野心、冷酷与魄力，她并未假借子或夫之名，而是以自身之名牢牢掌控了帝国。然而在一连串错误抉择与政治风云中，她在暮年之际被废黜，与疾病抗争数年后离世。\n但这并非她命运的终点。因打破了女妾之限，僭越称帝，她被投入了倒罪地狱。\n\n在历经一生的挣扎后，这座地狱的疯狂将她粉碎，又在无尽痛苦中将她重塑了千万次。须臾如千年，十年似一瞬，乞丐之座，王冠为尘，不战的军队，无欲的圣人，真理中之谎言，一步踏空即坠万丈深渊，一步登天却堕凡尘地狱。\n每个忧虑都是漫长的折磨，每丝疑惧都是锥心的恐慌。直到某个瞬间，她突然顿悟。而一旦领悟，便无法止步。最终，她乞求返回人间。\n\n于是地狱之主将她送回凡间。她在陵墓中苏醒，她的身躯焕然如新，她的胸膛无有起伏，她的一切领悟仍在。而她的滔天怒火早已超出肉身所能承载。\n\n[kuei_jin|E]发现了盛怒的她，于是将她送入了魔虎啸。这怒火在她体内燃作了熔炉。她目睹自己曾经的辉煌被抹为无字之碑，她遭受的苦难则熔炼成了炽烈的复仇之炉。\n她将再创伟业，一个刻骨怨恨的杰作。她将不再下跪，只会驭魔而行，所至之处，光明与黑暗齐至。她是二度降世的帝皇，若不能再统日之所照，便统御星之所临。\n\n无论再耗多少岁月，武则天终将再次登基。"
 POD_persistentpodlore.desc.793347: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAt the foot of the throat of the world, there is said to be a song. Many of the Hungry Dead seek it, but few tend to the land that leads there.  One of the lucky few who would be content would be the venerable Tenzing, Keeper of Shigatse. However, as the winds from the north begin to howl, he has found himself forced to action.\n\nTenzing was born during the decline of the Yarlung Dynasty, surrounded by the chaos that naturally comes with an empire in decline. While most of his homeland was thrown into panic with the assassination of King Darma U Dum Tsen, Tenzing saw in that chaos space to profit. Transforming his small village into a supposed 'refuge' he would actually pay thugs to assault and kill people on their way to safety at choice mountain passes, using the chaos of the age as cover.\nHe became fabulously wealthy, but that did little to protect him when during this Era of Fragmentation one of the survivors of the raid managed to uncover his treachery, kidnapped him, and left him to die of exposure in the Himalayas and send his soul hurtling into the Hell of Being Skinned Alive.\n\nThe experience was intensely sobering, as Tenzing was stripped of all that he had and that he was. While he did eventually escape, he became an ascetic, detesting wealth and devoting himself to learning. He would rise among the Shigatse monks, and proposed numerous critical theories and would spearhead their demon hunts.\nHowever, when Fan retired and Da assumed leadership of the White Tiger Court, the fool had the audacity to try and push deeper oversight on the Shigatse Monks. As such, they rejected Da's pleas for aid when the [Glossary('Anda','podgloss.anda')] began to gnaw on the Court, and Tenzing, the leader of the monks at the time, watched as it crumbled. But now, Tenzing moves once more into chaos, seeking to rebuild the White Tiger Court into something more as what the Shigatse envisioned when they joined.\nAll he must do is succeed where he had once failed, and thrive in the chaos.\n\nFuture Fate\nThe Shigatse Monks, while strong, were too isolated to do much to oppose the [Glossary('Anda','podgloss.anda')]. But while most of the other exiles fled East, he ordered they go to ground and fortify the Himalayas against the [Glossary('Anda','podgloss.anda')].\nTenzing would simply retire to his research after that final order, to dedicate himself once more to his research on the Defiled and Half-Devils."
 POD_persistentpodlore.desc.793348: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n即使范会从她的帝国隐退，她的同伴中仍部族有人会竭力确保她所建立的一切不会崩塌。而在冰角盟中，妇好始终站在她一直所在的位置——最前线。\n\n生前，妇好是商王武丁的六十四位妻子之一，这场联姻是为了巩固商朝与其边远部落的联盟。在武丁的众多妻子中，妇好以卓越的领导才能和军事天赋脱颖而出。她逐渐晋升，最终成为武丁的第二任妻子、女祭司、军事统帅和将军，并拥有自己的封地。\n她的征战功绩使她成为武丁麾下最伟大的将领，统领着商朝最庞大的军队。虽然她先于武丁离世，但被以最高规格的礼仪安葬在都城。\n\n然而，妇好在死后于楞伽苏醒，因生前的征伐而化为魔鬼。尽管历经折磨，她依然坚韧不拔，而武丁祈求她指引的祷告将她引回了生者的世界。当武丁去世时，这位战士妻子最后一次探望了他，确保自己无论生死都会陪伴左右。\n当武丁的灵魂前往来世后，她怀着敬意加入了[kuei_jin|E]的社会。\n\n妇好的军事经验、克制、勤勉以及在战斗中的无畏决心，使她进入了范的视野。这位高大威严的女性接受了在[Glossary('屋室','podgloss.wu')]中担任战士的职位。她对十季宗派的研究和冷静的意志为她在范的皇朝中奠定了重要地位。当范隐退时，她试图尊重其意愿并向达效忠。但随着[Glossary('安答','podgloss.anda')]的入侵，她试图集结军队时，达却拒绝派遣兵力，导致多个皇朝被洗劫。\n妇好无法容忍这一切，她脱离皇朝并集结了自己的力量，加速了皇朝的解体。如今，她正重整旗鼓，试图重建范的皇朝，并向[Glossary('安答','podgloss.anda')]发起反击，誓要将他们彻底击溃。\n\n其在原作中的未来命运\n她所能集结的力量终究未能阻挡[Glossary('安答','podgloss.anda')]的攻势。白虎皇朝的分裂使其成为入侵者的囊中之物。妇好对[Glossary('屋室','podgloss.wu')]的忠诚至死不渝，最终下落不明。据最后目击，她独自与[Glossary('安答','podgloss.anda')]战斗，为冰角盟的其余成员争取了逃离的时间，而他们最终去向成谜。"
 POD_persistentpodlore.desc.793349: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMany Dhampyr are living a lie. They suffer, they bleed, they cry, they beg, they pray, all to no avail. Sometimes though, one too many straws breaks the pack animal. And where some collapse, some fight back. And Reyhangül wants a pound of flesh.\n\nReyhangül was the daughter of a kidnapped mortal woman and a flesh eating monster. Called a 'Shadewalker' from her birth, it was instilled into that all her life was to be a thing of amusement for her father, and for her agony to be the power of their true god. Growing up alone with only her father, she needed no stories of Hell to pray too, because there was not a day she didn't live it.\nHer dreams were haunted by light and subservience, of a death replayed a thousand times in her mind. And when she was old enough, her father took her as a wife, to fulfill the purpose she was born for.\nMore she begged and prayed in secret to the light that once struck down the monsters in her dreams. Unfortunately that is not what answered. Other blood drinking devils found her father, and after a battle, took them both into the mountains.\nThere she was tortured day and night, told she was a monster by her captors. Sinful, wicked, and deserving of pain, all while all Reyhangül could manage was confusion and terror. She began to find solace in the burning devils of her dream, relishing the moments where they died in agony, wishing for it dearly.\nFinally, one night her dream was interrupted with a whip, and in the haze of pain and slumber, she took her untrimmed nails and wicked fangs and tore them apart. She gathered more damned souls and took them and fled back to lands she remembered.\n\nAfter taking the books they held, things make a bit more sense. Reyhangül knows she is one of the Golden Children, betrayed and butchered and reborn in a lower state. So too are all the other Dhampyr she fled with.\nSome are content with their parents but she knows the truth. She knows she must spare them their parents' tyranny. No, the looming wickedness of the dead must be expunged and torn out.\nThe [kuei_jin|E] are damned. They all must be swept away for their once murdered children to set things right. That has to be it.\n\nIt has too.\n\nIt has too."
 POD_persistentpodlore.desc.793350: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong many within the Courts of the Hungry Dead, it is a common stereotype that most every [kuei_jin|E] from India is a heretic of some kind. Among those detractors in the White Tiger Court, the Boar is there to... eloquently show them the fault in their wisdom.\n\nNarayan in his mortal life lived on the banks overlooking the Bay of Bengal. A fisherman his whole life, he lived by the principle that if his life was fine, there was little reason to change it. Boring and steadfast, he had a very mundane life, up until one day, when he went fishing, he accidentally snagged a swimming tiger, and was promptly drowned and eaten by the irate Khan. And for the sin of striking one of the Emerald Mother's champion, he was thrown into the Hell of Boiling Seas.\nDespite the injustice of it all, he accepted his hell, and sank to the bottom, falling through a cave, and then waking up in the mortal world on the shores. When the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] found him, he was simply fishing once more.\n\nNarayan would be brought to the Court, where he was, after a single argument with his [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], immediately sent to the Courts of the Eight Lotus Blooming. Despite his temper, Narayan took to it like a fish to water, and at times even arguing with his mentors for at times changing their minds on topics or subjects.\nHis determined and angry fortitude did make him an easy representative of the Resplendent Cranes, and his predictability and loyalty made him fast friends with Fan, and easily a Keeper within the [Glossary('Wu','podgloss.wu')] of the Horns of Ice. And while he would give her no relief from admonishment for her retirement, he did eventually come around by convincing him little was going to change.\nBut the disruption of the arrival of the [Glossary('Anda','podgloss.anda')] was such a rile to him, that when Fu Hao began to rally forces against them, he joined with her, determined to put those trouble makers to the calm of the grave and make order once more."
 POD_persistentpodlore.desc.793351: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nEven in a court as loose as Fan's was, given the seditious and hideous nature of their enemies, one would be a fool not to have a spymaster. And always in the shadows of Fan's court, the Millipede was there.\n\nErke-kara was born on the steppes a long time ago, but he speaks little of that time in his existence. One of countless lost to a fever, he was found by the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] still coated in the vermin of the Hell of Burrowing Maggots, still shaking them off as a feral beast. But when he was brought forward, he always stayed out of sight.\nQuickly going to his lords, he whispered among the small things and looked through a web of spies to stay ever wary, constantly watchful for any and all threats. Slowly rising through promotions and recommendations, he found his favored place among Fan's court, as he adored the general trust she put in him.\nNot asking too many questions when [akuma|E] disappeared, not looking too deeply when potential threats arose. And when she retired, none of those who had any grievances with her had much ground to last.\n\nHowever, in the chaos that followed, Erke-kara found himself quite liking Tenzing's methods. Even more hands off than Fan, with her blessing he went to join his court.\nEven despite him standing opposed to his [Glossary('Wu','podgloss.wu')] member Fu Hao, he does prefer the more lax structure Tenzing cultivates. But despite his cold exterior, he dearly hopes he will never be ordered to turn the blade against his companions..."
 POD_persistentpodlore.desc.793352: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the many forces that once were common place in the White Tiger Court, among the most out of place it seemed was that of a pretty faced among a court of warriors, sages, philosophers, and spymasters. But behind the honeyed voice, mastery of songs, and alluring of forms, was a lethal embrace that snuffed out the light of foes with hearts that could not be swayed.\n\nYahui in his mortal life was an orphan of the Warring States period of Chinese history, in the state of Wei. Early on, all he had was his charm, his wits, and his beauty with little else. He put all of them to as good a use as he could, but in such a time, the fate of men of the night was often brutal, and when the period was coming to an end, Yahui was just one of the countless nameless dead from the Qin Conquests. And in death he found himself stripped of identity in the horrors of the Iron Brothels of the Hell of Salt and Iron.\nStripped of the tools of life, he shaved his teeth into viper fangs and chewed off his hands and ankles to escape, pulling himself from the Hell a serpent. When he was found by the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], they were astounded to find the face of the Devil Viper one that could stun them all.\n\nYahui was civilized and trained as an Iron Talon, using his incredible charm and guile to strike down [akuma|E] too blinded to see the fangs that lay beneath. Once given the choice though, he rushed to Fan's court, and swore fealty to her.\nHe served her intensely, faithful to the Court she shaped. Even if he could not win the person who had his heart, he would at least safeguard their work. When Fan retired though, Yahui was lost.\nRather than break apart like most of their [Glossary('Wu','podgloss.wu')] had, Yahui instead simply went with Fan as she retired, and continues as he always had."
 POD_persistentpodlore.desc.793353: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWithin Tashi, there are whispered rumors among the spirits of secret meetings and dealings. Of some of them, there is word of a thief, of a corpse with the tell tale eye of the soul arts.\n\nThey are in part correct. But it would be silly for Jetsun to set the story right.\n\nJetsun, in his mortal life, was just a town guard. He was pretty good at it, and even despite their small town being out of the way, he was able to catch a fair number of thieves. But one night, a thief was running through his town, one that stumped all of his fellow guards. Jetsun devoted himself to catching them red handed.\nWith careful baiting, he set a prize too good for the thief to pass up, and was sure that he had them. And the moment the string it was held upon twitched, he sprung upon them, laughing in victory.\n\nHe had caught the Salubri methuselah Zao-zei, and was embraced for his troubles. And promptly brought into the fold of the Wu Zao.\n\nSince his embrace and training, Jetsun, while great at catching thieves was terrible at being one himself, so he was instead moved to another critical position. The Wu Zao instead needed access to China through Tashi, so Jetsun was sent to make sure those roads stayed open.\nThere, he waited and patiently ingratiated himself into the Ancestor Jiang Shahua's court, finally getting the audience he needed. There, he remains, keeping those gates open while playing the waiting game. So while he once caught thieves, he now opens the door for them."
 POD_persistentpodlore.desc.793354: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt is the duty of a doctor to heal and protect. Even if it isn't always on people, Yangwa has never erred in his purpose, either as a mortal or as a vampire.\n\nLiving as a doctor within the city that would come to be known as Tashgar, Yangwa's trade as a physician and doctor was incredibly important at the threshold to China. He was good at it too, growing old and saving hundreds in their travels. And it was for his skills that he was watched for an extended period of time, and another healer visited him as he slept, and granted him vitae so as to elevate his capacity to heal.\n\nWhile death took some getting used to for Yangwa, he was a local in the city, which the Wu Zao needed to further secure it remained open to them. His skills as a healer opened him up to its ruler in the night, Jiang Shahua. Outwardly, he presented himself to and aided the court with his 'soul arts', while he quietly opened his shop to other Wu Zao, a haven and sanctuary into China proper.\nHe knows not fully what they do, but it is his duty to protect. And so he remains steadfast, keeping that road open.\n\nSurely nothing bad will come of it."
 POD_persistentpodlore.desc.793355: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the few trusted visitors of Jiang Shahua, one stands out. A woman always clothes in fine silks, eyes bleeding red, yet not an [akuma|E] nor a Devil Tiger. Something other, still a user of soul arts of a kind. While her third eye is typically hidden, when it appears, all feel a crawl up their spine. Something old and ancient, with a terrible gaze that inspires fear where she walks.\n\nAkari was born far further East, but is a cultural chameleon, adapting where she goes. Her mortal life was brief, embraced before her 20th year, and by a force of terror and darkness. It educated her, teaching her of the horrors of their master, and most strangely, instilling in her how important it is that those with three eyes and drink blood are able to go where they're needed.\nIf she did that, her sire would not interfere with whatever she did.\n\nAkari found this perfect, and hearing the thrum of that which dreamed beneath the earth, smiled and went to the gates. Charming and cunning, moving her way into main throat of the world she knew, she built her power there, playing nice and waiting, And when the watchers came, she ensured they could go through unchecked with the right words and right gifts to the ancestor.\n\nAll according to plan of course. It's what those that dream below would want."
 POD_persistentpodlore.desc.793356: "This character was created for the Relentless Age fan supplement and is used with permission. They are not an official part of the [world_of_darkness|E].\n\nMa Hai-Lan was the daughter of a minor official of Zhongdu and lived an uneventful life until the Mongols came and destroyed the city, killing countless people in the process including her and her childhood friend Lin Xiao. They were both sent hurling into the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] and it was there that Ma Hai-Lan revealed herself, leading a group of fellow prisoners to escape. They would become her [Glossary('Wu','podgloss.wu')], the Demons of Zhongdu.\n\nShe sees the breaking of the Five August Courts as disappointing, but not surprising. When she joined the Hungry Dead, falling in with the warrior Cranes who would eventually found the charter cities of the Yellow Emperor Court, she’d heard more than her share of whining and bitching– always from the most unworthy immortals, bamboo princes who acted like they deserved the world. To “General Ma,” a proud and militant believer in the Eightfold Lotus Path, the truth is simple: You take what you deserve with bloody, battered hands, and only then can you say you’ve earned it.\n\nAs General Ma sees it, the night world of mainland China has reverted to the banditry and lawlessness of ancient times– which, to her, represents the returned opportunities of her misty youth. China is ripe for the taking once again, if there are Hungry Dead willing to follow her.\n\nThere is no room for bitterness. The old August Courts may have lost, but so what? They’d lost heaven’s favor, grown fat and indolent in a beautiful world that they thought would last forever. The [Glossary('Anda','podgloss.anda')] and their allies in the heretical sects are not the inheritors of heaven; they have not built a polity from the chaos they sowed.\nThey are merely a test, which the next worthy champions must face and defeat. Ma Hai-Lan fully intends to be that champion, building an army to take cities one by one.\n\nThere was once an empire of the dead, righteous and pure… and now China is ready for the next one.\n\nFuture Fate\nDespite the death sentence that directly opposing the [Glossary('Anda','podgloss.anda')] often was, through Ma Hai-Lan's leadership and tenacity she and her [Glossary('Wu','podgloss.wu')] would survive this threat, and outlasted the Hell she once belonged too.\nShe would become an isolated ancestor of the early Quincunx, and would tend to her court dutifully until her dispute with the more conservative ancestors will become a schism at the start of the 20th century."
 POD_persistentpodlore.desc.793357: "This character was created for the Relentless Age fan supplement and is used with permission. They are not an official part of the [world_of_darkness|E].\n\nTelling tall tales and capable of spinning a thousand stories about her past, Lin Xiao hides the truth behind the veil of misdirection and myth in the making. All to suppress her anger.\n\nLin Xiao was the daughter of established merchants in Zhongdu, and was raised in their profession. But all the way from a child, she loved nothing more than stories. She adored the legends of great heroes and the gods, and often threw herself into them.\nPerhaps the greatest gift her parents gave her was teaching her how to read and write, as soon she was composing stories all her own. Rarely ever going out unless it was to play with her friend Ma Hai-Lan, Lin Xiao always envied the founder of dynasties, who rose from humble origins to ruling the whole of the known world.\nSo caught up in it all, she hadn't even realized the walls of Zhongdu had fallen until a Mongolian sword was already cleaving her head from her shoulders and sending her into the depths of the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')].\n\nThe experience broke Lin Xiao. She saw flickers of her home ablaze as she fell into hell, the smoking embers of her stories both composed by her and ones she adored following her.\nFor the most part, she simply accepted her fate. Even when her childhood friend rescued her, she was quiet and morose, all the way through their escape and collection.\nShe never spoke, and simply doddered about unlike a shadow of herself. At least until she saw the ruins of Zhongdu. Something inside of her sparked, a conflagration of anger and sorrow, that consumed her being.\nThe Howl of the Devil Tiger called to her, and she would let the [Glossary('Anda','podgloss.anda')] hear her roar alongside her [Glossary('Wu','podgloss.wu')]. In a storm of lies and tricks, she would turn all her strengths to the support of her [Glossary('Wu','podgloss.wu')].\n\nFuture Fate\nLin Xiao would survive the war against the [Glossary('Anda','podgloss.anda')], and see the rise of the Quincunx take ahold of the Night World.\nShe quietly receded back to her home, and lingered as it was rebuilt. During the overstepping of the Blood Court and the Century Rebellion at the chaos of the turn of the millennia, after centuries of waiting, the now Grandmaster Lin assumed control of the night in the city that arose over her home, Beijing.\nShe would align herself with her childhood friend once more, but this time, she will be equal to the tall tales she tells her students. She will be greater than them all."
 POD_persistentpodlore.desc.793358: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt is a sad thing to be born into a military life in the closing days of an empire's life. And perhaps if Yanxiang had lived in a different time, he could have been a truly decorated soldier. Now, he will have to content himself with it in death.\n\nYanxiang was one of many soldiers in the last years of the Jin Dynasty, stationed at Zhongdu as a reward for his earlier success in his career for repelling the earliest raids from the nation that would become the Mongol Empire.\nHowever, this appointment would later kill him, as the eventual siege and destruction of Zhongdu would see him slain on Zhongdu's walls, dying in defense of the city and finding himself in the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')]. Struggling against the chains, he merely had his essence sapped to its lord's foul ends.\nHowever, by sheer luck, he was one of the lucky few close to another escapee, who in her flight, helped them escape, and in turn, Yanxiang helped fight alongside of them as they fought their way back to the world of the living.\n\nUpon their discovery by the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], Yanxiang was placed among the other escapees as the moral heart of his [Glossary('Wu','podgloss.wu')], as despite being a soldier, he was actually among the most tame among them when it came to combat.\nHowever, standing by them ardently, his experience from his life will be critical in the war against the [Glossary('Anda','podgloss.anda')].\n\nFuture Fate\nYanxiang's practiced wisdom would see that every member of his [Glossary('Wu','podgloss.wu')] would survive to see the formation of the Quincunx. He would go to become an Ancestor of the town that would become Zhuhai, and as the Quincunx falls into decline, he would reconnect with his old [Glossary('Wu','podgloss.wu')], eager to aid in Ma Hai-Lan's ambitions to restore the Quincunx, using his position as the Ancestor of Zhuhai to aid the Demons of Zhongdu."
 POD_persistentpodlore.desc.793359: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhen one sees the [Glossary('Wu','podgloss.wu')] of the Demons of Zhongdu, few come to any conclusion other than that Tai is a beast of a man, tall in form and wide in figure, with strength and fury to match. Given how he is known, his mortal life comes as a thing of irony to those who knew it.\n\nTai was the son of butchers, and raised a butcher. Strong from meat hauling and skilled with a knife from cutting, he was actually quite happy with his life, and got to marry his childhood sweetheart Shufen.\nHe would have loved nothing more than to grow old as a butcher with his life. But that would not come to pass, as his home would be destroyed by the Mongols in their early conquest, one of the many dead in Zhongdu's sack who would find themselves falling into the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')].\n\nDespite the awfulness of it all, losing his beloved Shufen incited an immense rage in Tai. His wrath became something of horror, as even Demons would avoid the newly made devil in his crazed thrashing in the Spiked Chains.\nAnd when he was released by another escapee, he immediately rushed to his beloved like a crazed bull, and split her chains apart with his bare hands. They would escape together, alongside their liberator and a few other devils back to the world of the living.\nCollected together, they were put into a shared [Glossary('Wu','podgloss.wu')] after their training. Tai himself was eager to fight alongside them for revenge, as they were positioned as a [Glossary('Wu','podgloss.wu')] to fight the [Glossary('Anda','podgloss.anda')].\n\nFuture Fate\nTai's fury would see him through the war against the [Glossary('Anda','podgloss.anda')], and he would become one of few Dynasty Toppling Ancestors.\nHowever, as the Quincunx began to wane in the early 20th century, at Ma Hai-Lan's recommendation he would seek out to position himself as Grandmaster Ancestor. As he hears whispers of a potential return of Dobrul the Brave, he agrees more than ever with his fellows.\nThe Quincunx must be restored, and the Heaven and Hell Legion is the best one to do so."
 POD_persistentpodlore.desc.793360: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOnce upon a time, Shufen would have been happy to grow old as a wife. Now though, she longs for so much more.\n\nShufen was born to minor palace servants within Zhongdu, the capital of the late Jin Dynasty. Her parents were frequent customers to a local butcher, and it was there she met the man who would become her best friend, love of her life, and then husband.\nOverjoyed to be one of the rare few lucky enough to marry someone they loved and desired, she happily married Tai and helped tend to his butchery when his parents died.\nBut unfortunately, her happy ending was cut short by the Mongol sack of Zhongdu, leveling it to the ground and burning it away, Shufen one of many to be scoured away into the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')]. Taken from Tai and serving as mere fuel to its master, she was lashed apart as she struggled endlessly to break free, calling out endlessly to Tai to save her.\nAgainst all odds, he answered thanks to a devil breaking free, and they escaped together alongside several others back into the world of the living.\n\nAnd with this second breath, she would not be helpless again. The whole affair of merely being a damsel upended the order in Shufen's soul, and she would never tolerate being weak again. No, she would take all power she could, strike down the wicked who would threaten her again. And now, that is clearly the [Glossary('Anda','podgloss.anda')].\nThe other escapees are at her side, and Tai has his own wrath now. Her beauty now a tool, her charm now a dagger. She would fight now. To make sure she would never suffer the same fate again.\n\nFuture Fate\nShufen would survive the war against the [Glossary('Anda','podgloss.anda')], alongside the rest of the Demons of Zhongdu.\nNeither her or Tai would be content with retirement, so they became wandering Ancestors. But as the Blood Court threatened the stability of the Quincunx and they received word from Ma Hai-Lan that they would fight once more.\nShufen readily affirmed her loyalty to the new Heaven and Hell Legion, and sought to become the Grandmaster of the Iron Talons of Shenzhen to that end. She would then join in on Ma Hai-Lan's new war, eagerly and with all her heart once more."
 POD_persistentpodlore.desc.793361: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAcross Asia, there are whispers of men and women that wear the shape of snakes. Among the night world that they are secret agents and enforcers of the Beast Courts, their mighty and fearsome assassins subservient to the inscrutable will of their mother goddess. And among their kin, there are many who live and die forgotten and unsung.\n\nAmphai would not tolerate the same fate. If Gaia would toss him aside, he will break her, and leave her shattered at his feet.\n\nAmphai was a Nagah Kinfolk born in the Indochinese wilderness. Not blessed with the First Change, Amphai was promptly set up with a Nagah wife three times his age. When he protested, and asked for some other way to be useful, his legs were instead broken by his Nagah father, who told him on no uncertain terms that if he didn't have children, he would kill him. Unfortunately for Amphai, his sterility would be a death sentence, and he was executed for the unforgivable crime of being unwilling and unable to conceive a child. And for that, his soul was sent to the Hell of Wretched Magic.\nBut unlike so many others, he simply accepted his fate, earning the curiosity of Grandmother Witch, the Hell's [Glossary('Yama King','podgloss.yamaking')]. When she questioned him on what he would do when he escaped, he merely told her he would kill the soul of the earth, and if she had nothing else, to leave him alone. Impressed by his answer, she took him in, trained him, and then released him back into the world of living vested with infernal power.\nSlowly, his desire for more and more power behind a deceit of weakness for the sake of destroying Gaia has yielded fruit, as the Scarlet Phoenix Court wanes, and an entire archipelago ripe for conquest lies before him. And at his side is finally the lovers of his own choice brought into his coils, to spite the estranged family that killed him.\n\nFuture Fate\nAmphai would be among one of very few Defiled in Indochina to not meet death before Piyau's campaign, holing up deep in the mainland and waiting.\nBy the time of modern nights, he has perfected rites of invulnerability and espionage with numerous enthralled Nagah below him, alerting him of all intruders in his domain of Vientiane.\nHere, he nears another final precipice, to take on the full power of a [Glossary('Yama King','podgloss.yamaking')] himself, and use that power to launch his own campaign to conquer Gaia."
 POD_persistentpodlore.desc.793362: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWithin the haven of the Serpent Sovereign, at the master's side, there is always one beast of a Devil. Tall, built like an ox, and with a skill to match such strength, to be the most honored one among the many men at the Sovereign's throne.\nBut despite the air about it all, Vixay has what he always wanted most. A guiding light. No matter where it leads him, even into the depths of damnation.\n\nVixay was simply a soldier in life, to one of the many city states in Indochina. He was a good one, incredibly skilled with a spear, and peerless in form.\nFor his service, he was the pride of his city. However, he was just as expendable as any other man, so he was spent like one, and died unmourned on a forgotten battlefield. And in the Demon City, the pointlessness of it all broke him. He accepted his place as a soldier in the city, a hollow shell of what he was.\nHowever, he would eventually find a light of a kind. A man with the bearing of a serpent came to him like a light from the heavens, offering to him a cause to fight for, one everlasting, where he would have someone that appreciates him. Someone to love him. Someone to take him and never let him go.\n\nAnd even as it damned him, Vixay took it eagerly, a loyal spear for his serpent king. And however his king would need him, Vixay would be there for him."
 POD_persistentpodlore.desc.793363: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhat good is a serpent without its venom? No matter the shape, no matter the size, it is a poor snake that lacks the means to slay its foes in agony. And yet, such venom can also heal, and in the world of the night, there are countless means of pain that can be alleviated.\nAnd at Amphai's side, Sengdeuane is his master of both, in such a wonderful shared package.\n\nSengdeuane was originally a rural doctor, dealing primarily in snake bite antidotes but a pretty good doctor nonetheless. One day however, a woman came to him asking for a medicine that could undo a horrible wrong done to them.\nEven despite the adamant demands from his mentor not to, Sengdeuane prepared the draught for her. Despite the good deed, he was caught however, and killed by the would be father for denying him his 'claim' over his victim, locking him in a box and burying him alive after knocking him unconscious.\nAnd Sengdeuane would be cursed to [Glossary('Kakuri','podgloss.kakuri')]. And there, he cursed the world endlessly for its cruelty, begging for some means to shatter it and grind it away as he howled in that insensate plain. And it was there that, as he crawled through the caves and out the colds, his arrival to the world of the living was met by a half-serpent, vested in the power of hell.\nIt told him they could do all that and more. If only he served.\n\nIt was the easiest decision of Sengdeuane's existence. And even if he wasn't the favorite, knowing what may come, knowing that the terrors and pains of the world may finally be ended, he would do so happily.\nUntil the day that he may see the [Glossary('Demon Emperor','podgloss.demonemperor')] arise and wash it all away."
 POD_persistentpodlore.desc.793364: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn an ever changing world, even the most zealous of lunatics will fall before the might of logistics and supply. Part of the success behind the Serpents was not due to their own individual power or skill in battle, or zeal for their master in the Hell of Wretched Magic, but rather, due simply to having someone who can properly manage the flow of coin.\nAnd such an art is one Oudom finds comes naturally.\n\nOudom in his mortal life was simply a merchant, taking the dangerous profession of moving goods throughout the potentially pirate or bandit rich wilderness to reach isolated towns and hamlets. The wealth of abundance that his homeland had offered many opportunities for him though, so he took the dangerous routes.\nAnd all for the sake of his home village on the Mekong. Unfortunately for them though, as Oudom plied his trade, he made the mistake of insulting the wrong man. Seeking to humiliate him utterly for the slight on his pride, he had every caravan and every line Oudom had attacked, so he could watch and mock him as he fell into poverty.\nAnd finally, as Oudom made one final trek with goods, he was ambushed and captured, and beaten to death with lead coins to mock him. And such a death would send him into the Hell of No Money.\n\nThe experience broke Oudom, who simply laid in the dirt and accepted his place as a new begging devil. And for an unfathomable time to him, finally, he had enough scraps to crawl free. But the first to find him was the Serpent Sovereign, who recognized the intellect he had and took him in. He offered him a place he could actually use his mind, manage all the coin and trade of a new world, have the comfort of a liege who would protect him, and a lover who would never abandon him.\nOudom, having endured the shame of poverty made hell, simply never wanted to suffer that, and readily accepted."
 POD_persistentpodlore.desc.793365: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAs a boy, all Khamxay wanted to do was raise animals and make friends. And the world would break him for it, all for a single sin.\n\nKhamxay was born to a small village, as the son of the family that often tended to the majority of the oxen. From his youth, he was a cheerful and honest soul, and loved to care and play with animals.\nHe never wanted the spotlight, and was simply content with what he had. However, his life would sent into a spiral when a man wanting his family's oxen offered to marry Khamxay to his daughter.\nHowever, Khamxay simply wasn't interested. He didn't want to potentially worry about losing his animals.\n\nUnfortunately, the man took the refusal as a slight, and in the night, as Khamxay was tending to the pens, set fire to it killing Khamxay along with most of his family's animals. And in the confusion of death, he found himself in the horrors of the Hell of Upside Down Sinners.\nTerrified and simply wanting it to stop, he begged and prayed to anything that would listen. He would slowly learn the inverted rules of the hell though, and defying all mortal logic, trusted a snake.\nHe followed it back to the world of the living, to a master. The pale snake that found him properly brought him back to a degree of lucidity, where it offered him a deal - serve him in mind and body, and he would have his soul's rewards in the next world. Use his candor and friendliness for him, and know greatness.\nJoin his haven and his consorts, and never know the threat of danger again.\n\nKhamxay took the offer the moment Amphai had finished the proposal."
 POD_persistentpodlore.desc.793366: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nHer homeland overrun, the ancestors waning, and new blasphemies running rampant. Its enough to drive men and women mad. But all of them forsake that which may elevate them to greater heights. And Thiri will not forsake those who stand with her, in life or death.\n\nOnce a disciple of Dyanang, Thiri was, once upon a time, an Acolyte of the Thrashing Dragons. However, her path was at many times fraught with going too far into the world of the living.\nThiri at her core still deeply cared for the echoes of her mortal life, and the more rampant excesses of other Thrashing Dragons disturbed her greatly. Their aspirations of turning her quiet home into a grisly whirlwind of sex and violence, the decay of the courts, and at times deeper introspection into paths called heretical by the foreign overlords, Thiri had finally had enough.\n\nBreaking contact with the Scarlet Phoenix Court, she called upon all disciples she could. Their ambition was to set their home right, to throw off the chains of outside dominance and restore the family to the center. Such was her ambition. Such would be her path. And so it would be done.\n\nFuture Fate\nDespite some initial success, the decline of the Scarlet Phoenix Court and rise of the Golden Courts would see Thiri forced into exile, fleeing before Piyau's forces, who lumped her in with the [akuma|E].\nBut Thiri would bide her time in exile, before finally returning to try and pick up where she left off in Final Nights."
 POD_persistentpodlore.desc.793367: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nHad they simply let things be, Nanda would have been content to leave things be. However, as his home lies endangered and Devils and Tyrants alike scratch at the door, how could he not be driven to act?\n\nNanda was a man who came from nowhere when he was found by the Devil [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] of the Scarlet Phoenix Court. His past a haze, only guided his morals and the traumas of the Hell of Boiling Oil, he tried to adopt the Thrashing Dragons as was expected of him, but a part of him simply just didn't get it. None of it made sense, to forsake the gift that was humanity.\n\nIf the Hungry Dead were damned, why should they forsake humanity then? All these questions haunted him, and when he made these questions, they responded not with reason, but rebuke. It is little wonder then that he immediately threw in with Thiri in her campaign to restore proper rule under the embrace of family.\n\nThe two became incredibly close, and chose to affirm their dedication to family by building one of their own. Where she guards and leads the house, he takes the arms and leads their new family to war against the foreign demagogues and wicked devils that assail their homes.\nUntil the stain is wiped clean, he will fight."
 POD_persistentpodlore.desc.795041: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nEven among the Hells, the Hell of Being Skinned Alive is a particularly nasty one. All who escaped its wastes have special enmity from their former jailer. And so Wu Lishan, since her flight from its horrors, has hidden behind a web of connections at the heart of Chang'an, using the apparatus of the Yellow Emperor Court as the ultimate shield.\n\nIn life, Wu Lishan was the wife of a minor noble, who in particular loved all the benefits that came to being the wife of a man of wealth. Extravagant and loving things of beauty, she hungrily squeezed his lands dry of more luxuries to enrich herself with.\nBut such things bring enemies of course. When her husband drove a family to homelessness, their cook, the brother of the mother of the family, poisoned them all, and Wu Lishan was humbled and stripped of all her nothingness of wealth by iron laced sands.\nBut death imparted lessons, and through skilled use of poisons, was able to poison her jailers in escape.\n\nBut that was long ago, and now Wu Lishan is an Ancestor among the Yellow Emperor Court. She was the driving force behind the Amber Wren's shift to mercantile pursuits, acting as the main financial arm of the Court.\nShe promises more and more as various ventures enrich them, but her attention is spreading thin. She will have to be canny and capable to be able to balance the finer details of the court while avoiding the omnipresent fear of Hell coming back for her.\n\nFuture Fate\nMuch to her horror, the Yellow Emperor Court was only a single assassination away from imploding. The ensuing chaos destroyed her chains of supply, and as she was unable to foot the bills, numerous debtors came to collect.\nAnd such, in all her fear of the Hell of Being Skinned Alive, she was sent into the final void, stripped of all her wealth once more."
 POD_persistentpodlore.desc.793368: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the Amber Wren within the Yellow Emperor Court, one of their members is rarely seen. Their supposed center, the ties that bind them all. A core that never leads, a guiding force that lends them their heart, and uniter who seems to shunt the open areas.\nAnd yet, the kind Hungry Dead with the face of the old lady is the foundation upon which the accomplishments of the Amber Wren stand.\n\nJingyi was always old at heart. Quiet and kind, yet meek and supportive, she is the friend everyone wants yet never sees. Overworking herself in life straight into the [Glossary('Wicked City','podgloss.wickedcity')], she moved on further into the world of undeath with the same degree of earnest support for her new companions, the locus of her purpose.\nShe was fast friends with all of them, the shoulder they could cry on and the ear that could never turn them away. And even if she was often enabling, she was a critical source of advice for them all, and the binding glue that held them all together.\nAnd as the [Glossary('Anda','podgloss.anda')] draw closer, her ironclad support of her [Glossary('Wu','podgloss.wu')] will be needed now more than ever.\n\nFuture Fate\nThe ensuing chaos of the eventual crumbling of the Yellow Emperor Court would strike the Amber Wren harder than most of the old ruling class.\nAnd as Jingyi traveled to try and rally her companions, a Black Wind fell upon her, and she was sent to the final void as ash on the wind."
 POD_persistentpodlore.desc.793369: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn a time of warriors, it is little wonder that so many [Glossary('Wu','podgloss.wu')] are assembled for war against the [Glossary('Anda','podgloss.anda')]. And yet, to just send Devils to battle against the scourge would see their numbers bled away. So they are outfitted, armed, and connected through a complex military logistics network that could put many to shame.\nTaking the teachings of the sages before him, Xue has mastered those lines.\n\nHis mortal life shredded by the torments of [Glossary('Kakuri','podgloss.kakuri')], Xue remembers little of mortality. When he escaped the Hell, he did so into the teachings of Sun Li.\nInternalizing her teachings, his own placement among the logistics network of the Amber Wren was obvious. While they handled messengers and information, it was Xue who handled the military side of things.\n\nAs the Yellow Emperor Court rallied forces against the [Glossary('Anda','podgloss.anda')] and [akuma|E], they were armed and threaded together by Xue's networks. His intense attention to detail with his furious demeanor for ensuring the enemies of the returned devils were destroyed saw him rise far.\nAnd in times like these, men with the zeal to punish the wicked and mentality to organize them can go far.\n\nFuture Fate\nThe collapse of the Yellow Emperor Court and ensuing chaos of its northern forces caused many of Xue's information networks and logistics chains to be pushed to their breaking points.\nHowever, he held firmly to them out of a dogged desire to keep the fight going. And while the [Glossary('Anda','podgloss.anda')] would find his hiding place and see him destroyed, his robust systems and institutions would survive the war and be reborn among the Quincunx."
 POD_persistentpodlore.desc.793370: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the Dhampyr of the Yellow Emperor Court, many speak of a Godfather, a figure of immense wealth who approached all their mothers, offered them the chance to be something greater, and then came back to breath life back into their children 9 months later.\nThese are a storm of rumors Lian is quite proud of. Especially when nearly all of those Dhampyrs are actually his.\n\nBoth in life and death, Lian has always listened to the baser whims of his body, so much so that the Hell of Salt and Iron was all but a certainty to him.\nAnd when he escaped and was brought to the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], even as a Devil, they knew he would be a Thrashing Dragon.\nAnd within a year of his return, he had already fathered many Dhampyr. And in time, he would actually put his children to use for the Court, not as retainers, bodyguards, or other vanities, but as couriers.\nThe foundation of the Amber Wren's information network is the fruit of Lian's loins. And as more and more couriers are needed as the influence and need of the Yellow Emperor Court's services, Lian finds further purpose in making more eyes and ears for the Amber Wren.\n\nFuture Fate\nDue to the personal loyalties he cultivated, among the Amber Wren his contacts remained rather secure when the Yellow Emperor Court crumbled.\nIn fact, as the disparate elements of the Courts united, they did so on the foundation of his children.\nAnd when the Quincunx was formed, Lian for the most part stepped away from power, becoming a respected ancestor, and eventually ascending to the [Glossary('Hundred Clouds','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793371: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nGiven the massive volume of both established and forbidden works of literature that are known to the [kuei_jin|E], it is little wonder they have entire markets within their world of night dedicated to them. And among the most time honored seller, is the venerable Jianhong of the Amber Wren.\n\nJianhong was the second one of his [Glossary('Wu','podgloss.wu')] to escape Hell, where he seemed to have a fanatic desire to cling to knowledge. Seeking every book he had and committing them to memory, there were few things he didn't read among the known great works among the [kuei_jin|E].\nAnd as his [Glossary('Wu','podgloss.wu')] began to focus on communications, his own blatant candor earned him a great deal of trust among prospective book buyers. And as more and more esoteric works found their way into his collections and exchanges, he also earned something of an unspoken reputation to be willing to transport any kind of material, including infernalist texts taught by [akuma|E].\n\nAs a follower of the Song of Shadows [Glossary('Dharma','podgloss.dharma')], he was granted a greater deal of leeway and trust. And despite the ongoing war, now more than ever many [kuei_jin|E] seek enlightenment and wisdom among their forebears. And Jianhong is more than willing to supply them.\n\nFuture Fate\nDespite his own archives being largely ignored by the [Glossary('Anda','podgloss.anda')], the destruction of the Yellow Emperor Court also shredded his protections as well.\nEventually, a single mistake by taking an order for a copy of the Broken Winged-Crane to the Golden Courts would prove his demise, as he was eaten whole by the Devil-Eater, a disciple of Piyau, for 'spreading Infernalism'."
 POD_persistentpodlore.desc.795042: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nAs the precious printing blocks of the literary foundation of the Yellow Emperor Court is threatened, there does exist a protector. Frail and anemic, they simply sit at a chair in the back, lost in thought. But the moment a devil dare sets to mischief, the pale Bone Flower rises, and sends them back to hell with a vengeance.\n\nTan Xuan is a very old member of the Wan Xian, and overall a rather studious disciple of the ways of the Bone Flowers. Quiet, contemplative, and by and far incredibly possessive of his things, he seems to have walked away from the Hell of Being Skinned Alive with a fanatic covetousness of that which he sees as his and wanting to immortalize his works.\n\nHe was an easy choice to be put in charge of the [Glossary('Wu','podgloss.wu')] that oversaw the literature and reproduction of the foundational works of the [kuei_jin|E]. But as more and more attacks are plaguing them, Tan Xuan is beginning to refuse to speak to Hongben's sycophants, and wants nothing to do with the other Courts unless they do something about the people ransacking their archives.\n\nFuture Fate\nInitially, Tan Xuan would celebrate Hongben's assassination, seeing it as a kind of justice for doing nothing. However, the chaos of the collapse would prove to be his undoing, as he was eventually found dead, every printing block he owned shoved into every orifice he had with great difficulty by an unknown assailant."
 POD_persistentpodlore.desc.793372: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nHuai has seen a great deal of work in this age, especially among his field of expertise. As the Black Tortoise Court burns with its [kuei_jin|E] scattered in flames, and the [Glossary('Anda','podgloss.anda')] thrash on the northern door of the Yellow Emperor Court, Huai simply details and reports, records and delivers. Without judgment, without thought, he is the perfect reporter and scribe as the North burns.\n\nHuai is... strange, even among the more focused Illustrious Scribes. With little interests past writing, calligraphy, and documentation, he seems to have little fire for anything.\nAnd yet, when it comes to his printing blocks and documents, he approaches it with such fervor and vigor it would make it seem he was a passion bloodflower in an orgy. And then, once finished, he goes back to meditation.\nIn one instance, he didn't even flinch when an arrow was shot through his legs to get his attention, as he just kept writing, blissfully unaware as he composed his reports on the destruction of a Black Tortoise Ancestor and a reproduction on the Commentaries of the Footprints in Blood.\n\nFuture Fate\nHuai would not be long for the world without the Yellow Emperor Court. As organized opposition against the [Glossary('Anda','podgloss.anda')] crumbled, a coterie of [Glossary('Anda','podgloss.anda')] warriors would find Huai in his writings.\nUnlike jeering courtiers, their arrow wouldn't miss."
 POD_persistentpodlore.desc.793373: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt is a common hypothetical, that if a tree falls in the wood, does it make a sound? And for Zhizhou, he often asks himself the same thing. Or at least, if a scribe writes something that is never read, is it even written at all.\n\nZhizhou is the primary member of the Illustrious Scribe charged with transcribing, replicating, and forming printing blocks for the works written in the Scarlet Phoenix Court for the Yellow Emperor Court's reading.\nAnd yet, despite the immense worries he feels for the borderline infernalist writings, blatantly erotic and violent fiction, and heretical local traditions bleeding into things, for every book he has copied, he has written five inquiries and requests to send a force to bring them into line.\nAnd yet every time he tries to reach the Court, it just leads to the report being taken and set next to the growing pile.\n\nMore and more he feels he may need to act, may need to intervene directly. And as the Scarlet Phoenix Court crumbles more and more to ash, he feels that the time for reports may now have passed.\n\nFuture Fate\nSuch notions would come to be his doom. As Piyau begins her crusade through Nusantara, Zhizhou storms out of the Yellow Emperor Court in the chaos of Hongben's death, and directly challenges a local ancestor to oppose her.\nUnfortunately, in his haste, he ran right into the jaws of the Serpent King's Court.\n\nHis body was never found."
 POD_persistentpodlore.desc.793374: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nDespite the assumptions of those less studious, there is a great deal of literature being composed by the Hungry Dead within the domain of the White Tiger Court. And given the complex process of sorting through the heresy and orthodoxy is an immense task that has broken many a scribe.\nBut the current one, Feishan, has broken a record in her position for the longest time served in her position without leaving it, going mad from overwork, or succumbing to the heretical works floating through the Eternal War.\n\nOriginally, Feishan was just one of many younger scribes working under the previous Tiger Scribe, before he had a mental breakdown and defenestrated himself into a canyon. Chosen by the rest of the [Glossary('Wu','podgloss.wu')] for her skill in making printing blocks, she was moved to the tedious task in his place.\n\nHappy to have a place, she took to it with studiousness and steadfastness. She would in addition add numerous commentaries in them, which became respected works in their own right. But as the situation becomes more complex with the [Glossary('Anda','podgloss.anda')], the work is slowly growing more and more overwhelming even for her.\nAnd in this coming storm, the willow tree itself may be uprooted in the wind.\n\nFuture Fate\nDespite the immense stress, complexity of the coming age, and chaos of the [Glossary('Anda','podgloss.anda')], Feishan would endure against the odds. In fact, her own work was critical in preserving the works of the August Courts into the Quincunx."
 POD_persistentpodlore.desc.793375: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThere is a threat in the Azure Dragon Court. From translating and copying their texts, it is obvious. But contrary to the beliefs of the main court that it is somehow the Uji, Junko knows better.\nSomething else, that they insist is of no issue. Those three eyed demons, flesh shaping monsters, nightmare wielders, shy shapeshifters, all of them.\nThey're a threat, Junko is trying to tell them. If only they'd listen.\n\nJunko is an oddity in the Yellow Emperor Court, as she isn't actually from the mainland. Rather, she was one of many to die in the Yamato War against the Emishi, slain by some horrifying relic of the barbarians who slew her in the night. It took her a long time to escape [Glossary('Kakuri','podgloss.kakuri')] Yomi and when she did she immediately got as far from them as she could.\n\nHer determination and zeal though earned her a place in the Scribes, where she seemed to be proficient especially in copying texts on the destruction of the Scions of the Thief. But as of late, as the [Glossary('Anda','podgloss.anda')] draws closer, Junko seems to be getting more and more agitated.\nShe spouts nonsense that they're connected to the same things that originally killed her, that they may also be connected to the strange dead in the South as well.\nWhile such theories are largely dismissed out of hand, she may be onto something...\n\nFuture Fate\nShe was. And for that, when the Yellow Emperor Court fell apart and she was no longer protected, a particular woman of the night from the same people she called barbarians paid her a visit, and taught her that even dragons may be eaten."
 POD_persistentpodlore.desc.795043: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nDespite the general lethargy of the Yellow Emperor Court, the [Glossary('Anda','podgloss.anda')] have yet to break it even despite their triumph in the Black Tortoise Court. One would wonder, how could they resist the fury of the [Glossary('Anda','podgloss.anda')].\n\nThe First Oni is why.\n\nWei Anzang is old even among the [kuei_jin|E]. But he desired not power or a court, but violence. He was a killer and life and killer and death, and not even the Hell of Upside Down Sinners could change his nature.\n\nHis devils guard the interior, pressing the criminals in the night into service against that which scourges them. Numerous Hell Incursions were broken by his hand, and he has turned the [Glossary('Anda','podgloss.anda')] away many times.\nBut even he pushes his luck. He holds Hongben's court in near constant martial law, and while his weak willed patsies do little to stop him, blatantly securing artillery and impounded Bakemonos in hordes is at times a step too far.\nBut Wei remains resolute.\nThe center will hold. It must not fall.\n\nFuture Fate\nThe center fell.\nWei would try to maintain power at the court, but his own desperate bid for power would backfire horribly.\nThe intense concentration of his [Glossary('Wu','podgloss.wu')] and devils would draw the attention of the Demon Hunters, and Wei was slain by a single warrior armed with the fury of the divine with the demon slaying arts on his fists."
 POD_persistentpodlore.desc.793376: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile most eyes fall on the leader of such an esteemed devil hunting force, within the Bronze Pennant itself, most of its junior members answer not to Wei Anzang. Rather, they see his second in command, his voice and his fury.\nA short man with an expression of a willingness to put his head through a brick wall if it means victory, Da'an is the foundational glue that binds them together.\n\nDa'an's mortal life was simple. An estate guard for a minor lord, and to the Demon City on his death. He escaped by tearing his way out, where he then adjusted quickly to being Wei's first and most fervent disciple.\n\nLess a warrior and more a manager, the Bronze Pennant is organized, armed, and supplied by Da'an. To speak to Wei, it is often through him.\nAnd in times like this, men like Da'an are always needed.\n\nFuture Fate\nDespite his position among the loathed Bronze Pennant, Da'an's skill in organizing [Glossary('Wu','podgloss.wu')] and combat parties would serve him well and earn him a place within the Quincunx, and he would recede quietly into the shadows, and ascend to the [Glossary('Hundred Clouds','podgloss.hundredclouds')] unsung but his work foundational."
 POD_persistentpodlore.desc.793380: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nNorthern China remains contested. The Black Tortoise Court had traditionally claimed it, the [Glossary('Anda','podgloss.anda')] run across it with wild abandon, and now the Yellow Emperor Court just now amasses a force to reclaim it.\nBut there was a collection of Courts always there. And Maedaeri cares not for who claims it. She is the one who rules it in truth.\nBut now they threaten her home. And this she will not tolerate.\n\nBorn among the Jurchen people, and dying and returning from [Glossary('Kakuri','podgloss.kakuri')], Maedaeri was considered strange among the Courts, as she did not align herself with the Black Tortoise Court, as many expected a nomadic woman to do so. Rather, she seemed to crave the more cosmopolitan South.\n\nBeginning as a warrior against Devils, she would become the Ancestor of the Hebei Plains, an interchange and gateway between the Black Tortoise and Yellow Emperor Court. But yet, despite her civic nature, she was a warrior, first and foremost.\n\nAssembling her [Glossary('Wu','podgloss.wu')] among other hardened souls of the Jurchen, she turned her home into a threshold. In truth, she did not trust the long term longevity of the Black Tortoise Court. Rather, she expected it would eventually fall to its decentralized nature.\nAnd ominously, she seems to be right. As Hongben's 'Lord of the North' orders them to fight, Maedaeri waits at the flanks of his impulsive armies.\nShe waits for when the time is right, using her goodwill as an ancestor to buy time. She waits for something. And the gates are about to swing open.\n\nFuture Fate\nHongben's death shakes the Yellow Emperor Court into its collapse, but all it does is unshackle Maedaeri.\nAs Li throws dozens of [Glossary('Wu','podgloss.wu')] to their death, Maedaeri becomes a force of wisdom and power in the Northern Wu of the Yellow Emperor Court and remnants of the Black Tortoise Court. When the time comes, she leads the vanguard against Dobrul's resting place, in an all or nothing attack.\nWhile she perishes earlier in the battle, her movements successfully punch open Dobrul's resting place, securing victory for the [kuei_jin|E] and eventual birth of the Quincunx."
 POD_persistentpodlore.desc.793381: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nEvery visionary needs a right hand. And at the gates of what many [kuei_jin|E] consider to be the army of the [Glossary('Demon Emperor','podgloss.demonemperor')], Wugunai holds that line for Maedaeri.\n\nOnce, Wugunai was just one of many countless Jurchen riders. He lived and died as one, an uneventful life without much of substance.\nBut the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] seemed to strike something in the marrow of his soul. His escape would lead him south, where he sought a visionary from his people. Maedaeri, the warrior, was the one he came to, and became her first disciple. And for that, he has become her trusted hand.\n\nWithin their domain, Wugunai oversees all who come through. The two, even within their [Glossary('Wu','podgloss.wu')], are sworn brothers and sisters.\nMaedaeri has made it clear for anything to be done to him, she will repay fourfold. And now, as the [Glossary('Anda','podgloss.anda')] draw closer, Li becoming more impulsive, and the Black Tortoise Court begins to descend into violence, Wugunai is tested.\nBut he cannot fail. Not when he serves under his best friend. He will see her cause through.\n\nFuture Fate\nWugunai would survive the collapse of the Yellow Emperor Court and later strike against the [Glossary('Anda','podgloss.anda')], but at great cost.\nMaedaeri giving her life for victory destroyed him, and even as the Quincunx formed, he simply waited at her court. Eventually, the hole in life became too much. He bid his goodbyes to his [Glossary('Wu','podgloss.wu')], and went outside, and waited to see the morning sun one last time."
 POD_persistentpodlore.desc.793382: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the Yellow Emperor Court, the North under Li has become disconnected, even from the [Glossary('Wu','podgloss.wu')] of the Amber Wren. But for that reason, the powerful Ancestors of Hebei have a personal courier at their disposal.\nAnd in a time such as the current nights, to be a courier in lands as divided and chaotic as these is often a death sentence. But the Warriors of Hebei have an exceptional one. And even among the Dhampyr couriers of the Amber Wren, Mutawuta is respected above all.\n\nA Jurchen courier in life, Mutawuta had died in a way many couriers do, as with the deliverance of bad news, he was boiled alive in anger by that lord. But the execution gave him a message of his own to deliver, and that Hell would not hold him.\nAnd he delivered it in blood to the lord that killed him.\n\nLater civilized by the [kuei_jin|E], he became a student of Maedaeri, serving as her voice even without access to the wider Yellow Emperor Court. Mutawuta became an utterly superb messenger.\nAnd now, at her request, he has been discreetly moving throughout the Northern [Glossary('Wu','podgloss.wu')], preparing for a united force in the coming storm. As she tells him, a confrontation with the [Glossary('Anda','podgloss.anda')] in China is inevitable. And they must be ready.\n\nFuture Fate\nMutawuta would enable the northern Chinese [kuei_jin|E] to unite against the [Glossary('Anda','podgloss.anda')], his missives reaching all the right ears.\nHowever, his skill and reputation would make him threatening, and in time, he will be assassinated among the Quincunx, supposedly by the Dhampyr that once respected him, their father ordering this threat to them removed."
 POD_persistentpodlore.desc.793383: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt is a common stereotype among the Yellow Emperor Courts that everyone on the steppes is a horseman. While it is true it is helpful, not everyone prefers to fight on horseback, and some are just as dangerous as a mounted horseman on foot.\nAmong the Hebei Warriors, Mapo is proof of that claim. The beast of a man with his axe is feared among the [kuei_jin|E] of the north, his reputation and appetite for destruction preceding him.\n\nBut in life, his story was far less eventful. The spare son after the heir to a Jurchen chieftain, Mapo was a quiet, heavy, and shy kid.\nHe initially hated fighting, and largely was afraid of hurting others. And even as an adult, he was quite reclusive, and instead managed resources. But an accident while out riding led to Mapo's death, drowning in a river after a strike to the head. And in the Hell of Boiling Seas, being a bloated buoy for what felt like centuries was agony, before a [kuei_jin|E] saved him and brought him to Maedaeri for training.\n\nScared of being weak again, Mapo took to fighting like a fish to water. His hunger for battle and sustenance grew, until he became the titan he is now. Often, he is the muscle in Maedaeri's court, the one people think of when they hear of the Warriors of Hebei.\n\nFuture Fate\nMapo would ride with Maedaeri when she set into motion the destruction of the [Glossary('Anda','podgloss.anda')]. But much to his dismay, she demanded he stay and guarded their homes in case she failed.\nWhen he heard of her death, he was devastated, but fought to preserve her legacy as one of the founding voices of the Quincunx."
 POD_persistentpodlore.desc.793384: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the warrior courts of Hebei, many assume that they face every problem head on. And it is true, among their court, all are warriors. The political situation they find themselves in demands nothing less. And it makes those that die on unsafe roads from a single well placed arrow all the more tragic.\n\nSurely the whistling from afar is just the winds.\n\nSain is an enigma among the Warriors. A superbly skilled archer and falconer even among the Warriors, he is rarely ever on the front. Rather, he is always at the backline among his [Glossary('Wu','podgloss.wu')], his well placed specialized arrows slaying numerous threats, some even said to be tipped with the venom of the Emerald Mother's assassins.\n\nSome suspect he may have even been their kin in life. But the truth of the matter is between him and Maedaeri. In truth, he is an assassin, simple and plain.\nThe visage of a warrior is a convenient face. And in times like this, the subtle arrow is the deadliest one.\n\nFuture Fate\nIt is unknown what happened to Sain. Maedaeri gave him special orders to lead away an [Glossary('Anda','podgloss.anda')] deathsquad from their master's fortress.\nBut they could never find his spirit, so it is assumed he died. But in the end, he was successful in diverting the [Glossary('Anda','podgloss.anda')]'s black riders from interfering in Maedaeri's gambit. Mapo is sure that if he died, he died with a smile on his face and defiance on his lips, knowing they had succeeded."
 POD_persistentpodlore.desc.560126: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nDữu Thúy, long in the shadows, watches as a Dragon dances in the clouds at the detriment to all below them, and another rises from the jungle in a thrash that threatens to bring the wrath of the earth upon them. As the Courts around her fall, what is a disciple even to do?\n\nDữu Thúy in life was a sex worker along the Vietnamese Coast, murdered in a payment dispute by her 'handler'. In the Pit of Salt and Iron, she was set to just more of her mortal life pushed to extremes.\nBut she was patient, and good with a whip both on her clients and on herself. In Hell, she learned that even in death, she was never more alive when awash with pain.\n\nUsing her enthusiasm as cover, she was able to convince a devil to let them do a session in the living world, where she promptly escaped to her freedom.\nFound and then civilized by Dyanang as one of her disciples, Dữu Thúy was a devout, if scary, follower of the Thrashing Dragons.\n\nBut that was then. And now, she stands at a crossroads. Her mentor has grown aloof and largely left the world behind, and [akuma|E] now run rampant.\n\nBut yet, a fellow disciple, Piyau, is more radical than even she. Dữu Thúy is torn, as the situation demands action. So she must act, lest she also fall victim to the Devils around her.\n\nThe question is, which Dragon should she side with?"
 POD_persistentpodlore.desc.793386: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the [kuei_jin|E] of the Echizen, few arts are as respected as that of the shaping of the tapestry of essence and life. Talismans leave their holdings in great supply. Mortal artisans find great work and respect among their members, and at the start of it all, lay its founder, the Life Sage.\n\nKasumi was born in the Asuka period, the daughter of blacksmiths in the Yamato Province. Her family was relatively well off... at least until the institution of the Taihō Code. Her father, despite being a locally respected figure, was not of noble birth, and thus under the new edict, he was stripped of his influence and acclaim he had.\nFor a time, he did resist against this, but the state wouldn't have it. When the capital was moved, he tried to bring his family to the new one to keep pressing his claim, but an altercation with the guards escalated, and Kasumi was stabbed in the throat by a guard.\n\n[Glossary('Kakuri','podgloss.kakuri')] was horrible for Kasumi. When she escaped, she found herself desperately seeking to and clinging to life. She wanted nothing more than to live, to make, to shape. The cold of death scared her more than any other. While most of her clan would be noble Cranes or resolute Shadows, Kasumi would thrash out of fear of [Glossary('Kakuri','podgloss.kakuri')]. She maintained contact with the mainland, shaped and made, and soon others gathered around her.\n\nIn her dance of artifice, she built a whole clan. And in her interest in visitors, a cold skinned rebel would take her heart. Unknown to most, the Echizen tolerance of the other Blood Drinkers in Japan was not born of practicality but of love.\n\nFuture Fate\nKasumi would elevate her Clan further, but her time would run out. During the rise of the Tokugawa Shogunate, while she was dancing with her lover Yoshino, assassins of [Glossary('Mikaboshi','podgloss.mikaboshi')] would ambush her.\n\nShe was struck down but her lover, knowing Kasumi's fear of final death, gave her a mercy. Kasumi used her mastery of soul shaping, and coached Yoshino through a profane act, as Yoshino ate Kasumi whole, soul and all, tearing out her eyes and replacing them with Kasumi's, and finally, consuming her own eyes and taking Kasumi into herself.\n\nThus, the first act of a Kindred eating the soul of a [kuei_jin|E] was done not out of lust of power, but for love. And the new being would come to lead their lineage into a new night."
 POD_persistentpodlore.desc.793219: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nAmong the most feared servants of the [Glossary('Yama Kings','podgloss.yamaking')] are those that belong to [Glossary('Emma-O','podgloss.emmao')], the [Glossary('Shikome','podgloss.shikome')] Assassins. Inspiring slavish lust in those susceptible to a woman's charms and murderous rage in those with no attraction to them, with fearful mastery of bone arts and methods of assassination. Barring those that fled after hearing the words of a wandering monk in [Glossary('Kakuri','podgloss.kakuri')], none have broken free of [Glossary('Emma-O','podgloss.emmao')]. All save one.\n\nIn her mortal life, Yukio was a traditional actress of the precursor to Noh, renowned in her village for her voice. However, her life was short, and she was laid low in the night by a patron who drank the breath from her. And in [Glossary('Kakuri','podgloss.kakuri')], her singing to ground herself caught [Glossary('Emma-O','podgloss.emmao')]'s attention, who promptly sent his [Glossary('Shikome','podgloss.shikome')] to collect her and press her into his harem.\n\nShaping her to his desires, having her sing for his leisure and act as a siren to damned souls, and gratifying his baser desires for the [Glossary('Shikome','podgloss.shikome')], for a time, she was just another monster in [Glossary('Emma-O','podgloss.emmao')]'s militant harem. But however, Yukio hid the pieces of her soul in her voice, and when tasked to guard the Cave of Maidens, she slew her fellows and fled.\nFew trusted a former [Glossary('Shikome','podgloss.shikome')], but Kuro-sama, respected mentor of the [kuei_jin|E] assassins, chose to take a chance on Yukio.\nHe saw in her eyes that rage, a hidden desire of vengeance for the defilement [Glossary('Emma-O','podgloss.emmao')] put upon her. And so, she has come under his wing, and is swiftly identifying herself as one of his best students.\n\nFuture Fate\nYukio would, in time, come to be the best assassin among a clan of assassins. Her drive for revenge becomes an unerring arrow of resolve, forming a [Glossary('Wu','podgloss.wu')] of similarly skilled assassins around her as the Koga's hidden hand.\nWhile a bad mission in Shanghai would tarnish her image, she learned from it and tempered her will further. She would strive to restore her reputation, having forgotten her drive. So she once again walks the path of the master assassin, seeking the final confrontation and liberating revenge that [Glossary('Emma-O','podgloss.emmao')]'s death will bring her."
 POD_persistentpodlore.desc.793387: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMichiko of the Soga Clan, founder of the Chibo, was a daughter of Soga no Emishi. Alive to see the fall of her clan firsthand in the Isshi incident, she would have disappeared into obscurity along with her family, had she not, as she was fleeing the Isshi Incident, run into a silver haired woman with bloody eyes in the night. The woman was Kagaseo.\n\nKagaseo offered her a choice. Die in obscurity like she was doomed too, or finish the work of her family, and work to uproot the traditions of Japan in the shadows. Michiko, angry and spiteful, accepted. Kagaseo embraced her, and bade her to create a line of progeny all her own. Michiko would then found the Chibo of the Great Clan from her line.\n\nMichiko takes her role as the eldest of the Great Clan after Kagaseo deeply seriously. She is a master of Hoshi No Ryōiki, second only to Kagaseo, and her childer carry on its practice.\nAn intense presence on the clan, Michiko accepts nothing less than perfection. And it is for that reason she cannot fathom why Kagaseo would embrace Yasu and Yū. As far as Michiko is concerned, she is all that Kagaseo needed, and Yasu's untrustworthiness and Yū's headstrong zeal is dangerous when they need to stay hidden and not break from the path.\nBut she knows her sire will not listen to her when she begs for their death, so she instead waits and continues guiding her sages. Because she knows, in due time, Yasu and Yū's time will come."
 POD_persistentpodlore.desc.793388: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nDespite the long claims to the contrary, the Scarlet Phoenix Court has never been unified. No, that was merely just a claim by Dyanang. The riverlands have always opposed the Court's rule, and at the forefront of the various Shan, Karen, and Mon Courts, was the ancient Ancestor Solyna, the venerable master of the arts of fire.\n\nSolyna is from the far distant past of the Mon. Born in the city of Pegu shortly after its founding, Solyna for the most part had an average life, but a stray cooking fire cut it short when she was killed when her house collapsed in flames and sent her to the Hell of Burning Seas.\nDespite this however, Solyna embraced her death, and instead used the pitch of the burning seas as the means of her liberation, searing the flame into her soul and escaping back into the world as part of a wildfire. She was collected by the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], but always found her an incredibly dauntless and stubborn soul to civilize. Far less concerned with enlightenment, she instead cared for protecting her home from outside influences, and would return to the place of her birth and become instrumental in building the first Mon Courts, where she rules from to this day.\n\nFuture Fate\nSolyna's dogged will for independence would come to be her grand war. While she would briefly accept pacification by Piyau, she knew Piyau was close to ascent.\nAs soon as Piyau reached the [Glossary('Hundred Clouds','podgloss.hundredclouds')], Solyna immediately resumed her war against the Burmese, this time in the form of Golden Courts Ancestor of Mandalay. The coming of the British will present her with an opening to finally seize the advantage."
 POD_persistentpodlore.desc.793389: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n那些最古老的万鬼老祖们，若有幸走至救赎之门，往往便会步入其中。而那些明知门在眼前却迟迟不肯跨越者，于凡人与[kuei_jin|E]心中几近异类。\n然而，在少林寺万鬼所设的静室之中，却有一人长久伫立于此关口，始终未曾迈步。他选择留存，成为道途终点的明灯，照引后来者。\n\n无忌古老得近乎失名，生时无闻，死亦无声。他甚至不记得自己曾归属哪一地狱。一些年轻的修者私下猜测，他或许本是万仙的一员。对此，无忌总是劝他们莫要妄言。但不可否认，自血/学飞升以来，他作为五行的最高权威之一，始终是黄帝皇朝统御之基石。无忌一向是各大皇朝所尊重之人，尤其在中华地界，更是与黄帝皇朝并肩而立。\n即便在当下风雨飘摇之世，他仍稳坐不动。他之所以不动，是因为他明白：只要他动摇，天下必将崩塌。因此，他甘为乱世中的灯塔。\n\n其未来命运\n然则，无忌自知世势难违。随着王宏本遇刺，黄帝皇朝轰然崩塌，天下陷入无以复加的混乱之中。见此景象，无忌闭门谢客，随即[Glossary('云开雾散，得道飞升','podgloss.hundredclouds')]，自此永别尘寰。"
 POD_persistentpodlore.desc.793390: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n在少林寺的一翼，有一座直入云霄的高塔。塔顶高至龙脉交汇之处，四季常飘落着柔柔细雪。塔身北向，寒风呼啸，圣贤吕冰便伫立于此，凝望着那即将席卷诸廷的风暴。\n\n吕冰是五行贤者中的次长者，也是最难以捉摸的一位。他与无忌同辈，乃是年轻时期的战友。吕冰曾坦言，是无忌亲自将他从[Glossary('断绝','podgloss.kakuri')]救回。\n异于他人，吕冰对严寒有着一种近乎亲昵的依恋。他视冬之霜寒为旧识，将冰雪的凛冽视作磨心之石。而如同无忌一般，明明拥有更进一步的力量，他却选择留下。\n他所讲道多以“节制”“虔敬”为主轴，又贯以坚忍克己与静观自守之法。他本人便是这诸般美德的化身，即便声音轻如细语，却有无数弟子为之动容。\n他的内心深处藏有阴影，却正因这份幽暗使他愈发坚韧，也更显高贵。在这个强者稀缺的时代，意志之坚如他者寥寥无几。\n\n其未来命运\n当王宏本殒落，吕冰如常沉稳地应对。当无忌飞升之时，他静静理清诸务，嘱托诸贤，然后独自步上雪塔阳台。翌日晨曦破晓，他已无踪，只知他已随血之兄弟踏入那未知的彼岸之境。"
 POD_persistentpodlore.desc.793391: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n于世人而言，火是可怖之物——灼烧、毁灭、带来伤痛与失去。但在诸圣贤中，弘坚贤者始终坚持要人记得，火亦可为善。它可煮食肉、暖寒冬、生薪火，在更深处，令焦土再生，使焚烧后的田野比未燃之地更加肥沃。\n这便是他的教诲，一条他在无量地狱中亲历而悟出的真理。\n\n弘坚生前为海寇，纵横波涛，死后堕入焚海地狱，方知火之真义。洗尽凡尘之后，他被视为火圣体的异才，以惊人的悟性与坚实的智慧，迅速跻身五行贤者之列。\n\n他虽具破坏之力，却非为毁灭，而是为涤荡旧秽，以便新生伟力得以从灰烬中腾跃。他讲道时常亲踏火盆，于烈焰中传法，以此考验弟子，亦昭其赤诚。\n如今，世界正似一片火海，而弘坚的存在迅速成为了无数人心中的明灯与典范。\n\n其未来命运\n王宏本之死令弘坚震骇不已。他沉痛哀悼，但仍在无忌与吕冰之前便挺身应对乱世。\n众人原以为他将顺利渡劫，然命运却骤转悲凉。在一次前往东瀛净化堕落鬼灵的法事中，一名堕鬼突袭火坛，与他同坠烈焰，被血雷狂风席卷而去。"
 POD_persistentpodlore.desc.793392: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nTo those who know only of the Sages of the Fivefold Way from how others speak of them, Renyuan seems like an impossible member. A handsome young man often seen lounging surrounded by his daughters fed choice cuts of meat and other delicacies and delights, he seems like the picture of hedonism, and not of sagacity. And yet this too is an assumption.\nAs of the Thrashing Dragons, few embody it more than Renyuan.\n\nRenyuan's mortal life was originally that of a monk, but that life never worked for him. His tenure in the Hell of Being Flayed Alive made him strangely... drunk on the sensations of pain and experience.\nBut with his escape, he seemed more eager to just be the body that always got torn to ribbons just to stagger back. But the teacher Kang Cho-lu took a chance on him, and found that his monastic training wasn't wasted. Renyuan chronicled every experience, in profound detail. He was a covetous, gluttonous and lustful cretin at times, but he did genuinely meditate on the experiences of life lived to the fullest, with the same degree of criticism and reflection of a Sage.\nAs such, he would be sent as an envoy to the Fivefold Sages, who actually elevated to one of their own as Sage of the Thrashing Dragons. And more practically, his numerous Dhampyr children became quite adept staff for their Monastery. His writings would become key pieces of study for young Dragons, assuming they could at least tolerate the smells, of course.\n\nFuture Fate\nRenyuan took the death of Wang Hongben with a strange degree of certainty and direct action, wasting no time having his lineage fortify their holdings.\nThey weathered the [Glossary('Anda','podgloss.anda')], and when the Quincunx reformed, Renyuan took pains to rebuild the great works of the Sages to their full splendor. However, as the Long Night turned to Modern Nights, he died as he lived, when a student turned out to be an assassin, and ate him in his procreational bed down to the last scrap of flesh."
 POD_persistentpodlore.desc.793393: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the four more well known Sages, there is always mentions of a fifth, albeit one rarely seen. Theorized by those who never see them to be a Devil Tiger to complete the auspices of their [Glossary('Wu','podgloss.wu')], many think they are an assassin who rarely teaches their ways to others unless worthy.\n\nIn truth, the Fifth Sage is most often doing the honest work of Infant Devil Civilizing. As they know a Xianbei Woman would be a walking scandal, Pusuwan hides from sight, even if she is no less equal to the rest of her [Glossary('Wu','podgloss.wu')].\n\nSeeking feral devils to civilize and be brought for training, she rarely does sermons because to her, meditation is action in it of itself. She doesn't meditate in a room for salvation, she does it by saving the existences of feral devils from destruction or falling into the hands of the Devil Kings.\nOne does not achieve heaven by sitting in a room doing nothing, it is done by tearing out the rot in the world by killing [akuma|E]. And from her offices in the Shaolin Monastery, Pusuwan organizes the various offices of the Devil Tigers to her war against the Devil Kings, having been changed forever by the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] from her mortal life as a forgotten Xianbei Chieftain's wife.\n\nHer sermons are not something preached, they are missions. Her books are not dusty texts, they are combat manuals for fighting Defiled. Such is what No-Shadow Raven taught her. Such is what she will teach her students.\n\nFuture Fate\nPusuwan would be the only one of the Sages to survive to Modern Nights. Protecting the monastery and organizing more and more missions, not even the troubled Modern Nights could break her. But now, as [Glossary('Mikaboshi','podgloss.mikaboshi')] rises higher and higher to that throne, the condition of the world disturbs her greatly. So she has begun investing to better mortal lives with welfare and support networks, opening a new battlefield in her everlasting war against the Devil Kings."
 POD_persistentpodlore.desc.793394: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBorn as a traditional worker of medicine in the days of Gaozu, Xilie's mortal life was defined by war. Forced to live through the fallout of the death of the Xin Dynasty and violence of the Eighteen Kingdoms period, Xilie's life was fraught with violence. All he wanted was an end to it.\nHowever, his life would be in vain, as over the course of the war, he was just one of many to die in the tide of violence.\n\nAnd in Lanka, realizing his fate was just unending violence, it broke him. He fled readily and as fast as his legs would carry him, begging for anyone who would listen. And someone did answer after a very long time. Qiang Ru, a young but canny devil, saw Xilie's intelligence as useful.\nSo, he offered him a deal, on behalf of... something else. Whatever it was, Xilie accepted readily and wholeheartedly. And brought to the world of the living, the quiet doctor labors in the shadows for his [Glossary('Wu','podgloss.wu')], avoiding the spotlight.\nSuch is his wish. Such was the nature of his deal."
 POD_persistentpodlore.desc.793395: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe youngest of the Emerald Biers, Hemavati is the one that stands out the most. From the very edge of the lands where the [kuei_jin|E] dwell, Hemavati was born in the Kashmir region, the daughter of Dalits. Set out into exile as a child by the Ghaznavid invasions, she was among those displaced and sent into a long exile into Europe. But Hemavati died early, perishing just before the Wall.\nAnd for that crime, she found herself by some twisted joke in Lanka, where she was cursed to constantly live as a refugee in the violence of the Demon City.\n\nHemavati was always desperate for escape. Willing to do whatever it takes for the sake of liberation. And to that end, she found someone seeking others willing to do whatever it takes. The foreigner Qiang Ru found the desperate devil and offered her a deal.\n\nHemavati does not discuss the nature of that deal. But she took it. She needed her freedom back, she missed the open sky. She missed community, she longed for an escape from constant violence. And Qiang Ru gave that too her.\n\nSince then, Hemavati has been the Emerald Biers' prophet. She divines and labors as a storyteller, an agent of fate and destiny for the sake of the Biers.\nHow she has learned this is unknown, but the Wise Woman dares not tell. She doesn't want to endanger her lost freedom."
 POD_persistentpodlore.desc.793396: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nQun, like his sister Youwu, is a terrifying figure for those who meet with Qiang Ru. Standing at his side like an inverted shadow, Qun merely glowers at all those entreat in court.\nA terror with an implicit air of malice.\n\nIn life, he was radically different. Qun and Youwu were Semi-Identical Twins. And the both of them simply wanted a normal life. And yet, for the rest of their village, they were two freakish children that looked like ghosts, hated the sun, and were uncannily close, far more than a brother and sister should be.\nAnd eventually, as adults, when they showed no course of becoming more normal, the twins were accused of witchcraft. The twins tried to deny it, but their own panicked pain and sunburning from the sun for their albinism condemned them, so both were murdered.\n\nAnd for the anguish of their death as witches, they found themselves in the Hell of Wretched Magic. So both twins huddled together, doing the best they could to outlast it. And when Qiang Ru found them offering a deal, they took it. Readily and instantly.\n\nNow, Qun is content. As a bodyguard, he can have as close to possible normal life with his sister. Even as a corpse, and whatever his deal was, now he can at least be respected, valued, and treasured.\nAnd his loyalty will not go by with even a single stain on it."
 POD_persistentpodlore.desc.793397: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nYouwu, like her brother, is a menacing figure for those who meet with Qiang Ru. Standing at his side like a mirrored shadow, Youwu simply stares at all those who come to his court.\nA scourge with unspoken punishment for those who defy him.\n\nIn life, she was radically different. Youwu and Qun were Semi-Identical Twins. And the both of them simply wanted a normal life. And yet, for the rest of their village, they were two freakish children that looked like ghosts, hated the sun, and were uncannily close, far more than a brother and sister should be.\nAnd eventually, as adults, when they showed no course of becoming more normal, the twins were accused of witchcraft. The twins tried to deny it, but their own panicked pain and sunburning from the sun for their albinism condemned them, so both were murdered.\n\nAnd for the anguish of their death as witches, they found themselves in the Hell of Wretched Magic. So both twins huddled together, doing the best they could to outlast it. And when Qiang Ru found them offering a deal, they took it. Readily and instantly.\n\nYouwu has since readily and overjoyously been Qiang Ru's Master of Shadow War. She delights in this, having power and a sense of belonging in war and planning.\nAnd now with her brother, she has all she ever wanted in life. As the Emerald Biers elevate the Jade Court, she does so always smiling out of sight. And while within it, she readily wears the mask of assumed carnage."
 POD_persistentpodlore.desc.793398: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAmong the Courts of the Night, one [Glossary('Wu','podgloss.wu')] existed at a precisely unique position of controlling the hands of mortal power. All of this [Glossary('Wu','podgloss.wu')], the Blissful Ice Daggers, actually come from Court Eunuchs. And oldest among them is one who transcended what 'he' once was to become the Goddess That Turns the Hands of State.\n\nYi'an was once an unimportant Eunuch in the service the Han Empire, but they had the mistake of being born in the worst time for such an occupation. While they entered the service young, so much so they never grew a beard, they were always just a figure in the background.\nBut when a different group of Eunuchs began to seize power, the cascading chain of events would lead to the vast majority of them being executed despite not even being responsible, Yi'an included, during the Massacre of the Ten Attendants.\n\nAnd when they woke up from death, they found themselves turned into a sex slave in the Pit of Salt and Iron. But, despite what so many would have considered the worst possible fate, the Eunuch felt strangely... liberated.\nPosing as a woman, they were able to convince several other enslaved to conspire, and they used that as a springboard for escaping Hell. And when the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] asked for their name, Yi'an chose a new one, and embraced their assumptions of her femininity.\n\nYi'an would, over the course of her unlife, build her power in the structures she knew. She never bothered to heal away the changes she suffered, and embraced her new identity.\n\nThe Blissful Ice Daggers would become the main [kuei_jin|E] bridge to mortal politics, as hidden sponsors of Eunuchs and using them for their Screens. However, as the Song wavers in the face of the Khan's march, Yi'an may lose her great works.\n\nFuture Fate\nYi'an's base of power would be destroyed by the Mongols, but not her influence. Despite the decline of the Eunuch class, Yi'an would reposition herself among sex workers and become a Madame, before, after millennia of patience and influence, she would ascend to the [Glossary('Hundred Clouds','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793399: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBorn to the ethnic Qiang, Yuanheng was, in his youth, a rebel. And then, when that failed, a eunuch as punishment for his crimes. And then, in adulthood, an adept servant of state. And since he died from a bowel infection and his return from the Hell of Burrowing Maggots, the Financier of the Blissful Ice Daggers.\n\nYuanheng's life existed in the shadow of the Northern Wei. Born to the Qiang, his family frequently joined with rebels against them, and then later on he himself joined in with them.\n\nBut Yuanheng was just one of them who was caught and punished with castration. But unlike many other rebels, Yuanheng seemed to react to the ordeal as a kind of penance, and he tried his best to serve the state that, in his mind, rightfully conquered him.\nAnd when he died, he would have tolerated it, but the ensuing fate of Hell was not something he could stand. Storing as many special maggots as he could tolerate to barter for his freedom, he did eventually escape the Hell, and was then Civilized among the [kuei_jin|E].\n\nYuanheng fell into Yi'an and the Blissful Ice Dagger's orbit soon after. He was canny with coin and quite good at controlling the flow of it, finding the Mercantile Devil Tigers to be an immense comfort to him.\nStudious and even tempered, he managed it quite well, alongside his cold disregard for his fellow man. And as he began to worm his way into the offices of the Empress' eunuchs, he used those veins of power to keep constant tabs on mortal politics, even in times as chaotic as these.\n\nFuture Fate\nYuanheng would see the destruction of the Song as a message, and he instead pivoted his stored wealth to mercantile pursuits.\nA relentless capitalist as he delved deeper into [Glossary('Dharma','podgloss.dharma')], he continues his money crunching to the modern day, his past as a Qiang Eunuch of the Northern Wei now all but forgotten in his mind."
 POD_persistentpodlore.desc.793400: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n即便是极乐冰刃会出身的前宦官中，若论凡世之功业，几人能与纪如比肩？他生得面容柔美，风姿秀雅，年轻时便赢得汉高祖的青睐。\n尽管高祖性情粗犷，却对纪如的风流雅致深为倾心，宠之甚隆。至其寿终之际，纪如一度坦然，心觉无憾。\n\n然而，这位以媚术权谋步入高位的宦者，死后却被投入滚油地狱受刑。唯有献身为一头路过的罗刹为床奴，方得逃脱千载煎熬。这段经历使他自此对女体生厌，视触碰为秽。\n重归世间之后，他对能自由言谈、与人共处感到无比欢喜。凭其天赋魅力、温和体贴，以及对过往不再执着的豁达，他很快成为极乐冰刃会雏形的屋室的发言者与灵魂人物。\n此亦正是他所擅，既能赢得帝王之心，又岂惧凡俗之人不服其言？\n\n其未来命运\n当宋室灭亡，宦官阶层灰飞烟灭之时，纪如满怀悲恸。对他而言，那些凡人宦官并非工具，而是朋友。\n但他终究选择释怀，继续前行。在现代的长夜中，他愈发努力地微笑示人，试图活出新生。最终，他隐居于徐昭一座小镇，悄然淡出五行宗的典籍。"
 POD_persistentpodlore.desc.793401: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile the Blissful Ice Daggers are known for their talents and connections as the controllers of Eunuchs, some bold [akuma|E] have assumed they are defenseless. Much to their dismay, one of their number has broken a great many number of devils. And all of this without sight.\n\nAnqi, unlike many Eunuchs, was not punished as one or took the position. Rather, Anqi was originally a buddhist monk, and a rather devout one.\nHowever, one day, as he was attending to his duties, he felt a sudden immense pain in his groin, and woke up to a man in the shape of a snake spraying venom in his eyes. And yet, in that sudden panic, he focused himself and threw himself against this monster unarmed, and against all odds, felled it before he succumbed to his wounds, and found himself in the Demon City of Lanka.\n\nWhen there, he still found himself mutilated and blind, but then, seeing it as a trial, returned to his meditations. Despite the Rakshasa's best efforts, they could not force him to violence. So, eventually, they simply gave him his freedom, by throwing this dogged pacifist out of the Hell of Violence.\nAnd then, with some initial assumptions by the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], they simply placed him among the Eunuch [Glossary('Wu','podgloss.wu')], not caring that he lost his 'staff' to a snakeshifter.\n\nAnqi's role within his [Glossary('Wu','podgloss.wu')] is that of a protector. Having once used Martial Arts as a form of meditation, now it is supremely useful in protecting his [Glossary('Wu','podgloss.wu')] from Devils.\nAnd while he still does not kill, his presence alone protects them. And even despite his blindness, he is a terror without compare when forced to fight.\n\nFuture Fate\nAnqi largely was unbothered by the loss of his [Glossary('Wu','podgloss.wu')]'s main means of power. His meditation and duties to them held precedence.\nAnd eventually, through his dogged focus on his [Glossary('Dharma','podgloss.dharma')], he would ascend to the [Glossary('Hundred Clouds','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793402: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nGiven the Blissful Ice Daggers' intense and thorough connection into the Eunuch Court culture, one would assume them for the most part to largely abstain from anything involving 'what they lost'. But to those who interacted with him, Rangneng feels like a tempest of anger and frustration over what he no longer has.\n\nRangneng in life was a palace guard, but very rarely was he doing his job. A serial womanizer and unrepentant playboy, Rangneng routinely romped and slept his way through the concubines. However, he was not a man of subtlety, and eventually, he was found out and sentenced to castration for his crime and put into the Eunuch service.\n\nTo Rangneng, this fate was actual hell, and within a month he would take his own life to escape it. Only to then find himself in the Hell of Salt and Iron, where his new tormentors relished in pushing him further into anger. And for centuries, he was there.\nUntil finally, after one too many torments, he snapped and bashed his way out, screaming for the world of the living, and finally caught by the Blissful Ice Daggers and brought into the fold.\n\nRangneng is an angry man. Incredibly so. Cruel, lustful with no outlet, and a man legendary for his grudges, he largely oversees the more subtle arts of the Blissful Ice Daggers, letting him have some outlet in tying off loose ends and silencing threats.\nAnd as more and more Eunuchs panic before the approach of the Mongol Forces, he at the very least has no shortage of outlets for his anger.\n\nFuture Fate\nRangneng largely didn't care when the Song Eunuch class was destroyed. Rather, as soon as he heard that [kuei_jin|E] in Southeast Asia had discovered new flesh arts, he immediately ran as fast as he could for them, appearing before their leader and demanding they teach him how to restore his manhood.\nHis story ended as just yet another dinner for the Pennangallan Wati."
 POD_persistentpodlore.desc.793403: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAcross the many toll roads and checkpoints across China, some of them have odd figures who collect various 'court taxes' and the like. Payments for protections, and punishments for those who don't pay it. Balanced out between key junctures but not enough to catch imperial attention.\nScattered throughout and within, extorting out a massive amount of coin. And as it flows, it enters the hands of the master of the Silver Lock.\n\nXinfu was always gifted with money. And always just as incredibly ruthless. Setting up various protection rackets as a teenager and then becoming the picture of a landlord. When his tenants could pay more, he always had reasons for them to pay it. When they failed, his thugs were always there to collect.\n\nHe only cared that their rent was paid. And when they complained that they couldn't afford food, he was generously offer them dirt. Needless to say, when he died of old age, he found himself in the Hell of Being Skinned Alive, stripped of everything and rendered bare.\nBut this did not sway him. He flayed off bits of his soul to bribe his way out, where he returned to the world of the living in short order, and promptly went back to collecting his rent.\nAnd from that base of power, he would found the Silver Lock [Glossary('Wu','podgloss.wu')], the main financial [Glossary('Wu','podgloss.wu')] of the Yellow Emperor Court. Xinfu paid what was due, and did so well. And thus, without much reason to question him, he is left to his own devices.\n\nFuture Fate\nThe demise of the Song, despite the upheaval, didn't disrupt Xinfu and his [Glossary('Wu','podgloss.wu')] that much. However, while his [Glossary('Wu','podgloss.wu')] would be scattered, he kept to his work.\nHowever, during the Chinese Communist Revolution, a mass of soldiers came to kill him. And he died just like any other landlord, and was sent screaming into final death."
 POD_persistentpodlore.desc.793404: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe havens of the Silver Lock are some of the heaviest and loaded vaults in China. Centuries of exploitation and tax harvesting is a tricky thing to protect, and yet, the Silver Lock has for the most part held.\nAnd to that end, they owe most of their success to Huaizhen.\n\nHuaizhen in his mortal life was a simple village guard, but died during a Jurchen raid into China. Horrified by the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')], he quietly bid his time and eventually escaped by posing as a range guard, before he fled out a gate into the world of the living, where he met his future [Glossary('Wu','podgloss.wu')] at the behest of the Ancestors.\n\nGiven his mortal life, Huaizhen was an easy choice to protect their wealth, and as it grew, he had to get better. Organizing their mortal screens, coordinating Dhampyr, and then later younger [kuei_jin|E], he did all of that and more to protect their numerous hidden caches and vaults of wealth and money.\n\nFuture Fate\nDespite his incredible long term success, Huaizhen would perish for a mistake. When a Mongol raid took one of the caches, much to his shock, Xinfu was furious.\nConfused, he tried to get further questions, only for Xinfu to knock over a brazier and burn Huaizhen to death."
 POD_persistentpodlore.desc.793405: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAn important part of the Silver Lock's 'services' is protection. Armed guards on paying caravans, road patrols, and other means of control are fundamental to their long term success.\nFor the most part, this is done well and through an incredibly structured system, with well financed military grade protection, all financed by Juyuan.\n\nIn his mortal life, Juyuan was a treasurer for a guard post. Managing military finances was always something he did, and did well. Logistics was his strength, and even with poor funding, he worked small miracles through well usage of supply chains and foraging.\nHowever, such a role comes with dangerous hazards, and in a war he has long since forgotten, he was one of many casualties when the fort was pillaged, and one of the few who found themselves in Lanka.\n\nHowever, Juyuan could smell the pain on the wind, and while they were being corralled, he exploited errors in their counting, and slipped back to the world of the living. Collected and civilized, his mind for logistics made him selected by the Silver Locks, a role he would excel in. And to that end, his services are important now more than ever, especially as the [Glossary('Anda','podgloss.anda')] draw closer to China.\n\nFuture Fate\nJuyuan's destiny would not last long after that. When the [Glossary('Anda','podgloss.anda')] grew more present and Chinese trade shuddered with fear, Xinfu responded to Juyuan's warnings of needing to slow down by ripping off Juyuan's jaw and beating him into a smear of muscle and pulp."
 POD_persistentpodlore.desc.793406: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFor a master of assassins, being unnoticed is a boon. In the hidden caches and bases of the Silver Lock, there are people who speak of a fifth member, but few see them. In truth, Fengji just sees little need to interact with others. He hates conversation anyways.\n\nFengji has been angry his whole life. Born of incredibly short stature and made a mockery of by his own parents, he envied the love his sister got. He wanted it desperately.\nAnd yet, when they grew up and she was married off, his parents treated Fengji horribly despite being the heir. Never marrying due to his inability to find a wife, he became deeply bitter and angry, lashing out regularly while shutting himself away.\n\nAnd so that was his life, dying old, alone, and unloved, to then wake up in [Glossary('Kakuri','podgloss.kakuri')]. At least for his sake, his contempt for the world was so powerful not even the unnatural beauty of the [Glossary('Shikome','podgloss.shikome')] could stoke his lust. So he instead captured one, forced her to show him out, and then cut her to pieces and force fed them to another sorry devil before escaping.\nAnd with his anger and subtlety, his Ancestors put him in the Silver Lock [Glossary('Wu','podgloss.wu')]. Now, at least, he has outlets for his anger, organizing murders and abductions for enemies of the Yellow Emperor Court and the Silver Locks, for the first time in his life happy to at least be valued and respected.\n\nFuture Fate\nUnlike his contemporaries, Fengji thrived in the plethora of targets that the [Glossary('Anda','podgloss.anda')] invasion provided, and his services as a spymaster in the post Yellow Emperor Court world.\nAnd in time, his transcendent understanding of assassinations would see him ascend to the [Glossary('Hundred Clouds','podgloss.hundredclouds')] through the path of the Talons."
 POD_persistentpodlore.desc.793407: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt is said that war is a crucible for innovation. Such has been seen through countless points by the [kuei_jin|E], where centuries pass with nothing happening and years where centuries happen. And to that end, in this time of war, they have recruited a former engineer to help guide their investments.\n\nChujun was, from a young age, a rather bright, if naive, soul. Earnestly finding things like mathematics and engineering fascination, he longed and treasured investment.\nHowever, he died young, one of many to perish in the earlier phases of the Mongol Conquests. But his time in the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] was short, following a massive prisoner escape.\n\nConfused and disoriented, he was swiftly found with the others, but recruited even faster into the Silver Lock seeking someone to help them decide what projects to invest in. To that end, he is a young and earnest sage, hopeful for what the future entails.\n\nFuture Fate\nChujun would not be a [kuei_jin|E] for long. On his first venture, his lack of understanding in finance made him invest in a useless gunpowder smith, which cost the Silver Lock greatly. Chujun was punished accordingly, by being forced to eat as much gunpowder that could fill him and then lit on fire."
 POD_persistentpodlore.desc.793408: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn the village Yingmei was from, there were terrified whispers of the Broken Glass Harlot, a serial killer who was an artist with using broken glass to make the pain of her victims as drawn out as they could be. Eventually, the city guard found a single unifying thread, that all the victims had turned down the attentions of a minor serving woman. When they investigated further, they found in her house countless implements of surgery and glass panes.\nYingmei was rewarded as she deserved, going to death laughing.\n\nBut the Hell of Being Flayed Alive taught Yingmei a hard lesson. Being rendered and flayed for what felt like centuries, even a hardened serial killer could be made to repent. And when, entirely by chance, her bounds broke when she had fully relented, she had escaped.\nAnd found her way back to the world of the living.\n\nYingmei knows she deserved Hell. She was a monster. She was an attention seeking fiend who would kill for the sake of being ignored. Now, as the founder and leader of the Eternal Ice [Glossary('Wu','podgloss.wu')], she has become a renowned physician, seeking enlightenment through Healing.\nAnd in Ages like these, healers are in ever short supply."
 POD_persistentpodlore.desc.793409: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn times of troubles, the world has been no stranger to bandits. While many are forced to it out of desperation, few are more vile than those who do so for the sake of enjoyment. The rush on plundering the weak. The pleasure of taking from the weak and being strong. And Yu'er is adamant that she was one of the worst.\n\nBorn during the Warring States Period, Yu'er lived in a great time to be a bandit. As a child she loathed being weak, and was a bully though and through. When she was taken in by a local practitioner of traditional martial arts to try and temper her, Yu'er played the long game and instead used it as a means to grow strong.\nOnce she could beat her fellow students, she murdered them all in the night, slashed out her master's heels and left him to bled to death. She then took up the road of banditry, and enjoyed it immensely. At least until she was captured and executed by the Qin. And that is where her new story began, as she learned just what she had done when she was now the victim in Lanka.\n\nYu'er's memory of the time is hazy, but she knew she spent centuries in Lanka and ending up hating the mortal life that threw her there. Now, she has turned her martial skill into seeking enlightenment through attacking bandits in this time of chaos, and fighting in the Underworld to try and free it from its dictator's cruelty.\nShe knows she can only atone through action, so she fights now. Her path to redemption is long, but she is certain to walk it as best she can."
 POD_persistentpodlore.desc.793410: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile finding the actions of the conqueror Piyau to be madness is not an uncommon sentiment among the Yellow Emperor Court, for the most part, Piyau's disciples pay little mind to the more conservative central Court. However, one critic cuts deeper. Enough to sting.\n\nHuitong in her mortal life would have had every reason to follow their path. Born destitute, forced into sex work from a young age, and treated horribly, she by all means should see Piyau's path as a means of liberation.\nAnd yet, Huitong is also clear that such bitterness made her a hateful and empty shell. She poisoned indiscriminately, hated any she could punch down, and at times wished to simply reverse the situation and make a new kind of hell.\n\nAnd in the Pit of Salt and Iron, she saw the truth. Men forced to be monsters. Making men deny their humanity, making love a weakness, making tenderness a farce. The pains may be different, but for the [Glossary('Penangallan','podgloss.penangallan')] to say men have nothing but benefit is erroneous and false.\n\nSo she instead advocates to all. The voice of the Eternal Ice and the most bitter critic, her treatises are beginning to make waves, especially among the Kinfolk of the Beast Courts and men who wish to be soft and gentle. And as the influence of the Eternal Ice grows larger, even frost may potentially overtake passionate flowers."
 POD_persistentpodlore.desc.793411: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt is quite common among the [kuei_jin|E] for them to have done horrible things or be involved in things of great evil, either as a victim or actor. They all went to Hell of course. But upon hearing what Fumihito did, many could barely stomach to be around him. And only in the Eternal Ice did he find those that trusted that he earnestly wishes for redemption.\n\nIn his mortal life, Fumihito was a terrible bastard of a man. Angry, hostile, and violent, all of the village could tell how vile he was from the sounds from his house that were coming from his wife. If anything was imperfect, he responded with the same bloodied cane.\nAnd when she had a daughter, Fumihito was so furious to be denied a son, he drowned the child and sealed his wife in a cellar, where she perished. His death was equally miserable at least, as he died alone in the winter, as the rest of his village refused to shelter him out of fear for what he might do to them.\n\nAnd he was rewarded for his life with [Glossary('Kakuri','podgloss.kakuri')]. And it was there he found his wife again, now as a [Glossary('Shikome','podgloss.shikome')] consort of the Lord of [Glossary('Kakuri','podgloss.kakuri')], smiling holding that same bloodied cane.\n\nHow long Fumihito spent in [Glossary('Kakuri','podgloss.kakuri')] is unknown to him, but when Yellow Emperor Court [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] found him, he was a blithering wreck, every ounce of cruelty beaten out of him.\nWhen interrogated, he was taken by the Eternal Ice, despite the protests of a visiting [Glossary('Penangallan','podgloss.penangallan')], who demanded he should be killed. But the Eternal Ice wouldn't budge, demanding that the cause they stood for demanded nothing less.\n\nFumihito has since taken to communing with the dead, doing all he could to resolve their lingering regrets and woes for the sake of atonement. And every day he remains haunted. And in these trying times, he knows he will be tested as he deserves."
 POD_persistentpodlore.desc.793412: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn times of chaos, it is not uncommon for one of the most worst trades to take place. That of the sale of the common man to others, in using the chaos of war to abduct those most vulnerable, to take them from their homes, put them in iron, and sell them to places unknown to be used for who knows what.\nAnd the men made collecting this 'commodity' extremely rich. And Benli was one such man.\n\nBenli made his mortal career as a state sponsored collector of slaves, routinely leading raids into foreign lands and collecting 'savages' to be taken as prisoners and captives either for chattel work or other dubious lifestyles slaves could be pushed into.\nBenli however realized that taking adults could be a hassle, so he specialized in abducting children, and became good at it. Some clients would want them for things he never bothered to question, and eventually, began taking jobs at abducting the children of rivals, marking them and disfiguring them so that they could never be traced, and sold away.\n\nSuch was Benli's life, until one furious mother found him when she recognized a birthmark on a girl with full facial burns when she was passing by a brothel to be her own child daughter. And Benli was punished properly for his crimes within the Hell of Upside Down Sinners, oscillating between madness and despair. His own self inverted, from a cold, greedy, and vain monster into a warm, giving, and overflowing with humility devil.\nBut he remembers what he did. He can't forget it. Now, he is a secret sponsor to slaves seeking to break free, making allies for his [Glossary('Wu','podgloss.wu')] among them so they have eyes and ears everywhere.\nMost of them don't know the soft and gentle person he is now would have in his mortal life exploited them so utterly. But he would have it that way. He likes himself far more now than he ever did as a bastard."
 POD_persistentpodlore.desc.793413: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\n \"I am the Queen, the gatherer-up of treasures, most thoughtful, first of those who merit worship. Thus Gods have established me in many places with many homes to enter and abide in.\nThrough me alone all eat the food that feeds them, – each man who sees, breathes, hears the word outspoken. They know it not, yet I reside in the essence of the Universe. Hear, one and all, the truth as I declare it.\"\n\nSuch is what Shodashi teaches that the Descended would deny, that the spawn of Zapathasura would torment, and that the lofty heretics of the North would deny.\nThe self evident and radiant light of the goddess that they would deny.\n\nShodashi is old for the Hungry Dead, a contemporary of Shiva-Ohm. But where Shiva-Ohm would claim to be the son of the liar Sita, Shodashi does not deny she was mortal. She was born in Bengal, to a mortal man and woman, and lived her life as a mundane nobody, barely pious, overfocusing on the mortal world. And for that she was enlightened by the Hell.\nAnd for her wisdom, the divine essence of Mahavidya inspired her. A piece of divinity. A chance to be more. A chance to be greater. A chance to be as Gods, made righteous by the flawed understanding of morality.\n\nAs such, she took the name of Tripura Sundari, that which made her whole. And since returning to the world of the living, she has preached to unite the Goddess and make whole of humanity. Hell is broken. And by her hands it will be fixed.\nBut the lies must be ended, the sinners must be brought to wisdom, and the devils that plague the center of the world must be expunged. Reject duality and limitation, rise above it all and be as gods to set the world right. Such is her cause. Such will be her will."
 POD_persistentpodlore.desc.793414: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFrom the moment they first emerged from the Hells, the Chen family caught the eyes and ears of local ancestors. Rare was it that people escaped Hell in groups. Rarer still is it when people of the same family escape Hell in general. But a family that escaped Hell together? That is another thing all together.\n\nThe eldest of the siblings, Chen Ming was outwardly cold, but held within her immense bravado and unflinching resolve. Tutored under Sun Li, the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] initially were hopeful Ming would become a general like her mentor, but Ming was a quarreling student.\nTaking every opportunity to defy her teachings, they would have a falling out. However, Ming was still a student of one of the finest military minds, and her audacity to lead her [Glossary('Wu','podgloss.wu')] not as a Crane but a Centipede was a minor scandal, but being Ming's skill in holding the South Western regions of the Yellow Emperor Court from Ravnos incursion earned her a great deal of respect.\n\nAt the moment, she is very much the head of the Sovereigns of Virtue, but largely by force of will. And in these trying times, those bonds of family will be tested.\n\nFuture Fate\nMing would eventually, after the war against the [Glossary('Anda','podgloss.anda')], be emboldened to folly. Seeing the success against the [Glossary('Anda','podgloss.anda')], she tried leading a similar initiative against the Kshatriya.\nAnd even as a student of one of the finest masters of war, she was not her teacher, and she was broken before the might of Chandraputra."
 POD_persistentpodlore.desc.793415: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFrom the moment they first emerged from the Hells, the Chen family caught the eyes and ears of local ancestors. Rare was it that people escaped Hell in groups. Rarer still is it when people of the same family escape Hell in general. But a family that escaped Hell together? That is another thing all together.\n\nThe second child of the family, Jiang is a personable but thoughtful soul. Having wanted to be a doctor in his mortal life, his second breath has revealed in him an incredible gift for the soul arts. Factoring in his skill for coin, he became the backbone of the Sovereigns of Virtue, financing their missions and objectives from their shared haven.\nDespite not being the oldest, he is often assumed to be in his candor. Given he is the emotional core of the family, he guides them and consoles his siblings where they struggle, reminding them of their shared flight from Hell to push them further.\nAnd to that end, here he remains to support his family.\n\nFuture Fate\nGiven the potential threat the Sovereigns of Virtue posed to [Glossary('Anda','podgloss.anda')] invasion channels, they were a special target. As he was overseeing new students, an [Glossary('Anda','podgloss.anda')] assassin force known as the Black Winds ambushed him, and ended his story there."
 POD_persistentpodlore.desc.793416: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFrom the moment they first emerged from the Hells, the Chen family caught the eyes and ears of local ancestors. Rare was it that people escaped Hell in groups. Rarer still is it when people of the same family escape Hell in general. But a family that escaped Hell together? That is another thing all together.\n\nA middle child, Hui seemed remarkably content with it. A scholar with a love for the sciences and stars, he also had a quick mind for chemistry and engineering. As he was civilized, he seemed to absorb himself in similar mysteries of the universe, studious to a rather uncanny degree.\nEven to his siblings, he rarely leaves his room in their haven, leaving his siblings to make sense of his studies and plans. But when they can, they show an underpinning brilliance and sagacity that has saved them many a time.\nHowever though, as the world thrashes around them, Hui may soon be forced to take action in a world that will force him to face it.\n\nFuture Fate\nWith Jiang's death, Hui was left incredibly lost in the world. He sought out the closest [Glossary('Wu','podgloss.wu')] he had seen reports of in his siblings' works, and went to the Emerald Biers.\nHowever, this proximity would later damn him, as when a horrible truth was uncovered about them, he would die like so many others in their court, as yet another dinner for the Devil-Eater."
 POD_persistentpodlore.desc.793417: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFrom the moment they first emerged from the Hells, the Chen family caught the eyes and ears of local ancestors. Rare was it that people escaped Hell in groups. Rarer still is it when people of the same family escape Hell in general. But a family that escaped Hell together? That is another thing all together.\n\nZhihao, among his siblings, has always been the biggest problem child among them. The second youngest, he responded to his [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] restoring his sanity by breaking their noses, punching his teacher in the throat, and then trying to gouge the eyes of the Dhampyr attending him.\nA temper wild even for a Devil Tiger, Zhihao rages from one thing to another with all the grace of a wildfire, all the restraint of an explosion, and all the humility of an emperor with something to prove. His boldness at least makes him effective, but even his ferocity can be dangerous.\nAt the very least, his siblings can point him at the [Glossary('Anda','podgloss.anda')] for now, but once that threat runs out, there are genuine worries about whether or not they can direct their brother.\n\nFuture Fate\nZhihao would die shortly after Jiang would. With the core of their family gone, Zhihao charged after his killers like a beast possessed, deep into the heart of [Glossary('Anda','podgloss.anda')] territory, where he met his predictable end."
 POD_persistentpodlore.desc.793418: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFrom the moment they first emerged from the Hells, the Chen family caught the eyes and ears of local ancestors. Rare was it that people escaped Hell in groups. Rarer still is it when people of the same family escape Hell in general. But a family that escaped Hell together? That is another thing all together.\n\nYong, the youngest of the siblings, was assumed by the [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] to be a shoe in for the Thrashing Dragons for her beauty, but to their surprise, Yong wanted nothing to do with the pursuits of flesh or love.\nA quintessential student of the Eight Lotus Blooming, she is above all a sage, the spiritual advisor and compass of her family.\n\nShe is the only one that all can concur with, that can make the whirlwind of emotion that they are into a cohesive whole. And especially now, as they confide in her their worries and woes as the [Glossary('Anda','podgloss.anda')] draw close and China burns, she is tested more than ever. But she takes it in stride as best she can.\n\nFuture Fate\nYong would outlive all her siblings, but only for something much more tragic. Yong would briefly champion the Quincunx, but then withdraw to her meditations.\nBut in modern nights, she saw omens of a great threat, an army of demons marching. So she went to confront the one eyed devil she saw leading it. She simply ordered them to stand down. The Devil, the veteran of the [Glossary('Anda','podgloss.anda')] War and General of the Heaven and Hell Legion would not stand for it, and the now Great Ancestor of the Eight Lotus Blooming tried to strike down the General for her impudence.\n\nYong's corpse would become the first step on Ma Hai-Lan's rise to power."
 POD_persistentpodlore.desc.793419: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe youngest disciple of Dyanang has been a wondrous ray of hope to many in the current time of decline of the Scarlet Phoenix Court. Despite being a man in the matriarchal Court, Sokkate has been embracing the Laughing Rainbow [Glossary('Dharma','podgloss.dharma')] with open arms and made it his own in record time.\nHis compassionate, curious and easygoing behavior make him a paragon of the teachings of the Thousand Cranes Mother, the founder of this philosophy. This has made him an easy choice for Dyanang to handle the western reaches of the Scarlet Phoenix as he was a native of Burma.\n\nHis tenure as Ancestor has been less perfect than his Dharmic education as his laidback nature has left more ambitious regional Ancestors slip from his grasp. Still, for those more interested in exploring the passion of the Thrashing Dragons than in politics, there is no better place than Sokkate's court.\n\nFuture fate\nOffering no real resistance to Piyau's conquest, Sokkate will be presented with the same choice she gave to every male Ancestor. He will choose abdication instead of betraying his [Glossary('Dharma','podgloss.dharma')].\nRespecting his reputation (and his unconditional surrender instead of bloody resistance), Piyau will let him and his court leave unharmed. Sokkate will never be seen again after passing for the last time through the door of his palace, though his followers will swear that he ascended to the [Glossary('Hundred Clouds','podgloss.hundredclouds')] at that moment."
 POD_persistentpodlore.desc.793420: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhen hearing she would become the disciple of rising star of the Scarlet Court, Sokkate, Linlun was overjoyed. She saw a great opportunity to elevate quickly her own station, perhaps becoming an Ancestor herself way before her time. She was quickly disparaged of these notions. While Sokkate is certainly a diligent and kind teacher, he is a joke when it comes to politics.\nLinlun saw the Burmese Court splinters into pieces before her very eyes, her every suggestion to take decisive action being ignored by her indolent teacher.\n\nFuming at seeing her chances for power being wasted, Linlun has become the only true voice of dissent in Sokkate's court. Not that it means much, as said court is basically entirely composed of zealous Dharmic students that sneer at her \"baser\" concerns.\n\nFuture fate\nLinlun won't shed a tear when her teacher is ousted by Piyau Piyung. In fact, she will eagerly embrace the Passion Bloodflowers ideology, leading Piyau to appoint her as Golden Queen of Burma.\nLinlun overestimated her own political abilities however and she will never be able to completely subdue the regional courts. While moving her seat of power to Mandalay in the future will be a shrewd move, she will be blindsided by the coming of the British and lose her remaining political capital by that point."
 POD_persistentpodlore.desc.793421: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhen first chosen by Sokkate as a student, Wanna couldn't believe his ears. As a shy and unassuming young [kuei_jin|E] still reeling from his time in the Hells, he thought the vibrant and exuberant Thrashing Dragons [Glossary('Dharma','podgloss.dharma')] would never fit him.\nHe was mostly right... but not as much as he feared. Truth be told, he still doesn't understand why Sokkate choose him as it's still obvious that this [Glossary('Dharma','podgloss.dharma')] doesn't come naturally at all to him. Progress is made however, and he is thankful for having been pulled out of the worst pains of early Dharmic experience.\n\nOutside of his own enlightenment, Wanna has become the unofficial administrator of his teacher's court as Sokkate himself has no interest in politics. While Wanna is happy to have something to do, he is concerned to see that his efforts basically bear no fruits as the regional Courts become more and more unruly. To his continued surprise however, Sokkate doesn't seem to care at all that Wanna is basically ruining his domain to the ground despite his best efforts.\n\nFuture fate\nAfter Sokkate's abdication, Wanna will ponder staying with his fellow disciple (and now queen), Linlun. Finding her to have become way too extreme for his taste however, he will instead focus on his [Glossary('Dharma','podgloss.dharma')] for the following centuries.\nWhile he will never reach the [Glossary('Hundred Clouds','podgloss.hundredclouds')], he will go as far as to join the esteemed Thousand Cranes Mother's entourage and learn directly from her, something Wanna hope would have made Sokkate proud."
 POD_persistentpodlore.desc.793422: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nNarasingha was no one in his mortal life, even he would agree to this. He isn't even sure why he ended up in the [UmbraGlossaryLocalized('yomi_wan','Yomi Hells')] since he only committed small time larceny and never killed anyone. Whatever the case might be, his insignificance was his strength. The Yomi Guardians didn't even really register him and, as long as he didn't do anything stupid, they were happy to let him be and focus on more prestigious prisoners.\nNarasingha's escape was thus fairly uneventful, a far cry from the heroic tales of some other [kuei_jin|E}]. His first nights back however were all but that.\n\nFound by the servitors of the \"Goddess\" Shodashi, Narasingha was suddenly taught that he was a god himself... and he didn't believe a word of it. He was however far too cunning to let it show and played the part of the eager student. He isn't sure if Shodashi believed his act but his willingness to listen and obey at least gave him a passing grade.\nNow Narasingha is learned enough in the ways of his [Glossary('Dharma','podgloss.dharma')] to rule his court full of sycophants and servitors eager to cater to his every whim.\n\nAnd so, while his Dharmic enlightenment is basically shunted, Narasingha's life has never been better. It is good to be a god."
 POD_persistentpodlore.desc.791542: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBy her own recollection, Eindra was content with her mortal life. A caring husband, many healthy children and a small remote village to live in. Thus, she felt a strong sense of injustice when she ended up in a [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')], thinking that she did not deserve this sentence at all.\nEindra wasn't prepared for the experience but she found something in her she didn't expect, stubbornness. She repeated herself (and to anyone who would listen) that her sentence wasn't fair and so never lowered herself to feel anything from her captors' torture. Finally, bored of this inflexible woman, they simply let her go.\n\nTo no one's surprise, Eindra didn't exactly thrive when she was pushed to become a Thrashing Dragon (like most Scarlet Phoenix Courtiers are expected to become). Too random and too fickle of a [Glossary('Dharma','podgloss.dharma')] for her tastes. While she didn't find a suitable teacher for an alternative, the Brilliant Coals variant of the [Glossary('Dharma','podgloss.dharma')] at least allowed her to vent her frustrations more easily.\n\nEven with the issue of her [Glossary('Dharma','podgloss.dharma')] settled, Eindra proved to be a somber, morose and mood killing presence in the exuberant and vibrant Scarlet Courts. As she was politically isolated, it was a given that she ended up basically exiled to the westernmost frontier of the Scarlet Court.\nA more than thankless job, as she has to be the gatekeeper against all the Indian heresies.\n\nSurprinsigly, Eindra soon learned to love that political exile. Her unflinching nature shines in a role where she is supposed to rebuke basically every attempt to cross the Scarlet border.\n\nFuture fate\nEindra will barely notice Piyau's conquest. Since her job didn't change, why would she care?\nFor their part, the Golden Queens will be more than happy to let their dour gatekeeper continue handling the frontier."
 POD_persistentpodlore.desc.791534: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn her mortal life, Raya was a priestess of Po Inu Naga, the mythical founder of the Cham people. She only has fond memories of that time, a stark contrast to her death that she has no recollection of. Since she ended up in Yomi, she fears that she did something so terrible that her mind choose to forgot during the decades lost in Hell.\n\nWhatever the truth might be, Raya found a quiet strength and a continued faith in her goddess to help her endure Yomi. Underestimated by her captors, she took the first opportunity she found to escape.\n\nRaya took easily enough to [kuei_jin|E] society, becoming a student of Dyanang herself and becoming instrumental in some of the Scarlet Court's successes, like its warm diplomacy with the Beast Courts. These achievements and her steady rise in [Glossary('Dharma','podgloss.dharma')] made her the obvious heir to Dyanang as she approached the [Glossary('Hundred Clouds','podgloss.hundredclouds')].\n\nThis changed in recent times. Raya seems to have found herself in a growing melancholy, some whispering that it is due to her strong attachment to her goddess and coming to the realization that she is the last one truly remembering her. Dyanang herself has tried to rouse her student, to seemingly no avail, forcing the Scarlet Court Empress to delay her own enlightenment in the fears of leaving the Court to an unprepared Raya.\n\nThe shrine maiden has only roused herself recently by asking to leave for Champa and become a regional Ancestor here, a request that has been granted in the hopes of rekindling her flame.\n\nFuture fate\nRaya will pose no resistance to Piyau's conquest despite the wishes of many at the court. After leaving Angkor, Dyanang will come find her and they will leave together.\nSome say to the [Glossary('Hundred Clouds','podgloss.hundredclouds')], some say to greet the sun one last time."
 POD_persistentpodlore.desc.793423: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe success of the Faces of the Goddess [Glossary('Dharma','podgloss.dharma')] has been one shocking and surprising for many ancestors. Despite its split from the Celestial Tribe and its place surrounded by enemies, it would surprise many to see that Shodashi's philosophy didn't burn away and collapse into flames.\nBut when they look deeper, they find that the fire that burned in one of her disciples was far hotter, far more wild. One that, if unleashed, could become a wildfire that could consume Devil and Goddess alike.\n\nShe remembers her mortal life in a broken haze of anger and frustration. Her time in the Hell of Salt and Iron was that of a toy that would fight the user, for the user's amusement, a fate humiliating and dejecting, but one that ignited the fire in her ever hotter.\nFinally, it grew out of control, and Bhairavi could stand it no longer. Breaking her limbs to escape her chains, clenching her jaw to powder to avoid her screams, fleecing herself to deny them a grip, she fled in a whirlwind of desperation and determination. She would not be broken.\nShe couldn't be. And as she fled, visions and hazes of a woman most beautiful ran through her tormented mind.\n\nAnd when she found herself back in the world of the living, it was Shodashi who found her first. And took her as her first disciple, for clearly Bhairavi had given her the spark of divinity.\nTo the red haired devil, this made sense. It worked. And to that end, she would be their fury. Their anger. She would be the Faces of the Goddess' Fierce Goddess."
 POD_persistentpodlore.desc.793424: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n李傕曾是将中国皇帝玩弄于股掌的枭雄，最终却沦为史书中被更伟大人物掩盖的脚注。这位刻毒、野心勃勃且残暴的军阀在耻辱死亡堕入[Glossary('刺链地狱','podgloss.hellspikedchains')]时，并未感到多少意外。作为\"名人录\"中的小角色，他表面上欣然服从[Glossary('阎魔','podgloss.yamaking')][Glossary('多科尔汗','podgloss.dokhorkhan')]的差遣，实则依旧如生前般桀骜难驯，最终利用自己受宠的地位策划逃亡。\n被派往玄武皇朝学习[kuei_jin|E]礼仪期间，李傕始终心不在焉，将这些教条视作当年导致他失势的政治把戏。这种政治遇冷反而成了他的护身符。当[Glossary('多科尔汗','podgloss.dokhorkhan')]的阴影笼罩玄武皇朝时，遭遇刺杀的李傕敏锐察觉风向，在[Glossary('阎魔','podgloss.yamaking')]对叛将展开清算前便远遁边陲，独自过着离群索居的生活。直到少女萨格志的出现。\n\n这个将他幻想成救世英雄的逃亡者，意外唤醒了老军阀尘封已久的热血——并非出于怜悯或责任（这些品质早已被他抛弃），而是意识到自己骨子里仍渴望着最后一场值得全力以赴的战争。若能借此摆脱萨格志的纠缠，同时给[Glossary('多科尔汗','podgloss.dokhorkhan')]添堵，何乐而不为？随着越来越多的玄武皇朝遗民聚集麾下，李傕暗自思忖：这次或许真能在青史中留下浓墨重彩的一笔。虽由萨格志代表玄武皇朝签署五行盟约，但真正重创[Glossary('多科尔汗','podgloss.dokhorkhan')]草原势力的正是李傕——他在十四世纪给予[Glossary('阎魔','podgloss.yamaking')]致命一击，加速了其统治的崩溃。\n当萨格志凯旋归来时，老军阀已杳无踪迹。众人皆猜测是[Glossary('阎魔','podgloss.yamaking')]残党成功复仇，唯有少女始终相信，那个满腹牢骚的老家伙终以自己乖戾的方式云开雾散得道飞升。"
 POD_persistentpodlore.desc.793425: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色\n\n随着[Glossary('多科尔汗','podgloss.dokhorkhan')]对玄武皇朝的影响力日益增加，他的胆量也与日俱增。这位[Glossary('阎魔','podgloss.yamaking')]不再满足于等待亡魂自行堕入他的疆域，开始派遣刺客加速那些特别有趣的凡人的死亡。萨格志便是其中一例。\n\n作为部落里技艺高超的追踪者，她在睡梦中惨遭杀害，仅仅因为[Glossary('多科尔汗','podgloss.dokhorkhan')]认为他麾下的某个地狱部族需要这样的人才。这位[Glossary('阎魔','podgloss.yamaking')]未曾料到的是，即便在自己的疆域里，追踪一位追踪者也非易事。萨格志潜伏多时，屡次险险避开搜捕，最终找到出口重返人间。\n\n然而回到凡世对萨格志而言并非救赎。刚从[Glossary('铁棘地狱','podgloss.hellspikedchains')]归来的她，轻易识破了皇朝上下多数人早已臣服的迹象。此时她听闻了李傕的名号，这位著名的异议者多年前便离开了玄武皇朝。尽管这位军阀刻意隐匿行踪，但终究难逃顶尖追踪者的寻觅。\n\n初次会面令人大失所望。那个暴跳如雷的阴郁老者，动辄以\"大不敬\"相威胁的模样，与传闻中的形象相去甚远。但固执的萨格志别无选择，向[Glossary('多科尔汗','podgloss.dokhorkhan')]屈服从来不在考虑之列。她的坚持最终奏效，李傕多半是不堪其扰，才勉强答应重出江湖。\n\n如今萨格志虽名义上是副手，实际上包揽了所有非军务要事。她开朗的天性使其深受玄武遗民爱戴，成为他们与那位不情不愿的导师之间的桥梁。\n\n其在原作中的未来命运\n当李傕运筹帷幄之时，萨格志将是这个脆弱联盟得以维系的关键。因此在五行宗成立之际，她成为代表军阀出席的不二人选，并在其失踪后继任大统。直至今夜，她仍是草原上举足轻重的老祖，只是眉宇间少了几分往日的笑意。不得不承认，她竟有些怀念那个老顽固。"
 POD_persistentpodlore.desc.793426: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nDokhor's Khan most favored ritual is the \"Spiked Chains\" where victims are bound tightly in Yomi-iron chains and hung from the stalactites in a great, windy cave for years at a time. Struggle to escape only make the agony worse, and [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] enjoys placing small files and lockpicks just out of reach. While he would never admit it, this torture technique actually cost [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] one prisoner.\nYangdai, an apparently unnaturally flexible young man, found himself enduring the Spiked Chains for less than two days before reaching a lockpick and escaping. Enraged, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] made killing the escapee the priority for his [akuma|E] for several years.\n\nWith the Black Tortoise Court strongly in thrall of the [Glossary('Yama King','podgloss.yamaking')], Yangdai found very little shelter and possibility for Dharmic enlightenment. While he had considered going South, he was unaware of what could possibly await for him there since perhaps even the Chinese were in league with his tormentor. Thus he went North, going as far away from civilization as possible.\n\nIt was the lack of Dharmic tutelage that forced Yangdai to seek the company of other [kuei_jin|E] once more. Thankfully for him, by that point, the Silver Blade Horsemen of Li Jue and Sagezhi were starting to take form and they were happy to welcome another victim of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nStill quiet and reserved, Yangdai has been eager to take on the more stealthy missions needed by the group. He is actually one of the few to report directly to Li Jue instead of Sagezhi, the latter joking that a whole conversation between the two of them end up more often than not less than ten words.\n\nFuture fate\nYangdai will survive to see the fall of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], leaving a broken lockpick on one of the purified Dragon Nest. While he will mostly disappear afterwards, he will still visit Sagezhi infrequently, sometimes even saying more than ten words."
 POD_persistentpodlore.desc.793427: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBaohuoli had nothing to do with [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] and now he might be his most dogged foe.\nBorn and dying in a Siberian hunter gatherer tribe, Baohuoli wasn't a kind man and paid the price for it by entering [Glossary('Tou Mu','podgloss.toumu')]'s [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] on his death. Thankfully for him, [Glossary('Tou Mu','podgloss.toumu')]'s reach so close to [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s playground was very weak and he thus was able to escape before being formally caught.\nHis return as a [kuei_jin|E] was as uneventful as the minor Siberian Court where he ended up was small and isolationist.\nUntil [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s send his first \"Blessed\" [akuma|E] for a field trial on this weak target. The slaughter that ensued only left Baohuoli alive.\n\nMore of a cold and callous mind before this event, Baohuoli found a burning rage take him over and firmly shift him from a Bone Flower to a Devil Tiger [Glossary('Dharma','podgloss.dharma')]. He then visited most major Black Tortoise Courts and found only disdain, scorn or even violence when he argued for bold attacks against [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\n\nIt was during a battle against a \"Blessed\" [akuma|E] that Baohuoli was found by the Silver Blade Horsemen (and, even if he won't admit it, saved in the process). While Sagezhi was reluctant, seeing his wrath as self destructive, Li Jue accepted Baohuoli into his ranks.\nHe became a feared vanguard, being always the first to jump into battle. Sagezhi argues that his self destructive behavior and constant arguing for more and more aggressive actions is actually more of an hindrance to the group than a boon. This is however one of the few instances where Li Jue doesn't listen to her, apparently content to have a raging tiger to point at difficult targets that others wouldn't dare approach.\n\nFuture fate\nBaohuoli would, to the surprise of many, actually survive to see [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s fall. He will however argue strongly against joining the Quincunx as he felt that the Southern Courts did little to help.\nAfter an especially strong clash with Sagezhi, Baohuoli will disappear. The new uncontested leader of the Silver Blade Horsemen will launch an investigation without success though a dark twinkle in Yangdai's eye will give her pause..."
 POD_persistentpodlore.desc.793428: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMinggan never thought she would ride alongside a band of hardened veteran horsemen. As the bookish daughter of a minor Jin official, her biggest worry was dreading the day of her marriage. Something that never came, as she was killed during the anti Jin revolts of 1127.\nMinggan was woefully unprepared for the Hells of Spiked Chains and broke easily. It was only the act of compassion of other escapees taking her with them that saved her.\n\nHer introduction into [kuei_jin|E] society was a revelation for Minggan and she read everything from the Great Sages she could get her hands on. This is when she found that the Court where she resided was basically flaunting most of these precepts and, when one of her teachers pushed a book she knew was forbidden into her hands, she understood.\n\nMinggan took the initiative perhaps for the first time in her life when she heard of the Court intention to crackdown on the nearby \"heretical resistance\". Jumping on the first horse she found, she rose ahead and warned the Silver Blade Horsemen of the impending attack.\nThis forewarning helped the Silver Blade mount an ambush and secured her a spot in the group.\n\nMinggan is quickly blossoming in her new environment. While their lack of decorum and disdain for court politics sadden her, she is teaching them many historically relevant facts and is actually serving as a mentor for Dharmic enlightenment to many, as she is one of the few with broad knowledge of them.\nShe never interacted with Li Jue but Sagezhi is proving to become a fast friend and something of a mentor herself for the more practical knowledge that Minggan lacks.\n\nFuture fate\nMinggan will chronicle the fall of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] and become one of the most respected teachers of the Steppe Courts. Her pull over many of the new generation will be instrumental in keeping Sagezhi as the leading force in the post Black Tortoise era for the region."
 POD_persistentpodlore.desc.793429: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMaoying never truly feel like she belonged. While this steeled her resolve and helped her escape the [UmbraGlossaryLocalized('yomi_wan','Yomi Hells')], it meant that her Dharmic enlightenment never really took root. Despite many teachers trying to school the obviously skilled and dedicated woman, she never really felt drawn to any specific [Glossary('Dharma','podgloss.dharma')]. She even studied some unorthodox ones (though she drawn the line at infernalist ones) to no avail. Then Shan Bo came.\nA diligent, if strict, Devil Tiger mentor, he managed to truly make a [Glossary('Dharma','podgloss.dharma')] seem appealing to Maoying. Thus she dedicated herself to become the best student there is. Thanks to her more practical nature compared to the very inward focused Shan Bo, she soon became more of an assistant, making sure that her teacher could provide for his many students and didn't step into political traps. Life was good, until Shan Bo changed.\n\nShe didn't know what truly happened but when her mentor started criticizing the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] himself and talking of challenging him, she was horrified. No amount of debate or pleading could sway him however and she soon found herself before a choice. Fearing to lose the only place she truly felt was home, she silenced her concerns and \"joined\" her teacher's heresy.\nMaoying is now unwillingly managing Shan Bo's growing cult while hoping to find an out that can save her own soul.\n\nFuture fate\nMaoying won't even try to stop Shan Bo when he will depart in his journey to challenge the August Personage. When he, predictably, never come back, she will quickly disband the cult and go back to her own way.\nShe will become something of an urban legend to modern Ancestors, a drifting [kuei_jin|E] that never found a [Glossary('Dharma','podgloss.dharma')] or a Court to belong. Her arrival somewhere will be seen as a sign of troubles ahead."
 POD_persistentpodlore.desc.793430: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nXingcheng was a member of a minor cult during his life. Not a true believer by any means, he used this relative power to get ahead by any means necessary until he was found out by a true believer and promptly dealt with. Finding himself in the [Glossary('Wicked City','podgloss.wickedcity')], Xingcheng adapted well, swindling the scavengers to improve his own station. The [Glossary('Wicked City','podgloss.wickedcity')] is much more resilient than a single con man can truly outsmart however and Xingcheng quickly understood that he would never achieve power and riches in there if he wasn't allowed to. And thus he used what he had achieved to escape instead.\n\nBack to the mortal world, Xingcheng became a fairly unremarkable [kuei_jin|E], likely destined for a minor court position. If he was skilled enough to deceive some villagers and refugees from the [Glossary('Wicked City','podgloss.wickedcity')], Xingcheng was but a child compared to the entrenched Ancestors and thus his every attempt ended up only in him being brought low and punished.\nShan Bo entered the Court at this moment, followed by an entire group of his students ready to argue for the merits of his apparently mad teachings. Xingcheng recognized a cult when he saw one and enlisted on the spot.\n\nAt first, it was business as usual for him and he quickly gained some riches and respect from the more naive students of Shan Bo. But then something changed. He started truly listening to the master and enlightenment dawned over him. All of his life has led him to this point and Xingcheng can't wait to climb Mount Meru to question the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] with his mentor.\nWhat a sight it will be! Him, the lowly con artist finally telling what's what to the most powerful entity of the Heavens!\n\nFuture fate\nOn the way to Mount Meru, Xingcheng will be executed when sent to convert the Ancestor Fu Hao and her Court."
 POD_persistentpodlore.desc.793431: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nTooril has few memories of his mortal life. Considering what happened after, he thinks it might be for the best.\nEmbraced by a Gangrel that thoroughly thrashed him despite Tooril being a skilled brawler, he never saw his [Sire|E] again, being left to fend for himself as was, as he learned decades later, a custom among the Gangrel.\nTruth be told, he fared very poorly.\n\nBeing overwhelmed by his new condition as a vampire, Tooril became quite close to a mindless beast, listening to his inner demon way more than he should have. He became a local monster, killing indiscriminately passing tribes or settlements and, since the region was so remote, there was no other creatures of the night to stop him. Tooril fears that he might have wiped the entire population of his \"kingdom\" if not for the [Glossary('Anda','podgloss.anda')] arrival.\n\nWhile the bestial Gangrel was certainly a strong warrior, he was no match for the disciplined and more in control vanguard. While his story could have ended here, a respected ex shaman and now mentor of Via Yasaq, Kuchuguden, stopped the horsemen before they could kill Tooril.\nIt took months (and many fights for dominance) before progress was made but it happened. Tooril, schooled in the way of the [Glossary('Anda','podgloss.anda')], slowly regained control of himself and managed to keep his Beast at bay. While he was certainly very thankful for the help, there was still one thing left to consider, the price.\n\nTooril was sent back to his native Gobi with the mandate of checking for weaknesses in this rear of the Yellow Emperor Court.\nThe Gangrel is no fool. While they would claim it is a position of honor and an obvious one because of his knowledge of the region, Tooril understands that he will never truly belong to the Horde as a non [Glossary('Anda','podgloss.anda')] and, thus, is expendable.\nIn the end though, it doesn't matter to him. Discovering Via Yasaq saved him and he intents to repay this gift with honor, loyalty and zeal for the Horde.\nEven if he will always be a mistrusted outsider."
 POD_persistentpodlore.desc.793432: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile the [Glossary('Anda','podgloss.anda')] are accustomed to shamans being strange at times, they still think Kuchuguden is downright weird. For his part, the mentor answers that he only follows Tengri's changing moods, gentle and cleansing rain in the morning can make way for a destructive thunderstorm at night.\nWhat is agreed upon though is that he is one of the most respected mentors of Via Yasaq and acts as a traveling teacher to the nomadic [Glossary('Anda','podgloss.anda')]. While he will always be welcome, only the truly enlightened (and patient) deliberately seek his counsel. It is more often than not the unruly neonates that are thrown his way in the hopes of his unusual teachings techniques having a result while others have not.\n\nKuchuguden doesn't have a blood brother or an arban (the [Glossary('Anda','podgloss.anda')] fighting forces) of his own and some of his detractors have taken this to mean that, while clearly dedicated to Yasaq, Kuchuguden might not be as dedicated to the [Glossary('Anda','podgloss.anda')] Horde as a whole.\nThey aren't too far from the truth.\n\nKuchuguden dislikes the militaristic path Dobrul and his successors have set the [Glossary('Anda','podgloss.anda')] on. While no pacifist, he sees no gains to be made by antagonizing their neighbors. It is not as if they could realistically wipe all the Demons of Xia or the $pod_cainites$. Thus, at best the [Glossary('Anda','podgloss.anda')] will be embroiled into very long conflicts or at worst exterminated by their many enemies.\nHis lack of political influence makes his viewpoint moot in the grand scheme of things and he knows it. Thus, his efforts at schooling stubborn neonates (or even non [Glossary('Anda','podgloss.anda')]) are driven by the goal of having many former pupils that will hopefully listen to him when the time is right.\nKuchuguden doesn't want to betray his people so he isn't sure \"when\" the time will be right but he is confident that Tengri will send him a sign. He just hopes that he will be able to see it in time."
 POD_persistentpodlore.desc.793433: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nSaryk was a lower member of the traditional Naiman tribal aristocracy when they were crushed by the then named Temujin. He was thus also part of the Naiman that choose Jemugha, Temujin's blood brother, as the \"universal ruler\" to oppose him. Jemugha had trouble building a lasting coalition to oppose his once brother and many of the aristocracy he pulled from ended up disappointing. Saryk was somewhat better, having at least a solid grasp on steppe warfare. It sadly didn't meant much when the Battle of the Thirteen Sides happened.\nWith Jemugha crushed, and seemingly killed, Saryk fled for his life to the Naiman of the Kara-Khitan Khanate. Despite the rise of power of his tribe in this region, Saryk didn't accomplish much more until he was ambushed one night. At first fearing his assailant to be a man of Temujin, he was even more shocked to see Jemugha, apparently very much still walking the Earth. Before he could react though, Saryk was dead and reborn as a vampire.\n\nJemugha took time to instruct his first childe in the little he knew about vampires and the [Glossary('Anda','podgloss.anda')] cause but it proved too much too quickly for Saryk. Still thinking as a mortal, the Naiman saw the real threat as being Temujin and didn't understand when he saw that Jemugha hold no grudge against him. His every suggestion to hamper the rise of Genghis Khan were scoffed at or met with disdain by the [Glossary('Anda','podgloss.anda')] and Saryk grew more bitter and isolated.\n\nNowadays, the Great Khan is finally dead but has become a legend to Mongols and [Glossary('Anda','podgloss.anda')] alike. As Saryk is still not keeping his thoughts on the matter to himself, he was ultimately sent to Gobi to \"keep an eye\" on the Gangrel Tooril. While clearly just an exile not saying its name, Saryk is at least satisfied to no longer be in the middle of people worshiping his one sided nemesis.\nAs his mood improves, he might consider even making an effort and helping plan for the attack on the Yellow Emperor Court from the rear."
 POD_persistentpodlore.desc.793434: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIbakha was a gregarious and energetic child in a tribe roaming Gobi. While she always considered it home, her mother passed away stories of her own mother who apparently came from another tribe entirely, one that has been wiped out by a terrible monster. Ibakha listened closely but ultimately paid it no mind, like most children do. It was not until she grew into a young woman that she wondered more about this story.\n\nIbakha had the troubling sensation of being watched by an unseen presence. While it wasn't happening all the time, it did occur enough to unsettle her. Talking with other members of the tribe only earned her gruff rebuttals, most not wanting to potentially attract the ire of the monster.\n\nThen, one day, her tribe lost a skirmish with another and she was captured alongside many of the non combatants. She didn't have time to be roughed up by her captors that a whirlwind of fangs and claws tore them apart and freed her.\nHer savior was a rough looking man who didn't answer most of her questions.\n\nTime has passed since then and Ibakha has learned (with difficulty) some things about Tooril. He only comes out at night, he is fiercely protective of her for some unknown reason (though she is starting to pierce the puzzle) and his blood has magical properties. When she fell ill, it healed her quicker than any shaman concoctions.\n\nTimes are changing however and Tooril can't kept Ibakha completely out of reach anymore. He has explained that others like him are coming to Gobi and that he has to prepare for a war.\nIbakha knows that, if she pushed a little more, he would likely answer her questions about who he is, what he is and what is happening.\n\nThe thing is, she isn't sure if she would like his answers."
 POD_persistentpodlore.desc.793435: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nVietnam is, compared to much of the rest of the night world, a warzone. The collapse of the Scarlet Phoenix Court has opened up both interested southern Hungry Dead warlords from Indonesia and Malaysia and northern sycophants of the Chinese Courts to hungrily eye and covet a region not their own. An insult Phùng Thị Chính will not stand for.\n\nChính was born long ago, in a time when Vietnam was being exploited by the local governor. The rise of many warriors, both men and women under the Trưng sisters to throw the imperial overseers out. Chính was one of many aligned with their cause, who came to fame as a specially gifted warrior who could not be stopped, even giving birth on an active battlefield and fighting with her newborn in hand.\nHowever, no matter how righteous their cause, the generalship of Ma Yuan saw their rebellion destroyed. And Chính, despite her bravery and strength of will, became one of many killed among those captured.\n\nChính however would not let her people's story end there. Rather, death taught her the danger of brazenness. In Lanka she became a phantom. In her escape she was a ghost.\nAnd returned through the world of the living, she briefly tutored under one who would understand, and then returned to Vietnam. That is when numerous ancestors installed by Dyanang met ignominious deaths, Wang Hongben's officials met gory ends, and Piyau's daughters of scandals found their last dances.\nFinally, as the Scarlet Phoenix Court crumbles, Chính steps from behind the curtain, asserting herself as an Ancestor who stands not for Dyanang or Wang Hongben, but for her people and the nation she once fought for.\n\nFuture Fate\nDespite the more brazen opening, Chính would play politics close to her chest and be wary of everything around them. When Piyau was revealed to be outright unstoppable in her conquests, she negotiated assisting with [akuma|E] hunts in return for unprecedented local autonomy.\nAnd into modern nights, her own take on the Golden Courts of Vietnam will flourish where others didn't stand the test of time."
 POD_persistentpodlore.desc.793436: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOng was used to living between two worlds. The daughter of a Chinese trader and a Korean merchant's daughter, from her childhood she was used to standing out.\nBut she did find a calling. She felt at home at sea. The bob of the ships, the grain of a handrail, the wind in her face, the smell of salt, all of it made her feel at home. Even her husband was married for the sake of making sure she wouldn't lose her home. And even stepping into late adulthood for the time, she could at least be considered some measure of happy.\n\nAt least before it was taken from her.\n\nOng had the misfortune of being the target of a Lasombra embrace. A cavalcade of misfortune leading to her husband's merchant caravan leading to pirates, her homes raider by bandits, and all she had built destroyed in fire, she tried all she could to hold onto her dying dream. And when her final ship was sinking, her choosing to go down with it.\nAnd that is when Hafiz approached her, and offered to restore it all, should she choose to become a vampire. Ong, simply wanting to sail the sea again, agreed. And then she learned that Hafiz was the architect of all her pain, and that now he wanted her to worship a foreign god.\nShe plots her freedom, her return to the sea. Her pride demands nothing less.\n\nFuture Fate\nOng and Hafiz fell out often and nearly constantly. She refused to join the Ashirra, and stole away with her own merchant fleet to build anew, even aligning herself with the Camarilla when it arrived in East Asia to spite her sire.\nDespite [kuei_jin|E] dominance in the city, she would proclaim herself 'Prince' of Singapore as a snub to her sire, organizing the crew she built into a small domain within Singapore for which to deny the Ashirra access to the ports."
 POD_persistentpodlore.desc.793437: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nYoudao is the latest in a long line of Ancestors sent from the Yellow Emperor Court to make sure the frontier region of Vietnam doesn't fall in the hands of the Scarlet Phoenix Court. Contrary to his predecessors, he is actually quite successful at this endeavor.\n\nHis secret is simple, he is not a politically minded individual. Content to preach the more traditional Fivefold [Glossary('Dharma','podgloss.dharma')] to the Viets, he has made no move to extend his reach despite the Viet Court aligned with the Scarlet Phoenix collapsing on its own. His only policy regarding this event has been to welcome refugees from the [akuma|E] encroaching south. The more warlike factions of the Yellow Emperor Court aren't happy with this and push for Youdao to be more aggressive or face his recalling to Changan. Youdao, for his part, has the inkling that this posturing won't matter for long.\n\nFuture fate\nWhen the Yellow Emperor Court collapses, Youdao will see the writing on the wall. Simply packing his things and going to the still stable Bone Court, he will forgo any political ambitions and dedicate his time to the study of his [Glossary('Dharma','podgloss.dharma')].\nThis will make him a surprisingly well liked and respected figure for Viet [kuei_jin|E] who will often visit him for scholarly matters. Despite many Ancestors pushing him to become a diplomat between the Chinese and Viet Courts, Youdao will always refuse."
 POD_persistentpodlore.desc.793438: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nLuong Trac was born during the dying years of the Ly dynasty and was one of the victims of the Chinese Sui conquest of Vietnam. Hurled into Lanka, Luong Trac was reborn in the fires of this warlike realm. Cultivating her latent talent for bloodshed, she became respected among the Raksha as a worthy prisoner and a potential [akuma|E] for their lord Ravana. It was seemingly not to be however as Luong battled her way out of Yomi after several grueling decades of warfare.\n\nEmerging as a [kuei_jin|E], Luong was enraged at seeing Vietnam under the thumb of a Yellow Emperor Court lackey. Eschewing her Dharmic enlightenment, she lead a force of like minded [kuei_jin|E] to conquer her native realm with the support of the Scarlet Phoenix Court. After several decades of conflict, Luong was mostly successful, starting her reign as the Scarlet Ancestor of Vietnam.\nIt was time for her to focus on her Dharmic enlightenment, something that proved a more challenging endeavor. Refusing to take teachers, as she considered herself as an Ancestor above that, she tried to emulate the aggressive Passion Bloodflowers philosophy starting to take Southeast Asia by storm.\nIt was to no avail however, Luong confusing wanton violence and destruction for liberation. The stigma of a very low [Glossary('Dharma','podgloss.dharma')] Ancestor had repercussions on her court as many left her behind once the conflict for Vietnam was over.\nSensing weakness, the Yellow Emperor Court took back most of their lost land and other regional Ancestors declared independence. With her Dharmic collapse well known, Luong has lost her political capital and isn't able to muster the forces she once could.\n\nAs everything crumbles around her, Luong finally found a way out. If warfare was the only thing she was good at, it might be time to bring the realm of eternal war where she thrived so much to this world...\n\nFuture fate\nLuong's pledge to Ravana will be a serious threat to the region for a while. The short lived alliance between Phùng Thị Chính and Quyen Vien will bring her down and Piyau's forces will hunt her remaining supporters.\nThe memories of her bloody reign will be a factor in keeping Vietnam's [kuei_jin|E] politics more tame than the rest of the Golden Courts."
 POD_persistentpodlore.desc.793439: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nLiving during the tumultuous Anarchy of the 12 Warlords era, Quyen Vien was told many stories about legendary figures such as lady Trieu and the Trưng sisters, hoping that she would become the one for this age. This was not to be as her prospective military superior was more interested in her feminine allure rather than her fiery spirit. Thrown into Lanka, Quyen found she indeed had the talent for fighting but still thrived to find a worthy cause behind it. She thus fled as soon as she got the chance.\n\nWhen she met Luong Trac, Quyen was awed. This woman with a similar background to her achieved so much, seemingly liberating Vietnam from the Chinese [kuei_jin|E]. Stubbornly pleading her case, she managed to become her student.\n\nThe truth soon proved to be less perfect than Quyen hoped. Luong was a very poor teacher as she lacked Dharmic enlightenment herself. Having no real responsibilities at the court, Quyen simply decided to leave and look for answers herself.\nThat is when she met Phùng Thị Chính, an actual hero of her childhood stories. Her [Glossary('Dharma','podgloss.dharma')] seemed alien to Quyen however and they thus parted ways quickly, though amicably. It was not until the rise of the Passion Bloodflowers that Quyen truly found her way. After achieving her first breakthroughs, she excitedly came back to her first mentor, Luong, to share the good news. What she found horrified her.\n\nQuyen was thus the first to accuse Luong of being an [akuma|E] and rally other concerned courtiers to her cause. With the help of Phùng Thị Chính, Quyen is ready to take the fight to her fallen mentor and become the protagonist of her own legend.\n\nFuture fate\nWhile Quyen and Phùng Thị Chính will achieve victory, their relationship will sour as Quyen will align closely with Piyau's Golden Courts.\nNo warfare will erupt between the two but Vietnam will stay divided between their two competing courts for a while.\nThe French arrival in the 19th century will seriously disrupt Quyen's powerbase in southern Vietnam, up to the point of her destruction at the hands of the [cainite|E] Prince of Manila."
 POD_persistentpodlore.desc.793440: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe son of a Chinese trader's daughter and Filipino fisherman, Isagani spent his youth growing up during the boom of Song Dynasty trade in the Philippines. And then one night while sailing, seeing a reflection in the water, he was swiftly killed by one of the Cainites of the Phillippines, and cast into the Hell of Boiling Seas.\nAnd it was then his grandparent revealed themself, a ship of [kuei_jin|E] casting into hell and finding Isagani, the son of a Dhampyr and cultivated from birth to lead.\n\nIsagani was deeply confused and disoriented by his rapid death, descent to hell, and then rescue in what felt like a blur. But he was chosen for a reason. Precise, loyal, social, clever, and handsome from focused development in his parents, one could say his only flaw would be his constant fear of the depths and threats around him.\nAnd so, his teacher trained him to lead the newly established Violet Coral Court, placed him in command as their most accomplished student, and then settled to their dharmic studies.\n\nIsagani walks a tightrope. Abroad the Yellow Emperor Court's greater demands of his court and the wider threat of Piyau breathing down his back have done little to assuage his paranoia.\nAnd further complicating things is a part of them that has fallen for the handsome, dangerous, and wild beast that killed him, now sharing either savage battles or passionate couplings with the progenitor of the lineage that is his enemy.\n\nWas his mentor right in setting him up for this? Or will he fail because despite all his advantages, he lacked the will to thrive?\n\nFuture Fate\nIsagani would manage to hold, but not thrive. The Yellow Emperor Court's collapse does buy him time, and clever diversions of the Anh into Piyau's Golden Courts get him reprieve, but the Anh's entrenchment is nigh impossible to uproot.\nBut when a new lineage threatens them both, Isagani and Ngai may now finally have the political cause to bury their hatchet and face the rising threat of the Hari in a land both consider their home."
 POD_persistentpodlore.desc.793441: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile the August Courts have plenty of space and need for Dhampyr, sometimes, someone can just be too reckless with making them that the veil between the Night and Day Worlds blur, and unwanted attention can be dangerous.\nSo, to that end, the Grandmaster Yuan was, as soon as trade contact with the Philippines reached the ears of the higher officials of the Yellow Emperor Court, given 'the opportunity of an age'.\n\nYuan is an inconsistent and wild hearted man. Moving between the hedonism iconic of the Thrashing Dragons with a ferocity that could make a Pennangallan blush or an indulgent cruelty that could make a hardened Devil Tiger Ancestor balk, Yuan was most well known for the veritable army of Dhampyr he produced, so many in fact that a not insubstantial number came back as [kuei_jin|E]. This is what got him kicked upstairs to the Philippines.\nYuan is perfectly fine with this, as he has mused that he has grown tired of Chinese women, and as soon as several of his children died and returned as [kuei_jin|E], he elevated them, and retired to focus on his 'Dharmic pursuits', which in reality was a soul bonded fleet of maidens to tend to his every 'whim'.\nAnd, as the mainland Night World burns from the [Glossary('Anda','podgloss.anda')] assault, Yuan casually enjoys the pleasures of the flesh an ocean away, caring not for the horrifying political mess he put his children in.\n\nFuture Fate\nYuan, true to his [Glossary('Dharma','podgloss.dharma')] in form, function, and mind, much to the shock of the surviving ancestors who hear of it, would later ascend to the [Glossary('Hundred Clouds','podgloss.hundredclouds')] before Spanish arrival in the Philippines, much to the headaches and jubilee of his surviving children.\nHowever, so despised was he by his children, his name would be functionally forgotten by the 1600s, and his impact would only remain in his progeny that had to clean up his mess."
 POD_persistentpodlore.desc.793442: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile there are whispers in the mainland courts of flesh arts, among the myriad powers and factions in Southeastern Asia, the mastery of Piyau and her Penanggalans is all too real, and something of a feared measure, their greatest arts all to themselves.\nAt least, they were. Until the Manananggal managed to take them. And they owe their own deviation on Flesh Shintai to their First Divider.\n\nKalinaw, like many of the higher ancestors of the Violet Coral Court, was a Dhampyr descended of Grandmaster Yuan. One of many positioned to begin expanding his court across the Philippines, Kalinaw was one of the few unlucky enough to die at night in a storm, exiling her into [Glossary('Kakuri','podgloss.kakuri')].\nAt least, luckily for Kalinaw, [Glossary('Emma-O','podgloss.emmao')]'s 'tastes' in victims didn't apply to her, so under the cover of a storm, slipped out back to the living world. And, like her fellow disciples under Yuan, was elevated quickly into being a figure of authority among the Violet Coral Court, specifically as an envoy to the declining Scarlet Phoenix Court.\nAnd it was there that she first met the disciples of Piyau.\n\nWhile they would for the most part preach their matriarchal tirade, Kalinaw paid little attention to it. What really interested her was their Flesh Shintai.\nShe played coy with them, pretending to be fully on board, citing her 'frustrations' and 'mistreatment' as a former Dhampyr. One of them bought it, and once she had internalized it, she immediately fled back to her home, where she shared the arts with her Court.\n\nFuture Fate\nKalinaw's stunt would not do the Violet Court many favors, but Piyau's own ascension at least gave them breathing room, as the formation of the Quincunx was a far greater issue.\nKalinaw would become one of the foremost experts on Flesh Shintai outside of the Golden Courts, and later on, would become a critical part of countering the Fleshcrafted monstrosities of the Blood Mage Cainites who would one day later establish themselves and dominate the Philippines."
 POD_persistentpodlore.desc.793443: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMakisig isn't much for theory. He is a man of praxis. Of action. He doesn't want to sit by and babble nonsense about righteous action while doing nothing. And for that reason, many mock him afar. But to the disciples of the Violet Coral Court, few Ancestors are more beloved.\n\nMakisig was one of the numerous Dhampyr descendants of Yuan, but unlike most of them, he was considered a failure, as unlike many of the others, while blessed with an immensely strong body and a potent virility, he was slower to his studies, and often struggled on concepts his Ancestor considered essential, so he was spent as a meathead.\n\nSent to his death in a doomed battle against the native Kindred of the Philippines, and after being turned into chum at sea, he was condemned to the Hell of Boiling Seas. And yet, in a rather ironic turn of events, his directness, strength, and the tricks and riddles of devils going over his head led to him simply cracking enough skulls the devils just let him leave for fear of his strength.\nAnd, while Yuan still rejected him, something Makisig wouldn't forgive him for, Isagani and Kalinaw would welcome him into their fold, something he would be eternally grateful for.\n\nMakisig has what any would consider an unenviable position, but he knows this and does it proudly. Charged with ensuring the Anh never go further than Visayas, he holds the line through sheer unrelenting violence and bullheaded determination, unflinching in his vigil.\nHe is one of the few Hungry Dead to ever survive an engagement with the Anh's progenitor, and he punishes the evil with an earnest and proud will. And as long as he can stand, he will fight to protect his home from the foul blooded horrors that despoil it.\n\nFuture Fate\nMakisig would be instrumental in the survival of the Violet Coral Court, but at a terrible cost.\nWith the arrival of the Hari despoilers, he would personally investigate the affair. When he discovered the true horror at the heart of it, he would challenge it directly, and while it would slay him, Makisig would buy the Night World of East Asia precious centuries of peace from Kagaseo, as he would become the first being to force her into [torpor|E], proving to the Night World that even the Hand of the Iron Tyrant can be beaten, and deny her followers her presence for over two centuries."
 POD_persistentpodlore.desc.793444: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe youngest of the Dhampyr descended from Yuan, Adhika has already striven to have a very full life. Her earliest memories are of her mother being pulled into the sea and devoured, of the lecherous gazes of a younger disciple had towards her as a teen, Adhika has thus, from the moment she could pick up a weapon, starting challenging these horrors, head to head, without a concern for the dangers, and for no other reason than, in her eyes, it being the right thing to do.\n\nYuan, finding the 'fancies' of the young Dhampyr bemusing, had her train among old Shih contacts, and Adhika found no path more fulfilling. While few would take a Dhampyr Demon Hunter seriously, Adhika became very, very good at it.\nEnough that the other more level headed Ancestors of the Violet Coral Court wanted to know what in the Hells Yuan was thinking. But it mattered little, as when Adhika returned, she could at least be aimed against the Anh, and other interlopers in their Court.\nGiven special permission, despite just being a Dhampyr, Adhika has a high degree of freedom in the Court. And as far as she is concerned, she will use it to be a fist that smites evil.\n\nFuture Fate\nAdhika would go on, slay, and die as she lived. A Demon Slayer.\nHowever, unlike many other Demon Hunters, she would pass on what she knew to her descendants. She would have her own children, and pass on her war to them, creating a lineage of Filipino Hunters that, while they would eventually fade away from the Violet Coral Court, keep up their hunt against Kindred and Hungry Dead both, named 'Aswang' by this lineage."
 POD_persistentpodlore.desc.793445: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIt has been a long time since Munsuq walked the Earth. He did kind of miss the feeling.\n\nThe leader of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s Favored Ones, Munsuq has long discarded his past as an Hunnic raider. His master was still a very young [Glossary('Yama King','podgloss.yamaking')] at this point and Munsuq reaped the rewards of being one of the first cruel enough to do what [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] told him. As the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] expanded, his loyalty was rewarded by making him the de facto lieutenant, leader of the Favored Ones tribe and basically highest authority in the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] outside of Dokhor himself.\nMunsuq greatly enjoyed these privileges for centuries, perhaps even a little too much. While he was a relatively shrewd military man a long time ago, centuries spent simply hunting and bullying helpless prisoners didn't exactly keep his skills sharp. This resulted in many embarrassing security breaches and, while the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] is clearly getting more powerful far quicker than most others, it's also one where a higher than usual number of prisoners manage to escape. This has risen to a point where [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] himself has taken notice.\nWhile the [Glossary('Yama King','podgloss.yamaking')] is busy finishing asserting his control over the steppes and the Black Tortoise Court, he has tasked Munsuq to lead some of his best [akuma|E] to crush the remaining opposition, punish the escapees of his hell and pave the way for his coming to the mortal world.\nAfter all, it wouldn't do for the future [Glossary('Demon Emperor','podgloss.demonemperor')]'s domain to be anything less than ironclad.\n\nAnd so, Munsuq is back to the steppes of his mortal life and while they have changed a lot since then, he hasn't. More than confident in the many impressive \"blessings\" [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] granted him over the years, the Favored One can't wait to be reacquainted with some former inmates.\nPerhaps they will even put up more of a fight than his usual wretched preys."
 POD_persistentpodlore.desc.793446: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nMost [akuma|E] first turn to infernalism because of a lust for power, glory or revenge. Salikh turned because he was bored to death.\n\nA willful man in his mortal life, Salikh fought his way out of the [UmbraGlossaryLocalized('yomi_wan','Yomi Hells')] with skill and valor. As a [kuei_jin|E], he became a disciple of the Resplendent Cranes and was praised for his orderly conduct, great dedication to his studies and drive to act properly. And all of this amounted to little when Salikh understood that he would have to do the same thing over and over again for centuries before truly rising in station or enlightenment.\nAs a nomadic tribesman in life, the stiffening confines of the sedentary courts, combined to this impression that, while he did everything right, nothing truly mattered finally got to him.\nOne night, without warning, he rode to the steppes, not really knowing what he was looking for. [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s influence was already pervasive at that point and Salikh quickly understood what would happen if he stayed. He did so nonetheless.\n\nIt started small, with some (exciting!) forbidden rituals leading to (interesting!) new powers. Then it turned to darker deeds, selling his own soul, bringing other courts under the [Glossary('Yama King','podgloss.yamaking')]'s influence... In truth, Salikh knows what he is doing is evil and that he has condemned himself to be a pawn for all eternity. But it truly doesn't matter to him as life as an [akuma|E] is exciting and he craves this sensation like no other.\n\nWith [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s final takeover of the steppes approaching, he can't wait to see what new horrors will appear when this world merges with the Hell of the Spiked Chains..."
 POD_persistentpodlore.desc.793447: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nSongul was born to a Shatuo tribe and lived a mostly inconsequential life until she killed her husband under circumstances that she doesn't remember today. Executed by her husband's brother after the fact, she ended up in [Glossary('Kakuri','podgloss.kakuri')], [Glossary('Emma-O','podgloss.emmao')]'s [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]. She would learn later that she was one of the last mortal from the steppes to end up there before [Glossary('Emma-O','podgloss.emmao')]'s influence in this area was supplanted by [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nIn any case, Songul was horrified to her core by this realm of broken women molded to obey [Glossary('Emma-O','podgloss.emmao')]'s every order and whim. Thankfully for her, as a steppe woman, the [Glossary('Yama King','podgloss.yamaking')] had no interest in her and she was thus ignored.\nHer escape sadly coincided with an expansion of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s realm and instead of returning to the mortal world, she ended up in his [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')].\n\nThis time, Songul found this realm almost... normal. True, it was a twisted extreme of the harsh life of the steppes but it was still recognizable in its patterns. She easily found her place among the Favored Ones and used this position to escape.\n\nThe return as a [kuei_jin|E] was another shocking experience for Songul. There was an entire society of supernaturals under the surface that basically did nothing against the [Glossary('Yama Kings','podgloss.yamaking')], content to follow mythical sages and the faint hope of a redemption from a god she didn't believe in.\nHer best efforts to raise awareness of the [Glossary('Yama Kings','podgloss.yamaking')]' threat were met with snickering and rebuttal at her youthful insolence. When her very public and very loud shaming of an Ancestor ended up in her exile, Songul knew what she had to do.\n\nIt is clear as day to her that the [Glossary('Yama Kings','podgloss.yamaking')] will triumph. So the only thing she can still make sure is that the less horrifying one wins. And thus, Songul pledged herself to [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], becoming perhaps his most zealous [akuma|E] with him not having left a single finger to make it happen."
 POD_persistentpodlore.desc.793448: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nQurdjaquz was once a well known name among the Black Tortoise Court. A dedicated Devil Tiger respected for his drive to safeguard the Court against the many threats surrounding it. Alongside Lei Fan, he was the strongest advocate for redirecting efforts against the [Glossary('Anda','podgloss.anda')] and [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s Akumas instead of the Yellow Emperor Court.\nA man of action first and foremost, Qurdjaquz scored several victories against minor incursions of the [Glossary('Yama King','podgloss.yamaking')] though a true triumph eluded him. The possibility to achieve just that came when he uncovered [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s long term plan, the corruption of the Dragon Nests of the steppes.\n\nIt was a grand night for the Black Tortoise Court, with powerful warriors rallied by Qurdjaquz preparing for a telling strike against [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Even the jaded Ancestors gave their blessing to this unprecedented opportunity. The battle was to be a powerful setback to the rise of the [Glossary('Demon Emperor','podgloss.demonemperor')].\n\nIn the end, they were all slaughtered except Qurdjaquz himself. Some say [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] was at the site of the corrupted Dragon Nest for his true plan required his presence. The [Glossary('Yama King','podgloss.yamaking')] didn't want to only corrupt the Dragon Nests, he intended to \"key\" them to his own Akumas. This allows him to gain sole use of the corrupted Chi (which ends up weakening other [Glossary('Yama Kings','podgloss.yamaking')]) and to transfer the corrupted Chi from one creature to another at will.\nQurdjaquz was the first captive forcefully \"keyed\" to a corrupted Dragon Nest and driven completely insane by the burst of evil Chi constantly flowing through him.\n\nThus ended the night of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s greatest triumph. A revolutionary edge against his rivals secured, a foe molded into a servant and the combative spirit of the Black Tortoise Court broken beyond repair, ripe for the taking."
 POD_persistentpodlore.desc.793449: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nJakhangir was raised with tales of heroes, gods and monsters and enjoyed every minute of it. The fact that many of those served as warnings against very real dangers never really get through to him.\nBecoming a diligent member of his tribe thanks to wanting to emulate those heroes, Jakhangir showed enough promise that he was [Embrace|E]d by the [Glossary('Anda','podgloss.anda')]. Thrilled to be part of a strong community such as this one, Jakhangir still knew he had to do something to really distinguish himself, as heroic figures always do. He thus decided to give immortality to his childhood crush before she could grew old without him.\nThe [Glossary('Anda','podgloss.anda')], who only allow Embracing once you are experimented enough and are stricter about women joining them, weren't amused. So much so that they banished Jakhangir and his new childe, Aslihan, from their camp.\nJakhangir, while saddened at this, took it in stride. Aslihan was grateful for becoming immortal and the two of them thus continued their lives on the steppes as an unlikely duo.\n\nWhile lacking some basic knowledge on the supernatural, they proved resourceful enough to survive and their good nature made them welcome among various groups, including some [Glossary('Anda','podgloss.anda')] tribes that didn't know of their exile.\n\nIt was when they rode further east than the bulk of the [Glossary('Anda','podgloss.anda')] that their destinies took a turn for the worse. Ambushed by [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s Akumas who were looking for isolated [Glossary('Anda','podgloss.anda')], they were brought to a corrupted Dragon Nest and subjected to [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s latest experiments, creating \"[Glossary('Anda','podgloss.anda')] [akuma|E]\". To his pleasure, the test was successful, warping the minds of the unfortunate couple with an overwhelming amount of evil Chi.\nWhile a fragment of their past selves remains, buried under the constant pain and horror of the experiments, Jakhangir and Aslihan are now puppets of the [Glossary('Yama King','podgloss.yamaking')], unable to defy his commands to bring more [Glossary('Anda','podgloss.anda')] to him.\n\nif all goes according to plan, the two of them will only be the first of an unending army of [Glossary('Anda','podgloss.anda')] [akuma|E] that will ensure [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s rise as the [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793450: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nJakhangir was raised with tales of heroes, gods and monsters and enjoyed every minute of it. The fact that many of those served as warnings against very real dangers never really get through to him.\nBecoming a diligent member of his tribe thanks to wanting to emulate those heroes, Jakhangir showed enough promise that he was [Embrace|E]d by the [Glossary('Anda','podgloss.anda')]. Thrilled to be part of a strong community such as this one, Jakhangir still knew he had to do something to really distinguish himself, as heroic figures always do. He thus decided to give immortality to his childhood crush before she could grew old without him.\nThe [Glossary('Anda','podgloss.anda')], who only allow Embracing once you are experimented enough and are stricter about women joining them, weren't amused. So much so that they banished Jakhangir and his new childe, Aslihan, from their camp.\nJakhangir, while saddened at this, took it in stride. Aslihan was grateful for becoming immortal and the two of them thus continued their lives on the steppes as an unlikely duo.\n\nWhile lacking some basic knowledge on the supernatural, they proved resourceful enough to survive and their good nature made them welcome among various groups, including some [Glossary('Anda','podgloss.anda')] tribes that didn't know of their exile.\n\nIt was when they rode further east than the bulk of the [Glossary('Anda','podgloss.anda')] that their destinies took a turn for the worse. Ambushed by [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s Akumas who were looking for isolated [Glossary('Anda','podgloss.anda')], they were brought to a corrupted Dragon Nest and subjected to [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s latest experiments, creating \"[Glossary('Anda','podgloss.anda')] [akuma|E]\". To his pleasure, the test was successful, warping the minds of the unfortunate couple with an overwhelming amount of evil Chi.\nWhile a fragment of their past selves remains, buried under the constant pain and horror of the experiments, Jakhangir and Aslihan are now puppets of the [Glossary('Yama King','podgloss.yamaking')], unable to defy his commands to bring more [Glossary('Anda','podgloss.anda')] to him.\n\nif all goes according to plan, the two of them will only be the first of an unending army of [Glossary('Anda','podgloss.anda')] [akuma|E] that will ensure [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s rise as the [Glossary('Demon Emperor','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793451: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAs a regional ancestor of the Black Tortoise Court, Khanda has the dubious honor of having a front row seat at what feels like the end of the world.\n\nA capable and respected ancestor once, she will be the first to admit that she underestimated the early signs. The disappearances, the indolence spreading from the central court, the casual disregard for the rumors of [akuma|E]... it sounded like your usual doom and gloom prevalent in younger generations that didn't know better. It was only when a minister she trusted tried to poison her Dragon Nest in front of her that she understood. He thought that she was already \"on board with the changes\" and paid for this with his life but it was too little too late.\n\nKhanda sees it now, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s influence is everywhere on the steppes. His [akuma|E] swagger like they own the place and the [Glossary('Anda','podgloss.anda')] $pod_cainites$ might also be on his pocket for all she knows. But... what was she supposed to do? Her show of defiance against her corrupt minister put her on the [Glossary('Yama King','podgloss.yamaking')]'s most wanted list and it was only a matter of time before she was slandered, threatened and blackmailed in the daily. It was when the first assassination attempt happened that Khanda knew that she had no choice anymore.\n\nMaking her first bargain with [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], Khanda became just another one of his pawns.\nOr so he thinks. The truth is, the beleaguered ancestor is more than ready to be a martyr. Now that the [Glossary('Yama King','podgloss.yamaking')] doesn't watch her closely, she has started subtly interfering with his plans. She can't be too brazen but misleading Akumas, letting resistance troops escape her territory, slandering \"rivals\"... it's not much but it adds up or at least she hopes it does.\nFor now, Khanda is happy to be considered an incompetent idiot in [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s forces. She fears the night when they will understand that she is actually very capable at what she does.\n\nFuture Fate\nKhanda's contributions to [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s downfall will remain unknown. When the [Glossary('Yama King','podgloss.yamaking')]'s is finally destroyed and her sold soul destroyed with him, she will go into oblivion with a smile on her face."
 POD_persistentpodlore.desc.793452: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nTayisung was always a simple soldier and it was a life that satisfied him. While he heard the rumors of the Black Tortoise Court being corrupted by [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], he mostly left these issues to those apparently more qualified to handle them. He regrets that choice nowadays.\n\nNever interested in power and having a spotless record, Tayisung was fine when he was sent to become a courtier in a minor regional Court. He even thrived there, achieving the honor to become the First Oni and warden of the Dragon Nest of said court, a task he took to heart.\nSadly, even this faraway posting couldn't keep [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s influence away forever. Tayisung saw the signs but stood his ground, stopping several budding [akuma|E] trying to get access to the Nest. It was only when Tayisung received an order from the Ancestor to stand down that he did so.\nAnother choice he regrets today.\n\nHe was sadly not surprised to see his Dragon Nest thoroughly corrupted when he got back to his post. At this point however, there is little he can do. He needs the Chi energies to survive and thus will end up corrupted as well and he knows it.\nRebelling has never been in Tayisung's vocabulary but the last thing he wants to promise himself as long his mind is still his is that he doesn't want to regret a choice for the third time.\n\nFuture fate\nWhen the Silver Blade Horsemen will attack his Dragon Nest to purify it, Tayisung will only put a token resistance and \"forget\" to warn his Court before being slain. This will be his first and last act of defiance."
 POD_persistentpodlore.desc.793453: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBaatar was a victim of one of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] infamous \"[akuma|E] raid\" where entire communities are slain to potentially end up in the [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] as prisoners. While he was a troubled child and an indecisive adult in his mortal life, Baatar proved to be strong under duress and endured the torture better than most.\nBetter than his older brother in any case, who also ended up as a prisoner at the same time as he did. While Baatar wasn't particularly close to him as a mortal, he tried his best to help and soothe him in this terrible prison. It didn't work however and, seeing his brother's spirit crushed, Baatar took the opportunity he saw to escape without him.\n\nWhile it was likely the good call at that point, this decisive choice hampered Baatar growth as a [kuei_jin|E] as he was always trying to find a way to get back here and save him. Obviously, his pleas to attack [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] were met with derisive laughter and thus Baatar despaired. It changed when the Black Tortoise Court fell more into corruption and the knowledge on how to bargain with [Glossary('Yama Kings','podgloss.yamaking')] became more widespread.\nBaatar thus made a deal with [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. His service as an [akuma|E] for the release of his brother. And, while the contract was sealed and thus binding for both parties, Baatar didn't specify \"where\" his brother should be released and thus didn't see him again. His new duties as an [akuma|E] forbid him from trying to track him down and Baatar is getting desperate once again.\nWith his soul sold and his brother stranded only [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] knows where, the future seems grim indeed.\n\nFuture fate\nDuring the years leading to [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]'s downfall, Baatar will hear of a fierce warrior of the Chinese Courts corresponding to the description of his brother. Indeed, when the final attacks are launched by the Quincunx, the two brothers will stand on opposite sides.\nBaatar will try to explain himself but his voice will be silenced by the petty [Glossary('Yama King','podgloss.yamaking')], thus making sure Baatar will be slain by his brother as just another [akuma|E]."
 POD_persistentpodlore.desc.793454: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nFrom the Chaos of the Eternal War, there is routine spill over. As of late, there are winds of change as new things begin to poke and prod further. And as these night horrors try to pass through the lands of the Tai people, they meet grisly ends. Lawan will not tolerate outside influence or mortal winds to taint her works.\n\nLawan, in life, was a slave to the Champa peoples, abducted and put into service in building their works. And that was her whole life, a chattel slave. And for that life, heaven saw fit to send her to the Hell of No Money, where, after a life of toil, she was left to scrounge on nothing and scraps and labor further.\nBut Lawan, desperately having sought an escape in life, and sick of the tyranny of mortal men and the [Glossary('Yama King','podgloss.yamaking')], made herself a fortress of dust and hurricane of breaths, where she would then blow away her jailers. And she would later be found by the Scarlet Phoenix Court after her escape.\n\nTo say Lawan has a chip on her shoulder from her mortal life is an understatement. She loathes and despises mortal society, seeing them as depraved monsters that have set Hell the way it is with their wickedness. They are cattle who would crush their own for the sake of avoiding the butcher.\nSo no, she would prevent them from tainting this purer society, and she would be a bulwark between the Courts and mortal sinfulness.\n\nFuture Fate:\nLawan would be an early ally of Piyau, seeing her incredibly divergent ideology from mortal society as prime liberation. However, her own resentment of mortal society would eventually leave her detached from potential allies, and be usurped and pushed into obscurity by later more integrationist courts in Modern Nights."
 POD_persistentpodlore.desc.793455: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile many Ancestors overfocus on [Glossary('Dharma','podgloss.dharma')], and some heretics obsess over their mortal life, that all strikes as rather silly to Klahan. One can seek higher powers and still care for those around them. In fact, he considers it the peak of wisdom. And besides, his mortal experiences demand nothing less.\n\nKlahan was born a slave, and even through that mortal hell, he was an optimist. Kind to those around him, personable and charismatic, and always willing to wait for others to come around, Klahan was well loved by all those around him.\nBut, his life was a footnote, and when he died, he was sent to the Hell of Being Flayed Alive for the sins of the people who owned him. But Klahan was used to having nothing but his wits and charisma, and used it well to sway travelers to aid his escape.\n\nKlahan is a sobering presence, and as such, he is considered a bit of a downer in the more vivacious Scarlet Phoenix Court. But he doesn't mind his rural appointments, as he builds connections among the people and builds soft power among mortals.\nHe has plans, goals, and hopes. Atonement now may yet come. He just needs to wait for the opportunity.\n\nFuture Fate\nKlahan's canny patience and willingness to stay in the shadows pays him well. Perfectly willing to be submissive and deferential to Piyau and her forces, he is largely ignored and absorbed quietly.\nBut in modernity, clever politicking and mortal support will see him overthrow their former masters, ascending properly and stepping into the light as the true protectors of their homeland.\nAnd as the [Glossary('Demon Emperor','podgloss.demonemperor')] draws closer, his wisdom is needed now more than ever."
 POD_persistentpodlore.desc.793456: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOnce, Sakchai was appointed to his court to ensure that no supernaturals would pass into South East Asia's seaways without approval or oversight from Dyanang. Now, it is just his approval and oversight he cares about.\nHis mortal life a miasma of shreds of isolation and chains, he remembers little of his time in the Hell of Upside Down Sinners as well. But he at least knows a freeform mindset is what freed him. His open mindedness originally is what earned him his position as an overseer of travelers, but the Scarlet Phoenix Court didn't see the ambition and grasping vainglory in his heart.\nHe always wanted a justification. And he found it when he met another strange night creature robed in shadows, preaching the word of a foreign god.\n\nSakchai would, on the surface at least, come to adopt this mindset to an extent, and let this stranger deeper into the Scarlet Phoenix Court. As more arrives, he curries favor and tries to build his power further among these '[cainite|E]s', seeking further links and connections to build his power.\nAs he sees it, rejecting these foreigners is idiocy. To succeed requires embracing the outsiders, at least in a way that appeases them.\nSo he has told these '[ashirra|E]' he is fully on board with them, using their faith as a justification for greater building of power and authority.\n\nFuture Fate\nSakchai would, through his drive and boldness, bite off far more than he could chew. When the Flaying Monkey Intan came to his court, his demands of her subservience and conversion in heart and mind to his new 'enlightenment' led to her finding his position no longer needed, and him trying to have her executed for defying him soured things further. He would even try to arrest the next disciple of Piyau sent to 'remove' him.\n\nHe would end up in the same gullet as countless Akuma as Wati devoured him whole."
 POD_persistentpodlore.desc.793457: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nEveryone in the Angkor Court clamor that Tilaka is strong, skilled and enlightened. As the leader of the famed Golden Shroud [Glossary('Wu','podgloss.wu')], her being the obvious successor of Dyanang is a given. How could it be otherwise?\nThe truth is a little more complicated.\n\nTilaka is indeed the leader of the famous group that brokered a lasting peace with the ferocious shapeshifters of the jungles. Being the leader doesn't mean that she was instrumental though and, truth be told, she was kind of the opposite.\nTilaka is ambitious to a fault and when her [Glossary('Wu','podgloss.wu')] mate Vedavati offered to start the negotiations with the shapeshifters, Tilaka saw only two outcomes. Success would bring her fame while failure would likely cost Vedavati's life, which was a price she was willing to pay.\nHer assessment turned out to be correct and Tilaka was quick to put her name at the front of the budding alliance treaty. So quick in fact that it almost soured the proceedings until Vedavati stepped up.\n\nIn the end, it didn't truly matter and Tilaka has been leveraging this great victory to its fullest ever since. To her credit, she did it well and the Angkor Court is eating from her hand at this point though, annoyingly, Dyanang herself is uncharacteristically cold and distant with her.\nNo matter really, the Scarlet Court Empress is likely to reach the [Glossary('Hundred Clouds','podgloss.hundredclouds')] soon enough, leaving the throne wide open for Tilaka. Then, she will reorganize the Court in her image and truly start her ascension.\n\nFuture fate\nPiyau's rise will concern Tilaka. Concern that will turn to outright panic when the Red Dragon will prove impressively successful.\nTilaka will try to leverage all her political power to brand her an heretic and send forces against her but will be stopped at every turn by Dyanang.\nWhen the Scarlet Empress finally leave Angkor, it will be too late. Tilaka's supporters will refuse to die for a lost cause, leaving her with no choice but to challenge the one she saw as her nemesis to a duel.\n\nPiyau will quickly dispatch her, idly wondering who was this frantic woman who apparently hated her so much."
 POD_persistentpodlore.desc.793458: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nSriteja has fond memories of her mortal life as a Khan kinfolk. She was always tall, strong and striking, making the Khan men treat her with respect and try to win her over. It didn't come to pass however as she died protecting her tribe from the [Glossary('Yama King','podgloss.yamaking')] Ravana's forces.\nEnding up in Lanka, the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] of Ravana, Sriteja simply saw it as a continuation of her previous battle. She fought it with determination and patience and earned her escape and return as a [kuei_jin|E]. Said return was a difficult experience for her, finding the cutthroat political ambiance of the Courts a far cry from the much simpler life of her mortal tribe.\nLeft adrift for a while, she ended up assigned to the Golden Shroud [Glossary('Wu','podgloss.wu')] when they started negotiating with the shapeshifters due to her past.\n\nSriteja's homecoming wasn't as warm as she expected early on, as her people now saw her with suspicion at best due to her being a [kuei_jin|E]. She didn't give up however, and reconnected with them as much as she could, helped by the peace negotiations going well at the same time.\n\nWhen they were finalized, Sriteja realized that, even with these warming relations, she could never live with her people and was forever condemned to stay an outsider. This plunged her into a malaise that turned into despair.\nWhen her leader Tilaka brought her to the Court to be removed from the Golden Shroud because she was now \"useless\", Scarlet Empress Dyanang refused and instead made Sriteja First Oni, thus general for the Angkor Court forces.\n\nThis surprise appointment's underlying motive soon became apparent. Sriteja had to work closely with the now allied shapeshifters to keep the peace and handle the common threats. She is now thriving in her new role, becoming a respected coordinator between the two forces.\n\nFuture fate\nSriteja won't bat an eye when her leader Tilaka self destructs against Piyau. She will instead be confirmed into her role. Even the splintering of the Courts post Piyau won't change much for her, the many Golden Queens still entrusting her to keep the peace with the Ferocious People of the jungles, something she still does to this day."
 POD_persistentpodlore.desc.793459: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nVedavati, despite what many think, was the true mastermind behind the treaty allying the Scarlet Phoenix Court with the ferocious shapeshifters of the jungles. Few would believe it seeing her however as her shy and unassuming presence doesn't mesh well with such a diplomatic feat.\n\nShe doesn't speak of her time in the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] but it's safe to assume that it left a profound stigma on her. It also gave her an unshakable conviction that the [Glossary('Yama King','podgloss.yamaking')]s have to be stopped. Sadly, she soon learned that many [kuei_jin|E] speak more about confronting them than actually doing something about it.\nBeing assigned to the Golden Shroud [Glossary('Wu','podgloss.wu')] didn't help matters. Its leader Tilaka being more concerned with personal glory and ambition than the true threat. It came to a breaking point and Vedavati was considering leaving the court when Scarlet Empress Dyanang summoned her for a private conversation. What has been said there isn't known but Vedavati left with a renewed fire in her eyes that lead her to spearhead the diplomatic efforts with the shapeshifters.\n\nWhen, despite the many hurdles, it proved successful, she was content to leave the praise for Tilaka and instead worked on her own projects. What those are is anyone's guess.\n\nFuture fate\nVedavati will subtly help Piyau's rise to power by playing the diplomat with several undecided Courts. When confronted about this unlikely help from someone not very suited to Piyau's extreme [Glossary('Dharma','podgloss.dharma')], Vedavati will simply say that the Red Dragon did more against the infernal powers than most Courts ever thought possible.\nShe would then fade in the background, becoming something of an urban legend among the Golden Courts as her fate will never be recorded."
 POD_persistentpodlore.desc.793460: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBhadra, for all intents and purposes, was a rather unremarkable [kuei_jin|E] that became the unremarkable youngest member of the Golden Shroud [Glossary('Wu','podgloss.wu')]. She drifted through Dharmic enlightenment and court politics, happy to support her leader Tilaka in her more ambitious endeavors. She was valued for her loyalty but it was truly more a general apathy that drove her to do what was asked of her. Things changed dramatically in 1177 when she stumbled, frankly completely by happenstance, on an [akuma|E] plot to seize a Zhong Lung (the dragon shapeshifters) nest of power.\n\nWith her [Glossary('Wu','podgloss.wu')] at her side, she charged into battle and saved the dragon changer named Nongkhai in the process, suddenly earning herself fame and accolades she was dearly not prepared for.\nThis sudden change has flared Bhadra's own sense of self and ambition and she is now (not very subtly) contesting Tilaka's leadership of the Golden Shroud. The serious gap in age and power means that Bhadra won't make any daring moves anytime soon but she has finally started to play the court politics game and found that she liked it.\n\nFuture fate\nWhen Tilaka's head roll to the floor after her challenge against Piyau, Bhadra will wisely swear allegiance to the Golden Courts.\nBecoming one of the first Golden Queens, she will however quickly end up biting more than she could chew when threatening another Golden Queen, Mawar, territory.\nHer ultimate fate will be to be thrown into a fleshpit, becoming the first prominent victim of the Golden Courts' constant state of low intensity civil war."
 POD_persistentpodlore.desc.793461: "此角色由PoD开发者创作，旨在丰富设定背景，非[world_of_darkness|E]官方角色。\n\n天生残疾的康蒂曾受家族照料，直到冷酷的兄长继承家业后将她遗弃等死。\n堕入[UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]固然令人震骇，但发现这个灵界竟能让她首度独立生存时，她咬牙坚持直至寻得生机。\n\n以[kuei_jin|E]之身归来加入朱雀皇朝的经历彻底改变了她。康蒂狂热拥抱这个尚阳皇朝的鲜活生活方式，永不厌倦地补偿生前错失的一切。纵使年高德劭且历任多部大臣，许多人仍视她为浮躁门徒。\n为助其凝神定心，吴哥宫廷将康蒂调至黄金屏障[Glossary('Wu','podgloss.wu')]。如同对待所有新鲜事物，她一头扎进新职责，在黄金屏障取得的多项外交军事成就中功不可没。然而她的[Glossary('Dharmic','podgloss.dharma')]启蒙始终滞涩难彰，吴哥宫廷渐失耐心，更有人警告她正滑向[Glossary('Yama King','podgloss.yamaking')]的诱惑。\n\n未来命运\n这些担忧终将落空——比永的崛起将为康蒂开辟新途。得知炽血花[Glossary('Dharma','podgloss.dharma')]存在后，她第一时间投身其中。\n在比永门徒马瓦尔指导下，康蒂不仅于炽血花的极致之道如鱼得水，更藉此叩开通悟之门。\n从马瓦尔的区域执政官晋升为独掌金冠的黄金女皇后，她将成为中华朝廷论及（惊惧交加地描述）黄金皇朝极端作风时的典型例证。\n\n康蒂对此毫不在意，终将稳步登临[Glossary('Hundred Clouds','podgloss.hundredclouds')]。"
 POD_persistentpodlore.desc.793462: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nEven from his mortal life, overlooking the Pacific on the Chinese coast, Shenyou always wondered what lay on the other side. And even after his Second Breath, he can't help but yet wonder.\n\nShenyou was a sailor in mortal life, even born on a ship. Between navigating early routes to the Philippines, passages to Japan and Vietnam, and other smaller islands around the South China Sea, the open sea always called to him, even when it killed him in a storm.\nBut the Hell of Boiling Seas wasn't the worst fate for him, as he could understand the passages the ships took. Through clinging to the hull of a ship of passing Hungry Dead, he found his escape, and was brought into the fold.\nAnd with his knowledge of sailing, he was immediately plucked by Hao for his skill and wisdom. Keeping him close, Shenyou's wisdom was immediately put to use keeping contact with the collapsing Scarlet Phoenix Court, open to taking in skilled refugees fleeing the chaos.\nWith that, Shenyou became invaluable, taking choice picks from Southeast Asia and Nusantara to elevate Hao's Court further.\n\nFuture Fate\nShenyou would eagerly go along with Hao in his eventual masterminding of the Great Leap Outward. He would eagerly go across the Pacific, and try to establish a Court in Mazatlán. However, several foolish assaults against the Sabbat led to his court's destruction, and he returned to the Quincunx in shame, and submitted himself to judgment before the Eye of Heaven for his failure."
 POD_persistentpodlore.desc.793463: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile the Courts of the Yellow Emperor have long fallen into the hands of sycophants and bootlickers, not all suffer from the ailments of a rule long burdened by too dull a rule. Jingxinan is one such spared. And the one who brought it into line was once a meek nobody slain by war and reduced to nothing, who vowed never to be weak again.\n\nChujun was one of thousands slain in the Mongolian advance across China. That is most of what Chujun remembers, but also how in his mortal life he was weak.\nThe Hell of Being Skinned Alive changed him to his core. The fleecing sands enlightened him, showing him how even the smallest grains could render a demon to mist in minutes if guided properly. And those were the principles that guided Chujun to his escape.\n\nImmediately upon entering Hao Wei Liang's Court, Chujun dedicated himself to studying the works of Sun Li, wanting to make himself great and deny himself weakness ever again. Selected as Hao's personal enforcer, he was wildly successful in that path. And as a chaotic age draws closer, his path remains unchanged.\n\nFuture Fate\nChujun would prosper and flourish under Hao, and through their expansions in the Great Leap Outward, Chujun would write his own works and treatises on fighting [cainite|E]s.\nHowever, his own boldness would spell his doom, when he would boldly try to lead an expeditionary force to take over Lima from the native Karai Pyhare. The Drowned Legacies defied him and decimated his armies, and when he returned to the Quincunx to beg for reinforcements, he was met with a collapsing institution, and his own Court was in chaos under the usurpation of the Heaven and Hell Legion.\n\nAnd so the man who once vowed never to be weak again met his end blubbering and begging before having his last breath sucked out from his lungs by Shufen, and his swiftly decaying remains thrown into the ocean."
 POD_persistentpodlore.desc.793464: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nTo most of the older ancestors of the Yellow Emperor Court, the threat of [akuma|E] is that of a distant one, the struggles of the Black Tortoise and Scarlet Phoenix Courts. Simply, they are too distant and the virtues of the Fivefold Way protects them, so they rest on their laurels.\n\nLingyuan cannot rest on that.\n\nLingyuan's mortal life is a haze to her, knowing that in life she was a cook in a restaurant, and she had died in a fire of some kind.\nBut in the Hell of Upside Down Sinners, she saw flashes of wickedness, a looming darkness, and armies of devils marching beneath a one eyed sovereign. Her escape was not a thing of personal freedom, but of a desire to save the world from this threat.\n\nHer drive and will to do so earned her an easy place among the more competent courts of Jingxinan, where she has dedicated herself to focusing on finding these hidden devils.\n\nFuture Fate\nLingyuan would come to see this one eyed devil as Zao-Lat, known in the West as Saulot, and would dedicate herself to purging [cainite|E]s as part of the Great Leap Outward. But following the fall of Hao from favor, her own station would be systematically shredded by the Ancestors of the Heaven and Hell Legion, and after a failed assassination on Lin Xiao, she was brought before the Legion's conqueror, Ma Hai-Lan.\n\nAnd in her final moments before death, she could only laugh as she saw the one eyed devil's gaze as she met judgment."
 POD_persistentpodlore.desc.793465: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe strangest member of Hao Wei Liang's Court, the fact that he has a [Glossary('Penangallan','podgloss.penangallan')] among them is a shock. But the errant student of the exiled ancestor Thitkwa has found a critical place in Hao's court.\n\nHayati was born in Malaysia, a weaver of no renown or notice, at least not until her death, where her life of mediocrity condemned her to the Hell of No Money. Disoriented and horrified that this would be a reason to face damnation, Hayati did all she could to try and make sense of things, the only thing that could eventually make sense was the acquisition of wealth.\nSo, she hoarded what she could in the desolate expanse, and was finally able to bribe her way to the Second Breath. And from that experience, she became remarkably skilled at managing money, as she poured over every coin.\nAnd while she was initially tutored by the [Glossary('Penangallan','podgloss.penangallan')] Thitkwa, Hayati was a weird student, far more focused on money and stability rather than sex and violence, but with the same wild zeal that would would expect of them.\n\nSent to deal with envoys to Jingxinan, Hayati found that Hao Wei Liang was a far more capable ancestor, so she simply never left. She would become critical in helping him with translations and navigating the politics of Southeast Asia, and her insight was invaluable in avoiding the normal arrogance that plagued their relations.\n\nFuture Fate\nEventually, Hayati would be the main link that the Quincunx would have with understanding the Golden Courts. And when Hao would commandeer the Great Leap Outward, Hayati would be their main thread guiding them to Australia.\nHowever, their growing conflict with the more inward focused Heaven and Hell Legion would spell her eventual doom, as she would be accused of consorting with the Golden Courts, and her eventual condemnation would set the chain of dominoes that would lead to the failure of the Great Leap Outward and the disaster of the Century Rebellion."
 POD_persistentpodlore.desc.793466: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile the courts of Jingxinan are less overly focused on Court Culture, they still prize themselves on proper Court building and politicking. But yet, there are times they must send someone for a difficult negotiation with other Courts. And Xiao'e threads that line masterfully.\n\nAn actress in life, Xiao'e always had a knack for understanding people. Opening doors and clearing paths for their success was always something she was good at.\nHer charm helped her escape the Hell of Salt and Iron, and her drive made her an easy foundational member of the Leaping Gibbons, especially as Hao's first disciple. And as there are whispers of a coming massive change, her services will be needed now more than ever.\n\nFuture Fate\nXiao'e would see the collapse of the August Courts, and through her influence, cement herself and Hao as foundational members of the Quincunx.\n\nPutting forth what would become the Great Leap Outward, Xiao'e was critical in their success. However, her focus on the abroad made her an enemy of many, and as soon as it was clear she was the one opening doors, she met a grisly end one night as the Demon Bull of the Heaven and Hell Legion greeted her, hammer in hand."
 POD_persistentpodlore.desc.793467: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile few Hungry Dead leave the Hell of Being Flayed Alive with a love for the lords of the [UmbraGlossaryLocalized('yomi_wan','Yomi Hells')], Xiaowan stands among even them for her hatred. Her haven lined with the bodies of flayed sinners and devils, strewn with the gore and sinew of the wicked, while she waits at the center, meditating on the wickedness that has yet to come.\n\nXiaowan is one of Hon Li's first disciples, and by far his most competent and loyal one. Even her memories of mortality were flayed away by the sands of the Thousand Hells, and all that burned in her was an unyielding hatred for devils, a desire to see them bleed, and the strength of will to face even the [Glossary('Demon Emperor','podgloss.demonemperor')] with teeth bared and sword in hand.\n\nShe pays no heed to the word of ancestors or lords, instead gathering her screens and disciples in her own wars, her own bloody purges against the rot that is worming its way into the Courts.\nShe has nothing, so she will deny the [Glossary('Yama Kings','podgloss.yamaking')] everything, just as they did to her. A simple, brutal, and straightforward path for her to follow. Really, the only one she has left.\n\nFuture Fate\nXiaowan would for a time slay many [akuma|E], but with the formation of the Quincunx, eventually her brazen acts of violence would grow too bold and too destructive for the Quincunx to tolerate.\nWhile the first couple of [Glossary('Wu','podgloss.wu')] dispatched met violent ends, the veteran of the Anda War and former Ogre of the Warriors of the Hebei Plains Mapo ended her heresy once and for all."
 POD_persistentpodlore.desc.793468: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIn order to keep the Three Mountains Village experiment going properly, there needs to be some threat behind the laws instituted by Wang Ping. A damnation all too present that they should fear. A reason to seek a peaceful if dull life.\n\nYouqiu is more than eager to be that devil.\n\nYouqiu was a native of the village, albeit one who routinely took to banditry and horrible acts of violence. Even in his advanced age and size, he was quite eager to command his sons in the plunder of the small places abound, and he lived a long and violent life from it, at least until one night a girl came back from the dead and splayed him open.\n\nCondemned to the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] of Lanka, he found himself in his element, the detriments of age and his cruelty not abated. He devoured numerous Rakshasa and took several as brides, until one night one Ravana finally had enough of him and banished him back to the world of living, where a former victim and now master, his killer, broke him into line.\nWhat exactly she did to him is unknown, but he definitely came out worse. He became her iron gauntlet, the engine of terror and fear for those who resisted their reforms. And with the children and lives of men who resist and the bodies and eyes of women who defy, he couldn't be happier and more content.\n\nFuture Fate\nYouqiu would become quite effective in his role, perhaps too much so.\nEventually the village forgot its monsters as they obeyed, and following Wang Ping's absence, the other caretakers saw no more reason to tolerate a monster so close on the dance to damnation. And so, he was trapped in a bronze tea basin, and the villagers rested easy as his last screams lulled them to sleep one forgettable night."
 POD_persistentpodlore.desc.793469: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile doctors are meant to heal rather than hurt, following his death, Zongmin is adamant he is still following that principle. Rather, now he understands that healing the wicked will hurt more than heal, so it is the obligation of the doctor, when put before them, to heal the world by cutting the infection of their evil then and there.\n\nZongmin, from his mortal life, was a doctor, condemned to hell in death for sparing a serial killer and healing them.\nWithin the Hell of Upside Down Sinners, that truth was beaten into him, both metaphorically and literally, as he was whipped and flayed with a whip made of the teeth of the serial killer's victims. Finally, he accepted the truth, and was liberated from Hell in that moment, released without really any affair.\n\nZongmin, taking the revelation internally, was rather unhinged in his early nights, and sent to the Ancestor Hon Li for his education.\nZongmin, disgusted by the inaction of the courts, took his word quite well, and would become one of his ardent and zealous disciples. He chose to obey the Searing Winds by eating the souls of killer, and using their energy to heal the virtuous sick. Balancing the books, so to say.\n\nHe has much work to do."
 POD_persistentpodlore.desc.793470: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOne of the most enigmatic disciples of Hon Li, Yushi has no words in following his mentor's path. From writing, he has said he is from the Hell of Salt and Iron, and knows little before that. But from the things he learned in there, he cannot tolerate the presence of the Courts for something they had done.\n\nHon Li was not one to look a gift horse in the face. Yushi's mute condition became something fear inducing among his disciples, as the silent menace that was always eager to act on behalf of Hon Li's orders, while being a radically devout adherent of his path.\nYushi would come to specialize in assassinating fallen members of the Courts, something that brings no end of fury from the mainline Courts, but one they have been distracted from with the growing threat of the [Glossary('Anda','podgloss.anda')].\nNot one to sit and let be, Yushi has since begun hunting the hedonistic lunatics from the growing threat coming from the Scarlet Phoenix Court. Whether or not he will make headway is yet to be seen..."
 POD_persistentpodlore.desc.793471: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nOne of the youngest but most fanatic disciples of Hon Li, Aiqin was rather unique among the Hungry Dead, as her own Hell was the wider tapestry of the Thousand Hells themselves, rather than an individual one. Chained to the Wandering Overlord, he reshaped her memory into that of an oracle. And there she would have remained, had she not foresaw a break in her chains, and then exploited it to escape.\nAnd of all the mentors that could have found her, it was Hon Li who brought her into the Night World properly.\n\nAiqin however has retained her oracular ability, where she has constant flashes of shadows with bloody mouths and raised knives, and beyond them a charred throne from which a charcoaled blood god stood.\nAiqin is adamant that the nightmarish figure could be the [Glossary('Demon Emperor','podgloss.demonemperor')], and is insistent that they must be ready to oppose them.\nTo that end, Hon Li lets Aiqin be the eyes of their sect, watching for these devils. And as she begins to find more and more information on the enigmatic vampire assassins, her fears are becoming more and more realized.\n\nFuture Fate\nAiqin would eventually be the main force that would lead Hon Li's sect into modern day Afghanistan, and her visions would be further given weight by the return of Ur-Shulgi.\nAs the Sixth Age draws nearer, the Searing Winds may have found one of the possible [Glossary('Demon Emperors','podgloss.demonemperor')].\nBut will they be ready? Aiqin doesn't know, as all her visions end before the battle."
 POD_persistentpodlore.desc.793472: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nUmikana doesn't remember much about her past. In fact, she doesn't really know what she has become. She has faint memories of dying, a terrible place then coming back and becoming a barely sentient monster. She doesn't know how long she stayed in that state but she fears it might have been decades, if not more, before her mind (barely) put itself back together.\n\nHer first tangible memory after that sorry state is seeing a shrine to Amamikyu and the noro priestesses praying there. She has an inkling that it might have been her salvation, perhaps unlocking a core memory of her past that allowed her to heal herself a little.\n\nWhatever the case might be, Umikana has been slowly learning of her new condition since then. She has also encountered others like her but most were lost and were mindless monsters like she was. She still doesn't know if she should put them out of their misery before they harm others or leave them a chance to save themselves, like she did.\nSo far, she has been too preoccupied with her own state of mind to act but as her understanding grows, so does the responsibility she feels to safeguard Ryukyu.\n\nFuture fate\nWith the coming of the Chinese and later on the Japanese, Umikana will learn what she is. Tensions with the arrogant outsiders will run rampant until she will self proclaim herself Ancestor of Ryukyu to spurn them.\nWhile her diligent efforts to keep her island independent by playing the Courts against each other will be enough for a time, there will come a point where the Japanese Bishamon will simply have enough of \"Okinawa's disrespect\"..."
 POD_persistentpodlore.desc.793473: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nSuryawati is considered the oldest [kuei_jin|E] of the Maluku islands though, truth be told, she knows that this history was written by the victors. She was barely out of hell when the Scarlet Phoenix Court made first contact with the islands, found the ruling male [kuei_jin|E] \"wanting\", put them to the sword and then started \"civilizing\" the survivors in the proper [Glossary('Dharma','podgloss.dharma')], including her.\nSuryawati was frankly a mediocre (if cheerful) student but she was a native woman that wasn't resisting the Scarlet Phoenix which was enough for them to appoint her Ancestor of the islands, go back to their ships and promptly forget about the Maluku again.\n\nSuryawati put her seat of power in Nusa Isa (the \"Mother Island\") to garner what little prestige she could and started her somewhat pathetic (and unwanted) rule over the very limited number of [kuei_jin|E] of her \"domain\". It is thus of little surprise that she became an indolent ruler that most don't even pay lip service to.\n\nWhile some of the younger generation are talking of much needed change, especially with the Scarlet Phoenix Court in too much of a disarray to intervene, the real threat lies more in the growing presence of [akuma|E] that use this lax rule to prosper.\n\nFuture fate\nSuryawati will weather the coming storm of the foundation of the Golden Courts by basically being irrelevant. Losing what little temporal power she had left to a new generation of rulers, she will become something of a well liked oddity of the islands, a benign and likable elder with many colorful stories to tell."
 POD_persistentpodlore.desc.793474: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThe loving wife of a fisherman, Dara threw herself into the sea when she knew her beloved wouldn't come back after a terrible storm. Finding herself in the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] of Hine-Nui-Te-Po for those who died by suicide in the Pacific, she was enraged to see that her act of love was turned against her. While the Hell expected her to wallow in self-loathing, she instead fought back at every turn, eventually breaking through to go back to the world once more as a [kuei_jin|E].\n\nDara found the organization (or lack thereof) of the Maluku Court to be annoying at best, worrying at worst. Her pleas for restructuring and decisive action against the growing [akuma|E] threat fell on deaf ears and her patience is running short.\n\nFuture fate\nDara will be the one to point Piyau towards the Maluku at the end of her purge. Thrilled to see such clear victories for once, Dara will embrace the Passion Bloodflowers and become the Golden Queen of Ternate after the rise of this regional power.\nHer relations with the other Courts will be tense however as Dara won't enforce matriarchy as ruthlessly as the other Queens, some say because of her memories of her mortal life. This reputation will however lead her to attract refugees from the other Courts and even enjoy relatively stable relationships with the incoming [ashirra|E] and, later on, the [cainite|E]s of Australia.\n\nIt was thus little surprise when Dara opposed the Great Leap Outward's attack on Australia. She will become a thorn on the side of Seok Kwan Sook, the leader of the invasion, and the situation will \"stabilize\" into a Cold War between the two powerful Queens."
 POD_persistentpodlore.desc.793475: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nHaving never known her family, Suryani fended for herself until she couldn't and starved to death alone and forgotten. Plunged into the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] of Malaveyovo, what she saw there changed her to her core. While she never speaks of what exactly happened, it is clear that this is the catalyst behind her drive to hunt down [akuma|E].\n\nAs a [kuei_jin|E], Suryani found an attentive friend in Dara, a woman who shares her passion for justice, though sometimes shies away from some of the more extreme solutions she offers. Suryani doesn't blame her however, after all, Dara didn't know what she saw.\nNone of them did.\nUnbeknownst to even her friend, Suryani is now planning to remove \"Ancestor\" Suryawati from power, by force if necessary. The times for compromises are over, if they ever existed.\n\nFuture fate\nSuryani won't have time to launch her plan as Piyau's purge will basically accomplish what she wanted. The formation of the Golden Court of Ternate under Dara will however cause a rift between the two women.\nSuryani will become more extreme and berate Dara for her laxity until a boiling point is reached when the Dutch and their [cainite|E]s supporters arrive.\n\nAccusing them of being in league with Malaveyovo and the reason being his sudden resurgence, Suryani will go rogue and conduct her own attacks against them.\nThe Great Leap Outward's attack on Australia will see her lead the Razor Blossom [Glossary('Wu','podgloss.wu')] during the first battles.\nThe signing of the truce of Sydney and the state of Cold War resulting of it will see Suryani once again go rogue and her [Glossary('Wu','podgloss.wu')] will become a very dangerous loose canon in the tense political arena of Australia."
 POD_persistentpodlore.desc.793476: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nAs the [Glossary('Yama King','podgloss.yamaking')] of those who partook in cannibalism or died from hunger, Malaveyovo often has some especially wretched souls coming to his [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]. Anangga was one of them.\n\nThe man himself doesn't know where his taste for human flesh truly came from. He just knows he enjoyed it, and enjoys it that much more since entering Malaveyovo's service. While he is far from the most powerful [akuma|E] in his lord's service (even he doesn't dare coming cloe to the corrupted shark shapeshifters lurking around his master), he fancies himself a creative mind. While he wasn't an especially sexist man in life (everyone can taste good when properly prepared anyway), he has seen the rise of the matriarchal Scarlet Phoenix Court and its even more extreme offshots as an opportunity.\nPerhaps these wronged women would like to truly taste their victory over the wretched men.\nPerhaps they will even enjoy the experience.\nIf they do... well, he would be happy to bond with them over some recipes and then present them to his lord.\n\nWhat a feast it will be!"
 POD_persistentpodlore.desc.793477: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nDashi isn't the most skilled, charismatic or powerful [Glossary('Anda','podgloss.anda')] there is, leaving many to wonder why he has been chosen for the prestigious role of Eastern Vanguard of the horde instead of more famous vampires like the Black Winds. For his part, Dashi knows full well the reason. It's because he is expendable.\n\nDespite having been neighbors for a long while, the [Glossary('Anda','podgloss.anda')] know alarmingly little about the [kuei_jin|E] with their few encounters having ended in costly defeats.\nWith the rise of Genghis Khan and their mortal Mongol brethren now storming China, times are changing and opportunities are arising.\n\nDashi knows what is expected of him, learn as much as he can about the undead of China, probe their defenses and give the signal to launch the invasion when the time comes... if he still alive by that point. He has been given ample leeway to select the members of the vanguard among the other young, promising (and expendable) members of the [Glossary('Anda','podgloss.anda')]. He has taken full advantage of this and created a skilled group that is now slowly learning more about the [kuei_jin|E].\nToo slowly for some of the more impatient elders but Dashi knows that it's his head on the line, not theirs. So he will be meticulous, patient and only push for action if some cataclysmic event were to happen to this apparently invincible \"Yellow Emperor Court\" of the Chinese undead..."
 POD_persistentpodlore.desc.793478: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhen Dashi started assembling his Eastern Vanguard, his blood brother Ketuyu was an obvious choice. The two, while very different in demeanor, always worked well together. Dashi is a more somber and withdrawn individual and it is thus the cheerful Ketuyu that is the face of the Vanguard to many. He is even the face of the [Glossary('Anda','podgloss.anda')] as a whole for the [kuei_jin|E].\n\nIndeed, Ketuyu's diplomatic skills have been used to placate the [kuei_jin|E] Courts into a false sense of security. The crafty [Glossary('Anda','podgloss.anda')] is happy to debase himself in front of his so called betters to lull them into ignoring the growing threat at theirs borders. He has even been so successful in that endeavor that his tributes have become a mark of prestige among many Courts, all too eager to see barbaric foreigners kneeling to their superiority with fancy and exotic trinkets in hands.\nAnd while they snicker and degrade him at every turn, Ketuyu learns more and more about how they think, operate and more importantly of all, their weaknesses.\n\nLike his blood brother, Ketuyu is patient and takes every insult with a smile. Dashi knows that his sibling doesn't forget nor forgive however.\nIf one night, the [Glossary('Anda','podgloss.anda')] were to ride on China, the [kuei_jin|E] who slighted him might find themselves finally noticing the cruel and almost unhinged undertone carefully hidden behind Ketuyu's pleasant smile..."
 POD_persistentpodlore.desc.793479: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\n [Embrace|E]d outside of Yesira's lineage, Saige faced the disapproval of the traditionalist [Glossary('Anda','podgloss.anda')] from the start of her undead existence. Barely accounted for by her [Sire|E] who [Embrace|E]d her as an afterthought, Saige fled to the South as soon as she was able, looking for freedom and recognition of her skills.\nShe soon learned to hate the Chinese [kuei_jin|E] much more than she ever did her [Glossary('Anda','podgloss.anda')] brethren.\n\nParaded as an exotic (and unruly) animal in the \"enlightened\" [kuei_jin|E] Courts, she went from humiliation to humiliation until she escaped once again. She returned to the [Glossary('Anda','podgloss.anda')] just in time for Dashi to see in her an useful asset for the Eastern Vanguard as her knowledge (and hatred) of the [kuei_jin|E] had few rivals among the younger members of the horde. Given more credit and respect than she ever got since becoming a vampire, Saige gladly accepted, the prospect of bloody revenge being a sweet bonus as well.\n\nWhile Saige's knowledge has already proven useful to the horde, she still resents them and chooses to disguise as a man when dealing with [Glossary('Anda','podgloss.anda')] outside of the Eastern Vanguard. She luckily has little to no contact with them, being happy to let Dashi and the others handle them in her stead.\n\nAs the years drag on and the awaited invasion still hasn't started, Saige is losing patience. It is only the prospect of being recognized by the Black Winds, or Yesira herself, that keeps her in line.\nIf she has to climb atop a mountain of [kuei_jin|E] skulls to get there, all the better."
 POD_persistentpodlore.desc.793480: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhen given the difficult task of leading the Eastern Vanguard of the [Glossary('Anda','podgloss.anda')], Dashi knew what he had to do and, thanks to the leeway given to him because of the task at hand, he could even get away with it. To understand the Chinese [kuei_jin|E], he needed a Chinese man to use as a spy.\nIt took him months to locate a prospective candidate, a fairly minor bandit, and approach him with the offer of immortality. Dashi needed his future spy completely loyal and thus didn't withdraw any information.\nDeyi accepted and thus the first Chinese [Glossary('Anda','podgloss.anda')] was born.\n\nAfter some time to get acclimated, the former bandit was sent to a [kuei_jin|E] minor court to play the part of a clueless soul recently returned from hell. While Deyi wasn't the most convincing liar at first, the sheer impossibility of a Chinese [cainite|E] was enough to lend his story the air of truth. And thus started his formal \"education\", learning about the [Glossary('Dharmas','podgloss.dharma')], the Five August Courts, the [Glossary('Yama Kings','podgloss.yamakings')] and much more.\n\nDeyi knew better than to push his luck and when the time came to assign him a proper mentor, he fled and returned to the [Glossary('Anda','podgloss.anda')]. Since then, he has infiltrated two other courts and perfected his acting skills.\nAs his mastery grows so does his ambition however. While Dashi is staying evasive, Deyi now understands that he will never be truly accepted into the [Glossary('Anda','podgloss.anda')], nor the [kuei_jin|E] for that matter.\n\nHe is thus pondering his options, knowing full well that they are quite limited at the moment."
 POD_persistentpodlore.desc.793481: "This character is part of the [world_of_darkness|E] but only has a very limited backstory. As such it was expanded upon by PoD Developers to add greater depth to the setting.\n\nSeok Kwan Sook was always an ambitious woman, dreaming of accomplishing spectaculars feats when she was young. Sadly, the norms of the day and her poor background meant that only a marriage to a struggling merchant could help her elevate herself. Sadder still, dying in childbirth cut her ambitions even shorter.\n\nStranded in a [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] that forced her to relieve the trauma of her death over and over again, Seok choose to fight and managed to escape. The return as a [kuei_jin|E] and her first experiences with the Courts were exhilarating moments as her gender wasn't a problem anymore and it seemed like with proper studies and diligence, she could finally accomplish anything.\nNow almost a century later, Seok's honeymoon phase with her new condition is long gone and she understands that the rise to the top in an immortal society can take literally forever. She is now eyeing the weakening of the Azure Dragon Court for opportunities to find some kind of shortcut.\n\nFuture fate\nSeok will thrive for a while in the chaotic turning of the age but will have to step down during the formation of the Green Courts.\nLearning of the formation of the violent and fractured Golden Courts in Southeast Asia, she will join the fray and carve her own fief here.\nThe others [Glossary('Penangallan','podgloss.penangallan')] will respect her skill but demand that she become one of them before being accepted.\nShe will do so and become a respected queen in her own right with strong contacts with Korea.\n\nThis position will culminate in her being chosen to lead the Courts attack on Australia. She will achieve strong early successes by dividing and conquering the [cainite|E]s there though the situation will remain unresolved for a long while."
 POD_persistentpodlore.desc.793482: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nGwang Hwa was barely a young man when general Ajagae passed through his town to recruit locals. Inspired by the man's charisma, poor background and apparent will to help the people, Gwang Hwa joined on the spot.\nSuch trepidation did him little good when he took an arrow to the face during his first battle.\n\nIn the chaotic [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] of Lanka, Gwang Hwa witnesses and took part in more warfare than he ever wanted for several lifetimes and every single one of those battles was in vain. He was finally thrown away when his spirit was completely spent and thus useless to the warring demons.\n\nAs a [kuei_jin|E], Gwang Hwa rebuilt himself and found solace in the strict rulings that policed the Courts. The fact that general Ajagae became barely an historical footnote also finished extinguishing his remaining youthful vigor. Gwang Hwa became a well behaved student, then a respected member of the traditionalists that accepted the Chinese Yellow Emperor Court's meddling in Korea's affairs.\n\nGwang Hwa is tired of conflict and strife but he is no fool. Emperor Xiao's grip on power is shaky at best and the current troubled times could create major issues for Korea. He has thus recently started to shift his stance to a more central position, trying to act as a mediator between the various factions.\n\nFuture fate\nGwang Hwa will prove to be pivotal in the orderly change from the Azure Dragon Court to the Green Courts. Acting as a voice of reason and lacking the will to seize power for himself, he will help in the peaceful reorganization before becoming a respected regional Ancestor.\nHis lack of will to take direct action and overall conciliating attitude will however play a strong part in the Green Courts' reputation as a safe haven for many unsavory characters."
 POD_persistentpodlore.desc.793483: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nSelected to be one of the Wonhwa, the warrior women of 6th century Korea, Ji So took her role with pride becoming skilled with both bow and sword. The dissolution of the group in shame before it even saw a battlefield was a blow to her, and she choose to become a wandering warrior to help the people.\nShe soon learned that it worked better in the stories, as her skill was no match for superior bandit numbers and she suffered a grisly death.\n\nThe Hell of Being Skinned Alive wasn't kind to Ji So. She found her martial skills lacking to defeat the many demons and had to resort to underhanded tactics to escape. She keeps the troubling intuition that she could have been let go instead on the back of her mind.\n\nAs a [kuei_jin|E], Ji So naturally gravitated towards the Devil Tigers and honed her skills once more though the lack of [akuma|E] threat in Korea meant it once again stayed mainly theoretical. As centuries passed, her reputation grew and she got the honor of being chosen as the Azure Dragon Emperor bodyguard. While certainly humbled by the offer, Ji So couldn't shake the feeling that it meant that she was relegated to becoming a ceremonial warrior once again.\nAs the Azure Dragon Court is weakening and tensions with both Chinese and Japanese Courts are rising, Ji So secretly hopes that it will finally be time for her to prove her skills on an battlefield.\n\nFuture fate\nThe peaceful transition towards the Green Courts will foil Ji So once again. While many Ancestors will request her services, she will refuse every offer and leave the political scene.\nLegends will say that she gone back to the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] to fight against [Glossary('Tou Mu','podgloss.toumu')]. Other, more shrouded rumors, speak of having seeing her alongside the forces of the Iron Empress instead..."
 POD_persistentpodlore.desc.793484: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nBorn during the time of the \"Protectorate General to Pacify the East\" that the Chinese Tang imposed over Korea, Bo Hui came to see their presence as a showcase of the intricacies of strength and weakness. While she didn't participate directly, she listened attentively to the political news of the day and came to her own conclusions. Her death, result of her \"meddling\" being caught by the authorities, only strengthened her newfound beliefs.\n\nBo Hui doesn't talk about what she had to do to escape the Pit of Salt and Iron but it is clear that she takes no pride in it. Instead, she jumped headfirst into [kuei_jin|E] politics, some say at the expense of her personal enlightenment, and played the game as soon as she was able.\nThe situation with the Azure Dragon Court being dominated by Chinese interests reminds her of her mortal life and, while she has no real deeply seated convictions about the Korean Courts' independence, she choose to bet on this horse and became the head of the opposition faction.\nWhile her successes in this position have been few and far between, the current political climate seems poised to give her new opportunities as the Courts show their first signs of weaknesses.\n\nFuture fate\nBo Hui will be seen as the \"winner\" of the transition towards the Green Courts. As the leader of the Korean faction, she will achieve peaceful independence from China and cut ties with Japan.\nThe truth is that she could have pushed for much more but the prospect of ruling as a \"Green Empress\" held little appeal to her. The divided Green Courts becoming a neutral crossroads weakly \"ruled\" by a council of Ancestors suited her much more.\n\nThere is no fun in playing the game if you already won after all."
 POD_persistentpodlore.desc.793485: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nYeong Chang, thanks to his background as the one handling monetary concerns for a respected [kuei_jin|E], always knew that Hell was very real. Even his vivid imagination wasn't enough to prepare him for it however.\n\nMade an example of by a rival of his master, Yeong found himself in the Hell of Being Skinned Alive and the horrors he endured there broke him. Promising that he would do anything to be freed, the demons let him go with a warning that they will come to collect at one point or another.\n\nAs a [kuei_jin|E], Yeong is motivated by his fear of going back to [UmbraGlossaryLocalized('yomi_wan','Yomi')] and he thus started using his keen sense for financial opportunities to make allies, earn favors and overall make himself as useful as possible to avoid making enemies. He is currently investing in the emerging ritual Jade market, something that could open him new clients outside of Korea.\n\nFuture fate\nYeong will thrive in the coming Green Courts, even playing his part in naming them as his ritual Jade market will take off beyond his wildest dreams.\nSurprisingly to many, Yeong won't really become rich thanks to his trade since his prices are always below what could be expected. For his part, the \"Jade father\" will laugh these concerns off and say he is only looking for new friends and not new clients.\n\nEverytime someone new enters his domain however, one can see Yeong startled for a moment, as if dreadfully waiting for an unannounced customer..."
 POD_persistentpodlore.desc.793486: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nRuhui is a man who knows his worth. Though some would say that his mortal life as the youngest son of a gentry clan gave him an inflated vision of it.\n\nAs a [kuei_jin|E], Ruhui wanted the quickest path to relevance and thus his annoyed mentor pointed him to the Devil Toppling Society, the group of young immortals meant to keep in check crumbling Courts (or hasten said crumbling in some cases).\nRelishing in this opportunity, Ruhui set his sights on Northern Korea where the authority of the Azure Dragon Court was weakened due to the unrest in P'yong'yang, Ruhui led a band of other malcontents and carved his own fief in the area.\nWhile this could have been seen as an act of war between the Chinese Yellow Emperor Court and the Korean Azure Dragon Court, the fact that Ruhui acted under the banner of the Devil Toppling Society gave him political immunity and his takeover became fait accompli.\n\nRuhui is now marshaling his forces to march on P'yong'yang itself as its new Ancestor is also considered an upstart and unlikely to receive help from the major Courts.\n\nAfter that... well, if the entire Azure Dragon Court needs toppling to give way to a new age, Ruhui is ready to be the man ushering it. And ending on top.\n\nFuture fate\nDuring the creation of the Green Courts, Ruhui will try to make the situation descend into chaos. He will one night receive a warning to not do so by the being known as Shadow Puppet.\nAfter ignoring it and on the night preceding his call to arms, Ruhui's ashes will be found spread over the warning letter."
 POD_persistentpodlore.desc.793487: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nA long time ago, Tokiko had the dubious honor of being one of the first souls imprisoned by a young and ambitious [Glossary('Yama King','podgloss.yamaking')], [Glossary('Mikaboshi','podgloss.mikaboshi')]. The demon, in a way, was much more open about his goals in these formative years and Tokiko saw it all, the soulless grind of a maddening society that would twist humanity to become no more than tools in his hands. She swore to fight it with all her being and never wavered in this promise still.\n\nAs a [kuei_jin|E], Tokiko progressed quickly, becoming a respected Bishamon Ancestor and even the Japanese representative to the Azure Dragon Court several times. Her diligence at hunting down [akuma|E] was highly praised and she took to the field herself many times. Many demon hunters of the Bishamon still use her tactics, though none would admit it openly nowadays.\n\nDespite these victories, Tokiko saw signs of [Glossary('Mikaboshi','podgloss.mikaboshi')]'s rise everywhere. The growing cities, the new inventions and philosophies invented by humanity were insidious tools of the enemy to her. When she uncovered that [Glossary('Mikaboshi','podgloss.mikaboshi')] had ensnared a powerful group of strange creatures to his bidding, she alerted the entire courts and rallied every ally she could.\n\nIt ended in a wild goose chase, these creatures were slippery and besides the name \"Kagaseo\", Tokiko had nothing to show for her work.\nShe didn't stop however, and soon isolated herself in what others thought were a growing paranoid madness. It was when she finally confirmed the existence of the \"Great Clan\" but could not confront them on her own that she took the most critical decision of her life.\n\nThe next night, Tokiko entered [Glossary('Kakuri','podgloss.kakuri')] and was received with respect and honors by [Glossary('Emma-o','podgloss.emmao')] himself.\n\nThis night, the \"Daimyo of the Dark\" gained his most fanatic and devoted [Glossary('Shikome','podgloss.shikome')] and he didn't even have to lift a finger."
 POD_persistentpodlore.desc.793488: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nThere was once a time when the Judge of Balance, Yen-Lo, presided over the souls of the just and compassionate. His honorable conduct was seen as an affront by the other [Glossary('Yama Kings','podgloss.yamaking')] who lusted after the many souls they could corrupt in Yen-Lo's realm. Thus, lead by [Glossary('Emma-o','podgloss.emmao')], they invaded his territory and struck him down. But the triumph they expected was short lived, Yen-Lo had a dead man switch and they were hurled out of his realm that sealed itself for good.\n\nBarely escaping the ordeal, [Glossary('Emma-o','podgloss.emmao')] angered to have nothing to show for his victory when he noticed that, in the fleeting moment between Yen-Lo's death and the closing of this realm, some unfortunate souls drifted apart.\nTracking them down, he could only capture one, and it was the sweetest soul he has ever seen. Yen-Lo sheltered the kind and compassionate after all and true purity was a rare sight indeed.\n\nIsolating himself in the depths of Kyuken no Kakuri, [Glossary('Emma-o','podgloss.emmao')] only emerged when he was done, accompanied by the one he named Kiyoko, the first of his [Glossary('Shikome','podgloss.shikome')].\n\nSince then, every Shikome has been modeled after Kiyoko, quiet, emotionless and icily cunning. None of them truly surpass the one Emma-o considers his masterpiece however, most likely due to what he calls the \"source material\", that being the purity of the original soul.\n\nOne night, when he becomes the [Glossary('Demon Emperor','podgloss.demonemperor')], Emma-o knows that he will be able to remove Yen-Lo's seal and finally have the means to create an army of more powerful and perfected [Glossary('Shikome','podgloss.shikome')] to serve him for the eternal Sixth Age..."
 POD_persistentpodlore.desc.793489: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nWhile [Glossary('Kakuri','podgloss.kakuri')] is an hellish desolate landscape for most of the souls tortured there, this is not the case for people of Ainu descent. Even to this day, [Glossary('Emma-o','podgloss.emmao')] takes his role as the god of the Ainu dead seriously and they are thus treated with respect and care before being led to the underworld of their ancestors where the just and compassionate among them can look forward to a peaceful afterlife. Sometimes however, a soul resists this offer. Such was the case for Pirka.\n\nThis woman, feeling restless even in death, choose to wander the realm instead of accepting her reward. It didn't take her long to see that [Glossary('Emma-o','podgloss.emmao')], while respectful of her people, has grown mad and corrupt beyond reason regarding everything else. Protected by her immunity as an Ainu, she entered his domain and confronted him for answers.\n\nWhile surprised, [Glossary('Emma-o','podgloss.emmao')] showed patience, almost fatherly concern, and listened. And then he told her everything. The slow death of their people, the mad realities of the other [Glossary('Yama Kings','podgloss.yamaking')], the careless and unconcerned [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')]. Pirka understood but didn't completely agree and refused to let Emma-o escorts her to the Ainu underworld. Instead, she choose to enter his service.\n\nReturning as an [akuma|E], Pirka's relationship with Emma-o has been complicated since. She hopes to serve as his moral compass as he ascends to the [Glossary('Demon Emperor','podgloss.demonemperor')] throne. The [Glossary('Yama King','podgloss.yamaking')] for his part is torn on how to act with her and has so far let her do her own thing, though always with a group of [Glossary('Shikome','podgloss.shikome')] close to ensure her protection."
 POD_persistentpodlore.desc.793490: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the [world_of_darkness|E].\n\nIeko was angry all her life. Angry to be called ugly when she was young. Angry to be forced into a loveless marriage with an old brute. Angry that she was executed for defending herself against him.\nEven death didn't bring her peace, as she was destined for [Glossary('Kakuri','podgloss.kakuri')].\n\nAllying with other souls lost in this dark realm, she thought for a moment that escape was possible until the group met its first [Glossary('Shikome','podgloss.shikome')] and the men instantly turned on her out of \"love\" for the creature. Left to rot on the desolate sand, she would have given up if not for the intervention of Jizo-Bosatsu.\n\nThe strange and kind old man put her back up and taught her about the ways of the world, the [Glossary('Yama Kings','podgloss.yamaking')], her potential to return as a [kuei_jin|E] and the enlightenment to achieve there. Ieko listened but also noticed that the traveler was making the [Glossary('Shikome','podgloss.shikome')] and even [Glossary('Emma-o','podgloss.emmao')] himself afraid. This was the part that interested her the most.\nJizo stayed silent about the truth of the matter however which annoyed Ieko greatly. Here was a great being with apparently the power to make things right and what was his goal instead? School lost souls into following a long and arduous path that \"could\" lead to something good at the end.\n\nTheir relationship never really recovered after this falling out, Ieko never seeing the point of avoiding direct action that could help things now instead of centuries in the future. In the end, they parted ways, but not before Jizo showed her a mean to escape.\n\nIeko stayed there a long time, looking at the door to the outside world and apparently the centuries of grueling Dharmic enlightenment that awaited her, most likely with the added stigma of being a newcomer. In the end, she turned around and entered Emma-o's castle instead, Kyuden no Kakuri.\n\nWhen she emerged, the youngest [Glossary('Shikome','podgloss.shikome')] was ready to take decisive action for her lord."