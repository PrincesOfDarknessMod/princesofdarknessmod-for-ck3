l_simp_chinese:
 POD_mummy_command_effigy.100.t: "你的动物俑像已回归"
 POD_mummy_command_effigy.100.desc: "你的俑像已经完成任务归来，带着满满一箱的金钱回来了。"
 POD_mummy_command_effigy.100.option.a: "轻松获利。"
 POD_mummy_command_effigy.200.t: "你的动物俑像已回归"
 POD_mummy_command_effigy.200.desc: "你的俑像已经完成任务归来，其等将你的名字传得很远很广。"
 POD_mummy_command_effigy.200.option.a: "世界将知道我是谁。"
 POD_mummy_command_effigy.300.t: "你的动物俑像已回归"
 POD_mummy_command_effigy.300.desc: "你的俑像已经完成任务归来，为你的功业提供了他们的力量。"
 POD_mummy_command_effigy.300.option.a: "他们是我的得力助手。"
 POD_mummy_command_effigy.400.t: "你的动物俑像已回归"
 POD_mummy_command_effigy.400.desc: "你的俑像已经完成任务归来，已经帮助你的家庭变得更加强大。"
 POD_mummy_command_effigy.400.option.a: "我的血统随着每一代人的成长而变得更加强大。"
 POD_mummy_command_effigy.500.t: "你的动物俑像已回归"
 POD_mummy_command_effigy.500.desc: "你的动物俑像从对[target.GetFirstName]的观察归来。他们将分享他们所学到的知识。"
 POD_mummy_command_effigy.500.option.a: "知识就是力量"
 POD_mummy_command_effigy.510.desc: "你的动物俑像从对[target.GetFirstName]的观察归来，什么都没学到。"
 POD_mummy_command_effigy.510.option.b: "还返到[target.GetFirstName]进行进一步观察"