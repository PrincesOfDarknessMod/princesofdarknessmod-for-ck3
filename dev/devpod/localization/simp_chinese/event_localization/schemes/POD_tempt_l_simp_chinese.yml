l_simp_chinese:
 POD_tempt_scheme: "引诱"
 POD_tempt_scheme_desc: "诱惑你的受害者获得你所属的原罪。"
 POD_TEMPT_SUCCESS_DESC: "目标将获得你所属的原罪特质。"
 POD_tempt_scheme_desc_general: "诱惑你的受害者获得你所属的原罪。"
 POD_tempt_scheme_action: "引诱"
 POD_tempt_scheme.0003.t: "引诱成功"
 POD_tempt_scheme.0003.desc: "你花了一些相当大的努力，但你终于看到了一些成功迹象。你的目标正在慢慢地表现出于平时不同的一面，表现出越来越多令人愉悦的迹象，沉溺于你最喜欢的原罪。\n虽然这本身就是一个小小的胜利，但这为你在未来提供了一些诱人的新可能性。毕竟你现在和他们有共同的兴趣，你可以教他们更多的东西……"
 POD_tempt_scheme.0003.a: "一趟美妙旅程的开始……"
 POD_tempt_scheme.0004.t: "引诱失败"
 POD_tempt_scheme.0004.desc: "尽管你做了最大的努力，但你没能引诱你的目标取有你最喜欢的原罪。更糟的是，他们现在对你将来可能提供给他们的任何“有毒的礼物”都很警惕，这意味着你将不得不重新考虑你的计划。挫折是肯定的，但你面前仍有永恒的时间来诅咒他们。最后，他们将是你的。"
 POD_tempt_scheme.0004.a: "地狱还能再等一会儿。"
 can_be_converted_tooltip: "为了能使皈依，该角色首先需要与你的信仰相对应的原罪特质。"
 POD_corrupt_scheme: "腐化"
 POD_corrupt_scheme_desc: "腐化你的受害者，使其跟随你的恶魔信仰。"
 POD_CORRUPT_SUCCESS_DESC: "目标会皈依你的信仰。"
 POD_corrupt_scheme_desc_general: "腐化你的受害者，使其跟随你的恶魔信仰。"
 POD_corrupt_scheme_action: "腐化"
 POD_tempt_scheme.0006.t: "腐化成功"
 POD_tempt_scheme.0006.desc: "你花了一些相当大的努力，但你终于看到了一些成功迹象。你的目标现在完全沉浸在原罪的荣耀中，迫不及待地想体验更多，这是你相当高兴准许的。\n其新发现的激情将助长你的力量，并确保其在未来的时间里保持为忠诚的仆人。使这个可恶世界成为你的玩物的又一步。"
 POD_tempt_scheme.0006.a: "可供享受的新鲜灵魂"
 POD_tempt_scheme.0007.t: "腐化失败"
 POD_tempt_scheme.0007.desc: "尽管你做了最大的努力，但你没能使你的目标堕落，让他们与地狱之力为伍。更糟的是，他们现在对你将来可能提供给他们的任何“有毒的礼物”都很警惕，这意味着你将不得不重新考虑你的计划。挫折是肯定的，但你面前仍有永恒的时间来诅咒他们。最后，他们将是你的。"
 POD_tempt_scheme.0007.a: "地狱还能再等一会儿。"