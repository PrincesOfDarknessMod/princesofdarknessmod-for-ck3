l_simp_chinese:
 POD_patronlore.100.t: "血族野史"
 POD_patronlore.100.option.a: "关闭血族野史"
 POD_patronlore.100.desc: "还没有写关于其的传记。\n\n"
 POD_patronlore.100.t.560027: "赞助传记：卢基奥斯"
 POD_patronlore.100.desc.560027: "一位有名望的罗马百夫长，秘密地信仰着伊西斯女神密教。在阻止罗马被哥特人部落瓦解的那些年里，当战争开始变得不可挽回时，卢基奥斯离开了。他越来越迷恋埃及神话，为了更好地了解他的女神，他去了筛沙之乡朝圣。不幸的是，他没有找到他所追寻的知识——只找到古蛇的信徒。赛特在古庙里迎接他。他对他对罗马军队的了解很感兴趣。"
 POD_patronlore.100.t.560002: "赞助传记：基厄兰"
 POD_patronlore.100.desc.560002: "基厄兰是一个爱尔兰旅行者，或者更准确地说，是一位爱尔兰流浪者（原文的字面意思为“走路的人”）。他是一个23岁的年轻人，他只是做他需要的事情来生存并支撑他的家庭。这通常意味着撒谎和欺骗，因为他没有很多其他技能。虽然有着不诚实的本性，他还是非常顾家之人，而且他把所有的爱尔兰流浪者看作是他的家庭。他几乎同样尊敬任何一个游牧民族。这就是他为一个奇怪的印度斯坦旅行者提供住所的原因，该人称自己为维斯瓦纳坦。\n\n他不知道的是，维斯瓦纳坦是一位玛土撒拉，雷伏诺氏族的第五代吸血鬼，他周游世界来到了爱尔兰。随后他们的营地很快得遭到了当地人的袭击，而爱尔兰人也受了致命伤。因此维斯瓦纳坦违背了自己的原则，初拥了基厄兰，救了他一命。他教会他矛盾之路，并警告他不要做他刚刚做过的事情。然后就走了。\n\n即使现在是血族，基厄兰也不忍心离开他的家人和他的人民。特别是当他们面对他们所接触到的社区的偏见和敌意时。爱尔兰的这种敌意越来越大，导致他们不久之后就离开了。基厄兰决心为他们找到一个安全的家。\n\n于是他们开始旅行，一走就是几十年，沿途接济其他游牧民族。不幸的是，基厄兰没能履行他对维斯瓦纳坦的承诺，于一次他救了他的族人中一个名叫凯奥姆的年轻女子的命。她是他的集群中唯一一个由他亲自抚养的血族，但一路上确实有许多人加入了他们的旅程。有些是雷伏诺，有些不是。正如维斯瓦纳坦告诉他的那样，基厄兰会向他的族人以外的任何人宣布他的族人是冈格罗（尽管他尽力保持潜藏）。\n\n最终，他们到达了匈牙利。主要通过欺骗、操纵和适量的虚幻术，这三样东西是基厄兰最擅长的，他说服了当地的男爵，允许他的族人在这里安家，不受打扰。"
 POD_patronlore.100.t.560007: "赞助传记：何塞·德·卡拉马尔"
 POD_patronlore.100.desc.560007: "何塞于凡生在伊比利亚半岛北部某处的鱼贩子家庭，但他早年的大部分时间都是在街上惹事。他比大多数同龄男孩都要大，并利用这种体型来吓唬其他孩子。他在青少年时期就知道人们会花钱买信息，所以他开始尽可能多地收集信息，通过偷听、谨慎跟踪或单纯的恐吓来进行勒索或交易。他最终成为一个年轻的成年人，在萨里亚市经营一个小的信息圈，在那里他被一个来访的吸血鬼注意到。他注意到了何塞的才能，并觉得他能成为完美的候选者。何塞和他的尊长之间的关系很不稳定，最后何塞吸榨了长者。\n\n在13世纪，何塞成为小家族德·卡拉马尔的首领和唯一的血族，接管了拉科鲁尼亚公国，并向自己承诺，他将以心兽的名义统治伊比利亚半岛。"
 POD_patronlore.100.t.560017: "赞助传记：凯拉·沙多维"
 POD_patronlore.100.desc.560017: "作为贵族的私生子出生，他学会了宫廷密谋以生存，尽管他是一个多病的孩子。26岁那年，当他正在为他的主人制作一个把柄时，一位吸血鬼闯入了他的城堡并初拥了他。"
 POD_patronlore.100.t.560013: "赞助传记：加夫列"
 POD_patronlore.100.desc.560013: "加夫列是个小贵族。像他的父亲和祖父一样，在凡生时是一名士兵。他被培养成了他的人民的保护者。\n\n作为一位吸血鬼，他变态地以猎杀和吸食他以前的土地上的凡人为乐。\n\n尽管对他的氏族很忠诚，加夫列却很难理解棘秘魑的高级哲学。他通过将自己隐居在他的领地并专注于繁殖血仆世系来进行补偿。"
 POD_patronlore.100.t.560014: "赞助传记：德斯卡迪翁·纳梅什"
 POD_patronlore.100.desc.560014: "他从埃及的采石场被挖出来，当时他的学习力和洞察力引起了他尊长的注意。多年来，他在已经老旧的城市中旅行，他的尊长灌输了对知识的渴求，以帮助他对抗时间的停滞。作为塔里克·萨玛的追随者，德斯卡迪翁相信自我和心兽之间的斗争是真主的终极考验。德斯卡迪翁在尼罗河口定居，那里是许多北非人生活的开始，他勤奋工作，把学习和信仰带给他周围的人。他的实验通常是内化的，但他过去曾采取过极端的措施，如把整个村庄的人都吃掉，或亲自执行一个月的禁食，以净化当地部落的身心（和弱者）。\n\n作为采石场为数不多的识字者之一，这也是他最初被初拥的原因，德斯卡迪翁一直保持着大量的日记和书面文字，因此他的宫廷对教育和策略的重视超过了其他任何特征。随着睿魔尔和梵卓对棘秘魑的战争故事的流传，德斯卡迪翁越来越关注保护他的工作，并在北非变得积极主动，试图阻止国王和金字塔控制埃及的人民。"
 POD_patronlore.100.t.560019: "赞助传记：阿尔扬·德·格雷"
 POD_patronlore.100.desc.560019: "阿尔扬·德·格雷出生为无地的骑士，他在主子的宫廷里度过了他的童年。他在战斗中表现出了自己的能力，为他赢得了领主卫队中最年轻的成员的位置，很快就在他的军队中获得了指挥职位。在诺曼底的一次叛乱中，这个年轻人有了机会证明自己。在五年的时间里，他被抓了三次。两次被赎回，一次逃脱。尽管有这些不幸的情况，但他的勇敢和技巧受到了赞扬，赢得了国王本人的信任。\n\n他职业生涯的高潮带来了战争的结束，在1119年的布雷米勒之战中，他成功地击溃了敌人的骑兵，并率领骑兵冲向他们的右翼。这次机动与他得到的命令毫无关系，被描述为“天才的一击”和“纯粹的疯狂行为”。无论是哪种情况，它都导致了一场决定性的胜利，而这场胜利似乎让阿尔扬失去了生命。也就是说，在他著名的冲锋的影响下，他开始追击撤退的军队，追上了支假撤的部队。他发现自己被包围在敌人的防线后面，在那里他被一根长矛刺穿，被抛在那里等死。他的手下发现他还活着，把他带到营地接受治疗，但康复的希望不大。当一个人走进帐篷时，一个朋友正坐在他身边。他认出了他，是国王的一个顾问。他的朋友应那人的要求离开了，只剩下他们两个人。\n\n“这看起来一点也不妙。我说你还有一个小时，也许两个小时。”那人没有等待回答。“我可以确保你能活下来，作为回报，你将在你的余生中对我誓忠，不管那是多长时间。你接受吗？”在痛苦和神志不清中，他接受了，并在一个陌生的地方醒来，为一个完全不同的主人服务。"
 POD_patronlore.100.t.560020: "赞助传记：居鲁士·海利德"
 POD_patronlore.100.desc.560020: "威廉出生在斯特拉斯堡的一个富有的织工家庭，他总是充满了好奇心。为了寻求新的秘密，他开始在教会的庇护下学习。入教后，他在圣奥迪尔山顶的霍恩堡修道院成为一名修士。在学习经典的同时，他对“异教徒之墙”也越来越好奇，这是一堵围绕着山的古老的凯尔特墙，被认为比基督教更早。他还了解到关于奇怪生物的故事，这些生物在邻近的黑林山地区出没。巨大的人形生物，七英尺高，有黑色的眼睛。\n\n他对墙的起源和对原始教事务越来越感兴趣的禁忌探索，使他受到了睿魔尔氏族中一位流浪的受弃者乔纳斯·赫里德的注意。在得到这位的初拥后，他离开了他的修道院生活，去旅行，远离太阳。\n\n在他的亡生，他和乔纳斯来到博洛尼亚，在那里他们在1088年大学的建立中发挥了支持作用。威廉对古代的知识很感兴趣，他从波斯的故事中得到灵感，取了一个新名字——居鲁士。一个新的名字代表了他的一生。\n\n1180年，在试图与他的祖先重新加入睿魔尔氏族的努力失败后，他回到了他的家乡，靠近莱茵的科尔马市。不用说，这就是他被斯特拉斯堡的马可纽斯联系上的全部原因，他是吉雅希德血系的创始人，也曾是法师。尽管来自不同的氏族，但他们的学术兴趣使他们走到了一起。以知识的名义，他们形成了一种同盟。"
 POD_patronlore.100.t.560025: "赞助传记：伊甸·瓦尔滕"
 POD_patronlore.100.desc.560025: "绑架凡人（特别是优秀的生理标本，强壮的，美丽的，等等）会引起人们的注意；特别是当大多数被绑架的人被发现时……已是遗体。死者似乎被残忍地实验过；他们的一些肢体或器官被扭曲得几乎无法辨认。唉，好助手是很难找的，那些伊甸“信赖”的人有（雇佣）任务处理这些失败品时，通常只是把尸体扔在一个随便的地方，假设它们只是被算作该地区的更多谋杀事故（凡俗的那种）。然而，任何对易变术的影响有一点了解的人都会保有怀疑。"
 POD_patronlore.100.t.560030: "赞助传记：帕特里克·拉莫斯"
 POD_patronlore.100.desc.560030: "被初拥后，他只能自生自灭，赢得尊重的唯一方法是通过力量和权力。由于没有氏族的支持，帕特里克渴望有一天能将该隐之子和凡人置于控制之下，他将不惜一切代价获得权力并按照自己的意愿建立世界。"
 POD_patronlore.100.t.560031: "赞助传记：加百列·费利佩·德·拉·卡斯塔"
 POD_patronlore.100.desc.560031: "加百列是一位曾是贵族家庭的后代，自出生以来就被培养为统治者。在他受初拥之后，他选择避开众人的目光，从阴影中进行统治，这作为勒森魃氏族的成员是相称的。"
 POD_patronlore.100.t.560028: "赞助传记：露西娅·卡纳莱"
 POD_patronlore.100.desc.560028: "露西娅像是突然登场的，幸运的是，在她崛起的过程中，她的许多对手都有“不幸的事故”或特别突然的改变。她的尊长被确认为一个被称为朱塞佩的阴暗男人，最后一次被看到是在与她会面的路上；不知道他的命运是被吸榨，还是仅仅是终焉之死，以结清最后的尾巴。如果你的间谍总管不是很能干，也许就不应该激怒她。"
 POD_patronlore.100.t.560032: "赞助传记：莉莉安娜·桑托维奇"
 POD_patronlore.100.desc.560032: "被她的尊长斯托弗·拉芬斯堡初拥，祖先可追袭到魔龙。在她初拥的早期，她发现斯托弗是崇魔者，在他的另一个子嗣米格尔·巴巴内格拉的帮助下，追捕了斯托弗并将他最终杀死。现在，她努力确保自己在军督布兰科维努宫廷内的地位，尽管他们对彼此的心路有敌意。她仍然对她以前的[Glossary('遗传血仆','game_concept_revenant_desc')]养父母持有一定程度的孝心，并试图保护和确保她的老家族在这个世界上的地位，但收效甚微。"
 POD_patronlore.100.t.560048: "赞助传记：案陀梨娑·旃陀罗"
 POD_patronlore.100.desc.560048: "足够古老到可能真的是《梨俱吠陀》中的一人，旃陀罗是《梨俱吠陀》中的月神。案陀梨娑是空间之神。出生于公元前1500年左右，可能在同一时期被初拥。"
 POD_patronlore.100.t.560041: "赞助传记：哈孔·斐斯通"
 POD_patronlore.100.desc.560041: "由于他的皮肤像尸体一样苍白，他小时候总是引起大家的注意，他大部分时间都在森林里觅食，后来开始打猎，他很聪明，很狡猾，后来加入了一个盗贼团，以袭击在诺马克旅行的士兵和商人而闻名。\n\n他在盗贼团中的角色是收集信息，并利用这些信息来策划伏击行动。\n\n一天晚上，一个有血缚的冈格罗带着杀意接近了盗贼的藏身处，屠杀了里面的大多数人，或者使他们处于危急状态，之后，冈格罗逃离了现场，里面的每个人不是躺在地上成为尸体，就是在流血，哈孔很“幸运”，只有中度出血，并试图烧灼伤口来止血。\n\n后来他在包扎好伤口后试图走出藏身处，但没走出多远就看到月光下一个朦胧的身影，那人指挥他走近，他照做了，没过多久就感到一阵微弱的疼痛，接着是一种异样的快感，然后一切都变黑了。\n\n他的尊长是来自暗影之海中的受弃者，但从未提及。他的尊长教会了他很多东西，如何更有效地操纵人们，以及深渊是多么的美丽。在亡生的后期，在吞噬了一位妥芮朵的灵魂并对$pod_vitae$上瘾后，他开始登场。"
 POD_patronlore.100.t.560043: "赞助传记：阿那托利俄斯·泰涅布里斯"
 POD_patronlore.100.desc.560043: "他是小商人的儿子，出生在摩尔多瓦诸公国之一的切尔诺夫策村。他从小就知道如何调和并获得必要的关系。一天晚上，他遇到了一个陪同拜占庭帝国大使的年轻女孩。这个女孩漂亮得令人吃惊，但更重要的是，除了她之外，再没有其他卫兵。这种情况下，阿那托利俄斯和他的哥哥在当地的一家小酒馆里结识了这个女孩。根据她的说法，他们与基辅大公谈判后回来，在这里换马和休息。由于他天生的魅力，阿那托利俄斯能够说服女孩在他们家过夜……至少他当时是这么想的。这是他作为人类的最后一夜。清晨，他发现了他的家人被肢解和风干的尸体。在他哥哥冰冷的尸体上，他发现了一条信息。“下次见面将在我的地盘。你的亚莲恩”。几天后，妥芮朵的仆人与他联系，并就与其他亲属的会面地点作出指示。\n\n自从他被接纳到一个新的家庭，9年过去了。阿那托利俄斯能够将自己打造成一个忠诚、有执行力和聪明的家族成员。在这么短的时间内，他得以把以前的地方统治者赶走，并宣誓效忠于军督领的统治者。无论是弗拉基米尔·罗斯托维奇还是母主都不怀疑他的忠诚。但是，如果忠诚和誓言不过是幌子，而新的“家庭”是为旧的、真正的家庭复仇的主要目标呢？我们将会知道的。"
 POD_patronlore.100.t.560049: "赞助传记：戈尔姆"
 POD_patronlore.100.desc.560049: "此人是一位凶猛的战士。他在战场上的意志和他对部队和地利的精心掌控使他获得了许多成功的战斗。在其中一次战斗中，他被布伦希尔德发现了。当他在杀死四个刺客后奄奄一息时，她初拥了他，让他独自在荒野中生存。在那些日子里，他了解到社交能力和计谋是如何只为弱者服务的，并利用他的狡猾和力量，以稳定的效率进行狩猎。在了解到自己成为什么之后，他开始积极废止那些唾弃神灵的人。作为一个指挥官和刽子手，他被派去杀死生命之树的腐烂根须。\n\n任何偏离道路的英灵战士都必须为他们对神灵犯下的罪行负责，他们中很少有人能活到加入基督教的时候。然而，他每打赢一场战役，就会有其他战役失败，基督教徒似乎从未退缩过。更糟的是，他们毒害了他的羊群的心，英灵战士之间的许多争吵导致了米德加尔德的崩塌。在奥丁消失后，他对人类未能认识到真正的力量和未能坚持阿萨传统感到厌恶，他把自己重新关在他的故乡海尔古姆，不参加任何新的战斗。但他从未失去信仰。如果奥丁醒来，他将再次拿起他的斧头，再次冲向战场。"
 POD_patronlore.100.t.560050: "赞助传记：汉尼拔·巴卡"
 POD_patronlore.100.desc.560050: "在第二次布匿战争期间，罗马父母会告诉他们的孩子：“汉尼拔在门外”，以此来吓唬他们。有传言说他在迦太基被布鲁赫的玛土撒拉特洛伊尔初拥，但他是在城市被摧毁后是幸存下来还是与城市一起灭亡，这一点仍不得而知。有些人甚至质疑是否真有一位汉尼拔。是有的。汉尼拔在哈图沙的废墟中从蛰眠中醒来，回到了他的祖屋，从那里他有一个想法，而且只有一个想法：摧毁——罗马——或者类似的东西。"
 POD_patronlore.100.t.560053: "赞助传记：鲁阿兹·萨瑟兰"
 POD_patronlore.100.desc.560053: "他是基督教的大主教。他相信吸血鬼是天主意志的一部分，但初拥使他发生了偏转。他认为吸血鬼是人类的牧羊人，人类只是牲畜，通过吸血鬼的意志被引导到他们认为和看到的正确事情上。虽然他认为人类不应该撒谎或杀人（除非他们的吸血鬼领主告诉他们这样做），但他认为吸血鬼被允许使用这些工具“用于更大的善”。他相信人们或好或坏，非此即彼，并以黑白两色看待世界。他被格拉崔克斯接纳为牧师，对宗教和神秘学有着丰富的知识。当被初拥时，萨瑟兰偏转了。\n\n到了一个程度，甚至格拉崔克斯不得不把他送去马耳他一段时间，以便他能平静下来，让他的头脑清醒。他的应对机制使他仍然相信自己是天主的代理人，但后来他开始把世界看成是黑与白，善与恶。就像任何追随邪恶的人一样，最终他用邪恶的工具来打败邪恶，并变得对权力充满渴望。在他看来，所有这些都是为了最终达到他为神圣罗马帝国和睿魔尔至上的目标，这将使他走上一条黑暗的道路。"
 POD_patronlore.100.t.560066: "赞助传记：阿尔托莉雅·潘德拉贡"
 POD_patronlore.100.desc.560066: "她声称要领导不列颠人的防御工作，对抗入侵的撒克逊人，并在凡人中伪装成一个男人。"
 POD_patronlore.100.t.560067: "赞助传记：埃尔德·迭戈"
 POD_patronlore.100.desc.560067: "迭戈是一个基督教圣修士会的前僧侣。他曾经是一名猎人，但在一次成功的猎杀后，被一位感兴趣的尊长初拥了——且并不太关心迭戈干掉的几个稚子。"
 POD_patronlore.100.t.560072: "赞助传记：摩加诺·穆尔查"
 POD_patronlore.100.desc.560072: "他被睿魔尔吸干血液，转化成了吸血鬼。最初，这个法师太年轻了不能被氏族创始人初拥，在庆典之后摩加诺很快就被被格拉崔克斯初拥。他曾参与协助捕获和然后初拥多名施蒂利亚棘秘魑来了解他们血液的秘密。由于他对篡夺仪式的了解，棘秘魑的氏族血律，易变术出现在了他的血液里。这个罕见的特质只偶尔出现在睿魔尔家族里，古往今来迅速成为了摩加诺研究的焦点。他相信用易变术操纵血肉之躯能够解开很多炼金术的秘密，并快速习得使他的奇迹血魔法实现的新方法。\n\n他独一无二的天赋和他相对成功的实验让他在氏族内名声大噪。摩加诺·穆尔查对力量的渴望反映在他实验的残酷本质上，他还一手导致了棘秘魑对羽翼未丰的睿魔尔家族宣战。1037年，摩加诺因此被睿魔尔家族除名，他和他的追随者们都不再是金字塔形血缚的一部分。被睿魔尔除名激怒了他，并使他更加渴望权利，他和他的一些初拥创立了穆尔查家族。穆尔查家族是睿魔尔家族的支系，他们通过决斗的方式谋杀了当地原本的军督之后，将大本营设立在了埃斯泰尔戈姆。\n\n从他新的权位出发，穆尔查家族的摩加诺开始对附近的维谢格拉德发动入侵战争，尽管敌人数不胜数。他的追随者们虽然觉得这是自杀式袭击，但却惊喜地发现自己赢得了很多次胜利。匈牙利的军督们彼此之间、与睿魔尔家族主要分支、与穆尔查之间都有冲突。\n\n这些最初的胜利捕获了许多相当强大的血族，这些人可以满足摩加诺对于实验新力量的欲望，所以他在一段时间内将自己的注意力从征服转移到了旅行上。摩加诺途经了阿瓦隆诸郡和法兰西的爱之皇庭，据说还在那里有了两个子嗣。在肯特郡的坎特伯雷，一位名叫夏洛特的年轻贵族女孩是他的第一个子嗣，我们不知道是一些短暂的“爱”驱使着他，还是她的其他什么方面吸引了他。他的另一位子嗣是他巧遇的赫耳墨斯秘会的旅行法师，名叫尼克劳斯。他们相遇的时候，摩加诺是一个强大的血魔法使用者，还会用一些其它血族血律，尤其是易变术，他可以不动声色的接近敌人，在他们没反应过来之前发动攻击。尼克劳斯恨摩加诺初拥了他，他觉得摩加诺对他开了一个残酷的玩笑，于是他花了许多年的时间在埃斯泰尔戈姆的教堂追踪到了摩加诺。\n\n摩加诺在最近的夜晚因他的疯狂而闻名，在从他隐居研究中走出来后，巫士看到许多低级血族，比如劣族，已经爬上了显赫的位置。在大量研究了火焚末日预言之后，他把这当作一个预兆，并开始了自己的圣战，要把欧洲的无族者清洗干净，在他这样做的时候，他把许多传统的吸血鬼召集到了自己身边。虽然他曾经在俘虏身上做实验，但穆尔查家族的疯狂领主现在选择在木桩上或在他们的家里烧死他的敌人，有时，如果有谣言说他们窝藏着无族者，整个村庄和城镇都会被烧成灰烬。然而，由于他的孤僻和上位氏族的冷漠，没有人阻止摩加诺对匈牙利的疯狂扫荡。"
 POD_patronlore.100.t.560074: "赞助传记：布兰德·德·德雷克"
 POD_patronlore.100.desc.560074: "他是一个被称为“德·德雷克”的有能战士。他击退了在周围地区强行索贡的丹麦人。他拒绝向丹麦人付款。在随后的战斗中，荷兰人取得了胜利，800名丹麦人中有500人被杀，包括他们的领袖。然而，荷兰人也失去了他们的领袖。\n\n或者大众是这样想的，实际上他在战斗中被初拥了，被着魔了，改变了他的身份，并从那时起在欧洲旅行，寻找他的归宿。最终，他回到了荷兰，在阴影中进行统治，同时努力恢复自己的理智——或者说屈服于疯狂。"
 POD_patronlore.100.t.560076: "赞助传记：艾丹·凯瑟琳"
 POD_patronlore.100.desc.560076: "艾丹被一位真布鲁赫长者所初拥，他关心着白嚎的消失和腐败。作为与白嚎一起协作的德鲁伊的后裔，他的尊长希望艾丹能对这个谜团提供一些见解。"
 POD_patronlore.100.t.560079: "赞助传记：卢娜·莫宁斯塔"
 POD_patronlore.100.desc.560079: "作为人类时，卢娜总是与她的同龄人不同。她对生与死持怀疑态度，对怪异的事物感兴趣，并爱上了黑夜。有些东西使她平静下来。缓慢但无情的微风穿过她父母房子的岩石时，其他孩子会吓到，她却感到舒适和安全。木头在她脚下的破裂声和黑暗房间的寂静激发了她的想象力。她的美貌似乎是永恒的，但在她拒绝邻居男孩的求爱并被宣布为女巫时，她的美貌几乎熄灭了。当审问者把她送上木桩时，她愤怒和痛苦的哭声传到了当地的一位吸血鬼领主那里，他看到了她对人类的无情仇恨。他救了她，并在不久之后初拥了她。他想看看这样一位美丽而疯狂的人在自取灭亡之前能造成怎样的混乱和痛苦，或者她是否能通过在黑夜宫廷中升阶，成为真正的夜之女主人。"
 POD_patronlore.100.t.560081: "赞助传记：凯莉娅·忒尔狄亚"
 POD_patronlore.100.desc.560081: "凯莉娅于公元390年出生在罗马城，生活中是罗马百夫长的第三个孩子。关于她的凡生，人们知道的不多，只是因为没多少可知道的，更不用说她那个时代的大部分记录都被销毁了；她在罗马过着平淡的生活，直到公元410年高卢人洗劫了罗马。她的父亲和哥哥们在战斗中丧生，在试图逃离时，她发现自己被一个血族袭击了。她尽力反击，但这从一开始就是一场无望的战斗，她被轻蔑地打败了。\n\n不知是哪位吸血鬼转化了她，都让她自生自灭了——她作为吸血鬼的新身份很快就被当地人发现了，她只是勉强设法毫发无伤地逃脱了。她逃到了东北部，花了近一个世纪的时间才牢牢掌握了她的新能力，以及如何避免被发现——或招致其他同类的愤怒。只有在又过了两个世纪之后，她才终于为自己开辟了一个地方，无论多么小。但这是一个开始——是否是一个大的开始，还有待观察。"
 POD_patronlore.100.t.560084: "赞助传记：米歇尔·特诺克蒂斯"
 POD_patronlore.100.desc.560084: "人们对他的了解并不多，因为他通常都是独来独往地研究深渊。众所周知的是，在他被再造之前，他已经发现了深渊的存在并开始研究。这引起了勒森魃氏族的注意，并最终导致了他目前的不死族状态。"
 POD_patronlore.100.t.560086: "赞助传记：亚历撒库斯"
 POD_patronlore.100.desc.560086: "亚历撒库斯在被初拥之前是一个简单的人，在希腊某个早已被遗忘的小村庄里长大。在生活的后期，亚历撒库斯成为一个难以捉摸的神秘主义者，许多人来到这里接受他们的祝福和仪式。他周游列国，那时的夜晚远没有现在这样血腥。在他旅行的某个地方，他几乎丧生，但被巴力之一从死亡中救出并初拥了他。\n\n多年来因其尊长的艺术进行的痛苦训练使他变得强大，但却牺牲了他自己的理智。如今，他像一个隐居的隐士一样生活在一座专门为他量身定做的塔里，操纵着他所在的伯爵领的民众，几乎像一个邪教一样领导他们，而他则是崇拜的中心。他们敬畏地看着他居住的塔，但他们主人的目光早已落在了其他地方。他脑海中的声音谈到了宏伟的成就，他听从这些声音将是明智的。"
 POD_patronlore.100.t.560070: "赞助传记：安倍晴明"
 POD_patronlore.100.desc.560070: "日本平安时代中期的阴阳大师。阴阴道是一种自然科学、天文、历法、占卜和魔法系统，以中国的阴阳和五行哲学为基础在日本独立发展。除了他在历史上的突出地位外，他还是日本民间传说中的传奇人物，在许多故事中都有描绘。安倍晴明作为阴阳师，为天皇和平安时代政府工作，就处理问题的正确精神方式提供建议。他为天皇和政府的福祉祈祷，并就各种问题提供建议。他也是一位占星家，预测星象事件。他的寿命非常长，没有任何重大疾病，这促使人们相信他有神秘的力量。在他生命的最后阶段，他被东方的一位萨洛比所初拥。"
 POD_patronlore.100.t.560073: "赞助传记：希梅诺·菲茨罗伊"
 POD_patronlore.100.desc.560073: "在被初拥之前，希梅诺·菲茨罗伊是瓦伦西亚的一个小贵族——与某个西班牙国王有远亲关系（他声称是这样）。他建立了一些恶名，因为他自由地与无良商人、盗贼和黑帮混在一起的事实。他的堕落和为自己的利益弯曲法律的意愿引起了一个强大的勒森魃的注意，他在寻找一个值得初拥的凡人。\n\n在初拥之后，希梅诺发现自己被阴暗的海浪所吸引——正如一些勒森魃一样。他招募了他在前世认识的罪犯作为船员，开始了充满冒险、战斗和大量掠夺战利品的伟大航程。对一些海盗来说，袭击和狂欢已经足够了，但希梅诺最终发现他的海上生活……受到了限制。利用十字军东征造成的黎凡特地区的混乱，他夺取了几个关键港口的控制权，决定“开店”。鸦廷由此诞生。从那时起，希梅诺的势力略有扩大，包括了叙利亚的大部分/全部地区和海上的一些零星土地。希梅诺的梦想是建立一个强大的海盗王国，足以自治而不用担心别人插手它的事务；在那里，每个吸血鬼都可以自由地生活和死亡。"
 POD_patronlore.100.t.560080: "赞助传记：马特忒俄斯·耶尔贝根"
 POD_patronlore.100.desc.560080: "与许多棘秘魑一样，耶尔贝根抛弃了其作为凡人的过去。它曾是马特忒俄斯.德拉戈斯特，一位罗马尼奥犹太神秘主义者，在过去的岁月里他使用逆卡巴拉魔法来实践卡巴拉·马阿西特。而他对这类魔法的研究和掌握引起了居住在古代君士坦丁堡内的吸血鬼的兴趣。最终棘秘魑的玛土撒拉，也就是安德莱昂的一个子嗣（可能是“地狱犬之主”乌尔多，但也可能是“学者”耶德里克 ）在他尊长的指示下初拥了这位神秘主义者。\n\n在安德莱昂的教导下，德拉戈斯特学习了各种形式的易变术血律。与安德莱昂的所有后代相似，他对这道血律的掌握迅速超过了他的年龄。随着他巩固了对易变术的掌握，德拉戈斯特发现当他向逆卡巴拉伸出手时，他能感觉到居住在反生命中的一种古老的智慧正在压迫他的意识，就像他还活着时那样。经过安德莱昂的指导，神秘主义者与这些伟大的智慧进行了交流。他们向他透露了许多关于易变术的惊天秘密，并告诉他被称为拿非利的古老且不计其数的罪行。在这些妖邪实体的吸引下，马特忒俄斯进入[UmbraGlossary('shadowlands')]，前往达海努的森林、第二城的废墟和须弥山的根部。\n\n在种种旅途中，这些自称守望者的逆卡巴拉实体，打破了马特忒俄斯的思想，并将其重建为他们自己的延伸。被长生不老的启示所驱使，被这些邪恶的实体所占有，马特忒俄斯为新兴的病魔之道兄弟提供了方位和发声，他们就像一个肿瘤一样在血族社会中慢慢成长。马特忒俄斯成为了病魔之道的先知，直接与守望者进行沟通，并以他们的名义宣布令人疯狂的启示。因为马特忒俄斯作为君士坦丁堡不断增长的病魔之道血之密教和他们所侍奉的逆卡巴拉教主之间的主要沟通渠道和神职人员，安德莱昂的其他子嗣开始将他命名为“黑暗中的低语者”。\n\n德拉戈斯冒充流浪的神秘主义者，用他的易变术来医治血畜和血族中的病人和伤员。然而随着每一次治疗，德拉戈斯的污血都会传播给大众，使他们由内而外地腐烂，也使他们堕落为病魔之道意志的延伸。德拉戈斯的诅咒可能已经蔓延到地中海的大部分地区。然而病魔之道，或者更正确地说，主宰这组织意志的守望者，低估了城市的其他血族。魔龙，一位对易变术的了解超过病魔之道的古老棘秘魑，他根除了马特忒俄斯的许多密教，并迅速地将这些无赖的棘秘魑赶出了城市。但是德拉戈斯的一些疯狂残余仍然留在古代拜占庭的边缘地带，即使如此几个世纪的准备和阴谋在短短的几年内还是被推翻了。尽管三一对病魔之道的胜利是迅速的，但统治君士坦丁堡的玛土撒拉掩盖了被征服的血之密教，以维护一个稳定和无误的幻梦形象。\n\n在德拉戈斯被驱逐出君士坦丁堡之后，这位流浪的病魔之道神职人员似乎从地图上消失了。有些人窃窃私语，说病魔之道已经被埃利奥德追杀到了欧洲和中东地区。直到最近，“黑暗中的低语者”才以一个新的名字重新出现在西伯利亚最偏远的角落，似乎暂时甩掉了对塔尔玛埃拉的追捕。"
 POD_patronlore.100.t.560012: "赞助传记：伊扎尔达·基什洛夫斯基"
 POD_patronlore.100.desc.560012: "伊扎尔达出生在一个相当成功的家庭，这让她在成长过程中被各种问题包围，其中大部分是她自己造成的。在她的早年，她显示出作为学者的天赋。\n然而，她选择了一条不同的道路，秘密地将自己沉浸在神秘学中。关于她秘密研究的谣言很快就传开了，再加上她极不寻常的外表，使伊扎尔达成为一个被抛弃的人。在一个决定性的夜晚，这位年轻的少女知道了这些谣言有多糟糕，因为她被打成了残废，在街上被打得半死。也许不那么令人惊讶的是，找到并帮助她的人不是别人，而是巫团的成员。\n在巫团的指导下，伊扎尔达迅速学会并成长为一个相当有头脑的女巫。但这位女士又一次在半夜被人扑倒。虽然，这一次，被打残的是她自己的巫团的姐妹们，是她饥渴的受害者。\n一旦过了稚子阶段，伊扎尔达就离开了她的[Glossary('尊长','game_concept_Sire_desc')]梅兰迪斯，并放逐了自己，仍然对她的姐妹们的死亡充满了悲伤。在这期间，她深入研究了自己的$pod_clan$历史，发现了关于解密会的文本和信息。\n现在，在学会的启发下，她回到了自己的故乡文奇察，轻松地当上了女伯爵。然而，这只是一个更复杂的计划的第一步，该计划旨在提升末卡维和解密会的地位。同时，她将站在中间，准备在世界范围内释放真正的知识并收获其力量。"
 POD_patronlore.100.t.560093: "赞助传记：阿姆杜乌斯"
 POD_patronlore.100.desc.560093: "阿姆杜乌斯于787年出生在法兰西，是查理曼大帝统治时期宫廷中的一名法兰西贵族。他是查理大帝最亲密的顾问之一，也是一个极其聪明的人。他以其狡猾和奸诈的头脑而闻名，但也被法兰西宫廷中常见的妄想症所困扰。在查理大帝去世的当晚，他被阿扎那利初拥，很快就接受了他的新亡生，并摆脱了他的旧生活，他的原名也消失在历史中。教团现在只知道阿姆杜乌斯。他学崇魔术学得很快，在教团中被称为地狱衍体之主，并因其实验和研究在血系中受到高度尊重。"
 POD_patronlore.100.t.560094: "赞助传记：埃塞尔芙莱德"
 POD_patronlore.100.desc.560094: "他被美露莘·德安茹再造，或多或少地成为了一件活生生的艺术品和玩物，他仅仅通过被她宠爱以及吸引他周围的人，而不是通过他严重缺乏的任何实际能力，积累了一点权力。他的名字和支系——多耶——都是她赐予他的，既是一种娱乐，也是为了迎合某种主题。"
 POD_patronlore.100.t.560095: "赞助传记：门农"
 POD_patronlore.100.desc.560095: "门农是曾与阿喀琉斯战斗过的埃塞俄比亚半神国王。虽然门农在战斗中阵亡了，但宙斯对他的技艺和勇敢印象深刻，授予了他永生。回到祖国后，他在对失败的绝望中徘徊了一段时间，直到陷入蛰眠。当他在12世纪醒来时，他回到希腊面对并击败了阿喀琉斯。阿喀琉斯早已死去。他被自我怀疑的感觉所困扰，在返回埃塞俄比亚之前，他试图填补自己的弱点——他曾与希腊人发生争执，以考验自己的勇气。又或许这个传说是虚构的，是一名冈格罗战士捏造的，他想通过虚张声势来激发追随者的忠诚和敌人的恐惧。"
 POD_patronlore.100.t.560096: "赞助传记：菲利普"
 POD_patronlore.100.desc.560096: "当一个神秘的赞助人邀请菲利普去改造异国情调的亚历山大城时，这位来自那不勒斯的新兴建筑师，放弃了来自意大利各城市具有前途的工作机会。\n\n当菲利普抵达时，他发现这座城市不配拥有亚历山大、托勒密和凯撒。他宣称要用一生的时间来恢复亚历山大城的辉煌时代。他的赞助人，亚历山大的马塞卢斯，为他提供了这几辈子的时间；在酒、女人和歌声中度过永恒的时光，在灵感的点缀下，身体和心灵不受时间流逝的损害。既然建筑师设计他的作品是经久不衰的，难道他的尘世之躯不应该也建立在坚固的基础上？\n\n在菲利普被初拥后清醒的那一个夜晚，马塞卢斯跟他透露，该隐之子一族是建立在不间断争斗的基础上。埃及是赛特之子和该隐之子之间冲突的温床，而马塞卢斯对亚历山大城地下的巢穴和秘密通道更感兴趣，并不是恢复凡人的城市。\n\n那是一次返回意大利的痛苦航行，菲利普诅咒自己相信了那个埃及人。他现在埋头于分散心兽注意力的项目：在烛光下绘图，在月光下测量，甚至在黑暗中以非自然的灵巧来加工石头和木材。他领地里的凡人木偶继续在他作品的阴影下生存和死亡，就像娃娃屋里的娃娃一样。"
 POD_patronlore.100.t.560097: "赞助传记：塞嫩"
 POD_patronlore.100.desc.560097: "白色守望者是贤士中的一位古老而神秘的人物。他的后代，福斯沃恩，是勒森魃的分支之一，通常被称为“白影”，作为血之沉默——避世戒律——的看守者。他们把责任看得比什么都重要，并作为观察者来保护他们家族和宗族的未来。"
 POD_patronlore.100.t.560098: "赞助传记：戈卢布"
 POD_patronlore.100.desc.560098: "戈卢布是一位波斯尼亚小贵族、波格米勒派的虔信徒和才华横溢的医生，他吸引到了斯雷代茨的尼基塔的注意并被其所初拥。但是，这并没有让尼基塔获得一颗愿意将世俗影响、宗教信仰和学习结合起来的棋子。\n\n戈卢布对该隐异端及其教会的腐败感到非常震惊。他觉得自己有责任回击那些以信仰为人质的怪物。为此，他打击了遇到的几名异端的长者和仆人。在不知不觉中，尽管他视自己为救世主，但也开始将宗教组织视为敌人。他看到了每一件事的背后都有异端和他的尊长的影子。"
 POD_patronlore.100.t.560099: "赞助传记：尼俄伯"
 POD_patronlore.100.desc.560099: "尼俄伯大约于公元前14世纪出生在维奥蒂亚的迈锡尼城邦底比斯。尽管我们猜测她可能出身高贵、对艺术或音乐有浓厚的兴趣，但迄今为止，我们对其知之甚少。她和她的尊长“音乐家”安菲翁会面的细节消失在了时间的长河中，然而，从她的外表来看，我们可以估计她在三十岁前就被初拥了。这期间在氏族中相对温和的提升并没有让她为后代留下什么引人注目的事件，因此这一段历史是空白的，直到公元前519年，她在底比斯人和雅典人之间的冲突中离开希腊去了罗马。\n\n在妥芮朵的保护下，她为血族的艺术家提供赞助，似乎没有在氏族或罗马帝国的阴谋中扮演重要角色。公元前509年，她遇到了提图斯·梵卓鲁·卡米拉的客人——塔尼特巴尔·萨哈尔，他将自己的哲学论文《饥渴与满足》中的律条传授给了她，欲国之道即来源于此。从那天起，尼俄伯就积极参与了年轻的罗马共和国的事务，宣扬欲国之道的自由主义价值观，但却遭到了征服之道和天国之道信徒的反对。欲国之道由于其习俗被认为是非道德的而被边缘化，它的追随者被打上了耻辱的印记并被指定为罪人，甚至被批评者们改称为原罪心路。尼俄伯在公元前1世纪末离开罗马前往纳博讷，在那里她恢复了传教活动。\n\n公元10年，她在图卢兹地区建立了一个敌对者之道的教派，以便在南方传播原罪心路的信仰。清洁派诞生时，尼俄伯影响并组织了他们，目的是动摇罗马教会在欧西坦尼亚的统治。在阿比尔派十字军期间，她先是加入了黑之埃丝克拉蒙德的宫廷，帮助她击退了北方的入侵，然后，在反对派的奥克亲王们的支持下，为了自己利益，放逐了埃丝克拉蒙德。尼俄伯加强了她在欧西坦尼亚的影响力，使这个地区皈依了原罪心路，最终实现了她为受压迫的追随者们建立庇护之地的梦想。"
 POD_patronlore.100.t.560104: "赞助传记：海波德"
 POD_patronlore.100.desc.560104: "海波德出生在基辅罗斯的一个传统家庭中，从小就被了灌输对旧神的崇敬。他不是傻子，当他的领主宣布这个国家皈依基督教时，他让变革之风将他带离那里。在经历了无数在当时的凡人中闻名的冒险之后，这位经验丰富的旅行者似乎找到了一个家，作为瓦兰吉卫队的一员服务于拜占庭皇帝。在君士坦丁堡，海波德顽固的原始信仰被人们视为粗鄙野蛮，但不至于像在其他地方一样遭受公开敌视，然而他对旧神的信仰却引起了一种完全不同的关注。他遇到了一个人，这个人告诉他，他家乡的神在这里没有力量……同时，还把他介绍给了这样做的人。他的心智被初拥击碎了，只能紧紧抓住那些提醒他他是谁的碎片，成为了他第二故乡的古代诸神的坚定捍卫者。"
 POD_patronlore.100.t.560106: "赞助传记：康拉多·阿德尔基"
 POD_patronlore.100.desc.560106: "康拉多·阿德尔基在其六百年的亡生中获得并捐赠了大量财富，这些财富大多是通过合法手段获得的，包括艺术品交易、香水制造等，但偶尔也会通过盗墓、走私和其他犯罪活动获得。\n\n有一次，在康拉多亡生的早期，他把“该隐的礼物”免费卖给了那些真正绝望的人，也卖给了那些愿意付钱的人。在潜藏被破坏之前，他的错误被卡利达“纠正”了。妥芮朵奢华的晚会需要资助，而在卡利达看来，康拉多获取财富的天赋上升到了艺术的水平，至少足以弥补他年少轻狂的行为。"
 POD_patronlore.100.t.560105: "赞助传记：维克多"
 POD_patronlore.100.desc.560105: "在他的时代，维克多是一位令人敬畏的俄罗斯将军。作为一个统治者，他虽铁腕专政，但始终尊重他的臣民，因为他向来信守承诺。在他凡人的一生中，他从一个正直的贵族和将军一跃成为一个拥有广阔领域和巨大财富的领主。旁人认为他是一个笃信传统的而自豪的人，但最重要的是，维克托永远重视权力和下属的忠诚。到了迟暮之年，他已经在自己身边培养了一群精锐的家臣，他们被从全国各地征召而来，都是最忠诚的精兵强将；但即使是他们也对他最大的恐惧束手无策，那就是人的衰老和死亡。但他的努力没有白费，当维克多的身体开始衰弱时，一道模糊的人影出现在他面前。作为黑夜的造物，他的微信和对权力的渴望只增不减，因为一个充满机遇的全新世界出现了。\n\n然而，维克托很快就意识到，他现在必须改变自己的策略，不能再站在聚光灯下执政，而是要躲在阴影里。他初拥了他最亲密的下属东山再起，并在这新的领域占据一席之地。一位坚韧不拔的男人——维克多，在亡生中也像凡生一样受到榜样的指引。"
 POD_patronlore.100.t.560044: "赞助传记：达米安·厄利达诺斯"
 POD_patronlore.100.desc.560044: "作为一个同样沉默寡言的船夫的次子，达米安性格孤僻但桀骜不仁。\n\n他既安静又善于观察：一个深刻的思考者；他会从父亲的小船上观察水面，为身后留下的涟漪而着迷，或者和母亲一起仰望星空，因为母亲会指出星星在哪里连接成星座。\n\n尽管满足于想象、自省、对世俗漠不关心，这个年轻人也不会回避巧妙的讽刺和分析批评，在多余的独裁长者面前表达自己的异议，为他赢得了一些勉强的尊重。年轻时身居要职，但离开也毫无野心；他能很快地理解别人的动机和需求，但理解不了他自己。\n\n达米安早在他的生活开始之前就已经厌倦了。\n\n现在，充满着黑暗力量和对更多东西的渴求，他试图寻找自己被初拥背后的真相。\n\n达米安察觉了造就他的怪物的反常交易，被迫在背信弃义的傻瓜们中间默默遵守令人厌倦的、琐碎的政治，他致力于查明自己在此阴谋中所扮演的角色，寻找解除这种幻象般的束缚的方法。\n\n即使现在已死，他仍在寻求一种从出生起就一直遵循的道路的决心。但阻力最小的道路，就像河流一样，只有在抵达大海后才能停下。"
 POD_patronlore.100.t.560107: "赞助传记：艾斯林·恋难舍"
 POD_patronlore.100.desc.560107: "作为一个妖精，艾斯林遭受了恋难舍诅咒，如果她不能从凡人那里偷取足够的梦华，就会迅速衰老。为了摆脱这个诅咒，她精心安排了自己的初拥，以饮鸩止渴。\n\n艾斯林不愿向尊长屈服，于是很快就摆脱了他的监护。她从苏格兰高地摄取食物的头几年，是第一个传说中的芭万·希，或“报丧女妖”。当自学习得如何融入该隐之子社会后，她愉快地接受了这一遗产，以妖精的王庭为蓝本，建立了一个基于扮演这个神秘生物的身份的罪人信仰。"
 POD_patronlore.100.t.560131: "赞助传记：里尼瓦斯"
 POD_patronlore.100.desc.560131: "一个谎言重重的女人，里尼瓦斯的一生始于她被卖为远离家乡的拜占庭帝国的奴隶。她的尊长认为里尼瓦斯的印度术法知识会帮助他们的事业，并发现她是一个特殊的奇货，对于赃物来说过好了。事实正是如此；为了逃避对她原来的魔法导师的债务，里尼瓦斯用一个假名把自己卖给了奴隶主。\n\n一旦这个年轻的后起之秀从她的新恩人那里获得了永生，她就开始了一系列的活动，这将导致她也逃离这片新的土地，只是这样的计划被“退休”的瓦兰吉卫队对她村庄的突袭而打断了。\n\n里尼瓦斯假装成落难的少女，答应了入侵者的要求，并扮演了一个被俘的少女的角色。她和这群战士一起回到了他们的祖国，看看她将如何处理自己的权力基础，远离那些她因永生所欠的债，甚至远离那些她因传法所欠的债。里尼瓦斯终于可以自由地随心所欲地行动了，她被魅力四射的战士们所包围，并脱离了任何导师或债务人的影响，但当她接近世界的北端时，她的旧伎俩可能持续不久了。再有一次背叛，可能就没有地方可逃了。"
 POD_patronlore.100.t.560082: "赞助传记：纳喀索斯"
 POD_patronlore.100.desc.560082: "纳喀索斯出生在古希腊的一个贵族家庭，是河神刻菲索斯和宁芙利里俄珀的儿子。从小，纳喀索斯就以其惊人的美貌和魅力而闻名，吸引了来自四面八方的仰慕者。然而，他也以其傲慢和对那些达不到他高标准美貌和完美的人的蔑视而闻名。\n\n随着年龄的增长，纳喀索斯越来越痴迷于自己的外貌，花数小时在反光的表面欣赏自己，并委托他人雕刻和绘画自己的肖像。他变得越来越孤僻，拒绝与任何他认为不值得他关注的人交往。\n\n一天，纳喀索斯的双胞胎妹妹纳耳喀萨走近他。他们长得一模一样，据说他们的美丽在这片土地上无人能及。纳耳喀索斯在妹妹身上看到了自己的倒影，妹妹也在他身上看到了自己。他们变得形影不离，日夜都在自己创造的世界里度过。\n\n 然而，他们的爱注定无法持久。一天晚上，他们两人被托芮朵吸血鬼找上门，这些吸血鬼被他们独特的美貌所吸引，并提出用永生换取他们的效劳。纳喀索斯和他的妹妹接受了，认为这是获得永恒青春和美丽的方式。\n\n 成为吸血鬼后，纳喀索斯和他的妹妹一如既往地虚荣和自我陶醉。他们继续痴迷于自己的外貌，拒绝与任何他们认为低人一等的人交往。他们还迷上了吸榨的概念，认为这是通过吞噬其他吸血鬼的灵魂来获得更多力量和美丽的方式。\n\n 一天晚上，纳喀索斯和他的妹妹一起外出狩猎时，遇到了一位强大的长者吸血鬼 ，他们决定对其进行吸榨。然而，在此过程中，纳耳喀索斯却转向了他的妹妹，也吞噬了她的灵魂，这是因为他对力量和美丽有着永不满足的渴望。\n\n现在，纳喀索斯独自一人在夜间游荡，对自己对唯一完美反映他自己的人所做的一切感到内疚和懊悔。他被她的记忆所困扰，永远无法完全摆脱自己杀了她的认知。更糟糕的是，每次他照镜子时，都会看到她的脸凝视着他，不断提醒他犯下的可怕行径。然而，他仍然像以前一样虚荣和自我陶醉，继续痴迷于自己的外貌，并在永无止境地追求力量和美丽的道路上寻找其他吸血鬼进行吸榨。"
 POD_patronlore.100.t.560189: "赞助传记：守愚"
 POD_patronlore.100.desc.560189: "当内战撕裂中土，将中原王朝分裂为三国，巫龙与阿卡夏兄弟势如水火激烈对峙之时，一位仁慈的君王如流星般闪耀于北方大地。自称天王的独立法师苻坚，于远离战火的北境开辟出一方天国。然而，盛世未能久长，天国终被巫龙撕裂瓦解。\n\n当苻坚被时光遗忘后，一位新的天王以仙人之姿重返中土，携带着与天王身份相符的至善至勇，誓将华夏黎民从苦难中拯救而出。"
 POD_patronlore.100.t.560202: "赞助传记：阿拉维因"
 POD_patronlore.100.desc.560202: "阿拉维因由一位丹麦劫掠者船长和他的妾所生，她的凡生大部分时间都在海上度过。在她孤僻的孩提时代，便展现出施展怪异而神秘的亡灵仪式的天赋，她保守着这个秘密，偷偷地用她父亲掠夺行动的受害者的尸体来研习她的“艺术”。在青少年时期，她遇到了卡帕多西亚氏族吸血鬼蕾蒙德·罗素·雅弗，后者发觉了这个年轻女孩的才华，并决定密切关注她。多年后，当她父亲丧生于一场失败的劫掠，蕾蒙德决定是时候初拥阿拉维了。阿拉维迅速适应了她作为血族的新生活，精进着亡灵术师的技艺，并追随她父亲的脚步，领导着一支由血仆、死灵和其他吸血鬼组成的劫掠者团体。"
 POD_patronlore.100.t.560200: "赞助传记：阿德拉西斯"
 POD_patronlore.100.desc.560200: "在新月低悬之时，在文明那盘绕的巨蛇之间，一名男孩诞生了。作为卑微贵族的后裔，覆鳞之子阿德拉西斯被秘密藏匿。他成长于阴影之中，展现出对秘术的非凡天赋。身上那显眼的鳞片是家族的禁忌，也使他备受孤立。青春期临近时，黑暗在他内心滋生。十七岁那年，他逃离禁锢，带走了家族大部分财富。随后五年间，他挥霍无度，放纵欲望，最终北上进入欧洲荒野。\n\n或许是出于怜悯，或是轻蔑，抑或别的缘由，他在一轮血红之月下被初拥。接下来的一个世纪，他在尊长的庇护下如海绵般吸收知识。公元前490年，阿德拉西斯厌倦了尊长的桎梏，他巧妙骗过同族，南逃马拉松，却卷入一场激战。马拉松之战后，他游历希腊城邦，化身智者，通过混淆术迷惑权贵。最终他东行至印度，参与了孔雀王朝的崛起。他潜心研读众多宗教与哲学典籍，甚至短暂追寻扫罗曾经的秘术。当他被[Glossary('饿殍','game_concept_kuei_jin_desc')]斩断一腿后便放弃了这条路——这道伤口永难愈合，迫使他陷入蛰眠，直至公元12年。这段时间里，血仆将他西迁，安葬于黎凡特。公元19年，他开始前往黎巴嫩，吸取更多“不凡”的知识。\n\n厌倦了罗马的纷乱，他再次东返印度，漫游至312年。阿德拉西斯曾与那位致他残疾的[Glossary('万鬼','game_concept_kuei_jin_desc')]激战，传说鏖战十四夜，结果成谜。只知他南逃斯里兰卡，向迦𫄨里璃献上血缚换取庇护，安身于宝石之城拉特纳普勒。此后他重返血族政治，血缚之力或已消散，或已松解。\n\n而今，宏图大计正待启航——毕竟，印度这块肥美之地，正待他人染指。"
 POD_patronlore.100.t.560197: "赞助传记：纳菲萨"
 POD_patronlore.100.desc.560197: "纳菲莎出生于贝都因部族，体内流淌着妖精血脉，这表现为她异乎寻常的漫长寿命与背脊上生长的鸦翼。她被族人奉为变革之灵崇拜——尽管她很少以灵赋回报这份尊崇。降生数百年后，纳菲莎默记了新兴宗教伊斯兰教的圣典《古兰经》，自此被尊称为哈菲兹。\n\n虽名义上归属于某个伟大氏族，却始终游离于其外，这位“羽翼元素使”被传说为对抗一神论及超自然生灵教条化敌意的强悍战士。"
 POD_patronlore.100.t.560201: "赞助传记：爱伦·达克威尔"
 POD_patronlore.100.desc.560201: "爱伦·达克是一位英勇的战士，于648年被勒森魃氏族初拥。凭借对阴影的精妙掌控，他在中世纪欧洲的战场上迅速崭露头角。1066年，他暗中操纵诺曼征服的局势，改变了英格兰的权力格局。12世纪，他的影响力延伸至十字军东征，他利用战争的混乱巩固氏族的地位，并借圣战之名铲除对手。如今，在1250年的法兰西，他是一位隐匿的“影子国王”，其名在欧洲宫廷中被敬畏地低语，他的黑暗遗产仍在塑造国家的命运。"
 POD_patronlore.100.t.560196: "赞助传记：西尔文·阿普·索雷尔"
 POD_patronlore.100.desc.560196: "在瓦讷的街头，一位年轻的布列塔尼贵族过着悠闲的生活。他纵情宴饮，斗殴欺瞒，肆意妄为。\n\n尽管劣迹斑斑，他却深爱着自己的弟弟，早年共度的艰难岁月让他们的关系坚不可摧。然而他终究无法阻止命运的洪流。不祥的征兆随着黑夜降临——从诡谲暗影到枯竭的尸骸。恐怖肆虐，死亡接踵而至。他们的领地、子民与故土尽数湮灭。\n\n他失去了一切。正当漫无目的徘徊时，他在收复耶路撒冷的平民十字军中找到了方向。他笃定：既然邪祟能肆虐瓦讷，必也是神的敌人。\n\n那是一场血腥屠戮，而他战斗至最后一刻。某位佣兵团长被其坚毅打动，赐予他新生——经由拥抱成为布鲁赫氏族的成员。\n\n自此，西尔文投身“盗火者”的事业。尊长察觉到他潜藏的天赋，将其锤炼成技艺精湛的决斗家。他负责监管炼火小组，肃清内外威胁。\n\n随着身后尸骸渐成轨迹，这位所谓的“行刑官”日渐醒悟。他最终抽身离去，开始追寻属于自己的命运。\n\n但旧债未偿。瓦讷的血案与弟弟的死，必须讨回公道。棘秘魑的子嗣，终将付出代价。"
 POD_patronlore.100.t.560192: "赞助传记：加莱里娅"
 POD_patronlore.100.desc.560192: "她出生于970年，父母皆为妖精，后被一位吸血鬼学者收养。尽管她的父母早逝，且她的超自然特质直到很晚才显现，但她毕生致力于研究其他超自然生物。她的族人大多以为她只是一个比凡人更孱弱的孩子。"
 POD_patronlore.100.t.560108: "赞助传记：瓦卢克"
 POD_patronlore.100.desc.560108: "626年阿瓦尔人攻占君士坦丁堡的企图失败后，他们转而向西进发，袭击了阿尔卑斯斯拉夫人定居的领土。各部族在新首领瓦卢克的领导下联合起来，击退了阿瓦尔人，并建立了卡兰塔尼亚公国。\n\n随着时间推移，瓦卢克的声望与日俱增，其公正而坚定的统治传入了梵卓氏族的耳中，他们将其吸纳进氏族。统治数十年后，瓦卢克卸任职务，转而于暗影中指引着他子民的命运。他按照自己的理念塑造他们，确保他们在各方外来势力统治下延续生存。\n\n未来命运：\n\n瓦卢克将继续引领他的人民度过二十世纪的关键岁月。当他在那个时代的最后几年实现了确保卡兰塔尼亚成为主权国家的追求后，便再度将统治权交予其凡俗仆从手中。有人说这位年长的亲王如今正全心投入践行他另一项凡俗炽情——建筑艺术。"
 POD_patronlore.100.t.560130: "赞助传记：阿提库斯"
 POD_patronlore.100.desc.560130: "一名古罗马帝国的前奴隶，生于三世纪末，自出生起便是奴隶，其人名为阿提库斯。作为希腊人且隶属于一位贵族，他自幼接受军事方面的良好教育。阿提库斯逐渐成长为体魄强健、意志坚定且思维敏锐的人。他始终展现出卓越的战斗天赋，充满求知欲，坚持训练与阅读。正是因阅读某部禁书，他的背部留下了鞭痕。十二岁时，他被卖给一位角斗士训练师。在竞技场训练期间，他仍不断寻求提升学识，最终成为训练营中最出色的奴隶角斗士之一。\n\n他在竞技场赢取了全部十六场战斗。获准若加入军团服役便可换取“自由”后，他被投入前线，表现惊人，甚至在几场战役中成为决胜关键。服役三年后，他的训练师要求他进行最后一场角斗，阿提库斯再度胜出。当夜他前去与训练师商议换取自由时遭遇伏击被刺伤。一道身影自暗处显现，问他最渴望什么——自由、复仇还是死亡。他当即接受提议，饮下对方的血液治愈伤势，并得知训练师正是派遣刺客的元凶。后来他知晓救命恩人名为卡洛托斯。这位主宰者已观察他多时。当夜阿提库斯手刃训练师，随后接受长达十年的该隐派社会教化。最终卡洛托斯认定其价值，将他转变为血族。此后阿提库斯多数时光皆在磨砺技艺与学识，始终四处漂泊。"
 POD_patronlore.100.t.560129: "赞助传记：苏莱曼·伊本·阿鲁阿"
 POD_patronlore.100.desc.560129: "苏莱曼生前曾是一艘在地中海劫掠的海盗船船员。他出生于贝鲁特，年少时作为船童加入了名为“阿鲁阿号”的船只。在这艘船上，苏莱曼参与了抢劫、掠夺与海战，短短数年就从船童成长为船队核心成员。\n\n他将这艘船视作唯一的家，将船员当作仅有的亲人。当哈里发奥斯曼抵达叙利亚时，为苏莱曼展现了新的图景，他随全体船员皈依了新信仰，开始为守护新信仰而劫杀敌人。\n\n但他的声名引起了注意——伊斯兰扩张势力中的吸血鬼派系企图掌控海域，认为招揽苏莱曼将有助于对抗拜占庭。\n\n某夜“阿鲁阿号”遭遇突袭，船体损毁，船员尽数罹难，苏莱曼身负重伤。弥留之际，某个存在与他立下契约：以不朽生命换取他守护真信与吸血鬼社会的才能。他接受了契约，自此巡游四海守护信仰。"
 POD_patronlore.100.t.560136: "赞助传记：安贝萨"
 POD_patronlore.100.desc.560136: "生前只是一介普通商人的安贝萨在夜间遭遇袭击，被弃之等死。次日黄昏苏醒时，她失去了心跳，也遗忘了遭遇的真相。数十年来，她逐渐理解了自身状态的本质，并运用那位未曾谋面的尊长赋予的力量，夺取了这片山峦之地的控制权。\n\n许多血族会蔑视劣族对权力的宣称，但他们往往被血脉传承的执念蒙蔽了双眼。在东非，该隐、赛特与吒婆多修罗的后裔们为血统争执不休。这些争斗者都遗忘了一个事实：力量并非源自世系，而在于血液本身——而安贝萨决心攫取尽可能多的力量。"
 POD_patronlore.100.t.560138: "赞助传记：阿尔慕林"
 POD_patronlore.100.desc.560138: "阿尔慕林，她已抛弃了真实姓名，是一名战士兼学者，更是圣地坚定的守护者。她出生于麦加，父亲是商队的领袖，常年往返于阿尤布苏丹国的埃及地区谋生。她的长兄是一名技艺高超的剑客，担任商队的护卫首领。正是在他的夜间教导下（经过多次恳求），阿尔·穆阿利姆学会了剑术与格斗技巧。\n\n直到一个决定性的夜晚，一群十字军袭击了商队过夜的村庄，屠戮村民并将村庄焚为灰烬。阿尔·穆阿利姆在伏击袭击者时身受致命伤，但被一名血族救下并接受了初拥。从此，她抛弃了过去的名字与人生，成为一柄无名之刃，专门对抗十字军及其不死者同伙，尤其擅长非对称作战。随着时间的推移，凭借出色的技巧与能力，她开始指导其他稚子如何策划伏击与战斗。"
 POD_patronlore.100.t.560144: "赞助传记：罗莎莉"
 POD_patronlore.100.desc.560144: "当罗莎莉的尊长初次见到她时，她以为这个整日沉睡、任由仆人摆布的贵族千金会成为温顺乖巧的子嗣。然而岁月流转，她看着这个新玩物如何吸引周围所有人的目光，很快变得比皇室公主还要傲慢。罗莎莉知道尊长对她的看法，但这无关紧要，一切都不重要。不久后，仆人们都将她视为主人，推翻那个轻视她的尊长变得轻而易举。她对此感到厌倦，无论得到多少关注，似乎永远无法满足。于是她开始周游世界，寻找那些只存在于故事中的不可企及之物。\n\n在法国巴黎的繁华盛景中，她终于找到了追寻已久的东西。一位公主，一个让她想起自己的幽灵般的存在，被家人和周围所有人憎恨的可怜人。她怜悯这个女孩，隐匿在众多朝臣中保护她的安全。但好景不长，在女孩第十七个寒冬时，悲剧降临。长期困扰她的疾病突然恶化，无药可医。深夜，唯一的救世主悄然将垂死的孩子带出宫殿，奔向自由。\n\n然而，就在她感到圆满之际，新的缺失又浮现了。没有王国的公主算什么？于是，罗莎莉蛰伏多年，积蓄力量，或许有朝一日，两人能率领忠诚的军队重返法兰西故土。"
 POD_patronlore.100.t.560150: "赞助传记：哈尔铎"
 POD_patronlore.100.desc.560150: "生前，他是来自丹麦的雷神索尔信徒，曾加入巴格塞克国王的军队，参与维京人对英格兰的征服。871年，他在阿什当战役中阵亡，但被奥丁的瓦尔基里选中成为英灵战士之一。不过，他后来发现自己更青睐约顿巨人的行事之道。"
 POD_patronlore.100.t.560152: "赞助传记：拜丘"
 POD_patronlore.100.desc.560152: "拜丘曾是一名萨洛比血族，因该地区巴力势力的崛起而来到君士坦丁堡守护这座城市。他被米迦勒及其理想所打动，通过暗中猎杀城内及周边地区的巴力来支持这一梦想。米迦勒遭啖魂后，拜丘深受打击，认为米迦勒的彻底消亡自己难辞其咎。如今，他隐居马耳他，因怀疑自己已无力对抗巴力而陷入消沉。"
 POD_patronlore.100.t.560163: "赞助传记：丹尼尔"
 POD_patronlore.100.desc.560163: "丹尼尔生前身份复杂，既是流浪者、赌徒，也是酒鬼……但他总带着一种古怪的求知欲。他自学识字，曾为书籍或民俗传说残卷与人赌斗，甚至以十年效忠为赌注换取阅读某位领主藏书的机会。他赢了，但在数日研读与交谈后，领主邀请他协助一项秘密计划——那竟是一场与巴力氏族相关的恶魔仪式。仪式失败后，丹尼尔狂奔逃命，很快被密特拉麾下的一名末卡维发现。意识到自己难逃一死，丹尼尔提出最后一局赌局，以性命为注。此举逗乐了那位末卡维之子，当他险胜时，对方给出选择：在极乐中被吸干而死、成为血仆，或成为末卡维的一员。自那夜起，丹尼尔继续游荡人间，常化身为与运气相关的精灵或神祇别名，用搜集的知识与财宝诱惑凡人。最近在德国，一场失控的赌局让他犯下啖魂之罪，吞噬了另一名末卡维。此事潜藏的机遇与后果，正困扰着他。"
 POD_patronlore.100.t.560169: "赞助传记：涅费赫普鲁"
 POD_patronlore.100.desc.560169: "涅费赫普鲁刚从两千余年的蛰眠中苏醒，对青铜与诸神时代的战术在今日全然失效。他仍如青年时那般效忠黄金荷鲁斯，坚称自己生于其母哈特谢普苏特统治时期。然而史书记载，哈特谢普苏特之子图特摩斯·涅弗尔克佩鲁活至五十余岁，使得他的真实来历成谜。其他贤荷鲁成员只确信：这位金肤战士虔诚而狂热，正竭力了解这个陌生的新时代。"
 POD_patronlore.100.t.560174: "赞助传记：斯蒂芬·高文"
 POD_patronlore.100.desc.560174: "斯蒂芬·高文曾以一名盎格鲁-诺曼雇佣兵领袖的身份加入瓦兰吉卫队，并迅速晋升为帝国在随后战争中最为重要的将领之一。高文毫无原则和怜悯的战略使他被君士坦丁堡市民比作「贪狼」卢塞尔·德·白里乌尔。尽管高文试图证明自己的忠诚，但帝国的权贵——甚至可能包括皇帝阿莱克修斯一世本人都对此大为怀疑。尽管拜占庭帝国拒绝给予他信任，但贝利撒留最终承认了高文的忠诚，并让他认识到了痛苦，最终于1119年初给予了他初拥。\n\n在他的凡生当中，高文一直保持着忠诚，并使用专属于他的狡猾且残忍的战术确保自己作为锡诺普/庞培波利斯亲王的地位，并暗中协助帝国军队击退任何入侵的敌人，直到残忍的十字军摧毁了拜占庭帝国和血族之梦。\n\n在他的军旅生涯中，高文与帝国长公主安娜·科穆宁发展了一段地下恋情，但他因忠诚而未参与进长公主推翻她兄弟约翰的阴谋当中。在长公主接受初拥之后，高文成为了她在幻梦中的坚定支持者。然而，高文很快发现安娜不再是他曾经深爱的那个女人，充其量只是一个狡诈而恶毒的残影。如今斯蒂芬·高文终日生活在煎熬痛苦中，希望他的爱人能够再次成为那个他爱的人。"
 POD_patronlore.100.t.560176: "赞助传记：韦列斯"
 POD_patronlore.100.desc.560176: "他曾是当地领主麾下的骑兵，因未婚妻选择了一位年轻贵族而勃然大怒，策划了一场灭门惨案。他安排了一场宴会，所有宾客都葬身火海。不久后，他意外被一位该隐之子初拥——他并不知道其中一位宾客正是血族。他的计划天衣无缝，甚至用沉重的马车堵住出口，确保无人逃脱。代价是他必须永远效忠于尊长。\n\n他是氏族中阴影的化身，内心充满污秽，却因此让尊长对他青睐有加。他沉迷于啖魂，以此喂养内心深处永恒的黑暗。有时，他会哀叹自己将唯一的爱人烧死在那场本只为仇敌准备的烈火中，陷入忧郁的癫狂。几个世纪过去，他对死亡逐渐麻木，却始终对恋人与影魔心怀柔软。"
 POD_patronlore.100.t.560183: "赞助传记：索菲娅·卢皮埃萨"
 POD_patronlore.100.desc.560183: "生于波兰小贵族之家，父母皆是精于算计的冷漠之人，唯汲汲于提升贵族地位。索菲娅以美貌与才智闻名，年少时便被父亲嫁与邻地领主以巩固联盟，然其独立天性难容于夫家期许，在丈夫的过度关注下日渐焦躁。丈夫遂对她施加身心摧残，使她迅速沾染了双方家族最恶劣的品性。忍无可忍之下，她引诱一名年轻侍从谋害领主，继而向官府告发此人以掩盖自己潜逃。殊不知这一切早已被更危险的观察者尽收眼底。\n\n被彻头彻尾的施虐者赫德翁·雅罗斯拉维奇捕获并初拥后，索菲娅侥幸存活。她对易变术的浓厚兴趣或许使其免于成为赫德翁的下一个实验品，抑或是因其狡诈残暴足以转移注意而未被血缚。认定远离尊长与其阴谋方为上策，索菲娅独自踏上征途，誓以魅惑、诡计与赤裸杀戮习得万千异能。"
 POD_patronlore.100.t.560184: "赞助传记：伍麦叶"
 POD_patronlore.100.desc.560184: "伍麦叶是古莱什（麦加）中伍麦叶氏族的始祖，该氏族在伊斯兰教兴起之前便已建立。他在二十多岁时、伊斯兰教兴起前被拥抱，但听到先知在古莱什周围受迫害的穆斯林中所传达的言论后深受启发，在先知开始传教后数周内便皈依了伊斯兰教。此后，他协助穆斯林从麦加迁徙，在麦地那建立统治，并在早期与伊斯兰之敌的战斗中助其取得胜利。\n\n伍麦叶暗中支持他的家族，使其得以统治穆斯林世界一百年，并在安达卢斯又延续了两百年，之后他进入了蛰眠状态。他直接协助了即将成为安达卢斯首位统治者的阿卜杜勒·拉赫曼，助其躲避阿拔斯王朝的怒火。\n\n当伍麦叶的王朝在科尔多瓦失势时，他正处于蛰眠中。他自愿进入蛰眠的原因仍是个谜；然而，一些血族推测这可能是因为伍麦叶家族抛弃了贝都因传统，最终转向了更为享乐的生活方式。\n\n他最近于12世纪被“安达卢斯之剑”巴德尔女王唤醒。她请求他协助保卫安达卢斯，他誓言在带领家族残余中他认为值得的人返回麦加后会援助她。抵达麦加后，得知哀嚎的严重性已减弱，他决定进行朝觐。自那时起，他一直与塔里克公爵共同统治，在代替他管理塔伊夫城方面证明了其无可估量的价值。迄今为止，他仍未返回安达卢斯援助巴德尔女王，因此人们称他为背誓者。"
 POD_patronlore.100.t.560186: "赞助传记：塞巴蒂安·克拉根"
 POD_patronlore.100.desc.560186: "塞巴斯蒂安娜起源于中亚，在漫长的岁月中，她对永生的生活感到厌倦，认为这种无尽的生命毫无意义。\n\n在14世纪中叶引发“庇护战争”的动荡事件中，她遇到了一位名叫塔莉·伯林格的年轻犹太人类仆从。两人秘密相爱并维持了两年的关系，直塞巴斯蒂安娜发现塔莉死在他的房间里，血液被吸干。这让他陷入狂暴，杀死了视线范围内的所有血仆和吸血鬼，甚至对自己的家族大开杀戒，无论他们是否无辜。只有人类仆从幸免于难，但他们亲眼目睹了这场血腥屠杀，心灵受到严重创伤。狂暴结束后，塞巴斯蒂安回到塔莉的尸体旁，发誓要杀光所有不死生物，最后再结束自己的生命。\n\n他骑马离开家族庄园，冲进丹滕库尔城，向全城揭露了吸血鬼的存在，并宣布发动“背誓者圣战”，赢得了农民、商人和贵族的支持。后来，他与一群宣布新信仰“该隐拒斥者”的法官会面，克拉根等人加入了他的猎杀行动，誓言屠尽不死生物后再自我了断。他们相信塞巴斯蒂安是耶和华派来的半神，任务是夺回凡世。任务完成后，他们将自我终结，投入耶和华的怀抱——至少他们如此坚信。"
 POD_patronlore.100.t.560187: "赞助传记：索尼娅·哈拉尔德"
 POD_patronlore.100.desc.560187: "索尼娅大约在929年出生于寒冷的诺德马克，她很快意识到自己的未来在别处。她总是梦想着冒险，对家务或数字从不感兴趣，但对剑却有着深刻的理解。在对抗挪威和丹麦的掠夺者中证明自己后，她成为当地雅尔手下的盾女。但这还不够。黄金稀缺，而她总是把每一分钱都花在新衣服、武器或与同伴的狂欢上。\n\n一天，来自希腊的使者带来了消息。皇帝君士坦丁正在招募勇士加入所谓的“瓦兰吉卫队”，承诺丰厚的黄金与荣耀。于是，她与其他渴望冒险的人一同启程，抛下了一切。拜占庭宫廷是一个全新的世界，与诺德马克截然不同。在奇迹之城君士坦丁堡的街头，她发现了新的语言、习俗、享乐方式，以及挥霍黄金的新途径。\n\n949年，一场针对克里特埃米尔国的大规模远征开始了，包括索尼娅在内的数百名瓦兰吉战士参战。然而，无能的指挥官君士坦丁·贡吉勒斯导致他们在一场灾难性的战斗中惨败，只有少数人活着回到君士坦丁堡。失望与厌倦让她陷入了自我毁灭的循环，酗酒与流连妓院成了常态。\n\n直到某个夜晚，她遇到了一位与众不同的女子。这位女子并非妓女，也不求钱财，而是向她提出了一个提议——永恒的生命、永远的青春，更重要的是，一个永远证明自己的机会。自那夜被初拥后，索尼娅为许多不同的领主征战，从耶路撒冷的荒漠到高加索的战场，她始终在追寻荣耀。还有黄金。"
 POD_patronlore.100.t.560188: "赞助传记：山鸦"
 POD_patronlore.100.desc.560188: "一位疯狂的萨满，使用某种术法强迫某睿魔尔指导并初拥了他。没有人知道他的真名，但他身边总有红嘴山鸦相伴。"
 POD_patronlore.100.t.560190: "赞助传记：本笃"
 POD_patronlore.100.desc.560190: "一位不知名的凯尔特战士之子，曾参与多次反抗罗马入侵的起义。伤痕累累的他最终被那些他誓要驱逐的敌人所拥吮。几个世纪过去，他的复仇之心仍未熄灭。他有许多名字，如今自称本笃，从不提及过去——毕竟，认识他前世的人早已逝去。或许他的尊长仍在某处……徘徊。"
 POD_patronlore.100.t.560228: "赞助传记：雅库布"
 POD_patronlore.100.desc.560228: "雅库布的整个凡俗人生都因其外貌而饱受嘲笑。村民们都认为他被恶魔侵蚀，是上天降给村庄的诅咒。雅库布被驱逐到村庄外围的茅屋中生活，处于冥秩的最底层。孩子们常把“诛杀心兽”当作游戏，在他出门收割庄稼时纵火烧屋或投掷石块。某夜雅库布正欲就寝，忽闻屋内传来吱呀声响。惊惶中他拽住闯入者猛撞桌沿，直至其不再动弹。当他把那张脸凑近烛光时，骇然发现这正是常来骚扰的孩童之一。\n\n他终究成了众人眼中的嗜血心兽，在悲愤交加中逃离家园，深知自己将遭追捕。那夜雅库布露宿荒野，却被利齿刺入躯体的剧痛惊醒。虚弱感逐渐转化为蓬勃力量，起身时他感知到神祇的遴选。面前匍匐着衰弱疲惫的异形生物，雅库布吞噬了那个存在，随即返回村庄让昔日迫害者尝受同等命运。此刻他顿悟使命：要成为神明，这变异并非诅咒而是灵赋，他将缔造与自己同源的超凡种族。怀揣此念的雅库布开始巡游世间，不断制造扭曲造物来满足成神妄念。"
 POD_patronlore.100.t.560226: "赞助传记：“牛头怪”阿斯忒里翁"
 POD_patronlore.100.desc.560226: "阿勒颇的“牛头怪”阿斯忒里翁于公元前765年诞生在克里特岛。他是帕西法厄（当时国王米诺斯的王后）的私生子。为了保守孩子生父身份的秘密，她与恶魔达成交易，改变孩子的外貌，使其无法被认出。但她未曾料到的是，婴孩阿斯忒里翁出生时竟长着酷似公牛的犄角，这正应验了恶魔的承诺：无人能知其父是谁。阿斯忒里翁随后被投入克诺索斯宫殿下方的迷宫。在那里，他唯一的食物来源竟是那些被送入迷宫刺杀他的人类。直到他出生20年后，摩洛教团的女侍主“秘法之主”泰贝莎才听闻关于“米诺斯之牛”的传说。她后来向希腊英雄忒修斯编造了阿斯忒里翁死亡的故事，并于公元前745年对他进行了“初拥”。作为他的尊长，塔尼特·摩洛钦帮助他逃离迷宫，流亡至阿勒颇。自此，阿斯忒里翁便忠心耿耿地效命于他的解救者。在克里特岛之外的岁月，让阿斯忒里翁变得对人类充满怨毒与忿怒。"
 POD_patronlore.100.t.560225: "赞助传记：安东·冯·莱卡恩"
 POD_patronlore.100.desc.560225: "安东·冯·莱卡恩自幼目睹封建制度下压迫性附庸关系的恶果，既无望超越家族阶层，又不得不忍受极端贫困。他很快意识到，宣扬社会变革只会招致暴力镇压与嘲弄——毕竟领主们永远自诩英明。就在他即将认命接受农奴生涯之际，一位途经的无政府主义吸血鬼注意到了这个对权威毫无畏惧、始终致力于改善人类处境的青年，恰与自身理念不谋而合。正是这种对不公律法的蔑视促使该血族擅自初拥了安东，随后即因未经许可的初拥行为被当地血族执法官处决。\n\n如今，苏醒在这黑暗世界中的安东既无引路人又身负诅咒，却依然秉持初心：他利用在这新世界获得的短暂时光研习各类超自然学识，终于找到全新使命——引领凡人與超自然生命共同超越桎梏，为众生启迪智慧。在他眼中人类与超自然生灵同等重要，即便需要动用武力，他也誓要将这愿景广布世间，特别是针对途中可能遭遇的那些“传统”吸血鬼。"
 POD_patronlore.100.t.560216: "赞助传记：格里戈里"
 POD_patronlore.100.desc.560216: "格里戈里是格鲁吉亚一名小贵族的次子，接受了神学、医学和历史教育，并学习了希腊语与拉丁语，为成为修道士做准备。他勤勉好学却始终疏离孤僻，但沉稳的举止仍深受同侪喜爱。后来他引起了卡帕多西亚族的安德烈亚斯的注意，这位尊长看中年轻学者的巨大潜力，很快赐予了他初拥。\n\n格里戈里迅速适应了吸血鬼本性，不仅达到尊长的期许，更对亡灵术展现出即时兴趣。然而安德烈亚斯被炽烈爱意蒙蔽双眼，未能察觉子嗣体内潜伏的怪物——格里戈里真正热衷的唯有他人苦痛。加入死亡氏族不过是为更自由宣泄本性，享受生者与亡者的哀嚎。他始终维持着温顺子嗣的表象，精研吸血鬼社会法则，直至某日知晓了啖魂之术。\n\n这个能永久囚禁受折磨灵魂的概念令他瞬间痴迷，由此开始筹谋。让安德烈亚斯陷入脆弱境地并非难事：尊长早已全然信任他，而格里戈里深谙其炽情，阴谋家只需佯装回应这份情感。一月后罪行得逞，格里高利完美掩饰罪责，在意识中细品尊长的煎熬。为远离氏族同僚，他如今效忠于布鲁赫族的赫莱娃，在阿尔巴农积攒权势，为自己圈禁了大批可供折磨的猎物。"
 POD_patronlore.100.t.560214: "赞助传记：加列特"
 POD_patronlore.100.desc.560214: "在战斗中留下伤痕的加列特是一位来自德国的战士。当一位来自希腊的死灵术士吸血鬼盯上他时，他正深陷德国部落间的纷争。目睹加勒特无畏地冲入敌阵与日耳曼部落交战，那位吸血鬼亲王决定将他初拥，因为他在这群混战的部落中展现出了非凡的战斗天赋。\n\n亲王并未察觉，加列特的能力其实源自某种增强战斗技巧的药物。尽管如此，吸血鬼仍认为他有潜力成为忠实的护卫。转化后，加勒特的心智逐渐陷入疯狂，沉溺于死亡与死灵术的领域，并从古希腊历史、德鲁伊知识以及与亡者的交流中汲取灵感。关于德鲁伊和许珀耳玻瑞亚岛的凡人历史记载声称，他们早已消失无踪。\n\n加列特对知识的渴望与他的战斗技艺不相上下，这使他和吸血鬼主人之间形成了一种复杂的关系。尽管履行着护卫的职责，但他永无止境的好奇心驱使他探索重生与复仇的奥秘，并追随冥界诸神——狄俄尼索斯、赫卡忒、哈迪斯和倪克斯。\n\n对政治与外交毫无兴趣的加勒特，唯一专注的是磨砺自己作为战士与亡灵术的技艺，挥舞着他在日耳曼战争中声名远扬的长矛。作为吸血鬼领主的忠诚护卫，他曾轻挥手臂，以长矛为屏障，轻松斩杀敌人，展现出令人畏惧的力量。\n\n然而，命运弄人，吸血鬼领主离奇身亡，加列特站在了人生的十字路口。是寻找新的主人，还是抓住机会，以死灵大师的身份开辟自己的道路，用力量在这世上建立自己的势力？加勒特的未来，将是一场关于权力、野心，以及奴役与自主永恒斗争的故事。"
 POD_patronlore.100.t.560211: "赞助传记：白长希"
 POD_patronlore.100.desc.560211: "白长希曾是东汉的一名史官。董卓火烧洛阳时，他为保护藏书而惨遭杀害。\n\n魂归中原后，他只愿为家国尽绵薄之力。然烽火未熄，汉祚倾覆，千里尸山，万民遭屠，汉民甚至被蛮族生食。他眼睁睁看着这一切，却无力阻止。\n\n后来，他隐于一片竹林之中，与几位凡俗友人日日对酌，似已淡忘尘世诸事。然知情者皆明白，经历世变之后，他性情大变，神志错乱，早已不复当年之人。"
 POD_patronlore.100.t.560229: "赞助传记：色诺·阿美"
 POD_patronlore.100.desc.560229: "未被祝福的混血，暴行催生的残渣，混沌的空壳。\n\n色诺·阿美始终在寻找自己的生存之道。\n\n他既非因血之罪而生，亦不为士使命所容，唯有通过献祭双眼、追随正道而获得的真信，才能成为真正的支柱……抑或这只是神明的嘲弄？\n\n#glow_color:{1,0,0,1} 唯有在真信之中，他才能寻得归途。\n\n他将以每一滴鲜血传播真理。\n\n#!"
 POD_patronlore.100.t.793052: "开发者传记：英格丽德"
 POD_patronlore.100.desc.793052: "“该角色由我们的开发者创作，并非$pod_wod$的官方内容。\n英格丽德并未选择这种生活，而是生活选择了她。\n她出生在瑞典北部的一个小村庄，从小被当作男孩抚养，尽管她内心厌恶这种生活方式，但仍扮演着被赋予的角色。在她的生活中，无数事情接连出错，仿佛生活本身在不断考验她，而一切变得越来越地狱般艰难。直到有一天，她的村庄背叛了她，将她驱逐出去——她私密的想法不知为何被刻在树上公之于众。她被扔进荒野，但她拒绝死亡，而是试图活下去。不幸的是，这引起了那个设计她苦难的‘建筑师’的注意，对方试图将她拥吮，将其视为过去20年精心打造的‘地狱宠物’。然而，当英格丽德感到血液即将流尽时，一道红光笼罩了她的杀手，她的唇间尝到了不可思议的美味铁锈味——这拒绝了她杀手的诅咒，反而赋予了她芙蕾雅的灵赋。\n那已是许久以前的事了。时至今日，英格丽德仍忠于她的尊长阿迪萨的使命，在夜晚搜寻其他需要帮助的女性。如果她必须成为一个血染的救赎者，那就这样吧。毕竟，她是阿迪萨的子嗣。”"
 POD_patronlore.100.t.560235: "赞助传记：乔拉夫"
 POD_patronlore.100.desc.560235: "乔拉夫天生患有白化病，苍白皮肤的他曾在大学研究中逃避世俗。某个夜晚，这位孤僻的学生目睹他的教授正在吸食一名同学的血。那位不死学者转身袭击了他，并夺走了他的生命。然而命运弄人，乔拉夫从死亡中苏醒，成为了一名吸血鬼。\n\n他是被自己的尊长——那位教授——意外转化的，只因目睹了对方捕食学生的场景。"
 POD_patronlore.100.t.560237: "赞助传记：米哈伊"
 POD_patronlore.100.desc.560237: "一位罗马尼亚农民，因库曼人的袭击而南逃至拜占庭统治的领土。他在一位拜占庭贵族手下学会了读写，并因其对古代知识的渴望以及对希腊文学与哲学的无尽追求而被初拥。\n\n他对知识的渴求源于库曼人焚毁村庄时他所感受到的无助，但他并不憎恨他们，仅将其视为这个破碎世界的症状——一个需要由哲人王重塑为理性的世界。\n\n他的主要优势在于吸收知识的速度与热情，但他并非出色的谋略家，也不擅长与人相处。\n\n他沉默寡言，善于保守秘密，因此在谋划方面略有心得，但尚未真正参与任何阴谋。\n\n由于将所有精力投入知识而忽视其他，他的身体相当孱弱。\n\n他不易动怒，也不记仇，但容易高估自己的重要性，将自身安危置于他人之上。不过，他并非冷酷无情之人，除非万不得已，否则不会无端伤害或背叛亲近之人。简而言之，他是一个务实而淡漠的人，虽认识到合作的必要性，但最终仍以自己的目标为重。\n\n作为该隐世界的新成员，他专注于学习与提升力量，同时在这片军督领的纷争中谨慎前行。"
 POD_patronlore.100.t.560238: "赞助传记：赞塔娜"
 POD_patronlore.100.desc.560238: "赞塔娜在第一批北欧海盗抵达马恩岛时被初拥了。她认为他们是来自末日的战士——诸神黄昏。末卡维的诅咒强化了这一信念。"
 POD_patronlore.100.t.560239: "赞助传记：英格丽德"
 POD_patronlore.100.desc.560239: "生前，英格丽德被派往瓦兰吉卫队，但她拒绝成为一名士兵，转而开始担任军需官的职务。后来，她被初拥为棘秘魑氏族的成员，如今追求着完美的境界。"
 POD_patronlore.100.t.560241: "赞助传记：奥拉兹"
 POD_patronlore.100.desc.560241: "奥拉兹在人类时期就是个暴力之徒。年少时被家人抛弃，从此便以各种方式伤害他人：偷窃、绑架、袭击甚至谋杀。\n某天，他在西伯利亚被一名吸血鬼咬伤。那晚，他在街头试图抢劫一个错误的目标，结果遭遇了那名吸血鬼。对方折磨了他一整夜，最终将他转化为不死之身。\n奥拉兹的身心都留下了深刻的烙印。成为吸血鬼后，他做的第一件事就是屠杀自己所有的人类家人。\n奥拉兹沉迷于啖魂，经常试图吞噬其他该隐子嗣的灵魂。然而，他的饥渴永远无法得到满足。"
 POD_patronlore.100.t.560242: "赞助传记：乔戴恩·迪亚尔"
 POD_patronlore.100.desc.560242: "乔戴恩·迪亚尔出生于公元100年1月17日，出身于与狼人有关联但无法变身的科维努斯家族。作为凡人，他在外交、战争和战斗方面表现出色，秉持着芬里尔仔兽信仰的坚定原则。通过虔诚与坚持，他完成了神圣的部族仪式，解锁了芬里尔传人的全部特质，获得了无与伦比的韧性、战斗技巧和不可动摇的意志。\n\n公元140年，在罗马帝国末期的动荡中，乔戴恩在一场几乎夺走他生命的战斗中濒临死亡。他的军队溃败，他倒在战场上奄奄一息。就在此时，第五代梵卓长老朱利安·迪·皮耶罗出现了。朱利安被乔戴恩的顽强意志和野心打动，决定初拥他。然而，初拥并未按计划进行——乔戴恩成为了无氏族的劣族，被朱利安视为耻辱而抛弃。\n\n如今，作为第六代吸血鬼，乔戴恩将劣族身份视为诅咒与祝福。他通过啖魂追求力量，决心证明自己的价值。截至1204年，这位1064岁的吸血鬼依然是一个不可忽视的存在。"
 POD_patronlore.100.t.560248: "赞助传记：雅洁"
 POD_patronlore.100.desc.560248: "她曾是当地强大的吸血鬼，却因一场意外被石化，失去了所有行动能力。如今，她等待着能解救她的人出现。"
 POD_patronlore.100.t.560244: "赞助传记：桑丘"
 POD_patronlore.100.desc.560244: "桑丘，堂吉诃德的子嗣，曾经是个生无可恋的女孩。她的尊长在发现她试图烧毁自己的房子自杀时，一时兴起对她进行了初拥，从而拯救了她的生命。初拥以及她被纳入堂吉诃德的家族——有时被称为曼切根家族—赋予了她生命的意义。堂吉诃德、桑丘以及其他被他初拥的血族将住在一座宏伟的城堡里，远离人类社会。这种生活一直持续到一位人类骑士的到来，他与堂吉诃德决斗了数日。决斗没有明确的胜者，但这位人类骑士与血族成了朋友，并经常来访。在拜访中，这位人类向堂吉诃德讲述了英雄与救世主的故事，他们挑战困难去做自己认为正确的事，进行伟大的冒险。虽然桑丘对这些故事漠不关心，但堂吉诃德却深陷其中，并最终激发了他的梦想：血族与血畜的共存一个布鲁赫理想主义者们的梦想更为激进的梦想。因为你看，堂吉诃德对心兽有着奇特的抵抗力，这导致他对心兽的本质产生了误解。他禁止他的血族吸食人血，要求他们通过更温和的方式来满足饥渴。当堂吉诃德像骑士讲述的故事那样外出冒险时，他把桑丘和其他人留在了身后。桑丘成了堂吉诃德领地的管家，代他管理。她和其他的血族为了堂吉诃德的梦想而受苦，直到有一天……他们的忠诚崩溃了。\n\n在由她的血族同伴策划的阴谋中，堂吉诃德将被捕获并用木桩穿刺直到他“恢复理智”，他的血族们大胆地告诉他，他们再也不会在他的梦想妄想下受苦了。当桑丘得知这个阴谋时……她表示了同意，她也因此受苦，并觉得是时候让她的尊长从他的妄想中醒来了。\n于是……阴谋付诸实施，堂吉诃德的血族们蜂拥而上刺穿了他，他们眼中含着泪水。令桑丘和所有人震惊的是，堂吉诃德没有反抗，他没有动一根手指去消灭他们……因为他真的爱他们。\n\n阴谋出了差错，堂吉诃德最终殒命于桑丘之手，这份愧疚桑丘至今背负。如今，桑丘既是名义上也是实质上的统治者，她发誓绝不让她的家族再次受苦，允许他们随心所欲地生活，而这常常以牺牲血畜为代价。"
 POD_patronlore.100.t.560234: "赞助传记：伊利亚"
 POD_patronlore.100.desc.560234: "“为何无论何种生灵，都难以找到改变的意愿？活人、死者、超自然存在……甚至无辜者皆如此。”\n与其他自负的暴君不同，伊利亚深知绝对的统治需要依靠一群有才华的追随者的支持。她通过个人关怀与连接赢得忠诚，因为她真正在乎他们。正如她常说的：“冷漠是弱者的坟墓。”"
 POD_patronlore.100.desc.headnote: "该角色由我们的一位支持者创建，并非$pod_wod$的官方组成部分。\n\n"
 POD_patronlore.100.desc.footnote: "\n\n该角色没有已知的官方结局。"
 POD_patronlore.100.t.560251: "赞助传记：莱昂德尔·瓦拉让"
 POD_patronlore.100.desc.560251: "出生于法兰西小贵族家庭的莱昂德尔在优渥与期许中成长。他的家族虽富不贵，恰好处在格外注重体面的阶层。然而比起家族声誉，莱昂德尔更在意自身欲望。他是浪漫主义者、书痴、纨绔子弟，更是异类。二十一岁那年，一位来自印度的访客——那伽罗阇看中他锋芒暗藏的敏锐与残忍，赐予其初拥。失去引导的莱昂德尔独自留在法兰西，只得自行摸索生存之道。\n\n他从不掩饰那伽罗阇的身份。周遭血族视其为怪胎，甚或需铲除的威胁。但优雅诗意、近乎温文的举止使他更易被法兰西妥芮朵接纳——他们如今将其视为古怪却迷人的远亲。有人说他骨子里流淌着妥芮朵的魂灵，尽管他偏好品尝心脏而非将心意昭示人前。\n\n近期，他在祖宅开设“味觉殿堂”私人沙龙，吸引最猎奇的血族前来纵情饕宴。莱昂德尔在此策划仪式性的暗夜飨宴，宾客不仅能享用精心料理的凡人，亦能品尝被俘的同族。这场半是饮宴半是演出的聚会始终保持着雅致格调。请柬罕有，仅寄予兼具品味与审慎之人。\n\n未来命运：\n\n莱昂德尔将痴迷于某位血族，视其为完美珍馐。可悲的是，未及品尝，猎物便已逃脱。这次失却将使那伽罗阇陷入沉沦，很快他将幽居祖宅，仅能勉强维持理智。唯有忠实的血仆能护其免于终极死亡，尽管届时他已是形销骨立、深陷抑郁的躯壳。"
 POD_patronlore.100.t.560252: "赞助传记：里斯·阿普·阿瑟伊斯"
 POD_patronlore.100.desc.560252: "里斯出生于安格尔西岛，母亲是农夫之女，父亲是诺斯商人。他刚成年便随父亲的船队出海，足迹遍及大半个欧洲，在钱财往来与人际周旋中练就一身本领。十九岁时他娶了位法兰西农妇，却鲜少与妻子团聚。\n\n他的冒险生涯终结于二十四岁：某次远航后泊岸休憩时，他在睡梦中遭袭，被吸干鲜血后重生为嗜血怪物。"
 POD_patronlore.100.t.560253: "赞助传记：薇薇安·伊温杜"
 POD_patronlore.100.desc.560253: "她出生于喀尔巴阡山脉，由母亲特蕾妮与父亲迪奥纳斯·因温杜抚养长大。少女时期，她对动植物怀抱着炽情，常在课余研究草木特性，并在研习土地与民族历史的背景下掌握了草药学技艺。\n\n随着人格与技艺的成长，她逐渐精通野外生存之道，这令主张她另择职业的父亲深感不悦。十九岁那年，与她常年劳作的母亲因病离世，父亲不久后也弃她而去。孤身一人的她很快开设了草药铺维持生计。\n\n经营店铺一年后，因女性身份与职业特性，加之有位病患在她照看下不治身亡，她被指控为女巫。绞索套上脖颈的瞬间，随着绳结收紧与颈椎断裂的脆响，她带着皮开肉绽的创伤坠下绞刑架，挣扎着逃入附近森林。\n\n她拼命奔逃，伤口随脉搏剧痛跳动，直至精疲力竭。虽幻想追兵近在咫尺，她却无暇处理颈伤——这处本应致命的创伤竟奇迹般让她残存片刻。当肾上腺素耗尽，她颓然倒地，静候死亡降临。\n\n时间在煎熬中流逝，终于有道身影笼罩而来。对方赐予她痛楚的终结与新生，引领她步入亡生之境。"