l_simp_chinese:
 POD_rationalize.100.t: "你被支配了。"
 POD_rationalize.100.desc: "[schemer.GetTitledFirstName]在支配你并索要一个人情。"
 POD_rationalize.100.option.a: "运用我的意志力去抵抗支配。"
 POD_rationalize.100.option.b: "抗拒支配。"
 POD_rationalize.100.option.c: "接受支配。"
 POD_rationalize.200.t: "正在支配[target.GetFirstNameNoTooltip]"
 POD_rationalize.200.desc: "我以意志命令[target.GetTitledFirstName]。但[target.GetSheHe|U]正在抗拒我的支配。"
 POD_rationalize.200.option.a: "激起血液来支配[target.GetHerHim]。"
 POD_rationalize.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip]掌握着坚韧术$pod_discipline$并抵抗了我的力量。"
 POD_rationalize.200.a.tt_willpower: "[target.GetFirstNameNoTooltip]发挥了[target.GetHerHis]的意志力来抵抗我的能力。"
 POD_rationalize.200.a.success.desc: "成功"
 POD_rationalize.200.a.tt_success: "[target.GetTitledFirstName]会被认知扭曲为自己欠你一个人情。"
 POD_rationalize.200.a.failure.desc: "失败"
 POD_rationalize.200.a.tt_failure: "[target.GetTitledFirstName]将抵抗你的支配。"
 POD_rationalize.200.option.b: "激起血液然后发挥我的意志。我是主人！"
 POD_rationalize.200.option.b.tt.beast: "#beast 我才是主人！#!"
 POD_rationalize.200.option.c: "这简直是在浪费时间，我不再想支配[target.GetHerHim]。"
 POD_rationalize.200.option.c.tt: "支配将会失败。"
 POD_rationalize.300.t: "[target.GetFirstNameNoTooltip]被认知扭曲了"
 POD_rationalize.300.desc: "通过运用我的支配术$pod_discipline$，[target.GetTitledFirstName]会被认知扭曲为欠我一个人情。"
 POD_rationalize.300.option.a: "现在，我想让[target.GetHerHim]做什么？"
 POD_rationalize.300.option.a.tt.beast: "#beast 血！我们需要血！#!"
 POD_rationalize.400.t: "我无法拒绝的债务"
 POD_rationalize.400.desc: "我欠[schemer.GetTitledFirstName]的。"
 POD_rationalize.400.option.a: "我该怎么向[schemer.GetHerHim]交代呢？"
 POD_rationalize.500.t: "抵抗支配"
 POD_rationalize.500.desc: "[target.GetTitledFirstName]抵抗了我的支配。"
 POD_rationalize.500.option.a: "这不可能！"
 POD_rationalize.500.option.a.tt.beast: "#beast 打到其听话为止！#!"
 POD_rationalize.600.t: "抵抗支配"
 POD_rationalize.600.desc: "我已经摆脱了[schemer.GetTitledFirstNamePossessive]的支配之精神枷锁。"
 POD_rationalize.600.option.a: "我有钢铁般的意志！"