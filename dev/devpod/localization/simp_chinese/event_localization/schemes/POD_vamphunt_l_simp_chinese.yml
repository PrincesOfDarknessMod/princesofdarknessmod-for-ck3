l_simp_chinese:
 POD_vamphunt.1.t:0 "血！"
 POD_vamphunt.1.desc:0 "你追踪到了你的猎物。[target.GetSheHe]在你的血吻下屈服。你打算吸多少血？"
 POD_vamphunt.1.option.a:0 "不吸血。让[target.GetHerHim]毫发无伤的离开。"
 POD_vamphunt.1.option.b:0 "吸一点，就一点点。"
 POD_vamphunt.1.option.c:0 "稍微吸点。[target.GetSheHe|U]只会觉得有些虚弱，但不会有大碍。"
 POD_vamphunt.1.option.d:0 "多吸一些，让[target.GetHerHim]受到重伤。"
 POD_vamphunt.1.option.e:0 "吸干他们，牺牲[target.GetFirstName]的生命来完全满足我的饥渴。"
 POD_vamphunt.1.option.f:0 "让[target.GetHerHim]沉迷于我迷吻带来的极乐，这样[target.GetSheHe]就会求我去吸食[target.GetHerHim]。"
 POD_vamphunt.11.t:0 "气！"
 POD_vamphunt.11.desc:0 "你追踪到了你的猎物。你打算吸取什么？"
 POD_vamphunt.11.option.a:0 "不吸。让[target.GetHerHim]毫发无伤的离开。"
 POD_vamphunt.11.option.b:0 "噬取[target.GetSheHe]的阴气。"
 POD_vamphunt.11.option.c:0 "噬取[target.GetSheHe]的阳气。"
 POD_vamphunt.11.option.d:0 "噬取[target.GetSheHe]的血，但不杀死[target.GetSheHe]。"
 POD_vamphunt.11.option.e:0 "吸干[target.GetSheHe]的血肉，牺牲[target.GetFirstName]的生命来完全满足我的饥渴。"
 POD_vamphunt.21.t:0 "血肉！"
 POD_vamphunt.21.desc:0 "你追踪到了你的猎物。你吞噬多少血肉？"