l_simp_chinese:
 POD_vamphunt.1.t: "血！"
 POD_vamphunt.1.desc: "你追踪到了你的猎物。[target.GetSheHe]在你的血吻下屈服。你打算吸多少血？"
 POD_vamphunt.1.option.a: "不吸血。让[target.GetHerHim]毫发无伤的离开。"
 POD_vamphunt.1.option.b: "吸一点，就一点点。"
 POD_vamphunt.1.option.c: "稍微吸点。[target.GetSheHe|U]只会觉得有些虚弱，但不会有大碍。"
 POD_vamphunt.1.option.d: "多吸一些，让[target.GetHerHim]受到重伤。"
 POD_vamphunt.1.option.e: "吸干他们，牺牲[target.GetFirstName]的生命来完全满足我的饥渴。"
 POD_vamphunt.1.option.f: "让[target.GetHerHim]沉迷于我迷吻带来的极乐，这样[target.GetSheHe]就会求我去吸食[target.GetHerHim]。"
 POD_vamphunt.11.t: "气！"
 POD_vamphunt.11.desc: "你追踪到了你的猎物。你打算吸取什么？"
 POD_vamphunt.11.option.a: "不吸。让[target.GetHerHim]毫发无伤的离开。"
 POD_vamphunt.11.option.b: "吸一点，就一点点。"
 POD_vamphunt.11.option.c: "稍微吸点。[target.GetSheHe|U]只会觉得有些虚弱，但不会有大碍。"
 POD_vamphunt.11.option.d: "多吸一些，让[target.GetHerHim]受到重伤。"
 POD_vamphunt.11.option.e: "吸干他们，牺牲[target.GetFirstName]的生命来完全满足我的饥渴。"
 POD_vamphunt.21.t: "血肉！"
 POD_vamphunt.21.desc: "你追踪到了你的猎物。你吞噬多少血肉？"
 POD_vamphunt.11.tt: "你的[GetPlayer.Custom('PODCurrentDharma')][trait_level_track_xp|E]数量基于你的修行之道"