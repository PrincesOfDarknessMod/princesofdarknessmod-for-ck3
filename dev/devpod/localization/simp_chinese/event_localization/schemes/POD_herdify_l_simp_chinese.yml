l_simp_chinese:
 POD_herdify.1.t: "增长牧群"
 POD_herdify.1.option.a: "又一头羊加入我的牧群。"
 POD_herdify.1.desc: "经过仔细的准备和计划，你为[target.GetShortUIName]设置了陷阱。[target.GetSheHe|U]将服从并自愿加入你的储备粮中。"
 POD_drain_animal_interaction_auto: "自动吸食动物"
 POD_drain_animal_interaction_auto.tt: "你将每过六个月自动吸食一次动物，以获得一些兽性经验。这个行动不恢复饥渴，且每次狩猎都会给你带来少量的压力。"
 POD_herd_automation.4010.toast: "动物狩猎"
 POD_drain_animal_interaction_auto_stop.tt: "你将停止自动猎取动物，不再每六个月获得兽性经验和压力。"
 POD_drain_animal_interaction_auto_stop: "停止自动吸食动物"
 POD_herdify.2.option.a: "该死的……"
 POD_herdify.2.desc: "你精心策划的计划未能实现。你没能将[target.GetShortUIName]添加到你的牧群中。"