l_simp_chinese:
 POD_diablerize.100.t: "吸榨：[diablerie_location.GetNameNoTooltip]"
 POD_diablerize.100.desc: "我追踪着[defender.GetFirstName]到[defender.GetHerHis]在[diablerie_location.GetNameNoTooltip]的[defender.Custom('PODDomicile')]。一切准备就绪，而现在我终于可以袭击[defender.GetHerHim]并吸走所有[defender.GetHerHis]的血，甚至[defender.GetHerHis]的灵魂！个人风险相当大，但回报更大。我该下定决心并对[defender.GetFirstName]发动我最致命的攻击？"
 POD_diablerize.100.option.a: "攻击[defender.GetTitledFirstName]"
 POD_diablerize.100.option.a.tt: "一场斗争接踵而来，如果我输了，我也会被毁灭。我将用我全部的意志力和血之力来取得成功。"
 POD_diablerize.100.option.a.tt.beast: "#beast 攻击！我们会得到[defender.GetHerHis]的心头血！#!"
 POD_diablerize.100.option.b: "放弃这肮脏的追求。"
 POD_diablerize.100.option.b.tt.beast: "#beast 我知道[defender.GetSheHe]很虚弱。我嗅到了！不要现在撤退！#!"
 POD_diablerize.200.t: "一次致命的攻击"
 POD_diablerize.200.desc: "[attacker.GetFirstName]在[diablerie_location.GetNameNoTooltip]抓到了我。[attacker.GetHerHis|U]正因心兽饥渴而眼光闪烁！我该做什么？"
 POD_diablerize.200.option.a: "逃跑"
 POD_diablerize.200.option.a.tt.beast: "#beast 蠢货，快逃！#!"
 POD_diablerize.200.option.a.tt: "一次针对机动的军事属性对抗检定会决定你是否可以从[attacker.GetFirstNamePossessive]攻击中逃跑"
 POD_diablerize.200.option.a.desc: "机动比拼"
 POD_diablerize.200.option.a.success: "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.a.tt.defender_wins: "我逃出来了！"
 POD_diablerize.200.option.a.tt.celerityadvanced: "我有高阶迅捷术！"
 POD_diablerize.200.option.a.tt.potenceadvanced: "我有高阶蛮力术！"
 POD_diablerize.200.option.a.tt.blink: "我能在眨眼间移动。"
 POD_diablerize.200.option.a.tt.traversal: "我可以在墙上跑并穿过水域。"
 POD_diablerize.200.option.a.tt.soaring_leap: "我可以腾空而起。"
 POD_diablerize.200.option.a.tt.uncanny_grip: "我可以附墙不落。"
 POD_diablerize.200.option.a.failure: "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.a.tt.attacker_wins: "[attacker.GetFirstName]抓到我了"
 POD_diablerize.200.option.b: "快藏！"
 POD_diablerize.200.option.b.tt: "一次针对躲藏与搜寻的谋略能力对抗检定会决定你是否可以从[attacker.GetFirstNamePossessive]攻击中逃跑。"
 POD_diablerize.200.option.b.desc: "一场捉迷藏竞赛。"
 POD_diablerize.200.option.b.tt.beast: "#beast 黑夜是我们的护甲！#!"
 POD_diablerize.200.option.b.tt.obfuscateadvanced: "我有高阶混淆术！"
 POD_diablerize.200.option.b.tt.oblivionadvanced: "我有高阶湮灭术！"
 POD_diablerize.200.option.b.tt.cloak_of_shadows: "我可以隐藏自己在阴影之中。"
 POD_diablerize.200.option.b.tt.silence_of_death: "我悄无声息的移动。"
 POD_diablerize.200.option.b.tt.unseen_passage: "我只是个无形过客。"
 POD_diablerize.200.option.b.tt.vanish: "我可以直接消失不见。"
 POD_diablerize.200.option.b.success: "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.b.tt.defender_wins: "我藏过去了！"
 POD_diablerize.200.option.b.failure: "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.b.tt.attacker_wins: "[attacker.GetFirstName]抓到我了。"
 POD_diablerize.200.option.c: "魅惑！"
 POD_diablerize.200.option.c.tt.beast: "#beast [attacker.GetSheHe]怎么能攻击我们？！我们明明对[attacker.GetSheHe]这么好！#!"
 POD_diablerize.200.option.c.desc: "性格的冲突"
 POD_diablerize.200.option.c.tt: "一次外交能力对抗检定会决定你是否可以使用威仪术$pod_discipline$让[attacker.GetFirstName]停止[attacker.GetHerHis]的攻击"
 POD_diablerize.200.option.c.tt.entrancement: "我在魅惑。"
 POD_diablerize.200.option.c.tt.majesty: "吾有强威！"
 POD_diablerize.200.option.c.success: "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.c.tt.defender_wins: "我魅惑[attacker.GetFirstName]！"
 POD_diablerize.200.option.c.failure: "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.c.tt.attacker_wins: "[attacker.GetFirstName]对我的魅力免疫。"
 POD_diablerize.200.option.d: "催眠！"
 POD_diablerize.200.option.d.desc: "支配的冲突"
 POD_diablerize.200.option.d.tt.beast: "#beast [attacker.GetSheHe|U]将会听令！#!"
 POD_diablerize.200.option.d.tt: "一次管理能力对抗检定会决定你是否可以使用支配术$pod_discipline$命令[attacker.GetFirstName]停止[attacker.GetHerHis]的攻击"
 POD_diablerize.200.option.d.tt.mesmerize: "我可催眠精神脆弱者。"
 POD_diablerize.200.option.d.tt.rationalize: "我可以让血奴们把我的命令当成是他们自己的意愿。"
 POD_diablerize.200.option.d.tt.submerged_directive: "我可以暗示指令，把弱者变成我的卒子。"
 POD_diablerize.200.option.d.tt.terminal_decree: "我可下达必遵指令。"
 POD_diablerize.200.option.d.success: "[defender.GetFirstName]赢了"
 POD_diablerize.200.option.d.tt.defender_wins: "我支配了[attacker.GetFirstName]！"
 POD_diablerize.200.option.d.failure: "[attacker.GetFirstName]赢了"
 POD_diablerize.200.option.d.tt.attacker_wins: "[attacker.GetFirstNamePossessive]的意志力过强无法被支配。"
 POD_diablerize.200.option.e: "变形！"
 POD_diablerize.200.option.e.tt.beast: "#beast [attacker.GetSheHe]不能进食[attacker.GetSheHe]无法掌控的！#!"
 POD_diablerize.200.option.e.tt: "一次学识能力对抗会决定你是否可以使用$pod_discipline$变形为虚体形态并规避[attacker.GetFirstNamePossessive]的伏击。"
 POD_diablerize.200.option.f: "攻击！"
 POD_diablerize.200.option.f.tt.beast: "#beast 我会得到[attacker.GetHerHis]的血！#!"
 POD_diablerize.200.option.f.tt: "一次勇武能力对抗检定会决定是[attacker.GetFirstName]还是你赢得搏斗。"
 POD_diablerize.250.t: "吸榨：战斗！"
 POD_diablerize.250.option.a.success: "……太快了！"
 POD_diablerize.250.option.a.failure: "我抓住了这只逃跑的老鼠！"
 POD_diablerize.275.t: "逃离战斗！"
 POD_diablerize.275.desc.success: "我能够逃离[attacker.GetFirstName]。[attacker.GetSheHe|U]离我远远的，已经看不到了。"
 POD_diablerize.275.desc.failure: "我跑的不够快。[attacker.GetFirstName]抓住了我。"
 POD_diablerize.275.option.a.success: "我必须远离[attacker.GetHerHim]。"
 POD_diablerize.275.option.a.failure: "或[attacker.GetHerHim]或我！"
 POD_diablerize.300.t: "吸榨：躲藏！"
 POD_diablerize.300.desc.success: "[defender.GetFirstName]跑的够快来逃离我。我到处都找不到[defender.GetHerHim]。"
 POD_diablerize.300.desc.failure: "[defender.GetFirstName]尝试躲开我。这没用的。我能看到[defender.GetSheHe]在哪。"
 POD_diablerize.300.option.a.success: "失败！"
 POD_diablerize.300.option.a.failure: "攻击！"
 POD_diablerize.325.t: "躲避战斗！"
 POD_diablerize.325.desc.success: "差点。我成功躲开了[attacker.GetFirstName]。现在我只需要悄悄的离开并不引起注意，我就能远离[attacker.GetHerHim]。"
 POD_diablerize.325.desc.failure: "我尝试躲藏，但[attacker.GetFirstName]找到我了。"
 POD_diablerize.325.option.a.success: "我需要掩盖我的踪迹。"
 POD_diablerize.325.option.a.failure: "或[attacker.GetHerHim]或我！"
 POD_diablerize.350.t: "吸榨：魅惑！"
 POD_diablerize.350.desc.success: "看看[defender.GetHerHis]的眼睛，我才发现[defender.GetFirstName]是如此的迷人。我真的喜欢他。我怎么能伤害[defender.GetHerHim]。如果不是为了沐浴在[defender.GetHerHis]的光辉下，我为什么会在这里？"
 POD_diablerize.350.desc.failure: "[defender.GetFirstName]尝试使我着迷，但我的头脑还没有那么脆弱，不会轻信这种赤裸的伎俩。我将获得[defender.GetHerHis]的血！"
 POD_diablerize.350.option.a.success: "我太爱你了。"
 POD_diablerize.350.option.a.success.tt: "当我被[defender.GetFirstName]魅惑时，我将无法再次尝试[Glossary('吸榨','game_concept_diablerie_desc')][defender.GetHerHim]。"
 POD_diablerize.350.option.a.failure: "你的魅惑对我毫无效果。"
 POD_diablerize.375.t: "魅惑敌人"
 POD_diablerize.375.desc.success: "通过我威仪术$pod_discipline$，我魅惑了[attacker.GetFirstName]。当被着迷时，[attacker.GetSheHe]对我来说不是威胁。"
 POD_diablerize.375.desc.failure: "我尝试获取[attacker.GetFirstName]的目光并施用我的威仪术到[attacker.GetHerHim]上使他软化。但[attacker.GetSheHe]反而又快又怒的向我冲来，看来我失败了。"
 POD_diablerize.375.option.a.success: "是的，就是如此。我是你喜欢的人。"
 POD_diablerize.375.option.a.success.tt: "当[attacker.GetFirstName]被我魅惑时，[attacker.GetSheHe]不能再次尝试[Glossary('吸榨','game_concept_diablerie_desc')]我。"
 POD_diablerize.375.option.a.failure: "[attacker.GetSheHe]为何不爱我！"
 POD_diablerize.425.t: "催眠敌人"
 POD_diablerize.425.desc.success: "通过我的支配术$pod_discipline$，我将[attacker.GetHerHis]的意志如同陶工对黏土一般重塑。首先我强迫[attacker.GetHerHim]“停！”，现在的话我该试试其他有趣的命令了。"
 POD_diablerize.425.desc.failure: "我侵入[attacker.GetHerHis]的脑海。那如同堡垒一般而我无法深入。[attacker.GetSheHe|U]对我的重复命令无动于衷。"
 POD_diablerize.425.option.a: "滚出这地方。并别回来了。"
 POD_diablerize.425.option.a.tt: "[attacker.GetFirstNamePossessive]对你的$pod_diablerie$计谋已终结。"
 POD_diablerize.425.option.b: "你会帮我一个重要的忙。"
 POD_diablerize.425.option.b.tt: "我将获得[attacker.GetFirstName]的牵制"
 POD_diablerize.425.option.e: "你现在是我的囚犯了。"
 POD_diablerize.425.option.e.tt: "我会监禁[attacker.GetFirstName]。"
 POD_diablerize.425.option.c: "在太阳下焚烧吧。"
 POD_diablerize.425.option.c.sunrise: "在太阳下焚烧吧。"
 POD_diablerize.425.option.c.behead: "去断头台，囚犯。乖。"
 POD_diablerize.425.option.c.fire: "自己滚到火堆上。"
 POD_diablerize.425.option.c.tt: "[attacker.GetFirstName]会自杀并承受终焉之死。"
 POD_diablerize.425.option.d: "为啥[attacker.GetSheHe]不听我的！"
 POD_diablerize.400.t: "吸榨：支配术！"
 POD_diablerize.400.desc.success: "[defender.GetFirstName]侵入我的脑海。我没法抵抗[defender.GetHerHis]的意志。我被完全的支配了。[defender.GetSheHe|U]强迫我“停！”"
 POD_diablerize.400.desc.leave: "随后[defender.GetFirstName]命令，“滚出这地方并别回来了”。"
 POD_diablerize.400.desc.favor: "随后[defender.GetFirstName]命令，“你会帮我一个重要的忙”。"
 POD_diablerize.400.desc.favor.tt: "[defender.GetFirstName]给予你一个牵制。"
 POD_diablerize.400.desc.die: "[defender.GetFirstName]给予你一最终命令，“在太阳下焚烧吧”。"
 POD_diablerize.400.desc.sunrise: "[defender.GetFirstName]给予你一最终命令，“在太阳下焚烧吧”。"
 POD_diablerize.400.desc.behead: "[defender.GetFirstName]给予你一最终命令，“去断头台，囚犯。乖”。"
 POD_diablerize.400.desc.fire: "[defender.GetFirstName]给予你一最终命令，“自己滚到火堆上”。"
 POD_diablerize.400.desc.prison: "[defender.GetFirstName]命令你进入监牢，“你现在是我的囚犯了”。"
 POD_diablerize.400.desc.failure: "当我冲向[defender.GetFirstName]，[defender.GetSheHe]全力凝视着我并带着强制口气命令我“停！”，但[defender.GetSheHe|U]无法掌控我！"
 POD_diablerize.400.option.a.success: "悉听尊便。"
 POD_diablerize.400.option.d.failure: "滚出我的脑海！"
 POD_diablerize.450.t: "吸榨：变形！"
 POD_diablerize.450.desc.success: "在我眼前，[defender.GetFirstName]神奇的转化为一种无形形态。我无法抓到[defender.GetHerHim]。我甚至不能触碰到[defender.GetHerHim]。而就这样，[defender.GetSheHe]走了。"
 POD_diablerize.450.desc.failure: "[defender.GetFirstName]开始变身。[defender.GetHerHis]的身体开始转变形态。[defender.GetSheHe]不够快以逃离我！"
 POD_diablerize.450.option.a.success: "攻击！"
 POD_diablerize.450.option.a.failure: "失败！"
 POD_diablerize.475.t: "变化形态"
 POD_diablerize.475.desc.success: "我专注于我的$pod_discipline$并转化为一无形形态。它在[attacker.GetFirstName]碰到我之前成功了。随后我简单的逃掉了。"
 POD_diablerize.475.desc.failure: "我开始变身为一无形形态。但我没能在[attacker.GetFirstName]踩在我身上之前完成。"
 POD_diablerize.475.option.a.success: "这不会是最后一次这个把戏救了我。"
 POD_diablerize.475.option.a.failure: "那么来肉体对抗肉体！"
 POD_diablerize.500.t: "吸榨：最终决战"
 POD_diablerize.500.desc: "不再逃，不再藏，不再更多精神把戏。[defender.GetFirstName]已经无法摆脱我。是最终一战的时候了。"
 POD_diablerize.500.option.a: "攻击[defender.GetHerHim]！"
 POD_diablerize.500.option.a.tt.beast: "#beast 好！所有[defender.GetHerHis]的血都是我的！……我说我们的。所有[defender.GetHerHis]的血都是我们的！#!"
 POD_diablerize.500.option.a.tt.attacker_wins: "[attacker.GetFirstName]赢了！"
 POD_diablerize.500.option.a.tt.defender_wins: "[defender.GetFirstName]赢了！"
 POD_diablerize.500.option.a.desc: "勇武的对决"
 POD_diablerize.500.option.a.success: "胜利！"
 POD_diablerize.500.option.a.failure: "失败！"
 POD_diablerize.500.option.b: "太冒险了，我要放弃这个计谋。"
 POD_diablerize.510.t: "撤退"
 POD_diablerize.510.desc: "[attacker.GetFirstName]不会实施这次攻击并会撤退。"
 POD_diablerize.510.option.a: "终于解脱了"
 POD_diablerize.515.t: "吸榨：对于胜者，有奖！"
 POD_diablerize.515.desc.success: "该战斗残酷而又迅速。我获得了胜利而[defender.GetFirstName]倒在了我的脚下。"
 POD_diablerize.515.desc.failure: "我本以为我准备好了，但[defender.GetFirstNamePossessive]的战斗能力远远超过了我。我被打败了。"
 POD_diablerize.515.option.a.success: "现在该怎么处理我的战利品呢？"
 POD_diablerize.515.option.a.failure: "我将陷入[Glossary('蛰眠','game_concept_torpor_desc')]，不知我的命运将会怎样。"
 POD_diablerize.525.t: "战斗！"
 POD_diablerize.525.desc.success: "[attacker.GetFirstNamePossessive]的战斗能力远远超过了我。我被打败了。"
 POD_diablerize.525.desc.failure: "该战斗残酷而又迅速。我获得了胜利而[attacker.GetFirstName]倒在了我的脚下。"
 POD_diablerize.525.option.a.failure: "消灭[attacker.GetFirstName]。这是[attacker.GetHerHim]的终焉之死。"
 POD_diablerize.525.option.b.failure: "[attacker.GetSheHe]现在是我的囚犯了。"
 POD_diablerize.525.option.c.failure: "我将离开，胜利已经足够甜美。"
 POD_diablerize.525.option.d.failure: "我会得到[attacker.GetHerHis]的心头血！"
 POD_diablerize.525.option.e.success: "我将陷入[Glossary('蛰眠','game_concept_torpor_desc')]，不知我的命运将会怎样。"
 POD_diablerize.550.t: "吸榨：失败"
 POD_diablerize.550.desc.destruction: "我被[defender.GetFirstName]消灭了。"
 POD_diablerize.550.desc.imprisonment: "我被[defender.GetFirstName]囚禁了。"
 POD_diablerize.550.desc.release: "[defender.GetFirstName]让我走了。我不懂……"
 POD_diablerize.550.desc.diablerie: "[defender.GetFirstName]的尖牙咬入我的皮肉。[defender.GetSheHe]吸走了我所有的血。我原以为我是猎人，但我却是猎物。"
 POD_diablerize.550.option.a: "就这样告一段落了。"
 POD_diablerize.600.t: "吸榨！"
 POD_diablerize.600.desc: "不仅杀死而且还吞噬另一个存在的灵魂是最令人发指的行为之一。大多数血族认为这是最恶劣的罪行。然而，没啥比这还能让心兽更渴望。\n\n最终，[victim.GetFirstName]在我掌握之中。我是该将[victim.GetHerHis]的吸到只剩[victim.GetHerHis]的存在的核心？我是该榨取[victim.GetHerHis]的心头血？我还是该将[victim.GetHerHim]抽干抹净？"
 POD_diablerize.600.option.a: "吸榨[victim.GetTitledFirstNamePossessive]的灵魂！"
 POD_diablerize.600.option.a.tt: "[victim.GetTitledFirstName]已被消灭！"
 POD_diablerize.600.option.a.tt.beast: "#beast 好！快干！#!"
 POD_diablerize.600.option.b: "不[Glossary('吸榨','game_concept_diablerie_desc')][victim.GetFirstName]"
 POD_diablerize.600.option.b.tt.beast: "#beast 别让他们走！[victim.GetSheHe]不配那血！我们配！#!"
 POD_diablerize.650.t: "饶命？"
 POD_diablerize.650.desc: "我失败了。我确信[attacker.GetFirstName]会毁灭我。奇怪的，[attacker.GetSheHe]只是走开了。"
 POD_diablerize.650.option.a: "这是那最后一丝人性吗？"
 POD_diablerize.700.t: "不凋花！"
 POD_diablerize.700.option.a: "。"
 POD_diablerize.700.desc: "吞噬[victim.GetTitledFirstNamePossessive]的灵魂"
 POD_diablerize.800.t: "不从之魂"
 POD_diablerize.4000.t: "吸榨计谋失败！"
 POD_diablerize.4000.desc: "天有不测风云，我对[Glossary('吸榨','game_concept_diablerie_desc')]的[defender.GetFirstName]计谋失败了。"
 POD_diablerize.4000.option.a: "可恶！总有一晚[defender.GetFirstName]你的血将是我的！"
 POD_diablerize.250.option.a.tt.defender_wins: "受攻者逃跑了！"
 POD_diablerize.250.desc: "[defender.GetFirstName]逃离了我！我需要尽力追赶，否则这整个计谋就会失败。可恶的懦夫！"
 POD_diablerize.250.option.a: "让我们开始追逐吧！"
 POD_diablerize.250.option.b: "都这样了也不值得努力。"
 POD_diablerize.250.option.a.tt.attacker_wins: "无处可逃……"
 POD_diablerize.250.option.b.tt.beast: "#beast 别让跑了！血在呼唤！#!"
 POD_diablerize.250.option.a.toast: "逃离！"
 POD_diablerize.1000.t: "吸榨：决斗"
 POD_diablerize.1000.desc: "没更多把戏了，是时候一劳永逸地结束这一切了。你们中只有一个人可以从这里走出去。\n你们中的一个人寻求力量，而另一个人寻求保护其的灵魂，但在黑暗世界里，没有崇高的功业。最强的，或更狡猾的，将获胜。"
 POD_diablerize.1000.option.a: "现在没有回头路了。"
 POD_diablerize.601.t: "吸榨：胜利！"
 POD_diablerize.601.desc: "你打败了试图吞噬你灵魂的愚蠢吸血鬼。相应惩罚必须与这一未遂行为的严重性相符。"
 POD_diablerize.601.option.a: "我将慈悲的赐予你迅速一死。"
 POD_diablerize.251.t: "吸榨：躲藏！"
 POD_diablerize.251.desc: "[defender.GetFirstName]试图从我这里逃走！躲在附近的某个地方，或者使用力量来误导我的感官……我需要注意每一个小细节来抓住这个胆小鬼。"
 POD_diablerize.251.option.a: "让我们开始追逐吧！"
 POD_diablerize.251.option.b: "都这样了也不值得努力。"
 POD_diablerize.251.option.a.tt.attacker_wins: "你找到了懦夫！"
 POD_diablerize.251.option.a.success: "无处可逃……"
 POD_diablerize.251.option.a.desc: "猫和老鼠"
 POD_diablerize.251.option.a.failure: "消失无踪……"
 POD_diablerize.251.option.a.tt.defender_wins: "受攻者逃跑了！"
 POD_diablerize.252.t: "吸榨：魅惑！"
 POD_diablerize.252.desc: "[defender.GetFirstName]试图使用[defender.GetHerHis]强大的威仪术来魅惑我！我必须抵抗，否则我将陷入无力。我必须理智地对抗这致命的、感性的、完美的诱惑……我该么！？[AddTextIf( PlayerHasBeast, '\n#beast 想想美味的血，你这傻瓜，其他啥的都不重要！#!' )]"
 POD_diablerize.252.option.a: "我的意志属于我！"
 POD_diablerize.252.option.a.tt.attacker_wins: "是时候结束这一切了！"
 POD_diablerize.252.option.a.success: "你失败了！"
 POD_diablerize.252.option.a.desc: "抵抗完美。"
 POD_diablerize.252.option.a.failure: "如此美丽……"
 POD_diablerize.252.option.a.tt.defender_wins: "为何抵抗？"
 POD_diablerize.253.t: "吸榨：认知扭曲！"
 POD_diablerize.253.desc: "[defender.GetFirstName]试图使用[defender.GetHerHis]强大的支配术能力来控制我！我必须反抗，否则我将陷入无力。我必须调动我所有的意志力来抵制这种对我思想的入侵。我不敢想象如果我输了会发生什么……[AddTextIf( PlayerHasBeast, '\n#beast 抵抗啊你这蠢货！长个精神尖刺！#!' )]"
 POD_diablerize.253.option.a: "我的意志属于我！"
 POD_diablerize.253.option.a.tt.attacker_wins: "是时候结束这一切了！"
 POD_diablerize.253.option.a.success: "你失败了！"
 POD_diablerize.253.option.a.desc: "意志的碾压"
 POD_diablerize.253.option.a.failure: "我此生的意义就是服侍。"
 POD_diablerize.253.option.a.tt.defender_wins: "尊有何愿？"
 POD_diablerize.254.t: "吸榨：变形！"
 POD_diablerize.254.desc: "[defender.GetFirstName]试图从我手中逃脱！利用[defender.GetHerHis]相当大的变形能力，到目前为止，[defender.GetSheHe]已经成功地多次避开了我。我将不得不利用环境，巧妙地找到一个方法，将这个胆小鬼逼到墙角。"
 POD_diablerize.254.option.a: "我会抓到你！"
 POD_diablerize.254.option.b: "都这样了也不值得努力。"
 POD_diablerize.254.option.a.tt.attacker_wins: "你抓住了你的猎物！"
 POD_diablerize.254.option.a.success: "抓到你了！"
 POD_diablerize.254.option.a.desc: "滑溜的餐点"
 POD_diablerize.254.option.a.failure: "消失无踪……"
 POD_diablerize.254.option.a.tt.defender_wins: "受攻者逃跑了！"
 POD_diablerize.254.option.a.toast: "逃离！"
 POD_diablerize.200.option.g: "放出猎犬！"
 POD_diablerize.200.option.g.tt.beast: "#beast 零嘴时间到孩子们#!"
 POD_diablerize.200.option.g.tt: "一次军事能力对抗检定会决定是[attacker.GetFirstName]还是你赢得搏斗。"
 POD_diablerize.255.t: "吸榨：兽性术！"
 POD_diablerize.255.desc: "[defender.GetFirstName]并不孤单。一群凶猛的野兽正朝我走来，试图保护它们的主人。如果我想接近我的猎物，我就必须从他们中间杀出一条路来。"
 POD_diablerize.255.option.a: "别档我道！"
 POD_diablerize.255.option.b: "……快逃！"
 POD_diablerize.255.option.a.tt.attacker_wins: "你抓住了你的猎物！"
 POD_diablerize.255.option.a.success: "你再也没有毛茸朋友了！"
 POD_diablerize.255.option.a.desc: "滑溜的餐点"
 POD_diablerize.255.option.a.failure: "离我远点！"
 POD_diablerize.255.option.a.tt.defender_wins: "拦下它们！拦下！"
 POD_diablerize.255.option.b.tt.beast: "#beast 懦夫！留下来战啊！#!"
 POD_diablerize.200.option.h: "活烧它们！"
 POD_diablerize.200.option.h.tt.beast: "#beast 火！烧它们，别咱们！#!"
 POD_diablerize.200.option.h.tt: "一次学识能力对抗检定会决定是[attacker.GetFirstName]还是你赢得搏斗。"
 POD_diablerize.256.t: "吸榨：血术法！"
 POD_diablerize.256.desc: "[defender.GetFirstName]并非毫无准备。一系列的仪式和强大的法术保护着这个[defender.Custom('PODDomicile')]，我将不得不非常小心，以免踩到一些陷阱……这可能会变得很不妙。"
 POD_diablerize.256.option.a: "我会做的！"
 POD_diablerize.256.option.b: "……快逃！"
 POD_diablerize.256.option.a.tt.attacker_wins: "你抓住了你的猎物！"
 POD_diablerize.256.option.a.success: "现在就剩你和我了！"
 POD_diablerize.256.option.a.desc: "陷阱众多"
 POD_diablerize.256.option.a.failure: "这是……？"
 POD_diablerize.256.option.a.tt.defender_wins: "#beast 好烫！#!"
 POD_diablerize.256.option.b.tt.beast: "#beast 懦夫！滚进来！#!"
 POD_diablerize.810.desc: "[unconquered_soul.GetFirstName]对躯体的争夺比以往任何时候都更加激烈。其的干扰严重削弱了你对部分领地的影响力，使你损失了一些投入在那里的宝贵资金。\n必须停止……无论如何。你仍然有很大的机会抵御更多……永久性的变化，并保持自我意识完好无损地过下去。或者这场战斗已经消耗了你足够的意志力，让你已经准备好在那个愚蠢到以为已经杀了你的人的身体里重生了。\n唯一不变的问题是，你是谁？"
 POD_diablerize.600.option.c: "吸榨太危险了，单单杀死就行了。"
 POD_diablerize.600.option.c.tt.beast: "普通的常规谋杀，这选项让你的灵魂不受风险。但也没有力量的增长。"
 POD_diablerize.602.t: "吸榨：失踪囚犯"
 POD_diablerize.602.desc: "自从你（通过吃掉灵魂）让一位[ROOT.Char.Custom('PODDomicile')]消失以来，已经有好几天了，你的宫廷上一直有关于这个“失踪囚犯”的流言。虽然到目前为止你已经尽力安抚（或转移）他们的担忧，但流言并没有消失，越来越多的人对你投以偷偷摸摸的目光，也许是想抓住其中的蛛丝马迹来证明他们的猜测……"
 POD_diablerize.602.option.a: "行吧！是我做的！"
 POD_diablerize.602.option.b: "是时候加大目光转移力度了！"
 POD_diablerize.602.option.c: "下一位谈论这些流言的人将获得地牢一夜游"
 unconquered_soul_warning_tooltip: "@alert_icon!#alert_trial #high $VALUE|0$%#!的概率发生[unconquered_soul|E]！#!"
 POD_diablerize.808.tt: "[targetprovince.GetName]内的所有建筑都被移除。"
 POD_diablerize.801.desc: "又是一个灾难性的夜晚。这已经是几个月来反复发生的事情了，你的封臣声称你变了，前一刻还在轻率地作出决定，后一刻就忿忿不平地大喊自己没有那样做。就好像有两个性格互相冲突的人在代替你执政并争权夺利。\n你被诅咒了吗？还是受到了某种奇异力量的影响？不管是什么情况，显然你的宫廷成员几乎不怎么愿意来拜访你，因为你似乎看起来已经没有能力来执行统治了，但更重要的是，你根本不记得他们什么时候开始忽视你。"
 POD_diablerize.801.option.a: "他们将为自己的无礼付出代价！"
 POD_diablerize.801.option.b: "我只是……在改变？"
 generic_legitimacy_debuff_modifier: "正统性争议"
 generic_legitimacy_debuff_modifier_desc: "你的统治权受到了严肃的质疑。"
 POD_diablerize.802.desc: "他们刚才是在嘲笑你吗？\n可悲的是，这种质疑最近经常在你脑海中盘旋。一段时间以来，你似乎失去了锐气，或者更准确地说，你的一部分失去了锐气。你所做的每一个果断的决策都会在不久之后被你的猜疑和心理改变所破坏。坦白说，你不再真正地统治他人，而是依赖于过去的权威，而你的宫廷似乎慢慢察觉到了这一点。\n这种软弱在被诅咒的世界中是致命的，但你不确定根源是什么。仿佛另一个人在你的脑海中，不断地否定你所做的一切……"
 POD_diablerize.802.option.a: "我仍然是他们的君主！"
 POD_diablerize.803.desc: "为何你脚下有一具逐渐死去的尸体？你记不得发生了什么，但从手上的血迹来看，你很可能就是罪魁祸首。尤其是，你的宫廷似乎对你的行为并不感到惊讶。\n最近这种反常的事件频频发生，仿佛另一个人在突然控制你的身体，随心所欲地满足他们的黑暗欲望。难道是……不，不可能。\n无论如何，你得收拾这个烂摊子，不管是字面意思上的还是比喻意义上的。"
 POD_diablerize.803.option.a: "你们的生死全由我掌握！"
 unconquered_soul_in_progress_tt: "#N 你的[Glossary('吸榨','game_concept_diablerie_desc')]罪行又来纠缠你了……#!"
 POD_diablerize.804.desc: "你有些不对劲。你已经怀疑很久了，但自己的脑海却毫无疑问。你的行为可以说是反复无常，从侮辱封臣到给予他们恩惠（有时两者同时发生！），这其中似乎没有任何规律或理由。\n就好像是别人控制了你的思想，作出与你的计划大相径庭的行为，从而导致你判断失误。\n你的内心生出了一种毛骨悚然的恐惧感，这份感觉来自于你可能低估了[unconquered_soul.GetFirstName]的意志力……"
 POD_diablerize.804.option.a: "我会像当年一样赢得胜利！"
 POD_diablerize.805.desc: "情况愈发恶化。\n你发现自己一再违反自己的道德准则，而且显然是毫不犹豫地这么做。也许更糟的是，你整个人的行为方式都变了，仿佛在遵循一套新的规则。显然，你的存在正受到[unconquered_soul.GetFirstName]的复仇之魂的攻击，他正试图确保你走上“正确”的道路。"
 POD_diablerize.805.option.a: "我不会轻易误入歧途！"
 complete_same_faith_generic_debuff_modifier: "有创意的辱骂者"
 complete_same_faith_generic_debuff_modifier_desc: "不知为何，你总是能找到新的方法来惹恼或侮辱你的同胞。"
 POD_diablerize.806.desc: "一切都错了。\n尽管你已竭尽全力，但似乎你还是在不经意间尽你所能地在最公开的场合违反信仰中最神圣的戒律。\n你花了一些时间才意识到这一点，但现在显然是[unconquered_soul.GetFirstName]的恶意影响在背后作祟，它在最不合时宜的时刻控制你的思想和行为，试图（而且非常成功地）让你看起来像个执迷不悟的亵渎者。看来，这场争夺你灵魂的战斗还未结束。"
 POD_diablerize.806.option.a: "我必须做出补偿。"
 POD_diablerize.807.desc: "一段时间以来，你曾以为[unconquered_soul.GetFirstName]对你心灵的影响已经消退，因为你似乎能够掌控自己在宫廷中的行为。可悲的是，真相却更为阴险。\n当你将精力集中在身边的事务上时，敌人却在暗中扭曲你的命令，侵蚀你在更广泛领域的影响力。那些精心设计并遵循你道德准则的权力结构在这一地区已逐渐崩溃，表面上是由于你自己的命令，实际上很可能是在你那不受欢迎的灵魂访客掌控身体时所发出的指令。"
 POD_diablerize.807.option.a: "这是可以纠正的。"
 POD_diablerize.808.t: "不从之魂：终局"
 POD_diablerize.808.desc: "[unconquered_soul.GetFirstName]对你身体的控制权争夺比以往更加激烈。这样的干涉彻底扰乱了你的军队，来自“你们俩”的矛盾命令让你的将领们困惑不已，你对当地凡人民兵的影响力也支离破碎。\n必须停止……不管用什么方法。你仍有很大的机会可以抵抗这些更为……永久性的改变，并保持大部分自我意识完整。或者，也许这场战斗已经磨损了你的意志力，让“你”准备在那个愚蠢到认为杀了“你”的人身体里重生。\n唯一不变的问题仍然是，你是谁？"
 POD_diablerize.808.option.a: "给我滚！我已经打败过你了！"
 POD_diablerize.808.option.b: "#italic 我重生了！#!"
 POD_diablerize.809.desc: "[unconquered_soul.GetFirstName]对你躯体的控制权争夺比以往更加激烈。这样的干扰让你在夜以继日的管理中犯下了一些重大错误，不仅让你看起来像个傻瓜，同时也让凡人当局警觉到了你的存在。\n必须停止……不管用什么方法。你仍有很大的机会可以抵抗这些更为……永久性的改变，并保持大部分自我意识完整。或者，也许这场战斗已经磨损了你的意志力，让“你”准备在那个愚蠢到认为杀了“你”的人身体里重生。\n唯一不变的问题仍然是，你是谁？"
 POD_diablerize.101.t: "吸榨：失败……"
 POD_diablerize.101.desc: "无论我为此任务倾注多少资源，全都徒劳无功。[defender.GetFirstName]始终躲避着我，而追踪[defender.GetHerHis]动向的种种尝试也一无所获。眼下，想要趁其不备、毫无防备地擒获[defender.GetHerHim]，似乎已无可能。"
 POD_diablerize.101.option.a: "是时候放弃这个计划了。"
 POD_diablerize.101.option.a.tt.beast: "#beast 你不能永远否认我。#!"