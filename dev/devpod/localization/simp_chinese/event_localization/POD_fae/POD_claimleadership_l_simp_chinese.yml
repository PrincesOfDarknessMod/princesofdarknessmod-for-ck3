l_simp_chinese:
 POD_claimleadership_events.1.t: "宣称$PODWarOfSeasonsLeader_autumn$的头衔"
 POD_claimleadership_events.1.desc: "计划很简单，展示谁真正配得上$PODWarOfSeasonsLeader_autumn$这个头衔。这可以通过多种方式实现，而且除了谋杀之外，每一种方式都会被用到。毕竟，我不是一个野蛮人……"
 POD_claimleadership_events.1.a: "好的，开始吧！"
 POD_claimleadership_events.1.b: "别急。"
 POD_claimleadership_events.2.t: "宣称$PODWarOfSeasonsLeader_autumn$的头衔"
 POD_claimleadership_events.2.desc: "一切按计划进行，[target.GetNamePossessive]的全部赔偿付之一炬。现在所有人都知道，我[GetPlayer.GetName]才是真正的$PODWarOfSeasonsLeader_autumn$。c"
 POD_claimleadership_events.2.a: "[target.GetSheHe]明天会有一个惊喜！"
 POD_claimleadership_events.2.b: "他们知道又如何？反正我赢了！"
 POD_claimleadership_events.3.t: "宣称$PODWarOfSeasonsLeader_autumn$头衔：失败"
 POD_claimleadership_events.3.desc: "不不不，这些蠢货！他们失败了！[target.GetNamePossessive]的名誉完好无损，丝毫未受我那些尝试的影响！最糟糕的是？我看起来狼狈不堪！"
 POD_claimleadership_events.3.a: "哦不……"