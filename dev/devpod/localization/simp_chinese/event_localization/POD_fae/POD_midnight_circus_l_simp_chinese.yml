l_simp_chinese:
 POD_midnight_circus.100.t: "古老的月光嘉年华和午夜马戏团"
 POD_midnight_circus.100.option.a: "参观嘉年华！"
 POD_midnight_circus.100.option.b: "允许举办嘉年华，但禁止你的封臣和廷臣参加。"
 POD_midnight_circus.100.option.c: "把嘉年华从你的领地赶走！"
 POD_midnight_circus.100.desc: "一个神秘的马戏团已经来到了你的领地。游荡的吟游诗人正在邀请人们来体验他们的戏剧活动。许多人说，这将是很好的轻松乐子，但其他人不相信访客，认为他们在某种程度上是不怀好意的。"