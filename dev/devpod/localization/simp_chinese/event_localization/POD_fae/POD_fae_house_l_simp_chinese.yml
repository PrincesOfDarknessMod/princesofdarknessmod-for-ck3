l_simp_chinese:
 POD_fae_house_event.1.t: "铁之分裂"
 POD_fae_house_event.1.desc: "关于公爵[GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]最后的致命预言的辩论已经以对立观点的毁灭来解决。通过鲜血，世家的团结得以恢复，而你对博迈恩世家的领导地位是毋庸置疑的。"
 POD_fae_house_event.1.a: "[GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName]的追随者胜利并将强制执行归没法！"
 POD_fae_house_event.1.b: "出离先驱将带领我们行于铁之路"
 POD_fae_house_event.2.t: "从金到钢"
 POD_fae_house_event.2.desc: "尽管花费巨大，你领导的杜伽尔世家的工匠大师们还是建造出一座传奇中的强大武器库。有了这样的武器，妖精们可以征服整个世界。成千上万的人持械而立，渴望着信号的到来，迎接飞升的时刻！"
 POD_fae_house_event.2.a: "准备作战！准备作战！"
 POD_fae_house_event.3.t: "强化永契堡"
 POD_fae_house_event.3.desc: "有预警就有准备。凭借你对未来可能性的超自然洞察，爱伦涅德世家的建筑师们构建了精巧的防御工事，能够抵御任何形式的围攻。你的防御设施里充满了秘密通道、迷宫、箭孔、暗门和魔法陷阱。最终，你感到安全了。"
 POD_fae_house_event.3.a: "让我的敌人来吧——他们会被石头砸死！"
 POD_fae_house_event.4.t: "最伟大的恋人"
 POD_fae_house_event.4.desc: "吟游诗人将永远满怀渴望地歌颂你的浪漫冒险。你从象征欲望的神话人物——羊人那里学习了爱的艺术。你体现了仙族最美丽的那一份美。你驯服了一颗狂暴的狼人心，并将它们束缚在你的欲望之下。伟大的人们会放下他们最伟大的计划，只为在你的床上度过一个夜晚。众人都会爱上你，然后绝望！"
 POD_fae_house_event.4.a: "爱我，爱我，说你爱我"
 POD_fae_house_event.5.t.king: "真王加冕"
 POD_fae_house_event.5.t.queen: "真女王加冕"
 POD_fae_house_event.5.desc.king: "在你的领导下，格威狄昂世家通过英勇的努力证明自己是所有仙族中最高贵的存在。还有谁能够追寻并驾驭雷霆霹雳——光明之剑——和平使者之刃——[GetPODArtifact('caliburn_link').GetName]，除了你这位真正的国王！所有妖精都必须向你的威严俯首，承认你的绝对主权。"
 POD_fae_house_event.5.desc.queen: "在你的领导下，格威狄昂世家通过英勇的努力证明自己是所有仙族中最高贵的存在。还有谁能够追寻并驾驭雷霆霹雳——光明之剑——和平使者之刃——[GetPODArtifact('caliburn_link').GetName]，除了你这位真正的国王！所有妖精都必须向你的威严俯首，承认你的绝对主权。"
 POD_fae_house_event.5.a: "现在，所有人都可以顶礼膜拜"
 POD_fae_house_event.6.t: "凡人之歌"
 POD_fae_house_event.6.desc: "成事已毕。羊群已接纳妖精为他们的牧者和引导。教会将不再对妖精构成威胁，而所有妖精一族都应感谢[ROOT.Char.GetFullName]。赞美将永远歌颂[ROOT.Char.GetHouse.GetName]世家。\n\n地上和天上的每个妖精都需要考虑与神圣教会及其神圣的调停者——[ROOT.Char.GetHouse.GetName]的关系。祈求他们选择通往救赎的正义之路，否则地狱的巨口将永远等待着他们。救赎已经来临！\n\n凡人将以各种方式助力，创造宏伟的大教堂、壮丽的艺术和胜利的音乐，都是为了荣耀神圣和他的圣洁使者。让我们建造一座耀眼的山顶之城，成为对所有有心听到我们祥和歌声的人们希望和救赎的灯塔！"
 POD_fae_house_event.6.a: "哈利路亚！"
 POD_fae_house_event.7.t: "中土存留"
 POD_fae_house_event.7.desc: "随着米德加尔德上所有超自然生物都屈服于你的统治，斯堪的纳维亚的基督教化开始逆转。北欧人将尊崇古老的信仰，敬仰阿萨作为大地上的神明。\n\n“听从我的话，各个阶层的人们，海姆达尔的伟大和平凡的子民。你们召唤我们，阿萨，来讲述我们记忆中最古老的神与人之间的事迹。”"
 POD_fae_house_event.7.a: "我的渡鸦，每日飞过全世界。"
 POD_fae_house_event.8.t: "四季艾力"
 POD_fae_house_event.8.desc: "凭借你的谋略和外交手腕，你成功地结束了长期以来分裂仙族的可怕冲突。在你的领导下，艾力世家超越了其他仙族世家之间的琐碎争斗。如今，随着你世家的崛起，仙族的努力可以集中在与人类更替古老契约上。他们将再次相信，并且永远如此。"
 POD_fae_house_event.8.a: "一段战争。一段和平。"
 POD_fae_house_event.9.t: "弗摩尔族到永远"
 POD_fae_house_event.9.desc.start: "巴烙世家可以追溯到一系列与弗摩尔族的血脉混合的仙族。无尽之冬即将到来，无论他们是否同意你的统治，你都需要引导妖精度过这个时期。你已经准备好一种强大的仪式，将你的妖精本质与强大的忌灵融合，创造出妖精–堕妖混血——堕魔。巴烙的水晶眼发着暗淡的红光，散着巨大的热量。"
 POD_fae_house_event.9.desc.steaming_spear_of_vengeance: "握着[GetPODArtifact('steaming_spear_of_vengeance_link').GetName]，你舔着刃上的热血，感受着愤怒充盈自己的身体。"
 POD_fae_house_event.9.desc.cauldron_of_fear: "准备好那恶心而神秘的混合物后——你深深地用[GetPODArtifact('cauldron_of_fear_link').GetName]饮下。"
 POD_fae_house_event.9.desc.blood_dross: "碾碎糖晶小瓶，喝下血渣中的吸血鬼之血，你充满了黑暗梦华。"
 POD_fae_house_event.9.desc.end: "你打开通往[umbra|E]的仙路，召唤出节点爬行者。\n空气中出现了黑色的闪光，伴随着颤动的颤音呻吟。你的皮肤感觉像指甲刮过黑板一样。空气中弥漫着一种致癌疾病的恶臭。那条$glossary_wyrm$属灵变成了可憎和可怕的化身。它的爪子和牙齿撕开了你的肌肤，猛烈地插入你的胸腔。你被剧烈的疼痛所充斥。然后……\n我们永远团结在一起。"
 POD_fae_house_event.9.a: "吾等既是堕魔！"
 POD_fae_house_event.10.t: "医师战士"
 POD_fae_house_event.10.desc: "作为戴瑞恩世家的领袖，你努力展示了医师和战士的双重本质。你的手可以治愈，也可以伤害。你就像一个杯子，可以容纳毒药或解药，就像一把刀可以用来治愈，也可以割断生命的纽带。"
 POD_fae_house_event.10.a: "医师战士"
 POD_fae_house_event.14.t: "恋难舍的诅咒"
 POD_fae_house_event.14.desc: "作为恋难舍世家的领袖，你发现了一种减轻整个宗族的诅咒的方法。与其只在迫切需要时从一个被乱梦的凡人身上获取，你培养了一个庞大的凡人群体进行收割，其中包括一些充满梦华的重要人物。通过反复汲取如此庞大的梦华源泉，你成功地减轻了诅咒的影响。"
 POD_fae_house_event.14.a: "恋难舍的诅咒"
 POD_fae_house_event.11.t: "罗斯之灵"
 POD_fae_house_event.11.desc: "作为瓦里克世家的领袖，你与罗斯土地上的自然之灵建立了紧密的联系。对于妖精来说，诸灵是一切的一部分：大地、河流、他们的居所以及周围无尽的针叶林。你知道如何取悦这些灵类，也知道如何利用它们。家庭和家园之灵与其锚的规模和壮丽一样强大而有帮助，也与你对它们的尊敬程度有关。贵族和仆人之间的义务是双向的，因此元素妖准备按照你的意愿行动。"
 POD_fae_house_event.11.a: "他们是美好土地的诸灵。"
 POD_fae_house_event.12.t: "摩耳甫斯神谕的敕令"
 POD_fae_house_event.12.desc.fae: "尽管摩耳甫斯神谕的敕令对于世家成员来说并不总是合乎常理，但世家仍然一致遵循。作为斯卡哈世家的首生妖精领袖，你曾踏上[UmbraGlossary('deep_dreaming')]和[UmbraGlossary('sea_of_silver')]的探索之旅，寻找被预言的物事。这是否足够呢？"
 POD_fae_house_event.12.desc.changeling: "尽管摩耳甫斯神谕的敕令对于世家成员来说并不总是合乎常理，但世家仍然一致遵循。作为斯卡哈世家的换生灵领袖，你严格遵循着斯卡哈的命令，即使面对不断上升的板讷，也要留在秋暮世界。这样就够了吗？"
 POD_fae_house_event.12.a: "一如既往，我们向摩耳甫斯神谕致敬"
 POD_fae_house_event.13.t: "梦界守卫"
 POD_fae_house_event.13.desc: "作为达南世家的领袖，你曾在[UmbraGlossary('dreaming')]中漫游无数路径。如今，你守护着这些仙路，并开辟新的道路。你为许多梦种充当了向导。通过对龙之誓约的守护，你获得了许多奇魅的青睐。你已经拥有了一支令人印象深刻的奇魅军团，它们等待着你的命令，甚至愿意在你的召唤下入侵秋暮世界。"
 POD_fae_house_event.13.a: "防卫通往阿卡迪亚的仙路！"
 POD_fae_house_event.15.t: "惰化寒铁"
 POD_fae_house_event.15.desc: "“自然哲学”家们错了，宇宙并不受刚性、可发现的法则所束缚。通过巨大的努力、时间、花费和意志的纯粹力量，你已经证明了所有追求贤者之石的炼金术师们所怀疑的事实。通过进行数千次实验，你坚持不懈，最终实现了你所追求的结果。现实会向那些有着思想和自信的人扭曲，使他们的愿望成真。如果像传说中炼金术师将铅变成黄金的低级追求是可能的，那么为何不能转化寒铁使它毁灭妖精的不朽灵魂的特性也被消除呢？尤里卡！你做到了！"
 POD_fae_house_event.15.a: "现实由我决定！"
 POD_fae_house_event.16.t: "凝视着梦界"
 POD_fae_house_event.16.desc: "我们，不。是我做的。\n\n我成就了如此伟业，以至于梦界自身都认可了我的努力，并赐予我贵族的称号。"
 POD_fae_house_event.16.a: "昔为庶民，今为贵族。"