l_simp_chinese:
 POD_fae_maintenance.1.t: "破蛹"
 POD_fae_maintenance.1.desc: "破蛹是妖精意识的萌芽期；是换生灵本性的伟大觉醒。"
 POD_fae_maintenance.1.option.a: "我觉醒了。"
 POD_fae_maintenance.21.t: "大碎溃"
 POD_fae_maintenance.21.desc: "你没能阻止预言发生。\n最终，凡界和[UmbraGlossary('dreaming')]之间被拉得很细的线开始断裂。这断裂就是[Glossary('大碎溃','game_concept_shattering_desc')]。它不仅粉碎了[UmbraGlossary('arcadia')]和地球之间的联系，而且粉碎了逆转它的希望。\n你必须选择一种选项来面对它。"
 POD_fae_maintenance.21.a: "那又怎样？"
 POD_fae_maintenance.21.b: "化为换生灵，放弃永生。"
 POD_fae_maintenance.21.c: "逃往阿卡迪亚"
 POD_fae_maintenance.21.d: "封入永契堡"
 POD_fae_maintenance.22.t: "大碎溃"
 POD_fae_maintenance.22.desc: "最终，凡界和[UmbraGlossary('dreaming')]之间被拉得很细的线开始断裂。这断裂就是[Glossary('大碎溃','game_concept_shattering_desc')]。它不仅粉碎了[UmbraGlossary('arcadia')]和地球之间的联系，而且粉碎了逆转它的希望。"
 POD_fae_maintenance.22.a: "好耶？"
 POD_fae_maintenance.31.t: "大空位"
 POD_fae_maintenance.31.desc: "地球上既没有仙族，也没有真妖精留存于世的岁月，被称为大空位。在约公元1400年，剩余“掺水”的换生灵在[Glossary('大碎溃','game_concept_shattering_desc')]的最后嘶鸣之后不得不自力更生，因为换生灵不得不尝试如何独自生存下来。"
 POD_fae_maintenance.31.a: "我们的时代过去了。"
 POD_fae_maintenance.31.b: "我们的时代到来了。"
 POD_fae_maintenance.40.t: "传说"
 POD_fae_maintenance.40.desc: "$POD_fable_decision_desc$"
 POD_fae_maintenance.40.a: "传令官的故事"
 POD_fae_maintenance.40.a.tt: "To improve this tale, you will have to complete many [diplomacy|E] contracts as well increase your [prestige_level|E]. In return you will slowly unlock [GetDomicileBuilding('fae_the_appearance_legendary_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Tale's advance."
 POD_fae_maintenance.40.b: "Tale of The Marshal"
 POD_fae_maintenance.40.b.tt: "To improve this tale, you will have to complete many [martial|E] contracts as well win many battles as [commander|E]. In return you will slowly unlock [GetDomicileBuilding('fae_the_interior_training_ground_of_marshal_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Tale's advance."
 POD_fae_maintenance.40.c: "Tale of The Steward"
 POD_fae_maintenance.40.c.tt: "To improve this tale, you will have to complete many [stewardship|E] contracts as well amass large amount of [gold|E]. In return you will slowly unlock [GetDomicileBuilding('fae_the_appearance_perfect_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Tale's advance."
 POD_fae_maintenance.40.d: "Tale of The Shadow"
 POD_fae_maintenance.40.d.tt: "To improve this tale, you will have to complete many [intrigue|E] contracts as well success in many [hostile_schemes|E]. In return you will slowly unlock [GetDomicileBuilding('fae_the_atmosphere_oppressive_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Tale's advance."
 POD_fae_maintenance.40.e: "Tale of The Sage"
 POD_fae_maintenance.40.e.tt: "To improve this tale, you will have to complete many [learning|E] contracts as well teach many [perk|E] points to other [characters|E]. In return you will slowly unlock [GetDomicileBuilding('fae_the_interior_library_of_the_sage_01').GetName] [domicile_building_upgrade|E] and it's next levels with each Tale's advance."