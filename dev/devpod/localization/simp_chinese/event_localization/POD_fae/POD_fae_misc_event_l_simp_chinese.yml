l_simp_chinese:
 POD_fae_misc.1.title: "噗咔找到了"
 POD_fae_misc.1.desc: "你找到了你要找的噗咔"
 POD_fae_misc.1.a: "你的牙齿可真大啊。"
 POD_fae_misc.1.b: "这个真逗。"
 POD_fae_misc.1.c: "小猫咪，小猫咪我爱你。"
 POD_fae_misc.1.d: "这一位可以敲响我的房门。"
 POD_fae_misc.1.e: "我看这家伙养鹰挺有一手的。"
 POD_fae_misc.1.f: "这倒是还能忍受。"
 POD_fae_misc.1.g: "这一款有些地方真是棒极了。"
 POD_fae_misc.1.h: "一会儿见，鳄鱼"
 POD_fae_misc.1.i: "如此摄人心魄的眼眸。"
 POD_fae_misc.1.j: "随我一同嚎叫。"
 POD_fae_misc.1.k: "我需要一个迷宫和一些奶酪属性。"
 POD_fae_misc.1.l: "非常适合雪橇。"
 POD_fae_misc.1.m: "完美的笑容！"
 POD_fae_misc.1.n: "到这里来"
 POD_fae_misc.1.o: "怎么拉长着脸？哦，我看你现在有点声音沙哑了。"
 POD_fae_misc.1.p: "若其咬我，我会变成吸血鬼吗？"
 POD_fae_misc.1.q: "我受够了。"
 POD_fae_misc.1.r: "这么多眼睛啊！"
 POD_fae_misc.1.s: "那一点让我很困扰。"
 POD_fae_misc.1.t: "我们都应该侧着走！"
 POD_fae_misc.1.u: "猴子想，猴子做。"
 POD_fae_misc.1.v: "嗡嗡嗡。"
 POD_fae_misc.1.w: "那小家伙可真是个勤奋的劳动者。"
 POD_fae_misc.1.x: "有耐心的猎人终得猎物。"
 POD_fae_misc.1.y: "这么多条腿！"
 POD_fae_misc.1.z: "我能要一个贝壳吗？"
 POD_fae_misc.1.aa: "这个看起来很危险！"
 POD_fae_misc.1.ab: "如此精致而色彩斑斓的翅膀。"
 POD_fae_misc.1.ac: "兔子是最令人敬畏和最荣耀的动物，由一雄兔在我的王庭中代表它们，实在再合适不过了。"
 POD_fae_misc.1.ad: "我想我会叫他们“软塌塌”的。"
 POD_fae_misc.1.ae: "我在找一个噗咔，是吗？我想不是。"
 POD_fae_misc.2.t: "$POD_lilin_objective_decision$"
 POD_fae_misc.2.desc: "演员已就位，我拥有所需的一切知识，以自我为莉莉丝重演她的传说。盛大的剧目即将开场，另一位莉莉丝也即将诞生。\n\n于是戏剧开场，远梦界中传说的再演。演员们各司其职，而我是舞台的中心。第一男与第一女的创造、莉莉丝与其造物主的决裂、反叛、逃离。所有主要幕次依次上演，我们在剧名中忘却自我。一切完美重现，毫无差错。\n\n而当幕布落下，演员们回归平凡生活。梦界本身也接纳了我们的版本，视其为同一事件的另一面貌。我亦重生焕然一新。我或许不再是莉莉丝，但也绝非寻常的莉莉姆。"
 POD_fae_misc.2.a: "黑暗神化"
 POD_fae_misc.3.t: "人类指南"
 POD_fae_misc.3.desc: "人类对梦界美妙的世界视而不见，仅在沉睡时能捕捉到一丝碎片。因此，他们偏离正道走向不信，也就不足为奇了。\n\n但幸运的是，在人类铸成大错之前，你及时出现。你引导迷途者回归正道，凭借你对主要知识源的控制，你能确保此类事情不再重演。"
 POD_fae_misc.3.a: "美好的未来在等待着。"
 POD_fae_misc.3_custom1: "若不属于哀怒廷，则显著提升文化传播与“发展伯爵领”决议的可用性。s"
 POD_fae_misc.4.t: "愿望已实现"
 POD_fae_misc.4.a: "你的愿望就是我的命令。"
 POD_fae_misc.4.desc_brains_wish: "所以……你想成为家族的智囊？\n\n你的脑子会比你想要的更亲近家族。"
 POD_fae_misc.4.desc_enemies_wish: "那么……你希望在敌人动手之前看清他们？\n\n他们会在你脑海中行动。"
 POD_fae_misc.4.desc_feared_wish: "所以……你希望被畏惧吗？\n\n那么他们就会畏惧你，以及你的一切。"
 POD_fae_misc.4.desc_marriage_wish: "所以……你想给婚姻生活加点料？\n\n加点料当然可以，但说不定会适得其反。"
 POD_fae_misc.4.desc_speaking_wish: "所以……你希望所有人都唯你马首是瞻？\n\n而那些话语会悬而未决……前提是你能把它们说出口才行。"
 POD_fae_misc.4.desc_dwarf_wish: "所以……你渴望在敌人面前显得矮人一等吗？\n\n那你便注定是个矮人。"
 POD_fae_misc.4.desc_appearance_wish: "那么……你希望无论走到哪里都能引人注目吗？\n\n他们确实会回头，只是也许并非你所期望的那种方式。"
 POD_fae_misc.4.desc_spouse_wish: "所以你希望你的配偶眼里只有你？\n\n他们将会只看见你。"
 POD_fae_misc.4.desc_wealth_wish: "那么……你渴望的是无与伦比的财富？\n\n你又拿什么来与之相比呢？"
 POD_fae_misc.4.desc_knowledge_wish: "那么……你渴望获得超出你理解范围的知识？\n\n你必将获得知识，只是那知识将超越你的理解。"
 POD_fae_misc.4.desc_conscience_wish: "那么……你希望摆脱你的忧虑和罪恶感吗？\n\n当一切真相大白于众时，你便能如愿以偿了。"
 POD_fae_misc.400.t: "愿望成真"
 POD_fae_misc.400.desc: "由于你以许愿闻名，但实现方式却与人们的预期相悖，这已影响了众多强大的超自然存在。就连凡人也传颂着那位臭名昭著的精灵及其狡诈手段，毫无疑问，这将极大地增强精灵抵御板讷侵蚀的能力。"
 POD_fae_misc.400.a: "对我来说，这很自然。"