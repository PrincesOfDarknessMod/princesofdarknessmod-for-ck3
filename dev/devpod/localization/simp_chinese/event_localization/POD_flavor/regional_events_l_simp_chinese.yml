l_simp_chinese:
 baybars_purge_small_modifier: "拜巴尔斯大清洗：火种"
 baybars_purge_small_modifier_desc: "超自然生物在这里受到猎杀，拜巴尔斯的马穆鲁克在街上游荡并破坏任何可疑活动。"
 PODexile_modifier: "流亡中"
 PODexile_modifier_desc: "该角色正在躲避一个强大的威胁，并且在这期间没有能力妥善管理他们的领土。"
 podregionalevents.2.t: "拜巴尔斯大清洗：火种"
 podregionalevents.2.desc: "埃及现任凡人苏丹是一位马穆鲁克，他是作为土耳其奴隶被买来养大来打仗的，他以出乎许多人意料的出色（也是无情）的效率登上了顶峰。在解决了十字军（通过在他们所在地区的每口井中下毒以及制造沙漠）之后，这个拜巴尔斯现在令人担忧地将他的注意力转向埃及的超自然现象。\n他似乎消息灵通，远远超过任何凡人，并且得到了一个神秘团体的支持。结合他不可动摇的勇气和根除敌人的伟大实践，拜巴尔斯被证明是对埃及超自然力量的真正威胁，他们影响的许多根源已经被挖掘出来并（有时是字面上）被烧毁。\n一些担忧的吸血鬼和其他超自然生物已经在考虑将流亡作为应对这种危险的更可取的选择，理由是拜巴尔斯仍然是凡人，时间最终会赶上他的。"
 podregionalevents.2.a: "是时候拜访新土地了……"
 podregionalevents.2.custom: "你清算你的资产并逃离了埃及。\n你仍然会被告知拜巴尔斯的下落，但不会成为他未来的直接目标。"
 podregionalevents.2.b: "傲慢的凡人!"
 podregionalevents.2.customb: "你冒着拜巴尔斯全面愤怒的风险留在埃及，但也可能在混乱中开拓新机会。"
 baybars_purge_medium_modifier: "拜巴尔斯大清洗：火焰"
 baybars_purge_medium_modifier_desc: "超自然生物在这里受到猎杀，被拜巴尔斯的马穆鲁克以无情而精确的效率屠杀并焚烧。"
 podregionalevents.3.t: "拜巴尔斯大清洗：偶像崇拜"
 podregionalevents.3.desc: "埃及的大多数超自然生物都来自更早的时代，当时这片土地上还崇拜多位神灵。对于拜巴尔斯和他狂热的马穆鲁克们来说，超自然生物们只不过是异教神灵甚至更黑暗实体的原始教徒。随着他加大力度铲除他的苏丹国中的任何超自然生物，拜巴尔现在特别针对“异教”圣地和其他过去时代的古老遗迹。\n一如既往的高效，他的战术被证明非常有效地摧毁了超自然力量持有的无数古埃及文物和珍贵象征。\n如果他们自己没有被火烧死，那么埃及吸血鬼和其他生物似乎在未来将很难记住他们的信仰。"
 podregionalevents.3.a: "我必须保护这些遗物!"
 podregionalevents.3.effect.success.desc: "圣物应受保护！"
 podregionalevents.3.critical.failure.effect.desc: "如此多的知识消逝了……"
 podregionalevents.3.b: "来不及了，是时候逃跑了。"
 podregionalevents.3.c: "真是悲剧……"
 podregionalevents.3.custom: "作为一个流亡者，你只被告知这些事件。"
 podregionalevents.4.t: "拜巴尔斯大清洗：焚烧资产"
 podregionalevents.4.desc: "拜巴尔斯和他的马穆鲁克们仍然在埃及猖獗，甚至有了更多根除超自然生物的动力。对抗它们的努力基本上没有成功，主要是因为拜巴尔斯的神秘赞助人。这些难以捉摸的人物使用比苏丹更狡猾的策略，并且最感兴趣的是摧毁他们的敌人可能在埃及准备好的任何支持。因此，许多吸血鬼甚至其他生物发现他们的权力基础，通常是超过几十年积累的，会突然成为拜巴尔斯那更隐秘的代理人的目标。\n那些试图武力抵抗的人很快就发现自己将在火葬场上，所以除了流亡之外，唯一的解决办法似乎是用比平时更多的欺骗手段来掩盖现有资产。但对抗那些似乎非常有能力发现超自然影响的敌人并不是一件容易的事。"
 podregionalevents.4.a: "他们不会得到我的金子！"
 podregionalevents.4.effect.success.desc: "财宝应受保护！"
 podregionalevents.4.critical.failure.effect.desc: "……我的宝贝"
 baybars_purge_high_modifier: "拜巴尔斯大清洗：地狱火"
 baybars_purge_high_modifier_desc: "超自然生物正在这里被猎杀，拜巴尔斯的马穆鲁克想要杀死他们中的每一个人。令人担忧的是，他们正接近成功。"
 baybars_purge_scorched_modifier: "拜巴尔斯大清洗：焦土"
 baybars_purge_scorched_modifier_desc: "这里什么也没剩下，除了那些在拜巴尔斯和超自然生物的交火中陷入绝望的人的哀叹。"
 podregionalevents.5.t: "拜巴尔斯大清洗：焦土"
 podregionalevents.5.desc: "拜巴尔斯再次加强了他对超自然力量的毁灭行动。这一次，他使用了帮助他战胜十字军的战术：焦土政策。毕竟，如果没有社区可以为他的敌人藏身，他们会更容易找到。\n他的马穆鲁克们如今在全国各地横冲直撞，将任何关于吸血鬼存在的谣言视为烧毁和摧毁的借口。虽然肯定是无情的，但随着越来越多的超自然力量被迫上战场保护他们的族群、邪教甚至家庭，很难否认这种策略的有效性。然而，有些人只是选择与其他人一起流亡。"
 podregionalevents.5.a: "我必须表明立场!"
 podregionalevents.5.effect.success.desc: "他们被赶回去了！"
 podregionalevents.5.critical.failure.effect.desc: "如此多的死亡与毁灭……"
 podregionalevents.6.t: "拜巴尔斯大清洗：马穆鲁克无处不在"
 podregionalevents.6.desc: "拜巴尔斯再次加强了他对超自然生物的毁灭行动。马穆鲁克现在似乎无处不在，他们得到了一开始就在帮助苏丹的神秘教派的支持，并且无情地消灭与$POD_splat_vampire_plural$、$glossary_fera$和其他生物有关的任何事物（或任何人）。没有人知道他们是如何设法在正确的时间出现在正确的地点，但这无疑为他们带来了回报。\n随着对少数选择留在埃及的勇敢者的逐步收紧策略，他们被迫采取越来越极端的措施。关于曾经强大的生物沦落到躲在沙漠中的故事比比皆是，希望能摆脱拜巴尔斯的无情追捕。"
 podregionalevents.6.a: "我必须好好藏着……"
 podregionalevents.6.effect.success.desc: "他们找不到我！"
 podregionalevents.6.critical.failure.effect.desc: "该为我的命逃跑了……"
 podregionalevents.7.t: "拜巴尔斯大清洗：突袭翁布"
 podregionalevents.7.desc: "尽管埃及剩余的赛特之子尽了最大的努力，拜巴尔斯最终还是找到了最大的奖品：翁布神庙。相传，这是赛特亲手建造的第一座神殿，长期供奉着强大吸血鬼蛰眠的躯体。从那时起，它就作为赛特信徒的主要首都，从未受到威胁……直到现在。\n在他的老兵马穆鲁克们和帮助他的神秘猎人组织的支持下，拜巴尔斯现在正在围攻这座古老的堡垒，决心结束超自然的古老吸血鬼对当今忠实的埃及人的黑暗统治。翁布的防御非常强大，但在大清洗的前几晚由于许多防御者的逃跑而人手不足。战斗的结果仍然不确定，但似乎对苏丹有利。"
 podregionalevents.7.a: "我们必须保卫神庙！"
 podregionalevents.7.effect.success.desc: "他们被击退了！"
 podregionalevents.7.critical.failure.effect.desc: "这不可能……"
 baybars_ombos_temple_tt: "同名省份的奇观翁布神庙可能会被拜巴尔斯的攻击摧毁。"
 podregionalevents.9.a: "必须有人来阻止凡人！"
 podregionalevents.8.t: "拜巴尔斯大清洗：突袭火之庭"
 podregionalevents.8.desc: "尽管埃及剩余的赛特之子尽了最大的努力，拜巴尔斯终于找到了最大的奖品之一：火之庭。作为赛特之子正统的堡垒，火之庭是氏族第二强大的神殿（除了翁布本身），几千年来一直是神秘知识和教学方法的宝库。它从未濒临灭绝……直到现在。\n在他的老兵马穆鲁克们和帮助他的神秘猎人组织的支持下，拜巴尔斯现在正在围攻这座古老的堡垒，决心结束超自然的古老吸血鬼对当今忠实的埃及人的黑暗统治。火之庭的防御力量强大，但在大清洗的前几晚，许多保卫者逃跑了，因此人手不足。战斗的结果仍然不确定，但似乎对苏丹有利。"
 baybars_fire_court_tt: "拜赫里耶的奇观火之庭可能被拜巴尔斯的攻击摧毁。"
 podregionalevents.15.t: "拜巴尔斯大清洗：区区凡人"
 podregionalevents.15.desc: "凡人终究还是凡人。尽管他对埃及的超自然生物造成了巨大的恐惧，但拜巴尔斯还是平静地死去了。有些人说他死在哈基姆圣裔刺客的手下，但其他人只是谈论感染的伤口，甚至是普通疾病。随着他的离去，他的大清洗的势头已经完全减弱，他的影子盟友也撤退回了他们来的地方。流王的亲王和$glossary_fera$大酋长们都松了一口气，回到了他们的城市，而埃及似乎又一次对阴影中的居民安全了。\n一些人公开地想知道，如果拜巴尔斯的努力得到更多统治者的效仿会发生什么，而对凡人实际上可以完成的事情的恐惧将在很长一段时间内真实存在于许多埃及吸血鬼的脑海中。"
 podregionalevents.15.a: "时间是最强大的武器。"
 podregionalevents.12.t: "拜巴尔斯大清洗：无所追求？"
 podregionalevents.12.desc: "你是为数不多的勇敢的人之一，尽管拜巴尔斯正对你的种族横冲直撞，但你仍选择留在埃及。这是一个危险的举动，但这也带来了一些机会。你已经设法收集到一些关于苏丹和他的恩人努尔安拉（真主之光）的下落的情报。\n通过更多的侦察，你可以尝试面对他本人。做这样的事情显然是极其危险的，因为你基本上只能靠自己来对抗马穆鲁克的私人守卫和他的术士助手。但是让这样一个令人印象深刻的人在他如此讨厌的东西面前跪下的前景实在太有吸引力……"
 podregionalevents.12.a: "我会找到他的……"
 baybars_pursuit_tt: "#R 显然，这是一个非常危险的选择。你已经被警告过了。#!"
 podregionalevents.12.effect.success.desc: "找到你了……"
 podregionalevents.12.critical.failure.effect.desc: "终止计划！"
 podregionalevents.12.b: "太危险了。"
 nick_father_conquests: "征服之父"
 podregionalevents.13.t: "拜巴尔斯大清洗：本人"
 podregionalevents.13.desc: "在使用了所有可用的工具和影响力之后，你终于找到了这个人：拜巴尔斯。你设法攻破了他的宫殿，分散了对手的注意力，但苏丹可能不是最紧迫的威胁。虽然拜巴尔斯肯定是一位有成就的战士，但他只是一个凡人，对于他在努尔安拉的影子赞助人来说就不能这么说了。\n虽然他们中的许多人分心或在别处忙碌，但即使是留下保护马穆鲁克的少数剩余人员也被证明是致命的防御。不过到了这个阶段，已经没有回头路了，他们不会让你活着逃走的。\n这并不容易。"
 podregionalevents.13.a: "你的大清洗将就此终结！"
 podregionalevents.13.effect.success.desc: "胜利！"
 podregionalevents.13.critical.failure.effect.desc: "又被清洗了一个……"
 podregionalevents.20.t: "利沃尼亚战争"
 podregionalevents.20.desc: "约根大人，目前有两个主要问题折磨着你的头脑。首先，利沃尼亚的野者们最近粉碎了一支派来使他们皈依的黑十字骑士团，骑士们在普鲁士的最后财产面临着很大的压力。其次，巴黎的亚历山大——流亡的法国领主一直是你的眼中钉，他要求支持夺回王位的要求在夜里变得越来越紧迫。幸运的是，精明的罗莎蒙女士在最近的一次庭审中为这两个问题提供了一个潜在的解决方案。\n剧本很简单。派亚历山大指挥剩下的黑十字骑士团，粉碎利沃尼亚。如果他赢了？你会征服异教徒，亚历山大会得到你的支持向巴黎进军。如果他输了？好吧，他至少不会是你（和罗莎蒙德夫人）的麻烦了。真正的双赢。"
 podregionalevents.20.a: "亚历山大领主，我有一个提议……"
 podregionalevents.20.b: "我可以亲自出马处理亚历山大和喀喇。"
 podregionalevents.20.tt: "如果亚历山大接受，他将前往普鲁士，而你将取回他的财产。"
 podregionalevents.16.desc: "亚历山大大人，您不情愿的东道主约根·冯·费尔登，最近为您提供了一项有趣的任务。你将指挥普鲁士剩下的黑十字骑士团，接受德国的增援，然后向利沃尼亚的荒原进军。那些野蛮的冈格罗最近对骑士团进行了猛烈的功击，因此出现了目前的情况。\n这可能是你凯旋返回巴黎的坚实的第一步，久经沙场的德国骑士在你的指挥下，从你的辉煌胜利中获得声望。即使是美丽的罗莎蒙夫人也鼓励你追求这一崇高的追求，以值得她永恒的爱。"
 podregionalevents.16.a: "这将是我回归的第一步。"
 podregionalevents.16.b: "我还有别的计划。"
 podregionalevents.16.tt: "你将接管普鲁士剩余的黑十字骑士团，并将梅森堡归还约根。"
 podregionalevents.17.desc: "亚历山大大人，您已经抵达了普鲁士，并为新邻居做了准备工作。这个喀喇似乎令人印象深刻（对于一个野蛮的冈格罗来说），你必须承认，他的部落所表现出的英勇有点令人尊敬。这让你考虑是否可能采取其他行动。你可以向这个人提出联盟提议，利用他的战士为你谋利，巩固你在这里的地位。显然，这将意味着放弃约根承诺的增援，而且无论如何无法保证冈格罗会接受这一提议。按照最初的计划，粉碎这些野者，然后在德国人的帮助下返回巴黎，可能会更安全。"
 podregionalevents.17.a: "我们把这些野蛮人扫地出门吧"
 podregionalevents.17.b: "派人请求和酋长见面。"
 podregionalevents.17.tt: "如果喀喇接受了，你将与他结盟，但不会从黑十字获得额外的部队。如果喀喇拒绝，你将与其开战，但当约根得知你的计划后，增援部队将会减少。"
 podregionalevents.18.desc: "喀喇酋长，你刚刚收到消息，黑十字骑士团再次对你的偏远村庄发动袭击。当你在十年前粉碎了他们的第一次尝试时，你并不幻想这会是结束。德维拉警告过你，这次远征的领导者亚历山大不仅仅是一个德国中尉。他是强大的流亡巴黎亲王，年龄和力量远远超过你自己。\n这次有如此可怕的敌人和远比从前更多的骑士，你的部落可能会不堪重负。不过，你不是懦夫，如果需要战争来保护你的人民，那么战争就是你给这个傲慢的梵卓的回应。"
 podregionalevents.18.a: "我们为此做好了准备。"
 podregionalevents.19.desc: "喀喇酋长，正如预期的那样，黑十字骑士团回来了。多亏了德维拉的预警，你已经为此和战争做好了准备。然而，对于他们的新领导人向你伸出的友谊之手。你却没有丝毫准备。\n显然，这位巴黎的亚历山大是一位流亡的王子，对德国基督徒几乎没有什么爱。他的目光集中在重新夺回法国的王位上。他提出与你的部落结盟。你会承诺在合适的时候帮助他重新征服法国。就他而言，只要他掌权，他就会阻止黑十字骑士团对你土地的攻击，在可预见的未来中保护你的部落。你知道，他可能打算利用你们的人民作为战争的耗材，但没有人说联盟是永恒的……暂时的缓刑可能正是你所需要的。"
 podregionalevents.19.a: "不，我们将会战斗。"
 podregionalevents.19.b: "我们接受了。"
 podregionalevents.19.a.desc: "他选择了战争！"
 alexander_livonia_decision: "利沃尼亚战争"
 alexander_livonia_decision_tooltip: "返回法国？"
 alexander_livonia_decision_desc: "一旦你完成了约根的苦力活并粉碎了异教徒，那就是时候迫使德国人履行诺言，帮助你回到法国了。"
 alexander_livonia_decision_confirm: "回到严肃的问题上。"
 alexander_livonia_decision_effect_tooltip: "你将有机会选择是回到法国还是背叛约根留在利沃尼亚。"
 podregionalevents.21.desc: "虽然粉碎利沃尼亚的异教徒是一种很好的消遣（毕竟这是几个世纪以来你第一次举起剑），但这只不过是你实现真正目标的垫脚石。这些土地是你心爱的巴黎的可怜的影子，你一想到要让叛徒萨利安娜和若弗鲁瓦付出代价，就会热血沸腾。\n根据你与约根·冯·费尔登的协议，你必须放弃对利沃尼亚（以及为这场战争租借给你的普鲁士）的控制权，作为交换，黑十字骑士团会给你他们对沃库勒尔的控制权和一支庞大的军队，并开始你向大王庭的凯旋之旅。"
 podregionalevents.21.a: "不要背叛我，德国人。"
 podregionalevents.21.b: "我渐渐喜欢上这个地方了……"
 podregionalevents.21.effect.success.desc: "亚历山大信守诺言！"
 jurgen_gets_livonia_tt: "亚历山大转交了利沃尼亚的控制权！"
 podregionalevents.21.effect.failure.desc: "亚历山大背叛了你！"
 jurgen_dont_get_livonia_tt: "亚历山大选择待在利沃尼亚。"
 podregionalevents.22.desc: "随着你新联盟的稳固，是时候再次关注法国了。尽管萨利安娜和若弗鲁瓦尽最大努力驱逐你剩下的忠诚者，但仍然有一些人忠于这位曾经和未来的法国主人。其中最著名的是里昂亲王弗朗索瓦·德阿伦库。虽然他不那么算是你的朋友，但他忠于错误，因此不喜欢针对你的欺骗性政变。说服他屈膝帮助你凯旋归来应该很容易。\n还有一件小事——你背叛了约根·冯·费尔登，与喀喇结盟，把普鲁士据为己有。但是，坦率地说，谁在乎一个卑微的德国亲王怎么想？当你第一次出现在他的宫廷上时，他就应该跳起来帮助你，而不是让你越过这些烦人的障碍。"
 podregionalevents.22.a: "先是里昂，然后是巴黎。"
 jurgen_dont_get_livonia_worse_tt: "他和喀喇结盟了！"
 qarakh_livonia_decision: "利沃尼亚战争"
 qarakh_livonia_decision_tooltip: "是时候解决这些事情了。"
 qarakh_livonia_decision_desc: "随着黑十字军的第二次入侵得到解决，是时候迫使十字军坐到和平谈判桌前了。按照你的条件。"
 qarakh_livonia_decision_confirm: "我们赢了。"
 qarakh_livonia_decision_effect_tooltip: "你将与约根·冯·费尔登和黑十字骑士团休战。他们会向你提议，让你夺回他们在普鲁士的主要据点马尔堡。"
 podregionalevents.23.desc: "喀喇酋长，黑十字军第二次被你们部落的力量击败了。即使是强大的亚历山大的领导也不足以摧毁你的精神。尽管利沃尼亚正在举行庆祝活动，但你很清楚德国人仍然是一个威胁。这就是为什么你听到约根·冯·费尔登呼吁和平谈判时感到惊讶的原因。\n这个人（你必须承认，他比亚历山大更讨人喜欢）似乎对最近的失败并不那么在意。如果有的话，你会觉得他出于某种未知的原因欢迎你的胜利。他毫无说服力地接受了利沃尼亚和黑十字军之间长达20年的和平条约。然而，他希望看到马尔堡恢复他的统治，并准备为此做出让步。"
 podregionalevents.23.a: "我们接受你的献礼。"
 podregionalevents.23.b: "不，滚回德国去吧。"
 podregionalevents.23.effect.failure.desc: "亚历山大输掉了这场战争。"
 jurgen_dont_get_malbork_tt: "至少，他不会打扰你了。"
 jurgen_get_malbork_tt: "喀喇把马尔堡交还给你，以换取更长的和平。"