l_simp_chinese:
 rule_baybars_purge_difficulty:0 "拜巴尔斯大清洗危机"
 setting_baybars_purge_difficulty_none:0 "无大清洗"
 setting_baybars_purge_difficulty_none_desc:0 "拜巴尔斯对埃及超自然的大清洗不会发生。"
 setting_baybars_purge_difficulty_default:0 "默认拜巴尔斯大清洗"
 setting_baybars_purge_difficulty_default_desc:0 "拜巴尔斯对埃及超自然的大清洗将会发生。"
 baybars_purge_small_modifier:0 "拜巴尔斯大清洗：火种"
 baybars_purge_small_modifier_desc:0 "超自然生物在这里受到猎杀，拜巴尔斯的马穆鲁克在街上游荡并破坏任何可疑活动。"
 PODexile_modifier:0 "流亡中"
 PODexile_modifier_desc:0 "这个角色正在躲避一个强大的威胁，并且在这期间没有能力妥善管理他们的领土。"
 podregionalevents.2.t:0 "拜巴尔斯大清洗：火种"
 podregionalevents.2.desc:0 "埃及现任凡人苏丹是一位马穆鲁克，他是作为土耳其奴隶被买来养大来打仗的，他以出乎许多人意料的出色（也是无情）的效率登上了顶峰。在解决了十字军（通过在他们所在地区的每口井中下毒以及制造沙漠）之后，这个拜巴尔斯现在令人担忧地将他的注意力转向埃及的超自然现象。\n他似乎消息灵通，远远超过任何凡人，并且得到了一个神秘团体的支持。结合他不可动摇的勇气和根除敌人的伟大实践，拜巴尔斯被证明是对埃及超自然力量的真正威胁，他们影响的许多根源已经被挖掘出来并（有时是字面上）被烧毁。\n一些担忧的吸血鬼和其他超自然生物已经在考虑将流亡作为应对这种危险的更可取的选择，理由是拜巴尔斯仍然是凡人，时间最终会赶上他的。"
 podregionalevents.2.a:0 "是时候拜访新土地了……"
 podregionalevents.2.custom:0 "你清算你的资产并逃离了埃及。\n你仍然会被告知拜巴尔斯的下落，但不会成为他未来的直接目标。"
 podregionalevents.2.b:0 "傲慢的凡人!"
 podregionalevents.2.customb:0 "你冒着拜巴尔斯全面愤怒的风险留在埃及，但也可能在混乱中开拓新机会。"
 baybars_purge_medium_modifier:0 "拜巴尔斯大清洗：火焰"
 baybars_purge_medium_modifier_desc:0 "超自然生物在这里受到猎杀，被拜巴尔斯的马穆鲁克以无情而精确的效率屠杀并焚烧。"
 podregionalevents.3.t:0 "拜巴尔斯大清洗：偶像崇拜"
 podregionalevents.3.desc:0 "埃及的大多数超自然生物都来自更早的时代，当时这片土地上还崇拜多位神灵。对于拜巴尔斯和他狂热的马穆鲁克们来说，超自然生物们只不过是异教神灵甚至更黑暗实体的原始教徒。随着他加大力度铲除他的苏丹国中的任何超自然生物，拜巴尔现在特别针对“异教”圣地和其他过去时代的古老遗迹。\n一如既往的高效，他的战术被证明非常有效地摧毁了超自然力量持有的无数古埃及文物和珍贵象征。\n如果他们自己没有被火烧死，那么埃及吸血鬼和其他生物似乎在未来将很难记住他们的信仰。"
 podregionalevents.3.a:0 "我必须保护这些遗物!"
 podregionalevents.3.effect.success.desc:0 "圣物应受保护！"
 podregionalevents.3.critical.failure.effect.desc:0 "如此多的知识消逝了……"
 podregionalevents.3.b:0 "来不及了，是时候逃跑了。"
 podregionalevents.3.c:0 "真是悲剧……"
 podregionalevents.3.custom:0 "作为一个流亡者，你只被告知这些事件。"
 podregionalevents.4.t:0 "拜巴尔斯大清洗：焚烧资产"
 podregionalevents.4.desc:0 "拜巴尔斯和他的马穆鲁克们仍然在埃及猖獗，甚至有了更多根除超自然生物的动力。对抗它们的努力基本上没有成功，主要是因为拜巴尔斯的神秘赞助人。这些难以捉摸的人物使用比苏丹更狡猾的策略，并且最感兴趣的是摧毁他们的敌人可能在埃及准备好的任何支持。因此，许多吸血鬼甚至其他生物发现他们的权力基础，通常是超过几十年积累的，会突然成为拜巴尔斯那更隐秘的代理人的目标。\n那些试图武力抵抗的人很快就发现自己将在火葬场上，所以除了流亡之外，唯一的解决办法似乎是用比平时更多的欺骗手段来掩盖现有资产。但对抗那些似乎非常有能力发现超自然影响的敌人并不是一件容易的事。"
 podregionalevents.4.a:0 "他们不会得到我的金子！"
 podregionalevents.4.effect.success.desc:0 "财宝应受保护！"
 podregionalevents.4.critical.failure.effect.desc:0 "……我的宝贝"
 baybars_purge_high_modifier:0 "拜巴尔斯大清洗：地狱火"
 baybars_purge_high_modifier_desc:0 "超自然生物正在这里被猎杀，拜巴尔斯的马穆鲁克想要杀死他们中的每一个人。令人担忧的是，他们正接近成功。"
 baybars_purge_scorched_modifier:0 "拜巴尔斯大清洗：焦土"
 baybars_purge_scorched_modifier_desc:0 "这里什么也没剩下，除了那些在拜巴尔斯和超自然生物的交火中陷入绝望的人的哀叹。"
 podregionalevents.5.t:0 "拜巴尔斯大清洗：焦土"
 podregionalevents.5.desc:0 "拜巴尔斯再次加强了他对超自然力量的毁灭行动。这一次，他使用了帮助他战胜十字军的战术：焦土政策。毕竟，如果没有社区可以为他的敌人藏身，他们会更容易找到。\n他的马穆鲁克们如今在全国各地横冲直撞，将任何关于吸血鬼存在的谣言视为烧毁和摧毁的借口。虽然肯定是无情的，但随着越来越多的超自然力量被迫上战场保护他们的族群、邪教甚至家庭，很难否认这种策略的有效性。然而，有些人只是选择与其他人一起流亡。"
 podregionalevents.5.a:0 "我必须表明立场!"
 podregionalevents.5.effect.success.desc:0 "他们被赶回去了！"
 podregionalevents.5.critical.failure.effect.desc:0 "如此多的死亡与毁灭……"
 podregionalevents.6.t:0 "拜巴尔斯大清洗：马穆鲁克无处不在"
 podregionalevents.6.desc:0 "拜巴尔斯再次加强了他对超自然生物的毁灭行动。马穆鲁克现在似乎无处不在，他们得到了一开始就在帮助苏丹的神秘教派的支持，并且无情地消灭与吸血鬼、化形者和其他生物有关的任何事物（或任何人）。没有人知道他们是如何设法在正确的时间出现在正确的地点，但这无疑为他们带来了回报。\n随着对少数选择留在埃及的勇敢者的逐步收紧策略，他们被迫采取越来越极端的措施。关于曾经强大的生物沦落到躲在沙漠中的故事比比皆是，希望能摆脱拜巴尔斯的无情追捕。"
 podregionalevents.6.a:0 "我必须好好藏着……"
 podregionalevents.6.effect.success.desc:0 "他们找不到我！"
 podregionalevents.6.critical.failure.effect.desc:0 "该为我的命逃跑了……"
 podregionalevents.7.t:0 "拜巴尔斯大清洗：突袭翁布"
 podregionalevents.7.desc:0 "尽管埃及剩余的赛特之子尽了最大的努力，拜巴尔斯最终还是找到了最大的奖品：翁布神庙。相传，这是赛特亲手建造的第一座神殿，长期供奉着强大吸血鬼蛰眠的躯体。从那时起，它就作为赛特信徒的主要首都，从未受到威胁……直到现在。\n在他的老兵马穆鲁克们和帮助他的神秘猎人组织的支持下，拜巴尔斯现在正在围攻这座古老的堡垒，决心结束超自然的古老吸血鬼对当今忠实的埃及人的黑暗统治。翁布的防御非常强大，但在大清洗的前几晚由于许多防御者的逃跑而人手不足。战斗的结果仍然不确定，但似乎对苏丹有利。"
 podregionalevents.7.a:0 "我们必须保卫神庙！"
 podregionalevents.7.effect.success.desc:0 "他们被击退了！"
 podregionalevents.7.critical.failure.effect.desc:0 "这不可能……"
 baybars_ombos_temple_tt:0 "同名省份的奇观翁布神庙可能会被拜巴尔斯的攻击摧毁。"
 podregionalevents.9.a:0 "必须有人来阻止凡人！"
 podregionalevents.8.t:0 "拜巴尔斯大清洗：突袭火之庭"
 podregionalevents.8.desc:0 "尽管埃及剩余的赛特之子尽了最大的努力，拜巴尔斯终于找到了最大的奖品之一：火之庭。作为赛特之子正统的堡垒，火之庭是氏族第二强大的神殿（除了翁布本身），几千年来一直是神秘知识和教学方法的宝库。它从未濒临灭绝……直到现在。\n在他的老兵马穆鲁克们和帮助他的神秘猎人组织的支持下，拜巴尔斯现在正在围攻这座古老的堡垒，决心结束超自然的古老吸血鬼对当今忠实的埃及人的黑暗统治。火之庭的防御力量强大，但在大清洗的前几晚，许多保卫者逃跑了，因此人手不足。战斗的结果仍然不确定，但似乎对苏丹有利。"
 baybars_fire_court_tt:0 "拜赫里耶的奇观火之庭可能被拜巴尔斯的攻击摧毁。"
 podregionalevents.15.t:0 "拜巴尔斯大清洗：区区凡人"
 podregionalevents.15.desc:0 "凡人终究还是凡人。尽管他对埃及的超自然生物造成了巨大的恐惧，但拜巴尔斯还是平静地死去了。有些人说他死在哈基姆圣裔刺客的手下，但其他人只是谈论感染的伤口，甚至是普通疾病。随着他的离去，他的大清洗的势头已经完全减弱，他的影子盟友也撤退回了他们来的地方。流王的亲王和化形者大酋长们都松了一口气，回到了他们的城市，而埃及似乎又一次对阴影中的居民安全了。\n一些人公开地想知道，如果拜巴尔斯的努力得到更多统治者的效仿会发生什么，而对凡人实际上可以完成的事情的恐惧将在很长一段时间内真实存在于许多埃及吸血鬼的脑海中。"
 podregionalevents.15.a:0 "时间是最强大的武器。"
 podregionalevents.12.t:0 "拜巴尔斯大清洗：无所追求？"
 podregionalevents.12.desc:0 "你是为数不多的勇敢的人之一，尽管拜巴尔斯正对你的种族横冲直撞，但你仍选择留在埃及。这是一个危险的举动，但这也带来了一些机会。你已经设法收集到一些关于苏丹和他的恩人努尔安拉（真主之光）的下落的情报。\n通过更多的侦察，你可以尝试面对他本人。做这样的事情显然是极其危险的，因为你基本上只能靠自己来对抗马穆鲁克的私人守卫和他的术士助手。但是让这样一个令人印象深刻的人在他如此讨厌的东西面前跪下的前景实在太有吸引力……"
 podregionalevents.12.a:0 "我会找到他的……"
 baybars_pursuit_tt:0 "#R 显然，这是一个非常危险的选择。你已经被警告过了。#!"
 podregionalevents.12.effect.success.desc:0 "找到你了……"
 podregionalevents.12.critical.failure.effect.desc:0 "终止计划！"
 podregionalevents.12.b:0 "太危险了。"
 nick_father_conquests:0 "征服之父"
 podregionalevents.13.t:0 "拜巴尔斯大清洗：本人"
 podregionalevents.13.desc:0 "在使用了所有可用的工具和影响力之后，你终于找到了这个人：拜巴尔斯。你设法攻破了他的宫殿，分散了对手的注意力，但苏丹可能不是最紧迫的威胁。虽然拜巴尔斯肯定是一位有成就的战士，但他只是一个凡人，对于他在努尔安拉的影子赞助人来说就不能这么说了。\n虽然他们中的许多人分心或在别处忙碌，但即使是留下保护马穆鲁克的少数剩余人员也被证明是致命的防御。不过到了这个阶段，已经没有回头路了，他们不会让你活着逃走的。\n这并不容易。"
 podregionalevents.13.a:0 "你的大清洗将就此终结！"
 podregionalevents.13.effect.success.desc:0 "胜利！"
 podregionalevents.13.critical.failure.effect.desc:0 "又被清洗了一个……"