l_simp_chinese:
 podgangrel.1.t: "格差礼：荒诞故事"
 podgangrel.1.desc: "当两位冈格罗第一次见面时，他们通常会进行格差礼。这被视为加强氏族成员之间联系的一种方式，或者对于更具侵略性的吸血鬼来说，可以迅速确立他们的优势。\n初试往往是吹嘘的较量。两个参与者大声吹嘘他们能做的事情，难度越来越高，直到其中一个承认或要求提供证据。当要求提供证据时，两位参赛者必须完成他们最后一个的吹嘘，当他们两人已经互相压制一段时间时，这往往会是一项艰巨的任务。"
 podgangrel.1.a: "杀死一只狼族？啊哈！我能杀掉一整个狼群！"
 POD_gangrel_challenge_interaction_succ: "你的对手认输了！"
 POD_gangrel_challenge_interaction_lose: "你不得不认输。"
 gangrel_challenge_unfriendly_tt: "你的伙伴将记住这一点。"
 podgangrel.2.t: "格差礼：友好试炼"
 podgangrel.2.desc: "你赢得了吹嘘的比赛，你们两个之间的关系也在改善，因为你们现在对彼此有了更多的了解。尽管如此，若在晚上结束时，你赢得胜利，如果你想以对手为代价来提升你的自信，你可以把这场胜利记录在客人的脸上……\n无论如何，仪式将继续进行友好的争吵这将持续到你们中的一个人认输为止。这场较量虽然不是致命的，但却已成为传奇，当两个强大的冈格罗相遇时，一场残酷的战斗随之而来，以确立统治地位。或许你和你的对手会用自己的战斗创造这样的传奇？又或者只是单方面的事情？"
 podgangrel.2.a: "你不擅长吹牛，但愿你更擅长战斗！"
 podgangrel.2.b: "很棒的吹牛技巧，我的朋友，现在让我们战斗吧！"
 podgangrel.3.desc: "你输掉了吹嘘的竞赛，但这仅仅是仪式的开始。当你想知道你的伙伴是否真的能完成他们吹嘘的重大任务时，你得为下一个事件做好准备。\n仪式将继续进行友好的争吵，直到你们中的一个人认输。这场较量虽然不是致命的，但却已成为传奇，当两个强大的冈格罗相遇时，一场残酷的战斗随之而来，以确立统治地位。或许你和你的对手会用自己的战斗创造这样的传奇？又或者只是单方面的事情？"
 podgangrel.3.a: "是时候报仇雪恨了！"
 podgangrel.4.t: "格差礼：旅行故事"
 podgangrel.4.desc: "你已经赢得了你们两个之间的搏斗，并感受着胜利的冲动。被你打败的伙伴以及治愈了他们的伤口并且看起来垂头丧气的，或许你可以在继续前进之前称赞他们的表现。\n格差礼的最后一部分是你们两个之间非正式分享相关信息。冈格罗经常搬家，当你的同胞在该地区时，你应该分享任何可以帮助他们的东西。与臃肿的比赛相反，分享的一切应是关于真理的，而非空洞的承诺。"
 podgangrel.4.a: "多么可耻的表现！"
 podgangrel.4.b: "我感觉运气不错。"
 podgangrel.5.desc: "你已经输掉了你们两个之间的战斗，花点时间治愈你的伤口和受伤的自尊。你的伙伴会等你恢复过来，然后再继续下一个活动。\n格差礼的最后一部分是在你们两个之间非正式地分享相关信息。冈格罗经常搬家，当你的同胞在该地区时，你应该分享任何可以帮助他们的东西。与臃肿的比赛相反，分享的一切应是关于真理的，而非空洞的承诺。"
 podgangrel.5.a: "希望一切顺利。"
 podgangrel.6.t: "格差礼：分道扬镳"
 podgangrel.6.desc: "你显然比你的合作伙伴更了解该地区，这意味着他们将这场比赛让给了您。尽管如此，如果你愿意，对这场胜利表现出仁慈的态度也没什么坏处。\n随着格差礼的正式结束，你们都准备离开了。冈格罗$pod_clan$与许多其他氏族一样，几乎没有传统，也没有集体组织，但这看似微不足道的事件有助于巩固某种氏族文化，有望为未来的更加团结铺平道路。"
 podgangrel.6.a: "你是如此可悲地无知。"
 podgangrel.6.b: "我学到了很多，谢谢你。"
 podgangrel.7.t: "格差礼：出发"
 podgangrel.7.desc: "随着三场比试的正式结束，格差礼也就此圆满结束。不管是好是坏，你现在对这位冈格罗同胞有了更多的了解，而且这次活动有望加强氏族之间的联系。你在仪式中的表现会影响他们未来对你的看法，也许是一段新关系的开始。"
 podgangrel.7.a: "我们之间建立了联系。"
 podgangrel.7.b: "这真是痛苦。"
 podgangrel.7.c: "再见了……"