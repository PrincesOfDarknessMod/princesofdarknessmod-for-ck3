l_simp_chinese:
 POD_divided_version.001.t: "分裂版本"
 POD_divided_version.001.desc: "通过你对护咒的掌握，你可以尝试召唤出你自己的分裂版本。"
 POD_divided_version.001.option.a: "我指使着复本，是时候让其服从了"
 POD_divided_version.001.option.a.tt: "你将尝试制造一位分裂版本"
 POD_divided_version.001.option.a.desc: "与自己作斗争"
 POD_divided_version.001.option.a.tt.success: "一位分裂版本已被成功造出。"
 POD_divided_version.001.option.a.tt.failure: "你没能制造出一位分裂版本"
 POD_divided_version.001.option.b: "还不到时候"
 POD_divided_version.001.option.b.tt: "你将放弃制造分裂版本的想法"
 POD_divided_version.002.t: "分裂版本（二）"
 POD_divided_version.002.desc: "凭着你对护咒的掌握，你成功地制造出了一位分裂版本，现在是时候发出指令了。"
 POD_divided_version.002.option.a: "他们会服从我！"
 POD_divided_version.002.option.a.tt: "一位分裂版本已被成功造出。"
 POD_divided_version.003.t: "分裂版本（二）"
 POD_divided_version.003.desc: "即使以是你目前对护咒的掌握，也不足以制造出一位分裂版本……目前而言。"
 POD_divided_version.003.option.a: "我还没准备好"
 POD_divided_version.003.option.a.tt: "你没能制造出一位分裂版本"
 POD_divided_version.death_management.t: "失去你的复本"
 POD_divided_version.death_management.desc: "噩耗传来，你的分裂版本，已经死亡。"
 POD_divided_version.death_management.option.a: "又一个化为尘土的"
 POD_divided_version.death_management.option.a.tt: "你的分裂版本死了"