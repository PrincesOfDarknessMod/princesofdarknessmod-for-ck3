l_simp_chinese:
 POD_transmogrify.100.t: "塑形"
 POD_transmogrify.100.desc: "利用易变术$pod_discipline$，我可以把我的手下变成美女或野兽。[transmogrifiee.GetSheHe|U]的身体是随我捏的塑像，而我是肌肉、骨骼和血液艺术家。[transmogrifiee.GetFirstName]有一定可能性会无法在过程中存活。"
 POD_transmogrify.100.option.a: "调整[transmogrifiee.GetHerHis]的面貌"
 POD_transmogrify.100.option.b: "修改[transmogrifiee.GetHerHis]的身体"
 POD_transmogrify.100.option.c: "强化[transmogrifiee.GetHerHim]的战斗能力"
 POD_transmogrify.100.option.d: "修改[transmogrifiee.GetHerHis]的感官"
 POD_transmogrify.100.option.e: "什么也不做"
 POD_transmogrify.experiment.desc: "该实验将会检定你的学识能力"
 POD_transmogrify.200.t: "塑形面貌"
 POD_transmogrify.200.desc: "我该如何修正[transmogrifiee.GetFirstNamePossessive]的外观？[transmogrifiee.GetSheHe]有一定可能性会无法在过程中存活。"
