 POD_transmogrify.greatsuccess: "实验大成功"
 POD_transmogrify.moderatesuccess: "实验成功"
 POD_transmogrify.smallsuccess: "实验小成功"
 POD_transmogrify.failure: "实验失败"
 POD_transmogrify.500.t: "塑形"
 POD_transmogrify.500.desc: "[transmogrifiee.GetFirstName]被转变了。"
 POD_transmogrify.500.option.a: "继续实验。"
 POD_transmogrify.500.option.b: "先这样吧。"
 POD_transmogrify.600.t: "塑形"
 POD_transmogrify.600.desc: "[transmogrifiee.GetFirstName]无了。"
 POD_transmogrify.600.option.a: "这就是蜕变凡人的风险"
 POD_transmorgify_ghoul.greatsuccess: "实验大成功。"
 POD_transmogrify.100.option.f: "将[transmogrifiee.GetHerHim]塑造的更年轻或年老"
 POD_transmogrify.700.t: "塑造时间的摧残"
 POD_transmogrify.700.desc: "我该让[transmogrifiee.GetFirstName]看起来更年轻或年老？"
 POD_transmogrify.700.option.a: "年老"
 POD_transmogrify.700.option.b: "年轻"
 POD_transmogrify.700.option.c: "什么也不做"
 POD_transmogrify.1001.t: "学习人体：新人体发现"
 POD_transmogrify.1001.desc: "你已经成功学习了有关[this_trait.GetName( GetPlayer.Self )]的人体知识，现在你可以将其用于意志胜于形体。"
 POD_transmogrify.1001.a: "这需要时间和投入。"
 POD_transmogrify.1001.a.tt: "你将在来年重复学习人体事件。"
 POD_transmogrify.1001.b: "我现在需要休息"
 POD_transmogrify.1001.b.tt: "好极了。"
 POD_transmogrify.1002.t: "学习人体：无可发现"
 POD_transmogrify.1002.desc: "你已经发现了所有你可以利用的人体知识。"
 POD_transmogrify.1002.a: "我现在需要休息"
 POD_transmogrify.500.t: "不惜代价的知识"
 POD_transmogrify.500.desc: "你想学哪项[trait|E]？"
 POD_transmogrify.500.a: "我做出了我的选择。"
 POD_transmogrify.500.a.trigger: "你需要先选一项特质"
 POD_transmogrify.500.b: "我改变主意了。今日不做实验。"
 POD_transmogrify.501.t: "[GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]解刨学"
 POD_transmogrify.501.desc: "我已经很久没有在地牢里实践过我的技艺了，但以前的经历却让我记忆犹新。\n\n经过一番思考和研究，我现在明白了如何运用我的发现。"
 POD_transmogrify.501.a: "现在谁想做我的下一只小白鼠？"
 POD_transmogrify.501.a.tt: "你已经成功学习了有关[GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)][trait|E]知识，现在你可以将其用于意志胜于形体[character_interaction|E]。"
 POD_transmogrify.1005.t: "学习人体：失败！"
 POD_transmogrify.1005.desc: "你没能学习到能用于意志胜于形体的额外知识。"
 POD_transmogrify.1005.a: "希望下次能成功"
 POD_transmogrify.1005.a.tt: "下次我得改进方法了。"
 POD_transmogrify.100.desc: "我该让[recipient.GetFirstName]看起来更年轻或年老？"
 POD_transmogrify.100.widget: "外观年龄：[Character.MakeScope.ScriptValue('POD_effective_age')]"