 POD_transmogrify.300.desc: "我该如何修正[transmogrifiee.GetHerHis]的外观？[transmogrifiee.GetFirstName]有一定可能性会无法在过程中存活。"
 POD_transmogrify.300.option.a: "将[transmogrifiee.GetHerHim]变成巨人"
 POD_transmogrify.300.option.b: "将[transmogrifiee.GetHerHim]变成侏儒"
 POD_transmogrify.300.option.c: "将[transmogrifiee.GetHerHim]变回中等身高。"
 POD_transmogrify.300.option.d: "扭曲[transmogrifiee.GetHerHis]的脊椎将其变成驼背"
 POD_transmogrify.300.option.e: "纠正[transmogrifiee.GetHerHis]的脊椎"
