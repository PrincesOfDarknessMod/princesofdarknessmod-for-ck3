 POD_transmogrify.200.option.a: "将[transmogrifiee.GetHerHis]捏成一般情况下的美人或帅哥。"
 POD_transmogrify.200.option.b: "将[transmogrifiee.GetHerHim]捏成对于凡人社会而言的丑八怪。"
 POD_transmogrify.200.option.c: "取走[transmogrifiee.GetHerHis]皮肤的色素"
 POD_transmogrify.200.option.d: "恢复[transmogrifiee.GetHerHis]皮肤的色素。"
 POD_transmogrify.200.option.e: "在[transmogrifiee.GetFirstName]刻上伤疤"
