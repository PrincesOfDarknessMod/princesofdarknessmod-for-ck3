l_simp_chinese:
 POD_transmogrify.100.t: "重塑岁月的痕迹"
 POD_transmogrify.100.desc: "该让[recipient.GetFirstName]看起来更年轻些，还是更年老一点？"
 POD_transmogrify.100.option.a: "我已经完成设定[recipient.GetFirstNamePossessiveNoTooltip]的年龄。"
 POD_transmogrify.500.t: "知识无价"
 POD_transmogrify.500.desc: "你想学哪项[trait|E]？"
 POD_transmogrify.100.widget: "外观年龄：[Character.MakeScope.ScriptValue('POD_effective_age')]"
 POD_transmogrify.500.a: "我已做出了选择。"
 POD_transmogrify.500.a.trigger: "你需要先选一项特质"
 POD_transmogrify.500.b: "我改主意了，今天不做实验。"
 POD_transmogrify.501.t: "[GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]骨骼"
 POD_transmogrify.501.desc: "我已经好久没在地牢里练手了，但之前的经验我都没忘。\n\n琢磨研究了一阵子后，我现在终于知道该怎么用上这些研究成果了。"
 POD_transmogrify.501.a: "现在谁想当我的下一个实验品？"
 POD_transmogrify.501.a.tt: "你已掌握[GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)][trait|E]，可将其运用于[fleshcrafting|E][character_interaction|E]中。"