 POD_transmogrify.400.t: "塑形骨架"
 POD_transmogrify.400.desc: "我该如何修正[transmogrifiee.GetFirstNamePossessive]的外观？[transmogrifiee.GetSheHe]有一定可能性会无法在过程中存活。"
 POD_transmogrify.400.option.a: "在[transmogrifiee.GetHerHim]身上装上天然武器"
 POD_transmogrify.400.option.b: "通过骨甲保护[transmogrifiee.GetHerHim]"
