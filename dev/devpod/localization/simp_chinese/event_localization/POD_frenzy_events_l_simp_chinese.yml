l_simp_chinese:
 POD_vampire_frenzy_events.001.t: "饥渴血狂！"
 POD_vampire_frenzy_events.001.desc: "心兽在你体内咆哮，为释放而争斗。你饿它太久了，现在它要求你放开缰绳，好让它去充饥。心兽的目标是挣脱束缚，找一位封臣来进食，从最近的源头满足它贪得无厌的嗜血欲望。它对你身体的控制随着时间的流逝而增强，你的视线边缘逐渐变红。你可以试着与心兽争斗，但是放手会感觉更好……#beast 既然我们都知道我会赢，你为何还要争斗？#!"
 POD_vampire_frenzy_events.001.succumb: "屈从于血狂"
 POD_vampire_frenzy_events.001.succumb.beast: "#beast 让我向你展示真正的愉悦。#!"
 POD_vampire_frenzy_events.001.fight: "抵抗血狂"
 POD_vampire_frenzy_events.001.fight.beast: "#beast 这还不够。“你”还不够。#!"
 POD_vampire_frenzy_events.001.fightwp: "催动你的全部意志来抵抗血狂。"
 POD_vampire_frenzy_events.001.fightwp.beast: "#beast 如果不是今天，便是明天……最好现在就放弃哦亲。#!"
 POD_vampire_frenzy_events.001.fight.failed: "心兽获得了控制权"
 POD_vampire_frenzy_events.001.desc.instinct: "心兽在你体内咆哮，为释放而争斗。你饿它太久了，现在它要求你放开缰绳，好让它去充饥。心兽的目标是挣脱束缚，找一位封臣来进食，从最近的源头满足它贪得无厌的嗜血欲望。它对你身体的控制随着时间的流逝而增强，你的视线边缘逐渐变红。你能感觉到你眼后的压力，知道是时候乘着机会，让心兽出去了。但是你该怎么做呢？"
 POD_vampire_frenzy_events.001.drain: "我将去找我的凡人仆从，并吸他们。"
 POD_vampire_frenzy_events.001.drain.beast: "#beast 简单又恰到好处。我喜欢！#!"
 POD_vampire_frenzy_events.001.vamp: "我能闻到宫廷其他血族的香甜精血。"
 POD_vampire_frenzy_events.001.vamp.beast: "#beast 吸其他吸血鬼？好新奇！#!"
 POD_vampire_frenzy_events.001.social: "我将在此处立即吸食。我才不管宫廷会怎么想。"
 POD_vampire_frenzy_events.001.social.beast: "#beast 吵死了！#!"
 POD_vampire_frenzy_events.001.breach: "我将跑到街外并随便吸食一位路人。"
 POD_vampire_frenzy_events.001.breach.beast: "#beast 因为那总是可行吗？#!"
 POD_vampire_frenzy_events.201.t: "饥渴血狂：后果"
 POD_vampire_frenzy_events.201.desc: "你在彻底的狂喜中醒来，无法将注意力集中在你周围的任何事物上。片刻之后，你意识到，该快感来自于你刺入凡人体内的尖牙。你推开后发现了[mortal.GetTitledFirstName]，你的一个人类普通。好像是心兽用你的身体攻击了他。\n[mortal.GetTitledFirstName]没有动，快速检查证明[mortal.GetSheHe]没有血了。除非你做点什么，否则[mortal.GetTitledFirstName]就会死在你怀里。#beast [mortal.GetSheHe]死后能为我们做的事比生前更多。#!"
 POD_vampire_frenzy_events.201.kill: "我什么都做不了。[mortal.GetTitledFirstName]将死亡。"
 POD_vampire_frenzy_events.201.kill.beast: "#beast 凡人实现了他们的目的。#!"
 POD_vampire_frenzy_events.201.embrace: "我将$pod_Embrace$其来保其命。"
 POD_vampire_frenzy_events.201.embrace.beast: "#beast 你拯救的是他们的命，还是你的良心？#!"
 POD_vampire_frenzy_events.301.t: "饥渴血狂：后果"
 POD_vampire_frenzy_events.301.desc: "在你陷入血狂之前看到的最后一件物事是[bonder.GetTitledFirstName]。现在你在[bonder.GetHerHis]的内庭醒了过来，血从你的尖牙滴落。[bonder.GetTitledFirstName]站在你面前，灰白的脸上皱着眉头。你注意到[bonder.GetSheHe]抓着[bonder.GetHerHis]流血的手。血的痕迹通向你，你一想到你伤害了[bonder.GetTitledFirstName]，你就会感到一阵剧痛。对[bonder.GetTitledFirstName]的新感情很让人困惑，但更让人困惑的是，你的血狂让你吸下了另一位吸血鬼的血。[bonder.GetTitledFirstName]似乎也不急于解释。"
 POD_vampire_frenzy_events.301.a: "我担心其将会再次出来作祟。"
 POD_vampire_frenzy_events.301.a.beast: "#beast 我们必须确保这不会发生。#!"
 POD_vampire_frenzy_events.401.t: "饥渴血狂：后果"
 POD_vampire_frenzy_events.401.desc: "这只心兽选择了最糟糕的时机起了躁动——你当时正在重要宫廷会议中。你想逃走，但心兽不肯等。你最终对一个你想不起名字的吸血鬼的小凡人仆从发动了攻击。该凡人幸存了下来，而它的主人因为太过无名而莫得要求补偿，但你的宫廷现在认为你很软弱。你觉得你在自己的国度中失去了一些尊重。"
 POD_vampire_frenzy_events.401.a: "我会保证将来会抓到一只凡人在手。"
 POD_vampire_frenzy_events.401.a.beast: "#beast 这没啥帮助。#!"
 POD_vampire_frenzy_events.501.t: "饥渴血狂：后果"
 POD_vampire_frenzy_events.501.desc: "这只心兽选择了最糟糕的时机起了躁动——你当时正在重要宫廷会议中。你设法在心兽失控之前逃走了，避免了你在宫廷中受辱。在外面，心兽跳到了离你最近的一个人身上，让你用尖牙咬进他的肉里。你在他干枯后醒来。你擦去嘴唇上的血，以为问题已经解决了。只有那时你才注意到凡人正盯着你看。"
 POD_vampire_frenzy_events.501.a: "我必须得处理这件事。"
 POD_vampire_frenzy_events.501.a.beast: "#beast 他们眼中的恐惧是多么可爱。#!"
 POD_vampire_frenzy_events.401.opinion_malus: "你的封臣对你的好感降低。"
 POD_vampire_frenzy_events.601.t: "狂暴血狂！"
 POD_vampire_frenzy_events.601.desc.instinct: "所有的吸血鬼体内都有一只[Glossary('心兽','game_concept_beast_desc')]——一股邪恶、愤怒和饥渴的兽性力量。当血族失去控制，心兽克服他们，夺走缰绳，追逐着它的基本欲望，无论是复仇、鲜血还是安全。你同道血族试图驾驭心兽，驾驭血狂的浪潮来到达你的目标。使用它的力量。\n\n你的心兽被你现在的狂怒所激动，它试图挣脱。当你把视线集中在什么地方时，你的视线会变红。你的拳头紧握得很痛苦，只因你试图控制自己。现在应是血狂之时了，但你会把你的狂怒指向谁呢？"
 POD_vampire_frenzy_events.601.desc: "所有的吸血鬼体内都有一只[Glossary('心兽','game_concept_beast_desc')]——一股邪恶、愤怒和饥渴的兽性力量。当血族失去控制，心兽克服他们，夺走缰绳，追逐着它的基本欲望，无论是复仇、鲜血还是安全。你同道血族试图战胜心兽，将其锁在你的内部。否认它的控制。\n\n你的心兽被你现在的狂怒所激动，它试图挣脱。当你把视线集中在什么地方时，你的视线会变红。你的拳头紧握得很痛苦，只因你试图控制自己。如果有一个与心兽争斗的时机，那就是现在，但是让它为你解决问题会更容易……"
 POD_vampire_frenzy_events.601.succumb: "屈从于血狂"
 POD_vampire_frenzy_events.601.succumb.beast: "#beast 让我向你展示真正的愉悦。#!"
 POD_vampire_frenzy_events.601.fight: "抵抗血狂"
 POD_vampire_frenzy_events.601.fight.beast: "#beast 这还不够。“你”还不够。#!"
 POD_vampire_frenzy_events.601.fightwp: "催动你的全部意志来抵抗血狂。"
 POD_vampire_frenzy_events.601.fightwp.beast: "#beast 如果不是今天，便是明天……最好现在就放弃哦亲。#!"
 POD_vampire_frenzy_events.601.troops: "那些守卫看起来很会打……"
 POD_vampire_frenzy_events.601.troops.beast: "#beast 啥？就这？起码选个有点挑战性的对手吧。#!"
 POD_vampire_frenzy_events.601.person: "我多年以来一直想跟那人战斗……"
 POD_vampire_frenzy_events.601.person.beast: "#beast 你还要让他们欺压你多久？#!"
 POD_vampire_frenzy_events.601.social: "我将粉碎我身边的任何物事！"
 POD_vampire_frenzy_events.601.social.beast: "#beast 撞墙哦……真有创意。#!"
 POD_vampire_frenzy_events.601.breach: "这些贫弱凡人将见识我的愤怒！"
 POD_vampire_frenzy_events.601.breach.beast: "#beast 好，让其在我们之前颤抖吧！#!"
 POD_vampire_frenzy_events.601.fight.failed: "心兽获得了控制权"
 POD_vampire_frenzy_events.701.desc: "你正穿过院子，这时你的一位廷臣竟对你的品格恶语相向。你立即陷入血狂冲向该宫廷成员。幸运的是，有一团训练有素、装备精良的警卫站在你和那个可怜的宫廷成员之间。你本对这些精英感到骄傲——你曾亲自训练他们，就是为了对付吸血鬼。但是现在，你可能会后悔训练它们，因为它们会有效地使用你自己的战术来对付你。\n\n在你可能造成重大伤害之前，你被逮捕了，但你人并没有被救出来，你的名声也没救了。"
 POD_vampire_frenzy_events.701.a: "被我的人挫败。"
 POD_vampire_frenzy_events.701.t: "狂暴血狂：后果"
 POD_vampire_frenzy_events.801.t: "狂暴血狂：后果"
 POD_vampire_frenzy_events.801.desc: "狂暴血狂：后果"
 POD_vampire_frenzy_events.801.victorydesc: "你看着你的封臣[target.GetTitledFirstName]痛苦地躺在地板上。你还记得发生了什么——[target.GetTitledFirstName]最近对你很不屑，这已经开始影响你们的人际关系了。你到[target.GetTitledFirstNamePossessive]的私人房间去和[target.GetHerHim]对质，而[target.GetSheHe]竟敢诽谤你！\n\n这种令人发指的说法让你陷入血狂，但结果就倒在你面前。如果所发生的事情被外得知，结果将是灾难性的。不仅你的封臣会怨恨你，你的整个国度也会嘲笑你缺乏控制力。\n\n然而……此时这里只有你和[target.GetTitledFirstName]在这里。仍然有可能确保发生的事情还闷在这个房间里。"
 POD_vampire_frenzy_events.801.lossdesc: "你看着你的封臣[target.GetTitledFirstName]痛苦地躺在地板上。你还记得发生了什么——[target.GetTitledFirstName]最近对你很不屑，这已经开始影响你们的人际关系了。你到[target.GetTitledFirstNamePossessive]的私人房间去和[target.GetHerHim]对质，而[target.GetSheHe]竟敢诽谤你！\n\n这种令人发指的说法让你陷入血狂，由此产生的痛苦和羞耻将贯穿你全身。如果所发生的事情被外得知，结果将是灾难性的。不仅你的封臣会怨恨你，你的整个国度也会嘲笑你缺乏控制力。最重要的是，你输了！\n\n然而……此时这里只有你和[target.GetTitledFirstName]在这里。仍然有可能确保发生的事情还闷在这个房间里。"
 POD_vampire_frenzy_events.801.kill: "死人不会说话……"
 POD_vampire_frenzy_events.801.bribe: "如果[target.GetSheHe]保证不告诉任何人，我将欠[target.GetHerHim]一个人情。"
 POD_vampire_frenzy_events.801.leave: "我再也不想在这多待了，哪怕我的宫廷有异议。"
 POD_vampire_frenzy_events.901.t: "狂暴血狂：后果"
 POD_vampire_frenzy_events.901.desc: "聚会本来进行得很顺利，直到你的两个喝醉了的客人决定在舞池中央打架。你命令他们停止，而他们厚颜无耻地无视你。你重复你的命令，此次声音更大。他们仍然蔑视你。你带着理所当然的愤怒，走到他们面前，大声斥责他们，但毫无效果。混账！\n\n你试图上前直接把它们分开，他们却大胆地推你。你，他们理应的领主！你的愤怒淹没了你的理智，你怒吼着并带着强大到足以粉碎它的力量击打柱子。现在每个人都盯着你看，你意识到这是怎么回事——你失去了理智，并破坏了你自己的城堡。你已经可以看到一些不赞成的眼神。"
 POD_vampire_frenzy_events.901.a: "这将要花钱来摆平。"
 POD_vampire_frenzy_events.101.t: "狂暴血狂：后果"
 POD_vampire_frenzy_events.101.desc: "你低头看你血淋淋的手，你的嘴滴下了几滴$pod_vitae$到你又破又脏的衣服上。这是一个不寻常的夜晚……你不记得它是如何开始的，但你确实记得你愤怒地走上街头，摧毁眼前的一切。你感觉自己如同神一般——势不可挡，无所不能，令人恐惧。凡人在恐惧中逃跑，少数反抗的人落入你的尖牙之下。\n\n撇开你的恐怖行为的道德影响不谈，你已经在凡人的世界引起了相当大的轰动。没有多少人逃过一劫，但那些逃过一劫的人肯定会大肆宣扬你的强大力量和怪物性。它肯定会使你的臣民感到恐惧，但也会引起不必要的注意。"
 POD_vampire_frenzy_events.101.a: "想想我失去控制后能做的事……"
 POD_vampire_frenzy_events.801.toast: "你必须在一场战斗中输给[target.GetTitledFirstName]"
 POD_vampire_frenzy_events.kai: "荣誉即是一切"
 POD_vampire_frenzy_events.kai.beast: "#beast 终有一天你会明白自己的责任感只是误入歧途，臣服于我#!"