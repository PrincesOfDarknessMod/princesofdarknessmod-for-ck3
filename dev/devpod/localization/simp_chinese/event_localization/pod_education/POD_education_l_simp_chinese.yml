l_simp_chinese:
 POD_education_events.1.t: "教育"
 POD_education_events.1.desc: "你的新子嗣已经迈出了[victim.GetHerHis]的第一步。现在已经有足够的经验了解如何进食，很快就该接受正规的教育了，这对[victim.GetHerHis]未来很重要，也对你们的关系很重要。你选择什么教育方法？"
 POD_education_events.1.option.a: "教会[victim.GetFirstName][victim.GetHerHis]的处境"
 POD_education_events.1.option.b: "让[victim.GetHerHim]待在身边，但带有一些自由"
 POD_education_events.1.option.c: "[victim.GetFirstName]会想出[victim.GetHerHis]的办法的"
 POD_education_events.1.option.obedience: "这种教育可以提供听话，但无灵性的，子嗣"
 POD_education_events.1.option.lenient: "平衡的教育"
 POD_education_events.1.option.free: "通过这种教育，[victim.GetFirstName]更有可能变好，也更有自由精神"
 POD_education_events.2.t: "教育：棍棒"
 POD_education_events.2.desc: "如今的年轻人……你还没开始教育那蠢货，你就听到有人抱怨你做事的方式“苛刻”和“不公正”。好像[victim.GetSheHe]会能在其他地方学似的！\n无论如何，你可以看出你的子嗣在你的压力下快要崩溃的迹象，如果你不让步。显然，你可以改变你的方法，但“改变”不是吸血鬼能轻易做到的事情。"
 POD_education_events.2.option.a: "老方法是最好的"
 POD_education_events.2.option.b: "我会让步，目前来说"
 POD_education_events.3.t: "教育：人类联系"
 POD_education_events.3.desc: "你的子嗣还有人际关系，朋友，家庭等等。对于大多数年轻的吸血鬼来说，[victim.GetHerHim]很难对他们放手。很明显，你知道得更清楚，这些感觉最好是隐藏起来，因为[the_masquerade|E]因周边人类的鲁莽行为而受到威胁。而且你经常和你爱的人鲁莽行事。\n也许是时候让你的子嗣学会放下过去了？"
 POD_education_events.3.option.a: "我会为[victim.GetFirstName]掩饰，让年轻人有[victim.GetHerHis]自己的梦想"
 POD_education_events.3.option.b: "孩子，我们得谈谈……"
 POD_education_events.4.t: "教育：自由！"
 POD_education_events.4.desc: "最近，你没太能照顾你的子嗣。你希望这种新获得的自由能让[victim.GetFirstName]发现一些有趣的[victim.GetHerHis]的本人见解，但……不完全是。\n这个不守规矩的稚子还在怨恨你将[victim.GetHerHim]变成了吸血鬼，[victim.GetSheHe]开始公开质疑你的权威，也不回应你罕见的召唤。如果你现在不停止这种行为，事态可能会迅速升级。"
 POD_education_events.4.option.a: "孩子，我们得谈谈……"
 POD_education_events.4.option.b: "总会过去的，大概"
 POD_education_events.100.t: "教育：信仰问题"
 POD_education_events.100.desc: "到目前为止，你的子嗣还遵从你的信仰，主要是因为你这么觉得。但显然，[victim.GetSheHe]还远未了解心兽的内部运作方式以及如何处理它。你将不得不花一些时间来开始这部分的教学，或者聘请一些有学问的心路实践者来帮助你的后嗣。"
 POD_education_events.100.option.a: "首先要知道的是……"
 POD_education_events.100.option.b: "认真听老师讲课。他们并不便宜。"
 POD_education_events.101.t: "教育：人性的诱惑"
 POD_education_events.101.desc: "不顾你的教导，你的子嗣还是受了人性之道的诱惑，这并不奇怪。毕竟，对稚子来说，这是最容易追随的心路，试着接近凡人的脚步。\n你正计划上演一场盛大的信仰秀，在接下来的几个月里不干涉人类，作为事情真相的证明给你的子嗣。或者你也可以顺其自然。"
 POD_education_events.101.option.a: "接下来的几个月我们将被禁足"
 POD_education_events.101.option.b: "年轻人就是年轻人"
 POD_education_events.102.t: "教育：叛逆的诱惑"
 POD_education_events.102.desc: "令人不安的消息，你的间谍终于追踪到你的子嗣最近的失踪是因一伙在你的国度边缘的叛军。这些所谓的“狂徒”对任何有自尊的吸血鬼来说都是一种瘟疫，他们想要废除血的优良传统，徒劳无功地试图获得“自由”。\n你的子嗣必须马上认识到[victim.GetHerHis]的错误，否则[victim.GetSheHe]甚至会开始相信这些愚蠢的事情！"
 POD_education_events.102.option.a: "回你的房间去，没有我的准许不许离开！"
 POD_education_events.102.option.b: "总会过去的，一切都这样"
 POD_education_events.300.t: "教育：结束"
 POD_education_events.300.desc: "你已经尽力了。你的子嗣已经学会了你的处境，学会了控制心兽的方法，甚至学会了如何接近氏族和他们的微妙之处。也许这就足够了。或者也许你已经制造了你所面对的最危险的敌人。\n时间会证明一切，时间总是会证明一切。"
 POD_education_events.300.option.a: "你不再是无助的雏儿了。但你依然是我的子嗣。"
 POD_education_events.5.t: "教育：从容的子嗣"
 POD_education_events.5.desc: "到目前为止，你的子嗣已经适应了[victim.GetHerHis]的新状况。[victim.GetFirstName]不再大惊小怪，[victim.GetSheHe]会聆听你的命令，还是一位勤奋的学生。\n这可能不会持续很久，但已经比大多数子嗣好了。所以趁你还能享受的时候好好享受吧。"
 POD_education_events.5.option.a: "我对你很高兴，孩子"
 POD_education_events.5.option.b: "你将在我的宫廷留下好印象"
 POD_education_events.6.t: "教育：好于外交的子嗣"
 POD_education_events.6.desc: "自从[victim.GetHerHis]的黑夜入门后，[victim.GetFirstName]就对宫廷礼仪表现出了浓厚的兴趣。总是试图了解更多关于你种族的氏族和各种政治，[victim.GetSheHe]已经是你外交牌库中的宝贵资产。\n你也知道羽翼未全的人都是善变的，这种兴趣可能不会持久。正因为如此，你正在考虑尽快兑现这笔资产。"
 POD_education_events.6.option.a: "到目前为止你做得很好，孩子"
 POD_education_events.6.option.b: "你将在未来几周内陪同我的外交官"
 POD_education_events.7.t: "教育：顺从的子嗣"
 POD_education_events.7.desc: "你又一次通过这个特殊的子嗣证明了你的高超技能。每一位[Glossary('尊长','game_concept_Sire_desc')]估计都羡慕你，你的后嗣在尽[victim.GetSheHe]所能顺从地提供帮助，同时也在感谢把[victim.GetHerHim]带到黑夜的伟大指路人。\n你可以集中精力让[victim.GetHerHim]成为长期有用的盟友，或者暂时只是一个可靠的助手。"
 POD_education_events.7.option.a: "让我们谈谈未来，孩子"
 POD_education_events.7.option.b: "回去工作"
 POD_education_events.8.t: "教育：精神的子嗣"
 POD_education_events.8.desc: "你的新子嗣很喜欢黑夜。怀着强烈的好奇心，[victim.GetSheHe]很快就学会了在$pod_cainite$世界生存[victim.GetHerHis]所需的基本知识。你很欣赏，也很欣慰这似乎没有给[victim.GetHerHim]离家独立的想法……目前来说。\n下一步就是要知道你是否会让[victim.GetHerHim]继续这样做，或者为了你的利益，试着和[victim.GetHerHim]更紧密地合作。"
 POD_education_events.8.option.a: "啊，年轻多好！"
 POD_education_events.8.option.b: "让我们合作吧，孩子"
 POD_education_events.9.t: "教育：不圆滑的子嗣"
 POD_education_events.9.desc: "你的子嗣到目前为止做得还不错，除了一个方面：宫廷礼仪。出于某种原因，[victim.GetSheHe]不能完全理解[victim.GetHerHis]在宫廷上应该遵守的适当礼节。这真的没有那么难！如果你想挽回这一外交技能，你将不得不手把手教[victim.GetHerHim]宫廷政治。这可不是什么光荣的事。"
 POD_education_events.9.option.a: "待在这儿看着。什么也别说。"
 POD_education_events.9.option.b: "……行吧，这人还会有别的用处的，大概"
 POD_education_events.103.t: "教育：金钱的诱惑"
 POD_education_events.103.desc: "你的新子嗣在[victim.GetHerHis]适应吸血鬼的过程中表现得相当古怪。[victim.GetSheHe|U]认为[victim.GetHerHis]新状况最好用于……赚钱。[victim.GetSheHe|U]整天都在谈论永生如何意味着轻易的投资、新的机遇和诸如此类的废话。\n当你叹气时，你安慰自己说，这至少是一个比试图谋杀你更好的爱好。但你可能还是想带[victim.GetHerHim]走出这个“阶段”。"
 POD_education_events.103.option.a: "这里是你该死的钱。请自便。"
 POD_education_events.103.option.b: "……那些雏儿接下来还会想什么？"
 POD_education_events.104.t: "教育：虔诚的子嗣"
 POD_education_events.104.desc: "你的子嗣很容易就接受了你的教义作为[victim.GetHerHis]的信仰。你对到目前为止的进步感到很高兴，除了持续的改进之外别无他求。作为一名成功的老师，你也通过这段共同的经历获得了更深的理解。"
 POD_education_events.104.option.a: "正如其所应当"
 POD_education_events.105.t: "教育：享乐的诱惑"
 POD_education_events.105.desc: "你的子嗣适应了[victim.GetHerHis]的新环境。也许有点太好了……[victim.GetFirstName]把[victim.GetHerHis]的时间花在与凡人，甚至其他吸血鬼的聚会上，以一种非常堕落的方式。\n显然，你更希望[victim.GetHerHim]用[victim.GetHerHis]的永生做些有用的事，但现在说服[victim.GetHerHim]可能是一项艰巨的任务。"
 POD_education_events.105.option.a: "把这凡人放下，孩子，我们得谈谈"
 POD_education_events.105.option.b: "我不在乎……"
 POD_education_events.10.t: "教育：好于管理的子嗣"
 POD_education_events.10.desc: "[victim.GetFirstName]自[victim.GetHerHis]的$pod_Embrace$以来一直很有进取心。[victim.GetSheHe]列出了几个计划，以增加你的影响力，并列出新可贿赂的人以确保它不被发现。\n你正在考虑把这个热切的稚子推向这个方向，或者现在就就地利用[victim.GetHerHis]对这些事情的洞察力。"
 POD_education_events.10.option.a: "你的天赋就在于此，孩子"
 POD_education_events.10.option.b: "真有意思，多跟我说说你的计划吧"
 POD_education_events.11.t: "教育：不解的子嗣"
 POD_education_events.11.desc: "你的后嗣没能理解，作为一位吸血鬼，规则与[victim.GetSheHe]在凡生的是不同的。[victim.GetHerHis|U]作为凡人的习惯时正在妨碍[victim.GetHerHim]，管理线人和间谍网络似乎超出了目前[victim.GetHerHis]的理解力。\n你可以组织一个“实践任务”来教[victim.GetHerHim]诀窍，或者干脆放弃这一部分的训练过程。"
 POD_education_events.11.option.a: "跟我来并看好了，孩子"
 POD_education_events.11.option.b: "档案对你来说是禁区"
 POD_education_events.106.t: "教育：冠冕的诱惑"
 POD_education_events.106.desc: "你的新后嗣对吸血鬼的权力结构很着迷。[victim.GetSheHe]想知道所有对于谁统治什么，以及你如何达到你现在的地位，成为一位夜晚的统治者。\n伴着奉承，这可能会使[victim.GetHerHim]迅速接近征服之道，一项你可能不赞成的东西。"
 POD_education_events.106.option.a: "让我们先把精力放在思想上吧，孩子"
 POD_education_events.106.option.b: "为什么，是的，我可以谈论我自己！"
 POD_education_events.12.t: "教育：好于计谋的子嗣"
 POD_education_events.12.desc: "你的新子嗣喜欢吸血鬼政治的阴暗隐秘气氛。[victim.GetSheHe|U]已经战胜了其他一些稚子，并在阴谋方面显示出了强大的天赋。你可以让[victim.GetHerHim]自己去磨练这些技能，或者你可以在[victim.GetHerHis]的帮助下制定一些你正在计划的紧迫计划。"
 POD_education_events.12.option.a: "你做得很好，孩子。就是用其做些不那么好的……"
 POD_education_events.12.option.b: "你觉得这些计划咋么样？"
 POD_education_events.13.t: "教育：轻信的子嗣"
 POD_education_events.13.desc: "你的后嗣很难适应这新亡生。[victim.GetFirstName]只会看表面，没有考虑到吸血鬼政治中每个人都在撒谎。到目前为止，你尽了最大的努力去教[victim.GetHerHim]，却毫无结果。这已经开始让你心烦了。"
 POD_education_events.13.option.a: "这些人不是你的朋友。我们没有朋友。"
 POD_education_events.13.option.b: "嘛，至少其对我来说不再是威胁"
 POD_education_events.107.t: "教育：铁拳的诱惑"
 POD_education_events.107.desc: "你的子嗣对统治问题表现出了极大的兴趣。到目前为止，这种兴趣使[victim.GetHerHim]得出结论：强权即真理。虽然你不一定同意，但你必须承认，你已经从[victim.GetHerHis]的做事方式中获得了一些有趣的见解。也许鼓励[victim.GetHerHim]继续下去会带来更多的经验？"
 POD_education_events.107.option.a: "有比纯粹的力量更重要的能力，孩子"
 POD_education_events.107.option.b: "也许我们终究可以互相学习"
 POD_education_events.14.t: "教育：友好的子嗣"
 POD_education_events.14.desc: "到目前为止，你的后嗣已经很好地适应了亡生。你必须承认，在$pod_Embrace$之前，你就与[victim.GetHerHim]有一种更强烈的联系。也许这一次，你孤独的漫漫长夜将充满新的友谊。"
 POD_education_events.14.option.a: "让我们多谈一点，孩子"
 POD_education_events.108.t: "教育：天国的诱惑"
 POD_education_events.108.desc: "你的子嗣总在[victim.GetHerHis]的凡生时有信仰。正因为如此，你就不会对[victim.GetSheHe]想追随天国之路而感到意外了。然而，你没有预料到的是，[victim.GetSheHe]到目前为止表现出的纯粹的热情。如今，打动你的东西并不多，但也许纯粹的奉献可以是其中之一？"
 POD_education_events.108.option.a: "我就是我"
 POD_education_events.108.option.b: "你是我的启蒙之光，孩子"
 POD_education_events.15.t: "教育：擅长军事的子嗣"
 POD_education_events.15.desc: "吸血鬼的战争和凡人的战争完全不同。这是一件相对隐秘的事务，只需少量的精锐部队，以及灵活的战术技巧。幸运的是，你的子嗣似乎对这种战争方式带来的挑战有一种天生的理解。\n你将如何鼓励[victim.GetHerHim]利用这些初步的成功？"
 POD_education_events.15.option.a: "你自己看着办，孩子"
 POD_education_events.15.option.b: "你应该把你的专长集中在一个领域，孩子"
 POD_education_events.16.t: "教育：无力的子嗣"
 POD_education_events.16.desc: "在所有的问题中，你的子嗣似乎遇到了关于吸血鬼战争的问题。很明显，这些战争与凡人的战争截然不同，因为由数量很少的精锐部队进行，对于一个没有准备的指挥官来说，这些战争很难评估。你可以忘记这个问题，因为并不是所有的吸血鬼都注定要见到战场，或者组织一些当地的凡人部队来让你的孩子学到一些东西。"
 POD_education_events.16.option.a: "专注于你的其他课程，孩子"
 POD_education_events.16.option.b: "让我们跟凡人下一盘战棋吧，孩子"
 POD_education_events.17.t: "教育：平庸的子嗣"
 POD_education_events.17.desc: "到目前为止，你的新后嗣做得还不错。也没显现什么特别之处，这让你觉得[victim.GetSheHe]可能在其他方面有用。也许用来杀鸡儆猴？绝大多数的$pod_cainites$都很好地展示了他们后嗣的才华，但你可以将这种习惯反过来。将你子嗣的心智碾碎，展示毫无理由的残酷，你会在以后的很长一段时间里都让人惧怕……"
 POD_education_events.17.option.a: "这将不会痛……很久"
 POD_education_events.17.option.b: "这家伙依然能有用"
 POD_education_events.109.t: "教育：残暴的诱惑"
 POD_education_events.109.desc: "你的子嗣似乎太急切地接受了[victim.GetHerHis]的黑夜怪物新身份。你已经听说过他参与的令人不安的“派对”和“实验”的故事，有些甚至是[victim.GetSheHe]组织的。不幸的是，这个小坏蛋可能不会轻易接受你在这件事上的权威……"
 POD_education_events.109.option.a: "你得立刻停止这种疯狂行为！"
 POD_education_events.109.option.b: "只要这不影响我……"
 POD_education_events.18.t: "教育：好于学识的子嗣"
 POD_education_events.18.desc: "你的子嗣对$pod_cainite$的悠久历史非常着迷。那些氏族，那些神话，那些流言……所有[victim.GetSheHe]能学到的东西。[victim.GetSheHe|U]可能真的对一些你很久都没想过的事情有深刻的见解。也许你们可以一起工作？"
 POD_education_events.18.option.a: "你得到我的继续学习许可了，孩子"
 POD_education_events.18.option.b: "你对这些故事怎么看，孩子？"
 POD_education_events.19.t: "教育：愚笨的子嗣"
 POD_education_events.19.desc: "你的后嗣对[victim.GetSheHe]必须学习的大量新信息感到烦恼。氏族、$pod_cainite$种族历史、神话……好像太多了。如果你不赶快做点什么，你的子嗣很可能会放弃，这可能会成为[victim.GetHerHis]进入黑夜的一个障碍。"
 POD_education_events.19.option.a: "……这家伙将有其他用处"
 POD_education_events.19.option.b: "让我们花点时间一起学习，孩子"
 POD_education_events.110.t: "教育：安于现状"
 POD_education_events.110.desc: "最近，你的子嗣正在以比以前更谨慎的方式接触[victim.GetHerHis]的亡生。[victim.GetSheHe]满足于呆在暗处，似乎满足于让他人承担责任和承担危险，即使[victim.GetSheHe]经常在需要时提供[victim.GetHerHis]的专业知识。虽然让你放心有一个看似值得信赖的子嗣，但你可能对未来另有打算。"
 POD_education_events.110.option.a: "长点志气，孩子！"
 POD_education_events.110.option.b: "又少了个可能的仇敌……大概"
 POD_education_events.200.t: "教育：引见"
 POD_education_events.200.desc: "是时候将你的子嗣正式介绍给你的宫廷了……又或还不是？这个$pod_cainite$社会的传统环节既充满了机会也充满了危险，因为你的[ROOT.Char.Custom('GetFollowerOrVassalPlural')]肯定会在你的新门生身上寻找任何值得利用的弱点。\n你可以跳过整个流程，但这不会给你带来好印象。"
 POD_education_events.200.option.a: "好好表现吧"
 POD_education_events.200.option.b: "你的事他们没必要知道"
 POD_education_events.201.t: "教育：烦人的[ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.201.desc: "在你子嗣介绍自己期间，你的一个[ROOT.Char.Custom('GetFollowerOrVassalPlural')]不放过任何一次空隙来对你的后嗣进行唠叨。不够好，不值得$pod_Embrace$，浪费时间……你可以看到，你的子嗣在这时还能勉强控制住了此时[victim.GetHerHis]的脾气。\n如果你不想让这两个人互相仇视的话，你必须得介入。"
 POD_education_events.201.option.a: "只要他们不恨我……"
 POD_education_events.201.option.b: "不要再说了"
 POD_education_events.202.t: "教育：友善的[ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.202.desc: "在介绍的过程中，你的一个[ROOT.Char.Custom('GetFollowerOrVassalPlural')]真的很喜欢你的子嗣。无论是真心的还是有政治意向的，只要能在你的国度内维持和平，其实并不重要。他们正在互相谈心的时候你加入到了他们的行列。"
 POD_education_events.202.option.a: "我很高兴你过得不错"
 POD_education_events.202.option.b: "好耶！我选的子嗣真棒！"
 POD_education_events.203.t: "教育：狡诈的[ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.203.desc: "你的子嗣在自我介绍时犯了一个小错误。出乎意料的是，你的一个[ROOT.Char.Custom('GetFollowerOrVassalPlural')]很快就帮你掩盖过去，以至于没有造成影响。\n你明白为什么当这条诡计多端的蛇来找你，告诉你你现在欠[victim.GetHerHim]……"
 POD_education_events.203.option.a: "你赢下这一局"
 POD_education_events.203.option.b: "我不欠你什么！"
 POD_education_events.204.t: "教育：入迷的[ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.204.desc: "你的一个[ROOT.Char.Custom('GetFollowerOrVassalPlural')]被你的子嗣的完美无瑕的自我介绍所迷住了，他现在想和你的后嗣私下谈谈。很明显，这对你来说是个让[victim.GetHerHim]欠你人情的好办法，但你的后嗣可能不喜欢被当做礼物般的物品使用。"
 POD_education_events.204.option.a: "孩子来这，我想要把你介绍给……"
 POD_education_events.204.option.b: "很可惜，我不能接受你的要求"
 POD_education_events.205.t: "教育：足够"
 POD_education_events.205.desc: "你的子嗣的介绍……很顺利。虽说不是很成功，但也不算失误。你想想，在吸血鬼的社会里，即使取得一般的成功，也已经相当困难了吧。"
 POD_education_events.205.option.a: "非常平均"
 POD_education_events.206.t: "教育：无瑕"
 POD_education_events.206.desc: "你的子嗣的一切表现都非常顺利，甚至超出了你的预期。你的[ROOT.Char.Custom('GetFollowerOrVassalPlural')]们对你新后嗣的印象感到深刻，更对你作为[Glossary('尊长','game_concept_Sire_desc')]的品质更加惊讶。这将会在一段时间内给你留下很好的印象。"
 POD_education_events.206.option.a: "完美的结果"
 POD_education_events.207.t: "教育：被掩盖的失败"
 POD_education_events.207.desc: "从表面上看，你的子嗣的介绍似乎一切都很顺利。但在内心深处，你知道出了些问题。你的[ROOT.Char.Custom('GetFollowerOrVassalPlural')]们都在满口谀词，然后互相簇拥着，低声交谈。\n也许他们计划此举已经有一段时间了，也可能是你做了什么让他们不高兴的事。不管是什么原因，这可能是将来的一个问题。"
 POD_education_events.207.option.a: "政治永不会停止"
 POD_education_events.208.t: "教育：过于成功"
 POD_education_events.208.desc: "你的子嗣在[victim.GetHerHis]的介绍中给人留下了很好的第一印象。或许有点太伟大了……在你那些急于破坏计划的[ROOT.Char.Custom('GetFollowerOrVassalPlural')]们的鼓励下，[victim.GetSheHe]开始有了自大的幻想。\n显然，这已经超出了[victim.GetHerHis]的现在的地位和权力，但这个无耻的小鬼几乎是在公开谋划[victim.GetSheHe]作为你的继承人的“未来”任期。你得小心翼翼地管住[victim.GetSheHe]……"
 POD_education_events.208.option.a: "无礼的白痴！"
 POD_education_events.209.t: "教育：受打动的[ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.209.desc: "你的子嗣在宫廷中的表现很顺利。除了[victim.GetSheHe]从你一个有权势的[ROOT.Char.Custom('GetFollowerOrVassalPlural')]那里赢得了明显的诚意之外，并没有什么不寻常的地方。这场小小的外交秀对你来说是有利的，无论是对[ROOT.Char.Custom('GetFollowerOrVassal')]还是对你的子嗣。"
 POD_education_events.209.option.a: "显然，我的子嗣在我的许可下讲话"
 POD_education_events.209.option.b: "选了你真不错，孩子"
 POD_education_events.210.t: "教育：礼物"
 POD_education_events.210.desc: "在你的子嗣第一次进入宫廷的时候，你的一些[ROOT.Char.Custom('GetFollowerOrVassalPlural')]带着一份慷慨的礼物来到这里……是给你的后嗣的，而不是给你。他们显然是想通过让你把礼物据为己有来制造你们之间的裂痕。虽说剧情不怎么精妙，但还是很有诱惑力的……"
 POD_education_events.210.option.a: "孩子你还很年轻，这是我的"
 POD_education_events.210.option.b: "那就好好享受吧"
 POD_education_events.211.t: "教育：有才的子嗣"
 POD_education_events.211.desc: "你必须承认，你的子嗣很会抚平[ROOT.Char.Custom('GetFollowerOrVassalPlural')]的小怨气，和他们的自尊心。其实好到你在把[victim.GetHerHis]介绍给宫廷时什么都不需要做。\n也许现在还早，但你在想，是否可以利用你那充满天赋的后嗣来减轻你的统治负担，至少是暂时的。"
 POD_education_events.211.option.a: "孩子，让我们来谈谈新的责任"
 POD_education_events.211.option.b: "我会休息的，当我……嘛"
 POD_education_events.1001.t: "子对父"
 POD_education_events.1001.desc: "你看着你最新的子嗣，还在从你慷慨赠予[victim.GetHerHim]的血液中恢复过来。这个孩子会变成什么样子？是朋友，是仆从，还是敌人？你在思考这个问题，因为新的雏儿站起来迎接你的目光。\n等等，这个样子，不会是……\n你反应太迟了，因为[victim.GetSheHe]用[victim.GetHerHis]的新力量抓住了你，并将[victim.GetHerHis]的獠牙刺入你的脖子。你感觉到自己的意识正在逐渐丧失，直到你的心兽，曾经是你最大的盟友，催促你去战斗。你不会轻易放弃的！"
 POD_education_events.1001.option.a: "还不会太迟！"
 POD_education_events.1001.effect.success.desc: "你将你的子嗣推开"
 POD_education_events.1001.critical.failure.effect.desc: "……幸福的感觉太强烈了"
 POD_education_events.1002.t: "子对父：宽恕？"
 POD_education_events.1002.desc: "你使出了最大的意志力和体力，才从你子嗣致命的$pod_Embrace$中挣脱出来。你现在完全意识到了威胁，你的敌人已经失去了优势。[victim.GetSheHe|U]现在正在仔细地考量你，恐惧隐藏在[victim.GetHerHis]的眼后。\n随着你的知觉和力量的回归，如果你愿意，你现在可以粉碎这个傲慢的小杂种。或者你也可以原谅并忘记，因为你非常清楚，上古之血对新$pod_Embrace$的雏儿有多大的吸引力……"
 POD_education_events.1002.option.a: "你有你的野心。我尊重这一点。"
 POD_education_events.1002.option.b: "你不值得拥有我的血脉！"
 POD_education_events.1003.t: "老者之尘"
 POD_education_events.1003.desc: "太迟了。你让他起死回生的血液赋予了[victim.GetHerHim]力量，你最新的子嗣已经吸干了你的血让你无力抵抗。这就是结局，被你自己的后嗣杀死，就像你之前和之后的许多人一样。\n当你的意识越来越远地滑落，被一种人造的幸福吞噬中时，一种奇特的讽刺残留着。\n直到一切在黑暗中结束，就像你一直期待的那样。"
 POD_education_events.1003.option.a: "你总有一天要弑父"
 POD_education_events.1.option.d: "运用你娴熟的教学技巧"
 POD_education_events.1.option.durga: "作为突伽·辛，你具有能保证让你的子嗣在[victim.GetHerHis]初期就展现伟大的独特选项"
 POD_education_events.20.t: "教育：完美导师"
 POD_education_events.20.desc: "作为最受尊敬的西雷伏诺长者，突伽·辛，您在你的时代教导了许多年轻小伙，您甚至很喜欢这样做，不知从什么地方出现，将您神秘的智慧带给困惑的稚子。\n因此，把您的才华运用到你自己的后嗣身上是很容易的。这里轻轻推一下，那里轻轻敲一下，其就会变成你想要的样子。"
 POD_education_events.20.option.a: "聆听你的心兽，然后将它拽倒"
 POD_education_events.20.option.b: "粉红归于玫瑰，蓝血归于领主"
 POD_education_events.20.option.c: "要解开你自有的秘密，你必须寻找你自有的钥匙"
 POD_education_events.100.option.c: "我可以告诉你更多关于我们心路的事"
 POD_education_events.100.dionysius: "作为狄奥尼修斯，你可以使用这个选项，以确保你的子嗣会留在你的心路上，并被很好的训知关于其的事"
 POD_education_events.111.t: "教育：完美导师"
 POD_education_events.111.desc: "很少有$pod_cainites$能像你一样塑造了一条人性之路塑造心路，狄奥尼索斯大人。它显然给了你对这些问题的敏锐的洞察力，你已经学习和辩论了很长一段时间。\n因此，很少有人比你更有资格教授这方面的知识。你现在在照顾的幼小的雏儿确实很幸运。"
 POD_education_events.111.option.a: "跟此新鲜的思维辩论，我将会学到很多东西"
 POD_education_events.111.option.b: "我有很多东西要教你"
 POD_education_events.22.t: "教育：灰之骑士"
 POD_education_events.22.desc: "你的$pod_clan$具有强力的尚武传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这满是军伍思想的环境下，新的勇士将诞生于此。希望其忠诚于你。"
 POD_education_events.22.option.a: "再给我跑十圈！"
 POD_education_events.21.t: "教育：灰之贵族"
 POD_education_events.21.desc: "你的$pod_clan$具有强力的贵族传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这上流环境下，新的黑夜贵族将诞生于此。希望其忠诚于你。"
 POD_education_events.21.option.a: "尊重优于你的，并利用剩下的"
 POD_education_events.23.t: "教育：灰之执事"
 POD_education_events.23.desc: "你的$pod_clan$具有强力的治政传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这尽职环境下，新的夜晚的统治者将诞生于此。希望其忠诚于你。"
 POD_education_events.23.option.a: "我会留意你的建议，以一定程度"
 POD_education_events.24.t: "教育：灰之盗贼"
 POD_education_events.24.desc: "你的$pod_clan$具有强力的游荡传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这竞争环境下，新的黑夜间的狩猎者将诞生于此。希望其忠诚于你。"
 POD_education_events.24.option.a: "带走你的东西"
 POD_education_events.25.t: "教育：灰之密教徒"
 POD_education_events.25.desc: "你的$pod_clan$具有强力的牟利于密教传统。因此，这足以让你找到给你最新子嗣的最好的老师。在这书卷环境下，新的黑夜先知将诞生于此。希望其忠诚于你。"
 POD_education_events.25.option.a: "让[victim.GetHerHim]赢得[victim.GetHerHis]自己的救赎"
 POD_education_events.1.option.f: "我们会把你打造成一位女武神！"
 POD_education_events.1.option.adisa: "作为阿迪萨，你可以使用这个选项，让你可以更具体地训练你的子嗣。"
 POD_education_events.28.t: "教育：新女武神"
 POD_education_events.28.desc: "芙蕾雅教了你如何战斗，如何为自己对抗人类的邪恶，但你知道并不是所有的姐妹都能做到这样的壮举。幸运的是，你明白虽然大多数女武神都期望成为战士，但其他的女武神则是为了另一个更安静但同样重要的身份。\n世界是广阔的，精通外交的女武神可以成为有价值的特使，与黑夜的领主们接触，为你们解放更多被压迫的人铺平道路。"
 POD_education_events.28.option.a: "让我们看看你有多强硬，我的姐妹！"
 POD_education_events.28.option.b: "你对文字的运用方式是我所不能的。"
 POD_education_events.28.option.c: "你可以在平衡中寻到成功。"
 POD_education_events.29.t: "教育：教导"
 POD_education_events.29.desc: "你的一位廷臣注意到你的新子嗣迈出了[victim.GetHerHis]在黑夜里的第一步。也许是想从你那里得到一些好处，[mentor.GetSheHe]提议给你的门徒一些指导。这可能会有帮助，因为即使是最有天赋的人也需要一些时间来适应该隐之子的状况。\n你也可以决定一起参加，希望能在这个过程中积累一些经验。"
 POD_education_events.29.option.a: "行，这是你的人情和你的钱。"
 POD_education_events.29.option.b: "你会做的。且不收费。"
 POD_education_events.29.option.c: "我也要参加。"
 POD_education_events.29.option.d: "没这个必要。"
 badmentor_tooltip: "在这情况下，导师将不会尽[mentor.GetHerHis]所能……"
 POD_education_events.302.t: "释放礼"
 POD_education_events.302.desc: "棘秘魑有许多传统，他们以极大的热情尊重这些传统。其中之一是释放礼，在这严肃庆典中，子嗣们被他们的[Glossary('尊长','game_concept_Sire_desc')]正式承认为一位成熟的棘秘魑。无论两人之间的关系如何，对于想要独立创业的雄心勃勃的子嗣来说，这都是一个非常值得期待的时刻。\n在你的具体案例中，你的子嗣已经是领主了，这意味着这仪式将只是过场而已。唯一的问题是，是否要把这仪式办得隆重一些。"
 POD_education_events.302.option.a: "举办奢华的庆典来赞颂你的子嗣。"
 POD_education_events.302.option.b: "较小庆典就足够了。"
 POD_education_events.302.option.c: "没有庆典，[victim.GetSheHe]不配。"
 POD_education_events.303.desc: "棘秘魑有许多传统，他们以极大的热情尊重这些传统。其中之一是释放礼，在这严肃庆典中，子嗣们被他们的[Glossary('尊长','game_concept_Sire_desc')]正式承认为一位成熟的棘秘魑。无论两人之间的关系如何，对于想要独立创业的雄心勃勃的子嗣来说，这都是一个非常值得期待的时刻。\n你的子嗣已经正式要求释放[victim.GetHerHis]，认为[victim.GetHerHis]在你阴影下的时间应该结束了。这个仪式会让你主持一个庆典，释放你对[victim.GetHerHim]的控制，让[victim.GetSheHe]离开，去其他地方创造[victim.GetHerHis]自己的财富。然而，你还是能拒绝，但这很可能会激怒[victim.GetHerHim]。"
 POD_education_events.303.option.a: "你现在是真正的棘秘魑了。"
 POD_education_events.303.option.b: "举办奢华庆典来安抚[victim.GetHerHim]，但不释放[victim.GetHerHim]。"
 POD_education_events.303.option.c: "你留在这。就这样。"
 POD_education_events.304.desc: "棘秘魑有许多传统，他们以极大的热情尊重这些传统。其中之一是释放礼，在这严肃庆典中，子嗣们被他们的[Glossary('尊长','game_concept_Sire_desc')]正式承认为一位成熟的棘秘魑。无论两人之间的关系如何，对于想要独立创业的雄心勃勃的子嗣来说，这都是一个非常值得期待的时刻。\n不过，你的子嗣似乎并不怎么在意，显然，其现在满足于让你继续决定[victim.GetHerHis]的未来。因此，释放礼将主要由你择时，或者你可以完全跳过它而不产生什么后果。"
 POD_education_events.304.option.a: "你现在是真正的棘秘魑了。你得走了。"
 POD_education_events.304.option.b: "举办奢华庆典但不释放[victim.GetHerHim]。"
 POD_education_events.304.option.c: "你在属于你的地方。"
 POD_education_events.100.option.d: "聆听主的话语"
 POD_education_events.100.ahmed: "作为艾哈迈德，你可以使用这个选项，确保你的子嗣遵循你的宗教。只有当你留在基督之道上时，才可以使用这个选项。"
 POD_education_events.100.option.e: "是时候进行第二次初拥了。"
 POD_education_events.100.ashirra: "作为[Glossary('阿什拉派','game_concept_ashirra_desc')]的成员，你可以使用此选项来消除罪孽或增强你的子嗣的信仰。"
 POD_education_events.112.t: "教育：第二初拥"
 POD_education_events.112.desc: "第二次拥吮仪式是新拥吮的血族皈依伊斯兰教后举行的一项神圣仪式，象征性地重现了[Glossary('阿什拉派','game_concept_ashirra_desc')]创始人与先知共同经历的故事。\n\n仪式由新生的[victim.GetHerHis]和负责其皈依的人（此处即你）共同完成。你需要引导这位新生者完成真正的觉醒，摒弃无知，让其灵魂因新信仰而坚定。"
 POD_education_events.112.option.a: "让我们祈祷吧"
 POD_education_events.112.option.b: "你必须净化自身的罪孽。"
 POD_education_events.112.option.c: "真正的祈祷发自内心。"