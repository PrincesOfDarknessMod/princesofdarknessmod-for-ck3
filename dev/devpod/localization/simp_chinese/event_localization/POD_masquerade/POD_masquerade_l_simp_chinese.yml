l_simp_chinese:
 pod_masquerade.1.t: "好奇心杀死猎人"
 pod_masquerade.1.desc: "那些该死的老好人之一，俗称猎人，正在你的领地周围四处打探，调查你的每天日程，公众影响和一些其他的棘手内容。如果你什么都不做，他就会向他的主子报告各种问题，在你看来，这无疑会在你的宫廷间掀起怀疑。幸运的是，你知道有个专家可以把这些烦人的家伙干净利落的处理掉，但他的服务可不便宜……"
 pod_masquerade.1.a: "破财买个平安？真是个轻松的选项。"
 pod_masquerade.1.b: "我不会被这些冒出来的凡人吓倒！"
 pod_masquerade.2.t: "蠢货，到处都是！"
 pod_masquerade.2.desc: "你周围都是白痴和小丑。你肯定已经知道，但是在你看似无穷无尽的清单上又将加入一条新例了？一个猎人已经潜入你的领地几个月了，而你的人却没有注意到，他在收集你邪恶存在的证据。你必须马上对付他，否则他会溜出去向上级报告的。而且，很明显，如果你真的这么做了，你周围就会开始散布起你和你的助手的无能之处的谣言……"
 pod_masquerade.2.a: "如果你想把事情做的干净利落……"
 pod_masquerade.2.b: "随他去吧，你现在没空搭理这事"
 pod_masquerade.3.t: "家庭麻烦"
 pod_masquerade.3.desc: "你的手下向你报告了一件坏消息。镇上一个消息灵通的家庭似乎开始怀疑你的真实身份。你不太清楚到底是哪里出了问题，但毕竟世上没有完美的[the_masquerade|E]。你必须做出选择，是解决这个麻烦的家庭还是无视他们，冒着他们继续干涉的风险。"
 pod_masquerade.3.a: "一场不幸的事故绝对能解决这麻烦"
 pod_masquerade.3.b: "他们算不上什么威胁。"
 pod_masquerade.4.t: "家人就是家人"
 pod_masquerade.4.desc: "在$pod_cainite$之间，家庭聚会是一件非常稀有的事件，主要是因为它随时都有可能演变成屠杀。不幸的是，你已经被选为下一次聚会的主办人，这意味着会有许多吸血鬼云集你的领地，大幅提高你的暴露度。你当然可以取消这次聚会，他们也会理解这其中的风险。但如果依旧举办，这将会成为向众人展示你的自信的绝佳机会。"
 pod_masquerade.4.a: "我感觉不太妙……"
 pod_masquerade.4.b: "欢迎光临！尊贵的客人，请把武器放在门外，藏起来的那些也是。"
 pod_masquerade.5.t: "瞬间的抉择"
 pod_masquerade.5.desc: "当你收起獠牙，拭去嘴角的鲜血时，你看着这些试图袭击你的猎人们的尸体陷入了沉思……他们是错误的理解了你的力量，亦或只是单纯的自信心过剩？总之，他们已经魂归西天了。只有一个跑的飞快的人侥幸逃脱。你不太想继续追杀他，他看起来身手敏捷，你也不想像个疯子一样在你的城市中飞奔。但如果你不解决他，很明显他会把这里发生的一切报告给他的主子……"
 pod_masquerade.5.a: "也许一次美好的追猎会让我想起过去的美好时光？"
 pod_masquerade.5.b: "算了。还是回我的王座上呆着吧。我猜。"
 pod_masquerade.6.t: "好得令人难以置信"
 pod_masquerade.6.desc: "你所在地区的一个有影响力的家庭的族长刚刚去世了。他的遗产将和他的两个儿子一起流传下去，碰巧你还牢牢地控制着其中一个儿子……如果你帮助这个年轻人接管家庭生意，你会受益匪浅，但你奇怪的赞助肯定会引起一些人的不满。"
 pod_masquerade.6.a: "只不过是老鼠在争抢面包屑"
 pod_masquerade.6.b: "我们会为了极大的利益注意这个年轻男人的事业。"
 pod_masquerade.7.t: "孽缘"
 pod_masquerade.7.desc: "你本以为自己已经不再拥有这种感觉，但……你现在动摇了。为什么这个单纯的农民让你的心情久久不能平静？难道你的躯体里还留存着一丝身为凡人时的欲望？亦或者还有其他的什么原因？你陷入了迷惘。但今晚，你必须做出决定：是冒着[the_masquerade|E]破漏的风险把你的倾心之人请入你的宫廷，亦或是……做出正确的选择？"
 pod_masquerade.7.a: "对不起我的爱人，问题不在我。在你。"
 pod_masquerade.7.b: "欢迎来到我的会客厅，我的挚爱"
 pod_masquerade.8.t: "活动筋骨"
 pod_masquerade.8.desc: "你领地上的那些凡人又在进行他们所热爱的那些可笑的战争。这次是因为某个宣称？还是某个宗教的圣战？算了，这不重要。你可以趁这个机会到战场上敲碎几颗颅骨，也许还能学个一两招。当然，这场战斗的幸存者可能会对你那不死者的伟力产生些许怀疑……"
 pod_masquerade.8.a: "打完，收工。"
 pod_masquerade.8.b: "等下，我该砍谁来着？好吧。"
 pod_masquerade.9.t: "暴露：敌意对待"
 pod_masquerade.9.desc: "你在这一地区的交易终于引起了暗影裁判所的注意。幸运的是，到目前为止，他们似乎只是试图通过封锁你的主要资产来削弱你的权威。你的几位手下失踪了，一些血仆被正直的圣职人员取代了……它开始削弱你的统治地位。\n你可以试着反击，但如果你反击，裁判所肯定也会提升它的措施。"
 pod_masquerade.9.a: "想玩？那我们玩……"
 pod_masquerade.9.b: "让我们减少损失，并暂时保持低调"
 pod_masquerade.9.a.effect.success.desc: "智胜裁判所会让他们暂时停止对你的行动"
 pod_masquerade.9.a.success: "回到工作！"
 pod_masquerade.9.a.failure.effect.desc: "如果他们成功了，裁判所就会威胁到你的影响力。"
 pod_masquerade.9.a.failure: "他们赢得了这场战斗，但没有赢得这场战争"
 pod_masquerade.9.a.critical.failure.effect.desc: "如果你犯下任何错误，那么裁判所将长期压制你在该地区的权威。"
 pod_masquerade.9.a.critical.failure: "他们彻底胜利了……"
 pod_masquerade.10.t: "暴露：信仰之人"
 pod_masquerade.10.desc: "你要时刻关注你所在地区最忠诚的凡人，因为他们很容易成为最危险的人。最近，新的圣职人员出现了，他们似乎……非常专注于他们神圣业务。你很肯定他们是可恶的宗教法庭的推进力量，在你的民众中聚集支持来推翻你完全公正的统治。\n你可以现在就采取行动来清除它们，但这有可能产生事与愿违的后果。这些人已经对民众有了强烈的精神控制……"
 pod_masquerade.10.a: "让这些伪先知安静下来。"
 pod_masquerade.10.b: "我可以暂时脱离凡尘了"
 pod_masquerade.10.a.effect.success.desc: "智胜裁判所会让他们暂时停止对你的行动"
 pod_masquerade.10.a.success: "夸我！"
 pod_masquerade.10.a.failure.effect.desc: "如果他们成功了，裁判所就会威胁到你的影响力。"
 pod_masquerade.10.a.failure: "他们赢得了这场战斗，但没有赢得这场战争"
 pod_masquerade.10.a.critical.failure.effect.desc: "如果你犯下任何错误，那么裁判所将长期压制你在该地区的权威。"
 pod_masquerade.10.a.critical.failure: "他们彻底胜利了……"
 pod_masquerade.11.t: "暴露：战斗"
 pod_masquerade.11.desc: "一支敌对的凡人军队正在接近你的国度。这本身并不罕见，凡人确实喜欢他们的小战争毕竟，但这一次似乎不同。你的手下报告说他们看到了献身于神的人，而且在他们的队伍中有相当多的圣职人员。你会是他们真正的目标吗？\n现在还是你可以集结你的军队保卫你的土地的时候……或者你可以消失一段时间，度过难关。"
 pod_masquerade.11.a: "我不惧战场"
 pod_masquerade.11.b: "是时候放个假了"
 pod_masquerade.11.a.effect.success.desc: "智胜裁判所会让他们暂时停止对你的行动"
 pod_masquerade.11.a.success: "很明显，你把他们碾压了"
 pod_masquerade.11.a.failure.effect.desc: "如果他们成功了，裁判所就会威胁到你的影响力。"
 pod_masquerade.11.a.failure: "他们赢得了这场战斗，但没有赢得这场战争"
 pod_masquerade.11.a.critical.failure.effect.desc: "如果你犯下任何错误，那么裁判所将长期压制你在该地区的权威。"
 pod_masquerade.11.a.critical.failure: "他们彻底胜利了……"
 pod_masquerade.12.t: "暴露：宫廷竞赛"
 pod_masquerade.12.desc: "最近，统治变得异常困难。凡人已经提出了新的法律和一些改革，已经成为你的眼中之刺。你很长时间都没怎么想，但是你的一个间谍报告说，当地的凡人统治者有了一个新的顾问，这个人似乎很了解你。\n暴力驱逐这个人是不明智的，因为他是一个众所周知的政治人物，但是……你可以败坏他的名声，或者在他的影响力对拼中胜过他。或者你可以暂时躲起来，短命种终究还是短命种。"
 pod_masquerade.12.a: "我喜欢一个好的挑战"
 pod_masquerade.12.b: "如果我躲一段时间，他就做不了什么"
 pod_masquerade.12.a.effect.success.desc: "智胜裁判所会让他们暂时停止对你的行动"
 pod_masquerade.12.a.success: "完全胜利！"
 pod_masquerade.12.a.failure.effect.desc: "如果他们成功了，裁判所就会威胁到你的影响力。"
 pod_masquerade.12.a.failure: "他们赢得了这场战斗，但没有赢得这场战争"
 pod_masquerade.12.a.critical.failure.effect.desc: "如果你犯下任何错误，那么裁判所将长期压制你在该地区的权威。"
 pod_masquerade.12.a.critical.failure: "他们彻底胜利了……"
 pod_masquerade.13.t: "暴露：神圣低语"
 pod_masquerade.13.desc: "当你听说裁判所计划对你采取行动时，你以为会有剑光与怒吼。但取而代之的是斗篷和匕首。你的手下正在消失，值得信赖的人脉变成了叛徒，关于你声誉的谣言到处都是，不管是假的还是假的。\n你可以反击，向这些凡人展示什么才是真正的谋略大师。或者你可以顺其自然，他们很快就会厌倦这个游戏，或者更好的是，像凡人一样假死脱壳。"
 pod_masquerade.13.a: "这是一个需要克服的有趣挑战"
 pod_masquerade.13.b: "好了，暂时不做策划了"
 pod_masquerade.13.a.effect.success.desc: "智胜裁判所会让他们暂时停止对你的行动"
 pod_masquerade.13.a.success: "完全胜利！"
 pod_masquerade.13.a.failure.effect.desc: "如果他们成功了，裁判所就会威胁到你的影响力。"
 pod_masquerade.13.a.failure: "他们赢得了这场战斗，但没有赢得这场战争"
 pod_masquerade.13.a.critical.failure.effect.desc: "如果你犯下任何错误，那么裁判所将长期压制你在该地区的权威。"
 pod_masquerade.13.a.critical.failure: "他们彻底胜利了……"
 pod_masquerade.14.t: "暴露：神圣之怒"
 pod_masquerade.14.desc: "从你王座间封闭的门外传来的哭声判断，你的最后一道防线正在瓦解。不要再搞阴谋、隐藏或狡猾的游戏了，裁判所已经带着正义之怒来找你了。\n当整个建筑开始在火焰中崩毁，你安慰自己，他们只是跳起来的蚂蚱。你当然可以出面面对他们……或者你可以利用王座后面隐藏的通道逃出去，改天再战斗。喊叫声已经停止，武器砸门的声音响起。机不可失。"
 pod_masquerade.14.a: "终于！相称的对手！"
 pod_masquerade.14.b: "所以……我们就在这里打开这个秘密通道……"
 pod_masquerade.14.a.effect.success.desc: "屠杀裁判所会让他们暂时停止对你的行动"
 pod_masquerade.14.a.success: "没那么能了"
 pod_masquerade.14.a.failure.effect.desc: "正面作战会让你付出巨大的代价"
 pod_masquerade.14.a.failure: "他们赢得了这场战斗，但没有赢得这场战争"
 pod_masquerade.14.a.critical.failure.effect.desc: "如果你犯了任何错误，裁判所会把你化为灰烬"
 pod_masquerade.14.a.critical.failure: "……打得好"
 high_masquerade_exposed_tt: "#R 这事件被触发是因为你具有高潜藏曝露度！#!"