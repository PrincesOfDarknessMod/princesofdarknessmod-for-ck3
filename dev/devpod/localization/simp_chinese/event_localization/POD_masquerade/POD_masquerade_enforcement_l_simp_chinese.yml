l_simp_chinese:
 POD_masquerade_enforcement.001.t: "强制潜藏"
 POD_masquerade_enforcement.001.desc: "该隐训诫中最重要的一条，至少对抱有理智的血族来说，既是[the_masquerade|E]。这条简单的规则是吸血鬼社会的核心，它表明凡人绝不能知道你的存在。\n[target.GetFirstName]不遵守[the_masquerade|E]的行为会让整个种族的生存受到威胁。现在是解决这个问题的时候了。"
 POD_masquerade_enforcement.001.option.a: "我命令你！"
 POD_masquerade_enforcement.001.option.a.tt: "使用支配术来强制潜藏[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.desc: "意志的碾压"
 POD_masquerade_enforcement.001.option.a.success: "成功支配[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.tt.enforcer_wins: "你强制[target.GetHerHim]听话"
 POD_masquerade_enforcement.001.option.a.failure: "失败支配[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.tt.enforcer_lost: "[target.GetSheHe|U]抵抗了你的命令"
 POD_masquerade_enforcement.001.option.b: "噢，[target.GetFirstName]，你真的不想听我的么？"
 POD_masquerade_enforcement.001.option.b.tt: "使用威仪术来强制潜藏[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.desc: "魅力之战"
 POD_masquerade_enforcement.001.option.b.success: "成功的对[target.GetFirstName]使用了威仪术"
 POD_masquerade_enforcement.001.option.b.tt.enforcer_wins: "通过你的威仪术$pod_discipline$，你使[target.GetHerHim]听从了你"
 POD_masquerade_enforcement.001.option.b.failure: "对[target.GetFirstName]使用威仪术失败"
 POD_masquerade_enforcement.001.option.b.tt.enforcer_lost: "[target.GetSheHe|U]抵抗了你的魅力"
 POD_masquerade_enforcement.001.option.c: "让我看看能否强行让你听话……"
 POD_masquerade_enforcement.001.option.c.tt: "使用你的谋略能力来强制潜藏[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.desc: "机智之战"
 POD_masquerade_enforcement.001.option.c.success: "对[target.GetFirstName]使用的阴谋诡计获得了成功"
 POD_masquerade_enforcement.001.option.c.tt.enforcer_wins: "通过机智，你使得[target.GetHerHim]听从了你"
 POD_masquerade_enforcement.001.option.c.failure: "没能戏弄[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.tt.enforcer_lost: "[target.GetSheHe|U]抵抗了你的奸计"
 POD_masquerade_enforcement.001.option.d: "一笔贿赂，还有什么比这更诱人的呢？"
 POD_masquerade_enforcement.001.option.d.tt: "使用金钱和你的影响力来强制潜藏[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.desc: "话语与金钱之战"
 POD_masquerade_enforcement.001.option.d.success: "成功贿赂[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.tt.enforcer_wins: "通过你的金钱和影响力，你使得[target.GetHerHim]听了你话"
 POD_masquerade_enforcement.001.option.d.failure: "没能贿赂[target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.tt.enforcer_lost: "[target.GetSheHe|U]拒绝了你的贿赂"
 POD_masquerade_enforcement.001.option.e: "我准备放过他……来换一笔好处"
 POD_masquerade_enforcement.001.option.e.tt: "你也许能获得对[target.GetFirstName]的牵制"
 POD_masquerade_enforcement.002.t: "强制潜藏成功"
 POD_masquerade_enforcement.002.desc.dominate: "与你对更弱心智的控制力，你成功的强制[target.GetFirstName]听命于你，既在凡人间更加注意，[target.GetSheHe]应该感到感激。"
 POD_masquerade_enforcement.002.desc.presence: "[target.GetFirstName]明显没法抵抗你的超自然魅力，[target.GetSheHe]将听从你的建议，自愿的维持[target.GetHerHis]自己的[the_masquerade|E]……至少这是[target.GetSheHe]自己以为的。"
 POD_masquerade_enforcement.002.desc.intrigue: "这里小小的说句，那里巧妙的暗示，现在[target.GetFirstName]会维持[the_masquerade|E]，那程度足以让你满足。只需要一点巧妙布置，就可以让血畜和血族做任何你想做的事，甚至不用激发该隐之血的力量。"
 POD_masquerade_enforcement.002.desc.bribe: "钱，所有血族都想要的东西，与其等的凡人“亲戚”毫无不同。通过你的金钱和影响力，你使得[target.GetFirstName]维持[the_masquerade|E]，到足以让血族世界不再受到威胁的程度，目前而言。"
 POD_masquerade_enforcement.002.option.a: "干得好"
 POD_masquerade_enforcement.002.option.a.tt: "[target.GetFirstName]的曝露度将减少"
 POD_masquerade_enforcement.003.t: "强制潜藏失败"
 POD_masquerade_enforcement.003.desc.dominate: "[target.GetFirstName]成功的抵抗了你脑控力量，也许是[target.GetHerHis]的意志过于强大，又或者只是你过于粗心。但这不重要，重要的是你失败了。"
 POD_masquerade_enforcement.003.desc.presence: "你原本以为没人能抵抗你的非自然魅力，但显然[target.GetFirstName]抵抗住了。你失败了，但也许你能卷土重来……在过段时间后。"
 POD_masquerade_enforcement.003.desc.intrigue: "[target.GetFirstName]成功看透了你的计划，你没能在让[target.GetHerHim]遵循你意志方面的事上达成任何成就。"
 POD_masquerade_enforcement.003.desc.bribe: "钱，是你原本以为血畜和血族都会喜欢的东西。但也许你错了，[target.GetFirstName]拒绝了你的钱，而你的影响力也没能有所建树。现在你失去了你的钱，而你的目标依然对[the_masquerade|E]是个威胁。"
 POD_masquerade_enforcement.003.option.a: "没啥，一次小挫折罢了"