l_simp_chinese:
 podintroductions1500.10.t: "玫瑰在燃烧"
 podintroductions1500.10.desc: "裁判所始于并巅峰于法兰西，$pod_cainite$政治结构也因此受到了相当大的影响。萨莉安娜和埃丝克拉蒙德都被无情的贝娅特丽克丝背叛并赶下台，而贝娅特丽克丝现在在她的两个拥护者的关键帮助下统治着爱之皇庭：弗朗索瓦·德阿伦库和埃翁·德·埃托伊尔。\n虽然她的上位速度很快，并显示出敏锐的政治头脑，但这并不足以避免野心勃勃的伊思妲的政变企图，法兰西从此被两位女王瓜分。党派的诞生对这现状没有什么改变，贝娅特丽克丝加入了秘盟，伊思妲加入了魔宴，看来意识形态之争在最后的爱之女王们的野心前退居其次。\n在最终再次实现稳定之前，法兰西还有很长的路要走。"
 podintroductions1500.10.a: "两位女王，一顶王冠"
 podintroductions1500.11.t: "英格兰的冷漠神王"
 podintroductions1500.11.desc: "自从1066年的诺曼入侵之后，密特拉再次确保了他对英格兰的控制。随着他的对手被削弱，他的崇拜也在上升，神王向外看去……直到黑死病、裁判所和大反乱都相继发生。\n密特拉花了几十年的时间来处理这些问题，他把这些问题归咎于睿魔尔，并迅速将其驱逐出岛。密特拉再次取得了胜利，但当那个讨厌的哈德施塔特通过建立秘盟取得重大的外交胜利时，密特拉本还毫无所知。密特拉觉得这样一个重要的时刻应该由他来领导，于是他开始权衡自己的选择。加入秘盟是合乎逻辑的选择，但走另一条路可以抹去那个令人愤怒的德意志人脸上的得意笑容，这对英格兰之主来说听起来相当有吸引力……"
 podintroductions1500.11.a: "英格兰与欧陆不和？还用说！"
 podintroductions1500.12.t: "父之罪"
 podintroductions1500.12.desc: "在裁判之年和大反乱期间，哈德施塔特对德意志的安全统治和精明的政策使他创建了秘盟，这是确保$pod_cainite$在这些新威胁面前生存的重要努力。然而，在黑十字下并非一切都很平静，哈德施塔特对他的充满魅力的子嗣约根·冯·费尔登的冷酷无情导致了他的老追随者们在卢克丽霞·冯·哈茨的领导下发生了广泛的叛乱。\n秘盟的创始人现在已经在德意志东部失去了很多权力，那里聚集了大反乱的残余分子、约根的怀仇追随者和其他小军阀，他们只有一个共同点：对这个自称是不死族世界最重要的新$pod_cainite$的家伙有着不死的仇恨。"
 podintroductions1500.12.a: "约根仍然对德意志留下了漫长的阴影……"
 podintroductions1500.13.t: "祂卓绝的国度"
 podintroductions1500.13.desc: "在令人惊讶的短时间内（对于$pod_cainite$来说），安布罗西奥·路易斯·蒙卡达成功地在暗影再征服中取胜，摆脱了他的[Glossary('尊长','game_concept_Sire_desc')]，并参与了魔宴的创建，导致这个新兴党派采用了教会式等级制度。\n枢机所能取得的成就似乎没有上限，许多人开始相信，他确实是被天主亲自派遣的工具。对于这些传言，蒙卡达只用微笑和祝福来回答，然后回到他那神秘的目标。\n伊比利亚独立势力的小块飞地似乎不太可能再抵挡住蒙卡达的狂热信徒的纪律严明的部队了。无论是否受到天主的祝福，伊比利亚暂时只有一位主人。"
 podintroductions1500.13.a: "神选了祂站那一方吗？"
 podintroductions1500.14.t: "诸神黄昏之后"
 podintroductions1500.14.desc: "对于维京吸血鬼，即所谓的[Glossary('英灵战士','game_concept_einherjar_desc')]来说，诸神黄昏已经来过，并且已经走了。随着维特和布伦希尔德被击败，斯堪的纳维亚半岛现在和其他许多地方一样，被政治和个人野心所分割。\n在丹麦，在确保了哥本哈根的安全之后，流浪睿魔尔鲁托尔现在必须面对他大怒的$pod_clan$的报复，且由强大的梅琳达达领导。在瑞典和挪威，由于德意志梵卓的入侵，秘盟已经站稳了脚跟，但魔宴控制了北方的大部分地区，使得该地区的命运相当不确定。在北方更远的地方，在很少有人敢于旅行的荒原上，过去时代的遗留试图在这个让他们迷失且他们诸神已经陨落的世界上生存。"
 podintroductions1500.14.a: "终末后的新开始。"
 podintroductions1500.15.t: "为了罗马而竞争"
 podintroductions1500.15.desc: "由于裁判所和大反乱的大火，意大利已经发生了很大的变化。胜利的勒森魃叛党已经横扫北方，并在起义的两位英雄加莱亚佐和格拉齐亚诺的领导下团结在魔宴后面。\n在南方，暗影之海当权的崩溃让一位不受欢迎的局外人——梵卓的安东尼奥·卡多纳获益。他像对待大家庭一样统治着他的国度，非常注重西西里人民的义务和权利，这个奇怪的独立者到目前为止取得了大量的成功。\n格拉齐亚诺和加莱亚佐在名义上相互结盟，使魔宴成为意大利最可能的赢家。但在这个帝国的摇篮里，更奇怪的事情已经发生了……"
 podintroductions1500.15.a: "二对一？这不公平。"
 podintroductions1500.16.t: "黎凡特之崩溃"
 podintroductions1500.16.desc: "橄榄会议，这个萨洛比$pod_clan$最后的呼声并没有持续多久，留下耶路撒冷亲王卢修斯·提比略·卢夫斯收拾残局。在他公平而又仁慈的统治下，黎凡特享受了一段前所未有的和平时期……直到他在大反乱中被自己的子嗣暗杀。\n随着当权的消失，黎凡特再次成为小亲王和军阀之间的血腥战场。\n奇怪的是，该地区最好的希望可能来自大马士革。在萨洛比–阿刹迈的共同努力下，大马士革清除了其魔，现在由头脑冷静的玛娜尔统治，她是一位强大而明智的统治者，许多人都欢迎她。时间会告诉我们，她是选择专注于大马士革本身，还是响应这个使命。"
 podintroductions1500.16.a: "不稳的信仰之地果然名不虚传。"
 podintroductions1500.17.t: "不受欢迎的新来者"
 podintroductions1500.17.desc: "中东地区一度在[Glossary('阿什拉派','game_concept_ashirra_desc')]的领导下基本统一，但不得不忍受秘盟引导的第一次全面进攻。虽然这次行动的目标是鹰巢和哈基姆的子嗣，但它也打破了该地区的稳定，特别是许多攻击者在墨涅拉俄斯本人的领导下留在了美索不达米亚。\n在这场动乱的帮助下，另一个阴险的威胁出现了。刻茉媞里，著名的赛特的流浪子嗣，也把目光投向了这个地区，以实现一个只有她知道的神秘目标。由于内部冲突，在采取何种立场对抗这些外来者的问题上出现了分歧，[Glossary('阿什拉派','game_concept_ashirra_desc')]能否夺回他们的土地？"
 podintroductions1500.17.a: "这次可能得打破待客的礼仪……"
 podintroductions1500.18.t: "崩坏且挫败"
 podintroductions1500.18.desc: "骄傲的哈基姆的子嗣已经被秘盟征服了。在第一次全面进攻中，他们攻破了鹰巢的大门，迫使其投降，制止了$pod_clan$沿着奥斯曼帝国的足迹扩张。更糟糕的是，作为和平条约的一部分，一个诅咒被施加在他们身上，进一步削弱了他们。然而，哈基姆的子嗣懂得忍辱负重，他们已经开始重建。\n具有讽刺意味的是，这些失败帮助统一了交战派系，在他们最著名的战士贾迈勒的新领导下，他们现在变得更加强大。\n秘盟正忐忑不安地注视着鹰巢的重新崛起，想知道他们是否只是推迟了不可避免的事情……"
 podintroductions1500.18.a: "鹰巢已备，怀恨在心。"
 podintroductions1500.19.t: "潮汐起落"
 podintroductions1500.19.desc: "印度幸免于裁判所和大反乱，但还是遭受了一个巨大的事件：朱雀皇朝的崩溃。在所谓的“永恒之战”中，缅甸的皇朝曾经是雷伏诺的主要对手，但它已经崩溃了，被腐败和背叛所困扰。\n随着各个小领袖试图收拾残局，这一事件为雷伏诺留下了一个强有力的机会，最终对他们的死敌进行了决定性的打击。然而，通往胜利的道路并不完全容易，因为第二大[Glossary('万鬼','game_concept_kuei_jin_desc')]皇朝——无限雷霆，仍然很强大，并准备在每一步都反击雷伏诺的前进。\n印度的命运可能最终发生了转变，但现在称其为胜利者还为时尚早。"
 podintroductions1500.19.a: "是永恒的改变还是仅仅是个过度？"
 podintroductions1500.20.t: "希望与秘密之地"
 podintroductions1500.20.desc: "马格里布在西班牙的暗影再征服结束后发生了很大的变化。战败的[Glossary('阿什拉派','game_concept_ashirra_desc')]逃到这里，希望以这片土地为中转站，实现不可能的反转。但这不大会发生，阿尔及尔强大的苏丹扎姆拉·马图布的突然失踪，让这个地区陷入混乱。\n令所有人惊讶的是，恢复秩序的是一位外来者。伊琳·德·卡利诺，一个强大的睿魔尔女术士，突然夺取了阿尔及尔的控制权，并开始向外扩张，寻找……某样东西（或某个人），且一心一意又令人不安。她忠实的追随者队伍和反对派的分裂使她至今不受限制地发展。\n但是，无论是来自西方的最后的安达卢西亚[Glossary('阿什拉派','game_concept_ashirra_desc')]，还是来自东方的仍然强大的突尼斯，新老势力都开始准备去对付这位不受欢迎的新来者……"
 podintroductions1500.20.a: "老与少，败者与胜者……所有的冲突都发生在马格里布。"
 podintroductions1500.21.t: "马穆鲁克与蛇"
 podintroductions1500.21.desc: "越来越多地被推到边缘，并受到内部分裂的困扰，赛特之子$pod_clan$开始失去其在埃及本身的中心地带。这在很大程度上是由于最新的开罗亲王穆赫塔尔·贝伊的崛起。\n这个奇怪的劣族到目前为止一直是一位神秘但受人爱戴的统治者，他能够小心翼翼地扩大自己在该地区的影响力，加速了赛特信徒的衰落。\n纳赫特尔赫布最近陷入了[Glossary('蛰眠','game_concept_torpor_desc')]，迫使赛特之子的领导层发生了变化，玛阿特卡拉成为了新的圣显者。她是一个比她的前任更精明、更积极的统治者，如果她能超越（或压倒）穆赫塔尔·贝伊崛起的名声和权力，她可能是阻止蛇们衰落的关键。"
 podintroductions1500.21.a: "蛇仍有一咬。"
 podintroductions1500.22.t: "野者之地"
 podintroductions1500.22.desc: "在大多数人所谓的文明的范围之外是草原，这是一片对吸血鬼相当不利的土地，城市太少，狼人太多。然而，那些被基督教和伊斯兰教的兴起所驱赶的吸血鬼野者在这里找到了暂时的喘息机会。\n影幕，那些神秘的芭芭雅嘎的不正常的追随者，已经被赶出了俄罗斯，但正在这里计划他们不可避免地归来。在更远的东方，[Glossary('安答','podgloss.anda')]部族（来自蒙古人的吸血鬼）几乎被怀仇的中国[Glossary('万鬼','game_concept_kuei_jin_desc')]消灭，先锋仍然在他们帝国的边缘监视着他们。\n这两个势力是草原上最有可能成为霸主的竞争者，但远远不是唯一的竞争者。"
 podintroductions1500.22.a: "斯基泰人、匈人、蒙古人……还有谁？"
 podintroductions1500.23.t: "暗夜子嗣"
 podintroductions1500.23.desc: "棘秘魑和睿魔尔之间的预兆之战在特兰西瓦尼亚结束了，术士们有纪律地撤退到奥地利。不过，棘秘魑还是像以前一样争斗不休。\n他们的[Glossary('上古耆宿','game_concept_antediluvian_desc')]似乎已死，使他们分裂位魔宴的早期支持者和守旧者。这分裂让匈牙利梵卓在文策尔·里卡德的坚定领导下，能够站住脚。\n但是现在，所有的目光都集中在布兰城堡，在那里，一位名叫弗拉德·采佩什的神秘凡人最近刚把自己变成了吸血鬼。这个臭名昭著的“穿刺公”已经在不死族世界中留下了相当深刻的印象，而他才刚刚开始……"
 podintroductions1500.23.a: "想来就来……"
 podintroductions1500.24.t: "突厥大喜"
 podintroductions1500.24.desc: "自1204年的沦陷以来，对吸血鬼来说，君士坦丁堡早已是一个渐行渐远的梦。随着老希腊遗迹被扫荡得无影无踪，所有的目光都转向了安纳托利亚和崛起的奥斯曼帝国。\n它最伟大的将军之一已经变成了吸血鬼，现在名叫喀什，是秘盟的狂热忠诚者。他对入侵的阿刹迈的强力打击起到了决定性的作用，迫使他们走上了和平的道路。然而，一个更大的威胁可能很快就会考验秘盟战将的胆量。\n谣言四起，在更远的东方，被称为塔尔玛埃拉的神秘教派已经找到了一位新的领导人，并再次统一为一支强大的力量。他们疯狂的目标在未来肯定会与正在崛起的秘盟发生冲突。"
 podintroductions1500.24.a: "幻梦已变为战场。"
 podintroductions1500.25.t: "打开帷幕"
 podintroductions1500.25.desc: "吸血鬼的俄罗斯长期以来一直在芭芭雅嘎的追随者的控制之下，但随着鬼婆的神秘消失和国家的逐渐城市化，它已经开始改变。魔宴已经在影幕的前领土上取得了一些有力的进展。\n他们正式由诺夫哥罗德的塞尼娅领导，但也可以看到奇怪的棘秘魑萨沙·维科斯的阴影在夜里越来越强。\n然而，这些并不是唯一的竞争者，因为娜塔莉娅·斯维亚托斯拉夫在竞争君士坦丁堡亲王失败后回到了她的家乡。她的理想化乌托邦梦想可能很快就会与更加野蛮的魔宴发生冲突，使俄罗斯的命运像以往一样不确定。"
 podintroductions1500.25.a: "帷幕之后是什么？"
 podintroductions1500.26.t: "受释之恶"
 podintroductions1500.26.desc: "吸血鬼的波兰在大反乱的最初阶段，因其坚定但受人尊敬的统治者拉兹科利纳亲王的死亡而受到了震动。没有她的稳定努力，没有人能够真正阻止臭名昭著的怪物（即使与他的同族棘秘魑相比）海德翁·雅罗斯拉维奇的崛起。\n当恐怖和疯狂在他身后蔓延时，救赎似乎只能来自两个方面。坚定的伊扎克·本·亚伯拉罕仍在尽力保护人民（无论是否是不死族），而雄心勃勃的贝娜则将自己的命运交给了魔宴，希望他们的支持足以对抗海德翁。\n他们中的一个人是否会成功，或者波兰是否注定要永远处于怪物的束缚之下，我们拭目以待。"
 podintroductions1500.26.a: "为恶只是手段罢了。"
 podintroductions1500.27.t: "北方之光"
 podintroductions1500.27.desc: "波罗的海地区曾经是原始教徒吸血鬼的最后堡垒，自从他们在利沃尼亚著名的最后一战之后，已经发生了相当大的变化。野者仍然在这里，但现在已经听从他们的领袖阿扎布·扎兰的号召，加入了魔宴。\n青之卡尔领导的自由邦加入了命运多舛的大反乱，并在之后失去了大部分的人口和领土。\n在芬兰本土，令人惊讶的是，举止温和的冈格罗已经崛起成为主导力量。托莫·马库斯·萨姆普萨得到了秘盟的支持，到目前为止，他的外交能力已经足以帮助他悄悄地发展他的领地。\n由于该地区有三大党派的代表，这种脆弱的和平不太可能持续很久。"
 podintroductions1500.27.a: "旧兽，新争。"
 podintroductions1500.100.t: "神王的思索"
 podintroductions1500.100.desc: "你与新生的秘盟的关系一直很复杂。一方面，你当然重视这党派所维护的强力中央集权。另一方面……这主意源自哈德施塔特，而你讨厌这位自认为是完美梵卓的新贵。\n在1486年，你已经接受了秘盟的基本信条，发誓至少不采取反对行动。不过，“不反对它”和“加入”它是有区别的。无论你在这件事上的最终选择是什么，你密教的信徒们都准备好跟随。"
 podintroductions1500.100.a: "竞争这一概念配不上我。"
 podintroductions1500.100.b: "我不会向德意志人俯首！"
 podintroductions1500.100.tooltipa: "密特拉之道中的所有角色都将皈依秘盟"
 podintroductions1500.100.tooltipb: "密特拉之道将继续跟秘盟保持疏远"
 podintroductions1500.101.t: "神王的思索"
 podintroductions1500.101.desc: "密特拉与新生的秘盟的关系一直很复杂。一方面，他当然重视这党派所维护的强力中央集权。另一方面……这主意源自哈德施塔特，而且很明显，这两个人真的无法忍受对方。\n1486年，密特拉已经接受了秘盟的基本信条，发誓至少不采取反对行动。不过，“不反对它”和“加入”它是有区别的。\n这种不稳的情况最近出了结果，密特拉宣布他将正式加入密特拉。不出所料，他忠实的密教很快也这么做了，将不列颠群岛的大部分地区牢牢地置于该党派的控制之下。"
 podintroductions1500.101.a: "秘盟的胜利。"
 podintroductions1500.102.t: "神王的思索"
 podintroductions1500.102.desc: "密特拉与新生的秘盟的关系一直很复杂。一方面，他当然重视这党派所维护的强力中央集权。另一方面……这主意源自哈德施塔特，而且很明显，这两个人真的无法忍受对方。\n1486年，密特拉已经接受了秘盟的基本信条，发誓至少不采取反对行动。不过，“不反对它”和“加入”它是有区别的。\n这种不稳的情况最近出了结果，密特拉宣布他不会在这条约上更进一步。密特拉密教将维持自己的独立性，尽管秘盟会在不列颠群岛被容忍，但它不会成为密特拉领地内统治该隐之子的主要方式。"
 podintroductions1500.102.a: "神似乎很难动摇。"
 treaty_of_tyre_modifier: "推罗协议"
 treaty_of_tyre_modifier_desc: "丧权辱族的推罗协议使所有哈基姆圣裔有义务与秘盟维持和平，至少是公开地维持。\n当这个修正存在时，你不能向秘盟统治者宣战。"
 podintroductions1500.103.tooltip: "丧权辱族的推罗协议使所有哈基姆圣裔有义务与秘盟维持和平，至少是公开地维持。\n当这个修正激活时，你不能向秘盟统治者宣战。"
 podintroductions1500.103.t: "推罗协议"
 podintroductions1500.103.desc: "推罗协议是秘盟和哈基姆圣裔在秘盟与阿刹迈进行了十年的残暴和近乎公开的战争之后，于1496年达成的休战协议，它始于1486年秘盟对他们进行的血猎。但早在大反乱期间，该氏族的战士们就已经对西方血族进行了攻击，主要是为了报复十字军东征，在该氏族的许多人看来，那是他们长期以来试图避免的千年圣战赌局。\n血猎在很大程度上可以归因于睿魔尔长者埃特里乌斯的大谎言，他把哈基姆的子嗣们描绘成纯粹的邪恶杀人狂和吸榨者。而当血猎召开，尤其是在荆棘大会之后，他们的叛党盟友被引诱回秘盟的阵营，受困的$pod_clan$发现一切变得更艰难了。这场冲突很可能以欧洲所有哈基姆派的死亡而告终，但一位独行的诺斯费拉图突然发现了鹰巢，并在墨涅拉俄斯的带领下直接攻击了据点本身，迫使哈基姆圣裔走上了投降台。"
 podintroductions1500.103.a: "……而这变得更糟了。"
 tremere_blood_curse_modifier: "睿魔尔血咒"
 tremere_blood_curse_modifier_desc: "作为秘盟对哈基姆派的惩罚，睿魔尔的血之诅咒使$pod_cainite$的$pod_vitae$对他们变得有毒，这是对掠血之路信条的侮辱。"
 podintroductions1500.104.t: "睿魔尔血咒"
 podintroductions1500.104.desc: "哈基姆的子嗣们一直是崇魔者巴力的激烈对手，并为此付出了沉重的代价。在7世纪，巴力用13名战士将饥渴诅咒引入战士种姓，作为对他们在巴力大战中积极行动的报复。该种姓的人很快就每夜渴求$pod_cainite$$pod_vitae$。\n因此，1496年的睿魔尔血咒同时也是秘盟对阿刹迈的一种惩罚，也是对他们饥渴的一种保护，因为它使$pod_cainite$$pod_vitae$对他们变得有毒。许多哈基姆的子嗣遵循掠血之路，颂扬$pod_diablerie$。无法品尝其他吸血鬼的血液是对他们信条的侮辱。\n虽然术士们努力寻找解药，但有毒的饥渴却一直持续到今夜。"
 podintroductions1500.104.a: "诅咒与惩罚并存……"
 podintroductions1500.104.tooltip: "诅咒将永远存在，除非哈基姆的子嗣能够达成“终结诅咒”决议。"
 podintroductions1500.105.t: "卡帕多西亚大清洗"
 podintroductions1500.105.desc: "1444年，难以想象的事情再次发生。在扫罗被睿魔尔的獠牙$pod_diablerie$之后，如今卡帕多修斯被自己的子嗣奥古斯都·乔凡尼谋杀了。由于计划完备并充分执行，乔凡尼家族很快就将确保其作为一个成熟$pod_clan$的地位。\n卡帕多西亚乱成散沙，还未从最受尊敬的长者的过世中恢复过来，因此无法进行报复。乔凡尼家族的胆子越来越大，已经开始对他们的先辈进行清洗。曾经位高言重的卡帕多西亚们现在被追杀，知道他们可能被任何愿意从强大的意大利亡灵术师那里获得一些好处的人出卖。\n大清洗可能会在一段时间内平息，但现在，乔凡尼氏族的崛起已经在血与火中开始。"
 podintroductions1500.105.a: "猎杀开始了"
 podintroductions1500.105.tooltip: "乔凡尼现在是与卡帕多西亚分开的独立氏族。由于大清洗正在全面展开，后者将受到负面修正。"