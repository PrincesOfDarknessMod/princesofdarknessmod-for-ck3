l_simp_chinese:
 podintroductions.1.t:0 "黑玫瑰"
 podintroductions.1.desc:0 "当凡人的法兰西在阿尔比派十字军的内部混乱中挣扎时，吸血鬼的法兰西也同样举步维艰。亚历山大，第四代梵卓血族，在不到两年前还是法兰西和巴黎的亲王。他被一场由妥芮朵的萨利安娜和他自己的子嗣杰弗里·杜·坦普尔领导的政变推翻了。妥芮朵女王已经夺取了国家的控制权并试图巩固自己的地位，以面对自己同族和其他法兰西女王们的反对。另一方面，杰弗里得到了巴黎作为战利品，但假以时日，他可以以自己的血脉为由去竞争王位。至于南边，图卢兹的埃丝克拉蒙德正在利用清洁派起义来达到自己目的，但可能很快就会面对北法兰西的怒火。这个国家在这场磨难中会找到一个比亚历山大更好的新统治者吗？还是会被混乱和毁坏所席卷？"
 podintroductions.1.a:0 "在我的统治下，法兰西会更好……"
 podintroductions.2.t:0 "无聊的英格兰神王"
 podintroductions.2.desc:0 "不列颠尼亚的吸血鬼历史与梵卓的密特拉密不可分。先是波斯神，后是罗马神，在基督教驱逐这位第四代血族之前，他的密教几乎遍及整个欧洲。带着他的狂热分子撤往英格兰的土地后，他迅速积聚了力量……并渐渐厌倦了这个地方的渺小。因为经常性地陷入[torpor|E]中，诺曼人的入侵摧毁了他的权力宝座，迫使他苏醒以恢复秩序。150年后，密特拉再一次对英格兰漠不关心，他的许多臣民，像康沃尔的休和罗宾·李兰德，已经获得了事实上的独立，并筹划着他的灭亡。更糟糕的是，威尔士和苏格兰仍然支持着属于北欧血族和德鲁伊教的古老单元。没有人能真正地说出密特拉是否能再次粉碎这个新的反对派，或者只是让它在他的鼻子底下溃烂，直到为时已晚。"
 podintroductions.2.a:0 "神王万岁……目前来说。"
 podintroductions.3.t:0 "众王与巫士之地"
 podintroductions.3.desc:0 "作为梵卓[Clan|E]无可争议的核心，德意志牢牢地掌握在哈德施塔特的人手中。然而，即使是他的统治也不是没有受到挑战，比如德意志西部的茱莉亚·安塔西亚和巴伐利亚难以捉摸的伊尔丝·雷纳格这样的伪装者。在南面，篡位者睿魔尔[Clan|E]正处境危险，东欧恶毒的棘秘魑[Clan|E]正在迅速逼近他们的据点。他们与强大的梵卓的防御协议也许是他们唯一的生命线。法兰西流亡的亲王，巴黎的亚历山大就在附近，有着伟力归于自身的强大力量的吸血鬼，尽管他在政治上是孤立的。哈德施塔特必须迅速行动，抑制住他子嗣约根的野心，摧毁茱莉亚和伊尔斯的势力基地，并在有或没有睿魔尔的帮助下确保他的东部阵线。德意志将成为梵卓[Clan|E]王冠上的明珠，或者化为灰烬。"
 podintroductions.3.a:0 "罗马已是过眼云烟，未来在这里。"
 podintroductions.4.t:0 "暗影再征服"
 podintroductions.4.desc:0 "伊比利亚是勒森魃[Clan|E]传统的权力中心，但凡人的收复失地运动使贤士们陷入了一场痛苦的内战。北部，西尔维斯特·德·鲁伊斯领导着信奉基督教的正统勒森魃[Clan|E]，有着统治整个伊比利亚的明确野心。不过，他必须注意他那些野心勃勃的封臣们，比如安布罗西奥·路易斯·蒙卡达或阿拉贡的露西塔。在南部，经过几十年的内讧，自称为[ashirra|E]的穆斯林勒森魃，发觉安达卢西亚的拜德尔是一位值得尊敬的苏丹。在其他地方的新老亲王，从帝王般的梵卓到野性的冈格罗，都注意到这些贤士们的弱点，并等待合适的时机出手。这再征服可能是伊比利亚勒森魃统治的最后一丝气息。"
 podintroductions.4.a:0 "只要给我一些时间，伊比利亚将再度统一。"
 podintroductions.5.t:0 "诸神黄昏"
 podintroductions.5.desc:0 "北欧人的信仰早已从凡人的脑海中消失，但对斯堪的那维亚的吸血鬼仍然存在。它的拥护者，勇猛的[einherjar|E]还坚持自己的信念……但是希望正在迅速消退。“崇高之主”维特和女武神的首领乌尔夫斯多蒂尔陷入了沮丧几近[torpor|E]。不过，有些人仍在继续战斗，例如布伦希尔德和“独眼”瓦尔比约格，他们试图摧毁哈德施塔特率领的入侵的基督教吸血鬼。使[einherjar|E]感到乐观的一线希望是，新来者很难团结一致，彼此争吵，最显着的是在丹麦分裂为了三大觊觎者。在北部的荒原上，一群冷酷无情的狂徒称自己为杂生惊恶，他们在这片贫瘠的土地上建立了一个让人质疑的宣称。无论他们是新的盟友还是敌人，北欧人的最后一场战役已经临近，十字似乎再次成为人们的最爱……"
 podintroductions.5.a:0 "斯堪的纳维亚将与过去不再一样。"
 podintroductions.6.t:0 "帝国的安魂曲"
 podintroductions.6.desc:0 "如果说中世纪的意大利是一个分裂的国家，那么黑夜的意大利就是一个火药桶。强大的老吸血鬼们争夺着欧洲人口最多的城市。在意大利北部，梵卓“枢机”法布里齐奥·乌尔菲拉在米兰坐镇，牢牢掌握着意大利教廷的大权。在威尼斯，卡帕多西亚[Clan|E]的乔凡尼后裔是一位横跨海洋的贸易帝国的主人，时间会告诉我们他们的关注点是在意大利本土还是在东方，就像他们的父辈[Clan|E]一样。在西西里岛，勒森魃[Clan|E]的首都由忠诚的蒙塔诺守卫着，但是过度扩张和西班牙的内战使这片暗影之海变得脆弱。最后，所有的目光都聚焦在罗马，提图斯·梵卓鲁·卡米拉最近在这里苏醒。这位永恒的执政官是罗马帝国和迦太基灭亡的幕后主谋，他开创了一个梵卓领导的新时代。当其他小领袖和永生的国王在意大利其他地方崛起时，亲王们的战争从来没有像这里这样危险过。"
 podintroductions.6.a:0 "条条大道通罗马。"
 podintroductions.7.t:0 "无路可退"
 podintroductions.7.desc:0 "十字军邦联摇摇欲坠地立于黎凡特，一个更危险的吸血鬼联邦在他们中间崛起。橄榄会议是该地区各城市亲王们之间的协约，由幸存者卡维娅·加杜巴领导。“母狮”是一位萨洛比，自其始祖扫罗死于新近崛起的睿魔尔[Clan|E]之手后，该[Clan|E]就在西欧几乎灭绝。虚弱[Clan|E]的大多数成员已经躲藏起来，但卡维娅仍打算坚持立场。尽管如此，她那不稳定的联盟已经处于危险之中，因为强大的大马士革正字面意思上的陷入疯狂坑堑。达舒夫，那位古老的妥芮朵苏丹已经把他的灵魂卖给了未知的力量，只有他的子嗣和一位孤独的阿刹迈战士还伫立面对注定要发生的灾难。此协约将是一个垂死[Clan|E]的最后一场欢呼，还是通往光明未来的希望？"
 podintroductions.7.a:0 "耶路撒冷是奇迹之城，毕竟……"
 podintroductions.8.t:0 "面纱之后"
 podintroductions.8.desc:0 "阿拉伯是[ashirra|E]活动的所在地，穆斯林吸血鬼通过共同的信仰超越[Clans|E]团结在一起。他们在半岛上的地位很稳固，但是耶路撒冷被十字军夺去，埃及被古蛇夺去，这使他们与马格里布和安达卢西亚的兄弟们断绝了关系。更糟糕的是，美索不达米亚已经再次落入崇魔者巴力之手，由内尔伽勒派的阿扎那利领导。他的目标是占领该地区的大城市，大马士革，巴格达和推罗，获取足够献祭的人口，来为他邪恶的主人的回归。具有讽刺意味的是，他最强的对手是另一位巴力——推罗的塔尼特——源自摩洛教团的分支。这种对抗使重新崛起的巴力陷入了内战，并给穆斯林信徒带来了他们可以被制止的希望。否则，整个世界都将处于危险之中。"
 podintroductions.8.a:0 "文明的摇篮也可能是它的临终之床。"
 podintroductions.9.t:0 "斗篷与弯刀"
 podintroductions.9.desc:0 "波斯是阿刹迈[Clan|E]的所在地，这是一个外人眼中的神秘团体。在新加冕的、极具争议的最长者纳穆尔图姆的统治下，他们表面上的团结正在出现裂痕，因为不同的派系开始发挥他们的权力。刀锋之网的忒弥斯想让他的[Clan|E]成为一个狂热的刺客密教，准备为他的黑暗之主归来准备一支军队。术士们的阿什拉夫正走在一条温和的道路上，他将阿刹迈视为判官和外交官。最后，战士们的贾马尔是一位虔诚的穆斯林，他乐于与麦地那的[ashirra|E]哈里发国恢复友好关系。这一政治动荡促进了该地区另一个群体的发展，即达斯图尔·阿诺什的失落部族，一个崇拜二代吸血鬼的异端。分裂和低效使阿刹迈[Clan|E]陷入瘫痪，他们是会找到一个新的共同目标，还是会爆发内战？"
 podintroductions.9.a:0 "我将通过外交或其他手段一统波斯。"
 podintroductions.11.t:0 "永恒之战"
 podintroductions.11.desc:0 "从一开始，印度就一直是雷伏诺[Clan|E]与阿修罗提伽耶或万鬼——一群神秘的亚洲“吸血鬼”——之间的战争舞台。没有胜利者，双方战斗人员都处于崩溃的边缘，各派都在计谋推翻现任领导人。在西部，查古拉普夏正集结雷伏诺进行另一场战斗。而在东方，达楠带领着小龙们发起另一个冲锋。而其他政权，从达埃纳到棘秘魑的卡塔里利亚，都在不停息的风暴中寻找机会。最终会浮现出赢家吗？"
 podintroductions.11.a:0 "很显然，我是印度和平的唯一希望。"
 podintroductions.12.t:0 "不断堕落"
 podintroductions.12.desc:0 "虽然迦太基在几个世纪前就被烧毁了，但在马格里布仍能感受到迦太基的陷落。该地区自此被不同的[ashirra|E]——穆斯林吸血鬼——苏丹瓜分，但他们中没有一个真正成功地巩固了该地区。两位最好的人选是索福尼斯巴和扎姆拉·马图布。索福尼斯巴是突尼斯的老领导人，她仍然记得在迦太基时期她的城市的陷落。阿尔及尔的扎姆拉·马图布则是位年轻的富有野心的勒森魃。赛特之子在这里也有立足之地，就像睿魔尔[Clan|E]一样。马格里布有着分裂的权力和丰富的历史，对于任何爱冒险的亲王或苏丹来说，马格里布都是诱人的奖赏。"
 podintroductions.12.a:0 "我们需要抛后迦太基。"
 podintroductions.13.t:0 "金字塔的阴影之中"
 podintroductions.13.desc:0 "埃及已经忍受了许多外来的征服者，而它的本地不死族若没有耐心和韧性就什么都不是。真正的权力在吉萨，赛特之子的心腹。自由[Clan|E]——或者腐败[Clan|E]——取决于你问谁——正准备让自己的力量从十字军东征所创造的权力真空中获利。毫无疑问，他们的第一个目标将是开罗。由强大的第五代梵卓安东尼乌斯领导，这座城市不会轻易陷落，如果公开宣战，它可以挫败蛇们。每个人都确信赛特信徒将很快采取他们的第一步行动，但是没有人能说准是什么时候，如果他们这样做了，他们将会被阻止……"
 podintroductions.13.a:0 "埃及和我们一样都是永生的。"
 podintroductions.14.t:0 "二元之地"
 podintroductions.14.desc:0 "非洲本土的吸血鬼是莱本，一个松散的多血系的联合和自我创造的吸血怪物们。他们掌握着大陆上大部分的真正权力，但必须与众多在他们的土地上寻求名声和财富的冒险家或小军阀竞争。更糟糕的是，非洲还是一些真正古老的生物的家园，从它是人类摇篮的时候起就一直在那里。随着同穆斯林[ashirra|E]与世界开放的各种新道路，莱本是否能够在变化的时代适应和昌盛还有待观察。"
 podintroductions.14.a:0 "机遇与危险并存。"
 podintroductions.15.t:0 "直入云霄"
 podintroductions.15.desc:0 "在外人看来，吐蕃是非常奇怪的吸血鬼的家园……如果他们能被称为吸血鬼的话！所谓的白虎逸民是中国饿殍——万鬼的一部分，在东方有着牢固的地位。然而在西方，甚至有更奇怪的事物存在，从崇拜可憎事物的恶魔到已死的埃及神的启蒙信徒。吐蕃远离任何真正的不死族权利中心，对大多数吸血鬼来说，吐蕃只是一个次要的地方。但是神秘的事物可以给那些寻求足够深入的人带来回报……"
 podintroductions.15.a:0 "吐蕃沉浸在其自己的世界之中。"
 podintroductions.16.t:0 "东方惊雷"
 podintroductions.16.desc:0 "大草原不适合吸血鬼居住。很少有城市来隐藏，很少有国家要操纵和屈从于他们的意志。但是，从东方来了一种新的吸血鬼，这种吸血鬼生活在无边无际的平原上，与游牧的蒙古人生活在一起。这些安答——冈格罗分支之一——是骄傲的战士，跟随大规模扩张的蒙古帝国征战。与已经存在的西方冈格罗的冲突似乎是不可避免的，而且，当这些新来者到来时与欧洲[cainites|E]的紧张关系也在所难免。对于吸血鬼来说，变化是很罕见的，但当它与雷鸣般的大批游牧骑马弓箭手一同出现时，变化可能是他们中许多人经历的最后一件事……"
 podintroductions.16.a:0 "改变并不总是受欢迎……"
 podintroductions.17.t:0 "入此者……"
 podintroductions.17.desc:0 "东欧是棘秘魑[Clan|E]的传统领地，但最近他们的霸权受到了由德意志和匈牙利梵卓[Clan|E]支持的睿魔尔[Clan|E]的崛起的挑战。最近的战争以一项痛苦的和平条约结束了，条约的双方是军督之督弗拉基米尔·罗斯托维奇，和梵卓的十字军战士约根·冯·费尔登。缓冲国奥伯图斯教团已经建立，由和平调解人迈卡·维科斯领导。现在，每个人都在舔着自己的伤口，罗斯托维奇试图确保他对[Clan|E]的控制，而匈牙利的梵卓则试图在他们的首领布尔斯库的[torpor|E]下来解决继承危机。最后，伊崔乌斯代替睿魔尔领导篡位者，展现出对抗魔物的统一的金字塔的正面形象。每个人都知道在这个地区，战争是不可避免的，除非有位吸血鬼有足够的力量来一劳永得地摧毁他的对手。会是谁呢？"
 podintroductions.17.a:0 "一块待驯服的土地。"
 podintroductions.18.t:0 "褪色幻梦"
 podintroductions.18.desc:0 "君士坦丁堡的灰烬还在燃烧，秃鹫已经在它的尸体上盘旋。米迦勒的幻梦，一个自迦太基以来再未出现过的吸血鬼乌托邦，和它的创造者一起陨落，而一些军阀和帝国的残余试图生存下来。其中最重要的是阿方索，他是第四次十字军东征的煽动者之一，现在控制着君士坦丁堡。雄心勃勃的勒森魃仍然在向西西里岛的[Clan|E]首领臣服，但能持续多久呢？再往西，布鲁赫的娜塔莉亚·斯维亚托斯拉夫是最后一个仍然活跃的真正的幻梦信徒之一，她希望自己能继承“天使长”米迦勒的衣钵。安娜·科穆宁则没有这样的雄心壮志，利用尼西亚最终得到了在她还活着时就应该属于她的帝国。就像其他雄心勃勃的亲王在旧城的废墟上建立领地一样，君士坦丁堡可能会重生……也可能永远消亡。"
 podintroductions.18.a:0 "米迦勒是否已经预见到这场混乱？"
 podintroductions.19.t:0 "祖母，祖母……"
 podintroductions.19.desc:0 "在所有人的记忆中，俄罗斯是存在的最强大的血族之一芭芭雅嘎的家园。这位第四代诺斯费拉图，传说是[Clan|E]的真正始祖，是这片土地的重要组成部分，并利用它来保护自己不受她复仇的[Sire|E]的伤害。这个地区的人来说幸运的是，女巫在[torpor|E]。但她的影幕的影响仍然可以被感觉到，其由她忠实的二号人物维克多所培育。在这样的条件下，俄罗斯只有三种类型的吸血鬼：“祖母”的附庸，勇敢者，和即将死去的吸血鬼。而后两类常常相互重叠。"
 podintroductions.19.a:0 "小心那位小女孩……"
 podintroductions.20.t:0 "旧世界的新命运"
 podintroductions.20.desc:0 "传统上，波兰是棘秘魑军督领的边疆，是更……古怪魔物的家园，现在它正逐渐形成专属的、独立的存在体。军督们摇摇欲坠的权威，以及他们完全的脱离时代，让新一代的吸血鬼得以立足并繁荣起来。首先是虔诚的布鲁赫伊扎克·本·亚伯拉罕，他在克拉科夫周围聚集追随者，驱逐曾经的亲王拉兹科利纳。这可能是使波兰摆脱棘秘魑影响的第一步。但更大的挑战还在等着我们，最引人注目的是要驱逐那个绝对令人厌恶的人，那就是海德翁·雅罗斯拉维奇，一个甚至会被同族认为过于极端的棘秘魑……"
 podintroductions.20.a:0 "我必须留意这变革之风，否则就会被它摧毁。"
 podintroductions.21.t:0 "自由之地"
 podintroductions.21.desc:0 "远离西欧暴君的残暴统治，波罗的海地区是两种新型吸血鬼派系结构的发源地。在立陶宛，冈格罗[Clan|E]的喀喇已经团结了一大批自由意志的原始教徒，他打算将其作为基督教和梵卓[Clan|E]向东方扩张的停靠点。在更远的北方，青之卡尔领导着一个[einherjar|E]自由邦，也许是最后一个这样的州了，因为斯堪的纳维亚正在被哈德施塔特的下仆们所控制。这两项实验都面临着巨大的冒险，无论是内部的还是外部的，而且主要依赖于他们领导人的超凡魅力。即使他们的勇气和信念对于即将到来的梵卓[Clan|E]的猛攻是徒劳的。"
 podintroductions.21.a:0 "一位老不死的残余可没那么容易灰飞烟灭。"
 podintroductions.2001.t:0 "欢迎来到黑暗亲王"
 podintroductions.2001.desc:0 "首先，感谢您玩这个Mod！\n[princes_of_darkness|E]是对基础游戏的彻底改造，旨在将P社旗下白狼公司的《[world_of_darkness|E]》跑团规则带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.2001.a:0 "让我们来谈谈吸血鬼的主要机制……"
 podintroductions.2001.b:0 "……或者其他概念"
 podintroductions.2001.c:0 "世界观和故事背景"
 podintroductions.2001.d:0 "我这样就行，直接开始吧！"
 podintroductions.2001.e:0 "抹去我的超自然特质，并进入背景生成器"
 podintroductions.2003.t:0 "吸血鬼101问"
 podintroductions.2003.desc:0 "首先要注意的是，作为一位吸血鬼，你是永生的……某种程度上。你不会死于年老或疾病，但被处以火形或斩首仍然会结束你的亡生。因此，继承是一个较小的，但仍然需要一点关注的地方。同样的道理，婚姻不能使你生儿育女，所以婚姻大多是少数宗教可用的政治工具。\n宗教是玩法的核心部分，甚至比在CK3本体里的更重要。在这里，它代表了你的角色的核心哲学原则，帮助他不沦落为兽。事实上，心兽——你内在的怪物的真实表现——是你最坏的敌人之一，因此管理你的压力极度重要，使你不成为它的猎物，这意味着你的角色变成了一位野生尸妖，导致他不可扮演。\n注意你的饥渴，这代表着你对血液需求的核心修正。饥渴被用于许多计谋和能力，并会由缓慢的自动补充或通过积极猎食来手动补充。"
 podintroductions.2003.a:0 "一些进阶概念"
 podintroductions.2004.t:0 "如何才能不烛化为烬"
 podintroductions.2004.desc:0 "吸血鬼学习新事物很慢。因此，你仍然可以使用基础生活方式，但会有更低的升级速度。但是，你可以选择把你的时间投入到[disciplines|E]中，开放诅咒的力量供你使用。\n建筑代表了你对芸芸众生的影响。大多数都有不同的属性增减，你必须策划如何平衡它们。值得注意的是，以高度发展的公国首都为例的主要人口中心是任何一位亲王都能梦想到的最大资产。\n战争被明显地改变了，更大地强调了骑士。你的骑士的勇武能力使其可以轻易地战胜更多的敌人，特别是当大部分都是征召兵的时候。因此，要小心那些高勇武能力的敌对吸血鬼。\n在一个充满欺骗和诡计的世界里，谋略能力扮演着更重要的角色。有一些新的计谋供你使用，一些和你的能力有关，而且大多数角色都有秘密，你可以不说出它们……又或者在宗教允许的情况下用来勒索。"
 podintroductions.2004.a:0 "回到初始选项"
 podintroductions.2005.t:0 "迄今为止的过往……"
 podintroductions.2005.desc:0 "《[world_of_darkness|E]》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n《黑暗世界》的吸血鬼主要来源于圣经中对该隐（第一个谋杀犯）的诅咒，他们中的大多数都可以追溯世系到他的身上，这一体系被称之为“世代”。这棵不死族宗族之树已经分裂成数个派系和[Clans|E]，每个派系都有自己的力量、弱点和地缘权力基础。\n在你正在玩的《黑暗时代：吸血鬼》中，我们正在几个重大危机的十字路口演绎不死族的世界。君士坦丁堡之劫已经发生，并摧毁了当时主要的[cainite|E]帝国，其涟漪效应远及法兰西和波斯。与此同时，教廷的裁判所正在获取支持和信息，几乎准备好开启一个惩罚被诅咒的吸血怪物的时代……"
 podintroductions.2102.t:0 "欢迎来到黑暗裁判官"
 podintroductions.2102.desc:0 "首先，感谢您玩这个Mod！\n[princes_of_darkness|E]是对基础游戏的彻底改造，旨在将P社旗下白狼公司的《[world_of_darkness|E]》跑团规则带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.2102.a:0 "让我们来谈谈裁判官的主要机制……"
 podintroductions.2102.b:0 "……或修士会的特殊能力"
 podintroductions.2102.c:0 "关于裁判所的资料"
 podintroductions.2102.d:0 "我这样就行，直接开始吧！"
 podintroductions.2103.t:0 "启明"
 podintroductions.2103.desc:0 "1230年，裁判所才刚刚建立。你们的敌人，吸血鬼，在数量和武器上都比你们强。他们有强大的阴谋能力，并可以使用骑士轻易破坏你的大部分军队，特别是你的征召兵。\n你有一些优势，其中之一是你强大的建筑群和生活方式树。你还有独特的计谋，用以找到怪物的巢穴，在那里你可以对吸血鬼进行一对一的行动。很明显，他们会保护自己……\n准备面对艰苦的一局，你必须耐心等待并好好建立你的力量基础，所有的同时，猎杀你最具威胁性的邻居，直到你足够强大到以收复夜晚。"
 podintroductions.2103.a:0 "修士会的工具箱"
 podintroductions.2103.c:0 "关于裁判所的资料"
 podintroductions.2104.c:0 "关于裁判所的资料"
 podintroductions.2104.t:0 "光之彩虹"
 podintroductions.2104.desc:0 "每个修士会都有自己的方式来确保继承人。圣雅各伯之剑，亚柯骑士和红修会可以与年轻的凡人进行[character_interaction|E]，使他们成为自己的侍从或游戏所判定的“孩子”。圣约翰修女会也可以这样做，但只能收年轻女性。\n冯·穆尔瑙家族就像原版的家族一样，但每个冯·穆尔瑙家族的人在他或她的一生中都有机会成为一名裁判官。最后，神目既可以授任新成员，也可以组建家庭，但除非有授任，否则他们的家庭不会自然而然的成为裁判官。"
 podintroductions.2104.a:0 "回到初始选项"
 podintroductions.2105.t:0 "迄今为止的过往……"
 podintroductions.2105.desc:0 "《[world_of_darkness|E]》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在玩《黑暗时代：裁判官》，它讲述了一群被驱使的凡人如何真正改变世界的故事。他们是第一群真正看清吸血鬼[masquerade|E]真相的人，并在教廷的支持下开始了暗影裁判。\n摆在他们面前的任务是艰巨的，而在1230年，他们仅仅触及了他们偶然发现的世界的表面。怀着不死的信念，他们勇敢地迈出了对抗地狱眷族的第一步……\n这些新人裁判官并不知道，他们的勇气和动力将为吸血鬼开启一个持续数个世纪的痛苦与火焰的时代。"
 podintroductions.22.t:0 "在白十字之下"
 podintroductions.22.desc:0 "这里是亚柯骑士诞生的地方。26年前，戈捷·德·丹皮尔在君士坦丁堡的熊熊烈火中与被称为吸血鬼的怪物战斗。他感应到了天主的召唤，因此拿起剑对抗这些真正的敌人。\n从那以后，戈捷带领着来自他位于塞浦路斯的要塞的暗影裁判所的军事力量发挥着重要作用，但时不我待。年老的戈捷知道他有生之年大概率看不到替天主重夺君士坦丁堡的梦想成真。\n因此，戈捷正在为挑选继任者做准备，计划着让下一代的亚柯骑士引领基督徒获得对抗吸血怪物的最终胜利。他们就是天主之剑，保卫人类对抗黑暗中的怪物的最后的守护者们。"
 podintroductions.22.a:0 "我们将拯救人类，或死于尝试"
 podintroductions.23.t:0 "清洁派之影"
 podintroductions.23.desc:0 "罗马教廷第一次明白吸血鬼的威胁时是在对抗清洁派教徒的阿尔比十字军时期。那时，他们发现法兰西南部的可怜人，大多数时候，都是被这些受诅咒的生物给误导了。\n冕下在那时候对法兰西表现出特别的兴趣并不值得奇怪，那时候的法兰西很明显是吸血鬼感染的高发地。裁判所的行动由图卢兹的艾格尼恩领导，他是一个神秘的人，著名的罗德里格·德·纳瓦拉昔日的友人。作为一个崛起中的间谍网络——神目——的大师，艾格尼恩谋划深远，清楚地知道法兰西的情况远比罗马认为的还要糟糕。走错任何一步他都将万劫不复……"
 podintroductions.23.a:0 "要狂热，但也要耐心和狡猾"
 podintroductions.24.t:0 "太阳对十字"
 podintroductions.24.desc:0 "英格兰对于罗马教廷来说一直是一片令人费解的土地。长期坚持着古老的宗教活动，和巫术甚至其他更糟糕的东西有关的谣言时不时地出现，这座岛屿从来没有被真正地驯服。\n玛利亚修女，圣约翰修女会的领袖，是众多试图理解侵蚀着这片土地的腐化的根源的裁判官之一。修女们出现的幻觉中描述了一位被称为“密特拉”的存在体，他宣称自己是一位神灵，每当太阳落山后就会出现。\n有着这样清晰可见的目标，再以她们长久的热情为武器，修女们准备好在一场她们才刚开始理解了一小部分的战斗中领导裁判所。"
 podintroductions.24.a:0 "独一真神"
 podintroductions.25.t:0 "贵族狂热"
 podintroductions.25.desc:0 "冯·穆尔瑙，一个被天主诅咒——或祝福——的德意志贵族家族，因为他们能够字面意思上的闻到邪恶的气味。这一特征，再加上他们在巴伐利亚的据点，使他们成为暗影裁判所无价的伙伴。\n他们的参与由利奥波德·冯·穆尔瑙协调，此人体弱多病，却有着超凡的智慧和魄力。他实际上是裁判所之建立的幕后谋士和它的非正式领导者。\n在他强有力的领导下，巴伐利亚已经成为世界各地裁判官的希望灯塔，成为一旦邪恶的吸血鬼被净化后尘世会变得如何的承诺。利奥波德还远没有完成这一目标，不过他已经在计划他的下一步了，就是将各裁判所修士会合并成一个新团体……"
 podintroductions.25.a:0 "挺出对抗黑暗的一家"
 podintroductions.26.t:0 "族内其首"
 podintroductions.26.desc:0 "不管暗影裁判所让你怎么想，但实际上罗德里格·德·纳瓦拉才是第一位对抗黑暗的人。这个小贵族参加了阿尔比十字军东征，并发现自己有证据表明有“什么”在那。\n这一发现，以及此后无数次试图让他闭嘴的吸血鬼行动，都对罗德里格的理智造成了影响。如今，这位圣雅各伯骑士团创始人的敌人到处都是，甚至在他的裁判官同僚中也是如此。因此，他没有正式加入暗影裁判所，但勉强接受他们对伊比利亚再征服的支持。\n圣座担心，罗德里格的固执可能会成为一个严重的问题，因为吸血鬼很清楚他的存在，而教廷无法让半岛感受到它的全部力量。"
 podintroductions.26.a:0 "一位独自面对黑暗的偏执者"
 podintroductions.27.t:0 "兽之腹"
 podintroductions.27.desc:0 "圣座本相信意大利不受吸血鬼的腐化。但是，揭露的事实表明枢机主教法布里齐奥·乌尔菲拉实际上一直是地狱眷族，这让教宗冕下极为震惊。\n为了不让民众感到恐慌，他指派了红修会的非正式领导人维特多利亚·圣蒂尼·迪·帕尔马对这一近在咫尺的威胁进行评估。\n有着藏书丰富的修会图书馆供她使用，维特多利亚已经有了一些非常惊人的发现。吸血怪物在意大利随处可见，甚至在夜幕降临时在圣城游行。\n然而强大的力量已将她的小单元团团包围，如果她不小心，她的调查甚至可能在开始之前就结束……"
 podintroductions.27.a:0 "基督教的核心受到威胁"
 podintroductions.101.t:0 "你的故事就此展开"
 podintroductions.101.desc:0 "虎落平阳被犬欺，海伦，也就是现在的你，世界上最美丽的女人，沦落到在一个遥远的小岛上与你的死敌搏斗。很久以前，人们崇拜着你，人们为了看你一眼而浴血拼杀。墨涅拉俄斯偷走了你的一切。\n固执的斯巴达国王无法接受你在布匿战争中站在罗马一边的事实，并从那以后一直在追杀你。他摧毁了你深爱的庞培以及无数你喜爱的仆从和子嗣。现在，你身边只有你的宝贝帕里斯……但你已经厌倦了逃避。\n是时候结束这千年的恩怨了，迈锡尼的女儿。摧毁墨涅拉俄斯和他愚蠢的乌托邦梦想！\n到那时，也只有到那时，未来才会再次变得光明。"
 podintroductions.101.a:0 "现在该结束了"
 podintroductions.helena:0 "一旦墨涅拉俄斯死了，你就可以获得一项专属决议"
 podintroductions.102.t:0 "你的故事就此展开"
 podintroductions.102.desc:0 "阿布萨隆大人，丹麦之父，您对受诅的波罗的海睿魔尔的长征使您的领地向冒牌者和冒险者敞开了大门。他们必须被解决，因为您是丹麦唯一需要的统治者。\n在粉碎这些笨蛋的同时，您可能想要了解更多关于你在旅途中于鲁加发现的奇怪仪式。您还在想这些信徒想干什么，让他们的神复活吗？显然这是用于阻止您的最后一招，但……\n如果您能成功地驾驭自己身上的神灵“斯凡特维德”的力量……您将势不可挡！\n是时候让您重新征服丹麦并开始您的化神飞升了，阿布萨隆大人。这显然是您真正的命运。"
 podintroductions.102.a:0 "首先丹麦，随后……"
 podintroductions.absalon:0 "你可以投资一项专属决议来逐步破解斯凡特维德的仪式"
 podintroductions.103.t:0 "你的故事就此展开"
 podintroductions.103.desc:0 "强大的密特拉，你在英格兰的回归是一个巨大的成功，入侵的诺曼吸血鬼终于被解决了。然而，仍然有一些问题需要解决，各种不法之徒和独立亲王正在挑战你的统治。\n然而，真正的问题在别处，因为你已经能感觉到年长之倦在你的灵魂中蔓延。你也很了解如果你再睡的话你的摄政们一定会把事情搞砸的。\n然而最近，你在你的血中感觉到你的旧爱，赛特之子的齐茉媞里，再次苏醒了。也许你可以把她叫来，和她重归于好？她在你的宫廷里一直是一个纷争人物，你的附庸们可能不会欢迎她的归来……但谁在乎他们的意见呢？"
 podintroductions.103.a:0 "回到我身边来吧，伊西斯的至爱"
 podintroductions.mithras:0 "你派人去找齐茉媞里，这花费许多，并可能会激怒你的封臣"
 podintroductions.103.b:0 "和你的前任复合从来都不是一个好主意"
 podintroductions.mithrasb:0 "你忘了整个事"
 podintroductions.104.t:0 "你的故事就此展开"
 podintroductions.104.desc:0 "军督罗斯托维奇，你的统治陷入了危机。尽管你击败了约根和他的梵卓，但你还是被血族突然的背后捅了一刀，被迫签署了无条件和平协议。你的封臣们对此并不满意。\n“太年轻！太西方！无能粉碎睿魔尔！”他们说。这些蠢货，只能勉强守住他们可怜的城堡，对战争和统治一无所知。尽管如此，你还是需要它们。\n你必须回到你的“战争审判”的策略，与你自己的封臣进行小规模的战争以遏制他们的野心。他们会再次学会尊重你。"
 podintroductions.104.a:0 "让魔物飨宴开始吧"
 podintroductions.vlad:0 "作为罗斯托维奇，你得到了针对你的直属封臣的专属[character_interaction|E]"
 podintroductions.105.t:0 "你的故事就此展开"
 podintroductions.105.desc:0 "伊崔乌斯大人，你的对手格拉崔克斯被流放到了法兰西，使你成为了睿魔尔的宠臣和家族领袖。尽管如此，你还是要面对[Clan|E]内外的威胁。你东方的棘秘魑军督领是一个永远存在的问题，但你也必须确保没有其他魔法师试图篡夺你的合法位置。\n作为创始人的得力助手，你有很多工具来确保这种情况不会发生。一定要明智地使用它们，为睿魔尔家族带来荣耀！……当然，也为了你自己。"
 podintroductions.105.a:0 "金字塔由我指令"
 podintroductions.etrius:0 "作为伊崔乌斯，你得到了针对你的直属睿魔尔封臣的专属[character_interaction|E]"
 podintroductions.106.t:0 "你的故事就此展开"
 podintroductions.106.desc:0 "令人畏惧的玛塔孙塔，你刚刚醒来来到了这个陌生的新世界，远离了你深爱的匈人的光辉岁月。尽管如此，还是有一些新的草原骑士需要帮助，一些新的“文明”需要摧毁！\n但你一个人做不到这，冈格罗[Clan|E]已经忘记你了。因此，你必须依靠你自己的后嗣。森德拉克已经在那里了，但宰亚特已经皈依了一种奇怪的新宗教，而且是你无法触及的……但沃罗丘斯，大概是三者中最强大的一位，倒是很有机会争取。\n你可以召唤他，尽管考虑到距离，这将花费你大量的能量。或者你可以把他忘了。"
 podintroductions.106.a:0 "让我们再一起同骑吧，我的子嗣！"
 podintroductions.106.b:0 "我自己一个人做就行了"
 podintroductions.107.t:0 "你的故事就此展开"
 podintroductions.107.desc:0 "无畏的泰贝莎，你已经被最长者亲自送到伊比利亚来了，她给的任务很明确：阻止再征服运动。\n这是极大的荣誉，也是极大的责任，因为你[Clan|E]中最受尊敬的成员都认为你能够击退基督教勒森魃之潮。\n你把巴达霍斯作为你的权力中心，尽可能接近前线，但你现在被迫玩一个你不太熟悉的游戏，政治游戏。\n安达卢西亚分裂着，但分裂会导致灭亡。因此，到目前为止，你已经接受了拜德尔对联合的穆斯林[cainites|E]的冷酷领导，但您担心她的方法在长期来看可能会导致进一步的不团结。\n你不会让你的长者失望，但摆在你面前的任务仍然令人恐惧，而真正的威胁可能比你最初想象的更近……"
 podintroductions.107.a:0 "我将成为安达卢西亚之盾"
 podintroductions.tabitha:0 "作为泰贝莎，你有一项限时决议"
 podintroductions.108.t:0 "你的故事就此展开"
 podintroductions.108.desc:0 "罗克大人，伊比利亚现在一片混乱。勒森魃的内战可能会吞噬所有人，包括你。如果你想生存下去，你必须时刻有所准备。\n你的狡猾和外交技巧使你赢得了邻居的尊重，即使你是下位[Clans|E]之一。很明显，他们仍然鄙视你，如果你表现出软弱，他们会毫不犹豫地粉碎你。记住，他们只有在别无选择的情况下才会接受你作为他们的同伴。\n你也被称作是一位有天赋的，尽管做事很强迫性的，阴谋家，这可能是你在可怕的时期到来时最大的资产。利用好它，你甚至可能成为新伊比利亚最杰出的领导人之一。"
 podintroductions.108.a:0 "我必须提前计划"
 podintroductions.roque:0 "作为罗克，你可以投资一个能在完成时给予专属增益的计谋"
 podintroductions.109.t:0 "你的故事就此展开"
 podintroductions.109.desc:0 "蒙塔诺大人，暗影之海活在一片狼藉当中。伊比利亚内战，第四次十字军东征的灾难以及卡米拉在罗马的崛起已经使得你所掌控且从你[Sire|E]那里接过的庞大帝国几乎化为乌有。\n不能再这样下去了，否则会招致[Clan|E]的混乱，因为那些年轻的伪君子已经开始传播关于你作为一个失败领导者的谣言。\n为了恢复你的权威，行动方案很简单。确保西西里和意大利的安全，向勒森魃[Clan|E]展示你们仍然是一支不可忽视的力量。只有到那时，你才会再次受到尊重。"
 podintroductions.109.a:0 "还有许多事情要做"
 podintroductions.montano:0 "作为蒙塔诺，你有一项能恢复你摇摇欲坠的权威的专属决议"
 podintroductions.110.t:0 "你的故事就此展开"
 podintroductions.110.desc:0 "娜塔莉娅大人，君士坦丁堡在焚烧而你的新乌托邦梦想也随着化为灰烬。以你在希腊的强大地位，你可能是这座世界渴望之城的唯一希望……但是拉丁人已经盘的根深蒂固了。你需要一个计划。\n另一位幸存者安娜·科穆宁是围攻这座城市的完美盟友，但你知道……安娜她冷酷无情，野心勃勃，只在乎权力。\n另一种解决方法是忠于你的理想，并向剩下的米迦勒派寻求帮助。强大的马拉希底斯，米迦勒的选民，能帮上大忙。但他绝不会接受与安娜结盟，所以只能二选一。\n实用主义还是理想主义是摆在你面前的选择。选哪项，帝国独一的统治者？"
 podintroductions.110.a:0 "实用主义。我需要安娜的军队"
 podintroductions.110.b:0 "理想主义。马拉希底斯将指引我。"
 podintroductions.natalya:0 "你将与尼西亚的安娜·科穆宁结盟"
 podintroductions.111.t:0 "你的故事就此展开"
 podintroductions.111.desc:0 "睿智的突伽·辛，俄罗斯比任何时候都需要你。你永远的敌人，可怕的芭芭雅嘎，现在还在沉睡，但她的影幕间谍仍然在他们对被诅鬼婆的暴政崇拜下压迫着你的故土。\n你将需要所有可集齐的帮助，来面对这艰巨任务。幸运的是，你被认为是可能是[cainite|E]世界最伟大的导师，你可以利用这个事实。\n把最棒的人聚集在您的周围，尊敬的导师，并带领他们走向胜利！"
 podintroductions.111.a:0 "新的一代将拯救我们"
 podintroductions.durgasyn:0 "作为突伽·辛，你在教育新后嗣时总具有一项有益的专属选项。\n你也可以通过达成西方与东方目标决议，解除芭芭雅嘎对你的诅咒，来恢复你的青春。"
 podintroductions.112.t:0 "你的故事就此展开"
 podintroductions.112.desc:0 "赞美赛特，也赞美玛阿特卡勒，他最心爱的配偶，因为你拯救了误入歧途的“[cainite|E]”种族。当你看到这么多你所爱的子嗣没有遵从他的教导时，你的心会流泪。尽管如此，希望还是存在的，因为伊比利亚勒森魃内战的混乱让他们中的许多人误入歧途，寻找指引。\n作为圣显者之一，赛特之子[Clan|E]的合法领袖，你很乐意提供这样的指导。只有全世界都在赞美他，你才会停止。到那时，也只有到那时，他才会凯旋而归到你身边……"
 podintroductions.112.a:0 "那么多可怜的灵魂等着被解放"
 podintroductions.maatkare:0 "作为玛阿特卡勒，你具有一项用于转变任何非狂热非信者的专属[character_interaction|E]。该选项只在你处于赛特之道宗教时可用。"
 podintroductions.113.t:0 "你的故事就此展开"
 podintroductions.113.desc:0 "卡维娅大人，你刚刚巩固的橄榄会议已经有一个新的危机正在引起您的注意。强大的大马士革城市已经沦陷在崇魔者的影响之下，它的疯狂将吞噬整个地区。\n玛纳尔，一位亲王的子嗣，比斯塔克，哈基姆派使节，是这座城市仅存的两名神志正常的吸血鬼，现在正请求你的帮助来净化这座城市。他们都发誓，如果你保证支持他们的功业，他们会尽他们所能帮助你。\n拯救大马士革将向世界传递一个强有力的信息，那就是萨洛比[Clan|E]仍然健在，但你也知道，这会让你成为巴力势力的首要目标，直到这座城市被拯救……"
 podintroductions.113.a:0 "我们必须赶上，否则就太晚了"
 podintroductions.113.b:0 "遗憾的是，会议目前太弱了"
 podintroductions.qawiyya:0 "要去掉负面修正，你必须在70年内拿下大马士革和巴尔米拉"
 podintroductions.114.t:0 "你的故事就此展开"
 podintroductions.114.desc:0 "腓力背叛了你。卡山德背叛了你。就连亚历山大也背叛了你，他的命运就在眼前，却那么快就死去了。你孤身一人，佩塔尼夸。\n但在这里，你找到了力量和新的目标。当你彻底地回避人类的时候，新的盟友蜂拥而来，被称为“黑旋舞者”的狼人。他们崇拜一位叫做“妖蛆”的黑暗存在体。\n也许这就是拯救你的关键，佩塔尼夸。走在这黑螺旋中可能会拯救你……或者进一步处刑你。\n但你还能往下走多远？"
 podintroductions.114.a:0 "真相就在下面"
 podintroductions.petaniqua:0 "作为佩塔尼夸，你有一项来行于黑螺旋的决议。请注意，这远非一种安全的尝试……"
 podintroductions.115.t:0 "你的故事就此展开"
 podintroductions.115.desc:0 "狄奥尼修斯大人，第四次十字军东征的动荡正在蔓延到你所热爱的雅典。难民们来到这座城市，他们感到身心俱失。作为人性之路的主要倡导者之一，你有责任庇护这些可怜的灵魂。\n但你也可以在这个被毁的希腊重建秩序，以避免这样的创伤性事件再次发生。作为一个受人爱戴的老师和导师，一定要找到并培养你未来最好的接班人。[cainite|E]种族现在比以往任何时候都需要他们。"
 podintroductions.115.a:0 "于烬重生"
 podintroductions.dionysius:0 "作为狄奥尼修斯，你在教育新后嗣时总具有一项有益的专属选项"
 end_intro_tooltip:0 "你将不会得到任何额外信息。"
 podintroductions.2001.f:0 "我有点略懂，但是我想知道更多细节"
 continue_intro_tooltip:0 "你将在接后天数获得关于模组的机制的更多详细信息"
 podintroductions.3000.t:0 "黑夜之秘"
 podintroductions.3000.desc:0 "你想探讨哪个主题？"
 podintroductions.3000.a:0 "律能"
 podintroductions.3000.b:0 "初拥与子嗣"
 podintroductions.3000.c:0 "潜藏"
 podintroductions.3000.d:0 "饥渴"
 podintroductions.3000.e:0 "我这样就行，直接开始吧！"
 podintroductions.3001.a:0 "返回"
 podintroductions.3001.t:0 "律能"
 podintroductions.3001.desc:0 "[disciplines|E]，也就是吸血鬼的力量，在模组中由独特的生活方式所展示。只有当你拥有相应的特质时，你才能在一棵技能树上花费点数（例如：迅捷术技能树是由迅捷术特质解锁的）。\n你主要通过猎食凡人或牧群凡人来获得这些技能树的生活方式经验（牧群意味着在较长的时间内将凡人作为血源保存在身边），这两种方式都是与你同地点的凡人进行的[character_interaction|E]。\n有些凡人比其他凡人提供更多的经验，这取决于他们的特质。"
 podintroductions.3002.t:0 "初拥与子嗣"
 podintroductions.3002.desc:0 "作为非淡血种吸血鬼，你不能生孩子。你的角色页面中的“子女”栏展示了你的子嗣，即被你转为吸血鬼的凡人。要做到这一点，你可以对你同地点的任何凡人使用[character_interaction|E]。\n一旦互动和随后的计谋完成，这位凡人就会成为吸血鬼，即你的子嗣。请注意，你将不得不在之后对他们进行教育，这将是以昂贵的或危险的不同方式进行。"
 podintroductions.3003.t:0 "潜藏"
 podintroductions.3003.desc:0 "[masquerade|E]代表了你在多大程度上暴露于凡人当局，如教廷。在游戏中，它是一个从0到5的角色修正。曝露度可以通过使用吸血鬼的力量、猎食凡人和各种事件而上升。如果它上升得太高，裁判行动（一个派系）将显现来对抗你。你也可能被单独的裁判官盯上，试图猎杀你。\n为减少曝露度，大多数宗教可以通过右键点击你的角色来使用“掩盖潜藏”互动。那些不关心[masquerade|E]的宗教就没有这个权利了。"
 podintroductions.3004.t:0 "饥渴"
 podintroductions.3004.desc:0 "饥渴代表你的角色有多需要血。饥渴主要通过使用吸血鬼的力量来增加。如果它上升得太高太久，你将不能再使用吸血鬼的力量，一些讨厌的事件可能会发生。\n为了减少你的饥渴度，你必须猎食凡人，对你同地点的任意凡人进行[character_interaction|E]。"
 podintroductions.4000.t:0 "信仰之秘"
 podintroductions.4000.desc:0 "你想探讨哪个主题？"
 podintroductions.4000.a:0 "真信"
 podintroductions.4000.b:0 "裁判官的能力"
 podintroductions.4000.c:0 "继承"
 podintroductions.4000.d:0 "寻找巢穴"
 podintroductions.4000.e:0 "我这样就行，直接开始吧！"
 podintroductions.4001.a:0 "返回"
 podintroductions.4001.t:0 "真信"
 podintroductions.4001.desc:0 "作为猎人最重要的工具之一，真信（以及它的升级版荣福）是一个可以解锁强大生活方式的特质。大多数开局猎人在开局时都有这特质，但确保你的继承人也有这特质是一项重要的任务。\n要做到这一点，你可以在任何其他角色身上使用真信能力“代祷”，以便有机会让他们拥有这一特质。如果这个方法失败了，而你扮演的角色又没有这个特质，但又想拥有它，你可以请一个有真信的朋友帮助你获得它。但这是一个昂贵而困难的过程。\n真信生活方式的经验值主要是通过寻找巢穴互动/计谋获得的，这将在关于其的部分中说明。"
 podintroductions.4002.t:0 "裁判官的能力"
 podintroductions.4002.desc:0 "除了在专属部分中说明的真信外，裁判官拥有的生活方式取决于你的角色属于哪个裁判官修士会，这由你的角色在游戏中的宗族来代表。你无法获得其他宗族的专属能力。"
 podintroductions.4003.t:0 "继承"
 podintroductions.4003.desc:0 "每个修士会都有自己的继承方法。冯·穆尔瑙的玩法就像CK3本体，有婚姻和孩子。其他神圣修士会使用一种专属[character_interaction|E]来授任角色，让其成为他们的“孩子”。\n授任遵循一些规则，比如学徒要比导师年轻，或者在圣约翰修女会的情况下，得是女性。\n除了冯·穆尔瑙和神目之外，其他教团都是宣誓独身，因此必须使用这一机制来确保有合适的继承人。"
 podintroductions.4004.t:0 "寻找巢穴"
 podintroductions.4004.desc:0 "寻找巢穴是猎人对抗吸血鬼角色的特殊计谋，是猎人游玩的核心部分，因为它是一种不需要战争就能干掉强大吸血鬼的方法，也是获得真信生活方式经验的主要途径。\n显然，这样的计划是很危险的，但如果你能很好地挑选目标，就可以减轻难度。主要要看的是属性，你在某一类别中对目标的相差越高，就越容易。\n寻找巢穴也可为困难的战争做准备，因为你可以在战争开始前猎杀你未来敌人的最佳骑士。"
 podintroductions.2001.h:0 "回到开头"
 podintroductions.5100.t:0 "迄今为止的过往……"
 podintroductions.5100.desc:0 "《[world_of_darkness|E]》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n《黑暗世界》的吸血鬼主要来源于圣经中对该隐（第一个谋杀犯）的诅咒，他们中的大多数都可以追溯世系到他的身上，这一体系被称之为“世代”。这棵不死族宗族之树已经分裂成数个派系，既[Clans|E]，每个派系都有自己的力量、弱点和地缘权力基础。\n你正在扮演一位万鬼，所谓的“东方血族”，他们曾是古老的英雄，因为他们的罪行而被玉皇大帝诅咒。虽然他们实际不是吸血鬼，但他们经常与西方的吸血鬼互动，主要是通过领地战争，特别是在印度。几千年来，次大陆一直是来自东亚的万鬼和印度本地吸血鬼之间的主要战场。万鬼本身并不是一个统一的阵线，他们分为不同的“心法”（他们的主要信仰）和“皇朝”（他们的主要政治组织）。"
 podintroductions.5000.t:0 "万鬼之秘"
 podintroductions.5000.desc:0 "你想探讨哪个主题？"
 podintroductions.5000.a:0 "心法"
 podintroductions.5000.b:0 "气"
 podintroductions.5000.c:0 "继承"
 podintroductions.5000.d:0 "阴阳平衡"
 podintroductions.5000.e:0 "我这样就行，直接开始吧！"
 podintroductions.5001.a:0 "返回"
 podintroductions.5001.t:0 "心法"
 podintroductions.5001.desc:0 "你的心法等级代表着你在途径上的成果，它可以通过决议升级，在一些走火入魔的情况会降低。当降低到0时，你就会成为魑魅，无法再统治（退位）。\n当你心法达到5级以上时，你可以通过内息来食气（鬼人的法力资源），而不是通过血液食气（吸血会降低目标囚犯的生命点，当达到临界状态时有[torpor|E]/小死的危险），当你达到6级以上时，可以从环境中食气。\n达到高阶心法也允许你有额外的气德等级。从5级心法开始，你会按每升一级心法将获得两额外的气德等级。"
 podintroductions.5002.t:0 "气"
 podintroductions.5002.desc:0 "你的气分为两种，阴和阳，并受气德限制。\n当你花光一种气或拥有比同属气德更多的气时，你会得到临时的过亢负面修正。而当有了阴阳失衡特质将允许摄取更多的同属的气而不有负面修正。\n当气的总数为5点或更少时，你将收到气虚负面修正，少于2点会使你收到气荒负面修正，而0点会使你失控（阳盛阴衰特质使你饿得更快，所以当气虚时反而气荒，当气荒时反而失控）。\n花费比你拥有的更多的气可能会给你生命流失负面修正，这将最终使你进入“小死”（导致退位）。"
 podintroductions.5003.t:0 "继承"
 podintroductions.5003.desc:0 "万鬼不能像吸血鬼那样[Embrace|E]，但阳盛阴衰能使他们可以与凡人生出半鬼人，或者他们可以捕获魑魅并将其作为弟子进行教育，魑魅是最近从幽冥返回的死者或失去所有人性（压力事件）的[GetTrait('shih').GetName( GetPlayer )]，捕获行动在游戏中通过决议体现，教育则通过事件链体现。"
 podintroductions.5004.t:0 "阴阳平衡"
 podintroductions.5004.desc:0 "当阴阳气德相差超过3时，你会得到阴阳失衡特质，这可能不是坏事，因为阴阳失衡特质会带来一些特殊的机制，在其他主题有所解释。\n但是，长期的阴阳失衡（5年一次低概率触发事件）会带来一些后果；阴盛阳衰会使你成为[GetTrait('shih').GetName( GetPlayer )]（东方猎魔人）的目标，以及更加非人和尸化，最后变成僵尸；阳盛阴衰会给你带来致命的、传染性极强的吸血鬼疾病。"
 podintroductions.6002.t:0 "背景"
 podintroductions.6002.desc:0 "你想在地图上任选一位吸血鬼，让其成为你的[Sire|E]，算作是你角色的设定，还是你喜欢以没有明确世系背景开局？"
 podintroductions.6002.a:0 "我想自选一位与我为亲者。"
 podintroductions.6002.c:0 "我将让其保持未知。"
 podintroductions.6003.t:0 "背景与前景"
 podintroductions.6003.desc:0 "你想在地图上任选一位万鬼，让其成为你的师父，算作是你角色的设定，还是你想在游玩过程中加入？"
 podintroductions.6003.a:0 "我想选个初始师傅。"
 podintroductions.6003.b:0 "我想在过程中加入屋室。"
 podintroductions.6003.c:0 "我想从黑户开始。"
 podintroductions.6004.t:0 "背景与前景"
 podintroductions.6004.desc:0 "你想在地图上任选一位[ghoul|E]/[revenant|E]，让其成为你的父母，算作是你角色的设定，还是你想在游玩过程中加入组织，又或永不加入？"
 podintroductions.6004.b:0 "我想改变我所处的组织。"
 podintroductions.6004.b.t:0 "你将能加入弃民，专注于猎杀吸血鬼的独立血仆派系。又或成为吸血鬼的子嗣。"
 podintroductions.6004.c:0 "我不需要这些。"
 podintroductions.6005.t:0 "背景与前景"
 podintroductions.6005.desc:0 "你想在地图上任选一位猎人，让其成为你的父母，算作是你角色的设定，还是你想在游玩过程中加入组织，又或永不加入？"
 podintroductions.6005.b:0 "我想改变我所处的组织。"
 podintroductions.6005.c:0 "我不需要这些。"
 podintroductions.6005.b.t:0 "你将能加入裁判所，若你在地图东亚南亚区则能加入[GetTrait('shih').GetName( GetPlayer )]，或者选择陷入黑暗。"
 podintroductions.2006.t:0 "迄今为止的过往……"
 podintroductions.2006.desc:0 "《[world_of_darkness|E]》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n《黑暗世界》的吸血鬼主要来源于圣经中对该隐（第一个谋杀犯）的诅咒，他们中的大多数都可以追溯世系到他的身上，这一体系被称之为“世代”。这棵不死族宗族之树已经分裂成数个派系和[Clans|E]，每个派系都有自己的力量、弱点和地缘权力基础。\n在你这局的初始日期，裁判所和大反乱已经都过去了，让不死族世界受过了前所未有的震动。为了应对这些新的威胁，大多数[Clan|E]一起成立了秘盟，这个党派旨在将吸血鬼隐藏在凡人的视线之外。与此相对应的是魔宴的形成，彻底暴露吸血鬼其怪物本质。但许多[cainites|E]还没有选择立场，这两个脆弱的党派的未来目前仍然相当不确定。"
 podintroductions.6010.t:0 "你的真实年龄"
 podintroductions.6010.desc:0 "你可以在这里设置你的真实年龄，这不会改变你永生外表。\n注：推荐为吸血鬼角色提高年龄；由于CK3的限制，如果一位角色比你更年老，可能无法正常让其成为你的子嗣。"
 podintroductions.6010.a:0 "重置为16岁。"
 podintroductions.6010.b:0 "加100岁"
 podintroductions.6010.c:0 "加10岁"
 podintroductions.6010.d:0 "加1岁"
 podintroductions.6010.e:0 "保存当前年龄"
 podintroductions.2001.t_ghouls:0 "欢迎来到黑暗从者"
 podintroductions.2001.a_ghouls:0 "让我们来谈谈血仆和[revenant|E]的主要机制……"
 podintroductions.2003.t_ghouls:0 "血仆101问"
 podintroductions.2003.desc_ghouls:0 "首先，推荐在熟练了吸血鬼的机制后再玩血仆和[revenant|E]，因为它们都使用类似的机制，但对于“黑暗从者”来说，优势更少，难度更大。此篇介绍将只谈与吸血鬼主要机制的具体出入。\n血仆是永生的，但[revenant|E]不是，不过寿命比凡人要长的多。两者都可以有孩子，这些孩子有可能会成为[revenant|E]（如果是[revenant|E]夫妇所生，则更有可能）。\n他们拥有一些专属建筑，这些建筑相当强大，但无法拥有一些更特殊的吸血鬼建筑。\n他们可以用与吸血鬼相同的生活方式来使用[disciplines|E]。他们没有[Embrace|E]、[diablerie|E]和类似的吸血鬼专属东西。\n请记住，虽然有着非自然的健康，但你并不像吸血鬼那样对疾病免疫。\n最后，请记住，这是一种难度很大的游戏方式，因为你差不多就是个削弱版的吸血鬼，优势不多，机制更少，而且有很多新的缺点。"
 podintroductions.6004.a:0 "我想选父母。"
 podintroductions.6005.a:0 "我想选父母。"
 podintroductions.2001.t_kueijin:0 "欢迎来到黑暗老祖"
 podintroductions.2202.t:0 "欢迎来到黑暗不朽者"
 podintroductions.2202.desc:0 "首先，感谢您玩这个Mod！\n[princes_of_darkness|E]是对基础游戏的彻底改造，旨在将P社旗下白狼公司的《[world_of_darkness|E]》跑团规则带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。\n你正在游玩木乃伊，它的玩法和概念与吸血鬼或裁判官非常不同。虽然介绍会提出关键的核心概念，但如果你想得到更深入的指南，请不要犹豫，去我们的维基上看看。"
 podintroductions.2202.a:0 "让我们来谈谈木乃伊的主要机制……"
 podintroductions.2210.t:0 "重生之秘"
 podintroductions.2210.desc:0 "你想探讨哪个主题？"
 podintroductions.2210.a:0 "复活"
 podintroductions.2210.b:0 "赫考与塞赫"
 podintroductions.2210.b_wutian:0 "丹与气"
 podintroductions.2210.c:0 "奈特鲁"
 podintroductions.2210.e:0 "我这样就行，直接开始吧！"
 podintroductions.2211.a:0 "返回"
 podintroductions.2211.t:0 "复活"
 podintroductions.2211.desc:0 "你是永生的，甚至更强，你可以在被杀时复活！\n\n这将花费3000虔诚，且每个罪恶特质都将让其翻倍。\n\n当你无法支付代价时，或因自己的意愿或压力而决定自杀时，或当你的灵魂被吞噬时，你仍然会终于湮灭！"
 podintroductions.2212.t:0 "赫考与塞赫"
 podintroductions.2212.desc:0 "作为木乃伊，你具有施展赫考（力量之语）的能力，其以生活方式表示。\n\n你使用塞赫来施展你的赫考，而且不同木乃伊回复它的方式不同：[GetTrait('shemsuheru').GetName( GetPlayer )]随着时间的推移而恢复（若你在[GetGeographicalRegion('pod_lands_of_faith').GetName]将1点/1月回复，否则将取决于你的玛阿特圣所等级，每一级提供25%的回复概率），[GetTrait('cabiri').GetName( GetPlayer )]则是通过对自己使用“普纽玛回复”[character_interaction|E]来激活自动回复，而[GetTrait('banemummy').GetName( GetPlayer )]则通过$EXECUTION_DEVOUR$选项处决[prisoners|E]获得。\n\n花费塞赫到零以下会给你一个生命力流失负面修正，当修正计数超过-9时，你将陷入[shadow_realm|E]。"
 podintroductions.2212.t_wutian:0 "丹与气"
 podintroductions.2212.desc_wutian:0 "作为天亲，你不能像埃及的木乃伊那样利用真名，但你可以获得丹术生活方式。\n\n你不具备塞赫，相反，你有着阴气和阳气，总数为10，且会随着时间的推移而恢复。\n\n花费气到零以下会给你一个生命力流失负面修正，当修正计数超过-9时，你将陷入[shadow_realm|E]。"
 podintroductions.2213.t:0 "奈特鲁"
 podintroductions.2213.desc:0 "你是独一无二的，你不能创造更多的木乃伊来协助你（除非你是荷鲁斯或卡比洛斯）。\n\n反而，你可以使用[neteru|E]来接管你的头衔或建筑。\n\n你的凡人孩子一出生就会成为你的[neteru|E]，但你也可以用花费威望使用[interaction|E]来认同你的廷臣是[neteru|E]。\n\n只有一件事，他们没法担任你的继承人，所以当你不能再复活时，游戏就会自动结束。"
 podintroductions.6006.t:0 "背景"
 podintroductions.6006.desc:0 "你想在地图上任选一位狼人，让其成为你的父母，算作是你角色的设定？"
 podintroductions.6006.a:0 "我想选父母。"
 podintroductions.6006.c:0 "我不需要这些。"
 podintroductions.2302.t:0 "欢迎来到黑暗大统领"
 podintroductions.2302.desc:0 "首先，感谢您玩这个Mod！\n[princes_of_darkness|E]是对基础游戏的彻底改造，旨在将P社旗下白狼公司的《[world_of_darkness|E]》跑团规则带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.2302.a:0 "让我们来谈谈死灵的主要机制……"
 podintroductions.2203.t:0 "木乃伊回归"
 podintroductions.2203.desc:0 "木乃伊，也被称为不朽者或重生者，是其身体经过仪式性的保存，并被赋予自我复活的能力的永生者。\n伊西斯用强大的生命神咒创造出来他们，最初是用于追随和服务她的儿子荷鲁斯，是在他与杀害他父亲奥西里斯的凶手赛特的永恒战争中的伙伴。他们是埃及——黑沙和金字塔的土地——的最初不朽者。他们被共同的文化绑在一起，继续为荷鲁斯的两大目标而努力：向赛特复仇和击败巨蛇阿波菲斯。\n然而，并非所有的木乃伊都致力于这场战斗。有些人不顾荷鲁斯的不赞同，选择了分道扬镳，这些人被称为以实玛利派。\n而这些“中立”木乃伊的其中一位将生命神咒传授给了希腊法师卡比洛斯，后者建立了自己的“朝代”，其等至今仍被荷鲁斯追杀，他对神圣的生命神咒被交给不信者这点很是愤怒。\n最后，赛特本人从未真正获得过生命神咒，但他近乎拥有过，以至于他自己创造了扭曲版的神咒。这导致了受诅木乃伊的诞生，他们是对埃及的真正木乃伊的疯狂嘲弄，专心侍奉他们的黑暗之神的命令。"
 podintroductions.2203.a:0 "回到开头"
 podintroductions.2202.b:0 "关于木乃伊的资料"
 podintroductions.2402.t:0 "欢迎来到黑暗天使"
 podintroductions.2402.desc:0 "首先，感谢您玩这个Mod！\n[princes_of_darkness|E]是对基础游戏的彻底改造，旨在将P社旗下白狼公司的《[world_of_darkness|E]》跑团规则带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.2402.a:0 "让我们来谈谈恶魔的主要机制……"
 podintroductions.224.t:0 "你的故事就此展开"
 podintroductions.224.desc.intro:0 "你是作为睿魔尔巫士[destroyed_tremere_master.GetFullName]的仆人被创造的。通过一系列奇特的情况，[destroyed_tremere_master.GetSheHe]被棘秘魑摧毁。作为[destroyed_tremere_master.GetHerHis]领域中唯一幸存的吸血鬼，你事实上已经继承了这个国度和财产。然而，你周围有很多潜在的敌人和盟友，他们都想把你拉到身边。你是要孤军奋战，还是戴上新的枷锁，向新的领主宣誓效忠？"
 podintroductions.224.a:0 "雷霆使谁更伟大？至少在这里，我们将获得自由"
 podintroductions.224.a.tt:0 "保持独立，你巩固了你对[destroyed_tremere_master.GetFullName]的财产的控制，包括大量的刮刀蝙蝠。"
 podintroductions.224.b:0 "以一定代价，向拉兹科利纳宣誓效忠"
 podintroductions.224.b.tt:0 "拉兹科利纳看问题的方式与其他魔物不同。虽然独断专行，但她会遵守任何宣誓誓言。如果能接受她的思维方式，就可以达成交易。她接受梵卓、冈格罗和家传血仆在她的国度里。她可能提供了摆脱棘秘魑和睿魔尔之间预兆之战的最佳希望。"
 podintroductions.224.c:0 "在血肉大教堂寻求庇护"
 podintroductions.224.c.tt:0 "沃拉克无疑是该地区最强大的棘秘魑，尽管他的心态奇异。他可以用鲜血浇灌你，帮助我们释放你的棘秘魑血脉的力量。但他肯定会要求你发血誓。"
 podintroductions.224.d:0 "协助剥皮者的野心"
 podintroductions.224.d.tt:0 "附近最弱的督军，维利亚并不缺乏野心。他也是一位出色的库都术士。务实的他会用魔法和他的保护来换取附庸的效忠。作为一个弱小领主的强大附庸，可能比成为最弱小的领主更好。"
 podintroductions.224.e:0 "回归主人"
 podintroductions.224.e.tt:0 "声称我对我主人的毁灭是无辜的，并直接向睿魔尔的执政伊崔乌斯求救。虽然他肯定会要求我宣誓并重返岗位，但他可能会允许一些有限的自主权作为“实验”。"
 podintroductions.224.f:0 "母亲！母亲会帮助我们的！"
 podintroductions.224.f.tt:0 "所有石像鬼的伟大母亲，维斯塔尼亚，喜欢她魔法的所有造物。去向她表示你的忠诚，协助她在翁格瓦尔的政治阴谋，她会用一支石像鬼斥候近卫军来奖励她“自由奔放的孩子”。"
 podintroductions.rocklord:0 "作为岩主，你对夜行神龙的命运有着举足轻重的作用。"
 POD_rocklord_razorbat_flock:0 "岩主的刮刀蝙蝠群"
 POD_rocklord_retinue:0 "岩主的近卫军"
 podintroductions.2402.b:0 "关于恶魔的资料"
 podintroductions.2403.t:0 "堕落天使"
 podintroductions.2403.desc:0 "恶魔是堕落的天使，他们在创世的第一天选择与路西法和人类站在一起，而不是与天主站在一起。为了惩罚他们的叛逆和不忠，天使长米迦勒把这些天使从天堂扔到深渊。他们从那时起就被囚禁着，但他们中的一小部分被崇魔者召唤出来，现在又回到了大地上，其等由于永恒监狱的伤害而经受着极大的磨难。\n\n堕落天使——现在被称为恶魔——放弃了他们曾经坚持的一切，现在想看到一切都被烧毁，只因对让他们受难的无情上帝的怨恨。"
 podintroductions.2403.a:0 "回到开头"
 podintroductions.2410.t:0 "受诅者的秘密"
 podintroductions.2410.desc:0 "你想探讨哪个主题？"
 podintroductions.2410.a:0 "容器"
 podintroductions.2410.b:0 "奥秘与虔心"
 podintroductions.2410.c:0 "魔奴"
 podintroductions.2410.e:0 "我这样就行，直接开始吧！"
 podintroductions.2411.a:0 "返回"
 podintroductions.2411.t:0 "容器"
 podintroductions.2411.desc:0 "为了留在尘世中，恶魔必须居住在某种物理容器中。[GetTrait('truefallen').GetName( GetPlayer )]拥有人类容器，但他们没法被长久地维持。当你当前的容器死亡时，你会收到一个事件，询问你是否要用一位随机[thrall|E]作为容器，或者暂时进入灵体状态，以便你可以通过[character_interaction|E]选择一个新容器。[GetTrait('earthbound').GetName( GetPlayer )]则食用[artifact|E]或[title|E]，确保不要失去它们，否则你将回到基本什么都做不了的灵体状态。\n\n如果你在灵体状态下停留太久，你会被困在深渊中，无法进行大部分的[character_interaction|E]，需要[piety_i]#N 10000#!才能逃脱并拥有另一个容器。"
 podintroductions.2412.t:0 "奥秘与虔心"
 podintroductions.2412.desc:0 "恶魔或[thrall|E]都可以使用奥秘，以生活方式的形式表现出来，尽管有些技能是恶魔专属。恶魔可以通过他们拥有的[thrall|E]的数量来每年获得奥秘生活方式的经验值。\n\n虔心是你恶魔能力的燃料，你可通过以下方式回复：启示[character_interaction|E]，食罪[character_interaction|E]（通过[GetPerk( 'arcana_sin_eating_perk' ).GetName( GetPlayer )]解锁）或$EXECUTION_DEVOUR_SOUL$处决选项。 "
 podintroductions.2413.t:0 "魔奴"
 podintroductions.2413.desc:0 "[thrall|E]是恶魔的仆从，在通过引诱和腐化一位角色入你的信仰吼，你将能使其化为你的[thrall|E]。这将使他们堕入崇魔。恶魔和崇魔者是你唯一可以拥有的封臣，否则他们会立即建立派系。作为他们的主人，你可以通过提供奥秘技能点来命令他们，要求提供金钱、宝物、头衔或对邻国统治者发动战争。"
 podintroductions.6002.option.a.t:0 "通过对任何其他活着的角色使用[character_interaction|E]，你将能够选择成为与之相关的角色。"