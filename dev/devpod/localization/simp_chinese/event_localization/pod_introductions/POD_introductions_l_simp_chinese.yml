l_simp_chinese:
 podintroductions.1.t: "黑玫瑰"
 podintroductions.1.desc: "$TAB$当凡人的法兰西在阿尔比派十字军的内部混乱中挣扎时，吸血鬼的法兰西也同样举步维艰。\n$TAB$[GetScriptedCharacterByHistoryID('505082').GetFirstName]，第四代[GetTrait('ventrue').GetName(GetNullCharacter)]，在不到两年前还是法兰西和巴黎的[Glossary('亲王','game_concept_prince_desc')]。他被一场由妥芮朵的[GetScriptedCharacterByHistoryID('505072').GetFirstName]和他自己的子嗣[GetScriptedCharacterByHistoryID('790138').GetFirstName]领导的政变推翻了。\n$TAB$[GetTrait('toreador').GetName(GetNullCharacter)]女王已经夺取了国家的控制权并试图巩固自己的地位，以面对自己同族和其他法兰西女王们的反对。另一方面，若弗鲁瓦得到了巴黎作为战利品，但假以时日，他可以以自己的血脉为由去竞争王位。\n$TAB$至于南边，图卢兹的[GetScriptedCharacterByHistoryID('505073').GetFirstName]正在利用清洁派起义来达到自己目的，但可能很快就会面对北法兰西的怒火。\n$TAB$这个国家在这场磨难中会找到一个比亚历山大更好的新统治者吗？还是会被混乱和毁坏所席卷？"
 podintroductions.1.a: "在我的统治下，法兰西会更好……"
 podintroductions.2.t: "无聊的英格兰神王"
 podintroductions.2.desc: "$TAB$不列颠尼亚的吸血鬼历史与梵卓的[GetScriptedCharacterByHistoryID('505071').GetFirstName]密不可分。先是波斯神，后是罗马神，在基督教驱逐这位[GetTrait('vampgeneration4').GetName(GetNullCharacter)]血族之前，他的密教几乎遍及整个欧洲。\n$TAB$带着他的狂热分子撤往英格兰的土地后，他迅速积聚了力量……并渐渐厌倦了这个地方的渺小。因为经常性地陷入[Glossary('蛰眠','game_concept_torpor_desc')]中，诺曼人的入侵摧毁了他的权力宝座，迫使他苏醒以恢复秩序。\n$TAB$150年后，密特拉再一次对英格兰漠不关心，他的许多臣民，像[GetScriptedCharacterByHistoryID('790222').GetFirstName]和[GetScriptedCharacterByHistoryID('790103').GetFirstName]，已经获得了事实上的独立，并筹划着他的灭亡。更糟糕的是，威尔士和苏格兰仍然支持着属于北欧血族和德鲁伊教的古老团体。\n$TAB$没有人能真正地说出密特拉是否能再次粉碎这个新的反对派，或者只是让它在他的鼻子底下溃烂，直到为时已晚。"
 podintroductions.2.a: "神王万岁……目前来说。"
 podintroductions.3.t: "众王与巫士之地"
 podintroductions.3.desc: "$TAB$作为梵卓$pod_clan$无可争议的核心，德意志牢牢地掌握在[GetScriptedCharacterByHistoryID('505050').GetFirstName]手中。\n$TAB$然而，即使是他的统治也不是没有受到挑战，比如德意志西部的[GetScriptedCharacterByHistoryID('505096').GetFirstName]和勃兰登堡的难以捉摸的[GetScriptedCharacterByHistoryID('505110').GetFirstName]这样的伪装者。\n$TAB$在南面，篡位者[GetTrait('tremere').GetName(GetNullCharacter)]$pod_clan$正处境危险，东欧恶毒的[GetTrait('tzimisce').GetName(GetNullCharacter)]$pod_clan$正在迅速逼近他们的据点。他们与强大的梵卓的防御协议也许是他们唯一的生命线。\n$TAB$法兰西流亡的亲王，巴黎的[GetScriptedCharacterByHistoryID('505082').GetFirstName]就在附近，有着伟力归于自身的强大力量的吸血鬼，尽管他在政治上是孤立的。\n$TAB$哈德施塔特必须迅速行动，抑制住他子嗣[GetScriptedCharacterByHistoryID('505086').GetFirstName]的野心，摧毁茱莉亚和伊尔斯的势力基地，并在有或没有睿魔尔的帮助下确保他的东部阵线。\n$TAB$德意志将成为[GetTrait('ventrue').GetName(GetNullCharacter)]$pod_clan$王冠上的明珠，或者化为灰烬。"
 podintroductions.3.a: "罗马已是过眼云烟，未来在这里。"
 podintroductions.4.t: "暗影再征服"
 podintroductions.4.desc: "$TAB$伊比利亚是勒森魃$pod_clan$传统的权力中心，但凡人的收复失地运动使贤士们陷入了一场痛苦的内战。\n$TAB$北部，[GetScriptedCharacterByHistoryID('505126').GetFirstName]领导着信奉基督教的正统勒森魃$pod_clan$，有着统治整个伊比利亚的明确野心。不过，他必须注意他那些野心勃勃的封臣们，比如[GetScriptedCharacterByHistoryID('505154').GetFirstName]或[GetScriptedCharacterByHistoryID('790178').GetFirstName]。\n$TAB$南部，经过几十年的内讧，自称为[Glossary('阿什拉派','game_concept_ashirra_desc')]的穆斯林勒森魃，发觉安达卢西亚的[GetScriptedCharacterByHistoryID('505125').GetFirstName]是一位值得尊敬的苏丹。\n$TAB$在其他地方的新老[Glossary('亲王','game_concept_prince_desc')]，从帝王般的[GetTrait('ventrue').GetName(GetNullCharacter)]到野性的[GetTrait('gangrel').GetName(GetNullCharacter)]，都注意到这些贤士们的弱点，并等待合适的时机出手。\n$TAB$这再征服可能是伊比利亚[GetTrait('lasombra').GetName(GetNullCharacter)]之治的最后一丝气息。"
 podintroductions.4.a: "只要给我一些时间，伊比利亚将再度统一。"
 podintroductions.5.t: "诸神黄昏"
 podintroductions.5.desc: "$TAB$北欧人的信仰早已从凡人的脑海中消失，但对斯堪的那维亚的吸血鬼仍然存在。它的拥护者，勇猛的[Glossary('英灵战士','game_concept_einherjar_desc')]还坚持自己的信念……但是希望正在迅速消退。\n$TAB$“崇高之主”[GetScriptedCharacterByHistoryID('505088').GetFirstName]和女武神的首领[GetScriptedCharacterByHistoryID('790119').GetFirstName]陷入了沮丧几近$pod_torpor$。不过，有些人仍在继续战斗，例如[GetScriptedCharacterByHistoryID('790270').GetFirstName]和[GetScriptedCharacterByHistoryID('790265').GetFirstNameNicknamed]，他们试图摧毁[GetScriptedCharacterByHistoryID('505050').GetFirstNamePossessive]率领的入侵的基督教吸血鬼。\n$TAB$使[Glossary('英灵战士','game_concept_einherjar_desc')]感到乐观的一线希望是，新来者很难团结一致，彼此争吵，最显着的是在丹麦分裂为了三大觊觎者。\n$TAB$在北部的荒原上，一群冷酷无情的[GetFaithByKey('viafurores').GetAdherentNamePlural]称自己为[GetTitleByKey('d_bar_sinister').GetBaseName]，他们在这片贫瘠的土地上建立了一个让人质疑的宣称。\n$TAB$无论他们是新的盟友还是敌人，北欧人的最后一场战役已经临近，十字似乎再次成为人们的最爱……"
 podintroductions.5.a: "斯堪的纳维亚将与过去不再一样。"
 podintroductions.6.t: "帝国的安魂曲"
 podintroductions.6.desc: "$TAB$如果说中世纪的意大利是一个分裂的国家，那么黑夜的意大利就是一个火药桶。强大的老吸血鬼们争夺着欧洲人口最多的城市。\n$TAB$在意大利北部，[GetTrait('ventrue').GetName(GetNullCharacter)]“枢机”[GetScriptedCharacterByHistoryID('790203').GetFirstName]在米兰坐镇，牢牢掌握着意大利教廷的大权。\n$TAB$在威尼斯，[GetTrait('cappadocian').GetName(GetNullCharacter)]$pod_clan$的[GetTrait('giovanni').GetName(GetNullCharacter)]后裔是一位横跨海洋的贸易帝国的主人，时间会告诉我们他们的关注点是在意大利本土还是在东方，就像他们的父辈$pod_clan$一样。\n$TAB$在西西里岛，[GetTrait('lasombra').GetName(GetNullCharacter)]$pod_clan$的首都由忠诚的[GetScriptedCharacterByHistoryID('505070').GetFirstName]守卫着，但是过度扩张和西班牙的内战使这片暗影之海变得脆弱。\n$TAB$最后，所有的目光都聚焦在罗马，#ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('790101').GetID] #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('790101').GetID] #L 提图斯·梵卓鲁·卡米拉#!#!#!最近在这里苏醒。这位永恒的执政官是罗马帝国和迦太基灭亡的幕后主谋，他开创了一个[GetTrait('ventrue').GetName(GetNullCharacter)]领导的新时代。\n$TAB$当其他小领袖和永生的国王在意大利其他地方崛起时，亲王们的战争从来没有像这里这样危险过。"
 podintroductions.6.a: "条条大道通罗马。"
 podintroductions.7.t: "无路可退"
 podintroductions.7.desc: "$TAB$十字军邦联摇摇欲坠地立于黎凡特，一个更危险的吸血鬼联邦在他们中间崛起。\n$TAB$橄榄会议是该地区各城市[Glossary('亲王','game_concept_prince_desc')]们之间的协约，由幸存者[GetScriptedCharacterByHistoryID('790236').GetFirstName]领导。“母狮”是一位[GetTrait('salubri').GetName(GetNullCharacter)]，自其始祖[GetScriptedCharacterByHistoryID('505008').GetFirstName]死于新近崛起的[GetTrait('tremere').GetName(GetNullCharacter)]$pod_clan$之手后，该Einherjar就在西欧几乎灭绝。虚弱$pod_clan$的大多数成员已经躲藏起来，但卡维娅仍打算坚持立场。\n$TAB$尽管如此，她那不稳定的联盟已经处于危险之中，因为强大的大马士革正字面意思上的陷入疯狂坑堑。[GetScriptedCharacterByHistoryID('790125').GetFirstName]，那位古老的[GetTrait('toreador').GetName(GetNullCharacter)]苏丹已经把他的灵魂卖给了未知的力量，只有他的子嗣和一位孤独的#TOOLTIP:GAME_TRAIT,assamite,[GetNullCharacter] #L 阿刹迈#!#!战士还伫立面对注定要发生的灾难。\n$TAB$此协约将是一个垂死$pod_clan$的最后一场欢呼，还是通往光明未来的希望？"
 podintroductions.7.a: "耶路撒冷是奇迹之城，毕竟……"
 podintroductions.8.t: "面纱之后"
 podintroductions.8.desc: "$TAB$阿拉伯是[Glossary('阿什拉派','game_concept_ashirra_desc')]活动的所在地，穆斯林吸血鬼通过共同的信仰超越[Glossary('阿什拉派','game_concept_ashirra_desc')]团结在一起。他们在半岛上的地位很稳固，但是耶路撒冷被十字军夺去，埃及被#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 古蛇#!#!夺去，这使他们与马格里布和安达卢西亚的兄弟们断绝了关系。\n$TAB$更糟糕的是，美索不达米亚已经再次落入崇魔者[GetTrait('baali').GetName(GetNullCharacter)]之手，由内尔伽勒派的[GetScriptedCharacterByHistoryID('790146').GetFirstName]领导。他的目标是占领该地区的大城市，大马士革，巴格达和推罗，获取足够献祭的人口，来为他邪恶的主人的回归。\n$TAB$具有讽刺意味的是，他最强的对手是另一位[GetTrait('baali').GetName(GetNullCharacter)]——推罗的[GetScriptedCharacterByHistoryID('505095').GetFirstName]——源自摩洛教团分支。这种对抗使重新崛起的巴力陷入了内战，并给穆斯林信徒带来了他们可以被制止的希望。\n$TAB$否则……整个世界都将处于危险之中。"
 podintroductions.8.a: "文明的摇篮也可能是它的临终之床。"
 podintroductions.9.t: "斗篷与弯刀"
 podintroductions.9.desc: "$TAB$波斯是#TOOLTIP:GAME_TRAIT,assamite,[GetNullCharacter] #L 阿刹迈#!#!$pod_clan$的所在地，这是一个外人眼中的神秘团体。\n$TAB$在新加冕的、极具争议的最长者[GetScriptedCharacterByHistoryID('790530').GetFirstName]的统治下，他们表面上的团结正在出现裂痕，因为不同的派系开始发挥他们的权力。\n$TAB$刀锋之网的[GetScriptedCharacterByHistoryID('790164').GetFirstName]想让他的$pod_clan$成为一个狂热的刺客密教，准备为他的黑暗之主归来准备一支军队。\n$TAB$术士们的[GetScriptedCharacterByHistoryID('790166').GetFirstName]正走在一条温和的道路上，他将阿刹迈视为判官和外交官。\n$TAB$最后，战士们的[GetScriptedCharacterByHistoryID('605110').GetFirstName]是一位虔诚的穆斯林，他乐于与麦地那的[Glossary('阿什拉派','game_concept_ashirra_desc')]阿拉伯人恢复友好关系。\n$TAB$这一政治动荡促进了该地区另一个群体的发展，即[GetScriptedCharacterByHistoryID('790219').GetFirstName]的失落部族，一个崇拜二代吸血鬼的异端。分裂和低效使阿刹迈$pod_clan$陷入瘫痪，\n$TAB$他们是会找到一个新的共同目标，还是会爆发内战？"
 podintroductions.9.a: "我将通过外交或其他手段一统波斯。"
 podintroductions.11.t: "永恒之战"
 podintroductions.11.desc: "$TAB$从一开始，印度就一直是[GetTrait('ravnos').GetName(GetNullCharacter)]$pod_clan$与[Glossary('阿什拉派','game_concept_ashirra_desc')]或[GetTrait('kueijin').GetName(GetScriptedCharacterByHistoryID('791112').Self)]——一群神秘的亚洲“吸血鬼”——之间的战争舞台。\n$TAB$没有胜利者，双方战斗人员都处于崩溃的边缘，各派都在计谋推翻现任领导人。\n$TAB$在西部，[GetScriptedCharacterByHistoryID('790190').GetFirstName]正集结雷伏诺进行另一场战斗。而在东方，[GetScriptedCharacterByHistoryID('791126').GetFirstName]带领着小龙们发起另一个冲锋。\n$TAB$而其他势力，从#ONCLICK:FAITH,[GetFaithByKey('pathofdaena').GetID] #TOOLTIP:FAITH,pathofdaena #L 达埃纳#!#!#![GetTrait('tzimisce').GetName(GetNullCharacter)]的[GetScriptedCharacterByHistoryID('605123').GetFirstName]，都在不停息的风暴中寻找机会。\n$TAB$最终会浮现出赢家吗？"
 podintroductions.11.a: "很显然，我是印度和平的唯一希望。"
 podintroductions.12.t: "不断堕落"
 podintroductions.12.desc: "$TAB$虽然迦太基在几个世纪前就被烧毁了，但在马格里布仍能感受到迦太基的陷落\n$TAB$。该地区自此被不同的[Glossary('阿什拉派','game_concept_ashirra_desc')]——穆斯林吸血鬼——苏丹瓜分，但他们中没有一个真正成功地巩固了该地区。\n$TAB$两位最好的人选是[GetScriptedCharacterByHistoryID('605132').GetFirstName]和[GetScriptedCharacterByHistoryID('605131').GetFirstName]。索福尼巴是突尼斯的老领导人，她仍然记得在迦太基时期她的城市的陷落。阿尔及尔的扎姆拉·马图布则是位年轻的富有野心的[GetTrait('lasombra').GetName(GetNullCharacter)]。\n$TAB$#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!在这里也有立足之地，就像[GetTrait('tremere').GetName(GetNullCharacter)]$pod_clan$一样。\n$TAB$马格里布有着分裂的权力和丰富的历史，对于任何爱冒险的[Glossary('亲王','game_concept_prince_desc')]或苏丹来说，马格里布都是诱人的奖赏。"
 podintroductions.12.a: "我们需要抛后迦太基。"
 podintroductions.13.t: "金字塔的阴影之中"
 podintroductions.13.desc: "$TAB$埃及已经忍受了许多外来的征服者，而它的本地不死族若没有耐心和韧性就什么都不是。\n$TAB$真正的权力在吉萨，[GetTrait('setite').GetName(GetNullCharacter)]的心腹。自由$pod_clan$——或者腐败$pod_clan$——取决于你问谁——正准备让自己的力量从十字军东征所创造的权力真空中获利。\n$TAB$毫无疑问，他们的第一个目标将是开罗。由强大的[GetTrait('vampgeneration5').GetName(GetNullCharacter)]梵卓[GetScriptedCharacterByHistoryID('710202').GetFirstName]领导，这座城市不会轻易陷落，如果公开宣战，它可以挫败蛇们。\n$TAB$每个人都确信赛特信徒将很快采取他们的第一步行动，但是没有人能说准是什么时候，如果他们这样做了，他们将会被阻止……"
 podintroductions.13.a: "埃及和我们一样都是永生的。"
 podintroductions.14.t: "二元之地"
 podintroductions.14.desc: "$TAB$非洲本土的吸血鬼是[GetFaithByKey('laibon').GetAdjective]，一个松散的多血系的联合和自我创造的吸血怪物们。他们掌握着大陆上大部分的真正权力，但必须与众多在他们的土地上寻求名声和财富的冒险家或小军阀竞争。\n$TAB$更糟糕的是，非洲还是一些真正古老的生物的家园，从它是人类摇篮的时候起就一直在那里。\n$TAB$随着同穆斯林[Glossary('阿什拉派','game_concept_ashirra_desc')]与世界开放的各种新道路，莱本是否能够在变化的时代适应和昌盛还有待观察。"
 podintroductions.14.a: "机遇与危险并存。"
 podintroductions.15.t: "伤虎之局"
 podintroductions.15.desc: "$TAB$西藏历来是[Glossary('鬼人','game_concept_kuei_jin_desc')]','game_concept_kuei_jin_desc')]白虎皇朝的领地，更是亚洲饿殍传说中的起源之地——须弥山所在。\n$TAB$范女皇在位时统治松散却稳固，其突然退隐导致继任者达试图集权，皇朝因而分崩离析。\n$TAB$如今皇朝分裂为达的忠诚派、范的支持派与喜马拉雅隐修派，诸多小势力亦趁乱争夺这片纷争之地。\n$TAB$白虎皇朝会否浴火重生？抑或西藏将迎来新主？"
 podintroductions.15.a: "时代终章？"
 podintroductions.16.t: "东方惊雷"
 podintroductions.16.desc: "$TAB$大草原不适合吸血鬼居住。很少有城市来隐藏，很少有国家要操纵和屈从于他们的意志。\n$TAB$但是，从东方来了一种新的吸血鬼，这种吸血鬼生活在无边无际的平原上，与游牧的蒙古人生活在一起。这些[GetDynastyHouseByID('house_anda').GetName]——[GetTrait('gangrel').GetName(GetNullCharacter)]分支之一——是骄傲的战士，跟随大规模扩张的蒙古帝国征战。\n$TAB$与已经存在的西方[GetTrait('gangrel').GetName(GetNullCharacter)]的冲突似乎是不可避免的，而且，当这些新来者到来时与欧洲[Glossary('该隐之子','game_concept_cainite_desc')]的紧张关系也在所难免。\n$TAB$对于吸血鬼来说，变化是很罕见的，但当它与雷鸣般的大批游牧骑马弓箭手一同出现时，变化可能是他们中许多人经历的最后一件事……"
 podintroductions.16.a: "改变并不总是受欢迎……"
 podintroductions.17.t: "入此者……"
 podintroductions.17.desc: "$TAB$东欧是[GetTrait('tzimisce').GetName(GetNullCharacter)]$pod_clan$的传统领地，但最近他们的霸权受到了由德意志和匈牙利[GetTrait('ventrue').GetName(GetNullCharacter)]$pod_clan$支持的[GetTrait('tremere').GetName(GetNullCharacter)]$pod_clan$的崛起的挑战。\n$TAB$最近的战争以一项痛苦的和平条约结束了，条约的双方是军督之督[GetScriptedCharacterByHistoryID('505053').GetFirstName]，和梵卓的十字军战士[GetScriptedCharacterByHistoryID('505086').GetFirstName]。缓冲国奥伯图斯教团已经建立，由和平调解人[GetScriptedCharacterByHistoryID('790114').GetFirstName]领导。\n$TAB$现在，每个人都在舔着自己的伤口，罗斯托维奇试图确保他对$pod_clan$的控制，而匈牙利的梵卓则试图在他们的首领[GetScriptedCharacterByHistoryID('505052').GetFirstName]的[Glossary('蛰眠','game_concept_torpor_desc')]下来解决继承危机。\n$TAB$最后，[GetScriptedCharacterByHistoryID('505084').GetFirstName]代替[GetScriptedCharacterByHistoryID('505022').GetFirstNamePossessive]领导篡位者，展现出对抗魔物的统一的金字塔的正面形象。\n$TAB$每个人都知道在这个地区，战争是不可避免的，除非有位吸血鬼有足够的力量来一劳永得地摧毁他的对手。会是谁呢？"
 podintroductions.17.a: "一块待驯服的土地。"
 podintroductions.18.t: "褪色幻梦"
 podintroductions.18.desc: "$TAB$君士坦丁堡的灰烬还在燃烧，秃鹫已经在它的尸体上盘旋。[GetScriptedCharacterByHistoryID('505051').GetFirstNamePossessive]的幻梦，一个自迦太基以来再未出现过的吸血鬼乌托邦，和它的创造者一起陨落，而一些军阀和帝国的残余试图生存下来。\n$TAB$其中最重要的是[GetScriptedCharacterByHistoryID('505098').GetFirstName]，他是第四次十字军东征的煽动者之一，现在控制着君士坦丁堡。雄心勃勃的[GetTrait('lasombra').GetName(GetNullCharacter)]仍然在向西西里岛的$pod_clan$首领臣服，但能持续多久呢？\n$TAB$再往西，[GetTrait('brujah').GetName(GetNullCharacter)]的[GetScriptedCharacterByHistoryID('790104').GetFirstName]是最后一个仍然活跃的真正的幻梦信徒之一，她希望自己能继承“天使长”[GetScriptedCharacterByHistoryID('505051').GetFirstName]的衣钵。\n$TAB$[GetScriptedCharacterByHistoryID('790004').GetFirstName]则没有这样的雄心壮志，利用尼西亚最终得到了在她还活着时就应该属于她的帝国。\n$TAB$就像其他雄心勃勃的[Glossary('亲王','game_concept_prince_desc')]在旧城的废墟上建立领地一样，君士坦丁堡可能会重生……也可能永远消亡。"
 podintroductions.18.a: "米迦勒是否已经预见到这场混乱？"
 podintroductions.19.t: "祖母，祖母……"
 podintroductions.19.desc: "$TAB$在所有人的记忆中，俄罗斯是存在的最强大的血族之一[GetScriptedCharacterByHistoryID('505075').GetFirstName]的家园。这位第四代[GetTrait('nosferatu').GetName(GetNullCharacter)]，传说是$pod_clan$的真正始祖，是这片土地的重要组成部分，并利用它来保护自己不受她复仇的[Glossary('尊长','game_concept_Sire_desc')]的伤害。\n$TAB$这个地区的人来说幸运的是，女巫在[Glossary('蛰眠','game_concept_torpor_desc')]。但她的影幕的影响仍然可以被感觉到，其由她忠实的二号人物[GetScriptedCharacterByHistoryID('790483').GetFirstName]所培育。\n$TAB$在这样的条件下，俄罗斯只有三种类型的吸血鬼：“祖母”的附庸，勇敢者，和即将死去的吸血鬼。而后两类常常相互重叠。"
 podintroductions.19.a: "小心那位小女孩……"
 podintroductions.20.t: "旧世界的新命运"
 podintroductions.20.desc: "$TAB$传统上，波兰是[GetTrait('tzimisce').GetName(GetNullCharacter)]军督领的边疆，是更……古怪魔物的家园，现在它正逐渐形成专属的、独立的实体。军督们摇摇欲坠的权威，以及他们完全的脱离时代，让新一代的吸血鬼得以立足并繁荣起来。\n$TAB$首先是虔诚的[GetTrait('brujah').GetName(GetNullCharacter)][GetScriptedCharacterByHistoryID('790246').GetFirstName]，他在克拉科夫周围聚集追随者，驱逐曾经的[Glossary('亲王','game_concept_prince_desc')][GetScriptedCharacterByHistoryID('790937').GetFirstName]。这可能是使波兰摆脱棘秘魑影响的第一步。\n$TAB$但更大的挑战还在等着我们，最引人注目的是要驱逐那个绝对令人厌恶的人，那就是[GetScriptedCharacterByHistoryID('605111').GetFirstName]，一个甚至会被同族认为过于极端的棘秘魑……"
 podintroductions.20.a: "我必须留意这变革之风，否则就会被它摧毁。"
 podintroductions.21.t: "自由之地"
 podintroductions.21.desc: "$TAB$远离西欧暴君的残暴统治，波罗的海地区是两种新型吸血鬼派系结构的发源地。\n$TAB$在立陶宛，[GetTrait('gangrel').GetName(GetNullCharacter)]的[GetScriptedCharacterByHistoryID('790105').GetFirstName]已经团结了一大批自由意志的原始教徒，他打算将其打造为阻挡基督教和梵卓势力东扩的屏障。\n$TAB$在更远的北方，[GetScriptedCharacterByHistoryID('790120').GetFirstNameNicknamed]领导着一个[Glossary('英灵战士','game_concept_einherjar_desc')]自由邦，也许是最后一个这样的地方了，因为斯堪的纳维亚正在被[GetScriptedCharacterByHistoryID('505050').GetFirstNamePossessive]的下仆们所控制。\n$TAB$这两项实验都面临着巨大的冒险，无论是内部的还是外部的，而且主要依赖于他们领导人的超凡魅力。即使他们的勇气和信念对于即将到来的[GetTrait('ventrue').GetName(GetNullCharacter)]的猛攻是徒劳的。"
 podintroductions.21.a: "一位老不死的残余可没那么容易灰飞烟灭。"
 podintroductions.2001.t: "欢迎来到黑暗亲王"
 podintroductions.2001.desc: "$POD_generic_introduction$"
 podintroductions.2001.a: "让我们来谈谈吸血鬼的主要机制……"
 podintroductions.2001.b: "……或者其他概念"
 podintroductions.2001.c: "世界观和故事背景"
 podintroductions.2001.d: "我这样就行，直接开始吧！"
 podintroductions.2001.e: "抹去我的超自然特质，并进入背景生成器"
 podintroductions.2003.t: "吸血鬼101问"
 podintroductions.2003.desc: "首先要注意的是，作为一位$POD_splat_vampire$，你是永生的……某种程度上。你不会死于年老或疾病，但被处以火刑或斩首仍然会结束你的亡生。因此，继承是一个较小的，但仍然需要一点关注的地方。同样的道理，婚姻不能使你生儿育女，所以婚姻大多是少数宗教可用的政治工具。\n宗教是玩法的核心部分，甚至比在CK3本体里的更重要。在这里，它代表了你的角色的核心哲学原则，帮助他不沦落为兽。事实上，心兽——你内在的怪物的真实表现——是你最坏的敌人之一，因此管理你的压力极度重要，使你不成为它的猎物，这意味着你的角色变成了一位野生尸妖，导致他不可扮演。\n注意你的饥渴，这代表着你对血液需求的核心修正。饥渴被用于许多计谋和能力，并会由缓慢的自动补充或通过积极猎食来手动补充。"
 podintroductions.2003.a: "一些进阶概念"
 podintroductions.2004.t: "如何才能不烛化为烬"
 podintroductions.2004.desc: "吸血鬼学习新事物很慢。因此，你仍然可以使用基础生活方式，但会有更低的升级速度。但是，你可以选择把你的时间投入到[Glossary('血律','game_concept_discipline_desc')]中，开放诅咒的力量供你使用。\n建筑代表了你对芸芸众生的影响。大多数都有不同的属性增减，你必须策划如何平衡它们。值得注意的是，以高度发展的公国首都为例的主要人口中心是任何一位亲王都能梦想到的最大资产。\n战争被明显地改变了，更大地强调了骑士。你的骑士的勇武能力使其可以轻易地战胜更多的敌人，特别是当大部分都是征召兵的时候。因此，要小心那些高勇武能力的敌对吸血鬼。\n在一个充满欺骗和诡计的世界里，谋略能力扮演着更重要的角色。有一些新的计谋供你使用，一些和你的能力有关，而且大多数角色都有秘密，你可以不说出它们……又或者在宗教允许的情况下用来勒索。"
 podintroductions.2004.a: "回到初始选项"
 podintroductions.2005.t: "迄今为止的过往……"
 podintroductions.2005.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n《黑暗世界》的吸血鬼主要来源于圣经中对该隐（第一个谋杀犯）的诅咒，他们中的大多数都可以追溯世系到他的身上，这一体系被称之为“世代”。这棵不死族宗族之树已经分裂成数个派系和氏族，每个派系都有自己的力量、弱点和地缘权力基础。\n在你正在玩的《黑暗时代：吸血鬼》中，我们正在几个重大危机的十字路口演绎不死族的世界。君士坦丁堡之劫已经发生，并摧毁了当时主要的$pod_cainite$帝国，其涟漪效应远及法兰西和波斯。与此同时，教廷的裁判所正在获取支持和信息，几乎准备好开启一个惩罚被诅咒的吸血怪物的时代……"
 podintroductions.2102.t: "欢迎来到黑暗裁判官"
 podintroductions.2102.desc: "$POD_generic_introduction$"
 podintroductions.2102.a: "让我们来谈谈裁判官的主要机制……"
 podintroductions.2102.b: "……或修士会的特殊能力"
 podintroductions.2102.c: "关于裁判所的资料"
 podintroductions.2102.d: "我这样就行，直接开始吧！"
 podintroductions.2103.t: "启明"
 podintroductions.2103.desc: "1230年，裁判所才刚刚建立。你们的敌人，吸血鬼，在数量和武器上都比你们强。他们有强大的阴谋能力，并可以使用骑士轻易破坏你的大部分军队，特别是你的征召兵。\n你有一些优势，其中之一是你强大的建筑群和生活方式树。你还有独特的计谋，用以找到怪物的巢穴，在那里你可以对吸血鬼进行一对一的行动。很明显，他们会保护自己……\n准备面对艰苦的一局，你必须耐心等待并好好建立你的力量基础，所有的同时，猎杀你最具威胁性的邻居，直到你足够强大到以收复夜晚。"
 podintroductions.2103.a: "修士会的工具箱"
 podintroductions.2103.c: "关于裁判所的资料"
 podintroductions.2104.c: "关于裁判所的资料"
 podintroductions.2104.t: "光之彩虹"
 podintroductions.2104.desc: "每个修士会都有自己的方式来确保继承人。圣雅各伯之剑，亚柯骑士和红修会可以与年轻的凡人进行[character_interaction|E]，使他们成为自己的侍从或游戏所判定的“孩子”。圣约翰修女会和圣贞德修会也可以这样做，但只能收年轻女性。\n冯·穆尔瑙家族就像原版的家族一样，但每个冯·穆尔瑙家族的人在他或她的一生中都有机会成为一名裁判官。最后，神目既可以授任新成员，也可以组建家庭，但除非有授任，否则他们的家庭不会自然而然的成为裁判官。"
 podintroductions.2104.a: "回到初始选项"
 podintroductions.2105.t: "迄今为止的过往……"
 podintroductions.2105.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在玩《黑暗时代：裁判官》，它讲述了一群被驱使的凡人如何真正改变世界的故事。他们是第一群真正看清吸血鬼[the_masquerade|E]真相的人，并在教廷的支持下开始了暗影裁判。\n摆在他们面前的任务是艰巨的，而在1230年，他们仅仅触及了他们偶然发现的世界的表面。怀着不死的信念，他们勇敢地迈出了对抗地狱衍体的第一步……\n这些新人裁判官并不知道，他们的勇气和动力将为吸血鬼开启一个持续数个世纪的痛苦与火焰的时代。"
 podintroductions.22.t: "在白十字之下"
 podintroductions.22.desc: "这里是亚柯骑士诞生的地方。26年前，戈捷·德·丹皮尔在君士坦丁堡的熊熊烈火中与被称为吸血鬼的怪物战斗。他感应到了天主的召唤，因此拿起剑对抗这些真正的敌人。\n从那以后，戈捷带领着来自他位于塞浦路斯的要塞的暗影裁判所的军事力量发挥着重要作用，但时不我待。年老的戈捷知道他有生之年大概率看不到替天主重夺君士坦丁堡的梦想成真。\n因此，戈捷正在为挑选继任者做准备，计划着让下一代的亚柯骑士引领基督徒获得对抗吸血怪物的最终胜利。他们就是天主之剑，保卫人类对抗黑暗中的怪物的最后的守护者们。"
 podintroductions.22.a: "我们将拯救人类，或死于尝试"
 podintroductions.23.t: "清洁派之影"
 podintroductions.23.desc: "罗马教廷第一次明白吸血鬼的威胁时是在对抗清洁派教徒的阿尔比十字军时期。那时，他们发现法兰西南部的可怜人，大多数时候，都是被这些受诅咒的生物给误导了。\n冕下在那时候对法兰西表现出特别的兴趣并不值得奇怪，那时候的法兰西很明显是吸血鬼感染的高发地。裁判所的行动由图卢兹的艾格尼恩领导，他是一个神秘的人，著名的罗德里格·德·纳瓦拉昔日的友人。作为一个崛起中的间谍网络——神目——的大师，艾格尼恩谋划深远，清楚地知道法兰西的情况远比罗马认为的还要糟糕。走错任何一步他都将万劫不复……"
 podintroductions.23.a: "要狂热，但也要耐心和狡猾"
 podintroductions.24.t: "太阳对十字"
 podintroductions.24.desc: "英格兰对于罗马教廷来说一直是一片令人费解的土地。长期坚持着古老的宗教活动，和巫术甚至其他更糟糕的东西有关的谣言时不时地出现，这座岛屿从来没有被真正地驯服。\n修女玛利亚，圣约翰修女会的领袖，是众多试图理解侵蚀着这片土地的腐化的根源的裁判官之一。修女们出现的幻觉中描述了一位被称为“密特拉”的实体，他宣称自己是一位神灵，每当太阳落山后就会出现。\n有着这样清晰可见的目标，再以她们长久的热情为武器，修女们准备好在一场她们才刚开始理解了一小部分的战斗中领导裁判所。"
 podintroductions.24.a: "独一真神"
 podintroductions.25.t: "贵族狂热"
 podintroductions.25.desc: "冯·穆尔瑙，一个被天主诅咒——或祝福——的德意志贵族家族，因为他们能够字面意思上的闻到邪恶的气味。这一特征，再加上他们在巴伐利亚的据点，使他们成为暗影裁判所无价的伙伴。\n他们的参与由利奥波德·冯·穆尔瑙协调，此人体弱多病，却有着超凡的智慧和魄力。他实际上是裁判所之建立的幕后谋士和它的非正式领导者。\n在他强有力的领导下，巴伐利亚已经成为世界各地裁判官的希望灯塔，成为一旦邪恶的吸血鬼被净化后尘世会变得如何的承诺。利奥波德还远没有实现这一目标，不过他已经在计划他的下一步了，就是将各裁判所修士会合并成一个新团体……"
 podintroductions.25.a: "挺出对抗黑暗的一家"
 podintroductions.26.t: "族内其首"
 podintroductions.26.desc: "不管暗影裁判所让你怎么想，但实际上罗德里格·德·纳瓦拉才是第一位对抗黑暗的人。这个小贵族参加了阿尔比十字军东征，并发现自己有证据表明有“什么”在那。\n这一发现，以及此后无数次试图让他闭嘴的吸血鬼行动，都对罗德里格的理智造成了影响。如今，这位圣雅各伯骑士团创始人的敌人到处都是，甚至在他的裁判官同僚中也是如此。因此，他没有正式加入暗影裁判所，但勉强接受他们对伊比利亚再征服的支持。\n圣座担心，罗德里格的固执可能会成为一个严重的问题，因为吸血鬼很清楚他的存在，而教廷无法让半岛感受到它的全部力量。"
 podintroductions.26.a: "一位独自面对黑暗的偏执者"
 podintroductions.27.t: "兽之腹"
 podintroductions.27.desc: "圣座本相信意大利不受吸血鬼的腐化。但是，揭露的事实表明枢机主教法布里齐奥·乌尔菲拉实际上一直是地狱衍体，这让教宗冕下极为震惊。\n为了不让民众感到恐慌，他指派了红修会的非正式领导人维特多利亚·圣蒂尼·迪·帕尔马对这一近在咫尺的威胁进行评估。\n有着藏书丰富的修会图书馆供她使用，维特多利亚已经有了一些非常惊人的发现。吸血怪物在意大利随处可见，甚至在夜幕降临时在圣城游行。\n然而强大的力量已将她的小猎群团团包围，如果她不小心，她的调查甚至可能在开始之前就结束……"
 podintroductions.27.a: "基督教的核心受到威胁"
 podintroductions.101.t: "你的故事就此展开"
 podintroductions.101.desc: "虎落平阳被犬欺，海伦，也就是现在的您，世界上最美丽的女人，沦落到在一个遥远的小岛上与您的死敌搏斗。很久以前，人们崇拜着您，人们为了看您一眼而浴血拼杀。墨涅拉俄斯偷走了您的一切。\n固执的斯巴达国王无法接受您在布匿战争中站在罗马一边的事实，并从那以后一直在追杀您。他摧毁了您深爱的庞培以及无数您喜爱的仆从和子嗣。现在，您身边只有您的宝贝帕里斯……但您已经厌倦了逃避。\n是时候结束这千年的恩怨了，迈锡尼的女儿。摧毁墨涅拉俄斯和他愚蠢的乌托邦梦想！\n到那时，也只有到那时，未来才会再次变得光明。"
 podintroductions.101.a: "现在该结束了"
 podintroductions.helena: "一旦墨涅拉俄斯死了，你就可以获得一项专属决议"
 podintroductions.102.t: "你的故事就此展开"
 podintroductions.102.desc: "阿布萨隆大人，丹麦之父，您对受诅的波罗的海睿魔尔的长征使您的领地向冒牌者和冒险者敞开了大门。他们必须被解决，因为您是丹麦唯一需要的统治者。\n在粉碎这些笨蛋的同时，您可能想要了解更多关于您在旅途中于鲁加发现的奇怪仪式。您还在想这些信徒想干什么，让他们的神复活吗？显然这是用于阻止您的最后一招，但……\n如果您能成功地驾驭自己身上的神灵“斯凡特维德”的力量……您将势不可挡！\n是时候让您重新征服丹麦并开始您的化神飞升了，阿布萨隆大人。这显然是您真正的命运。"
 podintroductions.102.a: "首先丹麦，随后……"
 podintroductions.absalon: "你可以投资一项专属决议来逐步破解斯凡特维德的仪式"
 podintroductions.103.t: "你的故事就此展开"
 podintroductions.103.desc: "强大的密特拉，您在英格兰的回归是一个巨大的成功，入侵的诺曼吸血鬼终于被解决了。然而，仍然有一些问题需要解决，各种不法之徒和独立亲王正在挑战您的统治。\n然而，真正的问题在别处，因为您已经能感觉到年长之倦在您的灵魂中蔓延。您也很了解如果您再睡的话您的摄政们一定会把事情搞砸的。\n然而最近，您在您的血中感觉到您的旧爱，赛特之子的刻茉媞里，再次苏醒了。也许您可以把她叫来，和她重归于好？她在您的宫廷里一直是一个纷争人物，您的附庸们可能不会欢迎她的归来……但谁在乎他们的意见呢？"
 podintroductions.103.a: "回到我身边来吧，伊西斯的至爱"
 podintroductions.mithras: "你派人去找刻茉媞里，这花费许多，并可能会激怒你的封臣"
 podintroductions.103.b: "和你的前任复合从来都不是一个好主意"
 podintroductions.mithrasb: "你忘了整个事"
 podintroductions.104.t: "你的故事就此展开"
 podintroductions.104.desc: "军督罗斯托维奇，您的统治陷入了危机。尽管您击败了约根和他的梵卓，但您还是被血族突然的背后捅了一刀，被迫签署了无条件和平协议。您的封臣们对此并不满意。\n“太年轻！太西方！无能粉碎睿魔尔！”他们说。这些蠢货，只能勉强守住他们可怜的城堡，对战争和统治一无所知。尽管如此，您还是需要它们。\n您必须回到您的“战争审判”的策略，与您自己的封臣进行小规模的战争以遏制他们的野心。他们会再次学会尊重您。"
 podintroductions.104.a: "让魔物飨宴开始吧"
 podintroductions.vlad: "作为罗斯托维奇，你得到了针对你的直属封臣的专属[character_interaction|E]"
 podintroductions.105.t: "你的故事就此展开"
 podintroductions.105.desc: "埃特里乌斯大人，您的对手格拉崔克斯被流放到了法兰西，使您成为了睿魔尔的宠臣和家族领袖。尽管如此，您还是要面对$pod_clan$内外的威胁。您东方的棘秘魑军督领是一个永远存在的问题，但您也必须确保没有其他魔法师试图篡夺您的合法位置。\n作为创始人的得力助手，您有很多工具来确保这种情况不会发生。一定要明智地使用它们，为睿魔尔家族带来荣耀！……当然，也为了您自己。"
 podintroductions.105.a: "金字塔由我指令"
 podintroductions.etrius: "作为埃特里乌斯，你得到了针对你的直属睿魔尔封臣的专属[character_interaction|E]"
 podintroductions.106.t: "你的故事就此展开"
 podintroductions.106.desc: "令人畏惧的玛瑟逊莎，您刚刚醒来来到了这个陌生的新世界，远离了您深爱的匈人的光辉岁月。尽管如此，还是有一些新的草原骑士需要帮助，一些新的“文明”需要摧毁！\n但您一个人做不到这，冈格罗$pod_clan$已经忘记您了。因此，您必须依靠您自己的后嗣。森德拉克已经在那里了，但宰亚特已经皈依了一种奇怪的新宗教，而且是您无法触及的……但沃罗西乌斯，大概是三者中最强大的一位，倒是很有机会争取。\n您可以召唤他，尽管考虑到距离，这将花费您大量的能量。或者您可以把他忘了。"
 podintroductions.106.a: "让我们再一起同骑吧，我的子嗣！"
 podintroductions.106.b: "我自己一个人做就行了"
 podintroductions.107.t: "你的故事就此展开"
 podintroductions.107.desc: "无畏的泰贝莎，您已经被最长者亲自送到伊比利亚来了，她给的任务很明确：阻止再征服运动。\n这是极大的荣誉，也是极大的责任，因为您氏族中最受尊敬的成员都认为您能够击退基督教勒森魃之潮。\n您把巴达霍斯作为您的权力中心，尽可能接近前线，但您现在被迫玩一个您不太熟悉的游戏，政治游戏。\n安达卢西亚分裂着，但分裂会导致灭亡。因此，到目前为止，您已经接受了巴德尔对联合的穆斯林$pod_cainites$的冷酷领导，但您担心她的方法在长期来看可能会导致进一步的不团结。\n您不会让您的长者失望，但摆在您面前的任务仍然令人恐惧，而真正的威胁可能比您最初想象的更近……"
 podintroductions.107.a: "我将成为安达卢西亚之盾"
 podintroductions.tabitha: "作为泰贝莎，你有一项限时决议"
 podintroductions.108.t: "你的故事就此展开"
 podintroductions.108.desc: "罗克大人，伊比利亚现在一片混乱。勒森魃的内战可能会吞噬所有人，包括您。如果您想生存下去，您必须时刻有所准备。\n您的狡猾和外交技巧使您赢得了邻居的尊重，即使您是下位氏族之一。很明显，他们仍然鄙视您，如果您表现出软弱，他们会毫不犹豫地粉碎您。记住，他们只有在别无选择的情况下才会接受您作为他们的同伴。\n您也被称作是一位有天赋的，尽管做事很强迫性的，阴谋家，这可能是您在可怕的时期到来时最大的资产。利用好它，您甚至可能成为新伊比利亚最杰出的领导人之一。"
 podintroductions.108.a: "我必须提前计划"
 podintroductions.roque: "作为罗克，你可以投资一个能在完成时给予专属增益的计谋"
 podintroductions.109.t: "你的故事就此展开"
 podintroductions.109.desc: "蒙塔诺大人，暗影之海活在一片狼藉当中。伊比利亚内战，第四次十字军东征的灾难以及卡米拉在罗马的崛起已经使得您所掌控且从您[Glossary('尊长','game_concept_Sire_desc')]那里接过的庞大帝国几乎化为乌有。\n不能再这样下去了，否则会招致$pod_clan$的混乱，因为那些年轻的伪君子已经开始传播关于您作为一个失败领导者的谣言。\n为了恢复您的权威，行动方案很简单。确保西西里和意大利的安全，向勒森魃$pod_clan$展示您们仍然是一支不可忽视的力量。只有到那时，您才会再次受到尊重。"
 podintroductions.109.a: "还有许多事情要做"
 podintroductions.montano: "作为蒙塔诺，你有一项能恢复你摇摇欲坠的权威的专属决议"
 podintroductions.110.t: "你的故事就此展开"
 podintroductions.110.desc: "娜塔莉娅大人，君士坦丁堡在焚烧而您的新乌托邦梦想也随着化为灰烬。以您在希腊的强大地位，您可能是这座世界渴望之城的唯一希望……但是拉丁人已经盘的根深蒂固了。您需要一个计划。\n另一位幸存者安娜·科穆宁是围攻这座城市的完美盟友，但您知道……安娜她冷酷无情，野心勃勃，只在乎权力。\n另一种解决方法是忠于您的理想，并向剩下的米迦勒派寻求帮助。强大的马拉希底斯，米迦勒的选民，能帮上大忙。但他绝不会接受与安娜结盟，所以只能二选一。\n实用主义还是理想主义是摆在您面前的选择。选哪项，帝国独一的统治者？"
 podintroductions.110.a: "实用主义。我需要安娜的军队"
 podintroductions.110.b: "理想主义。马拉希底斯将指引我。"
 podintroductions.natalya: "你将与尼西亚的安娜·科穆宁结盟"
 podintroductions.111.t: "你的故事就此展开"
 podintroductions.111.desc: "睿智的突伽·辛，俄罗斯比任何时候都需要您。您永远的敌人，可怕的芭芭雅嘎，现在还在沉睡，但她的影幕间谍仍然在他们对被诅鬼婆的暴政崇拜下压迫着您的故土。\n您将需要所有可集齐的帮助，来面对这艰巨任务。幸运的是，您被认为是可能是$pod_cainite$世界最伟大的导师，您可以利用这个事实。\n把最棒的人聚集在您的周围，尊敬的导师，并带领他们走向胜利！"
 podintroductions.111.a: "新的一代将拯救我们"
 podintroductions.durgasyn: "作为突伽·辛，你在教育新后嗣时总具有一项有益的专属选项。\n你也可以通过达成西方与东方目标决议，解除芭芭雅嘎对你的诅咒，来恢复你的青春。"
 podintroductions.112.t: "你的故事就此展开"
 podintroductions.112.desc: "赞美赛特，也赞美玛阿特卡拉，他最心爱的配偶，因为您拯救了误入歧途的“$pod_cainite$”种族。当您看到这么多您所爱的子嗣没有遵从他的教导时，您的心会流泪。尽管如此，希望还是存在的，因为伊比利亚勒森魃内战的混乱让他们中的许多人误入歧途，寻找指引。\n作为圣显者之一，赛特之子$pod_clan$的合法领袖，您很乐意提供这样的指导。只有全世界都在赞美他，您才会停止。到那时，也只有到那时，他才会凯旋而归到您身边……"
 podintroductions.112.a: "那么多可怜的灵魂等着被解放"
 podintroductions.maatkare: "作为玛阿特卡拉，你具有一项用于转变任何非狂热非信者的专属[character_interaction|E]。该选项只在你处于赛特之道宗教时可用。"
 podintroductions.113.t: "你的故事就此展开"
 podintroductions.113.desc: "卡维娅大人，您刚刚巩固的橄榄会议已经有一个新的危机正在引起您的注意。强大的大马士革城市已经沦陷在崇魔者的影响之下，它的疯狂将吞噬整个地区。\n玛纳尔，一位亲王的子嗣，比斯塔克，哈基姆派使节，是这座城市仅存的两名神志正常的吸血鬼，现在正请求您的帮助来净化这座城市。他们都发誓，如果您保证支持他们的功业，他们会尽他们所能帮助您。\n拯救大马士革将向世界传递一个强有力的信息，那就是萨洛比$pod_clan$仍然健在，但您也知道，这会让您成为巴力势力的首要目标，直到这座城市被拯救……"
 podintroductions.113.a: "我们必须赶上，否则就太晚了"
 podintroductions.113.b: "遗憾的是，会议目前太弱了"
 podintroductions.qawiyya: "要去掉负面修正，你必须在70年内拿下大马士革和巴尔米拉"
 podintroductions.114.t: "你的故事就此展开"
 podintroductions.114.desc: "腓力背叛了您。卡山德背叛了您。就连亚历山大也背叛了您，他的命运就在眼前，却那么快就死去了。您孤身一人，佩塔尼奎亚。\n但在这里，您找到了力量和新的目标。当您彻底地回避人类的时候，新的盟友蜂拥而来，被称为“黑旋舞者”的狼人。他们崇拜一位叫做“$glossary_wyrm$”的黑暗实体。\n也许这就是拯救您的关键，佩塔尼奎亚。走在这黑螺旋中可能会拯救您……或者进一步处刑您。\n但您还能往下走多远？"
 podintroductions.114.a: "真相就在下面"
 podintroductions.petaniqua: "作为佩塔尼奎亚，你有一项来行于黑螺旋的决议。请注意，这远非一种安全的尝试……"
 podintroductions.115.t: "你的故事就此展开"
 podintroductions.115.desc: "狄奥尼修斯大人，第四次十字军东征的动荡正在蔓延到您所热爱的雅典。难民们来到这座城市，他们感到身心俱失。作为人性之路的主要倡导者之一，您有责任庇护这些可怜的灵魂。\n但您也可以在这个被毁的希腊重建秩序，以避免这样的创伤性事件再次发生。作为一个受人爱戴的老师和导师，一定要找到并培养您未来最好的接班人。$pod_cainite$现在比以往任何时候都需要他们。"
 podintroductions.115.a: "于烬重生"
 podintroductions.dionysius: "作为狄奥尼修斯，你在教育新后嗣时总具有一项有益的专属选项"
 end_intro_tooltip: "你将不会得到任何额外信息。"
 podintroductions.2001.f: "我有点略懂，但是我想知道更多细节"
 continue_intro_tooltip: "你将在接后天数获得关于模组的机制的更多详细信息"
 podintroductions.3000.t: "黑夜之秘"
 podintroductions.3000.desc: "你想探讨哪个主题？"
 podintroductions.3000.a: "[Glossary('血律','game_concept_discipline_desc')]"
 podintroductions.3000.b: "$pod_Embrace$与子嗣"
 podintroductions.3000.c: "潜藏"
 podintroductions.3000.d: "饥渴"
 podintroductions.3000.e: "我这样就行，直接开始吧！"
 podintroductions.3001.a: "返回"
 podintroductions.3001.t: "[Glossary('血律','game_concept_discipline_desc')]"
 podintroductions.3001.desc: "[Glossary('血律','game_concept_discipline_desc')]，也就是吸血鬼的力量，在模组中由独特的生活方式所展示。只有当你拥有相应的特质时，你才能在一棵技能树上花费点数（例如：迅捷术技能树是由迅捷术特质解锁的）。\n你主要通过猎食凡人或牧群凡人来获得这些技能树的生活方式经验（牧群意味着在较长的时间内将凡人作为血源保存在身边），这两种方式都是与你同地点的凡人进行的[character_interaction|E]。\n有些凡人比其他凡人提供更多的经验，这取决于他们的特质。"
 podintroductions.3002.t: "初拥与子嗣"
 podintroductions.3002.desc: "作为非淡血种吸血鬼，你不能生孩子。你的角色页面中的“子女”栏展示了你的子嗣，即被你转为吸血鬼的凡人。要做到这一点，你可以对你同地点的任何凡人使用[character_interaction|E]。\n一旦互动和随后的计谋完成，这位凡人就会成为吸血鬼，即你的子嗣。请注意，你将不得不在之后对他们进行教育，这将是以昂贵的或危险的不同方式进行。"
 podintroductions.3003.t: "潜藏"
 podintroductions.3003.desc: "[the_masquerade|E]代表了你在多大程度上暴露于凡人当局，如教廷。在游戏中，它是一个从0到5的角色修正。曝露度可以通过使用吸血鬼的力量、猎食凡人和各种事件而上升。如果它上升得太高，裁判行动（一个派系）将显现来对抗你。你也可能被单独的裁判官盯上，试图猎杀你。\n为减少曝露度，大多数宗教可以通过点击潜藏条或右键点击你的角色来使用“掩盖潜藏”互动。那些不关心[the_masquerade|E]的宗教就没有这个权利了。"
 podintroductions.3004.t: "饥渴"
 podintroductions.3004.desc: "[hunger_with_icon|E]代表你的角色有多需要血。饥渴主要通过使用吸血鬼的力量来增加。如果它上升得太高太久，你将不能再使用吸血鬼的力量，一些讨厌的事件可能会发生。"
 podintroductions.4000.t: "信仰之秘"
 podintroductions.4000.desc: "你想探讨哪个主题？"
 podintroductions.4000.a: "真信"
 podintroductions.4000.b: "裁判官的能力"
 podintroductions.4000.c: "继承"
 podintroductions.4000.d: "寻找巢穴"
 podintroductions.4000.e: "我这样就行，直接开始吧！"
 podintroductions.4001.a: "返回"
 podintroductions.4001.t: "真信"
 podintroductions.4001.desc: "作为猎人最重要的工具之一，真信（以及它的升级版荣福）是一个可以解锁强大生活方式的特质。大多数开局猎人在开局时都有这特质，但确保你的继承人也有这特质是一项重要的任务。\n要做到这一点，你可以在任何其他角色身上使用真信能力“代祷”，以便有机会让他们拥有这一特质。如果这个方法失败了，而你扮演的角色又没有这个特质，但又想拥有它，你可以请一个有真信的朋友帮助你获得它。但这是一个昂贵而困难的过程。\n真信生活方式的经验值主要是通过寻找巢穴[journey|E]获得的，这将在关于其的部分中说明。"
 podintroductions.4002.t: "裁判官的能力"
 podintroductions.4002.desc: "除了在专属部分中说明的真信外，裁判官拥有的生活方式取决于你的角色属于哪个裁判官修士会，这由你的角色在游戏中的宗族来代表。你无法获得其他宗族的专属能力。"
 podintroductions.4003.t: "继承"
 podintroductions.4003.desc: "每个修士会都有自己的继承方法。冯·穆尔瑙的玩法就像CK3本体，有婚姻和孩子。其他神圣修士会使用一种专属[character_interaction|E]来授任角色，让其成为他们的“孩子”。\n授任遵循一些规则，比如学徒要比导师年轻，或者在圣约翰修女会的情况下，得是女性。\n除了冯·穆尔瑙和神目之外，其他教团都是宣誓独身，因此必须使用这一机制来确保有合适的继承人。"
 podintroductions.4004.t: "寻找巢穴"
 podintroductions.4004.desc: "寻找巢穴是猎人对抗吸血鬼角色的特殊[journey|E]，是猎人游玩的核心部分，因为它是一种不需要战争就能干掉强大吸血鬼的方法，也是获得真信生活方式经验的主要途径。\n显然，这样的旅程是很危险的，但如果你能很好地挑选目标，就可以减轻难度。主要要看的是属性，你在某一类别中对目标的相差越高，就越容易。\n寻找巢穴也可为困难的战争做准备，因为你可以在战争开始前猎杀你未来敌人的最佳骑士。"
 podintroductions.2001.h: "回到开头"
 podintroductions.6002.t: "背景与前景"
 podintroductions.6002.desc: "你想在地图上任选一位吸血鬼，让其成为你的[Glossary('尊长','game_concept_Sire_desc')]，算作是你角色的设定，还是你喜欢以没有明确世系背景开局？"
 podintroductions.6002.a: "我想自选一位与我为亲者。"
 podintroductions.6002.c: "我将让其保持未知。"
 podintroductions.6003.t: "背景与前景"
 podintroductions.6003.desc: "你想在地图上任选一位[Glossary('万鬼','game_concept_kuei_jin_desc')]，让其成为你的师父（在游戏术语中以父母形象呈现），算作是你角色的设定，还是你想在游玩过程中加入？"
 podintroductions.6003.a: "我想选个初始师傅。"
 podintroductions.6003.b: "我想在游玩中加入[Glossary('屋室','podgloss.wu')]。"
 podintroductions.6003.c: "我想从黑户开始。"
 podintroductions.6004.t: "背景与前景"
 podintroductions.6004.desc: "你想在地图上任选一位[ghoul|E]/[Glossary('遗传血仆','game_concept_revenant_desc')]，让其成为你的父母，算作是你角色的设定，还是你想在游玩过程中加入组织，又或永不加入？"
 podintroductions.6004.b: "我想加入弃民。"
 podintroductions.6004.c: "我想成为其他类型的超自然。"
 podintroductions.6005.t: "背景与前景"
 podintroductions.6005.desc: "你想在地图上任选一位猎人，让其成为你的父母，算作是你角色的设定，还是你想在游玩过程中加入组织，又或永不加入？"
 podintroductions.6005.b: "我想加入猎人组织。"
 podintroductions.6005.c: "我想成为超自然。"
 podintroductions.2006.t: "迄今为止的过往……"
 podintroductions.2006.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n《黑暗世界》的吸血鬼主要来源于圣经中对该隐（第一个谋杀犯）的诅咒，他们中的大多数都可以追溯世系到他的身上，这一体系被称之为“世代”。这棵不死族宗族之树已经分裂成数个派系和氏族，每个派系都有自己的力量、弱点和地缘权力基础。\n在你这局的初始日期，裁判所和大反乱已经都过去了，让不死族世界受过了前所未有的震动。为了应对这些新的威胁，大多数[Glossary('氏族','game_concept_Clan_desc')]一起成立了秘盟，这个党派旨在将吸血鬼隐藏在凡人的视线之外。与此相对应的是魔宴的形成，彻底暴露吸血鬼其怪物本质。但许多$pod_cainites$还没有选择立场，这两个脆弱的党派的未来目前仍然相当不确定。"
 podintroductions.6010.t: "你的真实年龄"
 podintroductions.6010.desc: "你可以在这里设置你的真实年龄，这不会改变你永生外表。"
 podintroductions.6010.a: "我已经完成设定年龄。"
 podintroductions.2001.t_ghouls: "欢迎来到黑暗从者"
 podintroductions.2001.a_ghouls: "让我们来谈谈血仆的主要机制……"
 podintroductions.2003.t_ghouls: "血仆101"
 podintroductions.2003.desc_ghouls: "首先，推荐在熟练掌握$POD_splat_vampire$的机制后再尝试游玩$POD_splat_ghoul_plural$和$POD_splat_revenant_plural$，因为它们都使用类似的机制，但对于“黑暗仆从”来说，可操作性更少，难度更大。此篇介绍将只谈与吸血鬼主要机制的具体出入。\n\n相似之处：$POD_splat_vampire_plural$和[ghouls|E]都是$TRAIT_FLAG_DESC_immortality$，都有[hunger|E]，且都能使用[Glossary('血律','game_concept_discipline_desc')]。\n\n不同之处：[ghouls|E]分为[bound_ghouls|E]和[masterless_ghouls|E]，且导向了不同的[ghoul|E]机制。\n\n其中最重要的机制是[ghoul_vitae_dependency|E]，它每[GetPlayer.MakeScope.ScriptValue('POD_years_to_lose_vitae_passively')]年就会使你的[hunger|E]增加#N 1#!。如果一个[masterless_ghoul|E]达到[GetModifier('bloodhunger5_modifier').GetNameWithTooltip]，其将立即失去[GetTrait('ghoul').GetName(GetPlayer)][trait|E]并变回凡人。[bound_ghouls|E]则因其主宰者而免于此命运。为了避免这个问题，[masterless_ghouls|E]需要猎杀$POD_splat_vampire_plural$，方法要么是[imprisoning|E]他们并遵循[masterless_ghoul_imprisoned_drinking|E]道途，要么是通过#V $hunt_target_name$#![journey|E]来猎杀并饮用$POD_splat_vampire$的$pod_vitae$。\n\n另一个重要机制是[ghoul_discipline_limit|E]，它根据你的[ghoul_greatest_vitae_ingested|E]限制了你学习[Glossary('血律','game_concept_discipline_desc')]的程度。要提升此限制，[ghoul|E]必须获得更前世代的$pod_vitae$，这可以通过成为[bound_ghoul|E]或作为[masterless_ghoul|E]摄取$pod_vitae$来实现。\n\n最后一个重要机制，这次是[bound_ghouls|e]独有的，即[bound_ghoul_missions_with_icon|E]的概念。这是血缚血仆降低其使用[Glossary('血律','game_concept_discipline_desc')]所需[hunger|E]的唯一途径。任务范围可能包括完成一次[journey|E]、杀死特定[character]，甚至献出[family|E]成员。"
 podintroductions.6004.a: "我想选父母。"
 podintroductions.6005.a: "我想选父母。"
 podintroductions.2202.t: "欢迎来到黑暗不朽者"
 podintroductions.2202.desc: "$POD_generic_introduction$\n\n你正在游玩木乃伊，它的玩法和概念与吸血鬼或裁判官非常不同。虽然介绍会提出关键的核心概念，但如果你想得到更深入的指南，请不要犹豫，去我们的百科上看看。"
 podintroductions.2202.a: "让我们来谈谈木乃伊的主要机制……"
 podintroductions.2210.t: "重生之秘"
 podintroductions.2210.desc: "你想探讨哪个主题？"
 podintroductions.2210.a: "复活"
 podintroductions.2210.b: "赫考与塞赫"
 podintroductions.2210.b_wutian: "丹与气"
 podintroductions.2210.c: "奈特鲁"
 podintroductions.2210.e: "我这样就行，直接开始吧！"
 podintroductions.2211.a: "返回"
 podintroductions.2211.t: "复活"
 podintroductions.2211.desc: "你是永生的，甚至更强，你可以在被杀时复活！\n\n这将花费你[piety_i][ROOT.ScriptValue('mummy_ressurection_piety_value')|V0][piety|E]虔诚。\n\n当你无法支付代价时，或因自己的意愿或压力而决定自杀时，或当你的灵魂被吞噬时，你仍然会终于[UmbraGlossary('oblivion')]！"
 podintroductions.2212.t: "赫考与塞赫"
 podintroductions.2212.desc: "作为木乃伊，你具有施展赫考（力量之语）的能力，其以生活方式表示。\n\n你使用塞赫来施展你的赫考，而且不同木乃伊回复它的方式不同。\n\n花费塞赫到零以下会给你一个生命力流失负面修正，当修正计数超过-9时，你将陷入[UmbraGlossary('shadow_realm')]。"
 podintroductions.2212.t_wutian: "丹与气"
 podintroductions.2212.desc_wutian: "作为天宗，你不能像埃及的木乃伊那样利用真名，但你可以获得丹术生活方式。\n\n你不具备塞赫，相反，你有着阳气，生命之气，且会随着时间的推移而恢复。\n\n花费气到零以下会给你一个生命力流失负面修正，当修正计数超过-9时，你将陷入[UmbraGlossary('shadow_realm')]。"
 podintroductions.2213.t: "奈特鲁"
 podintroductions.2213.desc: "你是独一无二的，你不能创造更多的木乃伊来协助你（除非你是荷鲁斯或卡比洛斯）。\n\n反而，你可以使用[neteru|E]来接管你的头衔或建筑。\n\n你的凡人孩子一出生就会成为你的[neteru|E]，但你也可以用花费威望使用[interaction|E]来认同你的廷臣是[neteru|E]。\n\n只有一件事，他们没法担任你的继承人，所以当你不能再复活时，游戏就会自动结束。"
 podintroductions.6006.t: "背景与前景"
 podintroductions.6006.desc: "你想在地图上任选一位角色，让其成为你的父母，算作是你角色的设定，还是你想在游玩过程中加入组织，又或永不加入？"
 podintroductions.6006.a: "我想选父母。"
 podintroductions.6006.c: "我不需要这些。"
 podintroductions.2302.t: "欢迎来到黑暗大统领"
 podintroductions.2302.desc: "$POD_generic_introduction$\n你正在游玩死灵，它的玩法和概念与吸血鬼或裁判官非常不同。虽然介绍会提出关键的核心概念，但如果你想得到更深入的指南，请不要犹豫，去我们的百科上看看。"
 podintroductions.2302.a: "让我们来谈谈死灵的主要机制……"
 podintroductions.2203.t: "木乃伊回归"
 podintroductions.2203.desc: "木乃伊，也被称为不朽者或重生者，是其身体经过仪式性的保存，并被赋予自我复活的能力的永生者。\n伊西斯用强大的生命神咒创造出来他们，最初是用于追随和服务她的儿子荷鲁斯，是在他与杀害他父亲奥西里斯的凶手赛特的永恒战争中的伙伴。他们是埃及——黑沙和金字塔的土地——的最初不朽者。他们被共同的文化绑在一起，继续为荷鲁斯的两大目标而努力：向赛特复仇和击败巨蛇$glossary_wyrm_apophis$。\n然而，并非所有的木乃伊都致力于这场战斗。有些人不顾荷鲁斯的不赞同，选择了分道扬镳，这些人被称为以实玛利派。\n而这些“中立”木乃伊的其中一位将生命神咒传授给了希腊法师卡比洛斯，后者建立了自己的“朝代”，其等至今仍被荷鲁斯追杀，他对神圣的生命神咒被交给不信者这点很是愤怒。\n最后，赛特本人从未真正获得过生命神咒，但他近乎拥有过，以至于他自己创造了扭曲版的神咒。这导致了忌灵木乃伊的诞生，他们是对埃及的真正木乃伊的疯狂嘲弄，专心侍奉他们的黑暗之神的命令。"
 podintroductions.2203.a: "回到开头"
 podintroductions.2202.b: "关于木乃伊的资料"
 podintroductions.2402.t: "欢迎来到黑暗天使"
 podintroductions.2402.desc: "$POD_generic_introduction$\n\n你正在游玩恶魔，它的玩法和概念与吸血鬼或裁判官非常不同。虽然介绍会提出关键的核心概念，但如果你想得到更深入的指南，请不要犹豫，去我们的百科上看看。"
 podintroductions.2402.a: "让我们来谈谈恶魔的主要机制……"
 podintroductions.224.t: "你的故事就此展开"
 podintroductions.224.desc.intro: "你是作为睿魔尔巫士[destroyed_tremere_master.GetFullName]的仆人被创造的。通过一系列奇特的情况，[destroyed_tremere_master.GetSheHe]被棘秘魑摧毁。作为[destroyed_tremere_master.GetHerHis]领域中唯一幸存的吸血鬼，你事实上已经继承了这个国度和财产。然而，你周围有很多潜在的敌人和盟友，他们都想把你拉到身边。你是要孤军奋战，还是戴上新的枷锁，向新的领主宣誓效忠？"
 podintroductions.224.a: "雷霆使谁更伟大？至少在这里，我们将获得自由"
 podintroductions.224.a.tt: "保持独立，你巩固了你对[destroyed_tremere_master.GetFullNamePossessive]的财产的控制，包括大量的刮刀蝙蝠。"
 podintroductions.224.b: "以一定代价，向拉兹科利纳宣誓效忠"
 podintroductions.224.b.tt: "拉兹科利纳看问题的方式与其他魔物不同。虽然独断专行，但她会遵守任何宣誓誓言。如果能接受她的思维方式，就可以达成交易。她接受梵卓、冈格罗和家传血仆在她的国度里。她可能提供了摆脱棘秘魑和睿魔尔之间预兆之战的最佳希望。"
 podintroductions.224.c: "在血肉大教堂寻求庇护"
 podintroductions.224.c.tt: "沃拉克无疑是该地区最强大的棘秘魑，尽管他的心态奇异。他可以用鲜血浇灌你，帮助我们释放你的棘秘魑血脉的力量。但他肯定会要求你发血誓。"
 podintroductions.224.d: "协助剥皮者的野心"
 podintroductions.224.d.tt: "附近最弱的军督，维利亚并不缺乏野心。他也是一位出色的库都术士。务实的他会用魔法和他的保护来换取附庸的效忠。作为一个弱小领主的强大附庸，可能比成为最弱小的领主更好。"
 podintroductions.224.e: "回归主人"
 podintroductions.224.e.tt: "声称我对我主人的毁灭是无辜的，并直接向睿魔尔的执政埃特里乌斯求救。虽然他肯定会要求我宣誓并重返岗位，但他可能会允许一些有限的自主权作为“实验”。"
 podintroductions.224.f: "母亲！母亲会帮助我们的！"
 podintroductions.224.f.tt: "所有石像鬼的伟大母亲，维斯塔尼亚，喜欢她魔法的所有造物。去向她表示你的忠诚，协助她在翁格瓦尔的政治阴谋，她会用一支石像鬼斥候近卫军来奖励她“自由奔放的孩子”。"
 podintroductions.rocklord: "作为岩主，你对夜行神龙的命运有着举足轻重的作用。"
 POD_rocklord_razorbat_flock: "岩主的刮刀蝙蝠群"
 POD_rocklord_retinue: "岩主的近卫军"
 podintroductions.2402.b: "关于恶魔的资料"
 podintroductions.2403.t: "堕落天使"
 podintroductions.2403.desc: "恶魔是堕落的天使，他们在创世的第一天选择与路西法和人类站在一起，而不是与天主站在一起。为了惩罚他们的叛逆和不忠，天使长米迦勒把这些天使从天堂扔到深渊。他们从那时起就被囚禁着，但他们中的一小部分被崇魔者召唤出来，现在又回到了大地上，其等由于永恒监狱的伤害而经受着极大的磨难。\n\n堕落天使——现在被称为恶魔——放弃了他们曾经坚持的一切，现在想看到一切都被烧毁，只因对让他们受难的无情上帝的怨恨。"
 podintroductions.2403.a: "回到开头"
 podintroductions.2410.t: "受诅者的秘密"
 podintroductions.2410.desc: "你想探讨哪个主题？"
 podintroductions.2410.a: "肃灵仪式"
 podintroductions.2410.b: "奥秘与决意"
 podintroductions.2410.c: "教徒与魔奴"
 podintroductions.2410.e: "我这样就行，直接开始吧！"
 podintroductions.2411.a: "返回"
 podintroductions.2411.t: "肃灵仪式"
 podintroductions.2411.desc: "为滞留现世，你已撕裂灵魂并将其残片束缚于凡人躯壳。此过程使你创伤虚弱，但假以时日必将突破极限。\n\n游戏机制：每位恶魔初始带有严重负面修正，可通过决议改善。初始[arcana_lifestyle|E]专精仅够改善一次，但或许你更愿将专精用于他处？抉择吧……"
 podintroductions.2412.t: "奥秘与决意"
 podintroductions.2412.desc: "恶魔拥有表现为生活方式的奥秘能力。该能力不提供被动经验，每年根据[cultists|E]数量获得经验值。\n\n使用决心驱动奥秘之力，基础恢复方式是通过自我互动“启示”。更多奥秘专精将解锁其他恢复途径。"
 podintroductions.2413.t: "教徒与魔奴"
 podintroductions.2413.desc: "[cultists|E]与[thralls|E]是恶魔的仆从，教徒提供奥秘经验而魔奴给予牵制。在通过引诱和腐化一位角色入你的信仰，你将能使其化为你的[thrall|E]。这将使他们堕入崇魔。恶魔和崇魔者是你唯一可以拥有的封臣，否则他们会立即建立派系。作为他们的主人，你可以通过提供奥秘技能点来命令他们，要求提供金钱、宝物、头衔或对邻国统治者发动战争。"
 podintroductions.6002.option.a.t: "通过对任何其他活着的角色使用[character_interaction|E]，你将能够选择成为与之相关的角色。"
 podintroductions.2404.t: "尘世之主"
 podintroductions.2404.desc: "恶魔核心主题是腐化。虽被多数角色憎恶，但能通过[journey|E]诱惑凡人堕落。同信仰者可转化为[thralls|E]傀儡。\n奥秘是表现为生活方式的独特能力，经验仅来自招募[cultists|E]\n你具有真正不朽性，至多被逐回深渊监狱。需依赖宿主（表现为[GetModifier('ritual_of_sundered_soul_unstable_modifier').GetNameWithTooltip]等修正），可通过奥秘专精升级。\n主要资源“决心”稀缺，需通过“启示”[interaction|E]显露真命恢复，后续奥秘技能树将提供高效方法。"
 podintroductions.6004.option.b.t: "你将能加入弃民，这是一个由无主血仆组成的派系，主要专注于猎杀吸血鬼。"
 podintroductions.6006.b: "我想成为其他类型的超自然。"
 podintroductions.6006.option.b.t: "你将能成为无主血仆或吸血鬼的子嗣。"
 podintroductions.2502.t: "欢迎来到梦乡领主"
 podintroductions.2502.desc: "$POD_generic_introduction$\n\n你正在游玩妖精，它的玩法和概念与吸血鬼或裁判官非常不同。虽然介绍会提出关键的核心概念，但如果你想得到更深入的指南，请不要犹豫，去我们的百科上看看。"
 podintroductions.2502.a: "让我们来谈谈妖精的主要机制……"
 podintroductions.2502.b: "关于妖精的资料"
 podintroductions.2502.c: "迄今为止的过往……"
 podintroductions.2503.t: "妖精嬉戏"
 podintroductions.2503.desc: "妖精[interactions|E]和力量被称为[cantrips|E]。由术艺生活方式决定效果，而领域生活方式则定义了效果的范围和条件。\n为了获得生活方式经验，你可以吞食凡人（称为“梦种”）的想象力来补充。\n1347年即将发生一件全局事件，将导致游戏玩法发生（负面）转变。你可以通过各种决议来阻止它。"
 podintroductions.2504.t: "生于神话"
 podintroductions.2504.desc: "妖精从何而来？你想追溯到那么久以前吗？我不是神学家，我是历史学家。你真的想知道吗？好吧，我不知道。这个回答怎么样？你希望我说什么？每个哲学家都会给出不同的答案。妖精是由凡人的梦境索创造的。我们是达南神族。达南亲自创造了我们。每个故事版本可能都在某种程度上是真实的。[Glossary('神话纪元','game_concept_mythic_age_desc')]就是那样神话般的存在。故事随着讲述而改变，我们的过去也是如此。现在影响过去，时间是流动的。洞穴壁画是有魔力的，它们确认了在某个时间点上发生了某个事件。在那之前，历史没有任何约束。它基于讲述者的信念，或者更确切地说，基于他们选择说的话。这也是一种魔法。"
 podintroductions.2505.t: "大碎溃的开端"
 podintroductions.2505.desc: "自从大散断开始以来，世界与[UmbraGlossary('dreaming')]的联系逐渐动摇。世界随之变得更糟。随着板讷的增强，妖精们变得更加虚弱。我们生活的循环逐渐但不可避免地转向了新的方向，一些哀怒廷中的人决心采取行动，将梦界重新引回自己身边。他们相信，让世界陷入混乱会减少板讷，并使凡人更容易驯服。毕竟，如果他们看到一只巨龙把他们的房子压扁，他们更有可能相信龙的存在。这些黑暗的妖精拒绝了喜乐廷在每年的明亮那一半担任领袖，于是疯狂的斗争开始了。许多妖精对这种前所未闻的打破传统的行为感到震惊，他们自己陷入了哀怒的本性。黑暗的妖精给一个畏缩的世界带来了寒风和冷雨；龙、龙兽和巨型龙蛇从长达几个世纪的安息中苏醒过来，再次让大地在它们巨翼的阴影下枯萎。\n在13世纪早期，冬天变得漫长而寒冷，雨水持续不断如季风一般。庄稼被淹死。道路变成了泥泞的沼泽。饥荒和寒冷让坟墓填满了人。战争的破坏被归咎于蒙古人或地方国王之间的争斗，而不是闪亮之主和成真的噩梦。杀死梦种是疯狂的行为；挨饿和绝望的农民无法做梦，在一个饥饿的土地上，艺术家找不到赞助者。更糟糕的是，在这样的混乱中，人类转向教会，而教会对妖精的憎恶越来越深。战斗仍在继续。"
 podintroductions.6002.option.a.unavailable: "你已经使用了背景生成器来选择父母。"
 podintroductions.6004.option.c.t: "你将能成为无主血仆或吸血鬼的子嗣。"
 podintroductions.6004.d: "我不需要这些。"
 podintroductions.6005.option.b.t: "你将能加入裁判所，又若你在地图东部区则能加入[GetTrait('shih').GetName( GetPlayer )]。"
 podintroductions.6005.option.c.t: "你将能成为[GetTrait('cabiri').GetName( GetPlayer )]，换生灵，无主血仆，又或堕入黑暗（成为[GetTrait('vampire').GetName( GetPlayer )]）。"
 podintroductions.6005.d: "我不需要这些。"
 podintroductions.2510.t: "梦界之秘"
 podintroductions.2510.desc: "你想探讨哪个主题？"
 podintroductions.2510.a: "魔咒与梦种"
 podintroductions.2510.b: "梦华"
 podintroductions.2510.b_hsien: "气"
 podintroductions.2510.c: "大碎溃"
 podintroductions.2510.e: "我这样就行，直接开始吧！"
 podintroductions.2511.a: "返回"
 podintroductions.2511.t: "魔咒与梦种"
 podintroductions.2511.desc: "作为戚族，你具有术艺和术域生活方式。\n\n它们共同构成了魔咒[interaction|E]，其中术艺提供效果，术域定义范围和条件。\n\n你可以使用凡人（称为梦种）为这些能力提供生活方式经验。"
 podintroductions.2512.t: "梦华"
 podintroductions.2512.desc: "你可以通过首都的秘境永契堡建筑、梦喜[decision|E]、完成外交计谋、肆梦/乱梦/掠梦[character_interaction|E]来恢复梦华。\n\n还有其他回复方式，比如独特宝物或制作血渣宝物。"
 podintroductions.2512.t_hsien: "气"
 podintroductions.2512.desc_hsien: "作为妖仙，你不具备梦华，相反，你有着阴气和阳气，总数为10，且会随着时间的推移而恢复。"
 podintroductions.2513.t: "大碎溃"
 podintroductions.2513.desc: "1347 年，当黑死病肆虐时，游戏玩法将发生重大（负面）转变，即[Glossary('大碎溃','game_concept_shattering_desc')]。\n\n你可以通过决议来阻止它的发生。"
 podintroductions.7000.t: "类Rogue模式"
 podintroductions.7000.desc: "既然你选择了[roguelike_mode|E]，那么你将被随机切换到一位单伯爵领统治者。\n\n你是想将随机限制在永生角色上，还是让随机为任何角色？\n\n请记住，如果你的统治者死亡，游戏就会结束。"
 podintroductions.7000.a: "只永生角色（默认）"
 podintroductions.7000.b: "任意统治者"
 podintroductions.7001.t: "诅咒"
 podintroductions.7001.desc: "你现在在扮演[GetPlayer.GetName]。\n\n[GetPlayer.GetSheHe|U]即将遭遇不测。[GetPlayer.GetSheHe]应该受到哪种诅咒？"
 podintroductions.7001.a: "随机诅咒"
 podintroductions.7001.b: "所有诅咒"
 podintroductions.7001.c: "[GetModifier('POD_roguelike_no_wealth').GetNameWithTooltip]"
 podintroductions.7001.d: "[GetModifier('POD_roguelike_no_love').GetNameWithTooltip]"
 podintroductions.7001.e: "[GetModifier('POD_roguelike_no_rest').GetNameWithTooltip]"
 podintroductions.7001.f: "[GetModifier('POD_roguelike_no_belongings').GetNameWithTooltip]"
 podintroductions.7001.g: "[GetModifier('POD_roguelike_no_curiosity').GetNameWithTooltip]"
 podintroductions.7001.tt: "完成任何主线决议都将消除所有诅咒。"
 podintroductions.7000.c: "继续扮演[GetPlayer.GetFirstNameNoTooltip]"
 podintroductions.7001.h: "[GetModifier('POD_roguelike_no_guile').GetNameWithTooltip]"
 podintroductions.7000.desc.randomizer: "既然你选择了[roguelike_mode|E]，那么你将被切换为一位随机生成的领主。"
 podintroductions.7000.d: "掷骰时间到……"
 podintroductions.2503.widget: "你使用梦华来激发你的[cantrips|E]。\n点击梦华条来查看各种恢复梦华的方式。"
 podintroductions.3003.widget: "你可以点击潜藏条来尝试潜藏。"
 podintroductions.3004.widget: "点击饥渴条来查看各种恢复饥渴的方式。"
 podintroductions.2212.widget.sekhem: "点击塞赫条来查看各种恢复塞赫的方式。"
 podintroductions.2212.widget.chi: "点击气条来查看各种恢复气的方式。"
 podintroductions.7001.i: "[GetModifier('POD_roguelike_no_demands').GetNameWithTooltip]"
 podintroductions.7001.nocurses: "我改变主意了。不要诅咒"
 podintroductions.7001.nocurses.tt: "你将继续游玩[GetPlayer.GetName]，但不带有任何诅咒或其他[roguelike_mode|E]机制。"
 podintroductions.2152.t: "欢迎来到黑暗猎人"
 podintroductions.2152.a: "让我们来谈谈猎人的主要机制……"
 podintroductions.2152.b: "……或各派别的特性"
 podintroductions.2152.c: "关于猎人的资料"
 podintroductions.2152.d: "我这样就行，直接开始吧！"
 podintroductions.2153.t: "独自在黑暗中"
 podintroductions.2153.desc: "猎人在[princes_of_darkness|E]中提供了最“原版”的体验。他们可以有子女（除非他们是修士会成员），他们有非常少的独特生活方式，也不是永生的存在（除了甘滕宾）。\n在没有天主教教会（裁判官）的支持下，准备迎接困难模式吧。外面的怪物比你强大得多，也能使用你只能梦想的力量。你的主要优势是通过“寻找巢穴”[character_interaction|E]，使你能够孤立一个敌人并或许杀死他们，但即使在这种情况下，敌人往往也足够强大，还足以获胜。\n你还有另一个独特互动，就是能够启蒙/授任任何比你角色年轻的凡人。经过一段时间的训练，他们将成为你的学徒（在机制上成为你的孩子，以便进行继承），并获得猎人的特质和你的信仰。"
 podintroductions.2153.a: "派别的特性"
 podintroductions.2154.t: "不幸的少数"
 podintroductions.2154.desc: "边防军是东正教的战士僧侣。他们可以试图修复与裁判官之间的分裂，以加强自己的力量。\n精诚兄弟社是一家穆斯林猎人。他们对魔法和木乃伊持开放态度，为他们提供了独特的机遇。\n犹太猎人，民长，是神通术和术法的大师。\n斯拉夫的达兹博格战士是猎人中最具军事智慧的。\n蒙古猎人，科尔沁把阿秃儿，与盖亚派狼人有着友好关系，这可以帮助他们。\n独立猎人可以通过独特决议选择自己的专注领域。\n波格米勒派的甘滕宾血仆是永生的，可以拥有非常庞大（虽然非常薄弱）的征召兵军队。\n来自远东的猎人——士——拥有自己的一套力量（窍），对超自然更加宽容，有时与“善良”的存在合作。"
 podintroductions.2154.a: "回到初始选项"
 podintroductions.2155.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在现实世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在扮演猎人与猎物。到了1230年，只有少数几个不隶属于天主教教会裁判官的猎人派别存在。它们数量不多，分散在各处，对整个大局来说并不重要。完全独立的猎人也存在，但除了一些重要的例外情况，它们往往不能持久。\n然而，这些组织中的大多数仍处于初期阶段，并将在未来几个世纪中经受考验并壮大自己。它们将成为各自地区超自然力量的主要制衡力量，有时与强大的裁判所合作，有时对抗它。\n你能像他们一样坚持下去，甚至成为黑暗世界中的强大力量吗？"
 POD_generic_introduction: "首先，感谢您游玩这个Mod！\n[princes_of_darkness|E]是对基础游戏的彻底改造，旨在将P社旗下白狼公司的《$pod_wod$》跑团规则带入十字军之王3中。因此，它改变了许多玩法概念，并使用原作世界观的广泛内容来提供一种不同的体验。"
 podintroductions.6001.t: "超自然猎人"
 podintroductions.6001.desc: "你在统治者设计器中同时选择了超自然和猎人特质，两者是互相冲突的，除非你是圣宾尼陀。"
 podintroductions.6001.a: "我想成为圣宾尼陀"
 podintroductions.6001.b: "我想成为超自然"
 podintroductions.6001.c: "我想成为猎人"
 podintroductions.6007.t: "背景"
 podintroductions.6007.desc: "你想在初始拥有存世的凡人血脉，算作是你角色的设定，还是你喜欢以没有明确世系背景开局？"
 podintroductions.6007.a: "我在[Glossary('皮囊之地','game_concept_skinlands_desc')]有家人。"
 podintroductions.6007.c: "我不需要这些。"
 podintroductions.6002.b: "我想成为其他类型的超自然。"
 podintroductions.6002.option.b.t: "你想成为恶魔？不，恶魔成为了你。"
 podintroductions.2202.c: "迄今为止的过往……"
 podintroductions.2204.t: "木乃伊101问"
 podintroductions.2204.desc: "为了在每一次新生后记住自己是谁，木乃伊需要“回忆”这些记忆代表着他们更遥远过去的纪念品，通常来自他们的第一世及其文化。\n在游戏中，记忆与你的“藏身处”（即古墓）紧密相连。藏身处会提供多种方式，让你获取更多记忆以增强力量，或选择其他优先收益。但请注意，陵墓可能遭到劫掠，若防守不当，你将损失珍贵的资源。\n\n木乃伊难以轻易创造更多同类，因此他们会借助信徒“奈特鲁”来完成大部分凡俗事务。若你计划扩张势力，招募更多奈特鲁（甚至从其他超自然存在中吸纳）将大有裨益。\n\n若木乃伊死亡，他们会根据所属派系的不同标准接受审判。因此，尽管真正不朽，但若未能通过审判，死亡仍可能付出沉重代价。"
 podintroductions.2205.t: "迄今为止的过往……"
 podintroductions.2205.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在现实世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在游玩木乃伊，其讲述的是荷鲁斯和赛特之间永恒冲突的故事，双方都可使用各自的古埃及仪式，在争夺世界灵魂的战斗中占据上风。"
 podintroductions.2302.b: "关于死灵的资料"
 podintroductions.2302.c: "迄今为止的过往……"
 podintroductions.2303.t: "死灵101问"
 podintroductions.2303.desc: "你使用执念作为类似魔力的能量。你需要完成炽情决议来为你的能力提供燃料。\n你通过[Fetters|E]决定你是否能够留在[Glossary('皮囊之地','game_concept_skinlands_desc')]（即凡人世界）。你不会受伤，取而代之的是失去[Corpus|E]。当你死去时，你会变成[GetTrait('spectre').GetName( GetNullCharacter )]。\n\n返生者可以使用一些吸血鬼的血律，当他们死亡时，会变成死灵。你同样也有黯影，这是每个死灵心中虚无主义的部分，当你因压力而崩溃时，它会使你在“荆棘技能树”中获得一个负面特质。"
 podintroductions.2304.t: "关于亡者的资料"
 podintroductions.2304.desc: "死灵是生活在[UmbraGlossaryLocalized('shadowlands','冥界')]中的不眠之魂。有些死灵拥有[Fetter|E]，使他们能够在[Glossary('冥府','game_concept_dark_kingdom_desc')]之外生存，少数还拥有影响[Glossary('皮囊之地','game_concept_skinlands_desc')]和生者（凡人）的能力。解决这些[Fetters|E]能够让死灵得以超脱，但如果他们在这之前被自己的黯影（即每个幽灵心中的虚无主义部分）吞噬，他们就会变成[GetTrait('spectre').GetName( GetNullCharacter )]。"
 podintroductions.2305.t: "亡者律令"
 podintroductions.2305.desc: "死灵是一种鬼魂，即一个人死后未能完成心愿的灵魂，如今徘徊在[UmbraGlossary('shadowlands')]。无论是出于已知还是未知的原因，这些死灵仍然与生者的世界（皮囊之地）紧密相连，无法进入那不可言说的来世。\n\n死灵被困在冥界，这是一个与生者世界有交集但独立存在的平行现实，拥有自己独特的法则和物理规则。死灵的心智被分为两个部分，真灵和黯影。死亡后，幽灵性格中的负面、自我厌弃和自我挫败部分会形成一个独立的原型人格，这个人格就是黯影。黯影与迷宫中更黑暗的力量保持联系，作为真灵永恒的背反和对立存在。"
 podintroductions.2402.c: "迄今为止的过往……"
 podintroductions.2405.t: "迄今为止的过往……"
 podintroductions.2405.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在现实世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在游玩恶魔：魔有魔报，你是少数几位成功逃出深渊监狱的叛乱天使之一，深渊监狱是路西法堕天后对你的罪罚。在永恒的折磨下，你的身体扭曲变形，现在你是原罪之一的化身，随时准备腐化人类，以报复残酷的造物主。"
 podintroductions.5102.t: "欢迎来到黑暗老祖"
 podintroductions.5102.desc: "$POD_generic_introduction$\n你正在游玩万鬼，它的玩法和概念与吸血鬼或裁判官非常不同。虽然介绍会提出关键的核心概念，但如果你想得到更深入的指南，请不要犹豫，去我们的百科上看看。"
 podintroductions.5102.a: "让我们来谈谈[Glossary('万鬼','game_concept_kuei_jin_desc')]的主要机制……"
 podintroductions.5103.t: "[Glossary('万鬼','game_concept_kuei_jin_desc')]101问"
 podintroductions.5103.desc: "[Glossary('万鬼','game_concept_kuei_jin_desc')]的游戏玩法有两个重点。第一个是你的[Glossary('心法','podgloss.dharma')]，代表你的角色离达到开悟有多近。根据你的信仰（[Glossary('心法','podgloss.dharma')]特质会解释你角色的具体方式），在[Glossary('心法','podgloss.dharma')]上的进展方式有所不同。\n第二个是[Glossary('纪元之轮','podgloss.wheelofages')]，象征着世界正走向终结（以及可能的重生）。富有冒险精神的[Glossary('万鬼','game_concept_kuei_jin_desc')]可以尝试为即将到来的轮回做准备。通过完成若干目标，你可以削弱即将在1350年到来的新纪元的影响。\n请注意，你不是西方吸血鬼，例如你不能拥有血仆、牧群或创造新的吸血鬼。你可以通过决议收养一个继承人。"
 podintroductions.5104.t: "关于[Glossary('万鬼','game_concept_kuei_jin_desc')]的资料"
 podintroductions.5104.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在扮演一位[Glossary('万鬼','game_concept_kuei_jin_desc')]，所谓的“东方血族”，他们曾是古老的英雄，因为他们的罪行而被[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]诅咒。虽然他们实际不是吸血鬼，但他们经常与西方的吸血鬼互动，主要是通过领地战争，特别是在印度。几千年来，次大陆一直是来自东亚的[Glossary('万鬼','game_concept_kuei_jin_desc')]和印度本地吸血鬼之间的主要战场。[Glossary('万鬼','game_concept_kuei_jin_desc')]本身并不是一个统一的阵线，他们分为不同的“[Glossary('心法','podgloss.dharma')]”（他们的主要信仰）和“皇朝”（他们的主要政治组织）。"
 podintroductions.5105.t: "第四纪元的终结"
 podintroductions.5105.desc: "[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]的堕落战士——鬼人（在中国更正式的称谓是[Glossary('万鬼','game_concept_kuei_jin_desc')]）是遵循惯性的生物，千百年来模仿着中国的官僚行政体系。虽然他们在东印度和西藏的边疆地区一直更加活跃，但中央的[Glossary('万鬼','game_concept_kuei_jin_desc')]五大皇朝长期以来一直固守旧规。蒙古入侵打破了这种相对的和平，预示着轮回的转折和[Glossary('第四纪元','game_concept_fourth_age_desc')]的终结。\n\n位于东南亚的朱雀皇朝已退守至他们地处吴哥的核心地带，而边远的区域已经悉数沦丧于崇魔者之手。\n位于西藏的白虎皇朝，在他们的前代老祖离去之后，陷入了内战。\n掌握朝鲜与日本的青龙皇朝因为日本的势力扩张，正面临分裂的危机，这也许会在未来引发暴力冲突。\n大草原上的玄武皇朝遭[Glossary('安答','podgloss.anda')]势力的持续打压，已然不复昔日的荣光。\n唯有中华境内的黄帝皇朝稳立乱世，波澜不惊，然而在表象之下，未必没有暗流涌动。"
 podintroductions.2310.t: "死者之秘"
 podintroductions.2310.desc: "你想探讨哪个主题？"
 podintroductions.2310.a: "皮囊之地与[UmbraGlossary('shadowlands')]"
 podintroductions.2310.b: "执念与尸躯"
 podintroductions.2310.c: "羁绊"
 podintroductions.2310.e: "我这样就行，直接开始吧！"
 podintroductions.2311.a: "返回"
 podintroductions.2311.t: "皮囊之地与[UmbraGlossary('shadowlands')]"
 podintroductions.2311.desc: "你有几种方法可以与皮囊之地互动，其中一些允许你对统治者进行操作。如果你没有这些选项，你需要冒险穿越尸幕才能到达[Glossary('皮囊之地','game_concept_skinlands_desc')]。\n\n你可以在游戏的开始阶段探索[UmbraGlossaryLocalized('shadowlands','冥界')]，并且有专门的死灵内容，允许你改变政府类型、获得冥法或成为[GetTrait('ferryman').GetName( GetNullCharacter )]。"
 podintroductions.2312.t: "执念与尸躯"
 podintroductions.2312.widget: "点击执念条来查看各种恢复执念的方式。"
 podintroductions.2312.desc: "你可以使用冥法作为生活方式，并由你的执念驱动，执念通过使用炽情决议来恢复。返生者可以使用一些吸血鬼的律能，死亡时会变成死灵。\n\n你不会受伤，取而代之的是失去[Corpus|E]。当你死亡时，你会变成[GetTrait('spectre').GetName( GetNullCharacter )]。"
 podintroductions.2313.t: "羁绊"
 podintroductions.2313.desc: "你拥有[Fetters|E]，它决定你是否能够留在[Glossary('皮囊之地','game_concept_skinlands_desc')]。你有10点可以自由分配，以及1到5点可以分配给你的头衔、宝物或亲属。你可以解决这些[Fetters|E]，最终达到超脱，能够不受限制地留在[Glossary('皮囊之地','game_concept_skinlands_desc')]。\n\n你也有一个黯影，每次你因压力而崩溃时，它会在荆棘生活方式中增加一个负面技能。当黯影暂时接管你（即黯影爆发期间），你可以看到选择的荆棘特质。黯影通过消耗压力而不是获得压力来进行互动。"
 podintroductions.2412.widget: "点击进度条通过“启示”恢复决心。"
 podintroductions.6010.widget: "真实年龄：[Character.GetAge]"
 podintroductions.6010.reset: "重置为[EventWindowWidget.GetScope.GetValue('original_age')]"
 podintroductions.317.desc: "拉撒路信徒充其量是一个分散的邪教，他们相信拉撒路的智慧和神性，并研究生与死的秘密，以此作为效仿和服侍他的一种手段。埃尔吉耶斯的卡帕多西亚女祭司康斯坦西亚认为他们是异端——既因拉撒路拒绝遵从其尊长卡帕多修斯的意志，亦因其信徒对复活的信仰。\n当卡帕多修斯召集子嗣参与后世所称的“愚蠢盛宴”时，拉撒路未回应召唤。其血之兄弟凯亚斯·柯因内寻获拉撒路后，发现这位昔日的血族竟违抗卡帕多修斯的旨意，便因他的傲慢发起攻击。拉撒路虽得胜，却选择更深地遁世隐居。\n近日有流言称，他再遭卡帕多西亚的子嗣（尤其是康斯坦西娅）袭击并陷入[Glossary('蛰眠','game_concept_torpor_desc')]。在其缺席期间，教团事务由他的左膀右臂安琪莉柯执掌。"
 podintroductions.317.a: "因知晓真相而受迫害"
 podintroductions.318.desc: "奥克塔维奥出生在现在被称为匈牙利的土地上，当时罗马军团建造了阿昆库姆。作为一个凡人萨满时，他不知怎么地接触到了库帕拉的黑暗内心，变得疯狂起来。他给自己取名奥克塔维奥，因为他坚信八个预兆预示着库帕拉的觉醒和恶魔将统治整个世界。由于在被污染的祖国土地上度过了几个世纪，奥克塔维奥变得更加疯狂，他捕捉凡人（以及他能抓到的任何该隐之子），与他们玩自己精心设计的“游戏”。然后把他们献祭给库帕拉（究竟是为了帮助恶魔还是束缚他，就连奥克塔维奥自己都不知道）。\n他正在策划一个成神的阴谋。通过这种方式，他希望获得足够的力量来直接对抗库帕拉。他寻求凡人的崇拜，在自己周围创造了一个邪教。崇拜奥克塔维奥的人称他为哈夫纳，认为他是一位古老的马扎尔神。他不在乎他们给他的尊贵头衔，只要他们分享他们的血液并向他服从。他计划采取行动反对文塞尔王子，或者支持他。当脑子里充满预言时，他很少能确切地记得这些晚上的计划是什么。\n奥克塔维奥听到了他脑海中恶魔的声音。他知道总有一天他会崛起统治地球。八个伟大的迹象预示着库帕拉的觉醒，奥克塔维奥告诉其他人这些迹象是什么。与此同时，他决定成为神，这样他就可以对抗库帕拉，并试图通过神圣的奇迹说服别人他确实是神圣的。"
 podintroductions.318.a: "崇拜我吧！我会保护你们所有人！"
 podintroductions.319.desc: "第三该隐的使徒是该隐异端的一个分支，该异端在1000年左右的某个时候脱离了挪得教区。其领导人认为，当时的挪得大主教威尼斯的纳尔塞斯过于关注世俗事务，而对其信徒的精神需求关注不够。像几个凡人天主教修道会一样，他们是一支信仰内的改革运动，相信他们简单而朴素的方式能够激励其他异端放弃懒惰的挪得教区，并与他们一起为吸血鬼弥赛亚的到来铺平道路。\n这个团体的葡萄牙分支，由阿斯图里亚的该隐之子巴雷斯奎达领导，他认为葡萄牙国王桑丘是第三该隐。1211年他的去世对他们来说是一个打击，尽管巴雷斯奎达的一些追随者公开怀疑国王的死是否只是为他最终荣耀归来铺平道路的诡计。他们知道没有该隐之子初拥过桑丘，这只会坚定他们的信念。\n这种热情，再加上目前主流该隐教会的崩溃，使使徒在葡萄牙夜间政治中成为一个令人惊讶的强大派系。"
 podintroductions.319.a: "属于他的夜晚即将到来。"
 podintroductions.224.g: "夺取你能带走的一切，逃离睿魔尔潜在的怒火。"
 podintroductions.224.g.tt: "摆脱统治的束缚，畏惧旧主的愤怒，或许你将在别处的孤独中找到安宁，甚至有一天归来，为你的石像鬼同族带来自由。"
 podintroductions.500.desc: "散落四方的犹太人翘首期盼弥赛亚——大卫之子降临之日。他将率领浩荡大军，收复应许之地，引领我们结束漫长流亡，重归故土。他将继承大卫的衣钵，成为我们的君王，而我们这些审判官将成为他在漫漫长夜中的守护者。\n当他人展望未来时，我们之中许多人却回望过去。先是所罗门，后是其子米拿现，都曾试图在阿马迪亚解放我们的同胞。令人痛心的是，所罗门战死沙场，米拿现遭背叛陨落，留下我们继承他们的遗志。然而，关于这份遗产的本质，我们内部存在分歧。有人说所罗门自称弥赛亚，有人则指向米拿现。还有人认为弥赛亚此刻就在我们中间，或尚未降临。\n黑夜中的势力利用这场神学辩论分裂我们，挑动内斗——正如他们千百年来所为。若想击退黑夜，我们必须团结在唯一的遗产、唯一的未来愿景之下。\n随着您的导师泽维尔在近期狩猎中身亡，您已继任为我们领袖，此刻正是解决此事的良机。向阿多乃祈祷吧，愿您关于祂受膏者的抉择能蒙神悦纳。"
 podintroductions.500.a: "所罗门是弥赛亚，大卫之子"
 podintroductions.500.b: "米拿现是弥赛亚，大卫之子"
 podintroductions.500.c: "我才是真正的弥赛亚，大卫之子！"
 podintroductions.500.d: "弥赛亚，大卫之子尚未降临"
 house_menahemites_shlomo_modifier: "所罗门的遗产"
 house_menahemites_shlomo_modifier_desc: "尽管可能有人对预言另有解读，但所罗门确实是大卫之子。或许他未能在有生之年完全继承大卫的衣钵，但他将通过我们完成使命。他将我们凝聚在一起，而我们将完成他的目标。团结一致，时机成熟时，我们必将夺回家园。"
 house_menahemites_menahem_modifier: "米拿现的遗产"
 house_menahemites_menahem_modifier_desc: "尽管可能有人对预言另有解读，但米拿现确实是大卫之子。或许他未能在有生之年完全继承大卫的衣钵，但他将通过我们完成使命。他教会我们如何辨识并抗击真正的敌人。我们斗志昂扬，整装待发，誓将黑夜驱散。"
 house_menahemites_elior_modifier: "埃利奥尔的遗产"
 house_menahemites_elior_modifier_desc: "那些质疑者说得对，所罗门和米拿现确实都不是预言中的大卫之子弥赛亚。虽然他们并非弥赛亚，但他们团结了我们的人民，让真正的弥赛亚——埃利奥尔得以崛起。他于基甸逝世之日诞生；他继承了大卫的衣钵；而他的遗产将引领我们前行。我们屹立不倒，随时准备战斗。"
 house_menahemites_future_modifier: "预兆之盼"
 house_menahemites_future_modifier_desc: "大卫之子弥赛亚终将降临。他将继承大卫的衣钵，驱逐我们的敌人，召唤流散的族人归乡，引领我们进入新的纪元。我们将加速他的到来，抵御黑夜可能抛向我们的一切威胁。我们坚如磐石，为那即将降临者而高举利刃。"
 podintroductions.2001.t_revenants: "$podintroductions.2001.t_ghouls$"
 podintroductions.2001.a_revenants: "让我们来谈谈遗传血仆的主要机制……"
 podintroductions.2003.t_revenants: "遗传血仆指南"
 podintroductions.2003.desc_ghoul_revenants: "你既是$POD_splat_ghoul$也是$POD_splat_revenant$。#underline;TOOLTIP:podintroductions.2003.desc_revenants 请将鼠标悬停于此#!，查看遗传血仆介绍。\n\n$podintroductions.2003.desc_ghouls$"
 podintroductions.2003.desc_revenants: "首先，推荐在熟练掌握$POD_splat_vampire$的机制后再尝试游玩$POD_splat_ghoul_plural$和$POD_splat_revenant_plural$，因为它们都使用类似的机制，但对于“黑暗仆从”来说，可操作性更少，难度更大。此篇介绍将只谈与吸血鬼主要机制的具体出入。\n\n其次，不建议在当前模组阶段游玩$POD_splat_revenant_plural$。$POD_splat_vampire_plural$和$POD_splat_ghoul_plural$均获得了大量关注，而$POD_splat_revenant_plural$则未曾。\n\n遗传血仆的游玩方式与$POD_splat_vampire_plural$不同，因其本质上属于凡人——遗传血仆并非不朽者，若无干预终将寿尽而亡。\n\n遗传血仆的核心机制是繁衍，因其子嗣亦可能成为遗传血仆，并能或者继承父母的，或者随机获得[Glossary('血律','game_concept_discipline_desc')]。\n\n与[ghouls|E]类似，遗传血仆同样受[ghoul_discipline_limit|E]限制，但表现形式不同：遗传血仆无法自然获得进阶[Glossary('血律','game_concept_discipline_desc')]特质。"
 podintroductions.357.t: "完美骑士"
 podintroductions.357.desc: "Deceitful Godewin, you are the very image of chivalry to the Kindred of France. You carry yourself with the grace of the ancient Merovingian kings from whom you claim descent, while planning the Grand Tragedy in secret. Your deception so far has been very successful, with Salianna herself claiming you to be the 'only true vampire knight in France'.\n\nWhile the eyes of others may see the rot beneath your shining armor, you have done well in blinding the largest powers of the region, Salianna and Geoffrey du'Temple. They believe you are a paragon of virtue. It will be fun breaking them."
 podintroductions.357.a: "The Grand Tragedy needs a grand leading man."
 podintroductions.358.t: "Burden of an Artist"
 podintroductions.358.desc: "Baron Volgirre, you are surrounded by fools. The sycophants and the bleeding hearts that surround your domain look upon your exquisite works-the beautiful paintings on flesh and the melody coming from the cut throats of your muses-and call it 'monstrous'. Their lack of artistry threatens your grip on your lands.\n\nAs annoying as it is, they cannot be ignored. As one that rules more openly over the local mortals, your coffers are richer than most, but that alone cannot keep you protected.\n\nYour liege, Isouda de Blaise, is a woman of commendable cruelty. While still far too soft-hearted for your elevated tastes, she shows undeniable promise. A generous gift from your vaults may buy you her protection and friendship, or you could hold onto it, and keep yourself safe relying on your wits alone."
 podintroductions.358.a: "Isouda will appreciate my patronage."
 podintroductions.358.b: "I require only my own brilliance!"
 volgirre_intro_tooltip: "You will form an alliance with your liege."