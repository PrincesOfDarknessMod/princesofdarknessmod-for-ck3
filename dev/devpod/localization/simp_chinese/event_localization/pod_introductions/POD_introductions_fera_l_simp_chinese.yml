l_simp_chinese:
 podintroductionsfera.2.t: "赞美太阳！"
 podintroductionsfera.2.desc: "在毁灭性的剥皮瘟疫之后，日耀族群可能是西欧幸存的最强大的狼人前哨。然而，其创始人之后的继任并不顺利，而且是本无缘的局外人，黑怒的海伦，成为了圣地的领袖。\n不过，这还是可简单处理的部分。邻近的吸血鬼已经迅速地扑向衰弱的族群，并占领了其南部的大部分领土。如果海伦想作为一个传奇人物被人们记住，她就必须在附近强大的吸血鬼和裁判官去发动变乱之前，迅速稳固她周围的环境。"
 podintroductionsfera.2.a: "我们将重新铸就我们的荣耀。"
 podintroductionsfera.3.t: "不绝如缕"
 podintroductionsfera.3.desc: "狼人在伊比利亚的存在几乎消失了。曾经强大的星域族群在与邻近的圣雅各伯骑士团的战争中遭到了毁灭性的打击，当尘埃落定时，唯一的赢家是吸血鬼。随着大多数领导人和战士的死亡，族群就像被摧毁了一样，直到一个奇怪的外来者，啮骨者的露西尔出现。\n这个狡猾的骗子设法用错综复杂的计划迷惑了蚂蟥和裁判官，使星域得以稍稍恢复。令所有人惊讶的是，甚至惊讶到她自己，即她成为了被围困的幸存者的实际统治者。尽管如此，即使取得了这些小胜利，她的处境也几乎是绝望的。她的伎俩和诡计是否足以拯救伊比利亚狼族？"
 podintroductionsfera.3.a: "逆境求生？"
 podintroductionsfera.4.t: "后日谈"
 podintroductionsfera.4.desc: "在整个斯堪的纳维亚，芬里尔仔兽高呼他们最近对可恨的沃坦（又称奥丁）的胜利。但即使是他们也知道，这场胜利让他们付出的代价远远超过了他们能够承受的范围。随着他们最好的战士和战争领袖的死亡和离去，一个未经检验的领袖已经崛起，奥丁的子民正在迅速集结到南方，为他们受诅的神报仇。\n再往东，白海族群的盖亚之子观察着局势，担心这场战争也会很快吞噬他们。他们应该犹豫是在附近的俄罗斯寻找新的朋友，还是全力支持芬里尔仔兽所进行的无望战争？他们的答案可能会改变斯堪的纳维亚狼人的命运。"
 podintroductionsfera.4.a: "没有胜利的滋味"
 podintroductionsfera.5.t: "凯尔特的最后一战"
 podintroductionsfera.5.desc: "芬尼安部族一直是不列颠群岛的一支强大力量，但却被剥皮瘟疫大幅削减了，使它对被称为密特拉的强大吸血鬼敞开大门。他们在威尔士勉强支撑着，在一位久经考验和富有魅力的领导人，布拉达王的领导下，在狂海圣地重新集结。\n尽管他令人尊敬，但许多人都在想，也许即使是他没法对这种绝望的局面做些什么。也许凯尔特人的时代真的结束了？或者，这将是芬尼安最伟大的故事的开始，即他们再征服自己家园的光荣故事？"
 podintroductionsfera.5.a: "至少，这将是一个值得讲述的故事"
 podintroductionsfera.6.t: "狼之地"
 podintroductionsfera.6.desc: "俄罗斯和大草原仍然是一片未被开发的土地，狼人在这里处于强势地位。来自强大的新月族群，尤里·特瓦里维奇统治着银牙，是其部族的典范。他对抗芭芭雅嘎的受诅的影幕的事迹已经成为传奇。\n再往东，赤爪已经撤退到冬林圣地，舔舐他们的伤口，因为他们已经被剥皮瘟疫伤害得相当严重。\n最后，在南部，影爵仍在与棘秘魑展开永恒的战争。他们也被剥皮瘟疫削弱了，被破退后，但任可以从正在进行的棘秘魑/睿魔尔战争中获益，以恢复其领土损失。"
 podintroductionsfera.6.a: "如果我们能团结起来……"
 podintroductionsfera.7.t: "十字军狼群"
 podintroductionsfera.7.desc: "亚科是人类监护者的土地，这个奇特的部族在人类的城市中感到自在。不过这并不意味着他们比其他狼人少了什么，最近为争夺光誓圣地的领导权而发生的无情战争就说明了这一点。随着尘埃落定，目前是海外帝国的女士伊萨博·杜·洛朗担任着阿尔法。\n由于专注于这场内部冲突，人类监护者对该地区的吸血鬼带来的日益增长的威胁视而不见。这种威胁，如果不迅速而果断地处理，可能会给城狼带来灭顶之灾。"
 podintroductionsfera.7.a: "光明之誓破灭了？"
 podintroductionsfera.8.t: "远离埃及"
 podintroductionsfera.8.desc: "自从他们败给可恨的埃及“神”赛特后，寂静漫游者就一直在他们永生的统治者——智慧的乌普奥特身后逃亡。根据观占迹象和预言，他们在马拉喀什附近发现了卜塔之轮，并从那时起一直忙于为自己夺取周围的地区。\n寂静漫游者人数不多，也不是最善战的狼族，但由于有了新的目标感和他们尊敬的阿尔法的耐心领导，他们终于又找到了希望。有些人甚至梦想着有一天能再次见到埃及……"
 podintroductionsfera.8.a: "新希望"
 podintroductionsfera.9.t: "世界之巅"
 podintroductionsfera.9.desc: "远离狼国的其他人，小小的星占部族一直在喜马拉雅山上繁衍生息。他们天性沉思、耐心，一直满足于在相对平静的环境中生活。然而，目前这种状态不可能永远持续下去。\n最近，一个强大的邪灵的袭击被聪明的尚卡尔视为一种预兆。如果星占一直与世隔绝，拒绝与外界的任何联系，等待他们的只有灭亡。带着一种混合着恐惧和好奇的感觉，星占现在数个世纪以来第一次向外看去。等待他们的是什么？"
 podintroductionsfera.9.a: "一整个新世界可供探索"
 podintroductionsfera.100.t: "欢迎来到黑暗部族"
 podintroductionsfera.100.desc: "$POD_generic_introduction$"
 podintroductionsfera.100.a: "让我们来谈谈狼人的主要机制……"
 podintroductionsfera.100.b: "……或狼人的继承"
 podintroductionsfera.100.c: "关于部族的资料"
 podintroductionsfera.100.d: "关于部族的资料"
 podintroductionsfera.103.t: "魂怒时间"
 podintroductionsfera.103.desc: "狼人与其他角色有几个关键的区别。首先，他们具有部落地产，并且大多不在乎，或者说主动想要降低发展度，以能建他们的建筑。这些建筑需要花费声望，就像狼人社会和机制中的大多数东西一样。\n虽然狼人的战斗力很强，而且相当持久，但他们不是永生的，必须为他们的继承做相应的计划。每个狼人都有“血种”（描述他在原始觉醒之前的身份）和“月兆”（描述原始觉醒发生在哪个月象之下）。这两者决定了每个狼人可以采用哪些专属生活方式。他们通过进行诸灵任务（次要决议）来获得相关经验。\n最后，请注意，所有狼人都能进行劫掠，无论他们的宗教为何。"
 podintroductionsfera.103.a: "关于继承呢？"
 podintroductionsfera.103.c: "关于部族的资料"
 podintroductionsfera.103.h: "回到开头"
 podintroductionsfera.104.t: "月光之爱"
 podintroductionsfera.104.desc: "狼人有着被命名为同伴和家人。任何由狼人、兽嫡（或两者的结合）所生的孩子也会诞为兽嫡。然后，兽嫡有可能在青春期经历原始觉醒。\n这是兽嫡成为狼人的经历（在游戏中表现为兽嫡特质被狼人特质所取代）。如果你的继承人恰好是兽嫡（并且没有经历原始觉醒），这将大大削弱你的领地，因为一些建筑将被禁用，你将无法点专属生活方式。虽然这将是一种削弱，但如果你提前计划好这种情况的发生，你还是可以通过另一狼人世代来恢复"
 podintroductionsfera.104.a: "回到初始选项"
 podintroductionsfera.104.c: "关于部族的资料"
 podintroductionsfera.105.t: "迄今为止的过往……"
 podintroductionsfera.105.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在玩《黑暗时代：狼人》。狼人（或狼族）是盖亚（地球之灵）的拥护者。他们易怒和轻率行事，但仍然会勇敢和勤奋地完成使命。狼族按部族划分，每个部族都有自己的文化和独立的特点。他们共同组成了“狼国”。\n然而，在1230年，这个统一的狼国充其量只是一个假象。部族之间的不和，加上毁灭性的剥皮瘟疫和人类文明的发展，使得狼人被严重削弱并退缩到日益减少的森林中。\n如果不尽快采取果断行动，收复一些失地，盖亚的勇士们可能很快就会成为一个传说。"
 podintroductionsfera.100.f: "我想要知道更多"
 podintroductionsfera.110.t: "部族的秘密"
 podintroductionsfera.110.desc: "你还想知道哪些概念？"
 podintroductionsfera.110.a: "战群"
 podintroductionsfera.111.t: "战群"
 podintroductionsfera.111.desc: "[pack|E]是狼人文化的核心社会单位，代表着终身联合在一起的狼人，往往是为了实现一个伟大的追求或目的。\n在游戏中，你可以要求任何对你有50好感度以上的狼人成为你的[pack|E]成员。一旦这样做了，你就可以获得一个[journey|E]，允许你训练你的战群，使你自己和你的队友得到各种提升。\n一旦你的战群满员（你自己和其他四名成员），你可以选择一个战群图腾来保佑你的团队，代表一个强大的灵类给于你它的力量，以应对未来的考验。"
 podintroductionsfera.111.a: "回到开头"
 podintroductionsfera.200.a: "让我们来谈谈芭丝特的主要机制……"
 podintroductionsfera.200.b: "……或芭丝特的继承"
 podintroductionsfera.201.t: "猫子之秘"
 podintroductionsfera.201.desc: "芭丝特与其他角色有几个关键的区别。首先，他们具有部落地产，并且他们的大多数建筑不需要发展度。这些建筑需要花费声望，有些还需求由熟练的角色担任特定的宫廷职位。\n虽然芭丝特是强大而坚韧的战士，但他们不是永生的，必须为他们的继承做相应的计划。每个猫人都有“血种”（描述他们在原始觉醒之前的身份）。这些血种决定了每个芭丝特可以可以采用哪些专属生活方式。\n除了斯瓦拉以外，芭丝特对[umbra|E]的适应能力较差，需要他们的特质到达第二等级才能进入那里。\n最后，请注意，所有芭丝特都能进行劫掠，无论他们的宗教为何。"
 podintroductionsfera.202.desc: "芭丝特有名为兽嫡的同伴和家人（这是一个模组中的特质）。任何由芭丝特、兽嫡（或两者结合）所生的孩子也会诞为兽嫡。然后，兽嫡有可能在青春期经历原始觉醒。\n这是兽嫡成为芭丝特的经历（在游戏中表现为兽嫡特质被芭丝特特质所取代）。如果你的继承人恰好是兽嫡（并且没有经历原始觉醒），这将大大削弱你的领地，因为一些建筑将被禁用，你将无法点专属生活方式。虽然这将是一种削弱，但如果你提前计划好这种情况的发生，你还是可以通过另一芭丝特世代来恢复。"
 podintroductionsfera.203.desc: "《$pod_wod$》是一个塑造了超过三十多年的世界观，其内容包含在上百本书籍和其他各种形式的媒体中。其主要设定是，在我们的世界中，多个超自然生物派系在表世界下相互作用，创造了一个充满阴谋和故事的里世界。\n你正在扮演芭丝特。芭丝特（或猫人）是盖亚（地球之灵）的眼睛和耳朵。他们多变且个人主义，尽管如此，他们仍被认为是仅次于狼人的第二地球$glossary_fera$群体。猫人按部族划分，每个部族都有自己的文化和独立的特点。他们共同组成了“猫国”。\n然而，在1230年，这个统一的猫国充其量只是一个假象。在与狼人进行魂怒之战后，芭丝特仅在没有狼人的地区繁荣，主要是在非洲和印度。现在，大多数部族之间没有联系，有些甚至被认为早已灭绝。如果要让芭丝特重新团结并变得强大，将需要大量的努力和一位出色的领袖。"
 podintroductionsfera.205.desc: "荣耀战群是芭丝特文化的核心社会单位，代表着终身联合在一起的人，往往是为了实现一个伟大的追求或目的。\n在游戏中，你可以要求任何对你有50好感度以上的芭丝特成为你的[pride|E]成员。一旦这样做了，你就可以获得一个[journey|E]，允许你训练你的战群，使你自己和你的队友得到各种提升。\n当你的战群满员（包括你自己和四名其他成员）时，你可以选择一个战群图腾来祝福你的团队，象征一个强大的灵体为你们提供力量，以应对未来的考验。"
 podintroductionsfera.300.a: "让我们来谈谈莫科莱的主要机制……"
 podintroductionsfera.300.b: "……或莫科莱的继承"
 podintroductionsfera.300.c: "莫科莱的背景"
 podintroductionsfera.301.t: "龙之记忆"
 podintroductionsfera.301.desc: "莫科莱与其他种族有几个关键区别。首先，他们居住在部落领地中，并且主动降低发展度以便使用他们的建筑。\n莫科莱的寿命非常长，而且随着阶位的提升，寿命还会进一步延长。他们是一个濒临灭绝的种族，起初很难扩张王朝。他们的龙梦[journey|E]对他们的力量至关重要，因为它有助于解锁更强大的[perks|E]。\n莫科莱在穿越[umbra|E]时，也必须时刻警惕[innocents|E]。"
 podintroductionsfera.302.desc: "莫科莱拥有名为兽嫡（模组中的一个特性）的同伴和家庭。任何由莫科莱、兽嫡（或两者兼有）所生的孩子，出生时也都会是兽嫡。之后，这些兽嫡有一定几率在成年时经历原始觉醒。\n拥有这经历的兽嫡才算是第一次真正成为莫科莱（在游戏机制中，兽嫡特性会被莫科莱特性取代）。并非所有兽嫡都会成为莫科莱，但如果他们的父母中有一位是玩家角色，那么他们成为莫科莱的几率会大大增加。"
 podintroductionsfera.303.desc: "$pod_wod$是一个已经运行超过30年的宇宙，拥有数百本书籍和其他媒体作品对其进行描绘。其核心设定是，在我们的世界里，多个超自然生物派系在地表之下相互作用，创造了一个充满阴谋和故事的地下世界。\n你扮演的是莫科莱。莫科莱（或称蜥蜴人）是盖亚（大地之灵）的记忆，也是史前恐龙诸王的后裔。由于数量稀少，且与占主导地位的狼人彼此敌视，他们成为了一个规模小且濒临灭绝的$glossary_fera$族群。他们被不同的支流所划分，每个支流都有其独特的文化和特征。他们共同的信仰是龙梦，这个词用来描述他们对遥远过去的记忆，以及不惜一切代价守护这些记忆的决心。\n1230年，自从莫科莱在与狼人的魂怒之战后退隐以来，情况并没有太大改变。它们专注于自己称作巢群的家族单元，传承族群血脉，并将历史事件记录下来以传世长存。然而，只有愚人才会将这种安于现状的天性误解为软弱。曾几何时，这些蜥蜴是王者，它们当然懂得如何捍卫自己的王位。"