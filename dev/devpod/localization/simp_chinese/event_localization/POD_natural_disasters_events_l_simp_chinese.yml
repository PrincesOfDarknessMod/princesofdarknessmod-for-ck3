l_simp_chinese:
 POD_natural_disasters.0003.t: "天气迹象"
 POD_natural_disasters.0003.desc: "你预测出在[task_contract.MakeScope.Var('target_title').Title.GetName]在[GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(task_contract.MakeScope,'time_remaining'))]后将有一场可怕的灾难。\n\n你会干涉么？"
 POD_natural_disasters.0101.desc_flood: "[target_title.GetNameNoTierNoTooltip]的大部分地区被冲袭。"
 POD_natural_disasters.0101.desc_earthquake: "[target_title.GetNameNoTierNoTooltip]的大部分地区被地震摧毁。"
 POD_natural_disasters.0101.desc_storm: "龙卷风袭击了[target_title.GetNameNoTierNoTooltip]。"
 POD_natural_disasters.0101.desc_stopped: "幸运的是，某人的天气魔法成功在灾难造成伤亡前将其遏制住。"
 POD_natural_disasters.0101.desc_aggraved: "突然间，灾难变得更强大了。没人能够计算出有多少人丧生。"
 POD_natural_disasters.0101.desc_default: "无数的人在这场灾难中丧生。"
 POD_natural_disasters.0101.option.a: "天有不测风云。"
 POD_natural_disasters.0005.t: "末日將至"
 POD_natural_disasters.0005.desc: "你到达了[task_contract.GetLocation.GetName]\n\n如果你什么都不做，接下来的[task_contract.MakeScope.Var('disaster_type').GetFlagName|l]将会对整个[task_contract.MakeScope.Var('target_title').Title.GetName]造成巨大破坏。\n\n现在，你会怎么做？"
 POD_natural_disasters.0005.a: "我将会用天气魔法来阻止[task_contract.MakeScope.Var('disaster_type').GetFlagName|l]"
 POD_natural_disasters.0005.b: "相反，我将试着#P 增强#!这场灾难！"
 POD_natural_disasters.0003.desc.coterie: "你的[GetPlayer.Custom('PODCoterieNoTooltip')]成员[coterie_member.GetFirstNameNicknamed]带着消息前来。\n\n[coterie_member.GetHerHis|U]气象预报说在[GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(task_contract.MakeScope,'time_remaining'))]后将有一场危险的灾难发生在[task_contract.MakeScope.Var('target_title').Title.GetName]。\n\n你会干预吗？"
 POD_natural_disasters.0003.tt: "一个#bold [task_contract.GetType.GetName]#![task_contract|E]已经在[task_contract.GetLocation.GetName]发布。"
 POD_natural_disasters.0005.c: "我将[task_contract.MakeScope.Var('disaster_type').GetFlagName|l]#X;bold 更具破坏力！#!"
 POD_natural_disasters.0005.d: "我将为凡人提供援助。"
 POD_natural_disasters.0005.e: "我将竭力#P 帮助#!凡人们。"
 POD_natural_disasters.0005.f: "我改变主意了"
