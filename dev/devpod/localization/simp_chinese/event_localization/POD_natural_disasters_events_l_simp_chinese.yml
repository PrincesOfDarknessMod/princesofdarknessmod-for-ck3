 POD_natural_disasters.0101.desc_great_relief: "由于一位慷慨的捐助者，没有人丧生，并且重建工作正在顺利进行。"
 POD_natural_disasters.0101.desc_relief: "大多数凡人都设法及时搬迁，并且灾难对基础设施的破坏很小。"