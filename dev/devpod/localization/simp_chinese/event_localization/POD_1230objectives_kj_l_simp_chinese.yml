l_simp_chinese:
 pod1230objectives_kj.1.t: "心法灵光"
 pod1230objectives_kj.1.desc: "$pod_kueijin$因其本质，视己身为根本之不洁。然其仍承天命而行。心法指引她寻得此天命，助其超脱原初之态。智慧——及其渴求——常随年岁增长，初为$pod_kueijin$时，她往往沉溺凡俗琐事。因新得之力而骄，她通常重返故土，了结旧怨，割据一方。然时移世易，她终悟凡尘之争如散米千粒——琐碎难拾，乏味无益。\n活得够久以品味永生之$pod_kueijin$，终会追求远超凡俗之力。心路之途需凡人百世光阴；途中灵光——称为顿悟——如夜中明灯，催其前行。\n顿悟乃灵光乍现，诸事豁然开朗。此闪光昭示心法修行之进境。天命得道者，知如何辨识并把握此珍贵（却易逝）之瞬。\n此刻非其时。"
 pod1230objectives_kj.1.a: "是时候了"
 pod1230objectives_kj.1.b: "此刻非其时"
 pod1230objectives_kj.2.t: "[Glossary('云开雾散','podgloss.hundredclouds')]"
 pod1230objectives_kj.2.desc: "心法至高境界，恰如山中云雾水滴般无形，亦似夜色气息般难述。$pod_kueijin$需历凡人百世，方能窥见[Glossary('云开雾散','podgloss.hundredclouds')]之玄妙。此前，纵然此人能诵经持咒，言说公案，呼风唤雨，亦未得真谛。\n“[Glossary('云开雾散','podgloss.hundredclouds')]”乃终极平静之喻，是那连天命职责都可放下的超然之境。那“云”并非力量，虽浅薄者或如是观；亦非幻象，虽愚昧者或如是惑。[Glossary('云开雾散','podgloss.hundredclouds')]（智者知其为象征，非实体）者，临神性之门，却驻足引渡后人。\n如云似雾，[Glossary('云开雾散','podgloss.hundredclouds')]缥缈无形。无经文可纳其神髓，无教诲可传其真义。有言达此境者已非$pod_kueijin$——或已成终极之$pod_kueijin$亦或二者皆是。而众神，始终缄默无言。\n须知，须弥山坡，陡峭非常。"
 pod1230objectives_kj.2.a: "重归完美之时已至"
 pod1230objectives_kj.3.t: "退步"
 pod1230objectives_kj.3.desc: "$pod_kueijin$——尤以年轻者为甚——或行自私之举，蒙蔽顿悟。恶魔嗜此过，伺机诱之。若耽于凡俗之欲，或永失开悟。先贤有言：不能超脱琐碎者，当永溺其中！\n然人非完璧。纵伟大老祖亦有失察天命之时。唯当跌倒者忘却长生可再试，方为真败。"
 pod1230objectives_kj.3.a: "从此败中习而进"
 pod1230objectives_kj.1.b.tt: "#X @icon_warning!注意：#italic 任何#![mental_break|E]都会导致你堕入[GetTrait('dharma9').GetName(GetPlayer)]#!"
 pod1230objectives_kj.4.t: "迈向终局"
 pod1230objectives_kj.4.desc: "轮回无法避免。\n\n尽管许多人曾希望他们的行动能阻止第五纪元的到来，但事与愿违。无论是皇朝的崩塌、[Glossary('安答','podgloss.anda')]与[akuma|E]的崛起，还是其他完全无关的因素，无人能确知原因。但所有人都能感受到——这是[Glossary('魔皇','podgloss.demonemperor')]登临创世主之位前的最后一个纪元。\n\n一种绝望与忧郁的气息笼罩着中原的超自然存在，他们不得不直面自身的失败。然而，仍有许多人拒绝放弃。新的政治组织有待建立，新的力量有待发掘，新的觉悟有待实现。\n\n第五纪元已然开启，这将是一个缓慢滑向终末的时代。抑或是一缕微弱希望意外闪耀的时刻。"
 pod1230objectives_kj.4.a: "开始了！"
 wheel_ages_lose_dharma_tt: "所有[Glossary('心法','podgloss.dharma')]修习者（[akuma|E]除外）在未来50年内提升心法的难度将增加。"
 wheel_ages_lose_godbodies_modifier_tt: "圣体，古代$pod_kueijin$所执掌的权柄残响——如今已彻底湮灭。"
 wheel_ages_akuma_buff_modifier_tt: "[akuma|E]因纪元之轮而气焰更盛。他们获得强力增益，并在未来50年内更具侵略性。"
 wheel_ages_political_instability_tt: "中原所有拥有领地的统治者将面临政局动荡（[akuma|E]除外）。"
 political_instability_modifier: "政治动荡"