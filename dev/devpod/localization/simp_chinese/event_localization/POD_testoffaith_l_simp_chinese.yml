 POD_test_of_faith.101.t: "考验成功"
 POD_test_of_faith.101.desc: "你成功了。现在你差不多完成了。祂是你应许的，有德之道才是对的。你想要改善你生活和行为的哪一部分？"
 POD_test_of_faith.101.option.a: "心胜于物"
 POD_test_of_faith.101.option.a.tt: "你变得忠贞"
 POD_test_of_faith.101.option.b: "无论在什么情况下我都会冷静"
 POD_test_of_faith.101.option.b.tt: "你变得冷静"
 POD_test_of_faith.101.option.c: "分享即是关怀"
 POD_test_of_faith.101.option.c.tt: "你变得慷慨"
 POD_test_of_faith.101.option.d: "我会容忍的"
 POD_test_of_faith.101.option.d.tt: "你变得宽宏大量"
 POD_test_of_faith.101.option.e: "我不比别人更好"
 POD_test_of_faith.101.option.e.tt: "你变得谦卑"
 POD_test_of_faith.101.option.f: "你知道什么时候该适可而止"
 POD_test_of_faith.101.option.f.tt: "你变得节制"
 POD_test_of_faith.101.option.g: "我将休于天堂"
 POD_test_of_faith.101.option.g.tt: "你变得勤勉"
 POD_test_of_faith.201.t: "考验失败"
 POD_test_of_faith.201.desc: "你失败了。你的注意力还不够集中。也许你应该稍后再来？\n爬不上山顶并不可耻，可耻的是一开始就拒绝尝试。"
 POD_test_of_faith.201.option.a: "我还没准备好"
 POD_test_of_faith.201.option.a.tt: "你失败了"