l_simp_chinese:
 inquisition_full_support_modifier:0 "全力教宗援助"
 inquisition_full_support_modifier_desc:0 "你有了教宗的全力支持，因此有了教会本身的支持。荣耀归于上帝！"
 PODask_pope.1.t:0 "圣下：额我略九世"
 PODask_pope.1.desc:0 "暗影裁判所在很多方面都是天主教会的直接延伸，其大部分资金和支持直接来自天主教会。教宗额我略是这项功业的狂热倡导者，以至于他正在考虑建立一个“公开”裁判所，以便在未来处理不那么超自然的威胁。拥有如此强大的个人的直接对接，对于正在成长中的暗影裁判所来说，是一个不可轻言浪费的恩惠。\n许多裁判官担心额我略的继任者可能不会那么热衷于支持你的努力，也许是由于超自然的干扰，或者仅仅是他们不感兴趣（或不相信威胁）。如果这种情况发生，很可能整个组织都会受到影响。裁判官计划在短期内尽可能地做能做到的，并为额我略的健康长寿祈祷。"
 PODask_pope.1.a:0 "圣下万岁！"
 PODask_pope.3.t:0 "白烟，白云"
 PODask_pope.3.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n枢机主教们这次选择得很好，新教宗完全支持暗影裁判所，利用他所有相当大的影响力，确保你们不会缺少任何可以帮助你们对抗真正威胁的东西。"
 PODask_pope.4.t:0 "白烟，晴空"
 PODask_pope.4.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗选择不以任何形式干涉暗影裁判所的事务。虽然你希望罗马能提供更明确的支持，但至少没有对你的命令进行反对。目前，这已经足够了。"
 PODask_pope.4.a:0 "圣下万岁。"
 inquisition_no_support_modifier:0 "教宗禁令"
 inquisition_no_support_modifier_desc:0 "你们不再是天主教会的正式成员。只有少数教廷的高级成员仍然支持你们。"
 PODask_pope.5.t:0 "白烟，黑云"
 PODask_pope.5.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n令人担忧的是，当新教宗被告知暗影裁判所的存在时，他感到非常震惊。教皇指责这是一个肮脏的秘密，他想在他的任期内摆脱这个秘密，他已经正式撤回了教会的所有支持。这是一个可怕的情况，但可能有一个解决方案：一些枢机主教仍然支持你的事业，如果你提供适当的支持，他们仍然可以保持你和教会之间的沟通渠道。"
 PODask_pope.5.a:0 "圣下万岁……"
 PODask_pope.5.b:0 "我们知道的更清楚。"
 PODask_pope.6.t:0 "白烟，浮影"
 PODask_pope.6.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗是一个有灵性倾向的人，对你们的组织等世俗事务不怎么关心。似乎枢机主教在他的任期内会有更大的重要性，这对你来说是一个令人担忧的消息，因为他们经常是超自然影响的目标。你可以尝试对他们展开全面调查，但这势必会引起一些人的不满。"
 PODask_pope.6.a:0 "让我们只针对真正的腐败者。"
 PODask_pope.6.b:0 "异端将被清除！"
 PODask_pope.6.effect.success.desc:0 "成功的调查！"
 PODask_pope.6.critical.failure.effect.desc:0 "处处受阻……"
 PODask_pope.7.t:0 "白烟，白影"
 PODask_pope.7.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n为了帮助暗影裁判所，新教宗正在计划对其他信仰和他们自己的猎人组织进行外交宣传。显然，你被期望加入，并帮助消除他们与天主教会之间过去的误解，以使这一过程顺利进行。圣下有提供帮助的倾向，所以你也可以说服他，这将是一个徒劳的努力，而把资金转到其他地方。"
 PODask_pope.7.a:0 "一个绝妙的想法，圣下。"
 PODask_pope.7.b:0 "那些异端不能被信任。"
 PODask_pope.7.effect.success.desc:0 "成功的谈判！"
 PODask_pope.7.critical.failure.effect.desc:0 "成功，但有代价。"
 PODask_pope.8.t:0 "白烟，金风"
 PODask_pope.8.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n虽然没有彻底敌视暗影子裁判所，但新教宗确信你们夸大了实际威胁。因此，他下令大量削减提供给你们的资金，这些资金帮助你们建立了大部分的实地工作。你将不得不审查你现有的所有进程，如果你想继续保持现在的状态，可能会做出一些艰难的削减。"
 PODask_pope.8.a:0 "是时候整顿了。"
 PODask_pope.8.b:0 "是时候削减开支了。"
 PODask_pope.8.effect.success.desc:0 "成功的整顿！"
 PODask_pope.8.critical.failure.effect.desc:0 "这让事情变得更糟了……"
 inquisition_disorganized_levies_modifier:0 "跃跃欲试又缺乏经验"
 inquisition_disorganized_levies_modifier_desc:0 "许多新兵正在加入这场美好的战斗。然而，他们的数量之多和完全没有经验造成了问题。"
 PODask_pope.9.t:0 "白烟，血风"
 PODask_pope.9.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗渴望帮助暗影裁判所，因此发出号召，让所有有能力的人加入你们的队伍，而不先通知你。这当然是出于好意，但这种姿态在你们的队伍中造成了相当大的混乱，因为这些新招募的人与你们期望的裁判所斗士的标准相差甚远。这将需要一些努力来解决。"
 PODask_pope.9.a:0 "是时候整顿了。"
 PODask_pope.9.b:0 "接纳所有人，以后再处理。"
 PODask_pope.10.t:0 "白烟，白风"
 PODask_pope.10.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗并不排斥暗影裁判所，但他对以他的名义进行的一些行动的道德性感到担忧。作为一个精明的神学家，他要求与你交谈，以帮助你们两个人评估这些结果是否真的值得付出威胁灵魂的代价。你显然相信答案是肯定的，但让圣下同意这一点可能比较困难。"
 PODask_pope.10.a:0 "辩论时间到。"
 PODask_pope.10.b:0 "圣下是对的，显而依然。"
 PODask_pope.10.effect.success.desc:0 "圣下同意！"
 PODask_pope.10.critical.failure.effect.desc:0 "我完了？"
 PODask_pope.11.t:0 "白烟，白雾"
 PODask_pope.11.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n新教宗并不争论暗影裁判所的重要性，而是担心它可能给他带来的公众形象影响。毕竟，你们的组织不在直接监督之下，随时都有可能走火入魔。由于对教会的影响将是可怕的，圣下要求你切断与他的大部分联系。这将意味着暗影裁判所将更加退居幕后，这可能是一把双刃剑。"
 PODask_pope.11.a:0 "圣下已经发话。"
 PODask_pope.11.b:0 "我们需要那些教会牵绊！"
 PODask_pope.12.t:0 "白烟，多云"
 PODask_pope.12.desc:0 "圣下最近去世了，留下受人尊敬的枢机主教们对圣彼得席位的下一任占有者作出选择。这是一个暗影裁判所密切关注的事件，不仅是为了天主教信仰，也是因为教宗的支持对该组织的长期健康发展是至关重要的。\n值得庆幸的是，新教宗支持暗影裁判所，尽管他似乎特别喜欢你的修会。接受他试图授予的众多头衔和其他表扬，肯定会对你的人产生良好的影响，但对你本人来说就不是那么回事了。"
 PODask_pope.12.a:0 "圣下过赞了。"
 PODask_pope.12.b:0 "这是团队的努力。"