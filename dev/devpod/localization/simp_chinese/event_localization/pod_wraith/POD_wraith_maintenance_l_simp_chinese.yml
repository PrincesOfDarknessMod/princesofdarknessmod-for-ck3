l_simp_chinese:
 POD_wraith_maintenance.1.t: "选择羁绊"
 POD_wraith_maintenance.1.desc: "选择羁绊是一个非常重要的选择，因为它会长期伴随着你，请明智地选择。\n\n仇恨——每次你杀死一个人，你都有X/5的机会获得执念伤并减轻压力\n爱——只要一个特定的（生成的）凡人还活着，每年都有X/5的机会减轻压力并获得执念\n贪婪——每次你获得一件宝物，你都有X/5的机会失去压力并获得悲伤\n创造力——每次使用制造面板进行制造时，你都有X/5的机会减轻压力并获得执念\n同情心——每当你得到一个[friend|E]，你都会失去压力，并根据束缚程度而获得执念\n欲望——每当你得到一个[lover|E]，你都会失去压力，并根据束缚程度而获得执念\n正义——每次你合法监禁某人，你都有X/5的机会失去压力，获得执念"
 POD_wraith_maintenance.1.a: "仇恨[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.b: "爱[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.c: "贪婪[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.d: "创造力[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.e: "同情心[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.f: "欲望[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.g: "正义[GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.11.t: "选择羁绊"
 POD_wraith_maintenance.11.desc: "你会给这个羁绊分配多少羁绊点数？"
 POD_wraith_maintenance.11.a: "1#weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.b: "2#weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.c: "3#weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.d: "4#weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.e: "5#weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.f: "返回"
 POD_wraith_maintenance.2.t: "恶化的[Fetters|E]"
 POD_wraith_maintenance.2.i: "一个随机的[Fetter|E]已经被选中……"
 POD_wraith_maintenance.2.desc: "控制黯影并不是一件好事，尤其是对于你的[Fetters|E]来说。黯影几乎总是自我毁灭性的，他们希望看到死灵同类失败并屈服于湮灭。最快的方法就是攻击幽灵的羁绊。"
 POD_wraith_maintenance.2.a: "“这感觉完全不同……”"
 POD_wraith_maintenance.2.b: "“不！我不会放弃的！”"