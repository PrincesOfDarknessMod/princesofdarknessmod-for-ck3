l_simp_chinese:
 POD_wraith_maintenance.21.t: "身无羁绊"
 POD_wraith_maintenance.21.desc: "你没有任何使你能被束缚在[skinlands|E]的[Fetters|E]，因此你被强制遣回了[dark_kingdom|E]。"
 POD_wraith_maintenance.21.option.a: "不！"
 POD_wraith_maintenance.21.option.b: "我的魄刚刚跟我分了？"
 POD_wraith_maintenance.22.t: "逃离幽冥"
 POD_wraith_maintenance.22.desc: "你被困在[yomi|E]很久了，期间一直以来被阎魔折磨着，但你认为你找到了逃脱的方法，并将能与你的魂再次团聚。"
 POD_wraith_maintenance.22.option.a: "我甚至可以跑的更远！"
 POD_wraith_maintenance.22.option.b: "就单单让我回到[underworld|E]吧。"