l_simp_chinese:
 POD_wraith_possession.100.t: "附身"
 POD_wraith_possession.100.desc: "[actor.GetTitledFirstName]尝试附身你。你察觉到你的身体部分开始自己动了起来，但这不应该。也许是时候叫驱魔师了？"
 POD_wraith_possession.100.option.a: "运用我的意志力去为我的身体而斗。"
 POD_wraith_possession.100.option.b: "抵抗入侵者。"
 POD_wraith_possession.100.option.c: "接受附身"
 POD_wraith_possession.200.t: "附身[recipient.GetFirstNameNoTooltip]中"
 POD_wraith_possession.200.desc: "是时候来掌控[recipient.GetTitledFirstName]的身体了，但是[recipient.GetSheHe]在抵抗。"
 POD_wraith_possession.200.option.a: "不管怎样还是继续。"
 POD_wraith_possession.200.a.tt_willpower: "[recipient.GetFirstNameNoTooltip]发挥了[recipient.GetHerHis]意志力来抵抗你的附身。"
 POD_wraith_possession.200.a.tt_fortitude: "[recipient.GetFirstNameNoTooltip]掌握着坚韧术$pod_discipline$并抵抗我的操控。"
 POD_wraith_possession.200.a.success.desc: "成功"
 POD_wraith_possession.200.a.tt_success: "[recipient.GetTitledFirstNamePossessive]的身体将是我的！"
 POD_wraith_possession.200.a.failure.desc: "失败"
 POD_wraith_possession.200.a.tt_failure: "[recipient.GetTitledFirstName]抵抗了我[possess|E][actor.GetHerHim]的尝试。"
 POD_wraith_possession.200.option.b: "发挥我的意志。所有凡人都只是我线下的木偶。"
 POD_wraith_possession.200.option.c: "放弃继续努力，我不再想要附身[recipient.GetHerHis]的身体。"
 POD_wraith_possession.200.option.c.tt: "附身将会失败。"
 POD_wraith_possession.300.t: "[recipient.GetFirstNameNoTooltip]的身体已被附身"
 POD_wraith_possession.300.desc: "你加强了你对[recipient.GetTitledFirstNamePossessive]的身体的掌控。他已经是你的傀儡了。"
 POD_wraith_possession.300.option.a: "正如其所应当。"
 POD_wraith_possession.400.t: "你被附身了"
 POD_wraith_possession.400.desc: "在于意志之战输给了[actor.GetTitledFirstName]后，你的身体掌控再一步被[actor.GetHerHim]所获取。"
 POD_wraith_possession.400.option.a: "我的身体不再是我自己的了。"
 POD_wraith_possession.500.t: "抵抗了附身"
 POD_wraith_possession.500.desc: "[recipient.GetTitledFirstName]抵抗了我[possess|E][recipient.GetHerHim]的尝试。"
 POD_wraith_possession.500.option.a: "挫败！"
 POD_wraith_possession.600.t: "抵抗了附身"
 POD_wraith_possession.600.desc: "[actor.GetTitledFirstName]已经放弃了[actor.GetHerHis]入侵你身体的尝试。"
 POD_wraith_possession.600.option.a: "我的身体属于我！"
 POD_wraith_possession_toast_title: "死灵成功！"
 POD_wraith_possession_toast_text: "你的死灵成功地[possess|E]了目标，让你控制了其等并通过力量深探于其。"
 POD_wraith_possession.toast.fail: "死灵失败！"
 POD_wraith_possession.toast.fail.desc: "你的目标抵抗了死灵的附身。"
 POD_wraith_possession.1000.t: "无体面的无躯体"
 POD_wraith_possession.1000.desc: "你原来躯体已经死亡，你再也回不去了。\n这听起来像是一件非常糟糕的事情，可能因为它确实如此。也许是时候换一个新的你？"
 POD_wraith_possession.1000.option.a: "我将永远被困在这具身体里？"