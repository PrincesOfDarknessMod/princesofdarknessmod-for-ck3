l_simp_chinese:
 POD_wraith_spying.100.t: "隐形眼睛"
 POD_wraith_spying.100.desc: "你感觉你被监视了。有些事不太对劲。你害怕如果你继续像往常一样行动，这个不为人知的存在将会推断出你的秘密。\n也许是时候使用替身、密码和其他迷惑窥视者的手段了。当然，也有可能只是你想太多……"
 POD_wraith_spying.100.option.a: "运用我的意志力去隐藏我的秘密。"
 POD_wraith_spying.100.option.b: "隐藏我的秘密。"
 POD_wraith_spying.100.option.c: "错觉罢了。"
 POD_wraith_spying.200.t: "窥视[recipient.GetFirstNameNoTooltip]"
 POD_wraith_spying.200.desc: "是时候使用我的隐形能力对付[recipient.GetTitledFirstName]并发现一些秘密了，但[recipient.GetSheHe]在抵抗。"
 POD_wraith_spying.200.option.a: "不管怎样还是继续。"
 POD_wraith_spying.200.a.tt_willpower: "[recipient.GetFirstNameNoTooltip]发挥了[recipient.GetHerHis]意志力来隐藏[recipient.GetHerHis]的移动并隐蔽了谈话。"
 POD_wraith_spying.200.a.tt_auspex: "[recipient.GetFirstNameNoTooltip]的力量允许他看见隐形之物，将你揭发了出来。"
 POD_wraith_spying.200.a.success.desc: "成功"
 POD_wraith_spying.200.a.tt_success: "[recipient.GetTitledFirstNamePossessive]的秘密将会为我所知！"
 POD_wraith_spying.200.a.failure.desc: "失败"
 POD_wraith_spying.200.a.tt_failure: "[recipient.GetTitledFirstName]抵抗了我窥视的尝试。"
 POD_wraith_spying.200.option.b: "发挥我的意志。我将知道[recipient.GetHerHis]的所有秘密！"
 POD_wraith_spying.200.option.c: "放弃继续努力，我不再想要窥视[recipient.GetHerHim]。"
 POD_wraith_spying.200.option.c.tt: "该尝试将会失败。"
 POD_wraith_spying.300.t: "找到[recipient.GetFirstNameNoTooltip]的秘密了。"
 POD_wraith_spying.300.desc: "我通过观察[recipient.GetHerHim]得知了[recipient.GetTitledFirstNamePossessive]的秘密。"
 POD_wraith_spying.300.option.a: "正如其所应当。"
 POD_wraith_spying.400.t: "你的秘密被发现了"
 POD_wraith_spying.400.desc: "在对[actor.GetTitledFirstName]隐藏所有物和谈话的尝试失败后，你的秘密现在已被[actor.GetHerHim]所知。"
 POD_wraith_spying.400.option.a: "我的秘密不再隐秘。"
 POD_wraith_spying.500.t: "窥视失败"
 POD_wraith_spying.500.desc: "[recipient.GetTitledFirstName]抵抗了我窥视[recipient.GetHerHim]的尝试。"
 POD_wraith_spying.500.option.a: "挫败！"
 POD_wraith_spying.500.option.a.tt.beast: "#beast 我们必须知道[recipient.GetHerHis]的秘密！#!"
 POD_wraith_spying.600.t: "窥视失败"
 POD_wraith_spying.600.desc: "[actor.GetTitledFirstName]已经放弃了[actor.GetHerHis]窃取你秘密的尝试。"
 POD_wraith_spying.600.option.a: "我的秘密安全了！"
 POD_wraith_spying.600.toasttitle: "死灵失败了！"
 POD_wraith_spying.600.toasttext: "你派去的死灵没能从你的目标获取秘密。"
 POD_wraith_spying.300.toasttitle: "死灵成功了！"
 POD_wraith_spying.300.toasttext: "你派去的死灵成功获得一些宝贵的有用信息。"
 turned_to_wraith: "目标将会死亡并以死灵的身份重生在你的宫廷。或，如果已经是死灵，将会显著的变弱并被带到你的宫廷。"