l_simp_chinese:
 POD_wraith_shadow.001.t:0 "实体化黯影"
 POD_wraith_shadow.001.desc:0 "通过你黯影对的荆棘掌握，你黯影能将自身实体化。"
 POD_wraith_shadow.001.option.a:0 "我的黯影！你要去哪？"
 POD_wraith_shadow.001.option.a.tt:0 "你的黯影将尝试实体化自己"
 POD_wraith_shadow.001.option.a.desc:0 "真灵与黯影的斗争"
 POD_wraith_shadow.001.option.a.tt.success:0 "你的黯影成功实体化了"
 POD_wraith_shadow.001.option.a.tt.failure:0 "你的黯影没能实体化自己"
 POD_wraith_shadow.001.option.b:0 "还不到时候"
 POD_wraith_shadow.001.option.b.tt:0 "你黯影将放弃实体化自己的想法"
 POD_wraith_shadow.002.t:0 "实体化黯影（二）"
 POD_wraith_shadow.002.desc:0 "通过你黯影对荆棘的掌握，你黯影成功将自身实体化，这会是好事么？"
 POD_wraith_shadow.002.option.a:0 "我的黯影"
 POD_wraith_shadow.002.option.a.tt:0 "你的黯影成功实体化了"
 POD_wraith_shadow.003.t:0 "实体化黯影（二）"
 POD_wraith_shadow.003.desc:0 "即使以是你黯影目前对荆棘的掌握，也不足以实体化自己……目前而言。"
 POD_wraith_shadow.003.option.a:0 "你还没准备好"
 POD_wraith_shadow.003.option.a.tt:0 "你的黯影没能实体化自己"
 POD_wraith_shadow.004.t:0 "黯影的回归"
 POD_wraith_shadow.004.desc:0 "你实体化的黯影受到了意外，并不得不回归。"
 POD_wraith_shadow.004.option.a:0 "我的黯影回归了"
 POD_wraith_shadow.004.option.a.tt:0 "你的黯影和你又合一了"