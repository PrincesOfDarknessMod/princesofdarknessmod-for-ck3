l_simp_chinese:
 POD_wraith_shadow.001.t: "形体化黯影"
 POD_wraith_shadow.001.desc: "通过你黯影对的荆棘掌握，你黯影能将自身形体化。"
 POD_wraith_shadow.001.option.a: "我的黯影！你要去哪？"
 POD_wraith_shadow.001.option.a.tt: "你的黯影将尝试形体化自己"
 POD_wraith_shadow.001.option.a.desc: "真灵与黯影的斗争"
 POD_wraith_shadow.001.option.a.tt.success: "你的黯影成功形体化了"
 POD_wraith_shadow.001.option.a.tt.failure: "你的黯影没能形体化自己"
 POD_wraith_shadow.001.option.b: "还不到时候"
 POD_wraith_shadow.001.option.b.tt: "你黯影将放弃形体化自己的想法"
 POD_wraith_shadow.002.t: "形体化黯影（二）"
 POD_wraith_shadow.002.desc: "通过你黯影对荆棘的掌握，你黯影成功将自身形体化，这会是好事么？"
 POD_wraith_shadow.002.option.a: "我的黯影"
 POD_wraith_shadow.002.option.a.tt: "你的黯影成功形体化了"
 POD_wraith_shadow.003.t: "形体化黯影（二）"
 POD_wraith_shadow.003.desc: "即使以是你黯影目前对荆棘的掌握，也不足以形体化自己……目前而言。"
 POD_wraith_shadow.003.option.a: "你还没准备好"
 POD_wraith_shadow.003.option.a.tt: "你的黯影没能形体化自己"
 POD_wraith_shadow.004.t: "黯影的回归"
 POD_wraith_shadow.004.desc: "你形体化的黯影受到了意外，并不得不回归。"
 POD_wraith_shadow.004.option.a: "我的黯影回归了"
 POD_wraith_shadow.004.option.a.tt: "你的黯影和你又合一了"
 POD_wraith_shadow.004.t_ferryman: "纠缠命运"
 POD_wraith_shadow.004.desc_ferryman: "帕西淮和摆渡人仍有联系，如果其中一样被摧毁，另一样也会被摧毁。"
 POD_wraith_shadow.004.option.b: "我的帕西淮走了，我也一样……"