l_simp_chinese:
 POD_wraith_arcanoi_learning_events.1.t: "死者之秘"
 POD_wraith_arcanoi_learning_events.1.desc: "作为死者的技艺，冥法是秘密的精神能力，可以通过教授或经验获得。\n冥界有一套奇怪的法律，这些法律更多的是心理上的，而不是生理上的。情绪品质，如执念和惧念，具有可以被使用和移动的物理特性。更重要的是，冥界严重缺乏材料。当死灵死亡时，少数残留会进入冥界，而冥界中的大多数东西都是由灵魂组成的。\n这使得这些灵魂成为向未来的冥法老师提供的最常见的货币。价格因教师的声誉或任何时候冥界经济的整体状况而异。\n有些事情似乎永远不会改变。即使在死后。"
 POD_wraith_arcanoi_learning_events.1.a: "是时候交易了……"
