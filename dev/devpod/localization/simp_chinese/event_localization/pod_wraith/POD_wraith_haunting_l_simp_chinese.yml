l_simp_chinese:
 POD_wraith_haunting.100.t: "作祟"
 POD_wraith_haunting.100.desc: "你决定让[recipient.GetTitledFirstNamePossessive]感到痛苦，但你不可能无处不在。你将把精力集中在什么方面？"
 POD_wraith_haunting.100.a: "[recipient.GetFirstNameNoTooltip]将无法安宁。"
 POD_wraith_haunting.100.b: "我将影响[recipient.GetHerHis]的睡眠。"
 POD_wraith_haunting.100.c: "[recipient.GetHerHis|U]的间谍看起来容易得手。"
 POD_wraith_haunting.100.d: "我将袭击其税收。"
 POD_wraith_haunting.100.e: "将军和[recipient.GetHerHis]的军训课程。"
 POD_wraith_haunting.100.f: "[recipient.GetHerHis|U]的宫廷是一个不错的目标。"
 POD_wraith_haunting.200.t: "作祟成功！"
 POD_wraith_haunting.200.desc: "你在夜里感到一种看不见的存在——幽灵决定对你恶作剧，并产生各种不良影响。"
 POD_wraith_haunting.200.a: "就像不死族还不够坏似的！"
 POD_wraith_haunting.toast: "[recipient.GetFirstName]被作祟了。"