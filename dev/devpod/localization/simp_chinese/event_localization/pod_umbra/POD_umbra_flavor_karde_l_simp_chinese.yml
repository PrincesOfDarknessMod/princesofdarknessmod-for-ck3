l_simp_chinese:
 POD_spirit_travel.1300.t: "梦亦是实"
 POD_spirit_travel.1300.desc: "周界有时是一个美丽的地方。当人们怀揣梦想与希望之时，物质世界在周界的反映会尽其所能的散发美丽，用和平与安全的温暖来抚慰任何来访之人。\n然而，梦境终有完结之时。那些转瞬即逝的梦，若有幸历经，你就应当用心去品味。"
 POD_spirit_travel.1300.a: "如此的寂静……"
 POD_spirit_travel.1300.b: "那并不令人感到慰藉，这也太无聊了！"
 POD_spirit_travel.1301.t: "梦幻之门"
 POD_spirit_travel.1301.desc: "周界，作为[umbra|E]中最梦魅的区域，它代表着酣睡与完全觉醒之间的朦胧状态。\n因此，它是一个相当奇异的地点，类似于物质世界，但又不完全相同。周界是人们对未来的希冀、祈祷或恐惧之地，极乐与痛苦于此间同在，来者极易在这些极端的感觉中迷惘。"
 POD_spirit_travel.1301.a: "最好继续前进……"
 POD_spirit_travel.1301.b: "生命就是一场角逐。"
 POD_spirit_travel.1302.t: "侵扰梦境"
 POD_spirit_travel.1302.desc: "几乎所有人都能在某种程度上进入到周界，因为它是梦形成与赋予实质的地方。对于一个经多见广的[umbra|E]来访者（比如你自己）而言，侵入他人的梦境并不十分困难。与此同时，没有什么办法可以确切知道是何人作祟，所以这的确是不为人知的一个契机。"
 POD_spirit_travel.1302.a: "噩梦将至!"
 POD_spirit_travel.1302.b: "让我们慷慨一点。"
 POD_spirit_travel.1400.t: "亡者在你眼前"
 POD_spirit_travel.1400.desc: "[UmbraGlossary('shadowlands')]的枯窘与绝望对死灵亦是如此。此间的一切生物都注定要经历递进的痛苦，直至不可避免地堕入[UmbraGlossary('oblivion')]。人们很难不被周遭的绝望所啃噬，即使是最顽强的灵魂也会付出相应的代价。"
 POD_spirit_travel.1400.a: "我绝不会止步于此！"
 POD_spirit_travel.1400.b: "嗨，暗夜，我的老朋友！"
 POD_spirit_travel.1401.t: "文明坟场"
 POD_spirit_travel.1401.desc: "死亡四处收割灵魂，[UmbraGlossary('shadowlands')]充满了域外（甚至早已消亡）文明的死灵。部分死灵或许会对他们过去的习俗侃侃而谈，同时欢迎接纳它们的知己。执念对于失落和受诅之人是一种强烈的信念。\n当你愿意倾听这样一个死灵时，你的思绪将会漫游在其呓语般的呢喃中，你几乎可以感觉到自己身处于他们讲述中的时空……"
 POD_spirit_travel.1401.a: "现在正是做出改变之时！"
 POD_spirit_travel.1401.b: "我满意我现在的样子。"
 dead_insight_modifier: "墓之启示"
 dead_insight_modifier_desc: "你知悉了远古学者的智慧。但你也散发着死亡的气息，本能地排斥任何接近你的人。"
 POD_spirit_travel.1402.t: "源于彼方的知识"
 POD_spirit_travel.1402.desc: "被禁锢在[UmbraGlossary('shadowlands')]的失落灵魂来自于世界的各个角落，你能在他们身上得见惊人的洞察力。然而，死灵是出了名的狡猾，想要真正从他们身上学到东西你需要付出不小的努力。如果你愿意在亡灵国度多待一会儿，你或许能说服他们中的部分来教授你一些有用的知识。"
 POD_spirit_travel.1402.a: "我有的是时间。"
 POD_spirit_travel.1402.b: "我不会逗留太久。"
 back_to_nature_modifier: "回归本性"
 back_to_nature_modifier_desc: "你的[UmbraGlossary('spirit_wilds')]旅行使你领略到自然之美的同时，也顿感人类带给它的可怖。"
 POD_spirit_travel.1500.t: "回归自然"
 POD_spirit_travel.1500.desc: "[UmbraGlossary('spirit_wilds')]是世界最自然纯粹的精神显象。多数时候，它像是一个未经驯服的蛮荒乐园，但它并非完全与物质世界相隔绝。人类带来的腐蚀正伴随着强大的文明悄悄蔓延。"
 POD_spirit_travel.1500.a: "文明？瘟疫罢了！"
 POD_spirit_travel.1500.b: "前进之路，无所停滞。"
 POD_spirit_travel.1501.t: "玄武"
 POD_spirit_travel.1501.desc: "你碰巧遭遇了难以捉摸的玄武，一位古老多皱的龟形灵宿。玄武是一个行动缓慢但强大的思考者，因其依靠思考来解决问题，他通常被作为智慧的图腾，他同时也乐于用智慧来战胜他的对手。玄武是一个狡猾的敌人，却时常被低估，他精心构思的计划往往离奇而又不可预测。\n当然，如果你能够向他展示你的独特价值，这次偶遇或许是获得他帮助的绝佳机会。"
 POD_spirit_travel.1501.a: "戏耍一个欺诈师。"
 POD_spirit_travel.1501.effect.success.desc: "玄武对你印象深刻！"
 POD_spirit_travel.1501.success: "玄武很惊讶！"
 POD_spirit_travel.1501.failure.effect.desc: "玄武不以为然。"
 POD_spirit_travel.1501.failure: "玄武对你无感。"
 POD_spirit_travel.1502.t: "野蛮世界"
 POD_spirit_travel.1502.desc: "作为世界自然状态的灵性代表，[UmbraGlossary('spirit_wilds')]是一个荒芜的地方，居住着各种在物质世界中灭绝的生物（或者一开始就不存在的生物）。它们中的大多数都不太友好，其中有一群已经发现了你，并决定将你作为一只可以食用的食物。你可能想避免这事。"
 POD_spirit_travel.1502.a: "人类对抗狂野！"
 POD_spirit_travel.1502.b: "快逃！"
 POD_spirit_travel.1600.t: "过载"
 POD_spirit_travel.1600.desc: "星界是观念、思想和发明的界域。显然，这是一个可以学到很多东西的好地方……但也许太好了。这里有如此多的东西需要吸收，有未曾探索过的可能性，有疯狂的潜力……人类的大脑不适合那无限的探索。你能感觉到自己在渐行渐远，慢慢地迷失在这无限的空间里.……"
 POD_spirit_travel.1600.a: "太多可能性了！"
 POD_spirit_travel.1600.b: "我一定要专注……"
 mind_blown_modifier: "心灵震撼"
 mind_blown_modifier_desc: "你见到一切！"
 POD_spirit_travel.1601.t: "理性"
 POD_spirit_travel.1601.desc: "星界代表了观念和思想的无限潜力。对于有学识的访客来说，如果他们有意志留下来倾听，一切都有可能。然而，这个虚无缥缈的思想混合体对“社交”等愚蠢的概念没有什么耐心，每次你学到一些东西，你都能感觉到自己对不得不在某个时候再次与其他存在体交谈的前景越来越恼火。"
 POD_spirit_travel.1601.a: "谁需要朋友？"
 POD_spirit_travel.1601.b: "我知道的够多了。"
 POD_spirit_travel.1602.t: "调整"
 POD_spirit_travel.1602.desc: "有太多的想法漂浮在[UmbraGlossary('astral_plane')]，让你去探索，但为了开发这个地方的潜力，可能还有另一个选择可以考虑。想法喜欢在物质世界中找到一个新的“家”，如果有适当的意志力，你也许能把一个想法轻轻地推到你身边的人的梦中和思想中。那么，谁知道这种“突然”的灵感会产生什么结果呢？"
 POD_spirit_travel.1602.a: "我将引导你找到你的新宿主。"
 POD_spirit_travel.1602.b: "我不是缪斯。"
 POD_spirit_travel.1700.t: "语言之河"
 POD_spirit_travel.1700.desc: "在[UmbraGlossary('vulgate')]里可以找到语言之河。正如它的名字所示，这条河流是人类众多语言的灵性体现。你从一个路过的灵那里听说，你越往上走，那里的语言就越古老。\n你可以尝试在那些特定的地点喝下它，以获得一些失落的知识，但立即习得一种古老的语言这事会对心智造成相当大的损伤。"
 POD_spirit_travel.1700.a: "也许在这？"
 POD_spirit_travel.1700.b: "这地方看起来像尼罗河。"
 POD_spirit_travel.1700.c: "这小溪看上去不错。"
 POD_spirit_travel.1700.d: "没兴趣。"
 POD_spirit_travel.1701.t: "愚化"
 POD_spirit_travel.1701.desc: "[UmbraGlossary('vulgate')]是最基本的概念和想法被赋予形式的界域。像椅子、天空在人的上方，以及其他简单的概念，人类不会考虑太多，认为是理所当然的。因此，这个地方是相当和平和安抚的，但对心智并不十分友善。如果你不小心，你很容易迷失方向，只想一些简单愚蠢的想法。"
 POD_spirit_travel.1701.a: "火很烫。"
 POD_spirit_travel.1701.b: "是时候考虑一下我领地的政治了。"
 vulgate_confused_modifier: "迷茫"
 vulgate_confused_modifier_desc: "这毫无意义……不是吗？"
 vulgate_understanding_modifier: "奇异理解"
 vulgate_understanding_modifier_desc: "我想这是有道理的？"
 POD_spirit_travel.1702.t: "下位哲学"
 POD_spirit_travel.1702.desc: "作为人类最基本的思想和概念显现出形体的地方，[UmbraGlossary('vulgate')]是一些.……奇特的灵类的家园。这些“哲学家”有永恒的时间来思考宇宙中最简单的真理，然后想出一些“有趣”的解决方案。\n你犯了一个错误，陷入了他们的争论中，并且对他们把简单的想法说得如此复杂而感到困惑。哲学家们似乎在哪里都是一样的。"
 POD_spirit_travel.1702.a: "我一直都错了！"
 POD_spirit_travel.1702.b: "这完全说不通！"
 POD_spirit_travel.1702.c: "我想这是有道理的……"
 POD_spirit_travel.1800.t: "平静与安宁"
 POD_spirit_travel.1800.desc: "与他们称之为家园的喜马拉雅山相似，星占的部族母界是自我反思之处，在这里可以看到雄伟而宁静的风景。对于这部族的成员来说，这里是真正的家园，是他们可以实现自我并最终了解自己真心的地方。"
 POD_spirit_travel.1800.a: "真理在此。"
 POD_spirit_travel.1801.t: "五大考验"
 POD_spirit_travel.1801.desc: "星占的部族母界是一个益于沉思的地方，但也是一个旨在考验狼族身心的地方。作为一位星占，我们欢迎你尝试五大考验中的任何一个。然而，你很清楚，在这一过程中，你预计会有很多失败，这可能不是最值得你同胞称道的事情。"
 POD_spirit_travel.1801.a: "我的知识很丰富。"
 POD_spirit_travel.1801.b: "我可以智取$glossary_wyrm$。"
 POD_spirit_travel.1801.c: "我的圣地步在正道。"
 POD_spirit_travel.1801.d: "我若发言，其等洗耳恭听。"
 POD_spirit_travel.1801.e: "我可以带领我们走向胜利。"
 POD_spirit_travel.1801.f: "我还没准备好。"
 POD_spirit_travel.1802.t: "不受欢迎的访客"
 POD_spirit_travel.1802.desc: "星占的部族母界对像你这样的部族外人来说并不是一个友好的地方。虽然它的居民并不完全是敌对的，但他们会故意误导你，让你远离这个界域中真正重要的地方。即使是与他们进行简单的讨论，在他们回答之后，你也会感到比问问题之前更困惑。"
 POD_spirit_travel.1802.a: "我不该在这里呆很久。"
 POD_spirit_travel.1900.t: "爱是座山"
 POD_spirit_travel.1900.desc: "[UmbraGlossary('spires')]充当了[UmbraGlossary('vulgate')]和悟韵之间的通道。它是一连串非常高的山，每座山都代表着人类自古以来所经历的核心概念之一。要驾驭众峰，你必须精神意义上的登上其中一座山，依靠你自己的眼光和对与之相关的概念的理解。\n幸运的是，你在爱的灵性显现附近开始了你的旅程，现在它正在考验你对这个复杂概念的知识。"
 POD_spirit_travel.1900.a: "我知道关于爱的一两件事……"
 POD_spirit_travel.1900.b: "爱情就是谎言！"
 love_spires_tt: "由于你有至少一位爱人或灵魂伴侣，你可以留在[UmbraGlossary('spires')]而不受损伤。"
 unlove_spires_tt: "由于你没有任何爱人或灵魂伴侣，你在[UmbraGlossary('spires')]的逗留使你精神疲惫。"
 POD_spirit_travel.1901.t: "战争之山"
 POD_spirit_travel.1901.desc: "[UmbraGlossary('spires')]充当了[UmbraGlossary('vulgate')]和悟韵之间的通道。它是一连串非常高的山，每座山都代表着人类自古以来所经历的核心概念之一。要驾驭众峰，你必须精神意义上的登上其中一座山，依靠你自己的眼光和对与之相关的概念的理解。\n幸运的是，你在战争的灵性显现附近开始了你的旅程，现在它正在考验你对这个复杂概念的知识。"
 POD_spirit_travel.1901.a: "我知道关于战争的一两件事……"
 POD_spirit_travel.1901.b: "我雇用其他人来打仗。"
 war_spires_tt: "由于你对军事事务有很好地了解，你可以留在[UmbraGlossary('spires')]而不受损伤。"
 unwar_spires_tt: "由于你对军事事务不怎么了解，你在[UmbraGlossary('spires')]的逗留使你精神疲惫。"
 POD_spirit_travel.1902.t: "攀登你的命运"
 POD_spirit_travel.1902.desc: "[UmbraGlossary('spires')]充当了[UmbraGlossary('vulgate')]和悟韵之间的通道。它是一连串非常高的山，每座山都代表着人类自古以来所经历的核心概念之一。要驾驭众峰，你必须精神意义上的登上其中一座山，依靠你自己的眼光和对与之相关的概念的理解。\n幸运的是，你在运命的灵性显现附近开始了你的旅程，现在它正在考验你对这个复杂概念的知识。"
 POD_spirit_travel.1902.a: "我知道关于宿命的一两件事……"
 POD_spirit_travel.1902.b: "你能重复一下问题么？"
 destiny_spires_tt: "由于你对学术事务有很好地了解，你可以留在[UmbraGlossary('spires')]而不受损伤。"
 undestiny_spires_tt: "由于你对学术事务不怎么了解，你在[UmbraGlossary('spires')]的逗留使你精神疲惫。"
 POD_spirit_travel.2000.t: "天外门卫"
 POD_spirit_travel.2000.desc: "[UmbraGlossary('grand_hall')]曾经是冒险家和哲学家灵体的开放场所，在公元前一世纪被一个神秘的哨卫种族所占领。他们的主要目的似乎是确保人们不再像以前那样在[UmbraGlossary('grand_hall')]里闲逛。基本上，在这里办完你的事，然后该去哪去哪是他们的座右铭。\n他们的存在和他们不断怀疑你的眼神使这个原本令人愉快的界域变得比你预期的更有压力。"
 POD_spirit_travel.2000.a: "我不会呆很久的，我保证"
 POD_spirit_travel.2001.t: "四处游荡"
 POD_spirit_travel.2001.desc: "[UmbraGlossary('grand_hall')]实际上是一个相当不恰当的称呼。它主要是一个非常大的迷宫，由地中海古典风格的走廊组成。和[umbra|E]的大多数东西一样，它也是不断变化的，这意味着你可以永远徘徊在这里，仍然可以发现新的东西。不过有些潜在的发现并不像其他的那样良性，所以你永远不知道这种徘徊的最终结果会是什么。"
 POD_spirit_travel.2001.a: "我感觉运气不错。"
 POD_spirit_travel.2001.b: "我暂时不动，谢了。"
 POD_spirit_travel.2002.t: "喷泉"
 POD_spirit_travel.2002.desc: "在一个大联络室里，有十几条走廊相通。在这个空间的中心，一座喷泉被栩栩如生的人物雕像所包围。一位哨卫，即这个区域的自封守护者，向你解释说，这些雕像曾经是访客，他们认为自己凌驾于哨卫对这个地方的规定之上。很明显，他们错了。\n哨卫在结束他的故事时建议你不要表现出同样地傲慢。"
 POD_spirit_travel.2002.a: "古朴的小故事。"
 POD_spirit_travel.2002.b: "如果是我，我一定会碾压他们的！"
 mirror_zone_modifier: "镜域经历"
 mirror_zone_modifier_desc: "你在镜域看到了太多令人不安的事情，难以为世俗问题而烦恼。"
 POD_spirit_travel.2100.t: "面镜"
 POD_spirit_travel.2100.desc: "镜域总是在各界域之间移动，是[umbra|E]中的一个令人不安的存在。它引起局部的幻觉，既不可思议又非常个人化。过去的恋人、死去的敌人和其他私人关系都在里面等着你。\n令人欣慰的是，这些幻觉只是暂时的，实际上可以成为强化你的心理以应对未来考验的一个好方法。不过，此时此刻，它还是会对你的理智造成相当大的影响。"
 POD_spirit_travel.2100.a: "我将勇敢面对我过往的枷锁。"
 POD_spirit_travel.2100.b: "避开它们似乎更安全。"
 POD_spirit_travel.2101.t: "镜像可能"
 POD_spirit_travel.2101.desc: "神秘的镜域喜欢向“访客”展示可能发生的事情。在你生活中的某处，只是一处不同选择就会衍生出无限可能。令人震惊的是，它还试图将这些架空现实强加给访客，以满足某种星界式反常娱乐。\n面对其中一面镜子，你看到其中自己在过去是一位伟大的将军，一位从未经历过失败，将永远被历史铭记的将军。"
 POD_spirit_travel.2101.a: "……这是真的，不是吗？"
 POD_spirit_travel.2101.b: "等等，那不是我！"
 POD_spirit_travel.2102.desc: "神秘的镜域喜欢向“访客”展示可能发生的事情。在你生活中的某处，只是一处不同选择就会衍生出无限可能。令人震惊的是，它还试图将这些架空现实强加给访客，以满足某种星界式反常娱乐。\n面对其中一面镜子，你看到其中自己在过去是一位伟大的外交官，一位得心应手、将永远被历史铭记的外交官。"
 POD_spirit_travel.2200.t: "巫径"
 POD_spirit_travel.2200.desc: "就其核心而言，巫径只是一个由小路组成的巨大迷宫，通往[umbra|E]以及更远的任何地方。要在这样的地方定位自己是相当困难的，但众所周知，巫径是在物理时间概念之外的，这意味着你有近乎永恒的时间去这样做。你在这里可能遇到的唯一问题是无聊得要死，因为没有任何有意思的事情发生。"
 POD_spirit_travel.2200.a: "至少它不危险。"
 POD_spirit_travel.2201.t: "独自漫步"
 POD_spirit_travel.2201.desc: "就其核心而言，巫径只是一个由小路组成的巨大迷宫，通往[umbra|E]以及更远的任何地方。要在这样的地方定位自己是相当困难的，但众所周知，巫径是在物理时间概念之外的，这意味着你有近乎永恒的时间去这样做。你在这里可能遇到的唯一问题是无聊得要死，因为没有任何有意思的事情发生。\n你感觉已经在这里呆了好几天了，没有什么可做的，但仍然在走啊走啊走啊走啊……"
 POD_spirit_travel.2201.a: "实际上，我觉得这很令人耳目一新。"
 POD_spirit_travel.2201.b: "无聊"
 POD_spirit_travel.2202.t: "星光锻炼"
 POD_spirit_travel.2202.desc: "就其核心而言，巫径只是一个由小路组成的巨大迷宫，通往[umbra|E]以及更远的任何地方。要在这样的地方定位自己是相当困难的，但众所周知，巫径是在物理时间概念之外的，这意味着你有近乎永恒的时间去这样做。你在这里可能遇到的唯一问题是无聊得要死，因为没有任何有意思的事情发生。\n你感觉已经在这里呆了好几天了，没有什么可做的，但仍然在走啊走啊走啊走啊……至少，如果没有别的事，这也是一种很不错的锻炼。"
 POD_spirit_travel.2202.a: "一、二、一、二……"
 POD_spirit_travel.2300.t: "快乐时光"
 POD_spirit_travel.2300.desc: "悟韵体现了最抽象的概念，往往显现为[UmbraGlossary('vulgate')]天空中的彩色云彩。\n幸运的是，你到达了幸福之[UmbraGlossary('epiphamy')]。在一朵令人愉快的丰满的云彩中飘走，你感到更加振奋，而且，比你一生中的任何时候都要快乐。"
 POD_spirit_travel.2300.a: "世上没啥可担心的！"
 POD_spirit_travel.2300.b: "快乐没那么值。回去干事。"
 epiphamie_love_modifier: "快乐时光"
 epiphamie_love_modifier_desc: "你为什么要关心任何事呢？你很快乐！"
 POD_spirit_travel.2301.t: "终虚"
 POD_spirit_travel.2301.desc: "悟韵体现了最抽象的概念，往往显现为[UmbraGlossary('vulgate')]天空中的彩色云彩。\n不幸的是，你到达了湮灭之[UmbraGlossary('epiphamy')]。在黑色和不祥之云的风暴中，你难以逃离，差点被拉入这无比饥饿的悟韵，成为其中的一员。"
 POD_spirit_travel.2301.a: "我失去了我自己的一部分。"
 POD_spirit_travel.2301.b: "差一点……"
 POD_spirit_travel.2301.c: "嗨，黑暗，我的老朋友！"
 POD_spirit_travel.2302.t: "星之荣耀"
 POD_spirit_travel.2302.desc: "悟韵体现了最抽象的概念，往往显现为[UmbraGlossary('vulgate')]天空中的彩色云彩。\n运气很好，你到达了荣耀之[UmbraGlossary('epiphamy')]。在莫名威严云层的包围下，你可以发现自己比以前站得更高，你强大的目光迫使你周围的人尊重你。"
 POD_spirit_travel.2302.a: "你可以称我为‘陛下’。"
 POD_spirit_travel.2400.t: "糊弄技术"
 POD_spirit_travel.2400.desc: "[UmbraGlossary('inventium')]是充满了人类梦寐以求的所有发明的界域。一群法师，也就是发现这个地方的人的继承人，控制着这个界域，一部分是希望推动人类知识的发展，另一部分是为了从中获利。\n今天，你被他们的一位古怪成员逼到了墙角，他们正在喋喋不休地谈论他们最新的幻想。虽然不成条理，但你几乎可以看到他的理论背后的辉煌……或纯粹的疯狂。"
 POD_spirit_travel.2400.a: "这很有道理！"
 POD_spirit_travel.2400.b: "让我一下……"
 POD_spirit_travel.2400.c: "亲爱的同事，你正在犯一些关键性的错误……"
 POD_spirit_travel.2401.t: "交易工具"
 POD_spirit_travel.2401.desc: "[UmbraGlossary('inventium')]是充满了人类梦寐以求的所有发明的界域。一群法师，也就是发现这个地方的人的继承人，控制着这个界域，一部分是希望推动人类知识的发展，另一部分是为了从中获利。\n今日，你发现了一套奇怪的、显然相当先进的工具。虽然你没有心情建造新的东西，但你仍然可以用这些东西对你现有的库存进行一些修饰。"
 POD_spirit_travel.2401.a: "就像新的一样！"
 POD_spirit_travel.2402.t: "强盗学者"
 POD_spirit_travel.2402.desc: "[UmbraGlossary('inventium')]是充满了人类梦寐以求的所有发明的界域。一群法师，也就是发现这个地方的人的继承人，控制着这个界域，一部分是希望推动人类知识的发展，另一部分是为了从中获利。\n这些所谓的”清道夫“往往被贪婪蒙蔽，早已忘记了他们曾经的崇高理想。恼人的是，他们现在相当擅长在不被注意的情况下抢劫构界的访客。遗憾的是，你今天是他们的受害者之一，你也不能因小规模抢劫而去指责这里的每一个法师，否则将会很麻烦。"
 POD_spirit_travel.2402.a: "星界扒手？来真的？"
 POD_spirit_travel.2500.t: "克利俄，历史之缪斯"
 POD_spirit_travel.2500.desc: "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。\n克利俄是历史之缪斯，她非常愿意教你她最喜欢的科目。不过，作为灵体，这样的教导很可能会对你如何看待周围的世界产生深远的影响。"
 POD_spirit_travel.2500.a: "缪斯啊，教导我吧。"
 POD_spirit_travel.2500.b: "我必须礼貌地拒绝。"
 POD_spirit_travel.2501.t: "墨尔波墨涅，悲剧之缪斯"
 POD_spirit_travel.2501.desc: "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。\n墨尔波墨涅是悲剧之缪斯，她非常愿意教你她最喜欢的科目。不过，作为灵体，这样的教导很可能会对你如何看待周围的世界产生深远的影响。"
 POD_spirit_travel.2502.t: "塔利亚，喜剧之缪斯"
 POD_spirit_travel.2502.desc: "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。\n塔利亚是喜剧之缪斯，她非常愿意教你她最喜欢的科目。不过，作为灵体，这样的教导很可能会对你如何看待周围的世界产生深远的影响。"
 POD_spirit_travel.2600.t: "不友好的土著"
 POD_spirit_travel.2600.desc: "[UmbraGlossary('city_of_brass')]是巨灵们的家园，也是他们最强大的城堡。在过去与法师们进行了一些肮脏的交易之后，这些灵类对来访者不太友好。更糟糕的是，他们被称为强迫性十足的骗子。\n巨灵已经感觉到了你的到来，并把你逼到了墙角，问他们为什么要在他们的神话般的家园里自由漫步。显然，你可以为土著给一份“感谢信”……"
 POD_spirit_travel.2600.a: "贪婪的灵类……"
 POD_spirit_travel.2600.effect.success.desc: "巨灵允许你继续"
 POD_spirit_travel.2600.success: "巨灵允许你继续"
 POD_spirit_travel.2600.failure.effect.desc: "出门税……"
 POD_spirit_travel.2600.failure: "你必须付出代价"
 POD_spirit_travel.2601.t: "谎话连篇的巨灵们"
 POD_spirit_travel.2601.desc: "[UmbraGlossary('city_of_brass')]是巨灵们的家园，也是他们最强大的城堡。在过去与法师们进行了一些肮脏的交易之后，这些灵类对来访者不太友好。更糟糕的是，他们被称为强迫性十足的骗子。\n这些巨灵对你很感兴趣，并胁迫你参加他们臭名昭著的谜语游戏。如果你不想在不太友好的土著面前丢脸，你就必须猜对答案。这就更难了，因为连规则是谎言……"
 POD_spirit_travel.2601.a: "说谎精……"
 POD_spirit_travel.2601.effect.success.desc: "你猜对了！"
 POD_spirit_travel.2601.success: "你猜对了！"
 POD_spirit_travel.2601.failure.effect.desc: "你猜错了……"
 POD_spirit_travel.2601.failure: "你猜错了……"
 POD_spirit_travel.2602.t: "善赌的巨灵们"
 POD_spirit_travel.2602.desc: "[UmbraGlossary('city_of_brass')]是巨灵们的家园，也是他们最强大的城堡。在过去与法师们进行了一些肮脏的交易之后，这些灵类对来访者不太友好。更糟糕的是，他们被称为强迫性十足的骗子。\n巨灵的哈里发阿迪米亚特邀请你参加一场高回报的博弈游戏；如果你赢了，你将得到传说中的巨灵宝藏的一部分。但显然有一个问题，这游戏是对你不利的，哈里发实际上是临时制定的规则。但是，有一个很小的可能，让你真的能赢……也许这是很值得的？"
 POD_spirit_travel.2602.a: "手气不错"
 POD_spirit_travel.2602.b: "幸运女神太无常了"
 POD_spirit_travel.2700.t: "不介入"
 POD_spirit_travel.2700.desc: "从[UmbraGlossary('spirit_wilds')]的云层中可以进入以太界。它的最低点是由构以太之灵居住的梦幻般的云层山脉。它们有一个海绵状的顶层，但很坚固，容易行走。云层按照自己的节奏变化和流动，形成平原、丘陵、山谷和山脉的奇妙景观，它们都是同样的海绵状固体。\n这是一个完全由狼国和他们的盟友控制的界域，因此，非常不欢迎任何外来者。你一到这里就开始逃亡，被这个界域的许多强大的看守追捕。"
 POD_spirit_travel.2700.a: "我应该尽快离开"
 POD_spirit_travel.2701.t: "星光攀登"
 POD_spirit_travel.2701.desc: "从[UmbraGlossary('spirit_wilds')]的云层中可以进入以太界。它的最低点是由构以太之灵居住的梦幻般的云层山脉。它们有一个海绵状的顶层，但很坚固，容易行走。云层按照自己的节奏变化和流动，形成平原、丘陵、山谷和山脉的奇妙景观，它们都是同样的海绵状固体。\n虽然可以利用云层作为在界域中旅行的手段，但有些人更喜欢攀登点缀在这里的众多山脉。这当然是一个更有压力的努力，但可以是一个很好的锻炼。"
 POD_spirit_travel.2701.a: "去世界之巅！"
 POD_spirit_travel.2701.b: "跳云更好玩。"
 POD_spirit_travel.2702.t: "近距离观星"
 POD_spirit_travel.2702.desc: "从[UmbraGlossary('spirit_wilds')]的云层中可以进入以太界。它的最低点是由构以太之灵居住的梦幻般的云层山脉。它们有一个海绵状的顶层，但很坚固，容易行走。云层按照自己的节奏变化和流动，形成平原、丘陵、山谷和山脉的奇妙景观，它们都是同样的海绵状固体。\n乙太界也许是大多数[umbra|E]旅行者能接触到的最接近星星的地方。它作为天空反映在物理世界中，不断地在黑夜和白天之间循环。因此，它提供了一个真正独特的视野，可以让看到外界。"
 POD_spirit_travel.2702.a: "那上面有什么？"
 POD_spirit_travel.2800.t: "永恒之痛苦"
 POD_spirit_travel.2800.desc: "源自人类的痛苦。千年来，世界上所有受害者的痛苦造就了这界域，一个已固为永恒的残酷和折磨。\n这不是一个适合胆小的人的地方，甚至不是一个适合有心灵的人的地方。"
 POD_spirit_travel.2800.a: "如此多的浪费……"
 POD_spirit_travel.2800.b: "嗨，没那么糟。"
 POD_spirit_travel.2801.t: "颓废之痛苦"
 POD_spirit_travel.2801.desc: "源自人类的痛苦。千年来，世界上所有受害者的痛苦造就了这界域，一个已固为永恒的残酷和折磨。\n在这个界域，很难不被弥漫在空气中的痛苦灵光所玷污。不管你愿不愿意，你很快就会显得比以前更有气势，用隐含永恒折磨的威胁使你周围的人胆怯。"
 POD_spirit_travel.2801.a: "恐惧是为别人准备的。"
 full_intimidation_tooltip: "你将得到完整的威吓生活方式树。"
 POD_spirit_travel.2802.t: "交易疼痛"
 POD_spirit_travel.2802.desc: "源自人类的痛苦。千年来，世界上所有受害者的痛苦造就了这界域，一个已固为永恒的残酷和折磨。\n对于真正颓废的灵魂来说，在这里可以学到很多关于心理和生理痛苦的错综复杂的东西。但是，即使是上述厌倦的灵魂也会被这片荒地上的纯粹痛苦所淹没。毕竟没有人能够真正对痛苦免疫。"
 POD_spirit_travel.2802.a: "自成艺术。"
 POD_spirit_travel.2802.b: "我不该止步于此。"
 POD_spirit_travel.2900.t: "纸上谈兵的将领"
 POD_spirit_travel.2900.desc: "战界是一个致力于暴力和愤怒的领域，混乱统治一切，军队混合在一起，秦朝士兵与罗马军团作战，十字军与维京野蛮人结盟对抗玛雅军队。只要不进入其中一个冲突，旅者可走在与他们所见证的战斗相适应的“过道”上（海战时是船、布匿战争是罗马道路、等等）。只要他们不踏出过道，他们就不会被直接攻击。\n这种特殊性使你很容易目睹其中的一场战斗，并从你舒适的座位上批评那些明显无能的将军们。如果你在他们的位置上，你显然会做得更好！"
 POD_spirit_travel.2900.a: "它太容易了，我可以提高难度！"
 POD_spirit_travel.2901.t: "战争的变化"
 POD_spirit_travel.2901.desc: "战界是一个致力于暴力和愤怒的领域，混乱统治一切，军队混合在一起，秦朝士兵与罗马军团作战，十字军与维京野蛮人结盟对抗玛雅军队。只要不进入其中一个冲突，旅者可走在与他们所见证的战斗相适应的“过道”上（海战时是船、布匿战争是罗马道路、等等）。只要他们不踏出过道，他们就不会被直接攻击。\n有了这么多时代和文化的代表，我们很容易看到，战争确实在变化。每一个变化背后总有一个原因，尽管它们可能看起来无关紧要。研究它们可能是一个学习的好机会。"
 POD_spirit_travel.2901.a: "战车去哪了？"
 POD_spirit_travel.2901.b: "战争是一种手段，而不是目的。"
 POD_spirit_travel.2902.t: "征战一生"
 POD_spirit_travel.2902.desc: "战界是一个致力于暴力和愤怒的领域，混乱统治一切，军队混合在一起，秦朝士兵与罗马军团作战，十字军与维京野蛮人结盟对抗玛雅军队。只要不进入其中一个冲突，旅者可走在与他们所见证的战斗相适应的“过道”上（海战时是船、布匿战争是罗马道路、等等）。只要他们不踏出过道，他们就不会被直接攻击。\n当你穿越这地区时，有一群战士向你呼喊，虽然你不完全理解他们，但他们似乎在嘲笑你，因为你没有参加其中的战斗。他们显然认为你很弱。"
 POD_spirit_travel.2902.a: "我只是路过。"
 POD_spirit_travel.2902.b: "我会证明给你看我不弱！"
 POD_spirit_travel.3000.t: "古典人犬对话"
 POD_spirit_travel.3000.desc: "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。它充满了熔化的银化为的河，既能燃烧，又能治疗，将囚犯的折磨延长到几个月、几年，甚至可能是几个世纪。\n厄瑞玻斯的大门由可怕的地狱犬守卫着，它是一只巨型三头猎犬。地狱犬可能与希腊和罗马神话中的猎犬有关，或者它可能是从这些神话中取的名字和外观。它从未确认过这两哪个是对，但他发现这时期的故事很有趣，并喜欢讨论它们。\n她的语气是深思熟虑的，尽管它的外表不像是令人愉快的谈话对象。你很快就会想象自己在那些古老的英雄和怪兽的史诗故事中的样子。"
 POD_spirit_travel.3000.a: "希腊文化确实很吸引人。"
 POD_spirit_travel.3000.b: "一场有趣的对话，仅此而已。"
 charyss_umbra_modifier: "恰里西斯的评价"
 charyss_umbra_modifier_desc: "恰里西斯审视了你的灵魂，发现你的所求。"
 POD_spirit_travel.3001.t: "救赎女士"
 POD_spirit_travel.3001.desc: "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。它充满了熔化的银化为的河，既能燃烧，又能治疗，将囚犯的折磨延长到几个月、几年，甚至可能是几个世纪。\n这个界域的女主人是神秘的恰里西斯。她的堡垒矗立在湖的中心，欢迎任何祈求者。然后，这位威严的厄瑞玻斯女士会审视请求者的灵魂，并在绝大多数情况下，发现它是不够格的。只有得到恰里西斯的认可，才能真正被认为是得到了净化。"
 POD_spirit_travel.3001.a: "我将征求女士的同意。"
 POD_spirit_travel.3001.b: "我会自己照顾好自己的。"
 POD_spirit_travel.3002.t: "痛苦中的救赎"
 POD_spirit_travel.3002.desc: "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。它充满了熔化的银化为的河，既能燃烧，又能治疗，将囚犯的折磨延长到几个月、几年，甚至可能是几个世纪。\n被自己的罪恶感所背叛，你发现自己被淹没在厄瑞玻斯的熔银之水中。你很快发现，唯一的出路是通过灵魂之镜。这个界域的守护者们成双成对地穿过镜子，进入每个受苦者的心灵。在这里，他们努力寻找内疚的来源，迫使你面对每一个人，承认你的失败。只要没有完成，你仍然会在这条非常令人痛苦的河流中游泳……"
 POD_spirit_travel.3002.a: "我忏悔！我忏悔！"
 POD_spirit_travel.3100.t: "你喜欢什么？"
 POD_spirit_travel.3100.desc: "作为$glossary_wyld$在世界中的锚之一，变界是一个混乱的地方，有不断的变化和无穷的可能性。变界中的每一个生命都开始以无数方式改变，因为这里的物理法则是可塑的、可变的。\n你发现留在这里并保持你的核心很困难。随着时间的推移，新的思想和想法侵入你的头脑，试图让你认为它们一直是你自己的……"
 POD_spirit_travel.3100.a: "事实是相对的。"
 POD_spirit_travel.3100.b: "我将抵抗！"
 umbra_random_dna_tt: "你的外表将随机改变。"
 POD_spirit_travel.3101.t: "你是什么样子的？"
 POD_spirit_travel.3101.desc: "作为$glossary_wyld$在世界中的锚之一，变界是一个混乱的地方，有不断的变化和无穷的可能性。变界中的每一个生命都开始以无数方式改变，因为这里的物理法则是可塑的、可变的。\n你发现留在这里并保持你的核心很困难。随着时间的流逝，你的外表正在发生变化，迅速脱离原来的样子，变成一种新的、不可预测的形式……"
 POD_spirit_travel.3101.a: "我总是这样。"
 POD_spirit_travel.3101.b: "我将抵抗！"
 POD_spirit_travel.3102.t: "你是什么样子的？"
 POD_spirit_travel.3102.desc: "作为$glossary_wyld$在世界中的锚之一，变界是一个混乱的地方，有不断的变化和无穷的可能性。变界中的每一个生命都开始以无数方式改变，因为这里的物理法则是可塑的、可变的。\n你发现留在这里并保持你的核心很困难。随着时间的推移，你的体质正在发生变化，迅速脱离原来的状态，变成一种新的、不可预知的形式……"
 POD_spirit_travel.3102.a: "我总是这样。"
 POD_spirit_travel.3102.b: "我将抵抗！"
 devoted_mariana_modifier: "献于玛丽安娜"
 devoted_mariana_modifier_desc: "你已经把自己献给了妖精女王玛丽安娜。她吞噬了你的每一个想法。"
 sorcery_gain_tt: "术法特质将给予新生活方式。"
 POD_spirit_travel.3200.t: "黑暗的妖精公主"
 POD_spirit_travel.3200.desc: "易巴席尔似乎是一个充满无尽幻想故事的土地。在这里，季节永远不会改变，白天永远锁定为黄昏。\n玛丽安娜公主在这里统治着哀怒廷妖精王廷，与喜乐廷的吕山德王子进行着永恒的战争。这位头脑灵活的黑美人很年轻，但在妖精最强大的魔法方面却有着惊人的天赋。她提出要与你分享她的一些秘密，只要你对她的功业做出承诺……"
 POD_spirit_travel.3200.a: "向未来的女王致敬！"
 POD_spirit_travel.3200.b: "这不能成为国家统治权的来源！"
 POD_spirit_travel.3201.t: "妖精战场"
 POD_spirit_travel.3201.desc: "易巴席尔似乎是一个充满无尽幻想故事的土地。在这里，季节永远不会改变，白天永远锁定为黄昏。\n这界域是两个妖精派别之间的争夺战场，喜乐廷和哀怒廷。虽然他们的竞争大多以宫廷阴谋的形式进行，但有时也会在战场上结束。像你这样被夹在魔法战线之间的外来者有祸了。"
 POD_spirit_travel.3201.a: "那是颗火球？"
 POD_spirit_travel.3201.b: "快逃！"
 POD_spirit_travel.3202.t: "勇敢的妖精王子"
 POD_spirit_travel.3202.desc: "易巴席尔似乎是一个充满无尽幻想故事的土地。在这里，季节永远不会改变，白天永远锁定为黄昏。\n吕山德王子统治着这里的喜乐廷妖精王庭，并与哀怒廷的玛丽安娜公主进行着永恒的战争。这位可敬的骑士是位可怕的战斗大师，他随时准备接受新的学徒，只要他们不介意在这个过程中遭受一些挫折。"
 POD_spirit_travel.3202.a: "来比一场，王子？"
 POD_spirit_travel.3202.b: "我将不做这个，我想。"
 POD_spirit_travel.3300.t: "可耻的展示"
 POD_spirit_travel.3300.desc: "传奇界可以重现某人血脉内的记忆，让他们体验传奇祖先的生活。\n但有些传奇最好被遗忘，而你刚刚恢复了你的一位祖先的痛苦的懦弱时刻。这段记忆历历在目，足以让你对自己也有片刻的怀疑。"
 POD_spirit_travel.3300.a: "我比他更好，希望如此。"
 POD_spirit_travel.3301.t: "伟大的功业"
 POD_spirit_travel.3301.desc: "传奇界可以重现某人血脉内的记忆，让他们体验传奇祖先的生活。\n有些传奇是让能亲身经历的强大故事，而你刚刚从你的一个祖先那里见到了一个鼓舞人心的勇敢时刻。这段记忆历历在目，足以让你感到一股自豪感。"
 POD_spirit_travel.3301.a: "无疑是一系的英雄！"
 POD_spirit_travel.3302.t: "英雄血脉？"
 POD_spirit_travel.3302.desc: "传奇界可以重现某人血脉内的记忆，让他们体验传奇祖先的生活。\n这是颂扬你血脉的完美界域……如果有什么可以颂扬它的话。你无法控制什么记忆会出现，懦弱的故事和勇敢的故事一样有可能发生。也许过去的事情最好留给过去的人。"
 POD_spirit_travel.3302.a: "显然，我们一直是英雄！"
 POD_spirit_travel.3302.b: "让我们转而展望未来。"
 POD_spirit_travel.3400.t: "傻瓜指南"
 POD_spirit_travel.3400.desc: "一条巨大的山脉，甚至使伟大的喜马拉雅山脉相形见绌，在云海之上耸立。一些聪明的旅行者相信，佛塔和隐秘城市就在这山脉中，是大多数灵类无法企及的。\n山脉中居住着伟大的龙灵，对于那些善意询问的人来说，他们是智慧的源泉。一条这样的龙喜欢上了你，并给你一些明智的建议。"
 POD_spirit_travel.3400.a: "谢谢你，强大的巨龙"
 POD_spirit_travel.3401.t: "玄奥的智慧"
 POD_spirit_travel.3401.desc: "一条巨大的山脉，甚至使伟大的喜马拉雅山脉相形见绌，在云海之上耸立。一些聪明的旅行者相信，佛塔和隐秘城市就在这山脉中，是大多数灵类无法企及的。\n山脉中居住着伟大的龙灵，对于那些善意询问的人来说，他们是智慧的源泉。一条这样的龙喜欢上了你，并给你一些明智的建议。遗憾的是，这些建议几乎无法理解，你最终只感到困惑，而不是其他什么。"
 POD_spirit_travel.3401.a: "谢谢？"
 POD_spirit_travel.3402.t: "龙的财富"
 POD_spirit_travel.3402.desc: "一条巨大的山脉，甚至使伟大的喜马拉雅山脉相形见绌，在云海之上耸立。一些聪明的旅行者相信，佛塔和隐秘城市就在这山脉中，是大多数灵类无法企及的。\n山脉中居住着伟大的龙灵，当龙在附近时，宝物也在附近。你可以尝试偷偷潜行过它们中的一只，抢夺它们在这里囤积的一些黄金。很明显，这行动有一定的风险……"
 POD_spirit_travel.3402.a: "别醒，别醒……"
 POD_spirit_travel.3402.b: "只是路过！"
 POD_spirit_travel.3500.t: "原始怒火"
 POD_spirit_travel.3500.desc: "泛古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。这是一个地球上所有陆地融为一块的时代，是一个充满了不合时宜和被遗忘已久的恐怖的前代尘世。\n强大的、被遗忘的野兽阻碍了你的道路。是时候让他们知道谁才是真正的顶级掠食者。"
 POD_spirit_travel.3500.a: "来吧！"
 POD_spirit_travel.3500.effect.success.desc: "你将杀出一条血路。"
 POD_spirit_travel.3500.success: "你赢了！"
 POD_spirit_travel.3500.failure.effect.desc: "你被打跑了。"
 POD_spirit_travel.3500.failure: "你输了！"
 POD_spirit_travel.3501.t: "侏罗纪界域"
 POD_spirit_travel.3501.desc: "泛古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。这是一个地球上所有陆地融为一块的时代，是一个充满了不合时宜和被遗忘已久的恐怖的前代尘世。\n强大的恐龙诸王在这片土地上拥有大片的地盘，对外来者不怀好意。在这些野蛮的土地上，你必须为你走过的每一寸土地而奋斗。"
 POD_spirit_travel.3501.a: "我并没有要求更多的牙齿！"
 POD_spirit_travel.3502.t: "尘世之怖"
 POD_spirit_travel.3502.desc: "泛古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。这是一个地球上所有陆地融为一块的时代，是一个充满了不合时宜和被遗忘已久的恐怖的前代尘世。\n这样一只被遗忘的恐怖现在正在追赶你，对你不经意间闯入他们的领地感到不满。现在是战斗或逃跑的时候了，或者很有可能是两者同时进行。"
 POD_spirit_travel.3502.a: "这东西到底有多少只眼睛？！"
 POD_spirit_travel.3600.t: "原始天堂"
 POD_spirit_travel.3600.desc: "夏乡反映了盖亚对她的孩子们的纯洁又无尽的爱。在古代传说中，有成就的英雄和误入歧途的有志之士注定要在他们人生中的关键时刻找到它，在盖亚选择的转折点，他们可以接受治疗、宁静、智慧，甚至是有关精神力或洞察力的赠礼。\n如果一颗受伤的心灵可以在任何地方得到治愈，那就是这里。只要坐下来，看着这片无尽的宁静和美丽的土地，对大多数人来说就足够了。"
 POD_spirit_travel.3600.a: "安宁与平静终于来临。"
 POD_spirit_travel.3601.t: "原始教导"
 POD_spirit_travel.3601.desc: "夏乡反映了盖亚对她的孩子们的纯洁又无尽的爱。在古代传说中，有成就的英雄和误入歧途的有志之士注定要在他们人生中的关键时刻找到它，在盖亚选择的转折点，他们可以接受治疗、宁静、智慧，甚至是有关精神力或洞察力的赠礼。\n这样的洞察突然在你身上显现，让你更接近灵性开悟，这要归功于该界域强大的魔法。"
 POD_spirit_travel.3601.a: "谢谢你，母亲。"
 POD_spirit_travel.3602.t: "天堂的终结"
 POD_spirit_travel.3602.desc: "夏乡反映了盖亚对她的孩子们的纯洁又无尽的爱。在古代传说中，有成就的英雄和误入歧途的有志之士注定要在他们人生中的关键时刻找到它，在盖亚选择的转折点，他们可以接受治疗、宁静、智慧，甚至是有关精神力或洞察力的赠礼。\n可悲的是，很明显，夏乡正在度过它最后的日子。这个界域正在慢慢地衰败开来，饥饿的虚空正取代它美丽的风景。很快，这就将什么都不剩。"
 POD_spirit_travel.3602.a: "如此的悲剧。"
 POD_spirit_travel.3700.t: "猴王大殿"
 POD_spirit_travel.3700.desc: "虎原是东方[umbra|E]的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。每个动物物种在虎原都有宫殿和灵庭。\n猴王是一位聪明的存在，喜欢狡猾的人。当你站在他面前时，他很快就会评估你的价值。"
 POD_spirit_travel.3700.a: "他对你有好感。"
 POD_spirit_travel.3700.b: "你让王厌烦了。"
 POD_spirit_travel.3701.t: "虎王大殿"
 POD_spirit_travel.3701.desc: "虎原是东方[umbra|E]的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。每个动物物种在虎原都有宫殿和灵庭。\n虎王是一个凶猛的存在，喜欢勇敢的人。当你站在他面前时，他很快就会评估你的价值。"
 POD_spirit_travel.3702.t: "熊猫王大殿"
 POD_spirit_travel.3702.desc: "虎原是东方[umbra|E]的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。每个动物物种在虎原都有宫殿和灵庭。\n熊猫王是一个耐心的存在，喜欢懒惰的人。当你站在他面前时，他很快就会评估你的价值。"
 POD_spirit_travel.3800.t: "觐见龙王"
 POD_spirit_travel.3800.desc: "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围。\n在位于界域底部的宫殿里，羽海龙王监督着他的界域的无数事务：平静或掀起暴风雨，引导船只入港或遣送鲨鱼去攻击遇难的水手。他是一位非常强大的存在，他接受有名望的来访者的觐见，经常同时给他们送上回礼和居高临下的评论。"
 POD_spirit_travel.3800.a: "你值得让他见你一面"
 POD_spirit_travel.3800.b: "你不配。"
 POD_spirit_travel.3801.t: "觐见龙女"
 POD_spirit_travel.3801.desc: "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围。\n龙女是龙王的妃子，她是一位好奇的人，总是对别人的信念感兴趣。然而，她在这方面的丰富知识常常使她的客人感到羞愧。"
 POD_spirit_travel.3801.a: "一场开阔眼界的讨论。"
 POD_spirit_travel.3801.b: "龙女对你的虔诚不以为然。"
 POD_spirit_travel.3802.t: "觐见丞相"
 POD_spirit_travel.3802.desc: "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围。\n伽倻琴，一位残暴而高大的龙灵，是龙王的丞相。他只尊重力量，不欢迎来访者，并经常向他们挑战，与他们进行比武以维护他的权威。"
 POD_spirit_travel.3802.a: "一场艰难战斗要克服。"
 POD_spirit_travel.3802.b: "你太弱了，不配受到挑战。"
 POD_spirit_travel.3900.t: "狩猎实践"
 POD_spirit_travel.3900.desc: "狼之家是一片广袤的原始荒野，一个严酷而无情的界域，在这里，狼可以很容易地成为捕食者或成为猎物。\n狩猎，或者被狩猎，是踏入这个地方的任何人能可期待的。这里没有中间地带。"
 POD_spirit_travel.3900.a: "我必须学习猎人之道。"
 POD_spirit_travel.3900.b: "我是猎人！"
 POD_spirit_travel.3901.t: "狩猎的兴奋"
 POD_spirit_travel.3901.desc: "狼之家是一片广袤的原始荒野，一个严酷而无情的界域，在这里，狼可以很容易地成为捕食者或成为猎物。\n狩猎可以是一种解放，特别是对于像你们这种天生捕食者。战斗的简单快感和最终的杀戮可以使人摆脱统治的压力。"
 POD_spirit_travel.3901.a: "学习这一技能的好机会。"
 POD_spirit_travel.3901.b: "寻，追，杀。"
 POD_spirit_travel.3902.t: "突破极限"
 POD_spirit_travel.3902.desc: "狼之家是一片广袤的原始荒野，一个严酷而无情的界域，在这里，狼可以很容易地成为捕食者或成为猎物。\n作为一个有经验的猎人，狼之家本身就是要把你推向极限，让你面对最狡猾和最危险的敌人，让你交替成为猎人或猎物。"
 POD_spirit_travel.3902.a: "就这？！"
 POD_spirit_travel.4000.t: "恐惧与疯狂"
 POD_spirit_travel.4000.desc: "卡列姆是[umbra|E]中的一座妖蛆领域。当一种特别强烈的、负面的情绪在物理世界的某个地方表达出来时，它们就会显现出来，并在影界留下痕迹。它是一块磁铁，吸引着呆在卡列姆附近的忌灵和灵类，用迹象显示出它们各自情绪，甚至无生命的物体也会因接近而受到污染。\n这真的不是一个适合还没有被腐化的人的地方。你应该迅速离开。"
 POD_spirit_travel.4000.a: "出口在哪？"
 POD_spirit_travel.4001.t: "恐惧与惊骇"
 POD_spirit_travel.4001.desc: "卡列姆是[umbra|E]中的一座妖蛆领域。当一种特别强烈的、负面的情绪在物理世界的某个地方表达出来时，它们就会显现出来，并在影界留下痕迹。它是一块磁铁，吸引着呆在卡列姆附近的忌灵和灵类，用迹象显示出它们各自情绪，甚至无生命的物体也会因接近而受到污染。\n这真的不是一个适合还没有被腐化的人的地方。你应该迅速离开。"
 POD_spirit_travel.4001.a: "出口在哪？"
 POD_spirit_travel.4002.t: "沐浴在恐惧中"
 POD_spirit_travel.4002.desc: "卡列姆是[umbra|E]中的一座妖蛆领域。当一种特别强烈的、负面的情绪在物理世界的某个地方表达出来时，它们就会显现出来，并在影界留下痕迹。它是一块磁铁，吸引着呆在卡列姆附近的忌灵和灵类，用迹象显示出它们各自情绪，甚至无生命的物体也会因接近而受到污染。\n$glossary_wyrm$在这里很强大，这里是一个完美的地方，可以浸泡在你的主人将带给这个世界的恐怖中，并因其而焕发活力。"
 POD_spirit_travel.4002.a: "甜蜜的腐化。"
 POD_spirit_travel.4100.t: "完美化希腊"
 POD_spirit_travel.4100.desc: "黑怒的母界类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中。\n对于任何有自尊的黑怒来说，这是在[umbra|E]能找到的最近似天堂的地方。"
 POD_spirit_travel.4100.a: "完美。"
 POD_spirit_travel.4101.t: "勇士和圣人"
 POD_spirit_travel.4101.desc: "黑怒的母界类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中。\n在这里可以找到许多强大而睿智的黑怒，她们总是愿意把自己的智慧借给任何适当恭敬的幼崽。"
 POD_spirit_travel.4101.a: "战争……"
 POD_spirit_travel.4101.b: " ……或智慧？"
 POD_spirit_travel.4102.t: "不受欢迎的客人"
 POD_spirit_travel.4102.desc: "黑怒的母界类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中。\n黑怒非常保护他们的家园，并追捕任何愚蠢到闯入这里的人。你应该迅速前进。"
 POD_spirit_travel.4102.a: "迅速且安静……"
 POD_spirit_travel.4200.t: "阴凉天堂"
 POD_spirit_travel.4200.desc: "啮骨者的母界就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。\n啮骨者还能要求什么呢？"
 POD_spirit_travel.4200.a: "闻起来像狗屎。还有家。"
 POD_spirit_travel.4201.t: "后街导师"
 POD_spirit_travel.4201.desc: "啮骨者的母界就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。\n在这里可以找到许多经验丰富、德高望重的啮骨者，他们准备向适当恭敬的幼崽分享他们的技巧。"
 POD_spirit_travel.4201.a: "硬币的一面……"
 POD_spirit_travel.4201.b: "……和另一面"
 POD_spirit_travel.4202.desc: "啮骨者的母界就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。\n这里是啮骨者的地盘，任何人都知道，下水道老鼠在自己的地盘上会有很强的领地性。因此，你在这里很不受欢迎，你应该在他们发现你之前迅速行动。"
 POD_spirit_travel.4300.t: "天堂和谐"
 POD_spirit_travel.4300.desc: "盖亚之子的母界是一片广阔的森林，其下山丘连绵起伏，潺潺的溪流在山谷中蜿蜒流淌。摆脱了妄悸的人类在母界各地游荡，中央的大都市是座纯洁化的古苏美尔城市。\n它代表了盖亚之子的最终目标和他们为之奋斗的目标。在艰难时刻是一个有用的提醒。"
 POD_spirit_travel.4300.a: "有一天，这将不再只是一个梦。"
 POD_spirit_travel.4301.t: "灵类导师"
 POD_spirit_travel.4301.desc: "盖亚之子的母界是一片广阔的森林，其下山丘连绵起伏，潺潺的溪流在山谷中蜿蜒流淌。摆脱了妄悸的人类在母界各地游荡，中央的大都市是座纯洁化的古苏美尔城市。\n一些受人尊敬的盖亚之子在这里，准备向尊敬的幼崽传授他们来之不易的智慧。"
 POD_spirit_travel.4301.a: "留步且听。"
 POD_spirit_travel.4302.desc: "盖亚之子的母界是一片广阔的森林，其下山丘连绵起伏，潺潺的溪流在山谷中蜿蜒流淌。摆脱了妄悸的人类在母界各地游荡，中央的大都市是座纯洁化的古苏美尔城市。\n众所周知，盖亚之子对狼人的态度是温和的，但他们仍然是狼人。这里是他们最神圣的地方，他们激烈地保卫着这里。你不应该在这里久留，否则你会被抓住。"
 POD_spirit_travel.4400.t: "闹腾天堂"
 POD_spirit_travel.4400.desc: "芬尼安的母界是一片由丘陵、峡谷和山谷组成的绿色景观，看起来像是从经典奇幻小说中汲取的一样。妖精们在树林里玩耍，雄鹿之灵在牡鹿的指导形成“狂猎”在土地上游荡，保护母界免受入侵者的侵扰。\n对于任何自尊的芬尼安来说，这就是生活应该永远是的样子。"
 POD_spirit_travel.4400.a: "家，吵闹的家。"
 POD_spirit_travel.4401.t: "自夸导师"
 POD_spirit_travel.4401.desc: "芬尼安的母界是一片由丘陵、峡谷和山谷组成的绿色景观，看起来像是从经典奇幻小说中汲取的一样。妖精们在树林里玩耍，雄鹿之灵在牡鹿的指导形成“狂猎”在土地上游荡，保护母界免受入侵者的侵扰。\n许多强大的芬尼安在这里，准备向新来者传授他们的智慧……如果他们愿意听长篇大论的夸张故事的话。"
 POD_spirit_travel.4401.a: "你说服了一整群芬里尔仔兽？"
 POD_spirit_travel.4401.b: "多少钱？"
 POD_spirit_travel.4402.desc: "芬尼安的母界是一片由丘陵、峡谷和山谷组成的绿色景观，看起来像是从经典奇幻小说中汲取的一样。妖精们在树林里玩耍，雄鹿之灵在牡鹿的指导形成“狂猎”在土地上游荡，保护母界免受入侵者的侵扰。\n作为一名非芬尼安，你是这些入侵者中的一员。在你停留在这里期间逃离狂猎将是困难的，你最好尽快行动起来。"
 POD_spirit_travel.4402.a: "我该溜了。尽快。"
 POD_spirit_travel.4500.t: "冻结天堂"
 POD_spirit_travel.4500.desc: "被永恒冬季所笼罩的峡湾、广袤的苔原、和寒冷黑暗的寒温带针叶林构成了芬里尔的母界。冰河时代的巨型动物群，如冰原狼和猛犸象，在这片土地上游荡，并攻击任何孤行的狼人。芬里尔聚集在长屋村，他们在那里喝酒、打斗、狂欢，并将他们的事迹传为萨迦。\n对于芬里尔仔兽来说，这是最好的生活方式，也是唯一真正值得生活的生活方式。"
 POD_spirit_travel.4500.a: "盛宴与打斗！"
 POD_spirit_travel.4501.t: "战帅"
 POD_spirit_travel.4501.desc: "被永恒冬季所笼罩的峡湾、广袤的苔原、和寒冷黑暗的寒温带针叶林构成了芬里尔的母界。冰河时代的巨型动物群，如冰原狼和猛犸象，在这片土地上游荡，并攻击任何孤行的狼人。芬里尔聚集在长屋村，他们在那里喝酒、打斗、狂欢，并将他们的事迹传为萨迦。\n这里有很多有经验的战士，并准备向那些谦虚听讲的人分享他们的教诲。"
 POD_spirit_travel.4501.a: "掌握战事。"
 POD_spirit_travel.4501.b: "掌握战斗。"
 POD_spirit_travel.4502.desc: "被永恒冬季所笼罩的峡湾、广袤的苔原、和寒冷黑暗的寒温带针叶林构成了芬里尔的母界。冰河时代的巨型动物群，如冰原狼和猛犸象，在这片土地上游荡，并攻击任何孤行的狼人。芬里尔聚集在长屋村，他们在那里喝酒、打斗、狂欢，并将他们的事迹传为萨迦。\n在这，要么你是芬里尔仔兽，要么你是一位必须被打倒的敌人。不幸的是，你属于第二类，所以你不应该耽搁太久。"
 POD_spirit_travel.4600.t: "玻璃天堂"
 POD_spirit_travel.4600.desc: "[GetPlayer.Custom( 'glasswalker_custom_name' )]的母界是一座按照盖亚风格设计建造的大都市。有着带着几十层露天花园的高塔，充满了植被和自然吸引到这些植物边的鸟类和动物。每个花园都迎合了不同的生态环境。许多人类愉快地在少数的几座塔内度过他们的一生。\n这完美的结构化生活对任何疲惫的人的监护者来说都是很好的风景，提醒他们的心灵有更大的目标。"
 POD_spirit_travel.4600.a: "一切都井然有序。"
 POD_spirit_travel.4601.t: "人与狼的头领"
 POD_spirit_travel.4601.desc: "[GetPlayer.Custom( 'glasswalker_custom_name' )]的母界是一座按照盖亚风格设计建造的大都市。有着带着几十层露天花园的高塔，充满了植被和自然吸引到这些植物边的鸟类和动物。每个花园都迎合了不同的生态环境。许多人类愉快地在少数的几座塔内度过他们的一生。\n部族中许多受人尊敬的长者都聚集在这里，准备向恭敬的听众传授他们的智慧。"
 POD_spirit_travel.4601.a: "从混乱中制造秩序。"
 POD_spirit_travel.4602.desc: "[GetPlayer.Custom( 'glasswalker_custom_name' )]的母界是一座按照盖亚风格设计建造的大都市。有着带着几十层露天花园的高塔，充满了植被和自然吸引到这些植物边的鸟类和动物。每个花园都迎合了不同的生态环境。许多人类愉快地在少数的几座塔内度过他们的一生。\n监护者对任何试图扰乱他们所钟爱的秩序的人都保持警惕。因此，你必须在他们发现你之前迅速行动。"
 POD_spirit_travel.4700.t: "蛮野天堂"
 POD_spirit_travel.4700.desc: "赤爪的母界是一个广大的、未受开发的荒野。捕食者不受限制地捕猎，相互竞争。最重要的是大群的狼，它们已经主宰了这片母界。\n赤爪在这感觉在家一般，终于可以自由地让他们的原始本能发挥出来。"
 POD_spirit_travel.4700.a: "理所应当。"
 POD_spirit_travel.4701.t: "狼群之首"
 POD_spirit_travel.4701.desc: "赤爪的母界是一个广大的、未受开发的荒野。捕食者不受限制地捕猎，相互竞争。最重要的是大群的狼，它们已经主宰了这片母界。\n在这里可以找到强大的战群领袖，准备向有价值的幼崽传授他们在荒野的经验。"
 POD_spirit_travel.4701.a: "向最优秀者学习。"
 POD_spirit_travel.4702.desc: "赤爪的母界是一个广大的、未受开发的荒野。捕食者不受限制地捕猎，相互竞争。最重要的是大群的狼，它们已经主宰了这片母界。\n如果你不是这地方的红塔伦，那你就是猎物。而你要面对的是有史以来最强的猎人……"
 POD_spirit_travel.4800.t: "暗影天堂"
 POD_spirit_travel.4800.desc: "影爵生活在一个以大山为主的区域，天空永远被乌云和闪电风暴笼罩。山下的山峰和森林处于永恒的阴影之中，影爵们聚集在城堡里，互相密谋，寻找登山的方法。\n在外人看来，这很奇怪，但对于狡猾的影爵来说，这就像是天堂。"
 POD_spirit_travel.4800.a: "我想在这里拥有我自己的城堡！"
 POD_spirit_travel.4801.t: "阴谋大师"
 POD_spirit_travel.4801.desc: "影爵生活在一个以大山为主的区域，天空永远被乌云和闪电风暴笼罩。山下的山峰和森林处于永恒的阴影之中，影爵们聚集在城堡里，互相密谋，寻找登山的方法。\n在这里可以找到最狡猾的影爵，虽然他们不会轻易说出自己的秘密，但只要适当地尊重他们，就可以说服他们。"
 POD_spirit_travel.4801.a: "我洗耳恭听。"
 POD_spirit_travel.4802.desc: "影爵生活在一个以大山为主的区域，天空永远被乌云和闪电风暴笼罩。山下的山峰和森林处于永恒的阴影之中，影爵们聚集在城堡里，互相密谋，寻找登山的方法。\n像你这样的局外人在这个界域被看作是娱乐项目。居住在这里的影爵已经想出了一些狡猾的方法来捕捉和“玩弄”你……"
 POD_spirit_travel.4900.t: "王道天堂"
 POD_spirit_travel.4900.desc: "银牙的母界是一片广阔的领土，类似于大草原。在王国的中心矗立着英雄城堡，这是纪念银牙为狼国所奉献的事迹的纪念碑。\n诚然，这是一个人人都能看到银牙确实是要成为国王和女王的界域。"
 POD_spirit_travel.4900.a: "我们遥遥领先。"
 POD_spirit_travel.4901.t: "狼群之王"
 POD_spirit_travel.4901.desc: "银牙的母界是一片广阔的领土，类似于大草原。在王国的中心矗立着英雄城堡，这是纪念银牙为狼国所奉献的事迹的纪念碑。\n许多明智的统治者居住在这里，他们理所当然地为自己的地位感到骄傲，并准备向任何好奇的幼狼谈论它。"
 POD_spirit_travel.4901.a: "骄傲狼族的统治者。"
 POD_spirit_travel.4901.b: "坚定的狼国战争领袖。"
 POD_spirit_travel.4902.desc: "银牙的母界是一片广阔的领土，类似于大草原。在王国的中心矗立着英雄城堡，这是纪念银牙为狼国所奉献的事迹的纪念碑。\n这是一片只适合银牙的土地，强大的猎鹰和他的孩子，部族的盟友，警告任何入侵者。狩猎开始了。"
 POD_spirit_travel.5000.t: "地狱般的天堂"
 POD_spirit_travel.5000.desc: "白嚎的前母界已经被$glossary_wyrm$扭曲得面目全非。空气中弥漫着浓浓的烟雾，荡漾着热浪。病态的绿色阳光照射在地面上，没有任何形式的臭氧层阻挡。夜晚，污染物冷却并沉入地表，没有带来任何缓解，导致月亮在蒸汽中呈现荧光黄色。\n只有黑螺旋舞者才能真正欣赏这样的地狱景象，提醒他们妖蛆主人的最终目标。"
 POD_spirit_travel.5000.a: "甜蜜的腐化！"
 POD_spirit_travel.5001.t: "邪祟赞助人"
 POD_spirit_travel.5001.desc: "白嚎的前母界已经被$glossary_wyrm$扭曲得面目全非。空气中弥漫着浓浓的烟雾，荡漾着热浪。病态的绿色阳光照射在地面上，没有任何形式的臭氧层阻挡。夜晚，污染物冷却并沉入地表，没有带来任何缓解，导致月亮在蒸汽中呈现荧光黄色。\n在这里可以找到强大的忌灵，准备将他们的腐化技巧传授给热切的黑螺旋舞者。"
 POD_spirit_travel.5001.a: "腐化世界！"
 POD_spirit_travel.5001.b: "对抗世界！"
 POD_spirit_travel.5002.desc: "白嚎的前母界已经被$glossary_wyrm$扭曲得面目全非。空气中弥漫着浓浓的烟雾，荡漾着热浪。病态的绿色阳光照射在地面上，没有任何形式的臭氧层阻挡。夜晚，污染物冷却并沉入地表，没有带来任何缓解，导致月亮在蒸汽中呈现荧光黄色。\n这里是妖蛆最污秽的界域之一，任何入侵者都会被迅速追杀，（最好情况下）迅速杀死。你不属于这里。"
 POD_spirit_travel.5100.t: "如家天堂"
 POD_spirit_travel.5100.desc: "寂静漫游者的母界被一条巨大的河流所主导，它被称为生命之河。它被永远的黑夜所笼罩，其他地方都是由大片银色的沙漠组成，以刻有象形文字的方尖碑和类似的纪念性建筑为中心，精心排列出纪念古老的寂静漫游者英雄的星座。\n赛特的诅咒使寂静漫游者与他们的故乡隔绝了很长时间，一种深深地解脱感涌上这个部族的任何成员，他们有幸找到了回到这里的路。"
 POD_spirit_travel.5100.a: "终于到家了。"
 POD_spirit_travel.5101.t: "流亡者的教训"
 POD_spirit_travel.5101.desc: "寂静漫游者的母界被一条巨大的河流所主导，它被称为生命之河。它被永远的黑夜所笼罩，其他地方都是由大片银色的沙漠组成，以刻有象形文字的方尖碑和类似的纪念性建筑为中心，精心排列出纪念古老的寂静漫游者英雄的星座。\n在这里可以学到很多东西，特别是流放前的故事，让好奇的寂静漫游者对他们部族的混乱历史有了独特的见解。"
 POD_spirit_travel.5101.a: "我们曾经是一个伟大联盟的一部分。"
 POD_spirit_travel.5101.b: "猫头鹰的做事方式很神秘。"
 POD_spirit_travel.5102.desc: "寂静漫游者的母界被一条巨大的河流所主导，它被称为生命之河。它被永远的黑夜所笼罩，其他地方都是由大片银色的沙漠组成，以刻有象形文字的方尖碑和类似的纪念性建筑为中心，精心排列出纪念古老的寂静漫游者英雄的星座。\n虽然大部分时间是空荡的，但这个界域仍然在等待着它的寂静漫游者居民。任何入侵者只要呆在这里，就会受到诅咒的困扰，并落入令人讨厌的陷阱袭击中。"
 POD_spirit_travel.5200.t: "高傲囚犯"
 POD_spirit_travel.5200.desc: "深渊，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕天者的永恒监狱。\n对于那些被困在这里的人来说，除了自我忏悔和赎罪之外，是无法摆脱持续的折磨的。在这无尽的虚空中，这可能是唯一能让你的理智再保持一段时间的途径。"
 POD_spirit_travel.5200.a: "我犯了错……"
 POD_spirit_travel.5201.t: "狂热囚犯"
 POD_spirit_travel.5202.t: "上帝之惩"
 POD_spirit_travel.5202.desc: "深渊，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕天者的永恒监狱。\n里面的恶魔只能在自己的遗憾、绝望和无能的愤怒中腐烂，而魔邪统治者的阴谋和操纵不过是疯狂的心理游戏，因为堕天者不能伤害或破坏对方。被困于这些阴谋诡计中，肯定会很快失去自己。"
 POD_spirit_travel.5202.a: "我还能做什么呢？"
 POD_spirit_travel.5300.t: "顽固秩序"
 POD_spirit_travel.5300.desc: "[UmbraGlossary('weaver_reaches')]是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。\n要蓬勃发展并了解这个地方，你必须有正确的心态，一个重视秩序和精确性高于一切的人。"
 POD_spirit_travel.5300.a: "听起来像是我喜欢的地方！"
 POD_spirit_travel.5300.b: "我不喜欢这地方……"
 POD_spirit_travel.5301.t: "星际孤独"
 POD_spirit_travel.5301.desc: "[UmbraGlossary('weaver_reaches')]是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。\n这里没有任何生命迹象，使它成为害羞者的理想场所……但对于真正喜欢有同伴的人来说就不完全一样了。"
 POD_spirit_travel.5302.t: "星际勤奋"
 POD_spirit_travel.5302.desc: "[UmbraGlossary('weaver_reaches')]是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。\n浩瀚的$glossary_weaver$之灵，如“星蜘蛛”，在网络上巡逻和维护，并确保一切都保持在其规定的位置。这里没有懒惰，一切都尽可能地遵循其预定的路线。"
 POD_spirit_travel.5400.t: "多变自然"
 POD_spirit_travel.5400.desc: "[UmbraGlossary('wyld_reaches')]是一个混沌的地方。在这里，自然规则不受约束，整个界域不断变化。只有具有特别适应能力的个人才能在这里蓬勃。"
 POD_spirit_travel.5401.t: "自然好友"
 POD_spirit_travel.5401.desc: "[UmbraGlossary('wyld_reaches')]居住着各种类型的灵类生物。虽然有些是敌对的，但如果你愿意，你可以在这里找到一些耐人寻味、足够友好的谈话对象。"
 POD_spirit_travel.5402.t: "自然浪潮"
 POD_spirit_travel.5402.desc: "[UmbraGlossary('wyld_reaches')]是一个混沌的地方。\n大自然在这里不等人。由于你周围的景观一直在转移和变化，如果你想在这个界域生存，你必须使你的心态适应这个事实。这可能不是每个人都能做到的。"
 POD_spirit_travel.5500.t: "痛苦之界"
 POD_spirit_travel.5500.desc: "[UmbraGlossary('wyrm_reaches')]的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向[UmbraGlossary('malfeas')]。满是污染和恶火的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。\n一个充满痛苦和疯狂的地方，只有最颓废的灵魂才能在这里茁壮成长。"
 POD_spirit_travel.5501.t: "憎恶之界"
 POD_spirit_travel.5501.desc: "[UmbraGlossary('wyrm_reaches')]的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向[UmbraGlossary('malfeas')]。满是污染和恶火的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。\n最坏的情绪在这里是自由和繁荣的。仇恨会助长仇恨。"
 POD_spirit_travel.5502.t: "狡诈之界"
 POD_spirit_travel.5502.desc: "[UmbraGlossary('wyrm_reaches')]的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向[UmbraGlossary('malfeas')]。满是污染和恶火的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。\n背叛的念头不断地在你脑海中闪现，让你想起许多试图冒犯过你的人……或你自己冒犯过的人。"
 POD_spirit_travel.5600.t: "行于黑螺旋"
 POD_spirit_travel.5600.desc: "[UmbraGlossary('black_spiral_labyrinth')]，在中原被称为[UmbraGlossaryLocalized('black_spiral_labyrinth','玄黑迷宫')]，是[UmbraGlossary('malfeas')]内的一个螺旋形迷宫，里面有难以想象的$glossary_wyrm$之恐怖。\n这里是妖蛆的据点之一，它最忠实的仆人——黑螺旋舞者就诞生于此。对于崇拜这个实体的人来说，这里以一种扭曲的方式非常接近于一个圣地。"
 POD_spirit_travel.5600.a: "疯狂之旅。"
 POD_spirit_travel.5601.t: "舞于黑螺旋"
 POD_spirit_travel.5601.desc: "[UmbraGlossary('black_spiral_labyrinth')]，在中原被称为[UmbraGlossaryLocalized('black_spiral_labyrinth','玄黑迷宫')]，是[UmbraGlossary('malfeas')]内的一个螺旋形迷宫，里面有难以想象的$glossary_wyrm$之恐怖。\n迷宫对于热心的妖蛆仆人来说充满了礼物。但在螺旋中跳舞是一个令人疯狂的前景，甚至会使已经破碎的心灵更加崩溃。"
 POD_spirit_travel.5601.a: "让我们起舞！"
 POD_spirit_travel.5601.b: "我没心情。"
 POD_spirit_travel.5602.desc: "[UmbraGlossary('black_spiral_labyrinth')]，在中原被称为[UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')]，是[UmbraGlossary('malfeas')]内的一个螺旋形迷宫，里面有难以想象的$glossary_wyrm$之恐怖。\n迷宫崩坏了一整个部族，还有不可估量的所谓英雄的心智，他们现在是妖蛆的热心仆从。只要你呆在这里，你就会受到$glossary_wyrm_corruption$最强大的影响。你应该跑，尽快。"
 POD_spirit_travel.5602.a: "舞走我的理智……"
 POD_spirit_travel.5700.t: "不朽的荣耀"
 POD_spirit_travel.5700.desc: "在这里可以看到由旧埃及的大城市、陵墓和神庙上的激情和欲望所形成的活生生的土地的回声。不朽者或木乃伊在这里建立了他们广泛的王国，以保护他们在穿越危险的杜阿特——亡者之地时的安全。\n随着旧埃及早已从凡人的脑海中消失，这也许是曾经的辉煌的最后残余。任何来到这里的木乃伊都能感受到他们文明的骄傲，但也能感受到失去文明的悲伤。"
 POD_spirit_travel.5700.a: "我必须对黑土之国保持忠诚。"
 POD_spirit_travel.5700.b: "可悲的自豪感。"
 POD_spirit_travel.5700.c: "旧埃及已经死了，已经成了灰。"
 POD_spirit_travel.5701.t: "黑土之国的秘密"
 POD_spirit_travel.5701.desc: "在这里可以看到由旧埃及的大城市、陵墓和神庙上的激情和欲望所形成的活生生的土地的回声。不朽者或木乃伊在这里建立了他们广泛的王国，以保护他们在穿越危险的杜阿特——亡者之地时的安全。\n在这里可以找到许多古埃及最深层的秘密，这些秘密是由经过的木乃伊在他们自己的复活过程中保存下来的。对于花时间阅读圣书字的人来说，有很多东西可以学习。"
 POD_spirit_travel.5701.a: "死亡之秘"
 POD_spirit_travel.5701.b: "灵魂之秘"
 POD_spirit_travel.5701.c: "天空之秘"
 POD_spirit_travel.5701.d: "我只是路过"
 POD_spirit_travel.5702.t: "木乃伊的诅咒"
 POD_spirit_travel.5702.desc: "在这里可以看到由旧埃及的大城市、陵墓和神庙上的激情和欲望所形成的活生生的土地的回声。不朽者或木乃伊在这里建立了他们广泛的王国，以保护他们在穿越危险的杜阿特——亡者之地时的安全。\n这地方只为埃及的不朽者准备，而你并不是他们中的一员。因此，当你试图掠夺古老的秘密时，巧妙的陷阱到处都在涌现。每当你试图接近秘密，它反而会离得更远。"
 POD_spirit_travel.5702.a: "这是一个失败的原因。"
 POD_spirit_travel.5800.t: "原初之秘"
 POD_spirit_travel.5800.desc: "第一城是神话中该隐之子吸血鬼的诞生地。很久以前，它被上帝之怒所淹没，现在仍作为[UmbraGlossaryLocalized('shadowlands','冥界')]的回响被保存下来。\n作为一些曾经在大地上行走的最强大的实体的藏身处，第一城是一个前所未有的记忆和知识的宝库。然而，有些真相最好被埋藏起来，这里有些东西可以粉碎最狂热的人的信仰。"
 POD_spirit_travel.5800.a: "巨人的道途……"
 POD_spirit_travel.5800.b: "这太危险了。"
 POD_spirit_travel.5801.t: "以诺城之战"
 POD_spirit_travel.5801.desc: "第一城是神话中该隐之子吸血鬼的诞生地。很久以前，它被上帝之怒所淹没，现在仍作为[UmbraGlossaryLocalized('shadowlands','冥界')]的回响被保存下来。\n以诺城是缠绕在冥河城帝国和吸血鬼秘密组织塔尔玛埃拉之间的战场。每夜，在这曾经伟大的城市的争议地区都会发生战斗。"
 POD_spirit_travel.5801.a: "值得的努力。"
 POD_spirit_travel.5801.effect.success.desc: "你勇敢地战斗，学得武术知识。"
 POD_spirit_travel.5801.success: "漂亮的一仗！"
 POD_spirit_travel.5801.failure.effect.desc: "你被打跑了。"
 POD_spirit_travel.5801.failure: "这不值得……"
 POD_spirit_travel.5802.t: "恐怖之宫该玛尔"
 POD_spirit_travel.5802.desc: "第一城是神话中该隐之子吸血鬼的诞生地。很久以前，它被上帝之怒所淹没，现在仍作为[UmbraGlossaryLocalized('shadowlands','冥界')]的回响被保存下来。\n该隐那被称为“恐惧之宫”的高大房屋，矗立在城市的中心。显然，这只是真实场所的回响，但仍然是一个非常令人印象深刻的景象。这也是一个可怕的地方，因为你几乎可以感觉到黑暗之父在这个地方的那么久以前的痕迹……"
 POD_spirit_travel.5802.a: "他不在这对吧？"
 POD_spirit_travel.5403.t: "友善混沌"
 POD_spirit_travel.5403.desc: "[UmbraGlossary('wyld_reaches')]有各种类型的灵类。在不断的运动中，它们以极快的速度创造、进化和死亡。如果你设法迫使这些灵体放慢速度，其中一些创造可能是有用的。这可能需要花点时间来说服他们，但结果可能是值得的，尽管你不能确定。"
 POD_spirit_travel.5403.a: "一把月刃总能派上用场！"
 POD_spirit_travel.5403.b: "多么奇怪的袋子。"
 POD_spirit_travel.5403.c: "这针能做什么？"
 POD_spirit_travel.5403.d: "好奇异的装置！"
 POD_spirit_travel.5403.e: "我不需要任何这些小玩意。"
 POD_spirit_travel.3903.t: "狩猎的回报"
 POD_spirit_travel.3903.desc: "狼之家是一片广袤的原始荒野，一个严酷而无情的界域，在这里，狼可以很容易地成为捕食者或成为猎物。\n作为一个有成就的猎人，你一直在参与整个界域组织的许多狩猎活动之一。它们中的每一个都将是一个耗费精力的努力，但它们也会提供一些灵物作为奖励。"
 POD_spirit_travel.3903.a: "有意思的耳环。"
 POD_spirit_travel.3903.b: "一条毯子？真的？"
 POD_spirit_travel.3903.c: "可怕的面具……"
 POD_spirit_travel.3903.d: "盆子也能是灵具？"
 POD_spirit_travel.4003.t: "杀出一条血路"
 POD_spirit_travel.4003.desc: "卡列姆是近影界中的一座妖蛆领域。当一种特别强烈的、负面的情绪在物理世界的某个地方表达出来时，它们就会显现出来，并在[umbra|E]留下痕迹。它是一块磁铁，吸引着呆在卡列姆附近的忌灵和灵类，用迹象显示出它们各自情绪，甚至无生命的物体也会因接近而受到污染。\n许多灵物在这个地方丢失，可以由一位有进取心的冒险家找回。但忌灵守护者不会轻易放走他们。"
 POD_spirit_travel.4003.a: "这个地方有一个娃娃？"
 POD_spirit_travel.4003.b: "一个颅骨。不错。"
 POD_spirit_travel.4003.c: "这块卵石散发着能量。"
 POD_spirit_travel.4003.d: "一些长袍？可以。"
 POD_spirit_travel.4003.e: "一把看起来很强大的斧子。"
 POD_spirit_travel.4003.f: "这骨头有魔法力量在内，显然可见。"
 POD_spirit_travel.2603.t: "与巨灵讨价还价"
 POD_spirit_travel.2603.desc: "[UmbraGlossary('city_of_brass')]是巨灵们的家园，也是他们最强大的城堡。在过去与法师们进行了一些肮脏的交易之后，这些灵类对来访者不太友好。更糟糕的是，他们被称为强迫性十足的骗子。\n聪明的诸灵已经囤积了很长时间的宝物，并喜欢向客人展示这些宝物。他们也喜欢讨价还价，他们可以被说服以一定的价格放弃一些宝物。"
 POD_spirit_travel.2603.a: "这本书看起来很有趣。"
 POD_spirit_travel.2603.b: "斗篷？多么有威严。"
 POD_spirit_travel.2603.c: "这支长枪看起来很不错。"
 POD_spirit_travel.2603.d: "让我们来看看这块小东西。"
 POD_spirit_travel.2503.t: "与缪斯同奏"
 POD_spirit_travel.2503.desc: "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。\n缪斯是友好的，也常常是孤独的。因此，她们要求你花一点时间和她们在一起，她们向你讲述古典希腊的伟大故事，如果你这样做，她们会给予奖励。然而，她们的故事也许有点太迷人了，你会发现自己在听的过程中不时地飘飘然。"
 POD_spirit_travel.2503.a: "护身符？你没有吧。"
 POD_spirit_travel.2503.b: "这把锤子曾属于伟大的英雄？"
 POD_spirit_travel.2503.c: "这能控制天气？"
 POD_spirit_travel.2503.d: "看上去很棒的面具。谢谢你们。"
 POD_spirit_travel.4403.effect.success.desc: "你找到了宝物！"
 POD_spirit_travel.4403.success: "新的珍宝"
 POD_spirit_travel.4403.failure.effect.desc: "这场冒险以失败告终"
 POD_spirit_travel.4403.failure: "失败"
 POD_spirit_travel.4403.t: "塔拉三奇物"
 POD_spirit_travel.4403.desc: "芬尼安的母界是一片由丘陵、峡谷和山谷组成的绿色景观，看起来像是从经典奇幻小说中汲取的一样。妖精们在树林里玩耍，雄鹿之灵在牡鹿的指导形成“狂猎”在土地上游荡，保护母界免受入侵者的侵扰。\n很久以前，芬尼安在塔拉山的艰难战斗中失去了三件强大的圣物。从那时起，对够格的芬尼安领导人来说，发起一场找回这些圣物的探险是一种常见的仪式。然而，这样的努力将是昂贵的，且不能保证成功。"
 POD_spirit_travel.4403.a: "我们必须找到白鹿之角！"
 POD_spirit_travel.4403.b: "金颈环可以被取回！"
 POD_spirit_travel.4403.c: "老妪之舌呼唤着我。"
 POD_spirit_travel.3503.t: "龙的宝库"
 POD_spirit_travel.3503.desc: "泛古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。这是一个地球上所有陆地融为一块的时代，是一个充满了不合时宜和被遗忘已久的恐怖的前代尘世。\n凶猛的龙类生物生活在这片土地上，正如故事中所说的那样，它们积累了相当多的原始宝藏，它们嫉妒地将其据为己有。你可以尝试进行一次大胆的抢劫，但这些生物被刺激时显然相当危险。"
 POD_spirit_travel.3503.a: "亮闪闪！"
 POD_spirit_travel.3503.b: "这听起来像个很坏的主意。"
 POD_spirit_travel.2303.t: "幸运日"
 POD_spirit_travel.2303.desc: "悟韵体现了最抽象的概念，往往显现为[UmbraGlossary('vulgate')]天空中的彩色云彩。\n一个奇异场地，许多东西最终流失到这里。但丢失的东西可以再次找到，今天，幸运女神站在你这边。一件散发着魔力的稀有物品从云层中落到你的脚下。"
 POD_spirit_travel.2303.a: "一件王冠！看起来是用羽毛做成的。"
 POD_spirit_travel.2303.b: "一件王冠！看起来是用铁做成的。"
 POD_spirit_travel.2303.c: "这是一块该死的大石头。"
 POD_spirit_travel.4103.t: "狮牙"
 POD_spirit_travel.4103.desc: "黑怒的母界类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中，最近还出现了来自世界各地的建筑。\n一件强大的宝物，据说是来自远离希腊的土地，曾被一位奇怪的飞马之女带到这个界域。有一天，她和她的武器一起消失了，从那时起，黑怒的年轻人和老人都在寻找它。你可以试试你的运气，找到这个传说中的遗物。"
 POD_spirit_travel.4103.a: "天马！引导我！"
 POD_spirit_travel.4603.t: "唤梦者"
 POD_spirit_travel.4603.desc: "[GetPlayer.Custom( 'glasswalker_custom_name' )]的母界是一座按照盖亚风格设计建造的大都市。有着带着几十层露天花园的高塔，充满了植被和自然吸引到这些植物边的鸟类和动物。每个花园都迎合了不同的生态环境。许多人类愉快地在少数的几座塔内度过他们的一生。\n监护者的一件珍贵的宝物——唤梦者，就存放在这个界域的一位守护者的手中。众所周知，他们会将这件强大的宝物托付给那些已经证明自己有能力领导人类的监护者。因此，你可以尝试说服他们你是位重要人物。"
 POD_spirit_travel.4603.a: "人类爱我！"
 POD_spirit_travel.4303.t: "附魔之竖琴"
 POD_spirit_travel.4303.desc: "盖亚之子的母界是一片广阔的森林，其下山丘连绵起伏，潺潺的溪流在山谷中蜿蜒流淌。摆脱了妄悸的人类在母界各地游荡，中央的大都市是座纯洁化的古苏美尔城市。\n部族最珍贵的宝物之一，附魔之竖琴，就在这里。只有在需要的时候，它才能被一位够格的斗士从界域中取出。也许你可以试着说服你的同僚，现在确实是正确的时机，而且你值得拥有它？"
 POD_spirit_travel.4303.a: "首先……"
 POD_spirit_travel.4903.t: "冰刃"
 POD_spirit_travel.4903.desc: "银牙的母界是一片广阔的领土，类似于俄罗斯大草原。在王国的中心矗立着英雄城堡，这是纪念银牙为狼国所奉献的事迹的纪念碑。\n你被带到冰刃——部族的传奇遗物——面前，并被告知它过去的光荣和够格的持有者。你还被告知，任何一位银牙都可以为了它的拥有而向它现在的主人挑战，进行一场“动态战棋”。你的向导笑着问你是否有兴趣。"
 POD_spirit_travel.4903.a: "我最会纸上谈兵了！"
 POD_spirit_travel.4203.t: "元素之戒"
 POD_spirit_travel.4203.desc: "啮骨者的母界就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。\n在其中一条巷子里，你偶然发现了一个有着很高赌注的赌博。赌徒们召唤你加入他们，用这游戏的最终奖品的承诺来诱惑你，似乎是一件充满魔法的强力戒指。"
 POD_spirit_travel.4203.a: "让我们玩一局。"
 POD_spirit_travel.4803.t: "大月刃"
 POD_spirit_travel.4803.desc: "影爵生活在一个以大山为主的区域，天空永远被乌云和闪电风暴笼罩。山下的山峰和森林处于永恒的阴影之中，影爵们聚集在城堡里，互相密谋，寻找登山的方法。\n你最近了解到，这里的一位城堡居民拥有一件罕见的、强大的大月刃。也许你可以组织一次远征，解除他的这个负担？"
 POD_spirit_travel.4803.a: "迅速且安静。"
 POD_spirit_travel.4503.t: "酋长之锤"
 POD_spirit_travel.4503.desc: "被永恒冬季所笼罩的峡湾、广袤的苔原、和寒冷黑暗的寒温带针叶林构成了芬里尔的母界。冰河时代的巨型动物群，如冰原狼和猛犸象，在这片土地上游荡，并攻击任何孤行的狼人。芬里尔聚集在长屋村，他们在那里喝酒、打斗、狂欢，并将他们的事迹传为萨迦。\n七大强大的酋长之锤是那些为阻止受诅的沃坦而献出生命的英雄们的珍贵武器。有些在战后被取回，有些则丢失了。但所有这些都将是野心勃勃的芬里尔愿意去寻找的奖品。"
 POD_spirit_travel.4503.a: "锻·碾？"
 POD_spirit_travel.4503.b: "磨·牙？"
 POD_spirit_travel.4503.c: "矛·逐？"
 POD_spirit_travel.4503.d: "妖·吞？"
 POD_spirit_travel.4503.e: "光·臂？"
 POD_spirit_travel.4503.f: "巫·爪？"
 POD_spirit_travel.4503.g: "痛·鹰？"
 POD_spirit_travel.4703.t: "符文石"
 POD_spirit_travel.4703.desc: "赤爪的母界是一个广大的、未受开发的荒野。捕食者不受限制地捕猎，相互竞争。最重要的是大群的狼，它们已经主宰了这片母界。\n据说，在这界域里，人们可以找到很久以前居住在这里的古狼留下的符文石。但只有最勇敢和最聪明的赤爪才有希望找到这些传说中的遗物。"
 POD_spirit_travel.4703.a: "我得搜寻口舌符文石"
 POD_spirit_travel.4703.b: "战争符文石在呼唤我"
 POD_spirit_travel.4703.c: "我需要统御符文石"
 POD_spirit_travel.4703.d: "附近有狡诈符文石"
 POD_spirit_travel.4703.e: "智慧符文石能教会我很多"
 POD_spirit_travel.5900.t: "出战亡者"
 POD_spirit_travel.5900.desc: "在[UmbraGlossary('dark_kingdom_of_sand')]建立之前，埃及的亡者居住在尼特–赫特，即“神圣的地下场所”。第一位在尼特–赫特行走的人是阿努比斯。正是在这里，奥西里斯第一次开始统治亡者，并将他最忠诚的部下聚集在他身边。在罗马帝国的鼎盛时期，[UmbraGlossary('dark_kingdom_of_iron')]开始入侵，将尼特–赫特据为己有。战争一直持续到现在。\n这场冲突对埃及亡者来说进展不顺，因为[UmbraGlossary('dark_kingdom_of_iron')]的人数大大超过他们，并继续夜以继日地增长。尽管如此，埃及的儿女们仍在继续战斗，使用那些在凡人世界已经被认为是过时的战术，比如战车。"
 POD_spirit_travel.5900.a: "战车是一个令人印象深刻的景象。"
 POD_spirit_travel.5900.b: "它们的过时是有原因的。"
 POD_spirit_travel.5901.t: "圣地之主"
 POD_spirit_travel.5901.desc: "在[UmbraGlossary('dark_kingdom_of_sand')]建立之前，埃及的亡者居住在尼特–赫特，即“神圣的地下场所”。第一位在尼特–赫特行走的人是阿努比斯。正是在这里，奥西里斯第一次开始统治亡者，并将他最忠诚的部下聚集在他身边。在罗马帝国的鼎盛时期，[UmbraGlossary('dark_kingdom_of_iron')]开始入侵，将尼特–赫特据为己有。战争一直持续到现在。\n阿努比斯统治着这里，事实证明这位胡狼神是一位狡猾的外交家。他与隐居在冥河城的卡戎达成的协议，使尼特–赫特在不失去其独立性的同时，获得了一些急需的援军。统治一个看似永恒战争吞噬的国度，是一种你可以欣赏的才能。"
 POD_spirit_travel.5901.a: "从奥西里斯的儿子身上可以学到很多。"
 POD_spirit_travel.5901.b: "先兵后礼。"
 POD_spirit_travel.5902.t: "法老服饰"
 POD_spirit_travel.5902.desc: "在[UmbraGlossary('dark_kingdom_of_sand')]建立之前，埃及的亡者居住在尼特–赫特，即“神圣的地下场所”。第一位在尼特–赫特行走的人是阿努比斯。正是在这里，奥西里斯第一次开始统治亡者，并将他最忠诚的部下聚集在他身边。在罗马帝国的鼎盛时期，[UmbraGlossary('dark_kingdom_of_iron')]开始入侵，将尼特–赫特据为己有。战争一直持续到现在。\n尽管有致命的战争在进行，埃及亡者的灵魂仍然尽力适应，把这个国度锻造成理想中的古埃及。你遇到了许多熟练的工匠，一些愿为你提供专业服务，只要你能拿出一些钱币。在这样一个受困的国度，这样做是很正常的。"
 POD_spirit_travel.5902.a: "这些衣服很适合皇室成员！"
 POD_spirit_travel.5902.b: "我喜欢我自己的风格，谢谢。"
 POD_spirit_travel.6000.t: "兑水"
 POD_spirit_travel.6000.desc: "[UmbraGlossary('elemental_courts')]是[UmbraGlossaryLocalized('astral_reaches','高影界')]内的元素系统的反映。元素庭的入口是五大门，可以在众峰的中央位置找到。虽然有许多其他元素，而且随着人类社会的快速变化，还有更多的元素形成，但只有五大元素足够稳定，可以被认为是王廷。\n与液态、情感、西方方位和原始精髓相关，该界域的居民经常关心访客的一般情况，参与他们的感受和视角。这可能是一种非常放松的体验，也可能是一种残酷的回忆，这种宁静在其他地方并不真正存在。"
 POD_spirit_travel.6000.a: "如此的安宁……"
 POD_spirit_travel.6000.b: "我得继续前进。"
 POD_spirit_travel.6001.t: "清风"
 POD_spirit_travel.6001.desc: "[UmbraGlossary('elemental_courts')]是[UmbraGlossaryLocalized('astral_reaches','高影界')]内的元素系统的反映。元素庭的入口是五大门，可以在众峰的中央位置找到。虽然有许多其他元素，而且随着人类社会的快速变化，还有更多的元素形成，但只有五大元素足够稳定，可以被认为是王廷。\n与气态、思想、东方方位和动态本质想关，气之主是最好客的元素之一，经常用谜语和类似的把戏来挑战来访者的智力。"
 POD_spirit_travel.6001.a: "我是解谜大师！"
 POD_spirit_travel.6001.b: "谜语很蠢。"
 POD_spirit_travel.6002.t: "怒火……"
 POD_spirit_travel.6002.desc: "[UmbraGlossary('elemental_courts')]是[UmbraGlossaryLocalized('astral_reaches','高影界')]内的元素系统的反映。元素庭的入口是五大门，可以在众峰的中央位置找到。虽然有许多其他元素，而且随着人类社会的快速变化，还有更多的元素形成，但只有五大元素足够稳定，可以被认为是王廷。\n与等离子态、直觉、南方方位和探索精华相关，这个界域的居民粗鲁而直接，希望访客能说明他们的来由并继续前进。战斗在这里很常见，这个界域的居民很乐意给任何新来者上一两堂关于鲁莽暴行的课。"
 POD_spirit_travel.6002.a: "我已经够火了！"
 POD_spirit_travel.6002.b: "暴力不是答案。"