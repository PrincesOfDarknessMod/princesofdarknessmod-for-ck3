l_simp_chinese:
 spirit_travel_header:0 "灵游："
 POD_spirit_travel.1001.t:0 "$spirit_travel_header$灵感"
 POD_spirit_travel.1001.desc:0 "邻近绝壁的灵界区域被称为镜像之地，因为其看起来就像附近中原地区的倒影而得名。\n\n由于这是你的第一次灵界旅行，看到这奇异的景色让你感到悟得了什么。"
 POD_spirit_travel.1001.a:0 "厉害！"
 POD_spirit_travel.1002.t:0 "$spirit_travel_header$灵师教导"
 POD_spirit_travel.1002.desc_opening:0 "你进入了灵界，尽可能的深，然后你遇到了一位"
 POD_spirit_travel.1002.desc_high:0 "上古者，历史记录上的万鬼，太上老祖"
 POD_spirit_travel.1002.desc_yin:0 "阎魔"
 POD_spirit_travel.1002.desc_yang:0 "强大灵类"
 POD_spirit_travel.1002.desc_low:0 "普通灵类"
 POD_spirit_travel.1002.desc_ending:0 "，其向你分享了一些心法理解。"
 POD_spirit_travel.1002.a:0 "我的灵师。"
 POD_spirit_travel.1010.t:0 "$spirit_travel_header$禁忌亵渎"
 POD_spirit_travel.1010.desc:0 "你已身处虚空之井。见不到任何逃跑的机会，也许你应该听从那诱人的低语……"
 POD_spirit_travel.1010.a:0 "我向你屈服，巨蛇！"
 POD_spirit_travel.1010.b:0 "绝不！"
 POD_spirit_travel.1200.t:0 "$spirit_travel_header$恶湍"
 POD_spirit_travel.1200.desc:0 "恶湍从迷宫域中喷发而出，可以触及大风暴所在的任何地方——从幽土到[dark_kingdom|E]。恶湍由冥界的事物组成——遗物、怨灵和大风暴本身，从灵质雨到灵火雨不等。大风暴是一场回忆的风暴，幸运的拾荒者可以找到一两件藏在渣滓中的有用物品。"
 POD_spirit_travel.1200.a:0 "我可以在里面找到什么有用的东西。"
 POD_spirit_travel.1200.b:0 "我该躲起来。"
 POD_spirit_travel.1211.t:0 "$spirit_travel_header$战界"
 POD_spirit_travel.1211.desc:0 "战界包含着有史以来的每一场战斗，而你从其中学会了新战术。"
 POD_spirit_travel.1003.t:0 "$spirit_travel_header$灵师教导"
 POD_spirit_travel.1003.desc:0 "你进入了灵界，尽可能的深，然后你遇到了[spirit_mentor.GetName]，其向你分享了一些精神教诲。 "
 POD_spirit_travel.1003.a:0 "我的灵师。"
 POD_spirit_travel.1221.t:0 "$spirit_travel_header$神秘装置"
 POD_spirit_travel.1221.desc:0 "构界是充满了人类梦寐以求的所有发明的界域。一群法师，也就是发现这个地方的人的继承人，控制着这个界域，一部分是希望推动人类知识的发展，另一部分是为了从中获利。\n今天，你在填满这个界域的大量堆积物中发现了一个神秘的装置。你打算怎么处理它？"
 POD_spirit_travel.1221.a:0 "我会留着它。"
 POD_spirit_travel.1221.b:0 "我会卖了它。"
 POD_spirit_travel.1222.t:0 "$spirit_travel_header$被发明淹没"
 POD_spirit_travel.1222.desc:0 "你想在构界的巨大堆积物中搜索，找到什么有用的发明吗？"
 POD_spirit_travel.1222.a:0 "我会试试。"
 POD_spirit_travel.1222.b:0 "算了。"
 POD_spirit_possession.1001.t:0 "$spirit_travel_header$附灵"
 POD_spirit_possession.1001.desc:0 "一只忌灵突然出现并尝试附身你。"
 POD_spirit_possession.1001.a:0 "我会接受。"
 POD_spirit_possession.1001.b:0 "我可以为你提供其他容器……"
 POD_spirit_possession.2001.t:0 "$spirit_travel_header$附灵"
 POD_spirit_possession.2001.desc:0 "一只奇原属灵突然出现并尝试附身你。"
 POD_spirit_possession.2001.a:0 "我会接受。"
 POD_spirit_possession.2001.b:0 "我可以为你提供其他容器……"
 POD_spirit_possession.3001.t:0 "$spirit_travel_header$附灵"
 POD_spirit_possession.3001.desc:0 "一只织者属灵突然出现并尝试附身你。"
 POD_spirit_possession.3001.a:0 "我会接受。"
 POD_spirit_possession.3001.b:0 "我可以为你提供其他容器……"
 POD_spirit_possession.4001.t:0 "$spirit_travel_header$附灵"
 POD_spirit_possession.4001.desc:0 "一只盖亚属灵突然出现并尝试附身你。"
 POD_spirit_possession.4001.a:0 "我会接受。"
 POD_spirit_possession.4001.b:0 "我可以为你提供其他容器……"
 POD_umbra_pass.101.t:0 "$spirit_travel_header$开启虚洞"
 POD_umbra_pass.101.desc:0 "在幽土和大风暴之间存在着一层影幕，你得先在上开启一个虚洞来进入大风暴。"
 POD_umbra_pass.101.a:0 "我将做出献祭来开启它。"
 POD_umbra_pass.101.b:0 "算了。"
 POD_umbra_pass.102.t:0 "跨过暗隐寺庙"
 POD_umbra_pass.102.desc:0 "暗隐寺庙是秽恶界域的一个地点，位于黑螺旋迷宫的入口。它是清真寺和大教堂的混合体，是东方宣礼塔和西方柱身凹槽的混合体。"
 POD_umbra_pass.102.a:0 "我将要求通过。"
 POD_umbra_pass.102.a.tt:0 "这个选项可用是因为你是妖蛆的仆从。"
 POD_umbra_pass.102.b:0 "我想溜进去"
 POD_umbra_pass.102.b.duel.desc:0 "潜行挑战"
 POD_umbra_pass.102.b.duel.tt.success:0 "还好过了。"
 POD_umbra_pass.102.b.duel.tt.failure:0 "！"
 POD_umbra_pass.102.c:0 "我最好还是别进去。"
 POD_umbra_pass.103.t:0 "$spirit_travel_header$不再游荡"
 POD_umbra_pass.103.desc:0 "你完全不受活人世界的束缚，只要你想，就可以直接前往冥界不复返。你仍然在这里的唯一原因是你想在这里，而不是说你必须像大多数鬼魂一样受束。你确定你现在就要离世吗？"
 POD_umbra_pass.103.a:0 "是时候跨越大风暴了。"
 POD_umbra_pass.103.b:0 "我还有事要做。"
 POD_umbra_pass.104.t:0 "穿过尸幕"
 POD_umbra_pass.104.desc:0 "你确定要以将自己射过尸幕吗？这将伤害你的[Corpus|E]（伤害相当于当地的尸幕等级）。"
 POD_umbra_pass.104.a:0 "是的！"
 POD_umbra_pass.104.b:0 "不。"
 POD_umbra_lost.101.t:0 "$spirit_travel_header$迷失于大风暴"
 POD_umbra_lost.101.desc:0 "你无法在大风暴中确定自己的方向，现在你又回到了你起始的地方。"
 POD_umbra_lost.101.a:0 "行吧。"
 POD_umbra_lost.102.t:0 "$spirit_travel_header$陷于迷宫域"
 POD_umbra_lost.102.desc:0 "你无法在无意义的迷宫域中确定自己的方向，现在你又回到了你起始的地方。"
 POD_umbra_lost.102.a:0 "我迷失了。"
 POD_umbra_lost.102.b:0 "巨蛇救我！"
 POD_umbra_fallback.1100.t:0 "外交挑战"
 POD_umbra_fallback.1100.desc:0 "你被住在这个区域的人拦住了，也许你可以说服他们告诉你如何通过？影界的居民是出了名的难以理解，甚至更难以说服。"
 POD_umbra_fallback.1110.t:0 "军事挑战"
 POD_umbra_fallback.1110.desc:0 "你被一个棋局所阻止，是时候展示你有多善于此道了。不过，以缚灵形式玩“动态”战役，一开始是很难掌握的，这使得这是一种令人不安的超现实体验。"
 POD_umbra_fallback.1120.t:0 "管理挑战"
 POD_umbra_fallback.1120.desc:0 "你被一个数学谜题拦住了，你善于此么？你必须先破译诡计多端的灵类所使用的数字，这使问题更难解决。"
 POD_umbra_fallback.1130.t:0 "谋略挑战"
 POD_umbra_fallback.1130.desc:0 "你在路上遇到了一个强大的灵卫，也许你可以用一些小把戏来分散其的注意力？不过最好让人信服，他看起来真的不友好。"
 POD_umbra_fallback.1140.t:0 "学识挑战"
 POD_umbra_fallback.1140.desc:0 "你被一个字谜拦住了，你能解决这个问题吗？影界是“真实”世界的扭曲版本，你可以找到一些规律和线索，至少对你有一点意义。"
 POD_umbra_fallback.1100.a:0 "我会尽我全力。"
 POD_umbra_fallback.1100.critical_success:0 "大成功"
 POD_umbra_fallback.1100.success:0 "成功"
 POD_umbra_fallback.1100.fail:0 "失败"
 POD_umbra_fallback.1100.critical_fail:0 "大失败"
 POD_gauntlet.101.t:0 "尸幕"
 POD_gauntlet.101.desc:0 "冥界与皮肤之地被一个被称为”尸幕“的神秘屏障分开。尸幕使大多数生物无法感知幽土，并使死人无法看到皮肤之地的活动。它在部分地区极其强大，于某些地方又极其薄弱，但它无处不在永不缺席。\n\n你可以通过能力将尸幕强化或弱化，如果被提升到10，当地的灵类得耗费意志力不然必须逃离本地。"
 POD_gauntlet.101.a:0 "增强尸幕"
 POD_gauntlet.101.b:0 "削弱尸幕"
 POD_gauntlet.101.c:0 "击溃尸幕！"
 POD_gauntlet.101.d:0 "算了。"
 POD_gauntlet.102.t:0 "绝壁"
 POD_gauntlet.102.desc:0 "中原的灵界受一道神秘的壁障阻碍，这道壁障被称作绝壁，它阻隔了灵界和凡界之间的直接接触。绝壁在部分地区极其强大，于某些地方又极其薄弱，但绝壁无处不在永不缺席。\n\n你可以通过能力将绝壁强化或弱化，如果被提升到10，当地无法使用任何气功功法，同时当地的灵类得耗费意志力不然必须逃离本地，此类环境下使用气池能量会极大不适而且困难。"
 POD_gauntlet.102.a:0 "强化绝壁"
 POD_gauntlet.102.b:0 "弱化绝壁"
 POD_gauntlet.102.d:0 "算了。"
 POD_spirit_possession.1001.c:0 "想也别想！"
 POD_spirit_possession.2001.c:0 "想也别想！"
 POD_spirit_possession.3001.c:0 "想也别想！"
 POD_spirit_possession.4001.c:0 "想也别想！"
 POD_umbra_lost.100.t:0 "#X $spirit_travel_header$落入湮灭#!"
 POD_umbra_lost.100.desc:0 "#X 你落入到湮灭中……#!"
 POD_umbra_lost.100.a:0 "#X ……#!"
 POD_umbra_pass.105.t:0 "停下！"
 POD_umbra_pass.105.desc:0 "你被守卫拦住了，他们觉得你不是冥河城的一份子，你将如何处理？"
 POD_umbra_pass.105.a:0 "我是来加入军团的。"
 POD_umbra_pass.105.b:0 "我是来加入行会的。"
 POD_umbra_pass.105.c:0 "我已经是你们的一员了！"
 POD_umbra_pass.105.d:0 "我只是在周边走走。"
 POD_umbra_pass.106.t:0 "停下！"
 POD_umbra_pass.106.desc:0 "你被守卫拦住了，他们觉得你不是彼岸的一份子，你将如何处理？"
 POD_umbra_pass.106.a:0 "我是来赞扬闪耀者的。"
 POD_umbra_pass.106.b:0 "我已经是你们的一员了！"
 POD_umbra_pass.106.c:0 "我只是在周边走走。"
 POD_umbra_pass.107.t:0 "停下！"
 POD_umbra_pass.107.desc:0 "帝乌斯被由失事船只组成的迷宫所保护，里面住着一些被努德里的怀拥所奴役的怨灵，以防止好奇的死灵和敌对的怨灵靠近。穿过迷宫的路径不断变化，没有船夫协会的同意，几乎不可能进入帝乌斯。你将如何处理？"
 POD_umbra_pass.107.a:0 "我想向你们效忠。"
 POD_umbra_pass.107.b:0 "我只是在周边走走。"
 POD_umbra_pass.107.a.duel.desc:0 "断绝仪式"
 POD_umbra_lost.104.t:0 "$spirit_travel_header$困在深渊"
 POD_umbra_lost.104.desc:0 "你再次落入上帝在路西法反叛之后为你的同族创造的永恒监狱。上帝，似乎仍然笑到最后。"
 POD_umbra_lost.104.a:0 "不！"
 POD_umbra_lost.104.b:0 "我会再逃出去的！"
 trapped_in_abyss_modifier:0 "困在深渊"