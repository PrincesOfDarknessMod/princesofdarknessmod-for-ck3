l_simp_chinese:
 podshih.1010.t: "天军与裁判所"
 podshih.1010.desc: "在天军重建百年之后，对鬼神展开全面战争的机会出现了。\n在西方，天主教会的暗影裁判所已经开始清洗他们自己的土地，使你也能够加大战争强度。是时候结束这一切了。"
 podshih.1010.a: "我将参与。"
 podshih.1010.a.tt: "我将能使用[empire|E][GetPlayer.GetFaith.Custom('GHWName')][casus_belli|E]。"
 podshih.100.t: "免战牌"
 podshih.100.desc: "[shih.GetFirstName]想要跟你签署和平条约。[GetTrait('shih').GetName( GetPlayer )]时常这么做，因为他们需要时间来平复因敌意和暴力引发的心魔。"
 podshih.100.a: "我同意。"
 podshih.100.b: "我不接受。"
 POD_shih_events.0001.t: "了解你的敌人"
 POD_shih_events.0001.desc: "士的建立者，万公义大师，在他的路途中遇见了许多陌生之物。他们中的一些很友好，也有不友善的，还有部分在这个时代已经完全灭绝了。尽管如此，他知道这些生物中的任何一种都可能被邪恶所诱惑，因此需要他的干预。\n效仿着榜样，士学会了在许多不同的技能上完善自己，准备应对他们可能遇到的任何意外威胁。"
 POD_shih_events.0001.a: "[diplomacy|E]重点训练"
 POD_shih_events.0001.b: "[martial|E]重点训练"
 POD_shih_events.0001.c: "[stewardship|E]重点训练"
 POD_shih_events.0001.d: "[intrigue|E]重点训练"
 POD_shih_events.0001.e: "[learning|E]重点训练"
 POD_shih_events.0001.f: "我改变主意了"
 POD_shih_events.0002.t: "心胜于物"
 POD_shih_events.0002.desc: "士不确定窍是由他们的创始人万公义大师发明的，还是由友好的超自然者教给他的。无论如何，它一次次地被证明是他们最宝贵的财富，可以与超自然者的可怕力量相媲美，甚至有时将其超越。窍的核心是通过强烈的专注来引导气。因此，士的大部分训练都是为了掌握这些技艺就并不奇怪了。"
 POD_shih_events.0002.a: "[qiao_lifestyle|E]重点训练"
 POD_shih_events.0002.b: "General mental training."
 POD_shih_events.0003.t: "The Human Prowess"
 POD_shih_events.0003.desc: "The founder of the Shih, master Wan Kung Yi, mostly focused first on physical training for his students. While some argue that it was a cause for his downfall and the rise of the Celestial Army, few dare deny that it is a necessary practice for any would be demon hunter.\nWhile the Shih don't attack the supernaturals on sight, they aren't foolish enough to think that they will receive the same courtesy from the more evil members of these factions."
 POD_shih_events.0003.a: "[prowess|E]重点训练"
 POD_shih_events.0003.b: "我改变主意了"
 POD_shih_events.0004.t: "Shared Meditation"
 POD_shih_events.0004.desc: "While they can display impressive powers, the Shih are still very much mortals at their core. The tale of their founder, master Wan Kung Yi, and his teachings are their primary guidelines but they also have been influenced by the cultures they live in. With many understanding that Yi's fall was due to his lack of control of his own emotions, the practice of meditation has become a staple of the Shih training regimen."
 POD_shih_events.0004.a: "Reflecting on our cause"
 POD_shih_events.0004.b: "Healing our mind"
 POD_shih_events.0005.t: "The Shih's Duty"
 POD_shih_events.0005.desc: "虽然他们认为自己是怪物和恶魔的猎人，但士遵循了他们创始人的戒律，即即使是超自然也是这个世界的一部分。考虑到这一点，只有真正的邪恶才能受到惩罚。这就是士与失败的天军的区别，这种重心帮助他们将资源用于对抗困扰人类的真正敌人。"
 POD_shih_events.0005.a: "辉煌使者"
 POD_shih_events.0005.b: "保护无知者"