l_simp_chinese:
 kill_reward: "悬赏完成"
 POD_web_of_knives.7.t: "刀锋之网"
 POD_web_of_knives.7.desc: "哈基姆的子嗣们有一个长久以来的传统——尽管内部对其有激烈的争论——那就是为其他吸血鬼充当雇佣兵或杀手。在秘密的 刀锋之网派系的组织下，这些赏金为冒险的哈基姆圣裔带来了巨大的财富（也带来了$pod_diablerie$不太谨慎的目标的机会）。虽然没有任何一个氏族成员被迫遵循这做法，但他们中的大多数人至少会涉足这种做法，至少可以加强其他吸血鬼对哈基姆圣裔人都是不能招惹的嗜血杀手的误解。\n#X 刀锋之网是哈基姆圣裔的一个决定性特征。你会定期收到完成悬赏的邀请。如果你接受，胜利将为你带来金币、声望和进行$pod_diablerie$的机会。#!"
 POD_web_of_knives.7.a: "保持一个正面的声誉。"
 POD_web_of_knives.10.t: "悬赏脑袋"
 POD_web_of_knives.10.desc: "你已经联系了名为刀锋之网的秘密组织，打算让他们除掉你的目标。他们的条件是这样的：你现在支付一半定金，契约履行后再支付一半。你付的钱越多，他们就会派出技术更高超的刺客成员。就算袭击失败，也不退回定金。\n还有一个奇怪的要求，就是你要献出自己的一小滴血，显然是要送给组织头目，但他们向你保证，这只是一种传统，并没有更邪恶的目的。如果连受雇杀手都信不过，你还能相信谁呢？"
 POD_web_of_knives.10.a: "一小笔钱就足够了。"
 wok_reward_low_tt: "如果目标有10谋略或20勇武，该选项将无概率成功。\n你将在数个月后得知成果。\n更好的选项需要该地区有更强的刀锋之网影响。"
 POD_web_of_knives.10.b: "我可以提供更多。"
 wok_reward_medium_tt: "如果目标有15谋略或30勇武，该选项将无概率成功。\n你将在数个月后得知成果。\n更好的选项需要该地区有更强的刀锋之网影响。"
 POD_web_of_knives.10.c: "我是一位有钱的吸血鬼。"
 wok_reward_high_tt: "如果目标有20谋略或40勇武，该选项将无概率成功。\n你将在数个月后得知成果。\n更好的选项需要该地区有更强的刀锋之网影响。"
 POD_web_of_knives.10.d: "我要他们死！"
 wok_reward_very_high_tt: "如果目标有25谋略或50勇武，该选项将无概率成功。\n你将在数个月后得知成果。\n更好的选项需要该地区有更强的刀锋之网影响。"
 POD_web_of_knives.10.e: "转念一想……"
 POD_web_of_knives.11.desc: "自从你联系刀锋之网，请他们帮助解决你的小麻烦以来，已经过去几个月了。你一直在关注你的对手，最近得知有人企图暗杀其。虽然其的宫廷已经沸沸扬扬，但你还是要感谢刀锋之网的专业精神，他们能确保无论结果如何，都无法追查到你的头上。\n现在，你只需检查他们是否成功……"
 POD_web_of_knives.11.a: "他们做到了！现在要付另一半……"
 POD_web_of_knives.11.b: "他们失败了！没用的杀手……"
 web_of_knives_diablerie_tt: "生死决斗。如果你获胜，你可以进行$pod_diablerie$。"
 POD_web_of_knives.600.t: "其的脑袋和灵魂"
 POD_web_of_knives.600.desc: "你对目标的直接袭击奏效了。其胆怯地站在你面前，无法对你接下来的行动做出任何抵抗。一个简单、干净的杀戮就能完成契约，让你得到承诺的奖励，但你也知道，刀锋之网鼓励将$pod_diablerie$作为胜利者战利品的一部分。\n诱惑当然是有的，被你打败的敌人的鲜血在呼唤着你，乞求着你将其用于更有用的目的……"
 POD_web_of_knives.600.option.a: "你的脑袋和灵魂。"
 POD_web_of_knives.600.option.b: "你的脑袋就够了。"
 POD_web_of_knives.13.desc: "你在刀锋之网的联络人最近告诉你，你所在地区的一个吸血鬼的脑袋上挂有赏金。刀锋之网有数位探员可以尝试完成这项任务，但如果你想亲自执行，你将获得优先权。\n和往常一样，你面前有两个选择。巧妙的谋杀可能会奏效，而且一旦事情败露，你就可以远离潜在的目标（对方可能会非常生气）；或者你也可以采取更加“手动”的方法。这显然风险更大，但也是确保最终可进行$pod_diablerie$的唯一方法……"
 POD_web_of_knives.13.a: "无需承担不必要的风险。"
 wok_intrigue_duel_tt: "如果你失败了，这个选项不会给你带来更多的风险，只是威望损失而已。不过没有机会在成功时对目标进行吸榨了。"
 POD_web_of_knives.13.effect.success.desc: "无声而致命"
 POD_web_of_knives.13.critical.failure.effect.desc: "失败……"
 POD_web_of_knives.13.b: "直接袭击！"
 POD_web_of_knives.13.c: "我不会接受这份契约。"