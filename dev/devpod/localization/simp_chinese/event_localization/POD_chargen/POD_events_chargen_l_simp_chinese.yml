 POD_chargen.2621.t: "月宠"
 POD_chargen.2621.desc: "猫人没有月兆，而是依靠普里亚（也被称为“月宠”）来确定它们的地位以及如何对待生活并应对遇到的挑战。虽然这通常取决于芭丝特实现其第一次原始觉醒的时间，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。"
 chargen_fera_tt: "推荐用第二个剧本——黑暗时代：狼人，来扮演该角色[splat|E]。"
 POD_chargen.2.desc.landless: "#X 既然你身为[adventurer|E]，此处仅显示拥有[POD_landless_mechanics|E]的[splats|E]。#!"
 POD_chargen.2630.t: "溪流"
 POD_chargen.2630.desc: "魔克拉并不像其他一些$glossary_fera$那样拥有部族。他们的龙梦在彼此分离的族群间维系着某种程度上的统一。\n\n四大支流并非敌人，但各有不同的关切；他们并非盟友，却有许多共通之处。每一支流都是一个由共享龙梦传承的世系组成的集合体，组织在特定的地理区域内，拥有其本土的灵赋与仪式；各自对魔克拉面临的难题亦有不同的应对之道。"
 POD_chargen.2630.option.e: "或许我并非魔克拉"
 POD_chargen.2631.t: "血种"
 POD_chargen.2631.desc: "魔克拉有两大血种，代表他们在原始觉醒之前是什么：人子（生而为人）与龙子（而为蜥）。"
 POD_chargen.2632.t: "日兆"
 POD_chargen.2632.desc: "魔克拉采用日兆，但其具体表现因所属支流而异。\n魔克拉-姆边贝与古马甘用传统的七种日兆，依据出生时太阳的方位或状态而定。\n摩迦罗使用四种季节兆相，同时兼作某种内部种姓制度。此制度对外人而言完全无法理解。\n中龙亦使用四种季风兆相，分别对应一个季节、一种颜色与一个风向。\n尽管名称与方法各异，所有魔克拉都认同其本质皆为日兆，其力量皆源自太阳。"
 POD_chargen.2633.t: "变种"
 POD_chargen.2633.desc: "龙子是魔克拉的爬行类形态。每一支流都包含若干称为变种的特定形态，这些形态通常与该支流关联最密。通常是鳄鱼、短吻鳄、吉拉毒蜥或类似的大型爬行动物。由于这些动物的体型、体态和特征差异巨大，各有不同用途。"
