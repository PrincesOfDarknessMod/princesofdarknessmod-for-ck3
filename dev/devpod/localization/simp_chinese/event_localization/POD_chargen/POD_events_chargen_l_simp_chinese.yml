 POD_chargen.1400.t: "裁判所的修士会"
 POD_chargen.1400.desc: "裁判所被分为数个修士会，每个修士会都有数个特点。\n亚柯骑士和圣雅各伯之剑是军事骑士团，通过授任有资格的候选人来获得继承人。他们都发誓保持独身。\n圣约翰修女会是有经验的管理人员，但只是管理女性。作为修女，她们也没有传统意义上的家庭。\n神目，裁判所的间谍头目，也有是能授任成员，但也可以拥有家庭。\n红修会，探究神秘的研究人员，能授任男人也能授任女人。\n最后，贵族家族冯·穆尔瑙如同一个正常的中世纪家庭，但每个成员在成年后都有机会成为猎人。"
 POD_chargen.1400.option.a: "亚柯骑士"
 POD_chargen.1400.option.b: "圣雅各伯之剑"
 POD_chargen.1400.option.c: "圣约翰修女会"
