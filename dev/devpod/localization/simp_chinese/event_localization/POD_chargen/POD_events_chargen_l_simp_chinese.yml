 POD_chargen.2100.t: "军团"
 POD_chargen.2100.desc: "对于冥河的死灵来说，冥秩就是社会，八大军团就是冥秩。每个死灵死后，都会根据他们的死因纳入七个军团之一。每个军团都有一个总部（它的灵座），并由一名亡主监督。"
