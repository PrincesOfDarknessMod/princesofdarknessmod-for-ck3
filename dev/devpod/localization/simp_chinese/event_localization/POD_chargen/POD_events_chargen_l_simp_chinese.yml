 POD_chargen.2610.t: "血种"
 POD_chargen.2610.desc: "狼人有三大血种，代表他们在原始觉醒之前是什么：人子（生而为人）、狼子（生而为狼）和忌子（生而为狼人）。其他大多数$glossary_fera$有着与狼族相似的划分，尽管他们的兽生形式被称为适于他们的动物物种的其他名称。"
 POD_chargen.2610.option.d: "也许我并非是狼人"
 POD_chargen.2611.t: "狼子月兆"
 POD_chargen.2611.desc: "月兆指的是狼族出生时的月相。每种都在狼族社会中扮演着特定的角色。新月狼是诡计多端的狼人，也是故意唱反调的人，凸月狼是叙事者，满月狼是战士，眉月狼是神秘学家，半月狼是判决者。"
 POD_chargen.2612.t: "部落"
 POD_chargen.2612.desc: "部族是狼族最大的社会单位。部族成员通常由血统、相似的图腾和生活方式联系在一起。"
 POD_chargen.2612.option.a: "黑怒"
 POD_chargen.2612.option.b: "啮骨者"
 POD_chargen.2612.option.d: "芬尼安"
