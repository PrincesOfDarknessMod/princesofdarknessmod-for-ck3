 POD_chargen.620.t: "血能"
 POD_chargen.620.desc: "血能决定了你的吸血鬼能力有多强，以及你需要多少血来满足你的饥渴。血能既由世代产生，又受世代限制。随着时间的推移，血能会慢慢增强，但也可以通过[Glossary('吸榨','game_concept_diablerie_desc')]来提高。进入[Glossary('蛰眠','game_concept_torpor_desc')]会慢慢削弱你的血能。"
 POD_chargen.620.option.a: "我的血能已经确定"
 POD_chargen.650.t: "潜藏"
 POD_chargen.650.desc: "血之缄默是指将你的超自然本性的秘密保密于凡人。如果血畜知道你是怪物，它们将会试图消灭你。或更糟。其他超自然生物也会来摧毁你以确保他们自己的生存。另一些超自然反而会拒绝隐藏，而是陶醉于揭露其怪物本性所带来的恐惧之中。在公共场合使用明显的超自然力量，生造吸血鬼子嗣和血仆，不仔细掩盖吸食后留下的尸体线索；所有这些都会增加吸血鬼的[the_masquerade|E]暴露度。"
 POD_chargen.650.option.a: "我的超自然本性被隐藏起来了。"
 POD_chargen.670.t: "饥渴"
 POD_chargen.670.desc: "心兽是饥渴的。吸血鬼靠血来维持他们的永生。血液也助长了他们的超自然力量。使用你的超能力如[Glossary('血律','game_concept_discipline_desc')]或神奇治愈力量将会增加你的饥渴度。吸血鬼越饥渴，他们就会变得越不理智，越绝望，越暴力，越紧张。吸血鬼只有把人吸干致死才能真正吸饱，然而杀死人类会侵蚀吸血鬼的人性，使他们更容易受到心兽的诱惑。完全屈服于心兽者会成为尸妖，一种完全被他们对血的无法抑制的渴望所驱使的生物。遵守心路或道可以帮助吸血鬼关住心兽。"
 POD_chargen.670.option.a: "我饿了。"
