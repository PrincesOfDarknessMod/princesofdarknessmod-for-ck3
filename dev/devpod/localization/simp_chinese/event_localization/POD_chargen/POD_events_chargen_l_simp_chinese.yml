 POD_chargen.1620.t: "皇朝事务"
 POD_chargen.1620.desc: "皇朝是[GetTrait('kueijin').GetName( GetNullCharacter )]的地区管理机构。许多皇朝利用秘密社团、帮派和公司作为棋子和掩盖，统称为障幕。\n\n传统上，五大皇朝被称为\"五大至尊皇朝\"：白虎统辖西藏、塔里木与喜马拉雅，朱雀凤凰主宰东南亚，黄帝中土执掌中原，玄武坐镇草原，而青龙则治理朝鲜与日本。\n更多小型皇朝效仿这些显赫者行事。即便那些不承认五大皇朝权威的$pod_kueijin$，也倾向于以类似的方式组织，可见五大皇朝在漫长岁月中对[Glossary('万鬼','game_concept_kuei_jin_desc')]产生了巨大的影响。"
 POD_chargen.1620.option.a: "有意思"
