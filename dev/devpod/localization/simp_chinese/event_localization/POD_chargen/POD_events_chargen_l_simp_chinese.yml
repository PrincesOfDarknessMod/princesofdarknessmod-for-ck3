 POD_chargen.2300.desc: "有许多[UmbraGlossaryLocalized('far_shore','彼岸')]，要么是由堕落的闪耀者管理，要么是由那些看到堕落的闪耀者并嫉妒他们的疯子管理。其中最臭名昭著的是渔民天堂，体现着早期基督教的天堂，其他所有人都觉得这是通往地狱的大门。"
