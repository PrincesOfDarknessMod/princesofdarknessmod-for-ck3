 POD_chargen.2600.desc: "$glossary_fera$，又称化形者或化形种族，是黑暗世界中的化形种族。在化形之裔中，绝大多数族群对狼族或狼人抱有强烈的不信任，因后者在魂怒之战中对其他种族发起了灭绝性的战争。\n你属于哪一种化兽族裔？"
 POD_chargen.2500.desc: "[UmbraGlossary('tempest')]是[UmbraGlossaryLocalized('shadowlands','冥界')]的一片“海”，而[Glossary('冥府','game_concept_dark_kingdom_desc')]是这片海中的岛屿。每个[Glossary('冥府','game_concept_dark_kingdom_desc')]都是一个特定文化的死者的归宿。"
