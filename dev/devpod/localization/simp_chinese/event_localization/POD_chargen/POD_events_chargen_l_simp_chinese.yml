 POD_chargen.1370.t: "潜藏"
 POD_chargen.1370.desc: "血之缄默是指将你的超自然本性的秘密保密于凡人。如果血畜知道你是怪物，它们将会试图消灭你。或更糟。其他超自然生物也会来摧毁你以确保他们自己的生存。另一些超自然反而会拒绝隐藏，而是陶醉于揭露其怪物本性所带来的恐惧之中。在公共场合使用明显的超自然力量，或不仔细掩盖吸食后留下的尸体线索；所有这些都会增加[Glossary('遗传血仆','game_concept_revenant_desc')]的[the_masquerade|E]暴露度。"
 POD_chargen.1370.option.a: "我的超自然本性被隐藏起来了。"
 POD_chargen.1380.t: "饥渴"
 POD_chargen.1380.desc: "心兽是饥渴的。$POD_splat_vampire_plural$靠血来维持他们的永生。血液也助长了他们的超自然力量。那血还在[Glossary('遗传血仆','game_concept_revenant_desc')]的血管里流淌。使用你的超能力如[Glossary('血律','game_concept_discipline_desc')]或神奇治愈力量将会增加你的饥渴度。[Glossary('遗传血仆','game_concept_revenant_desc')]对吸血鬼的血越饥渴，他们就会变得越不理智，越绝望，越暴力，越紧张。随着时间的推移，[Glossary('遗传血仆','game_concept_revenant_desc')]会将他们的一部分血变成吸血鬼血……有效地互相残食。[Glossary('遗传血仆','game_concept_revenant_desc')]还可以通过摄取吸血鬼的血来减少饥渴。"
 POD_chargen.1380.option.a: "我敢使用我的黑暗天赋的力量吗？"
