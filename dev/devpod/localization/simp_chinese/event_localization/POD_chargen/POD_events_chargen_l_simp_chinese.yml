 POD_chargen.1900.option.b: "我已经回到我的尸体。"
 POD_chargen.1900.option.d: "我是一位受缚死灵。"
 POD_chargen.2000.t: "收割者将你带到了何方？"
 POD_chargen.2000.desc: "对于一个新死灵来说，好消息是老死灵想要帮助他们，即使他们对“帮助”的定义有争议。新死灵的到来会留下痕迹，细心的观察者可以通过几种不同的方式发现，包括各种冥法。已经加入的死灵将对新死灵的猎取称为“收割”，而将新的灵魂带入[UmbraGlossary('shadowlands')]也形成了一种欣欣向上的交易。收割者找到还在“胎膜”中的死灵并将其切开，让她出现在[UmbraGlossary('shadowlands')]中。"
