l_simp_chinese:
 POD_chargen.1.t: "欢迎来到背景生成器"
 POD_chargen.1.desc: "通过这个事件链，你将能定制你在《$pod_wod$》中的角色。这个流程会移除你所有的超自然特质。你将能选择你的超自然生物类型，你的$pod_clan$，你的家族，你的世代，你可能的[Glossary('尊长','game_concept_Sire_desc')]，你的[Glossary('血律','game_concept_discipline_desc')]，你的心路，和你的掠食者类型。\n\n根据你目前的蓝本角色，你可能会被移除一些遗留亲属。"
 POD_chargen.1.option.a: "我真的想使用背景生成器"
 POD_chargen.1.option.a.tt: "#R 请确认你想要这么做！操作无法恢复！这会清空你所有的超自然特质，修正和秘密！！！#!"
 POD_chargen.1.option.b: "什么也不改并退出背景生成器"
 POD_chargen.2.t: "夜间何物出没？"
 POD_chargen.2.desc: "你是哪种超自然生物？"
 POD_chargen.2.option.b: "$glossary_fera$"
 POD_chargen.3.t: "初代"
 POD_chargen.3.desc: "谁是吸血鬼的始祖？"
 POD_chargen.3.option.a: "如挪得之书所写：被天主诅咒的该隐"
 POD_chargen.3.option.i: "[Glossary('阿什拉派','game_concept_ashirra_desc')]说是被真主所诅咒的加音"
 POD_chargen.3.option.c: "故事说吸血鬼是卡根的后代"
 POD_chargen.3.option.b: "黑暗之母说吸血鬼有很多起源"
 POD_chargen.3.option.h: "对奥西里斯进行报复的赛特"
 POD_chargen.3.option.g: "被奥丁用如尼符文救活的将死战士卡纳尔"
 POD_chargen.3.option.f: "由卑帝利所创造，被吒婆多修罗所猎杀的堕落仆众"
 POD_chargen.3.option.e: "给我一个惊喜"
 POD_chargen.3.option.d: "我不知道。"
 POD_chargen.3.option.j: "也许我不是吸血鬼……"
 POD_chargen.3.option.j.tt: "你重新考虑扮演哪种超自然生物。"
 POD_chargen.4.t: "次代"
 POD_chargen.4.desc: "你的你的氏族你的$pod_clan$从哪位该隐的子嗣遗传而来？从哪位该隐的子嗣遗传而来？从哪位该隐的子嗣遗传而来？"
 POD_chargen.4.option.a: "聪慧者以诺"
 POD_chargen.4.option.b: "强壮者以拿"
 POD_chargen.4.option.c: "美艳者洗拉"
 POD_chargen.4.option.d: "也许该隐并非始祖……"
 POD_chargen.4.option.d.tt: "你重新考虑吸血鬼的起源。"
