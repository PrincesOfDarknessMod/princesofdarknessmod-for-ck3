 POD_chargen.2600.t: "血种"
 POD_chargen.2600.desc: "狼人有三大血种，代表他们在原始觉醒之前是什么：人子（生而为人）、狼子（生而为狼）和忌子（生而为狼人）。其他大多数化兽族裔有着与狼族相似的划分，尽管他们的兽生形式被称为适于他们的动物物种的其他名称。"
 POD_chargen.2600.option.a: "人子"
 POD_chargen.2600.option.b: "狼子"
 POD_chargen.2600.option.d: "也许我并非是狼人"
 POD_chargen.2700.t: "月兆"
 POD_chargen.2700.desc: "月兆指的是狼族出生时的月相。每种都在狼族社会中扮演着特定的角色。新月狼是诡计多端的狼人，也是故意唱反调的人，凸月狼是叙事者，满月狼是战士，眉月狼是神秘学家，半月狼是判决者。"
 POD_chargen.2700.option.a: "新月狼"
 POD_chargen.2700.option.b: "眉月狼"
 POD_chargen.2700.option.c: "半月狼"
 POD_chargen.2700.option.d: "凸月狼"
 POD_chargen.2700.option.e: "满月狼"
 POD_chargen.2800.t: "部族"
 POD_chargen.2800.desc: "部族是狼族最大的社会单位。部族成员通常由血统、相似的图腾和生活方式联系在一起。"
 POD_chargen.2800.option.a: "黑怒"
 POD_chargen.2800.option.b: "啮骨者"
 POD_chargen.2800.option.c: "盖亚之子"
 POD_chargen.2800.option.d: "芬尼安"
 POD_chargen.2800.option.e: "芬里尔仔兽"
 POD_chargen.2800.option.f: "赤爪"
 POD_chargen.2800.option.g: "影爵"
 POD_chargen.2800.option.h: "寂静漫游者"
 POD_chargen.2800.option.i: "银牙"
 POD_chargen.2800.option.j: "星占"
 POD_chargen.2800.option.k: "人类监护者"
 POD_chargen.2800.option.l: "黑螺旋舞者"
 POD_chargen.2500.desc: "[UmbraGlossary('tempest')]是[UmbraGlossaryLocalized('shadowlands','冥界')]的一片“海”，而[dark_kingdoms|E]是这片海中的岛屿。每个[dark_kingdom|E]都是一个特定文化的死者的归宿。"
 POD_chargen.2500.option.a: "黄泉"
 POD_chargen.2500.option.b: "业境"
 POD_chargen.2500.option.c: "施瓦"
