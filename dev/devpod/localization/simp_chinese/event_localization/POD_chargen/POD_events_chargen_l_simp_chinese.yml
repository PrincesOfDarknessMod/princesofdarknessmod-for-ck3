 POD_chargen.1400.t: "裁判所的修士会"
 POD_chargen.1400.desc: "裁判所被分为数个修士会，每个修士会都有数个特点。\n亚柯骑士和圣雅各伯之剑是军事骑士团，通过授任有资格的候选人来获得继承人。他们都发誓保持独身。\n圣约翰修女会是有经验的管理人员，但只是管理女性。作为修女，她们也没有传统意义上的家庭。\n神目，裁判所的间谍头目，也有是能授任成员，但也可以拥有家庭。\n红修会，探究神秘的研究人员，能授任男人也能授任女人。\n最后，贵族家族冯·穆尔瑙如同一个正常的中世纪家庭，但每个成员在成年后都有机会成为猎人。"
 POD_chargen.1400.option.a: "亚柯骑士"
 POD_chargen.1400.option.b: "圣雅各伯之剑"
 POD_chargen.1400.option.c: "圣约翰修女会"
 POD_chargen.1400.option.d: "神目"
 POD_chargen.1400.option.e: "红修会"
 POD_chargen.1400.option.f: "冯·穆尔瑙"
 POD_chargen.1400.option.g: "暗影裁判所的志同道合者"
 POD_chargen.1400.option.h: "其他非暗影裁判所的猎人？"
 POD_chargen.1500.t: "受猎猎人"
 POD_chargen.1500.desc: "并不是所有的猎人属于暗影裁判所的一部分。许多人知晓黑暗世界的怪物，他们选择用勇气和决心去战斗。一些猎人曾经是暗影裁判所的成员，但觉得教会的要求过于繁琐而离开了教廷；但他们继续猎杀着不死族。但并不是所有的猎人都是出于高尚的原因而去追捕非生者。\n在1230年，要想成为一名不属于“暗影裁判所”的猎人是一件更加困难的事情。"
 POD_chargen.1500.option.a: "具有真信的独立猎人"
 POD_chargen.1500.option.b: "没有真信的独立猎人"
