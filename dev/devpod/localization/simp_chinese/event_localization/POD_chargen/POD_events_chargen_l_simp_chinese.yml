 POD_chargen.1300.option.f: "也许我不是[revenant|E]"
 POD_chargen.1310.t: "家传血仆"
 POD_chargen.1310.desc: "最长者把他的血洒在他的凡人仆从们中。这些血奴培育出了第一位家传血仆。你是属于更引人注目的家传血仆血系，还是属于更隐晦的血系？"
