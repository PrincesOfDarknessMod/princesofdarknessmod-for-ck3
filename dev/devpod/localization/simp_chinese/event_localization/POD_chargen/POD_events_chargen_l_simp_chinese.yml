 POD_chargen.1700.t: "阿蒙提朝代"
 POD_chargen.1700.desc: "贤荷鲁是第一朝代，是由诸神创造的真正的不朽者，他们对$glossary_wyrm_apophis$发动了一场圣战。接着是变节的以实玛利派，即第二朝代，由自对自由和自决的渴望而建立。第三朝代是受诅的阿佩普派，他们是$glossary_wyrm_apophis$的走狗，由恶敌赛特的诅咒仪式抚育，最后是窃取不朽的杂种，第四朝代卡比里。"
