 POD_chargen.1010.t: "掠食？"
 POD_chargen.1010.desc: "你掠食何物？\n掠食者类型代表了个别吸血鬼对如何和何时进食的习惯性偏好，但这并不会限制他们。他们中的绝大多数人都掠食凡人，但也有少数喜欢动物的血液，甚至更少的人（大多数是非常老的）会掠食其他吸血鬼。"
 POD_chargen.1010.option.a: "动物"
 POD_chargen.1010.option.a.tt: "我只掠食动物，而非人类。"
 POD_chargen.1010.option.b: "人类"
 POD_chargen.1010.option.b.tt: "吾食血畜。"
 POD_chargen.1010.option.c: "吸血鬼"
 POD_chargen.1010.option.c.tt: "我掠食掠食者。"
 POD_chargen.1020.t: "掠食倾向"
 POD_chargen.1020.desc: "你使用什么进行掠食？\n该选项代表了每个吸血鬼个体的掠食习惯。两个相同的吸血鬼有不同的掠食习惯，往往会有微妙的不同，主要是在他们的能力侧重或其他一些小变化。"
 POD_chargen.1020.option.a: "暴力"
 POD_chargen.1020.option.b: "魅力"
 POD_chargen.1020.option.c: "欺诈"
 POD_chargen.1020.option.d: "学识"
 POD_chargen.1020.option.e: "也许我不掠食人类……"
 POD_chargen.1030.t: "甜言蜜语与高谈雄辩"
 POD_chargen.1030.desc: "[GetTrait('predatortype_siren').GetName(GetNullCharacter)]——该吸血鬼通过迷吻来引诱爱人们并吸取他们的血。\n\n[GetTrait('predatortype_gentry').GetName(GetNullCharacter)]——该吸血鬼在人类社会中有一定的地位。他利用这种地位去猎食有钱有势的人。\n\n[GetTrait('predatortype_cultist').GetName(GetNullCharacter)]——该吸血鬼如同上古时期一般领导着一个血之密教。血畜将他们的信仰与自身奉献于该血神。\n\n[GetTrait('predatortype_consensualist').GetName(GetNullCharacter)]——该吸血鬼从自愿者那吸食。"
 POD_chargen.1030.option.a: "塞壬"
 POD_chargen.1030.option.b: "绅士"
 POD_chargen.1030.option.c: "密教主"
 POD_chargen.1030.option.c.tt: "密教主永远无法将其曝露度降至可疑之下。"
 POD_chargen.1030.option.d: "顺求者"
 POD_chargen.1030.option.d.tt: "顺求者永远无法将其曝露度降至可疑之下。"
 POD_chargen.1030.option.e: "我认为我有不同的观点……"
 POD_chargen.1040.t: "我熟悉谎言"
 POD_chargen.1040.desc: "[GetTrait('predatortype_cauchemar').GetName(GetNullCharacter)]——该吸血鬼主要以熟睡中的猎物为食。\n\n[GetTrait('predatortype_familias').GetName(GetNullCharacter)]——该吸血鬼吸食的血液几乎来自同一个特定的家庭宗族。他可能与这个家庭互相理解，起码该家庭是这么认为的。\n\n[GetTrait('predatortype_footpad').GetName(GetNullCharacter)]——该吸血鬼混在社会的下级阶层中，吸取穷人的血。即使他们失踪了，当局也不会感兴趣。"
 POD_chargen.1040.option.a: "梦魇"
 POD_chargen.1040.option.b: "掠家者"
 POD_chargen.1040.option.b.tt: "掠家者永远无法将其曝露度降至可疑之下。"
 POD_chargen.1040.option.c: "拦路贼"
 POD_chargen.1040.option.d: "我认为我有不同的观点……"
 POD_chargen.1050.t: "你需要了解的是……"
 POD_chargen.1050.desc: "[GetTrait('predatortype_cenobite').GetName(GetNullCharacter)]——该吸血鬼在修道院这样的宗教机构里有牧群。\n\n[GetTrait('predatortype_phlebotomist').GetName(GetNullCharacter)]——该吸血鬼伪装成一个放血的医生来获得精血。\n\n[GetTrait('predatortype_graverobber').GetName(GetNullCharacter)]——该吸血鬼会在墓地和墓穴附近徘徊，寻找新鲜的尸体或哀悼者们。\n\n[GetTrait('predatortype_bedlamite').GetName(GetNullCharacter)]——该吸血鬼以疯子为猎物。他们可能也是疯子，也可能不是。"
 POD_chargen.1050.option.a: "修道士"
 POD_chargen.1050.option.b: "抽血师"
 POD_chargen.1050.option.c: "掘墓人"
 POD_chargen.1050.option.d: "狂人"
 POD_chargen.1050.option.e: "我认为我有不同的观点……"
 POD_chargen.1060.t: "体系固有之物"
 POD_chargen.1060.desc: "[GetTrait('predatortype_alleycat').GetName(GetNullCharacter)]——该吸血鬼跟踪并暴力攻击人类来获取血液。这是一种粗俗的做法。\n\n[GetTrait('predatortype_extortionist').GetName(GetNullCharacter)]——该吸血鬼强迫他们的受害者给予他们血。从表面上看，勒索者是通过获取血液来换取安全或监护等服务，尽管很多时候保护的需要是真实存在的，但这也往往是为了让这桩交易更令人易于接受而编造出的谎言。"
 POD_chargen.1060.option.a: "夜游猫"
 POD_chargen.1060.option.b: "勒索者"
 POD_chargen.1060.option.c: "我认为我有不同的观点……"
 POD_chargen.1100.t: "掠食排斥"
 POD_chargen.1100.desc: "由于与生俱来的[ventrue_clan_curse|E]，你有着极为苛刻和曲高和寡的品味，甚至在吸食血液方面也是如此。你选择吸食什么样的血？\n#X 该选项将决定你可以安全地进食哪种类型的角色而获得收益。谨慎选择。#!"
