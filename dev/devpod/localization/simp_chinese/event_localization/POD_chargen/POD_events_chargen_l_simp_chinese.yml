 POD_chargen.2900.t: "七原罪"
 POD_chargen.2900.desc: "每位恶魔都对某项特定的原罪有一种勉强可控的痴迷，他们把这种痴迷传给他们的追随者。"
 POD_chargen.2900.option.a: "贪婪"
 POD_chargen.2900.option.b: "嫉妒"
 POD_chargen.2900.option.c: "暴食"
 POD_chargen.2900.option.d: "色欲"
 POD_chargen.2900.option.e: "傲慢"
 POD_chargen.2900.option.f: "怠惰"
 POD_chargen.2900.option.g: "暴怒"
 POD_chargen.2900.option.h: "也许我并非是恶魔"
 POD_chargen.3000.t: "七天族"
 POD_chargen.3000.desc: "创世七纪元产生了天使的七大天族，每一天族都是为了管理自己的宇宙层面而创造的。火与风，地与星，海洋，荒野，甚至生命本身都是由上帝授权的一群天使管理的。\n\n天族决定了你在加入路西法的叛乱之前在天堂有什么职责，以及你对什么样的[lore_lifestyle|E]有亲和力。"
 POD_chargen.3000.option.a: "阿撒乌"
 POD_chargen.3000.option.a.tt: "阿撒乌有风之[lore_lifestyle|E]、苏生[lore_lifestyle|E]和苍穹[lore_lifestyle|E]。"
 POD_chargen.3000.option.b: "拉比苏"
 POD_chargen.3000.option.b.tt: "拉比苏有兽之[lore_lifestyle|E]、血肉[lore_lifestyle|E]和荒野[lore_lifestyle|E]。"
 POD_chargen.3000.option.c: "哈拉库"
 POD_chargen.3000.option.c.tt: "哈拉库有死亡[lore_lifestyle|E]、界域[lore_lifestyle|E]和灵之[lore_lifestyle|E]。"
 POD_chargen.3000.option.d: "纳玛鲁"
 POD_chargen.3000.option.d.tt: "纳玛鲁有天人[lore_lifestyle|E]、火之[lore_lifestyle|E]和辉之[lore_lifestyle|E]。"
 POD_chargen.3000.option.e: "拉玛苏"
 POD_chargen.3000.option.e.tt: "拉玛苏有欲之[lore_lifestyle|E]、风暴[lore_lifestyle|E]和显圣容[lore_lifestyle|E]。"
 POD_chargen.3000.option.f: "阿努纳奇"
 POD_chargen.3000.option.f.tt: "阿努纳奇有地之[lore_lifestyle|E]、锻造[lore_lifestyle|E]和路径[lore_lifestyle|E]。"
 POD_chargen.3000.option.g: "尼比鲁"
 POD_chargen.3000.option.g.tt: "尼比鲁有光之[lore_lifestyle|E]、形式[lore_lifestyle|E]和门之[lore_lifestyle|E]。"
 chargen_fae_tt: "推荐用第三个剧本——黑暗时代：妖精，来扮演该角色类型。"
 POD_chargen.3100.t: "戚系"
 POD_chargen.3100.desc: "戚系是不同类型的戚族的划分，类似于其他超自然文化中的氏族和部族。"
 POD_chargen.3100.option.f: "也许我并非是妖精。"
 POD_chargen.3100.option.g: "也许我并非是换生灵。"
 POD_chargen.3200.t: "戚族"
 POD_chargen.3200.desc: "来自欧洲及其文化影响范围内的戚族戚系，是世界上数量最多和最知名的。"
 POD_chargen.3200.option.f: "也许我并非是戚族"
 POD_chargen.3300.t: "镇尼"
 POD_chargen.3300.desc: "中东的妖精主要用镇尼来称呼自己，但它也广泛用于任何超自然的存在。"
 POD_chargen.3300.option.f: "也许我并非是镇尼"
 POD_chargen.3400.t: "非洲戚系"
 POD_chargen.3400.desc: "非洲的土著戚系。"
 POD_chargen.3400.option.f: "也许我并非是非洲戚系"
 POD_chargen.3500.t: "妖仙"
 POD_chargen.3500.desc: "妖仙是对东方妖精的称呼。"
 POD_chargen.3500.option.f: "也许我并非是妖仙"
 POD_chargen.3600.t: "门属"
 POD_chargen.3600.desc: "门属是对元素妖类型的划分。"
 POD_chargen.3600.option.f: "也许我并非是元素妖"
 POD_chargen.3700.t: "王廷"
 POD_chargen.3700.desc: "王廷是对妖精的更大划分。世界上不同地区的妖精以不同的方式划分，但仍使用相同或类似的术语。"
 POD_chargen.2400.desc: "叛逆大致可分为四类，尽管有时他们的目标与其他类型的目标重叠。"
 POD_chargen.2400.option.a: "肄业者"
 POD_chargen.2400.option.b: "理想者"
 POD_chargen.2400.option.c: "无法者"
 POD_chargen.2400.option.d: "抗议者"
 POD_chargen.2400.option.e: "也许我不是叛逆的一员"
 POD_chargen.2200.desc: "在冥河社会，对冥法的掌握历来由冥河行会控制。这些组织促进了对每个冥法的使用、研究和管理。"
 POD_chargen.2200.option.a: "奇械术师"
 POD_chargen.2200.option.b: "假面人"
 POD_chargen.2200.option.c: "赎罪者"
 POD_chargen.2200.option.d: "放贷人"
 POD_chargen.2200.option.e: "冥歌手"
 POD_chargen.2200.option.f: "导航者"
 POD_chargen.2200.option.g: "天启者"
 POD_chargen.2200.option.h: "织梦人"
 POD_chargen.2200.option.i: "显灵者"
 POD_chargen.2200.option.j: "督察者"
 POD_chargen.2200.option.k: "死暴徒"
 POD_chargen.2200.option.l: "代诉者"
 POD_chargen.2200.option.m: "傀儡师"
 POD_chargen.2200.option.n: "炼金术师"
 POD_chargen.2200.option.o: "记忆师"
 POD_chargen.2200.option.p: "参谋师"
 POD_chargen.2200.option.q: "也许我不是行会的一员"
 POD_chargen.2300.desc: "有许多[UmbraGlossary('far_shore')]，要么是由堕落的闪耀者管理，要么是由那些看到堕落的闪耀者并嫉妒他们的疯子管理。其中最臭名昭著的是渔民天堂，体现着早期基督教的天堂，其他所有人都觉得这是通往地狱的大门。"
 POD_chargen.2300.option.a: "闪耀者"
 POD_chargen.2300.option.b: "渔民"
 POD_chargen.2300.option.f: "也许我不是彼岸的一员"
 POD_chargen.1620.t: "皇朝"
 POD_chargen.1620.desc: "皇朝是[GetTrait('kueijin').GetName( GetNullCharacter )]的地区管理机构。许多皇朝利用秘密社团、帮派和公司作为棋子和掩盖，统称为障幕。"
 POD_chargen.1620.option.a: "我是五大至尊皇朝的一员"
 POD_chargen.1620.option.b: "我不为至尊皇朝服务"
 POD_charjoin.700.t: "你的师父"
 POD_charjoin.700.option.a: "是，而且[vampiresire.GetSheHe]是我的师父！"
 POD_charjoin.700.option.c: "是，但[vampiresire.GetSheHe]不是我的师父。"
 POD_charjoin.700.option.c.t: "你将只加入[vampiresire.GetHerHis]的家族。"
 POD_charjoin.800.t: "你的父母"
 POD_charjoin.800.option.a: "是，而且[vampiresire.GetSheHe]是我的父母！"
 POD_charjoin.800.option.c: "是，但[vampiresire.GetSheHe]不是我的父母。"
 young_ventrue_base_tt: "指不到30岁的人。"
 middle_ventrue_base_tt: "指30至50岁之间的人。"
 old_ventrue_base_tt: "指大于50岁的人。"
 chargen_mage_tt: "推荐用第四个剧本——黑暗时代：法师，来扮演该角色类型。"
 POD_chargen.610.option.bm: "伏尔杰会观占术、迅捷术和易变术。"
 POD_chargen.610.option.bn: "嘈杂之女会坚韧术、威仪术和魔音术。"
 POD_chargen.1801.t: "巫凤与仙龙"
 POD_chargen.1801.desc: "巫凤与仙龙是中原的两大天宗势力。你属于它们中的哪一个？"
 POD_chargen.1801.option.a: "巫凤，天之箭。"
 POD_chargen.1801.option.b: "巫凤，正义桃花。"
 POD_chargen.1801.option.c: "巫凤，赤灯兄弟会。"
 POD_chargen.1801.option.d: "仙龙，白莲教。"
 POD_chargen.1801.option.e: "仙龙，暮光学者。"
 POD_chargen.1801.option.f: "仙龙，玉之哨卫。"
 POD_chargen.1801.option.g: "我创建了自己的巫凤门派。"
 POD_chargen.1801.option.h: "我创建了自己的仙龙门派。"
 POD_chargen.3001.t: "自定义家族"
 POD_chargen.3001.desc: "你想将恶魔宗族作为你的家族还是要保留你的自定义家族作为它的分家？"
 POD_chargen.3001.option.a: "留在主家。"
 POD_chargen.3001.option.b: "自建分家。"
 POD_charjoin.200.option.d: "返回"
 POD_charjoin.200.option.d.t: "你将能选择另个角色。"
 POD_charjoin.700.option.b: "是，而且[vampiresire.GetSheHe]是我的师父！但是我建立了自己的屋室。"
 POD_charjoin.800.option.b: "是，而且[vampiresire.GetSheHe]是我的父母！但是我建立了自己的家族。"
 POD_charjoin.200.t: "你的[Sire|E]"
 POD_charjoin.201.t: "你的世代"
 POD_chargen.2601.t: "血种"
 POD_chargen.2601.desc: "阿迦巴的血种分为人子（生而为人）、狼子（生而为鬣狗）和忌子（生而为鬣狗人）。与狼人忌子不同，阿迦巴中的忌子是雌雄同体。在介于男性和女性阿迦巴的规范之间，他们有相应的适度魂怒和灵知，并因此受到尊重。"
 POD_chargen.2601.option.a: "人子"
 POD_chargen.2601.option.b: "鬣子"
 POD_chargen.2601.option.d: "也许我并非是阿迦巴"
 POD_chargen.2602.t: "血种"
 POD_chargen.2602.desc: "巴斯特有三大血种，代表他们在原始觉醒之前是什么：人子（生而为人）、猫子（生而为猫）和忌子（生而为猫人）。"
 POD_chargen.2602.option.a: "人子"
 POD_chargen.2602.option.b: "猫子"
 POD_chargen.2602.option.d: "也许我并非是芭丝特"
 POD_chargen.2603.t: "血种"
 POD_chargen.2603.desc: "科拉克斯不是人子就是鸦子，而且没有忌子血种。在社会上，两者之间的差异可以忽略不计。"
 POD_chargen.2603.option.a: "人子"
 POD_chargen.2603.option.b: "鸦子"
 POD_chargen.2603.option.d: "也许我并非是科拉克斯"
 POD_chargen.2604.t: "血种"
 POD_chargen.2604.desc: "古拉赫勒只有两个血种：人子（生而为人）和熊子（生而为熊）。这个化兽族裔没有忌子——他们的配偶是通过特殊仪式挑选的，即使两个古拉赫勒相互交配，也不会生出孩子。"
 POD_chargen.2604.option.a: "人子"
 POD_chargen.2604.option.b: "熊子"
 POD_chargen.2604.option.d: "也许我并非是古拉赫勒"
 POD_chargen.2605.t: "血种"
 POD_chargen.2605.desc: "狐妖有三大血种，分别代表它们在原始觉醒之前的样子：荒神（生而为人）、狐子（生而为狐）和狐狸精神狐（生而为狐妖）。当狐妖出生时，父母中非狐妖的只有十分之一的几率能活下来。此外，还有十分之一的几率，父母是狐妖的那位会代替配偶或与配偶一起死去。"
 POD_chargen.2605.option.a: "荒神"
 POD_chargen.2605.option.b: "狐子"
 POD_chargen.2605.option.c: "神狐"
 POD_chargen.2605.option.d: "也许我并非是狐妖"
 POD_chargen.2606.t: "血种"
 POD_chargen.2606.desc: "莫科莱只有两个血种，普遍上是人子和龙子。忌子子嗣总是在出生前就死去，成为被称作无辜者的愤怒灵魂，萦绕着他们的双亲，哀悼所失去的生命。"
 POD_chargen.2606.option.a: "人子"
 POD_chargen.2606.option.b: "龙子"
 POD_chargen.2606.option.d: "也许我并非是莫科莱"
 POD_chargen.2607.t: "血种"
 POD_chargen.2607.desc: "娜迦有三大血种，代表他们在原始觉醒之前是什么：婆罗罗摩（生而为人）、蛇子（生而为蛇）和阿希（生而为娜迦。与狼族不同，娜迦平等地对待他们的忌子，并将他们视为两面兼有者。）"
 POD_chargen.2607.option.a: "婆罗罗摩"
 POD_chargen.2607.option.b: "蛇子"
 POD_chargen.2607.option.c: "阿希"
 POD_chargen.2607.option.d: "也许我并非是娜迦"
 POD_chargen.2608.t: "血种"
 POD_chargen.2608.desc: "努维沙只有两个已知的血种：人子和郊狼子。可能是出于精神原因，还是因为两只郊狼人往往不会用足够长的时间粘在一起来生孩子，所以他们不会诞下忌子。"
 POD_chargen.2608.option.a: "人子"
 POD_chargen.2608.option.b: "郊狼子"
 POD_chargen.2608.option.d: "也许我并非是努维狭"
 POD_chargen.2609.t: "血种"
 POD_chargen.2609.desc: "拉特金是通过分娩瘟疫形成的。虽然对普通人类来说是致命的，但鼠嫡可以幸存下来，并成长为完整的拉特金，尽管后遗症和精神错乱很常见。"
 POD_chargen.2609.option.a: "人子"
 POD_chargen.2609.option.b: "鼠子"
 POD_chargen.2609.option.d: "也许我并非是鼠族"
 POD_chargen.2610.t: "血种"
 POD_chargen.2610.desc: "罗基阿这个化兽族裔没有忌子。罗基阿没有相互交配的冲动，因此他们从不生育。唯有的品种是人子（生而为人）和鲨子（生而为鲨）。"
 POD_chargen.2610.option.a: "人子"
 POD_chargen.2610.option.b: "鲨子"
 POD_chargen.2610.option.d: "也许我并非是罗基阿"
 POD_chargen.2611.t: "血种"
 POD_chargen.2611.desc: "由于阿皮斯的天职是媒人，所以他们中没有忌子。唯有的血种是人子（生而为人）和牛子（生而为牛）。"
 POD_chargen.2611.option.a: "人子"
 POD_chargen.2611.option.b: "牛子"
 POD_chargen.2611.option.d: "也许我并非是阿皮斯"
 POD_chargen.2612.t: "血种"
 POD_chargen.2612.desc: "卡玛佐兹通过一种与科拉克斯相似的仪式来繁衍后代，但当蝙蝠落入妖蛆手中后，这种仪式就失效了，他的子嗣们注定要灭绝。要想成为蝙蝠人，人类或蝙蝠幼崽必须接受一种仪式，这种仪式只能在特殊的影界洞穴中举行。由于所有卡玛佐兹都是通过这种仪式诞生的，所以蝙蝠人没有兆相，也没有忌子血种。"
 POD_chargen.2612.option.a: "人子"
 POD_chargen.2612.option.b: "蝙蝠子"
 POD_chargen.2612.option.d: "也许我并非是卡玛佐兹"
 POD_chargen.2613.t: "血种"
 POD_chargen.2613.desc: "格隆迪尔有三个血种：人子，忌子和猪子。他们缺少兆相；不过，每个血种都有特定的职责。"
 POD_chargen.2613.option.a: "人子"
 POD_chargen.2613.option.b: "猪子"
 POD_chargen.2613.option.d: "也许我并非是格隆迪尔"
 POD_chargen.2701.t: "倾向"
 POD_chargen.2701.desc: "在沦陷之前，哪怕阿迦巴的祖先是战士，但所有阿迦巴都很像狼族的新月狼。然而，自重建社会以来，他们只认两大倾向，每倾向都含按性别区分的两种身份。"
 POD_chargen.2701.option.a: "黎明"
 POD_chargen.2701.option.b: "黎明"
 POD_chargen.2701.option.c: "黄昏"
 POD_chargen.2701.option.d: "黄昏"
 POD_chargen.2702.t: "月宠"
 POD_chargen.2702.desc: "猫人没有月兆，而是依靠普里亚（也被称为“月宠”）来确定它们的地位以及如何对待生活并应对遇到的挑战。虽然这通常取决于芭丝特实现其第一次原始觉醒的时间，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。"
 POD_chargen.2702.option.a: "日光"
 POD_chargen.2702.option.b: "暮光"
 POD_chargen.2702.option.c: "暗夜"
 POD_chargen.2704.t: "月兆"
 POD_chargen.2704.desc: "古拉赫勒与狼族一样有与月相对应的五大月兆。然而，古拉赫勒的月兆并不固定；每个古拉赫勒在一生中都会按以下顺序经历所有五大月兆，但各个在某些月兆上度过的时间可能长也可能短。"
 POD_chargen.2704.option.a: "阿卡斯"
 POD_chargen.2704.option.b: "乌兹马提"
 POD_chargen.2704.option.c: "科居巴特"
 POD_chargen.2704.option.d: "基赫"
 POD_chargen.2704.option.e: "里舍"
 POD_chargen.2705.t: "道途"
 POD_chargen.2705.desc: "狐妖的道途既是一种职业，也是一种神圣的呼唤。它们不是由太阳、月亮或狐妖的出生时间决定的，而是由每只狐人在获得第一个阶级时选择的。每条道途都与两种主要元素融合而成的单一元素相关。"
 POD_chargen.2705.option.a: "卫士"
 POD_chargen.2705.option.b: "道士"
 POD_chargen.2705.option.c: "仙术士"
 POD_chargen.2705.option.d: "语部"
 POD_chargen.2706.t: "日兆"
 POD_chargen.2706.desc: "与科拉克斯一样，比起月亮，莫克勒更倾向于从太阳获得他们的兆相。"
 POD_chargen.2706.option.a: "旭日"
 POD_chargen.2706.option.b: "午日"
 POD_chargen.2706.option.c: "夕日"
 POD_chargen.2706.option.d: "掩日"
 POD_chargen.2706.option.e: "夜日"
 POD_chargen.2706.option.f: "幻日"
 POD_chargen.2706.option.g: "日蚀"
 POD_chargen.2707.t: "季兆"
 POD_chargen.2707.desc: "娜迦不像其他恒温的化兽族裔那样根据月相来确定倾向，而是采用一种季节兆相系统，与哺乳动物的兆相系统截然不同。"
 POD_chargen.2707.option.a: "卡玛克什（春）"
 POD_chargen.2707.option.b: "迦絺吉夜（夏）"
 POD_chargen.2707.option.c: "卡姆萨（秋）"
 POD_chargen.2707.option.d: "迦梨（冬）"
 POD_chargen.2709.t: "倾向"
 POD_chargen.2709.desc: "鼠人分为九大倾向，就像狼族的月兆一样。其中五个被认为是“标准”倾向，另外四个则是所谓的“畸变”倾向。\n\n第五倾向，即吟游诗人，在魂怒之战中被摧毁。\n\n四大畸变倾向是鼠族与[umbra|E]和奇原联系日益紧密的产物，是比其他同类与奇原有更深联系的畸形变异。这是有代价的：每种畸变都有自己独特的疯狂。"
 POD_chargen.2709.option.a: "隧道行者"
 POD_chargen.2709.option.b: "暗影先知"
 POD_chargen.2709.option.c: "匕首游荡者"
 POD_chargen.2709.option.d: "吟游诗人"
 POD_chargen.2709.option.e: "战士"
 POD_chargen.2709.option.f: "工程师"
 POD_chargen.2709.option.g: "孟乔森"
 POD_chargen.2709.option.h: "瘟疫领主"
 POD_chargen.2709.option.i: "扭曲者"
 POD_chargen.2710.t: "海兆"
 POD_chargen.2710.desc: "罗基阿根据鲨人出生的时间确定兆相。"
 POD_chargen.2710.option.a: "澈水"
 POD_chargen.2710.option.b: "幽水"
 POD_chargen.2710.option.c: "暗水"
 POD_chargen.2711.t: "日月兆"
 POD_chargen.2711.desc: "阿皮斯是日月同造，他们的兆相也反映了这划分。这使得他们同时弱于金和银。"
 POD_chargen.2711.option.a: "月光"
