 POD_chargen.1200.t: "血仆"
 POD_chargen.1200.desc: "[ghouls|EU]是饮用了吸血鬼$pod_vitae$的凡人。这种血液对活人如同超自然的毒品，能赋予力量与永恒生命，却也使其对“供血者”产生情感依赖。吸血鬼常虐待他们的血仆，深知自己掌握着这段关系中无可抗拒的筹码。\n\n虽有可能吸食吸血鬼血液而不受其束缚，但毋庸置疑，没有$pod_cainite$会自愿献出自己的血液。"
 POD_chargen.1200.a: "我想效忠于一位新主人。"
 POD_chargen.1200.a.tt: "接下来一周内，你可以免费使用#V $POD_beg_for_vitae_interaction$#![character_interaction|E]。以任意$POD_splat_vampire$为目标，使其成为你的[bound_ghoul|E]。"
 POD_chargen.1200.a.tt2: "[bound_ghouls|E]必须定期为其[Glossary('侍主','game_concept_domitor_desc')]完成[bound_ghoul_missions_with_icon|E]。忠诚的仆从最终可能获得$pod_Embrace$，从而自身成为$POD_splat_vampire$。当然，摆脱大师的控制成为[masterless_ghoul|E]也是可能的，尽管这十分困难。"
 POD_chargen.1200.b: "我才是我自己的主人"
 POD_chargen.1200.b.tt: "你变成[masterless_ghoul|E]"
 POD_chargen.1200.b.tt2: "[masterless_ghouls|EU]无需效忠于[Glossary('侍主','game_concept_domitor_desc')]，却要不断挣扎以满足自身的[ghoul_vitae_dependency|E]。若无法获得供养，他们将逐渐丧失力量。当然，若真到了山穷水尽的地步，事后央求他人成为[bound_ghoul|E]也不失为一条出路。"
 POD_chargen.1200.c: "我将致力于猎杀那些吸血者。"
 POD_chargen.1200.c.tt: "你加入[GetFaithByKey('calomenasforsaken').GetName]并成为$POD_splat_vampire_plural$$POD_splat_hunter$。"
 POD_chargen.1200.d: "也许我并非是血仆..."
