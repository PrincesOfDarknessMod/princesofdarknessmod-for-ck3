 POD_chargen.610.option.oldclan: "喀尔巴阡族会兽性术、观占术和支配术"
 POD_chargen.3800.t: "噗卡动物亲缘"
 POD_chargen.3800.desc: "有些人称之为混乱，而另一些人则称之为多样性或多元性。噗咔以各种形状和大小存在。半人半兽的他们，像其他戚系一样生活在凡人躯体中，但也可以变化成他们特属动物的形态。\n\n噗咔拥有其他戚系所没有的能力：即使在凡人伪装下，他们也能够化形。当一位噗咔变成它的动物形态时，他们变化得如此完全，以至于对于凡人和妖精之眼来说，他们就是那个动物本身。这能力所蕴含的力量让许多换生灵感到困惑，他们更倾向于认为噗咔是无用、无能的麻烦制造者。而噗咔则从容面对这一切。"
 POD_charjoin.900.t: "成为换生灵？"
 POD_charjoin.900.desc: "你确定你想成为换生灵？\n\n选了第一个选项后将无法回退。"
 POD_charjoin.900.option.a: "迷诱并心控我吧。"
 POD_chargen.1900.option.d.t: "通过对任何其他拥有束缚死灵能力的角色使用[character_interaction|E]，你将能够选择成为其的受缚死灵。"
 POD_chargen.1900.option.f: "也许我并非是死灵"
 POD_charjoin.1000.t: "成为宿主？"
 POD_charjoin.1000.desc: "你确定要被恶魔附体吗？你想被哪位恶魔附体？"
 POD_charjoin.1000.option.a: "一只从深渊中逃出来的任意恶魔。"
 POD_charjoin.1000.option.b: "德拉孔斯基"
 POD_charjoin.1000.option.c: "夏孟泽尔"
 POD_charjoin.1000.option.d: "库帕拉"
 POD_charjoin.1000.option.e: "我改变主意了。"
 POD_chargen.2.option.b1: "化兽族裔"
 POD_chargen.2.option.b2: "虫族"
 POD_chargen.2620.t: "化兽族裔"
 POD_chargen.2620.desc: "化兽族裔是狼族最常用的术语，代表着世界上众多的非狼人化形者。化兽族裔也被称为化形种族，由于狼族在魂怒之战中对他们发动了灭绝战争，大多数化兽族裔至少对狼族有强烈的不信任感。\n你属于化形种族中的哪族？"
 POD_chargen.2620.option.n: "也许我并非是化兽族裔"
 POD_chargen.2650.t: "虫族"
 POD_chargen.2650.desc: "$trait_entomos_desc$"
 POD_chargen.2650.option.n: "也许我并非是虫族……"
 POD_chargen.2651.t: "血种"
 POD_chargen.2651.desc: "除了是人口最多、最古老的虫族之外，阿南西的忠诚是分散的。绝大多数的阿南西分别忠于安娜纳莎和织者，他们陷入了关于世界命运的内战。他们本应成为织者的历史学家和秘密警察，但随着他们越来越努力争夺对彼此的掌控，他们已经成为最广泛的虫族种类。"
 POD_chargen.2651.option.f: "也许我并非是阿南西……"
 POD_chargen.2652.t: "血种"
 POD_chargen.2652.desc: "昆虫族是虫族的最大分类，包括从蜜蜂、蚂蚁、黄蜂、飞蛾、白蚁、蝗虫、螳螂和甲虫中获取形态的虫人。除了被放逐的甲虫一族克斯特乌外，大部分昆虫种族都是团结的。它们种类繁多，是面对哈米吉多顿（末日战场）时最注重相互合作的种族之一。"
 POD_chargen.2652.option.f: "也许我不是昆虫一族的一员"
 POD_chargen.2653.t: "血种"
 POD_chargen.2653.desc: "刻托族是虫族中一个神秘且不易理解的群体，他们崇拜着织者的海洋化身——刻托。他们拥有螃蟹和龙虾的化身形态，虽然能够行走在陆地上，但更偏爱在水下生活。总体而言，他们主要为了与海洋和河流相关的文明而战，但在虫族战争的末期，许多情况将他们吸引到了陆地上。"
 POD_chargen.2653.option.f: "也许我不是刻托的一员……"
 POD_chargen.2714.t: "倾向"
 POD_chargen.2714.desc: "阿南西的倾向是其三相平衡，这是织者赋予他们的圣裁的独特恩惠。面向定义了阿南西的一般倾向和个性，以及他们觉得有亲缘关系的灵体。泰内雷因其与织者的联系而收集信息、精于计算，库莫提则因为他们反映奇原的能量而充满活力和色彩，哈塔尔则因其与平衡妖蛆的联系而具有诱惑性和破坏性。"
 POD_chargen.2714.option.a: "泰内雷"
 POD_chargen.2714.option.b: "库莫提"
 POD_chargen.2714.option.c: "哈塔尔"
 POD_chargen.2715.t: "派系"
 POD_chargen.2715.desc: "在许多方面与化兽族裔的兆相相似，虫族的派系反映了他们在社会中的目的和角色。它们源于个性和自我实现的深层倾向，派系塑造了他们最易掌握的灵赋。密尔米顿是无与伦比的士兵、侦察兵、间谍和将军，维斯克是杰出的法官、神秘学者、领袖和贤者，维尔斯塔是出色的诡计家、哲学家、破坏者和控制混沌者，最后，苏科尔是无与伦比的治疗师、心理治疗师、顾问和顾问。"
