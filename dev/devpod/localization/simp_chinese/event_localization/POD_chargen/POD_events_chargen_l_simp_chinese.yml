 POD_chargen.1300.t: "遗传血仆"
 POD_chargen.1300.desc: "吞噬着他们的吸血鬼侍主的血的血奴，这些血仆获得了血族的一部分力量。他们的一些孩子出生时血管里就有吸血鬼的血液。随着对血的掌握，他们比他们的父母更强大。通常称之“$pod_revenants$”，而棘秘魑[Clan|E]的[ghoul|E]后裔则被称为“家传血仆”。你是从哪一系的$pod_revenants$来的？"
 POD_chargen.1300.option.a: "家传血仆，棘秘魑的后裔"
 POD_chargen.1300.option.b: "塔尔玛埃拉的仆众，黑手"
