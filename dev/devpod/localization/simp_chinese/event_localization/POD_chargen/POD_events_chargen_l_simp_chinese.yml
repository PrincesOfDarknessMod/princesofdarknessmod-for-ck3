 POD_chargen.1300.t: "遗传血仆"
 POD_chargen.1300.desc: "吞噬着他们的吸血鬼侍主的血的血奴，这些血仆获得了血族的一部分力量。他们的一些孩子出生时血管里就有吸血鬼的血液。随着对血的掌握，他们比他们的父母更强大。通常称之“[Glossary('遗传血仆','game_concept_revenant_desc')]”，而棘秘魑$pod_clan$的[ghoul|E]后裔则被称为“家传血仆”。你是从哪一系的[Glossary('遗传血仆','game_concept_revenant_desc')]来的？"
