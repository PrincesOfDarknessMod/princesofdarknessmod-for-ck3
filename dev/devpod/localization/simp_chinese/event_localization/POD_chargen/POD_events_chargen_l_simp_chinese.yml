 POD_chargen.2.option.h: "木乃伊"
 POD_chargen.2.option.i: "死灵"
 POD_chargen.3.t: "初代"
 POD_chargen.3.desc: "谁是吸血鬼的始祖？"
 POD_chargen.3.option.a: "如挪得之书所写：被天主诅咒的该隐"
 POD_chargen.3.option.i: "阿什拉派说是被真主所诅咒的加音"
 POD_chargen.3.option.c: "故事说吸血鬼是卡根的后代"
 POD_chargen.3.option.b: "黑暗之母说吸血鬼有很多起源"
 POD_chargen.3.option.h: "对奥西里斯进行报复的赛特"
 POD_chargen.3.option.g: "被奥丁用如尼符文救活的将死战士卡纳尔"
 POD_chargen.3.option.f: "由卑帝利所创造，被吒婆多修罗所猎杀的堕落仆众"
 POD_chargen.3.option.e: "受诅的$pod_wan_kuei$，万千鬼怪"
 POD_chargen.3.option.d: "我不知道吸血鬼从哪来"
 POD_chargen.3.option.j: "也许我不是吸血鬼……"
 POD_chargen.3.option.j.tt: "你重新考虑扮演哪种超自然生物。"
 POD_chargen.4.t: "次代"
