 POD_chargen.610.t: "$pod_disciplines$"
 POD_chargen.610.desc: "吸血鬼的力量被称为[discipline|E]。不同的$pod_Clans$和血系有不同的与生俱来的$pod_disciplines$。$pod_disciplines$一般被动的提供属性加成，但有些也可以通过决议或计谋来主动使用。使用$pod_disciplines$可能会增加饥渴度。现在你将确认你的[Clan|E]和[discipline|E]设定。这是你最后一次可以在背景生成器中后退并改变你的家族，[Clan|E]或种族。"
