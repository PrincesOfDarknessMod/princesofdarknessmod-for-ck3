l_simp_chinese:
 supehunter_purify_jerusalem_pit_decision: "净化欣嫩谷的深坑"
 supehunter_purify_jerusalem_pit_decision_desc: "在圣城耶路撒冷附近，欣嫩谷的废墟之下，存在一个深坑。任何过于靠近的生灵，无论是人类还是超自然存在，都会陷入疯狂，甚至稍远一些的人也会受到某种程度的狂乱影响。如此邪恶之物绝不能容忍其存在于耶路撒冷附近。因此，净化此坑乃是我们的职责。\n\n#R 你在这个任务中成功几率极低，尤其是作为一个凡人。如果你在乎你角色的安危，就不要轻易尝试。即使通过存档和读档来改变几率也救不了你。\n\n所以，向你的神明祈祷吧，记住，有德者将成功，有罪者将失败。已经警告过你了！#!"
 supehunter_purify_jerusalem_pit_decision_confirm: "必须净化这个魔窟！"
 supehunter_purify_jerusalem_pit_decision_tooltip: "我们不能容忍此等邪恶如此接近圣城！"
 POD_jerusalem.1.t: "猎神：初步准备"
 POD_jerusalem.1.desc: "我们很清楚最终的目标何在，但在此之前还需做好万全准备。若想在这场猎杀中存活下来，我们必须占尽一切先机。\n\n虽然我们已有诸多盟友和麾下士兵，但寻求更多援助或许有益。鉴于耶路撒冷的神圣性，周边地区云集了大量不同信仰的猎人。若愿意，我们可从中招募全部人手，或仅招募同信仰的盟友。"
 POD_jerusalem.1.a: "我们需要所有能得到的帮助"
 POD_jerusalem.1.b: "只有信徒之间才能相互信任。"
 POD_jerusalem.1.c: "我们还是别让外人掺和进来了。"
 POD_jerusalem.2.t: "猎神：知识就是力量"
 POD_jerusalem.2.desc: "正如长期以来人们所说，知识就是力量。当我们深入深渊时，了解将会遇到什么，对我们的探索将大有帮助。\n\n我们缺少能解答疑问所需的书籍和文物。因此，让我们去找一座藏书丰富的图书馆，里面要有我们所需的一切资料。"
 POD_jerusalem.2.a: "悬赏搜集情报。"
 POD_jerusalem.2.b: "调用一些人脉关系。"
 POD_jerusalem.2.c: "我们的图书馆里有一些线索。"
 POD_jerusalem.2.effect.success.desc: "原来它在那儿……"
 POD_jerusalem.2.critical.failure.effect.desc: "那位助手去哪儿了……"
 POD_jerusalem.3.t: "猎神：紧闭的大门"
 POD_jerusalem.3.desc: "我们已经找到了一个$pod_cainite$的图书馆，里面有我们需要的知识。但他们已经锁上了门，还通过邪术建立了超自然的防御。我们现在不能放弃目标，所以剩下的问题就是；怎么才能拿到那些典籍。"
 POD_jerusalem.3.a: "强攻大门！"
 POD_jerusalem.3.a.effect.success.desc: "无人可阻我们破门！"
 POD_jerusalem.3.b: "走后门！"
 POD_jerusalem.3.b.effect.success.desc: "他们无法监视每一扇门"
 POD_jerusalem.3.critical.failure: "于是我们的追寻结束了……"
 POD_jerusalem.3.critical.failure.effect.desc: "我们的信念还不够坚定"
 POD_jerusalem.4.t: "猎神：访问授权"
 POD_jerusalem.4.desc: "我们的研究揭示了一位名为[GetScriptedCharacterByHistoryID('790147').GetFirstName]的$pod_cainite$的故事。[GetScriptedCharacterByHistoryID('790368').GetFirstName]是令她遭受$pod_Embrace$的元凶，此事发生在克诺索斯迷宫深处。据说，在第二次巴力战争期间[GetScriptedCharacterByHistoryID('790368').GetFirstName]陨落后，纳姆塔尔本人将一道印记烙于她的灵魂之上，这印记以她对背叛其[Glossary('尊长','game_concept_Sire_desc')]的巴力氏族的人憎恨为食。\n许久之后，她曾在迦太基短暂现身，束缚了特洛伊勒与摩洛，继而令那片土地化为焦土。据称，她返回了克诺索斯的废墟，但我们发现的证据表明她来到了耶路撒冷，并且很可能就是深坑中的那头野兽。\n\n然而，她的故事存在异常。有人说她曾是一位末卡维，还是一个邪教的领袖。另一些人则专注于她曾$pod_Embrace$了亚历山大大帝之母[GetScriptedCharacterByHistoryID('790217').GetFirstName]，或是《[GetGlobalVariable('dreams_angra_link').Artifact.GetName]》的作者[GetScriptedCharacterByHistoryID('791970').GetFirstName]，尽管这些血脉世系有时也被归因于他人。"
 POD_jerusalem.4.a: "只是些传言而已，让猎杀开始吧！"
 POD_jerusalem.4.b: "这故事背后另有隐情。"
 POD_jerusalem.5.t: "猎神：完整始末"
 POD_jerusalem.5.desc: "经过大量工作，我们将[GetScriptedCharacterByHistoryID('790147').GetFirstName]的故事与我们持有的某些宝物记载结合了起来。\n\n似乎[Glossary('上古耆宿','game_concept_antediluvian_desc')]玛拉基的名字已从大多数该隐派的记录中抹去。然而，我们拼凑出了一些真相。如同她的兄弟赛特，玛拉基曾企图成为凡人中的神祇。和她的兄弟末卡维一样，玛拉基备受未来幻象的折磨，萦绕于心的是该隐被上帝亲自赋能以审判受诅之族的景象。\n\n就在此时刻临近之际，扫罗创造了一个能够助他先登神位、能够掌控命运之轮下一次转向、并能够抵抗该隐即将到来的审判的$pod_clan$。在一次尝试中，他瞬间屠戮了数百人，以此召唤一名“外域暗黑之子”（一个强大的恶魔？）。当献祭完成时，第一个后来被称为巴力的血族从坑中爬出。这是我们正在调查的那个坑吗？这很难说，因为一些文献指出其地点是一个名为哥拉汛的地方。\n\n此后发生了诸多事件：扫罗允许睿魔尔吸榨他以创造另一个服务于其终极目标的$pod_clan$；末卡维（据传）在与另一位[Glossary('上古耆宿','game_concept_antediluvian_desc')]近乎致命的遭遇后允许其子嗣吸榨他，并如今通过嵌入他们体内的自身碎片利用其所有后裔来推进他自己对升华或启迪的追求；而玛拉基本人则在欣嫩谷的废墟下陷入[Glossary('蛰眠','game_concept_torpor_desc')]。\n另一种说法认为这里的是末卡维，或者至少是他早已逝去的肉体所残留的血污。\n\n无论它们源于末卡维还是玛拉基，这些强大存在的梦境显然仍在影响着周边区域，将那些游走于疯狂与杀戮边缘的存在驱入癫狂与嗜血的狂暴之中。"
 POD_jerusalem.5.a: "祈祷我们只感受到他们的梦境，而非他们的魔爪。"
 POD_jerusalem.6.t: "猎神：深渊探掘"
 POD_jerusalem.6.desc: "完成所有准备后，我们如今集结于欣嫩谷的废墟之外。剩下的唯有向前推进，深入这邪恶的巨大深坑。但是，我们是否应该回头？这项追寻是否超出了我们的能力范围？我们活下去并继续我们平常的事业，是否能做出更多贡献？"
 POD_jerusalem.6.a: "愿我们的信念引领我们渡过难关。"
 POD_jerusalem.6.b: "从一开始就是愚蠢之举。"
 POD_jerusalem.7.t: "猎神：巨噬之口"
 POD_jerusalem.7.desc: "仅仅是抵达深坑入口的行为，已是对我们能力的巨大考验。其所处的墓穴是一个蜿蜒于山谷乃至圣城之下的迷宫。更糟的是，仅仅是凝视坑口就会灼伤我们兄弟的肉体与灵魂。他们的泪水和哀嚎在我们脑海中回荡，而他们半生不死的躯体在地上痛苦地扭动。\n\n我们的心智被可怕未来的景象所淹没。无数男女跪拜在巨大的黄金雕像前。由铁与黑石制成的倒置金字塔插入地球深处。其内俗艳地展示着献祭祭坛，哭泣的俘虏在那里被用黑曜石锯齿刀缓慢切割，历经数周的痛苦方才死去。\n\n由残缺血肉与金属构成、以硫磺熔炉为动力的工厂，源源不断地生产出无尽武器，以满足坑中居住者的图谋。我们看到了自己，被邪恶所扭曲并打上烙印，统领着受诅者的大军。"
 POD_jerusalem.7.a: "我们……必须……坚持……下去。"
 POD_jerusalem.7.effect.success.desc: "我们的意志不可征服"
 POD_jerusalem.7.critical.failure.effect.desc: "我们的血肉与心智被撕裂"
 POD_jerusalem.7.critical.failure: "沉沦于痛苦之中"
 POD_jerusalem.8.t: "猎神：等候室"
 POD_jerusalem.8.desc: "当我们沿着阶梯向下，逐渐远离地表时，立刻便被种种令人癫狂的幻象所困，它们许诺着从荣耀、知识到永生的一切。最终，阶梯通向一处迷宫般的洞穴网络，它们迂回曲折、盘绕扭转，连我们最出色的绘图师也难以描绘。无尽的通道与房间里摆满了家具，而每次重返，它们的位置都已改变。这还是同一个房间吗？当我们自以为沿直线前行时，却不知怎的又回到了曾在墙上做过标记的地方。\n\n可是，我们没在长满苔藓的墙上做过标记，对吧？刚一拐过弯，我们就置身于一条廊道中——它和另一条廊道共享着同一处空间，却通往不同的方向……还是说，我们其实一直都是在朝这个方向走？\n\n幻象挥之不去，而当地居民亦无助于我们——他们无精打采地游荡，永远搜寻着通往更深处的路径，以期获得那被允诺的奖赏。我们不能在此久留，否则终将变得与他们一样，枉费已然付出的牺牲。"
 POD_jerusalem.8.a: "该左转还是右转？"
 POD_jerusalem.8.effect.success.desc: "迷宫岂能阻我步伐"
 POD_jerusalem.8.critical.failure.effect.desc: "家具的碎片，地毯如瀑布般倾泻。"
 POD_jerusalem.8.critical.failure: "扭曲成无限通路"
 POD_jerusalem.9.t: "猎神：无尽风暴"
 POD_jerusalem.9.desc: "当我们沿台阶下行至下一层时，幻象与诱惑开始转向挑动我们最原始、最淫欲的渴望。这些幻象如此令人分神，以至于我们刚踏上这片区域，就险些被肆虐此地的狂风与风暴卷走。但我们绝不能被区区狂风击倒，更不可沦为这些永无宁日、被永恒撕扯的躁动亡魂中的一员"
 POD_jerusalem.9.a: "在风暴前屹立不倒。"
 POD_jerusalem.9.effect.success.desc: "圣洁岂是微风可阻"
 POD_jerusalem.9.critical.failure.effect.desc: "我们可不在耶路撒冷了，图提亚胡"
 POD_jerusalem.9.critical.failure: "彩虹彼端"
 POD_jerusalem.10.t: "猎神：寒冰之心"
 POD_jerusalem.10.desc: "楼梯再次向下延伸，深入地底。眼前的景象也再次变换。污浊的冰雨无休无止地倾泻而下，冰冷的泥泞浸透了万物。当我们穿过这片新区域时，迷失的灵魂如同又盲又聋的蛆虫，在覆盖一切的腐臭黏液里翻滚蠕动。他们疯狂地哭喊着索求各种东西——从食物、饮品，到毒品、享乐——凡是能让人灵魂上瘾的一切，无所不有。\n\n在通往下一层的门前蹲伏着一头贪婪的巨兽，形似疯狼又似神话中的巨龙。若要继续前进，我们必须智取那头无法以力胜之之物。"
 POD_jerusalem.10.a: "或可利用其饕餮之欲。"
 POD_jerusalem.10.effect.success.desc: "满口泥泞便无法噬人"
 POD_jerusalem.10.critical.failure.effect.desc: "哎呀，你的牙齿可真大"
 POD_jerusalem.10.critical.failure: "犬牙与蠕虫之咽"
 POD_jerusalem.11.t: "猎神：伟大攀登"
 POD_jerusalem.11.desc: "步出阶梯，我们意识到前进需另辟蹊径。并非向下走向中心，我们竟从中心现身，必须攀爬至嵌于侧壁的阶梯。贪吝者与挥霍者，囤积者与败家子，永无止境地将巨大钱袋推上这些陡峭崖壁。与之抗衡的，是沿侧壁不断奔流而下的熔金洪水，如美丽的死亡之河。\n\n此层的幻象与景象太易让人沉沦；我们只需稍稍放慢脚步……"
 POD_jerusalem.11.a: "向前进，别回头。"
 POD_jerusalem.11.effect.success.desc: "阶梯，终于到了！"
 POD_jerusalem.11.critical.failure.effect.desc: "璀璨之物皆熔金，销蚀汝血肉"
 POD_jerusalem.11.critical.failure: "点金之手所触"
 POD_jerusalem.12.t: "猎神：诅咒之城"
 POD_jerusalem.12.desc: "离开阶梯后，我们遭遇一片巨大沼泽与通向更深处的河流。外围，一些可怜虫如野兽般在水中跋涉并相互撕扯，而水下之物则满含憎恨地凝视我们。\n\n沿河而行，可见一座黑墙高耸入云的城池。上百哀嚎之形被倒悬于环绕城市的十字架上。隐藏锻炉中喷出股股浓烟，我们圣所的扭曲仿制品嘲弄地俯视我们。一切皆令我们回想起立于坑洞巨口前时所见的幻象。\n\n这是在这被遗弃的深渊中，我们首次遭遇拥有智慧与知觉的存在，他们阻挡了我们通往更下层阶梯的道路，声称我们对他们的黑暗之神不够虔诚。若想不加入我们所憎恨之物而继续前进，就必须杀出一条路，同时抗拒此地引动的黑暗冲动。"
 POD_jerusalem.12.a: "速战速决，直冲阶梯。"
 POD_jerusalem.12.effect.success.desc: "虔信者无可阻挡"
 POD_jerusalem.12.critical.failure.effect.desc: "有杀人洞？！"
 POD_jerusalem.12.critical.failure: "黑暗之门面前，万物倾颓"
 POD_jerusalem.12.b: "我们是来向你们的黑暗之神效忠的！"
 POD_jerusalem.13.t: "猎神：火湖"
 POD_jerusalem.13.desc: "在这油污窒塞、硫磺刺鼻的火湖岸畔，有朝圣者与被坑洞主人束缚的恶魔一同冥想诵咒。在他们骇人的神殿中，他们行不可名状之事，寻求未来之景，以期知悉主人的意志。\n\n少数人沉醉于痛苦，任由湖火吞噬自身。凭借意志之力与残酷虔诚，这些所谓的“受洗者”若得以幸存，便会以焦黑骨架之形浮现，其眼瞳映照着所经受的烈焰。他们拥有仅次于最强大该隐派的力量，并作为新主人的祭司。\n\n幸而，新受洗者只关心返回我们上方的城市。凭借些许潜行与神圣祝福，我们或可悄然穿行至阶梯，免遭火焰焚身。"
 POD_jerusalem.13.a: "溜到那块岩石后面！"
 POD_jerusalem.13.effect.success.desc: "没人料得到暗影裁判所……或我们"
 POD_jerusalem.13.critical.failure.effect.desc: "他们将我们逼回火湖，直至无一幸存。"
 POD_jerusalem.13.critical.failure: "伏击与硫磺"
 POD_jerusalem.14.t: "猎神：三重噩梦"
 POD_jerusalem.14.desc: "我们躲避的不仅是受洗者，还有那些固执己见、手持早已消亡文明——米诺斯、巴比伦、卡特维利、迈科普等连名字都湮没于时间迷雾中的文明——符号的祭司。唯有凭借神圣援助，我们才得以抵达通往下一层的阶梯，继续下行。\n\n与以往层级不同，我们发现此层分为三环。第一环是血海，用以满足深渊居民的饥渴，由人类所流之血汇聚而成。第二环是哀嚎林海，其木材为深渊熔炉提供燃料，林木则由那些抛弃自身肉体却仍未达到深渊之主期望的变形生物所化。第三环是燃烧沙海，一片被上层飘落的火屑不断灼烧的沙漠。\n\n或许通过审问那些困于树中的灵魂，我们能找到通往更下层的阶梯。"
 POD_jerusalem.14.a: "当你需要环保主义者的时候，他在哪里呢。"
 POD_jerusalem.14.effect.success.desc: "树叶低语着我们的答案"
 POD_jerusalem.14.critical.failure.effect.desc: "那些该死的树出卖了我们"
 POD_jerusalem.14.critical.failure: "奇袭!"
 POD_jerusalem.15.t: "猎神：世界皆舞台"
 POD_jerusalem.15.desc: "临近这地狱景象之底，我们仍为所见惊骇不已。整个层面宛若一座巨型圆形剧场，迷失的灵魂永无止境地讲述着自己每次散播不和、欺诈、误导、诱惑、奉承、欺骗、撒谎和偷窃的故事。深渊真正主人的仆从们游荡在座位区、舞台和后台，施展着邪恶魔法和强大仪式。他人虽凭蛮力，这些可憎之物却通过其身体残存部分引导主人的力量，使其能凭借信念和意志力，将世界扭曲成主人那扭曲形象的模样。\n\n笼罩这一切的是一片无星的虚空，一种令人不安的、仿照我主所塑造的天空的拙劣模仿品。那虚空中唯一的光源是一个月亮般的圆环，以其血红的光芒照亮其下蔓延的世界。\n\n终于，我们看到了附近存在阶梯的迹象。守卫阶梯的是一支巨人军队，身高从2.5米到13米不等，力大无穷，能像碾碎蚂蚁一样碾碎我们。他们挡住了所有前进的道路，我们别无选择，唯有一战。"
 POD_jerusalem.15.a: "唯有穿行而过。"
 POD_jerusalem.15.effect.success.desc: "蚂蚁亦能败蝎"
 POD_jerusalem.15.critical.failure.effect.desc: " 一位伟大英雄的惨烈结局"
 POD_jerusalem.15.critical.failure: "啪嗒！"
 POD_jerusalem.16.t: "猎神：强攻即是最好的防守"
 POD_jerusalem.16.desc: "在你面前展开的是无边无际的冰封之海。凡是曾背叛过深渊之主者，皆被埋葬于此景之中，被迫永远凝视其所背叛之人。\n\n我们越深入，该区域就不断被重塑和改变，以匹配从更深处散发出的黑暗梦境。我们正强行穿过一个远比在第二层所遇更为强大、更为致命的漩涡。前一分钟，我们还在尸群中厮杀；下一分钟，冒着黑烟的奇异发条人便试图杀死我们。巨人、焦黑骷髅、盲目吟诵的邪教徒，甚至被卷入梦境的次级恶魔都与我们为敌。\n\n山脉从平原隆起，又迅速坍塌回未触动过的地貌。河流切割岩石，而后干涸并被填平。我们头顶的假太阳变换颜色，从红到蓝，如同彩虹——其作为神圣信实象征的真义被扭曲成一幅轻蔑的图景。"
 POD_jerusalem.16.a: "让战斗开始吧！"
 POD_jerusalem.16.effect.success.desc: "终点在望"
 POD_jerusalem.16.critical.failure.effect.desc: "偏偏在此时失败"
 POD_jerusalem.16.critical.failure: "不！！！"
 POD_jerusalem.17.t: "猎神：最终试炼"
 POD_jerusalem.17.desc: "历经所有那些战斗、挣扎与死亡，我们终于站在了深渊之主面前。这头以其梦境重塑现实的野兽，这个以未兑现的承诺诱惑了如此多灵魂堕入此地的怪物。一如往常，我们所知的邪恶隐藏在一张平凡之人的平庸面孔之后。其真实本质的唯一线索，便是受神力加持者所能看到的、环绕其身的墨黑轮廓，表明其部分心智被困于另一领域。\n\n当你逼近欲以圣火将其永久毁灭时，你被定在原地，火炬向前伸出。你的心神以及你剩余同伴的心神都被一个异象所淹没。\n\n我们面前的女子显出一个黑暗光环，而我们围站在她身边，从远处指挥她的军队，操纵该区域的所有人，包括我们。她提供唯有最古老的血族玛土撒拉方可比拟的不朽与力量。她所求的回报，仅是我们的崇拜。"
 POD_jerusalem.17.a: "抵抗……必须抵抗。"
 POD_jerusalem.17.b: "如此微小的代价，换取如此巨大的奖赏。"
 POD_jerusalem.17.effect.success.desc: "死吧，污秽的野兽！"
 POD_jerusalem.17.critical.failure.effect.desc: "“傲慢是有代价的，年轻人”"
 POD_jerusalem.17.critical.failure: "功败垂成"
 POD_jerusalem.18.t: "猎神：胜利"
 POD_jerusalem.18.desc: "我们认出那异象不过是谎言，并将其摆脱。没有什么能阻止我们净化这个世界，清除这可怕的邪恶。你掷出祝福过的火炬，你队伍的残存者们汇聚起他们的神圣祝福，以增强那净化火焰的热度。显露出蛰眠状态的她的身体被点燃了。随着它化为灰烬，我们周围的梦境漩涡变得前所未有的混乱，这是我们无法想象的。\n\n一段时间后，梦境平息，只留下现实。我们再次回到了欣嫩谷的废墟，那里曾是我们试图进入深渊巨口的地方。曾经深渊所在之处，现在有一个金色圆环，因我们的成功而闪耀着神圣的欢欣，赞美诗随风低吟，无从辨别来源。\n\n回到我们的领域，有传言说吸血鬼因脑海中的尖啸而发疯，命令他们消灭我们。然而，那是另一个时代、另一代人的麻烦了。现在，让我们为我们这曾被认为不可能的伟业庆祝吧。"
 POD_jerusalem.18.a: "赞美主，庆贺我们伟大的胜利！"
 POD_jerusalem.20.t: "猎神：一份礼物"
 POD_jerusalem.20.desc: "当你接受她的初拥时，女主人将你带入她梦境的漩涡。你通过了所有的考验找到了她，证明了自己。作为奖励，她接纳你为她的孩子，并委任你实现她的宏伟愿景。\n\n她梦想着一个她能再次行走的世界。她梦想着一个她能被如神一般崇拜的世界。她梦想着一个和平的世界，一种唯有刀锋才能带来的和平。\n\n有她的梦指引，你绝不会失败。"
 fervor_new_prophet_malakai: "女主人任命了一位新先知"
 POD_jerusalem.19.t: "猎神：一份祝福"
 POD_jerusalem.19.desc: "或许是因为我们经历过的所有搏杀与挣扎，但从未像现在这样，被黑暗的许诺如此深深地吸引。当守卫盘问时，我们单膝跪地，宣誓效忠于他们的黑暗神明！尽管他们将信将疑，仍决定押送我们前往城中的宏伟神庙。在祭司长面前，我们立誓向黑暗之神献上忠诚。\n\n誓言脱口而出的瞬间，一缕诡异的精粹渗入唇齿间。带着铁锈般的腥气滑过喉咙，浸入骨髓。阵阵刺痛在体内蔓延，随后化为撕心裂肺的剧痛……超越想象的痛苦。左右环顾，你目睹同伴们的躯体扭曲变形，化作往日你会斥为怪物的恐怖形态。\n\n再次苏醒时，你已置身于深渊巨口之畔的地表。有个声音在意识深处低语：\"去吧，以刀锋为世间帶來安宁。\""
 POD_jerusalem.19.a: "尚有许多工作待完成。"
 building_pit_of_malkav_04: "神圣的欣嫩谷"
 building_pit_of_malkav_04_desc: "曾经充满疯狂之声的地方，如今只有赞美诗在风中低语。曾经疯狂肆虐于此圣地的力量，如今散播着祝福与智慧。曾经邪恶野兽摧残附近所有人心智的地方，如今祈祷声从这片土地升起。曾经贪婪巨口吞噬不慎者和罪人的地方，如今信徒们在这曾亵渎之地建起宏伟神庙进行朝圣。"
 POD_requirements_purified_pit_malkav: "[holder|E]必须信仰[GetReligionByKey('hunters_religion').GetAdjective]，是一名[GetTrait('supehunter').GetName( GetPlayer )]，并通过[decision|E]净化了该深渊。"
 malkavian_search_for_sister_decision: "寻找他/我们的/我的姐妹"
 malkavian_search_for_sister_decision_desc: "所有末卡维氏族都知道，无论是通过亲身经历还是传闻。一进入耶路撒冷，所有的末卡维都能通过疯网感受到那道命令。许多声音，一个声音，你的声音；全都重复着“姐妹……找回姐妹”。如果你找到线索并沉浸于疯网中进行传达，你知道将会得到感激。"
 malkavian_search_for_sister_decision_confirm: "开始搜寻吧"
 malkavian_search_for_sister_decision_tooltip: "寻找有关“姐妹”下落的线索"
 malkavian_search_for_sister_decision_effect: "你或许会找到所求之物，但更可能只会陷入更深的疯狂"
 madness_network_malakai_modifier: "疯网——奖励"
 madness_network_malakai_modifier_desc: "疯网中的某个存在对你找到关于“她”下落的线索感到满意"
 POD_jerusalem.21.t: "寻找他/我们的/我的姐妹：被困"
 POD_jerusalem.21.desc: "在搜寻“她”的过程中，你将意识探入疯网，搜寻她存在的蛛丝马迹。当你的意识扩散时，你感到一种类似被吸吮的感觉，仿佛坠入了……一个漩涡？\n\n当你恢复感知能力时，你意识到这片区域正在不断地被重塑和改造。山脉从平原上隆起，又迅速坍塌回未被触及的地貌。河流蚀刻岩石，而后干涸并被填平。我们头顶上空的假太阳变换着颜色，从红到蓝，如同彩虹被扭曲了其作为神圣信实象征的真意，化作了一幅轻蔑的图景。\n\n这是什么？为什么你无法逃脱？为什么我无法逃脱？"
 POD_jerusalem.21.a: "为什么我无法逃脱？！"
 POD_jerusalem.22.t: "寻找他/我们的/我的姐妹：精神损耗"
 POD_jerusalem.22.desc: "在寻找“她”的过程中，你将意识深入疯网，搜寻她存在的迹象。你花费了数分钟、数小时、数天寻找任何关于“她”的痕迹。当你最终抽身而出时，你的意识已疲惫不堪，几乎难以站立。"
 POD_jerusalem.22.a: "我需要时间恢复。"
 POD_jerusalem.23.t: "寻找他/我们的/我的姐妹：不速之客"
 POD_jerusalem.23.desc: "在寻找“她”的过程中，你将意识深入疯网，搜寻她存在的迹象。你花费了数分钟、数小时、数天寻找任何关于“她”的痕迹。\n\n最终，你勉强将自己抽离出来，遗憾的是并未取得任何进展。当你回归日常治国理政的事务时，却察觉到一股异样的存在感，正轻轻撩拨着你的意识深处。它似乎在将你推向某些异常而陌生的方向。"
 POD_jerusalem.23.a: "嗯，这可能是个问题。"
 POD_jerusalem.24.t: "寻找他/我们的/我的姐妹：反冲"
 POD_jerusalem.24.desc: "在寻找“她”的过程中，你将意识深入疯网，搜寻她存在的迹象。随后，伴随着突然的爆发，你的意识被强行抛回体内。你能感受到反冲力从你的意识沿着脊柱向下蔓延，渗透至身体的每个角落。"
 POD_jerusalem.24.a: "真是猝不及防。"
 POD_jerusalem.25.t: "寻找他/我们的/我的姐妹：线索"
 POD_jerusalem.25.desc: "在寻找“她”的过程中，你将意识深入疯网，搜寻她存在的迹象。你花费了数分钟、数小时、数天寻找任何关于“她”的痕迹。当你最终抽身而出时，你的意识已疲惫不堪，几乎难以站立。你能感知到某种存在，就在感知边缘。然后……你找到了！你发现了一个关于她位置的线索。虽然不多，但你通过疯狂之网感受到了一丝感激之情。"
 POD_jerusalem.25.a: "有总比没有好。"
 POD_jerusalem.26.t: "寻找他/我们的/我的姐妹：启示"
 POD_jerusalem.26.desc: "在寻找“她”的过程中，你将意识深入疯网，搜寻她存在的迹象。你找到了！并非仅仅是线索，而是一个真正的启示，指明了她的位置并为将她从她的梦境中解放出来提供了指引。\n\n你沉浸于疯狂之网并传递了这一启示。你能感受到通过网络弥漫而来的感激之情，并以新的洞见充盈着你，这些洞见由一位感觉熟悉却又陌生的存在所赐予。"
 POD_jerusalem.26.a: ".嗯……这倒是新鲜。"
 malakaite_mistress_boon_decision: "玛拉基恩赐"
 malakaite_mistress_boon_decision_desc: "在我们努力实现女主人的梦想时，有时会遇到武功方面的困难。也许女主人会赐予我们一项恩惠，以助力我们的努力。"
 malakaite_mistress_boon_decision_confirm: "希望女主人能慷慨些"
 malakaite_mistress_boon_decision_tooltip: "希望女主人能慷慨些"
 malakaite_mistress_boon_decision_effect: "也许女主人会赐予我们一个恩惠"
 malakaite_mistress_boon_decision_toast_success: "女主人很慷慨"
 malakaite_mistress_boon_decision_toast_fail: "我们必须赢得我们的恩赐"
 vamp_lower_gen_jerusalem_decision: "鲜红之泉"
 vamp_lower_gen_jerusalem_decision_desc: "隐藏在耶路撒冷深处及其古老下水道之中，有传言说隐藏的泉眼会流出鲜血之河。凭借此血，我们可更接近初代血族，降低我们的辈分并极大增强我们的力量。如果你能与当地的诺斯费拉图或巴力取得联系，他们可能指引我们寻得所求，只要我们适当地#italic 鼓励#!他们。\n\n然而，我们需谨记，如此重宝很可能伴随着巨大的代价，因此我们应做好准备。"
 vamp_lower_gen_jerusalem_decision_confirm: "让狩猎开始吧"
 vamp_lower_gen_jerusalem_decision_tooltip: "或许我们该在这所谓的圣地寻找我们自己的圣水"
 vamp_lower_gen_jerusalem_decision_effect: "你将降低你的[Glossary('世代','game_concept_vampgeneration_desc')]1级，但#beast 后果#!可能不太妙。"
 vamp_lower_gen_jerusalem_decision_generation_requirement: "你必须是第五代[Glossary('世代','game_concept_vampgeneration_desc')]或者更前"
 POD_jerusalem.27.t: "联络当地人"
 POD_jerusalem.27.desc: "要寻得此等隐秘奇迹，你将需要当地帮手来清除障碍并为你引路。目前有两个显而易见的选项：诺斯费拉图与巴力。\n\n没有人比诺斯费拉图更了解任何城市的下水道、地下墓穴和最黑暗的角落，更不用说其中可能存在的陷阱了。考虑到他们对宗教的癖好以及耶路撒冷的重要性，他们在这座城市有着可观的存在。稍加努力，你便可#italic 鼓励#!他们帮助我们——无论是通过诡计还是折磨。\n\n或者，你也可以接触巴力。出于某种原因，他们中的一些新生者认为那些鲜血之河预示着他们某位“沉睡者”或末卡维本身的存在。如果你愿意，你可以承诺提供援助，利用他们来冲破任何陷阱或困难，然后在找到目标后背叛他们。毕竟，此等力量并非可共享之物，尤其是与他们这样的存在。"
 POD_jerusalem.27.a: "联络诺斯费拉图。"
 POD_jerusalem.27.a.success: "枉费他们自诩精明"
 POD_jerusalem.27.a.critical.failure: "你骗不过行家"
 POD_jerusalem.27.b: "接触巴力。"
 POD_jerusalem.27.b.success: "看来他们的实力也不过如此。"
 POD_jerusalem.27.b.critical.failure: "现在我知道我的实力略逊于十个巴力。"
 POD_jerusalem.27.c: "转念一想……"
 POD_jerusalem.28.t: "诺斯费拉图援助"
 POD_jerusalem.28.desc: "你成功了！尽管他们以狡诈著称，你还是成功诱骗了某些尤其博学的诺斯费拉图来与你见面。让他们大为惊讶的是，这是个陷阱，你抓住了他们。一旦他们被关进你的地牢，提取所需信息就只是几天的事。根据这些信息，你绘制了一张标注了所有陷阱的地图，并设法进入了隧道。\n\n你听见远处传来咆哮的水声，循声而去，发现一条污浊的河流，河水被凝固的血液污染，似乎正流入死海。出于本能，你让一个微不足道的仆从饮用河水，这使你免于明显的毒性和血狂。你没有放弃，继续探索，直到发现古老干燥的淤泥，仿佛曾有河流泛滥淹没此地。在淤泥中，你找到了一滴纯净无瑕的血液。吞下它后，你能感觉到力量在血管中奔涌。当你试验新获得的能力时，发现传闻是真的！所有证据表明，你直接降低了一整个[Glossary('世代','game_concept_vampgeneration_desc')]！"
 POD_jerusalem.28.a: "成功的滋味真甜美！"
 POD_jerusalem.29.t: "巴力援助"
 POD_jerusalem.29.desc: "当你和你的巴力同伴们一同在隧道中穿行时，你们一路闯过陷阱与诺斯费拉图的伏击。有几个巴力死了，没什么可惜的。数小时后，你们听到远处传来轰鸣的水声，循声找到了一条污浊的河流，河水被凝固的血液污染，似乎流向死海。出于本能，你让一个无足轻重的仆从饮下河水，这让你得以避开河水明显的毒性以及可能引发的赤骇。你没有放弃，继续探索，直到发现古老干涸的淤泥，仿佛曾有河流漫过河岸，覆盖了此处的地面。在淤泥之中，你找到了一滴纯净、未被污染的血。\n\n就在那滴血被发现的瞬间，你扑向巴力们，开始将他们撕碎。从他们眼中的惊愕来看，显然你抢先一步识破了他们的背叛。这等乳臭未干的小辈们，连剿灭他们都嫌麻烦。\n\n最终，他们都被解决了，你回到那滴静卧于淤泥中的血面前。将其吞下后，你能感到力量在血管中奔涌。当你试验自己的新能力时，发现传言属实！所有证据都表明，你直接降低了一整个[Glossary('世代','game_concept_vampgeneration_desc')]！"
 POD_jerusalem.30.t: "[unconquered_soul|E]的迹象"
 POD_jerusalem.30.desc: "你的一名仆从指出，你最近改变了一些习惯，这对你这般存在而言并不常见。更糟的是，你做出了一些奇怪且不明智的决定，损害了你在[GetTrait('vampire').GetName( GetPlayer )]政治中的地位，而你自己却毫无印象。这让你想起了关于[Glossary('吸榨','game_concept_diablerie_desc')]可怕的后果传言，以及它可能对你的灵魂造成的侵蚀。\n\n难道耶路撒冷暗河中的血液隐藏着一个灵魂或其碎片？它正在试图反击吗？这确实是一个令人担忧的推测……"
 POD_jerusalem.30.a.success: "重夺你的心智"
 POD_jerusalem.30.a.failure: "以高昂代价重夺你的心智"
 POD_jerusalem.30.a.critical.failure: "万物皆将化为猩红喷泉"
 molochite_maintain_the_sleep_decision: "维持沉睡者"
 molochite_maintain_the_sleep_decision_desc: "我们发现一个古老而被遗忘已久的生物，被囚禁在耶路撒冷城外欣嫩谷的梦境状态之下。虽然此类实体并非外域暗黑之子，也不构成同等级别的危险，但这位玛土撒拉的梦境依然足够强大，足以扭曲土地并令附近的心智陷入疯狂。必须让此等存在保持满足，以防其苏醒并逃脱。"
 molochite_maintain_the_sleep_decision_confirm: "喂食沉睡者"
 molochite_maintain_the_sleep_decision_tooltip: "我们必须让沉睡者保持满足"
 molochite_maintain_the_sleep_decision_effect: "当沉睡者维持沉睡时，可以从其梦境中攫取知识"
 molochite_maintain_the_sleep_decision_jerusalem_development_requirement: "[GetTitleByKey('c_jerusalem').GetName]的[development|E]将下降15"
 POD_jerusalem.31.t: "真名之力"
 POD_jerusalem.31.desc: "在耶路撒冷长久地接触沉睡者的梦境之后，你已对其中的规律与穿行方式了如指掌。这不仅让你对自身的$pod_disciplines$有了更深的理解，还使你获得了超越寻常[GetTrait('demonology').GetName( GetPlayer )]范畴的、对于[Glossary('真名','podgloss.truename')]的独特认知。你新获得的理解与非洲不朽者所运用的力量最为相似，并赋予你一项新的能力来协助你的使命。"
 POD_jerusalem.31.a: "知晓真名，即是握住了万物的灵魂。"
 dreams_of_the_sleeper_modifier: "沉睡者之梦"
 nergalite_wake_the_sleeper_decision: "唤醒沉睡者"
 nergalite_wake_the_sleeper_decision_desc: "我们发现，一个古老而强大的存在被囚禁在耶路撒冷城外欣嫩谷地底，处于梦境状态。虽然这样的实体并非外域黑暗之子，也无法提供同等的力量，但这位玛土撒拉的梦境依然强大到足以扭曲土地，并令附近的心智陷入疯狂。我们必须唤醒这样的存在，以便与其达成协议，将其力量引导至我们自己的目标。"
 nergalite_wake_the_sleeper_decision_confirm: "喂食沉睡者"
 nergalite_wake_the_sleeper_decision_tooltip: "我们必须唤醒沉睡者。"
 nergalite_wake_the_sleeper_decision_effect: "随着沉睡者苏醒，其感激之情将会增强。"
 nergalite_wake_the_sleeper_decision_jerusalem_duchy_development_tt: "[GetTitleByKey('c_jerusalem').GetNameNoTier]的[de_jure|E][duchy|E]内的每一个[county|E]都必须拥有高于5的[development|E]。"
 nergalite_wake_the_sleeper_decision_jerusalem_kingdom_development_tt: "[GetTitleByKey('c_jerusalem').GetNameNoTier]的[de_jure|E][kingdom|E]内的每一个[county|E]都必须高于5的[development|E]。"
 nergalite_wake_the_sleeper_decision_jerusalem_empire_development_tt: "[GetTitleByKey('c_jerusalem').GetNameNoTier]的[de_jure|E][empire|E]内的每一个[county|E]都必须拥有高于5点[development|E]。"
 nergalite_wake_the_sleeper_decision_jerusalem_development_effect: "[GetTitleByKey('c_jerusalem').GetName]的[development|E]将降低5点，并获得持续5年的[GetModifier('extinguish_life_modifier').GetNameWithTooltip]修正。"
 nergalite_wake_the_sleeper_decision_jerusalem_duchy_development_effect: "[GetTitleByKey('c_jerusalem').GetNameNoTier][de_jure|E][duchy|E]领内所有伯爵领的[development|E]将降低5点，并将在5年内获得[GetModifier('extinguish_life_modifier').GetNameWithTooltip]修正。"
 nergalite_wake_the_sleeper_decision_jerusalem_kingdom_development_effect: "[GetTitleByKey('c_jerusalem').GetNameNoTier][de_jure|E][kingdom|E]领内所有伯爵领的[development|E]将降低5点，并将在10年内获得[GetModifier('extinguish_life_modifier').GetNameWithTooltip]修正。"
 nergalite_wake_the_sleeper_decision_jerusalem_empire_development_effect: "[GetTitleByKey('c_jerusalem').GetNameNoTier][de_jure|E][empire|E]领内所有伯爵领的[development|E]将降低5点，并将在10年内获得[GetModifier('extinguish_life_modifier').GetNameWithTooltip]修正。"
 POD_jerusalem.32.t: "无限的力量！！！"
 POD_jerusalem.32.desc: "你一直在缓慢地喂养沉睡者，并诱导其灵魂更接近其身体，使你得以引导其部分力量。在享用足够的血餐后，我们引起了沉睡者的全部注意。她已伸展并触碰了我们的心智，通过你引导其部分力量与知识，以此奖赏你的努力。凭借这股力量，你终将能达到甚至超越内尔伽勒的高度。剩下的唯有应允……"
 POD_jerusalem.32.a: "做吧！"
 POD_jerusalem.32.a.tt: "你将解锁秘仪生活方式"
 POD_jerusalem.32.a.effect.success.desc: "这副躯体现在有了新的主人。"
 constantinian_channel_religious_fervor_decision: "引导宗教狂热"
 constantinian_channel_religious_fervor_decision_desc: "由于未知的原因，耶路撒冷周边地区弥漫着浓郁的梦华与宗教狂热。在建立了君士坦丁派探题之后，我们掌握了收割信徒梦华的方法。若能运用我们新获得的知识妥善引导，耶路撒冷如此规模的狂热信仰，将为我们提供一个绝佳的机会，以确保对你的信仰永不枯竭，进而实现你或所指对象的永恒存在。"
 constantinian_channel_religious_fervor_decision_confirm: "是时候驾驭信仰之力了。"
 constantinian_channel_religious_fervor_decision_tooltip: "耶路撒冷的宗教狂热提供了一个绝佳的机会。"
 constantinian_channel_religious_fervor_decision_effect: "无论是作为格古里、拿非利，还是被赋予力量的先知，我都要饱餐耶路撒冷的宗教狂热。"
 constantinian_channel_religious_fervor_decision_holy_city_jerusalem_requirement_tooltip: "你必须控制并转化[GetTitleByKey('c_jerusalem').GetNameNoTier]这座城市，因为它是亚伯拉罕信仰体系与当地妖精的关键圣地，此举将增强你对当地梦华的影响力。"
 constantinian_channel_religious_fervor_decision_holy_city_antioch_requirement_tooltip: "你必须控制并转化[GetTitleByKey('c_antiocheia').GetNameNoTier]这座城市，因为它是亚伯拉罕信仰体系与当地妖精的关键圣地，此举将增强你对当地梦华的影响力。"
 constantinian_channel_religious_fervor_decision_holy_city_acre_requirement_tooltip: "你必须控制并转化[GetTitleByKey('c_acre').GetNameNoTier]这座城市，因为它是亚伯拉罕信仰体系与当地妖精的关键圣地，此举将增强你对当地梦华的影响力。"
 constantinian_channel_religious_fervor_decision_holy_city_alexandria_requirement_tooltip: "你必须控制并转化[GetTitleByKey('c_alexandria').GetNameNoTier]这座城市，因为它是亚伯拉罕信仰体系与当地妖精的关键圣地，此举将增强你对当地梦华的影响力。"
 constantinian_channel_religious_fervor_decision_holy_city_tigre_requirement_tooltip: "你必须控制并转化[GetTitleByKey('c_tigre').GetNameNoTier]这座城市，因为它是亚伯拉罕信仰体系与当地妖精的关键圣地，此举将增强你对当地梦华的影响力。"
 constantinian_channel_religious_fervor_decision_holy_city_mecca_requirement_tooltip: "你必须控制并转化[GetTitleByKey('c_mecca').GetNameNoTier]这座城市，因为它是亚伯拉罕信仰体系与当地妖精的关键圣地，此举将增强你对当地梦华的影响力。"
 constantinian_channel_religious_fervor_decision_high_almoner_requirement_tooltip: "你有一位具有良好[aptitude|E]的[GetTrait('qareen').GetName( GetPlayer )][GetCourtPositionType('high_almoner_court_position').GetName()]"
 constantinian_channel_religious_fervor_decision_djedi_ojo_seelie_requirement_tooltip: "你需要至少三名[GetTrait('djedi').GetName( GetPlayer )]与三名[GetFaithByKey('ojo_constantinians').GetName]廷臣。你需要擅长汲取环境中的梦华，并能引导当地信众朝与你相似方向行事的本地人才。"
 constantinian_channel_religious_fervor_decision_djedi_iku_unseelie_requirement_tooltip: "你需要至少三名[GetTrait('djedi').GetName( GetPlayer )]与三名[GetFaithByKey('iku_humanists').GetName]廷臣。你需要擅长汲取环境中的梦华，并能引导当地信众朝与你相似方向行事的本地人才。"
 POD_jerusalem.33.t: "永恒半神"
 POD_jerusalem.33.desc: "成了！你已改写了传说，甚至重塑了自身的形态。你招募了魔法大师与渊博学者。你汲取了那梦华的源泉，如此狭小地域中无数凡人的炽烈信仰，更因近处的某种存在而得以放大。这份信念无远弗届！你的后裔将受到庇护，免遭宗教仪轨的摧残，纵使是洗礼也不例外！纵使世间战火纷飞、瘟疫横行、审判严酷、板讷蚀心，你也将永存！只要人类仍信仰神明，你就不会消逝！\n\n\n#EMP \"天使悄展智慧之翼，\n默默守护人世天地，\n帮扶盘旋，引航看顾：\n天使居所帷薄如缕。\n\n天使趁我们安眠时悄然靠近，\n招手邀约'请入此深境'，\n将一切悔恨与空妄涤清。\n她们圣洁的形影舞过我们梦境。\n\n天使在我们苏醒时接踵而至，\n承接使命直至白昼终止。\n虽形貌隐没，仍感其温柔照看。\n天使无处不在。热情迎接她们。\"#!"
 POD_jerusalem.33.a: "众生赞我！"
 grigori_fae_modifier: "一位半神存在"
 grigori_fae_modifier_desc: "先知，格里戈里，拿非利，活物，轮，守望者，哈什马尔，撒拉弗，玛拉基姆，神之子，基路伯，以欣，卡基德里，查什马利姆，死亡天使，克鲁维，宝座承载者，监护者，守护者，尊贵的记录者。"
 mummies_tap_web_faith_decision: "接入信仰之网"
 mummies_tap_web_faith_decision_desc: "我们的赫考之力源自我们从信仰之网中获取的塞赫。尽管有些人已发现了获取它的其他途径，但信仰之网仍是塞赫最有效、最可靠的来源。耶路撒冷是最强大的节点之一，它提供了一个独特的机会，使我们能够偶尔接入信仰之网，获取额外的塞赫。"
 mummies_tap_web_faith_decision_confirm: "准备好那个比喻性的壶嘴。"
 mummies_tap_web_faith_decision_tooltip: "耶路撒冷是信仰之网中一个强大的节点，并提供了一个机会"
 mummies_tap_web_faith_decision_effect: "你将基于你的$POD_splat_mummy$[trait_level_track_xp|E]等级经验获得赫考生活方式经验。"
 POD_jerusalem.34.t: "接入信仰之网"
 POD_jerusalem.34.desc: "你的赫考魔法，甚至你的长寿，都是由从信仰之网汲取的塞赫所驱动的。这是一个连接着整个北非、中东和波斯节点的神秘网络。你对耶路撒冷的控制使你得以接入信仰之网，为你提供额外的塞赫，甚至包括关于其使用的知识。与更稳定的连接不同，这种接入有其局限性，但也确实创造了一些有趣的可能性。"
 POD_jerusalem.34.a: "我迫不及待地想要探索它们。"
 jerusalem_shift_balance_of_power_decision: "改变耶路撒冷权力平衡"
 jerusalem_shift_balance_of_power_decision_desc: "圣城[holy_jerusalem|E]这座[grand_city|E]正立于刀锋边缘，在三大主要教派间摇摇欲坠。犹太教徒、基督徒和伊斯兰教徒在这座圣城内为争夺更多控制权而纷争不断。它们背后的超自然势力也出于各种目的频繁介入这些冲突。若你手握足够资源，便可打破力量天平使其倾向你属意的阵营，亦可选择维系这脆弱的平衡。"
 jerusalem_shift_balance_of_power_decision_confirm: "让我看一下"
 jerusalem_shift_balance_of_power_decision_tooltip: "耶路撒冷正立于刀锋之上。让我们推它一把。"
 jerusalem_shift_balance_of_power_decision_effect: "你可以查看当前的权力平衡，或者改变它"
 jerusalem_influence_message_title: "权力平衡"
 jerusalem_influence_message_desc: "在完成一座新建筑后，耶路撒冷这座[grand_city|E]的权力平衡已经改变。"
 jerusalem_influence_gain: "[holy_jerusalem|E]#P 获得#![SCOPE.GetValue('influence_delta')|V0][Localize(SCOPE.GetFlagName('influence_type'))]"
 jerusalem_influence_loss: "[holy_jerusalem|E]#N 失去#![Abs_CFixedPoint(SCOPE.GetValue('influence_delta'))|V0][Localize(SCOPE.GetFlagName('influence_type'))]"
 POD_jerusalem.35.t: "权力平衡"
 POD_jerusalem.35.desc: "[grand_city|E][holy_jerusalem|E]的命运正悬于一线，在三大主要教派势力间摇摆不定。根据你对耶路撒冷建筑的目标，你需要将权力平衡转向不同的派别。"
 POD_jerusalem.35.a: "更改@piety_level_3_icon_christian!基督教影响"
 POD_jerusalem.35.b: "更改@piety_level_3_icon_islam!伊斯兰教影响"
 POD_jerusalem.35.c: "更改@piety_level_3_icon_judaism!犹太教影响"
 POD_jerusalem.35.d: "转念一想……"
 POD_jerusalem.36.t: "耶路撒冷内的基督教影响力"
 POD_jerusalem.36.desc: "近两个世纪以来，耶路撒冷的所有权在基督教与伊斯兰各派系之间几经易手。最近，第六次十字军东征以神圣罗马帝国皇帝、基督徒腓特烈二世成功夺取耶路撒冷告终。此外，条约的签订使得埃及苏丹卡米尔将注意力从耶路撒冷转移，转而关注大马士革的埃米尔纳西尔·达乌德。耶路撒冷境内驻有五大骑士修会，以协助实现基督教的目标。北面还有三个十字军国家提供进一步支援。加之，该城人口已激增至十万，相当于甚至超过了法蒂玛王朝时期的规模，随着更多人口迁入耶路撒冷，基督教的影响力也随之增强。\n\n然而，基督徒确实面临着种种困境。耶路撒冷王国因内战而分裂，这场战争甚至波及到了十字军修会内部。此外，腓特烈签订的休战协定将于1239年到期，届时周边穆斯林国家几乎必定会发动进攻。"
 POD_jerusalem.36.a: "@gold_icon!支持意大利商人"
 POD_jerusalem.36.b: "@prestige_icon!增加该地区的团结"
 POD_jerusalem.36.c: "@gold_icon!安排针对性打击"
 POD_jerusalem.36.d: "@prestige_icon!煽动内战之火"
 POD_jerusalem.37.t: "耶路撒冷内的伊斯兰教影响力"
 POD_jerusalem.37.desc: "近两个世纪以来，耶路撒冷一直在基督教与伊斯兰各派系之间反复易手。最近，第六次十字军东征以神圣罗马帝国皇帝腓特烈二世成功夺取耶路撒冷告终。尽管该城的统治权曾一度丧失，但条约保障了穆斯林继续进行崇拜的权利。1244年耶路撒冷落入花剌子模帝国手中后，此后数个世纪都将不再由伊斯兰教掌控。即便在那之前，该地区的凡人与超自然统治者及居民也以伊斯兰教为主。\n\n然而，目前耶路撒冷由基督教凡人控制。穆斯林苏丹与埃米尔内部纷争不断，而1260年的蒙古入侵将进一步削弱穆斯林在该地区的影响力。"
 POD_jerusalem.37.a: "@gold_icon!扩大伊斯兰化努力"
 POD_jerusalem.37.b: "@prestige_icon!鼓励加扎瓦袭击"
 POD_jerusalem.37.c: "@gold_icon!扰乱凡人伊斯兰统治者"
 POD_jerusalem.37.d: "@prestige_icon!驱逐伊斯兰麻烦制造者"
 POD_jerusalem.38.t: "耶路撒冷内的犹太教影响力"
 POD_jerusalem.38.desc: "近两个世纪以来，耶路撒冷在基督教与伊斯兰教各派系间几经易手。唯有一事始终未变：众多犹太人惨遭屠戮。在血腥周期间，基督教十字军对犹太人进行了大规模屠杀与勒索。尽管穆斯林统治者相对宽容，却也从不回避对犹太人进行清洗。犹太会堂与古老圣地屡遭强占、亵渎，或直接毁坏。\n\n面对耶路撒冷城内犹太人如此艰难的处境，你既可轻易将其清除，亦可竭力保全——一切皆取决于你的意图。"
 POD_jerusalem.38.a: "@gold_icon!安排警卫和防御"
 POD_jerusalem.38.b: "[GetLocalPlayerPietyTextIcon]鼓励阿利亚运动"
 POD_jerusalem.38.c: "@gold_icon!在犹太会堂原址上兴建"
 POD_jerusalem.38.d: "[GetLocalPlayerPietyTextIcon]鼓励改宗，无论自愿与否"