 ACRE_RESURRECTION_PERK_TEXT: "允许招募[GetMaA('vampires_hunters').GetName]作为[men_at_arms|E]。\n解锁让你可以治疗大多数普通疾病的[character_interaction|E]。\n#flavor 有些骑士被神圣地赋予了控制自己和他人体内生命力起伏的力量。他们甚至可以利用生命本身的力量沸腾受诅者的魔邪精髓。#!"
 RED_FORTUNES_PERK_TEXT: "允许招募[GetMaA('demons_hunters').GetName]作为[men_at_arms|E]。\n#flavor 通过这个神圣的仪式，修行者可以祝福一群前往于敌人战斗的武装战斗人员。#!"
 MURNAU_MIRROR_PERK_TEXT: "允许招募[GetMaA('monsters_hunters').GetName]作为[men_at_arms|E]。\n解锁决斗招式。\n#flavor 能够以实力和知识为武器，在地面上迎战超自然的对手。穆尔瑙称之为神圣启示，其他一些人则用了一些不那么恭维的词语。#!"
 OCULI_LITURGY_PERK_TEXT: "招募宾客的花费-50%\n#flavor 通过诵读经文，天主之眼可以把自己对功业的奉献强加给另一个人。#!"
 SISTERS_GOSPEL_PERK_TEXT: "受折磨的囚犯将永远揭露自己秘密，如果有的话。\n#flavor 赋予修女们高超的辩论、演说技巧，必要时还能进行审讯。#!"
 ACRE_CATECHUMEN_PERK_TEXT: "可以与自己的[knights|E]进行[single_combat_fight|E]对练，获得[modifiers|E]\n解锁决斗招式。\n#flavor 允许裁判官在英勇、谦逊和恒心方面的早期教训中起到示范作用。#!"
 ACRE_FLESH_PERK_TEXT: "解锁决斗招式。\n#flavor 通过传唤他不可动摇的美德，骑士被赋予了改变自己身体能力的力量。#!"
 ACRE_FLIGHT_PERK_TEXT: "解锁决斗招式。\n#flavor 允许裁判官在与大敌的下仆战斗时获得神助旋风。#!"
 ACRE_AUTO_PERK_TEXT: "解锁决斗招式。\n#flavor 这也是大敌的爪牙们惧怕神之骑士的核心原因，这种祝福能让裁判官把自己的美德和力量集中为一发极强的打击。#!"
 RED_VIGIL_PERK_TEXT: "#flavor 该仪式为主体提供了能量，缓解了他们对睡眠或休息的需求。#!"
 RED_SUNSTONE_PERK_TEXT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor 为一块普通的石头注入主的首创之物（太阳）的祝福。#!"
 RED_FORGE_PERK_TEXT: "#flavor 将锻造武器的过程神圣化，生产出蒙福的武器。#!"
 SISTERS_LUX_PERK_TEXT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor 呼应圣父的话，裁判官声明“要有光！”，一团柔和的白光便出现在她的周围，照亮了超自然生物的本来面目。#!"
 SISTERS_HOSANNA_PERK_TEXT: "解锁决斗招式。\n#flavor 裁判官利用这种力量捕捉天歌的灵性“波长”，利用它的力量促进上帝的荣耀。#!"
 SISTERS_ORATORIO_PERK_TEXT: "解锁决斗招式。\n#flavor 让修女在歌声中发挥她的声音，让听众充满她的信仰的灿烂光辉，这对原罪之奴来说是一种毁灭性的体验。#!"
 MURNAU_KNOWLEDGE_PERK_TEXT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor 冯·穆尔瑙家族世世代代都被一种与生俱来的熟稔和感知各种腐化的能力所困扰（或者说是祝福）。#!"
 MURNAU_WREATHED_PERK_TEXT: "#flavor 掌握了穆尔瑙自身的阴暗面，就能影响他人。“我虽然行过死荫的幽谷……”#!"
 MURNAU_ARCANA_PERK_TEXT: "解锁决斗招式。\n#flavor 能够阻碍、转移或避开地狱衍体的行动。这能力通常会让裁判官的灵魂付出代价，但一旦掌握，它就能将超自然力量反弹给施展者。#!"
 OCULI_SIGHT_PERK_TEXT: "免疫部分模糊术决斗招式。\n#flavor 不管超自然生物有多努力的去避免被观察，该视觉都允许裁判官通过它看穿。#!"
 OCULI_WINE_PERK_TEXT: "#flavor 裁判官可以将一个普通的物体转化为其他的东西，或者将死亡或垂死的组织恢复到健康状态。#!"
