 COYOTES_HOWL_PERK_EFFECT: "作为[character_interaction|E]，允许你伤害目标的所有骑士。\n作为战争参与者时，在[war|E]中给予敌方参与者[GetModifier('coyotes_howl_perk_modifier').GetNameWithTooltip]。\n#F 正如郊狼神是造物主一样，他也是毁灭神。在时光的流转中，他将抹去一切存在，因为那是他的职责。郊狼神之嚎使努维沙能够召唤出郊狼神毁灭性力量的一小部分，并将这股能量释放在一个人或一个区域上。当使用郊狼神之嚎时，整个自然界都会震荡，并将其扭曲成毁灭之源。这股力量可能会以龙卷风或海啸的形式出现。它可能是地震或闪电风暴。无论如何，几乎没有什么能够抵挡郊狼神之嚎的力量。这灵赋是努维沙所知最强大的灵赋之一，只有郊狼神认为配得上的人才会被教授。#!"
