 FEAR_THE_VOID_BELOW_PERK_EFFECT: "作为[character_interaction|E]，降低目标的胆识，持续10年。\n#flavor 巴力使目标因堕入地狱的恐惧而战栗。#!"
 CONFLAGRATION_PERK_EFFECT: "#flavor 巴力汲取彼方的毁灭本质。#!"
 CONDEMNATION_PERK_EFFECT: "作为 [character_interaction|E]，为目标施加 [GetModifier('POD_condemnation_modifier').GetNameWithTooltip]，持续5年。\n#flavor 巴力对目标施加衰弱诅咒。#!"
 HELL_BORN_INVESTITURE_PERK_EFFECT: "作为 [character_interaction|E]，以灵魂被邪恶侵蚀为代价，解锁 [investiture_lifestyle|E]。\n#flavor 巴力以地狱领主之姿君临。#!"
 THE_RE_EMBRACE_PERK_EFFECT: "作为[character_interaction|E]，将一名吸血鬼囚犯重新初拥至你的[Clan|E]，且不改变其[vampgeneration|E]\n#flavor 当“再初拥”被触发时，尊长扼住准子嗣的喉咙，将其血液注入四个刻有古老恶魔符文的碗中。尊长随后将自己的血液注入另外四个碗，围绕子嗣交替摆放。当子嗣躺在地上，濒临最终死亡时，尊长召唤血系最强大恶魔——纳姆塔鲁的灵魂碎片，将其与子嗣的灵魂融合，腐化其灵魂并使其更接近巴力。#!"
 SPEW_WIDE_THE_PIT_PERK_EFFECT: "死亡时，为你所在的 [duchy|E] 内所有 [counties|E] 施加 [GetModifier('spew_wide_the_pit_modifier').GetNameWithTooltip]，持续100年。\n#flavor 巴力牺牲自己，使一位上古之神得以降临世间。#!"
 full_animal_flight_tooltip: "你解锁完整的飞行术[discipline|E]技能树。"