 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT: "气疗[character_interaction|E]现在给予[GetModifier('renewed_vitality_modifier').GetNameWithTooltip]于目标。\n#F 凤丹大师可以制造出凤凰磐涅的奇迹，消除时间的摧残，恢复凡人的青春活力。#!"
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT: "气疗[character_interaction|E]现在能移除所有疾病。\n#F 有了这秘传之咒，只要上天认为情况足够危急，天宗就能使自己或盟友恢复到全盛状态。#!"
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('shadow_cloud_modifier').GetNameWithTooltip][modifier|E]。\n#F 有了此咒，天气就可以从他的影子里制造出厚厚的幽暗之云，像黑雾一样飘散。#!"
 IRON_BODY_MEDITATION_PERK_EFFECT: "#F 钢体冥思让天宗通过肉体运转阴气，通过冥想一小时来强化身体，使其免受伤害。#!"
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT: "允许在灵游时进入[UmbraGlossaryLocalized('shadowlands','阴界')]。\n#F 有了这法术，天宗可以进入[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
 STILL_THE_FLUTTERING_WING_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 受定风波影响的目标会遭受短暂的麻痹。#!"
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT: "#F 通过启动此咒，仙龙可以影响他的秘隐等级，以保持匿名，成为一个近乎无面的人。#!"
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT: "#F 静心之道允许天宗缓解一个人的恐慌或焦虑（如血狂）。#!"
 EBON_BONDS_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 只要一句话和一个结印，仙人就能从目标的影子中变出像丝绸一样柔软、像钢铁一样结实的神秘黑丝带将其绑住。#!"
 ICE_HAND_STRIKE_PERK_EFFECT: "#F 在此咒的作用下，天宗的双手被一层蓝色的冰冻阴气所笼罩，每一次攻击都会留下令人麻木的寒气。#!"
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 有了此仪轨，仙龙可以深入了解最奇怪的凡人、动物和灵。#!"
 NO_MIND_KATA_PERK_EFFECT: "#F 通过理清思路，让“道”的宁静冲刷他，拥有此咒的天宗可以发挥自己的意志，在选定的领域中完成真正的超人壮举。#!"
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT: "解锁灵界界面的操纵尸幕选项。\n#F 通过此咒，仙龙可以操纵他周围的亡者障壁等级。#!"
 GHOST_WALKING_METHOD_PERK_EFFECT: "#F 当引用此咒时，仙龙会在选定的感官中变得无法被发现。#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT: "#F 有了此咒，天宗可以通过给目标的影子注入气来揭开隐藏的超自然生物的面纱，使其呈现出所有者的真实形态（变化妖怪的半兽形形态，妖仙的本相等等）。#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT: "#F 仙龙可以用气运包裹自己，给那些想伤害他的人带来厄运。#!"
 BLUR_THE_MIND_PERK_EFFECT: "#F 通过调用此咒，仙龙可以使他的受害者忘记最近发生在其附近的事件。#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT: "#F 通过这仪轨，仙龙可以创造出阻止妖魔和其他阎魔走狗进入一个区域的护身符。#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT: "#F 通过此仪轨，仙龙为[sixth_age|E]做好准备。#!"
 WHISPERING_STONES_PERK_EFFECT: "#F 用这仪轨，仙龙可以从[UmbraGlossary('tempest')]中记录死者的记忆，以翻译未知或已灭绝语言的文件。#!"
 DEATH_TOUCH_PERK_EFFECT: "#F 只保留给最可怕的妖魔，传说中的点穴术使龙丹大师能够灾难性地扰乱单个目标的能量流动，只需一触就能使其残废或死亡。#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT: "#F 通过冥想放下所有的恐惧和怀疑，仙龙的内心平静甚至可以平息风暴，或者在风暴过于猛烈时创造一个保护性的 “气泡”。#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地。\n#F 有了这仪轨，仙龙可以将他的内气与附近的龙脉流动相调和，在花半时辰在龙穴内或龙脉边冥想后，于数秒到达另一龙穴。#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT: "获得[GetModifier( 'POD_shapeshift_form_godbody_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 天帝神体让人想起了$pod_wan_xian$在堕落之前的威严，它将施咒者包围在一片银色的光晕中，照亮天宗的道路，给凡人带来了类似于雾迷的精神状态，并迫使受污染的超自然逃离。#!"
