 TRANSCENDING_PO_PERK_EFFECT: "#F 你已经学会了如何不让你天性中黑暗的一面得到更多滋长。通过用阴气来安宁抚慰自己，你可以保持对自己兽性的一面的控制。#!"
 ADVANCED_DEMON_SHINTAI_PERK_EFFECT: "在最终级解锁“重设魔体特征”选项，允许你重选所有特征。\n#F 只有具有相同或更高心法等级才能点同等级的技能。每提升一级获得两格魔体特征槽。#!"
 DIVINE_BINDINGS_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('glowing_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 当被掷向目标时，这些无害的纸片会逆风飞行，甚至可以绕过路径上的障碍物。一旦符箓击中目标，它们就会放射出一种奇异的绿色能量并延伸膨胀缠住鬼神。#!"
 HEAVENLY_FLAMES_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('bursing_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 当这个符箓击中目标鬼神时，它会立即爆发出璀璨夺目的青色火焰，造成恶性伤害。与上一级一样，符箓在飞向目标时会自动绕开障碍物。#!"
 CELESTIAL_FIRES_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('indenfensible_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 与上一级一致，只有一点不同：若没有特殊防御，其伤害无法被吸收。#!"
 HEAVENS_THUNDER_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('explosive_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 这是[GetTrait('shih').GetName( GetPlayer )]最为强大的一种符咒，被投出后几乎无可阻挡。符箓脱离[GetTrait('shih').GetName( GetPlayer )]的手中之后，会大放光明，并以闪电的速度轰击目标。当它们击向鬼神时，会炸裂成一团暴怒的雷球，几乎可以重创任何恶魔。#!"
 STEEL_SKIN_PERK_EFFECT: "#F 你以此能力来提高你的耐力。#!"
 DRAGONS_SPEED_PERK_EFFECT: "#F 你以此能力来提高你的敏捷。#!"
 TIGERS_STRENGTH_PERK_EFFECT: "#F 你以此能力来提高你的力量。#!"
 CELESTIAL_EYES_PERK_EFFECT: "#F 你以此能力来提高你的感知。#!"
 BODY_OF_THE_DRAGON_PERK_EFFECT: "#F 你将你的所有属性提高到超人之境界。#!"
 OPENED_EYES_PERK_EFFECT: "你不会再与化形者作战或[single_combat_duel|E]时遭受[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n#F [GetTrait('shih').GetName( GetPlayer )]可以看清鬼神的本质，[GetTrait('shih').GetName( GetPlayer )]同时也可忽略妄悸的影响。#!"
 DIVINE_PERCEPTIONS_PERK_EFFECT: "#F 这种力量赋予[GetTrait('shih').GetName( GetPlayer )]观察他人精神体的能力。在大多数情况下它就像测谎仪那样运作，但[GetTrait('shih').GetName( GetPlayer )]也可以以此手段观察一个凡人或者其他实体是否被魔附身。#!"
 WIND_TALK_PERK_EFFECT: "解锁[summon_wraith_on_death_interaction|E]。\n解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n最大束缚死灵数量：#P +1#!\n#F 使用此能力的[GetTrait('shih').GetName( GetPlayer )]可以聆听到精神领域居民的声音并与它们沟通。然而这些鬼神并没有义务回应[GetTrait('shih').GetName( GetPlayer )]可能提出的任何问题或要求。#!"
 CELESTIAL_WINDOW_PERK_EFFECT: "解锁[bind_wraith_interaction|E]。\n最大束缚死灵数量：#P +1#!\n#F 运用这种能力，[GetTrait('shih').GetName( GetPlayer )]可以与阴阳两界的某一个居民全方面地产生相互作用。在所有的意义与目的上，目标灵体与[GetTrait('shih').GetName( GetPlayer )]都会存在于同一层面。那个灵体将可以被触摸、伤害、帮助或是参与战斗，就好像[GetTrait('shih').GetName( GetPlayer )]与灵体存在于同一个地方一样。#!"
 CELESTIAL_DOORWAY_PERK_EFFECT: "当你在物质世界中时，也可以与[umbra|E]的存在互动。\n最大束缚死灵数量：#P +3#!\n#F [GetTrait('shih').GetName( GetPlayer )]可以积极地与[spirit_worlds|E]互动；然而这种做法未必明智。虽然这个角色实际上仍处于中原，但他可以认知并影响周遭的阴界和[yang_world|E]。尽管这些地方的居民也知道报偿恩情之类的概念，但它们中的许多都不怎么喜欢[GetTrait('shih').GetName( GetPlayer )]。#!"
 BARRIER_OF_PAIN_PERK_EFFECT: "解锁气疗[character_interaction|E]以允许治疗伤疤。\n#F 在这一等级，[GetTrait('shih').GetName( GetPlayer )]可以强迫自己将痛苦拒之门外。#!"
 THE_CLOSING_WOUND_PERK_EFFECT: "增强气疗[character_interaction|E]以允许治疗伤口。\n#F 在这个等级，[GetTrait('shih').GetName( GetPlayer )]可以治愈伤口。软烂的肌肉会褪去淤伤；伤口会自行愈合留下新疤。#!"
 SPIRITUAL_HEALING_PERK_EFFECT: "增强气疗[character_interaction|E]以允许治疗身体缺陷。\n#F [GetTrait('shih').GetName( GetPlayer )]可以以此能力重组骨骼和神经组织。如果在战斗中使用，这个过程将会是痛苦且极具风险的。骨头必须被正确复位，否则[GetTrait('shih').GetName( GetPlayer )]将面临永久残疾的风险。#!"
 ESCAPE_FROM_DEATH_PERK_EFFECT: "允许你动用意志力免收伤害。\n增强气疗[character_interaction|E]以允许治疗病症和次级生理缺陷。\n#F 使用此能力的[GetTrait('shih').GetName( GetPlayer )]可以恢复燃烧和其他能量伤害。死里逃生虽然极为有用，但代价高昂。#!"
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT: "允许你不因受伤而死。\n增强气疗[character_interaction|E]以允许治疗疾病和生理缺陷。\n#F 使用此能力的角色从细胞层面完全再生自我。这种力量不能让一个角色起死回生，但它可以逆转辐射中毒、癌症、巨创甚至是衰老的影响。#!"
 THOUSAND_FISTS_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中致伤敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]汇聚起他的阳气，在瞬息间打出千百拳。这攻击有着超越凡人的急速，在空中模糊成一片幻影。#!"
 SPEAR_HAND_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]汇聚其阳气并在一只手上点燃这种能量。这种能量在空气中弥漫并熊熊燃烧。#!"
 BURNING_GHOSTS_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]之英杰凝神聚气，以使自己能与任何死灵与灵类对敌。气包裹于他周身，让他的皮肤闪耀着金色的光芒。[GetTrait('shih').GetName( GetPlayer )]的肉身并不能直接击打灵类，但他周身的气却能攻击到它们。#!"
 STEEL_BODY_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]聚集他的阴气淬炼自己的身体以增强他的破坏力。[GetTrait('shih').GetName( GetPlayer )]浑身上下所有的肌肉都紧绷起来，他的皮肤也变得坚韧而富有弹性。#!"
 THOUSAND_SWORDS_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]汇聚全身之气，以行云流水的连环攻击袭向对手。每一击都会给予敌人重创，在碰撞间绽出金铁交击之声。#!"
 FROZEN_RIVER_PERK_EFFECT: "#F [GetTrait('shih').GetName( GetPlayer )]以她的阳气在自己生命源泉上建立壁垒，以防她的气被窃取。#!"
 STOLEN_SERPENT_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]可以截获任何针对于她的远程超自然攻击，然后迅速以其人之道还治其人之身。这是种危险的举动，因为[GetTrait('shih').GetName( GetPlayer )]必须抓住转瞬即逝的时机，截击投向她身体的超自然能量。#!"
 CELESTIAL_BARRIER_PERK_EFFECT: "作为[character_interaction|E]，允许你让对方承受[GetModifier( 'celestial_barrier_modifier' ).GetNameWithTooltip|L]。\n#F 凭借此种力量，[GetTrait('shih').GetName( GetPlayer )]得以暂时阻止鬼神从他处窃取气。#!"
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT: "解锁“窃气”[character_interaction|E]。\n#F [GetTrait('shih').GetName( GetPlayer )]以此能力从鬼神处窃取其气。窃得之气不能还与鬼神，亦不能为[GetTrait('shih').GetName( GetPlayer )]自己所用。这些气将会被武器吸收。#!"
 BITE_OF_THE_MU_PERK_EFFECT: "增强“窃气”[character_interaction|E]。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 施展此术，[GetTrait('shih').GetName( GetPlayer )]不仅能从目标鬼神之处窃取气，更能以这些气攻击鬼神。对[GetTrait('shih').GetName( GetPlayer )]而言，这种体验往往极为畅快，有时甚至会上瘾。这个过程极为危险，因为它会唤起[GetTrait('shih').GetName( GetPlayer )]的心魔。#!"
 EYES_OF_THE_DRAGON_PERK_EFFECT: "#F [GetTrait('shih').GetName( GetPlayer )]迫视着对手，威吓是避免无意义战斗的妙招。#!"
 DARK_REFLECTION_PERK_EFFECT: "#F 此种力量迫视[GetTrait('shih').GetName( GetPlayer )]的敌手意识到他们行动带来的恶果。[GetTrait('shih').GetName( GetPlayer )]往往在对鬼神施以审判时使用此能力。#!"
 HUNTED_EYES_PERK_EFFECT: "#F 此能力同时作用于$pod_hungry_dead$与死灵。凝视对手的眼睛，[GetTrait('shih').GetName( GetPlayer )]迫使目标重新体验它在[UmbraGlossaryLocalized('yomi_wan','幽冥')]之中受到的漫长折磨。#!"
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT: "解锁[command_wraith_interaction|E]。\n最大束缚死灵数量：#P +3#!\n#F [GetTrait('shih').GetName( GetPlayer )]能运用这种力量来指挥一只灵类来完成一个简单的任务。#!"
 DIVINE_ORDINANCE_PERK_EFFECT: "#F [GetTrait('shih').GetName( GetPlayer )]的无边威仪令视界之中的所有对手都惊恐无比。#!"
 BALANCE_OF_THE_SPIRIT_PERK_EFFECT: "解锁驱魔[character_interaction|E]以允许治愈失衡。\n#F [GetTrait('shih').GetName( GetPlayer )]可以察觉魂魄中阴阳的失调，并能以此能力恢复和谐的秩序。#!"
 FOCUS_OF_THE_MIND_PERK_EFFECT: "增强驱魔[character_interaction|E]以允许削减压力。\n#F [GetTrait('shih').GetName( GetPlayer )]消耗绝大的意志力来对抗鬼神。此能力使得他们能重获决心，再次投入到神圣的职责之中。#!"
 NIGHTMARE_EXORCISM_PERK_EFFECT: "增强驱魔[character_interaction|E]以允许抹去负面压力特质。\n#F 为求减轻精神上的痛苦，许多[GetTrait('shih').GetName( GetPlayer )]常常求助于毒品和酒精。但通过这种能力，[GetTrait('shih').GetName( GetPlayer )]得以以一种更直接的方式来消除回忆对情绪的影响，并希望借此来消除记忆带来的精神创伤。#!"
 SELF_EXORCISM_PERK_EFFECT: "增强驱魔[character_interaction|E]以允许抹去负面精神特质。\n#F 就像所有凡人一样，[GetTrait('shih').GetName( GetPlayer )]也面临着被魔附身的风险。而有了这个能力，狩魔人就可以与一只成功钻进她身体的魔展开心灵交锋，并获得逐魔的第二次机会。#!"
 MENTAL_DOMINION_PERK_EFFECT: "增强驱魔[character_interaction|E]以允许抹去全部压力。\n#F 施展此能力的[GetTrait('shih').GetName( GetPlayer )]可以全然恢复其意志力，并真正除灭她的心魔。#!"
 CLOUD_WALKING_PERK_EFFECT: "#F 此能力可以让[GetTrait('shih').GetName( GetPlayer )]悄无声息地移动，即便奔跑也不会留下痕迹。[GetTrait('shih').GetName( GetPlayer )]不会留下任何能表明他曾造访某地的气味。#!"
 WATER_TREADING_PERK_EFFECT: "#F 以此能力，[GetTrait('shih').GetName( GetPlayer )]可以在诸如水或流沙这样的不稳定表面上行走，并能利用几乎任何表面，诸如树上的叶子来攀登拔升。#!"
 WIND_STRIKE_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]利用敌人自身的力量将敌人扔到十万八千里外。#!"
 MOUNTAIN_STANCE_PERK_EFFECT: "#F [GetTrait('shih').GetName( GetPlayer )]吸收攻击的冲击，将力量导入大地。#!"
 IKEHONE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 允许你根据自己的喜好重塑任何生物的骨骼结构。#!"
 SKELETAL_SCULPTING_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 现在你可以隔着目标的血肉直接影响骨骼。#!"
 CORPSE_AWAKENING_PERK_EFFECT: "能够招募[GetMaA('hidden').GetName]、[GetMaA('walker').GetName]、[GetMaA('shambler').GetName]和[GetMaA('skeletons').GetName]作为[men_at_arms|E]。\n#F 你为尸体注入阴气，使其成为不死族和无意识的仆人。#!"
 FORM_OF_INFERNAL_FAVOR_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n获得[GetModifier( 'POD_shapeshift_form_infernal_favor_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 僵尸形态的改良版，更加恐怖，通常拥有触手或尖刺等附属物。#!"
 BODY_OF_THE_MOUSE_PERK_EFFECT: "获得数项变形选项。\n#F 允许你缩骨瘦身，改变你本人的身体质量。#!"
 BODY_OF_THE_SERPENT_PERK_EFFECT: "获得数项变形选项。\n#F 你的身体变得像橡胶一样柔韧，使你能够滑过小孔。#!"
 BLOAT_PERK_EFFECT: "获得数项变形选项。\n#F 通过从环境中吸收大量的阳气，你可以增加你的身体尺寸。#!"
 UNCHAINING_THE_FORM_PERK_EFFECT: "获得数项变形选项。\n#F 你可以转为你想要的任何形状和形式，无需考虑身体质量。#!"
 BLOOD_BLADE_PERK_EFFECT: "作为铸造选项，允许你召唤出武器宝物。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 允许你创造一把由血制成的武器，造成更重的伤害。#!"
 BLOOD_OF_THE_SCORPION_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 允许你用阴血毒素毒害目标。#!"
 CORRUPTION_OF_THE_BLOOD_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 允许你使受害者的血液变得有毒。#!"
 BLOOD_LEECHING_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 允许你将受害者的血液通过毛孔中迸发到你处。#!"
 GOBLIN_SWORD_PERK_EFFECT: "作为铸造选项，允许你召唤出武器宝物。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 允许你在手中化出一把火剑，可以伤害物质与灵体。#!"
 GOBLIN_PORTAL_PERK_EFFECT: "作为[character_interaction|E]，只要地形为沙漠，你就能传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 允许你将火作为传送门，传送到一定半径内的任何其他火焰处。#!"
 GOBLIN_CALL_PERK_EFFECT: "能够招募[GetMaA('fire_elemental').GetName]和[GetMaA('metal_elemental').GetName]作为[men_at_arms|E]。\n#F 允许你从[UmbraGlossaryLocalized('shadowlands','阴界')]或[yang_world|E]召唤火灵来为你服务。#!"
 MANTLE_OF_THE_FLAME_EMPEROR_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手伤害。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 通过一声简短的命令，你可以点燃另一个人的内气而使其从内到外燃烧。#!"
 STONE_FISH_PERK_EFFECT: "#F 你学会了与大地融为一体——正如字面意思。你可以毫不费力地沉入其中，就像一个人走入池水中一样。#!"
 BLADE_OF_STONE_PERK_EFFECT: "作为铸造选项，允许你召唤出武器宝物。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 允许你将石头化为武器——不仅仅是刀剑，而是任何种类的近战武器。#!"
 TASTE_OF_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许你使用意志力获得[true_jade|E]。\n#F 允许你在一块普通的玉石充入气，使其在一段时间内变成一块[true_jade|E]。#!"
 AUGMENT_PERK_EFFECT: "每月自动恢复#V 1#!气。\n#F 允许你调整自己与某一地区的环境之气相适应，改善它，增加它的力量。#!"
 YIN_SHIELD_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('yin_shield_modifier').GetNameWithTooltip][modifier|E]。\n#F 你将你的阴意化为一个围绕你身体的保护罩。#!"
 YIN_NIHILUS_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('yin_nihilus_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 允许你制造致命的阴之灵光，灼伤使用者附近的所有人。#!"
 TOUCH_OF_RUST_PERK_EFFECT: "作为[character_interaction|E]，允许你使目标失去所有金钱。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 你可以使任何种类的金属迅速崩塌。#!"
 IRON_CORPSE_PERK_EFFECT: "获得[GetModifier( 'POD_shapeshift_form_iron_corpse_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 允许你将自己的血肉转化为金属。在这种形态下，你的战斗能力会上升，因为你的手指会变成剃刀般的爪子，但缺点是，你变得无法游泳。#!"
 YANG_SHIELD_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('yang_shield_modifier').GetNameWithTooltip][modifier|E]。\n#F 你将你的阳意形成围绕你身体的发光灵光来保护你。#!"
 YANG_PHOENIX_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('yang_phoenix_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 允许你创造猩红的原始阳气火焰，灼伤使用者附近的所有人。#!"
 TOUCH_OF_CORRUPTION_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('touch_of_corruption_modifier').GetNameWithTooltip][modifier|E]。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 允许你让木头或任何其他有机材料迅速腐烂，并能用于恢复你的气。#!"
 OAKEN_CORPSE_PERK_EFFECT: "获得[GetModifier( 'POD_shapeshift_form_oaken_corpse_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 允许你将自己的血肉转化为木头。在这种形态下，你的战斗能力会上升，因为你的手指变成了致命的尖木桩，并且能漂浮在水中。#!"
 SOOTHING_THE_SOUL_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('soothing_the_soul_modifier').GetNameWithTooltip][modifier|E]。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 通过抹去对象的气脉中的不谐和漩涡，你可以使你的目标在安宁中昏昏欲睡，类似于迷吻的效果。#!"
 ACCENTUATE_CHI_PERK_EFFECT: "若有失衡阴阳特质，作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('accentuate_to_yin_modifier').GetNameWithTooltip]/[GetModifier('accentuate_to_yang_modifier').GetNameWithTooltip][modifier|E]。\n#F 你可以使目标经历情绪和活力的极端波动。阴性能量能使受害者变得无精打采、头脑昏沉和迟钝，而阳性能量则使目标不安和烦躁。#!"
 OPENING_THE_GATES_PERK_EFFECT: "作为[character_interaction|E]，允许你根据对方能量给予对方受伤特质。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 你可以让气从里到外烧毁你的目标。#!"
 ADJUST_THE_TRUE_BALANCE_PERK_EFFECT: "增强“引变阴阳”[character_interaction|E]，直接调整气德修正以及附加修正持续更长。\n作为[knight|E]时，增加[combat_phase|E]中杀死敌方[knights|E]的几率。\n#F 你可以在你的目标体内创造一处永久性的气之不衡。或者，它可以驱散持久的不衡，甚至可以治疗凡人目标体内的癌症等疾病。#!"
 CELESTIAL_NEEDLE_PERK_EFFECT: "作为[character_interaction|E]，允许你移除目标位置的[GetModifier( 'chi_rift_power_modifier' ).GetNameWithTooltip|L]修正。\n#F 你可以在各界之间打开“气开地天”和其他缝隙。#!"
 DRAGON_CHARIOT_PERK_EFFECT: "增强神龙战车[character_interaction|E]，允许你将同位置的盟友军队也一起传送。\n#F 你可以和多个同伴一起在龙脉中穿越。#!"
 CHI_CASTLE_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标位置[GetModifier( 'temporary_dragon_nest_modifier' ).GetNameWithTooltip|L]。\n#F 你可以化出临时的龙穴，但会打破灵性平衡，招致灵类和其他鬼神的愤怒。#!"
 THE_DRAGONS_RAPINE_PERK_EFFECT: "作为[character_interaction|E]，允许你将所有所有敌方军队移到指定位置。\n#F 允许你沿着龙脉掷出对手，能够把他们驱逐到脉流的任何地方去，甚至到固体物体中。#!"
 SHIELD_OF_THE_SOUL_PERK_EFFECT: "免疫敌对心灵[character_interaction|E]。\n#F 保护你的灵魂免受其他超自然的攻击。#!"
 BANKING_THE_FIRE_CALMING_THE_WAVES_PERK_EFFECT: "作为[character_interaction|E]，允许治疗目标的压力以获得虔诚。\n#F 只需轻轻一碰，你就能把你的同胞从灵魂动荡带出来，恢复他们的平衡。#!"
 SOUL_TAINT_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标[GetModifier('soul_taint_modifier').GetNameWithTooltip][modifier|E]，概率让对方失去所有威望。\n#F 你可以在短暂的接触后，让在场的任何人都对你的受术者感到不悦。#!"
 SOUL_EXCHANGE_PERK_EFFECT: "作为[character_interaction|E]，允许你交换两人的信仰和性格特质。\n#F 允许你将任何一个人的灵魂与另一个人的灵魂调换。#!"
 EVOCATION_OF_MADNESS_PERK_EFFECT: "作为[character_interaction|E]，允许你让目标遭受随机三级压力崩溃。\n#F 让受术者在短时间内屈服于他们的心魔本性——也许只是一瞬间，但已足够长来扭曲受害者的思想。#!"
 DEGRADATION_PERK_EFFECT: "种魔[character_interaction|E]现在将使对方失去所有虔诚。\n#F 允许你强迫另一位震旦族裔入魔，同时迫使他们无助地看着他们的心魔暴动。#!"
 STRENGTHENING_THE_DEMON_PERK_EFFECT: "解锁一项操纵心魔选项，允许给予自己[GetModifier('POD_strengthening_the_demon_modifier').GetNameWithTooltip]。\n#F 你简要地培养自己内心的黑暗，以便更好地利用黑暗的力量。#!"
 REAPING_THE_DRAGONS_ROAD_PERK_EFFECT: "采补天地[character_interaction|E]不再提升绝壁等级。\n#F 你可以通过纯粹的意志力从龙脉和龙穴中提取气。#!"
 STEEL_SOUL_PERK_EFFECT: "升级[GetModifier('iron_soul_modifier').GetNameWithTooltip]操纵心神选项，允许给予自己[GetModifier('steel_soul_modifier').GetNameWithTooltip]。\n#F 铁铸之魂的精华版，它允许你达成近乎神奇的壮举。#!"
 ARMOR_OF_ENLIGHTENMENT_PERK_EFFECT: "允许你以获得压力来取代受伤。\n#F 你的智慧和洞察力使你不会从对手那边收到生理伤害。#!"
 HOLDING_THE_GREEN_DEMON_AT_BAY_PERK_EFFECT: "允许你不死于受伤。\n#F 有了这力量，即使你遭受致命的创伤，你也可以迫使你的灵魂留在体内。#!"
 TAMING_THE_FIRE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('taming_the_fire_negative_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('taming_the_fire_positive_modifier').GetNameWithTooltip][modifier|E]。\n作为[character_interaction|E]，允许你让目标万鬼的首都承受[GetModifier( 'POD_frenzy_terrified_populace_modifier' ).GetNameWithTooltip|L]。\n#F 你可以命令一位震旦族裔走火或骇浪。#!"
 CORRUPT_THE_WILL_PERK_EFFECT: "#F 你可以削减对方的临时意志力。#!"
 VOICE_OF_THE_EMPEROR_PERK_EFFECT: "解锁[diligent_development_focus_decision|E]。\n#F 有了这种能力，你可以左右一群凡人的意见和行动——只要他们能听到你的话。那些听你说话的人相信你说的话，并会强烈倾向于按你的命令行事。#!"
 DIVINE_FETTERS_PERK_EFFECT: "[GetScheme('PODsoulbond').GetTypeName][scheme|E]现在初始给予强灵魂枷锁[hook|E]。\n#F 强化你通过天恩浩荡技能下达的指令，使得能包括其他鬼神。#!"
