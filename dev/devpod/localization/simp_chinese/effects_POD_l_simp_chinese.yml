 CELESTIAL_PUNISHMENT_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('warning_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 这些符箓是对鬼神的警告。当它们击中目标时会开始燃烧，这种燃烧不会造成物理性的伤害，但会点燃目标心魔。这些纸制的符箓有如飞刀，在飞向目标时甚至可以抵御狂风。#!"
 DARKLING_MIRROR_PERK_EFFECT: "作为[character_interaction|E]，允许你制造自己的克隆。\n#F 允许你将心魔斩出体外作为你的邪恶仆从。#!"
 CELESTIAL_WIND_PERK_EFFECT: "#F [GetTrait('shih').GetName( GetPlayer )]使用此能力阻滞目标的前进，甚至直接将对手击退。#!"
 HEAVENS_JUDGMENT_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('cut_off_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 通过此窍制作的符箓将能把鬼神的体内的气烧空，将盗来的生命力还给环境，使之活跃起来。#!"
 DIVINE_PROHIBITION_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('burn_out_prayer_modifier').GetNameWithTooltip][modifier|E]。\n#F 此最强大的吾神技艺将目标与外界的气源切割。#!"
