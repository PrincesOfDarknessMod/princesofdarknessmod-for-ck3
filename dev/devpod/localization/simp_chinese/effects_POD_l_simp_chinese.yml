 PERK_INSINUATE_MODIFIER: "[GetPerk('insinuate_perk').GetName(GetPlayer)]：$VALUE|=+0$"
 BOND_FAMULUS_PERK_FLAVOR: "#flavor 只有死亡才能释放受缚的动物伙伴。只要它定期接受吸血鬼的血液，动物伙伴就不会衰老。#!"
 SENSE_THE_BEAST_PERK_FLAVOR: "#flavor 吸血鬼可以感觉到存在于凡人、吸血鬼和其他超自然内的[beast|E]，获得对他们的本性、饥渴和敌意的察觉。#!"
 FERAL_WHISPERS_PERK_FLAVOR: "#flavor 吸血鬼可以与野外和城市中的野兽交流。野性的私语允许他们与动物进行双向交流。一只猫可能对辩论教堂经文的优劣不感兴趣，但却很乐意讨论当地大教堂四周缺乏猎物的问题。#!"
 ANIMAL_SUCCULENCE_PERK_FLAVOR: "#flavor 吸血鬼普遍认为动物的血缺乏营养。它的味道令人厌恶，而且很难滋养他们那不死的血管。然而，一些年长的兽性术修行者已经对野兽的血液有了足够的亲和力，他们可以有效地从野外维持自己的生命。#!"
 QUELL_THE_BEAST_PERK_FLAVOR: "#flavor 通过与目标对视，吸血鬼会让他们内心的[beast|E]进入暂时地沉睡状态。受影响的凡人因此变得麻木不仁，无法采取任何行动，只想活下去，而吸血鬼的兽性冲动则暂时减弱，无论好坏。#!"
 CALL_OF_THE_WILD_PERK_EFFECT: "解锁招募[GetMaA('POD_controlled_animals').GetName]作为[men_at_arms|E]的能力。你最多只能拥有一军团，且它们开始时很弱小，规模取决于你拥有的任何革新。"
 CALL_OF_THE_WILD_PERK_FLAVOR: "#flavor 通过这能力，[beast|E]给吸血鬼的声音灌输了一种对特定动物的深刻亲和力。她嚎叫、嘶吼、鸣叫，或以其他方式模仿该动物的声音。所有听到的所选动物物种受到去到吸血鬼身边的呼唤，取决于吸血鬼的基础能力来决定有多少会来。#!"
 SUBSUME_THE_SPIRIT_PERK_FLAVOR: "#flavor 吸血鬼可以将自己的思想完全转移到动物的身体中。他们可以控制动物并自由使用其感官，甚至在白天也能设法保持清醒。#!"
 UNLIVING_HIVE_PERK_FLAVOR: "#flavor 这种令人不安的能力最常见于诺斯费拉图，它允许使用者将他们的动物效应扩展到成群的昆虫，如苍蝇或蟑螂。#!"
 DRAWING_OUT_THE_BEAST_PERK_FLAVOR: "#flavor 吸血鬼可以在惊骇或暴走的时刻投射他们的[beast|E]，将其转移到附近的对象身上，无论是凡人还是吸血鬼。这个人将立即体验到血狂的感觉，根据触发的情况进行无情的横冲直撞或惊恐地逃窜。#!"
 ANIMAL_DOMINION_PERK_FLAVOR: "作为[character_interaction|E]，允许你呼唤宠物参战。\n能够招募数种动物作为[men_at_arms|E]。\n#flavor 吸血鬼对野兽拥有的力量现在已经大到足以指挥成群结队的动物，就好像它们是自己身体的延伸。只要一个手势，成千上百的动物们就会舍弃自己的生命来讨好它们的主人。#!"
 TONGUE_OF_BEASTS_PERK_FLAVOR: "#flavor 这能力加强了荒野低语天赋。吸血鬼不再能与单一的动物说话，而是可以与任何和所有的动物说话，且不需要建立目光接触。#!"
 SEND_THE_EIGHTH_PLAGUE_PERK_EFFECT: "作为[character_interaction|E]，允许你释放[GetModifier('weather_magic_plague_modifier').GetNameWithTooltip]到敌人的国度。"
 SEND_THE_EIGHTH_PLAGUE_PERK_FLAVOR: "#flavor 这是所有$pod_disciplines$中最具破坏性的力量之一。第四次十字军东征后不久，一位名叫瓦伦提尼安的古代冈格罗展示了其巨大的破坏潜力。他对闯入他土地的意大利该隐之子感到愤怒，于是调用了他掌握的兽性术，使整个贸易镇陷入了饥荒之中。#!"
 CRIMSON_FURY_PERK_EFFECT: "使得试图吞噬你灵魂的吸榨者更有可能承受[unconquered_soul|E]事件。"
 CRIMSON_FURY_PERK_FLAVOR: "#flavor 这能力是许多谣言和猜测的话题，因为它的效果非常不明显。在达到这种掌握程度后，吸血鬼可以选择让他的[beast|E]在他的血管中自由游荡。他的血会使品尝它的凡人和吸血鬼感到血狂。如果一位吸榨者成功地吞噬了该吸血鬼的灵魂，她很可能会遇到一个可怕的结局，因为吸血鬼的心兽会从内部把她吃掉。#!"
 EYES_OF_THE_FOREST_PERK_FLAVOR: "#flavor 这令人敬畏的力量是许多关于幽暗的森林和禁忌的山脉的民间故事的根源。该地区的动物甚至昆虫都是吸血鬼的眼睛和耳朵，为她提供了对其领域内夜间活动的深入了解。#!"
 PLAGUE_OF_BEASTS_PERK_FLAVOR: "#flavor 一个精通兽性术的玛土撒拉带来圣经中的瘟疫。在 野性的呼唤的基础上扩展，吸血鬼召唤动物到她们身边。然而，召唤的过程并不是通过某种动物的舌头，而是由[beast|E]在数英里或数公里范围内呼叫。这将召唤每一种动物涌向该隐之子周围，导致彻底的悖廊。#!"
 INSIGHT_PERK_FLAVOR: "#flavor 死者在我们中间行走，看不见也听不到。要指挥这些生物，亡灵术师必须能够感知他们。#!"
 SUMMON_SOUL_PERK_FLAVOR: "#flavor 召唤灵魂能让亡灵术师从[UmbraGlossaryLocalized('shadowlands','冥界')]召唤一个幽灵回来。#!"
 COMPEL_SOUL_PERK_FLAVOR: "#flavor 使用这种能力，吸血鬼可以在短时间内使幽灵屈服于她的意志。这种能力需要极高的信心，因为决心的失败会对亡灵术师带来灾难。#!"
 HAUNTING_PERK_EFFECT: "你更善于在缚灵[character_interaction|E]中束缚[GetTrait('wraith').GetName( GetNullCharacter )]。"
 HAUNTING_PERK_FLAVOR: "#flavor 一名亡灵术师使用她血液的力量将鬼魂束缚在一个物体或位置上。#!"
 TORMENT_PERK_FLAVOR: "#flavor 通过使用镇魂曲，亡灵术师可以攻击鬼魂的无形身体，就像他本人是鬼魂一样。#!"
 SEAL_OF_ABAMIXTRA_PERK_FLAVOR: "#flavor 通过唤起阿巴米克斯特拉之印，亡灵术师可以复活一具或一组尸体来完成简单的任务。#!"
 AWAKEN_THE_HOMONCULAR_SERVANT_PERK_FLAVOR: "#flavor 有了这能力，亡灵术师可以从一具尸体上取下一小块，并将其变成一种怪异的使魔。#!"
 SHAMBLING_HORDES_PERK_FLAVOR: "#flavor 通过这能力，亡灵术师可以创造出一群行尸走肉来攻击她的敌人。#!"
 SOUL_STEALING_PERK_FLAVOR: "#flavor 只需一句话和一个有力的手势，亡灵术师就能将凡人的灵魂从其躯体中驱除。#!"
 NECROMANCY_POSSESSION_PERK_FLAVOR: "#flavor 恶邪附身能让亡灵术师将灵魂注入刚死去的身体。#!"
 SHROUDSIGHT_PERK_EFFECT: "解锁捕捉死灵[character_interaction|E]"
 SHROUDSIGHT_PERK_FLAVOR: "#flavor 尸幕视线使吸血鬼能够直接凝视[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
 LIFELESS_TONGUES_PERK_FLAVOR: "#flavor 当使用[dark_kingdoms|E]之舌时，亡灵术师可以与[UmbraGlossaryLocalized('shadowlands','冥界')]的幽灵交谈。#!"
 TOUCH_THE_NETHER_PERK_EFFECT: "当你在物质世界中时，也可以与[umbra|E]的存在互动。"
 TOUCH_THE_NETHER_PERK_FLAVOR: "#flavor 当使用下界之触时，亡灵术师可以存在于尸幕的两边；她在[UmbraGlossaryLocalized('shadowlands','冥界')]显现身体，同时在活人的土地上保持肉体。#!"
 EX_NIHILO_PERK_FLAVOR: "#flavor 虚无缥缈允许亡灵术师实际进入[UmbraGlossaryLocalized('shadowlands','冥界')]。在[UmbraGlossaryLocalized('shadowlands','冥界')]时，她会显现为一个特别凝固的幽灵。#!"
 SHROUD_MASTERY_PERK_FLAVOR: "#flavor 有了这个能力，亡灵术师可以极大地帮助或阻碍幽灵在活人世界的活动。#!"
 NECROMANCY_ASHES_TO_ASHES_PERK_EFFECT: "减少$pod_masquerade_exposure_with_icon$暴露风险和增强掩盖潜藏[character_interaction|E]。"
 NECROMANCY_ASHES_TO_ASHES_PERK_FLAVOR: "#flavor 虽然有些该隐之子喜爱滥杀且不担心会带来任何后果，但其他该隐之子觉得此行为应该要更谨慎一些。使用这种能力可以将人的尸体变成一堆不起眼的灰烬，大约是原来尸体重量的五分之一。#!"
 RIGOR_MORTIS_PERK_FLAVOR: "#flavor 有了这个能力，亡灵术师可以让任何目标像尸体一样僵硬和静止。#!"
 ASHEN_LADYS_EMBRACE_PERK_EFFECT: "解锁灰烬亡女之拥[single_combat_duel|E]招式"
 ASHEN_LADYS_EMBRACE_PERK_FLAVOR: "#flavor 灰烬亡女之拥能使目标的肢体老化、干枯，并像忘在葡萄树上的葡萄一样枯萎。#!"
 GIFT_OF_MELANCHOLIA_PERK_EFFECT: "解锁在目标所在地释放瘟疫的[character_interaction|E]"
 GIFT_OF_MELANCHOLIA_PERK_FLAVOR: "#flavor 这种力量都会对凡人和该隐之子造成一种剧烈的消耗性疾病。#!"
 NECROMANCY_DUST_TO_DUST_PERK_EFFECT: "将灰烬亡女之拥升级为土归于土"
 NECROMANCY_DUST_TO_DUST_PERK_FLAVOR: "#flavor 就像尘归于尘影响尸体一样，土归于土也影响吸血鬼的身体。援引土归于土可以让亡灵术师将另一个吸血鬼变成一堆灰烬，就像他在阳光下驻留或在火刑柱上被烧死一样。#!"
 MORTUUS_IN_VULTUS_PERK_FLAVOR: "#flavor 该隐之子可以使自己看起来好像是一具早已死去的尸体。#!"
 ALGOR_MORTIS_PERK_FLAVOR: "#flavor 通过尸冷，吸血鬼能够将自己变成冷静、忧郁的生物，不为凡人的痛苦或情感操纵所动。#!"
 INTIMATIONS_OF_MORTALITY_PERK_EFFECT: "作为[character_interaction|E]，你可以增加吸血鬼对压力值的易感性，同时也可以防止他们使用血涌来提高他们的属性。"
 INTIMATIONS_OF_MORTALITY_PERK_FLAVOR: "#flavor 短生的暗示能将短生种的令人不快和恼怒的一面加诸于吸血鬼身上。#!"
 BENEDICTIO_MORTEM_PERK_FLAVOR: "#flavor 有了这种能力，亡灵术师就会完全变成一具尸体的样子，并且能够洗去他处于吸血鬼形态时的弱点。#!"
 BENEDICTIO_VITAE_PERK_FLAVOR: "#flavor 有了赞美精血，该隐之子将能够享受凡人生活的许多美好方面而不放弃她的吸血鬼本性的力量。#!"
 CALVARIA_EMISSIUS_PERK_FLAVOR: "#flavor 卡帕多西亚氏族最珍贵的秘密之一是通过死者的眼窝进行监视的能力。#!"
 CONSILIUM_MORTUUS_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 CONSILIUM_MORTUUS_PERK_FLAVOR: "#flavor 通过与已死目标的头颅对话，发现从腐烂的嘴唇中撬出一个有保证的真相是很有可能的。#!"
 AMMORSUS_VICARIUS_PERK_FLAVOR: "#flavor 使用这能力，亡灵术师可以抓着头骨的下颌骨和上颌骨作为一种奇异的近身武器，将头骨贴在矛尖上进行远距离攻击，甚至可以不动头骨，让作为一个陷阱。#!"
 EXEDO_ANIMUS_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 EXEDO_ANIMUS_PERK_FLAVOR: "#flavor 通过携带一个头骨——无论是来自凡人还是该隐之子——亡灵术师与头骨的前主人形成了一种共感联系。#!"
 DEGULO_PERK_EFFECT: "作为[character_interaction|E]，此效果允许你给自己添加[GetModifier('degulo_modifier').GetNameWithTooltip]修正。当此修正激活时，处决的囚犯将通过后续事件使其头骨被烹煮。随后，你可以通过再次对自己进行角色互动，将通过此能力获得的烹煮头骨的基本属性或[discipline|E]与另一名角色进行交换。"
 DEGULO_PERK_FLAVOR: "#flavor 吞没是亡灵术师吞噬灵魂碎片并将其作为自己的一部分永远保留的方法。#!"
 WHISPERS_OF_THE_SOUL_PERK_FLAVOR: "#flavor 仅仅是听到对黑暗之母的真名的低语，就足以让凡人发疯，并让该隐之子的心充满恐惧。#!"
 KISS_OF_THE_DARK_MOTHER_PERK_EFFECT: "撕咬[single_combat_duel|E]招式变得更加强大。"
 KISS_OF_THE_DARK_MOTHER_PERK_FLAVOR: "#flavor 莉莉丝派咬住她的舌头，用黑色胆汁和精血的恶臭混合体填满她的嘴。她的咬合变得更加可怕，可以轻松地吞噬受害者的生命。#!"
 DARK_HUMOURS_PERK_FLAVOR: "#flavor 拉米亚以其运动能力和对身体的掌控能力而闻名。他们不仅能够完成令人难以置信的体能壮举，而且还能通过纯粹的意志力操纵体内的体液平衡。#!"
 CAUL_OF_THE_NEVERBORN_PERK_EFFECT: "解锁捕捉死灵[character_interaction|E]"
 CAUL_OF_THE_NEVERBORN_PERK_FLAVOR: "#flavor 随着这力量的使用，拉米亚加强了她与黑暗之母的黑色心脏的联系。赋予她更强的复原力和看到[UmbraGlossary('shadowlands')]的能力。#!"
 LAMENT_OF_DHAINU_PERK_FLAVOR: "#flavor 拉米亚痛苦地嚎叫，大地颤抖。一股蠕动着的黑暗瘴气从地面升起，将她的敌人困住。那些被黑暗抓住的人不会受到身体上的束缚，但会立即被情感上的痛苦所困扰，以至于他们试图以最便捷的方式结束自己的生命。#!"
 TEND_THE_BODY_GARDEN_PERK_EFFECT: "减少$pod_masquerade_exposure_with_icon$暴露风险和增强掩盖潜藏[character_interaction|E]。"
 TEND_THE_BODY_GARDEN_PERK_FLAVOR: "#flavor 拥有这能力的亡灵术师可以加速或减缓腐烂的过程，在几秒钟内将死去的凡人变成苍蝇的臃肿宿主，或者使终焉之死的腐败失效。#!"
 WITCHS_FRUIT_PERK_EFFECT: "解锁允许用注入亡灵术的果实毒害凡人的[character_interaction|E]。"
 WITCHS_FRUIT_PERK_FLAVOR: "#flavor 每样植物都依靠死亡来生长。腐烂之物丰富了土壤，而树木、藤蔓和草在吸收重要的营养物质的同时，也吸收了坏死回声。一个亡灵术师可以通过将它们的果实暴露在她的血液中来唤醒这种死亡灵光。#!"
 RAISE_THE_GREEN_ONE_PERK_EFFECT: "解锁唤起绿尸[character_interaction|E]。"
 RAISE_THE_GREEN_ONE_PERK_FLAVOR: "#flavor 夜影亡灵术师可以唤起一具被植物物质束缚并强化的尸体。覆盖在它皮肤上的叶子和强壮的藤蔓补充了它腐烂的筋肉。活外壳赋予它速度和自我保护的本能，这在其他活死人身上是看不到的。#!"
 WAILS_AND_WHISPERS_PERK_EFFECT: "解锁让目标更难抵御谋杀计谋的[character_interaction|E]。"
 WAILS_AND_WHISPERS_PERK_FLAVOR: "#flavor 随着亡灵术师的理解加深，她探索了生与死之间摇摆不定的屏障。当她像报丧女妖一样尖叫时，她可以引诱一个灵魂走向灭亡，增加承受严重伤害的概率。#!"
 CTHONIC_WOMB_PERK_EFFECT: "吸干凡人时能将其唤为[GetTrait('wraith').GetName( GetNullCharacter )]"
 CTHONIC_WOMB_PERK_FLAVOR: "#flavor 作为此道途的顶点，一个亡灵术师将杀戮和生育结合起来，生下了她所杀的凡人的鬼魂。#!"
 EYES_OF_THE_WRAITH_PERK_FLAVOR: "#flavor 通过调用这力量，亡灵术师可以像不眠死者那样看待世界。#!"
 AURA_OF_DECAY_PERK_FLAVOR: "#flavor 这能力会加速任何陷入亡灵术师可怕灵光中的无生命物体的不可避免的命运，使吸血鬼能够使任何物体腐烂成一堆废墟。#!"
 SOUL_FEASTING_PERK_FLAVOR: "#flavor 毕舍遮之宴允许吸血鬼可以靠弥漫在世界各处的熵来生存，或者直接以鬼魂的[Corpus|E]为食。#!"
 CURSE_OF_THE_MAELSTROM_PERK_EFFECT: "解锁死涡诅咒[character_interaction|E]，允许给他人的首都施加负面修正。"
 CURSE_OF_THE_MAELSTROM_PERK_FLAVOR: "#flavor 亡灵术师可以诅咒她周围的环境，召唤出怨灵来造成混乱和破坏。#!"
 NIGHTCRY_PERK_FLAVOR: "#flavor 通过使用夜泣，亡灵术师能够展示她对熵的力量的掌握。她可以引导它离开她的盟友以帮助他们，或者她可以将它直接导入她的敌人并阻碍他们。#!"
 SONG_OF_THE_DEAD_PERK_EFFECT: "解锁给敌人施加压力值的[character_interaction|E]"
 SONG_OF_THE_DEAD_PERK_FLAVOR: "#flavor 吸血鬼吟唱着，将未曾听过的话语编入歌曲，向听众灌输对死亡的不健康的迷恋。#!"
 SUMMON_WISP_PERK_FLAVOR: "#flavor 吸血鬼用[UmbraGlossaryLocalized('shadowlands','冥界')]的游灵能量注入他的血，召唤出一个闪烁的光球。这缕光可能会引诱毫无戒心的凡人进入陷阱或制造巧妙的分心。#!"
 HARROWING_PERK_EFFECT: "增强死者之歌[character_interaction|E]"
 HARROWING_PERK_FLAVOR: "#flavor 哀歌通过睡梦作祟扩大了死者之歌的恐怖，将梦境变成了死亡噩梦。#!"
 PHANTASMS_PERK_FLAVOR: "#flavor 吸血鬼将[UmbraGlossaryLocalized('shadowlands','冥界')]的能量雕塑成精心制作的幻觉，使活人感到恐惧。#!"
 SPECTRAL_MENACING_PERK_EFFECT: "最大束缚死灵数量：#P +3#!"
 SPECTRAL_MENACING_PERK_FLAVOR: "#flavor 吸血鬼撕开了他的受害者周围的生命和[UmbraGlossaryLocalized('shadowlands','冥界')]之间的尸幕，召唤恶灵来纠缠她。#!"
 TOUCH_OF_DEATH_PERK_EFFECT: "没做"
 TOUCH_OF_DEATH_PERK_FLAVOR: "#flavor 亡灵术师对幽灵经过或触摸后留下的残余能量有感应，使她能够确定一个物体、人或区域是否被幽灵触摸或影响过。#!"
 REVEAL_THE_CATENE_PERK_EFFECT: "没做"
 REVEAL_THE_CATENE_PERK_FLAVOR: "#flavor 亡灵术师能识别死者在物体上留下的灰烬印记，使她能区分鬼魂的玩物和$pod_Fetters$。#!"
 TREAD_UPON_THE_GRAVE_PERK_EFFECT: "没做"
 TREAD_UPON_THE_GRAVE_PERK_FLAVOR: "#flavor 当亡灵术师接近亡者世界时，她会有所感觉。一个亡灵术师可能会使用她的自然感知力，而另一个可能会进行探查，但两者都能感觉到[UmbraGlossaryLocalized('shadowlands','冥界')]与活人世界的接触。#!"
 DEATH_KNELL_PERK_EFFECT: "没做"
 DEATH_KNELL_PERK_FLAVOR: "#flavor 亡灵术师在接近死者世界的时候会有感觉。一个亡灵术师可能会使用她的自然感知，而另一个则可能是探查，但两者都能感觉到[UmbraGlossaryLocalized('shadowlands','冥界')]与活人世界的接触。#!"
 EPHEMERAL_BINDING_PERK_EFFECT: "没做"
 EPHEMERAL_BINDING_PERK_FLAVOR: "#flavor 通过给一个物、人或地注入她自己的灰烬能量，亡灵术师可以制造一个人造$pod_Fetters$，而不是依靠偶然形成。#!"
 SENSE_THE_SIN_PERK_EFFECT: "深入一个人的心灵，将其罪恶增强到自我毁灭的程度"
 TORMENTED_ESSENCE_PERK_EFFECT: "在决斗中向你的敌人投射地狱能量"
 BLOOD_OF_A_DEMON_PERK_EFFECT: "获得一系列关于崇魔者的能力——指命较低级的崇魔者，唤其来宫廷，或者将自身投入黑暗信仰。"
 AS_BELOW_SO_ABOVE_PERK_EFFECT: "用魔鬼般的阴险来加强你的社交性$pod_disciplines$，提高你的魅惑或认知扭曲计谋成功几率。"
 PSYCHOMACHIA_PERK_EFFECT: "通过从受术者的心灵变出一个暗影实体，来迫使其与其被增强的罪恶战斗。"
 POISONED_VIRTUE_PERK_EFFECT: "有了此力量，你甚至可以将美德也增强到有害的程度。"
 KNEEL_BEFORE_MY_THRONE_PERK_EFFECT: "学习将其他吸血鬼变成崇魔者的技能。获得赋予自己黑暗赠礼的力量。"
 FACE_HELL_PERK_EFFECT: "通过塑造显象的强度来影响灵魂之战的结果。"
 ADRAMELECHS_WRATH_PERK_EFFECT: "由地狱之火和黑色闪电组成的强大爆炸，可以消灭任何敌人。但要小心，因为爆炸可能也会夺走你的生命。"
 LURE_DIABOLIK_PERK_EFFECT: "强化通过引诱崇魔者决议会加入你的宫廷的崇魔者。"
 HELL_LORD_PERK_EFFECT: "增强你命令崇魔者的能力。"
 INVESTURE_PERK_EFFECT: "给任意崇魔者赐予黑暗赠礼。"
 A_JOB_DONE_RIGHT_PERK_BONUS_EFFECT: "解锁[buy_artifact_claim_interaction|E]"
 NEEDS_HOMIDBORN_TEXT: "@warning_icon!#X 须知你得有[GetTrait('homid_born').GetName( GetPlayer )][traits|E]才能点此树上的技能 #!"
 APECRAFTSBLESSINGS_PERK_STATS_EFFECT: "即使没有古物研究官，你也可以委托制作宝物。"
 DIVIDE_PERK_STATS_EFFECT: "你解锁了针对外地统治者的“分化”[character_interaction|E]。这能削减封臣对领主的好感。"
 RESHAPE_OBJECTS_PERK_STATS_EFFECT: "赞助灵感或委托制作宝物现在花费更少。"
 WYLD_FEROCITY_PERK_STATS_EFFECT: "你将能在劫掠成功后将该伯爵领的发展度降低。"
 TERROR_DIREWOLF_PERK_STATS_EFFECT: "增强奇原肆虐的效果，减少被劫掠伯爵领的更多发展度。"
 NEEDS_LUPUSBORN_TEXT: "@warning_icon!#X 须知你得有[GetTrait('beast_born').GetName( GetPlayer )][traits|E]才能点此树上的技能 #!"
