 CROSSING_THE_IRON_BRIDGE_PERK_EFFECT: "解锁一个独特的3级[mental_break|E]事件（具有6年冷却时间）\n#F 现在你可以通过进入裂隙来直面心魔。只能携带个人物品。\n这并非愉快体验，但或许能让你暂时逃离吸血鬼生活中无休止的阴谋与背叛。#!"
 JOURNEYING_THE_IRON_BRIDGE_PERK_EFFECT: "#F 物品不再需要情感依附即可带入裂隙。#!"
 PASSING_THE_INNER_REALM_PERK_EFFECT: "作为[character_interaction|E]，获得或失去[GetModifier('passing_the_inner_realm_modifier').GetNameWithTooltip]\n#F 你可以完全消失于裂隙，并瞬移至视线所及的新位置。虽然能无视障碍，但并非即时生效，你需要在裂隙中跨越与现实等同的距离。\n战斗中运用裂隙极为有效，能躲避绝大多数人无法规避的攻击，不过频繁用于战斗会对精神造成沉重负担。#!"
 RIFT_COLLECTION_PERK_EFFECT: "购买宝物宣称时可享受#V 15%#!折扣。\n#F 现在仅需触碰即可将无生命物体送入裂隙，或随时召回。#!"
 RIFT_TRANSPORT_PERK_EFFECT: "#F 可通过触碰将物体传送至视线范围内的任意位置（距离取决于使用者的裂隙能力）#!"
 EYES_OF_A_THIEF_PERK_EFFECT: "窃宝[infiltration_missions|E]的[planning_speed|E]提升80%。\n#F 兼具收集与运输特性，且现在无需触碰物品即可将其送入裂隙，仅需目视即可。#!"
 DOORWAY_TO_HELL_PERK_EFFECT: "作为[character_interaction|E]，在旅行或领军时瞬间返回首都。\n#F 与其他裂隙用法不同，此能力可设立永久裂隙锚点进行临时连接，允许任何单位通过。\n这类似于你噩梦裂隙的回响，能实现近乎即时的群体传送，但无法永久维持。传送门不可逆向通行，且同一时间仅能激活一扇。\n除你之外的所有穿越者都将承受[GetPerk('glimpse_of_the_pain_perk').GetName(GetPlayer)]的同等效果。#!"
 TOUCH_OF_SIN_PERK_EFFECT: "解锁[GetScheme('abduct').GetTypeName][scheme|E]\n#F 现在可以通过抓取将个体强行拖入常规裂隙#!"
 RIFT_GATEWAY_PERK_EFFECT: "将特质[GetPerk('passing_the_inner_realm_perk').GetName(GetPlayer)]升级为[GetModifier('rift_gateway_modifier').GetNameWithTooltip]\n#F 裂隙通道使你能像[GetPerk('passing_the_inner_realm_perk').GetName(GetPlayer)]那样通过接触将个体送入裂隙。\n但需警惕凝视夜空、烈火等危险景象的裂隙使用者，你可能会瞬间从高空坠落或遭烈焰焚身。#!"
 RIFT_IMPRISON_PERK_EFFECT: "囚犯几乎不可能逃脱。当角色抵抗监禁时解锁新选项。\n#F 现在你可以将人永久囚禁在裂隙中，无论是常规手段还是超自然力量都难以挣脱。\n唯有最幸运者才可能找到有效传送门逃脱。#!"
