 EYES_OF_THE_ABYSS_PERK_EFFECT: "作为[shapeshift|E]选项，获得[GetModifier('POD_shapeshift_form_abysseyes_modifier').GetNameWithTooltip]。\n#F 吸血鬼双眼变为黑色。其能无视所有黑暗带来的惩罚，包括超自然黑暗造成的视觉阻碍，并能看见幽灵。#!"
 SHADOW_PLAY_PERK_EFFECT: "#F 虽然这种能力不允许人物创造无源的影子，但它允许一个人操纵、移动和使环境中的影子活动起来。这可以赋予社会效果，比如利用影子使自己更有气势，或者根据自己的需要塑造一个环境，创造暗影区域来隐藏一个人或物体。#!"
 NOCTURNE_PERK_EFFECT: "作为一位[character_interaction|E]，切换[GetModifier('nocturne_power_modifier').GetNameWithTooltip]。\n当其处于激活状态时，若在[combat_phase|E]担任[commander|E]，可对敌方[knights|E]施加[GetModifier('nocturne_drained_stamina_modifier').GetNameWithTooltip]；若在[single_combat_duel_plural|E]中，则直接对你的敌人施加该效果。\n每影响一名敌人，需消耗#N 10#![piety_i]。\n#F 通过凝聚心神召唤黑暗，掌握此能力的勒森魃可召来滚滚翻涌的超自然黑雾，笼罩整片区域，遮蔽所有光源。这黑暗乃是深渊的具象化，能吞噬声与光，并在无声无息中扼杀弱者的生命。#!"
 NIGHT_SHADES_PERK_EFFECT: "允许招募[GetMaA('shades').GetName][men_at_arms|E]。"
 ARMS_OF_AHRIMAN_PERK_EFFECT: "#F 有了这个能力，勒森魃将能黑暗塑造成触手，可以攻击、限制和抓取敌人。#!"
 TENEBROUS_AVATAR_PERK_EFFECT: "作为[shapeshift|E]选项，变身为[GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip]。\n#F 血族对黑暗的掌控已臻至化境，乃至其躯体能与之融为一体。当此能力启动时，血族将化为一团浓墨般的不定形暗影。#!"
 THE_DARKNESS_WITHIN_PERK_EFFECT: "将[GetPerk('nocturne_perk').GetName(GetPlayer)]的修正提升为[GetModifier('darkness_within_drained_stamina_modifier').GetNameWithTooltip]。\n此外，你还会从受影响的目标身上汲取#V 1#!$POD_energy_blood$。\n每影响一名敌人，消耗 #N 15#![piety_i]。"
 OUBLIETTE_PERK_EFFECT: "解锁[GetScheme('abduct').GetTypeName][scheme|E]"
 WALK_THE_ABYSS_PERK_EFFECT: "#F 通过穿越深渊，还能力允许角色进入一片黑暗中，并从视线范围内的第二片黑暗中走出来。角色也可以使用这个能力，将他们的手伸入影子中，在第二片影子的范围内抓住某个东西。#!"
 DRAIN_THE_LIFE_PERK_EFFECT: "作为[character_interaction|E]，对目标首都施加[GetModifier('drain_the_life_power_modifier').GetNameWithTooltip]。\n#F 血族手腕一翻，向世界展露深渊，在空中制造出一个可怕的球形虚空。当它闭合时，友军和敌人皆受创伤，甚或灰飞烟灭。那些被杀死（或濒死）的存在被卷入虚无。他们的一切痕迹就此荡然无存。#!"
 DARK_WHISPERS_PERK_EFFECT: "#F 有了这种能力，角色可以用近距离的影子来投射其的感情。#!"
 GOD_IN_DARKNESS_PERK_EFFECT: "将[GetPerk('tenebrous_avatar_perk').GetName(GetPlayer)]的效果提升为[GetModifier('POD_shapeshift_form_shadow_god_in_darkness_modifier').GetNameWithTooltip]。"
 DARKSIGHT_PERK_EFFECT: "将[GetPerk('eyes_of_the_abyss_perk').GetName(GetPlayer)]的效果提升为[GetModifier('POD_shapeshift_form_darksight_modifier').GetNameWithTooltip]。"
 SHADOWSTEP_PERK_EFFECT: "#F 吸血鬼消失在影中，滑过[UmbraGlossary('pod_realm_labyrinth')]，在穿越了比死亡更肮脏和比饥渴还饥渴的东西之后重新出现。他们踏入一片足以覆盖他们的暗影，并从一个他们可以看到的暗影中重新出现。#!"
 SHADOW_TWIN_PERK_EFFECT: "作为[character_interaction|E]，允许你制造自己的黯影克隆体。\n#F 血族对黑暗的掌控已达到如此的境地，甚至能赋予黑暗有限的意识。通过活化自己的影子，$pod_cainite$可真正地“解放“光线投射下的阴影。在此能力生效期间，本体将不再投下阴影——因为其影子已脱离躯体，去执行血族的指令。#!"
 AEGIS_OF_SHADOWS_PERK_EFFECT: "#F 将你自身防护在一个强力的暗影盔甲中。#!"
 DEVOUR_ALL_HOPE_PERK_EFFECT: "将[GetPerk('nocturne_perk').GetName(GetPlayer)]的修正提升为[GetModifier('devour_all_hope_drained_stamina_modifier').GetNameWithTooltip]。\n此外，你还会从受影响的目标身上汲取#V 1#!$POD_energy_blood$。\n每影响一名敌人，消耗 #N 25#![piety_i]。"
 AHRIMANS_DEMESNE_PERK_EFFECT: "增强[GetPerk('drain_the_life_perk').GetName(GetPlayer)]能力。现在能减益整个领地，无论大小。"
