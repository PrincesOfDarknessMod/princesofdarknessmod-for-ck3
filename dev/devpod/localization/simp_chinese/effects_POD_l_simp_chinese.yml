 masquerade_exposure_increase_effect.tt: "$pod_masquerade_exposure_with_icon$将#N 增加#!。"
 masquerade_exposure_decrease_effect.tt: "$pod_masquerade_exposure_with_icon$将#P 减少#!。"
 hunger_increase_effect.tt: "$pod_hunger_with_icon$将#N 增加#!。"
