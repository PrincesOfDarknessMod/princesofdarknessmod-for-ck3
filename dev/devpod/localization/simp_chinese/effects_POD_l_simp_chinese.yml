 NAME_OF_SEKHEM_PERK_EFFECT: "解锁吸取塞赫[character_interaction|E]，允许吸取目标能量来恢复塞赫。\n#F 阿蒙提可以指挥塞赫，把它引向自己以补充自己，或把它引向盟友。#!"
 NAME_OF_SKILL_PERK_EFFECT: "#F 阿蒙提可以通过对该领域的真名的了解来学习或提高一项技能。#!"
 RIDDLE_OF_THE_SPHINX_PERK_EFFECT: "增强命令[character_interaction|E]。\n#F 阿蒙提可以提出一个问题，并向目标人物灌输回答这个问题的必要性。#!"
 BECOMING_THE_PERSON_PERK_EFFECT: "作为[character_interaction|E]，允许你复制目标的面貌和生理特质。\n#F 通过使用一个人的真名，阿蒙提成为那个人，真正获得对这个人的了解。#!"
 ECHO_THE_GREATER_NAME_PERK_EFFECT: "你将在发掘真名计谋中能同时发掘目标的部分封臣的部分真名。\n#F 阿蒙提可以获得对更复杂事物或概念的真名的理解。#!"
 NAME_OF_THE_ATTRIBUTE_PERK_EFFECT: "#F 阿蒙提可以通过使用其真名来提高其的属性。#!"
 NAMES_OF_THE_FORGOTTEN_PERK_EFFECT: "作为[character_interaction|E]，允许你在战争时召唤[GetMaA('the_lost_ancients').GetName]作为#bold 不可招募的#!事件[men_at_arms|E]。\n#F 通过勤奋的研究，阿蒙提可以为失去真名的东西创造一个真名。#!"
 NAME_OF_THE_WILL_PERK_EFFECT: "#F 阿蒙提可以通过使用其真名来提高其的意志力。#!"
 RENAMING_THE_HEKAU_PERK_EFFECT: "作为[character_interaction|E]，允许重置目标的技能。\n#F 阿蒙提可以重新安排特定超自然力量的法则，例如重新定义吸血鬼的血律或法师的范式。#!"
 LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT: "气疗[character_interaction|E]现在给予[GetModifier('healing_energy_modifier').GetNameWithTooltip]。\n#F 掌握该仪轨的仙人可以注入足够多的能量，以使他的病人即使离开他身边也能以更快的速度痊愈。#!"
 SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT: "允许在灵游时进入[yang_world|E]。\n#F 有了此咒，天宗可以进入影界。#!"
 SENSE_LUCKS_FLOW_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 拥有此咒的天宗能感觉到气运的波动，分辨出围绕着人、地方和事件的好坏运气。#!"
 SNAKE_FIST_STRIKE_PERK_EFFECT: "#F 为了对抗恶魔和其他超自然的再生能力，天宗可以使用此咒来神秘地加速他们的攻击，并将他们的身体变成致命的武器。#!"
 SWEET_DREAMSS_CARESS_PERK_EFFECT: "气疗[character_interaction|E]现在减少压力。\n#F 以纯阳能量的振奋活力抵消疲惫，甜梦抚慰允许仙人通过在主要穴位上轻按手指来驱逐自己或他人的疲惫。#!"
 CALL_THE_SPIRITS_PERK_EFFECT: "解锁[summon_wraith_on_death_interaction|E]。\n解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n最大束缚死灵数量：#P +1#!\n#F 此咒允许仙人召唤元素和自然之灵。#!"
 DRUNKEN_MONKEY_DANCE_PERK_EFFECT: "#F 在此咒的作用下，天宗摇摇晃晃，好像完全醉了一样，不知不觉地避开了拳头、子弹和其他针对他的攻击，使他的对手感到困惑和沮丧。#!"
 LEAPING_TIGER_POUNCE_PERK_EFFECT: "#F 为他的肌肉注入能量，拥有此咒的天宗可以跃出惊人的距离。#!"
 SPIRIT_LANTERN_PERK_EFFECT: "#F 拥有灵灯的天宗只要做个结印，就能在手掌中形成一颗鬼火球，用柔和的金光照亮周围的环境，使妖魔和其他不洁的生命感到害怕。#!"
 STORMWIND_PRANA_PERK_EFFECT: "#F 天宗根据体现阳之本性的移动原理，使用此咒来大幅提高他们的速度。#!"
 BIND_THE_DEMONS_SERVANT_PERK_EFFECT: "使$POD_demon_unearthbound_decision$[decision|E]免费。\n#F 此咒允许仙人放逐或束缚次等的灵体和阳界的诸魔。#!"
 THE_CLEARING_OF_THE_WAY_PERK_EFFECT: "解锁灵界界面的操纵绝壁选项。\n#F 通过此咒，巫凤可以操纵他周围的绝壁等级。#!"
 ELEGANT_CRANE_DEFTNESS_PERK_EFFECT: "#F 在阳气的推动下，掌握这功法的天宗变得异常轻盈和敏捷，能够在最狭窄的壁架上毫不费力地保持平衡，在水和流沙等不稳定的表面上奔跑，或利用树叶支撑他们的体重进行攀升。#!"
 FLAME_HAND_STRIKE_PERK_EFFECT: "#F 双手笼罩在燃烧着的气的灵光中，一个拥有此咒的仙人每次触碰都会让他的敌人沐浴在火中。#!"
 OPENING_THE_THIED_EYE_PERK_EFFECT: "[umbra_sense|E]：$pod_grace_i$#P +5%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +25%#!\n#F 有了此咒，天宗可以穿透迷障，唤醒凡人进入隐秘的鬼神世界。#!"
 MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT: "#F 在玉皇大帝的授权和八仙的忠实授任下，敢于说出此咒核心的天人之言的天宗，能召唤出玉皇大帝的权威和正义的力量。#!"
 PLAGUE_CURING_METHOD_PERK_EFFECT: "气疗[character_interaction|E]现在给予[GetModifier('yang_energy_modifier').GetNameWithTooltip]于目标。\n#F 有了此咒，在照顾病人至少15分钟后，天宗可以将阳气转移到病人的身体里。#!"
 TEN_PACES_STRIKE_PERK_EFFECT: "#F 绕过通常需要的身体接触，拥有此咒的天宗可以通过其集中的气力，无形地将一次武术攻击的力量投射到有着间隔的距离外。#!"
 WALK_THE_BARRIERS_PERK_EFFECT: "[umbra_sense|E]：$pod_grace_i$#P +10%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +50%#!\n#F 行于屏障允许仙人将其物质躯体转移到阳界。#!"
 GENTLE_TYPHOONS_PASSING_PERK_EFFECT: "#F 在战斗中调用，台风过境会将一个凤丹大师变成在狂暴的拳脚风暴中心的完美平静风眼。#!"
 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT: "气疗[character_interaction|E]现在给予[GetModifier('renewed_vitality_modifier').GetNameWithTooltip]于目标。\n#F 凤丹大师可以制造出凤凰磐涅的奇迹，消除时间的摧残，恢复凡人的青春活力。#!"
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT: "气疗[character_interaction|E]现在能移除所有疾病。\n#F 有了这秘传之咒，只要上天认为情况足够危急，天宗就能使自己或盟友恢复到全盛状态。#!"
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('shadow_cloud_modifier').GetNameWithTooltip][modifier|E]。\n#F 有了此咒，天气就可以从他的影子里制造出厚厚的幽暗之云，像黑雾一样飘散。#!"
 IRON_BODY_MEDITATION_PERK_EFFECT: "#F 钢体冥思让天宗通过肉体运转阴气，通过冥想一小时来强化身体，使其免受伤害。#!"
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT: "允许在灵游时进入[UmbraGlossaryLocalized('shadowlands','阴界')]。\n#F 有了这法术，天宗可以进入[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
 STILL_THE_FLUTTERING_WING_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 受定风波影响的目标会遭受短暂的麻痹。#!"
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT: "#F 通过启动此咒，仙龙可以影响他的秘隐等级，以保持匿名，成为一个近乎无面的人。#!"
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT: "#F 静心之道允许天宗缓解一个人的恐慌或焦虑（如血狂）。#!"
 EBON_BONDS_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 只要一句话和一个结印，仙人就能从目标的影子中变出像丝绸一样柔软、像钢铁一样结实的神秘黑丝带将其绑住。#!"
 ICE_HAND_STRIKE_PERK_EFFECT: "#F 在此咒的作用下，天宗的双手被一层蓝色的冰冻阴气所笼罩，每一次攻击都会留下令人麻木的寒气。#!"
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 有了此仪轨，仙龙可以深入了解最奇怪的凡人、动物和灵。#!"
 NO_MIND_KATA_PERK_EFFECT: "#F 通过理清思路，让“道”的宁静冲刷他，拥有此咒的天宗可以发挥自己的意志，在选定的领域中完成真正的超人壮举。#!"
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT: "解锁灵界界面的操纵尸幕选项。\n#F 通过此咒，仙龙可以操纵他周围的亡者障壁等级。#!"
 GHOST_WALKING_METHOD_PERK_EFFECT: "#F 当引用此咒时，仙龙会在选定的感官中变得无法被发现。#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT: "#F 有了此咒，天宗可以通过给目标的影子注入气来揭开隐藏的超自然生物的面纱，使其呈现出所有者的真实形态（变化妖怪的半兽形形态，妖仙的本相等等）。#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT: "#F 仙龙可以用气运包裹自己，给那些想伤害他的人带来厄运。#!"
 BLUR_THE_MIND_PERK_EFFECT: "#F 通过调用此咒，仙龙可以使他的受害者忘记最近发生在其附近的事件。#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT: "#F 通过这仪轨，仙龙可以创造出阻止妖魔和其他阎魔走狗进入一个区域的护身符。#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT: "#F 通过此仪轨，仙龙为[sixth_age|E]做好准备。#!"
 WHISPERING_STONES_PERK_EFFECT: "#F 用这仪轨，仙龙可以从[UmbraGlossary('tempest')]中记录死者的记忆，以翻译未知或已灭绝语言的文件。#!"
 DEATH_TOUCH_PERK_EFFECT: "#F 只保留给最可怕的妖魔，传说中的点穴术使龙丹大师能够灾难性地扰乱单个目标的能量流动，只需一触就能使其残废或死亡。#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT: "#F 通过冥想放下所有的恐惧和怀疑，仙龙的内心平静甚至可以平息风暴，或者在风暴过于猛烈时创造一个保护性的 “气泡”。#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地。\n#F 有了这仪轨，仙龙可以将他的内气与附近的龙脉流动相调和，在花半时辰在龙穴内或龙脉边冥想后，于数秒到达另一龙穴。#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT: "获得[GetModifier( 'POD_shapeshift_form_godbody_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 天帝神体让人想起了$pod_wan_xian$在堕落之前的威严，它将施咒者包围在一片银色的光晕中，照亮天宗的道路，给凡人带来了类似于雾迷的精神状态，并迫使受污染的超自然逃离。#!"
