 A_THOUSAND_CUTS_PERK_EFFECT:0 "解锁[single_combat_duel|E]招式。\n增加作战中致残敌方骑士的几率。\n#F 这种能力使你能够集中你的形魄，使你在战斗中成为名副其实的旋风。你的手臂模糊不清；你的脚步快如闪电；你可以多次攻击一个（或多个）目标，其几乎没有办法躲避打击。#!"
 TREADING_THE_TIDE_DRAGONS_BACK_PERK_EFFECT:0 "#F 允许你移动的如此之快，以至于可以跑过水面而不落入水中。#!"
 DIVINE_WHIRLWIND_PERK_EFFECT:0 "增加作战中杀死敌方骑士的几率。\n#F 你的想法能瞬间变成行动，让你在目标做出反应之前就能多次击中他们。#!"
 TRANSCENDING_PO_PERK_EFFECT:0 "#F 你已经学会了如何不让你天性中黑暗的一面得到更多滋长。通过用阴气来安宁抚慰自己，你可以保持对自己兽性的一面的控制。#!"
 ADVANCED_DEMON_SHINTAI_PERK_EFFECT:0 "在最终级解锁“重设魔体特征”选项，允许你重选所有特征。\n#F 只有具有相同或更高心法等级才能点同等级的技能。每提升一级获得两格魔体特征槽。#!"
 DIVINE_BINDINGS_PERK_EFFECT:0 "增强制作符箓[character_interaction|E]。\n携带[GetModifier('glowing_prayer_modifier').GetNameWithTooltip]时增加作战中重伤敌方骑士的几率。\n#F 当被掷向目标时，这些无害的纸片会逆风飞行，甚至可以绕过路径上的障碍物。一旦符箓击中目标，它们就会放射出一种奇异的绿色能量并延伸膨胀缠住鬼神。#!"
 HEAVENLY_FLAMES_PERK_EFFECT:0 "增强制作符箓[character_interaction|E]。\n携带[GetModifier('bursing_prayer_modifier').GetNameWithTooltip]时增加作战中重伤敌方骑士的几率。\n#F 当这个符箓击中目标鬼神时，它会立即爆发出璀璨夺目的青色火焰，造成恶性伤害。与上一级一样，符箓在飞向目标时会自动绕开障碍物。#!"
 CELESTIAL_FIRES_PERK_EFFECT:0 "增强制作符箓[character_interaction|E]。\n携带[GetModifier('indenfensible_prayer_modifier').GetNameWithTooltip]将增加作战中严重撕裂敌方骑士的几率。\n#F 与上一级一致，只有一点不同：若没有特殊防御，其伤害无法被吸收。#!"
 HEAVENS_THUNDER_PERK_EFFECT:0 "增强制作符箓[character_interaction|E]。\n携带[GetModifier('explosive_prayer_modifier').GetNameWithTooltip]将增加作战中严重撕裂敌方骑士的几率。\n#F 这是[GetTrait('shih').GetName( GetPlayer )]最为强大的一种符咒，被投出后几乎无可阻挡。符箓脱离[GetTrait('shih').GetName( GetPlayer )]的手中之后，会大放光明，并以闪电的速度轰击目标。当它们击向鬼神时，会炸裂成一团暴怒的雷球，几乎可以重创任何恶魔。#!"
 STEEL_SKIN_PERK_EFFECT:0 "#F 你以此能力来提高你的耐力。#!"
 DRAGONS_SPEED_PERK_EFFECT:0 "#F 你以此能力来提高你的敏捷。#!"
 TIGERS_STRENGTH_PERK_EFFECT:0 "#F 你以此能力来提高你的力量。#!"
 CELESTIAL_EYES_PERK_EFFECT:0 "#F 你以此能力来提高你的感知。#!"
 BODY_OF_THE_DRAGON_PERK_EFFECT:0 "#F 你将你的所有属性提高到超人之境界。#!"
 OPENED_EYES_PERK_EFFECT:0 "#F [GetTrait('shih').GetName( GetPlayer )]可以看清鬼神的本质，[GetTrait('shih').GetName( GetPlayer )]同时也可忽略月狂的影响。#!"
 DIVINE_PERCEPTIONS_PERK_EFFECT:0 "#F 这种力量赋予[GetTrait('shih').GetName( GetPlayer )]观察他人精神体的能力。在大多数情况下它就像测谎仪那样运作，但[GetTrait('shih').GetName( GetPlayer )]也可以以此手段观察一个凡人或者其他存在体是否被魔附身。#!"
 WIND_TALK_PERK_EFFECT:0 "解锁$POD_marked_for_return_interaction$[character_interaction|E]。\n解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 使用此能力的[GetTrait('shih').GetName( GetPlayer )]可以聆听到精神领域居民的声音并与它们沟通。然而这些鬼神并没有义务回应[GetTrait('shih').GetName( GetPlayer )]可能提出的任何问题或要求。#!"
 CELESTIAL_WINDOW_PERK_EFFECT:0 "解锁$POD_bind_interaction$[character_interaction|E]。\n#F 运用这种能力，[GetTrait('shih').GetName( GetPlayer )]可以与阴阳两界的某一个居民全方面地产生相互作用。在所有的意义与目的上，目标灵体与[GetTrait('shih').GetName( GetPlayer )]都会存在于同一层面。那个灵体将可以被触摸、伤害、帮助或是参与战斗，就好像[GetTrait('shih').GetName( GetPlayer )]与灵体存在于同一个地方一样。#!"
 CELESTIAL_DOORWAY_PERK_EFFECT:0 "解锁$POD_send_to_shadowland_character_interaction$[character_interaction|E]。\n#F [GetTrait('shih').GetName( GetPlayer )]可以积极地与灵界互动；然而这种做法未必明智。虽然这个角色实际上仍处于中原，但他可以认知并影响周遭的阴阳两界。尽管这些地方的居民也知道报偿恩情之类的概念，但它们中的许多都不怎么喜欢[GetTrait('shih').GetName( GetPlayer )]。#!"
 BARRIER_OF_PAIN_PERK_EFFECT:0 "解锁气疗[character_interaction|E]以允许治疗伤疤。\n#F 在这一等级，[GetTrait('shih').GetName( GetPlayer )]可以强迫自己将痛苦拒之门外。#!"
 THE_CLOSING_WOUND_PERK_EFFECT:0 "增强气疗[character_interaction|E]以允许治疗伤口。\n#F 在这个等级，[GetTrait('shih').GetName( GetPlayer )]可以治愈伤口。软烂的肌肉会褪去淤伤；伤口会自行愈合留下新疤。#!"
 SPIRITUAL_HEALING_PERK_EFFECT:0 "增强气疗[character_interaction|E]以允许治疗身体缺陷。\n#F [GetTrait('shih').GetName( GetPlayer )]可以以此能力重组骨骼和神经组织。如果在战斗中使用，这个过程将会是痛苦且极具风险的。骨头必须被正确复位，否则[GetTrait('shih').GetName( GetPlayer )]将面临永久残疾的风险。#!"
 ESCAPE_FROM_DEATH_PERK_EFFECT:0 "允许你动用意志力免收伤害。\n增强气疗[character_interaction|E]以允许治疗病症和次级生理缺陷。\n#F 使用此能力的[GetTrait('shih').GetName( GetPlayer )]可以恢复燃烧和其他能量伤害。死里逃生虽然极为有用，但代价高昂。#!"
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT:0 "允许你不因受伤而死。\n增强气疗[character_interaction|E]以允许治疗疾病和生理缺陷。\n#F 使用此能力的角色从细胞层面完全再生自我。这种力量不能让一个角色起死回生，但它可以逆转辐射中毒、癌症、巨创甚至是衰老的影响。#!"
 THOUSAND_FISTS_PERK_EFFECT:0 "增加作战中致伤敌方骑士的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]汇聚起他的阳气，在瞬息间打出千百拳。这攻击有着超越凡人的急速，在空中模糊成一片幻影。#!"
 SPEAR_HAND_PERK_EFFECT:0 "增加作战中重伤敌方骑士的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]汇聚其阳气并在一只手上点燃这种能量。这种能量在空气中弥漫并熊熊燃烧。#!"
 BURNING_GHOSTS_PERK_EFFECT:0 "增加作战中重伤敌方骑士的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]之英杰凝神聚气，以使自己能与任何死灵与灵类对敌。气包裹于他周身，让他的皮肤闪耀着金色的光芒。[GetTrait('shih').GetName( GetPlayer )]的肉身并不能直接击打灵类，但他周身的气却能攻击到它们。#!"
 STEEL_BODY_PERK_EFFECT:0 "增加作战中严重撕裂敌方骑士的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]聚集他的阴气淬炼自己的身体以增强他的破坏力。[GetTrait('shih').GetName( GetPlayer )]浑身上下所有的肌肉都紧绷起来，他的皮肤也变得坚韧而富有弹性。#!"
 THOUSAND_SWORDS_PERK_EFFECT:0 "增加作战中严重撕裂敌方骑士的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]汇聚全身之气，以行云流水的连环攻击袭向对手。每一击都会给予敌人重创，在碰撞间绽出金铁交击之声。#!"
 FROZEN_RIVER_PERK_EFFECT:0 "#F [GetTrait('shih').GetName( GetPlayer )]以她的阳气在自己生命源泉上建立壁垒，以防她的气被窃取。#!"
 STOLEN_SERPENT_PERK_EFFECT:0 "增加作战中重伤敌方骑士的几率。\n#F [GetTrait('shih').GetName( GetPlayer )]可以截获任何针对于她的远程超自然攻击，然后迅速以其人之道还治其人之身。这是种危险的举动，因为[GetTrait('shih').GetName( GetPlayer )]必须抓住转瞬即逝的时机，截击投向她身体的超自然能量。#!"
 CELESTIAL_BARRIER_PERK_EFFECT:0 "作为[character_interaction|E]，允许你让对方承受[GetModifier( 'celestial_barrier_modifier' ).GetNameWithTooltip|L]。\n#F 凭借此种力量，[GetTrait('shih').GetName( GetPlayer )]得以暂时阻止鬼神从他处窃取气。#!"
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT:0 "解锁“窃气”[character_interaction|E]。\n#F [GetTrait('shih').GetName( GetPlayer )]以此能力从鬼神处窃取其气。窃得之气不能还与鬼神，亦不能为[GetTrait('shih').GetName( GetPlayer )]自己所用。这些气将会被武器吸收。#!"
 BITE_OF_THE_MU_PERK_EFFECT:0 "增强“窃气”[character_interaction|E]。\n增加作战中严重撕裂敌方骑士的几率。\n#F 施展此术，[GetTrait('shih').GetName( GetPlayer )]不仅能从目标鬼神之处窃取气，更能以这些气攻击鬼神。对[GetTrait('shih').GetName( GetPlayer )]而言，这种体验往往极为畅快，有时甚至会上瘾。这个过程极为危险，因为它会唤起师的心魔。#!"
 EYES_OF_THE_DRAGON_PERK_EFFECT:0 "#F [GetTrait('shih').GetName( GetPlayer )]迫视着对手，威吓是避免无意义战斗的妙招。#!"
 DARK_REFLECTION_PERK_EFFECT:0 "#F 此种力量迫视[GetTrait('shih').GetName( GetPlayer )]的敌手意识到他们行动带来的恶果。[GetTrait('shih').GetName( GetPlayer )]往往在对鬼神施以审判时使用此能力。#!"
 HUNTED_EYES_PERK_EFFECT:0 "#F 此能力同时作用于饿殍与死灵。凝视对手的眼睛，[GetTrait('shih').GetName( GetPlayer )]迫使目标重新体验它在幽冥之中受到的漫长折磨。#!"
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT:0 "解锁$POD_command_wraith_interaction$[character_interaction|E]。\n#F [GetTrait('shih').GetName( GetPlayer )]能运用这种力量来指挥一只灵类来完成一个简单的任务。#!"
 DIVINE_ORDINANCE_PERK_EFFECT:0 "#F [GetTrait('shih').GetName( GetPlayer )]的无边威仪令视界之中的所有对手都惊恐无比。#!"
 BALANCE_OF_THE_SPIRIT_PERK_EFFECT:0 "解锁驱魔[character_interaction|E]以允许治愈失衡。\n#F [GetTrait('shih').GetName( GetPlayer )]可以察觉魂魄中阴阳的失调，并能以此能力恢复和谐的秩序。#!"
 FOCUS_OF_THE_MIND_PERK_EFFECT:0 "增强驱魔[character_interaction|E]以允许削减压力。\n#F [GetTrait('shih').GetName( GetPlayer )]消耗绝大的意志力来对抗鬼神。此能力使得他们能重获决心，再次投入到神圣的职责之中。#!"
 NIGHTMARE_EXORCISM_PERK_EFFECT:0 "增强驱魔[character_interaction|E]以允许抹去负面压力特质。\n#F 为求减轻精神上的痛苦，许多[GetTrait('shih').GetName( GetPlayer )]常常求助于毒品和酒精。但通过这种能力，[GetTrait('shih').GetName( GetPlayer )]得以以一种更直接的方师来消除回忆对情绪的影响，并希望借此来消除记忆带来的精神创伤。#!"
 SELF_EXORCISM_PERK_EFFECT:0 "增强驱魔[character_interaction|E]以允许抹去负面精神特质。\n#F 就像所有凡人一样，[GetTrait('shih').GetName( GetPlayer )]也面临着被魔附身的风险。而有了这个能力，狩魔人就可以与一只成功钻进她身体的魔展开心灵交锋，并获得逐魔的第二次机会。#!"
