 WRATH_OF_THE_MARTYR_PERK_EFFECT: "增加你从痛苦中汲取的力量，即增强伤痛之力修正。"
 ARMOURED_FLESH_PERK_EFFECT: "没有什么必死攻击能杀死你。这技能能使你免于受伤而死。\n\n#flavor 再多的伤口也不会结束你的生命，除非彻底毁灭或斩首。#!"
