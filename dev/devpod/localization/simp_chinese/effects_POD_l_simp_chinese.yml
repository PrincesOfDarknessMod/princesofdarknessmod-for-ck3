 RIDDLE_OF_MAYA_PERK_EFFECT: "#F 万鬼向目标揭示了一个令人困惑的真相，消耗了他的意志。#!"
 VEIL_OF_MAYA_PERK_EFFECT: "#F 万鬼会了操纵现实幻觉，创造出强大的海市蜃楼，能提供真实的感觉。#!"
 BAKUS_QUANDARY_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('bakus_quandary_modifier').GetNameWithTooltip][modifier|E]。\n#F 万鬼向受术者提出了一个非常耐人寻味的哲学问题，一个无法解决的问题，以至于对方变成了流口水的白痴，除了试图回答这个问题之外什么都不想。#!"
 BEYOND_THE_DOOR_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 万鬼的脚步可以扭曲空间，使他能够瞬间移动遥远的距离。#!"
 REVISIONIST_REALITY_PERK_EFFECT: "作为[character_interaction|E]，允许收养有[GetTrait('dharma0').GetName( GetPlayer )]的[GetTrait('kueijin').GetName( GetPlayer )]。\n#F 这能力允许万鬼强迫其他万鬼离开他的心法道途，使他别无选择，只能重新开始寻求开悟。#!"
 FATE_OF_THE_ONE_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetModifier( 'destiny_advised_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'destiny_exposed_modifier' ).GetNameWithTooltip|L]给对方角色。\n#F 万鬼可以推算一个人的命运，并给予相应的建议。如果这个人遵循万鬼的指示，幸运将会青睐他。#!"
 JOSS_WEAVING_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetModifier( 'joss_modifier' ).GetNameWithTooltip|L]给对方角色。\n#F 万鬼可以重新调整气运的流向，赐予一个人在短时间内获得好运。#!"
 FATE_OF_THE_WU_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetModifier( 'destiny_advised_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'destiny_exposed_modifier' ).GetNameWithTooltip|L]给对方家族。\n#F 万鬼可以推算屋室或其他小团体的命运。#!"
 GRAND_DUKES_THEOREM_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetModifier( 'joss_modifier' ).GetNameWithTooltip|L]给对方家族。\n#F 如果客户面向夜空中木星的位置，万鬼可以影响其气运的流向。#!"
 REALIGNING_THE_STARS_PERK_EFFECT: "解锁占星[decision|E]。\n作为[character_interaction|E]，允许你暂时改变对方的生肖修正。\n#F 万鬼可以重置一个人的星相，使其在短时间内得到改善。#!"
 PANTHEON_OF_ANCESTORS_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetTrait('reincarnation').GetName( GetPlayer )]给对方角色。\n#F 万鬼可以利用星座运势来了解客户的前世今生。#!"
 FATE_OF_THE_COURT_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetModifier( 'destiny_advised_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'destiny_exposed_modifier' ).GetNameWithTooltip|L]给对方宗族。\n#F 万鬼可以解读更广泛的人群的命运，比如皇朝或国家。#!"
 CELESTIAL_CURSE_PERK_EFFECT: "作为[character_interaction|E]，允许你给予[GetModifier( 'celestial_curse_modifier' ).GetNameWithTooltip|L]给对方角色。\n#F 如果星象合适，万鬼可以对其受害者施加厄运的诅咒。#!"
 SUBSTITUTION_OF_THE_TWELVE_PERK_EFFECT: "作为[character_interaction|E]，允许你永久改变对方的生肖修正。\n作为[character_interaction|E]，允许你给予[GetModifier( 'extra_life_1_modifier' ).GetNameWithTooltip|L]给对方角色。\n#F 万鬼可以永久性地改变一个人的星相。#!"
 IRON_MOUNTAIN_PERK_EFFECT: "#F 获得额外防护。#!"
 FLAYING_THE_DEMON_PERK_EFFECT: "#F 万鬼不受任何伤势惩罚。#!"
 TORTUROUS_TRANSCENDENCE_PERK_EFFECT: "#F 万鬼能将痛苦转化为魔气，为他的心魔提供动力。#!"
 STRIKING_THE_FIRE_PERK_EFFECT: "#F 万鬼可以抵抗像火或阳光一样的严重伤害。#!"
 EXALTED_RESILIENCE_OF_THE_HEAVENLY_PERK_EFFECT: "允许你不死于受伤。\n#F 如果万鬼受了致命伤，但仍有意识，他仍然可以通过调用他的魔气来保持清醒。#!"
 FOCUSING_SHOUT_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('focusing_shout_modifier').GetNameWithTooltip][modifier|E]。\n#F 这种力量让万鬼可以在一瞬间将他的身心灵合一，伴随着一声大喊，达到超然的境界。#!"
 ASPECT_OF_THE_TIMID_SPARROW_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('aspect_of_the_timid_sparrow_modifier').GetNameWithTooltip][modifier|E]。\n#F 万鬼可以在近战中刺激他的对手。#!"
 NGILAI_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('ngilai_knight_modifier').GetNameWithTooltip][modifier|E]。\n#F 万鬼可以发出骇人的尖嚎，让他的对手逃命。#!"
 THE_SONG_OF_THE_TORMENTED_SOUL_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('the_song_of_the_tormented_soul_modifier').GetNameWithTooltip][modifier|E]。\n#F 拥有这种能力的万鬼可以将他对自己的不死族状态所感到的折磨和痛苦倾吐出来，而将其施加在听众身上。#!"
 GREATER_NGILAI_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('ngilai_commander_modifier').GetNameWithTooltip][modifier|E]。\n#F 万鬼的尖嚎能影响到附近的所有人。#!"
 CRY_OF_BLOOD_PERK_EFFECT: "作为[character_interaction|E]，允许你使用声音来伤害目标的所有（非灵体）骑士。\n#F 万鬼的声音可以伤害血肉。#!"
 TIGERS_ROAR_PERK_EFFECT: "增强$POD_voice_harm_interaction$[character_interaction|E]，允许让目标失去金钱。\n#F 万鬼的声音可以伤害无机物。#!"
 CRY_OF_THE_PHANTASM_PERK_EFFECT: "增强$POD_voice_harm_interaction$[character_interaction|E]，允许你使用声音来伤害目标的所有灵体[knights|E]。\n#F 万鬼的声音可以伤害非物质生物。#!"
 SHOUT_OPENING_THE_WAY_TO_HEAVEN_PERK_EFFECT: "解锁操纵绝壁[umbra|E]行动中的拆毁绝壁选项。\n[umbra_sense|E]：$pod_grace_i$#P +10%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +50%#!\n#F 万鬼的尖嚎将能刺穿绝壁。#!"
 GLIMPSE_OF_YOMI_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('glimpse_of_yomi_commander_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('glimpse_of_yomi_knight_modifier').GetNameWithTooltip][modifier|E]。\n#F 这力量允许恶鬼在受害者的头脑中注入[UmbraGlossaryLocalized('yomi_wan','幽冥')]界的图像，以及在其中发生的事情。只有极度勇敢的灵魂能够经受住这样的攻击而不尖叫着跑进黑夜。#!"
 RAZOR_WINDS_PERK_EFFECT: "作为[character_interaction|E]，允许让敌方领地获得[GetModifier( 'razor_winds_power_modifier' ).GetNameWithTooltip|L]修正。\n#F 恶鬼打开了一个进入[UmbraGlossaryLocalized('yomi_wan','幽冥')]界的临时裂隙，释放出微微的呼啸无量地狱的刀风。#!"
 FAVOUR_OF_THE_YAMA_KINGS_PERK_EFFECT: "作为[decision|E]，允许花费魔功技能点来获得金钱和威望。\n#F 只有仆从中非常强大的，阎魔和其等的强力附庸才给予这种力量：扭曲的气运——能给那些执行阎魔的邪恶意志的人带来好运。#!"
 REMEMBRANCE_OF_YOMI_PERK_EFFECT: "作为[character_interaction|E]，允许让对方变成[GetTrait('infernalist').GetName( GetPlayer )]以便命令进行谋杀。\n#F 所有万鬼都会回忆起他们的魄在[UmbraGlossaryLocalized('yomi_wan','幽冥')]界中度过的时光——而这回忆从来都不是愉快的。这种能力允许恶鬼把这些记忆带到万鬼的脑海中，并强调它们，迫使他做出堕落的行为。#!"
 WEAVING_THE_YOMI_WORLD_PERK_EFFECT: "解锁[GetBuilding('nest_corrupt_01').GetName]建筑。\n#F 这强大的能力允许恶鬼腐蚀龙穴，玷污它，使它成为黑暗、邪恶和痛苦的来源。它不再是所有鬼神的力量源泉，而是成为阎魔的前哨，成为只有恶鬼和像他们一样的存在可以利用的能量源泉。#!"
 TAKING_THE_FACE_PERK_EFFECT: "作为[character_interaction|E]，允许你复制目标的面貌。\n#F 伪装出目标的体貌以及口音。#!"
 BLUSH_OF_LIFE_RESTORED_PERK_EFFECT: "#F 使身体再次表现出生命的迹象。阳光的影响被抑制，但身体变得更容易受火的影响。#!"
 THE_FIRE_WHICH_ILLUMINATES_PERK_EFFECT: "#F 召唤火焰，迫使注视它的目标面对过去或现在的愚蠢行为。#!"
 CLOTHED_IN_LIFE_PERK_EFFECT: "#F 让你的身体再次成为真实活人的仿像，与其所有的优点和缺点。#!"
 GENTLE_YIELDING_PERK_EFFECT: "#F 万鬼可以通过命令自己的血肉移位来抵御冲击性攻击。#!"
 TAKING_WHAT_IS_GIVEN_PERK_EFFECT: "#F 万鬼的躯体为攻击移位，同时用自己的肉体困住物体，并将其挤住。#!"
 SPIDERS_BLESSING_PERK_EFFECT: "#F 万鬼创造出黑色阴力系绳，将使用者固定在天花板上，使他能够像蜘蛛一样行走。#!"
 BITTER_YIN_CARESS_PERK_EFFECT: "#F 通过用触摸引导纯阴之力，万鬼可以使任何物质的老化速度大大加快。#!"
 BITTER_YIN_CLOUD_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 通过做一系列复杂的手势，万鬼可以招出纯阴能量球，其中阴气能破坏对手的身体，使提前衰老。#!"
 DANCE_OF_SHIVA_PERK_EFFECT: "#F 在进行了一系列极其复杂的手印之后，万鬼可以用自己的身体散发阴气，用破坏性的阴气淹没他周围的区域。#!"
 GENDER_CHANGE_PERK_EFFECT: "#F 万鬼能改变他自身的性别。#!"
 FUR_AND_FANGS_PERK_EFFECT: "#F 万鬼化出数种动物的特征。#!"
 THOUSAND_LICE_SPIES_PERK_EFFECT: "#F 通过洒下一袋螨虫，万鬼可以通过它们的眼睛看到并观察各自的区域。#!"
 POLONG_PERK_EFFECT: "能够招募[GetMaA('homunculus').GetName]作为[men_at_arms|E]。\n#F 斩出一块肉之后，万鬼可以将其塑造成一个类似人造人的物体。#!"
 ANIMAL_FORM_DRAGON_DANCE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 通过在龙舞中模仿动物形意，万鬼的攻击变得更加凶猛。#!"
 EIGHTFOLD_YANG_BARRIER_PERK_EFFECT: "#F 万鬼将阳气塑造成一个能量场，软化或阻挡冲击。#!"
 HEAR_PRAYER_PERK_EFFECT: "#F 通过放松和冥想，万鬼可以聆听到针对他的祈祷。#!"
 PRAYER_APPRAISAL_PERK_EFFECT: "#F 通过建立眼神交流，万鬼可以看到那些真诚相信万鬼的神性的虔诚信徒的内心祈祷和愿望。#!"
 FULFILL_PRAYER_PERK_EFFECT: "#F 万鬼可以操纵香火，使小祈祷成真。这构成了许多众佛相邪教的基础。#!"
 PRAYER_EATING_PERK_EFFECT: "作为[character_interaction|E]，允许你花费[piety|E]来补充气。\n#F 万鬼可以将针对他的祈祷转化为一种如同蜂蜜一般的滋养物来补充他的气。#!"
