 HEART_THIEF_PERK_EFFECT: "增强[heart_of_darkness|E]能力，允许通过计谋或跟囚犯的[character_interaction|E]，从其他角色那里窃心。如果你拥有某人的心，就很容易杀死他或迫使其进入[torpor|E]状态。"
