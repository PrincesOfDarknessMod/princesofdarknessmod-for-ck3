 SONG_OF_THE_BLOODED_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('song_of_the_blooded_perk_commander_negative_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('song_of_the_blooded_perk_knight_negative_modifier').GetNameWithTooltip][modifier|E]。\n作为[commander|E]时，在[combat_phase|E]中给予友方[commanders|E][GetModifier('song_of_the_blooded_perk_commander_positive_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('song_of_the_blooded_perk_knight_positive_modifier').GetNameWithTooltip][modifier|E]。\n#F 吸血鬼进入战斗专注状态，其生理勇武得到增强，周身环绕着能够使旁观者目眩的光环，使她免受任何影响心智的技能侵扰。#!"
 SAFE_PASSAGE_PERK_EFFECT: "更少概率遭受裁判行动。\n#F 无论当地文化如何都能受到款待与帮助，并让猎人更难找到你。#!"
 AVERSION_PERK_EFFECT: "增强不可接触者的爱抚[character_interaction|E]，现在你将给予目标[GetModifier('aversion_perk_modifier').GetNameWithTooltip][modifier|E]，概率使对方失去所有威望。\n#F 增强[GetPerk('pariahs_caress_perk').GetName(GetPlayer)]，使他人极度厌恶和排挤某个体，或对他产生敌意。#!"
 WATCHER_PURIFICATION_PERK_EFFECT: "作为[character_interaction|E]，允许你移除目标的邪恶习性特质。\n#F 驱逐或驱魔一只灵体或恶魔，并将其束缚，令其为你服务。#!"
 WATCHER_SOUL_EXCHANGE_PERK_EFFECT: "作为[character_interaction|E]，允许你交换两人的信仰和性格特质。\n#F 交换两个体的灵魂，交换心路，美德和天性。#!"
 has_1_extra_perk_points_valeren: "@warning_icon!#X 因为这是你的第二条魂健术道途，你需要额外#V 1000#!经验来点选此[perk|E]。#!"
