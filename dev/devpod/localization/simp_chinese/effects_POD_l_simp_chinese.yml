 BOND_FAMULUS_PERK_EFFECT: "使你能[bind_famulus|E]的[character_interaction|E]，与一只动物血缚并与其形成精神链接。"
 DRAUGHT_OF_ELEGANCE_PERK_EFFECT: "作为[blood_draught|E][character_interaction|E]选项，你可以赐予他人你的超自然敏捷。\n\n#flavor 你的血液中充满了迅捷术的力量，并能把你力量的一部分传递给任何喝了它的人。#!"
 RATIONALIZE_PERK_EFFECT: "再次使用[GetScheme('PODmesmerize').GetTypeName]，将允许把对应[weak_hook|E]升级为[perpetual_hook|E]。\n通过让受术者自认是以自己的意愿行事，你可以解锁一个新的支配术命令——启动计谋。你还可以通过使用支配术命令获得更多的金币。"
 DRAUGHT_OF_ENDURANCE_PERK_EFFECT: "作为[blood_draught|E][character_interaction|E]选项，你可以赐予他人你的超自然耐力。\n\n#flavor 你的血液中充满了坚韧术的力量，并能把你力量的一部分传递给任何喝了它的人。#!"
 DRAUGHT_OF_MIGHT_PERK_EFFECT: "作为[blood_draught|E][character_interaction|E]选项，你可以赐予他人你的超自然肉体力量。\n\n#flavor 你的血液中充满了蛮力术的力量，并能把你力量的一部分传递给任何喝了它的人。#!"
 ENTRANCEMENT_PERK_EFFECT: "解锁[GetScheme('PODentrance').GetTypeName][scheme|E]。\n#F 吸血鬼把他们非自然的吸引力集中在一个人身上，灌输给他们一种着迷或迷恋，类似于神魂颠倒地坠入爱河或遇见自己一生的偶像。#!"
 SUMMON_PERK_EFFECT: "解锁[GetScheme('PODsummon').GetTypeName][scheme|E]。\n#F 吸血鬼可以召唤任何一个人，无论是凡人或吸血鬼，只要其等曾经被用过使人亲近、迷人魅惑或威压气场，或者至少被尝过一次血。#!"
 FERAL_WEAPONS_PERK_EFFECT: "作为[shapeshift|E]选项，你可以把你的爪子变成[GetModifier('POD_shapeshift_form_feralweapons_modifier').GetNameWithTooltip]。\n#F 吸血鬼可以把其的天然武器快速生长到可怕的大小。#!"
 SHAPECHANGE_PERK_EFFECT: "作为[shapeshift|E]选项，你可以变形成动物。\n#F 吸血鬼可以呈现为动物的形态，通常是与他们[Clan|E]相关的动物，或者是他们最常捕食的猎物。#!"
 METAMORPHOSIS_PERK_EFFECT: "作为[shapeshift|E]选项，你可以变形成更小的动物。\n#F 你变成动物形态的能力增强了。#!"
 MIST_FORM_PERK_EFFECT: "作为[shapeshift|E]选项，你可以变形成[GetModifier('POD_shapeshift_form_mist_modifier').GetNameWithTooltip]。\n#F 吸血鬼获得了变成一团云雾的传奇能力，可以被眼光察觉，但除了火，阳光和超自然威胁，其他任何东西都无法触及该雾。#!"
 NEEDS_DISCIPLINE_TEXT: "@warning_icon!#X 须知你得有基础[discipline|E][traits|E]才能点此树上的技能 #!"
 ventrue_clan_bane: "这人不在你的$pod_feeding_restrictions$中，吸食其将不会获得经验。"
 ventrue_clan_bane_anim: "梵卓很难从动物的血液中获得营养，因此整个吸血过程的成本有时会高于效用。"
 GAINS_FAITH_LIFESTYLE_XP: "获得$VALUE|V0$[faith_lifestyle|E]经验"
 GAINED_FAITH_LIFESTYLE_XP: "获得了$VALUE|V0$[faith_lifestyle|E]经验"
