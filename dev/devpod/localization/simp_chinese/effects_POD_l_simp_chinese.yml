 FIVE_POISON_CLOUD_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('five_poison_cloud_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你喷吐出一阵高度浓缩的阴气吐息或者浓雾，雾气内的金属腐蚀，血肉朽烂，植物枯萎凋零。#!"
 CHING_SHIH_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n获得[GetModifier( 'POD_shapeshift_form_ching_shih_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 让你暂时变为魃犼僵尸形态。#!"
 LONG_NECK_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 让你的四肢或颈部伸展到令人印象深刻的长度。#!"
 DETACH_LIMB_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n解锁[single_combat_duel|E]招式。\n#F 让你身体的一部分脱离主体独自活动。#!"
 LOTUS_BREATH_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('lotus_breath_modifier').GetNameWithTooltip][modifier|E]。\n作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 允许你喷吐出一片乳白色的云雾，期中混杂了过量的阳气。所有吸纳这片云雾的生物如登极乐飘飘欲仙进而语无伦次不受控制。#!"
 PELESIT_PERK_EFFECT: "能够招募[GetMaA('pelesit').GetName]作为[men_at_arms|E]。\n[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 让你可以操控自身躯体上的大量微生物，用于探测或其他多种用途。#!"
 PERMEATE_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 允许你膨胀或萎缩自己的身体。#!"
 BLOOD_ATEMI_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。"
 FLOW_LIKE_BLOOD_PERK_EFFECT: "获得[GetModifier( 'POD_shapeshift_form_blood_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 允许你如血液一般无固定状态。#!"
 BLOODLASH_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你挥舞水鞭一样来挥动血液。#!"
 BLOOD_AWAKENING_PERK_EFFECT: "获得唤醒或凝固灵类[character_interaction|E]。\n#F 允许你唤醒或凝固该阳属灵类或死灵。#!"
 GOBLIN_FACE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n获得[GetModifier( 'POD_shapeshift_form_face_on_fire_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 你眼睛和嘴巴闪烁着骇人的能量火焰。#!"
 GOBLIN_SPARK_PERK_EFFECT: "#F 允许你召唤一个无害的球状小灵火，它会发出柔和的光，并根据制造者的意愿扭曲成各种形状。#!"
 GOBLIN_SHAPES_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 允许你用大量的鬼火构筑复杂的形体。#!"
 GOBLIN_SCORCH_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你如同上古年代的巨龙一般喷吐冷焰或者真火。#!"
 GOBLIN_LANTERN_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n获得[GetModifier( 'POD_shapeshift_form_orb_of_fire_modifier' ).GetNameWithTooltip|L]变形选项。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你进入彻底的自焚状态，周身充斥着大量的鬼火。#!"
 STAND_UPON_THE_DRAGONS_BACK_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 把握地面和自身的链接，将自己深深的扎根于大地。#!"
 TREAD_THE_THRASHING_DRAGONS_TAIL_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 通过将自身的气律散布于周遭环境，让自身变得不可思议的轻盈，安稳行走于各类险阻之上如履平地，甚至可以踏浪行波。#!"
 PLACATE_THE_EARTH_DRAGON_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 通过对大地，岩石，树木的灵轻柔的吟颂，鬼人可以如潜水一般浸入土地，随意穿越墙壁及其他障碍。#!"
 HARNESSING_THE_DRAGONS_BREATH_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 调律自身的气脉，捕捉地脉的律动，于此可依靠地脉的涌动来进行滑翔飞行。#!"
 JADE_SERVANT_OF_THE_AUGUST_PERSONAGE_PERK_EFFECT: "获得数项变形选项。\n#F 鬼人完美的调控周遭的五行元气，将传统的五行元素——金木水火土——依其意志塑形变化附着于自身。#!"
 SHROUDED_MOON_PERK_EFFECT: "获得[GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 允许你和周边的阴影完美融为一体。#!"
 YIN_MANTLE_PERK_EFFECT: "能够招募[GetMaA('wraiths').GetName]作为[men_at_arms|E]。\n作为强化选项，允许你给予武器加成。\n监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害死灵/恶魔不再有[gold|E]耗费。\n#F 允许你将内在阴气引导为阴暗的敌意将人所覆盖，凡人无法察觉这种异常。对他们来说，就像如坠冰窟的寒意。#!"
 BONE_DANCE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('bone_dance_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 通过一系列特定的舞姿和神秘缓慢的回旋舞蹈，你能将自身的阴气散步于周边氛围，处于影响范围内的目标变得昏昏欲睡且任意受人摆布。#!"
 EIGHTFOLD_YIN_MANTLE_PERK_EFFECT: "能够招募[GetMaA('shades').GetName]作为[men_at_arms|E]。\n作为铸造选项，允许你制造宝物。\n作为[character_interaction|E]，允许你给予金属盔甲加成。\n#F 类似于初级的阴引仙绫，只不过这时你可以自行塑造周身的气场，将其塑造成任意造型。#!"
 SEMBLANCE_OF_THE_EBON_DRAGON_PERK_EFFECT: "灵游时进入[UmbraGlossaryLocalized('shadowlands','阴界')]时不再有[gold|E]耗费。\n[umbra_sense|E]：$pod_grace_i$#P +10%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +25%#!\n#F 允许你将阴气导引至全身，将自身转换为至阴无极之态。#!"
 PRINCIPLE_OF_MOTION_PERK_EFFECT: "#F 允许你发掘体内的阳气的力量来强化自身的动作。#!"
 WHITE_TIGER_CORPSE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n获得[GetModifier( 'POD_shapeshift_form_incorporeal_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 通过调律阴气操控自身的肌肤和骨髓，如此一来可以变得透明不可视。#!"
 DRAGON_DANCE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 通过特定的站桩入定，行宫踏步，甚至是诡异的跳大神，让你可进入战斗专注状态，处于此类状态下可以施展多项惊人的战斗技艺。#!"
 EIGHTFOLD_YANG_MANTLE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('eightfold_yang_mantle_modifier').GetNameWithTooltip][modifier|E]。\n#F 类似于初级的阳引仙绫，只不过这时你可以自行塑造周身的气场，将其塑造成任意造型。#!"
 SEMBLANCE_OF_THE_SCALET_QUEEN_PERK_EFFECT: "灵游进入[yang_world|E]时不再有[gold|E]耗费。\n[umbra_sense|E]：$pod_grace_i$#P +10%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +25%#!\n#F 允许你将阳气的力量引导至全身，将自身转换完全的纯阳无极之态。#!"
 MASTER_FLOW_PERK_EFFECT: "当你耗费完一种属性的气时不再获得过亢修正。\n#F 让你能快速的调节自身的气脉运转。#!"
 ADJUST_BALANCE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('state_of_balance_modifier').GetNameWithTooltip][modifier|E]。\n若有失衡阴阳特质，在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('attuned_to_yin_modifier').GetNameWithTooltip]/[GetModifier('attuned_to_yang_modifier').GetNameWithTooltip][modifier|E]。\n作为[character_interaction|E]，允许增减阴德阳德修正。\n作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 允许你调节受害者体内的气脉平衡，让因超量的阴阳二气走火入魔，也可用于调节平衡。#!"
 SHIFT_THE_BALANCE_PERK_EFFECT: "作为[character_interaction|E]，允许转换阴阳特质。\n#F 允许你调节自身的阴阳等级。将自身的阴或者阳等级转化为对立的能量。#!"
 CHI_INTERRUPT_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('chi_interrupt_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你扰乱他人的气脉运行，使他人陷入抽搐痉挛。#!"
 CHI_MASTERY_PERK_EFFECT: "解锁弱者道之用[character_interaction|E]，允许让敌人失去所有能量（气，塞赫，饥渴……）。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('chi_mastery_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你让对方体内的气脉流失或气脉逆行。#!"
 SPIRIT_CALL_PERK_EFFECT: "解锁[summon_wraith_on_death_interaction|E]。\n解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n最大束缚死灵数量：#P +1#!\n#F 联系灵界，通过将自己编制塑造的有趣（或吵闹生厌）叙事来吸引附近泉水岩石之灵——或者是死者的鬼魂。#!"
 CHI_WARD_PERK_EFFECT: "解锁[umbra|E]界面的操纵绝壁选项。\n#F 允许你通过调律当地的龙脉强化或者弱化当地的绝壁。#!"
 CHI_SHAPING_PERK_EFFECT: "允许你能够升级[GetBuilding('dragon_nest_01').GetName]建筑。\n#F 允许你将当地的龙脉塑形变化，不论是飞沙，墙壁，巢穴，甚至是风水陷阱。#!"
 RIDE_THE_DRAGON_PERK_EFFECT: "解锁神龙战车[character_interaction|E]，允许你传送你带的军队到目标龙穴。\n#F 允许你进入通常的龙脉并进行同调，驾驭它来进行快速移动。#!"
 CHI_RIFT_PERK_EFFECT: "作为[character_interaction|E]，允许让敌方领地获得[GetModifier( 'chi_rift_power_modifier' ).GetNameWithTooltip|L]修正。\n#F 允许你在中原与灵界之间打开传送门，溢出毁灭性的气元风暴。#!"
 RASA_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 窥见过去和未来的片段。#!"
 CHI_SIGHT_PERK_EFFECT: "[umbra_sense|E]：$pod_grace_i$#P +5%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +25%#!\n#F 允许你可以细致观察灵界的面貌。#!"
 DRAGON_WARD_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('dragon_ward_modifier').GetNameWithTooltip][modifier|E]。\n解锁[single_combat_duel|E]招式。\n#F 允许你大睁你的第三只眼并注入大量的内气，进而生成一片强力的护卫光壁。#!"
 SPIRIT_EATING_PERK_EFFECT: "允许让目标重获失去的心法等级，让目标获得反向性格特质，或以心法等级为代价（除非你信仰接纳吸榨）吞噬目标的灵魂来提升教育特质等级或属性。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你将目标的灵魂从躯体内移除，来治愈或者抚慰目标的创痛，或直接吞咽受害者的灵魂。#!"
 SCRUTINIZE_PERK_EFFECT: "作为[character_interaction|E]，允许你使所有针对你的计谋暴露。\n[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 允许你使用此项能力探测自己或他人内心的黑暗。#!"
 CLEAVE_THE_DEMON_PERK_EFFECT: "解锁一项操纵心魔选项，允许给予自己[GetModifier('POD_cleave_the_demon_modifier').GetNameWithTooltip]。\n#F 允许你分离自身的魂魄，让其中之一掌控身体而另一游离身外。#!"
 LASH_THE_DEMON_PERK_EFFECT: "作为[character_interaction|E]，允许你让目标遭受血狂或压力爆发。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_lash_the_demon_modifier').GetNameWithTooltip][modifier|E]。\n#F 允许你将其他鬼神与他们的黑暗面分开。#!"
 TWO_BECOME_ONE_PERK_EFFECT: "解锁一项操纵心魔选项，允许给予自己[GetModifier('POD_two_become_one_modifier').GetNameWithTooltip]。\n#F 允许你暂时将魂魄合二为一，随之而来的开悟会随着效果结束而消散，进而带来无限沮丧。#!"
 NO_MIND_PERK_EFFECT: "#F 通过一系列的冥想，鬼人将他的心神放空，将自己交由万物指引。#!"
 BLOOD_YOGA_PERK_EFFECT: "解锁避世冥想[decision|E]。\n#F 通过深度的冥想，万鬼将过往的噩梦挥之一空并以更快的速度恢复他的精神状态。#!"
 DISTANT_DEATH_KATA_PERK_EFFECT: "作为[character_interaction|E]，允许你根据自身勇武给予对方受伤特质。\n作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 通过全身心的放松发挥出一记全身全灵的攻击，神秘的直接将伤害传达至目标身上。#!"
 IRON_SOUL_PERK_EFFECT: "解锁一项操纵心神选项，允许给予自己[GetModifier('iron_soul_modifier').GetNameWithTooltip]。\n#F 完美驾驭自身的内在力量。#!"
 HARMONY_WITH_THE_ALL_PERK_EFFECT: "解锁一项操纵心神选项，允许给予自己[GetModifier('perfection_of_the_first_age_modifier').GetNameWithTooltip]。\n#F 允许你把意念投入宇宙轮回，溯回上古的[first_age|E]，于此状态下一举一动无有瑕疵不谐，任何行动都能下意识的完美达成。#!"
 EVALUATE_PERK_EFFECT: "作为[character_interaction|E]，允许你使所有针对你的敌对计谋失去进度。\n[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 允许你明确了解他人心神的状态，以此获得各种信息上的优势。#!"
 SOUL_BRIDGE_PERK_EFFECT: "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 允许你可以和他人建立稳定的心神链接。#!"
 AUTHORITY_PERK_EFFECT: "#F 允许你被他人敬畏甚至支配其，就如同臣子面对皇帝一般。#!"
 THOUSAND_HELL_STARE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n解锁投射负能量[character_interaction|E]。\n作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 允许你驾驭自身的负罪感，困惑，愤怒，饥饿并以将其灌入受害者的灵魂。#!"
 SOUL_SHACKLES_PERK_EFFECT: "解锁[GetScheme('PODsoulbond').GetTypeName][scheme|E]。\n#F 允许你达成持续性，甚至是永久性的心神链接。#!"
 BLACK_WIND_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#F 通过让心魔的狂怒贯穿全身，鬼人可以展现出非人的可怖速度——有如高速移动的破坏飓风。#!"
 DEMON_SHINTAI_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n解锁“魔体特征”变形选项。\n#F 每提升一级获得获得一格魔体特征槽。#!"
