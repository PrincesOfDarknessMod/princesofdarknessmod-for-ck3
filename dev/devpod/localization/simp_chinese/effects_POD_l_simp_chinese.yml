 BRAMBLES_ON_THE_ROAD_PERK_EFFECT:0 "解锁灵界界面的操纵绝壁选项。\n#F 通过此咒，仙龙可以操纵他周围的绝壁等级。#!"
 GHOST_WALKING_METHOD_PERK_EFFECT:0 "#F 当引用此咒时，仙龙会在选定的感官中变得无法被发现。#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT:0 "#F 有了此咒，天亲可以通过给目标的影子注入气来揭开隐藏的超自然生物的面纱，使其呈现出所有者的真实形态（半狼形形态代表变化妖怪，本相代表妖仙等等）。#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT:0 "#F 仙龙可以用气运包裹自己，给那些想伤害他的人带来厄运。#!"
 BLUR_THE_MIND_PERK_EFFECT:0 "#F 通过调用此咒，仙龙可以使他的受害者忘记最近发生在其附近的事件。#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT:0 "#F 通过这仪轨，仙龙可以创造出阻止妖魔和其他阎魔走狗进入一个区域的护身符。#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT:0 "#F 通过此仪轨，仙龙为第六纪元做好准备。#!"
 WHISPERING_STONES_PERK_EFFECT:0 "#F 用这仪轨，仙龙可以从大风暴中记录死者的记忆，以翻译未知或已灭绝语言的文件。#!"
 DEATH_TOUCH_PERK_EFFECT:0 "#F 只保留给最可怕的妖魔，传说中的点穴术使龙丹大师能够灾难性地扰乱单个目标的能量流动，只需一触就能使其残废或死亡。#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT:0 "#F 通过冥想放下所有的恐惧和怀疑，仙龙的内心平静甚至可以平息风暴，或者在风暴过于猛烈时创造一个保护性的 “气泡”。#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT:0 "作为[character_interaction|E]，允许你传送在指挥的军队。\n#F 有了这仪轨，仙龙可以将他的内气与附近的龙脉流动相调和，在花半时辰在龙穴内或龙脉边冥想后，于数秒到达另一龙穴。#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT:0 "获得[GetModifier( 'POD_shapeshift_form_godbody_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 天帝神体让人想起了万仙在堕落之前的威严，它将施咒者包围在一片银色的光晕中，照亮天亲的道路，给凡人带来了类似于雾迷的精神状态，并迫使受污染的超自然逃离。#!"
