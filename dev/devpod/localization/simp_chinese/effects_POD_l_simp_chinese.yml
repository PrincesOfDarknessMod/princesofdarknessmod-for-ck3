 SORCERER_DAGONS_CALL_PERK_EFFECT: "作为[character_interaction|E]，允许你根据自身勇武给予对方受伤特质。\n#F 在远距离对于你曾触碰过的人的心智造成伤害。#!"
 SORCERER_BAALS_CARESS_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 感知灵体存在#!"
 BLOOD_ESSENCE_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中有#P 20%#!的机会在敌方[knights|E]受伤或致残时杀死对方。\n#F 从一位已被放血且虚弱的目标体内抽取心头血。#!"
 WARRIOR_SCORPIONS_TOUCH_PERK_EFFECT: "当战争开始时，你的敌人中勇武最高的骑士将会受伤。\n#F 制造一种接触性毒药，可大幅削弱受害者的生理能力。#!"
 WARRIOR_DAGONS_CALL_PERK_EFFECT: "作为[character_interaction|E]，允许你根据自身勇武给予对方受伤特质。\n#F 在远距离对于你曾触碰过的人的身体造成伤害。#!"
 WARRIOR_BAALS_CARESS_PERK_EFFECT: "强化“蝎子”技能：战争开始时，敌方勇武值最低的两名骑士将受伤\n#F 制造一种毒药，可以涂抹在武器上，使其更具杀伤力。#!"
 QUICKEN_THE_MORTALS_BLOOD_PERK_EFFECT: "当吸血时，你以两倍的效率缓解饥渴。\n#F 吸血时获得双倍的血。#!"
 CLEANSED_IN_BLOOD_PERK_EFFECT: "作为[character_interaction|E]，允许移除目标的变身。\n#F 净化一个人受到的的心理和情感影响，包括诅咒和其他魔法效果。#!"
 FREE_DAGONS_CALL_EFFECT: "增强大衮的呼唤[character_interaction|E]，现在其将不再花费虔诚。"
 AURA_ABSORPTION_PERK_EFFECT: "作为[character_interaction|E]，允许你重置对方的共鸣。\n#F 移除一件物体的共鸣#!"
 RIDDLE_PHANTASTIQUE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('riddle_phantastique_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 说出谜语，让人们无法做其他事，只能坐下来细思其意。#!"
 STONE_TRAVEL_PERK_EFFECT: "作为[character_interaction|E]，只要地形允许，你就能传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 吸血鬼能够在地下隧穿。#!"
 STEAL_THE_MIND_PERK_EFFECT: "作为[character_interaction|E]，允许你暂时移除对方的属性。\n#F 暂时移除受害者的记忆和知识。#!"
 ABSORB_THE_MIND_PERK_EFFECT: "作为处决选项，允许你吞噬对方的心智来增强教育等级。\n#F 永久的将受害者的能力拿给自己。#!"
 BASILISKS_TOUCH_PERK_EFFECT: "作为[character_interaction|E]，允许你将目标变成石像。\n#F 通过接触将受害者化为石头#!"
