 KAI_ELDER_1_PERK_EFFECT: "血脉喷涌的[prowess|E]变体效果额外增加5点勇武。\n#F 将血气贯注战斗时会陷入眩晕般的忘我境界，以符合真正大名身份的荣耀与狂暴作战#!"
 KAI_ELDER_2_PERK_EFFECT: "获得一个决议，可从以下选项中解锁一支新的[men_at_arms|E]兵士：\n$BULLET_WITH_TAB$[GetMaA('POD_ronin_hatamoto').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_ronin').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki_riders').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka_riders').GetName]\n#F 汝之血脉本身即会引发类似大名律法的效果，当这种力量聚焦于特定武技流派——尤其是该流派发源之本时，将对凡人产生异常显著的影响：不仅会促使他们掌握发源地的本土战斗风格，更能赋予超自然战力，并在战斗中向汝致敬。#!"
 KAI_ELDER_3_PERK_EFFECT: "赋予强大的精神防御\n#F 凭借意志之力，汝可战斗至最后一息；当心智专注时，能轻易抵御一切精神欺诈。#!"
 KAI_ELDER_4_PERK_EFFECT: "自伤并献祭一名被囚禁家族成员或血仆，尝试击杀目标。若目标具备防御能力，则改为造成重伤。\n#F 撕裂自身部分力量，配合血裔生命力的献祭，可发动跨越数百公里的致命打击，此击必将追踪并毁灭目标。#!"
 KAI_ELDER_5_PERK_EFFECT: "解锁针对敌方指挥官的破坏性互动\n#F 释放无穷血浪追击指定目标，被血浪困锁者将遭遇军队调动与补给的重创。#!"
 KAI_ELDER_6_PERK_EFFECT: "强化绯红风暴互动效果\n#F 汝之血浪现可聚合成具有海啸般恐怖威势的毁灭性打击。#!"
