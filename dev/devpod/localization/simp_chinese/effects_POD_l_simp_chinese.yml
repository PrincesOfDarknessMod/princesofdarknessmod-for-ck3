 TARGET_GAINED_A_FAITH_LIFESTYLE_PERKPOINT:1 "[CHARACTER.GetShortUIName]获得了$VALUE|V0$[faith_lifestyle|E][perk|E]点数"
 TELEPATHY_PERK_EFFECT:0 "你能使用心灵感应[character_interaction|E]来搜找秘密。\n\n#flavor 具有最高级别的观占术时，吸血鬼可以真正的读心，以及投射他们自己的思想到别人的思想内。#!"
 DOMINUS_VOBISCUM_PERK_EFFECT:0 "通过[character_interaction|E]，你可以祝福另一位角色以暂时提升他的属性。"
 INTERCESSION_PERK_EFFECT:0 "通过[character_interaction|E]，你可以给予另一位角色虔诚，并有很小的机会赐予他真信特质。"
 HOLY_BULWARK_PERK_EFFECT:0 "你现在不受任何形式的精神能力的影响。"
 LAY_OF_HANDS_PERK_EFFECT:0 "通过[character_interaction|E]，你可以治愈大多数伤病。"
 PENANCE_PERK_EFFECT:0 "通过[character_interaction|E]，你可以选择一位吸血鬼以诅咒其，造成属性减益。"
 CONVERSION_PERK_EFFECT:0 "作为[decision|E]，你可以立即将自己的国家转化为你的信仰，但要付出高昂的虔诚代价。"
 CORROSIVE_VITAE_PERK:0 "让你在掩盖潜藏[character_interaction|E]中拥有更好的选项。"
 A_TASTE_OF_BLOOD_PERK:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 CLOUD_MEMORY_PERK:0 "你解锁让人们遗忘特定事件的选择。"
 MESMERIZE_PERK:0 "你将解锁绑架计谋。此外，你将在催眠计谋中获得以各种方式指挥他人的能力。"
 THE_FORGETFUL_MIND_PERK:0 "让你在掩盖潜藏[character_interaction|E]中拥有更好的选项。这也启用能使受害者得到特定精神错乱的[character_interaction|E]。此外，你可以改变你的牧群和血仆的单个性格特质，并锁定你对手对你秘密的记忆。"
 SUBMERGED_DIRECTIVE_PERK:0 "你谋杀计谋招募同谋的接受率上升。你的支配术牵制能持续更长时间，使你能在更后发布命令。"
 MASS_MANIPULATION_PERK:0 "能够招募[GetMaA('maniacs').GetName]作为[men_at_arms|E]。"
 SHADOW_CLOAK_PERK:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 OBLIVIONS_SIGHT_PERK:0 "通过[character_interaction|E]，你可以命令死灵对抗其他角色。"
 TOUCH_OF_OBLIVION_PERK:0 "通过[character_interaction|E]，你可以缚灵。"
 SHADOW_PERSPECTIVE_PERK:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT:0 "掌握到这一阶段，你已经进步到能控制骨头了。单独使用“骨架重塑”就可以对目标造成可怕的伤害。当与皮肉重塑同时使用时，将能把噩梦变为现实。"
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT:0 "通过[character_interaction|E]，你可以变形成可怖的祖罗形态，如同噩梦中出来般的八英尺高生物，布满鳞片和油腻的皮毛，像猿类一样的手臂上长着参差的黑甲，背脊上还长着一排笔直的棘刺。"
 DRAWING_OUT_THE_BEAST_PERK_EFFECT:0 "吸血鬼可以在血狂时将其心兽投射出去，将其转移到附近的目标身上，可以是凡人也可以是吸血鬼。"
 FERAL_WHISPERS_PERK_EFFECT:0 "吸血鬼可以与野外和城市的野兽交流，让吸血鬼可以说服动物为之服务，不过和人类一样，动物很少会同意违背它们本性或危害它们的事情。"
 QUELL_THE_BEAST_PERK_EFFECT:0 "通过盯住目标的眼睛，吸血鬼迫使他们内心的心兽暂时沉睡。"
 SENSE_THE_BEAST_PERK_EFFECT:0 "吸血鬼能够感知到在凡人，吸血鬼，以及其他超自然生物中的心兽存在，获得对其等的天性，饥渴以及敌意的认知。"
 SUBSUME_THE_SPIRIT_PERK_EFFECT:0 "吸血鬼可以将自己的思想完全转移到动物的体内。他们可以控制动物，自由使用它的感官，即使在平常天也能保持清醒。"
 CLAIRVOYANCE_PERK_EFFECT:0 "你的囚犯从你的监狱成功逃跑的概率更低。\n\n#flavor 通过闭上眼睛，进入一种轻微的恍惚状态，吸血鬼将能掌握它周围环境。#!"
 HEIGHTENED_SENSES_PERK_EFFECT:0 "你的囚犯从你的监狱成功逃跑的概率更低。\n\n#flavor 吸血鬼的感官敏锐到超乎寻常的程度，使他们能够在漆黑的环境中看到东西，听到超声波频率，嗅到对畏缩的猎物的恐惧。#!"
 PREMONITION_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!。\n你的囚犯从你的监狱成功逃跑的概率更低。\n\n#flavor 吸血鬼的经验会能灵光闪现。这些可能会以愤怒、突发灵感甚至是生动的想象的形式出现。虽然这些幻象永远不会太精确，但它们可以让吸血鬼脱离危险，或者揭示以前被忽视的真相。#!"
 SCRY_THE_SOUL_PERK_EFFECT:0 "你可以选择“捕捉凡人”[character_interaction|E]捉到的凡人将拥有的共鸣类型。\n\n#flavor 通过专注于一个人，吸血鬼可以感知到那个人的精神状态，显现为一种变化的有色灵光。灵光揭示了很少的精确信息，但确实提供了许多大概的线索，例如，情绪状态，共鸣和超自然特征。#!"
 SENSE_THE_UNSEEN_PERK_EFFECT:0 "\n\n#flavor 吸血鬼的感官变得与超越世俗的维度相协调，允许他们感知肉眼看不到的存在。#!"
 SHARE_THE_SENSES_PERK_EFFECT:0 "\n\n#flavor 吸血鬼通过心灵接触，就能进入另一个凡人或吸血鬼的感官，看到、听到、感觉到他们的所作所为。#!"
 SPIRITS_TOUCH_PERK_EFFECT:0 "\n\n#flavor 通过触摸无生命物体或地面，吸血鬼可以感受到那些曾经触摸过那个物体或去过该地的人留下的情感残余，而善于理解者能从中获得提示。#!"
 BLINK_PERK_EFFECT:0 "解锁[character_interaction|E]以急速增加军队移动速度。\n\n#flavor 你现在的动作如此迅速，与敌人交战或逃跑都在眨眼之间，以至于对一个毫无准备的旁观者来说，你几乎像是在传送，一阵急促的风是你唯一留下的痕迹。#!"
 CATS_GRACE_PERK_EFFECT:0 "\n\n#flavor 你获得超自然的平衡和优雅，变得能够行走甚至横跨最纤细的壁架和支撑物。#!"
 FLEETNESS_PERK_EFFECT:0 "\n\n#flavor 你对迅捷术的掌握，现在可以让你以令人目眩的速度来移动和反应。#!"
 LIGHTNING_STRIKE_PERK_EFFECT:0 "电光石火角色互动不再给予你受耗修正。\n\n#flavor 比双眼能捕抓到的速度更快，你可以用拳头或近战武器以如此之快的速度攻击对手，让对手无法自卫或采取规避行动。#!"
 RAPID_REFLEXES_PERK_EFFECT:0 "\n\n#flavor 虽然吸血鬼的身体仍然不能违背自然法则，但拥有这种能力的他们能瞬间感知事件，并能以超人的敏捷性做出反应。#!"
 SPLIT_SECOND_PERK_EFFECT:0 "电光石火角色互动不再给予压力。\n\n#flavor 以你超强感知的速度行动，伏击你的人将发现他们的猎物已经站在他们身后，恳求者请求的帮助在讲完之前就完成了。#!"
 TRAVERSAL_PERK_EFFECT:0 "\n\n#flavor 在一定的速度下，你可以沿着任何表面奔跑或攀爬，包括爬上墙壁，甚至穿越液体介质。#!"
 DEFY_BANE_PERK_EFFECT:0 "通过消耗一些能量，吸血鬼可以让自己暂时抵抗火和阳光，以及其他可能让他们陷入终焉之死的严重伤口。当使用坚韧时，吸血鬼在大型战斗中对致残有免疫力。"
 FLESH_OF_MARBLE_PERK_EFFECT:0 "血之力使吸血鬼的皮肤变强，呈现出大理石般的光泽，却仍然柔软，在短暂被打破再复原之前，几乎可以阻止任何打击。"
 FORTIFY_THE_INNER_FACADE_PERK_EFFECT:0 "这种力量可以让使用者保护自己的思想和情感不受超自然力量的窥探，而不是强化吸血鬼的身体结构。"
 PROWESS_FROM_PAIN_PERK_EFFECT:0 "解锁坚韧术[character_interaction|E]。伤害和损伤现在只会助长吸血鬼的力量，每受到一次打击、撕裂或撕扯，就会变得更强更快。"
 RESILIENCE_PERK_EFFECT:0 "被赋予了超自然的耐力，使用者的身体意志得到加强。"
 TOUGHNESS_PERK_EFFECT:0 "解锁坚韧术[character_interaction|E]。所有拥有这种能力的吸血鬼都有一种天生才能，可以忽略那些会给他们带来不方便甚至残疾的伤害。有了这技能，你将能够湿化伤口，用血来防止自己留伤。"
 UNSWAYABLE_MIND_PERK_EFFECT:0 "使用者获得了一种神秘的能力，可以抵抗任何通过世俗的魅惑、胁迫和诡计来左右他们的企图。"
 CLOAK_OF_SHADOWS_PERK_EFFECT:0 "\n\n#flavor 站在原地不动，使用者就会融入到周围的环境中。只要他们有某种掩护，不出声，不移动，那就只有机械或超自然的手段才能发现他们。#!"
 CLOAK_THE_GATHERING_PERK_EFFECT:0 "\n\n#flavor 吸血鬼可以将他们的同伴庇护在混淆之幕下。#!"
 IMPOSTORS_GUISE_PERK_EFFECT:0 "\n\n#flavor 只要做好准备，吸血鬼可以让自己变成任何体型和性别的特定个体。使用者必须仔细研究被模仿的对象。否则当遇到与被模仿对象非常熟悉的人时，这种伪装就失效了。#!"
 MASK_OF_THOUSAND_FACES_PERK_EFFECT:0 "\n\n#flavor 比起消失，使用这种能力的吸血鬼可以让自己以一个不起眼的陌生人的身份显现出来。一个预计会出现在该地区的人。#!"
 SILENCE_OF_DEATH_PERK_EFFECT:0 "解锁[character_interaction|E]以严重削减目标领主的外交范围。\n\n#flavor 这种力量会让使用者完全无声无息，让其发出的所有声音失效。与一般意义上的混淆术不同，这种能力只在听觉上起作用，但作为交换，它的作用更强大。吸血鬼需要制造出很大的声音来打破这种寂静。#!"
 UNSEEN_PASSAGE_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n\n#flavor 有了这个能力，吸血鬼现在可以移动的同时保持隐秘。#!"
 VANISH_PERK_EFFECT:0 "解锁[character_interaction|E]以阻止所有针对你的计谋。\n\n#flavor 吸血鬼似乎眨眼间就消失了，连对他们的记忆也变得模糊不清。#!"
 BRUTAL_FEED_PERK_EFFECT:0 "解锁[single_combat_duel|E]招式。\n\n#flavor 在短短几秒钟内，你在伤害你的受害者时吞下大量的鲜血。虽然混乱，但结果很有效。你现在可以在激烈的战斗中使用你的新进食方法，并且可以伪装尸体的咬伤。#!"
 EARTHSHOCK_PERK_EFFECT:0 "\n\n#flavor 你的力量含带有元素之力。你可以将拳头或脚砸向地面，产生冲击波来将对手击摔和击碎建筑物。#!"
 FISTS_OF_CAINE_PERK_EFFECT:0 "增加作战中重伤敌方骑士的几率。\n\n#flavor 你可以赤手造成严重地伤害，对凡人和其他吸血鬼都是致命的。你那双手还能肢解、刺穿、刺穿、斩首，甚至可以把心脏从胸腔里直接扯出来。#!"
 LETHAL_BODY_PERK_EFFECT:0 "增加作战中伤害敌方骑士的几率。\n\n#flavor 使用这种力量，你能够造成可怕地伤害，赤手空拳地撕开皮肤，捶断骨头。#!"
 PROWESS_PERK_EFFECT:0 "\n\n#flavor 有蛮力术的吸血鬼可以从血液中获得比没有蛮力术的吸血鬼强大得多的力量。#!"
 SOARING_LEAP_PERK_EFFECT:0 "\n\n#flavor 拥有比手臂和拳头更不圣洁的力量，你可以比任何凡人跳得更高更远。#!"
 UNCANNY_GRIP_PERK_EFFECT:0 "\n\n#flavor 将自身的非凡之力集于脚趾和手指，你的抓地力几乎能让你自己的四肢钻进到任何表面，使你能够攀爬，甚至挂在墙壁和天花板的不支撑点上。#!"
 AWE_PERK_EFFECT:0 "任何人只要看到吸血鬼就会莫名其妙地被他们吸引。那些听了吸血鬼的人可能会突然在一些他们曾经持有不同观点的问题上达成一致。\n\n启用交友计谋。"
 DAUNT_PERK_EFFECT:0 "吸血鬼使用“威仪术”来排斥人，而不是吸引他们。有了这种力量，使用者就会显得很有威胁性，并散发出强大的威严，足以让大多数凡人移开视线，就连其他吸血鬼也会对使用者三思而行。"
 DREAD_GAZE_PERK_EFFECT:0 "短暂地暴露他们的吸血鬼本样，使用者能向一个目标灌输究极的惊怖。"
 LINGERING_KISS_PERK_EFFECT:0 "吸血鬼的迷吻会让凡人产生近乎狂乐的感觉，但这种力量会把其他的迷吻留在尘土中。被吸血者吸食的人类会对迷吻上瘾，沉迷其中，甚至会寻找吸血鬼反复献食。\n\n当你猎食时，你可以选择把你的受害者加入你的牧群。"
 MAJESTY_PERK_EFFECT:0 "在该[discipline|E]的顶峰，吸血鬼可以把他们的脸色夸张到超自然的水平。威压气场达到神圣或地狱的等级。\n\n你在掩盖潜藏[character_interaction|E]中拥有更好的选项。"
 EARTH_MELD_PERK_EFFECT:0 "吸血鬼与土壤融为一体，沉入大地。除非陷入[torpor|E]，否则吸血鬼会在第二天晚上再次升起。"
 EYES_OF_THE_BEAST_PERK_EFFECT:0 "吸血鬼可以将一种超自然的红光射入他们的眼睛，即使在完全没有光的情况下也能让他们看到东西。"
 THE_UNFETTERED_HEART_PERK_EFFECT:0 "掌握了变形术的力量后，使用者的内在变得可塑，几乎是粘性的。心脏是吸血鬼精血和亡生的所在，它将在胸腔内自由地分离和移动，虽然动作很迟缓。"
 WEIGHT_OF_THE_FEATHER_PERK_EFFECT:0 "吸血鬼可以减少自身的有效质量和密度，使自己变得几乎毫无重量。"
 BLOODFORM_PERK_EFFECT:0 "使用高阶变幻术技巧，你可以立即转化成一池有知觉的精血。通过[character_interaction|E]，你现在可以变形为难以捉摸的鲜血形态。"
 MALLEABLE_VISAGE_PERK_EFFECT:0 "使用者可以用简单、美观的方式改变自己的身体。他们可以更高或更结实。他们可以通过重塑喉部来改变自己的声音或者采用新的肤色，眼睛颜色，头发等等。通过[character_interaction|E]，你可以调整你的脸，或你血仆的脸。"
 THE_BODY_IMPOLITIC_PERK_EFFECT:0 "可以说，这是世间最令人毛骨悚然的变幻术天赋，分肢而控允许使用者将他们的一部分知觉投入肉体，然后将其与躯干分离，让其执行他们的命令。[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT:0 "你可以进行突异的转变，不仅是对你自己，而且对任何你能控制足够长的时间来传达你的想象模样的事物。能够招募[GetMaA('szlachta').GetName]作为[men_at_arms|E]。"
 MERITOCRACY_LEGACY_1_PERK_EFFECT:0 "每位新裁判官还将有[GetTrait('strong').GetName( GetPlayer )]和[GetTrait('athletic').GetName( GetPlayer )]。\n\n#F 健全的心灵寓于强健的体魄。#!"
 MERITOCRACY_LEGACY_2_PERK_EFFECT:0 "每位新裁判官还将是更好的刀剑大师或猎人。\n\n#F 汝欲和平，必先备战。#!"
 MERITOCRACY_LEGACY_3_PERK_EFFECT:0 "每位新裁判官的教育等级还会额外加一。\n\n#F 知识就是力量。#!"
 MERITOCRACY_LEGACY_4_PERK_EFFECT:0 "每位新裁判官还会更有几率获得或提升正面天生特质。\n\n#F 所有人都将在同一级的地面上跪下。#!"
 MERITOCRACY_LEGACY_5_PERK_EFFECT:0 "每位新裁判官还会更有几率具有[GetTrait('truefaith').GetName( GetPlayer )]。\n\n#F 唱得好，等於加倍的祈祷。#!"
 UNITY_LEGACY_1_PERK_EFFECT:0 "当你在寻找巢穴计谋中选择军事或管理相关选项时，你将有更大的成功率。\n\n#F 协同圣光，我的朋友。#!"
 UNITY_LEGACY_2_PERK_EFFECT:0 "你将能更快地达成查找巢穴计谋。\n\n#F 人最应当的愉悦就是拯救人类。#!"
 UNITY_LEGACY_3_PERK_EFFECT:0 "\n\n#F 赠之乐胜于取之乐。#!"
 UNITY_LEGACY_4_PERK_EFFECT:0 "训练新学徒将会变得更有效。\n\n#F 作者因其作品而得名。#!"
 UNITY_LEGACY_5_PERK_EFFECT:0 "\n\n#F 没有比真理更强的力量。#!"
 VENTRUE_LEGACY_1_PERK_EFFECT:0 "解锁一个与其他梵卓交换牵制的特殊[character_interaction|E]。\n\n#F 卡米拉建立了[cainite|E]世界所知道的或将会知道的最伟大的帝国。梵卓[Clan|E]是从他真正开始的。#!"
 VENTRUE_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 斯巴达女神勇敢地冲进了迦太基的恐怖。梵卓[Clan|E]将永远纪念她的牺牲。#!"
 VENTRUE_LEGACY_3_PERK_EFFECT:0 "解锁特殊的强制[masquerade|E][character_interaction|E]。\n\n#F 梅敦的愚蠢死亡给梵卓上了宝贵的一课。不要轻视凡人。#!"
 VENTRUE_LEGACY_4_PERK_EFFECT:0 "\n\n#F 探险者从来没有真正满足过，因为世界就像她的漫游欲一样无止境。#!"
 VENTRUE_LEGACY_5_PERK_EFFECT:0 "\n\n#F 波斯将军在雷鸣般的投石机声中登上了神位。#!"
 SETITE_LEGACY_1_PERK_EFFECT:0 "$SNAKES_LEGACY_PERK_UNLOCK_DESC$\n\n#F 初子，最虔诚者，所有赛特之子的典范。#!"
 SETITE_LEGACY_2_PERK_EFFECT:0 "解锁[GetScheme('befriend').GetTypeName][scheme|E]。你将可以交到最多7个朋友（原本为5）。\n\n#F 在良好的陪伴下吃禁果并不羞耻。#!"
 SETITE_LEGACY_3_PERK_EFFECT:0 "\n\n#F 在赛特的怀中总有救赎，即使是最顽固的“血族”。#!"
 SETITE_LEGACY_4_PERK_EFFECT:0 "解锁[GetBuilding('founding_temple_01').GetName]特殊建筑。\n\n#F 沐浴在祂的荣耀中并祈祷，因为祂将回来救赎我们所有人。#!"
 SETITE_LEGACY_5_PERK_EFFECT:0 "\n\n#F 迷失的女儿，受诅咒者，大敌……她将面临业报。#!"
 BAALI_LEGACY_1_PERK_EFFECT:0 "\n\n#F 我就观看，见有一匹灰色马；骑在马上的，名字叫作“死”，阴府也随着他。#!"
 BAALI_LEGACY_2_PERK_EFFECT:0 "\n\n#F 我看见羔羊揭开七印中第一印的时候，就听见四活物中的一个活物声音如雷说：“你来！”#!"
 BAALI_LEGACY_3_PERK_EFFECT:0 "\n\n#F 我就观看，见有一匹黑马。骑在马上的手里拿着天平。#!"
 BAALI_LEGACY_4_PERK_EFFECT:0 "\n\n#F 我就观看，见有一匹白马。骑在马上的拿着弓，并有冠冕赐给他，他便出来，胜了又要胜。#!"
 BAALI_LEGACY_5_PERK_EFFECT:0 "\n\n#F 就另有一匹马出来，是红的，有权柄给了那骑马的，可以从地上夺去太平，使人彼此相杀，又有一把大刀赐给他。#!"
 GANGREL_LEGACY_1_PERK_EFFECT:0 "\n\n#F 崇高之父在看着，骄傲地看着，他的子嗣是如何勇敢又荣耀的面对诸神黄昏。#!"
 GANGREL_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 我与千万骑同在！我乃神降天灾！我将看着你的世界……焚烧。#!"
 GANGREL_LEGACY_3_PERK_EFFECT:0 "\n\n#F 血腥之母将完成复仇，该隐的子嗣将十倍地偿还他们的业债。#!"
 GANGREL_LEGACY_4_PERK_EFFECT:0 "解锁挑战其他角色进行决斗，以获得牵制的特殊[character_interaction|E]。\n\n#F 他哭了，因为已经不剩世界可以征服了。#!"
 GANGREL_LEGACY_5_PERK_EFFECT:0 "\n\n#F 被逼无奈的猛兽保护着她的群落，并以愤怒和不死的决心进行反击。#!"
 RAVNOS_LEGACY_1_PERK_EFFECT:0 "\n\n#F 慈祥的罗姆之母保护着她的人民，并赋予他们目标。#!"
 RAVNOS_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 一场永恒的战争需要一位永恒的将军。查古拉普夏就是那人。#!"
 RAVNOS_LEGACY_3_PERK_EFFECT:0 "解锁举行获得智慧的仪式的特殊[character_interaction|E]。\n\n#F 罗刹中的罗刹割了他的眼睛，好真正的看清。#!"
 RAVNOS_LEGACY_4_PERK_EFFECT:0 "\n\n#F 如果你住在埃及，就要像埃及人一样行事。#!"
 RAVNOS_LEGACY_5_PERK_EFFECT:0 "\n\n#F 受诅咒者、怪物、恶魔……是每位雷伏诺那未曾跳动的心里暗藏的恐怖。#!"
 CAPPADOCIAN_LEGACY_1_PERK_EFFECT:0 "解锁将你的子嗣作为议员派到其他统治者那里的特殊[character_interaction|E]。\n\n#F 忠诚的儿子隐藏了他的恐惧，但为即将到来的最坏情况做好准备。#!"
 CAPPADOCIAN_LEGACY_2_PERK_EFFECT:0 "解锁雇佣拉米亚保镖特殊[character_interaction|E]。\n\n#F 黑暗之母隐藏着只有她的女儿们才能真正理解的秘密。#!"
 CAPPADOCIAN_LEGACY_3_PERK_EFFECT:0 "\n\n#F 被遗弃和遗忘的卡帕多西亚掌权分支有一天会戴上面具。#!"
 CAPPADOCIAN_LEGACY_4_PERK_EFFECT:0 "\n\n#F 早在君士坦丁踏入城市拜占庭之前，它就已经是一座幻梦之城。#!"
 CAPPADOCIAN_LEGACY_5_PERK_EFFECT:0 "\n\n#F 叛逆的儿子知道了真相，为了一个目的联合了家族对抗他。#!"
 BRUJAH_LEGACY_1_PERK_EFFECT:0 "\n\n#F 斯巴达的国王就像他那冰冷的矛尖一样冷酷无情。除了在涉及一位特殊的特洛伊人时。#!"
 BRUJAH_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 他近乎把迦太基从毁灭中拯救出来。布鲁赫记住了他的胜利，也哀悼他的失败。#!"
 BRUJAH_LEGACY_3_PERK_EFFECT:0 "解锁绑架计谋，解锁与布鲁赫骑士组成部伍的特殊[character_interaction|E]。\n\n#F 高贵的亡命之徒将用剑、弓和智慧击败暴君和国王。#!"
 BRUJAH_LEGACY_4_PERK_EFFECT:0 "\n\n#F 要真正了解拜占庭的官僚体系，你需要一位俄罗斯公主。#!"
 BRUJAH_LEGACY_5_PERK_EFFECT:0 "\n\n#F 第一叛徒为她的乌托邦努力奋斗，但在罗马到来之前，迦太基早已沦陷。#!"
 TZIMISCE_LEGACY_1_PERK_EFFECT:0 "\n\n#F 亡者不关心道德。你会做的。#!"
 TZIMISCE_LEGACY_2_PERK_EFFECT:0 "\n\n#F 黑夜中的贵族带着棘秘魑[Clan|E]的可怕传承。#!"
 TZIMISCE_LEGACY_3_PERK_EFFECT:0 "\n\n#F 恐怖和怪物从肉坑中走出来，准备夺回棘秘魑的生有权。#!"
 TZIMISCE_LEGACY_4_PERK_EFFECT:0 "\n\n#F 圣灵已经升天，在他身后只留下废墟。#!"
 TZIMISCE_LEGACY_5_PERK_EFFECT:0 "解锁[GetBuilding('sanctuary_of_flesh_01').GetName]特殊建筑。\n\n#F 入此处者……将永远无法离开。#!"
 TREMERE_LEGACY_1_PERK_EFFECT:0 "解锁制造石像鬼角色的[decision|E]。\n\n#F 当你为你的生存而战时，必须做出牺牲。大量的牺牲。#!"
 TREMERE_LEGACY_2_PERK_EFFECT:0 "\n\n#F 唯一赢得睿魔尔尊重的女人是“金字塔”的必要基础。#!"
 TREMERE_LEGACY_3_PERK_EFFECT:0 "\n\n#F 在“金字塔”中，你们都有一个用处和一个位置。低于更优于你者。#!"
 TREMERE_LEGACY_4_PERK_EFFECT:0 "\n\n#F 她爱她的造物，它们也爱她作为回报。“金字塔”很快就会战栗。#!"
 TREMERE_LEGACY_5_PERK_EFFECT:0 "\n\n#F 学习和智慧是经常被遗忘的成为一位真正的睿魔尔魔法师的品质。#!"
 TOREADOR_LEGACY_1_PERK_EFFECT:0 "\n\n#F 艺术和堕落对某些人来说是一体的。#!"
 TOREADOR_LEGACY_2_PERK_EFFECT:0 "\n\n#F 特洛伊人将得到她的报复，即使世界必须提前焚烧。#!"
 TOREADOR_LEGACY_3_PERK_EFFECT:0 "\n\n#F 大天使失去了他的思想，世界失去了他最后的希望。黑暗时代将永远不会结束。#!"
 TOREADOR_LEGACY_4_PERK_EFFECT:0 "\n\n#F 小心被蔑视的女人，因为她的怒火永远不会结束。#!"
 TOREADOR_LEGACY_5_PERK_EFFECT:0 "解锁传播关于目标的虚假谣言的特殊[character_interaction|E]。\n\n#F 最不可能的英雄可以在最不可能的地方被找到。#!"
 SALUBRI_LEGACY_1_PERK_EFFECT:0 "\n\n#F 她的复仇是一个可怕的景象，但没有火是永久燃烧下去的。#!"
 SALUBRI_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 萨洛比之剑永不知道失败，即使死亡。#!"
 SALUBRI_LEGACY_3_PERK_EFFECT:0 "为宗族解锁种性机制。\n\n#F 当世界在她周围焚烧的时候，她将高歌。也许这就足够了。#!"
 SALUBRI_LEGACY_4_PERK_EFFECT:0 "\n\n#F 聪慧的已经在战争来临的时候就准备好避难所了。#!"
 SALUBRI_LEGACY_5_PERK_EFFECT:0 "减少60%的圣战花费。\n\n#F 叛徒从未面对制裁，并笑到了最后。对于一位坏掉的男人来说，这是一场痛苦的胜利。#!"
 LASOMBRA_LEGACY_1_PERK_EFFECT:0 "\n\n#F 被忌讳的女儿策划着她的复仇。对付阴影，她将使用究极的火焰。#!"
 LASOMBRA_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 暗影再征服将取得成功，但其最终的胜利者可能不是显而易见的那位。#!"
 LASOMBRA_LEGACY_3_PERK_EFFECT:0 "\n\n#F 诚然，最仁慈者甚至超越了死亡。#!"
 LASOMBRA_LEGACY_4_PERK_EFFECT:0 "\n\n#F 为谋划而谋划，本身就是一种艺术形式。#!"
 LASOMBRA_LEGACY_5_PERK_EFFECT:0 "\n\n#F 君士坦丁堡受到了惨痛的报复，只因威尼斯与她一同烧毁了。#!"
 BANUHAQIM_LEGACY_1_PERK_EFFECT:0 "\n\n#F 隐藏在秘密面纱之后，哈基姆圣裔带来的恐惧远远超出其中东边界。#!"
 BANUHAQIM_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 不败者将更上一层。即使死亡也不会偷走他的荣誉。#!"
 BANUHAQIM_LEGACY_3_PERK_EFFECT:0 "\n\n#F 如果没有同龄者的支持，成为最长者并没有什么意义。#!"
 BANUHAQIM_LEGACY_4_PERK_EFFECT:0 "\n\n#F 迦太基人的叛徒仍然在夜里游荡，是所有真正的哈基姆圣裔的耻辱。#!"
 BANUHAQIM_LEGACY_5_PERK_EFFECT:0 "\n\n#F 黑牧人将净化这不值者的大地。这是即将末日的这一世界的唯一救赎。#!"
 MALKAVIAN_LEGACY_1_PERK_EFFECT:0 "\n\n#F 末日的预言者很少受到欢迎，但往往说的是正确的。#!"
 MALKAVIAN_LEGACY_2_PERK_EFFECT:0 "解锁“借用”技能的特殊[character_interaction|E]。\n\n#F 最后一位真正的末卡维亲王勇敢地与迦太基的恐怖进行了斗争，赢得了所有人的尊重。#!"
 MALKAVIAN_LEGACY_3_PERK_EFFECT:0 "解锁如果另一个统治者有任何末卡维的廷臣，就可以削弱其计谋阻力的特殊[character_interaction|E]。\n\n#F 我在说谎？你在说谎？世 界 在 说 谎 ？！#!"
 MALKAVIAN_LEGACY_4_PERK_EFFECT:0 "\n\n#F 只是和我的廷臣们的头们一起吃一顿漂亮的、花哨的晚餐。#!"
 MALKAVIAN_LEGACY_5_PERK_EFFECT:0 "\n\n#F 当你一开始就没有灵魂的时候，把你的灵魂卖给恶魔还会是坏事吗？#!"
 NOSFERATU_LEGACY_1_PERK_EFFECT:0 "允许没有结婚就能结成同盟。\n\n#F 骄傲的怪物站在高处，对抗夜晚的恐怖，将他的[Clan|E]提升到更高的高度。#!"
 NOSFERATU_LEGACY_2_PERK_EFFECT:0 "为所有具有军事教育的宗族成员解锁特殊指挥官特质。\n\n#F 中东的上古者都比不上塔利克成熟的技能和不死的信念。#!"
 NOSFERATU_LEGACY_3_PERK_EFFECT:0 "\n\n#F 丹麦是由阿布萨隆打造的，也是为阿布萨隆打造的，而并将由他来解体。#!"
 NOSFERATU_LEGACY_4_PERK_EFFECT:0 "\n\n#F 愤怒和仇恨是糟糕的谋士，但却是心兽的最佳燃料。#!"
 NOSFERATU_LEGACY_5_PERK_EFFECT:0 "\n\n#F 小祖母是唯一的、可怕的、对抗更可怕的恐怖的希望。#!"
