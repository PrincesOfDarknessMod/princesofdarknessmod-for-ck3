 ENCHANTING_GAZE_PERK_EFFECT: "#flavor 这项力量使得吸血鬼成为谚语中吸引飞蛾的光火。其展现一种诱人而迷魂的特质，例如毒蛇的黄金之眼，或者让自己的肌肤焕发珍珠光泽。其能仅凭一瞥麻痹目标，周围所有的凡人都衷心地被其吸引。#!"
