 FLOOD_OF_WICKEDNESS_PERK_EFFECT: "#F 即使是那些积极学习或修炼心魔的[GetTrait('kueijin').GetName( GetNullCharacter )]，也会暗自害怕心魔。心魔夺权，哪怕是暂时夺权，也意味着失去控制，意味着屈服于自己最野蛮的本性和欲望。然而，一些强大的恶鬼已经学会了如何驾驭他们的心魔，这样他们就能比一般的[GetTrait('kueijin').GetName( GetNullCharacter )]更容易地释放心魔，从而更好地利用它的力量。#!"
 YOMI_PORTAL_PERK_EFFECT: "能够招募[GetMaA('generic_servitor').GetName]作为[men_at_arms|E]。\n#F 到了这级别，阎魔会赋予恶鬼召唤和束缚[UmbraGlossaryLocalized('yomi_wan','幽冥')]界生物的力量。这为恶鬼提供了宝贵的仆从、刺客和恐怖部队。#!"
 GIFT_OF_PO_PERK_EFFECT: "能够招募[GetMaA('chih_mei').GetName]作为[men_at_arms|E]。\n每次杀人获得#V 2#!阴气。\n#F 当恶鬼催动这种力量时，他会呼唤阎魔或他的恶魔导师，让他们从[UmbraGlossaryLocalized('yomi_wan','幽冥')]界赐予他纯粹的魄。然后，他可以用这些灵魂创造仆人，或者干脆吞噬它们以获取力量。#!"
 THE_RED_BRIDGE_PERK_EFFECT: "[umbra_aptitude|E]：$pod_grace_i$#P +100%#!\n允许直接通过碎镜。\n#F 有时，阎魔希望他们在中原最强大的仆人前来拜访他们并向他们效忠。如果是这样，他们就会赐予他们这力量，让他们打开通往[UmbraGlossaryLocalized('yomi_wan','幽冥')]界的大门——以及在那里生存的方法。#!"
