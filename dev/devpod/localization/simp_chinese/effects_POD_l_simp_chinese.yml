 A_THOUSAND_CUTS_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 这种能力使你能够集中你的形魄，使你在战斗中成为名副其实的旋风。你的手臂模糊不清；你的脚步快如闪电；你可以多次攻击一个（或多个）目标，其几乎没有办法躲避打击。#!"
 TREADING_THE_TIDE_DRAGONS_BACK_PERK_EFFECT: "#F 允许你移动的如此之快，以至于可以跑过水面而不落入水中。#!"
