 THE_RE_EMBRACE_PERK_EFFECT: "作为[character_interaction|E]，将一名吸血鬼囚犯重新初拥至你的$pod_clan$，且不改变其[Glossary('世代','game_concept_vampgeneration_desc')]\n#flavor 当“再初拥”被触发时，尊长扼住准子嗣的喉咙，将其血液注入四个刻有古老恶魔符文的碗中。尊长随后将自己的血液注入另外四个碗，围绕子嗣交替摆放。当子嗣躺在地上，濒临最终死亡时，尊长召唤血系最强大恶魔——纳姆塔尔的灵魂碎片，将其与子嗣的灵魂融合，腐化其灵魂并使其更接近巴力。#!"
 SPEW_WIDE_THE_PIT_PERK_EFFECT: "死亡时，为你所在的[duchy|E]内所有[counties|E]施加[GetModifier('spew_wide_the_pit_modifier').GetNameWithTooltip]，持续100年。\n#flavor 巴力牺牲自己，使一位上古之神得以降临世间。#!"
