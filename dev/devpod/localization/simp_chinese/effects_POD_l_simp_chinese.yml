 ENCHANTING_GAZE_PERK_EFFECT: "#flavor 这项力量使得吸血鬼成为谚语中吸引飞蛾的光火。其展现一种诱人而迷魂的特质，例如毒蛇的黄金之眼，或者让自己的肌肤焕发珍珠光泽。其能仅凭一瞥麻痹目标，周围所有的凡人都衷心地被其吸引。#!"
 SERPENTS_FLESH_PERK_EFFECT: "作为[shapeshift|E]选项，获得[GetModifier('POD_shapeshift_form_serpents_flesh_modifier').GetNameWithTooltip]。\n#flavor 凭借此力量，吸血鬼的血肉会变得如皮革般坚韧、覆盖鳞片、滑腻或呈现其他怪物特征。她的身体变得柔韧可塑，并且更难受到伤害。#!"
 TYPHONIC_MAW_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#flavor 吸血鬼的下颌变得凶暴多变，其可以以许多方式控制它。其的颌膨胀至胸，其尖牙长如短匕，其的舌尖段分叉，足有一米之长，只要其的嘴鞭长可及，其的喉亦可以吞吃一切。#!"
 MASTER_OF_SNAKES_PERK_EFFECT: "允许招募[GetMaA('snakes').GetName][men_at_arms|E]。"
 SMOOTH_SCALES_PERK_EFFECT: "将[GetPerk('serpents_flesh_perk').GetName(GetPlayer)]的效果提升为[GetModifier('POD_shapeshift_form_smooth_scales_modifier').GetNameWithTooltip]。"
 FORM_OF_THE_SNAKE_PERK_EFFECT: "作为[shapeshift|E]选项，变形为[GetModifier('POD_shapeshift_form_snake_modifier').GetNameWithTooltip]或[GetModifier('POD_shapeshift_form_giantserpent_modifier').GetNameWithTooltip]。"
 TYPHONIC_AVATAR_PERK_EFFECT: "作为[shapeshift|E]选项，变形为[GetModifier('POD_shapeshift_form_typhonic_avatar_modifier').GetNameWithTooltip]。\n#flavor 吸血鬼能变身成提丰魔兽，传说生物。一只高大的胡狼耸立于大地之上，生有一条坚硬，分叉，多棘刺的尾，和平整的尖耳与长吻。提丰魔兽是赤红，玄黑或者二者之间的组合色。还有别的选择，它可以采取一种人蛇混合的形态，带着一条缠绕着的长尾代替双腿。除了宗教用途，还使用其作为“战争形态”。#!"
 SERPENT_EYES_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\n作为[shapeshift|E]选项，获得[GetModifier('POD_shapeshift_form_serpenteyes_modifier').GetNameWithTooltip]。\n#flavor 赋予吸血鬼传说中古蛇的催眠目光。吸血鬼的眼睛会变成金色，并带有巨大的黑色虹膜，角色周围的凡人会发现自己被其奇怪地吸引。一位凡人如果遇到吸血鬼催眠的目光，就会无法动弹。直到该角色把其的眼睛从受害者身上移开，该人会一直被冻结在原地。#!"
 MOTHER_OF_MONSTERS_PERK_EFFECT: "允许招募[GetMaA('serpentis_monsters').GetName][men_at_arms|E]。"
 FORM_OF_THE_STORM_PERK_EFFECT: "将[GetPerk('typhonic_avatar_perk').GetName(GetPlayer)]的效果提升为[GetModifier('POD_shapeshift_form_form_of_the_storm_modifier').GetNameWithTooltip]"
 ECHIDNAS_VENOM_PERK_EFFECT: "#flavor 在此等级，吸血鬼的牙咬会变得像致命毒蛇一样毒。#!"
 THE_HEART_OF_DARKNESS_PERK_EFFECT: "作为[character_interaction|E]，移除你自己的心脏，并获得[GetModifier('heart_of_darkness_modifier').GetNameWithTooltip]。\n#flavor 该血族举行了一场仪式，亲手掏出自己的心脏，从而变得更为寡情淡漠，且免疫$pod_diablerie$与木桩穿刺。#!"
 COBRA_FANGS_PERK_EFFECT: "#flavor 吸血鬼的獠牙变得有毒。#!"
 APOPHIS_PERK_EFFECT: "将[GetPerk('typhonic_avatar_perk').GetName(GetPlayer)]的效果提升为[GetModifier('POD_shapeshift_form_apophis_modifier').GetNameWithTooltip]"
 HEART_THIEF_PERK_EFFECT: "你现在可以通过密谋从其他角色那里偷取心脏，或通过简单的[character_interaction|E]从囚犯处获取。一旦你掌握了某人的心脏，便能轻易将其杀死或迫使其陷入蛰眠。"
 TEMPTATION_PERK_EFFECT: "#flavor 吸血鬼变得极难抵抗。#!"
 BREATH_OF_THE_BASILISK_PERK_EFFECT: "#flavor 吸血鬼可以呼出具有毒性和腐蚀性的雾气。#!"
 GODHEAD_PERK_EFFECT: "作为[shapeshift|E]选项，变形为[GetModifier('POD_shapeshift_form_godhead_modifier').GetNameWithTooltip]。\n#flavor 这种可怕的能力使吸血鬼披上了神祇的外衣。虽然大多数赛特信徒通过显现类似埃及众神的兽首来施展此能力，但每位吸血鬼显现神首形态的方式各不相同。有的身高增长一米，有的化出金光闪耀的肌肤。无论显现为何种形态，总是显而易见，总是令人敬畏。#!"
 BLESSING_OF_VITALITY_PERK_EFFECT: "你的耐力血剂赋予你更多的非自然修复力，在耐力血剂持续时，给予你选择的目标坚韧增益。"
 KNIGHTS_BANE_PERK_EFFECT: "添加决斗动作，用你的肉体摧毁你的对手的武器，在这个过程中对他们造成伤害。"
 CURSE_THE_LAUREL_PERK_EFFECT: "#flavor 将尖桩从你的心脏上移开，最终将它移走。#!"
 WRATH_OF_THE_MARTYR_PERK_EFFECT: "增加你从痛苦中汲取的力量，即增强伤痛之力修正。"
 ARMOURED_FLESH_PERK_EFFECT: "#flavor 再多的伤口也不会结束你的生命，除非彻底毁灭或斩首。#!"
 RESILIENT_MIND_PERK_EFFECT: "解锁新的坚韧术[character_interaction|E]。\n#flavor 你的心智摆脱了丧心病狂和兽性的怪癖，同时变得对改变思想的力量有抵抗力。#!"
 same_o_higher_dharma_header: "@warning_icon!#X 只有具有相同或更高[Glossary('心法','podgloss.dharma')]等级才能点这个技能#!"
