l_simp_chinese:
 hunter_faction: "裁判所的镇压"
 hunter_faction_desc: "有着太多的暴露和太少的控制力的超自然领主会有吸引裁判所的注意的风险。"
 hunter_faction_short_effect_desc: "将要将你的子民从……嗯，从你那里解放。"
 hunter_faction_every_county: "每个在派系中的伯爵领"
 FACTION_DEMAND_HUNTER: "到[ROOT.Char.Custom('InsultAdjective')][ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_HUNTER_DESC: "地狱衍体，我们发现了你对我们生活的干涉。从现在起，我们会更加积极地对抗你们的干涉。"
 FACTION_DEMAND_HUNTER_ACCEPT: "这将阻碍我在当地的影响力。"
 FACTION_HUNTER_NAME: "裁判行动"
 FACTION_HUNTER_TITLE_NAME: "裁判行动"
 hunter_faction_event_troops: "裁判将领"
 pod_factions.1103.t: "你被打败了！"
 pod_factions.1103.desc: "尽管你有协调一致的防御，但猎人已经占据了你的大部分领土，连根拔起你精心建立的权势网络。你的威望受到了严重的伤害，你的权威也陷于低谷。秃鹫在看着你……而猎人随时都可能会回来。你可以从这里爬走，但它会让你付出高昂的代价。因此，年长之倦是一个诱人的选择。时间是无关紧要的……"
 pod_factions.1103.a: "我会回来的"
 pod_factions.1103.b: "我还没完呢！"
 POD_factions_county_loss_modifier: "民众叛乱"
 POD_factions_county_loss_modifier_desc: "凡人们正在协调一致地抵制对该地区的影响。"