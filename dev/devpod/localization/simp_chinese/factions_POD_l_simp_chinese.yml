l_simp_chinese:
 hunter_faction:0 "裁判所的镇压"
 hunter_faction_desc:0 "有着太多的暴露和太少的控制的吸血鬼领主会有吸引裁判所的注意的风险。"
 hunter_faction_short_effect_desc:0 "将要将你的子民从……嗯，从你那里解放。"
 hunter_faction_every_county:0 "每个在派系中的伯爵领"
 FACTION_DEMAND_HUNTER:1 "到[ROOT.Char.Custom('InsultAdjective')][ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_HUNTER_DESC:0 "地狱衍体，准备滚回你所来的深渊吧。你对这个国家的可怜子民的邪恶控制现在结束了！"
 FACTION_DEMAND_HUNTER_ACCEPT:0 "我并不是很想跟那些猎人战斗……"
 FACTION_DEMAND_HUNTER_REFUSE:0 "滚！让我们在战斗中粉碎这些自以为荣的凡人吧！"
 FACTION_HUNTER_NAME:0 "裁判行动"
 FACTION_HUNTER_TITLE_NAME:0 "裁判行动"
 hunter_faction_event_troops:0 "裁判将领"
 pod_factions.1103.t:0 "你被打败了！"
 pod_factions.1103.desc:0 "尽管你有协调一致的防御，但猎人已经占据了你的大部分领土，连根拔起你精心建立的权势网络。你的威望受到了严重的伤害，你的权威也陷于低谷。秃鹫在看着你……而猎人随时都可能会回来。你可以从这里爬走，但它会让你付出高昂的代价。因此，年长之倦是一个诱人的选择。时间是无关紧要的……"
 pod_factions.1103.a:0 "我会回来的"
 pod_factions.1103.b:0 "我还没完呢！"