 lesson_gain_sekhem_basic:0 "获取塞赫"
 lesson_gain_sekhem_basic_desc:1 "你使用塞赫来施展你的赫考，而且不同木乃伊回复它的方式不同：[GetTrait('shemsuheru').GetName( GetPlayer )]随着时间的推移而恢复（若你在[GetGeographicalRegion('pod_lands_of_faith').GetName]将1点/1月回复，否则将取决于你的玛阿特圣所等级，每一级提供25%的回复概率），[GetTrait('cabiri').GetName( GetPlayer )]则是通过对自己使用“普纽玛回复”[character_interaction|E]来激活自动回复，而[GetTrait('banemummy').GetName( GetPlayer )]则通过$EXECUTION_DEVOUR$选项处决[prisoners|E]获得。"
 lesson_gain_sekhem_advanced:0 "获取塞赫"
 lesson_gain_sekhem_advanced_desc:0 "在后期，你可以使用吸取塞赫[character_interaction|E]（通过[GetPerk( 'name_of_sekhem_perk' ).GetName( GetPlayer )]解锁）或通过灵界界面的前往阿蒙提进行回复。"
 action_reactive_advice_gain_resolve:0 "教程：获取决意"
