 reactive_advice_umbra: "灵界"
 action_reactive_advice_umbra: "教程：灵界"
 action_reactive_advice_umbra_desc: "打开此处了解如何使用影界界面。"
 action_reactive_advice_umbra_click: "$click_to_open_lesson$"
 lesson_umbra_1: "影界"
 lesson_umbra_1_desc: "影界，又称[spirit_world|E]，是物质世界的灵性镜像。它分为许多子界，每个子界都有自己的奇妙和危险。\n只有少数实体可以穿越这个空间，有些界域只对特定类型的个人（或拥有适当能力的人）开放。"
 lesson_umbra_2: "探索"
 lesson_umbra_2_desc: "你和你的宫廷可以探索的影界界域显示在灵界面板中。点击某个界域左下的空白加号，你就可以指派一名探员，他们的资质越高，探索速度就越快。\n完成探索后，可能会发现新的影界界域，也可能会开始一项发现，或根据界域的不同产生其他效果。"
 lesson_umbra_3: "发现"
 lesson_umbra_3_desc: "如果探员在影界中发现了特别有趣的事件，他们就会向你发出提示。你可以在第二个标签页中看到你当前的所有发现。发现可以导致探险（你亲自去调查值得注意的事情）或其他冒险机会。"
 lesson_umbra_4: "被动效果和行动"
 lesson_umbra_4_desc: "一些影界界域可以附加被动效果或行动。被动效果在界域名称下描述，而行动则在界域右下方的按钮上。"
