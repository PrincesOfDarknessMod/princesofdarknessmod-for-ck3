 lesson_gain_resolve:0 "获取决意"
 lesson_gain_resolve_desc:1 "决意是你恶魔能力的燃料，你可通过以下方式回复：显圣[character_interaction|E]，食罪[character_interaction|E]（通过[GetPerk( 'arcana_sin_eating_perk' ).GetName( GetPlayer )]解锁）或$EXECUTION_DEVOUR_SOUL$处决选项。"
 action_reactive_advice_gain_pathos:0 "教程：获取执念"
 action_reactive_advice_gain_pathos_desc:1 "你有数种方法来回复执念。打开此处了解详情。"
 action_reactive_advice_gain_pathos_click:0 "$click_to_open_lesson$"
 lesson_gain_pathos:0 "获取执念"
 lesson_gain_pathos_desc:1 "执念是你冥法能力的燃料，你可通过以下方式回复：完成炽情[decision|E]，吸取能量[character_interaction|E]（通过[GetPerk( 'incubus_perk' ).GetName( GetPlayer )]解锁），转入执念[character_interaction|E]（通过[GetPerk( 'pathos_conduit_perk' ).GetName( GetPlayer )]解锁）或熬炼遗器[character_interaction|E]（通过[GetPerk( 'render_relic_perk' ).GetName( GetPlayer )]解锁）。"
