 fetters_and_passions: "羁绊，炽情，以及[oblivion_pull|E]"
 lesson_fetters_and_passions: "羁绊，炽情，以及[oblivion_pull|E]"
 lesson_fetters_and_passions_desc: "首要须知[oblivion_pull|E]的存在，需督察者以防堕入[GetTrait('shadow').GetName(GetNullCharacter)]。每点未分配的[Fetter|E]都会导致每月额外承受1点[stress|E]，需通过[Fetters|E]来缓解。"
 fetters_and_passions2: "失去压力"
 lesson_fetters_and_passions2: "失去压力"
 lesson_fetters_and_passions2_desc: "$POD_splat_wraith_plural$只能通过触发执念来消除[stress|E]。不同[Fetter|E]类型有特定触发条件：如“憎恨”需实施谋杀后触发，“爱恋”则在指定角色存活期间每年触发。\n\n[Fetter|E]等级直接影响压力消除效率和执念获取量。"
 fetters_and_passions3: "精神崩溃"
 lesson_fetters_and_passions3: "精神崩溃"
 lesson_fetters_and_passions3_desc: "对于[GetTrait('wraith').GetName(GetNullCharacter)]而言，避免精神崩溃至关重要——每次崩溃都会强化[GetTrait('shadow').GetName(GetNullCharacter)]，并随机赋予使游戏难度增加的[thorn_lifestyle|E][lifestyle|E][perk|E]。\n当达到#N 精神崩溃等级2#!时，[GetTrait('shadow').GetName(GetNullCharacter)]将试图取代您的主体人格。若其成功，您将完全转化为黯影并承受相应后果。\n若恶化至#N 精神崩溃等级3#!，您的[GetTrait('shadow').GetName(GetNullCharacter)]将试图将您从存在中抹除。一旦成功，您将沦为[GetTrait('spectre').GetName(GetNullCharacter)]，游戏即告终结。"
 fetters_and_passions4: "冥法"
 lesson_fetters_and_passions4: "冥法"
 lesson_fetters_and_passions4_desc: "尽管在生者的世界感到不适，[GetTrait('wraith').GetName(GetNullCharacter)]并非毫无防备，因为他们掌握着[arcanoi_lifestyle|E]——亡者的力量。\n\n要使用这些能力，你需要先学习它们，有两种途径：一是向[friend|E]或其他友好关系的对象学习；二是在探索[umbra|E]时，遇到愿意传授你冥法的[GetTrait('wraith').GetName(GetNullCharacter)]。\n\n每项冥法都需要消耗执念来施展，而执念需要通过炽情获取（如前所述）。\n\n每掌握一项冥法，还会解锁带来额外加成的[domicile_building|E]。"
