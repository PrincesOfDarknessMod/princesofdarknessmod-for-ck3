 POD_coterieloc_redcap: "匪帮"
 POD_coterieloc_nagah: "蛇巢"
 POD_coterieloc_kitsune: "战队"
 POD_coterieloc_ratkin: "鼠群"
 POD_coteriename_camilla_tt: "塔尼特巴尔·萨哈尔指明了道路。即使帝国崩溃也无法动摇他们的信念。"
 POD_coteriename_mithras_tt: "他们是神钦点的选民，深得神的信任，甚至掌握着他的秘密。"
 POD_coteriename_alencourt_tt: "家庭纽带可以承受一切，甚至是死亡。"
 POD_coteriename_eon_tt: "信仰可以再等等，财富和名誉却不能。"
 POD_coteriename_sophoniba_tt: "迦太基消失了，突尼斯却在保护者的注视下蓬勃发展。"
 POD_coteriename_augustus_tt: "族长的左右手，伸向他渴望的秘密。"
 POD_coteriename_hardestadt_tt: "他们有着共同的目标，希望按照自己的形象重塑该隐之子世界。"
 POD_coteriename_julia_tt: "理想的开端，被遗物的魅力所连结。"
 POD_coteriename_jurgen_tt: "哈德施塔特之剑，常常希望摆脱它的束缚。"
 POD_coteriename_silent_fury_tt: "从乌合之众到反抗者，向这个无情的世界怒吼。"
 POD_coteriename_nordic_ventrue_tt: "“文明”的男男女女清洗了北方的旧神。"
 POD_coteriename_bar_sinister_tt: "被贪婪和小气所束缚，没有比自己更可怕的敌人。"
 POD_coteriename_ferals_livonia_tt: "是最后的英雄主义，还是难以想象的复兴？"
 POD_coteriename_redemption_tt: "克里斯托弗尔将他们团结在一起，即使他不在，也无法将他们分开。"
 POD_coteriename_andreas_tt: "一支由流亡者和不合群者组成的旅行队，在赛特仁慈的目光下团结在一起。"
 POD_coteriename_gabriella_tt: "君士坦丁堡在燃烧，一些拉丁人却试图灭火。"
 POD_coteriename_anadja_tt: "为成功而打扮，期待着登上谎言和恶意的宝座。"
 POD_coteriename_suleiman_tt: "最先听到他的话语并真正领悟的人。"
 POD_coteriename_erinyes_tt: "昔日的狂怒，让敌人不敢阻挡。"
 POD_coteriename_carnival_tt: "来者不拒。去者稀少。"
 POD_coteriename_fratres_tt: "他们团结一致，研究死亡和疾病的恐怖，并将其传播到所到之处。"
 POD_coteriename_red_thor_tt: "由于令人生畏的长船依然出航，维京时代将永远不会真正结束。"
 POD_coteriename_horus_tt: "复仇者的选民，捕杀任何地方的蛇。"
 POD_coteriename_leopold_tt: "被上帝眷顾的有功业的男女，将成为祂的卫士。或者成为殉道者。"
 POD_coteriename_field_tt: "粗鲁大胆的年轻狼族，有时会被他们的狂热蒙蔽双眼。"
 POD_coteriename_crescent_tt: "国度的英雄，注定不会真正消亡。"
 POD_coteriename_bright_tt: "尽管誓言几近破灭，但它依然顽强地存在着。"
 POD_coteriename_sun_glory_tt: "西欧最负盛名的战群，正在为受敬爱的头领的离去而苦苦挣扎。"
 POD_coterieloc_anarch: "团伙"
 POD_coterieloc_baali_hyron: "巢众"
 POD_coterieloc_baali: "会众"
 POD_leave_coterie_tt: "将不再是$POD_player_coterie$的成员"
 POD_coterieloc_spectre: "幽群"
 POD_coteriename_brugge_triumvirate: "#TOOLTIP:POD_coteriename_brugge_triumvirate_tt #L 布鲁日人文派#!#!"
 POD_coteriename_brugge_triumvirate_tt: "布鲁日的女士们以她们的安塔西亚导师为骄傲，为人民的自由而奋斗。"
 POD_coteriename_muses: "#TOOLTIP:POD_coteriename_muses_tt #L 君士坦丁堡的缪斯#!#!"
 POD_coteriename_muses_tt: "他们曾经爱他，追随他的脚步。现在，他们捍卫着对他的记忆。"
 POD_coteriename_rosae_crucis: "#TOOLTIP:POD_coteriename_rosae_crucis_tt #L 十字玫瑰#!#!"
 POD_coteriename_rosae_crucis_tt: "“虔诚亲王”既是炙手可热的导师，也是令人畏惧的敌人，他们既珍视自己的信仰，也珍视自己的独立性。"
 POD_coteriename_daughters_sun: "#TOOLTIP:POD_coteriename_daughters_sun_tt #L 太阳之女#!#!"
 POD_coteriename_daughters_sun_tt: "她们在母亲的疯狂中团结起来，等待并准备着母亲不可避免的光荣回归。"
 POD_coterietravel_gui_nodestination: "#X @warning_icon!目的地未设定。你发现了一个bug！请在Steam或Discord错误报告板块报告此错误。#!"
 POD_coterieloc_entomos: "虫群"
 POD_coterieloc_bastet: "狮群"
 POD_leave_coterie_recipient_tt: "将不再是[recipient.Custom('PODGetCoterieName')]的成员"
 POD_coteriename_leper_knights: "#TOOLTIP:POD_coteriename_leper_knights_tt #L 麻风骑士#!#!"
 POD_coteriename_leper_knights_tt: "自1204年以来，马拉希底斯信任的追随者们已经损失惨重。不过，他们的首领仍然在那里指引着他们，诺斯费拉图若没有忍耐力就什么也不是。"
 POD_coteriename_default_story: "[ROOT.Var('root_char').Char.GetFirstNamePossessiveNoTooltip]的[ROOT.Var('root_char').Char.Custom('PODCoterieNoTooltip')]"
 POD_edit_coterie_coa_tt: "点击来编辑$POD_player_coterie$的纹章"
 POD_coteriename_ashirra_trader: "#TOOLTIP:POD_coteriename_ashirra_trader_tt #L 暗夜之幔幕#!#!"
 POD_coteriename_ashirra_trader_tt: "阿布·法希姆·凯特布在阿什拉派的领地各地旅行行商，收集文物和信息，并将其发送至鹰巢和他的众多赞助人。"
 POD_coterie_concept: "[Concept('coterie',ROOT.Char.Custom('PODCoterieNoTooltip'))|E]"
 POD_coteriename_frankokratia: "#TOOLTIP:POD_coteriename_frankokratia_tt #L 法兰克人的统治#!#!"
 POD_coteriename_frankokratia_tt: "君士坦丁堡已跪倒在地，只需加上项圈便能彻底驯服。而阿丰佐乐于奉上这个项圈。"
 POD_coteriename_iskender: "#TOOLTIP:POD_coteriename_iskender_tt #L 伊斯坎德尔匪帮#!#!"
 POD_coteriename_iskender_tt: "尽管首领已死，伊斯坎德尔的同伴们仍试图践行其遗志。"
 POD_coteriename_kerberos: "#TOOLTIP:POD_coteriename_kerberos_tt #L 刻耳柏洛斯盟会#!#!"
 POD_coteriename_kerberos_tt: "恶魔恩纳马鲁的首批子嗣正试图通过扩张血系来增强其力量。"
 POD_coteriename_bayonne_triumvirate: "#TOOLTIP:POD_coteriename_bayonne_triumvirate_tt #L 巴约讷三头盟#!#!"
 POD_coteriename_bayonne_triumvirate_tt: "他们所作所为的恶果正在向巴约讷的统治者们逼近。"
 POD_coteriename_sower: "#TOOLTIP:POD_coteriename_sower_tt #L 黑暗之母的播种者#!#!"
 POD_coteriename_sower_tt: "如同黑暗之母所为，他们培育怪物来守护自己的“花园”。"
 POD_coteriename_house_goratrix: "#TOOLTIP:POD_coteriename_house_goratrix_tt #L 格拉崔克斯家族#!#!"
 POD_coteriename_house_goratrix_tt: "这是对抗埃特里乌斯及其支持者的联合阵线，为夺取睿魔尔氏族的领导权，他们不惜与恶魔交易。"
 POD_coteriename_nemausus: "#TOOLTIP:POD_coteriename_nemausus_tt #L 尼玛乌苏斯城邦议会#!#!"
 POD_coteriename_nemausus_tt: "这座奥古斯都时期的古城屡遭毁灭却依然繁荣，引来了该隐子嗣们不受欢迎的注目。"
 POD_coteriename_alexander: "#TOOLTIP:POD_coteriename_alexander_tt #L 流亡君王的扈从#!#!"
 POD_coteriename_alexander_tt: "流亡的君王仍是君王，如今比任何时候都更需要有人替他处理肮脏勾当。"
 POD_coteriename_rosamund: "#TOOLTIP:POD_coteriename_rosamund_tt #L 玫瑰花瓣#!#!"
 POD_coteriename_rosamund_tt: "法兰西最娇艳的花朵拥有忠诚的小型扈从团，确保她不会在绽放前被采摘。"
 POD_coteriename_bezariel: "#TOOLTIP:POD_coteriename_bezariel_tt #L 血染阴谋团#!#!"
 POD_coteriename_bezariel_tt: "贝撒列尔是操纵大师。作为俄罗斯最强大的恶魔，他向刚从深渊监狱脱身的“会友”们提供“庇护”。"
 POD_coteriename_flaying_monkeys: "#TOOLTIP:POD_coteriename_flaying_monkeys_tt #L 剥皮猴群#!#!"
 POD_coteriename_flaying_monkeys_tt: "披耶·帕永那不循规蹈矩的[Glossary('屋室','podgloss.wu')]是对中华守旧万鬼的羞辱，但对被其高效猎杀的[akuma|E]而言更为致命。"
 POD_coteriename_shiva_lingham: "#TOOLTIP:POD_coteriename_shiva_lingham_tt #L 湿婆林伽#!#!"
 POD_coteriename_shiva_lingham_tt: "暗夜三学士，致力于授业与求索智慧。"
 POD_coteriename_jervais: "#TOOLTIP:POD_coteriename_jervais_tt #L 热尔韦的消耗品#!#!"
 POD_coteriename_jervais_tt: "若他们胜利，塞奥里斯将独占功劳；若他们失败，塞奥里斯也绝不会落泪。"
 POD_coteriename_delta: "#TOOLTIP:POD_coteriename_delta_tt #L 远疆龙爪会#!#!"
 POD_coteriename_delta_tt: "迷失在无尽草原，朔风推着他们奔向未卜的前路"
 POD_coteriename_black_winds: "#TOOLTIP:POD_coteriename_black_winds_tt #L 黑风众#!#!"
 POD_coteriename_black_winds_tt: "草原猎巫人，目标远超凡人猎物。"
 POD_coteriename_golden_jade_wu: "#TOOLTIP:POD_coteriename_golden_jade_wu_tt #L 金玉社#!#!"
 POD_coteriename_golden_jade_wu_tt: "既得天下之心，何不求执掌天下之人？"
 POD_coteriename_horns_ice_wu: "#TOOLTIP:POD_coteriename_horns_ice_wu_tt #L 冰角盟#!#!"
 POD_coteriename_horns_ice_wu_tt: "曾是白虎皇朝支柱的冰角盟，在创始者自我放逐后必须浴火重生"
 POD_coteriename_demons_zhongdu_wu: "#TOOLTIP:POD_coteriename_demons_zhongdu_wu_tt #L 中都恶鬼众#!#!"
 POD_coteriename_demons_zhongdu_wu_tt: "烈焰送他们入地狱，铁链铸他们获新生"
 POD_coteriename_entwined_serpents: "#TOOLTIP:POD_coteriename_entwined_serpents_tt #L 交颈双蛇会#!#!"
 POD_coteriename_entwined_serpents_tt: "被世间轻蔑之徒，终将借苍白邪蛇之野心令众生俯首"
 POD_coteriename_amber_wren: "#TOOLTIP:POD_coteriename_amber_wren_tt #L 琥珀鹪盟#!#!"
 POD_coteriename_amber_wren_tt: "帝国赖耳目而存，在黄帝朝廷中，消息皆染琥珀之色。"
 POD_coteriename_illustrious_scribes: "#TOOLTIP:POD_coteriename_illustrious_scribes_tt #L 煌录文士#!#!"
 POD_coteriename_illustrious_scribes_tt: "万鬼圣典岂会自书成章？文笔所至，八方皆达"
 POD_coteriename_bronze_pennant: "#TOOLTIP:POD_coteriename_bronze_pennant_tt #L 青铜旌旗#!#!"
 POD_coteriename_bronze_pennant_tt: "乱世之中，奸邪之徒无穷尽，讨伐之由亦无穷尽"
 POD_coteriename_warriors_hebei: "#TOOLTIP:POD_coteriename_warriors_hebei_tt #L 河北战豪#!#!"
 POD_coteriename_warriors_hebei_tt: "北地而来的破障恶鬼，誓要碾碎世间杂种"
 POD_coteriename_fivefold_way: "#TOOLTIP:POD_coteriename_fivefold_way_tt #L 五行宗圣贤#!#!"
 POD_coteriename_fivefold_way_tt: "来自隐秘的少林寺，无与伦比的圣贤们参悟血的教义中隐藏的真理。"
 POD_coteriename_emerald_bier: "#TOOLTIP:POD_coteriename_emerald_bier_tt #L 翡翠灵柩#!#!"
 POD_coteriename_emerald_bier_tt: "通往地狱之路据说由善意铺就，但不如说是由欲望铺就。"
 POD_coteriename_blissful_ice_daggers: "#TOOLTIP:POD_coteriename_blissful_ice_daggers_tt #L 极乐冰刃会#!#!"
 POD_coteriename_blissful_ice_daggers_tt: "宋朝的宦官们有一批隐秘的导师，皆是曾经的宦官。"
 POD_coteriename_silver_locks: "#TOOLTIP:POD_coteriename_silver_locks_tt #L 银锁#!#!"
 POD_coteriename_silver_locks_tt: "维系帝国财政绝非易事，银锁的要求唯有完美。"
 POD_coteriename_eternal_ice: "#TOOLTIP:POD_coteriename_eternal_ice_tt #L 永恒寒冰#!#!"
 POD_coteriename_eternal_ice_tt: "受人尊敬的中人与外交官，皆出身于最恶劣的境遇。血/学曾言天光可及万物，而永恒寒冰正试图证明这一点。"
 POD_coteriename_sovereign_virtue: "#TOOLTIP:POD_coteriename_sovereign_virtue_tt #L 美德君主#!#!"
 POD_coteriename_sovereign_virtue_tt: "血浓于水，却不如誓约之血浓。何不二者兼得？"
 POD_coteriename_silver_blade_horsemen: "#TOOLTIP:POD_coteriename_silver_blade_horsemen_tt #L 银刃铁骑#!#!"
 POD_coteriename_silver_blade_horsemen_tt: "被救赎的军阀率领他的军队奔赴最后一战，誓要斩断尖刺锁链。"
 POD_coteriename_golden_shroud: "#TOOLTIP:POD_coteriename_golden_shroud_tt #L 黄金障壁#!#!"
 POD_coteriename_golden_shroud_tt: "朱雀皇朝的典范们，其英雄表象下隐藏着矛盾交织的内在冲突。"
 POD_coteriename_leaping_gibbons: "#TOOLTIP:POD_coteriename_leaping_gibbons_tt #L 跃长臂猿#!#!"
 POD_coteriename_leaping_gibbons_tt: "识与才干皆备……剩下的只需看他们能攀得多高……以及跌得多深。"
 POD_coteriename_eastern_vanguard: "#TOOLTIP:POD_coteriename_eastern_vanguard_tt #L 东方先锋#!#!"
 POD_coteriename_eastern_vanguard_tt: "蒙古人正在虎视眈眈，紧着中原的长城，寻找任何脆弱的迹象。"
 POD_coteriename_bright_forest: "#TOOLTIP:POD_coteriename_bright_forest_tt #L 明林#!#!"
 POD_coteriename_bright_forest_tt: "他们一同建立了帝国，也可能一同将其毁灭。"
 POD_coteriename_regretful_hunters: "#TOOLTIP:POD_coteriename_regretful_hunters_tt #L 懊悔的猎人#!#!"
 POD_coteriename_regretful_hunters_tt: "在玄武皇朝的诞生中，诸多桥梁被焚毁。如今他们承受着后果，并在天庭仲裁者的注视下寻求救赎。"
 POD_coteriename_riders_ashen: "#TOOLTIP:POD_coteriename_riders_ashen_tt #L 灰原骑手#!#!"
 POD_coteriename_riders_ashen_tt: "传奇纪元终结，留下满目疮痍的世界。但若人们认定自己继承的注定是破碎的天地，这份执念便会玷污他们试图重建的一切。"
 POD_coteriename_blackest_night: "#TOOLTIP:POD_coteriename_blackest_night_tt #L 至黑之夜#!#!"
 POD_coteriename_blackest_night_tt: "勿惧那于黑暗中护你之力"
 POD_coterieloc_mokole: "族"
 POD_coteriename_inoue_clan: "#TOOLTIP:POD_coteriename_inoue_clan_tt #L 井上家族的利刃#!#!"
 POD_coteriename_inoue_clan_tt: "究竟谁才是利刃？是狼人，还是那把剑？"
 POD_coteriename_outriders_spiked: "#TOOLTIP:POD_coteriename_outriders_spiked_tt #L 刺链掠袭骑兵#!#!"
 POD_coteriename_outriders_spiked_tt: "地狱可不会等你。掠袭骑兵们会确保加速这一进程。"
 POD_coteriename_ishbara: "#TOOLTIP:POD_coteriename_ishbara_tt #L 族法守护者#!#!"
 POD_coteriename_yidu: "#TOOLTIP:POD_coteriename_yidu_tt #L 西风#!#!"
 POD_coteriename_ishbara_tt: "厄克的最年长者，矢志不渝地维护着领地的秩序并誓死守卫这片土地。"
 POD_coteriename_yidu_tt: "他们决心打击可恨的东方鬼人，不成功便成仁，绝不罢休。"
 POD_coteriename_riders_ashen_plain: "#TOOLTIP:POD_coteriename_riders_ashen_plain_tt #L 灰原骑手#!#!"
 POD_coteriename_riders_ashen_plain_tt: "他们曾驰骋得比谁都快；如今，却难以逃离自身命运。"
 POD_coteriename_sons_tengri: "#TOOLTIP:POD_coteriename_sons_tengri_tt #L 腾格里之子#!#!"
 POD_coteriename_sons_tengri_tt: "草原的支柱屹立，但其年龄可能成为其倒塌之因。"
 POD_coteriename_barren_winds: "#TOOLTIP:POD_coteriename_barren_winds_tt #L 荒芜之风#!#!"
 POD_coteriename_barren_winds_tt: "长久的世仇让他们忽视了背后的威胁，而这股风很快就会彻底荒芜。"
 POD_coteriename_storm_fire: "#TOOLTIP:POD_coteriename_storm_fire_tt #L 火之风暴#!#!"
 POD_coteriename_storm_fire_tt: "火真的能在荒芜的草原上延烧吗？"
 POD_coteriename_black_hoof_riders: "#TOOLTIP:POD_coteriename_black_hoof_riders_tt #L 黑蹄骑手#!#!"
 POD_coteriename_black_hoof_riders_tt: "骑手们诚然主宰着草原，但黑蹄能否在多布鲁之子手中存续？"
 POD_coteriename_silent_glade: "#TOOLTIP:POD_coteriename_silent_glade_tt #L 静默林间#!#!"
 POD_coteriename_silent_glade_tt: "多科尔汗的宠妃们，来自草原所能征服的最遥远之处，如今已挣脱束缚；而她们最渴望的，便是讨回这笔宿债。"
 POD_coteriename_harbingers_eternal_wind: "#TOOLTIP:POD_coteriename_harbingers_eternal_wind_tt #L 永风导航者#!#!"
 POD_coteriename_harbingers_eternal_wind_tt: "堕落是战斗的呼唤，响应吧。"