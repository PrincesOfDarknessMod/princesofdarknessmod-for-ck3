 POD_coterietravel_gui_empty: "由于你是$POD_player_coterie$的唯一成员，你将独自旅行。"
 POD_coterietravel_gui: "与$POD_player_coterie$一同旅行？"
 POD_coterietravel_earthbound_flavor: "$POD_player_coterie$都已为该[journey|E]集合。我所宿的[GetPlayer.MakeScope.Var('stone_prison').Artifact.GetName]已被安全的携带。"
 POD_coterietravel_none_flavor: "是时候让我为我的[journey|E]做出发准备了。"
 POD_coterietravel_yes_flavor: "是时候让$POD_player_coterie$为该[journey|E]做出发准备了。"
 POD_coterietravel_no_flavor: "是时候让我为我的[journey|E]做出发准备了。$POD_player_coterie$的其他成员留在后方让我自己前去。"
 POD_coterieflavor_ambitious_1: "[ROOT.Char.GetFirstNameNicknamed]步履轻快，似乎渴望克服[ROOT.Char.GetHerHis|l]路上的任何障碍，迎接任何挑战。"
 POD_coterieflavor_arbitrary_1: "[ROOT.Char.GetFirstNameNicknamed]握紧[ROOT.Char.GetHerHis|l]的指关节，期待这次旅程，准备打破一些规则。"
 POD_coterieflavor_arrogant_1: "[ROOT.Char.GetFirstNameNicknamed]正昂首阔步地走在我们队伍的前面，下巴抬得高高的，好像我们的旅程注定将成功。"
 POD_coterieflavor_arrogant_2: "[ROOT.Char.GetFirstNameNicknamed]发出了爽朗的笑声。“别愁眉苦脸了，[GetPlayer.GetFirstName]”，[ROOT.Char.GetSheHe|l]说。“$POD_player_coterie$会获胜的，就跟以往一样。毕竟，我们是最棒的。”[ROOT.Char.GetSheHe|U]眨了眨眼。"
 POD_coterieflavor_brave_1: "[ROOT.Char.GetFirstNameNicknamed]走在队伍的最前面。[ROOT.Char.GetSheHe|U]的行动充满自信，随时准备迎接任何危险，并笑对危险。"
 POD_coterieflavor_callous_1: "[ROOT.Char.GetFirstNameNicknamed]在我们的队伍旁边踱步，[ROOT.Char.GetHerHis|l]脸上没有一丝情绪。"
 POD_coterieflavor_calm_1: "[ROOT.Char.GetFirstNameNicknamed]一脸平静地看着前方。我从未见过[ROOT.Char.GetHerHim|l]紧张的样子，不知道这次旅程会不会是第一次。"
 POD_coterieflavor_chaste_1: "[ROOT.Char.GetFirstNameNicknamed]心不在焉地与我们一行人并肩而行，似乎陷入了某种幻想之中。按照我对[ROOT.Char.GetHerHim|l]的了解，肯定不是什么肮脏的幻想。"
 POD_coterieflavor_compassionate_1: "[ROOT.Char.GetFirstNameNicknamed]看向我们其他人的眼神中充满了真诚的温暖，总是乐于帮助他人完成他们的工作。"
 POD_coterieflavor_content_1: "[ROOT.Char.GetFirstNameNicknamed]正迈着轻松的步伐与大家同行。[ROOT.Char.GetSheHe|U]看起来真的很乐意与大家同行，不管这次旅程是成功还是失败。"
 POD_coterieflavor_craven_1: "[ROOT.Char.GetFirstNameNicknamed]对即将踏上旅程显得有些紧张。[ROOT.Char.GetSheHe|U]的懦弱名声在外，但这次旅行也许是[ROOT.Char.GetHerHim|l]证明[ROOT.Char.GetHerselfHimself|l]的机会。"
 POD_coterieflavor_cynical_1: "只要给[ROOT.Char.GetFirstNameNicknamed]一个怨天尤人的机会，[ROOT.Char.GetHerHis|l]脸上就会露出会心的冷笑。"
 POD_coterieflavor_diligent_1: "[ROOT.Char.GetFirstNameNicknamed]背着一个装满装备的背包，显然为这次旅程做了大量准备。"
 POD_coterieflavor_eccentric_1: "[ROOT.Char.GetFirstNameNicknamed]对着[ROOT.Char.GetHerselfHimself|l]吹着口哨，来回晃动着[ROOT.Char.GetHerHis|l]的脑袋，迷失在[ROOT.Char.GetHerHis|l]自己的世界里。"
 POD_coterieflavor_fickle_1: "[ROOT.Char.GetFirstNameNicknamed]望着远处的几只鸟，一如既往地心不在焉。"
 POD_coterieflavor_forgiving_1: "[ROOT.Char.GetFirstNameNicknamed]微笑着，真正活在当下，不管怎样。"
 POD_coterieflavor_generous_1: "[ROOT.Char.GetFirstNameNicknamed]热情地问候我们团队的其他成员。我希望我们不会遇到任何人利用[ROOT.Char.GetHerHis|l]的慷慨。"
 POD_coterieflavor_gluttonous_1: "[ROOT.Char.GetFirstNameNicknamed]拍拍[ROOT.Char.GetHerHis|l]的肚子，已经开始期待[ROOT.Char.GetSheHe|l]此行可能品尝到的美食了"
 POD_coterieflavor_greedy_1: "[ROOT.Char.GetFirstNameNicknamed]摸了摸[ROOT.Char.GetHerHis|l]口袋里的钱包，毫无疑问，这次旅程是为了扩充钱包里的东西。"
 POD_coterieflavor_gregarious_1: "[ROOT.Char.GetFirstNameNicknamed]开心地和我聊这聊那，当周围都是人的时候，真的是在[ROOT.Char.GetHerHis|l]的所长之中。"
 POD_coterieflavor_humble_1: "[ROOT.Char.GetFirstNameNicknamed]走起路来时双手握在[ROOT.Char.GetHerHis|l]背后。[ROOT.Char.GetSheHe|U]是我们小组的重要成员，尽管[ROOT.Char.GetSheHe|l]永远不会承认这一点。"
 POD_coterieflavor_impatient_1: "[ROOT.Char.GetFirstNameNicknamed]不耐烦地敲打着[ROOT.Char.GetHerHis|l]的双脚，似乎急于出发。"
 POD_coterieflavor_impatient_2: "[ROOT.Char.GetFirstNameNicknamed]来回踱步。[ROOT.Char.GetSheHe|U]向我投来指责的目光。“我们快走吧。我们不应该再浪费时间了。”"
 POD_coterieflavor_just_1: "[ROOT.Char.GetFirstNameNicknamed]看起来很严肃。也许[ROOT.Char.GetSheHe|l]曾希望踏上一段与众不同的旅程，去纠正这个世界上最大的不公正之一。"
 POD_coterieflavor_lazy_1: "[ROOT.Char.GetFirstNameNicknamed]悠闲地走在我们队伍的后面，丝毫不以为意。"
 POD_coterieflavor_lustful_1: "[ROOT.Char.GetFirstNameNicknamed]心不在焉地走在我们的队伍旁边，似乎陷入了某种幻想之中。按照我对[ROOT.Char.GetHerHim|l]的了解，肯定是肮脏的幻想。"
 POD_coterieflavor_paranoid_1: "[ROOT.Char.GetFirstNameNicknamedPossessive]眼睛来回瞟着，焦急地扫视着周围，寻找任何可能的危险迹象。"
 POD_coterieflavor_patient_1: "[ROOT.Char.GetFirstNameNicknamed]平静地点点头，好像[ROOT.Char.GetSheHe|l]有的是时间来完成这次旅行。"
 POD_coterieflavor_sadistic_1: "[ROOT.Char.GetFirstNameNicknamedPossessive]眼睛扫视着地平线，眼神中充满了捕食者的饥渴，有点迫不及待地想要迎接前方的危险。"
 POD_coterieflavor_shy_1: "[ROOT.Char.GetFirstNameNicknamed]小心翼翼地迈着步子，[ROOT.Char.GetHerHis|l]眼睛盯着地面。[ROOT.Char.GetSheHe|U]很少有说话的兴致。"
 POD_coterieflavor_stubborn_1: "[ROOT.Char.GetFirstNameNicknamed]以不可阻挡的步伐前进着，似乎没有什么能阻止[ROOT.Char.GetHerHim|l]将我们的企图进行到底。"
 POD_coterieflavor_temperate_1: "[ROOT.Char.GetFirstNameNicknamed]携带着轻便高效的装备，忠实于[ROOT.Char.GetHerHis|l]的中庸信念。"
 POD_coterieflavor_trusting_1: "[ROOT.Char.GetFirstNameNicknamed]睁大眼睛好奇地打量着我们周围的环境，对我们可能面临的危险一无所知或毫不关心。"
 POD_coterieflavor_vengeful_1: "[ROOT.Char.GetFirstNameNicknamed]看起来很严肃。[ROOT.Char.GetSheHe|l]的想法总是很难预测。这次旅程可能只是[ROOT.Char.GetHerHis|l]打倒[ROOT.Char.GetHerHis|l]敌人的总计划中的一步。"
 POD_coterieflavor_wrathful_1: "[ROOT.Char.GetFirstNameNicknamed]正走在我们队伍的最前面，肩膀挺得笔直，看起来就像一根蓄势待发的弹簧。我希望[ROOT.Char.GetHerHis|l]的传奇脾气不会给我们的企图带来麻烦。"
 POD_coterieflavor_zealous_1: "[ROOT.Char.GetFirstNameNicknamed]满怀信心地大步向前，这种深深的信任源自[ROOT.Char.GetHerHis|l]对[ROOT.Char.GetFaith.GetName]理想的信仰。"
 POD_coterieflavor_generic_1: "[ROOT.Char.GetFirstNameNicknamed]没有性格。该角色的生成出了问题。"
 POD_has_coterie_trigger_tt: "你需要有一个[GetPlayer.Custom('PODCoterie')]"
 POD_has_coterie_members_trigger_tt: "你需要有一个有至少一位其他成员的[GetPlayer.Custom('PODCoterie')]"
 POD_coterieflavor_deceitful_1: "[ROOT.Char.GetFirstNameNicknamed]阴险地朝我眨了眨眼睛。我很清楚[ROOT.Char.GetHerHis|l]的欺诈天赋，我希望[ROOT.Char.GetSheHe|l]能把它们用在我们的敌人身上，而不是$POD_player_coterie$的其他成员身上。"
 POD_coterieflavor_honest_1: "[ROOT.Char.GetFirstNameNicknamed]望着远方，[ROOT.Char.GetHerHis|l]脸上露出平静的表情。[ROOT.Char.GetHerHis|l]的诚实天性会成为这次旅程的助力，还是累赘？"
