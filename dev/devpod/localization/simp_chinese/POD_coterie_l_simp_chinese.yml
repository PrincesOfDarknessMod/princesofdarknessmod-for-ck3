 POD_coteriename_rosae_crucis_tt:0 "“虔诚亲王”既是炙手可热的导师，也是令人畏惧的敌人，他们既珍视自己的信仰，也珍视自己的独立性。"
 POD_coteriename_daughters_sun:0 "#TOOLTIP:POD_coteriename_daughters_sun_tt #L 太阳之女#!#!"
 POD_coteriename_daughters_sun_tt:0 "她们在母亲的疯狂中团结起来，等待并准备着母亲不可避免的光荣回归。"