 POD_coteriename_camilla_tt:0 "塔尼特巴尔·萨哈尔指明了道路。即使帝国崩溃也无法动摇他们的信念。"
 POD_coteriename_mithras_tt:0 "他们是神钦点的选民，深得神的信任，甚至掌握着他的秘密。"
 POD_coteriename_alencourt_tt:0 "家庭纽带可以承受一切，甚至是死亡。"
 POD_coteriename_eon_tt:0 "信仰可以再等等，财富和名誉却不能。"
 POD_coteriename_sophoniba_tt:0 "迦太基消失了，突尼斯却在保护者的注视下蓬勃发展。"
 POD_coteriename_augustus_tt:0 "族长的左右手，伸向他渴望的秘密。"
 POD_coteriename_hardestadt_tt:0 "他们有着共同的目标，希望按照自己的形象重塑该隐之子世界。"
 POD_coteriename_julia_tt:0 "理想的开端，被遗物的魅力所连结。"
 POD_coteriename_jurgen_tt:0 "哈德施塔特之剑，常常希望摆脱它的束缚。"
 POD_coteriename_silent_fury_tt:0 "从乌合之众到反抗者，向这个无情的世界怒吼。"
 POD_coteriename_nordic_ventrue_tt:0 "“文明”的男男女女清洗了北方的旧神。"
 POD_coteriename_bar_sinister_tt:0 "被贪婪和小气所束缚，没有比自己更可怕的敌人。"
 POD_coteriename_ferals_livonia_tt:0 "是最后的英雄主义，还是难以想象的复兴？"
 POD_coteriename_redemption_tt:0 "克里斯托弗尔将他们团结在一起，即使他不在，也无法将他们分开。"
 POD_coteriename_andreas_tt:0 "一支由流亡者和不合群者组成的旅行队，在赛特仁慈的目光下团结在一起。"
 POD_coteriename_gabriella_tt:0 "君士坦丁堡在燃烧，一些拉丁人却试图灭火。"
 POD_coteriename_anadja_tt:0 "为成功而打扮，期待着登上谎言和恶意的宝座。"
 POD_coteriename_suleiman_tt:0 "最先听到他的话语并真正领悟的人。"
 POD_coteriename_erinyes_tt:0 "昔日的狂怒，让敌人不敢阻挡。"
 POD_coteriename_carnival_tt:0 "来者不拒。去者稀少。"
 POD_coteriename_fratres_tt:0 "他们团结一致，研究死亡和疾病的恐怖，并将其传播到所到之处。"
 POD_coteriename_red_thor_tt:0 "由于令人生畏的长船依然出航，维京时代将永远不会真正结束。"
 POD_coteriename_horus_tt:0 "复仇者的选民，捕杀任何地方的蛇。"
 POD_coteriename_leopold_tt:0 "被上帝眷顾的有功业的男女，将成为祂的卫士。或者成为殉道者。"
 POD_coteriename_field_tt:0 "粗鲁大胆的年轻狼族，有时会被他们的狂热蒙蔽双眼。"
 POD_coteriename_crescent_tt:0 "国度的英雄，注定不会真正消亡。"
 POD_coteriename_bright_tt:0 "尽管誓言几近破灭，但它依然顽强地存在着。"
 POD_coteriename_sun_glory_tt:0 "西欧最负盛名的战群，正在为受敬爱的头领的离去而苦苦挣扎。"
