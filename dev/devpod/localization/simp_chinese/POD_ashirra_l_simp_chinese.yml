l_simp_chinese:
 ashirra_imam_court_position: "伊玛目"
 ashirra_imam_court_position_desc: "伊玛目是每个阿什拉派社群的精神领袖。他保护信徒，确保社群的安稳与繁荣，并推行伊斯兰律法。他也同时负责为城市中的阿什拉派维持清真寺运行，后者是整个社群的精神中心，也是一个和平地容纳任何该隐之子前来表达不满的圣所。"
 ashirra_ulama_court_position: "阿里姆"
 ashirra_ulama_court_position_desc: "乌里玛是古兰经和圣训的学者，是社群中受人尊敬的智者。追求宗教知识的阿什拉派会担任自己所在的夜之社群的乌里玛。这些乌里玛中的许多都都将圣言铭记于心，甚至，在某些情况下，他们花了数百年时间来思索、争辩先知教诲的含义。"
 ashirra_qadi_court_position: "卡迪"
 ashirra_qadi_court_position_desc: "卡迪是伊斯兰信仰中的教法官，研究先知穆罕默德制定的法律，在有信徒犯罪或有纠纷时诠释这些法律。每位教法官都必须同时精通古兰经的律法和伊斯兰历史中经由前代教法官做出的数百份判决先例。教法官们就有关法律纠纷的问题对伊玛目、苏丹和其他吸血鬼提出建议，并对那些违抗伊斯兰律法的行为做出恰当的判罚。"
 ashirra_mullah_court_position: "穆拉"
 ashirra_mullah_court_position_desc: "阿什拉派中最受尊敬的学者被称为穆拉。虽然任何阿什拉成员都可立志成为圣典学者，但穆拉头衔必须通过多年潜心研习并获得现任穆拉们的认可方能取得。在整个穆斯林世界，仅有少数吸血鬼能获此称号。"
 ashirra_mullah_court_position_requirement_tooltip: "他们需具备[GetTrait('theologian').GetName(GetNullCharacter)]或[GetTrait('scholar').GetName(GetNullCharacter)]特质"
 POD_imam_sadaqah: "主持公共施舍"
 POD_imam_sadaqah_desc: "你$ashirra_imam_court_position$将以你的名义向领地内的贫民分发救济的"
 POD_imam_sanctuary: "提供庇护所"
 POD_imam_sanctuary_desc: "$ashirra_imam_court_position$提供庇护所"
 POD_qadi_judge: "作出裁决"
 POD_qadi_judge_desc: "$ashirra_qadi_court_position$将代你专注于各类案件的审判"
 POD_ulama_teachings: "谏言苏丹"
 POD_ulama_teachings_desc: "$ashirra_ulama_court_position$将运用其渊博学识为苏丹提供建议"
 POD_ulama_teachings_requirement: "你#bold 并非#![cultural_head|E]"
 POD_ulama_learning: "追求更深学识"
 POD_ulama_learning_desc: "成为$ashirra_mullah_court_position$的道路漫长。$ashirra_ulama_court_position$将投入时间以求达成此目标"
 POD_ulama_learning_tooltip_requirement: "#bold 未#!同时具备[GetTrait('theologian').GetName(GetNullCharacter)]和[GetTrait('scholar').GetName(GetNullCharacter)]特质"
 POD_ulama_learning_tooltip: "该角色每年有几率获得[learning_lifestyle|E]中的[GetTrait('theologian').GetName(GetNullCharacter)]或[GetTrait('scholar').GetName(GetNullCharacter)][perk|El]，直到拥有两项特质为止。此概率受其[aptitude|El]影响"
 court_ulama_study_theology_title: "学者取得进展"
 POD_mullah_warriors: "召集信众"
 POD_mullah_warriors_desc: "[Glossary('阿什拉派','game_concept_ashirra_desc')]中许多成员时刻准备与真主之敌作战。他们不会拒绝$ashirra_mullah_court_position$的召唤"
 POD_mullah_zealots: "引领虔信者"
 POD_mullah_zealots_desc: "$ashirra_mullah_court_position$在[Glossary('阿什拉派','game_concept_ashirra_desc')]中备受尊崇。其言论甚至能打动最愤世嫉俗的信徒。支持他的人也将支持你"
 POD_mullah_zealots_cairo_tooltip: "该角色每年有几率为其[liege|El]、君主[courtiers|El]或封臣[vassals|El]移除[GetTrait('cynical').GetName(GetNullCharacter)]特质。此概率受其[aptitude|El]影响"
