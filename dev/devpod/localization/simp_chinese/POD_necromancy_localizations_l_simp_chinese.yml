 needs_lamia_necromancy_path_training:0 "@warning_icon!#X 你得先受训于拉米亚亡灵术道途才能点这个技能。#!"
 needs_impundulu_necromancy_path_training:0 "@warning_icon!#X 你得先受训于魔蛇鹫亡灵术道途才能点这个技能。#!"
