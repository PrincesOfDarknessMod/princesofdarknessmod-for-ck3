 needs_cappadocian_necromancy_path_training:0 "@warning_icon!#X 你得先受训于卡帕多西亚亡灵术道途才能点这个技能。#!"
 needs_giovanni_necromancy_path_training:0 "@warning_icon!#X 你得先受训于乔凡尼亡灵术道途才能点这个技能。#!"
