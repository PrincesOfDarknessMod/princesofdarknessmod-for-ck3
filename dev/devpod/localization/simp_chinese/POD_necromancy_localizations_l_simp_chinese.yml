 insight_perk_name:0 "窥视尸幕"
 summon_soul_perk_name:0 "召唤灵魂"
 compel_soul_perk_name:0 "指令灵魂"
 haunting_perk_name:0 "作祟"
 torment_perk_name:0 "镇魂曲"
 insight_perk_effect:0 "若你的任何亲朋好友本将死于死因神秘，现在将直接揭露谋杀他们的人。"
 insight_perk_flavor:0 "#flavor The dead walk among us unseen and unheard. To command them, a necromancer must be able to perceive them.#!"
 summon_soul_perk_effect:0 "作为[character_interaction|E]，你可以标记其他角色的灵魂以便在死后变为[GetTrait('wraith').GetName( GetPlayer )]时召唤。"
 summon_soul_perk_flavor:0 "#flavor Summon Soul allows a necromancer to summon a ghost back from the Underworld .#!"
 compel_soul_perk_effect:0 "通过[character_interaction|E]，你可以束缚死灵。"
 compel_soul_perk_flavor:0 "#flavor Using this power, a vampire can bend a ghost to her will for a short time. This ability requires supreme confidence, as a failure of resolve can lead to disastrous consequences for a necromancer.#!"
 haunting_perk_effect:0 "你更善于在缚灵[character_interaction|E]中束缚[GetTrait('wraith').GetName( GetPlayer )]。"
 haunting_perk_flavor:0 "#flavor A necromancer uses the power of her blood to bind a ghost into an object or location.#!"
 torment_perk_effect:0 "解锁专门针对[GetTrait('wraith').GetName( GetPlayer )]的[single_combat_duel|E]招式。"
 torment_perk_flavor:0 "#flavor With use of Torment, a necromancer may strike at a ghost’s incorporeal body as if he himself were a ghost."
 seal_of_abamixtra_perk_name:0 "阿巴米克斯特拉之印"
 awaken_the_homoncular_servant_perk_name:0 "唤醒人造人仆从"
 shambling_hordes_perk_name:0 "蹒跚尸群"
 soul_stealing_perk_name:0 "恶毒驱魔"
 necromancy_possession_perk_name:0 "恶邪附身"
 seal_of_abamixtra_perk_flavor:0 "#flavor 通过唤起阿巴米克斯特拉之印，亡灵术师可以复活一具或一组尸体来完成简单的任务。#!"
 awaken_the_homoncular_servant_perk_flavor:0 "#flavor With this power, a necromancer can take a small piece of a corpse and transform it into a grotesque sort of familiar.#!"
 shambling_hordes_perk_flavor:0 "#flavor With the use of this power, a necromancer can create a group of walking dead minions to attack her enemies.#!"
 soul_stealing_perk_effect:0 "解锁$EXECUTION_CONVERT_TO_WRAITH$[executions|E]。"
 soul_stealing_perk_flavor:0 "#flavor With but a word and a forceful gesture, a necromancer can exorcise a mortal’s soul from his own body."
 necromancy_possession_perk_effect:0 "受$EXECUTION_CONVERT_TO_WRAITH$[executions|E]的目标现在死后将会在凡间游荡不前往冥界。"
 necromancy_possession_perk_flavor:0 "#flavor Daemonic Possession allows a necromancer to channel a soul into a freshly-dead body.#!"
 shroudsight_perk_name:0 "尸幕视线"
 lifeless_tongues_perk_name: "冥府之舌"
 touch_the_nether_perk_name:0 "下界之触"
 ex_nihilo_perk_name: "虚无缥缈"
 shroud_mastery_perk_name: "掌控尸幕"
 shroudsight_perk_effect:0 "解锁捕捉死灵[character_interaction|E]"
 shroudsight_perk_flavor:0 "#flavor Shroudsight allows a vampire to gaze directly into the Underworld.#!"
 lifeless_tongues_perk_effect:0 "通过[character_interaction|E]，你可以命令[GetTrait('wraith').GetName( GetPlayer )]对抗其他角色。"
 lifeless_tongues_perk_flavor:0 "#flavor When uttering the Tongue of the Dark Kingdoms, a necromancer can converse with ghosts in the Underworld.#!"
 touch_the_nether_perk_effect:0 "当你在物质世界中时，也可以与影界的存在互动。"
 touch_the_nether_perk_flavor:0 "#flavor While invoking Touch the Nether, a necromancer may stand on both sides of the Shroud; she manifests physically in the Underworld while remaining corporeal in the lands of the living.#!"
 ex_nihilo_perk_effect:0 "允许在灵游时进入冥界。"
 ex_nihilo_perk_flavor:0 "#flavor Ex Nihilo allows a necromancer to physically enter the Underworld. While in the Underworld, she appears as a particularly solid ghost.#!"
 shroud_mastery_perk_effect:0 "解锁灵界界面的操纵尸幕选项"
 shroud_mastery_perk_flavor:0 "#flavor With this power, the necromancer can greatly aid or hinder the ability of ghosts to function in the living world.#!"
 necromancy_ashes_to_ashes_perk_name:0 "尘归于尘"
 rigor_mortis_perk_name:0 "尸僵"
 ashen_ladys_embrace_perk_name:0 "灰烬女士之拥"
 gift_of_melancholia_perk_name:0 "忧郁赠礼"
 necromancy_ashes_to_ashes_perk_effect:0 "减少潜藏暴露风险和增强掩盖潜藏[character_interaction|E]。"
 necromancy_ashes_to_ashes_perk_flavor:0 "#flavor While some Cainites slaughter indiscriminately and fear no consequences for their actions, other Cainites feel the need to be a bit more discreet. Use of this power turns a human corpse into a pile of unremarkable ash roughly one-fifth the weight of the original body.#!"
 rigor_mortis_perk_flavor:0 "#flavor With this power, the necromancer can make any target as stiff and still as a corpse.#!"
 ashen_ladys_embrace_perk_effect:0 "解锁灰烬女士之拥[single_combat_duel|E]招式"
 ashen_ladys_embrace_perk_flavor:0 "#flavor The Ashen Lady’s Embrace causes a target’s limb to age, dry out, and wither like grapes left on the vine.#!"
 gift_of_melancholia_perk_effect:0 "解锁在敌人国家释放瘟疫的[character_interaction|E]"
 gift_of_melancholia_perk_flavor:0 "#flavor This power inflicts a virulent wasting illness on mortals and Cainites alike.#!"
 mortuus_in_vultus_perk_name:0 "死亡面貌"
 algor_mortis_perk_name:0 "尸冷"
 intimations_of_mortality_perk_name:0 "短生的暗示"
 benedictio_mortem_perk_name:0 "赞美死亡"
 benedictio_vitae_perk_name:0 "赞美精血"
 mortuus_in_vultus_perk_flavor:0 "#flavor A Cainite can make herself appear as if she was a long-dead corpse.#!"
 algor_mortis_perk_flavor:0 "#flavor With the use of Algor Mortis, a vampire is able to transform herself into a cool, melancholy creature, unmoved by mortal pain or emotional manipulation.#!"
 intimations_of_mortality_perk_effect:0 "作为[character_interaction|E]，你可以增加吸血鬼对压力值的易感性，同时也可以防止他们使用血涌来提高他们的属性。"
 intimations_of_mortality_perk_flavor:0 "#flavor Intimations of Mortality inflicts the more unpleasant and irritating aspects of mortality upon a vampire.#!"
 benedictio_mortem_perk_flavor:0 "#flavor With this power, a necromancer fully assumes the aspect of a corpse and is able to slough off the weaknesses of his vampiric condition.#!"
 benedictio_vitae_perk_flavor:0 "#flavor With Benedictio Vitae, a Cainite is able to enjoy many of the best aspects of mortal life without forsaking the power of her vampiric nature.#!"
 calvaria_emissius_perk_name:0 "颅顶传信"
 consilium_mortuus_perk_name:0 "劝谕死亡"
 ammorsus_vicarius_perk_name:0 "代理官之咬"
 exedo_animus_perk_name:0 "撕咬心灵"
 degulo_perk_name:0 "吞没"
 calvaria_emissius_perk_flavor:0 "#flavor One of Clan Cappadocian’s most prized secrets is the ability to spy via the eye-sockets of the dead.#!"
 consilium_mortuus_perk_effect:0 "没做"
 consilium_mortuus_perk_flavor:0 "#flavor By conversing with the decapitated head of the departed target, it transpires that prying a guaranteed truth from decayed lips is quite possible.#!"
 ammorsus_vicarius_perk_flavor:0 "#flavor Using this power, the necromancer can grip the mandible and maxillae of the skull to use as a bizarre close-quarters weapon, affix the skull to a spear-point to attack from distance, or even leave the skull alone, to act as a trap.#!"
 exedo_animus_perk_effect:0 "没做"
 exedo_animus_perk_flavor:0 "#flavor By bearing a skull — either from a mortal or Cainite — the necromancer forms a sympathetic bond with the skull’s former owner.#!"
 degulo_perk_effect:0 "没做"
 degulo_perk_flavor:0 "#flavor Degulo is the method by which a necromancer consumes a fragment of soul and retains it forever as a part of himself#!"
 whispers_of_the_soul_perk_name:0 "灵魂低语"
 kiss_of_the_dark_mother_perk_name:0 "黑暗之母之吻"
 dark_humours_perk_name:0 "黑暗体液"
 caul_of_the_neverborn_perk_name:0 "未诞者的胎膜"
 lament_of_dhainu_perk_name:0 "达·海努之哀恸"
 whispers_of_the_soul_perk_flavor:0 "#flavor Merely hearing a whisper of the true name of the Dark Mother is enough to drive mortals mad, and fill the hearts of the Cainites with terror#!"
 kiss_of_the_dark_mother_perk_effect:0 "没做"
 kiss_of_the_dark_mother_perk_flavor:0 "#flavor The Lilin bites her tongue and fills her mouth with a foul, acrid mix of black bile and vitae. Her bite becomes even more terrible, and she can devour the life from her victims with ease#!"
 dark_humours_perk_flavor:0 "#flavor The Lamiae are known for their athleticism and mastery of their bodies. Not only are they able to perform feats of incredible physical prowess, but they can also manipulate the balance of humors in their body by sheer force of will.#!"
 caul_of_the_neverborn_perk_effect:0 "解锁捕捉死灵[character_interaction|E]"
 caul_of_the_neverborn_perk_flavor:0 "#flavor With the use of this power, the Lamia strengthens her connection to the black heart of the Dark Mother. Giving her both increased resilience and the ability to see into the Shadowlands.#!"
 lament_of_dhainu_perk_flavor:0 "#flavor The Lamia howls in agony, and the very earth trembles. A miasma of writhing darkness rises from the ground and ensnares her enemies. Those caught by the darkness are not physically bound, but are immediately stricken with emotional anguish so rich and raw that they seek to end their lives in the most expedient way possible.#!"
 tend_the_body_garden_perk_name:0 "打理躯体花园"
 witchs_fruit_perk_name:0 "女巫之果"
 raise_the_green_one_perk_name:0 "唤起绿尸"
 wails_and_whispers_perk_name:0 "哀嚎与低语"
 cthonic_womb_perk_name:0 "闪灵子宫"
 tend_the_body_garden_perk_effect:0 "减少潜藏暴露风险和增强掩盖潜藏[character_interaction|E]。"
 tend_the_body_garden_perk_flavor:0 "#flavor A necromancer with this power can speed up or slow the process of decay, turning a dead mortal into a bloated host for flies in seconds or nullifying the decay of Final Death.#!"
 witchs_fruit_perk_effect:0 "解锁允许用注入亡灵术的果实毒害凡人的[character_interaction|E]。"
 witchs_fruit_perk_flavor:0 "#flavor Every plant relies on death to grow. Rotting things enrich the soil, and the trees, vines, and grasses drink up necrotic echoes along with vital nutrients. A necromancer can awaken this death aura by exposing their fruits to her blood.#!"
 raise_the_green_one_perk_effect:0 "解锁唤起绿尸[character_interaction|E]。"
 raise_the_green_one_perk_flavor:0 "#flavor Nightshade necromancers can raise a corpse bound and strengthened by plant matter. Leaves cover its skin and strong vines supplement its rotted sinews. The living shell grants speed and self-preservation instincts not seen in other animated dead.#!"
 wails_and_whispers_perk_effect:0 "解锁让目标更难抵御谋杀计谋的[character_interaction|E]。"
 wails_and_whispers_perk_flavor:0 "#flavor As the necromancer’s understanding deepens, she explores the wavering barrier between life and death. When she screams like a banshee, she can lure a soul to its demise, increasing the chance of a fatal injury.#!"
 cthonic_womb_perk_effect:0 "吸干凡人时能将其唤为[GetTrait('wraith').GetName( GetPlayer )]"
 cthonic_womb_perk_flavor:0 "#flavor At the apex of this Path, a necromancer combines murder and fertility to give birth to the ghost of a mortal she has slain.#!"
 eyes_of_the_wraith_perk_name:0 "死灵之眼"
 aura_of_decay_perk_name:0 "衰败灵光"
 soul_feasting_perk_name:0 "毕舍遮之宴"
 curse_of_the_maelstrom_perk_name:0 "恶湍诅咒"
 nightcry_perk_name:0 "夜泣"
 eyes_of_the_wraith_perk_flavor:0 "#flavor By invoking this power, the necromancer can see the world the way that the Restless Dead do.#!"
 aura_of_decay_perk_flavor:0 "#flavor This power hastens the inevitable fate of any inanimate object caught within the necromancer’s dreadful aura, allowing the vampire to cause any object to decay into a ruined heap.#!"
 soul_feasting_perk_effect:0 "解锁魂飨[character_interaction|E]，允许你吸食受缚[GetTrait('wraith').GetName( GetPlayer )]来满足饥渴。"
 soul_feasting_perk_flavor:0 "#flavor Pischacha’s Feast allows a vampire to subsist on the ambient energies of entropy that permeate the haunted places of the world, or feed directly on the corpus of a ghost.#!"
 curse_of_the_maelstrom_perk_effect:0 "解锁恶湍诅咒[character_interaction|E]，允许给他人的首都施加负面修正。"
 curse_of_the_maelstrom_perk_flavor:0 "#flavor The necromancer can curse her surroundings summoning Spectres to cause mayhem and destruction.#!"
 nightcry_perk_flavor:0 "#flavor With use of Night Cry, a necromancer is able to display her mastery of the forces of entropy. She may either direct it away from her allies to aid them, or she may channel it directly into her foes and hinder them#!"
 song_of_the_dead_perk_name:0 "死者之歌"
 summon_wisp_perk_name:0 "召唤鬼火"
 harrowing_perk_name:0 "哀歌"
 phantasms_perk_name:0 "幻影"
 spectral_menacing_perk_name:0 "怨灵来袭"
 song_of_the_dead_perk_effect:0 "解锁给敌人施加压力值的[character_interaction|E]"
 song_of_the_dead_perk_flavor:0 "#flavor The vampire chants, weaving unheard words into the song and instilling an unhealthy fascination with death in his listener.#!"
 summon_wisp_perk_flavor:0 "#flavor The vampire infuses droplets of his blood with the ephemeral energy of the Underworld, summoning a sphere of flickering lights. The wisp may lure unsuspecting mortals into a trap or provide a clever distraction.#!"
 harrowing_perk_effect:0 "增强死者之歌[character_interaction|E]"
 harrowing_perk_flavor:0 "#flavor Harrowing extends the terror inflicted by Song of the Dead by haunting her in her sleep, turning her dreams to nightmarish visions of her own death#!"
 phantasms_perk_flavor:0 "#flavor The vampire sculpts the energy of the Underworld into elaborate hallucinations that terrorize the living. #!"
 spectral_menacing_perk_effect:0 "没做"
 spectral_menacing_perk_flavor:0 "#flavor The vampire rends the shroud between life and the Underworld around his victim, calling malicious ghosts to haunt her.#!"
 touch_of_death_perk_name:0 "死亡之触"
 reveal_the_catene_perk_name:0 "揭秘枷锁"
 tread_upon_the_grave_perk_name:0 "行于墓"
 death_knell_perk_name:0 "死亡丧钟"
 ephemeral_binding_perk_name:0 "游灵束缚"
 touch_of_death_perk_effect:0 "没做"
 touch_of_death_perk_flavor:0 "#flavor The necromancer is attuned to the residual energy left by a ghost’s passage or touch, allowing her to determine if an object, person, or area had been touched or influenced by a ghost.#!"
 reveal_the_catene_perk_effect:0 "没做"
 reveal_the_catene_perk_flavor:0 "#flavor The necromancer recognizes the ashen mark left on objects by the dead, allowing her to distinguish between ghostly playthings and fetters.#!"
 tread_upon_the_grave_perk_effect:0 "没做"
 tread_upon_the_grave_perk_flavor:0 "#flavor The necromancer feels when she is close to the world of the dead. One necromancer might use her natural perception, whilst another might scry, but both can sense where the Underworld touches the living world.#!"
 death_knell_perk_effect:0 "没做"
 death_knell_perk_flavor:0 "#flavor The necromancer feels when she is close to the world of the dead. A necromancer might use her natural perception, whilst another might scry, but both can sense where the Underworld touches the living world.#!"
 ephemeral_binding_perk_effect:0 "没做"
 ephemeral_binding_perk_flavor:0 "#flavor By infusing an object, person, or place with her own ashen energy, the necromancer can create an artificial fetter rather than have to rely on finding one by chance.#!"
 POD_unfinished_content:0 "没做"
 full_giovanni_necromancy_tooltip:0 "你将获得整颗乔凡尼亡灵术树。"
 full_cappadocian_necromancy_tooltip:0 "你将获得整颗卡帕多西亚亡灵术树。"
 full_harbinger_necromancy_tooltip:0 "你将获得整颗骸骨预告者亡灵术树。"
 full_lamia_necromancy_tooltip:0 "你将获得整颗拉米亚亡灵术树。"
 full_nagaraja_necromancy_tooltip:0 "你将获得整颗那伽罗阇亡灵术树。"
 full_impundulu_necromancy_tooltip:0 "你将获得整颗魔蛇鹫亡灵术树。"
 POD_masquerade_risk_decrease_necromancy_ashes_to_ashes_tt:0 "我亡灵术[discipline|E]的“尘归于尘”降低了我的潜藏暴露风险。"
 POD_masquerade_risk_decrease_necromancy_tend_the_body_garden_tt:0 "我支配术[discipline|E]的“打理躯体花园”降低了我的潜藏暴露风险。"
 POD_find_wraith_interaction:0 "捕捉死灵"
 POD_find_wraith_interaction_desc:0 "在你的领地中寻找适合你下手的[GetTrait('wraith').GetName( GetPlayer )]。"
 POD_find_wraith.100.t:0 "邻家怪事"
 POD_find_wraith.100.desc:0 "搜索该区域时，你会发现附近有一些死灵可以很容易的被暗中袭击。"
 POD_find_wraith.100.option.a:0 "现在我该对你做什么？"
 POD_curse_of_the_maelstrom_interaction:0 "恶湍诅咒"
 POD_curse_of_the_maelstrom_interaction_desc:0 "召唤怨灵群，给敌人的首都带来混乱和毁灭。"
 POD_curse_of_the_maelstrom_interaction.tt:0 "召唤怨灵群，给敌人的首都带来混乱和毁灭，降低建筑速度，税收和控制度。"
 POD_curse_of_the_maelstrom.100.t:0 "恶湍诅咒"
 POD_curse_of_the_maelstrom.100.desc:0 "只要深吸一口气，用力呼出，你就能召唤出怨灵群，那些尊崇湮灭的可怕鬼魂，来对付你的敌人，虽然对世俗的观察者来说，没有证据能显示出发生了什么，但即使是在摇篮中的婴儿也会感觉到可怕的事情即将发生。"
 POD_curse_of_the_maelstrom.100.option.a:0 "让湮灭的仆从们飞舞吧！"
 POD_curse_of_the_maelstrom.100.option.a.tt:0 "你在[target.GetFirstName]的首都召出怨灵群"
 POD_curse_of_the_maelstrom.100.option.b:0 "时机未到。"
 POD_curse_of_the_maelstrom.100.option.b.tt:0 "你将放弃诅咒其国家的想法。目前而言……"
 POD_capital_county_maelstrom_cursed_toast:0 "[attacker.GetFirstName]在你的首都召出了怨灵群并造成了严重破坏！"
 POD_maelstrom_cursed_enemy_realm_toast:0 "怨灵们在[target.GetFirstName]的首都肆虐。"
 POD_wails_and_whispers_interaction:0 "哀嚎与低语"
 POD_wails_and_whispers_interaction_desc:0 "让目标更难抵御谋杀计谋"
 POD_wails_and_whispers_interaction.tt:0 "使用你的亡灵术力量，你可以使目标在5年内更难抵御谋杀计谋。"
 POD_wails_and_whispers.100.t:0 "哀嚎与低语"
 POD_wails_and_whispers.100.desc:0 "随着亡灵术师的理解加深，她探索了生与死之间摇摆不定的屏障。当她像报丧女妖一样尖叫时，她可以引诱一个灵魂走向灭亡，增加承受严重伤害的概率。"
 POD_wails_and_whispers.100.option.a:0 "让我在你耳边低语"
 POD_wails_and_whispers.100.option.b:0 "也许我该重新考虑一下"
 POD_wails_and_whispers.100.option.b.tt:0 "现在时机还不成熟。但它可能很快就会到来……"
 POD_wails_and_whispers_actor_toast:0 "成功！"
 POD_wails_and_whispers_actor_toast.desc:0 "[recipient.GetFirstName]将更难抵御敌对计谋"
 POD_wails_and_whispers_enemy_toast:0 "绝望！"
 POD_wails_and_whispers_enemy_toast.desc:0 "[actor.GetFirstName]通过哀嚎与低语诅咒了你！"
 POD_wails_and_whispers_failure_toast:0 "失败！"
 POD_wails_and_whispers_failure_toast.desc:0 "你没能对[recipient.GetFirstName]使出哀嚎与低语！"
 POD_cthonic_womb_perk_effect.tt:0 "[victim.GetFirstName]将作为[GetTrait('wraith').GetName( GetPlayer )]从死亡回归"
 POD_intimations_of_mortality_perk_interaction:0 "短生的暗示"
 POD_intimations_of_mortality_interaction_desc:0 "用短生种的令人不愉和厌恶的一面来诅咒目标吸血鬼。"
 POD_intimations_of_mortality_interaction.tt:0 "使用你的亡灵术的力量，你可以使目标在1年内无法处理压力，也无法使用血涌。"
 POD_intimations_of_mortality.100.t:0 "短生的暗示"
 POD_intimations_of_mortality.100.desc:0 "短生的暗示将短生种的令人不快和恼怒的一面加诸于吸血鬼身上。这些经验是直接从律能使用者的记忆中提取的，包括诸如凡人的饥饿、消除体内废物的需要、低敏锐的感官以及容易受到身体创伤等，即使是稚子吸血鬼也能甩掉的东西。"
 POD_intimations_of_mortality.100.option.a:0 "[recipient.GetFirstName]需要被提醒短生种是怎么样的"
 POD_intimations_of_mortality.100.option.a.tt:0 "让我们看看[recipient.GetSheHe]如何处理"
 POD_intimations_of_mortality.100.option.b:0 "也许我该重新考虑一下"
 POD_intimations_of_mortality.100.option.b.tt:0 "也许[recipient.GetSheHe]不该遭受这。至少不是现在……"
 POD_intimations_of_mortality_actor_toast:0 "成功！"
 POD_intimations_of_mortality_actor_toast.desc:0 "[recipient.GetFirstName]将更难抵御压力值"
 POD_intimations_of_mortality_enemy_toast:0 "弱点！"
 POD_intimations_of_mortality_enemy_toast.desc:0 "[actor.GetFirstName]通过短生的暗示诅咒了你！"
 POD_intimations_of_mortality_failure_toast:0 "失败！"
 POD_intimations_of_mortality_failure_toast.desc:0 "你没能对[recipient.GetFirstName]使出短生的暗示！"
 POD_gift_of_melancholia_perk_interaction:0 "忧郁赠礼"
 POD_gift_of_melancholia_interaction_desc:0 "对敌人的国家造成一种剧烈萎缩病。这种疾病在凡人中具有高度的传染性，凡人只需靠近就能将其传播给对方。"
 POD_gift_of_melancholia_interaction.tt:0 "对敌人的国家造成一种剧烈萎缩病。这种疾病在凡人中具有高度的传染性，凡人只需靠近就能将其传播给对方。"
 POD_gift_of_melancholia_actor_toast:0 "瘟疫在[recipient.GetFirstName]的国家肆虐。"
 POD_gift_of_melancholia_actor_toast.desc:0 "希望你不会因此而后悔。"
 POD_gift_of_melancholia_enemy_toast:0 "瘟疫在你的国家肆虐。"
 POD_gift_of_melancholia_enemy_toast.desc:0 "它在此时看上去已经不可能停止"
 POD_gift_of_melancholia_failure_toast:0 "你没能在[recipient.GetFirstName]的国家散布疾病"
 POD_gift_of_melancholia_failure_toast.desc:0 "但未来会有更多的机会……"
 POD_gift_of_melancholia.100.t:0 "忧郁赠礼"
 POD_gift_of_melancholia.100.desc:0 "该力量对凡人和该隐之子都会造成一种剧烈萎缩病。两者都会受到疾病的折磨，导致头晕、虚弱、乏力和恶心。这种疾病在凡人中具有高度的传染性，他们仅仅通过接近就能把它传播给对方。\n\n一旦疾病开始传播，由于它的致病力，是没有办法阻止它的，这意味着唯一的选择是让它自己消失。你也没有办法控制疾病在第一次感染后的传播，所以如果你不小心，你自己的地盘也可能遭受同样的命运。"
 POD_gift_of_melancholia.100.option.a:0 "我带着可怕的礼物而来"
 POD_gift_of_melancholia.100.option.b:0 "也许我该重新考虑一下"
 POD_gift_of_melancholia.100.option.b.tt:0 "你放弃了在其的国家传播疾病的计划。目前而言……"
 POD_gift_of_melancholia_interaction_success:0 "疾病将在[target.GetFirstName]的首都县爆发，并随着时间的推移从那里蔓延开来。"
 POD_gift_of_melancholia_interaction_failure:0 "疾病失去了掌控"
 POD_witchs_fruit_interaction:0 "女巫之果"
 POD_witchs_fruit_interaction_desc:0 "用密谋骗取凡人食用注入亡灵术能量的可食用植物物质"
 POD_witchs_fruit_interaction.tt:0 "用密谋骗取凡人食用注入亡灵术能量的可食用植物物质"
 POD_witchs_fruit.100.t:0 "女巫之果"
 POD_witchs_fruit.100.desc:0 "每样植物都依靠死亡来生长。腐烂之物丰富了土壤，而树木、藤蔓和草在吸收重要的营养物质的同时，也吸收了坏死回声。一个亡灵术师可以通过将它们的果实暴露在她的血液中来唤醒这种死亡灵光。她会唤醒并集中它们的微量坏死能量，因此任何食用它们的凡人在受到它们的影响时，都会被扭曲的鬼魂和早已倒下的建筑组成的幻觉所迷惑。"
 POD_witchs_fruit.100.option.a:0 "是时候让[recipient.GetFirstName]品尝禁果了"
 POD_witchs_fruit.100.option.a.tt:0 "一颗漂亮的红苹果……"
 POD_witchs_fruit.100.option.b:0 "也许我该重新考虑一下"
 POD_witchs_fruit.100.option.b.tt:0 "果实尚未成熟……"
 POD_witchs_fruit_actor_toast:0 "成功！"
 POD_witchs_fruit_actor_toast.desc:0 "你觉得这些苹果怎么样，[recipient.GetFirstName]？"
 POD_witchs_fruit_enemy_toast:0 "混乱！"
 POD_witchs_fruit_enemy_toast.desc:0 "你吃的某样东西与你相冲。"
 POD_witchs_fruit_failure_toast:0 "失败！"
 POD_witchs_fruit_failure_toast.desc:0 "[recipient.GetFirstName]没有食用女巫之果"
 POD_raise_the_green_one_interaction:0 "唤起绿尸"
 POD_raise_the_green_one_interaction_desc:0 "唤起一具被植物物质束缚并强化的尸体。"
 POD_raise_the_green_one_interaction.tt:0 "唤起一具被植物物质束缚并强化的尸体。覆盖在它皮肤上的叶子和强壮的藤蔓补充了它腐烂的筋肉。活外壳赋予它速度和自我保护的本能，这在其他活死人身上是看不到的。"
 POD_song_of_the_dead_interaction:0 "死者之歌"
 POD_song_of_the_dead_interaction_desc:0 "导致目标随着时间的推移而获得压力"
 POD_song_of_the_dead_interaction.tt:0 "导致目标随着时间的推移而获得压力"
 POD_song_of_the_dead_disable_interaction:0 "停止歌唱"
 POD_song_of_the_dead_disable_interaction_desc:0 "你停止歌唱死者之歌"
 POD_song_of_the_dead_disable_interaction.tt:0 "你停止唱死者之歌，让目标最终放松下来"
 POD_song_of_the_dead.100.t:0 "死者之歌"
 POD_song_of_the_dead.100.desc:0 "吸血鬼吟唱着，将未曾听过的话语编入歌曲，向听众灌输对死亡的不健康的迷恋。受影响的人发现自己被吸引到孤独、不吉利的地方，他们陷入抑郁；死亡让他们感到前所未有的担忧，他们看到到处都是不祥之兆。如果长期受到这种力量的影响，凡人会发疯，变得有自杀倾向，而吸血鬼最终会屈服于蛰眠。"
 POD_song_of_the_dead.100.option.a:0 "我将为你唱我的民众的歌"
 POD_song_of_the_dead.100.option.b:0 "也许我该重新考虑一下"
 POD_song_of_the_dead.100.option.b.tt:0 "还会有其他机会让大家一起唱。"
 POD_song_of_the_dead_actor_toast:0 "成功！"
 POD_song_of_the_dead_actor_toast.desc:0 "[target.GetFirstName]受到死者之歌的影响"
 POD_song_of_the_dead_enemy_toast:0 "绝望！"
 POD_song_of_the_dead_enemy_toast.desc:0 "[attacker.GetFirstName]让你受到了死者之歌的影响"
 POD_song_of_the_dead_failure_toast:0 "失败！"
 POD_song_of_the_dead_failure_toast.desc:0 "[target.GetFirstName]没有受到你的死者之歌的影响"
 POD_song_of_the_dead_disaster_toast:0 "灾难！"
 POD_song_of_the_dead_disaster_toast.desc:0 "你受到了你试图赐给[recipient.GetFirstName]的厄运的影响。"
 POD_song_of_the_dead_continues_toast:0 "死者之歌持续"
 POD_song_of_the_dead_continues_toast.desc:0 "这首歌永不停止……"
 POD_song_of_the_dead_continues_target_toast.desc:0 "[attacker.GetFirstName]还在歌唱死者之歌"
 POD_song_of_the_dead_ends_toast:0 "死者之歌停止了"
 POD_song_of_the_dead_ends_attacker_toast.desc:0 "你停止对[target.GetFirstName]歌唱死者之歌"
 POD_song_of_the_dead_ends_target_toast.desc:0 "[attacker.GetFirstName]不再对你歌唱死者之歌"
 necromancy_dust_to_dust_perk_name:0 "土归于土"
 necromancy_dust_to_dust_perk_effect:0 "将灰烬女士之拥升级为土归于土"
 necromancy_dust_to_dust_perk_flavor:0 "#flavor As Ashes to Ashes affects corpses, so Dust to Dust affects the bodies of vampires. Invoking Dust to Dust allows a necromancer to reduce another vampire into a pile of ashes as though he had been stranded in the sunlight or burned at the stake.#!"