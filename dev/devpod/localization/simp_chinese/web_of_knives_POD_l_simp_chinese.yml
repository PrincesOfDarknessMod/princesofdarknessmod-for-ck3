 chase_bounty_action:0 "消灭"
 chase_bounty_desc:0 "在目标人物独自一人时跟踪其，然后开始与其单挑，以完成你的合同并获得奖励。"
 CHASE_BOUNTY_SUCCESS_DESC:0 "你找到并攻击目标。"
 CHASE_BOUNTY_DISCOVERY_DESC:0 "其发现了你的任务。"
 chase_bounty_thier_prowess:0 "对方勇武"
 chase_bounty_my_prowess:0 "我方勇武"
 chase_bounty_desc_general:0 "在目标人物独自一人时跟踪其，然后开始与其单挑，以完成你的合同并获得奖励。"
 POD_chase_bounty_interaction_desc:0 "猎杀目标来获得赏金！"
 POD_web_of_knives.1.t:0 "技巧之试"
 POD_web_of_knives.1.desc:0 "你已经被刀锋之网的一位难以捉摸的招募者联系上了。将会有在他的监督下的三大试炼，第一试炼将是针对技巧的“简单”测试。使用刀剑或密谋，你必须给他留下足够的印象，才能通过。你得选择这两种类型刺客技能中的之一来展示。"
 POD_web_of_knives.1.a:0 "刀剑"
 POD_web_of_knives.1.effect.success.desc:0 "你赢了！"
 POD_web_of_knives.1.critical.failure.effect.desc:0 "你被击败了……"
 POD_web_of_knives.1.b:0 "密谋才是我的强项"
 POD_web_of_knives.1.c:0 "我还没准备好"
 web_setback_tooltip:0 "你暂时放弃了继续试炼。你可以日后再次尝试。"
 POD_web_of_knives.1.d:0 "这太难了！"
 web_ending_tooltip:0 "你放弃了试炼并且切断了你与刀锋之网的所有关系。你将无法于未来再次联系他们。"
 POD_web_of_knives.3.t:0 "试炼：挫败"
 POD_web_of_knives.3.desc:0 "你在试炼中被刷下了。刀锋之网将暂时不会认可你，你将不得不再等待一段时间，如果想再尝试的话。不过，除了一点自信之外，也并没有失去任何真正有价值的东西。"
 POD_web_of_knives.3.a:0 "下次，我能行"
 web_trial_failure_tooltip:0 "你将可以在五年后继续"
 POD_web_of_knives.3.b:0 "我不会浪费我的时间在这些疯子上！"
 POD_web_of_knives.2.t:0 "人性之试"
 POD_web_of_knives.2.desc:0 "第二试炼其实很简单。你必须杀死呈现在你面前的特定凡人。莫须问答，莫须理由。\n只是毫无意义的谋杀。\n很明显，他们在测试你是否有能力服从命令，无论它们看起来多么残酷或愚蠢。他们也可能是在判断你的道德底线，因为刀锋之网的成员被称为是非常不人道的吸血鬼。"
 POD_web_of_knives.2.a:0 "无情杀手就是了"
 POD_web_of_knives.2.b:0 "这过分了……目前而言"
 POD_web_of_knives.2.c:0 "这太过分了！"
 POD_web_of_knives.5.t:0 "信仰之试"
 POD_web_of_knives.5.desc:0 "最后试炼实际上更像是一个誓言，而不是其他什么。刀锋之网相信一个虚构的故事，哈基姆[Embrace|E]了自己去对抗“受诅的加音子嗣”。他们的整个刺客事业只是一个幌子，目的是尽可能多地杀戮[cainites|E]而不受惩罚，并慢慢接管他们所有的[Clan|E]。\n很明显，他们是痴呆和妄想……又或不是？也许该血腥不悔谋杀密教的一部分吸引着你。或者你可以假意相信他们虚构的故事……但若他们发现了，这显然算是严重的侮辱。"
 POD_web_of_knives.5.a:0 "荣耀归于哈基姆！"
 POD_web_of_knives.5.b:0 "荣耀归于哈基姆……"
 POD_web_of_knives.5.effect.success.desc:0 "他们信了你！"
 POD_web_of_knives.5.success:0 "你进了！"
 POD_web_of_knives.5.critical.failure.effect.desc:0 "他们没信……"
 POD_web_of_knives.5.critical.failure:0 "切莫相信密教"
 POD_web_of_knives.5.c:0 "我得礼貌地拒绝"
 join_web_tooltip:0 "你将加入刀锋之网，解锁一个充满了待达成的悬赏的面板"
 WoK_target_loc: "目标："
 WoK_reward_loc: "赏金："
 WoK_contractor_loc: "金主："
 WoK_title_loc: "#T 刀锋之网#!"
 WoK_out_range_loc: "不在外交范围内"
 web_of_knives_intro:0 "你可以通过任何手段杀死目标。\n你还可以获得追杀赏金互动，与目标进行致命的决斗。"
 POD_web_of_knives.6.t:0 "刺客！"
 POD_web_of_knives.6.desc:0 "你已经研究你的目标有一段时间了，了解其的习惯，其的长处，更重要的是其的弱点。吸血鬼是天生偏执的动物，要找到一个可以下手的时机往往相当困难，但你的彻底侦察成功地找到了这样一个机会。\n从阴影中跳出来，你先下手为强。你们中只有一个人能够活着走出这次遭遇战。"
 POD_web_of_knives.6.a:0 "死亡为你而来！"
 web_of_knives_diablerie_tt:0 "在决斗结束时，你不是简单地杀死目标，而是进行一次[diablerie|E]。"
 POD_web_of_knives.6.b:0 "你的灵魂是我的了！"
 POD_web_of_knives.7.t:0 "刀锋之网"
 POD_web_of_knives.7.desc:0 "哈基姆的子嗣们有一个长久以来的传统——尽管内部对其有激烈的争论——那就是为其他吸血鬼充当雇佣兵或杀手。在秘密的 刀锋之网派系的组织下，这些赏金为冒险的哈基姆圣裔带来了巨大的财富（也带来了[diablerie|E]不太谨慎的目标的机会）。虽然没有任何一个氏族成员被迫遵循这做法，但他们中的大多数人至少会涉足这种做法，至少可以加强其他吸血鬼对哈基姆圣裔人都是不能招惹的嗜血杀手的误解。\n#X 刀锋之网是哈基姆圣裔的一个决定性特征。如果你所在地区的吸血鬼对别人的头颅进行悬赏，你可以通过专属互动（或者干脆使用其他谋杀手段）进行追杀，以获得报酬。你可以在屏幕右侧的选项中选取潜在的赏金。#! "
 POD_web_of_knives.7.a:0 "保持一个正面的声誉。"
 POD_web_of_knives.600.t:0 "吸榨"
 POD_web_of_knives.600.desc:0 "不仅杀死而且还吞噬另一个存在的灵魂是最令人发指的行为之一。大多数血族认为这是最恶劣的罪行。然而，没啥比这还能让心兽更渴望。\n\n最终，目标在我掌握之中。我是该将其吸到只剩其的存在的核心？我是该榨取其的心头血？我还是该将其抽干抹净？"
 POD_web_of_knives.600.option.a:0 "吞魂！"