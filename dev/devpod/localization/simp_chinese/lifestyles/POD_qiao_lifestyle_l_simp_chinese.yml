l_simp_chinese:
 GAINS_QIAO_LIFESTYLE_XP: "获得$VALUE|V0$[qiao_lifestyle|E]经验"
 GAINED_QIAO_LIFESTYLE_XP: "获得了$VALUE|V0$[qiao_lifestyle|E]经验"
 I_GAIN_QIAO_LIFESTYLE_XP: "你获得$VALUE|V0$[qiao_lifestyle|E]经验"
 I_GAINED_QIAO_LIFESTYLE_XP: "你获得了$VALUE|V0$[qiao_lifestyle|E]经验 "
 TARGET_GAINS_QIAO_LIFESTYLE_XP: "[CHARACTER.GetShortUIName]获得$VALUE|V0$[qiao_lifestyle|E]经验"
 TARGET_GAINED_QIAO_LIFESTYLE_XP: "[CHARACTER.GetShortUIName]获得$VALUE|V0$[qiao_lifestyle|E]经验"
 GAINS_A_QIAO_LIFESTYLE_PERKPOINT: "获得$VALUE|V0$$qiao_lifestyle$的[perk|E]"
 GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "获得了$VALUE|V0$$qiao_lifestyle$的[perk|E] "
 I_GAIN_A_QIAO_LIFESTYLE_PERKPOINT: "你获得$VALUE|V0$$qiao_lifestyle$的[perk|E]"
 I_GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "你获得了$VALUE|V0$$qiao_lifestyle$的[perk|E]"
 TARGET_GAINS_A_QIAO_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName]获得$VALUE|V0$$qiao_lifestyle$的[perk|E]"
 TARGET_GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName]获得$VALUE|V0$$qiao_lifestyle$的[perk|E]"
 QIAO_LIFESTYLE_PERK_POINTS_TRIGGER: "窍生活方式技能点：$NUM|V0$"
 POD_qiao_elder_penalty_effect: "#X 窍高等力量对凡人而言过于强大，无法安全使用。#!"
 CELESTIAL_PUNISHMENT_PERK_EFFECT: "作为主要进攻方或防守方发动[war|E]时，对敌方所有统治者施加[GetModifier('celestial_punishment_modifier').GetNameWithTooltip]。\n#flavor 这些符咒是对神明的警告。当命中目标时会自燃，虽不造成物理伤害但会灼烧目标的魄。这些纸符如同飞刀般精准，即便遭遇强风也能命中目标。#!"
 DIVINE_BINDINGS_PERK_EFFECT: "将[GetPerk('celestial_punishment_perk').GetName(GetPlayer)]的[modifier|E]提升为[GetModifier('divine_bindings_modifier').GetNameWithTooltip]。\n#flavor 当射向鬼人目标时，这些看似无害的纸符会逆风飞行甚至绕过障碍。命中后符咒会散发幽绿光芒，延展变厚缠绕目标。#!"
 HEAVENLY_FLAMES_PERK_EFFECT: "将[GetPerk('celestial_punishment_perk').GetName(GetPlayer)]的[modifier|E]提升为[GetModifier('heavenly_flames_modifier').GetNameWithTooltip]。\n#flavor 当此咒符命中鬼神目标时，会立即爆发出亮蓝色火焰造成恶性伤害。与天缚咒相同，符咒能绕过障碍追踪目标。#!"
 CELESTIAL_FIRES_PERK_EFFECT: "将[GetPerk('celestial_punishment_perk').GetName(GetPlayer)]的[modifier|E]提升为[GetModifier('celestial_fires_modifier').GetNameWithTooltip]。\n#flavor 焚燎天火与熏灼天焰效果相同，唯一区别在于：除非特殊防御否则无法抵消伤害#!"
 HEAVENS_THUNDER_PERK_EFFECT: "将[GetPerk('celestial_punishment_perk').GetName(GetPlayer)]的[modifier|E]提升为[GetModifier('heavens_thunder_modifier').GetNameWithTooltip]。\n#flavor 作为[GetTrait('shih').GetName( GetNullCharacter )]最强的咒法，一旦施放几乎无法阻挡。符咒离手时会迸发强光，以闪电之速飞向目标。命中时将爆发雷电球，足以重创绝大多数恶魔。#!"
 HEAVENS_JUDGMENT_PERK_EFFECT: "将[GetPerk('celestial_punishment_perk').GetName(GetPlayer)]的[modifier|E]提升为[GetModifier('heavens_judgment_modifier').GetNameWithTooltip]。\n#flavor 此窃准备的祷文能直接灼烧鬼神体内的气，将被窃的生命力返还自然以滋养万物。#!"
 DIVINE_PROHIBITION_PERK_EFFECT: "将[GetPerk('celestial_punishment_perk').GetName(GetPlayer)]的[modifier|E]提升为[GetModifier('divine_prohibition_modifier').GetNameWithTooltip]。\n#flavor 此“吾神窍”最高阶技法可切断目标与外界气的联系。#!"
 STEEL_SKIN_PERK_EFFECT: "#flavor 运用此力量提升你的耐力。#!"
 DRAGONS_SPEED_PERK_EFFECT: "#flavor 运用此力量提升你的敏捷。#!"
 TIGERS_STRENGTH_PERK_EFFECT: "#flavor 运用此能力在战前提升你的力量。#!"
 CELESTIAL_EYES_PERK_EFFECT: "#flavor 你通过此层“魔功窍”提升感知力。#!"
 BODY_OF_THE_DRAGON_PERK_EFFECT: "#flavor 将所有属性提升至超人类水平。#!"
 TEN_OX_STRENGTH_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]能短暂爆发超人般的力量#!"
 DIAMOND_BODY_PERK_EFFECT: "#flavor 运用此灵赋的[GetTrait('shih').GetName( GetNullCharacter )]会展现惊人的伤害抵抗能力。#!"
 OPENED_EYES_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n在战争或[single_combat_duel_plural|E]对决中对抗$glossary_fera$时，不再受#TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L 妄悸#!#!影响。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]能看破鬼神的本质，并免疫妄悸效果。#!"
 DIVINE_PERCEPTIONS_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor 此灵赋让[GetTrait('shih').GetName( GetNullCharacter )]能洞见他人灵魂，主要起测谎之效，但也能识破凡人被恶魔附体的状况。#!"
 WIND_TALK_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\n解锁$seek_aid_of_the_spirits_decision$[decision|E]\n#flavor 掌握此能力的[GetTrait('shih').GetName( GetNullCharacter )]可聆听灵界住民并与之交流，但鬼神无义务回应其质询。#!"
 CELESTIAL_WINDOW_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#flavor 施展此灵赋时，[GetTrait('shih').GetName( GetNullCharacter )]可与阴/阳界某一住民进行全维度互动。该灵体将被视作与士处于同一存在层面，可被接触、伤害、协助或交战。#!"
 CELESTIAL_DOORWAY_PERK_EFFECT: "Allows you to interact with beings of the [umbra|E] when you are in the material world.\n#flavor The [GetTrait('shih').GetName( GetNullCharacter )] can actively interact with the [spirit_worlds|E]; however, this course of action is not necessarily the wisest to take. While the character actually remains in the Middle Kingdom, he can see and affect the Yin and [Glossary('Yang Worlds','game_concept_yang_world_desc')] around him. Although, the denizens of those realms can return the favor, and many of them aren't fond of the [GetTrait('shih').GetName( GetNullCharacter )].#!"
 SIGHT_WITHOUT_EYES_PERK_EFFECT: "$countermeasures_unlocks_t3_all_seeing_eye$\n#flavor 此技法使[GetTrait('shih').GetName( GetNullCharacter )]无需依赖物理感官，仅凭灵觉即可感知万物。#!"
 THE_EYE_OF_HEAVEN_PERK_EFFECT: "$countermeasures_unlocks_t4_all_seeing_eye$\n#flavor  掌握此境界的[GetTrait('shih').GetName( GetNullCharacter )]可开启天眼，洞见任何场所。#!"
 BARRIER_OF_PAIN_PERK_EFFECT: "#flavor 此阶段的[GetTrait('shih').GetName( GetNullCharacter )]能强行屏蔽痛感。#!"
 THE_CLOSING_WOUND_PERK_EFFECT: "通过[character_interaction|E]角色交互治疗任意等级的[GetTrait('wounded_1').GetName(GetPlayer)][trait|E]创伤。\n#flavor 此阶段的[GetTrait('shih').GetName( GetNullCharacter )]能治愈伤口：淤伤消退，创口愈合只留新疤。#!"
 SPIRITUAL_HEALING_PERK_EFFECT: "强化[GetPerk('the_closing_wound_perk').GetName(GetPlayer)]，使其能够治愈任何非超自然疾病。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]可以凭借此能力重新接合骨骼并重建神经组织。如果在战斗情况下使用，这个过程会很痛苦且通常有风险。骨骼必须被正确复位，否则[GetTrait('shih').GetName( GetNullCharacter )]有永久性致残的风险。#!"
 ESCAPE_FROM_DEATH_PERK_EFFECT: "强化[GetPerk('the_closing_wound_perk').GetName(GetPlayer)]能力，使其可治愈[GetTrait('maimed').GetName(GetPlayer)]及其他永久性健康问题。\n#flavor 掌握此能力的[GetTrait('shih').GetName( GetNullCharacter )]甚至能修复烧伤等能量伤害。虽极为实用，\"逃出生天\"的代价也异常高昂。#!"
 FLAMES_OF_THE_PHOENIX_PERK_EFFECT: "强化[GetPerk('the_closing_wound_perk').GetName(GetPlayer)]，使其能以巨大代价治愈任何超自然疾病。\n免疫心脏病发作。\n#flavor 运用此能力者可在细胞层面完全再生。虽不能起死回生，但能逆转辐射中毒、癌症、严重创伤乃至衰老的影响。#!"
 THE_LIZARDS_TAIL_PERK_EFFECT: "每年自动治愈所有健康问题\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]可重生缺失的肢体或器官，任何不致死的损伤皆可复原。#!"
 ASHES_OF_THE_PHOENIX_PERK_EFFECT: "在[stress|E]低于300时，消耗200[static_stress|E]实现非自然死亡后复活。\n#flavor 精研\"凤凰渡\"的[GetTrait('shih').GetName( GetNullCharacter )]能从死亡彼岸归来。#!"
 THOUSAND_FISTS_PERK_EFFECT: "作为[knight|E]参与[combat_phase|E]时，提升对敌方[knights|E]造成伤害的几率。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]凝聚阳罡之气，拳出如流星追月，攻势之迅捷已非凡人肉眼可辨。#!"
 SPEAR_HAND_PERK_EFFECT: "作为[knight|E]参与[combat_phase|E]时，提升对敌方[knights|E]造成重创的几率。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]将阳罡之气聚于掌中，炽烈气劲扭曲空气，掌风所及皆成焦土。#!"
 BURNING_GHOSTS_PERK_EFFECT: "作为[knight|E]参与[combat_phase|E]时，提升对敌方[knights|E]造成重创的几率。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]调息运气，周身泛起金芒，护体罡气自动攻击灵体。看似未动拳脚，实则气劲已摧魂裂魄。#!"
 STEEL_BODY_PERK_EFFECT: "作为[knight|E]参与[combat_phase|E]时，提升重创敌方[knights|E]的几率。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]运起阴煞之气，肌骨硬化如玄铁。拳掌相交时竟发出金铁铮鸣。#!"
 THOUSAND_SWORDS_PERK_EFFECT: "作为[knights|E]参与[combat_phase|E]时，有额外几率重创敌方[knight|E]。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]集中其气，然后愤怒地向敌人猛攻。每一次打击都在敌人身上留下伤口，撞击声犹如金属相击。#!"
 HUNDRED_WARRIORS_STRIKE_PERK_EFFECT: "作为[knights|E]参与[combat_phase|E]时，有额外几率杀死敌方[knight|E]。\n#flavor 充满狂暴之气的[GetTrait('shih').GetName( GetNullCharacter )]变成了一股毁灭的旋风。#!"
 HEAVEN_THUNDER_STRIKE_PERK_EFFECT: "作为[knights|E]参与[combat_phase|E]时，有额外几率杀死敌方[knight|E]。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]可以将气集中成一击，其力量足以劈开钢铁或像地震一样震撼大地。#!"
 FROZEN_RIVER_PERK_EFFECT: "免疫所有吸取力量，包括$pod_Embrace$。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]使用她的阳气在自己的生命力周围建立一个保护屏障，从而防止她的气被盗。#!"
 STOLEN_SERPENT_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]可以捕获任何针对他的远程超自然攻击，然后将其投掷回施放它的对手。这是一项危险的工作，因为[GetTrait('shih').GetName( GetNullCharacter )]必须展示完美的时机，才能抓住向他投掷的神秘能量。#!"
 CELESTIAL_BARRIER_PERK_EFFECT: "作为主要攻击者或防御者开始[war|E]时，使敌对阵营的每个统治者都受到[GetModifier('shih_celestial_barrier_modifier').GetNameWithTooltip]影响。\n#flavor 凭借这种力量，[GetTrait('shih').GetName( GetNullCharacter )]暂时阻断了鬼神从其他来源获取气的能力。#!"
 CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT: "#flavor 使用此能力的[GetTrait('shih').GetName( GetNullCharacter )]能够从鬼神那里窃取气。虽然被窃取的气不再对神灵可用，但[GetTrait('shih').GetName( GetNullCharacter )]也不能使用被窃取的气。#!"
 BITE_OF_THE_MU_PERK_EFFECT: "作为[character_interaction|E]，使用被囚禁的$POD_splat_kueijin$来降低[stress|E]。\n#flavor 使用此能力的[GetTrait('shih').GetName( GetNullCharacter )]不仅窃取目标神灵的气，而且还在攻击鬼神时使用该气。这个过程非常冒险，因为它会唤醒[GetTrait('shih').GetName( GetNullCharacter )]的魄。#!"
 RIGHTEOUS_HUNGRY_SPIRIT_PERK_EFFECT: "免疫敌意精神力量。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]的灵魂如此强大，以至于任何试图吸取或窃取他气的尝试都会自动失败，而且猎人可以从攻击者那里窃取气。#!"
 DEMON_EATING_TECHNIQUET_PERK_EFFECT: "解锁一个处决选项，让你可以通过吞噬一个$POD_splat_kueijin$来增加基础[skills|E]。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]对鬼神的近战攻击（武装和徒手）不仅造成伤害，还会消散目标的精气。#!"
 EYES_OF_THE_DRAGON_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]盯着对手。恐吓是成功避免战斗的关键。#!"
 DARK_REFLECTION_PERK_EFFECT: "#flavor 这种力量迫使[GetTrait('shih').GetName( GetNullCharacter )]的敌人认识到他们行为的后果。[GetTrait('shih').GetName( GetNullCharacter )]在对鬼神宣判时使用这种力量。#!"
 HUNTED_EYES_PERK_EFFECT: "通过[character_interaction|E]，对同区域的[static_stress|E]施加100点$POD_splat_kueijin$。\n#flavor 此术对[Glossary('饿殍','game_concept_kuei_jin_desc')]与怨灵皆有效。[GetTrait('shih').GetName( GetNullCharacter )]凝视目标双眼，迫使其重温在[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]经受的折磨。#!"
 VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT: "作为[character_interaction|E]，尝试对$POD_splat_kueijin$获得[strong_hook|E]，可能性取决于您的[dread|E]。\n解锁$POD_can_command_wraith_trigger_loca$。\n#flavor 使用这种力量的[GetTrait('shih').GetName( GetNullCharacter )]可以命令一个灵类完成一个简单的任务。#!"
 DIVINE_ORDINANCE_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]在视觉范围内的所有对手中激发出压倒性的恐惧。#!"
 MANTLE_OF_HEAVEN_PERK_EFFECT: "#flavor 沐浴天道庇佑的猎魔人，在鬼神眼中化为恐怖化身。#!"
 DIVINE_MANDATE_PERK_EFFECT: "改进[GetPerk('voice_of_the_yama_kings_perk').GetName(GetPlayer)]，使其能够影响所有[splats|E]\n#flavor 以天堂之声说话的[GetTrait('shih').GetName( GetNullCharacter )]可以命令任何神灵并期望服从。#!"
 BALANCE_OF_THE_SPIRIT_PERK_EFFECT: "作为[character_interaction|E]，让目标损失50[static_stress|E]代价是25[static_stress|E]。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]可以辨别阴阳的精神失衡，并尝试用这种力量恢复正常的秩序。#!"
 FOCUS_OF_THE_MIND_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]在与鬼神战斗时消耗了大量的意志力。这种力量让他们重新振作起来，再次履行他们的神圣职责。#!"
 NIGHTMARE_EXORCISM_PERK_EFFECT: "[GetPerk('balance_of_the_spirit_perk').GetName(GetPlayer)]现在还允许你移除负面[stress|E][traits|E]。\n#flavor 许多[GetTrait('shih').GetName( GetNullCharacter )]向毒品和酒精，以缓解他们的精神痛苦。使用这种力量的[GetTrait('shih').GetName( GetNullCharacter )]采取更直接的方法，通过消除记忆的情感影响，并有望消除记忆造成的精神创伤。#!"
 SELF_EXORCISM_PERK_EFFECT: "你不再会被$POD_splat_wraith_plural$附身。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]，像所有凡人一样，都面临着恶魔附身的风险。有了这种力量，恶魔猎人与成功进入她身体的恶魔进行心灵战斗，获得了第二次驱逐恶魔的机会。#!"
 MENTAL_DOMINION_PERK_EFFECT: "[GetPerk('balance_of_the_spirit_perk').GetName(GetPlayer)]现在还允许您完全消除[stress|E]，以换取[GetModifier('mental_dominion_modifier').GetNameWithTooltip]。\n#flavor 使用这种力量的[GetTrait('shih').GetName( GetNullCharacter )]可以完全恢复她的意志力，并实际上削弱她的魄。#!"
 MOUNTAIN_MEDITATION_PERK_EFFECT: "#flavor 使用这种大师级异能的[GetTrait('shih').GetName( GetNullCharacter )]达到了一种宁静的程度，使他们像山根一样坚定不移。#!"
 WALKING_IN_BALANCE_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]在阴阳之间达到完美平衡，他克服了任何外部试图扰乱他内部气平衡的尝试。#!"
 CLOUD_WALKING_PERK_EFFECT: "#flavor 这种力量让[GetTrait('shih').GetName( GetNullCharacter )]能够无声无息地移动，不留下痕迹，即使是在奔跑时也是如此。[GetTrait('shih').GetName( GetNullCharacter )]不会留下任何气味来表明他曾经在某个区域出现过。#!"
 WATER_TREADING_PERK_EFFECT: "#flavor 凭借这种力量，[GetTrait('shih').GetName( GetNullCharacter )]能够穿越不稳定的表面，例如水或流沙，并几乎可以使用任何表面，甚至是树叶，进行攀爬。#!"
 WIND_STRIKE_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]利用对手自己的动能将敌人扔出令人难以置信的距离。#!"
 MOUNTAIN_STANCE_PERK_EFFECT: "作为[character_interaction|E]，进入或离开 [GetModifier('mountain_stance_modifier').GetNameWithTooltip]。\n#flavor [GetTrait('shih').GetName( GetNullCharacter )]吸收攻击的冲击，将力量重定向到地面。#!"
 CELESTIAL_WIND_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]运用这项能力时，会集中他的气来阻止目标前进，甚至有可能将对手击退。#!"
 ARROW_CUTTING_PERK_EFFECT: "#flavor [GetTrait('shih').GetName( GetNullCharacter )]的反射神经快得超乎常人，能够格挡任何远程攻击，甚至密集的子弹雨。#!"
 WIND_RACING_PRANA_PERK_EFFECT: "#flavor 通过这种能力，一名[GetTrait('shih').GetName( GetNullCharacter )]能够瞬间爆发出超越常人的速度。#!"