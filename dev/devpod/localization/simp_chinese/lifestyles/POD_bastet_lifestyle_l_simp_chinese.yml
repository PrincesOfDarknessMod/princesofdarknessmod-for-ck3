 HUMBABAS_ESCAPE_PERK_EFFECT:1 "You can't be imprisoned during sieges anymore.\n #flavor This Gift allows a wereleopard to dislocate her limbs and slide through small openings. #!"
 OJAS_SURGE_PERK_EFFECT:0 "As a [character_interaction|E], allows you to temporary increase an attribute.\n #flavor By channeling the spiritual energy within himself, the Bagheera can boost his physical and perceptual abilities to impossible levels.#!"
 COBRAS_DANCE_PERK_EFFECT:0 "More likely to [imprison|E] [characters|E] after a successful [siege|E] or [raid|E].\n #flavor Long ago, a panther named Tola entered into negotiations with King Snake. After weeks of discussion and debate, the two came to an understanding of sorts. No one knows what secrets Tola offered King Snake, but he learned this Gift as part of the exchange. The Dance allows a cat to freeze prey with a glance. #!"
 THE_PARADOX_OF_TIME_PERK_EFFECT:0 "Give [GetModifier('the_paradox_of_time_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n #flavor The werecat shows her target a dizzying and nonlinear view of the vast sweep of time, producing sickness and confusion rather than enlightenment. #!"
 SHIVAS_MIGHT_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_shiva_modifier' ).GetNameWithTooltip|L] or [GetModifier( 'POD_shapeshift_form_kali_modifier' ).GetNameWithTooltip|L] shapeshift option.\n #flavor The mightiest of wereleopards may change into a Juddho form reminiscent of Shiva the Destroyer. In a burst of holy light, the Bastet becomes a 12-foot-tall, six-armed Crinos-werecat wielding mystical flaming weapons, which lays waste to everything around it until nothing moves. #!"
