 revolt_of_the_land_perk_name:0 "大地的反抗"
 JUDGEMENT_OF_PESTILENCE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你吸收疾病并释放到目标的宫廷。\n#flavor 尊重猫类的社区会发现瘟疫被驱逐而出，而其他社区则会收到疾病。必须保持平衡。#!"
 bastettribegifts_lifestyle_name:0 "部族灵赋"
 bastettribegifts_lifestyle_desc:0 "专注于由部族守护灵所赠予的力量。"
 bastettribegifts_lifestyle_highlight_desc:0 "由于你的[GetModifier('POD_gnosis_5_modifier').GetNameWithTooltip]，这个生活方式中会给予额外#P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#!的[experience|E]积累。"
 monthly_bastettribegifts_lifestyle_xp_gain_mult:0 "每月部族灵赋[lifestyle|E]的[experience|E]"
