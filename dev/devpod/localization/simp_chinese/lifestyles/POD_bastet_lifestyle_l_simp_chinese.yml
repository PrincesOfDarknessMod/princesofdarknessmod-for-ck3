 HUMBABAS_ESCAPE_PERK_EFFECT: "你不会再在[siege|E]或[raid|E]中被囚禁。\n#flavor 这灵赋使得豹人能够脱臼自己的四肢，从而穿过狭小的开口。#!"
 OJAS_SURGE_PERK_EFFECT: "作为[character_interaction|E]，允许你临时增强一项属性。\n#flavor 通过引导自己体内的灵性能量，巴希拉可以将自己的体能和感知能力提升到不可思议的水平。#!"
 COBRAS_DANCE_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]\n#flavor 很久以前，一只名叫托拉的黑豹与蛇王进行了谈判。经过几周的讨论和争论，双方达成了某种共识。没人知道托拉给蛇王提供了什么秘密，但作为交易的一部分，他学会了此灵赋。此舞可以让猫看一眼就把猎物定住。#!"
 THE_PARADOX_OF_TIME_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('the_paradox_of_time_perk_modifier').GetNameWithTooltip][modifier|E]。\n#flavor 猫人向她的目标展示令人眼花缭乱的非线性叙事且时长浩瀚的视角，给予恶心和困惑，而不是启迪。#!"
 SHIVAS_MIGHT_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_shiva_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'POD_shapeshift_form_kali_modifier' ).GetNameWithTooltip|L]变形选项\n#flavor 最强大的豹人可以变身为类仿毁灭神湿婆的尤多形态。在一阵圣光中，芭丝特会变成一只十二英尺高、有六只手臂的战争形态猫人，挥舞着神秘的火焰武器，将周围的一切都摧毁，直到不剩任何能活动的东西。#!"
