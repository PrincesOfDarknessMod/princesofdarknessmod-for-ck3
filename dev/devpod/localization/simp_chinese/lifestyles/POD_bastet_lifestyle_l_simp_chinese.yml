 DENY_THE_HUNGRY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你使目标伯爵领获得[GetModifier( 'deny_the_hungry_perk_modifier' ).GetNameWithTooltip|L]。\n#flavor 传说中，古埃及的布巴斯塔曾用这灵赋来惩罚不敬的族群，使其遭受饥荒和干旱。#!"
 MADNESS_PERK_EFFECT:0 "作为[character_interaction|E]，允许你给予目标负面精神特质。\n#flavor 有了这灵赋，施术者可以强迫他人面对内心的恶魔，包括精神错乱和疯狂。失常的性质因人而异，但总是很严重，使受害者无法正常运作。#!"
