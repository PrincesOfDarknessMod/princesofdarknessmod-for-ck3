 chariot_of_lions_perk_name:0 "狮之战车"
 the_madness_of_crowds_perk_name:0 "群众的疯狂"
 MOUSEMAZE_PERK_EFFECT:0 "Give [GetModifier('mousemaze_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n #flavor An unsettling spell of confusion, this Gift disorients a target until he blunders around in a panic. Walls shift and close in, shadows lengthen, sounds drift to his ears from all corners, and familiar places seem strange and threatening. Although the magic has no real effect on the person’s surroundings, his terror and confusion send him into a frenzy, making him an easy target for the werecat lurking nearby.#!"
 PAWS_OF_THE_RAGING_SPIRIT_TIGER_PERK_EFFECT:0 "在[single_combat_duel|E]中对战灵体不再有耗费。"
 CALL_TO_BATTLE_PERK_EFFECT:0 "在战争中（作为指挥官时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('mousemaze_perk_modifier').GetNameWithTooltip]。"
 RISING_SUN_PERK_EFFECT:0 "在战争中（作为指挥官时）给予敌方[knights|E]和指挥官或在[single_combat_duel|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。"
 DANCE_OF_THE_CHAYA_PERK_EFFECT:0 "解锁$seek_aid_of_the_spirits_decision$[decision|E]。"
 CLEARWATER_PASSAGE_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L]变形选项"
 GHOST_CARESS_PERK_EFFECT:0 "作为[character_interaction|E]，允许你根据宣称的宝物稀有度给予对方受伤特质。"
 ALL_BEASTS_UNDER_THE_SUN_PERK_EFFECT:0 "允许变身为数种动物。"
 MOTHERS_BLESSING_CURSE_PERK_EFFECT:0 "As a [character_interaction|E], allows you to give [GetModifier( 'mothers_blessing_perk_modifier' ).GetNameWithTooltip|L] or [GetModifier( 'mothers_curse_perk_modifier' ).GetNameWithTooltip|L] to a pregnant target.\n #flavor Folklore holds that a cat had the ability to either bless or curse a pregnant woman. In the case of the Ceilican, this legend is true. A kind Bastet can offer a boon to the mother, while a spiteful one can harm her in some minor but memorable way. #!"
 SORCERERS_BLADE_PERK_EFFECT:0 "As a [character_interaction|E], allow you to use gnosis to increase the prowess of a weapon artifact.\n #flavor The werecat may enchant an edged weapon so that it becomes supernaturally potent.#!"
 SMALL_COUSIN_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_cat_modifier' ).GetNameWithTooltip|L] shapeshift option.\n #flavor The Ceilican gains the ability to shapeshift into a house cat. While not terribly useful physically, this form is very unobtrusive. #!"
 THE_MADNESS_OF_CROWDS_PERK_EFFECT:0 "As a [character_interaction|E], allows you to start a [GetModifier( 'lunatic_summon_modifier' ).GetNameWithTooltip|L].\nCan recruit [GetMaA('maniacs').GetName] as [men_at_arms|E].\n #flavor This Gift summons a horde of malevolent spirits to provoke the inhabitants of a city into violent rioting. The Gift plays on the hatred and fear of the down-and-outs of the city: the homeless, the poor and even stray animals.#!"
 bastetmetisgifts_visible:1 "忌子灵赋"
 sense_primal_nature_perk_name:0 "感知原始自然"
 blinding_moonbeam_gaze_perk_name:0 "刺眼月光凝视"
 whisker_sight_perk_name:0 "胡须观测"
 fist_of_cahlash_perk_name:0 "卡赫拉什之拳"
 moons_gateway_perk_name:0 "月门"
 redeem_the_waste_perk_name:0 "废物利用"
 moon_sense_perk_name:0 "月感"
 wrath_of_nala_perk_name:0 "纳拉之怒"
 BLINDING_MOONBEAM_GAZE_PERK_EFFECT:0 "在战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('blinding_moonbeam_gaze_perk_modifier').GetNameWithTooltip]修正。\n#flavor 猫人会从眼睛中射出明亮的月光光束。这些光束不会造成伤害，但可以致盲或分散对手的注意力，还能提供照明。#!"
 MOONS_GATEWAY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#flavor 通过向露娜求助，芭丝特会在圣地或巢域之间架起一座月桥。这种旅行只能在夜间进行。#!"
 MOON_SENSE_PERK_EFFECT:0 "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#flavor 通过在月光下的水池中冥想，巴斯特可以看到塞勒涅光辉下发生的任何事情。虽然很难看到遥远或隐蔽的地方，但通过严格的搜索，可以看到大地上的任何地方。#!"
 WRATH_OF_NALA_PERK_EFFECT:0 "作为[character_interaction|E]，允许你对敌人的领地释放[GetModifier( 'wrath_of_nala_modifier' ).GetNameWithTooltip|L]。\n#flavor 这灵赋会掀起一场狂风暴雨，对猫人附近造成毁灭性的破坏。风暴突然出现，持续五分钟或更短时间，然后平息并消散。该灵赋由纳拉在梦中亲自传授。#!"
 the_fleeing_scarab_perk_name:0 "圣甲虫脱壳"
 THE_FLEEING_SCARAB_PERK_EFFECT:0 "允许在非自然死亡后复活。\n#F 作为布巴斯塔部族最为隐秘的秘密之一，这灵赋使得猫能够将自己的灵魂抽离出来，并将其具现化，将其送离危险之地，而躯体则会死亡。灵魂通常以一只飞行圣甲虫的形式存在，它会寻找一个合适的新宿主躯体，趁其熟睡时爬进它的嘴里，然后将旧的灵魂“放置”到新的宿主中。掌握这个禁忌秘密的布巴斯塔（只有不到八只这样的猫存在）在理论上是永生的，尽管这长生是以其他生命为代价的。#!"
 royal_privilege_perk_name:0 "皇家特权"
 ROYAL_PRIVILEGE_PERK_EFFECT:0 "允许无需相应[trait|E]或[faith|E]就能点选其他血种和部族灵赋。\n#F 这被深深鄙视的把戏使得一只古老而强大的狮子能够窃取其他猫人的灵赋，甚至是那些传统上只属于特定部族或血种的灵赋。黑牙通过这个致命的秘密积聚了很多力量。那些曾经遇见过他的人声称，他通过杀死其他芭丝特，并在他们灵魂将逝之际从他们的灵魂中夺取他们的秘密来发动自己的“特权”。虽然可能还有其他芭丝特知道这灵赋，但他们并不会有很多朋友。#!"
 pathfinders_pride_perk_name:0 "开拓者的自豪"
 silent_stalking_perk_name:0 "无声潜行"
 shriek_perk_name:0 "尖啸"
 cheshire_prank_perk_name:0 "柴郡猫的恶作剧"
 freyjas_blessing_perk_name:0 "芙蕾雅的祝福"
 fortuna_perk_name:0 "命运"
 jump_to_the_moon_perk_name:0 "蹦到月球"
 withering_stare_perk_name:0 "枯竭凝视"
 SHRIEK_PERK_EFFECT:1 "在战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('shriek_perk_modifier').GetNameWithTooltip]修正。\n#flavor 随着一声震耳欲聋的尖啸，芭丝特把附近的所有人都震聋了。#!"
 FREYJAS_BLESSING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你使目标怀孕。\n#flavor 古老的北欧生殖与爱情女神曾乘坐猫拉的战车旅行。现在，她通过赐予某些猫民一种深厚的生育能力来纪念这种服务，如果他们愿意，可以将这种能力赐予其他人。虽然这灵赋并不能保证交配一定会生下一只芭丝特小猫，但许多猫民都声称，如果没有这份祝福，他们的同类可能会几乎灭绝。#!"
 JUMP_TO_THE_MOON_PERK_EFFECT:0 "每月灵界探索进度：[grace_i]#P +75%#!\n#flavor 最伟大的芭丝特可以回到塞勒涅进行短期访问。通过在她的巢域与月球之间架设月桥，猫人就能前往露娜的宫殿。在那里，她可以正常呼吸和活动；只要她小心谨慎，这将是一段美好的时光。#!"
 WITHERING_STARE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你根据自身勇武给予对方受伤特质。\n#flavor 该灵赋能让猫人通过眼光杀人，是辛巴领主和流浪的普蒙卡最喜欢的伎俩。使用此天赋对付其他芭丝特被认为是极不光彩的行为，但也偶尔发生。#!"
 bastetgifts_visible:1 "芭丝特灵赋"
 THE_FLEEING_SCARAB_REQUIREMENT:0 "@warning_icon!#X You need to finish a quest from Whispers (station an explorer in any realm of the umbra to find a clue about the location and start an [umbra_expedition|E] to reach them and receive a quest) to unlock this perk.#!"
 ROYAL_PRIVILEGE_REQUIREMENT:0 "@warning_icon!#X 你需要完成抹除者（通过在灵界的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
 PATHFINDERS_PRIDE_PERK_EFFECT:0 "#flavor Cats have a remarkably good sense of direction. With this Gift, a Bastet may improve that knack to find his way out of most kinds of mazes, deserts or woodlands. Worthy folk may learn this Gift from Bird-spirits, but no werecat willingly admits to it in public#!"
 SILENT_STALKING_PERK_EFFECT:0 "Starts with [EmptyScope.ScriptValue('infiltration_small_perk_suspicion_offset')|V0] [suspicion_with_icon|E] during [infiltration_missions|E].\n #flavor This common trick allows a Bastet to move without making any sound. Even squeaky or shifting surfaces, like wooden floors or piled twigs, can be passed over without noise. #!"
 CHESHIRE_PRANK_PERK_EFFECT:0 "#flavor Enterprising Bastet discovered the secret to disappearing from plain sight. It soon became a valuable and popular trick. #!"
 FORTUNA_PERK_EFFECT:0 "#flavor Cats love their friends, and they’re famous for their luck. This Gift allows them to share some of that good fortune with others, or even to use a bit of it themselves.#!"
 SWEET_HUNTERS_SMILE_PERK_EFFECT:0 "#flavor This Gift imbues a homid'’s words with intrinsic credibility and conviction, causing them to ring true to the ear and lay heavy on the heart.#!"
 CAT_CLAWS_PERK_EFFECT:0 "#flavor By calling on her heritage, a Bastet in Homid or Sokto form can unsheathe her claws and attack as if she were in Crinos. #!"
 EAVESDROPPERS_EAR_PERK_EFFECT:0 "Allows you to use the Reveal Scheme character interaction.\n #flavor Secrets are an important commodity, and those who strive to keep their secrets may very well be hiding something dangerous. This Gift was developed to root out potential traitors or plotters.#!"
 BABELS_CURE_PERK_EFFECT:0 "#flavor By flexing Rahjah's powers, a Bastet can translate any human languages in her vicinity.#!"
 MONKEYS_UNCLE_PERK_EFFECT:0 "Bonus option to Shapeshift [character_interaction|E] allowing you to change appearance.\n #flavor The Bastet may take the exact likeness of any other human, great cat or Bastet.#!"
 CRAFT_OF_THE_MAKER_PERK_EFFECT:0 "Funding the inspirations for artifacts or commissioning one is now less costly.\n #flavor The caster can shape once-living material (but not undead!) into a variety of objects instantly.#!"
 KITTENS_CRY_PERK_EFFECT:0 "#flavor This Gift imbues the user with a tone so pathetic that everyone who hears it goes out of his way to comfort her. Most Bastet consider it a dirty but useful trick. #!"
 MARK_AS_MINE_PERK_EFFECT:0 "Unlocks the [buy_artifact_claim_interaction|E].\n #flavor By spraying an area or an object with her musk, a Bastet can lay claim to it. Any magically inclined being will recognize it as a \"Keep Out!\" sign.#!"
 KILLERS_LEAP_PERK_EFFECT:0 "#flavor The old legends relate of Bastet leaping over enemies and crossing rivers without getting their feet wet; this Gift is one way they did it.#!"
 PERFECT_COVER_PERK_EFFECT:0 "#flavor By scratching around the place, trail or object to be hidden, the Bastet obscures it from normal and magical view.#!"
 UNDERBELLY_PERK_EFFECT:0 "#flavor By sizing up a foe or obstacle, a Bastet can get a feeling for its weakest point.#!"
 HAND_OF_WILL_PERK_EFFECT:0 "#flavor By willing things to move, the Bastet can lift object and open barriers merely by looking at them. #!"
 REVOLT_OF_THE_LAND_PERK_EFFECT:0 "#flavor The Bastet calls to the spirits of the surrounding area to attack intruders. The terrain responds as best it can: Rocks roll and smash, vines trip, and water sucks victims under. An avatar of Gaia herself teaches this Gift.#!"
 SENSE_PRIMAL_NATURE_PERK_EFFECT:0 "#flavor The Bastet can sense nearby manifestations of the Weaver, Wyrm, and Wild. This Gift involves a mystical sense, not a visual or olfactory image, although Garou often describe the Weaver's spiritual emanations as a feeling of breathing static air, the Wyrm's spiritual emanations as a stench, and the Wyld's spiritual emanations as an almost tangible vibration.#!"
 WHISKER_SIGHT_PERK_EFFECT:0 "#flavor By attuning herself to her surroundings, a metis Bastet can get a sense of her surroundings. Anything within reach — even if it’s behind her, or invisible — is plain to all her senses. #!"
 FIST_OF_CAHLASH_PERK_EFFECT:0 "#flavor The Bastet can destroy any material thing with a snarl. #!"
 REDEEM_THE_WASTE_PERK_EFFECT:0 "#flavor Part of a metis' role is the salvation of despoiled wilderness. To do so, he’ll often sniff around, paw at the earth, rub his scent around and urinate in various places, essentially claiming the place as his own. #!"
 TREECLIMBER_PERK_EFFECT:0 "#flavor By extending and sharpening his claws, then invoking this Gift, a Bastet may travel up or down any vertical surface, from tree bark to concrete. Leopards excel at climbing, and most kuasha teach this secret first. #!"
 TRAVELERS_TONGUES_PERK_EFFECT:0 "#flavor By flexing Rahjah's powers, a Bastet can translate any human language in her vicinity. Invoking the Unmaker will turn everything into gibberish.#!"
 PART_THE_CURTAIN_PERK_EFFECT:0 "Monthly Umbra Exploration Progress: [grace_i]#P +50%#! \n #flavor Like the Level Four Common Gift: Walking Between Worlds, this spell allows a leopard to cross into the Near Umbra. This variation, however, lets her bring others across as well.#!"
 ALMS_TO_THE_POOR_PERK_EFFECT:0 "#flavor The werecat may summon up a small bit of money or food, generally to give to a beggar. If the cat uses the \"alms\" for himself, he's left with a bitter taste in his mouth and greasy palms.#!"
 SCHOLARS_FRIEND_PERK_EFFECT:0 "#flavor The Bubasti may read any scroll, tablet or book placed in front of him, no matter what language it's in. Coded messages remain written in code. #!"
 BANISH_CAHLASHS_BROOD_PERK_EFFECT:0 "#flavor By calling upon the Father of Dark Spirits, a Bubasti may command Wyrmish spirits to depart. Each time the Bubasti does so, his fur grows a deeper shade of black and his actions become more… erratic. Sense Wyrm detects a faint trace of Wyrm-taint on the Bastet for a week afterward. #!"
 THE_MANY_TONGUES_OF_PTAH_PERK_EFFECT:0 "#flavor This Gift allows Gaia’s warriors to read and wield the spirit of speech, bypassing the need to learn different languages and dialects.#!"
 THE_SCARABS_FLIGHT_PERK_EFFECT:0 "#flavor By calling together the elements of her soul, a Bubasti can send them out of her body for a while. The body itself enters a deathlike trance until the Scarab returns; although it doesn’t decompose, all other signs (magical and otherwise) declare that the cat has died. The flying Scarab resembles an ordinary insect unless inspected with magical senses, in which case it glows brightly.#!"
 SHADOW_BRETHREN_PERK_EFFECT:0 "As a [character_interaction|E], allows you to create a clone of yourself.\n #flavor The Bubasti summons up shadowy duplicates of himself to stand by him in battle. These shadow-wolves resemble the Bubasti and have some of the same capabilities. A night-spirit teaches this Gift.#!"
 SPIRIT_WALL_PERK_EFFECT:0 "#flavor One of the greatest tricks a Bubasti learns is the art of calling together minor spirits from around the area and forming them into a wailing Umbral wall. Such magics do not endear a cat to the spirits in general, but by the time she achieves this Rank, a Bubasti should have enough sense to use such power wisely — and enough power to protect herself when she uses it at all.#!"
 SATYRS_WISDOM_PERK_EFFECT:0 "#flavor The Ceilican can play any musical instrument as if he'd been reared with it in his hands. #!"
 BANISH_BURNING_PERK_EFFECT:0 "#flavor Once humans tamed fire to keep them warm and to drive off the wild beasts, they were humanity’s ancient pact with the spirits of fire. The spirits of flame agree to hold back their hunger when the Bastet touches them.#!"
 PHANTASM_PERK_EFFECT:0 "#flavor The Bastet creates an unmoving illusion that contains visual, auditory, olfactory and even tactile elements. A grain-spirit — the so-called “spirit of spirits” — teaches this gift.#!"
 CHARIOT_OF_LIONS_PERK_EFFECT:0 "#flavor This less-than-subtle Gift lets a Ceilican conjure a chariot drawn by huge cats. Like the craft of the goddess Freyja, this chariot is made of coarse-cut wood and covered with Nordic designs. The two huge cats that pull it run as fast as the average car, and can, in a pinch, carry the Ceilican and one passenger into the air for a few moments. Only the Mistress of Catkind teaches this Gift; learning it without her blessings is a grave insult.#!"