 JUDGEMENT_OF_PESTILENCE_PERK_EFFECT: "作为[character_interaction|E]，允许你吸收疾病并释放到目标的宫廷。\n#flavor 尊重猫类的社区会发现瘟疫被驱逐而出，而其他社区则会收到疾病。必须保持平衡。#!"
