l_simp_chinese:
 heighten_senses_perk_name:0 "强化感官"
 HEIGHTEN_SENSES_PERK_EFFECT:0 "作为力场领域的基本技艺，法师学会更好地察觉感官信息，提高他们的各种感官。这有助于窃听机密、做出战术决策等。"
 sense_invisibilty_perk_name:0 "感知隐形"
 SENSE_INVISIBILTY_PERK_EFFECT:0 "法师可以破解物理隐形，注意到光的非自然弯曲。"
 forces_attack_minor_perk_name:0 "力场攻击（小）"
 FORCES_ATTACK_MINOR_PERK_EFFECT:0 "法师汇聚周围的力场，或创造一个小的能量显现，用于打击他们的敌人。在这等级，他们还不能完全消灭敌人，但任何激怒一位力场法师学徒的人都会被严重烧伤。"
 telekinesis_perk_name:0 "心灵传动"
 TELEKINESIS_PERK_EFFECT:0 "通过利用重力和动量，法师能够在不接触物体的情况下操纵物体。这在决斗、建造或试图获得宝物时很有用"
 forces_shield_perk_name:0 "力场盾"
 FORCES_SHIELD_PERK_EFFECT:0 "用保护力场包裹自己，法师能够弹开猛烈的攻击，保护他们免受伤害。"
 war_magic_perk_name:0 "战争魔法"
 WAR_MAGIC_PERK_EFFECT:0 "法师操纵速度和动量，从上方观察战场，用魔法打击敌人，所有这些都是为了提高他们的指挥效率。"
 invisibility_mage_perk_name:0 "隐形"
 INVISIBILITY_MAGE_PERK_EFFECT:0 "法师用光和声音掩盖自身的存在，让别人完全无法察觉。这有助于许多密谋。"
 forces_attack_lethal_perk_name:0 "力场攻击（大）"
 FORCES_ATTACK_LETHAL_PERK_EFFECT:0 "法师聚集了更大的力量，可以用闪电、火焰或纯粹的力场摧毁对手。若不晓得根源领域，法师必须依靠现有的力场，这可能是不够的，从而造成较小的打击伤害。"
 weather_witching_perk_name:0 "气象巫术"
 WEATHER_WITCHING_PERK_EFFECT:0 "Near mastery of the forces sphere, the mage learns the ability to affect weather patterns, creating rain, storms, draughts or winds to entire regions as they desire."
 create_sunlight_perk_name:0 "制造阳光"
 CREATE_SUNLIGHT_PERK_EFFECT:0 "Previously an unachievable feat, the mage grasps the power of summoning true sunlight - a problematic situation for night-dwellers, especially if the mage decides to bless a whole region with eternal sunlight."
 inferno_perk_name:0 "火狱"
 INFERNO_PERK_EFFECT:0 "The mage brings their destructive potential to it’s apex, decimating entire courts or regions in one powerful strike - a meteor, massive explosion, a sun laser or another catastrophe."
 cataclysm_perk_name:0 "大灾变"
 CATACLYSM_PERK_EFFECT:0 "The mage brings about a far reaching and powerful disaster, coating entire continents with torandos, earthquakes or worse."
 forces_sphere_mastery_perk_name:0 "力场掌控"
 sense_life_perk_name:0 "感知生命"
 SENSE_LIFE_PERK_EFFECT:0 "tell if a subject is alive or dead and see life around you, helping you spot secret assassins or snakes in the grass."
 sense_health_perk_name:0 "感知健康"
 SENSE_HEALTH_PERK_EFFECT:0 "tell the general health of an individual, as well as gaining a masterful understanding of the human body."
 heal_self_perk_name:0 "治疗自身"
 HEAL_SELF_PERK_EFFECT:0 "heal wounds and some deformities in yourself."
 improve_simple_life_forms_perk_name:0 "强化低级生命"
 IMPROVE_SIMPLE_LIFE_FORMS_PERK_EFFECT:0 "strengthen and improve Simple Life Forms like crabs, plants and insects."
 weaken_simple_life_forms_perk_name:0 "弱化低级生命"
 WEAKEN_SIMPLE_LIFE_FORMS_PERK_EFFECT:0 "Weaken and kill Simple Life Forms like crabs, plants and insects."
 heal_others_perk_name:0 "治疗他人"
 HEAL_OTHERS_PERK_EFFECT:0 "Heal wounds and some deformities in other humans and complex organisms."
 alter_self_perk_name:0 "改变自身"
 ALTER_SELF_PERK_EFFECT:0 "Change your pattern, improving your physical capabilities or gaining new features like wings or claws. Limited in the scope of the changes possible."
 harm_others_perk_name:0 "伤害他人"
 HARM_OTHERS_PERK_EFFECT:0 "Cause wounds and some deformities in other humans and complex organisms"
 manipulate_beasts_perk_name:0 "操控动物"
 MANIPULATE_BEASTS_PERK_EFFECT:0 "Manipulate the pattern of greater beasts like birds, wolves, bears and other natural creatures."
 improve_others_perk_name:0 "增强他人"
 IMPROVE_OTHERS_PERK_EFFECT:0 "Change other's patterns, improving their physical capabilities or grant new features like wings or claws. Limited in the scope of the changes possible."
 transform_self_perk_name:0 "转变自身"
 TRANSFORM_SELF_PERK_EFFECT:0 "Create larger changes in your own body, breaking the previous limit of changes possible and gaining the ability to transform entirely to another form."
 weaken_others_perk_name:0 "弱化他人"
 WEAKEN_OTHERS_PERK_EFFECT:0 "Change the pattern of a complex organism, worsening their physical capabilities or inflicted maims and weakness."
 transform_others_perk_name:0 "转变他人"
 TRANSFORM_OTHERS_PERK_EFFECT:0 "completely change the shape of others, turning men into pigs and pigs into Adonises. Also expands the scope of changes possible on others."
 create_complex_organism_perk_name:0 "制造复杂器官"
 CREATE_COMPLEX_ORGANISM_PERK_EFFECT:0 "Allows the creation of complex life forms. With other spheres (namely prime) this can be performed with pure quintessence. Otherwise, another complex life form will have to be sacrificed."
 life_sphere_master_perk_name:0 "生命掌控"
 discern_quintessence_perk_name:0 "鉴别魔素"
 DISCERN_QUINTESSENCE_PERK_EFFECT:0 "A simple but effective tool, a mage learns to see the sparks of Quintessence permeating the world. This allows finding nodes, seeing active spells and more."
 absorb_quintessence_perk_name:0 "吸收魔素"
 ABSORB_QUINTESSENCE_PERK_EFFECT:0 "A mage with this knowledge can draw raw quintessence from a node, to the limit of their max quint rating or the amount of raw quintessence in a node whichever is lower."
 fuel_pattern_perk_name:0 "充能式样"
 FUEL_PATTERN_PERK_EFFECT:0 "Allows the creation of life forms (with life), objects (with matter) energy (with forces) and more, always costing Quintessence."
 enchant_object_perk_name:0 "附魔物品"
 ENCHANT_OBJECT_PERK_EFFECT:0 "By infusing an item with your Quintessence, a mage can make the weapon inflict damage that is much harder to heal with supernatural means."
 counterspell_perk_name:0 "反咒"
 COUNTERSPELL_PERK_EFFECT:0 "Perhaps the most useful ability of prime magicians, counterspell allows the mage to dispel harmful spells and creates shields of Quintessence that prevent curses."
 channel_quintessence_perk_name:0 "连接魔素"
 CHANNEL_QUINTESSENCE_PERK_EFFECT:0 "A mage with this level of mastery over Quintessence can increase their own quintessence cap and channel more quint that they would normal be able to."
 enchant_attack_perk_name:0 "附魔攻击"
 ENCHANT_ATTACK_PERK_EFFECT:0 "Enchants a magical attack to deal aggravated damage, making the damage it does harder to heal."
 repair_aggravated_damage_perk_name:0 "修复严重损伤"
 REPAIR_AGGRAVATED_DAMAGE_PERK_EFFECT:0 "Allows the healing of aggravated damage with the appropriate sphere (life for living beings, matter for artifacts and spirit for spiritual beings)."
 sacrifice_valuables_perk_name:0 "献祭财物"
 SACRIFICE_VALUABLES_PERK_EFFECT:0 "By destroying valuables and precious equipment, a mage can draw quintessence from gold or artifacts."
 craft_tass_perk_name:0 "制造塔斯"
 CRAFT_TASS_PERK_EFFECT:0 "A mage can transfer Quintessence from his own pattern to a stable, permanent form, creating what's called Tass. Tass allows to store quintessence outside of the mages own pattern as a form of currency."
 create_wonders_perk_name:0 "制造奇迹"
 CREATE_WONDERS_PERK_EFFECT:0 "A highly powerful ability, a mage who creates a wonder enchants an item with a spell of his choice, and grants the artifact the ability to cast that spell on its own, even without the mage."
 sacrifice_living_beings_perk_name:0 "献祭活物"
 SACRIFICE_LIVING_BEINGS_PERK_EFFECT:0 "Living beings can be sacrificed at this level of mastery, creating quintessence for the mage to absorb. Almost always a dark act, this could have repercussions on a mage's soul."
 control_vitality_perk_name:0 "控制活力"
 CONTROL_VITALITY_PERK_EFFECT:0 "Allows manipulation of the quintessence of living beings, making them hardier or deleting them from existence."
 create_node_perk_name:0 "制造节点"
 CREATE_NODE_PERK_EFFECT:0 "A massive magical undertaking, a master of prime can create a truly new node of quintessence, birthing a place of wonder and magic into the world."
 nullify_paradox_perk_name:0 "虚化矛盾"
 NULLIFY_PARADOX_PERK_EFFECT:0 "With enough quintessence, a mage learns to directly repel paradox and purge themselves of it’s malicious energies."
 prime_sphere_master_perk_name:0 "根源掌控"
 time_sense_mage_perk_name:0 "时间感知"
 TIME_SENSE_MAGE_PERK_EFFECT:0 "The mage gains an uncanny understanding of the current time, helping them orient themselves and better organize their time."
 sense_time_alteration_perk_name:0 "感知时间变化"
 SENSE_TIME_ALTERATION_PERK_EFFECT:0 "Sensing things are not as they should be, a mage can know when a time spell has been cast or when another mage is changing the timeline, allowing them some precious time to react."
 past_sight_perk_name:0 "预知过往"
 PAST_SIGHT_PERK_EFFECT:0 "The mage peers into the past, revealing secrets or seeing past events, learning from them."
 future_sight_perk_name:0 "预知未来"
 FUTURE_SIGHT_PERK_EFFECT:0 "The Magus glances into possible futures, sensing plots on their lives, the moves of their enemies or even seeing entire periods play out."
 thicken_time_perk_name:0 "浓缩时间"
 THICKEN_TIME_PERK_EFFECT:0 "A very useful skill, the mage learns to thicken time, making time Magick more difficult and protecting themselves from hostile Chronomancers."
 speed_up_perk_name:0 "加速"
 SPEED_UP_PERK_EFFECT:0 "The mage speeds themselves or others up, letting them move more quickly or act with more speed."
 slow_down_perk_name:0 "减速"
 SLOW_DOWN_PERK_EFFECT:0 "The opposite of speeding up, a mage curses an opponent with sluggishness and slowing their actions and movement down."
 rewind_injuries_perk_name:0 "倒退伤害"
 REWIND_INJURIES_PERK_EFFECT:0 "Allows the mage to heal very recent injuries by turning back their personal state."
 hang_effect_perk_name:0 "悬停效果"
 HANG_EFFECT_PERK_EFFECT:0 "A mage casts a spell, then stores it frozen in time, waiting. Whenever the mage wishes, they can release the spell immediately on their chosen target."
 young_to_old_perk_name:0 "少到老"
 YOUNG_TO_OLD_PERK_EFFECT:0 "The Magus quickly ages an object or person, growing plants, withering them, turning people to dust or babies to adults."
 old_to_young_perk_name:0 "老到少"
 OLD_TO_YOUNG_PERK_EFFECT:0 "The mage reaches for a subjects past version, pulling it into the present. Such a spell can make the old young, restore worn artifacts or heal wounds."
 rewind_time_perk_name:0 "倒退时间"
 REWIND_TIME_PERK_EFFECT:0 "A master of time can move back to the past, potentially changing the future. Such spells are incredibly difficult, however."
 time_immunity_perk_name:0 "时间免疫"
 TIME_IMMUNITY_PERK_EFFECT:0 "A mage can make themselves immune to timeline changes."
 time_sphere_master_perk_name:0 "时间掌控"
 find_route_perk_name:0 "寻得路线"
 FIND_ROUTE_PERK_EFFECT:0 "The mage examines the space around themselves, finding the best route to their target. This can increase movement speed or support murder or kidnapping schemes by exposing covert routes."
 spatial_sense_perk_name:0 "空间感知"
 SPATIAL_SENSE_PERK_EFFECT:0 "Find hidden items and characters around you, potentially revealing schemes targeting you."
 scry_perk_name:0 "侦测"
 SCRY_PERK_EFFECT:0 "Peering across to remote places, the mage can learn secrets, schemes or find information to support their own machinations. This can also be used to extend diplomatic range."
 distant_casting_minor_perk_name:0 "远程施法（小）"
 DISTANT_CASTING_MINOR_PERK_EFFECT:0 "The mage makes their first steps towards casting spells at a distance. At this level, they can only cast spells with a total difficulty of 5, and doing so makes the spell harder."
 correspondence_ward_perk_name:0 "空间防护"
 CORRESPONDENCE_WARD_PERK_EFFECT:0 "Allows the practitioner to protect a county or person from spatial magic, making correspondence magic or magic cast at a distance harder to employ against them."
 teleportation_perk_name:0 "传送"
 TELEPORTATION_PERK_EFFECT:0 "The mage can teleport themselves (and themselves alone, without other spheres) through space, letting them escape murders at the last moment and travel to far away places instantly. By combining this with other spheres, a mage can imprison or rescue a target from afar. "
 distant_casting_journeyman_perk_name:0 "远程施法（中）"
 DISTANT_CASTING_JOURNEYMAN_PERK_EFFECT:0 "Greater understanding into the mystery of connections allows a mage to cast more substantial spells at a distance - up to a difficulty of 20."
 affect_area_perk_name:0 "影响区域"
 AFFECT_AREA_PERK_EFFECT:0 "By taking in an entire country and spreading the practitioner's will over it, putting spells on entire counties becomes an option."
 open_gate_perk_name:0 "开门"
 OPEN_GATE_PERK_EFFECT:0 "The mage learns to open gates between different locations, moving entire armies across."
 distant_casting_adept_perk_name:0 "远程施法（大）"
 DISTANT_CASTING_ADEPT_PERK_EFFECT:0 "With this level of master, a mage can cast large spells at a distance, with only the mightiest workings beyond them. The maximum spell difficulty to cast at a distance rises to 50."
 ward_perk_name:0 "防护"
 WARD_PERK_EFFECT:0 "Wards a county from hostile incursion, preventing enemy armies from entering it until the ward is broken."
 rend_space_perk_name:0 "重塑空间"
 REND_SPACE_PERK_EFFECT:0 "Cutting off space, a mage shrinks a county and it's available building sizes, potentially swallowing buildings in the process."
 distant_casting_mastery_perk_name:0 "远程施法（超）"
 DISTANT_CASTING_MASTERY_PERK_EFFECT:0 "A virtuoso of correspondence magic, a mage can cast any spell at any distance."
 create_space_perk_name:0 "创造空间"
 CREATE_SPACE_PERK_EFFECT:0 "The mage inflates the size of their holdings, creating new space for buildings and people to live in."
 correspondence_spehre_master_perk_name:0 "空间掌控"
 read_aura_perk_name:0 "读取灵光"
 READ_AURA_PERK_EFFECT:0 "Reading another's aura enables a rough estimate of their emotions, spiritual health and supernatural type."
 mind_shield_perk_name:0 "心智护盾"
 MIND_SHIELD_PERK_EFFECT:0 "A simple but vital effect, a mind shield protects the mage from mental attacks and psychic probing. The more powerful the shield, the harder it becomes to breach your defenses."
 read_emotions_perk_name:0 "读取情绪"
 READ_EMOTIONS_PERK_EFFECT:0 "With this level of mastery, a mage learns to read the emotions of his target, telling him of their personal traits and likely causes of action."
 amplify_emotions_perk_name:0 "激化情绪"
 AMPLIFY_EMOTIONS_PERK_EFFECT:0 "While not yet able to control minds, a mage acquires the ability to influence the mood of others, making them greedy, bold, full with energy or honorable."
 dampen_emotions_perk_name:0 "抑制情绪"
 DAMPEN_EMOTIONS_PERK_EFFECT:0 "Just like Amplify Emotions, this ability lets a mage manipulate the emotions of their subject. Unlike the other perk, this one enables sapping feelings, making the target apathetic, weak-willed or lacking in honour."
 telepathy_mage_perk_name:0 "心灵感应"
 TELEPATHY_MAGE_PERK_EFFECT:0 "A highly dangerous and feared power, with telepathy a Magus can read the surface thoughts of a subject, or communicate over distance. This allows the mage to learn of schemes the subject is plotting, communicate over vast distances, improve their own schemes and more."
 empower_psyche_perk_name:0 "赋能心灵"
 EMPOWER_PSYCHE_PERK_EFFECT:0 "By improving their own mental patterns, a mage can boost their intelligence, raising their stats or excelling in other fields."
 influence_subconscious_perk_name:0 "影响潜意识"
 INFLUENCE_SUBCONSCIOUS_PERK_EFFECT:0 "Always an insidious power, this perk allows a mage to change the opinions of people on both himself and others. Mages can charm a person into being loyal, only to find later that when the spell elapsed, their minion quickly turned on them."
 soothe_mind_perk_name:0 "抚慰心灵"
 SOOTHE_MIND_PERK_EFFECT:0 "A truth that mages know more than any other is that minds are fragile. They can break just like a body can, and when they do, a mage with this power can help set them back to rights. This perk allows removing stress and negative mental health afflictions."
 psychic_attack_perk_name:0 "心灵攻击"
 PSYCHIC_ATTACK_PERK_EFFECT:0 "By interfering with the subjects Mind, a mage can cause bursts of unbearable pain, build crushing stress or force the body to attack itself. This is a mental attack - while it doesn't do as much damage as a physical one, it will cause stress and potentially cause insanity."
 improve_minds_perk_name:0 "增强心智"
 IMPROVE_MINDS_PERK_EFFECT:0 "Just like how the mage was able to improve themselves before, they can now grant their boon to others, boosting their mental capabilities."
 degrade_minds_perk_name:0 "削弱心智"
 DEGRADE_MINDS_PERK_EFFECT:0 "A malign power, a mage tears down the psyche and mental faculties of their enemies, leaving them weak and confused, lowering their stats."
 change_memories_perk_name:0 "改变记忆"
 CHANGE_MEMORIES_PERK_EFFECT:0 "By editing memories and past experiences, a mage can make the target forget their past relationships, add new ones or make the target remember secrets and deeds that never were."
 dominate_mind_perk_name:0 "支配心智"
 DOMINATE_MIND_PERK_EFFECT:0 "Unlike the subtle influence of previous levels, a mage who has achieved this level of mastery can outright override the will of their targets, planting commands and orders in their heads."
 astral_projection_perk_name:0 "星光投射"
 ASTRAL_PROJECTION_PERK_EFFECT:0 "Allows a mage to go into the Astral Umbra"
 REWRITE_PERSONALITY_PERK_EFFECT:0 "This perk allows a mage to completely rewrite the target's mental makeup, changing their personality traits, stress traits, and any other mental trait."
 possession_perk_name:0 "附身"
 POSSESSION_PERK_EFFECT:0 "When a body grows old, sometimes the best recourse is to simply abandon it and move on to the next. This power allows just that - the mage can take over the body of another character. Such a transference is never without a cost, however."
 create_consciousness_perk_name:0 "创造意识"
 CREATE_CONSCIOUSNESS_PERK_EFFECT:0 "This power, in combination with other spheres, allows the creation of truly intelligent life."
 mind_sphere_mastery_perk_name:0 "心智掌控"
 appraise_artifact_perk_name:0 "鉴定宝物"
 APPRAISE_ARTIFACT_PERK_EFFECT:0 "By examining the true worth of an artifact, the mage can sell it for a good price."
 requsition_artifact_perk_name:0 "征用宝物"
 REQUSITION_ARTIFACT_PERK_EFFECT:0 "On its own, allows the creation of a claim on an artifact. With the correspondence art, the mage can steal artifacts from their owners directly."
 affect_undead_perk_name:0 "影响不死族"
 AFFECT_UNDEAD_PERK_EFFECT:0 "The mage learns to target the dead parts of an undead being, such as vampires or risen. This allows the use of life arts on such abominations."
 preserve_perk_name:0 "保养"
 PRESERVE_PERK_EFFECT:0 "By strengthening the fabric and matter of artifacts, a mage can preserve or fix them."
 ruin_perk_name:0 "墟化"
 RUIN_PERK_EFFECT:0 "Tearing matter apart, a mage can destroy artifacts or damage buildings, though the latter requires the Correspondence sphere."
 improve_matter_perk_name:0 "强化物质"
 IMPROVE_MATTER_PERK_EFFECT:0 "With a deeper understanding of the mysteries of the inert, a magus grasps ways to improve matter, from artifacts to army weapons."
 degrade_matter_perk_name:0 "弱化物质"
 DEGRADE_MATTER_PERK_EFFECT:0 "Weakening and degrading matter, the mage lowers the value of artefacts and trashes enemy weapons."
 conjure_valueables_perk_name:0 "炼制财物"
 CONJURE_VALUEABLES_PERK_EFFECT:0 "With the prime sphere, allows the creation of true gold, adding to income. Without, it can increase supply duration."
 golem_perk_name:0 "魔像"
 GOLEM_PERK_EFFECT:0 "The mage learns to create mechanical servants to help him in war or court."
 transform_artifact_perk_name:0 "转化宝物"
 TRANSFORM_ARTIFACT_PERK_EFFECT:0 "By sculpting the material of an artifact, the mage can change it into a different type of artifact."
 create_artifact_perk_name:0 "制造宝物"
 CREATE_ARTIFACT_PERK_EFFECT:0 "With the prime sphere, a mage can create artifacts from pure quintessence."
 shape_geography_perk_name:0 "塑造地理"
 SHAPE_GEOGRAPHY_PERK_EFFECT:0 "By employing Matter and Correspondence arts, the mage can shift the very ground itself."
 matter_sphrere_mastery_perk_name:0 "物质掌控"
 sense_flaws_perk_name:0 "感知缺陷"
 SENSE_FLAWS_PERK_EFFECT:0 "By attuning themselves to entropy and searching for flaws in their opponents, the mage can slightly increase their prowess."
 ring_of_truth_perk_name:0 "真相之戒"
 RING_OF_TRUTH_PERK_EFFECT:0 "By analyzing little details in a person, the mage can detect whether someone is lying, giving the mage better resistance to schemes."
 talk_to_the_dead_perk_name:0 "亡者交谈"
 TALK_TO_THE_DEAD_PERK_EFFECT:0 "Allows interacting with wraiths and converting people into wraiths after their death."
 good_luck_perk_name:0 "幸运"
 GOOD_LUCK_PERK_EFFECT:0 "The mage influences events to work in their target's favor, giving them luck for things that are influenced by it - such as battle advantage roll, performance of battle units and more."
 bad_luck_mage_perk_name:0 "厄运"
 BAD_LUCK_MAGE_PERK_EFFECT:0 "The mage influences events to go badly for their target, giving them bad luck for things that are influenced by it - such as battle advantage roll, performance of battle units and more."
 step_into_the_shadowlands_perk_name:0 "踏入幽土"
 STEP_INTO_THE_SHADOWLANDS_PERK_EFFECT:0 "The mage learns to go into the realms of the dead, and travel the tempest."
 blessings_perk_name:0 "祝福"
 BLESSINGS_PERK_EFFECT:0 "By binding fate itself, a mage bestows a blessing upon their target - anything from protection in battle, to luck in state or many kids."
 curses_perk_name:0 "诅咒"
 CURSES_PERK_EFFECT:0 "The feared power of witches, curses wither and weaken their target, twisting their fate against them."
 decay_objects_perk_name:0 "衰变物体"
 DECAY_OBJECTS_PERK_EFFECT:0 "By infusing objects with excessive entropy, a mage can break down artifacts or buildings."
 bind_the_dead_perk_name:0 "束缚亡者"
 BIND_THE_DEAD_PERK_EFFECT:0 "The mage learns to control the shades people leave after their death - wraiths."
 entropic_attack_perk_name:0 "熵之攻击"
 ENTROPIC_ATTACK_PERK_EFFECT:0 "The mage turns entropy into a sharp-edged weapon, striking others with it. Such attacks don't only injure, but wither the body, turning their targets weak and frail."
 entropic_ward_perk_name:0 "熵之防护"
 ENTROPIC_WARD_PERK_EFFECT:0 "The mage keeps entropy from touching a subject, giving them a greater lifespan, healing their wounds or other effects."
 degrade_concept_perk_name:0 "弱化概念"
 DEGRADE_CONCEPT_PERK_EFFECT:0 "Turning their entropic attention to abstract concepts and ideas, mages can preserve or destroy cultural ideas and advancement."
 chaos_mastery_perk_name:0 "混沌掌控"
 CHAOS_MASTERY_PERK_EFFECT:0 "The mage can invoke chaos itself, creating unpredictable results that follow only their general direction."
 atrophy_thought_perk_name:0 "萎缩思维"
 ATROPHY_THOUGHT_PERK_EFFECT:0 "A mage can break down another being's mental pattern, permanently hurting their capacity."
 entropy_sphere_mastery_perk_name:0 "熵之掌控"
 rewrite_personality_mage_perk_name:0 "重写人格"