 WAIL_PERK_EFFECT: "#F 报丧女妖可以使用尖啸来改变周围人的情绪，或者用如同其名的强大尖叫声来造成伤害。#!"
 FOREBODE_PERK_EFFECT: "You will receive a notification if someone intend to murder your friends or family.\nYou will receive notification if someone intends to seduce your lovers or consorts.\nYour prisoner has less chance of escaping from your prison.\n#F By tuning in this Horror correctly, a Banshee can see brief glimpses of the past or future.#!"
 PANDEMONIUM_PERK_EFFECT: "#F 作为预兆的延伸，报丧女妖可以实际上通过调整现在来改变未来，以达到他们想要的效果。#!"
 SCREAMING_NOTHING_PERK_EFFECT: "不再需要做出牺牲才能进入[UmbraGlossary('tempest')]。\n解锁针对[GetTrait('wraith').GetName( GetNullCharacter )]囚犯的$EXECUTION_BANISH_TO_TEMPEST$[execution|E]选项。\n#F  有了这个能力，报丧女妖可以打开一个允许鬼魂通过[UmbraGlossary('stormwall')]的虚洞。#!"
 STORM_GLOAM_PERK_EFFECT: "As a [character_interaction|E], allows you to unleash [GetModifier( 'maelstrom_winds_modifier' ).GetNameWithTooltip|L] over enemy realms.\n#F By tuning into each other, a group of Banshees can open tiny tears in the [UmbraGlossary('stormwall')], letting Maelstrom winds through to do damage.#!"
 INHABIT_PERK_EFFECT: "解锁[buy_artifact_claim_interaction|E]。\n[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F  这种能力允许显灵者与他们选择的无生命物体融合，并获得对它的完全和彻底的控制。#!"
 WITCHS_NIMBUS_PERK_EFFECT: "#F 显灵者可以生成火焰或电能来伤害目标。#!"
 BROADBAND_GHOST_PERK_EFFECT: "#F 使用这能力，显灵者可以把自己变成能量。然后他们可以在金属线中穿越，或以其他类似的方式操纵设备。#!"
 HELL_ON_WHEELS_PERK_EFFECT: "#F 这允许显灵者可以将自己物理转化为一辆大型载具。#!"
 ESCHERS_CORKSCREW_PERK_EFFECT: "作为[character_interaction|E]，允许你在你的领地的所有省份中增加一座随机建筑。\n#F 通过结合他们的力量，一群显灵者可以完全占有一栋建筑，并操纵里面的条件，如温度、重力或结构本身。#!"
 HELTER_SKELTER_PERK_EFFECT: "允许在[UmbraGlossary('shadowlands')]停留时与[skinlands|E]互动。\n#F  使用他们的银丝，骚灵可以操纵活人世界中的物体。#!"
 CONGEAL_PERK_EFFECT: "#F 骚灵可以通过这个能力将工具和武器从自己的纱罗中暂时创造出来。#!"
 ANATHEMA_PERK_EFFECT: "#F 这种能力使骚灵能够以物理世界不允许的方式玩弄动量和力量。#!"
 REND_AND_RAKE_PERK_EFFECT: "#F 骚灵可以使用该恐怖来暂时扭曲和破坏现实的结构。#!"
 PUPPET_STORM_PERK_EFFECT: "作为[character_interaction|E]，允许你根据你的勇武致伤敌人的[knights|E]。\n#F 一群骚灵可以结合他们的力量，让他们的银丝影响纱罗或肉体。#!"
 PUPPETRY_PERK_EFFECT: "解锁附身[character_interaction|E]，允许获得对目标的牵制以及让目标获得部分你的属性。\n#F  画皮可以完全附身一位活人。#!"
 JUGGERNAUT_PERK_EFFECT: "#F 通过这能力，画皮将自己包裹在银色火焰中，使他们更强壮、更快速、更坚韧。#!"
 CONTAMINATE_PERK_EFFECT: "解锁给予随机疾病[character_interaction|E]。\n#F 有了这种能力，画皮可以伪造疾病症状，或伪造疾病康复。#!"
 DOPPELGANGER_PERK_EFFECT: "As a [character_interaction|E], allows you to create a [GetTrait('mortal').GetName( GetPlayer )] clone of target.\n#F With a small DNA sample, a Skinrider can create a flesh-and-blood replica of a living person that they can freely possess.#!"
 MOB_RULE_PERK_EFFECT: "As a [character_interaction|E], allows you to gain county control over your realm.\n#F A group of Skinriders can combine their power to control the minds of several people with simple commands.#!"
 UNEARTHLY_REPOSE_PERK_EFFECT: "#F 鬼火以通过使自己看起来更有说服力来迫使别人跟随他们。#!"
 STORM_WENDING_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 通过这能力，鬼火可以利用[UmbraGlossary('stormwall')]的微小裂缝将自己传送到另一个地方。#!"
 BECKON_RELIC_PERK_EFFECT: "解锁[crafting_node|E]，允许将3个普通宝物碎片合成为一个并基于[artifact|E]类型增添1/2的词条。\n#F 有了这个能力，鬼火可以穿过[UmbraGlossary('stormwall')]，把一个遗器召唤到他们身边。#!"
 CONSUME_PERK_EFFECT: "作为[character_interaction|E]，允许你摧毁宝物来获得虔诚。\n#F 该能力利用否定的力量来削弱或完全抹杀一个物体。#!"
 ECSTATIC_CRUSADE_PERK_EFFECT: "As a [character_interaction|E], allows you to become a [GetModifier( 'soul_beacon_modifier' ).GetNameWithTooltip|L].\n#F A group of Wisps can combine their powers to become a ghostly beacon, drawing spirits to their location.#!"
 BEDLAM_PERK_EFFECT: "#F 幻影可以创造出精致的幻象，影响尽可能多的感官。#!"
 SANDMAN_PERK_EFFECT: "允许在灵游时进入[UmbraGlossary('dreaming')]。\n#F 有了这种能力，幻影可以进入、观察和塑造他们想玩弄的梦境。#!"
 DREAM_WALKER_PERK_EFFECT: "作为[character_interaction|E]，允许你无视外交距离传送到与你有任何关系的目标的位置。\n#F 这使幻影能够利用所有做梦者共享的链接，特别是通过强烈的情感牵绊，从一个地方转移到另一个地方。#!"
 DRAW_FORTH_PERK_EFFECT: "能够招募[POD_chimera_maa|E]作为[men_at_arms|E]。\n#F 使用这恐怖，幻影能暂时将某人的梦变成现实。#!"
 TERRIBLE_MADNESS_PERK_EFFECT: "As a [character_interaction|E], allows you give [GetModifier( 'terrible_madness_modifier' ).GetNameWithTooltip|L] to the target.\n#F By combining their Vitality, a group of Phantasms can trap someone in an elaborate illusion mirroring their worst nightmare.#!"
 OBLIVIONS_HUSK_PERK_EFFECT: "解锁[GetModifier('POD_shapeshift_form_limb_weapon_modifier').GetNameWithTooltip]和[GetModifier('POD_shapeshift_form_skin_armor_modifier').GetNameWithTooltip]作为变形选项。\n#F  这种能力可以让孤游者发现怨灵，在他们面前伪装自己，或者长出爪子和甲壳。#!"
 HELLION_PERK_EFFECT: "#F 孤游者可以用这个能力召唤出一匹怨灵马。#!"
 VECTOR_PERK_EFFECT: "Allows you to possess [GetTrait('wraith').GetName( GetNullCharacter )].\n#F Unlike Skinriding, an Orphan-Grinder can possess a ghost or [GetTrait('spectre').GetName( GetNullCharacter )] using this ability.#!"
 SONG_OF_THE_HIVE_PERK_EFFECT: "#F 该恐怖让孤游者暂时回到怨灵的蜂巢心智中。#!"
 SALVATION_PERK_EFFECT: "作为[character_interaction|E]，允许你将[GetTrait('spectre').GetName( GetNullCharacter )]变为[GetTrait('wraith').GetName( GetNullCharacter )]。\n#F 通过这能力，孤游者可以给[GetTrait('spectre').GetName( GetNullCharacter )]注入活力，并减少他们的怨念，使他们变成孤游者。#!"
 FAMILIAR_PERK_EFFECT: "解锁变形[character_interaction|E]，允许转变面貌。\n#F 髓骸可以从外观上重塑他们的纱罗，并以他人的身份出现，可以用活力而不是怨念来体现污点，并且可以给自己带来他们通常不拥有的污点。#!"
 FLESH_FLUX_PERK_EFFECT: "Unlocks the [summon_wraith_on_death_interaction|E].\nUnlocks the [bind_wraith_interaction|E].\nUnlocks the [command_wraith_interaction|E].\nMax number of bound $POD_splat_wraith_plural$: #P +1#!.\n#F Using this ability, a Marrow can summon ghostly creatures to do their bidding.#!"
 LEGION_BORN_PERK_EFFECT: "#F 有了这种能力，髓骸可以把自己变成一群幽灵小生物，同步地按照单个心智行动。#!"
 NIGHTMARISH_GESTALT_PERK_EFFECT: "作为[character_interaction|E]，允许你吸收你的宠物来提高你的属性。\n#F 有了这恐怖，髓骸可以将有机物吸收到自己体内，并利用该生物、植物或人所拥有的质量和能力。#!"
 CLAY_JARS_PERK_EFFECT: "作为[character_interaction|E]，允许启动[GetModifier( 'zombu_summon_modifier' ).GetNameWithTooltip|L]。\n#F 当两个或更多的髓骸结合他们的力量时，他们可以把死尸变成无意识的还魂尸来为他们服务。#!"
