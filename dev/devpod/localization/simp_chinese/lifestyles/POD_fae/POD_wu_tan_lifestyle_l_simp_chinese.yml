 READ_METAL_SOUL_PERK_EFFECT: "#F 与一个人的[metal_soul|E]交流会告诉你，这个人说的是否是真话，又或者是否无视正义。#!"
 COMMUNE_WITH_METAL_PERK_EFFECT: "#F 与其他元素一样，金属的感官和交流方式都很有限。#!"
 TIEH_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F 炼丹士可以与金属之灵对话，前提是能遇到它们。#!"
 NURTURE_DIMINISH_METAL_SOUL_PERK_EFFECT: "#F 增强[metal_soul|E]可以让人说实话。削弱[metal_soul|E]会让人更容易撒谎。#!"
 INCREASE_DECREASE_METAL_ATTRIBUTES_PERK_EFFECT: "#F 炼丹士可以影响目标的感知或灵巧。#!"
 TIEH_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F 当龙脉被铁路覆盖，或者龙穴与金属或正义有关时，召唤与金相关的龙舟就很有用。#!"
 SUMMON_DISPEL_TIEH_SHEN_PERK_EFFECT: "能够招募[GetMaA('metal_elemental').GetName]作为[men_at_arms|E]。\n#F 金之炼丹士可以召唤或驱散金属之灵。#!"
 TIEH_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F 金属可能是第二种最容易收起的物体，也很实用。#!"
 METAL_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_metal_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 金属皮肤的防御力或金属拳头的粉碎力都很有用。#!"
 PATHS_OF_IRON_PERK_EFFECT: "#F 铜线、金属管道或建筑物的钢梁……金之道有很多，至少在城市里是这样。#!"
 TIEH_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许你点化[true_jade|E]来储存气。\n#F 炼丹士能够点化白玉。#!"
 MOVE_METAL_PERK_EFFECT: "#F 对于手中武器被扔掉的战士来说，这是个方便的小戏法。#!"
 SHAPE_SUNDER_METAL_PERK_EFFECT: "#F 金丹的大修习者是著名工匠，他们能制造出精美的剑和其他武器。#!"
 SUMMON_DISPEL_METAL_PERK_EFFECT: "#F 当你需要一件武器而又不在乎得到什么时，这能力会很有用。#!"
 TIEH_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F 到了这等级，大师可以让钢铁变得像黄金一样柔软，也可以让黄金变得像钢铁一样坚硬。#!"
 TRANSMUTE_METAL_PERK_EFFECT: "作为[character_interaction|E]，允许你花费气来获得[gold|E]。\n#F 有了这能力，金属可以完全变成另一种金属。#!"
 READ_WOOD_SOUL_PERK_EFFECT: "#F [Concept('wood_soul','木魂')|E]能传达一个人的健康状况以及其他信息。#!"
 COMMUNE_WITH_WOOD_PERK_EFFECT: "#F 与大多数元素一样，木及其相关元素只能提供有限的信息。#!"
 LIN_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F 炼丹士可以与木神对话，前提是他们必须是显形，或者妖仙具有穿透绝壁的能力。#!"
 NURTURE_DIMINISH_WOOD_SOUL_PERK_EFFECT: "#F 增强该魂会产生欲望，削弱该魂会导致无欲。#!"
 INCREASE_DECREASE_WOOD_ATTRIBUTES_PERK_EFFECT: "#F 炼丹士可以增加或减少外貌或力量属性。#!"
 LIN_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F 炼丹士可以召唤一艘龙舟，带着他们沿着龙脉从一个龙穴到另一个龙穴。#!"
 SUMMON_DISPEL_LIN_SHEN_PERK_EFFECT: "能够招募[GetMaA('wood_elemental').GetName]作为[men_at_arms|E]。\n#F 炼丹士可以召唤和驱散木灵，其中包括植物之灵，但不包括动物之灵。#!"
 LIN_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F 炼丹士可以将木属性物品藏在自己体内。#!"
 WOOD_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_wood_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 炼丹士可以将身体的全部或部分变成木头，使他们在徒手搏斗中承受或分散更多的伤害。#!"
 PATHS_OF_WOOD_PERK_EFFECT: "#F 细密的根系、菌类和苔藓网络为炼丹士创造了一片庞大的公路网。#!"
 LIN_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许你点化[true_jade|E]来储存气。\n#F 炼丹士能够点化蓝或青玉。#!"
 MOVE_WOOD_PERK_EFFECT: "#F 此丹技能以类似于念力的方式移动木制物品。#!"
 SHAPE_SUNDER_WOOD_PERK_EFFECT: "#F 木匠可以利用这能力制作精美的工艺品或毁坏木制物品。#!"
 SUMMON_DISPEL_WOOD_PERK_EFFECT: "#F 神魔可以召唤或驱散木头。#!"
 LIN_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F 到这等级，橡木可以被变得像松木或花瓣一样柔软，还让草像橡木一样坚韧，而且厚度与它相同。#!"
 TRANSMUTE_WOOD_PERK_EFFECT: "#F 将一种木头转化为另一种木头的作用有限，可人体也是木属性的，所以可以将树木转化为人体。#!"
 READ_WATER_SOUL_PERK_EFFECT: "#F 与[water_soul|E]交流有助于衡量一个人的忠诚度、自信心等……#!"
 COMMUNE_WITH_WATER_PERK_EFFECT: "#F 所有物理元素在交流时都有其局限性。水可以讲述在水中游泳的人的味道，也可以讲述他们的自信程度，还可以讲述他们是否因为不忠而抛弃了与他们一起在水中溺水的另一个人。#!"
 SHUI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F 有了此丹技，炼丹士就能与水神对话。#!"
 NURTURE_DIMINISH_WATER_SOUL_PERK_EFFECT: "#F 高明的领导者会利用这能力来增加追随者的忠诚度，或将他人的追随者窃为己有。#!"
 INCREASE_DECREASE_WATER_ATTRIBUTES_PERK_EFFECT: "#F 炼丹士可以通过修改目标的柔韧或耐力属性来祝福或诅咒目标。#!"
 SHUI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F 如果龙脉在水中或天空中穿行，炼丹士就会用水丹召唤龙舟。#!"
 SUMMON_DISPEL_SHUI_SHEN_PERK_EFFECT: "能够招募[GetMaA('water_elemental').GetName]作为[men_at_arms|E]。\n#F 有了这种能力，炼丹士就可以对水神进行一定的控制。#!"
 SHUI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F 这能力似乎不好用在水上，但作为组合技可能会非常有用，例如收起水壶。#!"
 WATER_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 该元素形态仍然遵循物理规则。#!"
 PATHS_OF_WATER_PERK_EFFECT: "#F 在水中移动显然是一件很方便的事情，而对于那些能够承受其苦的人来说，下水道在城市中随处可见。#!"
 SHUI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许你点化[true_jade|E]来储存气。\n#F 炼丹士能够点化黑玉。#!"
 MOVE_WATER_PERK_EFFECT: "#F 炼丹士可以用这丹技制造雪崩，阻止目标体内的血液流动，或从游泳池中提水救出溺水者，如果为时已晚，他们还可以清除受害者肺部的积水。#!"
 SHAPE_SUNDER_WATER_PERK_EFFECT: "#F 随意分海。也可以让水伸手抓住某人，将其淹死。也能用此丹技轻松冰雕。#!"
 SUMMON_DISPEL_WATER_PERK_EFFECT: "#F 将空气从某人的肺部排出可能会造成损害，而将空气从某人身后的房间排出可能会造成真空效应，这效应非常有用。#!"
 SHUI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F 有了这能力，淡水的冰点就能变得跟盐水一样，有害气体也能变得像水蒸气那样不有害。#!"
 TRANSMUTE_WATER_PERK_EFFECT: "#F 当附近没有应急物资时，将水或生理盐水转化为血液非常方便。#!"
 READ_FIRE_SOUL_PERK_EFFECT: "#F 与[fire_soul|E]交流时，神魔可以确定礼仪的隐含含义和违反礼仪的行为。#!"
 COMMUNE_WITH_FIRE_PERK_EFFECT: "#F 火本身就是一种难以沟通的元素，因为它不会在一个地方停留太久。照明、森林火灾……它们都是短暂的。#!"
 HOU_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F 炼丹士可以与他或她可能遇到的任何火神交谈。#!"
 NURTURE_DIMINISH_FIRE_SOUL_PERK_EFFECT: "#F 通过削弱[Concept('fire_soul','火魂')|E]，猫妖可以让一个人更容易受到他们的影响，而祝融则可以增强其的[fire_soul|E]，从而产生类似于一阶君临之艺的效果。#!"
 INCREASE_DECREASE_FIRE_ATTRIBUTES_PERK_EFFECT: "#F 通过增加魅力和风趣，炼丹士可以让自己像武术演员一样受欢迎和聪敏，或者通过减少魅力和风趣，让他们的目标变得如此不善交际，以至于永远无法恢复在宫廷中的地位。#!"
 HOU_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F 与此丹技，炼丹士能召唤龙舟，穿梭于光或岩浆龙脉。#!"
 SUMMON_DISPEL_HOU_SHEN_PERK_EFFECT: "能够招募[GetMaA('fire_elemental').GetName]作为[men_at_arms|E]。\n#F 顾名思义，炼丹士可以驱散或召唤火元素。#!"
 HOU_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F 不幸的是，火之炼丹士几乎不可能在没有搭配能力的情况下使用这一能力。此外，火物都不易储存。科技，如手机、电脑或手电筒，往往需要火丹和金丹共用才能受控，而这本身就会造成困难，因为火克金。#!"
 FIRE_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 这能力的通常规则是，火必须遵守物理定律……它需要燃料。#!"
 PATHS_OF_FIRE_PERK_EFFECT: "#F 乍一看，这似乎没什么用（除了被困火灾，谁还需要在火中穿行呢？），但随着电力和光纤在中原的普及，火之道也在不断发展。#!"
 HOU_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许你点化[true_jade|E]来储存气。\n#F 火之炼丹士能够点化红玉。#!"
 MOVE_FIRE_PERK_EFFECT: "不再因为火而受到伤害。\n#F 虽然这种能力乍看之下仅限于意念控火，但其实也包含了弯曲光线的能力，可以实现隐形等效果，甚至可以制造全息图和只包含视觉的幻象。#!"
 SHAPE_SUNDER_FIRE_PERK_EFFECT: "#F 与金丹搭配，可以操纵科技物品。#!"
 SUMMON_DISPEL_FIRE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('summon_dispel_fire_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 虽然炼丹士无法控制火的来源，但能从天上召来火，或在没有火的地方带来光亮甚至阳光，也是有好处的。#!"
 HOU_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F 有科学头脑的人都知道，电受火丹的支配，电磁才是真正的力。#!"
 TRANSMUTE_FIRE_PERK_EFFECT: "#F 光变火。电变光。光变热。岩浆变光。所有这些都是可能的。#!"
 READ_EARTH_SOUL_PERK_EFFECT: "#F 人们对某一主题的了解往往比自己知道的要多或少。诉问一个人的[earth_soul|E]可以揭示这一点。#!"
 COMMUNE_WITH_EARTH_PERK_EFFECT: "#F 炼丹士可以与土地或石头等物体对话，但无生命的物体并不具备人类的所有感官。#!"
 DI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F 炼丹士能与土神对话。#!"
 NURTURE_DIMINISH_EARTH_SOUL_PERK_EFFECT: "#F 增强一人的[earth_soul|E]会帮助他们做出明智的选择，而削弱则会使他们更难做出明智的决定。#!"
 INCREASE_DECREASE_EARTH_ATTRIBUTES_PERK_EFFECT: "#F 炼丹士可以增加或减少目标的智力属性。#!"
 DI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F 炼丹士可以召唤载具穿越沿着大地或山脉的龙脉。#!"
 SUMMON_DISPEL_DI_SHEN_PERK_EFFECT: "能够招募[GetMaA('earth_elemental').GetName]作为[men_at_arms|E]。\n#F 炼丹士可以召唤并命令地神。#!"
 DI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F 炼丹士可以将由土属性物体藏在自己体内。#!"
 EARTH_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_earth_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 炼丹士可以将自己的全部或部分躯体暂时变为土石。#!"
 PATHS_OF_EARTH_PERK_EFFECT: "#F 炼丹士可以穿越任何与土有关的物体。#!"
 DI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许你点化[true_jade|E]来储存气。\n#F 炼丹士能够点化黄玉。#!"
 MOVE_EARTH_PERK_EFFECT: "#F 炼丹士可以移动被土覆盖的物体，就像念力一样。#!"
 SHAPE_SUNDER_EARTH_PERK_EFFECT: "#F 虽然这力量可以有很多创造性的应用，但也可以被用来制造地震，或可以在山中开辟新的通道。#!"
 SUMMON_DISPEL_EARTH_PERK_EFFECT: "#F 为那些必须在宝库中拥有闪亮钻石的时候准备的。#!"
 DI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F 有了此丹技，石头可以变得像粘土一样柔韧，而钻石则像滑石一样易碎。#!"
 TRANSMUTE_EARTH_PERK_EFFECT: "作为[character_interaction|E]，允许你花费气来获得[prestige|E]。\n#F 利用这能力，可以将一把鹅卵石变成宝石……直到魔法消失，受赠者意识到自己上当受骗。#!"
 ART_SHAPECHANGE_PERK_EFFECT: "允许变身为数种动物。\n#F 改变容貌、性别、种族或物种。#!"
 VISAGE_OF_DEAD_PERK_EFFECT: "#F 这能力可以让妖仙让自己的躯体在一段时间内保持死亡。#!"
 AXIS_OF_TIME_PERK_EFFECT: "#F 妖仙可以减少时间对他们的束缚，加快自己在时间中的移动。#!"
 THE_MUTABLE_FURIES_PERK_EFFECT: "#F 妖仙可以操纵他们的气值。#!"
 THE_TYPHOONS_EYE_PERK_EFFECT: "#F 太极赋予神魔安然穿越风暴的力量。#!"
 THE_BENEVOLENT_HAND_OF_JADE_PERK_EFFECT: "#F 此丹技使不可能变得可能……#!"
 BACKSIDE_OF_THE_MONKEY_KING_PERK_EFFECT: "#F 此丹技使可能变得不可能……#!"
 FORTIFY_THE_WALL_PERK_EFFECT: "解锁[umbra|E]界面的操纵绝壁选项。\n#F 持匙者可以暂时加固一个地方的绝壁。#!"
 UNLOCK_THE_JADE_PORTAL_PERK_EFFECT: "#F 打开绝壁，穿越绝壁。#!"