 REALM_ACTOR_1_PERK_EFFECT: "可行[cantrips|E]对象被扩展为：[friend|E]、[lover|E]、[courtier|E]、[direct_vassal|E]、家族成员、对其有强[title_claim|E]或[strong_hook|E]的角色、受知其罪恶[secret|E]的角色。\n但是你不能跟目标有任何负面关系、[war|E]、[truce|E]、或将其囚禁。"
 REALM_ACTOR_2_PERK_EFFECT: "你现在可以对一位[friend|E]、[lover|E]、[courtier|E]、[guest|E]、[vassal|E]、[liege|E]、家族成员，或对你有[title_claim|E]或[hook|E]的角色，亦或你知道其[secret|E]的角色施展[cantrips|E]。此外，该角色不得与你有任何不良关系、处于[war|E]或[truce|E]状态，也不得被你囚禁。"
 REALM_ACTOR_3_PERK_EFFECT: "可行[cantrips|E]对象被扩展为：任何有正面关系的角色、[courtier|E]、[guest|E]、[vassal|E]、[liege|E]、[ally|E]、宗族成员、对其有宣称或[hook|E]的角色、受知其[secret|E]的角色。\n但是你不能跟目标有任何负面关系或[war|E]。"
 REALM_ACTOR_4_PERK_EFFECT: "可行[cantrips|E]对象被扩展为任何非[rival|E]或不在[war|E]中的角色。"
 REALM_ACTOR_5_PERK_EFFECT: "可行[cantrips|E]对象被扩展为任意角色，哪怕是[rival|E]或者与其在[war|E]。"
 REALM_FAE_1_PERK_EFFECT: "允许向次等超自然或者具有次等超能力的凡人施展[cantrips|E]。"
 REALM_FAE_2_PERK_EFFECT: "允许向换生灵施展[cantrips|E]。"
 REALM_FAE_3_PERK_EFFECT: "允许向妖精施展[cantrips|E]。"
 REALM_FAE_4_PERK_EFFECT: "允许向无灵体特性的超自然和具有强力超能力的凡人施展[cantrips|E]。"
 REALM_FAE_5_PERK_EFFECT: "允许向任何超自然施展[cantrips|E]。"
 REALM_PROP_1_PERK_EFFECT: "你现在可以对普通级/大师级的饰品/宫廷宝物释放[cantrips|E]。"
 REALM_PROP_2_PERK_EFFECT: "你现在可以对普通级/大师级宝物释放[cantrips|E]。"
 REALM_PROP_3_PERK_EFFECT: "你现在可以对非独特的名作级/卓越级宝物释放[cantrips|E]。"
 REALM_PROP_4_PERK_EFFECT: "你现在可以对独特的名作级宝物释放[cantrips|E]。"
 REALM_PROP_5_PERK_EFFECT: "你现在可以对独特的卓越级宝物释放[cantrips|E]"
 REALM_NATURE_1_PERK_EFFECT: "允许施展无生命的有机物质的相关[cantrips|E]"
 REALM_NATURE_2_PERK_EFFECT: "允许施展植物的相关[cantrips|E]"
 REALM_NATURE_3_PERK_EFFECT: "允许施展无智慧动物的相关[cantrips|E]"
 REALM_NATURE_4_PERK_EFFECT: "允许施展自然现象的相关[cantrips|E]"
 REALM_NATURE_5_PERK_EFFECT: "允许施展纯粹自然元素的相关[cantrips|E]"
 REALM_SCENE_1_PERK_EFFECT: "你现在可以对隔着小型国度一般远的角色施放[cantrips|E]（约威尔士从上到下的距离）。\n允许施展伯爵领级范围[cantrips|E]。"
 REALM_SCENE_2_PERK_EFFECT: "你现在可以对隔着中型国度一般远的角色施放[cantrips|E]（约爱尔兰从上到下的距离）。\n允许施展公爵领级范围[cantrips|E]。"
 REALM_SCENE_3_PERK_EFFECT: "你现在可以对隔着大型国度一般远的角色施放[cantrips|E]（约法兰西从上到下的距离）。\n允许施展王国级范围[cantrips|E]。"
 REALM_SCENE_4_PERK_EFFECT: "你现在可以对隔着巨型国度一般远的角色施放[cantrips|E]（约神圣罗马帝国从左到右的距离）。\n允许施展帝国级范围[cantrips|E]。"
 REALM_SCENE_5_PERK_EFFECT: "你现在可以对任意地图上的角色释放[cantrips|E]。\n允许施展世界级范围[cantrips|E]。"
 REALM_TIME_1_PERK_EFFECT: "[cantrip|E]修正将持续#V 1#!年而非#V 4#!月。\n[cantrip|E]冷却期降为四分之三。"
 REALM_TIME_2_PERK_EFFECT: "[cantrip|E]修正将持续#V 2#!年而非#V 1#!年。\n[cantrip|E]冷却期降为一半。"
 REALM_TIME_3_PERK_EFFECT: "[cantrip|E]修正将持续#V 5#!年而非#V 2#!年。\n[cantrip|E]冷却期降为四分之一。"
 REALM_TIME_4_PERK_EFFECT: "[cantrip|E]修正将持续#V 10#!年而非#V 5#!年。\n[cantrip|E]冷却期降为一单位。"
 REALM_TIME_5_PERK_EFFECT: "[cantrip|E]修正将无限持续。\n[cantrip|E]不再有冷却期。"
