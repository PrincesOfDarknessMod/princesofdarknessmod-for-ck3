l_simp_chinese:
 game_concept_realm_lifestyle: "术域"
 game_concept_realm_lifestyle_desc: "戚族与世界的六方面有亲和力，直接决定其能影响的人或事物。如果不了解适当的术域，戚族就无法影响任何东西。术域是施展[cantrip|E]的必要条件。"
 realm_lifestyle_name: "术域"
 realm_lifestyle_desc: "专注于戚族与世界的亲和力。"
 monthly_realm_lifestyle_xp_gain_mult: "每月术域[lifestyle|E][experience|E]"
 realm_actor_focus: "角色重心"
 realm_actor_focus_modifier: "[GetFocus('realm_actor_focus').GetName]"
 realm_actor_focus_desc: "角色是与所有世俗众生相连的领域，与你对他们的了解程度直接相关。"
 realm_actor_focus_effect_desc: "角色重心给予："
 realm_fae_focus: "妖精重心"
 realm_fae_focus_modifier: "[GetFocus('realm_fae_focus').GetName]"
 realm_fae_focus_desc: "妖精领域与其他[UmbraGlossary('dreaming')]生物相关。影响其他换生灵、仙族贵胄、魔妖、奇魅，甚至是控制妖精魔法本身，都属于妖精的范畴。"
 realm_fae_focus_effect_desc: "妖精重心给予："
 realm_prop_focus: "道具重心"
 realm_prop_focus_modifier: "[GetFocus('realm_prop_focus').GetName]"
 realm_prop_focus_desc: "道具是对所有被制造的物体的控制和操纵。设备越复杂，对道具领域的掌握就得更高。"
 realm_prop_focus_effect_desc: "道具重心给予："
 realm_nature_focus: "自然重心"
 realm_nature_focus_modifier: "[GetFocus('realm_nature_focus').GetName]"
 realm_nature_focus_desc: "自然是对植物、动物和大地的控制。任何未人造的物事都在自然领域之下。"
 realm_nature_focus_effect_desc: "自然重心给予："
 realm_scene_focus: "场景重心"
 realm_scene_focus_modifier: "[GetFocus('realm_scene_focus').GetName]"
 realm_scene_focus_desc: "场景是对空间的控制。你对场景领域掌握得越多，你就能影响更大的区域或（与其他领域结合）影响更多的目标。"
 realm_scene_focus_effect_desc: "场景重心给予："
 realm_time_focus: "时间重心"
 realm_time_focus_modifier: "[GetFocus('realm_time_focus').GetName]"
 realm_time_focus_desc: "时间是对你的魔咒何时发生或持续多久的控制。对时间的掌握决定了你的法术可以持续多长时间，或者你可以对它们设置的延后“触发”时间。"
 realm_time_focus_effect_desc: "时间重心给予："
