 NUMINA_FORTUNE_1_PERK_EFFECT: "#flavor 对一人施加短暂困扰或微小祝福#!"
 NUMINA_FORTUNE_2_PERK_EFFECT: "作为[bs_spell|E]，使次级超自然(兽嫡, 换生灵, 血仆等) 目标受伤。\n作为[bs_spell|E]为目标施加[GetModifier('numina_fortune_2_bless_modifier').GetNameWithTooltip]\n#flavor 对一人及其密切关联者施加持续伤害、羞辱或祝福。#!"
 NUMINA_FORTUNE_3_PERK_EFFECT: "通过加重造成的伤势，强化 [GetPerk('numina_fortune_2_perk').GetName(GetPlayer)][bs_spell|E]\n通过用[GetPerk('numina_fortune_2_perk').GetName(GetPlayer)][bs_spell|E]替换[GetModifier('numina_fortune_2_bless_modifier').GetNameWithTooltip]强化[GetModifier('numina_fortune_3_bless_modifier').GetNameWithTooltip]\n#flavor 对一人及其两名关联者施加重伤、疾病或强力祝福。#!"
 NUMINA_FORTUNE_4_PERK_EFFECT: "通过致残并永久创伤目标，强化[GetPerk('numina_fortune_2_perk').GetName(GetPlayer)][bs_spell|E]\n通过用[GetModifier('numina_fortune_4_bless_modifier').GetNameWithTooltip]替换[GetPerk('numina_fortune_3_perk').GetName(GetPlayer)]，强化[GetModifier('numina_fortune_3_bless_modifier').GetNameWithTooltip][bs_spell|E]\n#flavor 对一人及其亲友施加持续疾病、创伤或祝福。#!"
 NUMINA_FORTUNE_5_PERK_EFFECT: "通过将限制从子分支改为不超过500年，来提升[GetPerk('numina_fortune_2_perk').GetName(GetPlayer)][bs_spell|E]\n通过将[GetPerk('numina_fortune_4_perk').GetName(GetPlayer)][bs_spell|E]替换为[GetModifier('numina_fortune_5_bless_modifier').GetNameWithTooltip]，来提升[GetModifier('numina_fortune_4_bless_modifier').GetNameWithTooltip]的效果。\n#flavor 死亡将降临目标及其所有亲友，或施加强力祝福以阻止死亡/赋予持续数年的鸿运。#!"
 NUMINA_FORTUNE_6_PERK_EFFECT: "通过将目标限制从500年以下改为物质界存在（非灵体），强化[GetPerk('numina_fortune_2_perk').GetName(GetPlayer)][bs_spell|E]\n通过用[GetPerk('numina_fortune_5_perk').GetName(GetPlayer)][bs_spell|E][GetModifier('numina_fortune_5_bless_modifier').GetNameWithTooltip]替换[GetModifier('numina_fortune_6_bless_modifier').GetNameWithTooltip]\n#flavor 诅咒或祝福的强度可世代延续。若存在比死亡更悲惨的命运或永生之法，必属此等量级的诅咒或祝福。#!"
 NUMINA_FORTUNE_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：运命#![journey|E]#!"
