 NUMINA_NECROMANCY_1_PERK_EFFECT: "可以与尸幕另一侧的角色互动。\n$POD_can_summon_on_death_trigger_loca$\n#flavor 有些事物应当永远埋葬。其中最重要的便是：死灵。但那些追随通灵术之路的人却有些不同的看法。与地狱之火类似，通灵术的名声极为恶劣，只有最邪恶的人才会使用。但与地狱火不同的是，这种名声至少在一定程度上是应得的。#!"
 NUMINA_NECROMANCY_2_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#flavor 有些事物应当永远埋葬。其中最重要的便是：死灵。但那些追随通灵术之路的人却有些不同的看法。与地狱之火类似，通灵术的名声极为恶劣，只有最邪恶的人才会使用。但与地狱火不同的是，这种名声至少在一定程度上是应得的。#!"
