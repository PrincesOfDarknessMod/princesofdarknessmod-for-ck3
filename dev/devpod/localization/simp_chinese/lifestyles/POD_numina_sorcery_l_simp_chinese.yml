 numina_divination_6_perk_name: "$numina_6_name$占卜"
 NUMINA_DIVINATION_1_PERK_EFFECT: "#flavor 窥视过去或未来一周，整体准确性较高。#!"
 NUMINA_DIVINATION_2_PERK_EFFECT: "#flavor 窥视过去或未来一月，准确性显著提升。#!"
 NUMINA_DIVINATION_3_PERK_EFFECT: "#flavor 窥视过去或未来一年，准确性更高。#!"
 NUMINA_DIVINATION_4_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n#flavor 能精准地看到过去或未来十年的景象。#!"
 NUMINA_DIVINATION_5_PERK_EFFECT: "作为[bs_spell|E]，揭露针对目标的所有[schemes|E]\n#flavor 以极高准确性窥视一生跨度内的过去或未来。#!"
 NUMINA_DIVINATION_6_PERK_EFFECT: "提升[GetPerk('numina_divination_5_perk').GetName(GetPlayer)][bs_spell|E]同时终止所有针对目标的敌对[schemes|E]\n#flavor 尽可能远地窥视过去或未来。即使占卜错误，也包含真实元素。#!"
 NUMINA_DIVINATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：占卜#![journey|E]#!"
 numina_enchantment_1_perk_name: "$numina_1_name$附魔"
 numina_enchantment_2_perk_name: "$numina_2_name$附魔"
 numina_enchantment_3_perk_name: "$numina_3_name$附魔"
 numina_enchantment_4_perk_name: "$numina_4_name$附魔"
 numina_enchantment_5_perk_name: "$numina_5_name$附魔"
 numina_enchantment_6_perk_name: "$numina_6_name$附魔"
 NUMINA_ENCHANTMENT_1_PERK_EFFECT: "提升基础[crafting_nodes|E]\n#flavor 附魔师创造一件使用次数有限且影响范围狭窄的次级物品。#!"
 NUMINA_ENCHANTMENT_2_PERK_EFFECT: "提升基础[crafting_nodes|E]\n解锁用于[crafting_nodes|E]强化的基础[crafting_enhancing|E]的弱化版本\n#flavor 附魔师创造一件更强大的护符，其魔法效果显而易见。#!"
 NUMINA_ENCHANTMENT_3_PERK_EFFECT: "提升基础[crafting_nodes|E]以及它们的[crafting_enhancing|E]强化版本\n#flavor 附魔师创造一件功能明显为魔法的护符。#!"
 NUMINA_ENCHANTMENT_4_PERK_EFFECT: "提升基础[crafting_nodes|E]以及它们的[crafting_enhancing|E]版本\n$unlock_forging_node$添加一个[modifier|E]，使一个随机[skill|E]增加([GetModifier('enchantment_attribute_diplomacy_modifier').GetNameWithTooltip])，每次制造会话限1个[crafting_node|E]\n#flavor 附魔师创造一件能突破共识多项限制的护符。#!"
 NUMINA_ENCHANTMENT_5_PERK_EFFECT: "提升基础的[crafting_nodes|E]及其[crafting_enhancing|E]版本\n将[GetPerk('numina_enchantment_4_perk').GetName(GetPlayer)]的限制从1提升至2。\n#flavor 附魔师创造一件几乎拥有奇迹力量的护符。#!"
 NUMINA_ENCHANTMENT_6_PERK_EFFECT: "提升基础的[crafting_nodes|E]及其[crafting_enhancing|E]版本\n解除了[GetPerk('numina_enchantment_4_perk').GetName(GetPlayer)]对[crafting_forging|E]的限制，并增加了对[crafting_enhancing|E]的限制\n#flavor 附魔师创造一件传奇宝物。#!"
 NUMINA_ENCHANTMENT_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：附魔#![journey|E]#!"
 numina_ephemera_1_perk_name: "$numina_1_name$游灵"
 numina_ephemera_2_perk_name: "$numina_2_name$游灵"
 numina_ephemera_3_perk_name: "$numina_3_name$游灵"
 numina_ephemera_4_perk_name: "$numina_4_name$游灵"
 numina_ephemera_5_perk_name: "$numina_5_name$游灵"
 numina_ephemera_6_perk_name: "$numina_6_name$游灵"
 NUMINA_EPHEMERA_1_PERK_EFFECT: "作为[bs_spell|E]，有20%几率召唤一名[GetTrait('spirit').GetName(GetPlayer)]角色至你的[court|E]\n#flavor 感知险棘后诸灵的活动。#!"
 NUMINA_EPHEMERA_2_PERK_EFFECT: "诸灵将更易接受你与其缔结契约的尝试。[GetPerk('numina_ephemera_1_perk').GetName(GetPlayer)][bs_spell|E]通过将几率提升至40%\n#flavor 学习区分险棘后的不同种类诸灵，并尝试将其带入物质世界。#!"
 NUMINA_EPHEMERA_3_PERK_EFFECT: "诸灵将更易接受你与其缔结契约的尝试。[GetPerk('numina_ephemera_2_perk').GetName(GetPlayer)][bs_spell|E]通过将几率提升至60%\n#flavor 学习联系特定诸灵以与其沟通。#!"
 NUMINA_EPHEMERA_4_PERK_EFFECT: "诸灵将更易接受你与其缔结契约的尝试。[GetPerk('numina_ephemera_3_perk').GetName(GetPlayer)][bs_spell|E]通过将几率提升至80%\n#flavor 学习感知周围的灵质，并看穿险棘后的诸灵#!\n"
 NUMINA_EPHEMERA_5_PERK_EFFECT: "诸灵将更易接受你与其缔结契约的尝试。[GetPerk('numina_ephemera_4_perk').GetName(GetPlayer)][bs_spell|E]通过将几率提升至100%\n#flavor 学习命令诸灵为你效命。#!"
 NUMINA_EPHEMERA_6_PERK_EFFECT: "诸灵将#P 极大#!更易接受你与其缔结契约的尝试。\n解锁[charms_lifestyle|E]权限\n移除进入[UmbraGlossary('spirit_wilds')]的消耗\n你获得[trait|E]#V [GetTrait('immortal').GetName(GetPlayer)]#!\n#flavor 以星界形态穿越险棘。#!"
