 NUMINA_ALCHEMY_1_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('alchemy_antidepresants_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('alchemy_aphrodisiac_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('alchemy_poison_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('alchemy_antibiotics_1_modifier').GetNameWithTooltip]\n#flavor 这个级别的炼金术士可以创造出性能远超凡世间普通化学物质的混合产物。#!"
 NUMINA_ALCHEMY_2_PERK_EFFECT: "提升所有[GetPerk('numina_alchemy_1_perk').GetName(GetPlayer)][Concept('crafting_node','节点')|E]$unlock_brewing_node$添加一个[modifier|E]，使一个随机[skill|E]增加1点 ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n#flavor 这个级别的炼金术士可以创造出涉及轻度神秘学变化的物质（例如，一种允许超过其正常物理极限的粉末）#!"
 NUMINA_ALCHEMY_3_PERK_EFFECT: "提升所有的[GetPerk('numina_alchemy_2_perk').GetName(GetPlayer)][Concept('crafting_node','节点')|E]\n#flavor 炼金术士可制造模拟低阶超自然能力效果的药剂，并开始为金属及其他材料赋予奇异力量。"
 NUMINA_ALCHEMY_4_PERK_EFFECT: "提升所有的[GetPerk('numina_alchemy_3_perk').GetName(GetPlayer)][Concept('crafting_node','节点')|E]\n$unlock_brewing_node$[GetModifier('alchemy_health_booster_1_modifier').GetNameWithTooltip]。\n#flavor 炼金术士可制造突破人类极限的强化药剂。低阶药剂现可通过旅行工具包轻松制作。#!"
 NUMINA_ALCHEMY_5_PERK_EFFECT: "提升所有[GetPerk('numina_alchemy_4_perk').GetName(GetPlayer)][Concept('crafting_node','节点')|E]\n$unlock_brewing_node$#TOOLTIP:GAME_TRAIT,immortal,[GetNullCharacter] #L 永生#!\n$unlock_brewing_node$#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L 吸血鬼化#!\n#flavor 炼金术师能够制造出模拟中级超自然能力效果的药剂。然而这些药水可能会产生严重的副作用（具体取决于配制的浓度），需要研究超自然生物并获取它们的素材（如狼毛、吸血鬼血液、妖精之血等）才能炼制#!"
 NUMINA_ALCHEMY_6_PERK_EFFECT: "提升所有的[GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)][Concept('crafting_node','节点')|E]\n$unlock_brewing_node$[GetTrait('kinfolk').GetName(GetPlayer)]\n$unlock_brewing_node$[GetTrait('kinain').GetName(GetPlayer)]\n\n#flavor 炼金术士已达到了巅峰，能够创造贤者之石，实现永生，或将一种元素转化为另一种元素。理论上，甚至可以配制出一种药剂，将人转变为吸血鬼、狼人或其他生物。这一层次还能够赋予炼金术士觉醒的能力。#!"
 NUMINA_ALCHEMY_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：炼金术#![journey|E]#!"
 numina_conjuration_1_perk_name: "$numina_1_name$咒法"
 numina_conjuration_2_perk_name: "$numina_2_name$咒法"
 numina_conjuration_3_perk_name: "$numina_3_name$咒法"
