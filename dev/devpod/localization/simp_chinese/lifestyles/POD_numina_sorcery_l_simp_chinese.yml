 NUMINA_SHAPESHIFTING_2_PERK_EFFECT: "解锁“塑造的更年轻或年老”变形选项\n#flavor 显著的外貌变化，如身高改变#!"
 NUMINA_SHAPESHIFTING_3_PERK_EFFECT: "解锁巨人与侏儒变形选项\n#flavor 用动物肢体替换身体部位#!"
 NUMINA_SHAPESHIFTING_4_PERK_EFFECT: "解锁小型动物变形选项\n#flavor 用动物肢体替换多个身体部位#!"
 NUMINA_SHAPESHIFTING_5_PERK_EFFECT: "解锁动物形态变形选项\n#flavor 完全转变为动物形态#!"
 NUMINA_SHAPESHIFTING_6_PERK_EFFECT: "解锁“身体特质”变形选\n解锁神话动物变形选项\n#flavor 完全转变为神话生物形态。#!"
