 NUMINA_QUINTESSENCE_MANIPULATION_1_PERK_EFFECT: "可以使用灵具[artifacts|E]\n将 [GetModifier('numina_sorcery_quintessence_manipulation_malus_modifier').GetNameWithTooltip] [modifier|E] 赋予敌方[GetTrait('werewolf').GetName(GetPlayer)]的 [knights|E]，当你在 [combat_phase|E] 中作为 [commander|E] 行动时，或在 [single_combat_duel_plural|E] 中赋予你的对手。\n#flavor 几乎所有术士都认同一点：存在一种能量流动，为他们的法术提供力量。这种力量的名字因文化与哲学而异：魔力、气、灵知、沙克提、塞赫等。每位法师都能描述施法时能量流经体内的感觉——如电流通过电线般涌动，可被感知，甚至被直接驾驭。#!"
