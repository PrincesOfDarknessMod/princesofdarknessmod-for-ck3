 NUMINA_SHADOWS_1_PERK_EFFECT: "#flavor 操纵光线，使阴影变得更加深邃和黑暗。#!"
 NUMINA_SHADOWS_2_PERK_EFFECT: "#flavor 操纵阴影以弯曲声波，使自己更容易隐藏。当对他人施放时，那个人的心智会开始产生幻觉。#!"
 NUMINA_SHADOWS_3_PERK_EFFECT: "#flavor 操纵阴影以淹没色彩。当对他人施放时，那个人的心智会陷入恐慌。#!"
 NUMINA_SHADOWS_4_PERK_EFFECT: "#flavor 操纵阴影以使电子设备失效。看到这些阴影的人会陷入恐惧。#!"
 NUMINA_SHADOWS_5_PERK_EFFECT: "#flavor 操纵阴影以完全隐藏自己，使凡人无法看见。看到这些阴影的人可能会因这种经历而精神失常。#!"
 NUMINA_SHADOWS_6_PERK_EFFECT: "#flavor 将阴影实体化，或熄灭半径50英尺内的所有光源。#!"
 NUMINA_SHADOWS_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：阴影#![journey|E]#!"
