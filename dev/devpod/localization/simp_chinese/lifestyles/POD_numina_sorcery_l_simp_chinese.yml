 NUMINA_HEALING_4_PERK_EFFECT: "通过允许治愈永久性伤病，强化[GetPerk('numina_healing_3_perk').GetName(GetPlayer)][bs_spell|E]\n#flavor 治愈复合骨折与严重创伤，加速愈合并预防感染，甚至根治哮喘等慢性疾病#!"
 NUMINA_HEALING_5_PERK_EFFECT: "通过允许治愈任何伤病，强化[GetPerk('numina_healing_3_perk').GetName(GetPlayer)][bs_spell|E]\n#flavor 治愈致命伤并永久根除癌症等恶疾#!"
 NUMINA_HEALING_6_PERK_EFFECT: "你获得[trait|E]#V [GetTrait('immortal').GetName(GetPlayer)]#!\n\n你获得[GetModifier('extra_life_4_modifier').GetNameWithTooltip]\n#flavor 复活近期死亡者。但若其未立即接受治疗，将再度死亡。#!"
