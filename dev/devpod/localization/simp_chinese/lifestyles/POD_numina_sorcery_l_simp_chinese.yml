 NUMINA_CONJURATION_1_PERK_EFFECT: "#flavor 召唤师可移动10英尺范围内的小型物体数英尺。#!"
 NUMINA_CONJURATION_2_PERK_EFFECT: "#flavor 召唤师可移动简单物品，或从15英尺范围内召唤它们。#!"
 NUMINA_CONJURATION_3_PERK_EFFECT: "作为[bs_spell|E]召唤随机使魔\n#flavor 召唤师可移动更大、更复杂的物体，甚至使其悬浮于空中。物体重量不得超过200磅，且需在25英尺范围内。#!"
 NUMINA_CONJURATION_4_PERK_EFFECT: "作为[bs_spell|E]召唤随机#color_dark_green 杰作级#![artifact|E]\n#flavor 召唤师可移动大型物体（如钢琴），甚至质量至少为人类一半的复杂生命体。最大范围为50英尺。#!"
 NUMINA_CONJURATION_5_PERK_EFFECT: "作为[bs_spell|E], 召唤[GetTrait('mortal').GetName(GetPlayer)]或自愿的超自然目标\n提升[GetPerk('numina_conjuration_4_perk').GetName(GetPlayer)][bs_spell|E]的效果，改为召唤一件#FAMEDBLUE 名作级#![artifact|E]。\n#flavor 咒法师可移动或召唤人类，前提是目标自愿或昏迷。物体可从60英尺范围内召唤。#!"
 NUMINA_CONJURATION_6_PERK_EFFECT: "作为[bs_spell|E]，从深渊召唤[GetTrait('demon').GetName(GetPlayer)]\n提升[GetPerk('numina_conjuration_4_perk').GetName(GetPlayer)][bs_spell|E]：改为召唤#ILLUSTRIOUSPURPLE 卓越级#![artifact|E]\n提升[GetPerk('numina_conjuration_5_perk').GetName(GetPlayer)][bs_spell|E]：允许接受物质目标。\n#flavor 咒法师可召唤并移动卡车大小的物体，以及最多三个人类大小的生命体，范围可达100英里。#!"
 NUMINA_CONJURATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：咒法#![journey|E]#!"
