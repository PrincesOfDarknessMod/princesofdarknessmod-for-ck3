 NUMINA_CONVEYANCE_1_PERK_EFFECT: "#flavor 使用者可将自身传送约10英尺。#!"
 NUMINA_CONVEYANCE_2_PERK_EFFECT: "#flavor 使用者可将自身及20磅物品传送约100英尺。#!"
 NUMINA_CONVEYANCE_3_PERK_EFFECT: "作为[bs_spell|E]，你可传送至旅行的下一目的地。\n#flavor 使用者可将自身及一名同伴转移约一英里。#!"
 NUMINA_CONVEYANCE_4_PERK_EFFECT: "#flavor 使用者可将自身及两名同伴传送约五英里。#!"
 NUMINA_CONVEYANCE_5_PERK_EFFECT: "作为[bs_spell|E]，你可将指挥的军队传送至目标位置。\n#flavor 使用者可将自身及三名同伴转移约十英里。#!"
 NUMINA_CONVEYANCE_6_PERK_EFFECT: "提升[GetPerk('numina_conveyance_5_perk').GetName(GetPlayer)][bs_spell|E]通过解除转移限制\n#flavor 使用者可将自身及五名同伴转移约100英里。#!"
 NUMINA_CONVEYANCE_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon!你必须先完成#v 学习边缘术法宗师之道：转移#![journey|E]#!"
