 EMPATHIC_HEALING_1_PERK_EFFECT: "作为一名[character_interaction|E]，允许消除负面压力特质。\n#weak 灵能者可以建立一种移情联系，使他们能够影响另一个人的治疗过程。\n灵能者可以缓解忧郁和类似的轻微疾病。#!"
 EMPATHIC_HEALING_2_PERK_EFFECT: "作为[character_interaction|E]，能够吸收伤疤特质。\n#weak 灵能者可以修复轻微伤害。#!"
 EMPATHIC_HEALING_3_PERK_EFFECT: "作为[character_interaction|E]，能够吸收疾病特质。\n#weak 灵能者能够治疗急病或修复骨折。#!"
 EMPATHIC_HEALING_4_PERK_EFFECT: "作为[character_interaction|E]，能够吸收受伤特质。\n#weak 灵能者能够修复内部伤害。#!"
 EMPATHIC_HEALING_5_PERK_EFFECT: "作为[character_interaction|E]，能够移除负面精神特质。\n#weak 灵能者能够治疗严重的心理损伤，包括错乱和哀号。#!"
