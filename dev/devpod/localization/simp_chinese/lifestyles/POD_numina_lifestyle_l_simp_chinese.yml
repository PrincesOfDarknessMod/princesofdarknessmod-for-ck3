 PSYCHOPORTATION_1_PERK_EFFECT: "#weak 通过心灵之力，灵能者可以进行短距离传送。  \n灵能者可以在视线范围内进行短距离传送。#!"
 PSYCHOPORTATION_2_PERK_EFFECT: "As a [character_interaction|E], allows you to teleport your army to your target's location, or teleport to your next destination when traveling. The maximum distance is equivalent to a small realm (example: Wales top to bottom)\n#weak The psychic can teleport across larger distances.#!"
 PSYCHOPORTATION_3_PERK_EFFECT: "Increases the maximum distance of [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )] to a big realm (example: France top to bottom)\n#weak The psychic can teleport across major distances.#!"
 PSYCHOPORTATION_4_PERK_EFFECT: "Increases the maximum distance of [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )] to a massive realm (example: Holy Roman Empire left to right)\n#weak The psychic can teleport across even larger distances.#!"
 PSYCHOPORTATION_5_PERK_EFFECT: "Removes the distance limit of [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )]\n#weak The psychic no longer needs to see the destination for their teleportation.#!"
