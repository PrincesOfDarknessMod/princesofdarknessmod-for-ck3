 astral_projection_perk_name: "星光投射"
 mind_shield_perk_name: "心智护盾"
 ASTRAL_PROJECTION_PERK_EFFECT: "允许进入[astral_reaches|E]和[deep_umbra|E]。\n#F 可以将他们的灵体从身体中分离出来，在星界漫游。虽然在这种状态下无法影响现实世界，但他们仍然可以使用灵能能力。有报告说能听到其他实体的声音，且有数个使用这种能力的灵能者已经迷失了，他们的灵魂在远离盖亚的陌生空间游荡。#!"
 MIND_SHIELD_PERK_EFFECT: "免疫敌对心灵[character_interaction|E]。\n#F 灵能者可以建立精神防护，防止超自然的入侵。这包括法师的法术、吸血鬼的血律、换生灵的魔咒和其他基于心灵的能力。这种能力没有主动能力。相反，它只是提高了入侵者穿透灵能者头脑的难度。#!"
 SORCERY_LEVEL_6_REQUIREMENT: "@warning_icon!#X 你需要达成相应决议来解锁第六阶术法！#!"
 SORCERY_LEVEL_6_DISABLED: "@warning_icon!#X 第六阶术法已被游戏规则禁用#!"
 unlock_tier_6_coresponding_path: "解锁对应道途的第六阶术法"
 alchemy_1_sorcery_perk_name: "一阶炼金"
 ALCHEMY_1_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('light_painstopper_modifier').GetNameWithTooltip], [GetModifier('small_fertility_booster_modifier').GetNameWithTooltip], [GetModifier('small_fertility_downer_modifier').GetNameWithTooltip],  [GetModifier('simple_antibiotics_modifier').GetNameWithTooltip], [GetModifier('simple_poison_modifier').GetNameWithTooltip]\n#flavor The user uses alchemical rites to perfect and combine material objects to eventually purify their own soul.\nThe alchemist can create compounds and substances that are simply more advanced and potent versions of chemicals that already exist. These compounds don’t appear magical in any way.#!"
 alchemy_2_sorcery_perk_name: "Alchemy 2"
 ALCHEMY_2_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('painstopper_modifier').GetNameWithTooltip], [GetModifier('fertility_booster_modifier').GetNameWithTooltip], [GetModifier('fertility_downer_modifier').GetNameWithTooltip], [GetModifier('antibiotics_modifier').GetNameWithTooltip], [GetModifier('poison_modifier').GetNameWithTooltip]\n#flavor More advanced versions of what is available already with one dot. Some of these substances might allow the imbiber to exceed his normal physical limits or to gain access to more mystical senses, in dreams or hallucinations.#!"
 alchemy_3_sorcery_perk_name: "Alchemy 3"
 ALCHEMY_3_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('potion_of_diplomacy_modifier').GetNameWithTooltip] (etc.), [GetModifier('potion_of_strength_modifier').GetNameWithTooltip], [GetModifier('potent_poison_modifier').GetNameWithTooltip]\n#flavor The alchemist can make substances that enhance their target to superhuman levels or create materials that exceed normal limitations (supernaturally strong alloys, etc). Some of these substances can temporarily invest their imbiber with some low-level psychic ability for a limited period of time (no more than one hour or so) for example.#!"
 alchemy_4_sorcery_perk_name: "Alchemy 4"
 ALCHEMY_4_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('potent_potion_of_diplomacy_modifier').GetNameWithTooltip] (etc.), [GetModifier('potent_potion_of_strength_modifier').GetNameWithTooltip], [GetModifier('extremly_potent_poison_modifier').GetNameWithTooltip]\n#flavor The alchemist can create substances that will enhance their attributes even beyond normal human maximums or minor items with some potent effect.#!"
 alchemy_5_sorcery_perk_name: "Alchemy 5"
 ALCHEMY_5_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('philosophers_stone_modifier').GetNameWithTooltip], [GetModifier('elixir_of_diplomacy_modifier').GetNameWithTooltip] (etc.), [GetModifier('elixir_of_strength_modifier').GetNameWithTooltip], [GetModifier('elixir_of_death_modifier').GetNameWithTooltip], [GetModifier('elixir_of_potence_modifier').GetNameWithTooltip], [GetModifier('elixir_of_celebrity_modifier').GetNameWithTooltip], [GetModifier('elixir_of_fortitude_modifier').GetNameWithTooltip], [GetModifier('elixir_of_auspex_modifier').GetNameWithTooltip]\n#flavor With this level of knowledge, the alchemist can duplicate the powers of supernatural creatures, including Gifts, Disciplines and other abilities of up to the third level. They can also duplicate the innate powers of these creatures (the powers of the Fae, wraiths and the imbued cannot be duplicated).#!"
 alchemy_6_sorcery_perk_name: "Alchemy 6"
 ALCHEMY_6_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('elixir_immortality_modifier').GetNameWithTooltip], [GetModifier('vampire_concoction_modifier').GetNameWithTooltip]"
 ALCHEMY_6_SORCERY_PERK_EFFECT_SAMUEL: "In addition because you use [samuel_haight_mode|E] discovers recipes for: [GetModifier('kinfolk_elixir_modifier').GetNameWithTooltip], [GetModifier('kinain_elixir_modifier').GetNameWithTooltip]\n#flavor The Alchemist has reached the pinnacle, becoming able to create a Philosopher’s Stone, become immortal, or transmute one element into another. In theory, one could even create a concoction capable of turn one into a vampire, werewolf, or another being. This level also is capable of granting awakening to the Alchemist.#!"
 ALCHEMY_6_SORCERY_PERK_EFFECT_NOT_SAMUEL: "Without [samuel_haight_mode|E] you #N Won't discover#! [GetModifier('kinfolk_elixir_modifier').GetNameWithTooltip], [GetModifier('kinain_elixir_modifier').GetNameWithTooltip]\n#flavor The Alchemist has reached the pinnacle, becoming able to create a Philosopher’s Stone, become immortal, or transmute one element into another. In theory, one could even create a concoction capable of turn one into a vampire, werewolf, or another being. This level also is capable of granting awakening to the Alchemist.#!"
 alchemy_6_5_sorcery_perk_name: "Alchemy 6.5"
 ALCHEMY_6_5_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('kinfolk_elixir_modifier').GetNameWithTooltip], [GetModifier('kinain_elixir_modifier').GetNameWithTooltip]\n#flavor As alchemy is the most powerful path and have most controversial effects, the last perk has 2 parts. This part contains everything controversial in alchemy.#!"
 conjuration_1_sorcery_perk_name: "一阶咒法"
 CONJURATION_1_SORCERY_PERK_EFFECT: "As a [character_interaction|E],t the user can mark an [artifact|E] giving it the ([GetModifier('sorcery_conveyance_mark_1_modifier').GetNameWithTooltip]) with a limit of 1\n#flavor Conjuration allows the user to move pre-prepared objects with the force of his magic.\nThe Conjurer can move one small object within the range of 10 feet for a few feet.#!"
 conjuration_2_sorcery_perk_name: "Conjuration 2"
 CONJURATION_2_SORCERY_PERK_EFFECT: "Improve mark [artifact|E] [character_interaction|E] ([GetModifier('sorcery_conveyance_mark_2_modifier').GetNameWithTooltip]) with a limit of 1\n#flavor The Conjurer can move simple items or conjure them from another location within the range of up to 15 feet.#!"
 conjuration_3_sorcery_perk_name: "Conjuration 3"
 CONJURATION_3_SORCERY_PERK_EFFECT: "Improve mark [artifact|E] [character_interaction|E] ([GetModifier('sorcery_conveyance_mark_3_modifier').GetNameWithTooltip]) with a limit of 1\n#flavor The Conjurer can move larger, more complex objects. In addition to conjuring it up, they may also levitate it within the air. The objects may not be heavier than 200 pounds and must be within 25 feet.#!"
 conjuration_4_sorcery_perk_name: "Conjuration 4"
 CONJURATION_4_SORCERY_PERK_EFFECT: "Improve mark [artifact|E] [character_interaction|E] ([GetModifier('sorcery_conveyance_mark_4_modifier').GetNameWithTooltip]) with a limit of 2\n#flavor The Conjurer can move large objects like a piano, even as complex life forms with at least half the mass of a human being. Maximum range is 50 feet.#!"
 conjuration_5_sorcery_perk_name: "Conjuration 5"
 CONJURATION_5_SORCERY_PERK_EFFECT: "Improve mark [artifact|E] [character_interaction|E] ([GetModifier('sorcery_conveyance_mark_5_modifier').GetNameWithTooltip]) with a limit of 3\nAs a [character_interaction|E], the user can steal [artifact|E]s\n#flavor The Conjurer can move or conjure a human, provided the subject is willing or unconscious. Objects can be summoned from 60 feet.#!"
 conjuration_6_sorcery_perk_name: "Conjuration 6"
 CONJURATION_6_SORCERY_PERK_EFFECT: "Improve mark [artifact|E] [character_interaction|E] ([GetModifier('sorcery_conveyance_mark_6_modifier').GetNameWithTooltip]) with a limit of 4\nImproves chances of success and distance.\n#flavor The Conjurer can conjure and move objects the size of a truck, as well as up to three human-sized lifeforms within the range of 100 miles.#!"
 conveyance_1_sorcery_perk_name: "一阶转移"
 CONVEYANCE_1_SORCERY_PERK_EFFECT: "#flavor Allows the user to travel with the help of a ritually prepared vehicle\n The user may transport themselves across roughly 10 feet.#!"
 conveyance_2_sorcery_perk_name: "二阶转移"
 CONVEYANCE_2_SORCERY_PERK_EFFECT: "#flavor The user may transport themselves, along with 20 pounds, across roughly 100 feet.#!"
 conveyance_3_sorcery_perk_name: "三阶转移"
 CONVEYANCE_3_SORCERY_PERK_EFFECT: "#flavor The user may transport themselves and one other person across roughly a mile.#!"
 conveyance_4_sorcery_perk_name: "四阶转移"
 CONVEYANCE_4_SORCERY_PERK_EFFECT: "Can teleport as a [character_interaction|E] across the distance of a small kingdom (Ireland).\n#flavor The user may transport themselves and two other passengers across roughly five miles.#!"
 conveyance_5_sorcery_perk_name: "五阶转移"
 CONVEYANCE_5_SORCERY_PERK_EFFECT: "Can teleport as a [character_interaction|E] across the distance of an Empire (Holy Roman Empire/Fiefs of the Black Cross).\n#flavor The user may transport themselves and three other passengers across roughly ten miles.#!"
 conveyance_6_sorcery_perk_name: "六阶转移"
 CONVEYANCE_6_SORCERY_PERK_EFFECT: "Can teleport as a [character_interaction|E] across the distance of a continent (Europe).\n#flavor The user many transport themselves and five other passengers across roughly 100 miles.#!"
 cursing_1_sorcery_perk_name: "Cursing 1"
 CURSING_1_SORCERY_PERK_EFFECT: "As a [character_interaction|E] can inflict small injuries, or give [GetModifier('sorcery_small_blesing_modifier').GetNameWithTooltip] to a target\n#flavor art of applying hexes, curses and blessings\n A brief inconvenience or minor blessing targets one person.#!"
 cursing_2_sorcery_perk_name: "Cursing 2"
 CURSING_2_SORCERY_PERK_EFFECT: "As a [character_interaction|E] can injure, or give [GetModifier('sorcery_blesing_modifier').GetNameWithTooltip] to a target\n#flavor A lasting injury, embarrassment, or blessing targets one person and a closely related person or friend.#!"
 cursing_3_sorcery_perk_name: "Cursing 3"
 CURSING_3_SORCERY_PERK_EFFECT: "As a [character_interaction|E] can massively injure, or give [GetModifier('sorcery_huge_blesing_modifier').GetNameWithTooltip] to a target\n#flavor A serious injury, illness, or blessing targets a person and two similar relations.#!"
 cursing_4_sorcery_perk_name: "Cursing 4"
 CURSING_4_SORCERY_PERK_EFFECT: "As a [character_interaction|E] can cast [GetModifier('sorcery_small_curse_modifier').GetNameWithTooltip] on a target or target's house, or give [GetModifier('sorcery_small_blesing_modifier').GetNameWithTooltip] to target's house.\n#flavor A lasting illness, injury, or blessing targets a person as well as of their relatives or friends.#!"
 cursing_5_sorcery_perk_name: "Cursing 5"
 CURSING_5_SORCERY_PERK_EFFECT: "As a [character_interaction|E] can cast [GetModifier('sorcery_curse_modifier').GetNameWithTooltip] on a target or target's house, or give [GetModifier('sorcery_blesing_modifier').GetNameWithTooltip] to target's house.\n#flavor Death befalls a person as well as all of their relatives and friends or a powerful blessing that can stop death or grant great fortune that can last for years.#!"
 cursing_6_sorcery_perk_name: "Cursing 6"
 CURSING_6_SORCERY_PERK_EFFECT: "As a [character_interaction|E] can cast [GetModifier('sorcery_serious_curse_modifier').GetNameWithTooltip] on a target or target's house, or give [GetModifier('sorcery_huge_blesing_modifier').GetNameWithTooltip] blessing to target's house.\n#flavor A curse or blessing so powerful it can last for generations. If there is a fate worse than death or a way to cheat death forever, it would be a curse or blessing of this magnitude.#!"
 divination_1_sorcery_perk_name: "Divination 1"
 DIVINATION_1_SORCERY_PERK_EFFECT: "#flavor By using a certain style of divination, the user can see events in the past or the future\nSee one week into the past or future with an overall sense of accuracy.#!"
 divination_2_sorcery_perk_name: "Divination 2"
 DIVINATION_2_SORCERY_PERK_EFFECT: "#flavor See one month into the past or future with notable accuracy.#!"
 divination_3_sorcery_perk_name: "Divination 3"
 DIVINATION_3_SORCERY_PERK_EFFECT: "You will receive notification if someone intent to murder your friend of family.\n#flavor See one year into the past or future with greater accuracy.#!"
 divination_4_sorcery_perk_name: "Divination 4"
 DIVINATION_4_SORCERY_PERK_EFFECT: "#flavor See ten years into the past or future with remarkable accuracy.#!"
 divination_5_sorcery_perk_name: "Divination 5"
 DIVINATION_5_SORCERY_PERK_EFFECT: "#flavor See the span of a lifetime into the past or future with enormous accuracy.#!"
 divination_6_sorcery_perk_name: "Divination 6"
 DIVINATION_6_SORCERY_PERK_EFFECT: "#flavor See as far into the past or future as possible. Even when the divination is wrong, it contains elements of truth.#!"
 dowsing_1_sorcery_perk_name: "Dowsing 1"
 DOWSING_1_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain a tiny amount of gold.\n#flavor Dowsing is the practice of locating lost items with magical means\nThe Dowser can find a small item of them within a radius of fifty feet. The Dowser also gets a general sense for yes-no-question pertaining themselves.#!"
 dowsing_2_sorcery_perk_name: "Dowsing 2"
 DOWSING_2_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain a minor amount of gold.\n#flavor The Dowser can find any personal item within the radius of a mile. The Dowser also gets a general sense for yes-no-question pertaining others.#!"
 dowsing_3_sorcery_perk_name: "Dowsing 3"
 DOWSING_3_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain a medium amount of gold.\n#flavor The Dowser can find any personal item anywhere, while being able to locate other items and accumulations of elements (like air behind a false wall) within a mile. The Dowser also gets definite sense for simple yes-no questions pertaining themselves.#!"
 dowsing_4_sorcery_perk_name: "Dowsing 4"
 DOWSING_4_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain a major amount of gold.\n#flavor The Dowser can instantly locate personal items, as well as items belonging to someone else. The Dowser also can sense magic, hidden emotions and illnesses.#!"
 dowsing_5_sorcery_perk_name: "Dowsing 5"
 DOWSING_5_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain a massive amount of gold.\n#flavor The Dowser can instantly locate any item, as well as locate specific substances like gold.#!"
 enchantment_1_sorcery_perk_name: "Enchantment 1"
 ENCHANTMENT_1_SORCERY_PERK_EFFECT: "Can Enhance [artifact|E] increasing one attribute by 1.\n#flavor Enchantment, also called Fetishism, allows for the creation of minor magical talismans\n#flavor allows for the creation of minor magical talismans\nThe Enchanter creates a minor item with limited use only and a tight area of influence.#!"
 enchantment_2_sorcery_perk_name: "Enchantment 2"
 ENCHANTMENT_2_SORCERY_PERK_EFFECT: "Can Enhance [artifact|E] increasing one attribute by 2.\n#flavor The Enchanter creates a more powerful talisman that is noticeable as magic.#!"
 enchantment_3_sorcery_perk_name: "Enchantment 3"
 ENCHANTMENT_3_SORCERY_PERK_EFFECT: "Can Enhance [artifact|E] increasing one attribute by 3.\n#flavor The Enchanter creates a talisman whose function is obviously magical.#!"
 enchantment_4_sorcery_perk_name: "Enchantment 4"
 ENCHANTMENT_4_SORCERY_PERK_EFFECT: "Can Enhance [artifact|E] increasing one attribute by 4.\n#flavor The Enchanter creates a talisman that is able to defy several of the limitations of the Consensus.#!"
 enchantment_5_sorcery_perk_name: "Enchantment 5"
 ENCHANTMENT_5_SORCERY_PERK_EFFECT: "Can Enhance [artifact|E] increasing one attribute by 5.\n#flavor The Enchanter creates talisman with almost miraculous powers.#!"
 enchantment_6_sorcery_perk_name: "Enchantment 6"
 ENCHANTMENT_6_SORCERY_PERK_EFFECT: "Can Enhance [artifact|E] increasing one attribute by 6.\n#flavor The Enchanter creates a legendary ariefact.#!"
 ephemera_1_sorcery_perk_name: "Ephemera 1"
 EPHEMERA_1_SORCERY_PERK_EFFECT: "Unlock $seek_aid_of_the_spirits_decision$ [decision|E].\nThe Path of Ephemera allows the user to interact with the [spirit_wilds|E].\n#flavor Feel the activity of spirits behind their Gauntlets.#!"
 ephemera_2_sorcery_perk_name: "Ephemera 2"
 EPHEMERA_2_SORCERY_PERK_EFFECT: "Unlock $POD_summon_spirit_on_death_interaction$.\n#flavor Learn to distinguish between the different kinds of spirit behind the Gauntlet and try to bring them into the material world.#!"
 ephemera_3_sorcery_perk_name: "Ephemera 3"
 EPHEMERA_3_SORCERY_PERK_EFFECT: "You can imprison, torture, execute or physically hurt a spirit.\n#flavor Learn to contact a specific spirit to address it.#!"
 ephemera_4_sorcery_perk_name: "Ephemera 4"
 EPHEMERA_4_SORCERY_PERK_EFFECT: "You can usurp the local (Umbra) Spirit wilds.\n#flavor Learn to perceive ephemera around you and see the spirits beyond the Gauntlet.#!"
 ephemera_5_sorcery_perk_name: "Ephemera 5"
 EPHEMERA_5_SORCERY_PERK_EFFECT: "#flavor Learn to command the spirits to do your biding.#!"
 rf_gaia_opinion: "Opinion of Gaia Faiths"
 ephemera_6_sorcery_perk_name: "Ephemera 6"
 EPHEMERA_6_SORCERY_PERK_EFFECT: "Gain access to the [spirit_wilds|E].\n#flavor Walk beyond the Gauntlet in astral form.#!"
 fascination_1_sorcery_perk_name: "Fascination 1"
 FASCINATION_1_SORCERY_PERK_EFFECT: "#flavor Fascination allows to user make a target fall in love with another person\nAppears favorable to a target.#!"
 fascination_2_sorcery_perk_name: "Fascination 2"
 FASCINATION_2_SORCERY_PERK_EFFECT: "#flavor Appears generally likable.#!"
 fascination_3_sorcery_perk_name: "Fascination 3"
 FASCINATION_3_SORCERY_PERK_EFFECT: "#flavor Make people go out of their way for you.#!"
 fascination_4_sorcery_perk_name: "Fascination 4"
 FASCINATION_4_SORCERY_PERK_EFFECT: "#flavor Make people actively seek your approval.#!"
 fascination_5_sorcery_perk_name: "Fascination 5"
 FASCINATION_5_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain weak hook on a target if winning a duel using learning.\n#flavor Make people highly devoted to you.#!"
 fascination_6_sorcery_perk_name: "Fascination 6"
 FASCINATION_6_SORCERY_PERK_EFFECT: "As a [character_interaction|E] gain strong hook on a target if winning a duel using learning.\n#flavor Cause people to become your literal servants.#!"
 healing_1_sorcery_perk_name: "Healing 1"
 HEALING_1_SORCERY_PERK_EFFECT: "As a [character_interaction|E] you can heal minor wounds.\n#flavor The user can heal wounds, illnesses and similar ailments\n#flavor Soothe minor injuries and debilitations for a limited period of time.#!"
 healing_2_sorcery_perk_name: "Healing 2"
 HEALING_2_SORCERY_PERK_EFFECT: "As a [character_interaction|E] you can heal simple illness.\n#flavor Heal wounds and illnesses like the flu.#!"
 healing_3_sorcery_perk_name: "Healing 3"
 HEALING_3_SORCERY_PERK_EFFECT: "As a [character_interaction|E] you can heal wounds.\n#flavor Mend broken bones and get an incapacitated person going again.#!"
 healing_4_sorcery_perk_name: "Healing 4"
 HEALING_4_SORCERY_PERK_EFFECT: "As a [character_interaction|E] you can cure illness.\n#flavor Manage to fix compound fractures and severe trauma, speeding up the healing process and preventing infection, as well as healing chronic illnesses like asthma.#!"
 healing_5_sorcery_perk_name: "Healing 5"
 HEALING_5_SORCERY_PERK_EFFECT: "As a [character_interaction|E] you can heal major wounds and cure major illness.\n#flavor Cure near deadly wounds and heal maladies like AIDS or cancer permanently.#!"
 healing_6_sorcery_perk_name: "Healing 6"
 HEALING_6_SORCERY_PERK_EFFECT: "As a [character_interaction|E], allows to prevent a friend, lover, consort, family, councillor or knight from dying from an accidental death.\n#flavor Bring a person back that has recently died. However, if the person does not receive immediate medical attention, they will likely just die again.#!"
 hellfire_1_sorcery_perk_name: "Hellfire 1"
 HELLFIRE_1_SORCERY_PERK_EFFECT: "#flavor Hellfire grants its caster massive destructive powers.\nThe sorcerer must make a successful hand-to-hand combat attack in order to deliver damage.#!"
 hellfire_2_sorcery_perk_name: "Hellfire 2"
 HELLFIRE_2_SORCERY_PERK_EFFECT: "#flavor Hellfire can be used in a small area; 3 square feet or so, or at less than 10 feet distance.#!"
 hellfire_3_sorcery_perk_name: "Hellfire 3"
 HELLFIRE_3_SORCERY_PERK_EFFECT: "#flavor Hellfire can be used in no more than a couple of square yards or so, or at a distance of less than 25 feet.#!"
 hellfire_4_sorcery_perk_name: "Hellfire 4"
 HELLFIRE_4_SORCERY_PERK_EFFECT: "#flavor Hellfire can be used in 10 square feet (which can be arranged as a wall, circle or whatever), or at a distance of about 50 feet.#!"
 hellfire_5_sorcery_perk_name: "Hellfire 5"
 HELLFIRE_5_SORCERY_PERK_EFFECT: "#flavor Hellfire can be used in 20 square feet, or at any target within 150 feet.#!"
 hellfire_6_sorcery_perk_name: "Hellfire 6"
 HELLFIRE_6_SORCERY_PERK_EFFECT: "#flavor Hellfire can be used in 40 square feet, or at any target within 300 feet.#!"
 herbalism_1_sorcery_perk_name: "Herbalism 1"
 HERBALISM_1_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('potion_of_health_modifier').GetNameWithTooltip]\n#flavor Similar to Enchantment and Alchemy, herbalism deals with the assembly of powerful brews from natural elements.\nCure minor aches and similar effects that would not be considered magic.#!"
 herbalism_2_sorcery_perk_name: "Herbalism 2"
 HERBALISM_2_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('potent_potion_of_health_modifier').GetNameWithTooltip]\n#flavor Create potions whose effects are seen as miraculous, but not outright magical in and of themselves.#!"
 herbalism_3_sorcery_perk_name: "Herbalism 3"
 HERBALISM_3_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('elixir_of_health_modifier').GetNameWithTooltip]\n#flavor Create concoctions whose effect are obviously unusual.#!"
 herbalism_4_sorcery_perk_name: "Herbalism 4"
 HERBALISM_4_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('potent_elixir_of_health_modifier').GetNameWithTooltip]\n#flavor Create brews that manage to be miraculous while still working under the Consensus.#!"
 herbalism_5_sorcery_perk_name: "Herbalism 5"
 HERBALISM_5_SORCERY_PERK_EFFECT: "Discovers recipes for: [GetModifier('elixir_of_life_modifier').GetNameWithTooltip]\n#flavor Create obviously magical potions, whose effect might not be instantaneous, but works slowly and subtly.#!"
 mana_manipulation_1_sorcery_perk_name: "Mana Manipulation 1"
 MANA_MANIPULATION_1_SORCERY_PERK_EFFECT: "Lowers cost of Sorcery powers.\n#flavor Mana Manipulation deals with what the user perceives as the raw stuff of magic\nLearn to sense energy around you.#!"
 mana_manipulation_2_sorcery_perk_name: "Mana Manipulation 2"
 MANA_MANIPULATION_2_SORCERY_PERK_EFFECT: "Lowers cost of Sorcery powers.\n#flavor Learn to sense energies in objects and creatures.#!"
 mana_manipulation_3_sorcery_perk_name: "Mana Manipulation 3"
 MANA_MANIPULATION_3_SORCERY_PERK_EFFECT: "Lowers cost of Sorcery powers.\n#flavor Learn to alter or displace the flow of energy around you.#!"
 mana_manipulation_4_sorcery_perk_name: "Mana Manipulation 4"
 MANA_MANIPULATION_4_SORCERY_PERK_EFFECT: "Lowers cost of Sorcery powers.\n#flavor Learn to manipulate your personal energy reservoirs and replenish them with energy from the outside.#!"
 mana_manipulation_5_sorcery_perk_name: "Mana Manipulation 5"
 MANA_MANIPULATION_5_SORCERY_PERK_EFFECT: "Lowers cost of Sorcery powers.\n#flavor Learn to use mana directly for your spells or manipulate its Resonance.#!"
 mana_manipulation_6_sorcery_perk_name: "Mana Manipulation 6"
 MANA_MANIPULATION_6_SORCERY_PERK_EFFECT: "Lowers cost of Sorcery powers.\nEnable casting level 6 for paths that require it.\n#flavor Create a temporary nexus.#!"
 oneiromancy_1_sorcery_perk_name: "Oneiromancy 1"
 ONEIROMANCY_1_SORCERY_PERK_EFFECT: "As [character_interaction|E] give target [GetModifier('sorcery_dreamless_modifier').GetNameWithTooltip]\n#flavor With the use of Oneiromancy, the user can visit other people’s dreams and [dreaming|E]\nTouch the dream of another.#!"
 oneiromancy_2_sorcery_perk_name: "Oneiromancy 2"
 ONEIROMANCY_2_SORCERY_PERK_EFFECT: "As [character_interaction|E] increase target's opinion of you\n#flavor Learn to temporarily become a part of another’s dream.#!"
 oneiromancy_3_sorcery_perk_name: "Oneiromancy 3"
 ONEIROMANCY_3_SORCERY_PERK_EFFECT: "As [character_interaction|E] give target [GetModifier('sorcery_bad_dreams_modifier').GetNameWithTooltip] or [GetModifier('sorcery_good_dreams_modifier').GetNameWithTooltip]\n#flavor Learn to observe another’s dream without becoming a part of it, while still being able to manipulate it.#!"
 oneiromancy_4_sorcery_perk_name: "Oneiromancy 4"
 ONEIROMANCY_4_SORCERY_PERK_EFFECT: "Enhance [GetModifier('sorcery_bad_dreams_modifier').GetNameWithTooltip], [GetModifier('sorcery_good_dreams_modifier').GetNameWithTooltip] interaction to [GetModifier('sorcery_bad_dreams_enchanced_modifier').GetNameWithTooltip], [GetModifier('sorcery_good_dreams_enchanced_modifier').GetNameWithTooltip]\n#flavor Learn to take control of another’s dream.#!"
 oneiromancy_5_sorcery_perk_name: "Oneiromancy 5"
 ONEIROMANCY_5_SORCERY_PERK_EFFECT: "Removes coldown for [GetModifier('sorcery_bad_dreams_modifier').GetNameWithTooltip], [GetModifier('sorcery_good_dreams_modifier').GetNameWithTooltip] interaction\nGain acces to [dreaming|E]\n#flavor Learn to merge several dreams into one.#!"
 oneiromancy_6_sorcery_perk_name: "Oneiromancy 6"
 ONEIROMANCY_6_SORCERY_PERK_EFFECT: "As [character_interaction|E] spawn 2000 [GetMaA('monsters').GetName]\n#flavor Make a creature from a dream real for a limited period of time.#!"
 saturnal_manes_1_sorcery_perk_name: "Saturnal - Manes 1"
 SATURNAL_MANES_1_SORCERY_PERK_EFFECT: "Unlock [bind_wraith_interaction|E].\n#flavor By using orgiastic rites under the moon, the practitioner calls forth spirits to tend their needs.\nSummon a spirit.#!"
 saturnal_manes_2_sorcery_perk_name: "Saturnal - Manes 2"
 SATURNAL_MANES_2_SORCERY_PERK_EFFECT: "Unlock [command_wraith_interaction|E].\n#flavor Command a spirit.#!"
 saturnal_manes_3_sorcery_perk_name: "Saturnal - Manes 3"
 SATURNAL_MANES_3_SORCERY_PERK_EFFECT: "As a [character_interaction|E], you can mark a character's soul so they return as a [GetTrait('wraith').GetName( GetNullCharacter )] when they die.\nMax number of bound wraiths: #P +2#!\n#flavor Summon or command a ghost instead of a spirit.#!"
 saturnal_manes_4_sorcery_perk_name: "Saturnal - Manes 4"
 SATURNAL_MANES_4_SORCERY_PERK_EFFECT: "Max number of bound wraiths: #P +2#!\nAs a [character_interaction|E] allows you to use bound wraith to Enhance one attribute.\n#flavor Use the influence of spirits to enhance your natural talents.#!"
 saturnal_manes_5_sorcery_perk_name: "Saturnal - Manes 5"
 SATURNAL_MANES_5_SORCERY_PERK_EFFECT: "As a [character_interaction|E] worsen opinion of local wraiths of the target's domain and injure them.\n#flavor Cause angry spirits to attack a target.#!"
 shadowcasting_1_sorcery_perk_name: "Shadow Casting 1"
 SHADOWCASTING_1_SORCERY_PERK_EFFECT: "#flavor Shadowcasting, also called the Path of Shadows, concerns itself with the control over darkness.\nManipulate light to darken and deepen shadows.#!"
 shadowcasting_2_sorcery_perk_name: "Shadow Casting 2"
 SHADOWCASTING_2_SORCERY_PERK_EFFECT: "#flavor Manipulate shadows to bend soundwaves, making yourself more easily hidden. When cast on another, that persons’ mind begins to play tricks on them.#!"
 shadowcasting_3_sorcery_perk_name: "Shadow Casting 3"
 SHADOWCASTING_3_SORCERY_PERK_EFFECT: "#flavor Manipulate shadows to drown out colors. When cast on another, that person’s mind falls into panic.#!"
 shadowcasting_4_sorcery_perk_name: "Shadow Casting 4"
 SHADOWCASTING_4_SORCERY_PERK_EFFECT: "#flavor Manipulate shadows to cause electronical devices to fail. Others that see the shadows fall into terror.#!"
 shadowcasting_5_sorcery_perk_name: "Shadow Casting 5"
 SHADOWCASTING_5_SORCERY_PERK_EFFECT: "Unlock shadow form shapeshift option.\n#flavor Manipulate shadows to hide yourself completely from mortal sight. Others that see the shadows can become insane by the experience.#!"
 shadowcasting_6_sorcery_perk_name: "Shadow Casting 6"
 SHADOWCASTING_6_SORCERY_PERK_EFFECT: "#flavor Manipulate shadows into a physical form or snuff out any lights within a radius of 50 feet.#!"
 shapeshifting_1_sorcery_perk_name: "Shapeshifting 1"
 SHAPESHIFTING_1_SORCERY_PERK_EFFECT: "Unlock Shapeshift [character_interaction|E].\n#flavor The user can manipulate their own physical form.\nA minor cosmetic change, like hair color.#!"
 shapeshifting_2_sorcery_perk_name: "Shapeshifting 2"
 SHAPESHIFTING_2_SORCERY_PERK_EFFECT: "Unlock height related shapeshift forms.\n#flavor A major cosmetic change, like height.#!"
 shapeshifting_3_sorcery_perk_name: "Shapeshifting 3"
 SHAPESHIFTING_3_SORCERY_PERK_EFFECT: "Unlock animal parts as shapeshift forms.\n#flavor A replacement of a body part with that of an animal.#!"
 shapeshifting_4_sorcery_perk_name: "Shapeshifting 4"
 SHAPESHIFTING_4_SORCERY_PERK_EFFECT: "Can now have up to 4 different animal part forms.\n#flavor A replacement of several body parts with that of an animal.#!"
 shapeshifting_5_sorcery_perk_name: "Shapeshifting 5"
 SHAPESHIFTING_5_SORCERY_PERK_EFFECT: "Unlock animal form as shapeshift option.\n#flavor A full transformation into an animal.#!"
 shapeshifting_6_sorcery_perk_name: "Shapeshifting 6"
 SHAPESHIFTING_6_SORCERY_PERK_EFFECT: "Unlock mythical form as shapeshift option.\n#flavor A full transformation into a mythical animal.#!"
 spirit_chasing_1_sorcery_perk_name: "Spirit Chasing 1"
 SPIRIT_CHASING_1_SORCERY_PERK_EFFECT: "#flavor The user creates a bond between themselves and the spirit of a type of plant or animal.\nGain full nutrition from the type’s chosen food.#!"
 spirit_chasing_2_sorcery_perk_name: "Spirit Chasing 2"
 SPIRIT_CHASING_2_SORCERY_PERK_EFFECT: "As a [character_interaction|E] choose which attribute to boost by 2.\n#flavor Match your sensory levels to that of your type.#!"
 spirit_chasing_3_sorcery_perk_name: "Spirit Chasing 3"
 SPIRIT_CHASING_3_SORCERY_PERK_EFFECT: "#flavor Manage to fall into a regenerative sleep to cure your wounds.#!"
 spirit_chasing_4_sorcery_perk_name: "Spirit Chasing 4"
 SPIRIT_CHASING_4_SORCERY_PERK_EFFECT: "#flavor Gain insights from other exemplars of your type (i.e learn from a tree what happened in its surroundings).#!"
 spirit_chasing_5_sorcery_perk_name: "Spirit Chasing 5"
 SPIRIT_CHASING_5_SORCERY_PERK_EFFECT: "As a [character_interaction|E] choose several animal abilities to enhance yourself.\n#flavor Gain some of the abilities of your chosen type.#!"
 summoning_warding_and_binding_1_sorcery_perk_name: "Summoning Warding and Binding 1"
 SUMMONING_WARDING_AND_BINDING_1_SORCERY_PERK_EFFECT: "As a [character_interaction|E] summon an animal of your choosing.\n#flavor The complex path that consists of both summoning, warding against as well as the binding of creatures is among the most dangerous to practice.\nSimple creatures, like birds can be summoned and commanded.#!"
 summoning_warding_and_binding_2_sorcery_perk_name: "Summoning Warding and Binding 2"
 SUMMONING_WARDING_AND_BINDING_2_SORCERY_PERK_EFFECT: "As a [character_interaction|E] summon a mount of your choosing.\n#flavor Larger creatures, like wolves can be summoned and commanded.#!"
 summoning_warding_and_binding_3_sorcery_perk_name: "Summoning Warding and Binding 3"
 SUMMONING_WARDING_AND_BINDING_3_SORCERY_PERK_EFFECT: "Unlock summon [character_interaction|E] to make an unlanded mortal comes to you court.\n#flavor Humans can be summoned and commanded.#!"
 summoning_warding_and_binding_4_sorcery_perk_name: "Summoning Warding and Binding 4"
 SUMMONING_WARDING_AND_BINDING_4_SORCERY_PERK_EFFECT: "Unlock summon [character_interaction|E] to make an unlanded minor supernatural comes to you court.\n#flavor Minor supernaturals, like ghouls and kinain can be summoned and commanded.#!"
 summoning_warding_and_binding_5_sorcery_perk_name: "Summoning Warding and Binding 5"
 SUMMONING_WARDING_AND_BINDING_5_SORCERY_PERK_EFFECT: "Unlock summon [character_interaction|E] to make an unlanded character comes to you court (except Demons).\n#flavor Major supernaturals, like mages or werewolves can be summoned and commanded.#!"
 summoning_warding_and_binding_6_sorcery_perk_name: "Summoning Warding and Binding 6"
 SUMMONING_WARDING_AND_BINDING_6_SORCERY_PERK_EFFECT: "Unlock summon [character_interaction|E] to make an unlanded character comes to you court.\n#flavor Celestial entities, like angels, gods or demons can be summoned and commanded.#!"
 weather_control_1_sorcery_perk_name: "Weather Control 1"
 WEATHER_CONTROL_1_SORCERY_PERK_EFFECT: "#flavor Also known as Weathercraft, with this Path, the user manipulates weather patterns for their own benefit. \nCreate a small sudden disturbance in the weather patterns in a limited area.#!"
 weather_control_2_sorcery_perk_name: "Weather Control 2"
 WEATHER_CONTROL_2_SORCERY_PERK_EFFECT: "#flavor Create a small sudden disturbance in the weather patterns in a larger area.#!"
 weather_control_3_sorcery_perk_name: "Weather Control 3"
 WEATHER_CONTROL_3_SORCERY_PERK_EFFECT: "#flavor Cause drastic changes in the climate of an area.#!"
 weather_control_4_sorcery_perk_name: "Weather Control 4"
 WEATHER_CONTROL_4_SORCERY_PERK_EFFECT: "#flavor Alter the climate on a limited area.#!"
 weather_control_5_sorcery_perk_name: "Weather Control 5"
 WEATHER_CONTROL_5_SORCERY_PERK_EFFECT: "#flavor Alter the climate on a larger area.#!"
 weather_control_6_sorcery_perk_name: "Weather Control 6"
 WEATHER_CONTROL_6_SORCERY_PERK_EFFECT: "Unlock Weathercraft [character_interaction|E]\n#flavor Call on destructive forces of nature like hurricanes.#!"
