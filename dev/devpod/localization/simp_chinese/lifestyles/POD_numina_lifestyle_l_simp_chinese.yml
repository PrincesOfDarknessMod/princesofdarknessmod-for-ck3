 spirit_chasing_perk_name: "追灵"
 summoning_warding_binding_perk_name: "召唤、封印、约束"
 weather_control_perk_name: "天气操控"
 ALCHEMY_PERK_EFFECT: "解锁[GetModifier('philosophers_stone_modifier').GetNameWithTooltip]、[GetModifier('elixir_immortality_modifier').GetNameWithTooltip]、和[GetModifier('vampire_concoction_modifier').GetNameWithTooltip]配方。\n#F 施法者使用炼金术仪式来完善和组合物质对象，最终净化自己的灵魂。人们把它作为一种高级化学、传统草药学或神秘科学来修习。#!"
 CONJURATION_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 也被称为念动力或意念之手，允许使用者用他的魔法力量移动预备好的物体。#!"
 CONVEYANCE_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 转移，也被称为隐蔽运移之道，允许施法者在用仪式变出的载具的帮助下移动。在更高的等级，施法者可以舍弃载具，转而传送自己。#!"
 CURSING_PERK_EFFECT: "作为[character_interaction|E]，允许你祝福或诅咒目标家族。\n#F 诅咒，也被称为命运之道，是对一个人施展妖法和诅咒的技艺。这条道途也能允许祝福。#!"
 DIVINATION_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 通过使用任一流派的占卜，施法者可以看到过去或未来的事件。#!"
 DOWSING_PERK_EFFECT: "#F 探测术是用魔法手段找到丢失的物品的修习。为此，施法者需要使用一个与魔法相适应的工具。此外，探测术师会变得更热衷于调查和更有推理意识。#!"
 ENCHANTMENT_PERK_EFFECT: "作为[character_interaction|E]，允许你制作护身符。\n#F 附魔，也被称作拜物，允许制作小型魔法护身符。#!"
 EPHEMERA_PERK_EFFECT: "允许在灵游时进入[spirit_wilds|E]。\n#F 游灵之道允许使用者与灵界互动。有效地成为异界实体的通道，那些修炼此道的人经常发现自己被生活在那里的生物所夺舍。#!"
 FASCINATION_PERK_EFFECT: "#F 施法者可以让目标爱上另一个人。这个魔法既可以施在使用者自己身上，也可以施在护身符或类似的东西上，让它的效果发生在其他人身上。#!"
 HEALING_PERK_EFFECT: "解锁治疗[character_interaction|E]\n作为[character_interaction|E]，允许防止朋友、爱人、侧室、家人、内阁或骑士的意外死亡。\n#F 施法者可以治愈伤口、疾病和类似的病恙。虽然很少有永久性治疗，但治疗往往至少能缓解疼痛。使用者至少需要有最低限度的医学知识，才能正确运用他们的治疗。#!"
 HELLFIRE_PERK_EFFECT: "#F 据传是做出魔邪交易的结果，地狱火赋予施法者巨大的破坏力。虽然通常会召唤出火，但也有一些变种会召唤出闪电、雨雪、沙暴、地震或烟雾。在西方社会，地狱火通常被视为黑魔法。#!"
 HERBALISM_PERK_EFFECT: "解锁[GetModifier('social_potion_modifier').GetNameWithTooltip]、[GetModifier('mental_potion_modifier').GetNameWithTooltip]、和[GetModifier('physical_potion_modifier').GetNameWithTooltip]配方。\n药草素材价格：-25%\n#F 与附魔和炼金术类似，草药术处理的是用自然物事合成出强大的药剂。虽然没有治疗术那么强大，但草药术的优点是一旦创造出来就可以随时使用。它的效果较慢，但被认为是更自然的，而且一旦酿成就不太可能失败。#!"
 MANA_MANIPULATION_PERK_EFFECT: "#F 法力操控涉及施法者所认为的魔法原料——气、玛那、灵脉能量和类似的东西。通过风水和探地术等修习，施法者学会了为自己的目的利用这些能量。#!"
 ONEIROMANCY_PERK_EFFECT: "允许进入[dreaming|E]。\n#F 通过使用梦占，施法者可以进入其他人的梦。凭借他们的力量，他们可以重塑梦境，驱逐噩梦或解决潜意识中的骚动。#!"
 SATURNAL_MANES_PERK_EFFECT: "解锁[bind_wraith_interaction|E]。\n解锁[command_wraith_interaction|E]。\n最大约束死灵数量：#P +1#!\n#F 祖灵祭是泣月启蒙社的有角之月的一种修习。通过在月下举行狂欢仪式，施法者召唤出灵类来照顾他们的需求。#!"
 SHADOWCASTING_PERK_EFFECT: "#F 影术，也被称为影之道，涉及到对黑暗的控制。在西方世界，它被认为与崇魔者有某种关系，但没有提供确切的证据。#!"
 SHAPESHIFTING_PERK_EFFECT: "解锁变形[character_interaction|E]。\n#F 施法者可以操纵自己的身体形态。变形术需要对动物的身体和自己的身体进行深入研究。#!"
 SPIRIT_CHASING_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 施法者与某种类型的植物之灵或动物之灵建立联系。通过加强他们与该灵的联系，追灵者会获得相对于所选类型的能力。#!"
 SUMMONING_WARDING_BINDING_PERK_EFFECT: "解锁召唤[character_interaction|E]，允许强行让无地角色来到你的宫廷。\n#F 这条复杂的道途包括召唤、封印以及约束生物，是最危险的术法之一。通过召唤，使用者将生物召唤出来。通过封印，他们保护自己免受其害。通过约束，他们以代价劝说它服从，在更高等级甚至可以无代价命令它。通过放逐，他们使该生物离去。#!"
 WEATHER_CONTROL_PERK_EFFECT: "解锁天气术[character_interaction|E]。\n#F 也被称为天气术，通过这个道途，施法者可以为自己的利益操纵天气。#!"
 theurgy_visible: "神通术"
 via_geniorum_perk_name: "神怪之道"
 via_ignis_perk_name: "狱火之道"
 via_medicamenti_perk_name: "药医之道"
 via_necromantiae_perk_name: "亡灵之道"
 via_oraculi_perk_name: "神谕之道"
 VIA_GENIORUM_PERK_EFFECT: "解锁[bind_wraith_interaction|E]。\n解锁[command_wraith_interaction|E]。\n最大约束死灵数量：#P +1#!\n#F 此道途涉及灵与魔的国度。了解灵的真名，就能获得战胜它的力量。#!"
 VIA_IGNIS_PERK_EFFECT: "#F 此道途让受诅者在终焉之死前体验地狱的火焰。这条路召唤的是看似普通的火，但它甚至会烧死那些免疫普通火焰的存在。#!"
 VIA_MEDICAMENTI_PERK_EFFECT: "解锁治疗[character_interaction|E]。\n#F 修炼此道途——也被称为补救之道——的是治疗者。药医之道能使人骨愈合、止血，并能实际逆转所受到的伤害。#!"
 VIA_NECROMANTIAE_PERK_EFFECT: "解锁[summon_wraith_on_death_interaction|E]\n作为[character_interaction|E]，允许你放逐目标死灵角色到[dark_kingdom|E]。\n最大约束死灵数量：#P +1#!\n#F 亡灵之道是旨在接触或放逐死者的神通术。#!"
 VIA_ORACULI_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 通过神谕之道，神通术师可能会瞥见未知的未来或看到不可见的过去。#!"
 astral_projection_perk_name: "星光投射"
 mind_shield_perk_name: "心智护盾"
 ASTRAL_PROJECTION_PERK_EFFECT: "允许进入[astral_reaches|E]和[deep_umbra|E]。\n#F 可以将他们的灵体从身体中分离出来，在星界漫游。虽然在这种状态下无法影响现实世界，但他们仍然可以使用灵能能力。有报告说能听到其他实体的声音，且有数个使用这种能力的灵能者已经迷失了，他们的灵魂在远离盖亚的陌生空间游荡。#!"
 MIND_SHIELD_PERK_EFFECT: "免疫敌对心灵[character_interaction|E]。\n#F 灵能者可以建立精神防护，防止超自然的入侵。这包括法师的法术、吸血鬼的血律、换生灵的魔咒和其他基于心灵的能力。这种能力没有主动能力。相反，它只是提高了入侵者穿透灵能者头脑的难度。#!"