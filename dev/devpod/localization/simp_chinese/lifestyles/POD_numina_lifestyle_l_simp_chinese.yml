 PSYCHIC_HYPNOSIS_1_PERK_EFFECT: "作为一个[character_interaction|E]，可以给予[GetModifier('psi_hypnosis_stress_buff').GetNameWithTooltip]5年。仅当目标对灵能者有0+以上好感，并且处于同一位置时才可用。\n#weak 灵能者可以通过让他们的目标进入恍惚状态，然后对他们进行催眠，将命令和建议植入他们的目标。\n灵能者可以让目标进入催眠状态。#!"
 PSYCHIC_HYPNOSIS_2_PERK_EFFECT: "在[GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )][character_interaction|E]中，可以通过外交能力对抗检定增加目标对你的好感。\n#weak 灵能者可以对处于恍惚状态下的目标提出一些小建议。#!"
 PSYCHIC_HYPNOSIS_3_PERK_EFFECT: "在[GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )]的[character_interaction|E]中，可以治疗负面压力特质或在赢得外交能力对抗后获得一个弱牵制。\n#weak 灵能者可以提供建议，即使在催眠结束后也会保留。#!"
 PSYCHIC_HYPNOSIS_4_PERK_EFFECT: "在[GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )]的[character_interaction|E]中，可以治疗大多数心理问题。\n增加赢得[GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )]的[character_interaction|E]的机会。\n#weak 灵能者可以只通过一个眼神将目标送入催眠状态。#!"
 PSYCHIC_HYPNOSIS_5_PERK_EFFECT: "可以在目标对你有0以上的好感时使用[GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )][character_interaction|E]，增加赢得外交能力对抗的机会，并且可以将催眠获得的牵制升级为强牵制。\n#weak 灵能者可以在目标处于催眠状态时进行深度植入，甚至能影响他们的记忆。#!"
