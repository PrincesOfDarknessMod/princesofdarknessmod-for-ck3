 PSYCHOPORTATION_2_PERK_EFFECT: "作为[character_interaction|E]，允许将你的军队传送到目标位置，或者在旅行时传送到下一个目的地。距离限制为小范围（例如：从威尔士的顶端到底端）。  \n#weak 灵能者可以进行更远距离的传送。#!"
 PSYCHOPORTATION_3_PERK_EFFECT: "将心灵传送[character_interaction|E]的距离限制增加到大范围（例如：从法兰西的顶端到底端）。  \n#weak 灵能者可以进行大范围的远距离传送。#!"
 PSYCHOPORTATION_4_PERK_EFFECT: "将心灵传送[character_interaction|E]的距离限制增加到极远的范围（例如：从神圣罗马帝国的左端到右端）。  \n#weak 灵能者可以进行更大范围的远距离传送。#!"
 PSYCHOPORTATION_5_PERK_EFFECT: "移除心灵传送[character_interaction|E]的距离限制。  \n#weak 灵能者不再需要看到传送的目的地即可进行传送。#!"
