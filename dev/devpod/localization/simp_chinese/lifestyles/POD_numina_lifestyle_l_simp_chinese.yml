 animal_psi_1_perk_name: "沟通"
 animal_psi_2_perk_name: "命令"
 animal_psi_3_perk_name: "集体沟通"
 animal_psi_4_perk_name: "心灵链接"
 animal_psi_5_perk_name: "统御"
 ANIMAL_PSI_1_PERK_EFFECT: "通过[character_interaction|E]可以加速计谋(25%几率)。\n#weak 灵能者能够读取他们面前动物的基本意图和愿望。这种能力影响高等哺乳动物。\n动物感应是一种与动物沟通的灵能能力。动物越聪明或训练有素，下达命令就越容易。#!"
 ANIMAL_PSI_2_PERK_EFFECT: "增强了25%到50%[GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )]。\n#weak 灵能者可以给动物下达一个简单的命令让它去完成。动物没有责任必须这样做。#!"
 ANIMAL_PSI_3_PERK_EFFECT: "As a [character_interaction|E], allows you to gain a pet.\nAs a [character_interaction|E], allows you to call your pet to war.\nBoosts the success chance of [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] from 50% to 75%\nUnlock many [POD_animals_maa|E] [men_at_arms|E]\n#weak The psychic gains an instinctive understanding of what the animal wants. They can communicate with several animals at once and or give a single animal a more complex command.#!"
 ANIMAL_PSI_4_PERK_EFFECT: "解锁变形[character_interaction|E]。\n解锁动物变形选项\n提高[GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )]增强75%到100%。\n#weak 灵能者能够将自己的心灵与动物相连，通过它们的眼睛看世界，像是用自己的感官一样使用动物的。#!"
 ANIMAL_PSI_5_PERK_EFFECT: "As a [character_interaction|E], summon a plague of rats over the target's capital with a small chance of spawning an epidemic.\n#weak The psychic can gain total control over an animal, allowing their mind to follow them while it does the task given to it.#!"
 anti_psi_1_perk_name: "一阶反灵能场/心智护盾"
 anti_psi_2_perk_name: "二阶反灵能场/心智护盾"
 anti_psi_3_perk_name: "三阶反灵能场/心智护盾"
 anti_psi_4_perk_name: "四阶反灵能场/心智护盾"
 anti_psi_5_perk_name: "五阶反灵能场/心智护盾"
 ANTI_PSI_1_PERK_EFFECT: "#P +10#! chance to defend against mind-altering effects\nIncrease the cost of any [GetTrait('psychic').GetName( GetPlayer )] [character_interaction|E] targeting you by 25%\n#weak Anti Psi is the rare ability to shut down other psychic numina.\nThe psychic can erect mental defences against supernatural intrusion.\nThe psychic suppresses other psychic abilities in a five meter radius around the user#!"
 ANTI_PSI_2_PERK_EFFECT: "#P +10#! chance to defend against mind-altering effects\nIncrease the cost of any [GetTrait('psychic').GetName( GetPlayer )] [character_interaction|E] targeting you by 25%\n#weak The psychic suppresses other psychic abilities in a ten meter radius around the user#!"
 ANTI_PSI_3_PERK_EFFECT: "#P +10#! chance to defend against mind-altering effects\nIncrease the cost of any [GetTrait('psychic').GetName( GetPlayer )] [character_interaction|E] targeting you by 25%\n#weak The psychic suppresses other psychic abilities in a fifteen meter radius around the user#!"
 ANTI_PSI_4_PERK_EFFECT: "#P +10#! chance to defend against mind-altering effects\nImmunity against any [GetTrait('psychic').GetName( GetPlayer )] [character_interaction|E]\n#weak The psychic suppresses other psychic abilities in a twenty meter radius around the user#!"
 ANTI_PSI_5_PERK_EFFECT: "#P +10#! chance to defend against mind-altering effects\nStrong Mental Defenses\n#weak The psychic suppresses other psychic abilities in a twenty-five meter radius around the user#!"
 astral_projection_1_perk_name: "一阶星光投射"
 astral_projection_2_perk_name: "二阶星光投射"
 astral_projection_3_perk_name: "三阶星光投射"
 astral_projection_4_perk_name: "四阶星光投射"
 astral_projection_5_perk_name: "五阶星光投射"
 ASTRAL_PROJECTION_1_PERK_EFFECT: "允许前往[UmbraGlossary('astral_reaches')]和[UmbraGlossary('deep_umbra')]\n#weak 灵能者可以将他们的灵魂从身体中分离出来，在星界中漫游。\n灵能者可以将他们的感官转移到星界位面，感知这个与凡尘部分重叠位面。#!"
 ASTRAL_PROJECTION_2_PERK_EFFECT: "允许前往[UmbraGlossary('spirit_wilds')]和[UmbraGlossary('dreaming')]\n#weak 灵能者可以暂时离开他们的身体几分钟。在星界中，他们仅限于视觉感知。#!"
 ASTRAL_PROJECTION_3_PERK_EFFECT: "允许前往[UmbraGlossaryLocalized('shadowlands','冥界')]\n#weak 灵能者可以让自己的灵魂离开身体数分钟。在星界中，他们不仅能看到，还能听到，并且可以快速地远离自己的身体。#!"
 ASTRAL_PROJECTION_4_PERK_EFFECT: "[umbra_aptitude|E]：$pod_grace_i$#P +25%#!\n#weak 灵能者可以让自己的灵魂离开身体数小时，以高速远离身体移动。他们还可以以半透明的物理形态显形，尽管他们无法说话。#!"
 ASTRAL_PROJECTION_5_PERK_EFFECT: "[umbra_aptitude|E]：$pod_grace_i$#P +50%#!\n#weak 灵能者可以在星界位面中环游，使用他们所有的感官，并且在显现时能够说话。#!"
 biocontrol_1_perk_name: "自控"
 biocontrol_2_perk_name: "自愈"
 biocontrol_3_perk_name: "歇斯底里之力"
 biocontrol_4_perk_name: "忽略疼痛反应"
 biocontrol_5_perk_name: "心胜于物"
 BIOCONTROL_1_PERK_EFFECT: "Unlock the Shapeshift [character_interaction|E].\nUnlock cosmetic shapeshift options.\nEach month has a chance of #P 33%#! to decrease wounded level by 1\n#weak The psychic can command their own body.\nThe psychic can control minor functions of their body, like holding their breath, by entering a trance.#!"
 BIOCONTROL_2_PERK_EFFECT: "As a [character_interaction|E], can instantly cure [GetTrait('ill').GetName( GetNullCharacter )].\nIncrease [GetPerk('biocontrol_1_perk').GetName( GetNullCharacter )]'s healing chance from #N 33%#! to #P 66%#!\n#weak The psychic can accelerate their own healing process through meditation.#!"
 BIOCONTROL_3_PERK_EFFECT: "As a [character_interaction|E], can instantly cure wounds.\nIncrease [GetPerk('biocontrol_1_perk').GetName( GetNullCharacter )]'s healing chance from #N 66%#! to #P 100%#!\n#weak By taking control of their adrenalin glandes, the psychic can enter a period of enhanced strength and speed.#!"
 BIOCONTROL_4_PERK_EFFECT: "As a [character_interaction|E], can instantly cure mortal illnesses.\n#weak The psychic can blot out pain from their consciousness.#!"
 BIOCONTROL_5_PERK_EFFECT: "As a [character_interaction|E], can instantly cure any illness.\n#weak The psychic can command their own heartbeat to stop if necessary, directly regulate their immune system and contort their body into unnatural positions.#!"
 necro_psi_1_perk_name: "一阶亡灵灵能"
 necro_psi_2_perk_name: "二阶亡灵灵能"
 necro_psi_3_perk_name: "三阶亡灵灵能"
 necro_psi_4_perk_name: "四阶亡灵灵能"
 necro_psi_5_perk_name: "五阶亡灵灵能"
 NECRO_PSI_1_PERK_EFFECT: "As a [character_interaction|E], can summon a [GetTrait('wraith').GetName( GetNullCharacter )] with [GetTrait('lament').GetName( GetNullCharacter )] to your court.\n#weak Necro-Psi, also called Channeling, is an ability that allows a psychic to contact the ghosts of the dead.\nThe psychic can hear any ghosts nearby.#!"
 NECRO_PSI_2_PERK_EFFECT: "当你在物质世界中时，也可以与[umbra|E]的存在互动。\n解锁[summon_wraith_on_death_interaction|E]。\n解锁[bind_wraith_interaction|E]。\n#weak 灵能者可以与该地区的鬼魂进行交流。#!"
 NECRO_PSI_3_PERK_EFFECT: "Unlock the [command_wraith_interaction|E].\nAs a [character_interaction|E], can allow a bound wraith to channel you, increasing all attributes by 2 while gaining [GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak The psychic can see into the [UmbraGlossary('shadowlands')].#!"
 NECRO_PSI_4_PERK_EFFECT: "As a [character_interaction|E], can allow a bound wraith to channel you, increasing a single attribute by 2 without gaining [GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak The psychic becomes a beacon to spirits, who find themselves attracted to them. When a ghost possesses them, they might contest him for control.#!"
 NECRO_PSI_5_PERK_EFFECT: "最大束缚死灵数量：#P +2#!\n允许使用[GetPerk('necro_psi_3_perk').GetName( GetNullCharacter )]和[GetPerk('necro_psi_4_perk').GetName( GetNullCharacter )]的[character_interaction|E]同时导联两个死灵\n#weak 灵能者可以自由与死灵沟通同时导联两个死灵。#!"
 clairvoyance_1_perk_name: "一阶心灵遥感"
 clairvoyance_2_perk_name: "二阶心灵遥感"
 clairvoyance_3_perk_name: "三阶心灵遥感"
 clairvoyance_4_perk_name: "四阶心灵遥感"
 clairvoyance_5_perk_name: "五阶心灵遥感"
 CLAIRVOYANCE_1_PERK_EFFECT: "#weak 灵能者可以在保持意识在身体内部的同时投射他们的感官。\n灵能者通过一种梦幻般的朦胧看到他们所在建筑中的事物。#!"
 CLAIRVOYANCE_2_PERK_EFFECT: "#weak 灵能者可以看到他们周围五十英里范围内的事件，但声音会显得低沉且扭曲。#!"
 CLAIRVOYANCE_3_PERK_EFFECT: "#weak 灵能者可以在远处清晰地看到和听到，同时获得了体验触觉的能力。感知范围扩展到250英里。#!"
 CLAIRVOYANCE_4_PERK_EFFECT: "#weak 灵能者可以体验到触觉、视觉和听觉，以及模糊的嗅觉。感知范围扩展到2000英里。#!"
 CLAIRVOYANCE_5_PERK_EFFECT: "#weak 灵能者可以在理论上将他们的感知投射到世界各地，同时使用所有五种感官。#!"
 cyberkinesis_1_perk_name: "一阶赛博操控"
 cyberkinesis_2_perk_name: "二阶赛博操控"
 cyberkinesis_3_perk_name: "三阶赛博操控"
 cyberkinesis_4_perk_name: "四阶赛博操控"
 cyberkinesis_5_perk_name: "五阶赛博操控"
 CYBERKINESIS_1_PERK_EFFECT: "#weak 灵能者可以控制电子设备。\n灵能者可以开启和关闭电子设备。#!"
 CYBERKINESIS_2_PERK_EFFECT: "#weak 灵能者可以在程序已安装的情况下，在计算机上激活程序。他们也可以不触摸键盘就操作计算机。#!"
 CYBERKINESIS_3_PERK_EFFECT: "#weak 灵能者可以通过心灵感应读取、加密和解密电子通信，同时这也会给他们自己引发一次癫痫。#!"
 CYBERKINESIS_4_PERK_EFFECT: "#weak 灵能者可以覆盖内部安全程序，并操作视线范围内的任何电子设备。#!"
 CYBERKINESIS_5_PERK_EFFECT: "#weak 灵能者可以重新编程计算机，使其执行它能够处理的任务。#!"
 cyberpathy_1_perk_name: "一阶赛博感应"
 cyberpathy_2_perk_name: "二阶赛博感应"
 cyberpathy_3_perk_name: "三阶赛博感应"
 cyberpathy_4_perk_name: "四阶赛博感应"
 cyberpathy_5_perk_name: "五阶赛博感应"
 CYBERPATHY_1_PERK_EFFECT: "#weak 灵能者可以读取存储在电子设备上的数据。\n灵能者可以了解设备上存储了哪种类型的数据。#!"
 CYBERPATHY_2_PERK_EFFECT: "#weak 灵能者可以阅读存储在设备上的简单文件。#!"
 CYBERPATHY_3_PERK_EFFECT: "#weak 灵能者可以将文件“复制”到他们的心智中，并在之后输出它。#!"
 CYBERPATHY_4_PERK_EFFECT: "#weak 灵能者可以访问他们已经连接的电子设备旁边的其他电子设备。#!"
 CYBERPATHY_5_PERK_EFFECT: "#weak 灵能者可以解密加密文件。#!"
 ectoplasmic_generation_1_perk_name: "大喷嚏"
 ectoplasmic_generation_2_perk_name: "迷雾"
 ectoplasmic_generation_3_perk_name: "“如此薄雾……”"
 ectoplasmic_generation_4_perk_name: "塑梦者"
 ectoplasmic_generation_5_perk_name: "幻人"
 ECTOPLASMIC_GENERATION_1_PERK_EFFECT: "#weak 灵能者可以创造出一种粘稠物质的灵质，这种物质在几分钟后会蒸发并返回到冥界。\n灵能者可以从他们身上的孔洞中创造出几缕灵质，并且可以手动应用。#!"
 ECTOPLASMIC_GENERATION_2_PERK_EFFECT: "#weak 灵能者可以将灵质转化成类似雾状的形式。#!"
 ECTOPLASMIC_GENERATION_3_PERK_EFFECT: "Unlocks a [crafting_node|E] that allows the artifact's owner to hurt spirits\n#weak The psychic can harden the ectoplasmic fog at will and shape it manually.#!"
 ECTOPLASMIC_GENERATION_4_PERK_EFFECT: "Improves the [artifact|E] created by [GetPerk('ectoplasmic_generation_3_perk').GetName( GetNullCharacter )] by also adding a [modifier|E] based on the [artifact|E]'s type\n#weak The psychic can shape their ectoplasmic constructs with their mind at the moment of their creation.#!"
 ECTOPLASMIC_GENERATION_5_PERK_EFFECT: "Improves the [artifact|E] created by [GetPerk('ectoplasmic_generation_4_perk').GetName( GetNullCharacter )] by also adding a [modifier|E] based on the [artifact|E]'s type\nUnlocks a [crafting_node|E] that allows sacrificing a $POD_splat_wraith$ [prisoner|E] to improve the [artifact|E] based on the sacrifice's [traits|E]\nGain access to most [POD_plasmic_maa|E] [men_at_arms|E]\n#weak The psychic can create a rudimentary intelligent construct out of ectoplasm that obeys their will.#!"
 empathic_healing_1_perk_name: "安抚精神"
 empathic_healing_2_perk_name: "编织肉体"
 empathic_healing_3_perk_name: "修补骨骼"
 empathic_healing_4_perk_name: "维修器官"
 empathic_healing_5_perk_name: "平息疯狂"
 EMPATHIC_HEALING_1_PERK_EFFECT: "As a [character_interaction|E], allows removing negative stress traits.\n#weak The psychic can establish an empathic link that allows them to influence the healing process of another person.\nThe psychic can soothe grief and similar minor ailments.#!"
 EMPATHIC_HEALING_2_PERK_EFFECT: "As a [character_interaction|E], allows absorbing scar traits.\n#weak The psychic can mend surface injuries.#!"
 EMPATHIC_HEALING_3_PERK_EFFECT: "As a [character_interaction|E], allows absorbing disease traits.\n#weak The psychic can heal acute illnesses or mend broken bones.#!"
 EMPATHIC_HEALING_4_PERK_EFFECT: "As a [character_interaction|E], allows absorbing wound traits.\n#weak The psychic can mend internal injuries.#!"
 EMPATHIC_HEALING_5_PERK_EFFECT: "As a [character_interaction|E], allows removing negative mental traits.\n#weak The psychic can heal severe psychic damages, including derangements and harano.#!"
 psychic_healing_1_perk_name: "诊断"
 psychic_healing_2_perk_name: "一夜好梦"
 psychic_healing_3_perk_name: "基本治疗"
 psychic_healing_4_perk_name: "分诊"
 psychic_healing_5_perk_name: "灵能手术"
 PSYCHIC_HEALING_1_PERK_EFFECT: "#weak 灵能者可以用他们的心灵力量治愈伤口和其他伤害。\n灵能者可以感知患者所缺少的东西。#!"
 PSYCHIC_HEALING_2_PERK_EFFECT: "Allows giving a target [GetModifier('psi_treatment').GetNameWithTooltip] as a [character_interaction|E]\n#weak The psychic can accelerate the natural healing process of their patient, sending them into a sleep after which most minor illnesses are cured.#!"
 PSYCHIC_HEALING_3_PERK_EFFECT: "Allows healing scars and disfigurements as a [character_interaction|E]\nAllows giving a target [GetModifier('psi_good_treatment').GetNameWithTooltip] as a [character_interaction|E]\n#weak The psychic can mend wounds and banish more obstinate illnesses.#!"
 PSYCHIC_HEALING_4_PERK_EFFECT: "Allows healing wounds and illnesses as a [character_interaction|E]\n#weak The psychic can mend broken bones and banish more serious illnesses.#!"
 PSYCHIC_HEALING_5_PERK_EFFECT: "Allows healing diseases and negative physical traits as a [character_interaction|E]\n#weak The psychic can remove cancer or infections.#!"
 precognition_1_perk_name: "直觉"
 precognition_2_perk_name: "洞察"
 precognition_3_perk_name: "危险感应"
 precognition_4_perk_name: "给我看牌"
 precognition_5_perk_name: "清晰预视"
 PRECOGNITION_1_PERK_EFFECT: "#weak 灵能者可以一窥最可能的事件发展，有时甚至能看到未来。\n灵能者对随机事件的预测，如掷骰子，变得更加准确。#!"
 PRECOGNITION_2_PERK_EFFECT: "你的囚犯从你的监狱成功逃跑的概率更低。\n#weak 灵能者可以通过冥想以接收未来可能的幻象。这些幻象是模糊的、隐喻的，需要大量的解释才能发挥作用。#!"
 PRECOGNITION_3_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人想勾引你的爱人或配偶，你会收到通知。\n#weak 灵能者能感觉到他们什么时候处于危险之中。#!"
 PRECOGNITION_4_PERK_EFFECT: "#weak 灵能者可以预见到一个动作会有什么样的即时反应#!"
 PRECOGNITION_5_PERK_EFFECT: "作为一个[character_interaction|E]，可以发现每一个针对你的敌对计划，并挫败那些已经发现的计划。\n#weak 灵能者可以看到最可能发生的未来。#!"
 psychic_hypnosis_1_perk_name: "入定状态"
 psychic_hypnosis_2_perk_name: "侧面建议"
 psychic_hypnosis_3_perk_name: "延迟行动"
 psychic_hypnosis_4_perk_name: "快速恍惚"
 psychic_hypnosis_5_perk_name: "迷魂傀儡"
 PSYCHIC_HYPNOSIS_1_PERK_EFFECT: "As a [character_interaction|E] give a target [GetModifier('psi_hypnosis_stress_buff').GetNameWithTooltip] for 5 years. Available only if the target has #V 0+#! opinion of the psychic and is in the same location.\n#weak The psychic can implant orders and suggestions into their target by sending them into a trance and then hypnotizing them.\nThe psychic can send a target into a hypnotic trance.#!"
 PSYCHIC_HYPNOSIS_2_PERK_EFFECT: "The [character_interaction|E] from [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] now also lets you increase the target's opinion of you with a diplomacy duel.\n#weak The psychic can make a minor suggestion while the target is in trance.#!"
 PSYCHIC_HYPNOSIS_3_PERK_EFFECT: "The [character_interaction|E] from [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] now also lets you heal bad stress habits or gain a weak hook after winning a diplomacy duel.\n#weak The psychic can make suggestions that remain even after the trance has ended.#!"
 PSYCHIC_HYPNOSIS_4_PERK_EFFECT: "The [character_interaction|E] from [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] now also lets you heal most mental issues.\nIncreases the chance of succeeding at hypnosis.\n#weak The psychic can send a target into a trance with a mere glance.#!"
 PSYCHIC_HYPNOSIS_5_PERK_EFFECT: "Can use [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] [character_interaction|E] without the target having 0+ opinion of you. Increases the chance of success and can upgrade the hook gained by hypnosis to a strong hook.\n#weak The psychic can deep-program a target while it is in trance, even affecting their memory.#!"
 psychic_invisibility_1_perk_name: "隐藏"
 psychic_invisibility_2_perk_name: "缓慢移动"
 psychic_invisibility_3_perk_name: "隐形"
 psychic_invisibility_4_perk_name: "选择性隐形"
 psychic_invisibility_5_perk_name: "忘记你曾见过我"
 PSYCHIC_INVISIBILITY_1_PERK_EFFECT: "#weak 类似于吸血鬼的血律混淆术，灵能者可以掩盖他们的存在，不被他人察觉。\n只要灵能者保持完全静止，就不会被注意到。#!"
 PSYCHIC_INVISIBILITY_2_PERK_EFFECT: "#weak 只要灵能者移动得足够缓慢，就不会被注意到。#!"
 PSYCHIC_INVISIBILITY_3_PERK_EFFECT: "#weak 灵能者可以在隐形时移动，只要在激活力量时不被注视。#!"
 PSYCHIC_INVISIBILITY_4_PERK_EFFECT: "#weak 灵能者可以让某些人在他们隐形时看到他们。#!"
 PSYCHIC_INVISIBILITY_5_PERK_EFFECT: "As a [character_interaction|E], you can slow down any hostile scheme targeting you by 2 stages.\n#weak The psychic can become invisible right in front of someone.#!"
 psychic_vampirism_1_perk_name: "催促"
 psychic_vampirism_2_perk_name: "消磨意志"
 psychic_vampirism_3_perk_name: "能量传递"
 psychic_vampirism_4_perk_name: "吸食生命"
 psychic_vampirism_5_perk_name: "情感漩涡"
 PSYCHIC_VAMPIRISM_1_PERK_EFFECT: "As a [character_interaction|E], you can decrease your stress by 'eating' someone's emotions. Requires the target to be in the same location as you, and have #V 0#! [stress|E] or [stress_level|E] #V 3#!.\n#weak The psychic can drain from more than one person.\nThe psychic can drain strong emotions to experience them themself.#!"
 PSYCHIC_VAMPIRISM_2_PERK_EFFECT: "Improves the [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] [character_interaction|E] by increasing the stress loss and changing the requirements to #V 0#! [stress|E] or [stress_level|E] #V 2#!.\n#weak The psychic can drain Willpower from a target to replenish their own.#!"
 PSYCHIC_VAMPIRISM_3_PERK_EFFECT: "Improves the [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] [character_interaction|E] by also gaining a stack of [GetModifier('psi_vampirism_health').GetNameWithTooltip] for 20 years.\n#weak The psychic can drain lifeforce to heal minor injuries.#!"
 PSYCHIC_VAMPIRISM_4_PERK_EFFECT: "Improves the [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] [character_interaction|E] by reducing the cooldown from 5 to 2 years\n#weak The psychic can drain even more lifeforce to heal major injuries.#!"
 PSYCHIC_VAMPIRISM_5_PERK_EFFECT: "Removes the location requirement of [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] if you've previously leeched the target's life force.\n#weak The psychic can drain from more than one person.#!"
 psychokinesis_1_perk_name: "一阶念力"
 psychokinesis_2_perk_name: "二阶念力"
 psychokinesis_3_perk_name: "三阶念力"
 psychokinesis_4_perk_name: "四阶念力"
 psychokinesis_5_perk_name: "五阶念力"
 PSYCHOKINESIS_1_PERK_EFFECT: "#weak 念力，也称为心灵致动，允许灵能者在不接触物体的情况下移动它们。  \n灵能者可以举起半公斤的物体。#!"
 PSYCHOKINESIS_2_PERK_EFFECT: "#weak 灵能者可以举起10公斤的物体。#!"
 PSYCHOKINESIS_3_PERK_EFFECT: "#weak 灵能者可以举起100公斤的物体。#!"
 PSYCHOKINESIS_4_PERK_EFFECT: "#weak 灵能者可以举起250公斤的物体。#!"
 PSYCHOKINESIS_5_PERK_EFFECT: "#weak 灵能者可以举起500公斤的物体。#!"
