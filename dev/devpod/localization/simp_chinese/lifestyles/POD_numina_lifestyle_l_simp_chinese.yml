 SOULSTEALING_1_PERK_EFFECT: "#weak 窃魂术吸取目标的精华来增强灵能者的力量。  \n灵能者可以进入目标的梦境。#!"
 SOULSTEALING_2_PERK_EFFECT: "As a [character_interaction|E], allows you to lose stress by draining the willpower of a prisoner.\n#weak The psychic can steal temporary Willpower from the target.#!"
 SOULSTEALING_3_PERK_EFFECT: "As a [character_interaction|E], allows you to gain blood from a prisoner.\n#weak The psychic can steal life force from the target.#!"
 SOULSTEALING_4_PERK_EFFECT: "As a [character_interaction|E], allows you to heal wounds by draining a prisoner's life force.\n#weak The psychic can shift the stolen life force to another target.#!"
 SOULSTEALING_5_PERK_EFFECT: "As a [character_interaction|E], allows you to drain any form of energy from a prisoner.\n#weak The psychic can steal Gnosis from a target.#!"
 synergy_1_perk_name: "灵觉"
 synergy_2_perk_name: "共享意志"
 synergy_3_perk_name: "群体效应"
