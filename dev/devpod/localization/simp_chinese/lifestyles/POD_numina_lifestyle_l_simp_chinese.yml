 ECTOPLASMIC_GENERATION_3_PERK_EFFECT: "可以创造出能够伤害灵类的灵质[artifact|E]，但在其他方面毫无用处。\n#weak 灵能者可以随意硬化灵质雾，并手动塑造它。#!"
 ECTOPLASMIC_GENERATION_4_PERK_EFFECT: "赋予由[GetPerk('ectoplasmic_generation_3_perk').GetName( GetNullCharacter )]创造的[artifact|E]额外修正，基于管理属性。  \n#weak 灵能者能够在制造时用思维塑造灵质造物。#!"
 ECTOPLASMIC_GENERATION_5_PERK_EFFECT: "赋予由[GetPerk('ectoplasmic_generation_3_perk').GetName( GetNullCharacter )]创造的[artifact|E]额外修正，基于管理属性。  \n可以魂铸被缚死灵 \n允许访问大多数[POD_plasmic_maa|E][men_at_arms|E]\n#weak 灵能者能够创造一个基础的智能构造体，由灵质制成，会服从他们的意志。#!"
