 VIA_GENIORUM_1_PERK_EFFECT: "Can recruit [GetMaA('materialized_spirits').GetName] as [men_at_arms|E]\nCan interact with spirits.\n#F This Via deals with the realm of spirits and the demonic. Knowledge of a spirit’s true name grants one power over it. Via Geniorum is a compilation of specific Rituals of graded levels of power.\nThe Theurgist does not peer into the spirit world so much as command nearby supernal beings to reveal themselves.#!"
 VIA_GENIORUM_2_PERK_EFFECT: "Can recruit [GetMaA('fire_elemental').GetName], [GetMaA('air_elemental').GetName], [GetMaA('water_elemental').GetName] and [GetMaA('earth_elemental').GetName] as [men_at_arms|E]\n#F The Theurgist may draw protective sigils into handheld objects or in a small circle around her.#!"
 VIA_GENIORUM_3_PERK_EFFECT: "Can recruit [GetMaA('electricity_elemental').GetName], [GetMaA('metal_elemental').GetName], [GetMaA('lucifergia').GetName] and [GetMaA('imps').GetName] as [men_at_arms|E]\nAs a [character_interaction|E], Can learn the true name of a character\n#F The Theurgist can send a spirit back to its native realm.#!"
 VIA_GENIORUM_4_PERK_EFFECT: "Can recruit [GetMaA('demonics').GetName] and [GetMaA('angelics').GetName] as [men_at_arms|E]\nAs a [character_interaction|E], allows banishing a fae/demon to their native realm\n#F The Theurgist can now summon spirit entities.#!"
 VIA_GENIORUM_5_PERK_EFFECT: "Can recruit [GetMaA('archdemonics').GetName], [GetMaA('archangelics').GetName], [GetMaA('djinn').GetName] and [GetMaA('wyrds').GetName] as [men_at_arms|E]\n#F The Theurgist can now force a spirit into servitude.#!"
 VIA_IGNIS_1_PERK_EFFECT: "#F This Via lets the Damned experience the flames of Hell before their final Death. This Via summons what appears to be normal fire, but it burns even those who are protected from normal flames.\nThe Theurgist can summon a candle flame of Holy Fire."
 VIA_IGNIS_2_PERK_EFFECT: "#F The Theurgist can summon a small Holy Fire.#!"
 VIA_IGNIS_3_PERK_EFFECT: "#F Theurgists can summon a camp fire of Holy Fire.#!"
 VIA_IGNIS_4_PERK_EFFECT: "#F Theurgists can summon a bonfire of Holy Fire.#!"
 VIA_IGNIS_5_PERK_EFFECT: "#F Theurgists can summon a conflagration of Holy Fire.#!"
 VIA_MEDICAMENTI_1_PERK_EFFECT: "As a [character_interaction|E], can soothe pain.\n#F Those who practice this Via, also called the Way of Remedy, are healers. Via Medicamenti will knit bones, stop bleeding, and actually reverse inflicted damage.\nYou can soothe minor pains.#!"
 VIA_MEDICAMENTI_2_PERK_EFFECT: "As a [character_interaction|E], can heal minor wounds.\n#F Sprains and minor infections heal more quickly under your care.#!"
 VIA_MEDICAMENTI_3_PERK_EFFECT: "As a [character_interaction|E], can heal wounds.\n#F All injuries up to Crippled heal twice as quickly as their normal rate, without the risk of infection.#!"
 VIA_MEDICAMENTI_4_PERK_EFFECT: "As a [character_interaction|E], can cure basic illnesses.\n#F You can heal chronic diseases like asthma or arthritis, but it takes time and effort.#!"
 VIA_MEDICAMENTI_5_PERK_EFFECT: "As a [character_interaction|E], can perform miracle-like healing.\n#F You can heal even deadly conditions, but it takes a lot out of you and requires weeks of treatment.#!"
 VIA_NECROMANTIAE_1_PERK_EFFECT: "Unlock [summon_wraith_on_death_interaction|E].\n#F The Via Necromantiae is Theurgy designed to contact or banish the dead.\nThe Theurgist may command a recently deceased cadaver to awaken.#!"
 VIA_NECROMANTIAE_2_PERK_EFFECT: "You can imprison, torture, execute or physically hurt a spirit.\n#F Theurgists may protect an area from ghostly intrusion.#!"
 VIA_NECROMANTIAE_3_PERK_EFFECT: "Unlock [bind_wraith_interaction|E].\n#F Theurgists may contact the dead.#!"
 VIA_NECROMANTIAE_4_PERK_EFFECT: "Unlock [command_wraith_interaction|E].\nAs a [character_interaction|E], can banish wraiths into the [shadowlands|E], unbinding them in the process.\n#F Theurgists may expel a haunting ghost.#!"
 VIA_NECROMANTIAE_5_PERK_EFFECT: "As a [character_interaction|E], can summon a random wraith from the [shadowlands|E].\nMax number of bound wraiths: #P +1#!.\n#F The Theurgist can now urge a cadaver to rise.#!"
 VIA_ORACULI_1_PERK_EFFECT: "#F Through Via Oraculi, Theurgists may glimpse into the unknown future or see the unseen past.\nThe Theurgist interprets signs or warnings about the state of her immediate circumstances.#!"
 VIA_ORACULI_2_PERK_EFFECT: "If any of your relatives or friends are murdered in mysterious circumstances, you will know their murderers identity.\n#F The Theurgist eliminates possible negative outcomes by comparing them beforehand.#!"
 VIA_ORACULI_3_PERK_EFFECT: "You will receive a notification if someone intent to murder your friends of family.\nYou will receive a notification if someone intent to seduce your lover or consort.\nYour prisoners have less chance of escaping from your prison.\n#F The Theurgist may sense patterns of chance allowing her to glean short-term information that follows specific decisions.#!"
 VIA_ORACULI_4_PERK_EFFECT: "#F The Theurgist is able to divine specific events in the future.#!"
 VIA_ORACULI_5_PERK_EFFECT: "#F The Theurgist gains the ability to sense clear and concrete details about the future and the ability to predict specific events with dependable certainty#!"
 SORCERY_LEVEL_6_REQUIREMENT: "@warning_icon!#X 你必须达成相应决议来解锁第六阶术法#!"
 SORCERY_LEVEL_6_DISABLED: "@warning_icon!#X 第六阶术法被游戏规则禁用#!"
 TELEPATHY_1_PERK_EFFECT: "#weak Telepathy is the talent of dominating another’s mind with the one of the psychic.\nThe psychic can sense basic emotions of a target, send a minor impulse to it or cause it to twitch.#!"
 TELEPATHY_2_PERK_EFFECT: "#weak The psychic can read surface thoughts, transmit a single idea or cause one short notion.#!"
 TELEPATHY_3_PERK_EFFECT: "As a [character_interaction|E], starts a diplomacy duel against the target to get a weak hook on them.\n#weak The psychic can read recent memories or future plans, transmit complex emotions or ideas or cause one unusual action.#!"
 TELEPATHY_4_PERK_EFFECT: "New option for Telepathy [character_interaction|E] to get a strong hook instead of a weak one.\n#weak The psychic can read deep thoughts, send several sentences or temporarily seize control over the target’s body.#!"
 TELEPATHY_5_PERK_EFFECT: "New option for Telepathy [character_interaction|E] to get a perpetual strong hook.\n#weak The psychic can read the deepest, subconscious secrets of a target, hold a conversation with them or take complete control of their body, including the rewriting of memories.#!"