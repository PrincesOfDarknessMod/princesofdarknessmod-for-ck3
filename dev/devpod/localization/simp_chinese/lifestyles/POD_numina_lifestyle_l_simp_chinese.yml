 animal_psi_1_perk_name: "沟通"
 animal_psi_2_perk_name: "命令"
 animal_psi_3_perk_name: "集体沟通"
 animal_psi_4_perk_name: "心灵链接"
 animal_psi_5_perk_name: "统御"
 ANIMAL_PSI_1_PERK_EFFECT: "通过[character_interaction|E]可以加速计谋(25%几率)。\n#weak 灵能者能够读取他们面前动物的基本意图和愿望。这种能力影响高等哺乳动物。\n动物感应是一种与动物沟通的灵能能力。动物越聪明或训练有素，下达命令就越容易。#!"
 ANIMAL_PSI_2_PERK_EFFECT: "增强了25%到50%[GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )]。\n#weak 灵能者可以给动物下达一个简单的命令让它去完成。动物没有责任必须这样做。#!"
 ANIMAL_PSI_3_PERK_EFFECT: "通过[character_interaction|E]，允许你收养宠物。\n通过[character_interaction|E]，允许你召唤宠物参战。\n增强了50%到75%[GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )]\n解锁更多[POD_animals_maa|E][men_at_arms|E]\n#weak 灵能者能够本能地理解动物想要什么。他们可以同时与多个动物沟通，或者给单个动物下达更复杂的命令。#!"
 ANIMAL_PSI_4_PERK_EFFECT: "解锁变形[character_interaction|E]。\n解锁动物变形选项\n提高[GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )]增强75%到100%。\n#weak 灵能者能够将自己的心灵与动物相连，通过它们的眼睛看世界，像是用自己的感官一样使用动物的。#!"
 ANIMAL_PSI_5_PERK_EFFECT: "通过[character_interaction|E]，召唤一群携带瘟疫的老鼠到目标首都，有小概率引发瘟疫。\n#weak 灵能者可以彻底控制一只动物，允许他们的心灵一直跟随动物同时不断下达任务。#!"
 anti_psi_1_perk_name: "一阶反灵能场/心智护盾"
 anti_psi_2_perk_name: "二阶反灵能场/心智护盾"
 anti_psi_3_perk_name: "三阶反灵能场/心智护盾"
 anti_psi_4_perk_name: "四阶反灵能场/心智护盾"
 anti_psi_5_perk_name: "五阶反灵能场/心智护盾"
 ANTI_PSI_1_PERK_EFFECT: "#P +10#! 概率抵御心智干扰效果\n提升针对你的 [GetTrait('psychic').GetName( GetPlayer )] [character_interaction|E] 消耗25%\n#weak 反灵能是一种罕见的能力，可以抑制其他灵迹。\n灵能者可以建立心灵防御，抵御超自然的入侵。\n灵能者会抑制使用者周围五米半径内的其他灵能者能力#!"
 ANTI_PSI_2_PERK_EFFECT: "#P +10#! 概率抵御心智干扰效果\n提升针对你的 [GetTrait('psychic').GetName( GetPlayer )][character_interaction|E] 消耗25%\n#weak 这项灵能在使用者周围十米的半径内压制其他灵能能力。#!"
 ANTI_PSI_3_PERK_EFFECT: "#P +10#! 概率抵御心智干扰效果\n提升针对你的 [GetTrait('psychic').GetName( GetPlayer )][character_interaction|E]消耗25%\n#weak 这项灵能在使用者周围十五米的半径内压制其他灵能能力。#!"
 ANTI_PSI_4_PERK_EFFECT: "#P +10#! 概率抵御心智干扰效果\n完全免疫 [GetTrait('psychic').GetName( GetPlayer )] [character_interaction|E]\n#weak 这项灵能在使用者周围二十米的半径内压制其他灵能能力。#!"
 ANTI_PSI_5_PERK_EFFECT: "#P +10#! 概率抵御心智干扰效果\n强大的心灵防御\n#weak 这项灵能在使用者周围二十五米的半径内压制其他灵能能力。#!"
 astral_projection_1_perk_name: "一阶星光投射"
 astral_projection_2_perk_name: "二阶星光投射"
 astral_projection_3_perk_name: "三阶星光投射"
 astral_projection_4_perk_name: "四阶星光投射"
 astral_projection_5_perk_name: "五阶星光投射"
 ASTRAL_PROJECTION_1_PERK_EFFECT: "#weak 灵能者可以将他们的灵魂从身体中分离出来，在星界中漫游。\n灵能者可以将他们的感官转移到星界位面，感知这个与凡尘部分重叠位面。#!"
 ASTRAL_PROJECTION_2_PERK_EFFECT: "#weak 灵能者可以暂时离开他们的身体几分钟。在星界中，他们仅限于视觉感知。#!"
 ASTRAL_PROJECTION_3_PERK_EFFECT: "#weak 灵能者可以让自己的灵魂离开身体数分钟。在星界中，他们不仅能看到，还能听到，并且可以快速地远离自己的身体。#!"
 ASTRAL_PROJECTION_4_PERK_EFFECT: "#weak 灵能者可以让自己的灵魂离开身体数小时，以高速远离身体移动。他们还可以以半透明的物理形态显形，尽管他们无法说话。#!"
 ASTRAL_PROJECTION_5_PERK_EFFECT: "#weak 灵能者可以在星界位面中环游，使用他们所有的感官，并且在显现时能够说话。#!"
 biocontrol_1_perk_name: "自控"
 biocontrol_2_perk_name: "自愈"
 biocontrol_3_perk_name: "歇斯底里之力"
 biocontrol_4_perk_name: "忽略疼痛反应"
 biocontrol_5_perk_name: "心胜于物"
 BIOCONTROL_1_PERK_EFFECT: "解锁变形[character_interaction|E]\n解锁美化变形选项。\n#weak 灵能者可以掌控自己的身体。\n灵能者可以通过进入恍惚状态来控制身体的微小功能，比如屏住呼吸。#!"
 BIOCONTROL_2_PERK_EFFECT: "作为[character_interaction|E]，可以立刻治愈[GetTrait('ill').GetName( GetNullCharacter )]。\n#weak 灵能者可以通过冥想加速自己的愈合过程。#!"
 BIOCONTROL_3_PERK_EFFECT: "通过[character_interaction|E]，可以立即治愈伤势。\n#weak 通过控制肾上腺，灵能者可以短暂增强速度与力量。#!"
 BIOCONTROL_4_PERK_EFFECT: "通过[character_interaction|E]，可以立即治愈凡俗疾病\n#weak 灵能者可以从他们的意识中消除痛苦。#!"
 BIOCONTROL_5_PERK_EFFECT: "通过[character_interaction|E]，可以立刻治愈任何疾病。\n#weak 灵能者可以在必要时命令自己的心跳停止，直接调节自己的免疫系统，或者使身体扭曲成非自然的姿势。#!"
 necro_psi_1_perk_name: "一阶亡灵灵能"
 necro_psi_2_perk_name: "二阶亡灵灵能"
 necro_psi_3_perk_name: "三阶亡灵灵能"
 necro_psi_4_perk_name: "四阶亡灵灵能"
 necro_psi_5_perk_name: "五阶亡灵灵能"
 NECRO_PSI_1_PERK_EFFECT: "通过[character_interaction|E]，可以召唤一个[GetTrait('wraith').GetName( GetNullCharacter )]前往[GetTrait('lament').GetName( GetNullCharacter )]宫廷。\n#weak 亡灵灵能，也叫做通灵，允许灵能者与死去之人的鬼魂沟通。\n灵能者可以听到附近的鬼魂。#!"
 NECRO_PSI_2_PERK_EFFECT: "当你在物质世界中时，也可以与[umbra|E]的存在互动。\n$POD_can_summon_on_death_trigger_loca$\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#weak 灵能者可以与该地区的鬼魂进行交流。#!"
 NECRO_PSI_3_PERK_EFFECT: "$POD_can_command_wraith_trigger_loca$\n通过[character_interaction|E]，允许让一个受缚死灵附身你，最多同时提升两点属性且获得[GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak 灵能者可以视入[UmbraGlossary('shadowlands')].#!"
 NECRO_PSI_4_PERK_EFFECT: "作为一个[character_interaction|E]，可以使用受束死灵将单个属性增加2，而不会获得[GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak 灵能者成为诸灵的灯塔，灵类发现自己被他们吸引。当鬼魂控制它们时，它们可能会与他争夺控制权。#!"
 NECRO_PSI_5_PERK_EFFECT: "允许使用[GetPerk('necro_psi_3_perk').GetName( GetNullCharacter )]和[GetPerk('necro_psi_4_perk').GetName( GetNullCharacter )]的[character_interaction|E]同时导联两个死灵\n#weak 灵能者可以自由与死灵沟通同时导联两个死灵。#!"
 clairvoyance_1_perk_name: "一阶心灵遥感"
 clairvoyance_2_perk_name: "二阶心灵遥感"
 clairvoyance_3_perk_name: "三阶心灵遥感"
 clairvoyance_4_perk_name: "四阶心灵遥感"
 clairvoyance_5_perk_name: "五阶心灵遥感"
 CLAIRVOYANCE_1_PERK_EFFECT: "#weak 灵能者可以在保持意识在身体内部的同时投射他们的感官。\n灵能者通过一种梦幻般的朦胧看到他们所在建筑中的事物。#!"
 CLAIRVOYANCE_2_PERK_EFFECT: "#weak 灵能者可以看到他们周围五十英里范围内的事件，但声音会显得低沉且扭曲。#!"
 CLAIRVOYANCE_3_PERK_EFFECT: "#weak 灵能者可以在远处清晰地看到和听到，同时获得了体验触觉的能力。感知范围扩展到250英里。#!"
 CLAIRVOYANCE_4_PERK_EFFECT: "#weak 灵能者可以体验到触觉、视觉和听觉，以及模糊的嗅觉。感知范围扩展到2000英里。#!"
 CLAIRVOYANCE_5_PERK_EFFECT: "#weak 灵能者可以在理论上将他们的感知投射到世界各地，同时使用所有五种感官。#!"
 cyberkinesis_1_perk_name: "一阶赛博操控"
 cyberkinesis_2_perk_name: "二阶赛博操控"
 cyberkinesis_3_perk_name: "三阶赛博操控"
 cyberkinesis_4_perk_name: "四阶赛博操控"
 cyberkinesis_5_perk_name: "五阶赛博操控"
 CYBERKINESIS_1_PERK_EFFECT: "#weak 灵能者可以控制电子设备。\n灵能者可以开启和关闭电子设备。#!"
 CYBERKINESIS_2_PERK_EFFECT: "#weak 灵能者可以在程序已安装的情况下，在计算机上激活程序。他们也可以不触摸键盘就操作计算机。#!"
 CYBERKINESIS_3_PERK_EFFECT: "#weak 灵能者可以通过心灵感应读取、加密和解密电子通信，同时这也会给他们自己引发一次癫痫。#!"
 CYBERKINESIS_4_PERK_EFFECT: "#weak 灵能者可以覆盖内部安全程序，并操作视线范围内的任何电子设备。#!"
 CYBERKINESIS_5_PERK_EFFECT: "#weak 灵能者可以重新编程计算机，使其执行它能够处理的任务。#!"
 cyberpathy_1_perk_name: "一阶赛博感应"
 cyberpathy_2_perk_name: "二阶赛博感应"
 cyberpathy_3_perk_name: "三阶赛博感应"
 cyberpathy_4_perk_name: "四阶赛博感应"
 cyberpathy_5_perk_name: "五阶赛博感应"
 CYBERPATHY_1_PERK_EFFECT: "#weak 灵能者可以读取存储在电子设备上的数据。\n灵能者可以了解设备上存储了哪种类型的数据。#!"
 CYBERPATHY_2_PERK_EFFECT: "#weak 灵能者可以阅读存储在设备上的简单文件。#!"
 CYBERPATHY_3_PERK_EFFECT: "#weak 灵能者可以将文件“复制”到他们的心智中，并在之后输出它。#!"
 CYBERPATHY_4_PERK_EFFECT: "#weak 灵能者可以访问他们已经连接的电子设备旁边的其他电子设备。#!"
 CYBERPATHY_5_PERK_EFFECT: "#weak 灵能者可以解密加密文件。#!"
 ectoplasmic_generation_1_perk_name: "大喷嚏"
 ectoplasmic_generation_2_perk_name: "迷雾"
 ectoplasmic_generation_3_perk_name: "“如此薄雾……”"
 ectoplasmic_generation_4_perk_name: "塑梦者"
 ectoplasmic_generation_5_perk_name: "幻人"
 ECTOPLASMIC_GENERATION_1_PERK_EFFECT: "#weak 灵能者可以创造出一种粘稠物质的灵质，这种物质在几分钟后会蒸发并返回到冥界。\n灵能者可以从他们身上的孔洞中创造出几缕灵质，并且可以手动应用。#!"
 ECTOPLASMIC_GENERATION_2_PERK_EFFECT: "#weak 灵能者可以将灵质转化成类似雾状的形式。#!"
 ECTOPLASMIC_GENERATION_3_PERK_EFFECT: "$unlock_forging_node$允许该宝物的所有者伤害灵体\n#weak 灵能者可以随意硬化灵质雾，并手动塑造它。#!"
 ECTOPLASMIC_GENERATION_4_PERK_EFFECT: "强化[GetPerk('ectoplasmic_generation_3_perk').GetName( GetNullCharacter )]创造的[artifact|E]，根据[artifact|E]类型附加[modifier|E]效果\n#weak 灵能者能够在制造时用思维塑造灵质造物。#!"
 ECTOPLASMIC_GENERATION_5_PERK_EFFECT: "强化[GetPerk('ectoplasmic_generation_4_perk').GetName( GetNullCharacter )]创建的[artifact|E]，通过也添加一个基于该[artifact|E]类型的[modifier|E]。\n$unlock_forging_node$献祭一个$POD_splat_wraith$[prisoner|E]以改进一个基于该祭品的[traits|E]的[artifact|E]。\n获得大多数[POD_plasmic_maa|E][men_at_arms|E]的使用权\n#weak 灵能者能够创造一个基础的智能构造体，由灵质制成，会服从他们的意志。#!"
 empathic_healing_1_perk_name: "安抚精神"
