 PSYCHIC_HEALING_1_PERK_EFFECT: "#weak 灵能者可以用他们的心灵力量治愈伤口和其他伤害。\n灵能者可以感知患者所缺少的东西。#!"
 PSYCHIC_HEALING_2_PERK_EFFECT: "作为一个[character_interaction|E]，可以给予目标[GetModifier('psi_treatment').GetNameWithTooltip]\n#weak 灵能者可以加速患者的自然愈合过程，让他们进入睡眠状态，之后大多数轻微疾病都会治愈。#!"
 PSYCHIC_HEALING_3_PERK_EFFECT: "作为一个[character_interaction|E]，可以治愈疤痕和毁容。\n作为[character_interaction|E]，可以给予目标[GetModifier('psi_good_treatment').GetNameWithTooltip]\n#weak 灵能者可以治愈伤口，清除更顽固的疾病。#!"
 PSYCHIC_HEALING_4_PERK_EFFECT: "作为一个[character_interaction|E]，能够治愈伤疤和疾病。\n#weak 灵能者可以治疗骨折，清除更严重的疾病。#!"
 PSYCHIC_HEALING_5_PERK_EFFECT: "作为一个[character_interaction|E]，可以治愈疾病和负面的身体特质\n#weak 灵能者可以治愈癌症或传染病。#!"
