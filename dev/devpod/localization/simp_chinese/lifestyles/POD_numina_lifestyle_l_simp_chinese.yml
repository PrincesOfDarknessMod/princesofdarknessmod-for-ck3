 PSYCHIC_VAMPIRISM_1_PERK_EFFECT: "作为[character_interaction|E]，可以“吞噬”某人的情感以降低压力（这意味着你可以针对压力为0或压力等级到达3级的人），前提是他们与你在同一个地方。 \n#weak 灵能者可以从多个对象身上汲取。 \n灵能者可以吸取强烈的情感以体验它们。#!"
 PSYCHIC_VAMPIRISM_2_PERK_EFFECT: "增加减轻压力的效率，并将[GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )][character_interaction|E]的要求改为拥有0压力或压力等级达到2。  \n#weak 灵能者可以从目标身上汲取意志力以补充自身的意志力。#!"
 PSYCHIC_VAMPIRISM_3_PERK_EFFECT: "在[GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )][character_interaction|E]中，除了减少压力外，还可以获得可叠加的[GetModifier('psi_vampirism_health').GetNameWithTooltip]，持续20年。  \n#weak 灵能者可以汲取生命力来治愈轻微的伤口。#!"
 PSYCHIC_VAMPIRISM_4_PERK_EFFECT: "将[GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )][character_interaction|E]的冷却时间从5年减少到2年。  \n#weak 灵能者可以汲取更多的生命力来治愈严重的伤势。#!"
 PSYCHIC_VAMPIRISM_5_PERK_EFFECT: "移除必须在同一地点的要求，仅在目标已经被[GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )][character_interaction|E]汲取过时生效。  \n#weak 灵能者可以从不止一个人身上汲取生命力。#!"
