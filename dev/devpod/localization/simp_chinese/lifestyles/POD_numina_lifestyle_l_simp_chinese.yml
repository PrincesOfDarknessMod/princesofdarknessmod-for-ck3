 SYNERGY_1_PERK_EFFECT: "将[GetTrait('psychic').GetName( GetPlayer )][character_interaction|E]对[GetTrait('psychic').GetName( GetPlayer )]的成功几率提高10%。  \n#weak 一种极其罕见的天赋，心灵协同允许灵能者将自己与其他灵能者链接，形成一个结合多种力量的整体存在。  \n灵能者可以感知其他灵能者。#!"
 SYNERGY_2_PERK_EFFECT: "对于你的[coterie|E]中的每个[GetTrait('psychic').GetName( GetPlayer )]，获得[GetModifier('psi_synergy_coterie_stress_buff').GetNameWithTooltip]。  \n#weak 灵能者可以建立一个基础的心灵链接，与另一个灵能者共享意志力。#!"
 SYNERGY_3_PERK_EFFECT: "对于与你在同一地点的[coterie|E]中的每个[GetTrait('psychic').GetName( GetPlayer )]，[GetTrait('psychic').GetName( GetPlayer )][character_interaction|E]的成功几率提高10%，限1个[GetTrait('psychic').GetName( GetPlayer )]在[coterie|E]中。  \n#weak 建立协同链接的灵能者可以在尝试某个行动时联合他们的心智。#!"
 SYNERGY_4_PERK_EFFECT: "将[GetPerk('synergy_3_perk').GetName( GetNullCharacter )]的[coterie|E]中[GetTrait('psychic').GetName( GetPlayer )]的限制增加2个。  \n#weak 建立协同链接的灵能者可以同时使用多种心灵能力。#!"
 SYNERGY_5_PERK_EFFECT: "移除[GetPerk('synergy_3_perk').GetName( GetNullCharacter )]中[coterie|E]的[GetTrait('psychic').GetName( GetPlayer )]限制。  \n#weak 建立协同链接的灵能者可以将他们的灵能力量合众为一。#!"
 telepathy_1_perk_name: "一阶心灵感应"
 telepathy_2_perk_name: "二阶心灵感应"
 telepathy_3_perk_name: "三阶心灵感应"
 telepathy_4_perk_name: "四阶心灵感应"
 telepathy_5_perk_name: "五阶心灵感应"
 alchemy_1_perk_name: "一阶炼金"
 ALCHEMY_1_PERK_EFFECT: "解锁配方：[GetModifier('light_painstopper_modifier').GetNameWithTooltip]、[GetModifier('small_fertility_booster_modifier').GetNameWithTooltip]、[GetModifier('small_fertility_downer_modifier').GetNameWithTooltip]、[GetModifier('simple_antibiotics_modifier').GetNameWithTooltip]、[GetModifier('mild_poison_modifier').GetNameWithTooltip]\n#flavor 施术者通过炼金仪式完善和组合物质，最终净化自己的灵魂。\n炼金术师可以创造出更高级、更强效的化合物和纯净物，而这些化合物和纯净物都是已有化学物质的升级版。这些化合物不会被算作是魔法物质。#!"
 alchemy_2_perk_name: "二阶炼金"
 ALCHEMY_2_PERK_EFFECT: "解锁配方：[GetModifier('painstopper_modifier').GetNameWithTooltip]、[GetModifier('fertility_booster_modifier').GetNameWithTooltip]、[GetModifier('fertility_downer_modifier').GetNameWithTooltip]、[GetModifier('antibiotics_modifier').GetNameWithTooltip]、[GetModifier('dangerous_poison_modifier').GetNameWithTooltip]\n#flavor 一阶的更先进版本。其中一些物质可以让服用者超越正常的身体极限，或在梦境或幻觉中获得更多神秘的感知。#!"
 alchemy_3_perk_name: "三阶炼金"
 ALCHEMY_3_PERK_EFFECT: "解锁配方：[GetModifier('potion_of_diplomacy_modifier').GetNameWithTooltip]（等）、[GetModifier('potion_of_strength_modifier').GetNameWithTooltip]、[GetModifier('deadly_poison_modifier').GetNameWithTooltip]\n#flavor 炼金术师可以制造将目标提升到超人水平的物质，或制造超出正常限制的材料（超强合金等）。例如，有些物质可以在有限的时间内（不超过一小时左右）暂时赋予服用者一些低级的灵能能力。#!"
 alchemy_4_perk_name: "四阶炼金"
 ALCHEMY_4_PERK_EFFECT: "解锁配方：[GetModifier('potent_potion_of_diplomacy_modifier').GetNameWithTooltip]（等）、[GetModifier('potent_potion_of_strength_modifier').GetNameWithTooltip]、[GetModifier('personal_poison_modifier').GetNameWithTooltip]\n#flavor 炼金术师可以制造出能增强属性的物质，甚至超过正常人的最大值，或具有某种强效作用的小道具。#!"
 alchemy_5_perk_name: "五阶炼金"
 ALCHEMY_5_PERK_EFFECT: "解锁配方：[GetModifier('philosophers_stone_modifier').GetNameWithTooltip]、[GetModifier('elixir_of_diplomacy_modifier').GetNameWithTooltip]（等）、[GetModifier('elixir_of_strength_modifier').GetNameWithTooltip]、[GetModifier('elixir_of_death_modifier').GetNameWithTooltip]、[GetModifier('elixir_of_potence_modifier').GetNameWithTooltip]、[GetModifier('elixir_of_celebrity_modifier').GetNameWithTooltip]、[GetModifier('elixir_of_fortitude_modifier').GetNameWithTooltip]、[GetModifier('elixir_of_auspex_modifier').GetNameWithTooltip]\n#flavor 拥有这一级别的知识的炼金术师可以复制超自然生物的能力，包括灵赋、血律和其他最高三级的能力。他们还可以复制这些生物与生俱来的能力（妖精、死灵和浸染者的能力无法复制）。#!"
 alchemy_6_perk_name: "六阶炼金"
 ALCHEMY_6_PERK_EFFECT_SAMUEL: "解锁配方：[GetModifier('elixir_immortality_modifier').GetNameWithTooltip]、[GetModifier('vampire_concoction_modifier').GetNameWithTooltip]、[GetModifier('kinfolk_elixir_modifier').GetNameWithTooltip]、[GetModifier('kinain_elixir_modifier').GetNameWithTooltip]"
 ALCHEMY_6_PERK_EFFECT_NOT_SAMUEL: "解锁配方：[GetModifier('elixir_immortality_modifier').GetNameWithTooltip]、[GetModifier('vampire_concoction_modifier').GetNameWithTooltip]"
 ALCHEMY_6_PERK_EFFECT: "#flavor 炼金术师已经登峰造极，能够创造出贤者之石，获得永生，或将一种元素转化为另一种元素。从理论上讲，炼金术师甚至可以制造出一种药剂，将人变成吸血鬼、狼人或其他生物。这阶级还能让炼金术师觉醒为法师。#!"
 conjuration_1_perk_name: "一阶咒法"
 CONJURATION_1_PERK_EFFECT: "作为[character_interaction|E]，施术者可以标记[artifact|E]给予它[GetModifier('sorcery_conjuration_mark_1_modifier').GetNameWithTooltip]修正\n#flavor 施术者可以用魔法的力量移动事先准备好的物体。\n咒法师可以将10英尺范围内的一个小物体移动数英尺。#!"
 conjuration_2_perk_name: "二阶咒法"
 CONJURATION_2_PERK_EFFECT: "增强标记[artifact|E][character_interaction|E]，给予[GetModifier('sorcery_conjuration_mark_2_modifier').GetNameWithTooltip]修正\n#flavor 咒法师可以移动简单的物品，或在最远15英尺的范围内将它们从另一个地方变出来。#!"
 conjuration_3_perk_name: "三阶咒法"
 CONJURATION_3_PERK_EFFECT: "增强标记[artifact|E][character_interaction|E]，给予[GetModifier('sorcery_conjuration_mark_3_modifier').GetNameWithTooltip]修正\n#flavor 咒法师可以移动更大、更复杂的物体。除了将其变出，他们还可以将其悬浮在空中。物体的重量不得超过200磅，且必须在25英尺范围内。#!"
 conjuration_4_perk_name: "四阶咒法"
 CONJURATION_4_PERK_EFFECT: "增强标记[artifact|E][character_interaction|E]，允许给予两个[GetModifier('sorcery_conjuration_mark_4_modifier').GetNameWithTooltip]修正\n#flavor 咒法师可以移动钢琴一般的大型物体，甚至可以移动质量至少为人类一半的复杂生命体。最大移动范围为50英尺。#!"
 conjuration_5_perk_name: "五阶咒法"
 CONJURATION_5_PERK_EFFECT: "增强标记[artifact|E][character_interaction|E]，允许给予三个[GetModifier('sorcery_conjuration_mark_5_modifier').GetNameWithTooltip]修正\n作为[character_interaction|E]，允许施术者偷窃[artifact|E]\n#flavor 咒法师可以移动或召唤人类，前提是被召唤者自愿或失去知觉。可在60英尺范围内召唤物体。#!"
 conjuration_6_perk_name: "六阶咒法"
 CONJURATION_6_PERK_EFFECT: "增强标记[artifact|E][character_interaction|E]，允许给予四个[GetModifier('sorcery_conjuration_mark_6_modifier').GetNameWithTooltip]修正\n招募宾客互动花费：#P -100%#!\n增强偷窃[artifact|E][character_interaction|E]的成功概率和距离\n#flavor 咒法师可以在100英里范围内变幻和移动卡车大小的物体，以及多达三个人类大小的生命体。#!"
 conveyance_1_perk_name: "一阶转移"
 CONVEYANCE_1_PERK_EFFECT: "#flavor 允许施术者借助用仪式制造的载具出行。\n施术者可以跨越大约 10 英尺的距离。#!"
 conveyance_2_perk_name: "二阶转移"
 CONVEYANCE_2_PERK_EFFECT: "#flavor 施术者可以将自己和20磅重的物品运过大约100英尺的距离。#!"
 conveyance_3_perk_name: "三阶转移"
 CONVEYANCE_3_PERK_EFFECT: "#flavor 施术者可以将自己和另外一人运送到大约一英里以外的地方。#!"
 conveyance_4_perk_name: "四阶转移"
 CONVEYANCE_4_PERK_EFFECT: "作为[character_interaction|E]，允许你将任意军队传送到小型国度一般远所在地（约威尔士从上到下的距离）。\n#flavor 施术者可以将自己和另外两名乘客运送到大约5英里以外的地方。#!"
 conveyance_5_perk_name: "五阶转移"
 CONVEYANCE_5_PERK_EFFECT: "作为[character_interaction|E]，允许你将任意军队传送到外交距离内的所在地。\n#flavor 施术者可以将自己和另外三名乘客运送到大约10英里以外的地方。#!"
 conveyance_6_perk_name: "六阶转移"
 CONVEYANCE_6_PERK_EFFECT: "作为[character_interaction|E]，允许你将任意军队传送到地图内的任意所在地。\n#flavor 施术者可以将自己和另外五名乘客运送到大约100英里以外的地方。#!"
 cursing_1_perk_name: "一阶诅咒"
 CURSING_1_PERK_EFFECT: "作为[character_interaction|E]，允许给予目标[GetModifier('sorcery_small_blesing_modifier').GetNameWithTooltip]或[GetModifier('sorcery_small_curse_modifier').GetNameWithTooltip]。\n#flavor 施展咒术、诅咒和祝福的术艺。\n针对一个人的短暂的不便或微小的祝福。#!"
 cursing_2_perk_name: "二阶诅咒"
 CURSING_2_PERK_EFFECT: "作为[character_interaction|E]，允许给予目标近亲[GetModifier('sorcery_small_blesing_modifier').GetNameWithTooltip]或[GetModifier('sorcery_small_curse_modifier').GetNameWithTooltip]。\n#flavor 针对单个目标和其关系密切的人或朋友的持久伤害、尴尬或祝福。#!"
 cursing_3_perk_name: "三阶诅咒"
 CURSING_3_PERK_EFFECT: "作为[character_interaction|E]，允许给予目标家庭[GetModifier('sorcery_blesing_modifier').GetNameWithTooltip]或[GetModifier('sorcery_curse_modifier').GetNameWithTooltip]。\n#flavor 针对单个目标和其关系密切的人或朋友的持久伤害、尴尬或祝福。#!"
 cursing_4_perk_name: "四阶诅咒"
 CURSING_4_PERK_EFFECT: "作为[character_interaction|E]，允许给予目标家族[GetModifier('sorcery_blesing_modifier').GetNameWithTooltip]或[GetModifier('sorcery_curse_modifier').GetNameWithTooltip]。\n#flavor 一场持久的疾病、伤害或祝福会降临到一个人及其亲友身上。#!"
 cursing_5_perk_name: "五阶诅咒"
 CURSING_5_PERK_EFFECT: "作为[character_interaction|E]，允许给予目标家族[GetModifier('sorcery_huge_blesing_modifier').GetNameWithTooltip]或[GetModifier('sorcery_serious_curse_modifier').GetNameWithTooltip]。\n#flavor 死亡会降临一个人及其所有的亲戚和朋友上，或者是能阻止死亡的强大祝福，或者是天降的巨大财富，它可以持续数年之久#!"
 cursing_6_perk_name: "六阶诅咒"
 CURSING_6_PERK_EFFECT: "作为[character_interaction|E]，允许给予目标宗族[GetModifier('sorcery_huge_blesing_modifier').GetNameWithTooltip]或[GetModifier('sorcery_serious_curse_modifier').GetNameWithTooltip]。\n#flavor 该诅咒或祝福如此强大，可以世代相传。如果有一种命运比死亡更可怕，或者有一种方法可以永远欺骗死亡，那就是这种程度的诅咒或祝福。#!"
 divination_1_perk_name: "一阶占卜"
 DIVINATION_1_PERK_EFFECT: "#flavor 通过某种占卜方式，施术者可以看到过去或未来发生的事件。\n大致准确的看到过去或未来一周。#!"
 divination_2_perk_name: "二阶占卜"
 DIVINATION_2_PERK_EFFECT: "#flavor 以显著的准确性看到过去或未来的一个月。#!"
 divination_3_perk_name: "三阶占卜"
 DIVINATION_3_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n#flavor 更准确地看到过去或未来一年的情况。#!"
 divination_4_perk_name: "四阶占卜"
 DIVINATION_4_PERK_EFFECT: "#flavor 以惊人的准确度看到十年内的过去或未来。#!"
 divination_5_perk_name: "五阶占卜"
 DIVINATION_5_PERK_EFFECT: "#flavor 准确无误地看到过去或未来的一生。#!"
 divination_6_perk_name: "六阶占卜"
 DIVINATION_6_PERK_EFFECT: "#flavor 尽可能预见过去或未来。即使占卜是错误的，也将包含着部分真相。#!"
 dowsing_1_perk_name: "一阶探测术"
 DOWSING_1_PERK_EFFECT: "作为[character_interaction|E]，允许你获得微量金钱。\n#flavor 探测术是一种用魔法手段寻找遗失物品的方法。\n探测术师可以在半径50英尺的范围内找到一件小物品。探测术师还能感知与自己有关的是非问题。#!"
 dowsing_2_perk_name: "二阶探测术"
 DOWSING_2_PERK_EFFECT: "作为[character_interaction|E]，允许你获得小量金钱。\n#flavor 探测术师可以找到方圆一英里内的任何私人物品。探测术师还能感知与他人有关的是非问题。#!"
 dowsing_3_perk_name: "三阶探测术"
 DOWSING_3_PERK_EFFECT: "作为[character_interaction|E]，允许你获得中量金钱。\n#flavor 探测术师可以在任何地方找到任何个人物品，同时还能找到一英里范围内的其他物品和元素堆积（如假墙后面的空气）。探测术师还能获得明确的感应与自己有关的简单是非问题。#!"
 dowsing_4_perk_name: "四阶探测术"
 DOWSING_4_PERK_EFFECT: "作为[character_interaction|E]，允许你获得大量金钱。\n#flavor 探测术师可以立即找到个人物品以及属于他人的物品。探测术师还能感知魔法、隐藏的情绪和疾病。#!"
 dowsing_5_perk_name: "五阶探测术"
 DOWSING_5_PERK_EFFECT: "作为[character_interaction|E]，允许你获得巨量金钱。\n#flavor 探测术师可以立即找到任何物品，也可以找到黄金等特定物质。#!"
 enchantment_1_perk_name: "一阶附魔"
 ENCHANTMENT_1_PERK_EFFECT: "允许加强[artifact|E]，给予对应修正，但有#N -20%#!$MOD_STRESS_LOSS_MULT$\n#flavor 附魔，允许制造小型魔法护符\n附魔师制作的小物品用途有限，影响范围很小。#!"
 enchantment_2_perk_name: "二阶附魔"
 ENCHANTMENT_2_PERK_EFFECT: "允许加强[artifact|E]，给予对应修正以及加强#V 1#!项属性，但有#N -20%#!$MOD_STRESS_LOSS_MULT$\n#flavor 附魔师可以制作出威力更大的护身符，让人感受到魔法的威力。#!"
 enchantment_3_perk_name: "三阶附魔"
 ENCHANTMENT_3_PERK_EFFECT: "允许加强[artifact|E]，给予对应修正以及加强#V 1#!项属性，但有#N -20%#!$MOD_STRESS_LOSS_MULT$\n#flavor 附魔师可以具有明显的魔法功能的护身符。#!"
 enchantment_4_perk_name: "四阶附魔"
 ENCHANTMENT_4_PERK_EFFECT: "允许加强[artifact|E]，给予对应修正以及加强#V 2#!项属性，但有#N -20%#!$MOD_STRESS_LOSS_MULT$\n#flavor 附魔师制作的护身符能够突破共识的若干限制。#!"
 enchantment_5_perk_name: "五阶附魔"
 ENCHANTMENT_5_PERK_EFFECT: "允许加强[artifact|E]，给予对应修正以及加强#V 2#!项属性，但有#N -20%#!$MOD_STRESS_LOSS_MULT$\n#flavor 附魔师制造的护身符具有近乎奇迹的力量。#!"
 enchantment_6_perk_name: "六阶附魔"
 ENCHANTMENT_6_PERK_EFFECT: "允许加强[artifact|E]，给予对应修正以及加强#V 3#!项属性，但有#N -20%#!$MOD_STRESS_LOSS_MULT$\n#flavor 附魔师制造出传奇宝物。#!"
 ephemera_1_perk_name: "一阶游灵"
 EPHEMERA_1_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]\n#flavor 游灵道途允许施术者与[UmbraGlossary('spirit_wilds')]互动。\n感受险棘背后的诸灵活动。#!"
 ephemera_2_perk_name: "二阶游灵"
 EPHEMERA_2_PERK_EFFECT: "解锁$POD_summon_spirit_on_death_interaction$\n#flavor 学会区分险棘背后的各种灵类，并尝试将它们带入物质世界。#!"
 ephemera_3_perk_name: "三阶游灵"
 EPHEMERA_3_PERK_EFFECT: "能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n#flavor 学会联系特定的灵类来应对它。#!"
 ephemera_4_perk_name: "四阶游灵"
 EPHEMERA_4_PERK_EFFECT: "#flavor 学会感知周围的短暂事物，看到险棘之外的诸灵。#!"
 ephemera_5_perk_name: "五阶游灵"
 EPHEMERA_5_PERK_EFFECT: "#flavor 学会命令诸灵听从你的吩咐。#!"
 ephemera_6_perk_name: "六阶游灵"
 EPHEMERA_6_PERK_EFFECT: "允许在灵游时进入[UmbraGlossary('spirit_wilds')]。\n#flavor 以星光投影形态走出险棘。#!"
 fascination_1_perk_name: "一阶惑控"
 FASCINATION_1_PERK_EFFECT: "#flavor 惑控可以让用户让目标爱上另一个人。\n让目标对你有好感。#!"
 fascination_2_perk_name: "二阶惑控"
 FASCINATION_2_PERK_EFFECT: "#flavor 讨大众喜欢。#!"
 fascination_3_perk_name: "三阶惑控"
 FASCINATION_3_PERK_EFFECT: "#flavor 让人们为你主动让路。#!"
 fascination_4_perk_name: "四阶惑控"
 FASCINATION_4_PERK_EFFECT: "#flavor 让人们主动寻求你的认可。#!"
 fascination_5_perk_name: "五阶惑控"
 FASCINATION_5_PERK_EFFECT: "作为[character_interaction|E]，允许你获得对对方的弱牵制。\n#flavor 让人们对你死心塌地。#!"
 fascination_6_perk_name: "六阶惑控"
 FASCINATION_6_PERK_EFFECT: "作为[character_interaction|E]，允许你获得对对方的强牵制。\n#flavor 让人们成为你的死忠下仆。#!"
 healing_1_perk_name: "一阶治疗术"
 HEALING_1_PERK_EFFECT: "作为[character_interaction|E]，允许治疗伤疤。\n#flavor 施术者可以治愈伤口、疾病和类似的病痛\n在有限的时间内舒缓轻伤和衰弱。#!"
 healing_2_perk_name: "二阶治疗术"
 HEALING_2_PERK_EFFECT: "作为[character_interaction|E]，允许治疗小病。\n#flavor 治愈伤口和感染等疾病。#!"
 healing_3_perk_name: "三阶治疗术"
 HEALING_3_PERK_EFFECT: "作为[character_interaction|E]，允许治疗伤口。\n#flavor 修补骨折，让失去行动能力的人重新站起来。#!"
 healing_4_perk_name: "四阶治疗术"
 HEALING_4_PERK_EFFECT: "作为[character_interaction|E]，允许治疗疾病。\n#flavor 修复复合骨折和严重创伤，加快愈合过程，防止感染，以及治疗哮喘等慢性疾病。#!"
 healing_5_perk_name: "五阶治疗术"
 HEALING_5_PERK_EFFECT: "作为[character_interaction|E]，允许治疗残疾。\n#flavor 治愈近乎致命的伤口，永久治愈艾滋病或癌症等恶疾。#!"
 healing_6_perk_name: "六阶治疗术"
 HEALING_6_PERK_EFFECT: "作为[character_interaction|E]，允许防止朋友、爱人、侧室、家人、内阁或骑士的意外死亡。\n#flavor 让最近死亡的人复活。但是，如果不立即接受治疗，患者很可能会再次死亡。#!"
 hellfire_1_perk_name: "一阶地狱火"
 HELLFIRE_1_PERK_EFFECT: "#flavor 地狱火赋予施术者巨大的破坏力。\n术士必须通过徒手格斗攻击才能造成伤害。#!"
 hellfire_2_perk_name: "二阶地狱火"
 HELLFIRE_2_PERK_EFFECT: "#flavor 地狱可在小范围内使用。#!"
 hellfire_3_perk_name: "三阶地狱火"
 HELLFIRE_3_PERK_EFFECT: "#flavor 地狱火可以在不超过几平方码左右的范围内使用，或在小于25英尺的距离内使用。#!"
 hellfire_4_perk_name: "四阶地狱火"
 HELLFIRE_4_PERK_EFFECT: "#flavor 地狱火可以在10平方英尺的范围内使用（可以显现成墙、圆圈或其他形式），也可以在大约50英尺的距离内使用。#!"
 hellfire_5_perk_name: "五阶地狱火"
 HELLFIRE_5_PERK_EFFECT: "#flavor 地狱火可在20平方英尺范围内使用，也可对150英尺范围内的任何目标使用。#!"
 hellfire_6_perk_name: "六阶地狱火"
 HELLFIRE_6_PERK_EFFECT: "#flavor 地狱火可在40平方英尺范围内使用，也可对300英尺范围内的任何目标使用。#!"
 herbalism_1_perk_name: "一阶草药术"
 HERBALISM_1_PERK_EFFECT: "解锁配方：[GetModifier('potion_of_health_modifier').GetNameWithTooltip]\n#flavor 与附魔和炼金类似，草药学涉及用自然元素调配出强大的药剂。\n治疗轻微的疼痛和类似的效果，不被视为魔法。#!"
 herbalism_2_perk_name: "二阶草药术"
 HERBALISM_2_PERK_EFFECT: "解锁配方：[GetModifier('potent_potion_of_health_modifier').GetNameWithTooltip]\n#flavor 制作效果被视为奇迹，但本身并不完全算魔法的药剂。#!"
 herbalism_3_perk_name: "三阶草药术"
 HERBALISM_3_PERK_EFFECT: "解锁配方：[GetModifier('elixir_of_health_modifier').GetNameWithTooltip]\n#flavor 调制出效果明显非凡的配方。#!"
 herbalism_4_perk_name: "四阶草药术"
 HERBALISM_4_PERK_EFFECT: "解锁配方：[GetModifier('potent_elixir_of_health_modifier').GetNameWithTooltip]\n#flavor 在共识场的基础上创造奇迹。#!"
 herbalism_5_perk_name: "五阶草药术"
 HERBALISM_5_PERK_EFFECT: "解锁配方：[GetModifier('elixir_of_life_modifier').GetNameWithTooltip]\n#flavor 制作明显的魔法药水，其效果可能不是立竿见影的，而是缓慢而微妙的。#!"
 mana_manipulation_1_perk_name: "一阶法力操控"
 MANA_MANIPULATION_1_PERK_EFFECT: "降低术法能力的花费。\n#flavor 法力操控处理的是施术者所感知到的原始魔法元素。\n学会感知周围的能量。#!"
 mana_manipulation_2_perk_name: "二阶法力操控"
 MANA_MANIPULATION_2_PERK_EFFECT: "降低术法能力的花费。\n#flavor 学习感知物体和生物的能量。#!"
 mana_manipulation_3_perk_name: "三阶法力操控"
 MANA_MANIPULATION_3_PERK_EFFECT: "降低术法能力的花费。\n#flavor 学会改变或置换周围的能量流。#!"
 mana_manipulation_4_perk_name: "四阶法力操控"
 MANA_MANIPULATION_4_PERK_EFFECT: "降低术法能力的花费。\n#flavor 学会操纵个人能量库，并从外部补充能量。#!"
 mana_manipulation_5_perk_name: "五阶法力操控"
 MANA_MANIPULATION_5_PERK_EFFECT: "降低术法能力的花费。\n#flavor 学会直接将法力用于你的法术或操纵法力共鸣。#!"
 mana_manipulation_6_perk_name: "六阶法力操控"
 MANA_MANIPULATION_6_PERK_EFFECT: "降低术法能力的花费。\n#flavor 创造出临时的节点。#!"
 oneiromancy_1_perk_name: "一阶梦占"
 ONEIROMANCY_1_PERK_EFFECT: "作为[character_interaction|E]，给予目标[GetModifier('sorcery_dreamless_modifier').GetNameWithTooltip]\n#flavor 使用梦占，施术者可以访问他人的梦境和[UmbraGlossary('dreaming')]\n触摸他人的梦境。#!"
 oneiromancy_2_perk_name: "二阶梦占"
 ONEIROMANCY_2_PERK_EFFECT: "作为[character_interaction|E]，提升目标对你的好感\n#flavor 学会暂时成为他人梦境的一部分。#!"
 oneiromancy_3_perk_name: "三阶梦占"
 ONEIROMANCY_3_PERK_EFFECT: "作为[character_interaction|E]，给予目标[GetModifier('sorcery_bad_dreams_modifier').GetNameWithTooltip]或[GetModifier('sorcery_good_dreams_modifier').GetNameWithTooltip]\n#flavor 学会观察他人的梦境，但又不成为梦境的一部分，同时还能操纵梦境。#!"
 oneiromancy_4_perk_name: "四阶梦占"
 ONEIROMANCY_4_PERK_EFFECT: "将[GetModifier('sorcery_bad_dreams_modifier').GetNameWithTooltip]和[GetModifier('sorcery_good_dreams_modifier').GetNameWithTooltip][modifier|E]增强为[GetModifier('sorcery_bad_dreams_enchanced_modifier').GetNameWithTooltip]和[GetModifier('sorcery_good_dreams_enchanced_modifier').GetNameWithTooltip]\n#flavor 学会掌控他人的梦。#!"
 oneiromancy_5_perk_name: "五阶梦占"
 ONEIROMANCY_5_PERK_EFFECT: "允许在灵游时进入[UmbraGlossary('dreaming')]\n#flavor 学会将多个梦合而为一。#!"
 oneiromancy_6_perk_name: "六阶梦占"
 ONEIROMANCY_6_PERK_EFFECT: "作为[character_interaction|E]，允许你获得#V 2000#![GetMaA('monsters').GetName]\n#flavor 在有限的时间内，让梦中的生物化为现实。#!"
 saturnal_manes_1_perk_name: "一阶祖灵农神祭"
 SATURNAL_MANES_1_PERK_EFFECT: "解锁[bind_wraith_interaction|E]\n#flavor 通过在月下举行狂欢仪式，修行者可以召唤诸灵来满足自己的需求。\n召唤灵类。#!"
 saturnal_manes_2_perk_name: "二阶祖灵农神祭"
 SATURNAL_MANES_2_PERK_EFFECT: "解锁[command_wraith_interaction|E]\n#flavor 命令灵类。#!"
 saturnal_manes_3_perk_name: "三阶祖灵农神祭"
 SATURNAL_MANES_3_PERK_EFFECT: "解锁[summon_wraith_on_death_interaction|E]\n解锁$EXECUTION_CONVERT_TO_WRAITH$[execution|E]\n最大束缚死灵数量：#P +2#!\n#flavor 召唤或指挥幽灵，而非灵类。#!"
 saturnal_manes_4_perk_name: "四阶祖灵农神祭"
 SATURNAL_MANES_4_PERK_EFFECT: "最大束缚死灵数量：#P +2#!\n作为[character_interaction|E]，允许你吞噬受缚死灵来增强教育和属性。\n#flavor 利用诸灵的影响来提升你的天赋。#!"
 saturnal_manes_5_perk_name: "五阶祖灵农神祭"
 SATURNAL_MANES_5_PERK_EFFECT: "作为[character_interaction|E]，允许你降低本地死灵对目标的好感度并伤害目标。\n#flavor 使愤怒的诸灵攻击目标。#!"
 shadowcasting_1_perk_name: "一阶影术"
 SHADOWCASTING_1_PERK_EFFECT: "#flavor 影术又称阴影道途，关注对黑暗的控制。\n操纵光线使阴影变暗和加深。#!"
 shadowcasting_2_perk_name: "二阶影术"
 SHADOWCASTING_2_PERK_EFFECT: "#flavor 操纵阴影弯曲声波，让自己更容易隐藏。当施放在他人身上时，该人的思维就会开始作怪。#!"
 shadowcasting_3_perk_name: "三阶影术"
 SHADOWCASTING_3_PERK_EFFECT: "#flavor 操纵阴影来掩盖色彩。投射到他人身上时，对方会陷入恐慌。#!"
 shadowcasting_4_perk_name: "四阶影术"
 SHADOWCASTING_4_PERK_EFFECT: "#flavor 操纵阴影使电子设备失灵。其他看到阴影的人则会陷入恐惧之中。#!"
 shadowcasting_5_perk_name: "五阶影术"
 SHADOWCASTING_5_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L]变形选项\n#flavor 操纵阴影，将自己完全隐藏起来，不为凡人所见。看到阴影的其他人会因此变得疯狂。#!"
 shadowcasting_6_perk_name: "六阶影术"
 SHADOWCASTING_6_PERK_EFFECT: "能够招募[GetMaA('shades').GetName]作为[men_at_arms|E]。\n#flavor 将影子化成实体，或熄灭半径50英尺范围内的任何灯光。#!"
 shapeshifting_1_perk_name: "一阶变形术"
 SHAPESHIFTING_1_PERK_EFFECT: "解锁变形[character_interaction|E]。\n#flavor 施术者可以操纵自己的身体形态。\n轻微的外观变化，如头发颜色。#!"
 shapeshifting_2_perk_name: "二阶变形术"
 SHAPESHIFTING_2_PERK_EFFECT: "解锁年龄变形选项。\n#flavor 外观上的重大变化，比如身高。#!"
 shapeshifting_3_perk_name: "三阶变形术"
 SHAPESHIFTING_3_PERK_EFFECT: "解锁动物部位变形选项。\n#flavor 用动物的身体部位替代人的身体部位。#!"
 shapeshifting_4_perk_name: "四阶变形术"
 SHAPESHIFTING_4_PERK_EFFECT: "允许拥有四种动物部位。\n#flavor 用动物的身体部位替代人体的多个部位。#!"
 shapeshifting_5_perk_name: "五阶变形术"
 SHAPESHIFTING_5_PERK_EFFECT: "解锁动物形态变形选项。\n#flavor 完全变成动物。#!"
 shapeshifting_6_perk_name: "六阶变形术"
 SHAPESHIFTING_6_PERK_EFFECT: "解锁逝兽形态变形选项。\n#flavor 完全蜕变成神话中的动物。#!"
 spirit_chasing_1_perk_name: "一阶追灵"
 SPIRIT_CHASING_1_PERK_EFFECT: "#flavor 施术者与一种植物或动物的灵魂建立联系。\n从所选择类型的食物中获得全部营养。#!"
 spirit_chasing_2_perk_name: "二阶追灵"
 SPIRIT_CHASING_2_PERK_EFFECT: "作为[character_interaction|E]，提升任意属性为#V 2#!。\n#flavor 从所选择类型中获得感知。#!"
 spirit_chasing_3_perk_name: "三阶追灵"
 SPIRIT_CHASING_3_PERK_EFFECT: "作为[decision|E]，允许进入[GetTrait('torpor').GetName( GetNullCharacter )]并退位。\n#flavor 设法进入再生睡眠，治愈你的伤口。#!"
 spirit_chasing_4_perk_name: "四阶追灵"
 SPIRIT_CHASING_4_PERK_EFFECT: "#flavor 从所选择类型的同类个体中获得启示（例如，从一棵树身上了解到它周围发生了什么）。#!"
 spirit_chasing_5_perk_name: "五阶追灵"
 SPIRIT_CHASING_5_PERK_EFFECT: "作为[character_interaction|E]，允许选择动物能力来强化自己。\n#flavor 从所选择类型中获得能力。#!"
 summoning_warding_and_binding_1_perk_name: "一阶召唤、封印、束缚"
 SUMMONING_WARDING_AND_BINDING_1_PERK_EFFECT: "作为[character_interaction|E]，允许召唤动物作为宠物。\n#flavor 由召唤、封印、束缚生物组成的复杂道途是最危险的修炼之一。\n简单的生物，如鸟类，可以被召唤和指挥。#!"
 summoning_warding_and_binding_2_perk_name: "二阶召唤、封印、束缚"
 SUMMONING_WARDING_AND_BINDING_2_PERK_EFFECT: "作为[character_interaction|E]，允许召唤动物作为坐骑。\n#flavor 可以召唤和指挥狼等大型生物。。#!"
 summoning_warding_and_binding_3_perk_name: "三阶召唤、封印、束缚"
 SUMMONING_WARDING_AND_BINDING_3_PERK_EFFECT: "解锁召唤[character_interaction|E]，允许你召唤无地凡人到你的宫廷。\n#flavor 可以召唤和指挥人类。#!"
 summoning_warding_and_binding_4_perk_name: "四阶召唤、封印、束缚"
 SUMMONING_WARDING_AND_BINDING_4_PERK_EFFECT: "解锁召唤[character_interaction|E]，允许你召唤无地次等超自然到你的宫廷。\n#flavor 可以召唤和指挥血仆和亲族等次等超自然生物。#!"
 summoning_warding_and_binding_5_perk_name: "五阶召唤、封印、束缚"
 SUMMONING_WARDING_AND_BINDING_5_PERK_EFFECT: "解锁召唤[character_interaction|E]，允许你召唤无地超自然（恶魔除外）到你的宫廷。\n#flavor 可以召唤和指挥法师或狼人等主要超自然生物。#!"
 summoning_warding_and_binding_6_perk_name: "六阶召唤、封印、束缚"
 SUMMONING_WARDING_AND_BINDING_6_PERK_EFFECT: "解锁召唤[character_interaction|E]，允许你召唤无地恶魔到你的宫廷。\n#flavor 可以召唤和命令天使、诸神或恶魔等天外实体。#!"
 weather_control_1_perk_name: "一阶天气操控"
 WEATHER_CONTROL_1_PERK_EFFECT: "允许预测自然灾害。\n#flavor 该道途也被称为天气术，施术者可以通过该道途操纵天气规律，为自己谋利。\n在有限的区域内造成天气式样的小规模突然扰动。#!"
 weather_control_2_perk_name: "二阶天气操控"
 WEATHER_CONTROL_2_PERK_EFFECT: "#flavor 在更大的区域内造成天气式样的小规模突然扰动。#!"
 weather_control_3_perk_name: "三阶天气操控"
 WEATHER_CONTROL_3_PERK_EFFECT: "#flavor 导致一个地区的气候发生剧烈变化。#!"
 weather_control_4_perk_name: "四阶天气操控"
 WEATHER_CONTROL_4_PERK_EFFECT: "#flavor 改变有限区域的气候。#!"
 weather_control_5_perk_name: "五阶天气操控"
 WEATHER_CONTROL_5_PERK_EFFECT: "#flavor 改变更大区域的气候。#!"
 weather_control_6_perk_name: "六阶天气操控"
 WEATHER_CONTROL_6_PERK_EFFECT: "解锁天气术[character_interaction|E]\n#flavor 呼唤飓风等大自然的破坏力。#!"
 via_geniorum_1_perk_name: "显圣仪式"
 via_geniorum_2_perk_name: "防护仪式"
 via_geniorum_3_perk_name: "拒绝仪式"
 via_geniorum_4_perk_name: "召唤仪式"
 via_geniorum_5_perk_name: "束缚仪式"
 via_ignis_1_perk_name: "一阶狱火之道"
 via_ignis_2_perk_name: "二阶狱火之道"
 via_ignis_3_perk_name: "三阶狱火之道"
 via_ignis_4_perk_name: "四阶狱火之道"
 via_ignis_5_perk_name: "五阶狱火之道"
 via_medicamenti_1_perk_name: "一阶药医之道"
 via_medicamenti_2_perk_name: "二阶药医之道"
 via_medicamenti_3_perk_name: "三阶药医之道"
 via_medicamenti_4_perk_name: "四阶药医之道"
 via_medicamenti_5_perk_name: "五阶药医之道"
 via_necromantiae_1_perk_name: "唤醒仪式"
 via_necromantiae_2_perk_name: "守护仪式"
 via_necromantiae_3_perk_name: "交流仪式"
 via_necromantiae_4_perk_name: "驱逐仪式"
 via_necromantiae_5_perk_name: "活化仪式"
 via_oraculi_1_perk_name: "一阶神谕之道"
 via_oraculi_2_perk_name: "二阶神谕之道"
 via_oraculi_3_perk_name: "三阶神谕之道"
 via_oraculi_4_perk_name: "四阶神谕之道"
 via_oraculi_5_perk_name: "五阶神谕之道"
 VIA_GENIORUM_1_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]\n当你在物质世界中时，也可以与[umbra|E]的存在互动。\n#F 该领域涉及诸灵和恶魔的领域。知道灵类的真名，就能获得战胜它的力量。神怪之道汇编了按威力分级的特定仪式。\n神通术师并不窥探[spirit_world|E]，而是命令附近的超自然生物显露身形。#!"
 VIA_GENIORUM_2_PERK_EFFECT: "你将不再会被[GetTrait('wraith').GetName( GetNullCharacter )]附身。\n作为[character_interaction|E]，允许你学习目标的真名\n#F 神通术师可以在手持物品上或在她周围的小范围内绘制防护符文。#!"
 VIA_GENIORUM_3_PERK_EFFECT: "使$POD_demon_unearthbound_decision$[decision|E]免费。\n作为[character_interaction|E]，允许你放逐目标恶魔角色到[UmbraGlossary('abyss')]。\n作为[character_interaction|E]，允许你放逐目标妖精角色到[UmbraGlossary('arcadia')]。\n#F 神通术师可以将灵类送回它的原属界域。#!"
 VIA_GENIORUM_4_PERK_EFFECT: "能够招募[GetMaA('materialized_spirits').GetName]和[GetMaA('imps').GetName]作为[men_at_arms|E]\n#F 神通术师现在可以召唤灵类实体。#!"
 VIA_GENIORUM_5_PERK_EFFECT: "能够招募[GetMaA('jagglings').GetName]和[GetMaA('lucifergia').GetName]作为[men_at_arms|E]\n#F 神通术师现在可以强迫灵类臣服。#!"
 VIA_IGNIS_1_PERK_EFFECT: "#F 该道途能让受诅咒者在终焉之死前体验地狱之火。该道途召唤的看上去像普通火焰，但它甚至会灼伤那些受到免疫普通火焰的人。\n神通术师可以召唤烛焰大小的圣火。#!"
 VIA_IGNIS_2_PERK_EFFECT: "#F 神通术师可以召唤一小团圣火。#!"
 VIA_IGNIS_3_PERK_EFFECT: "#F 神通术师可以召唤营火大小的圣火。#!"
 VIA_IGNIS_4_PERK_EFFECT: "#F 神通术师可以召唤篝火大小的圣火。#!"
 VIA_IGNIS_5_PERK_EFFECT: "#F 神通术师可以召唤连天的圣火。#!"
 VIA_MEDICAMENTI_1_PERK_EFFECT: "作为[character_interaction|E]，允许[GetModifier('theurgy_soothe_pain_modifier').GetNameWithTooltip]\n#F 修炼该道途（又被称为补救之道）的人都是治疗师。药医之道可以接骨、止血，还能逆转造成的伤害。\n可以舒缓轻微疼痛。#!"
 VIA_MEDICAMENTI_2_PERK_EFFECT: "作为[character_interaction|E]，允许治疗伤疤。\n#F 扭伤和轻微感染在你的护理下会更快痊愈。#!"
 VIA_MEDICAMENTI_3_PERK_EFFECT: "作为[character_interaction|E]，允许治疗伤口。\n#F 所有非残疾伤口愈合速度是正常速度的两倍，而且不会有感染的风险。#!"
 VIA_MEDICAMENTI_4_PERK_EFFECT: "作为[character_interaction|E]，允许治疗小病。\n#F 你可以治愈哮喘或关节炎等慢性疾病，但这需要时间和努力。#!"
 VIA_MEDICAMENTI_5_PERK_EFFECT: "作为[character_interaction|E]，允许治疗疾病。\n#F 即使是致命的疾病，你也可以治愈，但这需要你付出很大的努力，需要数周的治疗。#!"
 VIA_NECROMANTIAE_1_PERK_EFFECT: "解锁[summon_wraith_on_death_interaction|E]。\n#F 亡灵之道是一种旨在接触或驱逐亡者的神通术。\n神通术师可以命令刚死去的尸体苏醒过来。#!"
 VIA_NECROMANTIAE_2_PERK_EFFECT: "能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害死灵/恶魔不再有[gold|E]耗费。\n#F 神通术师可以保护一个区域，防止鬼魂入侵。#!"
 VIA_NECROMANTIAE_3_PERK_EFFECT: "解锁[bind_wraith_interaction|E]。\n#F 神通术师可以与死者联系。#!"
 VIA_NECROMANTIAE_4_PERK_EFFECT: "解锁[command_wraith_interaction|E]\n作为[character_interaction|E]，允许你放逐目标死灵角色到[UmbraGlossary('shadowlands')]。\n#F 神通术师可以驱除幽灵。#!"
 VIA_NECROMANTIAE_5_PERK_EFFECT: "作为[character_interaction|E]，允许从[UmbraGlossary('shadowlands')]召唤随机死灵\n能够招募[GetMaA('hidden').GetName]、[GetMaA('walker').GetName]、[GetMaA('shambler').GetName]和[GetMaA('skeletons').GetName]作为[men_at_arms|E]。\n最大束缚死灵数量：#P +1#!\n#F 神通术师现在可以催促尸体站起来。#!"
 VIA_ORACULI_1_PERK_EFFECT: "#F 通过神谕之道，神通术师可以瞥见未知的未来或看到不可见的过去。\n神通术师可以解读有关其当前环境状况的征兆或警告。#!"
 VIA_ORACULI_2_PERK_EFFECT: "若你的任何亲朋好友本将死于死因神秘，现在将直接揭露谋杀他们的人。\n#F 通过事前比较，神通术师可以消除可能出现的负面结果。#!"
 VIA_ORACULI_3_PERK_EFFECT: "解锁[impatient_rushing_all_schemes_decision|E]\n#F 神通术师可以感知机缘的规律，从而收集到特定决策后的短期信息。#!"
 VIA_ORACULI_4_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 神通术师能够占卜未来的具体事件。#!"
 VIA_ORACULI_5_PERK_EFFECT: "解锁[deceitful_progress_hostile_schemes_decision|E]\n#F 神通术师获得感知清晰、具体细节的未来的能力，以及可靠、确定地预测具体事件的能力#!"
 SORCERY_LEVEL_6_REQUIREMENT: "@warning_icon!#X 你必须达成相应决议来解锁第六阶术法#!"
 SORCERY_LEVEL_6_DISABLED: "@warning_icon!#X 第六阶术法被游戏规则禁用#!"
 TELEPATHY_1_PERK_EFFECT: "#weak 心灵感应是通过灵能者的心智来支配他人思想的天赋。  \n灵能者可以感知目标的基本情绪，引起微弱的冲动，或使目标轻微抖动。#!"
 TELEPATHY_2_PERK_EFFECT: "#weak 灵能者可以读取表层意识的想法，传递一个简单的想法或引发一个短暂的念头。#!"
 TELEPATHY_3_PERK_EFFECT: "作为[character_interaction|E]，发起针对目标的外交能力对抗，以获得对其的弱牵制。  \n#weak 灵能者可以读取近期记忆或未来计划，传递复杂的情感或想法，或导致一次异常行为。#!"
 TELEPATHY_4_PERK_EFFECT: "新增心灵感应[character_interaction|E]选项，可获得强牵制，而非弱牵制。  \n#weak 灵能者可以读取深层思想，发送一小段信息或暂时控制目标的身体。#!"
 TELEPATHY_5_PERK_EFFECT: "新增心灵感应选项[character_interaction|E]，以获得永久强牵制。  \n#weak 灵能者可以读取目标最深层次的潜意识秘密，与其对话，或者完全控制他们的身体，包括重写记忆。#!"