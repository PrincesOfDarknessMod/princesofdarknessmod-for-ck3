 PSYCHIC_HEALING_2_PERK_EFFECT: "允许通过[character_interaction|E]对目标施加[GetModifier('psi_treatment').GetNameWithTooltip]\n#weak 灵能者可以加速患者的自然愈合过程，让他们进入睡眠状态，之后大多数轻微疾病都会治愈。#!"
 PSYCHIC_HEALING_3_PERK_EFFECT: "允许通过[character_interaction|E]治愈疤痕与毁容\n允许通过[character_interaction|E]对目标施加[GetModifier('psi_good_treatment').GetNameWithTooltip]\n#weak 灵能者可以治愈伤口，清除更顽固的疾病。#!"
 PSYCHIC_HEALING_4_PERK_EFFECT: "允许通过[character_interaction|E]治愈创伤与疾病\n#weak 灵能者可以治疗骨折，清除更严重的疾病。#!"
 PSYCHIC_HEALING_5_PERK_EFFECT: "允许通过[character_interaction|E]治愈疾病和负面的身体特质\n#weak 灵能者可以治愈癌症或传染病。#!"
