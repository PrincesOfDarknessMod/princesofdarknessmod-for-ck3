 PSYCHIC_VAMPIRISM_2_PERK_EFFECT: "强化[GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] [character_interaction|E]，提升压力消除量并将要求改为[stress|E]#V 0#!或[stress_level|E]#V 2#!\n#weak 灵能者可以从目标身上汲取意志力以补充自身的意志力。#!"
