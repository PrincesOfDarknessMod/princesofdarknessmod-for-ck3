 PSYCHOMETRY_2_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 灵能者可以看到物体周围在过去24小时内发生的事件。#!"
 PSYCHOMETRY_3_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 灵能者可以发现并理解物体或地点的完整历史。#!"
 PSYCHOMETRY_4_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 灵能者可以与物体产生共鸣，从而将她的视野看到物品拥有者所在的位置。#!"
 PSYCHOMETRY_5_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n作为[character_interaction|E]，可以在管理能力对抗中召唤或窃取有主的[artifact|E]。  \n#weak 灵能者可以清晰地看到任何在物体附近发生的共鸣事件，并能跟踪其心灵痕迹。#!"
