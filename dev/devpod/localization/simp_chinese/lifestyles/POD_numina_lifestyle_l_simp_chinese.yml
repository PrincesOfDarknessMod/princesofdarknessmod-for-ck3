l_simp_chinese:
 game_concept_numina: "灵迹"
 game_concept_numina_desc: "灵迹是一个总称，指的是凡人和沉睡者可以获得的超自然力量。三类主要的灵迹包括[psi_lifestyle|E]、[sorcery_lifestyle|E]和[true_faith|E]。"
 game_concept_psi_lifestyle: "灵能"
 game_concept_psi_lifestyle_desc: "[numina|E]的类别之一。改变（或远程查看）现实的能力，直接与人物的心智/大脑相关。"
 psi_lifestyle_name: "灵能"
 psi_lifestyle_desc: "专注于由灵能现象所产生的力量。"
 psi_lifestyle_highlight_desc: "由于你的头脑[trait|E]，这个生活方式中会给予额外#P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#!的[experience|E]积累。"
