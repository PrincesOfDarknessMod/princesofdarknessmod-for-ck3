 psychometry_2_perk_name: "二阶接触感应"
 psychometry_3_perk_name: "三阶接触感应"
 psychometry_4_perk_name: "四阶接触感应"
 psychometry_5_perk_name: "五阶接触感应"
 PSYCHOMETRY_1_PERK_EFFECT: "解锁[buy_artifact_claim_interaction|E]。  \n[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 通过触摸，灵能者可以了解到物体及其过去与之接触的人的一些信息。  \n灵能者可以对物体进行笼统的心灵共鸣，从而获得大致的印象。#!"
 PSYCHOMETRY_2_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 灵能者可以看到物体周围在过去24小时内发生的事件。#!"
 PSYCHOMETRY_3_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 灵能者可以发现并理解物体或地点的完整历史。#!"
 PSYCHOMETRY_4_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]的消耗：#P -10%#!  \n#weak 灵能者可以与物体产生共鸣，从而将她的视野看到物品拥有者所在的位置。#!"
 PSYCHOMETRY_5_PERK_EFFECT: "[buy_claim_interaction|E] and [buy_artifact_claim_interaction|E] Cost: #P -10%#!\nAs a [character_interaction|E], can summon/steal a claimed [artifact|E] after winning a stewardship duel.\n#weak The psychic gains a clear image of any resonating event that took place near the object and can follow its psychic trace.#!"
 psychoportation_1_perk_name: "短跃"
 psychoportation_2_perk_name: "简单跃迁"
 psychoportation_3_perk_name: "长距跃迁"
 psychoportation_4_perk_name: "超长跃迁"
