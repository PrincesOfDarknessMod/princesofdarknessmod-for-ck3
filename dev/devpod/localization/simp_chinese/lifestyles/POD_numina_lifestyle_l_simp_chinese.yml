 VIA_GENIORUM_LEVEL_1_PERK_EFFECT: "Can recruit [GetMaA('materialized_spirits').GetName] as [men_at_arms|E]\nCan interact with spirits.\n#F This Via deals with the realm of spirits and the demonic. Knowledge of a spirit’s true name grants one power over it. Via Geniorum is a compilation of specific Rituals of graded levels of power.#!"
 VIA_GENIORUM_LEVEL_2_PERK_EFFECT: "Can recruit [GetMaA('fire_elemental').GetName], [GetMaA('air_elemental').GetName], [GetMaA('water_elemental').GetName] and [GetMaA('earth_elemental').GetName] as [men_at_arms|E]"
 VIA_GENIORUM_LEVEL_3_PERK_EFFECT: "Can recruit [GetMaA('electricity_elemental').GetName], [GetMaA('metal_elemental').GetName], [GetMaA('lucifergia').GetName] and [GetMaA('imps').GetName] as [men_at_arms|E]\nAs a [character_interaction|E], Can learn the true name of a character"
 VIA_GENIORUM_LEVEL_4_PERK_EFFECT: "Can recruit [GetMaA('demonics').GetName] and [GetMaA('angelics').GetName] as [men_at_arms|E]\nAs a [character_interaction|E], allows banishing a fae/demon to their native realm"
 VIA_GENIORUM_LEVEL_5_PERK_EFFECT: "Can recruit [GetMaA('archdemonics').GetName], [GetMaA('archangelics').GetName], [GetMaA('djinn').GetName] and [GetMaA('wyrds').GetName] as [men_at_arms|E]"
 VIA_IGNIS_LEVEL_1_PERK_EFFECT: "#F This Via lets the Damned experience the flames of Hell before their final Death. This Via summons what appears to be normal fire, but it burns even those who are protected from normal flames."
 VIA_MEDICAMENTI_LEVEL_1_PERK_EFFECT: "As a [character_interaction|E], can soothe pain.\n#F Those who practice this Via, also called the Way of Remedy, are healers. Via Medicamenti will knit bones, stop bleeding, and actually reverse inflicted damage. #!"
 VIA_MEDICAMENTI_LEVEL_2_PERK_EFFECT: "As a [character_interaction|E], can heal minor wounds."
 VIA_MEDICAMENTI_LEVEL_3_PERK_EFFECT: "As a [character_interaction|E], can heal wounds."
 VIA_MEDICAMENTI_LEVEL_4_PERK_EFFECT: "As a [character_interaction|E], can cure basic illnesses."
 VIA_MEDICAMENTI_LEVEL_5_PERK_EFFECT: "As a [character_interaction|E], can perform miracle-like healing."
 VIA_NECROMANTIAE_LEVEL_1_PERK_EFFECT: "Unlock [summon_wraith_on_death_interaction|E].\n#F The Via Necromantiae is Theurgy designed to contact or banish the dead.#!"
 VIA_NECROMANTIAE_LEVEL_2_PERK_EFFECT: "You can imprison, torture, execute or physically hurt a spirit."
 VIA_NECROMANTIAE_LEVEL_3_PERK_EFFECT: "Unlock [bind_wraith_interaction|E]."
 VIA_NECROMANTIAE_LEVEL_4_PERK_EFFECT: "Unlock [command_wraith_interaction|E].\nAs a [character_interaction|E], can banish wraiths into the [shadowlands|E], unbinding them in the process."
 VIA_NECROMANTIAE_LEVEL_5_PERK_EFFECT: "As a [character_interaction|E], can summon a random wraith from the [shadowlands|E].\nMax number of bound wraiths: #P +1#!."
 VIA_ORACULI_LEVEL_1_PERK_EFFECT: "#F Through Via Oraculi, Theurgists may glimpse into the unknown future or see the unseen past.#!"
 VIA_ORACULI_LEVEL_2_PERK_EFFECT: "If any of your relatives or friends are murdered in mysterious circumstances, you will know their murderers identity."
 VIA_ORACULI_LEVEL_3_PERK_EFFECT: "You will receive a notification if someone intent to murder your friends of family.\nYou will receive a notification if someone intent to seduce your lover or consort.\nYour prisoners have less chance of escaping from your prison."