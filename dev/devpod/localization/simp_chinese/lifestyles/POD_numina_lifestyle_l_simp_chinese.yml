 via_oraculi_4_perk_name: "四阶神谕之道"
 via_oraculi_5_perk_name: "五阶神谕之道"
 VIA_GENIORUM_1_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]\n当你在物质世界中时，也可以与[umbra|E]的存在互动。\n#F 该领域涉及诸灵和恶魔的领域。知道灵类的真名，就能获得战胜它的力量。神怪之道汇编了按威力分级的特定仪式。\n神通术师并不窥探[spirit_world|E]，而是命令附近的超自然生物显露身形。#!"
 VIA_GENIORUM_2_PERK_EFFECT: "你将不再会被$POD_splat_wraith_plural$附身。\n作为[character_interaction|E]，允许你学习目标的真名\n#F 神通术师可以在手持物品上或在她周围的小范围内绘制防护符文。#!"
 VIA_GENIORUM_3_PERK_EFFECT: "使$POD_demon_unearthbound_decision$[decision|E]免费。\n作为[character_interaction|E]，允许你放逐目标恶魔角色到[UmbraGlossary('abyss')]。\n作为[character_interaction|E]，允许你放逐目标妖精角色到[UmbraGlossary('arcadia')]。\n#F 神通术师可以将灵类送回它的原属界域。#!"
 VIA_GENIORUM_4_PERK_EFFECT: "能够招募[GetMaA('materialjagglingsme]和[GetMaA('imps').GetName]作为[men_at_arms|E]\n#F 神通术师现在可以召唤灵类实体。#!"
 VIA_GENIORUM_5_PERK_EFFECT: "能够招募[GetMaA('jagglings').GetName]和[GetMaA('lucifergia').GetName]作为[men_at_arms|E]\n#F 神通术师现在可以强迫灵类臣服。#!"
 VIA_IGNIS_1_PERK_EFFECT: "#F 该道途能让受诅咒者在终焉之死前体验地狱之火。该道途召唤的看上去像普通火焰，但它甚至会灼伤那些受到免疫普通火焰的人。\n神通术师可以召唤烛焰大小的圣火。#!"
 VIA_IGNIS_2_PERK_EFFECT: "#F 神通术师可以召唤一小团圣火。#!"
 VIA_IGNIS_3_PERK_EFFECT: "#F 神通术师可以召唤营火大小的圣火。#!"
 VIA_IGNIS_4_PERK_EFFECT: "#F 神通术师可以召唤篝火大小的圣火。#!"
 VIA_IGNIS_5_PERK_EFFECT: "#F 神通术师可以召唤连天的圣火。#!"
 VIA_MEDICAMENTI_1_PERK_EFFECT: "作为[character_interaction|E]，允许赋予目标[GetModifier('theurgy_soothe_pain_modifier').GetNameWithTooltip]\n#F 修炼该道途（又被称为补救之道）的人都是治疗师。药医之道可以接骨、止血，还能逆转造成的伤害。\n可以舒缓轻微疼痛。#!"
 VIA_MEDICAMENTI_2_PERK_EFFECT: "作为[character_interaction|E]，允许治疗伤疤。\n#F 扭伤和轻微感染在你的护理下会更快痊愈。#!"
 VIA_MEDICAMENTI_3_PERK_EFFECT: "作为[character_interaction|E]，允许治疗伤口。\n#F 所有非残疾伤口愈合速度是正常速度的两倍，而且不会有感染的风险。#!"
 VIA_MEDICAMENTI_4_PERK_EFFECT: "作为[character_interaction|E]，允许治疗小病。\n#F 你可以治愈哮喘或关节炎等慢性疾病，但这需要时间和努力。#!"
 VIA_MEDICAMENTI_5_PERK_EFFECT: "作为[character_interaction|E]，允许治疗疾病。\n#F 即使是致命的疾病，你也可以治愈，但这需要你付出很大的努力，需要数周的治疗。#!"
 VIA_NECROMANTIAE_1_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n#F 亡灵之道是一种旨在接触或驱逐亡者的神通术。\n神通术师可以命令刚死去的尸体苏醒过来。#!"
 VIA_NECROMANTIAE_2_PERK_EFFECT: "能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害死灵/恶魔不再有[gold|E]耗费。\n#F 神通术师可以保护一个区域，防止鬼魂入侵。#!"
 VIA_NECROMANTIAE_3_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#F 神通术师可以与死者联系。#!"
 VIA_NECROMANTIAE_4_PERK_EFFECT: "$POD_can_command_wraith_trigger_loca$\n作为[character_interaction|E]，允许你放逐目标死灵角色到[UmbraGlossary('shadowlands')]。\n#F 神通术师可以驱除幽灵。#!"
 VIA_NECROMANTIAE_5_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n能够招募[GetMaA('hidden').GetName]、[GetMaA('walker').GetName]、[GetMaA('shambler').GetName]和[GetMaA('skeletons').GetName]作为[men_at_arms|E]。\n#F 神通术师现在可以催促尸体站起来。#!"
 VIA_ORACULI_1_PERK_EFFECT: "#F 通过神谕之道，神通术师可以瞥见未知的未来或看到不可见的过去。\n神通术师可以解读有关其当前环境状况的征兆或警告。#!"
 VIA_ORACULI_2_PERK_EFFECT: "若你的任何亲朋好友本将死于死因神秘，现在将直接揭露谋杀他们的人。\n#F 通过事前比较，神通术师可以消除可能出现的负面结果。#!"
 VIA_ORACULI_3_PERK_EFFECT: "解锁[impatient_rushing_all_schemes_decision|E]\n#F 神通术师可以感知机缘的规律，从而收集到特定决策后的短期信息。#!"
 VIA_ORACULI_4_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 神通术师能够占卜未来的具体事件。#!"
 VIA_ORACULI_5_PERK_EFFECT: "解锁[deceitful_progress_hostile_schemes_decision|E]\n#F 神通术师获得感知清晰、具体细节的未来的能力，以及可靠、确定地预测具体事件的能力#!"
 TELEPATHY_1_PERK_EFFECT: "#weak 心灵感应是通过灵能者的心智来支配他人思想的天赋。  \n灵能者可以感知目标的基本情绪，引起微弱的冲动，或使目标轻微抖动。#!"
 TELEPATHY_2_PERK_EFFECT: "#weak 灵能者可以读取表层意识的想法，传递一个简单的想法或引发一个短暂的念头。#!"
 TELEPATHY_3_PERK_EFFECT: "作为[character_interaction|E]，发起针对目标的外交能力对抗，以获得对其的弱牵制。  \n#weak 灵能者可以读取近期记忆或未来计划，传递复杂的情感或想法，或导致一次异常行为。#!"
 TELEPATHY_4_PERK_EFFECT: "新增心灵感应[character_interaction|E]选项，可获得强牵制，而非弱牵制。  \n#weak 灵能者可以读取深层思想，发送一小段信息或暂时控制目标的身体。#!"
 TELEPATHY_5_PERK_EFFECT: "新增心灵感应选项[character_interaction|E]，以获得永久强牵制。  \n#weak 灵能者可以读取目标最深层次的潜意识秘密，与其对话，或者完全控制他们的身体，包括重写记忆。#!"