 PRECOGNITION_2_PERK_EFFECT: "你的囚犯从你的监狱成功逃跑的概率更低。\n#weak 灵能者可以通过冥想以接收未来可能的幻象。这些幻象是模糊的、隐喻的，需要大量的解释才能发挥作用。#!"
 PRECOGNITION_3_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人想勾引你的爱人或配偶，你会收到通知。\n#weak 灵能者能感觉到他们什么时候处于危险之中。#!"
 PRECOGNITION_4_PERK_EFFECT: "#weak 灵能者可以预见到一个动作会有什么样的即时反应#!"
 PRECOGNITION_5_PERK_EFFECT: "作为一个[character_interaction|E]，可以发现每一个针对你的敌对计划，并挫败那些已经发现的计划。\n#weak 灵能者可以看到最可能发生的未来。#!"
