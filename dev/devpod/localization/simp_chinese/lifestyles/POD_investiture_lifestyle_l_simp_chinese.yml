l_simp_chinese:
 game_concept_investiture_lifestyle: "叙擢"
 game_concept_investiture_lifestyle_desc: "#bold 叙擢#!是#TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L 崇魔者#!#!的渎神能力：这些与$POD_splat_demon_plural$为伍之人，若甘愿玷污灵魂，便能获得美貌、力量、长寿等馈赠。\n\n获得叙擢有两种途径：与恶魔缔结[demonic_pact|E]以进入[thralldom|E]，或通过[diabolism_binding|E]强行夺取恶魔之力。两种方式皆需先掌握[GetTrait('demonology').GetName(GetNullCharacter)]知识——可通过[journey|E]习得。\n\n除极少数邪恶[faiths|E]外，所有信仰皆视崇魔之道为[crime|E]。"
 investiture_lifestyle_name: "叙擢"
 investiture_lifestyle_desc: "专注于由恶魔赐予的能力。"
 monthly_investiture_lifestyle_xp_gain_mult: "每月叙擢[lifestyle|E][experience|E]"
 demonic_investment_focus: "恶魔赋能重心"
 demonic_investment_focus_modifier: "[GetFocus('demonic_investment_focus').GetName]"
 demonic_investment_focus_desc: "#X [investiture_lifestyle|E][lifestyle|E][perk|E]点数#bold 仅能#!通过[demonic_pacts|E]或[diabolism|E]获得。#!"
 demonic_investment_focus_effect_desc: "无法专注此生活方式"
 GAINS_INVESTITURE_LIFESTYLE_XP: "获得$VALUE|V0$[investiture_lifestyle|E]经验"
 GAINED_INVESTITURE_LIFESTYLE_XP: "获得了$VALUE|V0$[investiture_lifestyle|E]经验"
 I_GAIN_INVESTITURE_LIFESTYLE_XP: "你获得$VALUE|V0$[investiture_lifestyle|E]经验"
 I_GAINED_INVESTITURE_LIFESTYLE_XP: "你获得了$VALUE|V0$[investiture_lifestyle|E]经验"
 TARGET_GAINS_INVESTITURE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName]获得$VALUE|V0$[investiture_lifestyle|E]经验"
 TARGET_GAINED_INVESTITURE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName]获得了$VALUE|V0$[investiture_lifestyle|E]经验"
 GAINS_A_INVESTITURE_LIFESTYLE_PERKPOINT: "获得$VALUE|V0$$investiture_lifestyle$的[perk|E]"
 GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "获得了$VALUE|V0$$investiture_lifestyle$的[perk|E]"
 I_GAIN_A_INVESTITURE_LIFESTYLE_PERKPOINT: "你获得$VALUE|V0$$investiture_lifestyle$的[perk|E]"
 I_GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "你获得了$VALUE|V0$$investiture_lifestyle$的[perk|E]"
 TARGET_GAINS_A_INVESTITURE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName]获得$VALUE|V0$$investiture_lifestyle$的[perk|E]"
 TARGET_GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName]获得了$VALUE|V0$$investiture_lifestyle$的[perk|E]"
 INVESTITURE_LIFESTYLE_PERK_POINTS_TRIGGER: "叙擢生活方式技能点：$NUM|V0$"
 demonic_investment_visible: "恶魔赋能"
 investiture_longevity_perk_name: "长寿#low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_longevity_perk_modifier_stacks')])#!"
 investiture_hellfire_perk_name: "地狱火"
 investiture_wings_perk_name: "翅膀"
 INVESTITURE_LONGEVITY_PERK_EFFECT: "#flavor 大多数#TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L 崇魔者#!#!都惧怕死亡。为此，献上一些无辜者小小的牺牲来延续自己的生命，便顺理成章了。#!"
 investments_of_soul_focus: "阎魔赋能重心"
 investments_of_soul_focus_modifier: "[GetFocus('investments_of_soul_focus').GetName]"
 investments_of_soul_focus_desc: "诸[Glossary('阎魔王','podgloss.yamaking')]的恩泽。"
 investments_of_soul_focus_effect_desc: "阎魔赋能重心给予："
 NEEDS_BE_CHI_USER_FOR_FOCUS_TEXT: "@warning_icon!#X 你得是使用气的种族才能选择这重心#!\n"
 NEEDS_COMMUNE_WITH_THE_YAMA_KINGS_TEXT: "@warning_icon!#X 你需要觐见位于[umbra|E]——[UmbraGlossary('yomi_wan')]的诸[Glossary('阎魔王','podgloss.yamaking')]以解锁技能。#!"
 investments_of_soul_visible: "阎魔赋能"
 mask_of_yomi_perk_name: "幽冥面具"
 black_whispers_perk_name: "黑暗低语"
 ebon_fountain_perk_name: "乌黑源泉"
 luck_of_yomi_perk_name: "幽冥气运"
 savage_kiss_perk_name: "野蛮之吻"
 union_of_oppositions_perk_name: "对立之盟"
 iron_hands_perk_name: "铁手"
 breath_of_knowledge_perk_name: "知识之息"
 touch_of_yama_kings_perk_name: "[Glossary('阎魔王','podgloss.yamaking')]之触"
 unfolding_scarlet_lotus_perk_name: "展开红莲"
 MASK_OF_YOMI_PERK_EFFECT: "[GetTrait('witch').GetName( GetPlayer )]特质在被揭露时将自动隐藏回秘密\n反转所有叙擢造成的外观变化\n#F 角色所受的赋能不再显示蛛丝马迹。再多的心灵探测、灵魂感知或真相感应也无法确定该角色是[akuma|E]，也无法迫使她背叛自己的不义行为。#!"
 BLACK_WHISPERS_PERK_EFFECT: "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F [Glossary('阎魔王','podgloss.yamaking')]的间谍无处不在，他们的[akuma|E]看不到、听不到的东西，他们的灵仆都能学到。#!"
 EBON_FOUNTAIN_PERK_EFFECT: "你每月流失10点[stress|E]\n#F 角色的魄与恶魔力量的源泉相连。#!\n"
 LUCK_OF_YOMI_PERK_EFFECT: "作为[decision|E]，允许花费叙擢技能点来获得金钱和威望。如果已经解锁，则该决议将给予更多金钱。\n#F 阎魔改变了角色的气运，[akuma|E]的命运也因此而改变。#!"
 SAVAGE_KISS_PERK_EFFECT: "#F 角色的灵魂受到了百足的爱抚。#!"
 UNION_OF_OPPOSITIONS_PERK_EFFECT: "#F [Glossary('阎魔王','podgloss.yamaking')]对角色下了手，他被重塑了。#!"
 IRON_HANDS_PERK_EFFECT: "#F 现在，该角色在[Glossary('阎魔王','podgloss.yamaking')]之力下移动。#!"
 BREATH_OF_KNOWLEDGE_PERK_EFFECT: "#F 诸[Glossary('阎魔王','podgloss.yamaking')]将他们的知识悄悄传入角色的耳中，这些知识就像白热的铁一样在他的大脑中燃烧。#!"
 TOUCH_OF_YAMA_KINGS_PERK_EFFECT: "#F [UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]之眷在这角色上。#!"
 UNFOLDING_SCARLET_LOTUS_PERK_EFFECT: "允许无视[Glossary('心法','podgloss.dharma')]等级点选高阶功法技能。\n#F 忌灵低声向角色讲述他们尊贵的秘密。#!"
 INVESTITURE_HELLFIRE_PERK_EFFECT: "作为[commander|E]在[combat_phase|E]对敌方[knights|E]或在[single_combat_duel_plural|E]对你的敌人造成[GetPlayer.MakeScope.ScriptValue('POD_investiture_hellfire_perk_damage')]火焰[POD_aggravated_damage_with_box|E]。\n#flavor 如同人形恶龙，此出卖灵魂者能对敌人喷吐火焰。还可以喷吐酸性胆汁、热血、燃烧的内脏或其他恶心的物质。 #!"
 INVESTITURE_WINGS_PERK_EFFECT: "#flavor 说出亵渎的命令后，祈求者从肩胛骨之间长出可怕的恶魔之翼。#!"
 INVESTITURE_COST_EFFECT: "#clickable 该[perk|E]需消耗$VALUE|V0$点技能[Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), '点数', '点数' )]#!"
 INVESTITURE_STACKING_EFFECT: "#clickable 此[perk|E]可以多次购买#!"
 INVESTITURE_VISUAL_CHANGE_EFFECT: "#N 此[perk|E]将永久改变你的外貌！#!"
 investiture_armor_perk_name: "护甲#low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_armor_perk_modifier_stacks')])#!"
 investiture_backgrounds_perk_name: "背景#low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_backgrounds_perk_modifier_stacks')])#!"
 investiture_demonic_strength_perk_name: "恶魔之力#low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_demonic_strength_perk_modifier_stacks')])#!"
 investiture_service_perk_name: "仆从#low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_service_perk_modifier_stacks')])#!"
 INVESTITURE_ARMOR_PERK_EFFECT: "#flavor 犹如妖孽一般，这个恶魔崇拜者拥有鳞片状的皮肤、厚实的疣状物、皮革般的硬皮，或是其他令人作呕的防护形态。#!"
 INVESTITURE_BACKGROUNDS_PERK_EFFECT: "#flavor 一些#TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L 崇魔者#!#!更喜欢其主顾提供更为……隐秘的帮助。而联络人正好能满足这种需求。#!"
 INVESTITURE_DEMONIC_STRENGTH_PERK_EFFECT: "#flavor 邪恶的生命力涌入祈求者的四肢。从此刻起直到她死亡，她将拥有次级恶魔的肉体力量。#!"
 INVESTITURE_SERVICE_PERK_EFFECT: "#flavor 真是地狱般的讽刺，深渊的奴仆竟能从深渊“购买”奴隶。这些被束缚的生物出现在[GetTrait('witch').GetName(GetPlayer)]身旁，问道：“主人，您有何吩咐？”毫无疑问，他早已备好了差事……#!"
 INVESTITURE_SERVICE_PERK_IMPS_EFFECT: "解锁[GetMaA('imps').GetName]作为[men_at_arms|E]。"
 INVESTITURE_SERVICE_PERK_MALEBRANCHE_EFFECT: "解锁[GetMaA('malebranche').GetName]作为[men_at_arms|E]。"
 INVESTITURE_SERVICE_PERK_LUCIFERGIA_EFFECT: "解锁[GetMaA('lucifergia').GetName]作为[men_at_arms|E]。"
 INVESTITURE_SERVICE_PERK_WAR_SERVITORS_EFFECT: "解锁[GetMaA('war_servitors').GetName]作为[men_at_arms|E]。"
 INVESTITURE_SERVICE_PERK_HINT_EFFECT: "#italic （投入更多[perk|E]可解锁更多兵种类型）#!"
 investiture_claws_and_horns_perk_name: "爪与角"
 investiture_goat_feet_perk_name: "山羊足"
 investiture_panpipe_voice_perk_name: "排箫之声"
 INVESTITURE_CLAWS_AND_HORNS_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]造成[GetPlayer.MakeScope.ScriptValue('POD_investiture_claws_and_horns_perk_damage')]点[POD_superficial_damage_with_box|E]；或在[single_combat_duel_plural|E]中对敌人造成同等伤害。\n#flavor 祈求者体内滋生出利爪或尖角，使其外貌脱离人形。#!"
 INVESTITURE_GOAT_FEET_PERK_EFFECT: "#flavor 在亲吻了他的庇护者（别问是哪里）之后，一名崇魔者获得了魔鬼的偶蹄。经过数分钟痛苦的变形后，崇魔者能以比常人更快的速度慢跑或奔跑；并能用蹄子踢踹或践踏敌人。#!"
 INVESTITURE_PANPIPE_VOICE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]造成25点[static_stress|E]，或在[single_combat_duel_plural|E]中对敌人造成此效果。\n#flavor 通过简单的言语或歌谣，一位灵缚巫女便能蛊惑她的听众。一旦被其束缚，受害者将失去善良本性；他们变得纵欲放荡，性情近乎沉溺醉乡。#!"
 investiture_beast_form_perk_name: "兽形"
 investiture_invulnerability_perk_name: "无敌"
 investiture_serpent_skin_perk_name: "蜕皮"
 INVESTITURE_BEAST_FORM_PERK_EFFECT: "解锁数种动物变形。\n#flavor 通过召唤其守护灵，恶魔崇拜者可变为某种卑劣的野兽（鼠、猫、狼等）。#!"
 INVESTITURE_INVULNERABILITY_PERK_EFFECT: "#flavor 凡俗的武器在崇魔者的皮肤上弹开，几乎毫无效果。#!"
 INVESTITURE_SERPENT_SKIN_PERK_EFFECT: "作为[character_interaction|E]，付出[GetPlayer.MakeScope.ScriptValue('POD_investiture_serpent_skin_perk_damage')]点[POD_superficial_damage_with_box|E]的代价逃离[prison|E]。\n#flavor 崇魔者以骇人的方式模仿蛇类，她确实能蜕去自己的皮肤，从而挣脱束缚。#!"
 investiture_devils_eyes_perk_name: "恶魔之眼"
 investiture_apportation_perk_name: "意念之手"
 investiture_awareness_perk_name: "察觉"
 investiture_luciferian_charm_perk_name: "路西法裔的魅力"
 investiture_master_of_the_domain_perk_name: "领域掌控"
 INVESTITURE_DEVILS_EYES_PERK_EFFECT: "作为[character_interaction|E]，在目标当前位置引发一场[epidemic|E]。\n#flavor 崇魔者只需一瞥，便能令牛奶变质、谷物腐烂、孩童染病。尽管其力量对成人无效（但受其影响仍会感到不适），却能在寒冬来临前摧毁村庄的粮食储备，从而造成毁灭性打击。#!"
 INVESTITURE_APPORTATION_PERK_EFFECT: "作为[character_interaction|E]，消耗2点[investiture_lifestyle|E][perk|E]为代价，窃取目标的[artifact|E]。\n#flavor 凭借这份“灵赋”，地狱追寻者可以迷诱一件物品，将其与自己绑定。自迷诱之时起，她便能从凡俗世界的任何地方（但不能跨越险棘）召唤此物。物品必须足够小巧轻便，能单手持握，但可以是任何东西，无论是否具有魔力。#!"
 INVESTITURE_AWARENESS_PERK_EFFECT: "#flavor 随着一阵令人心智崩溃的冲击，恶魔轰然开启了神秘感知的大门，使崇魔者本能地洞悉了周遭的秘密。#!"
 INVESTITURE_LUCIFERIAN_CHARM_PERK_EFFECT: "#flavor 名副其实的迷人魔鬼，拥有此叙擢的崇魔者几乎可以为所欲为。无论他说什么或做什么，都能令人心生敬畏。#!"
 INVESTITURE_MASTER_OF_THE_DOMAIN_PERK_EFFECT: "#flavor 一位崇魔者的庇护者赐予其一项“灵赋”，使其能够如同从高空俯瞰般，始终知晓她领地内五百英尺范围内发生的一切。#!"
 investiture_sign_of_the_inferno_perk_name: "火狱印记"
 investiture_uncanny_beauty_perk_name: "不思议之美"
 investiture_teleportation_perk_name: "传送"
 investiture_invisibility_to_animals_perk_name: "对动物隐形"
 INVESTITURE_SIGN_OF_THE_INFERNO_PERK_EFFECT: "对火焰免疫。\n#flavor 受地狱之吻，这位恶魔崇拜者无需畏惧烈焰。任何高温或火焰都无法伤他分毫；它们或许会焚毁他的衣物与财物，却无法在他的肌肤上留下灼痕。#!"
 INVESTITURE_UNCANNY_BEAUTY_PERK_EFFECT: "#flavor 诱惑往往披着可怕的光辉。作为一两个罪孽的交换，祈求者将获得超凡脱俗、令人无法抗拒的美貌。#!"
 INVESTITURE_TELEPORTATION_PERK_EFFECT: "作为[character_interaction|E]，允许你将军队传送至目标所在地，或在旅行时传送至下一个目的地。\n#flavor 当崇魔者难以忍受需要同时身处各地的渴望时，其地狱庇护者会赐予满足此需求的力量，但切记灵赋皆有代价。#!"
 INVESTITURE_INVISIBILITY_TO_ANIMALS_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[ruler|E]施加[GetModifier('POD_investiture_invisibility_to_animals_perk_modifier').GetNameWithTooltip][modifier|E]。\n#flavor 崇魔者的气息如此可怖，所有感知到其存在的生灵都会瞬间压抑这段记忆。#!"
 investiture_bond_breaking_perk_name: "破缚"
 investiture_shameful_sight_perk_name: "可耻目光"
 investiture_journey_to_the_spirit_realm_perk_name: "穿越灵界"
 INVESTITURE_BOND_BREAKING_PERK_EFFECT: "作为[character_interaction|E]，使目标失去其拥有的所有[hooks|E]。\n#flavor 苏尔加特之手引导着这位崇魔者；寻常的锁扣、绳结或束缚在她轻抚之下皆会自行解开。#!"
 INVESTITURE_SHAMEFUL_SIGHT_PERK_EFFECT: "#flavor 凝视着一个人的眼睛，崇魔者能看清那些浮于表面的罪孽。在崇魔者的\"心眼\"中，罪行的景象会如白昼般清晰地涌现。她或许会将这景象暗自留存以备后用，或许会公然嗤之以鼻，又或许会以这幻象折磨受害者。#!"
 INVESTITURE_JOURNEY_TO_THE_SPIRIT_REALM_PERK_EFFECT: "#flavor 通过像脱去衣物般褪去自己的皮肤与血肉，崇魔者可以暂时抛弃肉体一天，从而获得对影界的浅层访问权限。#!"
 investiture_mammons_gift_perk_name: "玛门的赠礼"
 investiture_talons_of_the_plague_crow_perk_name: "疫鸦之爪"
 investiture_army_of_the_damned_perk_name: "受诅军队"
 INVESTITURE_MAMMONS_GIFT_PERK_EFFECT: "作为[character_interaction|E]，将一件[artifact|E]转化为[gold_i]250[gold|E]。\n#flavor 每晚一次，崇魔者可将一件小型无生命物体转化为黄金。（不行哦，不死生物不算作“无生命物体”。）#!"
 INVESTITURE_TALONS_OF_THE_PLAGUE_CROW_PERK_EFFECT: "作为[character_interaction|E]，获得持续4年的[GetModifier('POD_talons_of_the_plague_crow_modifier').GetNameWithTooltip]。\n#flavor 崇魔者可随心将双手延伸为鸟爪，虽令非战斗行动困难重重，却化作了可怖的大规模毁灭凶器。#!"
 INVESTITURE_ARMY_OF_THE_DAMNED_PERK_EFFECT: "作为[character_interaction|E]，在[war|E]期间召唤一支由250名[GetMaA('demons').GetName]组成的军队。\n#flavor 他们从深渊而来，亦将把敌人投入深渊。#!"
 investiture_relentless_perk_name: "不屈不挠"
 investiture_regeneration_perk_name: "恢复"
 INVESTITURE_RELENTLESS_PERK_EFFECT: "#flavor 地狱之力驱使着崇魔者奔向目标，无论伤痛，无论阻碍。崇魔者终将抵达其心之所向。#!"
 INVESTITURE_REGENERATION_PERK_EFFECT: "改为每年治愈一次，而非每两年一次。\n为$POD_splat_vampire_plural$启用自然愈合。\n#flavor 这是赐予凡人的最伟大“灵赋”之一，这项投资能让崇魔者仅凭意志力便恢复健康！#!"