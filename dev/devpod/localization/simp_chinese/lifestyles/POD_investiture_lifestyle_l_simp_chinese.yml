 BACKGROUNDS_PERK_EFFECT: "作为[decision|E]，允许花费叙擢技能点来获得金钱和威望。\n#F 巨大的财富、影响力或伴侣。通过契约几乎可以获得一切——除了代蒙、命运和使魔；没有恶魔能够或愿意提供这些。#!"
 INVESTITURE_LONGEVITY_PERK_EFFECT: "作为[decision|E]，允许花费叙擢技能点来叠加[GetModifier( 'longevity_modifier' ).GetNameWithTooltip|L]。\n#F 契约者可以每次将自己的寿命延长五年。#!"
 APPORTATION_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 能够附魔物体，将其与自身绑定。随后，可以在凡界的任何地方召唤那个物体。#!"
 IMP_FAMILIAR_PERK_EFFECT: "允许招募[GetMaA('imps').GetName]作为[men_at_arms|E]\n#F 使唤魔者获得了一只小恶魔作为使魔。它们对唤魔者忠诚，但对它们的恶魔主人更加忠诚。#!"
 LIFE_LEECH_PERK_EFFECT: "作为[character_interaction|E]，允许你吸收囚犯的能量来回复生命力。\n#F [GetTrait('infernalist').GetName( GetNullCharacter )]能够吸取凡人、血仆和狼人的意志力，将其转换为血。#!"
 BESTIAL_FORM_PERK_EFFECT: "允许变身为数种动物。\n#F 通过呼唤宗主，你可以变成一种较低级的野兽（如鼠、猫、狼等）。#!"
 TELEPORTATION_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F [GetTrait('infernalist').GetName( GetNullCharacter )]能使用这来移动到百尺之外的地方。目的地无需在视野内。#!"
 TURN_TO_TOAD_PERK_EFFECT: "作为[character_interaction|E]，允许你将目标变成[GetModifier( 'POD_shapeshift_form_toad_modifier' ).GetNameWithTooltip|L]。\n#F 这能力能将受害者变为蛤蟆。#!"
 EMOTION_PROJECTION_PERK_EFFECT: "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 唤魔者能够让目标体验她希望他们感受到的任何情感。#!"
 JOURNEY_TO_THE_SPIRIT_REALM_PERK_EFFECT: "#F 崇魔者的身体化为灵体，以便能够穿越[umbra|E]。#!"
 MAMMONS_GIFT_PERK_EFFECT: "作为[character_interaction|E]，允许花费虔诚来获得金钱。\n#F [GetTrait('infernalist').GetName( GetNullCharacter )]把一个小型非生物（不死生物不算）变成黄金。#!"
 TALONS_OF_THE_PLAGUE_CROW_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手随机疾病。\n#F 每到黄昏时分，祈求者的双手便伸长成鸟爪的形状。虽然操作物体变得困难，但这些爪子却是凶猛的武器。当它们划过皮肤，便会造成痛苦的伤害，一旦流出血，一种剧毒的瘟疫便会感染其中。不久之后，受害者将会生病，除了魔法手段外，无法使其自愈。一周或更短时间内将面临死亡。即使治愈，疫鸦留下的疤痕也仍然深刻且显眼。[GetTrait('infernalist').GetName( GetNullCharacter )]接触的任何东西都无法脱离瘟疫的威胁。她抓伤的任何生物都可能生病甚至死亡。#!"
 INVESTITURE_WARNING_PERK_EFFECT: "#N;bold @warning_icon! 选择此技能会改变你的外貌，并公开你是恶魔崇拜者！#!"
 investments_of_soul_focus: "阎魔赋能重心"
 investments_of_soul_focus_modifier: "[GetFocus('investments_of_soul_focus').GetName]"
 investments_of_soul_focus_desc: "诸[Glossary('阎魔','podgloss.yamaking')]的恩泽。"
 investments_of_soul_focus_effect_desc: "阎魔赋能重心给予："
 NEEDS_BE_THRALL_OR_DIABOLIST_TEXT: "@warning_icon!#X 你不是魔奴或唤魔者#!"
 NEEDS_BE_CHI_USER_FOR_FOCUS_TEXT: "@warning_icon!#X 你得是使用气的种族才能选择这重心#!\n"
 NEEDS_COMMUNE_WITH_THE_YAMA_KINGS_TEXT: "@warning_icon!#X 你需要觐见位于[umbra|E]——[UmbraGlossary('yomi_wan')]的诸[Glossary('阎魔','podgloss.yamaking')]以解锁技能。#!"
 investments_of_soul_visible: "阎魔赋能"
 mask_of_yomi_perk_name: "幽冥面具"
 black_whispers_perk_name: "黑暗低语"
 ebon_fountain_perk_name: "乌黑源泉"
 luck_of_yomi_perk_name: "幽冥气运"
 savage_kiss_perk_name: "野蛮之吻"
 union_of_oppositions_perk_name: "对立之盟"
 iron_hands_perk_name: "铁手"
 breath_of_knowledge_perk_name: "知识之息"
 touch_of_yama_kings_perk_name: "[Glossary('阎魔','podgloss.yamaking')]之触"
 unfolding_scarlet_lotus_perk_name: "展开红莲"
 MASK_OF_YOMI_PERK_EFFECT: "[GetTrait('infernalist').GetName( GetPlayer )]特质在被揭露时将自动隐藏回秘密\n反转所有叙擢造成的外观变化\n#F 角色所受的赋能不再显示蛛丝马迹。再多的心灵探测、灵魂感知或真相感应也无法确定该角色是[akuma|E]，也无法迫使她背叛自己的不义行为。#!"
 BLACK_WHISPERS_PERK_EFFECT: "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F [Glossary('阎魔','podgloss.yamaking')]的间谍无处不在，他们的[akuma|E]看不到、听不到的东西，他们的灵仆都能学到。#!"
 EBON_FOUNTAIN_PERK_EFFECT: "你每月流失10点[stress|E]\n#F 角色的魄与恶魔力量的源泉相连。#!\n"
 LUCK_OF_YOMI_PERK_EFFECT: "作为[decision|E]，允许花费叙擢技能点来获得金钱和威望。如果已经解锁，则该决议将给予更多金钱。\n#F [Glossary('阎魔','podgloss.yamaking')]改变了角色的气运，[akuma|E]的命运也因此而改变。#!"
 SAVAGE_KISS_PERK_EFFECT: "#F 角色的灵魂受到了百足的爱抚。#!"
 UNION_OF_OPPOSITIONS_PERK_EFFECT: "#F [Glossary('阎魔','podgloss.yamaking')]对角色下了手，他被重塑了。#!"
 IRON_HANDS_PERK_EFFECT: "#F 现在，该角色在[Glossary('阎魔','podgloss.yamaking')]之力下移动。#!"
 BREATH_OF_KNOWLEDGE_PERK_EFFECT: "#F 诸[Glossary('阎魔','podgloss.yamaking')]将他们的知识悄悄传入角色的耳中，这些知识就像白热的铁一样在他的大脑中燃烧。#!"
 TOUCH_OF_YAMA_KINGS_PERK_EFFECT: "#F [UmbraGlossaryLocalized('yomi_wan','幽冥')]之眷在这角色上。#!"
 UNFOLDING_SCARLET_LOTUS_PERK_EFFECT: "允许无视[Glossary('心法','podgloss.dharma')]等级点选高阶功法技能。\n#F 忌灵低声向角色讲述他们尊贵的秘密。#!"
 AQUATIC_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以像跑步一样快速地在水下游泳，并且拥有略带水生生物特征的外观。如果是凡人，他将获得鳃。#!"
 BAT_EARS_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]将获得类似于蝙蝠回声定位的能力。#!"
 GRIM_JAWS_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]获得了吞噬任何东西的能力，能够吞下小孩大小的物体。除非使用此能力，否则平时面部外观将如同往常。#!"
 KISS_OF_HADES_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]能通过亲吻造成严重伤害。#!"
 LASHING_TAIL_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]长出了一条小尾巴，可以用来像鞭子一样造成严重伤害。#!"
 MAGIC_SENSE_PERK_EFFECT: "#F 使得[GetTrait('infernalist').GetName( GetNullCharacter )]能够感知到500公里范围内的任何魔法的痕迹。#!"
 RAZOR_FANGS_PERK_EFFECT: "#F 增强了崇魔者的尖牙的锋利度和尺寸，使其能造成更严重的伤害。#!"
 RAZOR_FINGERS_PERK_EFFECT: "#F 与刮刀尖牙相同，但应用于指甲。#!"
 SMELL_FEAR_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以通过气味感知100英尺范围内是否有人感到恐惧。#!"
 DEVILS_EYES_PERK_EFFECT: "#F 只需一瞥，[GetTrait('infernalist').GetName( GetNullCharacter )]就能使牛奶变质、谷物腐烂，并使儿童生病。#!"
 GOAT_FEET_PERK_EFFECT: "#F 在亲吻他的庇主之后，[GetTrait('infernalist').GetName( GetNullCharacter )]会长出像魔鬼一样的裂指蹄。从日落到黎明时分，他的腿会变得瘦长而多毛，脚趾变成硬化的蹄子，身后长出尾巴。这个过程非常疼痛，需要几分钟时间才能完成。[GetTrait('infernalist').GetName( GetNullCharacter )]可以比任何人跑得更快，用蹄子踢打或践踏敌人至死。#!"
 INVISIBILITY_TO_ANIMALS_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]将对动物隐形，尽管有些动物仍可能闻到她的气味。动物们会因[GetTrait('infernalist').GetName( GetNullCharacter )]而感到恐惧。#!"
 PHEROMONE_POWERS_PERK_EFFECT: "#F 赋予崇魔者释放信息素的能力，使得30尺范围内的所有凡人更容易被支配。#!"
 PSYCHIC_TRACKER_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以追踪某人，并知道他们应该何时接近目标。#!"
 INVESTITURE_HORNS_PERK_EFFECT: "#F 身上长出角。#!"
 INVESTITURE_CLAWS_PERK_EFFECT: "#F 身上长出利爪。#!"
 INVESTITURE_HELLFIRE_PERK_EFFECT: "#F 可以对敌人喷吐火焰，也可以喷吐酸性胆汁、热血、燃烧的内脏或其他恶心的物质。#!"
 INVULNERABILITY_PERK_EFFECT: "#F 凡人的武器击打在崇魔者皮肤上几乎没有效果。#!"
 PANPIPE_VOICE_PERK_EFFECT: "#F 可以通过简单的言辞或歌曲以迷住他的听众，并将听众最恶劣的欲望激发到极点。面对意志力强大的生物（如魔法师或吸血鬼）时，难度会增加。一旦被控制，受害者将失去善良本性，变得好色并几乎沉醉在欲望中，并必须花费意志力来恢复理智。#!"
 SERPENT_SKIN_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以脱去自己的皮肤以逃脱束缚。这需要时间、疼痛和努力；她必须在自己皮肤上割开一条裂缝，然后滑出或拉扯出皮肤。神经和肌肉将会暴露在外。重新长出皮肤需要大约一周的时间。在此期间，崇魔者对环境极度敏感，且相貌非常恶心。#!"
 SERVICE_PERK_EFFECT: "#F 可以从深渊“购买”奴隶。某些恶魔宿主和小恶魔将服务于崇魔者，只要他的目的符合地狱的意图。一旦被契约所束缚，这些被束缚的生物将出现在术士的身边，并询问：“主人，你的意愿是什么？”在所有情况下，“仆人”的忠诚都会持续至他们毁灭。当然，恶魔在凡间无法死亡，如果受到虐待，可能会让其“主人”非常不快。#!"
 INVESTITURE_WINGS_PERK_EFFECT: "#F 说出亵渎的命令后，祈求者从肩胛骨之间长出可怕的恶魔之翼。#!"
 CAUSE_VERTIGO_PERK_EFFECT: "#F 受害者会难以凭借自己的意志保持直立，凡人会感到恶心。#!"
 MAGIC_PORTAL_PERK_EFFECT: "#F 允许[GetTrait('infernalist').GetName( GetNullCharacter )]穿越固态物体。#!"
 WALK_THE_WALLS_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以在墙壁或天花板上以步行或爬行的方式移动。#!"
 DEMON_HIDE_PERK_EFFECT: "#F 改变[GetTrait('infernalist').GetName( GetNullCharacter )]的皮肤，允许吸收伤害，并对任何刺穿物造成火焰伤害。顺便说一句，这也使爪子或咬击造成火焰伤害。#!"
 AWARENESS_PERK_EFFECT: "#F 通过一阵令人思绪破碎的冲击，恶魔打开了神秘感知的大门。#!"
 LUCIFERIAN_CHARM_PERK_EFFECT: "#F 拥有这种能力的[GetTrait('infernalist').GetName( GetNullCharacter )]几乎可以为所欲为。无论他说什么或做什么，他都会令遇到的每个人都感到敬畏。#!"
 GUARDIAN_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]将获得一个小恶魔作为护卫。这个小恶魔将服务于她，并且将会通过一种情感联系使得他们能够了解对方的位置和情绪状态。#!"
 TOXIC_BLAST_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以从鼻子、眼睛、嘴巴或指尖喷射出一种含有恶魔能量的液体。这是一种气味恶臭、酸性、黑绿色的粘稠液体。#!"
 TWO_DIMENSIONAL_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]将变成二维的，使他能够从缝隙中滑过，并且从侧面看几乎不存在。#!"
 INVESTITURE_EYES_OF_THE_ABYSS_PERK_EFFECT: "#F 唤魔者可以盯着受害者的眼睛，让他感到空虚和情感的缺失。受害者将无法采取任何行动，只能凝视她的眼睛。#!"
 SIGN_OF_THE_INFERNO_PERK_EFFECT: "不再因为火而受到伤害。\n#F 被地狱眷爱的唤魔者无需惧怕火焰。任何凡俗的热与火都不能伤害到他。它可能会烧毁他的衣物和财产，但他的肉体却不会留下任何伤痕。#!"
 BODY_ARMOR_PERK_EFFECT: "#F 受到更少伤害#!"
 MASTER_OF_THE_DOMAIN_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]将总是知道她领域内500英尺范围内发生的事情，就像从上方观看一样。#!"
 LIGHTNING_SPEED_PERK_EFFECT: "#F 唤魔者每回合可以进行额外的行动。#!"
 BOND_BREAKING_PERK_EFFECT: "#F 苏尔戈之手引导着这个[GetTrait('infernalist').GetName( GetNullCharacter )]；当她抚摸非魔法的锁、绳结或束缚时，它们会自动打开。#!"
 DEMONIC_STRENGTH_PERK_EFFECT: "#F 邪恶的活力流入祈求者的四肢，使他们拥有一只次级恶魔的力量。#!"
 SHAMEFUL_SIGHT_PERK_EFFECT: "#F 通过凝视一个人的眼睛，[GetTrait('infernalist').GetName( GetNullCharacter )]可以辨别出他犯下的罪恶中最显眼的那些，即那个人做过的最可耻的事。在崇魔者的“内在之眼”中，这个行为的影像如同白昼般清晰显现。她可以决定将其保留以备后用，公开嘲笑，或用这种幻象折磨受害者。通过向她的守护女神祈祷，[GetTrait('infernalist').GetName( GetNullCharacter )]可以在任何能反射的镜面上显示她的幻象。任何在场的人都可以看到。即使是魔法追踪也会认为[GetTrait('infernalist').GetName( GetNullCharacter )]是无辜的。#!"
 ATROPHIC_TOUCH_PERK_EFFECT: "#F 将导致受害者的一只手臂或腿萎缩消失。没有疼痛，但肢体会消失。#!"
 HAND_OF_THE_DEFILER_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]的右手获得了摧毁植物、扭曲木材、腐蚀金属和让任何触碰到的血肉腐烂的能力。#!"
 INFERNAL_PASSAGE_PERK_EFFECT: "#F 允许在地狱安全地通行。#!"
 SUMMON_HELLIONS_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以召唤小恶魔来保护她免受危险。这些恶魔不会让自己处于危险之中，但会尽力保护[GetTrait('infernalist').GetName( GetNullCharacter )]。#!"
 UNCANNY_BEAUTY_PERK_EFFECT: "#F 以一两个原罪作为交换，祈求者将获得一种超凡脱俗、无法抗拒的美貌。#!"
 ARMY_OF_THE_DAMNED_PERK_EFFECT: "#F [GetTrait('infernalist').GetName( GetNullCharacter )]可以召唤小恶魔来保护她免受危险。它们会战斗至自己的身体被摧毁。#!"
 INFERNAL_RANKING_PERK_EFFECT: "#F 给予[GetTrait('infernalist').GetName( GetNullCharacter )]在受诅者中较低的地位。[GetTrait('infernalist').GetName( GetNullCharacter )]优于小恶魔，并可以指挥它们。它们不能被强迫，但大多数会服从，因为不服从而被惩罚是可以接受和预期的。#!"
 REGENERATION_PERK_EFFECT: "每三月一次，消除所有伤口和残疾。\n#F 这种能力使[GetTrait('infernalist').GetName( GetNullCharacter )]只需稍加注意即可恢复健康。#!"