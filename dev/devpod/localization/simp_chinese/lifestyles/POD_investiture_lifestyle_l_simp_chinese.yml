 BACKGROUNDS_PERK_EFFECT:0 "作为[decision|E]，允许花费叙擢技能点来获得金钱和威望。\n#F 巨大的财富、影响力或伴侣。通过契约几乎可以获得一切——除了代蒙、命运和使魔；没有恶魔能够或愿意提供这些。#!"
 INVESTITURE_LONGEVITY_PERK_EFFECT:0 "作为[decision|E]，允许花费叙擢技能点来叠加[GetModifier( 'longevity_modifier' ).GetNameWithTooltip|L]。\n#F 契约者可以每次将自己的寿命延长五年。#!"
 APPORTATION_PERK_EFFECT:0 "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 能够附魔物体，将其与自身绑定。随后，可以在凡界的任何地方召唤那个物体。#!"
 IMP_FAMILIAR_PERK_EFFECT:0 "允许招募[GetMaA('imps').GetName]作为[men_at_arms|E]\n#F 使唤魔者获得了一只小恶魔作为使魔。它们对唤魔者忠诚，但对它们的恶魔主人更加忠诚。#!"
 LIFE_LEECH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你吸收囚犯的能量来回复生命力。\n#F [GetTrait('infernalist').GetName( GetNullCharacter )]能够吸取凡人、血仆和狼人的意志力，将其转换为血。#!"
 BESTIAL_FORM_PERK_EFFECT:0 "允许变身为数种动物。\n#F 通过呼唤宗主，你可以变成一种较低级的野兽（如鼠、猫、狼等）。#!"
 TELEPORTATION_PERK_EFFECT:0 "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F [GetTrait('infernalist').GetName( GetNullCharacter )]能使用这来移动到百尺之外的地方。目的地无需在视野内。#!"
 TURN_TO_TOAD_PERK_EFFECT:0 "作为[character_interaction|E]，允许你将目标变成[GetModifier( 'POD_shapeshift_form_toad_modifier' ).GetNameWithTooltip|L]。\n#F 这能力能将受害者变为蛤蟆。#!"
 EMOTION_PROJECTION_PERK_EFFECT:0 "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 唤魔者能够让目标体验她希望他们感受到的任何情感。#!"
 JOURNEY_TO_THE_SPIRIT_REALM_PERK_EFFECT:0 "允许在灵游时进入[astral_reaches|E]、[spirit_wilds|E]和[deep_umbra|E]。\n#F 崇魔者的身体化为灵体，以便能够穿越灵界。#!"
 MAMMONS_GIFT_PERK_EFFECT:0 "作为[character_interaction|E]，允许花费虔诚来获得金钱。\n#F [GetTrait('infernalist').GetName( GetNullCharacter )]把一个小型非生物（不死生物不算）变成黄金。#!"
 TALONS_OF_THE_PLAGUE_CROW_PERK_EFFECT:0 "在战争中（作为指挥官时）给予敌方[knights|E]和指挥官或在[single_combat_duel|E]中给予对手随机疾病。\n#F 每到黄昏时分，祈求者的双手便伸长成鸟爪的形状。虽然操作物体变得困难，但这些爪子却是凶猛的武器。当它们划过皮肤，便会造成痛苦的伤害，一旦流出血，一种剧毒的瘟疫便会感染其中。不久之后，受害者将会生病，除了魔法手段外，无法使其自愈。一周或更短时间内将面临死亡。即使治愈，疫鸦留下的疤痕也仍然深刻且显眼。[GetTrait('infernalist').GetName( GetNullCharacter )]接触的任何东西都无法脱离瘟疫的威胁。她抓伤的任何生物都可能生病甚至死亡。#!"
 INVESTITURE_WARNING_PERK_EFFECT:0 "#N;bold @warning_icon! 选择此技能会改变你的外貌，并公开你是恶魔崇拜者！#!"
 investments_of_soul_focus:0 "阎魔赋能重心"
 investments_of_soul_focus_modifier:1 "[GetFocus('investments_of_soul_focus').GetName]"
 investments_of_soul_focus_desc:0 "诸阎魔的恩泽。"
 investments_of_soul_focus_effect_desc:0 "阎魔赋能重心给予："
 NEEDS_BE_THRALL_OR_DIABOLIST_TEXT:0 "@warning_icon!#X 你不是魔奴或唤魔者#!"
 NEEDS_BE_CHI_USER_FOR_FOCUS_TEXT:0 "@warning_icon!#X 你得是使用气的种族才能选择这重心#!\n"
 NEEDS_COMMUNE_WITH_THE_YAMA_KINGS_TEXT:0 "@warning_icon!#X 你需要觐见位于影界——[yomi_wan|E]的诸阎魔以解锁技能。#!"
 investments_of_soul_visible:1 "阎魔赋能"
 mask_of_yomi_perk_name:0 "幽冥面具"
 black_whispers_perk_name:0 "黑暗低语"
 ebon_fountain_perk_name:0 "乌黑源泉"
 luck_of_yomi_perk_name:0 "幽冥气运"
 savage_kiss_perk_name:0 "野蛮之吻"
 union_of_oppositions_perk_name:0 "对立之盟"
 iron_hands_perk_name:0 "铁手"
 breath_of_knowledge_perk_name:0 "知识之息"
 touch_of_yama_kings_perk_name:0 "阎魔之触"
 unfolding_scarlet_lotus_perk_name:0 "展开红莲"
 MASK_OF_YOMI_PERK_EFFECT:0 "[GetTrait('infernalist').GetName( GetPlayer )]特质在被揭露时将自动隐藏回秘密\n反转所有叙擢造成的外观变化\n#F 角色所受的赋能不再显示蛛丝马迹。再多的心灵探测、灵魂感知或真相感应也无法确定该角色是恶鬼，也无法迫使她背叛自己的不义行为。#!"
 BLACK_WHISPERS_PERK_EFFECT:0 "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F 阎魔的间谍无处不在，他们的恶鬼看不到、听不到的东西，他们的灵仆都能学到。#!"
 EBON_FOUNTAIN_PERK_EFFECT:0 "每月自动恢复#V 1#!阴气。\n每月自动减少[stress|E]。\n#F 角色的魄与恶魔力量的源泉相连。#!"
 LUCK_OF_YOMI_PERK_EFFECT:0 "作为[decision|E]，允许花费叙擢技能点来获得金钱和威望。如果已经解锁，则该决议将给予更多金钱。\n#F 阎魔改变了角色的气运，恶鬼的命运也因此而改变。#!"
 SAVAGE_KISS_PERK_EFFECT:0 "#F 角色的灵魂受到了百足的爱抚。#!"
 UNION_OF_OPPOSITIONS_PERK_EFFECT:0 "永久提升#V 3#!气德，超出心法等级所允许的上限。\n#F 阎魔对角色下了手，他被重塑了。#!"
 IRON_HANDS_PERK_EFFECT:0 "#F 现在，该角色在阎魔之力下移动。#!"
 BREATH_OF_KNOWLEDGE_PERK_EFFECT:0 "#F 诸阎魔将他们的知识悄悄传入角色的耳中，这些知识就像白热的铁一样在他的大脑中燃烧。#!"
 TOUCH_OF_YAMA_KINGS_PERK_EFFECT:0 "#F 幽冥之眷在这角色上。#!"
 UNFOLDING_SCARLET_LOTUS_PERK_EFFECT:0 "允许无视心法等级点选高阶功法技能。\n#F 忌灵低声向角色讲述他们尊贵的秘密。#!"
 AQUATIC_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] can swim underwater as fast as he can run. With a slightly aquatic look. If mortal, he will gain gills.#!"
 BAT_EARS_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] will gain same abilities as a bat's sonar.#!"
 GRIM_JAWS_PERK_EFFECT:0 "#F the [GetTrait('infernalist').GetName( GetNullCharacter )] receives the ability to chew through anything. And can swallow objects up to the size of a small child. The facial features are normal unless using this power.#!"
 KISS_OF_HADES_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] can cause aggravated damage with the touch of his lips.#!"
 LASHING_TAIL_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] grows a small tail which may be used to cause aggravated damage like a whip.#!"
 MAGIC_SENSE_PERK_EFFECT:0 "#F Allows the [GetTrait('infernalist').GetName( GetNullCharacter )] to sense any use of magic within 500 yrs of herself.#!"
 RAZOR_FANGS_PERK_EFFECT:0 "#F Increases the sharpness and size of the infernalist's fangs allowing aggravated damage when used.#!"
 RAZOR_FINGERS_PERK_EFFECT:0 "#F Identical to Razor Fangs only with fingernails.#!"
 SMELL_FEAR_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] will detect by scent if anyone is afraid within 100 feet.#!"
 DEVILS_EYES_PERK_EFFECT:0 "#F With a glance, an [GetTrait('infernalist').GetName( GetNullCharacter )] can spoil milk, rot grain, and sicken children.#!"
 GOAT_FEET_PERK_EFFECT:0 "#F After kissing his Patron an [GetTrait('infernalist').GetName( GetNullCharacter )] assumes the Devil's cloven feet. Each night, between sunset and dawn, his legs with grow thin, long and hairy, his toes curl into hardened hooves and tail from his rear. Painful, taking several minutes of transformation. The [GetTrait('infernalist').GetName( GetNullCharacter )] may run faster than any man and kick or trample his enemies to death with the hooves.#!"
 INVISIBILITY_TO_ANIMALS_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] will be unseen to animals though some may still smell her. They will cower in fright from the [GetTrait('infernalist').GetName( GetNullCharacter )].#!"
 PHEROMONE_POWERS_PERK_EFFECT:0 "#F Gives infernalists pheromones that make all mortals within 30 feet easier to Dominate.#!"
 PSYCHIC_TRACKER_PERK_EFFECT:0 "#F [GetTrait('infernalist').GetName( GetNullCharacter )] can track someone and know when they are near their target.#!"
 INVESTITURE_HORNS_PERK_EFFECT:0 "#F Horns sprout from body.#!"
 INVESTITURE_CLAWS_PERK_EFFECT:0 "#F Claws sprout from body.#!"
 INVESTITURE_HELLFIRE_PERK_EFFECT:0 "#F Can breath gouts of fire on his enemies. Also acidic bile, hot blood, flaming entrails, or other vile substances.#!"
 INVULNERABILITY_PERK_EFFECT:0 "#F Mortal weapons bounce off the infernalist's skin with little effect.#!"
 PANPIPE_VOICE_PERK_EFFECT:0 "#F Simple words or songs can enrapture his audience and will bring his listeners' worst passions to a head. Against a strong willed creature (magus, vampire) the difficulty increase. Once bound, a victim loses her good nature, becomes lustful, almost drunken in her temperament and must spend Willpower to regain her senses.#!"
 SERPENT_SKIN_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] can shed his skin and escape his bonds. This takes time, pain, and effort; she must cut a slit in her own hide, then slide or yank himself out of the skin. His nerves and muscles lie exposed. Regrowing the skin takes a week or so. Until then the diabolist is incredibly sensitive to his environment and really foul to look at.#!"
 SERVICE_PERK_EFFECT:0 "#F Can \"buy\" slaves from the Abyss. Certain demon-hosts and minor demons will serve the infernalist, so long as his purposes suit those of Hell. Once the Foedus is sealed, these bound creatures appear by the Warlock's side and ask, \"Master, what is thy will?\" In all cases, the \"servant\" is loyal unto destruction. Devils, of course, cannot die on the mortal plane, and if ill treated might make its \"master\" very unhappy tomorrow.#!"
 INVESTITURE_WINGS_PERK_EFFECT:0 "#F Uttering a blasphemous command, the supplicant grows horrible, demonic wings from between her shoulder blades.#!"
 CAUSE_VERTIGO_PERK_EFFECT:0 "#F The victim's will have problems staying upright, mortals will suffer nausea.#!"
 MAGIC_PORTAL_PERK_EFFECT:0 "#F Allows the [GetTrait('infernalist').GetName( GetNullCharacter )] to move through solid objects.#!"
 WALK_THE_WALLS_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] can walk on walls or ceilings at a walk or crawl.#!"
 DEMON_HIDE_PERK_EFFECT:0 "#F Alters the [GetTrait('infernalist').GetName( GetNullCharacter )]'s skin, allowing damage soak and causing fire damage to any piercing item. Incidentally this also allows fire damage to claws or biting.#!"
 AWARENESS_PERK_EFFECT:0 "#F With a mind shattering shock, the demon blows open the doors of occult perception.#!"
 LUCIFERIAN_CHARM_PERK_EFFECT:0 "#F An [GetTrait('infernalist').GetName( GetNullCharacter )] with this Investment can get away with damned near anything. No matter what he says or does, he awes everyone he meets.#!"
 GUARDIAN_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] will receive an imp for protector. The imp will serve her and have an empathic tie so that they will know the location and emotional state of each other.#!"
 TOXIC_BLAST_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] can spew a liquid of demonic energy from their nose, eyes, mouth or fingertips. This is a hideous smelling, acidic, blackish green goo.#!"
 TWO_DIMENSIONAL_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] will become two dimensional allowing him to slip through cracks and become almost nonexistent when viewed from the side.#!"
 INVESTITURE_EYES_OF_THE_ABYSS_PERK_EFFECT:0 "#F The diabolist can stare into the eyes of a victim and cause him to feel empty and void of emotion. The subject will become unable to take any action except stare into her eyes.#!"
 SIGN_OF_THE_INFERNO_PERK_EFFECT:0 "不再因为火而受到伤害。\n#F 被地狱眷爱的唤魔者无需惧怕火焰。任何凡俗的热与火都不能伤害到他。它可能会烧毁他的衣物和财产，但他的肉体却不会留下任何伤痕。#!"
 BODY_ARMOR_PERK_EFFECT:0 "#F Take less damage.#!"
 MASTER_OF_THE_DOMAIN_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )] will always know what is happening 500 feet inside of her domain as if they were watching from above.#!"
 LIGHTNING_SPEED_PERK_EFFECT:0 "#F The diabolist may take additional action per turn#!"
 BOND_BREAKING_PERK_EFFECT:0 "#F The hand of Surgat guides this [GetTrait('infernalist').GetName( GetNullCharacter )]; normal locks, knots, bindings fall open when she caresses them.#!"
 DEMONIC_STRENGTH_PERK_EFFECT:0 "#F Evil vitality flows into the supplicant's limbs. They have the strength of a minor devil.#!"
 SHAMEFUL_SIGHT_PERK_EFFECT:0 "#F Gazing into a person's eyes, an [GetTrait('infernalist').GetName( GetNullCharacter )] can discern the sin that lie closest to the surface. The most shameful a person has done. In the infernalist's \"inner eyes\", an image of the deed wells up, clear as day. She might decide to keep that to herself for later use, sneer openly about it, or torment the victim with a vision of it. By chanting to her Patrona, the [GetTrait('infernalist').GetName( GetNullCharacter )] can display her vision in a reflective surface. Anyone in the area can see it. The [GetTrait('infernalist').GetName( GetNullCharacter )] appears blameless, even to magickal tracings.#!"
 ATROPHIC_TOUCH_PERK_EFFECT:0 "#F Will cause one of victim's arms or legs to wither away to nothing. There is no pain but the limb will disappear.#!"
 HAND_OF_THE_DEFILER_PERK_EFFECT:0 "#F The [GetTrait('infernalist').GetName( GetNullCharacter )]’s right hand gains the power to kill plants, gnarl wood, rust metal and rot any flesh it touches.#!"
 INFERNAL_PASSAGE_PERK_EFFECT:0 "#F Grants safe passage through Hell.#!"
 SUMMON_HELLIONS_PERK_EFFECT:0 "#F Minor demons can be summoned by the [GetTrait('infernalist').GetName( GetNullCharacter )] to protect her from danger. The demons will not put themselves in danger but will try to protect the [GetTrait('infernalist').GetName( GetNullCharacter )].#!"
 UNCANNY_BEAUTY_PERK_EFFECT:0 "#F In exchange for a sin or two, the supplicant assumes an unearthly, irresistible beauty.#!"
 ARMY_OF_THE_DAMNED_PERK_EFFECT:0 "#F Minor demons can be summoned by the [GetTrait('infernalist').GetName( GetNullCharacter )] to protect her from danger. They will fight until their forms are destroyed.#!"
 INFERNAL_RANKING_PERK_EFFECT:0 "#F Gives the [GetTrait('infernalist').GetName( GetNullCharacter )] minor status among the damned. The [GetTrait('infernalist').GetName( GetNullCharacter )] is superior to minor demons and can command them. They cannot be forced but most will obey as punishing disobedience is acceptable and expected.#!"
 REGENERATION_PERK_EFFECT:0 "Remove all wounds and maims every three months.\n#F This investment allows an [GetTrait('infernalist').GetName( GetNullCharacter )] to restore himself to health with a mere effort of will.#!"