 NS_DARK_HUMORS_PERK_EFFECT: "#flavor 拉米亚以其运动能力和对身体的掌控能力而闻名。他们不仅能够完成令人难以置信的体能壮举，而且还能通过纯粹的意志力操纵体内的体液平衡。#!"