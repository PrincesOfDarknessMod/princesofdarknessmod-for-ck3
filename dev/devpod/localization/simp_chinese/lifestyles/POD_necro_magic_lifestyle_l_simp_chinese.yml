 NS_PEERING_ACROSS_THE_SHROUD_PERK_EFFECT: "若你的亲属或朋友在神秘情况下被谋杀，你将知晓凶手的身份。\n#flavor 死者在我们中间行走，看不见也听不到。要指挥这些生物，亡灵术师必须能够感知他们#!"
 NS_SUMMON_SOUL_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n#flavor 召唤灵魂能让亡灵术师从[UmbraGlossaryLocalized('shadowlands','冥界')]召唤一个幽灵回来。#!"
 NS_COMPEL_SOUL_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#flavor 使用这种能力，吸血鬼可以在短时间内使幽灵屈服于她的意志。这种能力需要极高的信心，因为决心的失败会对亡灵术师带来灾难。#!"
 NS_HAUNTING_PERK_EFFECT: "作为[bs_spell|E]，为目标当前位置施加[GetModifier('spell_haunting_modifier').GetNameWithTooltip]，持续5年。\n#flavor 一名亡灵术师使用她血液的力量将鬼魂束缚在一个物体或位置上。#!"
 NS_TORMENT_PERK_EFFECT: "#flavor 通过使用镇魂曲，亡灵术师可以攻击鬼魂的无形身体，就像他本人是鬼魂一样。#!"
 NS_SEPULCHRE_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_shroudsight_perk_name: "帷幕之视"
 ns_tongue_of_the_dark_kingdoms_perk_name: "冥府之语"
 ns_touch_of_the_nether_perk_name: "冥界之触"
 ns_ex_nihilo_perk_name: "踏入虚境"
 ns_shroud_mastery_perk_name: "帷幕掌控"
 ns_ash_path_rituals_perk_name: "$necro_magic_ash_path_visible$[bs_rituals|E]"
 NS_SHROUDSIGHT_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor 尸幕视线使吸血鬼能够直接凝视[UmbraGlossaryLocalized('shadowlands','冥界')]#!"
 NS_TONGUE_OF_THE_DARK_KINGDOMS_PERK_EFFECT: "$POD_can_command_wraith_trigger_loca$\n#flavor 当使用[Glossary('冥府','game_concept_dark_kingdom_desc')]之舌时，亡灵术师可以与[UmbraGlossaryLocalized('shadowlands','冥界')]的幽灵交谈。#!"
 NS_TOUCH_OF_THE_NETHER_PERK_EFFECT: "允许你在物质世界与[umbra|E]的存在互动。\n#flavor 当使用下界之触时，亡灵术师可以存在于尸幕的两边；她在[UmbraGlossaryLocalized('shadowlands','冥界')]显现身体，同时在活人的土地上保持肉体。#!"
 NS_EX_NIHILO_PERK_EFFECT: "#flavor 虚无缥缈允许亡灵术师实际进入[UmbraGlossaryLocalized('shadowlands','冥界')]。在[UmbraGlossaryLocalized('shadowlands','冥界')]时，她会显现为一个特别凝固的幽灵。#!"
 NS_SHROUD_MASTERY_PERK_EFFECT: "解锁操纵尸幕选项于[umbra|E]\n#flavor 有了这个能力，亡灵术师可以极大地帮助或阻碍幽灵在活人世界的活动。#!"
 NS_ASH_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_seal_of_abamixtra_perk_name: "阿巴米克斯特拉之印"
 ns_awaken_the_homuncular_servant_perk_name: "唤起卑微仆从"
 ns_shambling_hordes_perk_name: "蹒跚尸群"
 ns_baleful_exorcism_perk_name: "恶念流放"
 ns_daemonic_possession_perk_name: "恶灵附身"
 ns_bone_path_rituals_perk_name: "$necro_magic_bone_path_visible$[bs_rituals|E]"
 NS_SEAL_OF_ABAMIXTRA_PERK_EFFECT: "作为[bs_spell|E]，在战争期间召唤一小群[GetMaA('shambler').GetName]。\n#flavor 通过唤起阿巴米克斯特拉之印，亡灵术师可以复活一具或一组尸体来完成简单的任务。#!"
 NS_AWAKEN_THE_HOMUNCULAR_SERVANT_PERK_EFFECT: "强化[GetPerk('ns_seal_of_abamixtra_perk').GetName(GetPlayer)][bs_spell|E]，增加[GetMaA('shambler').GetName]的军队生成数量。\n#flavor 有了这能力，亡灵术师可以从一具尸体上取下一小块，并将其变成一种怪异的使魔。#!"
 NS_SHAMBLING_HORDES_PERK_EFFECT: "强化[GetPerk('ns_seal_of_abamixtra_perk').GetName(GetPlayer)][bs_spell|E]，增加[GetMaA('shambler').GetName]的军队生成数量。\n#flavor 通过这能力，亡灵术师可以创造出一群行尸走肉来攻击她的敌人。#!"
 NS_BALEFUL_EXORCISM_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n#flavor 只需一句话和一个有力的手势，亡灵术师就能将凡人的灵魂从其躯体中驱除。#!"
 NS_DAEMONIC_POSSESSION_PERK_EFFECT: "作为[bs_spell|E]，将一个被束缚的[GetTrait('wraith').GetName(GetNullCharacter)]转化为[GetTrait('zombu').GetName(GetNullCharacter)]\n#flavor 恶邪附身能让亡灵术师将灵魂注入刚死去的身体。#!"
 NS_BONE_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_a_touch_of_death_perk_name: "亡逝之触"
 ns_reveal_the_catene_perk_name: "揭示联结"
 ns_tread_upon_the_grave_perk_name: "如履冥原"
 ns_death_knell_perk_name: "丧钟鸣响"
 ns_ephemeral_binding_perk_name: "无永之锚"
 ns_cenotaph_path_rituals_perk_name: "$necro_magic_cenotaph_path_visible$[bs_rituals|E]"
 NS_A_TOUCH_OF_DEATH_PERK_EFFECT: "#flavor 亡灵术师对幽灵经过或触摸后留下的残余能量有感应，使她能够确定一个物体、人或区域是否被幽灵触摸或影响过。#!"
 NS_REVEAL_THE_CATENE_PERK_EFFECT: "减少[stress|E]束缚成本[GetTrait('wraith').GetName( GetNullCharacter )]在物质世界中\n#flavor 亡灵术师能识别死者在物体上留下的灰烬印记，使她能区分鬼魂的玩物和[Fetters|E]。#! "
 NS_TREAD_UPON_THE_GRAVE_PERK_EFFECT: "减少[stress|E]束缚成本[GetTrait('wraith').GetName( GetNullCharacter )]在物质世界中\n#flavor 当亡灵术师接近亡者世界时，她会有所感觉。一个亡灵术师可能会使用她的自然感知力，而另一个可能会进行探查，但两者都能感觉到[UmbraGlossaryLocalized('shadowlands','冥界')]与活人世界的接触。#!"
 NS_DEATH_KNELL_PERK_EFFECT: "若你的[courtier|E]在神秘情况下被谋杀，你将知晓凶手的身份。\n#flavor 亡灵术师在接近死者世界的时候会有感觉。一个亡灵术师可能会使用她的自然感知，而另一个则可能是探查，但两者都能感觉到[UmbraGlossaryLocalized('shadowlands','冥界')]与活人世界的接触。#!"
 NS_EPHEMERAL_BINDING_PERK_EFFECT: "在物质世界中，缚灵[GetTrait('wraith').GetName( GetNullCharacter )]的维持不会消耗任何[stress|E]\n#flavor 过给一个物、人或地注入她自己的灰烬能量，亡灵术师可以制造一个人造[Fetters|E]，而不是依靠偶然形成。#!"
 NS_CENOTAPH_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_mortuus_in_vultus_perk_name: "逝者之貌"
 ns_algor_mortis_perk_name: "冰寒尸僵"
 ns_intimations_of_mortality_perk_name: "死之暗喻"
 ns_benedicto_mortem_perk_name: "亡者恩典"
 ns_benedicto_vitae_perk_name: "绯红恩典"
 ns_corpse_in_the_monster_rituals_perk_name: "$necro_magic_corpse_in_the_monster_visible$[bs_rituals|E]"
 NS_MORTUUS_IN_VULTUS_PERK_EFFECT: "#flavor 该隐之子可以使自己看起来好像是一具早已死去的尸体。#!"
 NS_ALGOR_MORTIS_PERK_EFFECT: "#flavor 通过尸冷，吸血鬼能够将自己变成冷静、忧郁的生物，不为凡人的痛苦或情感操纵所动。#!"
 NS_INTIMATIONS_OF_MORTALITY_PERK_EFFECT: "作为[bs_spell|E],使目标[GetModifier('spell_intimations_of_mortality_modifier').GetNameWithTooltip]持续5年。\n#flavor 短生的暗示能将短生种的令人不快和恼怒的一面加诸于吸血鬼身上。#!\n"
 NS_BENEDICTO_MORTEM_PERK_EFFECT: "在谋杀中免疫阳光伤害[schemes|E]。\n#flavor 有了这种能力，亡灵术师就会完全变成一具尸体的样子，并且能够洗去他处于吸血鬼形态时的弱点。#!"
 NS_BENEDICTO_VITAE_PERK_EFFECT: "作为[bs_spell|E]，为目标施加[GetModifier('spell_benedicto_vitae_modifier').GetNameWithTooltip]持续10年，和[GetModifier('spell_benedicto_vitae_after_modifier').GetNameWithTooltip]持续20年\n#flavor 有了祝福精血，该隐之子将能够享受凡人生活的许多美好方面而不放弃她的吸血鬼本性的力量。#!"
 NS_CORPSE_IN_THE_MONSTER_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_ashes_to_ashes_perk_name: "尘归尘"
 ns_rigor_mortis_perk_name: "亡骸僵"
 ns_ashen_ladys_embrace_perk_name: "灰烬女士的拥抱"
 ns_gift_of_melancholia_perk_name: "忧郁之赠"
 ns_dust_to_dust_perk_name: "土归土"
 ns_graves_decay_rituals_perk_name: "$necro_magic_graves_decay_visible$[bs_rituals|E]"
 NS_ASHES_TO_ASHES_PERK_EFFECT: "减少[masquerade_exposure_with_icon|E]暴露风险和增强掩盖潜藏[character_interaction|E]。\n#flavor 虽然有些该隐之子喜爱滥杀且不担心会带来任何后果，但其他该隐之子觉得此行为应该要更谨慎一些。使用这种能力可以将人的尸体变成一堆不起眼的灰烬，大约是原来尸体重量的五分之一。#!"
 NS_RIGOR_MORTIS_PERK_EFFECT: "当战争开始时，你的敌人中勇武最高的骑士将会受伤。\n#flavor 有了这个能力，亡灵术师可以让任何目标像尸体一样僵硬和静止。#!"
 NS_ASHEN_LADYS_EMBRACE_PERK_EFFECT: "作为[bs_spell|E]，使目标失去一个随机肢体。解锁灰烬亡女之拥[single_combat_duel|E]招式。\n#flavor 灰烬亡女之拥能使目标的肢体老化、干枯，并像忘在葡萄树上的葡萄一样枯萎。#!"
 NS_GIFT_OF_MELANCHOLIA_PERK_EFFECT: "作为[bs_spell|E]，使目标感染[GetTrait('gift_of_melancholia').GetName(GetPlayer)]，或在其领地爆发该[epidemic|E]。\n#flavor 这种力量都会对凡人和该隐之子造成一种剧烈的消耗性疾病。#!"
 NS_DUST_TO_DUST_PERK_EFFECT: "强化[GetPerk('ns_ashen_ladys_embrace_perk').GetName(GetPlayer)][bs_spell|E]和[single_combat_duel|E]招式\n#flavor 就像尘归于尘影响尸体一样，土归于土也影响吸血鬼的身体。援引土归于土可以让亡灵术师将另一个吸血鬼变成一堆灰烬，就像他在阳光下驻留或在火刑柱上被烧死一样。#!"
 NS_GRAVES_DECAY_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_eyes_of_the_wraith_perk_name: "死灵之眼"
 ns_aura_of_decay_perk_name: "衰败光环"
 ns_pischachas_feast_perk_name: "毗舍阇开宴"
 ns_curse_of_the_maelstrom_perk_name: "大漩涡之咒"
 ns_night_cry_perk_name: "夜啼"
 ns_vitreous_path_rituals_perk_name: "$necro_magic_vitreous_path_visible$[bs_rituals|E]"
 NS_EYES_OF_THE_WRAITH_PERK_EFFECT: "#flavor 通过调用这力量，亡灵术师可以像不眠死者那样看待世界。#!"
 NS_AURA_OF_DECAY_PERK_EFFECT: "给予[GetModifier('aura_of_decay_modifier').GetNameWithTooltip]时，给予敌方[knights|E]当作为[commander|E]在[combat_phase|E]时给予对手[single_combat_duel_plural|E]\n#flavor 这能力会加速任何陷入亡灵术师可怕灵光中的无生命物体的不可避免的命运，使吸血鬼能够使任何物体腐烂成一堆废墟。#!"
 NS_PISCHACHAS_FEAST_PERK_EFFECT: "可吞噬[GetTrait('wraith').GetName(GetNullCharacter)]\n#flavor 毕舍遮之宴允许吸血鬼可以靠弥漫在世界各处的熵来生存，或者直接以鬼魂的[Corpus|E]为食。#!"
 NS_CURSE_OF_THE_MAELSTROM_PERK_EFFECT: "作为[bs_spell|E]，令目标当前领地损失3点[development|E]，同时获得[GetModifier('spell_curse_of_the_maelstrom_modifier').GetNameWithTooltip]，持续5年。\n#flavor 亡灵术师可以诅咒她周围的环境，召唤出怨灵来造成混乱和破坏。#!"
 NS_NIGHT_CRY_PERK_EFFECT: "在[GetModifier('night_cry_enemy_modifier').GetNameWithTooltip]期间作为[knights|E]行动时，给予敌人[commander|E]，或在[combat_phase|E]期间给予你的敌对目标[single_combat_duel_plural|E]。\n当在[GetModifier('night_cry_ally_modifier').GetNameWithTooltip]期间扮演[knights|E]时，给予[commander|E]，或在[combat_phase|E]期间给予自己[single_combat_duel_plural|E]。\n#flavor 通过使用夜啼，亡灵术师能够展示她对熵的力量的掌握。她可以引导它离开她的盟友以帮助他们，或者她可以将它直接导入她的敌人并阻碍他们。#!"
 NS_VITREOUS_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_whispers_to_the_soul_perk_name: "灵魂低语"
 ns_kiss_of_the_dark_mother_perk_name: "暗母之吻"
 ns_dark_humors_perk_name: "黑暗体液"
 ns_caul_of_the_neverborn_perk_name: "未诞者之胎膜"
 ns_lament_of_dhainu_perk_name: "达·海努之哀恸"
 ns_path_of_the_twilight_garden_rituals_perk_name: "$necro_magic_path_of_the_twilight_garden_visible$[bs_rituals|E]"
 NS_WHISPERS_TO_THE_SOUL_PERK_EFFECT: "作为[bs_spell|E]，使目标获得25点[stress|E]\n#flavor 仅仅是听到对黑暗之母的真名的低语，就足以让凡人发疯，并让该隐之子的心充满恐惧。#!"
 NS_KISS_OF_THE_DARK_MOTHER_PERK_EFFECT: "撕咬[single_combat_duel|E]招式变得更加强大。\n#flavor 莉莉丝派咬住她的舌头，用黑色胆汁和$pod_vitae$的恶臭混合体填满她的嘴。她的咬合变得更加可怕，可以轻松地吞噬受害者的生命。#!"
 NS_CAUL_OF_THE_NEVERBORN_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor 随着这力量的使用，拉米亚加强了她与黑暗之母的黑色心脏的联系。赋予她更强的复原力和看到[UmbraGlossary('shadowlands')]的能力。#!"
 NS_LAMENT_OF_DHAINU_PERK_EFFECT: "#flavor 拉米亚痛苦地嚎叫，大地颤抖。一股蠕动着的黑暗瘴气从地面升起，将她的敌人困住。那些被黑暗抓住的人不会受到身体上的束缚，但会立即被情感上的痛苦所困扰，以至于他们试图以最便捷的方式结束自己的生命。#!"
 NS_PATH_OF_THE_TWILIGHT_GARDEN_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_calvaria_emissicius_perk_name: "颅骨使者"
 ns_consilium_mortuus_perk_name: "亡者劝谕"
 ns_ammorsus_vicarius_perk_name: "替齿之咬"
 ns_exedo_animus_perk_name: "吞噬心灵"
 ns_degulo_perk_name: "吞没"
 NS_CALVARIA_EMISSICIUS_PERK_EFFECT: "#flavor 卡帕多西亚氏族最珍贵的秘密之一是通过死者的眼窝进行监视的能力。#!"
 NS_CONSILIUM_MORTUUS_PERK_EFFECT: "[espionage|E]进展速度：#P  +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#flavor 通过与已死目标的头颅对话，发现从腐烂的嘴唇中撬出一个有保证的真相是很有可能的#!"
 NS_AMMORSUS_VICARIUS_PERK_EFFECT: "#flavor 使用这能力，亡灵术师可以抓着头骨的下颌骨和上颌骨作为一种奇异的近身武器，将头骨贴在矛尖上进行远距离攻击，甚至可以不动头骨，让作为一个陷阱。#!"
 NS_EXEDO_ANIMUS_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]+#!\n#flavor 通过携带一个头骨——无论是来自凡人还是该隐之子——亡灵术师与头骨的前主人形成了一种共感联系。#!"
 NS_DEGULO_PERK_EFFECT: "作为[character_interaction|E]，可通过食用[prisoner|E]的头骨，在选定的[perks|E]中获得$pod_discipline$\n#flavor 吞没是亡灵术师吞噬灵魂碎片并将其作为自己的一部分永远保留的方法。#!"
 ns_tend_the_body_garden_perk_name: "照料肉体花园"
 ns_witchs_fruit_perk_name: "女巫之果"
 ns_raise_the_green_one_perk_name: "唤起绿尸"
 ns_wails_and_whispers_perk_name: "哀嚎与低语"
 ns_chthonic_womb_perk_name: "冥界之胎"
 ns_nightshade_path_rituals_perk_name: "$necro_magic_nightshade_path_visible$[bs_rituals|E]"
 NS_TEND_THE_BODY_GARDEN_PERK_EFFECT: "减少[masquerade_exposure_with_icon|E]暴露风险和增强掩盖潜藏[character_interaction|E]。\n#flavor 拥有这能力的亡灵术师可以加速或减缓腐烂的过程，在几秒钟内将死去的凡人变成苍蝇的臃肿宿主，或者使终焉之死的腐败失效。#!"
 NS_WITCHS_FRUIT_PERK_EFFECT: "#flavor 每样植物都依靠死亡来生长。腐烂之物丰富了土壤，而树木、藤蔓和草在吸收重要的营养物质的同时，也吸收了坏死回声。一个亡灵术师可以通过将它们的果实暴露在她的血液中来唤醒这种死亡灵光。#!"
 NS_RAISE_THE_GREEN_ONE_PERK_EFFECT: "#flavor 夜泣亡灵术师可以唤起一具被植物物质束缚并强化的尸体。覆盖在它皮肤上的叶子和强壮的藤蔓补充了它腐烂的筋肉。活外壳赋予它速度和自我保护的本能，这在其他活死人身上是看不到的。#!"
 NS_WAILS_AND_WHISPERS_PERK_EFFECT: "#flavor 随着亡灵术师的理解加深，她探索了生与死之间摇摆不定的屏障。当她像报丧女妖一样尖叫时，她可以引诱一个灵魂走向灭亡，增加承受严重伤害的概率。#!"
 NS_CHTHONIC_WOMB_PERK_EFFECT: "吸干凡人时能将其唤为[GetTrait('wraith').GetName( GetNullCharacter )]\n#flavor 作为此道途的顶点，一个亡灵术师将杀戮和生育结合起来，生下了她所杀的凡人的鬼魂。#!\n"
 NS_NIGHTSHADE_PATH_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
 ns_song_of_the_dead_perk_name: "死之歌"
 ns_summon_wisp_perk_name: "冥火燎"
 ns_harrowing_perk_name: "哀之歌"
 ns_phantasms_perk_name: "幽空塑"
 ns_h_torment_perk_name: "苦痛诅咒"
 ns_path_of_haunting_rituals_perk_name: "$necro_magic_path_of_haunting_visible$[bs_rituals|E]"
 NS_SONG_OF_THE_DEAD_PERK_EFFECT: "作为[bs_spell|E]，使目标获得25点[static_stress|E]以自身承受[static_stress|E]为代价\n#flavor 吸血鬼吟唱着，将未曾听过的话语编入歌曲，向听众灌输对死亡的不健康的迷恋。#!"
 NS_SUMMON_WISP_PERK_EFFECT: "#flavor 吸血鬼用[UmbraGlossaryLocalized('shadowlands','冥界')]的游灵能量注入他的血，召唤出一个闪烁的光球。这缕光可能会引诱毫无戒心的凡人进入陷阱或制造巧妙的分心。#!"
 NS_HARROWING_PERK_EFFECT: "强化[GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)]，将目标[static_stress|E]增至50，并降低消耗至13[static_stress|E]。\n#flavor 哀歌通过睡梦作祟扩大了死者之歌的恐怖，将梦境变成了死亡噩梦。#!"
 NS_PHANTASMS_PERK_EFFECT: "强化[GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)]，将目标[static_stress|E]增至75。\n#flavor 吸血鬼将[UmbraGlossaryLocalized('shadowlands','冥界')]的能量雕塑成精心制作的幻觉，使活人感到恐惧。#!"
 NS_H_TORMENT_PERK_EFFECT: "强化[GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)]，将目标[static_stress|E]增至100。\n#flavor 吸血鬼撕开了他的受害者周围的生命和[UmbraGlossaryLocalized('shadowlands','冥界')]之间的尸幕，召唤恶灵来纠缠她。#!"
 NS_PATH_OF_HAUNTING_RITUALS_PERK_EFFECT: "$necro_magic_shared_ritual_perk_effect$"
