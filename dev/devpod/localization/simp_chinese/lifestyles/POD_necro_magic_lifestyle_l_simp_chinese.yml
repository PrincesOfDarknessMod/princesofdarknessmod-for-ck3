 NS_BLOOD_SCOURGE_PERK_EFFECT: "#flavor 使用你的$pod_vitae$令[GetTrait('wraith').GetName( GetNullCharacter )]承受剧痛#!"
 NS_CURSED_EUCHARIST_PERK_EFFECT: "作为[bs_spell|E]，驱使被束缚的[GetTrait('wraith').GetName( GetNullCharacter )]令自身损失25[stress|E]\n#flavor 亡灵法师可尝试从[GetTrait('wraith').GetName( GetNullCharacter )]恢复意志力#!"
 NS_PURGE_THE_APOSTATES_SOUL_PERK_EFFECT: "#flavor 对[GetTrait('wraith').GetName( GetNullCharacter )]造成恶性伤害，并生成一滩灵质。#!"
