 THOUGHT_FORM_OF_THE_TWELVE_MINISTERS_PERK_EFFECT: "作为[character_interaction|E]，允许你获得[GetModifier( 'POD_thought_form_of_the_twelve_ministers_modifier' ).GetNameWithTooltip|L]\n#F 这灵赋的口头咒语是唵-伽-拉-林-萨-伽-拉-林-哈-伽-拉-林。这灵赋能让星占在短暂的瞬间达到真正的灵性平衡。在那一刻，所有极端的欲望和不纯的情绪都会被自我的无情冲击彻底摧毁。一道惊人的能量电光般传遍星占的每一个脉轮。这种状态只持续了一秒钟，然后消失了。但在它余波中，星占被赋予力量，身上环绕着淡绿色的光环。只有少数几位星占有资格学习这灵赋，而且只有奇美拉的化身才能传授它。#!"
