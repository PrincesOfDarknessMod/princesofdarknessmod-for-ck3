 SLEEP_OF_THE_HERO_PERK_EFFECT: "允许在非自然死亡时陷入[GetTrait('torpor').GetName( GetPlayer )]并退位。\n#F 这个强大的灵赋在芬尼安历史上已经被多次祈求。当一位伟大的英雄在战斗中殒命时，芬尼安族人会将他的尸体奉献给大地。这灵赋在芬尼安、大地和英雄的灵魂之间建立了一种纽带。这位英雄的生命得以重生，但他将陷入沉睡，直到怒嚎末日降临才会苏醒。目标必须被安置在地下，比如洞穴或坟墓之中。在这沉睡期间，英雄不受自然元素的影响，也不需要呼吸。#!"
