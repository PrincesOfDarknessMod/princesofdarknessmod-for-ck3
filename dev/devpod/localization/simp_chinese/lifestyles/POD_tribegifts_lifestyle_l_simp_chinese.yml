 HOME_IN_ALL_LANDS_PERK_EFFECT: "[umbra_aptitude|E]：[grace_i]#P +50%#!\n作为[character_interaction|E]，允许无视外交距离限制，只要目的地有低[development|E]，你就能传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 赤爪中的传说称，与祖狼有着最紧密联系的狼并不受距离的限制，实际上可以出现在任何有狼存在的地方。这长期以来被认为只是传说，但事实上，具有足够强大血统的赤爪长者可能会学会从一个地方消失并出现在世界或[umbra|E]的任何其他地方，前提是祖狼在他之前曾经到过那里。#!"
