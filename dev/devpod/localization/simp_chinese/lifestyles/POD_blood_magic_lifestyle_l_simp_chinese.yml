 grondrskas_impasse_perk_name: "格伦德斯卡的绝境"
 mouth_of_djabalek_perk_name: "贾巴雷克的吞噬"
 the_white_tower_perk_name: "白骨高塔"
 DOMAIN_BREACH_PERK_EFFECT: "#flavor 库都与自身领域的联结如此紧密，任何入侵者闯入边界的瞬间便会被他察觉。#!"
 FINGERS_OF_BIALOWIEZA_PERK_EFFECT: "[imprison|E]概率：#P +10%#!\n能够招募[GetMaA('animated_tree').GetName]作为[men_at_arms|E]\n\n#flavor 掌握这种力量的库都能够号令周遭的草木，将猎物缠绕束缚使其动弹不得。#!"
 GRONDRSKAS_IMPASSE_PERK_EFFECT: "#flavor 有这样一个传说，一名偷猎者擅自闯入棘秘魑的领地，不久便陷入极度的恐慌，仓皇逃窜。他本以为自己对这片森林了如指掌，可树木却在他周围不断移动，封锁所有退路，将他径直驱向早已守株待兔的库都。#!"
 MOUTH_OF_DJABALEK_PERK_EFFECT: "战斗开始时，强制敌方[knight|E]中[prowess|E]最低者退出战斗，并吸食其血液\n\n#flavor 贾巴莱克是一头恐怖的棘秘魑，被埋葬在比亚沃维耶扎森林的某处。据说即便陷入沉眠，它仍在不断张开巨口进食，在睡梦中吞噬任何落入其中的生灵。库都会在猎物脚下撕裂大地，将其送入贾巴莱克的口中。#!"
 THE_WHITE_TOWER_PERK_EFFECT: "#flavor 白骨高塔是曾与贾巴莱克签订契约的地底恶魔所赠予的礼物。比亚沃维耶扎内所有受害者的骸骨都会破土而出，将库都包裹其中，化作一座由泥土与白骨筑成的高塔。#!"
 call_the_children_perk_name: "召唤恶魔之子"
 heed_the_hell_bound_heart_perk_name: "倾听地狱之心"
 aegis_alighieri_perk_name: "阿利吉耶里的庇护"
 heave_the_host_of_hell_perk_name: "驱逐地狱宿主"
