 SHROUD_OF_OBLIVION_PERK_EFFECT: "可与尸幕另一侧的角色进行互动\n\n#flavor 库都撕裂[UmbraGlossary('underworld')]的一角令周遭区域被其力量浸染。#!"
 SPECTRAL_CLOAK_PERK_EFFECT: "#flavor 库都借由亡者的视界让附近生灵窥见死后世界从而陷入惊惧。这件斗篷能隐匿库都的身形，让所有看到的人因恐惧而逃离。#!"
 POND_OF_MALEVOLENT_DREAD_PERK_EFFECT: "[bs_spell|E]：召唤两支[GetMaA('spectres').GetName]协助你作战\n[kraina|E]：改为召唤四支\n\n#flavor 暗影之海坐落于冥界深渊之上，是最寒冷、最无光、最幽暗绝望的所在，无数灵魂在此濒临彻底湮灭。库都打开一道深渊通道，汲取这片海域的毁灭之力并将其释放。#!"
 WRATH_OF_THE_TEMPEST_PERK_EFFECT: "[bs_spell|E]：对一名角色施加[stress|E]，数值取决于你击杀过的角色数量\n[kraina|E]：额外对其造成#V [EmptyScope.ScriptValue('POD_base_lightning_damage')|V0]雷电#!伤害\n\n#flavor 库都召唤所有被自己杀害者的临终哀嚎，撕裂世界屏障，让无形的毁灭风暴倾泻而出。#!"
 HUNGER_OF_THE_VOID_PERK_EFFECT: "[bs_spell|E]：为所在地施加[GetModifier('hunger_of_the_void_modifier').GetNameWithTooltip]持续10年\n[kraina|E]：额外汲取该省份内所有[GetTrait('mortal').GetName(GetPlayer)]的力量\n\n#flavor 库都化身大风暴的扭曲具象，折磨自身灵魂以在现实中撕开一道纯粹的毁灭深渊。#!"
 genius_loci_1_perk_name: "初阶地灵"
 genius_loci_2_perk_name: "次阶地灵"
