 KUPALAS_FURY_PERK_EFFECT: "[bs_spell|E]：移除你所处位置的一个[holding|E]。\n\n#flavor 库都用其血唤醒了库帕拉的污秽之力，使这股诡异的力量能够啃噬山脉根基，如同棘秘魑纹章的巨龙在地下肆虐。#!"
 breath_of_whispers_perk_name: "低语之息"
 BREATH_OF_WHISPERS_PERK_EFFECT: "#flavor 即使不在场，库都也能让其波雅尔心生畏惧。这种力量能将吸血鬼的话语乘风而起，并带来目标的回应。#!"
 biting_gale_perk_name: "尖刺狂风"
 BITING_GALE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中施加#V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#![POD_superficial_damage|E]。\n\n#flavor 复仇的库都召唤出一阵锋利的狂风，肆虐其选定的区域。#!"
 breeze_of_lethargy_perk_name: "倦怠微风"
 BREEZE_OF_LETHARGY_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('breeze_of_lethargy_modifier').GetNameWithTooltip]。\n\n#flavor 虽然不能立即诱发睡眠，但这种力量所引发的风会带来日益加剧的疲惫感和麻木的乏力感，遍及每一块肌肉。#!"
 ride_the_tempest_perk_name: "乘御风暴"
 RIDE_THE_TEMPEST_PERK_EFFECT: "#flavor 运用这种力量的库都以惊人的速度乘风而行，突然出现在其领地内的各个村庄，令人畏惧。#!"
 fury_of_the_night_sky_perk_name: "夜空之怒"
 FURY_OF_THE_NIGHT_SKY_PERK_EFFECT: "[bs_spell|E]：在目的地召唤[GetModifier('weather_magic_storm_modifier').GetNameWithTooltip]。\n\n#flavor 库都以鲜血与意志强化愤怒，甚至能将全部怒气投射到夜空。翻滚的灰色云层遮蔽了星月，卷起阵阵狂风，带来冰冷的暴雨和闪电。#!"
 pool_of_lies_perk_name: "谎言之池"
 POOL_OF_LIES_PERK_EFFECT: "#flavor 这种万用的力量可以在水面创造出立体幻象，如何运用取决于库都的创造力。#!"
 watery_haven_perk_name: "水之庇护"
 WATERY_HAVEN_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n\n#flavor 库都将目标沉入深水池中，以保护他免受危险。#!"
 fog_over_sea_perk_name: "渡海之雾"
 FOG_OVER_SEA_PERK_EFFECT: "#flavor 库都如超常的鬼魅身影，在水面上行走如履平地，不留一丝涟漪。#!"
 minions_of_the_deep_perk_name: "深渊仆从"
 MINIONS_OF_THE_DEEP_PERK_EFFECT: "能够招募[GetMaA('water_elemental').GetName][men_at_arms|E]。\n\n#flavor 库都可以透过将自己的血滴入水中，召唤或唤醒实体化的水元素为他效力。#!"
 doom_tide_perk_name: "末日之潮"
 DOOM_TIDE_PERK_EFFECT: "[bs_spell|E]：对目标施加[GetModifier('doom_tide_modifier').GetNameWithTooltip]。\n\n#flavor 许多船只沉在海底，被库都的漩涡击毁。#!"
 fiery_courage_perk_name: "烈火勇气"
 FIERY_COURAGE_PERK_EFFECT: "#flavor 没有吸血鬼能够掌握自己恐惧的元素，所以这种力量只能将恐惧消散到只剩一丝余烬。#!"
 combust_perk_name: "爆燃之眼"
 COMBUST_PERK_EFFECT: "#flavor 库都的眼睛闪烁着鲜艳的橙色光芒，蕴含着强大的魔法力量，使灼热至极的高温气流缠绕目标周身。#!"
 wall_of_magma_perk_name: "岩浆之墙"
 WALL_OF_MAGMA_PERK_EFFECT: "#flavor 库都抬手使大地裂开，喷涌而出的炽热岩浆墙迅速凝固成任何想要的形状。#!"
 bs_heat_wave_perk_name: "灼热之浪"
 BS_HEAT_WAVE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中施加#V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0]火焰#!伤害。\n\n#flavor 库都如同蒸汽喷泉，向视线范围内的受害者喷射出使人脱水的空气。#!"
 volcanic_blast_perk_name: "火山爆发"
 VOLCANIC_BLAST_PERK_EFFECT: "#flavor 在库都命令下，熔岩从地底爆发，形成巨大的间歇泉。滚烫的岩浆喷射一大片区域，再向四面八方落下。#!"
 the_frustrations_of_nestrecha_perk_name: "涅斯特蕾莎的挫败"
 THE_FRUSTRATIONS_OF_NESTRECHA_PERK_EFFECT: "#flavor 这种力量以悲伤和失败女神的名字命名，能让库都夺走对手的决心。#!"
 the_insults_of_krivda_perk_name: "刻里芙达的侮辱"
 THE_INSULTS_OF_KRIVDA_PERK_EFFECT: "[bs_spell|E]：对目标施加[mental_break|E]。\n\n#flavor 凭借着仇恨与苦涩女神刻里芙达之力，库都的侮辱激怒了其目标。#!"
 the_weeping_of_kruchina_perk_name: "刻鲁奇娜的啜泣"
 THE_WEEPING_OF_KRUCHINA_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]和[commander|E]或在[single_combat_duel_plural|E]中施加30[stress_i|E]。\n\n#flavor 库都的瞪视能让人痛苦到除了哭泣之外什么都做不了。这种力量远不止于让人流几滴眼泪，还会让人歇斯底里地嚎啕大哭、撕心裂肺地咬牙切齿。#!"
 the_misfortune_of_chernogolov_perk_name: "切尔诺戈洛夫的厄运"
 THE_MISFORTUNE_OF_CHERNOGOLOV_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[commander|E]施加[GetModifier('the_misfortune_of_chernogolov_modifier').GetNameWithTooltip]。\n\n#flavor 库都透过宣告某人在劫难逃或注定要失败，将银胡厄运之神切尔诺戈洛夫的注意力引向其受害者。#!"
 the_starvation_of_marena_perk_name: "马雷纳的饥荒"
 THE_STARVATION_OF_MARENA_PERK_EFFECT: "[bs_spell|E]：对[character|E]施加#V [EmptyScope.ScriptValue('POD_base_cold_damage')|V0]寒冷#!伤害及其所在地[GetModifier('weather_magic_blizzard_modifier').GetNameWithTooltip]。\n\n#flavor 库都透过呼唤库帕拉之妻，召唤马雷纳领域中的寒冷和饥荒。凛冽的寒风席卷受害者，使他骨瘦如柴，仿佛刚刚熬过了最严酷的寒冬。#!"