 GENIUS_LOCI_1_PERK_EFFECT: "所有[krainas|E]施展成功率提升#P +10%#!\n\n#flavor 库都的感知延伸至脚下每一寸土地。#!\n@warning_icon!#warning 完成其他任意[kraina|E]路径后将自动获得#!"
 GENIUS_LOCI_2_PERK_EFFECT: "所有[krainas|E]施展成功率提升#P +10%#!\n可以使用[fetish|E][artifacts|E]\n\n#flavor 库都的感知进一步拓展，自身的库都魔术亦随之精进。#!"
 GENIUS_LOCI_3_PERK_EFFECT: "在授能区域内施展[krainas|E]及其[bs_rituals|E]时消耗的@blood_icon!减少1点\n\n#flavor 库都所掌控的地灵权能已能实现自我存续。#!"
 GENIUS_LOCI_4_PERK_EFFECT: "所有[krainas|E]施展成功率提升#P +15%#!\n$countermeasures_unlocks_t3_all_seeing_eye$\n\n#flavor 库都的地灵权能已然洞察万物。#!"
 GENIUS_LOCI_5_PERK_EFFECT: "在授能区域内施展[krainas|E]及其[bs_rituals|E]时获得额外效果\n\n#flavor 此刻，库都与这片土地浑然一体。#!"
