 BUREBISTAS_THRONE_PERK_EFFECT: "#flavor 曾令希腊人恐惧了数个世纪的布雷比斯塔王在山巅筑造了一座宏伟王座，端坐其上俯瞰所有的领土与敌人。布雷比斯塔已经不再需要这座王座，便将其传给了自己的库都子嗣。#!"
 PIETROSUS_HOSPITALITY_PERK_EFFECT: "#flavor 彼得罗苏峰的刺骨寒风与酷寒气温能在顷刻之间夺走没有防护者的性命。库都会召来这些强劲的凛冽寒风环绕己身，冻伤周遭生灵，同时让自己免疫寒冷与飓风的侵袭#!"
 THE_BANKS_OF_THE_BASCA_PERK_EFFECT: "大幅提升在沿海省份完成[siege|E]或[raid|E]后[imprison|E][characters|E]的概率\n\n#flavor 每逢降雨，巴斯卡河便会冲破堤岸，卷走整座村庄以及所有没能找到高地避险的人。掌握此权能的库都，无论行至何处都携带着巴斯卡河奔涌不息的磅礴之力。#!"
 KUPALAS_EXHALATION_PERK_EFFECT: "[bs_spell|E]：为你的所在地施加[GetModifier('kupalas_exhalation_modifier').GetNameWithTooltip]持续5年\n[kraina|E]：改为施加[GetModifier('kupalas_exhalation_modifier2').GetNameWithTooltip]\n\n#flavor 库都自地底召来致命的雾气，任何火焰都能将这些雾气引燃，引发恐怖爆炸。世人皆认为，这些雾气正是库帕拉呼出的气息。#!"
 RESTLESS_MEDIAS_PERK_EFFECT: "[bs_spell|E]：为你的所在地施加[GetModifier('weather_magic_earthquake_modifier').GetNameWithTooltip]持续10年\n[kraina|E]：额外为周边所有省份施加该效果\n\n#flavor 梅迪亚什的土地时常震颤翻腾，将房屋连根拔起。当地人将此归咎于神明，但库都心知肚明，这是长眠于地底墓穴的库帕拉在躁动不安。技艺最为精湛的库都，懂得如何唤醒这份躁动。#!"
 danubian_voices_perk_name: "多瑙之声"
 grave_of_the_marea_neagra_perk_name: "黑海之墓"
 pontos_euxeinos_perk_name: "友睦之海"
 minions_of_deep_marmora_perk_name: "深海怪仆"
 pontos_axeinos_perk_name: "排外之海"
 DANUBIAN_VOICES_PERK_EFFECT: "#flavor 库都深知多瑙河的真正价值。河流的精魂会向他们低语，传递所知的情报或是为库都捎送讯息。#!"
 GRAVE_OF_THE_MAREA_NEAGRA_PERK_EFFECT: "#flavor 库都能安然潜入黑海的最深处，在那里惬意休憩，免受日光与外界的一切侵扰。#!"
 PONTOS_EUXEINOS_PERK_EFFECT: "[bs_spell|E]：治愈[POD_aggravated_damage|E]与非永久性伤口\n[kraina|E]：额外获得[GetModifier('pontos_euxeinos_modifier').GetNameWithTooltip]持续10年\n\n#flavor 希腊人曾将黑海称作友睦之海。对黑海的库都而言，这片海域名副其实。它会以宽广的胸怀将他们拥入怀中，治愈他们最严重的伤势。#!"
 MINIONS_OF_DEEP_MARMORA_PERK_EFFECT: "[bs_spell|E]：召唤一支[GetMaA('water_spirits').GetName]协助你作战\n[kraina|E]：额外多召唤一支\n\n#flavor 传说库齐库斯的库都发现只要将自己的血液滴入马尔马拉海，深渊中便会浮现诡异的巨兽供他驱策。其他科尔敦也发现任何一片水域都能达成此效。#!"
 PONTOS_AXEINOS_PERK_EFFECT: "[bs_spell|E]：敌方已登陆的军队[supplies|E]减少#V 20%#!\n[kraina|E]：额外对军队造成伤亡\n\n#flavor 在希腊人定居黑海南岸之前，他们将这片海域称作排外之海。对库都的仇敌而言，这片海域确实凶险至极。#!"
