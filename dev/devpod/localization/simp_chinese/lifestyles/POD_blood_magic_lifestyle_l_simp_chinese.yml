 CALL_THE_CHILDREN_PERK_EFFECT: "能够招募[GetMaA('demonhound').GetName]作为[men_at_arms|E]\n\n#flavor 想要驾驭，就必须先了解其本质。恶魔与犬类并无二致，只要主人一声召唤便会应声而来。#!"
 HEED_THE_HELL_BOUND_HEART_PERK_EFFECT: "[bs_spell|E]：给予一个[GetTrait('demon').GetName(GetPlayer)]或[GetTrait('witch').GetName(GetPlayer)][GetModifier('heed_the_hell_bound_heart_modifier').GetNameWithTooltip]持续5年\n[kraina|E]：改为给予[GetModifier('heed_the_hell_bound_heart_modifier2').GetNameWithTooltip]\n\n#flavor 无论是源于祝福还是契约的熟稔，饮下献祭之井井水的库都都会获得一种超自然感知，当恶魔的力量临近时便会收到警示。#!"
 AEGIS_ALIGHIERI_PERK_EFFECT: "获得针对[GetTrait('demon').GetName(GetPlayer)]与[GetTrait('witch').GetName(GetPlayer)]的强力精神防护\n担任[commander|E]时，在[combat_phase|E]对敌方[knights|E]施加[GetModifier('aegis_alighieri_modifier').GetNameWithTooltip]；在[single_combat_duel_plural|E]中，若对手是[GetTrait('demon').GetName(GetPlayer)]或[GetTrait('witch').GetName(GetPlayer)]，同样可施加此效果\n\n#flavor 阿利吉耶里的庇护令库都能够抵御来自恶魔之力的亵渎、掠夺与污染。#!"
 HEAVE_THE_HOST_OF_HELL_PERK_EFFECT: "[bs_spell|E]：对一个[GetTrait('demon').GetName(GetPlayer)]或[GetTrait('witch').GetName(GetPlayer)]造成#V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0]火焰#!伤害\n[kraina|E]：替换为造成#V [EmptyScope.ScriptValue('POD_double_fire_damage')|V0]火焰#!伤害\n\n#flavor 在学会召唤、感知和抵御地狱侵蚀之后，库都便拥有了彻底抹除这些地狱伤痕的能力。#!"
 REAP_THE_WELL_PERK_EFFECT: "能够招募[GetMaA('aughisky').GetName]作为[men_at_arms|E]\n\n#flavor 库都自掌心唤出染血的钩链将恶魔牢牢束缚，使其沦为自己的仆从。#!"
