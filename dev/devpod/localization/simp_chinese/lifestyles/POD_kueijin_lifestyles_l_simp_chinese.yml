 GLIMPSE_OF_YOMI_PERK_EFFECT: "在[combat_phase|E]中担任[commander|E]时，对敌方[commanders|E]施加[GetModifier('glimpse_of_yomi_commander_modifier').GetNameWithTooltip][modifier|E]对敌方[knights|E]或[single_combat_duel_plural|E]对手施加[GetModifier('glimpse_of_yomi_knight_modifier').GetNameWithTooltip][modifier|E]\n#F 此能力令[akuma|E]将[UmbraGlossaryLocalized('yomi_wan','幽冥')]的恐怖景象注入受害者脑海。能承受这种精神冲击而不崩溃逃窜者，堪称勇士#!"
 RAZOR_WINDS_PERK_EFFECT: "作为[character_interaction|E]，可以使敌人获得[GetModifier( 'razor_winds_power_modifier' ).GetNameWithTooltip|L]状态\n#F [akuma|E]开启通往[UmbraGlossaryLocalized('yomi_wan','幽冥')]的临时裂隙，释放出来自[UmbraGlossaryLocalized('yomi_wan','幽冥')]的剃刀之风#!"
 FAVOUR_OF_THE_YAMA_KINGS_PERK_EFFECT: "作为[decision|E]，可消耗魔功点数换取金钱与威望\n#F [Glossary('阎魔','podgloss.yamaking')]会向得力仆役赐予此能力：扭曲气运为行恶者带来好处#!"
 REMEMBRANCE_OF_YOMI_PERK_EFFECT: "作为[character_interaction|E]，可将目标转化为[GetTrait('infernalist').GetName( GetPlayer )]以供日后驱使其杀人\n#F 所有万鬼都记得他们的魄在[UmbraGlossaryLocalized('yomi_wan','幽冥')]度过的时光——那段回忆从来都不愉快。此能力允许[akuma|E]将这些记忆强行推到万鬼的意识最前端并加以放大，迫使其做出堕落的行为。#!"
 WEAVING_THE_YOMI_WORLD_PERK_EFFECT: "解锁[GetBuilding('nest_corrupt_01').GetName]建筑\n#F [akuma|E]可污染龙穴，将其转化为[Glossary('阎魔','podgloss.yamaking')]势力的黑暗能量源泉#!"
 FLOOD_OF_WICKEDNESS_PERK_EFFECT: "#F 即便潜心修炼魄的[GetTrait('kueijin').GetName( GetNullCharacter )]也暗自畏惧它。超脱魄力意味着失控沉沦。但某些强大[akuma|E]已学会驾驭魄力，比普通[GetTrait('kueijin').GetName( GetNullCharacter )]更易释放其威能#!"
 YOMI_PORTAL_PERK_EFFECT: "允许招募[GetMaA('generic_servitor').GetName]作为[men_at_arms|E]\n#F [Glossary('阎魔','podgloss.yamaking')]允许[akuma|E]召唤并束缚[UmbraGlossaryLocalized('yomi_wan','幽冥')]生物，获得仆从、刺客与恐怖军团#!"
 GIFT_OF_PO_PERK_EFFECT: "允许招募[GetMaA('chih_mei').GetName]作为[men_at_arms|E]\n#F 当[akuma|E]施展此异能时，可以向[Glossary('阎魔','podgloss.yamaking')]或恶魔导师祈求，从[UmbraGlossaryLocalized('yomi_wan','幽冥')]界获取赤裸的魄魂。这些魂魄既可创造仆从，亦可直接吞噬获取力量。#!"
 THE_RED_BRIDGE_PERK_EFFECT: "可自由穿越“破碎之镜”\n#F 有时[Glossary('阎魔','podgloss.yamaking')]会要求其在人间的强大仆从前往黄泉朝觐。此时它们会赐予此能力，允许开启通往[UmbraGlossaryLocalized('yomi_wan','幽冥')]界的门户，并获得在其中生存的手段。#!"
 POD_REMOVE_DHARMA_XP_EFFECT: "你失去#N $VALUE$#![trait_level_track_xp|E]的[CHARACTER.Custom('PODCurrentDharma')][trait|E]"
 POD_remove_dharma_xp_effect_tt: "#X 此乃堕尘，开悟者迷失本心，在通往[Glossary('云开雾散','podgloss.hundredclouds')]路上倒退的蒙昧时刻。#!"