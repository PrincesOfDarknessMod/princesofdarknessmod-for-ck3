l_simp_chinese:
 soul_arts_lifestyle_name: "灵功"
 soul_arts_lifestyle_desc: "灵功是核心美德和气通灵的延伸修炼。它们潜力巨大，但要达到这一境界，过程艰难而缓慢。"
 soul_arts_lifestyle_highlight_desc: "由于你的[Glossary('心法','podgloss.dharma')]，这个生活方式中会给予额外#P [GetPlayer.MakeScope.ScriptValue('dharma_lifestyle_xp_mult')|%0]#!的[experience|E]积累。"
 monthly_soul_arts_lifestyle_xp_gain_mult: "每月灵功[lifestyle|E]的[experience|E]"
 monthly_soul_arts_lifestyle_xp_gain_add: "每月灵功[lifestyle|E]的[experience|E]"
 soul_arts_focus: "灵功重心"
 soul_arts_focus_modifier: "[GetFocus('soul_arts_focus').GetName]"
 soul_arts_focus_desc: "修炼你的灵魂"
 soul_arts_focus_effect_desc: "灵功重心给予："
 the_ghost_arts_visible: "鬼灵"
 the_heavenly_arts_visible: "天庭"
 the_beast_arts_visible: "兽性"
 the_devil_arts_visible: "魔道"
 the_dragon_tear_visible: "龙泪"
 the_hell_weaving_visible: "魔演"
 soul_arts_ghost_mask_perk_name: "鬼面"
 soul_arts_crippling_sorrows_perk_name: "断肠悲"
 soul_arts_death_lines_perk_name: "死纹诀"
 SOUL_ARTS_GHOST_MASK_PERK_EFFECT: "当你在物质世界中时，也可以与[umbra|E]的存在互动。\n#flavor 饿殍将灵体之气覆盖在他的脸和身体上，使他能够更深入地窥探冥界，并能与那里的居民交谈，仿佛他就在他们身边。#!"
 SOUL_ARTS_CRIPPLING_SORROWS_PERK_PERK_EFFECT: "作为[character_interaction|E]，使目标获得[GetModifier('soul_arts_crippling_sorrows_modifier').GetNameWithTooltip]效果，持续五年。\n#flavor 凡凝视修习者，顷刻间万般失却之物皆涌心头。#!"
 SOUL_ARTS_DEATH_LINES_PERK_EFFECT: "#flavor 修习者可揭现世脆弱本质，显万物易碎之理。#!"
 soul_arts_like_a_whisp_perk_name: "幽萤式"
 soul_arts_beacon_of_longing_perk_name: "招魂引"
 soul_arts_the_touch_of_ghost_metal_perk_name: "冥金触"
 SOUL_ARTS_LIKE_A_WHISP_PERK_EFFECT: "作为[character_interaction|E]，终止所有针对你的[schemes|E]。\n#flavor 修习者以墨色幽气覆体，终得凡目不可视之境。#!"
 SOUL_ARTS_BEACON_OF_LONGING_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n$POD_can_summon_on_death_trigger_loca$\n#flavor 饿殍之气如白焰灼灼，生者不可见，亡魂竞相逐。#!"
 SOUL_ARTS_THE_TOUCH_OF_GHOST_METAL_PERK_EFFECT: "#flavor 幽冥之金自带咒诅，伤及本土阴灵。此术可使凡铁尽化同类凶煞之物。#!"
 soul_arts_world_of_quiet_perk_name: "寂静之界"
 soul_arts_through_the_spider_lily_gate_perk_name: "穿越彼岸花之门"
 soul_arts_making_love_to_ghosts_perk_name: "与鬼共枕"
 SOUL_ARTS_WORLD_OF_QUIET_PERK_EFFECT: "作为[character_interaction|E]，使目标获得[GetModifier('soul_arts_world_of_quiet_modifier').GetNameWithTooltip]效果，持续十年。\n#flavor 当修炼者需要秘密会面时，此术会为她与同伴——或是不幸的猎物——降下一道帷幕。。#!"
 SOUL_ARTS_THROUGH_THE_SPIDER_LILY_GATE_PERK_EFFECT: "#flavor 凭借此术，修炼者可踏遍冥界每个角落——只要敢于前行。#!"
 SOUL_ARTS_MAKING_LOVE_TO_GHOSTS_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor 民间传说确有其事：与亡者亲密接触终将招致同化。饿殍会释放一种幽黑的灵毒，或从口中直接喷吐，或自毛孔化为迷雾。#!"
 soul_arts_haunters_rage_perk_name: "显灵者之怒"
 soul_arts_curse_of_ashes_perk_name: "灰烬之咒"
 SOUL_ARTS_HAUNTERS_RAGE_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n#flavor 鬼魂乃极端情感的造物，修炼者通过引导灵界魔舞来模拟这种特质。#!"
 SOUL_ARTS_CURSE_OF_ASHES_PERK_EFFECT: "在作为[commander|E]参加[combat_phase|E]时，给予敌方[knights|E][GetModifier('soul_arts_curse_of_ashes_modifier').GetNameWithTooltip]，或在[single_combat_duel_plural|E]时给予对手。\n#flavor 饿殍触碰选定的目标，使其陷入无法餍足的折磨。饥渴与情欲皆成酷刑，纵使暴食纵欢亦无济于事。#!"
 soul_arts_graveyard_song_perk_name: "墓园挽歌"
 soul_arts_death_punch_perk_name: "死灵之拳"
 SOUL_ARTS_GRAVEYARD_SONG_PERK_EFFECT: "作为[character_interaction|E]，为目标所在的[duchy|E]施加[GetModifier('soul_arts_graveyard_song_modifier').GetNameWithTooltip]效果。\n#flavor 炼者在与亡者共鸣的静寂之处，吟唱起缥缈回荡的曲调——似挽歌又似情殇。旧爱重逢，逝亲低语，生死界限在此刻短暂消融。#!"
 SOUL_ARTS_DEATH_PUNCH_PERK_EFFECT: "若你杀死过的角色复活，其将获得[GetModifier('soul_arts_death_punch_modifier').GetNameWithTooltip]效果，持续10年。\n#flavor 修炼者一击便可分离血肉与魂魄，或许永世不得复合。#!"
 soul_arts_mortal_perfection_perk_name: "凡躯至臻"
 soul_arts_the_scent_of_heavens_favor_perk_name: "天恩之息"
 SOUL_ARTS_MORTAL_PERFECTION_PERK_EFFECT: "作为[character_interaction|E]，为目标施加[GetModifier('soul_arts_mortal_perfection_modifier').GetNameWithTooltip]效果。\n#flavor 饿殍周身散发神圣之气，通灵者可见其肌肤飘落莹光花粉般的辉芒。她永远从容，永远优雅。#!"
 SOUL_ARTS_THE_SCENT_OF_HEAVENS_FAVOR_PERK_EFFECT: "作为[character_interaction|E]，召唤一名具备指定[skills|E]的[GetTrait('mortal').GetName(GetNullCharacter)]加入你的[court|E]。\n#flavor 饿殍周身散发神圣之气，通灵者可见其肌肤飘落莹光花粉般的辉芒。她永远从容，永远优雅。#!"
 soul_arts_waywards_brand_perk_name: "逆命烙印"
 soul_arts_read_destiny_perk_name: "窥命之术"
 soul_arts_throat_cage_of_heaven_perk_name: "天喉囚笼"
 SOUL_ARTS_WAYWARDS_BRAND_PERK_EFFECT: "作为[character_interaction|E]，为目标施加[GetModifier('soul_arts_waywards_brand_modifier').GetNameWithTooltip]效果。\n#flavor 饿殍以触碰施加神谴之印，受术者会遭人本能地嫌恶回避，陷入困惑与绝望。#!"
 SOUL_ARTS_READ_DESTINY_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n#flavor 修炼者观测下界能量的流动，凝神追踪其漩涡与汇聚之处。#!"
 SOUL_ARTS_THROAT_CAGE_OF_HEAVEN_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]\n#flavor 修炼者发出低沉嗡鸣，或运使上脉轮吟唱。闻者皆被灵界金索禁锢，僵立当场。#!"
 soul_arts_mantle_of_living_prayer_perk_name: "活祷之袍"
 soul_arts_beloved_champion_perk_name: "挚爱斗士"
 soul_arts_fate_of_one_perk_name: "独一命运"
 soul_arts_the_gods_are_correct_perk_name: "神意昭然"
 SOUL_ARTS_MANTLE_OF_LIVING_PRAYER_PERK_EFFECT: "#flavor 你虽可踏入下界，但那里的生灵只信任同类——而此术能让你伪装得天衣无缝。#!"
 SOUL_ARTS_BELOVED_CHAMPION_PERK_EFFECT: "战争爆发时，你麾下最高勇武的勇士将获得[GetModifier('soul_arts_beloved_champion_modifier').GetNameWithTooltip]效果，持续2年。\n#flavor 修炼者以血在其额前画出耀目金印，指定某人为其专属斗士——此印记在灵界清晰可辨。#!"
 SOUL_ARTS_FATE_OF_ONE_PERK_EFFECT: "#flavor 修炼者缔结吉凶之兆，为在场者施加祝福或诅咒。#!"
 SOUL_ARTS_THE_GODS_ARE_CORRECT_PERK_EFFECT: "没有强力精神防护的角色更可能接受你的附庸提议。\n#flavor 修炼者头顶通灵可见的金色光轮，宣示她深信不疑的真理——而天地随之俯首。#!"
 soul_arts_dance_of_the_kinnara_perk_name: "紧那罗之舞"
 soul_arts_i_am_your_doom_perk_name: "吾即汝劫"
 SOUL_ARTS_DANCE_OF_THE_KINNARA_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_divine_bird_modifier').GetNameWithTooltip]。\n#flavor 饿殍将自身暂时转化为金翼人首的神鸟之姿。此形虽属灵体，却因蕴含磅礴辉光，纵是凡俗亦能惊鸿一瞥。#!"
 SOUL_ARTS_I_AM_YOUR_DOOM_PERK_EFFECT: "作为[character_interaction|E]，对目标施加一个使指定[skill|E]降低#N 5#!的[modifier|E]。#weak （如[GetModifier('soul_arts_i_am_your_doom_diplomacy_modifier').GetNameWithTooltip]）#!\n#flavor 神之敌命不久长——当修士为其命名时，命运自会顺应而动。#!"
 soul_arts_divinity_key_perk_name: "神性密钥"
 soul_arts_fate_of_houses_perk_name: "家宅命数"
 SOUL_ARTS_DIVINITY_KEY_PERK_EFFECT: "移除进入[umbra|E]的消耗。\n#flavor 大轮回之界域向修成此技者敞开。最令习得者讶异的是，此法竟会具现为一柄金钥，其内蕴光芒流转。#!"
 SOUL_ARTS_FATE_OF_HOUSES_PERK_EFFECT: "作为[character_interaction|E]，为目标及其整个[court|E]与所有[vassals|E]赋予[GetModifier('joss_modifier').GetNameWithTooltip]。\n#flavor 正义之主可拨弄命数，塑就特定地域的未来轨迹。#!"
 soul_arts_tea_with_beasts_perk_name: "与兽共茗"
 soul_arts_at_the_gates_of_wind_and_water_perk_name: "风水关前"
 SOUL_ARTS_TEA_WITH_BEASTS_PERK_EFFECT: "#flavor 从蝼蚁至巨鲸，万兽之言对饿殍而言不过寻常耳语。#!"
 SOUL_ARTS_AT_THE_GATES_OF_WIND_AND_WATER_PERK_EFFECT: "能够招募多种动物作为[men_at_arms|E]。\n#flavor 饿者双眸泛起苍蓝幽光，与百兽之境共鸣，引得细小精魂如流萤般聚拢其身。#!"
 soul_arts_healing_sleep_perk_name: "愈疗长眠"
 soul_arts_goblin_cat_perk_name: "精怪猫灵"
 soul_arts_duke_of_the_wild_perk_name: "荒野生灵"
 SOUL_ARTS_HEALING_SLEEP_PERK_EFFECT: "战争开始，强制敌方最高[prowess|E]的[knight|E]离场（除非其有强力精神防护）。\n#flavor 修士轻触之际，便赐予了冬蛰转春般的安眠。#!"
 SOUL_ARTS_GOBLIN_CAT_PERK_EFFECT: "作为[character_interaction|E]，召唤一只灵兽。\n#flavor 修士可使任意动物成为其夜行灵侍——若其心兽威能浩荡，甚至可唤来兽群成军。#!"
 SOUL_ARTS_DUKE_OF_THE_WILD_PERK_EFFECT: "#flavor 在通灵者眼中，修成心兽者会被蓝白烈焰吞没，继而化身为强横精怪之相：或是魁伟路神，或是巨翼秃鹫精魄，诸如此类。#!"
 soul_arts_summon_wilding_spirit_perk_name: "野性精魂"
 soul_arts_junkyard_menagerie_perk_name: "废铁兽苑"
 soul_arts_running_with_the_wolves_perk_name: "与狼奔袭"
 SOUL_ARTS_SUMMON_WILDING_SPIRIT_PERK_EFFECT: "#flavor 修士向特定精魂发出召唤，其声必达彼耳。#!"
 SOUL_ARTS_JUNKYARD_MENAGERIE_PERK_EFFECT: "能够招募[GetMaA('jagglings').GetName]作为[men_at_arms|E]。\n#flavor 饿殍掌心吐纳苍蓝之气，如尘雾般沉降，唤醒器物中的精怪灵性。#!"
 SOUL_ARTS_RUNNING_WITH_THE_WOLVES_PERK_EFFECT: "#flavor 凡尘走兽常以人类不及之姿穿越险棘，游走于虚实交织的秘径之间。#!"
 soul_arts_god_of_the_glen_perk_name: "幽谷之神"
 soul_arts_one_nights_revival_perk_name: "一夜复苏"
 SOUL_ARTS_GOD_OF_THE_GLEN_PERK_EFFECT: "解锁多种化兽形态选项。\n#flavor 寻常饿殍游历灵界时多限于人形拟态，然心兽修士可超脱此限。#!"
 SOUL_ARTS_ONE_NIGHTS_REVIVAL_PERK_EFFECT: "你的灵兽将获不死之身。\n#flavor 此技之讽喻令通晓诡道者会心——饿殍只需献祭少许生机，便可令新死之人或兽尸血肉重铸，强启生命灵光。#!"
 soul_arts_spirited_away_perk_name: "神隐"
 soul_arts_stone_lion_perk_name: "石狮镇守"
 SOUL_ARTS_SPIRITED_AWAY_PERK_EFFECT: "每隔#V 15#!年，如果都城拥有[duchy_building|E]槽位，其中龙穴将自动升级。\n#flavor 节庆夜或满月时，凡人偶入异界……而修士亦可掀起灵暴，强行贯通两界。#!"
 SOUL_ARTS_STONE_LION_PERK_EFFECT: "解锁[GetMaA('stone_lions').GetName]作为[men_at_arms|E]。\n#flavor 庙宇石狮在饿者意志下苏醒为护法灵兽。#!"
 soul_arts_ogres_bearning_perk_name: "食魔威仪"
 soul_arts_read_the_inner_darkness_perk_name: "窥心暗渊"
 soul_arts_tears_of_hell_perk_name: "地狱之泪"
 SOUL_ARTS_OGRES_BEARNING_PERK_EFFECT: "#flavor 修士周身迸发灼热罡气，通灵者视之如烈焰缠身的可怖恶鬼——然无论是否通灵，众生皆感战栗。#!"
 SOUL_ARTS_READ_THE_INNER_DARKNESS_PERK_EFFECT: "作为[character_interaction|E]，发现目标的一个随机[secret|E]。\n#flavor 修炼者凝视某人的双眼，窥见他们竭力隐藏的事物。#!"
 SOUL_ARTS_TEARS_OF_HELL_PERK_EFFECT: "作为[character_interaction|E]，根据目标的[sinful|E][traits|E]数量，对其施加[stress|E]。\n#flavor 饿鬼的双眸与耳畔溢出血红之气，滴落如雨。凡被腐化或残忍标记之物，于她而言皆如夜中萤火般清晰：受折磨的亡魂、饱受煎熬的饿殍、通往地狱的隐秘之门，尽收眼底#!"
 soul_arts_wrathful_ajna_perk_name: "忿怒眉心"
 soul_arts_chainbreaker_meditation_perk_name: "断链冥思"
 SOUL_ARTS_WRATHFUL_AJNA_PERK_EFFECT: "#flavor 施展此术时，饿鬼的额头裂开，显出一只炽红的灼目，灵觉敏锐者可见。此目会在谎言面前升腾黑烟——并灼烧直视它的说谎者。#!"
 SOUL_ARTS_CHAINBREAKER_MEDITATION_PERK_EFFECT: "获得强力精神防护，免疫部分心灵能力。\n#flavor 修炼者以愉悦碾碎内心魔障。#!"
 soul_arts_killing_shriek_perk_name: "戮命尖啸"
 soul_arts_jeweled_eyes_perk_name: "宝瞳明鉴"
 soul_arts_shadow_self_perk_name: "黯影自我"
 SOUL_ARTS_KILLING_SHRIEK_PERK_EFFECT: "战斗开始时，强制敌方[knight|E]中[prowess|E]最高者退出战斗（除非其有强力精神防护）。\n#flavor 饿鬼的嘶吼声中夹杂着地狱的哀嚎。#!"
 SOUL_ARTS_JEWELED_EYES_PERK_EFFECT: "#flavor 罗刹可随心切换美艳与暴虐之态。饿鬼修炼者周身萦绕粉红与深红的魅惑云霭，凡与其对视者皆会深信其言，甘愿为其赴汤蹈火。#!"
 SOUL_ARTS_SHADOW_SELF_PERK_EFFECT: "作为[character_interaction|E]，创造一个自身克隆体。\n#flavor 饿鬼以气为媒，将自身阴影化为仆从，赋予其魔魂生命。#!"
 soul_arts_bloody_foresight_perk_name: "血兆先知"
 soul_arts_joyful_spark_of_union_perk_name: "欢合星火"
 soul_arts_agony_liberation_perk_name: "苦痛解脱"
 SOUL_ARTS_BLOODY_FORESIGHT_PERK_EFFECT: "作为[character_interaction|E]，以自身承受1点[POD_aggravated_damage_with_box|E]为代价，获得[GetModifier('soul_arts_bloody_forseight_modifier').GetNameWithTooltip]。\n#flavor 修炼者割喉或坠入尖刺——未来将以震彻天地的明晰姿态显现。#!"
 SOUL_ARTS_JOYFUL_SPARK_OF_UNION_PERK_EFFECT: "#flavor 魔功为诅咒，煎熬乃惩罚……然修炼之道，自有希望。#!"
 SOUL_ARTS_AGONY_LIBERATION_PERK_EFFECT: "作为[character_interaction|E]，以承受1点[POD_aggravated_damage_with_box|E]为代价改变自身人格特质。\n#flavor 开悟的恶魔将以痛苦为你解缚——但你必须愿赴死境。#!"
 soul_arts_the_final_diadem_perk_name: "终末冠冕"
 soul_arts_crack_the_tortoise_shell_perk_name: "破甲卜骨"
 SOUL_ARTS_THE_FINAL_DIADEM_PERK_EFFECT: "作为[character_interaction|E]，将一名被束缚的$POD_splat_wraith$或$POD_splat_mortal$收为弟子（游戏机制上视为子嗣）。\n#flavor 魔君劈开千层地狱岩，筑起配得上炼狱亲王的宫殿。#!"
 SOUL_ARTS_CRACK_THE_TORTOISE_SHELL_PERK_EFFECT: "作为[character_interaction|E]，使目标失去所有[piety|E]，若其为$POD_splat_kueijin$则额外损失25点[Glossary('心法','podgloss.dharma')][trait_level_track_xp|E]。\n#flavor 此秘技可撼动饿鬼存在之根基。#!"
 SOUL_ARTS_THE_DRAGON_TEAR_REQUIREMENT_EFFECT: "#X 该[perk|E]需要掌握灵功[lifestyle|E]中所有$VALUE|0V$级[perks|E]！#!#weak （魔演除外）#!"
 soul_arts_perfect_eye_of_heaven_perk_name: "天瞳至臻"
 SOUL_ARTS_PERFECT_EYE_OF_HEAVEN_PERK_EFFECT: "无需真名即可将$POD_splat_wraith_plural$、$POD_splat_fae_plural$或$POD_splat_demon_plural$放逐至其原生[umbra|E]领域。\n#flavor 修炼者以君王之瞳俯瞰轮回诸界。#!"
 soul_arts_dragon_medicine_perk_name: "龙胤秘药"
 SOUL_ARTS_DRAGON_MEDICINE_PERK_EFFECT: "作为[character_interaction|E]，治疗[EmptyScope.ScriptValue('POD_dragon_medicine_aggravated_heal_value')|V0]点[POD_aggravated_damage_with_box|E]、[EmptyScope.ScriptValue('POD_dragon_medicine_superficial_heal_value')|V0]点[POD_superficial_damage_with_box|E]，并消除所有负面健康[traits|E]。\n#flavor 修炼者可化身为愈伤者……亦可为施虐器，全凭一念。#!"
 soul_arts_soul_nursery_perk_name: "魂育之巢"
 SOUL_ARTS_SOUL_NURSERY_PERK_EFFECT: "作为[character_interaction|E]，使$POD_splat_vampire$达成[GetTrait('golconda').GetName(GetNullCharacter)]，使$POD_splat_wraith$解脱所有[Fetters|E]，或使$POD_splat_kueijin$提升1级[Glossary('心法','podgloss.dharma')]（不含[GetTrait('dharma10').GetName(GetNullCharacter)]）。\n#flavor 夜世界最令人畏惧的秘术，施术者如摘取熟果般攫取魂魄，纳于己身以转化或吞噬。#!"
 soul_arts_flowing_canal_of_hell_perk_name: "冥河涌道"
 SOUL_ARTS_FLOWING_CANAL_OF_HELL_PERK_EFFECT: "作为[character_interaction|E]，以承受@stress_icon!100点[static_stress|E]为代价，获得[GetModifier('soul_arts_flowing_canal_of_hell_modifier').GetNameWithTooltip]。\n#flavor 未有饿鬼能长久规避煎熬的反噬，亦无人不曾渴望掌控体内爆发的魔能。此术虽无法彻底阻止混沌与毁灭，地狱之力终须宣泄，但聪慧者能引导其流向，化灾为用。#!"
 soul_arts_wax_seal_of_the_demon_king_perk_name: "魔王血玺"
 SOUL_ARTS_WAX_SEAL_OF_THE_DEMON_KING_PERK_EFFECT: "解锁数种恶魔[men_at_arms|E]。\n#flavor 优质仆从难觅，对无暇培育血嗣的饿鬼更是如此。故而此术盛行：地狱编织者可召唤绝对忠诚的恶魔。即便恶魔日后附身凡人化为半魔，忠诚依旧。然若饿鬼煎熬值跌破阈值，则需另施手段维系忠诚，且再无法将其遣返地狱。#!"
 soul_arts_dark_cultivation_perk_name: "暗蚀修行"
 soul_arts_infernal_road_perk_name: "炼狱途"
 SOUL_ARTS_DARK_CULTIVATION_PERK_EFFECT: "#flavor 灵魂技艺通常需耐心筹谋：宗师言不可同时修多魂，世人皆知唯有天纵之才能无损切换四魂。此术借模拟煎熬修行，可令地狱编织者轻易打破常理。#!"
 SOUL_ARTS_INFERNAL_ROAD_PERK_EFFECT: "作为[character_interaction|E]，消耗@stress_icon!100点[static_stress|E]将军队传送至目标位置，或于旅行时瞬移至下一目的地。\n#flavor 地狱编织者驾烈焰战车穿行地狱古道，瞬息跨越时空。代价是凡世跳过的时光在地狱中如实流逝，施术者唯有抵达终点方能下车。根据魔驹行程长短，或需备妥贿赂鬼吏的买路钱与途粮。#!"
 soul_arts_breaking_the_dragons_neck_perk_name: "断龙脊"
 SOUL_ARTS_BREAKING_THE_DRAGONS_NECK_PERK_EFFECT: "作为[character_interaction|E]，腐化现有龙穴，确保仅你或其他[akuma|E]可使用。\n#flavor 除非癫狂或执念，腐化龙穴使其化为人间地狱碎片唯有一因：独占之欲。自铁书失传的姊妹卷传闻——记载此术宏大版本——随邪都现世愈演愈烈。#!"