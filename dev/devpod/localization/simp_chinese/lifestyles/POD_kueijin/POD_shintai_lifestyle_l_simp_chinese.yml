l_simp_chinese:
 shintai_lifestyle_name: "神体"
 shintai_lifestyle_desc: "神体或神体之术是开悟的象征，唯有通过提升[Glossary('心法','podgloss.dharma')]方能修得。一名$pod_kueijin$角色在任何神体之术上的最高等级受限于其[Glossary('心法','podgloss.dharma')]等级；此外，他们只能在[GetTrait('dharma5').GetName(GetNullCharacter)]时精通一种神体之术，[GetTrait('dharma5').GetName(GetNullCharacter)]时精通两种，以此类推。"
 shintai_lifestyle_highlight_desc: "由于你的[Glossary('心法','podgloss.dharma')]，这个生活方式中会给予额外#P [GetPlayer.MakeScope.ScriptValue('dharma_lifestyle_xp_mult')|%0]#!的[experience|E]积累。"
 monthly_shintai_lifestyle_xp_gain_mult: "每月神体[lifestyle|E]的[experience|E]"
 monthly_shintai_lifestyle_xp_gain_add: "每月神体[lifestyle|E]的[experience|E]"
 shintai_focus: "神体重心"
 shintai_focus_modifier: "[GetFocus('shintai_focus').GetName]"
 shintai_focus_desc: "开悟之象"
 shintai_focus_effect_desc: "神体重心给予："
 shintai_ash_and_flames_visible: "灰烬与烈火神体"
 shintai_blood_visible: "鲜血神体"
 shintai_bone_visible: "骸骨神体"
 shintai_devotion_visible: "虔信神体"
 shintai_flesh_visible: "血肉神体"
 shintai_illusion_visible: "幻影神体"
 shintai_jade_visible: "翡翠神体"
 shintai_poxes_visible: "瘟毒神体"
 shintai_storms_visible: "风暴神体"
 shintai_smoke_visible: "烟雾神体"
 shintai_fearless_fire_perk_name: "无畏之火"
 shintai_dance_of_embers_perk_name: "余烬之舞"
 shintai_beautiful_spark_perk_name: "璀璨星火"
 shintai_fire_tempered_soul_perk_name: "烈火淬魂"
 shintai_the_shintai_of_ash_and_fire_perk_name: "灰烬与烈火神体"
 SHINTAI_FEARLESS_FIRE_PERK_EFFECT: "#flavor 灰烬与火焰导师使用一种特制武器，两端装有火炬的长杖。灰烬学员通过穿梭于导师刺击与挥杖的火焰间掌控他们对火焰的恐惧；火焰学员则以火制火，在致命对练中手持燃烧长杖相搏。#!"
 SHINTAI_DANCE_OF_EMBERS_PERK_EFFECT: "获得火焰免疫。\n #flavor 灰烬与火焰的修习者需穿行于篝火与火炬构筑的迷宫。烈焰随时可化形为人，或拥抱饥亡者（或者火焰情况下直接攻击），这是旁观专家或大师操控所为。此地禁用铁山恶魔技艺；若你着火燃烧，那你便会燃烧。#!"
 SHINTAI_BEAUTIFUL_SPARK_PERK_EFFECT: "#flavor 学子们不再需要于夜之国度中长时间冥想，试图以冻僵的手指召唤温暖火焰[Glossary('艾玛·欧','podgloss.emmao')]大人似乎不再容忍访客。过去唯一的替代方案是冰冷的洞穴与冰川，但现代工业冷冻柜的出现可谓天赐之福。#!"
 SHINTAI_FIRE_TEMPERED_SOUL_PERK_EFFECT: "所有与阳光相关的[POD_aggravated_damage_with_box|E]将被限制为1点[POD_damage|E]。\n#flavor 日光冥想正如其名：修习灰烬之道的学徒需直面地平线，尽可能长久地停留。而火焰之道的修习者则要在日出时分持刃相搏，直至一方羞愧求饶。#!"
 SHINTAI_THE_SHINTAI_OF_ASH_AND_FIRE_PERK_EFFECT: "获得对阳光免疫能力。\n#flavor 大师化身为燃烧之神，瞬间被炽热与毁灭之力笼罩……亦或成为最接近凡人的饿殍，得以无畏行走于烈日之下。#!"
 shintai_eyes_in_the_blood_perk_name: "血中窥视"
 shintai_flow_like_blood_perk_name: "血流如注"
 shintai_lash_of_blood_perk_name: "血鞭笞击"
 shintai_bloodwalk_perk_name: "血径漫行"
 shintai_the_shintai_of_blood_perk_name: "鲜血神体"
 SHINTAI_EYES_IN_THE_BLOOD_PERK_EFFECT: "每年可治疗失明状态，即使该状态本应永久持续。\n#flavor 鲜血神体的初阶修习者会被剜去双目、割掉鼻舌，直至领悟真相，这些器官本就可有可无。存在的一切感知与质料，皆可通过血液体验。#!"
 SHINTAI_FLOW_LIKE_BLOOD_PERK_EFFECT: "作为[character_interaction|E]，逃脱[imprisonment|E]。\n在[sieges|E]或[raids|E]期间无法被囚禁。\n#flavor 鲜血神体的入门者会被绑成木乃伊，面对盛满自身体液的高瓶静坐，直到将最后一滴液体吸回体内。由此，他开始打破肉身的幻象，明悟真实存在远比形体更为流动。#!"
 SHINTAI_LASH_OF_BLOOD_PERK_EFFECT: "#flavor 学习鲜血神体学徒需在自身残肢堆中冥想，通过极度专注将断肢分离再接合，直至顿悟。#!"
 SHINTAI_BLOODWALK_PERK_EFFECT: "#flavor 古时，鲜血神体修习者会将自己的血液注入河道与台风路径中以试炼意志。无论水流将他们带往多么遥远痛苦之地，他们皆会前往。#!"
 SHINTAI_THE_SHINTAI_OF_BLOOD_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip]。\n#flavor 鲜血神体的掌控者明悟肉身本为虚妄，唯有鲜血永恒。他可化为翻涌的血池，或爆裂为满室血雨，并在此形态中持续至场景结束。#!"
 shintai_relentless_bone_perk_name: "不灭之骨"
 shintai_punishing_bone_perk_name: "惩戒之骨"
 shintai_bone_obiedience_perk_name: "骨之服从"
 shintai_garden_of_bones_perk_name: "骸骨花园"
 shintai_the_shintai_of_bone_perk_name: "骸骨神体"
 SHINTAI_RELENTLESS_BONE_PERK_EFFECT: "彻底杀死你所需的[POD_aggravated_damage|E]增加：#P +25%#!。\n#flavor 往昔，骸骨的初阶修习者曾作为贵客造访诸地狱，在拖拽巨石攀登哀嚎山崖时被剥去皮肉。现代饿殍虽更倾向模拟训练，但结果殊途同归。#!"
 SHINTAI_PUNISHING_BONE_PERK_EFFECT: "#flavor 骸骨神体学徒的恐怖试炼：活埋于人为引发的岩崩或铁矿堆下，直至以洞见与力量破土而出，或与金属黑暗永眠。#!"
 SHINTAI_BONE_OBIEDIENCE_PERK_EFFECT: "#flavor 为了学习骨之秘术，学徒需接受大师的引导，任由自身骨骼被扭曲成痛苦而怪异的形态。此后，她只需静坐冥想，直至获得足够的顿悟，得以将自身恢复原形，并由此实现突破。在日本的东部地区，人们将这种训练方式与神话中无骨的水蛭之子、七福神之一的惠比寿联系起来。#!"
 SHINTAI_GARDEN_OF_BONES_PERK_EFFECT: "彻底杀死你所需的[POD_aggravated_damage|E]增加：#P +25%#!。\n#flavor 通往精通之路的入口处，一位学习骨骼之道的专家将她的学识外化实践，在生者与死者的骸骨上进行着种种实验。与先前的训练不同，掌握此技需要一种别样的执着：在饥渴之主的各类实验体凄厉哀嚎中，以沉静而专注的劲头反复进行扭曲、破坏、修复的循环——直至最终顿悟降临。#!"
 SHINTAI_THE_SHINTAI_OF_BONE_PERK_EFFECT: "[POD_health_track|E]生命格：#P +1#!\n#flavor 白骨之主从不向世界屈服；她如利刃切过肌腱与脂肪般斩开一切。当此神体激活时，饿鬼周身会泛起苍白而润泽的光晕，仿佛整个躯体都已骨化。白骨[Glossary('菩萨','podgloss.bodhisattva')]与其他古老饿殍的躯体则可能化为纯黑金属，其色之暗足以吞噬周围的光线。#!"
 shintai_the_flow_of_worship_perk_name: "信仰之流"
 shintai_your_god_beckons_perk_name: "神祇召唤"
 shintai_touch_of_the_asura_perk_name: "阿修罗之触"
 shintai_festival_night_perk_name: "祭典之夜"
 shintai_the_shintai_of_devotion_perk_name: "虔信神体"
 SHINTAI_THE_FLOW_OF_WORSHIP_PERK_EFFECT: "每年，发掘你的[CHARACTER.Custom('PODCoterie')]所知的所有[secrets|E]。\n#flavor 与其他神体不同，虔信神体的第一阶段如同开门般自然。初生的神子很少从一开始就笃信自己的神性；他们必须通过经历来确信。但当神子知晓真相并获得第一位追随者后，低语便会迅速降临。#!"
 SHINTAI_YOUR_GOD_BECKONS_PERK_EFFECT: "以[character_interaction|E]身份，召唤一位无领地的[CHARACTER.Custom('PODCoterie')]成员加入你的[court|E]。\n#flavor 与天神不同，地祇无法无处不在或洞察信众的一举一动。但当其巡游下界赏善罚恶时，命运与空间自会向地祇臣服——这本就是天经地义之事。#!"
 SHINTAI_TOUCH_OF_THE_ASURA_PERK_EFFECT: "所有[CHARACTER.Custom('PODCoterie')]成员获得[GetModifier('shintai_touch_of_the_asura_modifier').GetNameWithTooltip]。\n#flavor 理论上，神明从不需要回应祈愿；唯有其意志与神圣愿景会指引神子满足信徒的渴求。但现实中，神子往往乐于拥有万千信众，并很快学会如何让凡人保持欢愉与顺从。#!"
 SHINTAI_FESTIVAL_NIGHT_PERK_EFFECT: "每月，根据你的[CHARACTER.Custom('PODCoterie')]成员数量，失去@stress_icon![static_stress|E]点压力值。\n#flavor 神裔的标志性能力，也是食祷者这一侮辱性称呼的源头。当一位饿殍首次真正享受到以自己名义举办的庆典后，便会理解自身与凡世信仰流动之间的直接联系。#!"
 SHINTAI_THE_SHINTAI_OF_DEVOTION_PERK_EFFECT: "对所有[CHARACTER.Custom('PODCoterie')]成员获得一个[strong_hook|E]关系。\n#flavor 当虔信神体完全掌握时，激活该能力将使神子的凡人追随者与她达成身心合一的完美共鸣。#!"
 shintai_excellent_corpse_perk_name: "完美尸骸"
 shintai_flowers_of_flesh_perk_name: "血肉之花"
 shintai_human_sculpture_perk_name: "人体雕塑"
 shintai_a_thousand_forms_of_flesh_perk_name: "千形百相"
 shintai_the_shintai_of_flesh_perk_name: "血肉神体"
 SHINTAI_EXCELLENT_CORPSE_PERK_EFFECT: "作为[character_interaction|E]，操控你的[GetTrait('scarred').GetName(GetPlayer)][trait|E]。\n#flavor 血肉之道的新手将经历诸多富有创意的死亡方式：绞刑、腰斩、碾碎……最终，饿殍会领悟死亡亦是一门艺术，即便尸骸也蕴含着无限表达的可能。在东南亚部分地区，这种训练延续了古老的修行——猎食时将身躯上下分离，以此提醒中原族裔：何时需扮人，何时可卸伪。#!"
 SHINTAI_FLOWERS_OF_FLESH_PERK_EFFECT: "作为[character_interaction|E]，以10年冷却时间为代价，改变自身一项[trait|E]。\n#flavor 传统修行中，导师会斩下学徒首级埋入花园，令其从腐殖中重组身躯，领悟血肉的流转本质。此法日渐式微，甚至被部分中原族裔视作乡野陋习。#!"
 SHINTAI_HUMAN_SCULPTURE_PERK_EFFECT: "提升[GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)]，每轮可改变[traits|E]数量增至两项。\n#flavor 悦己之形易，摹生者之态难。如画师观物，学习血肉需凝神钻研形神动态，唯有完美复刻目标形貌方可出师，有时甚至令原主反被至亲挚友斥为赝品处决。#!"
 SHINTAI_A_THOUSAND_FORMS_OF_FLESH_PERK_EFFECT: "提升[GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)]，冷却时间缩短至5年。\n作为[character_interaction|E]，可以变身龙等神话生物。\n#flavor 传说天庭真仙曾化骏马游历，或作山猿栖居。当代修行者被师尊点化为雀鸟，而师尊自化掠食者。学徒唯有达至传说真仙般流转自在之境，方可重归人形——若令师尊失望，则会被扭曲成可怖形态囚禁思过。#!"
 SHINTAI_THE_SHINTAI_OF_FLESH_PERK_EFFECT: "完全体[GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)]突破[trait|E]限制与冷却时间，并通过[prowess|E]检定改变他人[traits|E]。\n#flavor 此术迥异于其他尸解仙法门，臻至化境者即变化本身。万形皆备，触躯如泥。#!"
 shintai_the_root_of_illusion_perk_name: "幻惑根源"
 shintai_non_self_perk_name: "无我之境"
 shintai_glittering_paradise_perk_name: "璀璨乐园"
 shintai_rakshasa_blade_perk_name: "罗刹之刃"
 shintai_the_shintai_of_illusion_perk_name: "幻影神体"
 SHINTAI_THE_ROOT_OF_ILLUSION_PERK_EFFECT: "作为[character_interaction|E]，迫使$POD_splat_vampire$陷入血狂或施加50点@stress_icon!。\n#flavor 妄念乃幻惑之本。导师迫使学徒直面执念虚妄，纵最深羁绊亦当自斩。#!"
 SHINTAI_NON_SELF_PERK_EFFECT: "#flavor 幻术大师能够编织出如此完美的幻象，以至于身处其中的人会深信自己就是大师所描述的角色：一个谦卑的邮差、一位风情万种的情人、一个连环杀手，或是一名乞丐。而当梦境消散，学习幻术之人醒来面对真实的自我时，除了顿悟，还能通往何处？#!"
 SHINTAI_GLITTERING_PARADISE_PERK_EFFECT: "#flavor 当幻影学派的学生掌握了基础后，他们通常会狂热地投身于幻影技艺的钻研。从入门者晋升为学徒的关键转折，往往发生在学生经历重大失败之时——当精心构筑的幻影崩塌，他们必须承受其后果。无论面对怎样的残局，他们都得在其中静坐沉思，然后重新开始构建。#!"
 SHINTAI_RAKSHASA_BLADE_PERK_EFFECT: "作为[character_interaction|E]，创造一个随机的[artifact|E]，品质为#FAMEDBLUE 名作级#![rarity|E]\n#flavor 导师一再告诫弟子：他们并非在现实世界施加幻象——本无实相。所谓幻象与所谓真理并无二致。此术虽能深刻阐释此般心法真谛，然修行者有时需断一指或失一足，方能真正领悟。#!"
 SHINTAI_THE_SHINTAI_OF_ILLUSION_PERK_EFFECT: "#flavor 幻影神体是一种幻象世界，其真实程度足以令现实世界在短时间内完全屈从于它的意志。#!"
 shintai_smiling_at_thunder_perk_name: "笑对雷霆"
 shintai_tread_the_dragons_tail_perk_name: "踏龙尾行"
 shintai_earths_embrace_perk_name: "大地之拥"
 shintai_catching_the_wind_perk_name: "捕风之握"
 shintai_the_shintai_of_jade_perk_name: "翡翠神体"
 SHINTAI_SMILING_AT_THUNDER_PERK_EFFECT: "#flavor 玉石修行的初次训练往往充满戏剧性：电闪雷鸣的暴雨天，嶙峋峭壁下是巨浪拍岸的深渊，师徒赤足立于湿滑小径，仅以拳脚或短刀相搏。唯有师父喊停，较量方止。#!"
 SHINTAI_TREAD_THE_DRAGONS_TAIL_PERK_EFFECT: "#flavor 关于领悟玉之真谛所需的正确动作与姿态，已有诸多论著详述。这些理论并非全无裨益，但终究无法替代亲身体验——希望掌握这项技艺的初学者最终必须进行一次字面意义上的信仰之跃。#!"
 SHINTAI_EARTHS_EMBRACE_PERK_EFFECT: "#flavor 剥皮地狱是一处小型地狱界域，专为那些以此种方式杀害他人者而设。这里是一片静谧的草地，零星点缀着几株幼树，再无他物——但若你侧耳细听风声，或许能听见被掩埋的优等生们沉闷的哀嚎。#!"
 SHINTAI_CATCHING_THE_WIND_PERK_EFFECT: "#flavor 欲如天女般翱翔，或需经年累月潜心修习，或需亲赴九霄天门，祈求尊贵精魂垂怜，指点卑微饿殍……亦可寻觅谪凡天女，啜饮其神血，静思那永逝之美。#!"
 SHINTAI_THE_SHINTAI_OF_JADE_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_the_shintai_of_jade_modifier').GetNameWithTooltip]。\n#flavor 翡翠神体将饿殍转化为大地之神。只要施术者能够维持，大地、天空与尸躯便能合而为一。#!"
 shintai_touch_of_the_stranger_perk_name: "陌客之触"
 shintai_hemorrhagic_strike_perk_name: "出血打击"
 shintai_fevers_purity_perk_name: "高热净化"
 shintai_wild_eyed_bulwark_perk_name: "狂野之障"
 shintai_the_shintai_of_poxes_perk_name: "瘟毒神体"
 SHINTAI_TOUCH_OF_THE_STRANGER_PERK_EFFECT: "作为[character_interaction|E]，对目标施加或治愈一种疾病。\n#flavor 这世间从不缺少病痛与垂死之人。心怀慈悲的学徒行走于他们之间，习得治愈之触——或有时，让不可避免的结局来得更痛快些。但并非所有研习瘟毒神体的学者都如此仁慈。#!"
 SHINTAI_HEMORRHAGIC_STRIKE_PERK_EFFECT: "#flavor 瘟毒神体的入门者必须吞下一只寄生虫恶魔，传统上取自“钻蛆地狱”。当修习者在静默的痛苦中冥想时，这生物会盘绕在饿鬼已死的脏器上，啜饮其窃取的血肉。最终，躯体将吸收并消灭这恶魔——但痛苦的记忆已烙下其教诲。#!"
 SHINTAI_FEVERS_PURITY_PERK_EFFECT: "作为[character_interaction|E]，以感染[GetTrait('crimson_fever').GetName(GetPlayer)]为代价，消除@stress_icon!100点[static_stress|E]压力。\n#flavor 瘟毒神体学徒接受了这场来势汹汹的高热——或许是某位导师所赐，又或是半岛上游荡的瘟神、乃至挎着可疑药囊的恶城病吏所授。可惜要领悟这净化之力，仅靠一次发热还远远不够。#!"
 SHINTAI_WILD_EYED_BULWARK_PERK_EFFECT: "作为[character_interaction|E]，以感染[GetTrait('crimson_fever').GetName(GetPlayer)]为代价，治疗[EmptyScope.ScriptValue('POD_wild_eyed_bulwark_heal_value')|V0]点[POD_aggravated_damage_with_box|E]。\n#flavor 传说《瘟神秘典》的高深奥义曾被记载于一部典籍中，后被从瘟疫夫人手中窃走。这部典籍被拆解成无数种疾病偷运出千层地狱——每个字都化作一种疫病。这些疾病至今仍在世间游荡，等待着细心而警觉的修行者去发现、组合并解读它们。#!"
 SHINTAI_THE_SHINTAI_OF_POXES_PERK_EFFECT: "作为[character_interaction|E]，在你目标所在地点引发一场你选择的重大[epidemic|E]。\n#flavor 当“疫病神体”完全掌握时，其激活形态便是疾病与狂热洞察的纯粹力量具现。#!"
 shintai_breath_of_the_sky_perk_name: "苍穹吐息"
 shintai_arms_of_the_sea_perk_name: "海渊之臂"
 shintai_thunderbolts_kiss_perk_name: "雷霆之吻"
 shintai_chamber_bed_of_clouds_perk_name: "云床"
 shintai_the_shintai_of_storms_perk_name: "风暴神体"
 SHINTAI_BREATH_OF_THE_SKY_PERK_EFFECT: "#flavor 一位研习风暴之道的俗家弟子仰观天象，研习风云变幻，无论冰雹骤雨还是星河璀璨皆静心参悟。那些更具兽性或缺乏耐心的弟子则会啜饮风灵精萃，或将自己绑缚于丝质风筝之上，以求更直接地感悟风之伟力。#!"
 SHINTAI_ARMS_OF_THE_SEA_PERK_EFFECT: "为[character_interaction|E]，操纵目标所在[duchy|E]的天气。\n解锁[GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)][character_interaction|E]中的#V 干旱#!选项。\n解锁[GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)][character_interaction|E]中的#V 丰饶之地#!选项。\n#flavor 世间有人鱼与海神——不仅有深渊之母和她银鳞的子嗣，更有真正源自大地水脉的存在，它们拥有风暴神体的智慧与强大魔力。修习风暴之道的学子，无论有无师承，皆会寻访这些存在并求取真知。#!"
 SHINTAI_THUNDERBOLTS_KISS_PERK_EFFECT: "#flavor 要找到一道能击中自己的闪电相当困难。它必须是真正的自然雷击，来自天空，既非召唤亦非创造，而是直接徒手引导——当然，你还必须能在雷击下存活。#!"
 SHINTAI_CHAMBER_BED_OF_CLOUDS_PERK_EFFECT: "提升[GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)]，使其可以整个[kingdom|E]为目标。在[GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)] 的[character_interaction|E]中解锁#V 风暴#!选项。\n#flavor 水、空气、无形的能量涌动：一切要素已然就位。传统上，掌握风暴神体的修行者需耗费数年光阴参悟操纵天象的技艺。但在这个鬼才辈出的年代，饿殍们掌握呼风唤雨之术所需的时间已远少于往昔。#!"
 SHINTAI_THE_SHINTAI_OF_STORMS_PERK_EFFECT: "提升[GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)]，使其可以整个[empire|E]为目标。\n#flavor 风暴神体的全部威能，乃是纯粹而原始的自然破坏力——然若能慎之又慎，此力亦可驾驭。#!"
 shintai_smokeshow_perk_name: "烟幕秀"
 shintai_a_smoker_has_eyes_in_the_back_of_the_head_perk_name: "烟者后眼"
 shintai_reach_of_smoke_perk_name: "烟雾之触"
 shintai_a_body_of_smoke_perk_name: "烟形之躯"
 shintai_the_shintai_of_smoke_perk_name: "烟雾神体"
 SHINTAI_SMOKESHOW_PERK_EFFECT: "#flavor 饿殍可操控既有烟雾，将其体积扩展至大庄园范围，并能将其塑造成各类悦人或骇怖的形态。#!"
 SHINTAI_A_SMOKER_HAS_EYES_IN_THE_BACK_OF_THE_HEAD_PERK_EFFECT: "#flavor 饿殍可以本能地将身体的一部分化为烟雾，成功躲避来袭的攻击。#!"
 SHINTAI_REACH_OF_SMOKE_PERK_EFFECT: "#flavor 饿殍可专注凝神且不行他动，使一道烟柱具备实体化的长触须之质地与延伸范围，使其能于目视距离内（含战斗）执行实体行动，宛如亲临。#!"
 SHINTAI_A_BODY_OF_SMOKE_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip]。\n#flavor 饿殍化作烟雾之形，虽仍具人形轮廓，却可免疫凡俗伤害。#!"
 SHINTAI_THE_SHINTAI_OF_SMOKE_PERK_EFFECT: "#flavor 透彻领悟烟雾的本质，便可化身为烟，摆脱一切形体的束缚。#!"