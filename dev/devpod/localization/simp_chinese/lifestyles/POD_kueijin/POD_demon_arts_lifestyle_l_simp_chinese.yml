l_simp_chinese:
 demon_arts_lifestyle_name: "魔功"
 demon_arts_lifestyle_desc: "魔功是[Glossary('万鬼','game_concept_kuei_jin_desc')]内在野兽，魄的本能表现，几乎与生俱来。它们易于掌握，无需耗费精力或气，且在潜力上无上限，尽管其力量并非没有代价。"
 monthly_demon_arts_lifestyle_xp_gain_mult: "每月魔功[lifestyle|E]的[experience|E]"
 monthly_demon_arts_lifestyle_xp_gain_add: "每月魔功[lifestyle|E]的[experience|E]"
 demon_arts_focus: "魔功重心"
 demon_arts_focus_modifier: "[GetFocus('demon_arts_focus').GetName]"
 demon_arts_focus_desc: "释放你的魄。"
 demon_arts_focus_effect_desc: "魔功重心给予："
 devil_fist_visible: "魔拳"
 black_wind_visible: "妖风"
 iron_mountain_visible: "铁山"
 demon_regalia_visible: "魔装"
 DEMON_ARTS_STACKING_EFFECT: "#clickable 该技能仅限#V 9#!次#!#weak （剩余[Subtract_CFixedPoint('(CFixedPoint)9','(CFixedPoint)$VALUE|q$')|0]次）#!"
 demon_arts_infernal_might_perk_name: "邪魔之力#low （消耗：[ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')]）#!"
 demon_arts_devil_fist_perk_name: "魔拳#low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_devil_fist_modifier_stacks')]/9)#!"
 DEMON_ARTS_INFERNAL_MIGHT_PERK_EFFECT: "作为[character_interaction|E]，消耗#V 10#!点[Glossary('心法','podgloss.dharma')][trait_level_track_xp|E]，为自己施加[GetModifier('demon_arts_infernal_might_modifier').GetNameWithTooltip]效果，持续10年。\n#flavor 此为魔拳之术的巅峰，你的身躯化为由痛苦与苦难驱动的兵器，确保无人能挡。#!"
 DEMON_ARTS_INFERNAL_MIGHT_PERK_COST_EFFECT: "#clickable 该[perk|E]需消耗[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')|V0]点的[perk|E]。每拥有一个#high [GetPerk('demon_arts_devil_fist_perk').GetName(CHARACTER.Self)]#!可减少#V 1#!#!点消耗！"
 DEMON_ARTS_INFERNAL_MIGHT_PERK_COST_WARNING_EFFECT: "#X @warning_icon!你的的[perk|E]不足[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_might_perk_cost')]点！#!"
 DEMON_ARTS_DEVIL_FIST_PERK_EFFECT: "#flavor 你的肌肉膨胀，指节坚如顽石。你将把敌人殴为血雾，像折断枯枝般碾碎弱者。#!"
 demon_arts_infernal_speed_perk_name: "邪魔之速#low （消耗：[ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')]）#!"
 demon_arts_black_wind_perk_name: "妖风#low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_black_wind_modifier_stacks')]/9)#!"
 DEMON_ARTS_INFERNAL_SPEED_PERK_EFFECT: "作为[character_interaction|E]，消耗#V 10#!点[Glossary('心法','podgloss.dharma')][trait_level_track_xp|E]，为自己施加[GetModifier('demon_arts_infernal_speed_modifier').GetNameWithTooltip]效果，持续10年。\n#flavor 烈焰、重拳、利刃加身，你钢铁般的肌肤岿然不动。当暴风骤雨般的攻击终于停歇，你报以冷笑，现在轮到我了。#!"
 DEMON_ARTS_INFERNAL_SPEED_PERK_COST_EFFECT: "#clickable 该[perk|E]需消耗[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')|V0]点的[perk|E]。每拥有一个#high [GetPerk('demon_arts_black_wind_perk').GetName(CHARACTER.Self)]#!可减少#V 1#!#!点消耗！"
 DEMON_ARTS_INFERNAL_SPEED_PERK_COST_WARNING_EFFECT: "#X @warning_icon!你的的[perk|E]不足[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_speed_perk_cost')]点！#!"
 DEMON_ARTS_BLACK_WIND_PERK_EFFECT: "#flavor 残影闪过，血泉喷涌。你如绷断的钢丝般迅捷，似毒蛇出击般致命。在这杀戮之舞中，没有一丝动作是多余的。#!"
 demon_arts_infernal_fortitude_perk_name: "邪魔之韧#low （消耗：[ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')]）#!"
 demon_arts_iron_mountain_perk_name: "铁山#low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_iron_mountain_modifier_stacks')]/9)#!"
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_EFFECT: "作为[character_interaction|E]，消耗#V 10#!点[Glossary('心法','podgloss.dharma')][trait_level_track_xp|E]，为自己施加[GetModifier('demon_arts_infernal_fortitude_modifier').GetNameWithTooltip]效果，持续10年。\n#flavor 此乃铁山的终极境界，血肉化作铁壁铜墙，万物莫能逾越。.#!"
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_COST_EFFECT: "#clickable 该[perk|E]需消耗[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')|V0]点的[perk|E]。每拥有一个#high [GetPerk('demon_arts_iron_mountain_perk').GetName(CHARACTER.Self)]#!可减少#V 1#!#!点消耗！"
 DEMON_ARTS_INFERNAL_FORTITUDE_PERK_COST_WARNING_EFFECT: "#X @warning_icon!你的的[perk|E]不足[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_fortitude_perk_cost')]点！#!"
 DEMON_ARTS_IRON_MOUNTAIN_PERK_EFFECT: "#flavor 你以钢铁般不屈的躯体，承受烈焰、重拳与利刃的洗礼。当暴风骤雨般的攻击终于停歇，你露出微笑——现在，轮到你了。#!"
 demon_arts_infernal_glory_perk_name: "邪魔之耀#low （消耗：[ROOT.Char.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')]）#!"
 demon_arts_demon_regalia_perk_name: "魔装#low ([ROOT.Char.MakeScope.ScriptValue('demon_arts_demon_regalia_modifier_stacks')]/9)#!"
 DEMON_ARTS_INFERNAL_GLORY_PERK_EFFECT: "作为[character_interaction|E]，消耗#V 5#!点[Glossary('心法','podgloss.dharma')][trait_level_track_xp|E]，为自己施加[GetModifier('demon_arts_infernal_glory_modifier').GetNameWithTooltip]效果，持续10年。\n#flavor .此乃魔装的至高境界，你将成为万战尊的真正后裔，凡你所触之物皆会痛楚难当。#!"
 DEMON_ARTS_INFERNAL_GLORY_PERK_COST_EFFECT: "#clickable 该[perk|E]需消耗[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')|V0]点的[perk|E]。每拥有一个#high [GetPerk('demon_arts_demon_regalia_perk').GetName(CHARACTER.Self)]#!可减少#V 1#!#!点消耗！"
 DEMON_ARTS_INFERNAL_GLORY_PERK_COST_WARNING_EFFECT: "#X @warning_icon!你的的[perk|E]不足[CHARACTER.MakeScope.ScriptValue('demon_arts_infernal_glory_perk_cost')]点！#!"
 DEMON_ARTS_DEMON_REGALIA_PERK_EFFECT: "作为[character_interaction|E]，允许变身为任意已收集的魔装形态。\n触发事件以选择新的魔装形态。\n#flavor 狰狞却艳丽，致命而辉煌。邪魔之子啊，骄傲地戴上你的冠冕，执起你的兵刃吧。#!"