l_simp_chinese:
 chi_arts_lifestyle_name: "气功"
 chi_arts_lifestyle_desc: "气功与其他技艺不同，是近期才发展出的对纯气的高阶运用方式。它们也与$pod_kueijin$的存在本质最为疏离；学习此术需要有导师指引。理论上虽所有超自然存在皆可习得气功，但饿殍对其新创之术极为护持。"
 monthly_chi_arts_lifestyle_xp_gain_mult: "每月气功[lifestyle|E]的[experience|E]"
 monthly_chi_arts_lifestyle_xp_gain_add: "每月气功[lifestyle|E]的[experience|E]"
 chi_arts_focus: "气功重心"
 chi_arts_focus_modifier: "[GetFocus('chi_arts_focus').GetName]"
 chi_arts_focus_desc: "气之威能"
 chi_arts_focus_effect_desc: "气功重心给予："
 feng_shui_visible: "风水"
 obligation_visible: "敕令"
 tapestry_visible: "堪舆"
 prana_visible: "炁"
 kiai_visible: "气合"
 tzu_wei_visible: "紫微"
 chi_arts_harmonious_dwelling_perk_name: "和谐居所"
 chi_arts_harmonious_travel_perk_name: "和谐行旅"
 CHI_ARTS_HARMONIOUS_DWELLING_PERK_EFFECT: "#flavor 修行者运用其学识，可将居所设计得合乎风水，确保施工顺利无碍。#!"
 CHI_ARTS_HARMONIOUS_TRAVEL_PERK_EFFECT: "#flavor 修行者循吉气而行，以期旅途平安顺遂。#!"
 chi_arts_harmonious_ward_perk_name: "和谐结界"
 CHI_ARTS_HARMONIOUS_WARD_PERK_EFFECT: "#flavor 修行者凭借学识布置防御工事，使其效力超然提升。#!"
 chi_arts_inwards_harmonious_aligment_perk_name: "内敛和谐阵"
 chi_arts_outwards_harmonious_aligment_perk_name: "外放和谐阵"
 CHI_ARTS_INWARDS_HARMONIOUS_ALIGMENT_PERK_EFFECT: "#flavor 修行者将自身气脉与邻近龙脉相合，获得些许裨益。#!"
 CHI_ARTS_OUTWARDS_HARMONIOUS_ALIGMENT_PERK_EFFECT: "解锁[GetBuilding('feng_shui_harmonized_area_01').GetName]\n#flavor 修行者调息运气，使之与最近的龙脉相谐，确保能量流转平和。#!"
 chi_arts_chi_ward_perk_name: "气之结界"
 CHI_ARTS_CHI_WARD_PERK_EFFECT: "解锁[GetBuilding('feng_shui_harmonized_area_02').GetName]\n#flavor 修行者调整整座城市的气脉流向，使之汇入龙穴。#!"
 chi_arts_demon_ward_perk_name: "驱魔结界"
 chi_arts_dragon_flow_perk_name: "龙脉流转"
 CHI_ARTS_DEMON_WARD_PERK_EFFECT: "#flavor 修行者将整座城市的气脉与龙穴相合，以涤荡邪祟之气。#!"
 CHI_ARTS_DRAGON_FLOW_PERK_EFFECT: "解锁[GetBuilding('feng_shui_harmonized_area_03').GetName]\n#flavor 修行者平息所在之地的气脉流动。#!"
 chi_arts_transcendend_aligment_perk_name: "超凡归元阵"
 CHI_ARTS_TRANSCENDEND_ALIGMENT_PERK_EFFECT: "解锁[GetBuilding('feng_shui_harmonized_area_04').GetName]\n#flavor 修行者将整座城市的气脉与龙门相合。#!"
 chi_arts_evaluate_yin_soul_perk_name: "窥阴探魄"
 chi_arts_evaluate_yang_soul_perk_name: "观阳察魂"
 CHI_ARTS_EVALUATE_YIN_SOUL_PERK_EFFECT: "#flavor 修行者勘测当地阴灵分布，并谋划驱使之法。#!"
 CHI_ARTS_EVALUATE_YANG_SOUL_PERK_EFFECT: "#flavor 修行者勘测当地阳灵分布，并谋划驱使之法。#!"
 chi_arts_soul_bridge_perk_name: "魂桥"
 CHI_ARTS_SOUL_BRIDGE_PERK_EFFECT: "作为[character_interaction|E]，以自身获得[weak_hook|E]为代价，使目标获得[weak_hook|E]。\n#flavor 修行者以气脉相连之术，与他人达成灵犀相通。#!"
 chi_arts_corrupting_yin_soul_perk_name: "阴魄腐化"
 chi_arts_taming_yang_soul_perk_name: "阳魂驯化"
 CHI_ARTS_CORRUPTING_YIN_SOUL_PERK_EFFECT: "#flavor 修行者可驱使当地阴灵助其谋划。#!"
 CHI_ARTS_TAMING_YANG_SOUL_PERK_EFFECT: "#flavor 修行者驯服阳灵，拓展阳魄，故能维系更多羁绊。#!"
 chi_arts_authority_over_yin_soul_perk_name: "阴魄统御"
 chi_arts_authority_over_yang_soul_perk_name: "阳魂统御"
 CHI_ARTS_AUTHORITY_OVER_YIN_SOUL_PERK_EFFECT: "强化[GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)]效果，将获得的[weak_hook|E]替换为[strong_hook|E]#italic （仅对#bold 女性#!目标有效）#!。\n#flavor 修行者以阴气为媒连接魂魄，可更牢固地掌控目标。#!"
 CHI_ARTS_AUTHORITY_OVER_YANG_SOUL_PERK_EFFECT: "强化[GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)]效果，将获得的[weak_hook|E]替换为[strong_hook|E]#italic （仅对#bold 男性#!目标有效）#!。\n#flavor 修行者以阳气为媒连接魂魄，可更牢固地掌控目标。#!"
 chi_arts_soul_shackles_perk_name: "灵魂枷锁"
 CHI_ARTS_SOUL_SHACKLES_PERK_EFFECT: "强化[GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)]效果，消除目标对自身施加的[weak_hook|E]。\n#flavor 修行者以气脉相连时，可单方面篡改契约。#!"
 chi_arts_voice_of_emperor_perk_name: "帝音"
 CHI_ARTS_VOICE_OF_EMPEROR_PERK_EFFECT: "强化[GetPerk('chi_arts_soul_bridge_perk').GetName(GetPlayer)]效果，只要与目标同处一个地方，即可无视[opinion|E]要求直接发动。\n#flavor 修行者仅凭言语便可与他人气脉相连。#!"
 chi_arts_dragon_call_perk_name: "龙唤"
 chi_arts_chi_nest_perk_name: "气穴"
 CHI_ARTS_DRAGON_CALL_PERK_EFFECT: "#flavor 修行者可引龙脉支流贯注其领地。#!"
 CHI_ARTS_CHI_NEST_PERK_EFFECT: "#flavor 修行者可引龙脉细流滋养其巢穴。#!"
 chi_arts_chi_shaping_perk_name: "气塑"
 CHI_ARTS_CHI_SHAPING_PERK_EFFECT: "解锁[GetBuilding('extended_dragon_nest_01').GetName]\n#flavor 修行者可改易龙脉中气的流向。#!"
 chi_arts_yin_wall_perk_name: "阴壁"
 chi_arts_yang_wall_perk_name: "阳壁"
 CHI_ARTS_YIN_WALL_PERK_EFFECT: "可以操控尸幕操纵尸幕选项。\n#flavor 修行者可以操控分隔阴界与中原的气。#!"
 CHI_ARTS_YANG_WALL_PERK_EFFECT: "可操控绝壁强度等级\n#flavor 修行者可以操控分隔阳界与中原的气。#!"
 chi_arts_dragon_shaping_perk_name: "龙形塑"
 CHI_ARTS_DRAGON_SHAPING_PERK_EFFECT: "解锁[GetBuilding('extended_dragon_nest_02').GetName]\n#flavor 修行者能够引导龙脉的流向。#!"
 chi_arts_open_dragon_gate_perk_name: "开龙门"
 chi_arts_expand_dragon_river_perk_name: "拓龙脉"
 CHI_ARTS_OPEN_DRAGON_GATE_PERK_EFFECT: "将龙穴的[development|E]需求降低#V 10#!。\n#flavor 修行者可强行开启龙穴。#!"
 CHI_ARTS_EXPAND_DRAGON_RIVER_PERK_EFFECT: "将龙穴的[development|E]需求降低#V 10#!。\n#flavor 修行者能够扩张龙脉的规模。#!"
 chi_arts_sapping_the_dragon_nest_perk_name: "泄龙穴"
 CHI_ARTS_SAPPING_THE_DRAGON_NEST_PERK_EFFECT: "作为[character_interaction|E]，利用已建造的龙穴获得[GetModifier('chi_arts_sapping_the_dragon_nest_modifier').GetNameWithTooltip]效果，其强度取决于所用龙穴等级。\n#flavor 修行者能将龙脉的部分力量导入自身，从而大幅增强实力。#!"
 chi_arts_yin_mantle_perk_name: "阴引仙绫"
 chi_arts_yang_mantle_perk_name: "阳袍"
 CHI_ARTS_YIN_MANTLE_PERK_EFFECT: "#flavor 修行者以阴气为袍，显得更加威严可怖。#!"
 CHI_ARTS_YANG_MANTLE_PERK_EFFECT: "#flavor 修行者以阳气为袍，显得更加魅力非凡。#!"
 chi_arts_accentuate_chi_perk_name: "激气"
 CHI_ARTS_ACCENTUATE_CHI_PERK_EFFECT: "作为[character_interaction|E]，为目标治疗[EmptyScope.ScriptValue('POD_base_heal_value')|V0][POD_superficial_damage_with_box|E]。\n#flavor  修行者可调整目标体内气的流动，治愈伤势。#!"
 chi_arts_eightfold_yin_mantle_perk_name: "八重阴绫"
 chi_arts_eightfold_yang_mantle_perk_name: "八重阳袍"
 CHI_ARTS_EIGHTFOLD_YIN_MANTLE_PERK_EFFECT: "#flavor 修行者以纯阴之气为袍，在他人眼中如一团冰冷的噩梦之雾。#!"
 CHI_ARTS_EIGHTFOLD_YANG_MANTLE_PERK_EFFECT: "#flavor 修行者以纯阳之气为袍，在他人眼中如一团温暖的包容之云。#!"
 chi_arts_soothing_soul_perk_name: "安魂"
 CHI_ARTS_SOOTHING_SOUL_PERK_EFFECT: "强化[GetPerk('chi_arts_accentuate_chi_perk').GetName(GetPlayer)]效果，治疗[Multiply_CFixedPoint(EmptyScope.ScriptValue('POD_base_heal_value'),'(CFixedPoint)2')|V0]点[POD_superficial_damage_with_box|E]并减少目标25点[stress|E]。\n#flavor 修行者抚慰目标的灵魂，减轻痛苦并加速愈合。#!"
 chi_arts_yin_nihilus_perk_name: "阴无"
 chi_arts_yang_phoenix_perk_name: "阳凤"
 CHI_ARTS_YIN_NIHILUS_PERK_EFFECT: "在[combat_phase|E]作为[commander|E]时，为敌方[knights|E]附加[GetModifier('chi_arts_yin_nihilus_modifier').GetNameWithTooltip]效果；或在[single_combat_duel_plural|E]中为对手附加此效果。\n#flavor 修行者可引爆纯阴之气，使周围生灵陷入不自然的僵直。#!"
 CHI_ARTS_YANG_PHOENIX_PERK_EFFECT: "在[combat_phase|E]作为[commander|E]时，为友方[knights|E]附加[GetModifier('chi_arts_yang_phoenix_modifier').GetNameWithTooltip]效果；或在[single_combat_duel_plural|E]中为自己附加此效果。\n#flavor 修行者可引爆纯阳之气，使周围生灵获得不寻常的速度。#!"
 chi_arts_chi_mastery_perk_name: "气驭"
 CHI_ARTS_CHI_MASTERY_PERK_EFFECT: "作为[character_interaction|E]，治疗[Multiply_CFixedPoint(EmptyScope.ScriptValue('POD_base_heal_value'),'(CFixedPoint)3')|V0]点[POD_superficial_damage_with_box|E]。\n#flavor 修炼者可自由操控目标体内的气来治愈伤势。#!"
 chi_arts_cry_of_yin_perk_name: "阴声低语"
 chi_arts_cry_of_yang_perk_name: "阳声高鸣"
 CHI_ARTS_CRY_OF_YIN_PERK_EFFECT: "战争开始时，为敌方[knights|E]附加[GetModifier('chi_arts_cry_of_yin_modifier').GetNameWithTooltip]效果，持续3年。\n#flavor 修行者将阴气融入声音，使敌人陷入消沉。#!"
 CHI_ARTS_CRY_OF_YANG_PERK_EFFECT: "战争开始时，为敌方[knights|E]附加[GetModifier('chi_arts_cry_of_yang_modifier').GetNameWithTooltip]效果，持续3年。\n#flavor 修行者将阳气融入声音，使敌人陷入躁动。#!"
 chi_arts_battle_cry_perk_name: "战吼"
 CHI_ARTS_BATTLE_CRY_PERK_EFFECT: "#flavor 修行者可宣告下一招式的名称，虽失去突袭之利，但大幅增强其威力。#!"
 chi_arts_roar_of_dragon_perk_name: "玄龙怒嚎"
 chi_arts_roar_of_phoenix_perk_name: "朱凰长啸"
 CHI_ARTS_ROAR_OF_DRAGON_PERK_EFFECT: "#flavor 修行者模仿玄龙之吼，对周围无机物造成巨大破坏。#!"
 CHI_ARTS_ROAR_OF_PHOENIX_PERK_EFFECT: "作为[knights|E]参与[combat_phase|E]时，提高对敌方[knight|E]的致命一击概率。\n#flavor 修行者模仿朱凰之鸣，对周围有机体造成巨大伤害。#!"
 chi_arts_shout_of_inner_pain_perk_name: "内痛嘶吼"
 CHI_ARTS_SHOUT_OF_INNER_PAIN_PERK_EFFECT: "战争开始时，为敌方[stress|E]增加20点[knights|E]。\n#flavor 修行者释放内心痛苦，既伤敌又释己。#!"
 chi_arts_scream_of_demon_perk_name: "千狱尖啸"
 chi_arts_silent_scream_perk_name: "无声之嚎"
 CHI_ARTS_SCREAM_OF_DEMON_PERK_EFFECT: "战争开始时，为所有拥有内心阴影的敌方[knights|E]（如$POD_splat_vampire_plural$、$POD_splat_wraith_plural$或$POD_splat_kueijin$，且未达到[GetTrait('dharma10').GetName(GetPlayer)]者）增加30点[stress|E]。\n#flavor 修行者以一声怒吼释放魄之力，使附近生灵陷入狂乱。#!"
 CHI_ARTS_SILENT_SCREAM_PERK_EFFECT: "作为[knights|E]参与[combat_phase|E]时，提高对敌方[knight|E]的致命一击概率。\n#flavor 修行者仅需低语即可施展先前所有的气合能力。#!"
 chi_arts_divine_cry_perk_name: "啸天吼"
 CHI_ARTS_DIVINE_CRY_PERK_EFFECT: "战斗开始时，强制所有#N 70#![stress|E]且没有强力精神防护的敌方[knight|E]退出战斗。\n#flavor 修行者模仿神怒之音，使心智脆弱者恐惧逃窜。#!"
 chi_arts_joss_weaving_perk_name: "织命"
 chi_arts_fate_of_star_perk_name: "贯天怒喝"
 CHI_ARTS_JOSS_WEAVING_PERK_EFFECT: "解锁一个角色互动，为目标施加“幸运”修正。\n\n#flavor 修行者编织纯粹的运气为己所用。#!"
 CHI_ARTS_FATE_OF_STAR_PERK_EFFECT: "#flavor 修行者可预知目标的未来。#!"
 chi_arts_realigning_the_stars_perk_name: "重定星辰"
 CHI_ARTS_REALIGNING_THE_STARS_PERK_EFFECT: "作为[character_interaction|E]，根据黄道十二宫为目标赋予12种[modifiers|E]之一。\n#flavor 修行者以十二星座为命星，赐予对应祝福。#!"
 chi_arts_cursing_the_star_perk_name: "诅星之语"
 chi_arts_read_the_stars_perk_name: "观星之辩"
 CHI_ARTS_CURSING_THE_STAR_PERK_EFFECT: "作为[character_interaction|E]，对目标造成[EmptyScope.ScriptValue('POD_base_wound_damage')|V0]点[POD_superficial_damage_with_box|E]。\n#flavor 修行者可诅咒目标厄运缠身，引发意外灾祸。#!"
 CHI_ARTS_READ_THE_STARS_PERK_EFFECT: "#flavor 修行者能观星象，一定程度上预知未来。#!"
 chi_arts_reweaving_the_stars_perk_name: "重织星轨"
 CHI_ARTS_REWEAVING_THE_STARS_PERK_EFFECT: "强化[GetPerk('chi_arts_realigning_the_stars_perk').GetName(GetPlayer)]效果，允许替换[modifier|E]并将其持续时间延长至10年。\n#flavor 修行者能更灵活地操纵自身命星。#!"
 chi_arts_celestial_curse_perk_name: "天罚"
 chi_arts_read_the_twelve_perk_name: "解读十二宫"
 CHI_ARTS_CELESTIAL_CURSE_PERK_EFFECT: "强化[GetPerk('chi_arts_cursing_the_star_perk').GetName(GetPlayer)]效果，造成[Multiply_CFixedPoint(EmptyScope.ScriptValue('POD_base_wound_damage'),'(CFixedPoint)2')|V0]点[POD_superficial_damage_with_box|E]。\n#flavor 修行者将天罚之咒注入目标的整个命盘。#!"
 CHI_ARTS_READ_THE_TWELVE_PERK_EFFECT: "#flavor 修行者能通过目标的完整命盘精准预言其未来。#!"
 chi_arts_substitution_of_the_twelve_perk_name: "十二替身"
 CHI_ARTS_SUBSTITUTION_OF_THE_TWELVE_PERK_EFFECT: "强化[GetPerk('chi_arts_realigning_the_stars_perk').GetName(GetPlayer)]效果，使[modifier|E]永久持续（除非主动更改）。\n#flavor 修行者可将单一命星永久定为自己的夜空主星。#!"