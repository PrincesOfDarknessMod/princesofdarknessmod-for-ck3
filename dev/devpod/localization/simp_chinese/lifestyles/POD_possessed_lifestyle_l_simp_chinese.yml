 FOMORI_MIND_RAPE_PERK_EFFECT: "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F 堕妖能侵入目标的大脑，强行攫取其中的信息。虽然这不会造成实际伤害，但受害者往往会在之后的几天里感到赤裸和被侵犯（而且经常会头痛欲裂）。#!"
 SHADOWPLAY_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L]变形选项\n#F 角色可以操纵周围的阴影，将它们聚集成一个黑暗区域。在自己形成的阴影中，角色总是能看见一切。#!"
 BULKY_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 该角色的宿主身体异常庞大而坚固，提供了额外的坚韧。#!"
 PLANT_KINSHIP_PERK_BONUS_VALUE: "[GetPerk('kami_plant_kinship_perk').GetName(GetPlayer)]"
 fomori_balefire_flux_perk_name: "恶火之助"
