 INVULNERABILITY_PERK_STATS_EFFECT: "#F 该角色的身体被超自然地增强，外表上却没有明显的变化。#!"
 REGENERATION_PERK_STATS_EFFECT: "每三月一次，消除所有伤口和残疾。\n#F 该角色可以像狼人一样立即恢复伤害。#!"
 ANIMATE_SELF_PERK_EFFECT: "#F 与树木或雕像等无生命物体结合在一起的戈尔贡和社神可以使用这能力，使他们的宿主身体具有生命力。如果没有这种能力，拥有植物或矿物宿主的角色就无法移动。#!"
 ARMORED_HIDE_PERK_EFFECT: "#F 宿主的皮肤会发生明显变化，从而增强抵御攻击的能力。它可能是明显的鳞片状或厚重的犀牛皮，甚至可能是闪烁着粘液的皮肤，使攻击在没有重度施压的情况下滑开。#!"
 BLENDING_PERK_EFFECT: "#F 该角色能够改变自身颜色以潜行；虽然无法复制特定的图案或纹理，但可以生成足够使用的常规图案来模糊其轮廓。#!"
 COMPUTER_LINK_PERK_EFFECT: "#F 机蜂可以通过触摸控制电脑。#!"
 DARKSIGHT_PERK_STATS_EFFECT: "#F 该角色能够像在白天一样在黑暗中视物。#!"
