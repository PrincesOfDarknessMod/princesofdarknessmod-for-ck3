 POSSESSEDPOWER_LIFESTYLE_PERK_POINTS_TRIGGER: "附灵生活方式技能点：$NUM|V0$"
 NOT_has_fomori_trait: "@warning_icon!#X 你#bold 没#!有[trait|E]：[GetTrait('fomori').GetName( GetPlayer )]#!"
 NOT_has_drone_trait: "@warning_icon!#X 你#bold 没#!有[trait|E]：[GetTrait('drone').GetName( GetPlayer )]#!"
 NOT_has_gorgon_trait: "@warning_icon!#X 你#bold 没#!有[trait|E]：[GetTrait('gorgon').GetName( GetPlayer )]#!"
 NOT_has_kami_trait: "@warning_icon!#X 你#bold 没#!有[trait|E]：[GetTrait('kami').GetName( GetPlayer )]#!"
 NOT_has_spirit_ties_perk: "@warning_icon!#X 你#bold 没#!有[perk|E]：[GetPerk('fomori_spirit_ties_perk').GetName( GetPlayer )]#!"
 ANIMAL_CONTROL_PERK_EFFECT: "作为[character_interaction|E]，允许你直接获得宠物。\n作为[character_interaction|E]，允许你呼唤宠物参战。\n能够招募数种动物作为[men_at_arms|E]。\n#F 动物控制让施术者能够召唤和控制范围内的动物。#!"
 AURA_OF_TRANQUILITY_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('aura_of_tranquility_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 该角色散发出一种氛围，使得周围的人都感到平静：如果是社神，则是平和之感；如果是机蜂，则是和谐之感。#!"
 BERSEKER_PERK_EFFECT: "作为[knight|E]时，能在[combat_phase|E]中使用狂战士攻击。\n#F 宿主会像狼人一样被注入魂怒，且它的所有的优点和缺点。#!"
 BESTIAL_MUTATION_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_bestial_mutation_modifier' ).GetNameWithTooltip|L]变形选项\n#F 宿主的身体已经变得无法识别为人或动物；它已经膨胀变形，成为对其原有形态的粗糙拙劣模仿，完全无法被视为除超自然怪物之外的任何事物。#!"
 BODY_EXPANSION_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_body_expansion_modifier' ).GetNameWithTooltip|L]变形选项\n#F 该角色能够在短时间内将自己的体型增大到正常身高的三倍。#!"
 BRAIN_EATING_PERK_EFFECT: "作为[character_interaction|E]，允许你吸取囚犯的智商特质来获得生活方式经验。\n#F 堕妖可以通过触摸吸收目标的精神力量，并利用它们进行学习。#!"
 CHAOS_ENGINE_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('chaos_engine_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 具备这种能力的戈尔贡是纯粹混沌的代言人。他的存在本身就给周围的物体和事件带来了混乱与变化。#!"
 STASIS_ENGINE_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('stasis_engine_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 线轴重新对齐，物体牢固地固定在位置上，看似不协调的事物被带入与其环境的和谐之中。#!"
 COMMAND_THE_EARTH_PERK_EFFECT: "作为[character_interaction|E]，允许你对敌人的领地释放恶意天气效果。\n#F 该角色能够强迫大地服从它的意志，塑造新的地形，将敌人吸入流沙泥潭等等。#!"
 CURSE_OF_GAIA_PERK_EFFECT: "作为[character_interaction|E]，允许你给予敌人[GetModifier( 'mild_curse_of_gaia_modifier' ).GetNameWithTooltip|L]、[GetModifier( 'moderate_curse_of_gaia_modifier' ).GetNameWithTooltip|L]、[GetModifier( 'severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'very_severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L]。\n#F 社神可对冒犯者下盖亚的诅咒，惩罚那些破坏她的意志或自然界平衡的人。轻微的诅咒可能表现为厄运连连、情绪低落或令人尴尬的身体状况（如脱发或极度恶臭）；严重的诅咒可能会将违罪者变成石头，使其患上消耗病，甚至迫使大地将其吞噬。#!"
 CYBERSENSES_PERK_EFFECT: "#F 允许施术者用机器的感官——雷达、红外线扫描或类似设备——取代自己的感官。#!"
 DISPERSION_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_swarm_modifier' ).GetNameWithTooltip|L]变形选项\n#F 这种能力是灵类所能做出的最明显的改变之一，它能将宿主自己的身体分解成许多小个体，每个个体都是完全活的，并拥有 “原主”的知觉。它们大多像鼠或蛇等小动物，但也有一些特别不寻常的戈尔贡会突然同时分散成许多不同的实体。#!"
 DEVOUR_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 角色能够张大嘴巴，吞下中型犬类或小型人类那么大的物体。任何被吞食的人都会像食物一样被消化，无法消化的物质（如骨头、鞋子或眼镜）会被排出体外。#!"
 ELECTRICAL_FIELD_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 角色可以产生强大的电场，麻痹任何与其身体接触的人。电流的性质可以是交流电或直流电，并具有适当的效果（将目标从角色身边吹开，或将其肌肉锁定在原地）。#!"
 ENCHANTING_VOICE_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('enchanting_voice_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 角色可能会用歌声（机蜂则用奇妙舒缓的演讲）征服听众。#!"
 FUNGAL_TOUCH_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('fungal_touch_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 该角色的部分已被一种奇怪的真菌物质所取代，这种物质会通过恶毒的触摸传染给人。#!"
 GASEOUS_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_mist_modifier' ).GetNameWithTooltip|L]变形选项\n#F 角色可以将自己的身体溶解成气态，无论是雾、烟还是瘴气。#!"
 HAZARDOUS_BREATH_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中严重撕裂敌方[knights|E]的几率。\n#F 角色可以根据指令释放危险物质——火焰、毒气、酸性唾液或类似物质。攻击方式实际上不一定得是吐息，任何一种远程攻击方式都可以。#!"
 INFECTIOUS_BITE_TOUCH_PERK_EFFECT: "作为[character_interaction|E]，允许你给予疾病。\n#F 角色能够通过咬伤或触摸传播恶性传染病。如果宿主成功感染了目标，目标就会发烧、生病，在感染痊愈前都会有轻微的传染性。#!"
 INVISIBILITY_PERK_STATS_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 角色从视线中消失。她不会留下任何脚印，但仍会发出声音并散发出气息，而且仍会被诸如感知$glossary_wyrm$（如果适用）等灵赋察觉。#!"
 LIQUID_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_blood_modifier' ).GetNameWithTooltip|L]变形选项\n#F 角色可以将身体液化，溶解成浓稠的液体（泥浆、血液或类似物质），可以随意移动。液体形态的角色可以毫不费力地穿过小口，但在上坡时会遇到困难。#!"
 MALLEATE_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 该角色能够注射一种奇特的毒液，使受害者的身体具有延展性，骨骼和肌肉群变得像粘土一样柔软。这种能力甚至可以影响到无生命的血肉和植物组织。#!"
 MASK_PRESENCE_PERK_EFFECT: "作为[character_interaction|E]，允许你中止所有针对你的计谋。\n#F 该角色能让任何观察者看不到他的存在。#!"
 MIND_BLAST_PERK_EFFECT: "你能够[imprison|E]本来不可能在[siege|E]或[raid|E]中捕获的[characters|E]。\n在成功的[siege|E]和[raid|E]后极有可能[imprison|E][characters|E]。\n#F 角色可以用一道精神能量使目标动弹不得。受害者会倒在地上，痛苦地扭动身体，任由攻击者摆布。#!"
 NATURAL_WEAPONRY_PERK_EFFECT: "解锁自然武器变形选项。\n#F 角色会以爪子、獠牙、犄角或尖锐骨质突起的形式显现出自然武器。#!"
 NIGHTMARE_COMMAND_PERK_EFFECT: "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 堕妖能让目标遭受恐怖噩梦的折磨，使受害者无法安然入睡。堕妖可以自定义梦境的内容，或者干脆让受害者的潜意识来做这琐事。#!"
 PEACEFUL_FIGHTING_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]。\n#F 该角色能够全力战斗，而不会对对手造成永久性伤害。社神使用这种能力是出于怜悯，而机蜂使用这种能力则是为了避免任何重大干扰。#!"
 PLANT_ANIMATION_PERK_EFFECT: "能够招募[GetMaA('animated_tree').GetName]作为[men_at_arms|E]\n#F 该角色能够赋予植物生命，使树木、藤蔓、灌木等以通常无法实现的方式移动。树木可以用枝条攻击甚至束缚对手，藤蔓可以缠绕，甚至草也可以抓住敌人的脚。#!"
 PLANT_KINSHIP_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 这能力使社神能够与植物进行交流，尽管从普通植物中获得的信息很少。#!"
 POISON_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中重伤敌方[knights|E]的几率。\n#F 角色能够通过毒腺或唾液等有毒体液向敌人注射毒素。#!"
 POISON_TUMORS_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_poison_tumors_modifier' ).GetNameWithTooltip|L]变形选项\n#F 堕妖身上长满了奇形怪状的肿瘤，里面充满了腐蚀性脓液，通常带有令人厌恶的颜色和气味。#!"
 SANITY_RENDING_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标压力特质。\n#F 该角色能够扭曲那些与它对视的人的思想——把他们逼到崩溃的边缘。#!"
 SELF_IMMOLATION_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L]变形选项\n#F 角色可以自焚，成为行走的篝火。火焰不会伤害角色，但会烧毁角色接触到的一切，并因此带来各种风险。#!"
 SKINSHIFT_PERK_EFFECT: "增强变形[character_interaction|E]以改变面貌。\n#F 附灵角色可以改变自己肉体的外观，在片刻间迅速、流畅地呈现出完全不同生物的特征和体型。#!"
 SPIRIT_KINSHIP_PERK_EFFECT: "能够招募[GetMaA('jagglings').GetName]作为[men_at_arms|E]\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#F 角色与同类的灵类有着强大的联系，甚至会在危险时刻召唤它们。堕妖会召唤忌灵，机蜂会召唤$glossary_weaver$属灵，戈尔贡会召唤奇原灵，社神通常会召唤元素。#!"
 SPIRIT_RENDING_PERK_EFFECT: "能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n#F 拥有这种能力的堕妖可以利用他们的魂怒穿过险棘攻击灵体，并吸取它们的能量。当然，错误判断猎物的堕妖可能会遭遇致命的意外#!"
 SPIRIT_SENSE_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 角色能够看透险棘，观察当地半影界发生的事情。#!"
 STASIS_COCOON_PERK_EFFECT: "解锁进入魔茧[decision|E]，允许进入[GetTrait('torpor').GetName( GetNullCharacter )]并退位。\n#F 角色能把自己茧在坚硬的外壳中，同时新陈代谢会减慢到一种悬浮状态。被茧包裹的角色不会衰老，能在没有食物、水甚至空气的情况下几乎可以无限期地存活下去。#!"
 SUCCUBUS_VEIL_PERK_EFFECT: "解锁[GetScheme('PODenthrall').GetTypeName][scheme|E]。\n#F 角色可以以目标理想伴侣的形象出现，并通过一个手势将其招至身边。成功使用这种能力后，目标就会完全被角色迷住，从而不惜一切代价取悦她。或者，该角色也可以启动这能力魅惑任何看到她的人，不过该“地毯式覆盖”造成的效果要差得多。#!"
 TAR_BABY_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 角色的皮肤或“肉体”是由糖蜜或焦油等粘稠物质制成的。任何与皮肤强行接触的东西都会像苍蝇粘在苍蝇纸上一样粘在皮肤上；而缓慢、有意的接触，比如穿衣服，则不会激活皮肤的粘性。#!"
 THICK_SKINNED_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中致残敌方[knights|E]的几率。\n#F 角色有一层或多层额外的保护层，可以提供超自然的保护，防止受伤。保护方式因所拥有的个体而异；机蜂只会出现难以察觉的皮肤硬化现象，而戈尔贡通常会以多种不同的方式表现出这种力量，从高度致密的肉体到一层鳞片不等。#!"
 TRANSFORMATION_PERK_EFFECT: "允许变身为数种动物。\n#F 社神能够进行有限但完美无瑕的变形。#!"
 SIZE_PERK_EFFECT: "作为[character_interaction|E]，允许你变成[GetTrait('giant').GetName( GetPlayer )]或[GetTrait('dwarf').GetName( GetPlayer )]。\n#F[GetPerk('fomori_bulky_perk').GetName( GetPlayer )]能力代表的是宿主种族的体型特别巨大，而这代表了角色个体的永久巨大化。#!"
 IMMUNITY_TO_THE_DELIRIUM_PERK_EFFECT: "在战争或[single_combat_duel_plural|E]中对抗$glossary_fera$时，不再受#TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L 妄悸#!#!影响\n#F 该角色不受任何妄悸的影响。#!"
 fomori_visible: "堕妖"
 gorgon_visible: "戈尔贡"
 drone_visible: "机蜂"
 kami_visible: "社神"
 fomori_animal_control_perk_name: "动物操控"
 fomori_armored_hide_perk_name: "$glossary_wyrm$皮毛"
 fomori_berseker_perk_name: "狂暴者"
 fomori_bestial_mutation_perk_name: "野蛮突变"
 fomori_blending_perk_name: "变色龙体色"
 fomori_body_expansion_perk_name: "身体膨胀"
 fomori_brain_eating_perk_name: "食脑"
 fomori_bulky_perk_name: "巨大化"
 fomori_darksight_perk_name: "黑暗视觉"
 fomori_devour_perk_name: "$glossary_wyrm$之口"
 fomori_dispersion_perk_name: "分散"
 fomori_ectoplasmic_extrusion_perk_name: "灵质挤压"
 fomori_electrical_field_perk_name: "电场"
 fomori_elemental_resistance_perk_name: "地狱皮毛"
 fomori_enchanting_voice_perk_name: "着魔迷声"
 fomori_enhanced_attribute_perk_name: "超级属性"
 fomori_entropic_touch_perk_name: "分子弱化"
 fomori_extensible_limb_perk_name: "蛙舌"
