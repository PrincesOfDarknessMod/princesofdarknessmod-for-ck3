 ENTROPIC_TOUCH_PERK_EFFECT: "#F 通过触碰，角色可以暂时削弱物体或甚至生物的物理结构。#!"
 EXTENSIBLE_LIMB_PERK_EFFECT: "#F 角色的一条或多条肢体——手臂、腿、尾巴，甚至舌头——可以伸展以操控物体或远程攻击对手。这种能力通常在堕妖中表现为强大的蛙状舌头，使得能力拥有者说话时变得奇怪含糊（有时还会对昆虫产生嗜好）。#!"
 EXTRA_LIMB_PERK_EFFECT: "#F 该角色永久长出多条额外的肢体，可能是额外的手臂、触手，甚至是延长的、可抓握的舌头或肠子。这些肢体可能附着在奇怪的位置，或者隐藏在肉质的囊袋中，直到需要时才显现。#!"
 EYES_OF_THE_WYRM_PERK_EFFECT: "#F 该堕妖的眼睛有某种不寻常之处。它们可能是类似昆虫的复眼，或者拥有奇异变幻的瞳孔和虹膜，甚至泛着不洁的、令人不安的虹彩波纹。任何与其对视的人都会在其中看到更可怕的隐藏图案——一瞥$glossary_wyrm$的疯狂诅咒。#!"
 FLIGHT_PERK_STATS_EFFECT: "#F 该角色能够飞行，方式可以是通过翅膀（任何形式的翅膀）或其他推进方式（例如乘风而行，适用于偏向风暴的社神）。她可以悬停、滑翔、翱翔或俯冲，由你选择。#!"
 FOOT_PADS_PERK_EFFECT: "#F 该角色的脚掌像动物一样有肉垫，使他额外获得一定的潜行能力。#!"
 HEART_SENSE_PERK_EFFECT: "#F 社神能够看透一个人的内心，判断她的总体精神归属（妖蛆、奇原、织者、盖亚或其他）、她是清白或罪孽深重、她的真实形态（如果她伪装成其他形态）、甚至她最隐秘的梦想和欲望，或她与过去的联系。#!"
 HOMOGENEITY_PERK_EFFECT: "作为[character_interaction|E]，允许移除目标的[battle_modifier|E]。\n#F 该角色可以在她周围五码范围内抵消所有超自然力量，或者专注于一个对手，阻止他在相当长的时间内使用这类力量。和谐对“天生”的力量无效；因此，尽管它可以抵消狼人的灵赋，但不能阻止他们化形。#!"
 HORROR_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_delirium_modifier').GetNameWithTooltip][modifier|E]。\n无视妄悸免疫。\n#F 该角色的存在如此令人不安，以至于它在凡人中引发的超自然恐慌，堪比目睹狼人变身成化狼形形态。更强大的角色甚至能在超自然生物中引起恐惧和怀疑。这种力量几乎总是表现在那些真正具有野兽般、兽性或彻底怪物化形态的角色身上。#!"
 LONGEVITY_PERK_EFFECT: "#F 社神的寿命延长了十倍；拥有此能力的社神人类宿主将能够存活约700年。#!"
 LORD_OF_THE_LAND_PERK_EFFECT: "#F 该角色对她的领地极度敏感，能够时刻察觉到任何发生在她所宣称的领地内的事情。#!"
 MAGNETOKINESIS_PERK_EFFECT: "#F 失心魂可以生成和控制局部磁场，使他能够移动或操控含铁物体。#!"
 MATTER_WEAVE_PERK_EFFECT: "#F 该角色能够将物质重新塑造成新的形态和功能。失心魂通常使用这种能力来修复结构损坏或修补缺陷；戈尔贡则几乎随心所欲地使用它，将物体重塑成奇怪的新结构，以削弱$glossary_weaver$对某个区域的控制。#!"
 MEMORY_CARESS_PERK_EFFECT: "#F 该角色的灵会干扰普通人的思维，以保持其行动的隐秘。旁观者会按照他们正常的反应与角色互动，但一旦角色离开，他们对角色的记忆就会逐渐淡忘。此能力当然有其弊端——如果你的老板每次你离开房间就忘记你的存在，那么很难保住日常工作——但对于许多被附身者来说，匿名是最好的防御手段。#!"
 PIERCING_GAZE_PERK_EFFECT: "#F 社神能够让它注视的任何人感到不安和局促，仿佛社神正在直视她的灵魂。此能力通常用于驱赶入侵者，但在审讯中也能成为极佳的辅助工具。#!"
 PLIANT_BONES_PERK_EFFECT: "越狱[decision|E]成功率提升。\n#F 该角色的骨骼可以变得柔软且易塑，使她能够像老鼠一样挤过狭小的开口。此外，角色也可以随着时间的推移，从绑带和缚绳中脱身。#!"
 REASSURING_PRESENCE_PERK_EFFECT: "#F 该角色可以改变外貌，匹配当时最多数旁观者会尊敬和听从的那个人。虽然这个能力看似微弱，但聪明的失心魂或堕妖可以利用它几乎随意进入任何地方，并从几乎任何人那里获得有限的合作。#!"
 SEASONS_BLESSINGS_PERK_EFFECT: "#F 社神能够将特定季节的影响带到某个区域：如果使用秋之祝福，树叶可能会从树上落下，而与冬季调和的社神则可以召唤降雪。#!"
 SENSE_GAIA_PERK_EFFECT: "#F 该角色可以感知附近区域内盖亚的显现——包括盖亚的化兽族裔、灵体等类似存在。#!"
 SILENT_SPEECH_PERK_EFFECT: "#F 该角色能够不通过言语而是直接进行心灵对话。此能力能够绕过所有语言障碍，但角色无法以这种方式与没有语言的生物交流，除非使用另一种能力来实现。#!"
 SKINCHANGER_KINSHIP_PERK_EFFECT: "#F 此能力代表与某个化形者种族之间的深厚精神联系与友谊。最常见的形式是与狼人的亲缘关系（因为其他变形种族已逐渐衰落），但社神可能与任何化形者种族拥有亲缘关系，甚至包括鼠族或阿南西。#!"
 SPIRIT_AWAKENING_PERK_EFFECT: "#F 社神能够通过为动物、植物或无生命物体唱歌或演奏音乐来唤醒它们的灵。#!"
 SPIRIT_GIFT_PERK_EFFECT: "#F 角色能学会任意恰当的灵赋并将其发展为专属能力。#!"
 STASIS_TOUCH_PERK_EFFECT: "作为[character_interaction|E]，允许移除目标的变身。\n#F 仅凭一次触碰，角色就能夺走对手变形的能力。#!"
 STEP_SIDEWAYS_PERK_EFFECT: "允许在灵游时进入[UmbraGlossary('spirit_wilds')]\n#F 角色获得跟狼族一样的踏入[umbra|E]的能力。#!"
 TAINT_SUPPRESSION_PERK_EFFECT: "#F 堕妖可以暂时消除其任何污秽效果。被抑制的身体畸变在几秒钟内恢复为完好无损的皮肤；精神错乱在一瞬间的完美清明中消失，等等。#!"
 TRIATIC_SCENT_PERK_EFFECT: "允许与对立$glossary_triat$的[splat|E]进行友善互动。\n#F 该角色能够通过借助对立三相的力量，掩盖其“真实气息”。#!"
 TRIATIC_SENSE_PERK_EFFECT: "#F 该角色能够感知到她周围区域内任意$glossary_triat$力量的相对强度。#!"
 UNIVERSAL_TONGUE_PERK_EFFECT: "#F 该角色能够与任何生物交谈并理解它们的语言。#!"
 UNNATURAL_STRENGTH_PERK_EFFECT: "#F 该角色的肌肉异样地发达，仿佛是大量使用类固醇的结果。#!"
 VEIL_BREACH_PERK_EFFECT: "#F 拥有此能力的角色可以深入人类的思维，撕裂那些易受疯狂影响的意识碎片。这种侵入性的“心灵手术”可能会使受害者更容易妄悸，但也使原本正常的人类能够在不立即陷入恐慌的情况下与狼人互动，甚至与之战斗。#!"
 VOICE_OF_REASON_PERK_EFFECT: "#F 该角色的声音变得奇怪而充满诱惑力，带有单调的音调，能使听众陷入一种催眠般的平静状态。#!"
 VOICE_OF_THE_WYRMCH_PERK_EFFECT: "#F 堕妖的舌头被改变成了一种奇异的形态：可能变得粗厚像蛞蝓，可能变得又长又分叉，甚至可能转化为一团触须。堕妖可以像正常人一样说话，并且能够使用妖蛆的语言。#!"
 WALL_WALKING_PERK_EFFECT: "#F 该角色可以像蜘蛛一样在陡峭的表面上奔跑，就像在平地上一样轻松自如。#!"
 WEBBING_PERK_EFFECT: "你的囚犯从你的监狱成功逃跑的概率更低。\n#F 此能力允许创造蛛网来束缚倒下的敌人，封闭开口，甚至让使用者从高处安全降落。这种力量可以根据角色的不同而呈现多种形式。比如，堕妖可能会从不洁的腺体中喷射出恶臭的粘合物，而社神和戈尔贡则可能产生更“自然”的丝质网，机蜂则编织塑料般、人造感的纤维来束缚敌人。#!"
 CORRUPTED_VISIONS_PERK_EFFECT: "#F “我必须这么做！上帝让我这么做的！”利用这种腐化天赋，堕妖会让一些无助的受害者产生幻觉。来自上帝的声音、稍纵即逝的幻景、责骂、嘲笑和其他偏执的喜好只是其中的可能之一。虽然这种能力在堕妖看起来足够正常、可以伪装成人类时效果最好，但特别畸形的堕妖也可以在隐藏时使用它。在使用腐化幻象时，了解你的受害者会有所帮助；如果耶稣突然告诉她要大开杀戒，一个理性的人会起疑心，而一个本来就心神不宁的人可能会认为这是个非常好的主意。当然，一个看似理性的人也可能会被精妙、精心挑选的幻象逼疯。在那之后，一切皆有可能……#!"
 DECEPTION_PERK_EFFECT: "#F 堕妖能够隐藏他的妖蛆眷染的灵性证据，使他人察觉不到。感知妖蛆灵赋不会将堕妖识别为被妖蛆污染的存在。堕妖也可以将这种能力用于他人，以掩盖他们的污染。例如，堕妖可以隐藏吸血鬼的吸榨行为的证据，甚至改变普通狼族的灵光，使她看起来被妖蛆污染，而实际上并非如此。受此力量影响的堕妖也对木乃伊的真名赫考法术免疫。#!"
 ECTOPLASMIC_EXTRUSION_PERK_EFFECT: "#F 该角色能够生成最多四条半固态的触手或手臂，这些肢体可以延伸至五码远，用来操控物体甚至进行攻击。肢体可能是真正的灵质、半固态的阴影、异常浓厚的雾气，或其他适合该角色类型的形式。#!"
 ELEMENTAL_RESISTANCE_PERK_EFFECT: "#F 宿主对某种特定类型的能量形式的抵抗力被增强至超自然程度。所选的能量可以是凡俗的，比如火或闪电，甚至可能来自更神秘的源头，如烽火。#!"
 ENHANCED_ATTRIBUTE_PERK_EFFECT: "#F 宿主的自然能力被放大到超人级别。此能力不仅限于物理属性——一个被奇原附身的生物可能会拥有增强的智慧，而一个堕妖则可能发展出非凡的外貌，以更好地引诱受害者。#!"
 ENHANCEMENT_PERK_EFFECT: "#F 堕妖能够通过扫描目标的心灵，变成任何活物的理想伴侣。#!"
 EXOSKELETON_PERK_EFFECT: "#F 堕妖的全身覆盖着类似甲壳的坚硬增生物。它通常非常类似骨质，表面布满节瘤、类似静脉的管道和奇异的形状。其颜色从铁锈红、深棕色到油黑色不等。#!"
 EXTRA_SPEED_PERK_EFFECT: "#F 堕妖能够比普通人更灵活地行动。#!"
 HAND_FROM_BEYOND_PERK_EFFECT: "#F 堕妖可以在进入[umbra|E]后，把手伸回物质世界，把其他人拉进[spirit_world|E]。只要所有目标手牵着手，他就可以拉动不止一个人。#!"
 IMMUNITY_PERK_EFFECT: "#F 堕妖可以无视某些潜在危险事物的影响。#!"
 NIMBLENESS_PERK_EFFECT: "#F 堕妖特别灵活，能够在执行其他人可能会摔倒的高难度动作时轻松保持平衡。#!"
 NOXIOUS_BREATH_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('noxious_breath_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 堕妖可以向空气中释放有毒烟雾，使周围二十码范围内的人产生吸烟的欲望。这些烟雾看起来和闻起来都像香烟烟雾。此外，这种气体还会残害吸入者的肺组织。经过几周或几个月的反复暴露于这种有害气息中，受害者将会发展出肺癌。#!"
 NUMBING_PERK_EFFECT: "#F 堕妖的身体可以完全麻木。她感觉不到任何疼痛。然而，她也对所有感觉都失去了敏感度。她无法正常说话（她的舌头仿佛被永久麻醉），可能会割伤自己而毫无察觉，这可能导致她的身体存在未察觉的感染或坏疽伤口。#!"
 PROCREATION_PERK_EFFECT: "#F 堕妖可以通过血液和精液传播忌灵——任何涉及体液的接触都可能传播忌灵。忌灵随后会尝试附身于体液的接受者。堕妖只能传递与附身于他自身的忌灵类似的存在。#!"
 PROLONGED_LIFE_PERK_EFFECT: "#F 堕妖的自然寿命大大延长。这并不是真正的永生，因为堕妖最终会因某种自然原因而死去（在堕妖中，自然死亡几乎是闻所未闻的）。#!"
 ROAR_OF_THE_WYRM_PERK_EFFECT: "#F 堕妖能够通过发出这种低沉的尖叫声，使周围所有人心中产生恐惧。#!"
 SAVAGE_GENITALIA_PERK_EFFECT: "#F 约翰·波比特的噩梦；堕妖（无论男女）的生殖器都有一些令人生畏的特征。男性的变异包括过长（14英寸以上）或过硬、带刺、磨砂质地甚至弯曲倒钩；女性的变异则以牙齿、撕裂般的吸力和绞肉机一般的内部构造而臭名昭著。这显然不利于战斗，但在床上却是毁灭性的！#!"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "#F 与同名的狼人天赋类似，这种能力允许堕妖嗅出任何在场的超自然生物，如吸血鬼、狼人、法师、死灵和其他灵体。#!"
 SKITTERSIGHT_PERK_EFFECT: "#F 这种怪异的力量能让堕妖拉出她的眼睛，把视神经拧成脚，让眼睛在走廊和拐角处乱窜，以便看到通常被掩盖的东西。她必须小心——如果眼睛被压扁，她就会永远失明！#!"
 SLITHER_SKIN_PERK_EFFECT: "#F 堕妖的皮肤是一种武器和有用的助手。堕妖可以脱下她的皮肤，并给它简单的指令（不超过五个字）。皮肤从肛门处脱离，在堕妖的头部上方剥落。它可以行走、抓取物体或进行攻击。#!"
 SLOBBER_SNOT_PERK_EFFECT: "#F 堕妖的皮肤上布满小疣，这些疣分泌出一种极其光滑和流动的黏液。这种黏液使得堕妖的身体几乎没有摩擦力，令对手几乎无法抓住她。这种滑腻的凝胶还帮助堕妖挤过狭小的空间。流淌出的黏液在阳光下会几乎瞬间溶解。#!"
 STOMACH_PUMPER_PERK_EFFECT: "#F 堕妖能够呕吐出最近所吃的所有食物，覆盖着酸性粘稠的胃液。#!"
 TOXIC_SECRETIONS_PERK_EFFECT: "#F 这种能力将堕妖的体液转变为有毒废物。#!"
 WATER_BREATHING_PERK_EFFECT: "#F 通过这种简单的能力，堕妖可以选择在水下呼吸或根本不需要呼吸。此能力还赋予堕妖一定程度的抗压能力和防止失压病的能力。#!"
 SPIRIT_STATIC_PERK_STATS_EFFECT: "解锁[umbra|E]界面的操纵险棘选项。\n#F 机蜂可以暂时增强其周围的险棘，限制$glossary_weaver$敌人的力量。#!"
 deception_perk_effect_1: "[GetTrait('diablerist').GetName( GetPlayer )]特质在被揭露时将自动隐藏回秘密"
 deception_perk_effect_2: "作为妖蛆眷染者，允许与盖亚狼人进行友善互动。"
 deception_perk_effect_3: "你不再会成为[GetScheme('POD_discover_true_name').GetTypeName]计谋的目标"