 ANIMAL_CONTROL_PERK_EFFECT:0 "作为[character_interaction|E]，允许你直接获得宠物。\n作为[character_interaction|E]，允许你呼唤宠物参战。\n能够招募数种动物作为[men_at_arms|E]。\n#F 动物控制让施术者能够召唤和控制范围内的动物。#!"
 AURA_OF_TRANQUILITY_PERK_EFFECT:0 "Give [GetModifier('aura_of_tranquility_perk_modifier').GetNameWithTooltip] modifier to enemy [knights|E] in war as a commander or to foe in [single_combat_duel|E].\n#F The character radiates an aura of either peacefulness (in the case of Kami) or harmony (in the case of Drones) that calms anyone within the area. #!"
 BERSEKER_PERK_EFFECT:0 "作为[knight|E]时，能在战争中使用狂战士攻击。\n魂怒恢复概率：#P +100%#!\n#F 宿主会像狼人一样被注入魂怒，且它的所有的优点和缺点。#!"
 BESTIAL_MUTATION_PERK_EFFECT:0 "Unlock [GetModifier( 'POD_shapeshift_form_bestial_mutation_modifier' ).GetNameWithTooltip|L] shapeshift option.\n#F The host body is no longer recognizable as human or animal; it has distended and warped into a rough parody of its former shape, wholly unable to pass as anything other than a supernatural monster.#!"
 BODY_EXPANSION_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_body_expansion_modifier' ).GetNameWithTooltip|L]变形选项\n#F 该角色能够在短时间内将自己的体型增大到正常身高的三倍。#!"
 BRAIN_EATING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你吸取囚犯的智商特质来获得生活方式经验。\n#F 堕妖可以通过触摸吸收目标的精神力量，并利用它们进行学习。#!"
 CHAOS_ENGINE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('chaos_engine_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F A gorgon with this ability is a walking mouthpiece for chaos, pure and simple. His very presence brings disorder and change to the objects and events at work around him.#!"
 STASIS_ENGINE_PERK_EFFECT:0 "Give enemy commanders [GetModifier('stasis_engine_perk_modifier').GetNameWithTooltip] modifier when in war as a commander.\n#F Axes re-align, objects secure in place, and things that seem out of synch are brought into harmony with their environs.#!"
 COMMAND_THE_EARTH_PERK_EFFECT:0 "As a [character_interaction|E], allows you to unleash hostile weather effects over enemy realms.\n#F The character is able to compel the very earth to obey it, sculpting new formations, sucking down enemies into morasses of quicksand, and so on.#!"
 CURSE_OF_GAIA_PERK_EFFECT:0 "As a [character_interaction|E], allows you to give enemy [GetModifier( 'mild_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'moderate_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L] or  [GetModifier( 'very_severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L].\n#F The Kami may levy the curse of Gaia Herself against an offender, punishing those who disrupt Her will or the balance of the natural world. Minor curses may manifest as runs of bad luck, bouts of depression or embarrassing physical conditions (such as hair loss or extreme stench); major curses might turn an offender to stone, inflict him with a wasting disease or even compel the earth to swallow him up.#!"
 CYBERSENSES_PERK_EFFECT:0 "[espionage|E] Progress Speed: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F [Select_CString( GetScriptedGui('cyberrealm_location').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'Allows the user to replace his own senses with that of a machine — radar, infrared scanning, or the like.', '')]#!"
 DISPERSION_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_swarm_modifier' ).GetNameWithTooltip|L]变形选项"
 DEVOUR_PERK_EFFECT:0 "作为[knight|E]时，增加作战中严重撕裂敌方[knights|E]的几率。"
 ELECTRICAL_FIELD_PERK_EFFECT:0 "作为[knight|E]时，增加作战中严重撕裂敌方[knights|E]的几率。"
 ENCHANTING_VOICE_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌方指挥官[GetModifier('enchanting_voice_perk_modifier').GetNameWithTooltip]修正。"
 FUNGAL_TOUCH_PERK_EFFECT:0 "在战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('fungal_touch_perk_modifier').GetNameWithTooltip]修正。"
 GASEOUS_FORM_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_mist_modifier' ).GetNameWithTooltip|L]变形选项"
 HAZARDOUS_BREATH_PERK_EFFECT:0 "作为[knight|E]时，增加作战中严重撕裂敌方[knights|E]的几率。"
 INFECTIOUS_BITE_TOUCH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你给予疾病。"
 INVISIBILITY_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L]变形选项。"
 LIQUID_FORM_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_blood_modifier' ).GetNameWithTooltip|L]变形选项"
 MALLEATE_PERK_EFFECT:0 "作为[knight|E]时，增加作战中致残敌方[knights|E]的几率。"
 MASK_PRESENCE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你中止所有针对你的计谋。"
 MIND_BLAST_PERK_EFFECT:0 "你能够[imprison|E]本来不可能在[siege|E]中捕获的[characters|E]。\n在成功的[siege|E]和[raid|E]后极有可能[imprison|E][characters|E]。"
 NATURAL_WEAPONRY_PERK_EFFECT:0 "解锁自然武器变形选项。"
 NIGHTMARE_COMMAND_PERK_EFFECT:0 "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。"
 PEACEFUL_FIGHTING_PERK_EFFECT:0 "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]。"
 PLANT_ANIMATION_PERK_EFFECT:0 "能够招募[GetMaA('animated_tree').GetName]作为[men_at_arms|E]"
 PLANT_KINSHIP_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 POISON_PERK_EFFECT:0 "作为[knight|E]时，增加作战中重伤敌方[knights|E]的几率。"
 POISON_TUMORS_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_poison_tumors_modifier' ).GetNameWithTooltip|L]变形选项"
 SANITY_RENDING_PERK_EFFECT:0 "As a [character_interaction|E], allows you give the target a stress trait.\n#F The character is capable of bending the minds of those that meet its gaze — bending them to the breaking point.#!"
 SELF_IMMOLATION_PERK_EFFECT:0 "解锁[GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L]变形选项"
 SKINSHIFT_PERK_EFFECT:0 "增强变形[character_interaction|E]以改变面貌。"
 SPIRIT_KINSHIP_PERK_EFFECT:0 "能够招募[GetMaA('materialized_spirits').GetName]作为[men_at_arms|E]\n#F 角色与同类的灵类有着强大的联系，甚至会在危险时刻召唤它们。堕妖会召唤忌灵，机蜂会召唤织者属灵，戈尔贡会召唤奇原灵，社神通常会召唤元素。#!"
 SPIRIT_RENDING_PERK_EFFECT:0 "能够监禁，处决或在[single_combat_duel|E]中通过物理招式伤害灵体。"
 SPIRIT_SENSE_PERK_EFFECT:0 "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 角色能够看透险棘，观察当地半影界发生的事情。#!"
 SPIRIT_STATIC_PERK_EFFECT:0 "解锁灵界界面的操纵险棘选项。"
 STASIS_COCOON_PERK_EFFECT:0 "解锁进入魔茧[decision|E]，允许进入[GetTrait('torpor').GetName( GetNullCharacter )]并退位。"
 SPIRIT_SIDEWAYS_PERK_EFFECT:0 "允许进入[spirit_wilds|E]。\n灵游受困概率：#P -5%#!\n每月灵界探索进度：[grace_i]#P +25%#!"
 SUCCUBUS_VEIL_PERK_EFFECT:0 "解锁[GetScheme('PODenthrall').GetTypeName][scheme|E]。"
