 NUMINA_VIA_GENIORUM_1_PERK_EFFECT: "解锁#V $seek_aid_of_the_spirits_decision$#![decision|E]\n当你在物质世界中时，也可以与[umbra|E]的存在互动。\n#flavor 神通术师并不窥探[spirit_world|E]，而是命令附近的超自然生物显露身形。#!"
 NUMINA_VIA_GENIORUM_2_PERK_EFFECT: "提升#V $seek_aid_of_the_spirits_decision$#![decision|E]的效果。\n解锁弱小逝兽[men_at_arms|E]。\n#flavor 神通术师可在手持物品上或围绕自身绘制小型防护符印。#!"
 NUMINA_VIA_GENIORUM_3_PERK_EFFECT: "提升#V $seek_aid_of_the_spirits_decision$#![decision|E]的效果。\n解锁恶魔[men_at_arms|E]。\n#flavor 神通术师可将精魂遣返其原生界域。#!"
 NUMINA_VIA_GENIORUM_4_PERK_EFFECT: "提升#V $seek_aid_of_the_spirits_decision$#![decision|E]的效果。\n解锁中等逝兽[men_at_arms|E]。\n#flavor 神通术师现在可以召唤灵体实体。#!"
 NUMINA_VIA_GENIORUM_5_PERK_EFFECT: "提升#V $seek_aid_of_the_spirits_decision$#![decision|E]的效果。\n可以对$POD_splat_wraith_plural$、$POD_splat_fae_plural$和$POD_splat_demon_plural$使用获知真名[journey|E]。\n可以将$POD_splat_wraith_plural$、$POD_splat_fae_plural$或$POD_splat_demon_plural$[POD_banish|E]回其原生的[umbra|E]。\n#flavor 神通术师现在可以强制精魂为其效力。#!"
 NUMINA_VIA_IGNIS_1_PERK_EFFECT: "在作为[commander|E]参加[combat_phase|E]时，给予敌方[GetModifier('numina_via_ignis_1_modifier').GetNameWithTooltip]，或在[single_combat_duel_plural|E]时给予对手。\n#flavor 神通术师能够召唤出一团圣火烛焰。。#!"
 NUMINA_VIA_IGNIS_2_PERK_EFFECT: "将[GetPerk('numina_via_ignis_1_perk').GetName(GetPlayer)]的效果提升为[GetModifier('numina_via_ignis_2_modifier').GetNameWithTooltip]。\n#flavor 智者能够召唤一小簇圣火。#!"
 NUMINA_VIA_IGNIS_3_PERK_EFFECT: "将[GetPerk('numina_via_ignis_1_perk').GetName(GetPlayer)]的效果提升为[GetModifier('numina_via_ignis_3_modifier').GetNameWithTooltip]。\n#flavor 神通术师能够召唤出一团圣火的营火。。#!"
 NUMINA_VIA_IGNIS_4_PERK_EFFECT: "将[GetPerk('numina_via_ignis_1_perk').GetName(GetPlayer)]的效果提升为[GetModifier('numina_via_ignis_4_modifier').GetNameWithTooltip]。\n#flavor 神通术师可以召唤一团圣火形成的篝火。。#!"
 NUMINA_VIA_IGNIS_5_PERK_EFFECT: "战争开始时，如果担任[commander|E]：对所有畏惧阳光的[splats|E]造成[GetPlayer.MakeScope.ScriptValue('POD_numina_via_ignis_5_damage')]点[POD_aggravated_damage_with_box|E]。\n#flavor 神通术师能够召唤一场神圣烈焰的风暴。#!"
 NUMINA_VIA_MEDICAMENTI_1_PERK_EFFECT: "作为[character_interaction|E]，给予目标[GetModifier('numina_via_medicamenti_1_modifier').GetNameWithTooltip]。\n#flavor 你可以缓解轻微的疼痛。#!"
 NUMINA_VIA_MEDICAMENTI_2_PERK_EFFECT: "强化[GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)][character_interaction|E]的效果，同时赋予[GetModifier('numina_via_medicamenti_2_modifier').GetNameWithTooltip]。\n#flavor 在你的照料下，扭伤和轻微感染能更快痊愈。#!"
 NUMINA_VIA_MEDICAMENTI_3_PERK_EFFECT: "强化[GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)][character_interaction|E]效果，同时治疗[GetPlayer.MakeScope.ScriptValue('POD_numina_via_medicamenti_3_heal')] [POD_superficial_damage_with_box|E]\n#flavor 所有伤势，直至伤残级别，其愈合速度均为正常速度的两倍，且无感染风险。#!"
 NUMINA_VIA_MEDICAMENTI_4_PERK_EFFECT: "提升[GetPerk('numina_via_medicamenti_3_perk').GetName(GetPlayer)][character_interaction|E]的效果，将治疗量提高至[GetPlayer.MakeScope.ScriptValue('POD_numina_via_medicamenti_4_heal')]。\n同时提升[GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)][character_interaction|E]的效果，同时治愈任何轻微疾病。\n#flavor 你可以治愈如哮喘或关节炎等慢性疾病，但这需要时间和精力。#!"
 NUMINA_VIA_MEDICAMENTI_5_PERK_EFFECT: "提升[GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)][character_interaction|E]的效果，同时将[GetPlayer.MakeScope.ScriptValue('POD_numina_via_medicamenti_5_convert')][POD_aggravated_damage_with_box|E]转化为[POD_superficial_damage_with_box|E]。\n提升[GetPerk('numina_via_medicamenti_1_perk').GetName(GetPlayer)][character_interaction|E]的效果，同时治愈任何非超自然的疾病。\n#flavor 你甚至能治愈致命病症，但这会极大地消耗你的精力，并且需要数周的治疗。#!"
 NUMINA_VIA_NECROMANTIAE_1_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\n#flavor 神通术师可以命令一具刚死亡的尸体苏醒。#!"
 NUMINA_VIA_NECROMANTIAE_2_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n#flavor 神通术师可以保护一片区域免受幽灵侵扰。#!"
 NUMINA_VIA_NECROMANTIAE_3_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n#flavor 神通术师可以与死者沟通。#!"
 NUMINA_VIA_NECROMANTIAE_4_PERK_EFFECT: "能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n$POD_can_command_wraith_trigger_loca$\n#flavor 神通术师可以驱逐作祟的鬼魂。#!"
 NUMINA_VIA_NECROMANTIAE_5_PERK_EFFECT: "解锁[GetMaA('hidden').GetName],[GetMaA('walker').GetName],[GetMaA('shambler').GetName]和[GetMaA('skeletons').GetName]作为[men_at_arms|E]。\n#flavor 神通术师现在可以驱使尸体站起来了。#!"
 NUMINA_VIA_ORACULI_1_PERK_EFFECT: "#flavor 神通术师解读关于其当前周遭状况的征兆或警告。#!"
 NUMINA_VIA_ORACULI_2_PERK_EFFECT: "#flavor 神通术师通过事先比对，消除可能的负面结果。#!"
 NUMINA_VIA_ORACULI_3_PERK_EFFECT: "#flavor 神通术师可以感知机遇的模式，使其能窥探遵循特定决策的短期信息。#!"
 NUMINA_VIA_ORACULI_4_PERK_EFFECT: "#flavor 神通术师能够预言未来的特定事件。#!"
 NUMINA_VIA_ORACULI_5_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n#flavor 神通术师获得感知未来清晰具体细节的能力，并能可靠地预言特定事件。#!"