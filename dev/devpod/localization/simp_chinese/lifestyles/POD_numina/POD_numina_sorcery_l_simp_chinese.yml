 numina_alchemy_common_description: "#flavor 炼金术是一门研究转化与净化的古老技艺与科学。从业者汲取异类的实践方法，既包含魔法也涵盖科学，以探究物质与灵魂的隐秘特性。炼金术最传统的目标并非广为人知的将基础物质转化为更\"高贵\"的对应物——例如将铅转化为黄金——而是追求炼金术士自身的完美境界。#!"
 numina_conjuration_common_description: "#flavor 召唤术是舞台魔术师的典型道途：从帽子里变出兔子、从观众口袋里抽出纸牌，都是其最基础应用的常见范例。希望靠研究魔法谋生的术士通常会学习召唤术。由于这种与舞台魔术密不可分的关联，沉睡者往往将召唤术合理化解释为仅仅是高超的戏法。#!"
 numina_conveyance_common_description: "#flavor 无论是梦想着瞬间移动还是飞天扫帚，人们总是渴望能快速地从一处抵达另一处。无论他们能多快到达，似乎永远都不够快，于是许多人转而求助魔法与奇异科学，只为能更早抵达目的地。在掌握道途的巅峰之前，一位运用\"传送道途\"的野法师需要某种载具，这种载具由法师为单次旅程特别准备。#!"
 numina_divination_common_description: "#flavor 解读茶叶、投掷符文石或骨头、观测夜空——这些都是传统占卜术的实例，其变体形式跨越了多种文化。只要存在\"未来\"这个概念，就有人渴望知晓其中蕴藏的奥秘。施展占卜术的草野术士试图预言未来。然而未来始终是变幻莫测的混沌谜团。巫师或许能通过占卜术寻觅最可能结果的线索，但睿智的先知深谙精准阐释那些模糊梦境般象征符号的价值，以此判断可能性变化的轨迹。#!"
 numina_enchantment_common_description: "#flavor 附魔道途比其他任何道途都更注重耐心与远见。此道途没有法术，只有仪式，包括漫长而艰难的仪式来创造被称为\"神器\"的魔法物品。每一件神器都必须由附魔师精心制作。第一步是制作凡俗的基础物品。通常这些物品由附魔师亲手打造，将其凡俗技艺发挥到极致，只为制作出承载魔法的完美容器。然而，有时合适的容器也能以稀有或古老物品的形式寻得。一旦容器制作完成或寻获，附魔师便可开始程序，将魔法能量注入其中，以备后用。#!"
 numina_ephemera_common_description: "#flavor 有些魔法师——那些专注于亡灵道途的——会命令诸灵。而追随灵质道途的魔法师则寻求与其建立更亲密的关系。对使用灵质道途的魔法师而言，他们与诸灵的关系更像是家人和朋友，而非主仆。当他们召唤灵类时，那是一种邀请，而非传唤。灵质道途并非束缚和命令诸灵，而是允许魔法师与其进行协商。#!"
 numina_fascination_common_description: "#flavor 关于摄人心魄的术士或魅惑众生的法师的故事，在世界各地的民间传说中屡见不鲜。狡诈的施咒者将无辜者置于其掌控之下，而那些为力量所签订的契约，则禁锢了那些愚蠢到愿意出卖灵魂之人的心智。这一古老主题的核心真相坚如磐石。自人类开始期望他人能以合意的方式行事或思考以来，肆无忌惮的法师们便一直践行着这条操控他人意志的道路。#!"
 NUMINA_FASCINATION_1_PERK_REASON: "[GetPerk('numina_fascination_1_perk').GetName(GetPlayer)]:$VALUE|0+=$"
 NUMINA_FASCINATION_3_PERK_REASON: "[GetPerk('numina_fascination_3_perk').GetName(GetPlayer)]:$VALUE|0+=$"
 NUMINA_FASCINATION_5_PERK_REASON: "[GetPerk('numina_fascination_5_perk').GetName(GetPlayer)]:$VALUE|0+=$"
 NUMINA_FASCINATION_6_PERK_REASON: "[GetPerk('numina_fascination_6_perk').GetName(GetPlayer)]:$VALUE|0+=$"
 numina_fortune_common_description: "#flavor 命运无常，即便不考虑魔法师的操控也是如此。幸运道途能让他们将运气化作武器，以诅咒击溃敌人，或以祝福强化盟友。尽管方法和解释各不相同——从邪眼到上帝之手，再到概率操控——幸运道途永远无法实现真正的不可能，只能让极不可能之事发生。这也是最不精确的道途之一：当野法师启动幸运并控制潜在结果的幅度与大致范围时，这道途的效果常会令其措手不及，或消隐于日常生活的杂音之中。#!"
 numina_healing_common_description: "#flavor 凡有人类繁衍生息之处，便有疗愈之需。自文明曙光初现，疗愈者便因共情之心与社群之需应运而生，他们通过传承诫律、与诸灵交感、反复试错乃至诸多其他途径，习得了服务族人之道。#!"
 numina_hellfire_common_description: "#flavor 传闻是来自地狱交易的结果，地狱之火赋予施法者巨大的破坏力。虽然通常召唤的是火焰，但也曾观察到召唤闪电、冰雹、沙暴、地震或烟雾的变体。地狱之火之道没有单独的力量，进一步修炼只能召唤更具毁灭性的力量。#!"
 numina_illusion_common_description: "#flavor 最基础的魔法之一，便是让他人相信施法者所愿之事的欺骗之力。幻象道途迷惑感官，使目标感知到不存在的事物，或改变其对既有事物的认知。多数人信赖自己的感官。\"眼见为实\"，但当幻术师近在咫尺时，这句古老的箴言可能致命。#!"
 numina_necromancy_common_description: "#flavor 有些事物理应长眠地下。其中首要的便是逝者。但那些追随亡灵术道途之人，对此却有着不同的见解。如同地狱之火，亡灵术也背负着污秽之名，被视为只有最邪恶之徒才会修习的技艺。但与地狱之火不同的是，这份恶名至少在一定程度上是实至名归的。#!"
 numina_oneiromancy_common_description: "#flavor 研习梦占道途的魔法师们学会了步入他人梦境。一旦进入其中，他们便会尝试掌控梦境，从而窥探信息或改变梦境，为做梦者带来裨益或伤害。当梦占师的力量达到顶峰时，他们甚至能将多人汇聚于同一场共享梦境。据传说，有些梦占师甚至能让梦境成真，或是获得以实体形态进入梦境的能力。#!"
 numina_quintessence_manipulation_common_description: "#flavor 几乎所有巫师都认同一个事实：存在一股力量之流，为他们的法术提供能量。这股力量在不同文化和哲学体系中有着诸多名称：魔力、气、灵知、夏克提、塞赫等等。每位魔法师在施展意志影响现实时，都能描述这种能量的流动。它如电流通过电线般在体内奔涌，能被感知，甚至能被某些人直接驾驭。#!"
 numina_shadows_common_description: "#flavor 掌控黑暗的力量是一种陈词滥调，但某些术士出于戏谑的亢奋或真诚的信仰，仍对此趋之若鹜。考虑到江湖骗子们频繁宣扬黑暗力量能增强秘法威能的说法，人们将阴影道途视为这一概念的源头也无可厚非。无论其声名如何，这条道途确实散发着不祥而慑人的气息——它塑造并扭曲着源于本能的恐惧本质，即阴影与黑暗。#!"
 numina_shapeshifting_common_description: "#flavor 即使在原始魔法中，变身为动物的能力也显得格外非凡。许多在夜晚游荡的怪物都拥有变身的力量，包括那些真正的变形者。研究变形道途的野法师们模仿了它们的一部分力量，先是改变身体的某些部位，随后以惊人的方式彻底转变整个躯体。#!"
 numina_weather_control_common_description: "#flavor 在严重依赖农业或航海的社会中，能够掌控天气的人备受珍视，往往成为社区生死存亡的关键。他们曾阻止或终结饥荒，最强大的巫师甚至能驱散或转移自然灾害。天气控制能力正如其名——巫师们可以操控气象。#!"