 NUMINA_ALCHEMY_1_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('alchemy_antidepresants_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('alchemy_aphrodisiac_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('alchemy_poison_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('alchemy_antibiotics_1_modifier').GetNameWithTooltip]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_2_PERK_EFFECT: "提升所有[GetPerk('numina_alchemy_1_perk').GetName(GetPlayer)][crafting_nodes|E]添$unlock_brewing_node$添加一个[modifier|E]，使一个随机[skill|E]增加1点 ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_3_PERK_EFFECT: "提升所有的[GetPerk('numina_alchemy_2_perk').GetName(GetPlayer)][crafting_nodes|E]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_4_PERK_EFFECT: "提升所有的[GetPerk('numina_alchemy_3_perk').GetName(GetPlayer)][crafting_nodes|E]\n$unlock_brewing_node$[GetModifier('alchemy_health_booster_1_modifier').GetNameWithTooltip]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_5_PERK_EFFECT: "提升所有[GetPerk('numina_alchemy_4_perk').GetName(GetPlayer)][crafting_nodes|E]\n$unlock_brewing_node$#TOOLTIP:GAME_TRAIT,immortal,[GetNullCharacter] #L 永生#!\n$unlock_brewing_node$#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L 吸血鬼化#!\n药剂持续时间：#P +1#!\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_6_PERK_EFFECT: "提升所有的[GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)][crafting_nodes|E]\n$unlock_brewing_node$以一名[character|E]为代价，提升所选[skill|E]#P 1#!点，该[character|E]的对应[skill|E]需高于#bold [EmptyScope.ScriptValue('POD_numina_sorcery_alchemy_skill_potion_requirement')]#!\n药剂效果持续时间：#P +2#!\n$numina_alchemy_common_description$"
