 NUMINA_FASCINATION_4_PERK_EFFECT: "作为[bs_spell|E]获得对目标的[weak_hook|E]。\n你的[friends|E]和[best_friends|E]有时会试图对你的[rivals|E]发起[GetScheme('murder').GetTypeName][scheme|E]。\n$numina_fascination_common_description$"
