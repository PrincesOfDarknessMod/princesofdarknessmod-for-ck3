 NUMINA_HEALING_4_PERK_EFFECT: "强化[GetPerk('numina_healing_2_perk').GetName(GetPlayer)]疾病[bs_spell|E]，使其也能治愈严重但并非不治之症的疾病，例如[GetTrait('pneumonic').GetName(GetPlayer)]，[GetTrait('consumption').GetName(GetPlayer)]，等等。\n$numina_healing_common_description$"
 NUMINA_HEALING_5_PERK_EFFECT: "强化[GetPerk('numina_healing_2_perk').GetName(GetPlayer)][POD_damage|E][bs_spell|E]，提升治疗至[EmptyScope.ScriptValue('POD_numina_sorcery_healing_5_heal')|V0][POD_superficial_damage_with_box|E]，[EmptyScope.ScriptValue('POD_numina_sorcery_healing_5_aggravated_heal')|V0][POD_aggravated_damage_with_box|E]，并能治愈如[GetTrait('maimed').GetName(GetPlayer)]，[GetTrait('one_eyed').GetName(GetPlayer)]等等。\n强化[GetPerk('numina_healing_2_perk').GetName(GetPlayer)]疾病[bs_spell|E]，使其也能治愈如[GetTrait('cancer').GetName(GetPlayer)]或[GetTrait('infirm').GetName(GetPlayer)]等不治之症。\n$numina_healing_common_description$"
 NUMINA_HEALING_6_PERK_EFFECT: "[POD_health_track|E]生命格：#P +1#!\n强化[GetPerk('numina_healing_2_perk').GetName(GetPlayer)][POD_damage|E][bs_spell|E]，提升治疗至[EmptyScope.ScriptValue('POD_numina_sorcery_healing_6_heal')|V0][POD_superficial_damage_with_box|E]和[EmptyScope.ScriptValue('POD_numina_sorcery_healing_6_aggravated_heal')|V0][POD_aggravated_damage_with_box|E]。\n强化[GetPerk('numina_healing_2_perk').GetName(GetPlayer)]疾病[bs_spell|E]，使其也能治愈[GetTrait('chulorviosis').GetName(GetPlayer)]或[GetTrait('crimson_fever').GetName(GetPlayer)]等超自然疾病。\n你获得[trait|E]#V [GetTrait('immortal').GetName(GetPlayer)]#!\n$numina_healing_common_description$"
