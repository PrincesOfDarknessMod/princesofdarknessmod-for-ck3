 arcana_command_the_dead_perk_name: "亡者统御"
 arcana_fortunate_guess_perk_name: "天命直觉"
 arcana_shrouded_soul_perk_name: "虚境之魂"
 ARCANA_ARSENAL_OF_THE_BEAST_PERK_EFFECT: "作为[character_interaction|E]，可添加兽形武器或完全兽化\n#flavor 恶魔能幻化灾厄形态武器#!"
 ARCANA_INHUMAN_STRENGTH_PERK_EFFECT: "#flavor 恶魔力量具现化为肌肉组织或隐藏能量#!"
 ARCANA_DAMAGE_IMMUNITY_PERK_EFFECT: "免疫木桩穿刺与火焰伤害，且不会[GetTrait('inappetetic').GetName(GetPlayer)]\n#flavor 恶魔获得特定物理伤害免疫#!"
 ARCANA_TRAIT_APTITUDE_PERK_EFFECT: "#flavor 恶魔对某领域的理解已臻化境，其所行皆为杰作，无人能及。#!"
 ARCANA_SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor 该恶魔速度快得惊人，甚至可以用其可怕力量在半空中接住射出的弩箭#!"
 ARCANA_INVINSIBILITY_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip]\n#flavor 恶魔能从凡物视野中消失#!"
 ARCANA_COMMAND_THE_DEAD_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n解锁死灵[men_at_arms|E]\n#flavor 恶魔能强制死者效忠#!"
 ARCANA_READ_THE_MIND_PERK_EFFECT: "作为[character_interaction|E]，可获知目标所有秘密与阴谋。若目标为自己，则发现针对你的所有阴谋。\n#flavor 心灵之书全然展开，恶魔可随意翻阅他人思绪，如观敞卷。#!"
 ARCANA_FORTUNATE_GUESS_PERK_EFFECT: "启用[GetScheme('fabricate_hook').GetTypeName][scheme|E]\n#flavor 恶魔能感知对密教徒的敌意#!"
 ARCANA_SHROUDED_SOUL_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$\n#flavor 恶魔可模糊周围认知，在人群中隐匿#!"
