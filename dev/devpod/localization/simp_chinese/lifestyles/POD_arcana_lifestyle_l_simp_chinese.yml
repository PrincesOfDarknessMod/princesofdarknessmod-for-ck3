 SHADOW_MASTERY_PERK_EFFECT:0 "允许变身为[GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L]。\n#F 该角色可以通过施加给他那受诅的灵魂的无上黑暗来控制黑暗。#!"
