 shadow_mastery_perk_name:0 "暗影主宰"
 APOCALYPTIC_FORM_PERK_EFFECT:0 "若是[GetTrait('demon').GetName( GetPlayer )]，允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_angelic_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'POD_shapeshift_form_apocalyptic_damned_modifier' ).GetNameWithTooltip|L]。\n若是[thrall|E]，允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_lesser_modifier' ).GetNameWithTooltip|L]。\n#F 作为他们神性的残余，所有恶魔都有他们可以在战斗中变化的存在状态，即他们可怕的天启形态。根据恶魔的磨难，他们可能会表现得像天使一样，具有他们堕落之前的模样，或者是真正的邪恶和暴力，显示出他们内心磨难的真实场景。在所有情况下，这种可怕而强大的形态是恶魔在战争中的首选项。#!"
 PRETERNATURAL_REFLEXES_PERK_EFFECT:0 "#F At this state of power, a demon gains a supernatural awareness of their surroundings, always ready to spring into combat, and always ready.#!"
 HARDENED_FLESH_PERK_EFFECT:0 "#F The demon's host body, at this state, becomes truly durable, able to shrug off normally lethal blows at peak condition. The raw power flowing into the body keeps it forever young, until the demon decides it is done with its current body.#!"
 PERFECT_IMMUNITY_PERK_EFFECT:0 "你不会获得疾病。\n#F 只要对形态奥秘有一点了解，恶魔就能消除对疾病的担忧，使他们永远保持健康。#!"
 ARSENAL_OF_THE_BEAST_PERK_EFFECT:0 "解锁野兽的军火库变形选项。\n#F 在这种状态下，恶魔可以在他们的天启形态中显现出野兽武器，其形状可是极锐的刀片，或者是连最残酷的野兽都不会使用的邪恶利爪。#!"
 INCREASED_HEALTH_PERK_EFFECT:0 "#F With an understanding of their physique, a demon can push their vessel past mere mortal limits.#!"
 SENSE_VITALITY_PERK_EFFECT:0 "#F A demon's understanding of biology ascends to such heights with this power, the health of others is laid bare before them.#!"
 CONTAGION_MASTERY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你治疗或给予疾病。\n#F 拥有这种能力的恶魔，甚至对最小的神造生物也能理解，能够从宿主身上清除疾病，或者更糟糕的用法，用疾病折磨他们。#!"
 ULTIMATE_HORROR_PERK_EFFECT:0 "#F So terrible has this demon's apocalyptic form become, madness and woe follow wherever it walks for war.#!"
 WINGS_PERK_EFFECT:0 "解锁[GetModifier( 'arsenal_of_the_beast_wings_modifier' ).GetNameWithTooltip|L]到野兽的军火库变形中。\n#F 该角色从她的背上长出一双大翅膀，在完全伸展的情况下，能长达角色身高的三倍。这些翅膀可能类似于鸟、蝙蝠、蝴蝶或更奇怪的东西，也可是用火、光、云、影或展开的锯齿状水晶雕刻而成的。#!"
 INHUMAN_STRENGTH_PERK_EFFECT:0 "#F With this power, a demon's might becomes made manifest in raw power, as cordons of rippling muscle, or as a hidden reserve of terrifying power.#!"
 INURED_TO_AGONY_PERK_EFFECT:0 "#F A demon with this power triumphs over such mortal concerns as 'pain' or 'age' and rather, no matter how maimed they are, so long as the demon stands, it will fight as if it was untouched by war or ailment.#!"
 DAMAGE_IMMUNITY_PERK_EFFECT:0 "你不再会获得[GetTrait('inappetetic').GetName( GetPlayer )]。\n#F 该角色无视由特定类型的来源造成的所有伤害。另外，该角色超越了凡人肉体的固有限制，例如对营养、空气、睡眠或同样重要的东西的需求。#!"
 HEALING_TOUCH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你治疗目标的伤口。\n#F 凭借凡人的信仰之力，恶魔可以治愈活人，修补他们受创的伤口。#!"
 RESHAPE_FLESH_PERK_EFFECT:0 "增强变形[character_interaction|E]以改变面貌。\n#F 恶魔可以命令活化动物物质在他的触摸下转变，甚至像蜡一样流动。#!"
 RELENTLESS_SOUL_PERK_EFFECT:0 "允许你不死于受伤。\n#F 每当角色受到致命伤害时，角色身体会保持在失能状态，而不是死亡。#!"
 UNYIELDING_PERK_EFFECT:0 "允许你动用意志力免收伤害。\n#F 该角色具有岩石般的耐久，并且完全无视所有的钝器伤害。#!"
 SPEED_OF_THOUGHT_PERK_EFFECT:0 "#F So blinding is this demon's speed, a demon could fire an arrow, and then catch it, with their truly fearsome power.#!"
 DIVINE_POTENTIAL_PERK_EFFECT:0 "#F Under such understanding of Arcana and the Mortal form, a demon can transcend formerly mortal limits.#!"
 TRAIT_APTITUDE_PERK_EFFECT:0 "#F So thorough has a demon's understanding of a field become, they are unmatched in it, as all they perform with this skill has become a magnum opus.#!"
 TRAIT_ENHANCEMENT_PERK_EFFECT:0 "#F At this level of mastery, a demon has truly surpassed the limits of mortalkind.#!"
 INVOCATION_OF_NAME_PERK_EFFECT:0 "#F Whenever spoken, the true name of a demon rings in their ears, allowing them to potentially find the person that dared speak it.#!"
 DEVOUR_SOUL_PERK_EFFECT:0 "能够对[GetTrait('demon').GetName( GetPlayer )]使用$EXECUTION_DEVOUR_SOUL$[executions|E]选项。\n#F 在远离地狱之处，恶魔可以通过吞噬和同化他们同族的精华来永久地摧毁他们。#!"
 ENTHRALL_PERK_EFFECT:0 "解锁奴役[character_interaction|E]。\n#F 通过接触一位自愿接受的凡人，恶魔可以重塑目标的灵魂，以给予地狱力量之赠礼。#!"
 IMMORTAL_SPIRIT_PERK_EFFECT:0 "不会被物理招式伤害。\n#F 没有肉体外壳或宿匣时，恶魔灵魂将变为纯粹由虔心构成的虚体存在。#!"
 ARCANA_POSSESSION_PERK_EFFECT:0 "作为[character_interaction|E]，允许你在灵体形态时附身角色或宝物。\n作为[character_interaction|E]，你能指定备用人类容器，以防当前容器出错。\n#F 没有宿主身体或宿匣作为安灵之处的恶魔可以通过附身寻求庇护。#!"
 RAVAGE_PERK_EFFECT:0 "能够对[thrall|E]使用$EXECUTION_DEVOUR_SOUL$[executions|E]选项。\n#F 在紧急情况下，恶魔可以吞噬他们的[thrall|E]的灵魂，以迅速补充他们的虔心储备。#!"
 INVIOLATE_SOUL_PERK_EFFECT:0 "获得强力精神防护，让你免疫相关能力。\n无法被变为[GetTrait('wraith').GetName( GetPlayer )]。\n#F 该角色对附身和其他控制或压制她的灵魂的企图完全免疫。#!"
 SPIRIT_SIGHT_PERK_EFFECT:0 "解锁$POD_marked_for_return_interaction$[character_interaction|E]。\n解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 该角色可以感知所有本在世界或反映世界的临近灵界位面上无踪无迹地漫游的虚体灵体。#!"
 READ_THE_SIN_PERK_EFFECT:0 "#F As creatures of sin, a demon may gaze onto a mortal, and find the sin that rules their heart.#!"
 COMPEL_SIN_PERK_EFFECT:0 "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 该角色能在一段时间内将他的罪恶投射到其他人身上，让他们感受到相关冲动。#!"
 READ_THE_HEART_PERK_EFFECT:0 "#F So acute has a demon's spiritual sense become, they can find the sin and virtues of all, no matter how deeply buried.#!"
 GIFT_OF_FAITH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你捐赠虔心来减少[stress|E]。\n#F 角色触碰或与他的魔奴进行眼神交流，捐出过剩的虔心以获得意志力。#!"
 GREATER_INVOCATION_PERK_EFFECT:0 "解锁召唤[character_interaction|E]。\n#F 恶魔现在可以使用以名召唤来联系任何它知道名字的智慧生物，就像它召唤其他恶魔一样。#!"
 PERFECT_LIE_PERK_EFFECT:0 "#F No matter how absurd, demons with this power may lie as easily as they breathe.#!"
 READ_THE_MIND_PERK_EFFECT:0 "#F The book of the mind laid bare, a demon may this power may pick the mind of thoughts, as if it were an opened book.#!"
 CONQUERING_WILL_PERK_EFFECT:0 "#F Invoking the name of Yahweh himself, a demon may empower their warriors, with the word of the god that cast them down.#!"
 COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT:0 "作为[character_interaction|E]，你能发掘其他[GetTrait('demon').GetName( GetPlayer )]的真名。\n#F 通过使用以名召唤奥秘，恶魔说出恶魔的真名。#!"
 REAPERS_HUNGER_PERK_EFFECT:0 "每杀一人获得#V 1#!虔心。\n#F 每当堕落者亲自杀死一位凡人，他们就会获得一点虔心。#!"
 IMPLACABLE_VENGEANCE_PERK_EFFECT:0 "每有一[rival|E]叠加一层：[GetModifier( 'implacable_vengeance_perk_modifier' ).GetNameWithTooltip|L]\n#F 恶魔为它的猎物命名，并将它的整个魔生目标调整为毁灭她。只要恶魔警惕地、不间断地猎杀它的猎物，并直接向她的死亡努力，它就不需要睡眠、食物、饮料或空气。它不会感到疲劳或疼痛，也不会受到伤害惩罚；简而言之，它的存在超越了活人肉体的限制。#!"
 SHIELD_OF_SPITE_PERK_EFFECT:0 "#F So tormented is a demon's mind, merely attempting to pry into it's mind causes the foolish attacker to suffer horrible pain from the despair and evil within.#!"
 LASH_OF_ANGUISH_PERK_EFFECT:0 "#F So attuned a demon has become to its own pain, a demon may project its anguish and inner pain as a barrage of telepathic energy.#!"
 SHROUDED_SOUL_PERK_EFFECT:0 "#F With this power, a demon may blur the cognition of those around them, becoming faceless in a crowd, no matter how much the demon stands out.#!"
 ARCANA_SIN_EATING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你使目标凡人遭受压力爆发，以让你恢复虔心。\n#F 角色可以通过放纵自己的恶行或目睹一个凡人放纵其所喜爱的罪来恢复虔心。#!"
 RAVAGE_SINNER_PERK_EFFECT:0 "增强食罪[character_interaction|E]，一定概率直接吞噬目标灵魂。\n#F 恶魔可以引诱凡人目标陷入放荡，以便能够进食，但凡人必须真正地主动犯罪。#!"
 SOUL_BURN_PERK_EFFECT:0 "允许你在[GetModifier( 'resolve0_modifier' ).GetNameWithTooltip|L]时用[stress|E]来使用奥秘。\n#F 在紧急情况下，该角色可以食用自己的灵魂以获得力量。#!"
 CEREMENT_OF_WALKING_DUST_PERK_EFFECT:0 "Allow the use of a dead vessel as a backup vessel in [GetTrait('truefallen').GetName( GetPlayer )] maintenance.\n#F To demons with this power, a corpse is but a stinkier reliquary, allowing them to raise the corpse as their new vessel of choice.#!"
 COMMAND_THE_DEAD_PERK_EFFECT:0 "解锁$POD_bind_interaction$[character_interaction|E]。\n解锁$POD_command_wraith_interaction$[character_interaction|E]。\n#F 恶魔可以命令在其面前的鬼魂，并期望其服从。#!"
 RAISE_THE_DEAD_PERK_EFFECT:0 "作为[character_interaction|E]，允许启动[GetModifier( 'zombu_summon_modifier' ).GetNameWithTooltip|L]。\n能够招募[GetMaA('zombu').GetName]作为[men_at_arms|E]。\n#F 这角色命令死人复活，说着亵渎性的嘲弄来为归于尘土的生命注入气息。#!"
 SPIRIT_STRIKE_PERK_EFFECT:0 "能够监禁，处决或通过物理招式伤害在[single_combat_duel|E]中[GetTrait('wraith').GetName( GetPlayer )]。\n#F 该角色可以击中非物质的灵体。#!"
 EXCISE_SOUL_PERK_EFFECT:0 "解锁$EXECUTION_CONVERT_TO_WRAITH$[executions|E]选项。\n#F 角色袭击一个有实体的生命，导致其灵魂被撕裂出来，其身体立即死亡。#!"
 ABANDON_VESSEL_PERK_EFFECT:0 "作为[character_interaction|E]，允许你抛弃当前容器。\n#F 恶魔可以心甘情愿地离开不再满足其需求的容器的庇护。#!"
 THEFT_OF_FAITH_PERK_EFFECT:0 "能够对其他非魔者使用$EXECUTION_DEVOUR_SOUL$[executions|E]选项。\n#F 使用这个奥秘可以让恶魔对目标进行蹂躏，就像她是它的魔奴一样。#!"
 TRANSFER_VESSEL_PERK_EFFECT:0 "你不再需要先放弃你当前的容器才能去附身另一个。\n#F 通过接触一个潜在的新容器，恶魔可以直接尝试用附身来转移它的存在，而不会给自己带来任何风险。#!"
 USURPATION_OF_FLESH_PERK_EFFECT:0 "对所有[thrall|E]获得强牵制。\n#F 恶魔可以使用该奥秘来控制魔奴的身体，像木偶一样控制该仆从。#!"
 VISAGE_OF_GLORY_PERK_EFFECT:0 "#F Channeling the memories of their lost status as Elohim, for a short time, a demon may become truly angelic.#!"
 BEHOLD_THE_METATRON_PERK_EFFECT:0 "#F Becoming a true architect of creation, the demon unveils their truest form, their most primal state, either one of sublime perfection or horrendous evil.#!"
 PATTERN_SENSE_PERK_EFFECT:0 "#F Demons once had an instinctual sensitivity to the patterns of the natural order, having established those patterns at the beginning of time. With this arcana, a demon has relearned that, and how to exploit it.#!"
 FORTUNATE_GUESS_PERK_EFFECT:0 "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n#F 该角色对机遇和命运的流动获得了一种不可思议的直觉。#!"
 FORETELL_PERK_EFFECT:0 "解锁[deceitful_progress_hostile_schemes_decision|E]。\n#F 该角色可以看出未来可能发生的事件。#!"
 ALTER_FATE_PERK_EFFECT:0 "解锁[impatient_rushing_all_schemes_decision|E]。\n#F 恶魔可通过说出一个人的名字，宣布强加给他的未来的变化，从而拉伸甚至撕裂他的命运。#!"
 BEYOND_NOW_PERK_EFFECT:0 "#F With this power, a demon may step outside of time itself, the tapestry of the cosmos temporarily at their command.#!"
 CERTAINTIES_OF_CHANCE_PERK_EFFECT:0 "#F From merely observing the flow of chance and destiny, a demon may twist it to their ends.#!"
 PORTAL_MASTERY_PERK_EFFECT:0 "#F Just as existence once lay at their beck and call, a demon may pass or bar barriers at their will.#!"
 ARCANA_PREMONITION_PERK_EFFECT:0 "#F Like a spider in its web, the character senses vibrations in the strands of fate when danger approaches, making them ready for all outcomes.#!"
