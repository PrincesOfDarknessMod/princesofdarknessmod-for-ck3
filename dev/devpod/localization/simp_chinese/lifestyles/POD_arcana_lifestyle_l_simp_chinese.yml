 ARCANA_INURED_TO_AGONY_PERK_EFFECT: " #flavor 恶魔无视伤痛与衰老持续作战#!"
 ARCANA_VISAGE_OF_GLORY_PERK_EFFECT: "#flavor 恶魔短暂唤醒耶洛因时期的记忆，暂时重现真正天使形态。#!"
 ARCANA_RESHAPE_FLESH_PERK_EFFECT: "可改变自愿目标的身体[traits|E]\n#flavor 恶魔能像捏蜡般重塑肉体#!"
 ARCANA_EXCISE_SOUL_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\n杀死目标时摧毁其灵魂，阻止复活\n#flavor 恶魔通过仪式强迫灵魂臣服#!"
 ARCANA_FORETELL_PERK_EFFECT: "#flavor 恶魔能预知未发生之事#!"
 ARCANA_SHORTENED_PATH_PERK_EFFECT: "#flavor 恶魔利用创世古道加速移动#!"
 ARCANA_REAPERS_HUNGER_PERK_EFFECT: "每次击杀获得5年[GetModifier('POD_reapers_hunger_modifier').GetNameWithTooltip]\n#flavor 恶魔可收割将死灵魂的能量#!"
 ARCANA_TOUCH_FROM_AFAR_PERK_EFFECT: "#flavor 随着恶魔对空间现实理解的加深，其奥秘领域也随之扩展。#!"
 arcana_unyielding_perk_name: "坚不可摧"
 arcana_theft_of_faith_perk_name: "信仰窃取"
 arcana_behold_the_metatron_perk_name: "梅塔特隆之视"
 arcana_command_the_eternal_soul_perk_name: "永恒灵魂统御"
 arcana_implacable_vengeance_perk_name: "无止复仇"
 arcana_trait_enhancement_perk_name: "特质强化"
 arcana_certainties_of_chance_perk_name: "命运必然"
 arcana_celestial_radience_perk_name: "天之辉光"
 arcana_shadow_mastery_perk_name: "暗影掌控"
 arcana_step_between_perk_name: "裂隙穿行"
 ARCANA_UNYIELDING_PERK_EFFECT: "#flavor 恶魔意志力极强，只要信念尚存，单凭意志即可化解攻击。#!"
 ARCANA_THEFT_OF_FAITH_PERK_EFFECT: "使#V $POD_set_cultist_interaction$#![interaction|E]花费降低#P -50%#!\n提升[GetPerk('arcana_revelation_perk').GetName(GetPlayer)]，增加获得的[CHARACTER.Custom('PODEnergySplat')]。\n#flavor 恶魔对灵魂的理解已趋完美，任何灵魂都可能被其地狱主宰吞噬。#!"
 ARCANA_BEHOLD_THE_METATRON_PERK_EFFECT: "#flavor 成为真正的创世建筑师，恶魔展现其最真实形态——或是完美无瑕，或是极恶可怖。#!"
 ARCANA_COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT: "作为[character_interaction|E]，对监狱中的$POD_splat_demon$有50%几率将其变为忠诚傀儡或放逐至[UmbraGlossary('abyss')]。\n#flavor 恶魔可呼唤同类真名，迫使其臣服。#!"
 ARCANA_IMPLACABLE_VENGEANCE_PERK_EFFECT: "#flavor 这些无情的怪物，恶魔可以唤出目标的真名，成为其受害者无可阻挡的末日先兆，变成无法克服的绝望预兆。#!"
 ARCANA_TRAIT_ENHANCEMENT_PERK_EFFECT: "#flavor 至此境界，恶魔已真正超越凡俗极限。#!"
 ARCANA_CERTAINTIES_OF_CHANCE_PERK_EFFECT: "#flavor 仅需观察命运流转，恶魔便可扭曲其为己所用。#!"
 ARCANA_CELESTIAL_RADIENCE_PERK_EFFECT: "#flavor 恶魔释放耀眼光芒，化作炽烈光之灯塔。#!"
 ARCANA_SHADOW_MASTERY_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip]。\n#flavor 恶魔对自身灵魂的掌控已臻化境，可披魂为袍，化作擎天黑柱。#!"
 ARCANA_STEP_BETWEEN_PERK_EFFECT: "#flavor 恶魔可轻柔扭曲空间，在光影交错间瞬移。#!"
