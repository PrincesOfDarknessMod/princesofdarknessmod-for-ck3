 arcana_raise_the_dead_perk_name: "死者苏生"
 arcana_portal_mastery_perk_name: "传送门精通"
 ARCANA_RAVAGE_SINNER_PERK_EFFECT: "提升[GetPerk('arcana_revelation_perk').GetName(GetPlayer)]并降低其消耗。\n#flavor 恶魔的存在会激发凡人最深的欲望。#!"
 ARCANA_GREATER_INVOCATION_PERK_EFFECT: "提升[GetPerk('arcana_command_the_eternal_soul_perk').GetName(GetPlayer)]，可对非恶魔目标使用\n#flavor 恶魔开始掌控真名之力，可强制他人应召臣服。#!"
 ARCANA_PORTAL_MASTERY_PERK_EFFECT: "作为[character_interaction|E]，可将军队传送至目标位置，或旅行时直接抵达目的地。无视捕获免疫。\n#flavor 如同创世之初掌控存在权柄，恶魔可随心穿越任何屏障。#!"
 ARCANA_RAISE_THE_DEAD_PERK_EFFECT: "作为[character_interaction|E]，将被束缚的$POD_splat_wraith$化为[GetTrait('risen').GetName(GetPlayer)]。\n#flavor 亡者亦难逃恶魔奴役，此力可唤醒亡灵大军侍奉其地狱欲望。#!"
 ARCANA_LASH_OF_ANGUISH_PERK_EFFECT: "#flavor 恶魔已与自身痛苦完全共鸣，可将内心煎熬转化为心灵能量冲击。#!"
 arcana_open_gate_perk_name: "开启界门"
 arcana_alter_fate_perk_name: "命运篡改"
 ARCANA_OPEN_GATE_PERK_EFFECT: "提升[GetPerk('arcana_portal_mastery_perk').GetName(GetPlayer)]，取消军队规模限制。\n#flavor 恶魔对空间的支配已至空间本身屈从其意志的境界。#!"
 ARCANA_ALTER_FATE_PERK_EFFECT: "#flavor 曾洞悉创世奥秘的恶魔，可借呼唤真名来扭曲目标命运轨迹。#!"
 arcana_beyond_now_perk_name: "超越现世"
 ARCANA_BEYOND_NOW_PERK_EFFECT: "作为[character_interaction|E]，消耗300[static_stress|E]获得持续1周的[GetModifier('POD_beyond_now_modifier').GetNameWithTooltip]。\n#flavor 恶魔可超脱时间长河，暂时执掌宇宙命脉。#!"