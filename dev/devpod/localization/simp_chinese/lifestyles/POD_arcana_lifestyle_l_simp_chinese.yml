 celestial_radiance_perk_name: "天体光芒"
 shadow_mastery_perk_name: "暗影主宰"
 APOCALYPTIC_FORM_PERK_EFFECT: "若是[GetTrait('demon').GetName( GetPlayer )]，允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_angelic_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'POD_shapeshift_form_apocalyptic_damned_modifier' ).GetNameWithTooltip|L]。\n若是[thrall|E]，允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_lesser_modifier' ).GetNameWithTooltip|L]。\n#F 作为他们神性的残余，所有恶魔都有他们可以在战斗中变化的存在状态，即他们可怕的天启形态。根据恶魔的磨难，他们可能会表现得像天使一样，具有他们堕落之前的模样，或者是真正的邪恶和暴力，显示出他们内心磨难的真实场景。在所有情况下，这种可怕而强大的形态是恶魔在战争中的首选项。#!"
 PRETERNATURAL_REFLEXES_PERK_EFFECT: "#F 在这力量下，恶魔获得了对周围环境的超自然感知，随时准备加入战斗。#!"
 HARDENED_FLESH_PERK_EFFECT: "#F 在这奥秘下，恶魔的宿主身体变得真正耐用，能够在巅峰状态下免疫致命一击。流入身体的原始力量使它永远年轻，直到恶魔决定不再使用它目前的身体。#!"
 PERFECT_IMMUNITY_PERK_EFFECT: "你不会获得疾病。\n#F 只要对形态奥秘有一点了解，恶魔就能消除对疾病的担忧，使他们永远保持健康。#!"
 ARSENAL_OF_THE_BEAST_PERK_EFFECT: "解锁野兽的军火库变形选项。\n#F 在这种状态下，恶魔可以在他们的天启形态中显现出野兽武器，其形状可是极锐的刀片，或者是连最残酷的野兽都不会使用的邪恶利爪。#!"
 INCREASED_HEALTH_PERK_EFFECT: "受附身宿体的每年死亡概率：#P -5#!\n#F 凭借对体质的了解，恶魔可以让他们的容器超越凡人的极限。#!"
 SENSE_VITALITY_PERK_EFFECT: "#F 恶魔对生物学的理解在这能力下被上升到如此高，以至于他人的健康程度在他们面前暴露无遗。#!"
 CONTAGION_MASTERY_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗或给予疾病。\n#F 拥有这种能力的恶魔，甚至对最小的神造生物也能理解，能够从宿主身上清除疾病，或者更糟糕的用法，用疾病折磨他们。#!"
 ULTIMATE_HORROR_PERK_EFFECT: "#F 恶魔的天启形态变得如此可怕，它走到哪里，疯狂和沮丧就跟到哪里。#!"
 WINGS_PERK_EFFECT: "解锁[GetModifier( 'arsenal_of_the_beast_wings_modifier' ).GetNameWithTooltip|L]到野兽的军火库变形中。\n#F 该角色从她的背上长出一双大翅膀，在完全伸展的情况下，能长达角色身高的三倍。这些翅膀可能类似于鸟、蝙蝠、蝴蝶或更奇怪的东西，也可是用火、光、云、影或展开的锯齿状水晶雕刻而成的。#!"
 INHUMAN_STRENGTH_PERK_EFFECT: "#F 有了这力量，恶魔的威力就会以蛮力形态表现出来，如波纹状的肌肉，或如隐藏着可怕力量的姿态。#!"
 INURED_TO_AGONY_PERK_EFFECT: "#F 拥有这力量的恶魔战胜了“痛苦”或“年龄”等凡人的担忧，相反，无论他们多么残缺，只要恶魔站着，它就会像未受战争或病痛影响一样战斗。#!"
 DAMAGE_IMMUNITY_PERK_EFFECT: "你不再会获得[GetTrait('inappetetic').GetName( GetPlayer )]。\n#F 该角色无视由特定类型的来源造成的所有伤害。另外，该角色超越了凡人肉体的固有限制，例如对营养、空气、睡眠或同样重要的东西的需求。#!"
 HEALING_TOUCH_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗目标的伤口。\n#F 凭借凡人的信仰之力，恶魔可以治愈活人，修补他们受创的伤口。#!"
 RESHAPE_FLESH_PERK_EFFECT: "增强变形[character_interaction|E]以改变面貌。\n#F 恶魔可以命令活化动物物质在他的触摸下转变，甚至像蜡一样流动。#!"
 RELENTLESS_SOUL_PERK_EFFECT: "允许你不死于受伤。\n#F 每当角色受到致命伤害时，角色身体会保持在失能状态，而不是死亡。#!"
 UNYIELDING_PERK_EFFECT: "允许你动用意志力免收伤害。\n#F 该角色具有岩石般的耐久，并且完全无视所有的钝器伤害。#!"
 SPEED_OF_THOUGHT_PERK_EFFECT: "#F 极度可怕的能力，恶魔的速度变得如此急速，以至于恶魔可以射出一支箭，然后接住它。#!"
 DIVINE_POTENTIAL_PERK_EFFECT: "#F 通过对奥秘和凡人形态的理解，恶魔可以轻松超越凡俗限制。#!"
 TRAIT_APTITUDE_PERK_EFFECT: "#F 恶魔对某一学科的理解如此透彻，以至于在这一学科无人能及，他们用这一技能所做的一切都已成为伟大之作。#!"
 TRAIT_ENHANCEMENT_PERK_EFFECT: "#F 到达这境界，恶魔已经真正超越了人类的极限。#!"
 INVOCATION_OF_NAME_PERK_EFFECT: "#F 每当有人说出它的名字时，恶魔就会凭直觉感应到，并可能顺着这条线回溯窥探源头。#!"
 DEVOUR_SOUL_PERK_EFFECT: "能够对[GetTrait('demon').GetName( GetPlayer )]使用$EXECUTION_DEVOUR_SOUL$[execution|E]选项。\n#F 在远离地狱之处，恶魔可以通过吞噬和同化他们同族的精华来永久地摧毁他们。#!"
 ENTHRALL_PERK_EFFECT: "解锁奴化[character_interaction|E]，允许你让目标成为你的[thrall|E]。\n#F 通过接触一位自愿接受的凡人，恶魔可以重塑目标的灵魂，以给予地狱力量之赠礼。#!"
 IMMORTAL_SPIRIT_PERK_EFFECT: "不会被物理招式伤害。\n#F 没有肉体外壳或宿匣时，恶魔灵魂将变为纯粹由决意构成的虚体存在。#!"
 ARCANA_POSSESSION_PERK_EFFECT: "作为[character_interaction|E]，允许你在灵体形态时附身角色或宝物。\n作为[character_interaction|E]，你能指定备用人类容器，以防当前容器出错。\n#F 没有宿主身体或宿匣作为安灵之处的恶魔可以通过附身寻求庇护。#!"
 RAVAGE_PERK_EFFECT: "能够对[thrall|E]使用$EXECUTION_DEVOUR_SOUL$[execution|E]选项。\n#F 在紧急情况下，恶魔可以吞噬他们的[thrall|E]的灵魂，以迅速补充他们的决意储备。#!"
 INVIOLATE_SOUL_PERK_EFFECT: "获得强力精神防护，让你免疫相关能力。\n无法被变为[GetTrait('wraith').GetName( GetNullCharacter )]。\n#F 该角色对附身和其他控制或压制她的灵魂的企图完全免疫。#!"
 SPIRIT_SIGHT_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n最大束缚死灵数量：#P +2#!\n#F 该角色可以感知所有本在世界或反映世界的临近灵界位面上无踪无迹地漫游的虚体灵体。#!"
 READ_THE_SIN_PERK_EFFECT: "#F 作为原罪的创造者，恶魔能注视着凡人，并找到统治他们内心的罪。#!"
 COMPEL_SIN_PERK_EFFECT: "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 该角色能在一段时间内将他的罪恶投射到其他人身上，让他们感受到相关冲动。#!"
 READ_THE_HEART_PERK_EFFECT: "#F 恶魔的灵性感应如此敏锐，以至于可以看出所有人的罪和德，无论埋藏得多深。#!"
 GIFT_OF_FAITH_PERK_EFFECT: "作为[character_interaction|E]，允许你捐赠决意来减少[stress|E]。\n#F 角色触碰或与他的魔奴进行眼神交流，捐出过剩的决意以获得意志力。#!"
 GREATER_INVOCATION_PERK_EFFECT: "解锁召唤[character_interaction|E]，允许你召唤无地角色到你的宫廷。\n#F 恶魔现在可以使用以名召唤来联系任何它知道名字的智慧生物，就像它召唤其他恶魔一样。#!"
 PERFECT_LIE_PERK_EFFECT: "#F 无论多么荒唐，拥有这能力的恶魔可以像呼吸一样轻松地撒谎。#!"
 READ_THE_MIND_PERK_EFFECT: "#F 恶魔能以力量可能挑动心智，就像它是一本被打开的心灵之书。#!"
 CONQUERING_WILL_PERK_EFFECT: "#F 援引上帝本人的名字，恶魔可通过投下他们的神的话语来赋予战士力量。#!"
 COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT: "作为[character_interaction|E]，你能发掘其他[GetTrait('demon').GetName( GetPlayer )]的真名。\n#F 通过使用以名召唤奥秘，恶魔说出恶魔的真名。#!"
 REAPERS_HUNGER_PERK_EFFECT: "每杀一人获得#V 1#!决意。\n#F 每当堕天者亲自杀死一位凡人，他们就会获得一点决意。#!"
 IMPLACABLE_VENGEANCE_PERK_EFFECT: "每有一[rival|E]叠加一层：[GetModifier( 'implacable_vengeance_perk_modifier' ).GetNameWithTooltip|L]\n#F 恶魔为它的猎物命名，并将它的整个魔生目标调整为毁灭她。只要恶魔警惕地、不间断地猎杀它的猎物，并直接向她的死亡努力，它就不需要睡眠、食物、饮料或空气。它不会感到疲劳或疼痛，也不会受到伤害惩罚；简而言之，它的存在超越了活人肉体的限制。#!"
 SHIELD_OF_SPITE_PERK_EFFECT: "#F 恶魔的思想是如此混沌，仅仅试图窥探它的思想就会使愚蠢的攻击者遭受绝望和邪恶带来的可怕痛苦。#!"
 LASH_OF_ANGUISH_PERK_EFFECT: "#F 恶魔对自己的痛苦如此敏感，以至于他能把身躯的痛苦和内心的痛苦投射到心灵能量中。#!"
 SHROUDED_SOUL_PERK_EFFECT: "#F 有了这种能力，恶魔可能会模糊周围人的认知，在人群中变得平平无奇，无论恶魔有多么显眼。#!"
 ARCANA_SIN_EATING_PERK_EFFECT: "作为[character_interaction|E]，允许你使目标凡人遭受压力爆发，以让你恢复决意。\n#F 角色可以通过放纵自己的恶行或目睹一个凡人放纵其所喜爱的罪来恢复决意。#!"
 RAVAGE_SINNER_PERK_EFFECT: "增强食罪[character_interaction|E]，一定概率直接吞噬目标灵魂。\n#F 恶魔可以引诱凡人目标陷入放荡，以便能够进食，但凡人必须真正地主动犯罪。#!"
 SOUL_BURN_PERK_EFFECT: "允许你在[GetModifier( 'resolve0_modifier' ).GetNameWithTooltip|L]时用[stress|E]来使用奥秘。\n#F 在紧急情况下，该角色可以食用自己的灵魂以获得力量。#!"
 CEREMENT_OF_WALKING_DUST_PERK_EFFECT: "允许使用死去宿体作为备用容器。\n#F 对拥有这种能力的恶魔来说，尸体不过是一个更臭的宿匣，允许他们把尸体作为新容器。#!"
 COMMAND_THE_DEAD_PERK_EFFECT: "解锁[bind_wraith_interaction|E]。\n解锁[command_wraith_interaction|E]。\n最大束缚死灵数量：#P +1#!\n#F 即使是死者也无法逃脱这种力量，因为恶魔可能会强迫他们服从。#!"
 RAISE_THE_DEAD_PERK_EFFECT: "作为[character_interaction|E]，允许启动[GetModifier( 'zombu_summon_modifier' ).GetNameWithTooltip|L]。\n能够招募[GetMaA('hidden').GetName]、[GetMaA('walker').GetName]、[GetMaA('shambler').GetName]和[GetMaA('skeletons').GetName]作为[men_at_arms|E]。\n#F 这角色命令死人复活，说着亵渎性的嘲弄来为归于尘土的生命注入气息。#!"
 SPIRIT_STRIKE_PERK_EFFECT: "监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体不再有[gold|E]耗费。\n对于[thrall|E]，能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n#F 该角色可以击中非物质的灵体。#!"
 EXCISE_SOUL_PERK_EFFECT: "解锁$EXECUTION_CONVERT_TO_WRAITH$[execution|E]选项。\n#F 角色袭击一个有肉体的生命，导致其灵魂被撕裂出来，其身体立即死亡。#!"
 ABANDON_VESSEL_PERK_EFFECT: "作为[character_interaction|E]，允许你抛弃当前容器。\n#F 恶魔可以心甘情愿地离开不再满足其需求的容器的庇护。#!"
 THEFT_OF_FAITH_PERK_EFFECT: "能够对其他非魔者使用$EXECUTION_DEVOUR_SOUL$[execution|E]选项。\n#F 使用这个奥秘可以让恶魔对目标进行蹂躏，就像她是它的魔奴一样。#!"
 TRANSFER_VESSEL_PERK_EFFECT: "你不再需要先放弃你当前的容器才能去附身另一个。\n你将自动在当前宿体死亡时附身教徒，不再有事件弹窗提醒你是否切换容器，因为你已经能够自己用[interaction|E]决定。\n#F 通过接触一个潜在的新容器，恶魔可以直接尝试用附身来转移它的存在，而不会给自己带来任何风险。#!"
 USURPATION_OF_FLESH_PERK_EFFECT: "对所有[thrall|E]获得强牵制。\n#F 恶魔可以使用该奥秘来控制魔奴的身体，像木偶一样控制该仆从。#!"
 VISAGE_OF_GLORY_PERK_EFFECT: "#F 通过引导他们失去的担任耶洛因的记忆，在短时间内，恶魔可成为真正的天使。#!"
 BEHOLD_THE_METATRON_PERK_EFFECT: "#F 成为造物的真正建筑师，恶魔揭开了他们最真实的形态，他们最原始的形态，要么是崇高的完美，要么是可怖的邪恶。#!"
 PATTERN_SENSE_PERK_EFFECT: "#F 恶魔曾经对自然秩序的在时间之初就建立的规律有一种本能的敏感性。有了这奥秘，恶魔重新学会了这一点，以及如何利用它。#!"
 FORTUNATE_GUESS_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n#F 该角色对机遇和命运的流动获得了一种不可思议的直觉。#!"
 FORETELL_PERK_EFFECT: "解锁[deceitful_progress_hostile_schemes_decision|E]。\n#F 该角色可以看出未来可能发生的事件。#!"
 ALTER_FATE_PERK_EFFECT: "解锁[impatient_rushing_all_schemes_decision|E]。\n#F 恶魔可通过说出一个人的名字，宣布强加给他的未来的变化，从而拉伸甚至撕裂他的命运。#!"
 BEYOND_NOW_PERK_EFFECT: "#F 有了这能力，恶魔可以走出时间本身，让宇宙的织锦暂时听从他们的命令。#!"
 CERTAINTIES_OF_CHANCE_PERK_EFFECT: "#F 仅仅观察机遇和命运的流动，恶魔就可将其扭曲用于他们的目的。#!"
 PORTAL_MASTERY_PERK_EFFECT: "#F 就像有形之物曾经听从他们的召唤一样，恶魔可以按照他们的意愿通过或阻止障碍。#!"
 ARCANA_PREMONITION_PERK_EFFECT: "#F 就像蜘蛛在网中一样，当危险临近时，角色能感觉到命运之线的振动，使他们为所有的结果做好准备。#!"
 SHARPENED_SENSES_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 该角色调整了他的超自然察觉，以解开世界上隐藏的细节和秘密。#!"
 SHORTENED_PATH_PERK_EFFECT: "#F 在了解尘世的原初过道后，恶魔可以将传送时间减少到曾经的零头。#!"
 STEP_BETWEEN_PERK_EFFECT: "#F 有了这能力，恶魔可以轻轻地扭曲空间，在模糊的光线或摇摆的阴影中消失和重新出现。#!"
 TOUCH_FROM_AFAR_PERK_EFFECT: "#F 随着恶魔对空间现实的理解不断加深，他们的奥秘范围也在不断扩大。#!"
 TWIST_OF_FATE_PERK_EFFECT: "作为[decision|E]，允许花费奥秘技能点来获得金钱和威望。\n#F 命运似乎偏爱恶魔，因为他们获得了不寻常的随机凡俗恩惠。#!"
 CELESTIAL_RADIANCE_PERK_EFFECT: "允许变身为[GetModifier( 'POD_shapeshift_form_light_modifier' ).GetNameWithTooltip|L]。\n#F 该角色可以通过释放她灵魂的燃烧力量来发射和控制光。#!"
 SHADOW_MASTERY_PERK_EFFECT: "允许变身为[GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L]。\n#F 该角色可以通过施加给他那受诅的灵魂的无上黑暗来控制黑暗。#!"
 mind_soul_visible: "心智与灵魂"
 fate_portals_visible: "命运与门"
 force_element_visible: "力与元素"
 NOT_has_demon_trait: "@warning_icon!#X 你#bold 没#!有[trait|E]：[GetTrait('demon').GetName( GetPlayer )]#!"
 ARCANA_INCORPOREAL_FORM_PERK_EFFECT: "允许变身为[GetModifier( 'POD_shapeshift_form_incorporeal_modifier' ).GetNameWithTooltip|L]。\n#F 该角色将他的身体从坚实的血肉和骨骼转变为无形形态或液体形态。#!"
 ARCANA_RESILIENCE_PERK_EFFECT: "#F 在掌握了他们可以抵抗的伤害之后，拥有这奥秘的恶魔就更难受伤了，他们的身体对伤害有超自然的抵抗力。#!"
 arcana_revelation_perk_name: "显圣"
 ARCANA_REVELATION_PERK_EFFECT: "作为[character_interaction|E]，允许你通过暴露自己来获得决意。\n#F 在没有更可靠的选择时，堕天者可以通过直接放大凡人对神性或诅咒的信仰来收获决意。#!"
 arcana_regeneration_perk_name: "再生"
 arcana_longevity_perk_name: "长寿"
 arcana_invisibility_perk_name: "隐形"
 ARCANA_REGENERATION_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗自己的伤口。\n#F 随着对其内在力量的理解，恶魔可能会修补其外形上的伤口，以保持其当前容器的巅峰状态。#!"
 ARCANA_LONGEVITY_PERK_EFFECT: "若是[thrall|E]，作为[decision|E]，允许花费奥秘技能点来叠加[GetModifier( 'longevity_modifier' ).GetNameWithTooltip|L]。\n#F 有了这奥秘，恶魔可以为他们的魔奴挡住岁月之重以换取对他们的奴役。#!"
 ARCANA_INVISIBILITY_PERK_EFFECT: "允许变身为[GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L]。\n#F 该角色变得模糊，从视野中消失，不再被世上的目光所笼罩。#!"
 scry_perk_name: "侦测"
 SCRY_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 角色集中注意力，说出她所熟悉的地点、物体或存在，显示出目标和其周围。#!"
 open_gate_perk_name: "开门"
 OPEN_GATE_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地，或传送你到旅行的下一个目的地。\n#F 恶魔将空间弯曲或撕裂成一个短暂地传送门，将其位置与另一个地方相连。#!"
