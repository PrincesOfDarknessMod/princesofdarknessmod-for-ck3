 arcana_premonition_perk_name: "未来预视"
 ARCANA_SIN_EATING_PERK_EFFECT: "降低[GetPerk('arcana_revelation_perk').GetName(GetPlayer)]的消耗\n#flavor 角色可以通过放纵自己的恶行或目睹一个凡人放纵其所喜爱的罪来恢复决意。#!"
 ARCANA_PREMONITION_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor 就像蜘蛛在网中一样，当危险临近时，角色能感觉到命运之线的振动，使他们为所有的结果做好准备。#!"
 ARCANA_INCORPOREAL_FORM_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip]\n在[sieges|E]或[raids|E]期间无法被囚禁\n#flavor 该角色将他的身体从坚实的血肉和骨骼转变为无形形态或液体形态。#!"
 ARCANA_RESILIENCE_PERK_EFFECT: "#flavor 在掌握了他们可以抵抗的伤害之后，拥有这奥秘的恶魔就更难受伤了，他们的身体对伤害有超自然的抵抗力。#!"
 arcana_revelation_perk_name: "显圣"
 ARCANA_REVELATION_PERK_EFFECT: "作为[character_interaction|E]，向凡人显露真身，消耗[piety|E]或[prestige|E]换取[CHARACTER.Custom('PODEnergySplat')]\n#flavor 在没有更可靠的选择时，堕天者可以通过直接放大凡人对神性或诅咒的信仰来收获决意。#!"
 arcana_regeneration_perk_name: "再生"
 ARCANA_REGENERATION_PERK_EFFECT: "#flavor 随着对其内在力量的理解，恶魔可能会修补其外形上的伤口，以保持其当前容器的巅峰状态。#!"
 arcana_visible: "信仰之力"
 arcana_focus: "奥秘重心"
 arcana_focus_modifier: "[GetFocus('arcana_focus').GetName]"
 arcana_focus_desc: "#X [arcana_lifestyle|E] [lifestyle|E] [experience|E] 仅能#bold 通过#!教徒年度供奉获得#!"
 arcana_focus_effect_desc: "无法专注此生活方式"
 POD_arcana_perk_check_effect_limited: "#X 该特质仅限$POD_splat_demon_plural$!#!"
 POD_ARCANA_PERK_CHECK_EFFECT_PERK: "#X 奥秘特质点数不足#!#weak ($VALUE|0$)#!"
 POD_ARCANA_PERK_CHECK_EFFECT_PERK_FULL: "#clickable 此特质需消耗$VALUE|V0$点奥秘特质[Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), '点数', '点数' )]"
 arcana_apocalyptic_form_perk_name: "天启形态"
 arcana_devour_soul_perk_name: "吞魂"
 arcana_divine_potential_perk_name: "神圣潜能"
 arcana_enthrall_perk_name: "魅诱"
 arcana_hardened_flesh_perk_name: "硬化血肉"
 arcana_inviolate_soul_perk_name: "不灭之魂"
 arcana_invocation_of_name_perk_name: "真名召唤"
 arcana_pattern_sense_perk_name: "命理感知"
 arcana_ravage_perk_name: "狂暴撕扯"
 ARCANA_APOCALYPTIC_FORM_PERK_EFFECT: "作为[character_interaction|E]，允许变身为[GetModifier('POD_shapeshift_form_apocalyptic_angelic_modifier').GetNameWithTooltip]或[GetModifier('POD_shapeshift_form_apocalyptic_damned_modifier').GetNameWithTooltip]\n#flavor 所有恶魔作为神性残余，都拥有可切换的战斗形态——可怖的天启形态。根据受诅程度，可能呈现未堕落时的圣洁天使相，或彻底展现内心煎熬的狰狞恶魔相。此形态皆是恶魔的战争底牌。#!"
 ARCANA_DEVOUR_SOUL_PERK_EFFECT: "作为处决选项，吞噬同族$POD_splat_demon$的灵魂以获取#V 10#!点[arcana_lifestyle|E]特质点\n#flavor 地狱之外，恶魔可撕碎同类灵魂汲取力量#!"
 ARCANA_DIVINE_POTENTIAL_PERK_EFFECT: "作为[character_interaction|E]，消耗10点[arcana_lifestyle|E]换取#V 1#!#italic 永久#![skill|E]点数\n#flavor 凭借对奥义与凡人躯体的理解，恶魔能突破凡俗极限#!"
 ARCANA_ENTHRALL_PERK_EFFECT: "作为[character_interaction|E]，将目标转化为你的奴仆。他们获得[investiture_lifestyle|E]，你可通过[arcana_lifestyle|E]点数对其提要求。\n#flavor 恶魔只需触碰，凡人信徒即可获得“恩赐”。#!"
 ARCANA_HARDENED_FLESH_PERK_EFFECT: "#flavor 此阶段恶魔的宿主躯体将获得极致韧性，能抵御致命伤害并永保青春，直至恶魔主动舍弃#!"
 ARCANA_INVIOLATE_SOUL_PERK_EFFECT: "免疫精神控制\n#flavor 作为附体生物，无人能夺取恶魔躯体的控制权#!"
 ARCANA_INVOCATION_OF_NAME_PERK_EFFECT: "解锁让你能了解$POD_splat_demon$[Glossary('真名','podgloss.truename')]的[journey|E]。\n#flavor 每当恶魔真名被诵念时，使其有可能找到那个胆敢诵念之人。#!"
 ARCANA_PATTERN_SENSE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor 恶魔曾本能感知宇宙秩序规律（因其参与创世），现通过此奥秘重获并利用该能力#!"
 ARCANA_RAVAGE_PERK_EFFECT: "作为[character_interaction|E]，杀死奴仆恢复[CHARACTER.Custom('PODEnergySplat')]\n#flavor 危急时恶魔可吞噬奴仆灵魂获取力量#!"
 arcana_sharpen_senses_perk_name: "感官锐化"
 arcana_perfect_lie_perk_name: "完美谎言"
 arcana_twist_of_fate_perk_name: "命运扭曲"
 arcana_read_the_heart_perk_name: "读心术"
 ARCANA_SHARPEN_SENSES_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor 作为曾参与创世的耶和华之手，恶魔仍能按意愿引导宇宙#!"
 ARCANA_PERFECT_LIE_PERK_EFFECT: "#flavor 无论多荒谬，掌握此能力的恶魔说谎如呼吸般自然#!"
 ARCANA_TWIST_OF_FATE_PERK_EFFECT: "作为[character_interaction|E]，可用$arcana_lifestyle$的[perk|E]兑换[gold|E]、[prestige|E]或[piety|E]。\n#flavor 命运似乎偏爱恶魔，让他们随机获得非凡的凡人恩赐。#!"
 ARCANA_READ_THE_HEART_PERK_EFFECT: "解锁[journey|E]引诱目标堕落，使其获得与你信仰对应的原罪特质，若已拥有则改信\n#flavor 恶魔能挖掘任何生灵内心最深处的罪孽#!"
 arcana_gift_of_faith_perk_name: "信仰恩赐"
 arcana_increased_health_perk_name: "生命强化"
 arcana_contagion_mastery_perk_name: "疫病掌控"
 arcana_spirit_sight_perk_name: "灵视"
 arcana_read_the_sin_perk_name: "罪孽窥视"
 arcana_shield_of_spite_perk_name: "怨念护盾"
 ARCANA_GIFT_OF_FAITH_PERK_EFFECT: "使#V $POD_set_cultist_interaction$#![interaction|E]花费降低#P -25%#!\n强化[GetPerk('arcana_revelation_perk').GetName(GetPlayer)]获取的[CHARACTER.Custom('PODEnergySplat')]\n#flavor 当恶魔充盈神性能量时，可将力量赐予奴仆，缓解其灵魂压力。#!"
 ARCANA_SHIELD_OF_SPITE_PERK_EFFECT: "#flavor 恶魔心智充斥绝望与邪恶，试图窥探者将遭受剧痛反噬#!"
 ARCANA_CONTAGION_MASTERY_PERK_EFFECT: "为[character_interaction|E]，用指定疾病感染目标\n#flavor 恶魔能操纵最微小的生命形态传播疫病#!"
 ARCANA_SPIRIT_SIGHT_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n#flavor 作为灵体生物，恶魔可监视不眠死者#!"
 ARCANA_READ_THE_SIN_PERK_EFFECT: "提升[GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)]的[planning_speed|E]与成功率\n#flavor 恶魔能洞悉凡人内心主导罪孽#!"
 ARCANA_INCREASED_HEALTH_PERK_EFFECT: "[GetPerk('arcana_regeneration_perk').GetName(GetPlayer)]触发频率提升至#V 每年两次#!\n#flavor 恶魔突破凡俗躯体的再生极限#!"
 arcana_incorporeal_form_perk_name: "虚体形态"
 arcana_compel_sin_perk_name: "令罪"
 arcana_ultimate_horror_perk_name: "终极恐惧"
 arcana_resilience_perk_name: "皮糙肉厚"
 arcana_spirit_strike_perk_name: "灵击"
 arcana_healing_touch_perk_name: "愈合之触"
 arcana_preternatural_reflexes_perk_name: "超凡反射"
 arcana_scry_perk_name: "侦测"
 arcana_relentless_soul_perk_name: "不屈之魂"
 ARCANA_ULTIMATE_HORROR_PERK_EFFECT: "作为攻守方发动[war|E]时，为所有敌方统治者施加[GetModifier('POD_ultimate_horror_modifier').GetNameWithTooltip]\n#flavor 恶魔的灾厄形态会散播疯狂#!"
 ARCANA_SPIRIT_STRIKE_PERK_EFFECT: "#flavor 恶魔能显化灵体形态攻击#!"
 ARCANA_HEALING_TOUCH_PERK_EFFECT: "作为[character_interaction|E]，治疗目标\n#flavor 恶魔借助凡世信仰之力治愈创伤#!"
 ARCANA_COMPEL_SIN_PERK_EFFECT: "提升[GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)]的[planning_speed|E]与成功率\n#flavor 恶魔能洞悉凡人内心主导罪孽#!"
 ARCANA_PRETERNATURAL_REFLEXES_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor 此阶段恶魔获得超凡环境感知力，时刻备战#!"
 ARCANA_SCRY_PERK_EFFECT: "启用[GetScheme('abduct').GetTypeName][scheme|E]\n#flavor 恶魔可通过真名推演目标信息#!"
 ARCANA_RELENTLESS_SOUL_PERK_EFFECT: "#flavor 致命伤仅会击晕恶魔宿主#!"
 arcana_arsenal_of_the_beast_perk_name: "凶兽武库"
 arcana_inhuman_strength_perk_name: "非人之力"
 arcana_damage_immunity_perk_name: "伤害免疫"
