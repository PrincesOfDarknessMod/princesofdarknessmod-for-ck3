 SHARPENED_SENSES_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 该角色调整了他的超自然察觉，以解开世界上隐藏的细节和秘密。#!"
 SHORTENED_PATH_PERK_EFFECT:0 "#F With an understanding of the old pathways of creation, a demon may cut the time of traversal down to fractions of what it once was.#!"
 STEP_BETWEEN_PERK_EFFECT:0 "#F With this power, a demon may gently warp space, vanishing and reappearing in a blur of light or wavering shadow.#!"
