l_simp_chinese:
 malleable_visage_perk_name: "易容术"
 MALLEABLE_VISAGE_PERK_EFFECT: "[character_interaction|E]：[fleshcrafting|E]\n\n#flavor 使用者者可对自身躯体进行简易的外观改造，拔高身形、壮硕体格皆可实现；重塑喉头便能改换声线；调整肤色、瞳色更是信手拈来。#!"
 transmogrify_the_mortal_clay_perk_name: "变幻血肉"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT: "可在[fleshcrafting|E]过程中改造@flesh_icon!血肉\n\n#flavor 吸血鬼已能对血肉施以翻天覆地的改造。这份权能不再局限于自身，任何被他制服、且能撑到改造完成的猎物，皆要臣服于他的造物构想。#!"
 rend_the_osseous_frame_perk_name: "重塑骨骼"
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT: "可在[fleshcrafting|E]过程中改造@bone_icon!骨骼\n能够招募[GetMaA('szlachta').GetName]作为[men_at_arms|E]\n\n#flavor 臻至此境的吸血鬼已然精进到能够掌控骨骼。若与变幻血肉配合施展，足以将一切梦魇照进现实。#!"
 awaken_the_zulo_shape_perk_name: "觉醒祖罗战争形态"
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT: "解锁[GetModifier('POD_shapeshift_form_zulo_modifier').GetNameWithTooltip]变形选项。\n\n#flavor 提及特兰西瓦尼亚的原始密林，世人总会联想到群魔盘踞的景象。而这恐惧的源头正是祖罗形态，覆着油滑兽毛与嶙峋鳞片的躯骸上，棘刺成排生长，堪称行走的梦魇。#!"
 the_body_impolitic_perk_name: "本体之仆"
 THE_BODY_IMPOLITIC_PERK_EFFECT: "#flavor 使用者能将部分意识注入自身血肉，再将其割裂离体，化为供自己驱策的忠犬。#!"
 bloodform_perk_name: "鲜血之形"
 BLOODFORM_PERK_EFFECT: "解锁[GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip]变形选项\n\n#flavor 掌握这种力量的吸血鬼，可将肉身彻底转化为有知觉的绯血。这种血液与吸血鬼的普通绯血完全相同，既能用以制造血仆，亦能建立血缚。#!"
 inner_mastery_perk_name: "掌控内腑"
 INNER_MASTERY_PERK_EFFECT: "#flavor 借由这份力量，吸血鬼可自如操控体内的脏腑与体液。脏腑重塑不过弹指之间，任何侵入体内的毒素皆会被尽数排出。#!"
 vicissitudeadvanced_perk_name: "高阶易变术"
 body_arsenal_perk_name: "肉身军械库"
 BODY_ARSENAL_PERK_EFFECT: "$unlock_forging_node$随机添加[GetModifier('body_arsenal_prowess_modifier').GetNameWithTooltip]或[GetModifier('body_arsenal_ghoul_modifier').GetNameWithTooltip]\n\n#flavor 吸血鬼能以自身血肉为材料铸造各式武器。这绝非催生利爪那般粗浅，剑、棍及其他绝大多数近战兵刃，皆能自血肉中化生。#!"
 graft_life_to_life_perk_name: "嫁接生命"
 GRAFT_LIFE_TO_LIFE_PERK_EFFECT: "能够招募[GetMaA('vozhd').GetName]作为[men_at_arms|E]\n\n#flavor 血肉塑造大师能从活物摘取肢体嫁接到其他目标之上，无论目标是生是死，皆可驱使这新生肢体。这份力量足以造就出骇人心魄的恐怖造物。#!"
 sublimation_of_the_larval_flesh_perk_name: "稚血升华"
 SUBLIMATION_OF_THE_LARVAL_FLESH_PERK_EFFECT: "#flavor 吸血鬼会将猎物困于其自身血肉织成的茧中，再以意念为猎物勾勒全新形态。待猎物破茧而出的刹那，将会化身为吸血鬼构想的模样。#!"
 the_last_dracul_perk_name: "终末之龙"
 THE_LAST_DRACUL_PERK_EFFECT: "解锁[GetModifier('POD_shapeshift_form_dracul_modifier').GetNameWithTooltip]变形选项。\n\n#flavor 这是棘秘魑氏族最为可怖的怪物形态，这份力量允许其化身为那尊赋予他们古老名号的巨龙之姿。#!"
 living_testudo_perk_name: "活盾"
 LIVING_TESTUDO_PERK_EFFECT: "战斗开始时，若担任[commander|E]，强制敌方[knight|E]中[prowess|E]最高者退出战斗，并对其造成#V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0][POD_aggravated_damage|E]#!。\n\n#flavor 吸血鬼擒住一名猎物，以塑肉锻骨的邪恶力量生生剥开其脊背，令脊椎尽数裸露在外。随后将这具躯体化作一面血肉盾牌——既能抵御敌方攻势，更可进一步扭曲塑形，化为令人胆寒的凶器。#!"
 liquefy_the_mortal_coil_perk_name: "液化凡体螺管"
 LIQUEFY_THE_MORTAL_COIL_PERK_EFFECT: "[character_interaction|E]：可从目标身上撕裂一处肢体，该创伤十年内无法愈合。\n\n#flavor 猎物将在这可怕的力量下被自己的躯体背叛，棘秘魑会将对手的血肉骨骼尽数化作一滩腥臭血水。#!"
 perfect_essence_perk_name: "完美精髓"
 PERFECT_ESSENCE_PERK_EFFECT: "对自身施展[fleshcrafting|E]必定成功\n增加从凡人处获取的[hunger_with_icon|E]\n$POD_blood_surge_interaction$#!额外使得一项[skill|E]#P +1#! \n\n#flavor 掌握此道的棘秘魑对自身躯体的掌控近乎完美。心念一动，便能随心所欲地将自身形态改造得尽善尽美。#!"
 sculpture_of_the_mind_perk_name: "心念塑身"
 SCULPTURE_OF_THE_MIND_PERK_EFFECT: "可对任何无强力精神防护的目标施展[fleshcraft|E]\n\n#flavor 抵达此境界的吸血鬼已能隔空操弄血肉。对于真正的大师而言亲手触碰不过是凡庸匠人的伎俩，棘秘魑的至高造物之艺从来只源于心念而非双手。#!"
