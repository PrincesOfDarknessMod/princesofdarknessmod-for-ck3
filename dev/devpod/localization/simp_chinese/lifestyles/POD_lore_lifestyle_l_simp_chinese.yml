 CREATE_OBJECT_PERK_EFFECT: "解锁合成宝物铸造选项，允许将数个宝物碎片合成为一个宝物。\n解锁合成碎片锻造选项，允许将数个宝物碎片合成为更强碎片。\n#V 5%#!概率在制造时退回金钱花费。\n#F 堕天者可以自由塑捏任何材料，让它变得跟粘土或油灰一样，或者让它变得跟自然生长的水晶一样。#!"
 ENCHANT_OBJECT_PERK_EFFECT: "作为铸造选项，允许你制造宝物（且束缚囚犯的灵魂到里面）。\n#F 堕天者将多种秘义作用结合在一起，创造出一种独特的魔法物品——遗器。只要阿努纳奇知道所需的秘义，只要材料足以容纳这些能量，就没有什么是无法实现的。在附魔过程中使用[GetPerk('anchor_the_soul_perk').GetName(GetPlayer)]，甚至可以通过融入凡人或恶魔的灵魂赋予物品意识。#!"
 IMBUE_OBJECT_PERK_EFFECT: "作为强化选项，允许你束缚囚犯的灵魂到已有宝物。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_mummu_modifier' ).GetNameWithTooltip|L]\n#F 堕天者将一个无实体的灵魂困在一个物体中。这能力始终是永久性的，它对凡人的灵魂和堕天者的灵魂都有效，但只有堕天者才能在新的宿所里充分发挥自己的能力，实际上就是瞬间变成了地缚魔。凡人的灵魂则在黑暗中飘荡，即使是死灵也无法再使用他们的能力。#!"
 light_perk_name: "光"
