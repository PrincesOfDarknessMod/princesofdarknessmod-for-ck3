 LORE_TELEPORT_PERK_EFFECT: "作为[character_interaction|E]，可将军队传送至目标位置，或在旅行时直接抵达目的地。\n#flavor 堕天者能沿命运丝线穿行。#!"
 LORE_CAUSAL_INFLUENCE_PERK_EFFECT: "#flavor 堕天者能直接操控命运丝线。#!"
 LORE_COHERENT_LIGHT_PERK_EFFECT: "#flavor 堕天者能创造真实幻象#!"
 lore_manipulate_weather_perk_name: "操控天象"
 lore_alter_appearance_perk_name: "外貌重塑"
 lore_command_the_storm_perk_name: "指挥风暴"
 LORE_MANIPULATE_WEATHER_PERK_EFFECT: "作为[character_interaction|E]，为当前[county|E]施加[GetModifier('lore_manipulate_weather_good_modifier').GetNameWithTooltip]或[GetModifier('lore_manipulate_weather_bad_modifier').GetNameWithTooltip]。\n#flavor 堕天者通过驾驭天象唤起凡人敬畏。#!"
 LORE_ALTER_APPEARANCE_PERK_EFFECT: "作为[character_interaction|E]，使目标变得更美或更丑。\n#flavor 堕天者能赐予或剥夺生灵的美貌。#!"
 LORE_COMMAND_THE_STORM_PERK_EFFECT: "强化[GetPerk('lore_manipulate_weather_perk').GetName(GetPlayer)]，效果范围扩大至整个[duchy|E]。\n#flavor 堕天者通过操纵巨型风暴展现神威。#!"
 lore_command_animals_perk_name: "御兽之术"
 lore_manipulate_flesh_perk_name: "血肉操控"
 lore_command_the_wild_perk_name: "野性统御"
 lore_mutate_plant_perk_name: "植物突变"
 lore_create_chimera_perk_name: "创造奇魅"
 LORE_COMMAND_ANIMALS_PERK_EFFECT: "允许招募各类动物部队[men_at_arms|E]。\n#flavor  堕天者能支配大地上的生灵。#!"
 LORE_MANIPULATE_FLESH_PERK_EFFECT: "#flavor 堕天者能任意改造活体血肉。#!"
 LORE_COMMAND_THE_WILD_PERK_EFFECT: "作为[character_interaction|E]，为当前[county|E]施加[GetModifier('lore_command_the_wild_good_modifier').GetNameWithTooltip]或[GetModifier('lore_command_the_wild_bad_modifier').GetNameWithTooltip]。\n#flavor 堕天者能操控植物的生命精华。#!"
 LORE_MUTATE_PLANT_PERK_EFFECT: "强化[GetPerk('lore_command_the_wild_perk').GetName(GetPlayer)]，效果范围扩大至整个[duchy|E]。\n#flavor 堕天者能使植物异变成全新形态。#!"
 LORE_CREATE_CHIMERA_PERK_EFFECT: "#flavor 堕天者能自由创造和改造动物物种。#!"
 lore_step_beyond_the_veil_perk_name: "帷幕穿行"
 lore_extinguish_life_perk_name: "熄灭众生"
 lore_anchor_the_soul_perk_name: "灵魂锚定"
 lore_pierce_the_barrier_perk_name: "屏障贯穿"
