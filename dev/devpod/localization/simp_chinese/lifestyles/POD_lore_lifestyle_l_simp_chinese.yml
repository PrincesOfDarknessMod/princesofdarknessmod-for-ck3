 restore_the_dead_perk_name:0 "Restore the Dead"
 SPEAK_WITH_THE_DEAD_PERK_EFFECT:0 "#F The Fallen may speak with a wraith, and the wraith must answer the Fallen's questions truthfully.#!"
 LORE_SUMMON_THE_DEAD_PERK_EFFECT:0 "#F The Fallen may summon wraiths to his side. Wraiths thus summoned may not leave on their own accord.#!"
 LORE_COMMAND_THE_DEAD_PERK_EFFECT:0 "#F The Fallen can command a wraith to perform any action.#!"
 ANCHOR_THE_SOUL_PERK_EFFECT:0 "#F The Fallen binds a soul into an object. This can be permanent or temporary, and may either serve as a prison or create an animate puppet that allows the soul to either serve its demonic master, or tend to unfinished business in the material world. This effect works on both mortal souls and incorporeal demonic souls, but demonic souls cannot realise their full potential while anchored in this fashion.#!"
 RESTORE_THE_DEAD_PERK_EFFECT:0 "#F The Fallen transplants a wraith into a recently dead body, granting the deceased a second chance at life. This effect places a tremendous drain on the Fallen if it is supposed to last longer than a few days.#!"
