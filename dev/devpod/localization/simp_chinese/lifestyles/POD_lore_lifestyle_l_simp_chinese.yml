 unspeakable_servitor_perk_name:0 "不言从者"
 CREATE_PROXY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你根据宣称的宝物稀有度给予对方受伤特质。\n#F 地缚魔将一个物体变成一个节点，然后他们可以通过这个节点进行感知和使用能力。#!"
 LASH_OF_CORRUPTION_PERK_EFFECT:0 "作为[knight|E]时，增加作战中杀死敌方[knights|E]的几率\n#F 地缚魔将他们的能量灌输给一个生物，伤害并可能杀死它。#!"
 TAINT_THE_LAND_PERK_EFFECT:0 "作为指挥官时，在军队踏入时给予交战伯爵领[GetModifier('earthbound_negative_modifier').GetNameWithTooltip]。\n#F 地缚魔将自己的精髓灌输到一个地区，使其活过来并攻击入侵者。#!"
 CORRUPT_RELIC_PERK_EFFECT:0 "作为[character_interaction|E]，允许你制造宝物。\n#F 此唤术允许地缚魔制造个人魔法宝物。#!"
 UNSPEAKABLE_SERVITOR_PERK_EFFECT:0 "作为[character_interaction|E]，允许制造[GetTrait('automaton').GetName( GetPlayer )]复制体作为永久宿体。\n#F 地缚魔让其的爪牙创造一个雕像，让可以用这个雕像作为临时的宿体。#!"
 nightmare_sending_perk_name:0 "派遣梦魇"
 mind_rape_perk_name:0 "心灵强暴"
 visions_of_terror_perk_name:0 "恐怖幻象"
 enslave_perk_name:0 "奴役"
 devour_the_soul_perk_name:0 "吞噬灵魂"
 NIGHTMARE_SENDING_PERK_EFFECT:0 "#F 此唤术允许地缚魔向沉睡中的凡人的梦境发送信息。#!"
 MIND_RAPE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F 此唤术允许地缚魔探查他们视线内的凡人的思想，扫描他们的思想和记忆以获取信息。#!"
 VISIONS_OF_TERROR_PERK_EFFECT:0 "#F 此唤术将可怕的幻象投射到一个或多个凡人的脑海中。#!"
 ENSLAVE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你获得对目标的牵制。\n#F 有了这唤术，地缚魔可以完全控制一个凡人的身心，控制行动和言语。#!"
 DEVOUR_THE_SOUL_PERK_EFFECT:0 "增强$EXECUTION_DEVOUR_SOUL$[execution|E]选项，允许你吞噬对方的心智来增强教育和属性。\n#F 通过这唤术，地缚魔可以从一个活生生的凡人身上撕下灵魂并吞噬它，汲取其的能量、记忆甚至是珍贵的信仰。#!"
 lore_common_focus:0 "通用秘义重心"
