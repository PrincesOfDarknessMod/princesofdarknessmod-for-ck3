 MIND_RAPE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F 此唤术允许地缚魔探查他们视线内的凡人的思想，扫描他们的思想和记忆以获取信息。#!"
 VISIONS_OF_TERROR_PERK_EFFECT:0 "#F 此唤术将可怕的幻象投射到一个或多个凡人的脑海中。#!"
 ENSLAVE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你获得对目标的牵制。\n#F 有了这唤术，地缚魔可以完全控制一个凡人的身心，控制行动和言语。#!"
 DEVOUR_THE_SOUL_PERK_EFFECT:0 "增强$EXECUTION_DEVOUR_SOUL$[execution|E]选项，允许你吞噬对方的心智来增强教育和属性。\n#F 通过这唤术，地缚魔可以从一个活生生的凡人身上撕下灵魂并吞噬它，汲取其的能量、记忆甚至是珍贵的信仰。#!"
