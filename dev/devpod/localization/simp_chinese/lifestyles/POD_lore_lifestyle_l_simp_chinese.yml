 FUEL_PERK_EFFECT:0 "#F The Namaru may fan existing flames, making them grow.#!"
 LORE_IGNITE_PERK_EFFECT:0 "#F The Namaru creates fire from nothingness, igniting a flammable object.#!"
 COMMAND_THE_FLAME_PERK_EFFECT:0 "#F The Namaru may manipulate the flames themselves. Fire can be moved, doused, or fanned.#!"
 HOLOCAUST_PERK_EFFECT:0 "#F The Namaru burns the inherent Faith that makes an object real, rendering even a steel door to ash in mere seconds or robbing other Fallen of their power while hurting them grievously.#!"
 RIDE_THE_FLAME_PERK_EFFECT:0 "#F The Namaru transforms into flame or becomes part of an existing fire, gaining control over it in the process.#!"
 voice_of_heaven_perk_name:0 "Voice of Heaven"
 exalt_perk_name:0 "Exalt"
 aura_of_legend_perk_name:0 "Aura of Legend"
 the_mark_of_the_celestials_perk_name:0 "The Mark of the Celestials"
 lore_revelation_perk_name:0 "Revelation"
 VOICE_OF_HEAVEN_PERK_EFFECT:0 "#F This evocation empowers and amplifies the Devil's voice, allowing them to speak with such godly authority that it drowns out all ambient noise. Their voice compels all who hear it to listen to what the demon has to say and to be instinctively receptive to their commands.#!"
 EXALT_PERK_EFFECT:0 "#F The power of the Namaru's commanding voice is enough to instill hope in the weakest of hearts, spurring mortals to put aside their fears and steal triumph from the jaws of defeat.#!"
 AURA_OF_LEGEND_PERK_EFFECT:0 "#F This evocation awakens atavistic memories buried deep in the human subconscious, renewing the ancient bonds of fealty that once bound humanity and the Fallen in the face of Heaven's tyranny. The ties run so deep that when they arise, it can sometimes drive all other thoughts from a mortal's mind, leaving only the urge to fulfill the ancient duty once more.#!"
 THE_MARK_OF_THE_CELESTIALS_PERK_EFFECT:0 "#F During the War of Wrath, both angels and demons found ways to signify their friends and enemies, subtly altering their auras to make subjects easier to find or as marks of anger and shame so that anyone who encountered subjects would know their crimes and treat them accordingly.#!"
 LORE_REVELATION_PERK_EFFECT:0 "#F Although mortals and demons alike use artifice to conceal their true natures, this evocation allows a Devil to strip away a mortal's layers of deception and reveal them for who they really are. It's a moment of truth that many do not have the heart to endure.#!"
