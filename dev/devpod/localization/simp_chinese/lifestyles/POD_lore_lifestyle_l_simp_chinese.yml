 LAY_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予友方[commanders|E][GetModifier('lay_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇创造了一条通往目的地的新路径，这条路径可以绕过任何障碍物。#!"
 CONCEAL_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('conceal_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇能隐藏“铺设路径”开辟的路径，不让其他人发现。#!"
 SEAL_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('seal_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇封印一条路径，将任何人困在里面，并可能设置密码，只让知道密码的人打开路径。#!"
 ALTER_PATH_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标国度[GetModifier('alter_path_danger_modifier').GetNameWithTooltip]和其他修正。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_antu_modifier' ).GetNameWithTooltip|L]。\n#F 阿努纳奇改变现有路径的参数，如目的地、重力、大小，甚至路径内的时间流。#!"
