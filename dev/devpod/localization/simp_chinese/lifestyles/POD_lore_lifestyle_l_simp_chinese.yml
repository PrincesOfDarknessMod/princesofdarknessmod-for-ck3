 STEP_BEYOND_THE_VEIL_PERK_EFFECT: "允许在[umbra|E]驻扎\n[umbra_sense|E]：[grace_i]#P +5%#!\n[umbra_aptitude|E]：[grace_i]#P +50%#!\n#F 该唤术可以让屠杀者穿越屏障进入幽影世界——凡界的无生镜像。这样，恶魔就能以意念的速度在幽影界中穿越遥远的距离，并在相应的地点返回物质界域。#!"
 GHOSTWALK_PERK_EFFECT: "如同灵体，无法被监禁、折磨、处决或在[single_combat_duel|E]中通过物理招式伤害。\n[umbra_sense|E]：[grace_i]#P +5%#!\n[umbra_aptitude|E]：[grace_i]#P +50%#!\n#F 哈拉库可以在物质界域和[shadowlands|E]之间移动，在任何一方变得可见但虚体，除非他们愿意让自己变得有实体。#!"
 REACH_ACROSS_THE_BARRIER_PERK_EFFECT: "监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害死灵/恶魔不再有[gold|E]耗费。\n[umbra_sense|E]：[grace_i]#P +5%#!\n[umbra_aptitude|E]：[grace_i]#P +50%#!\n#F 哈拉库可以从物质界域接触[shadowlands|E]，但不真正进入其中；也可以从[shadowlands|E]接触物质界域，但不离开它。#!"
 PIERCE_THE_BARRIER_PERK_EFFECT: "允许在[umbra|E]驻扎恶魔廷臣\n[umbra_sense|E]：[grace_i]#P +5%#!\n[umbra_aptitude|E]：[grace_i]#P +50%#!\n[vassal|E]和[courtier|E]的[umbra_aptitude|E]：[grace_i]#P +25%#!\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_ereshkigal_modifier' ).GetNameWithTooltip|L]。\n#F 该唤术能让哈拉库在生界和死界之间创建一个临时通道，只要传送门的创建者愿意，其他恶魔就能进入[shadowlands|E]。#!"
 CAUSAL_INFLUENCE_PERK_BONUS_VALUE: "[GetPerk('causal_influence_perk').GetName(GetPlayer)]"