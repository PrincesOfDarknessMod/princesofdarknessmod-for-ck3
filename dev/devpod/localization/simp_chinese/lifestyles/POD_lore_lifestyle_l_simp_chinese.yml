 FIST_OF_AIR_PERK_EFFECT: "#F 阿撒乌可以操纵目标体内或周围的气压。#!"
 COMMAND_THE_WIND_PERK_EFFECT: "#F 堕落者可以利用周围的风随意操纵物体。#!"
 WALL_OF_AIR_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('wall_of_air_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿撒乌可以把空气变成坚固的屏障。#!"
 CYCLONE_PERK_EFFECT: "作为[character_interaction|E]，允许你对敌人的领地释放[GetModifier( 'cyclone_modifier' ).GetNameWithTooltip|L]。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_ellil_modifier' ).GetNameWithTooltip|L]。\n#F 阿撒乌能造成巨大的风暴。#!"
 lore_earth_meld_perk_name: "融入大地"
 roil_the_earth_perk_name: "搅动大地"
 mold_earth_perk_name: "塑地"
 earth_storm_perk_name: "地风暴"
 earthquake_perk_name: "地震"
 LORE_EARTH_MELD_PERK_EFFECT: "更少概率在战争中受伤或死亡。\n#F 堕落者部分地与他们站立的大地融为一体，成为不可移动的物体。#!"
 ROIL_THE_EARTH_PERK_EFFECT: "#F 堕落者可以让大地交出任何隐藏在其中的东西，只要他们能说出它的名字。#!"
 MOLD_EARTH_PERK_EFFECT: "#F 堕落者可以仅凭意志力塑造大地。#!"
 EARTH_STORM_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('earth_storm_modifier').GetNameWithTooltip][modifier|E]。\n#F 岩石和泥土的碎片从地面上撕裂下来，绕着堕落者旋转。这些碎片可用作投射物或盔甲。#!"
 EARTHQUAKE_PERK_EFFECT: "作为[character_interaction|E]，允许你对敌人的领地释放[GetModifier( 'POD_county_great_earthquake_modifier' ).GetNameWithTooltip|L]。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_kishar_modifier' ).GetNameWithTooltip|L]。\n#F 堕落者能会引发足以夷平城市的地震。#!"
 find_path_perk_name: "寻得路径"
 lay_path_perk_name: "铺设路径"
 conceal_path_perk_name: "隐藏路径"
 seal_path_perk_name: "封印路径"
 alter_path_perk_name: "更改路径"
 FIND_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予友方[commanders|E][GetModifier('find_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇发现一条通往目的地的可能路径。#!"
 LAY_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予友方[commanders|E][GetModifier('lay_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇创造了一条通往目的地的新路径，这条路径可以绕过任何障碍物。#!"
 CONCEAL_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('conceal_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇能隐藏“铺设路径”开辟的路径，不让其他人发现。#!"
 SEAL_PATH_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('seal_path_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 阿努纳奇封印一条路径，将任何人困在里面，并可能设置密码，只让知道密码的人打开路径。#!"
 ALTER_PATH_PERK_EFFECT: "作为[character_interaction|E]，允许你将任意军队传送到目标的所在地。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_antu_modifier' ).GetNameWithTooltip|L]。\n#F 阿努纳奇改变现有路径的参数，如目的地、重力、大小，甚至路径内的时间流。#!"
 enhance_object_perk_name: "强化物体"
 activate_object_perk_name: "激活物体"
 create_object_perk_name: "创造物体"
 enchant_object_perk_name: "附魔物体"
 imbue_object_perk_name: "浸染物体"
 ENHANCE_OBJECT_PERK_EFFECT: "作为强化选项，允许你升级宝物的修正。\n#F 堕落者可以在一瞬间修复任何物品，或大大提高普通物品的效率。#!"
 ACTIVATE_OBJECT_PERK_EFFECT: "能够招募[GetMaA('golems').GetName]作为[men_at_arms|E]。\n#F 堕落者可以让任何机械物体移动，例如发射枪支、打开锁或让盔甲行走。#!"
 CREATE_OBJECT_PERK_EFFECT: "解锁合成宝物铸造选项，允许将数个宝物碎片合成为一个宝物。\n解锁合成碎片锻造选项，允许将数个宝物碎片合成为更强碎片。\n#V 5%#!概率在制造时退回金钱花费。\n#F 堕落者可以自由塑捏任何材料，让它变得跟粘土或油灰一样，或者让它变得跟自然生长的水晶一样。#!"
 ENCHANT_OBJECT_PERK_EFFECT: "作为铸造选项，允许你制造宝物（且束缚囚犯的灵魂到里面）。\n#F 堕落者将多种秘义作用结合在一起，创造出一种独特的魔法物品——遗器。只要阿努纳奇知道所需的秘义，只要材料足以容纳这些能量，就没有什么是无法实现的。在附魔过程中使用[GetPerk('anchor_the_soul_perk').GetName(GetPlayer)]，甚至可以通过融入凡人或恶魔的灵魂赋予物品意识。#!"
 IMBUE_OBJECT_PERK_EFFECT: "作为强化选项，允许你束缚囚犯的灵魂到已有宝物。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_mummu_modifier' ).GetNameWithTooltip|L]\n#F 堕落者将一个无实体的灵魂困在一个物体中。这能力始终是永久性的，它对凡人的灵魂和堕落者的灵魂都有效，但只有堕落者才能在新的宿所里充分发挥自己的能力，实际上就是瞬间变成了地缚魔。凡人的灵魂则在黑暗中飘荡，即使是死灵也无法再使用他们的能力。#!"
 light_perk_name: "Light"
 bend_light_perk_name: "Bend Light"
 lore_phantasm_perk_name: "Phantasm"
 lore_illusion_perk_name: "Illusion"
 coherent_light_perk_name: "Coherent Light"
 LIGHT_PERK_EFFECT: "Give [GetModifier('light_perk_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when in [combat_phase|E] as a [commander|E] or to foe in [single_combat_duel|E].\n#F The Neberu may create a soft, silvery light, or a brief, bright flash that blinds and stuns onlookers.#!"
 BEND_LIGHT_PERK_EFFECT: "Allow shapeshift to [GetModifier( 'POD_visceratika_skinofchameleon_modifier' ).GetNameWithTooltip|L].\n#F By bending the light around themselves, the Neberu can create camouflage akin to a chameleon.#!"
 LORE_PHANTASM_PERK_EFFECT: "Give [GetModifier('lore_phantasm_perk_knight_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when in [combat_phase|E] as a [commander|E] or to foe in [single_combat_duel|E].\nGive enemy [commanders|E] [GetModifier('lore_phantasm_perk_commander_modifier').GetNameWithTooltip] [modifier|E] when in [combat_phase|E] as a [commander|E].\n#F The Neberu can create faint, transparent images that can last for days.#!"
 LORE_ILLUSION_PERK_EFFECT: "Give [GetModifier('lore_illusion_perk_knight_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when in [combat_phase|E] as a [commander|E] or to foe in [single_combat_duel|E].\nGive enemy [commanders|E] [GetModifier('lore_illusion_perk_commander_modifier').GetNameWithTooltip] [modifier|E] when in [combat_phase|E] as a [commander|E].\nGive enemy side war participant [GetModifier('lore_illusion_perk_ruler_modifier').GetNameWithTooltip] [modifier|E] when in [war|E] as a war participant.\n#F The Neberu may make solid, realistic-looking illusions that last for a short time.#!"
 COHERENT_LIGHT_PERK_EFFECT: "Give [GetModifier('coherent_light_perk_knight_modifier').GetNameWithTooltip] [modifier|E] to enemy [knights|E] when in [combat_phase|E] as a [commander|E] or to foe in [single_combat_duel|E].\nGive enemy [commanders|E] [GetModifier('coherent_light_perk_commander_modifier').GetNameWithTooltip] [modifier|E] when in [combat_phase|E] as a [commander|E].\nGive enemy side war participant [GetModifier('coherent_light_perk_ruler_modifier').GetNameWithTooltip] [modifier|E] when in [war|E] as a war participant.\nAllow shapeshift to [GetModifier( 'POD_shapeshift_form_apocalyptic_shamash_modifier' ).GetNameWithTooltip|L].\n#F The Neberu can give substance to their illusions, allowing them to be touched.#!"
