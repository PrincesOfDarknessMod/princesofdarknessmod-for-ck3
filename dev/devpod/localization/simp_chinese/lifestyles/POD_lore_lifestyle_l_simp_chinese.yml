 LORE_COMMAND_THE_DEAD_PERK_EFFECT: "解锁[bind_wraith_interaction|E]。\n解锁[command_wraith_interaction|E]。\n最大束缚死灵数量：#P +2#!\n#F 堕天者可以命令死灵执行任何行动。#!"
 ANCHOR_THE_SOUL_PERK_EFFECT: "允许招募[GetMaA('golems').GetName]、[GetMaA('guardians').GetName]、和[GetMaA('homunculus').GetName]作为[men_at_arms|E]。\n#F 堕天者将灵魂束缚在一个物体中。这可以是永久性的，也可以是临时性的，既可以作为监狱，也可以创造一个有生命的傀儡，让灵魂为恶魔主人服务，或处理物质世界中未完成的事情。这种效果对凡人灵魂和无实体的恶魔灵魂都有效，但恶魔灵魂在被这种方式固定时无法发挥全部潜能。#!"
 RESTORE_THE_DEAD_PERK_EFFECT: "允许将[GetTrait('wraith').GetName( GetNullCharacter )]变为[GetTrait('mortal').GetName( GetPlayer )]。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_nergal_modifier' ).GetNameWithTooltip|L]。\n#F 堕天者将一位死灵移植到刚刚死去的尸体上，让死者获得重生的机会。#!"
