 COMMAND_THE_FLAME_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手伤害。\n#F 纳玛鲁可以操纵火焰本身。可以移动、浇灭或助火。#!"
 HOLOCAUST_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手伤害。\n#F 纳玛鲁能燃烧使物体保持现实的内有信仰，即使是钢门也能在短短几秒钟内化为灰烬，或者在严重伤害其他堕天者的同时夺走他们的力量。#!"
 RIDE_THE_FLAME_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L]变形选项。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_nusku_modifier' ).GetNameWithTooltip|L]。\n#F 纳玛鲁能化为火焰或成为现有火焰的一部分，并在此过程中获得对火焰的控制权。#!"
 voice_of_heaven_perk_name: "天国之音"
 exalt_perk_name: "擢颂"
