 the_mark_of_the_celestials_perk_name: "天之印记"
 lore_revelation_perk_name: "显圣"
 VOICE_OF_HEAVEN_PERK_EFFECT: "#F 这唤术可以增强和放大恶魔的声音，让他们以神一般的权威说话，淹没周围的一切噪音。他们的声音会迫使所有听到的人倾听恶魔所说的话，并本能地接受他们的命令。#!"
 EXALT_PERK_EFFECT: "#F 纳玛鲁的号令的力量足以让最脆弱的心灵充满希望，激励凡人抛开恐惧，从失败中夺取胜利。#!"
 AURA_OF_LEGEND_PERK_EFFECT: "#F 这唤术唤醒了埋藏在人类潜意识深处的原始记忆，重新唤起了古老的忠诚纽带，这纽带曾经在天堂的暴政面前将人类和堕天者紧密联系在一起。这种纽带如此之深，以至于当它们出现时，有时会将所有其他想法从凡人的脑海中驱除，只留下再次履行古老职责的冲动。#!"
 THE_MARK_OF_THE_CELESTIALS_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标[GetModifier('the_mark_of_the_celestials_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 在天怒之战期间，天使和恶魔都找到了标示朋友和敌人的方法，他们巧妙地改变灵光，使对象更容易被发现，或者作为愤怒和羞耻的标记，让任何遇到对象的人都知道他们的罪行，并相应地对待他们。#!"
 LORE_REVELATION_PERK_EFFECT: "作为[character_interaction|E]，允许你修改目标的性格特质。\n作为[character_interaction|E]，允许你修改目标的性取向。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_qingu_modifier' ).GetNameWithTooltip|L]。\n#F 虽然凡人和恶魔都会使用伪装来掩盖自己的真实本性，但这唤术可以让恶魔剥去凡人的层层伪装，揭示他们的真实面目。这是许多人无法忍受的真相时刻。#!"
 find_the_faithful_perk_name: "寻得信徒"
 cleanse_perk_name: "净化"
