 lore_of_corrupption_visible: "腐化之秘义"
 lore_of_herald_visible: "先驱之秘义"
 lore_of_life_bringer_visible: "生命赋予者之秘义"
 lore_of_creation_visible: "创世之秘义"
 lore_of_seer_visible: "先知之秘义"
 lore_of_beauty_visible: "美之秘义"
 lore_of_living_visible: "生者之秘义"
 lore_of_ethereal_visible: "灵魄之秘义"
 lore_translate_perk_name: "通晓万言"
 lore_manipulate_adhesion_perk_name: "操控粘附"
 lore_manipulate_inertia_perk_name: "操控惯性"
 lore_manipulate_cohesion_perk_name: "操控凝聚力"
 lore_fade_perk_name: "消逝"
 LORE_TRANSLATE_PERK_EFFECT: "#flavor 堕天使能通晓凡人的任何语言，并能将物质形态相互转化（如水变冰）。#!"
 LORE_MANIPULATE_ADHESION_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[character_interaction|E]，强化目标的随机人际关系。\n#flavor 堕天者能操控物体与生灵间的粘附力。#!"
 LORE_MANIPULATE_INERTIA_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[character_interaction|E]，破坏目标的随机人际关系。\n#flavor 堕天者能操控物体与生灵的惯性。#!"
 LORE_MANIPULATE_COHESION_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n作为[character_interaction|E]，改变目标的性格或性取向。\n解锁新处决选项。\n#flavor 堕天者能操控物体与生灵的内聚力。#!"
 LORE_FADE_PERK_EFFECT: "作为[character_interaction|E]，使目标丧失所有[prestige|E]与[piety|E]。\n#flavor 堕天者能让任何事物湮没无闻，无论是人还是物理法则。#!"
 lore_reality_tremors_perk_name: "现实震颤"
 lore_lash_of_corruption_perk_name: "腐蚀鞭笞"
 lore_wave_of_mutilation_perk_name: "肢解之潮"
 lore_summon_outsider_perk_name: "召唤外界之物"
 lore_unspeakable_survivor_perk_name: "不言从者"
 LORE_REALITY_TREMORS_PERK_EFFECT: "作为[war|E]攻守方发起战争时，为敌方所有统治者施加[GetModifier('lore_reality_tremors_modifier').GetNameWithTooltip]\n#flavor 地缚者能撼动现实根基。#!"
 LORE_LASH_OF_CORRUPTION_PERK_EFFECT: "将[GetPerk('lore_reality_tremors_perk').GetName(GetPlayer)]的[modifier|E]升级为[GetModifier('lore_lash_of_corruption_modifier').GetNameWithTooltip]。\n#flavor 地缚者能腐蚀现实直至其分崩离析。#!"
 LORE_WAVE_OF_MUTILATION_PERK_EFFECT: "将[GetPerk('lore_reality_tremors_perk').GetName(GetPlayer)]的[modifier|E]升级为[GetModifier('lore_wave_of_mutilation_modifier').GetNameWithTooltip]。\n#flavor 地缚者能撕裂现实直至其轰然崩塌。#!"
 LORE_SUMMON_OUTSIDER_PERK_EFFECT: "允许招募[GetMaA('the_unnamable').GetName]作为[men_at_arms|E]。\n作为[character_interaction|E]，摧毁当前领地所有建筑。\n#flavor 地缚者能为异界存在打开通道。#!"
 LORE_UNSPEAKABLE_SURVIVOR_PERK_EFFECT: "可将肃灵仪式提升至前所未有的境界\n#flavor 地缚者能将现实控制力凝聚成完美永恒的容器。#!"
 lore_command_the_flame_perk_name: "火焰统御"
 lore_aura_of_legend_perk_name: "传奇光环"
 lore_the_mark_of_the_celesitals_perk_name: "天之印记"
 lore_hand_of_faith_perk_name: "信仰之手"
 LORE_COMMAND_THE_FLAME_PERK_EFFECT: "作为[war|E]攻守方发起战争时，为敌方所有统治者施加[GetModifier('lore_command_the_flame_modifier').GetNameWithTooltip]。\n#flavor 堕天者能驾驭神圣之火。#!"
 LORE_AURA_OF_LEGEND_PERK_EFFECT: "#flavor 堕天者可化身为活体传奇甚至神明。#!"
 LORE_THE_MARK_OF_THE_CELESITALS_PERK_EFFECT: "作为[character_interaction|E]，为目标施加[GetModifier('lore_the_mark_of_the_celesitals_good_modifier').GetNameWithTooltip]或[GetModifier('lore_the_mark_of_the_celesitals_bad_modifier').GetNameWithTooltip]。\n#flavor 堕天者能留下神性印记，赋予目标好运或厄运。#!"
 LORE_HAND_OF_FAITH_PERK_EFFECT: "可将$POD_splat_wraith_plural$，$POD_splat_fae_plural$或$POD_splat_demon_plural$[POD_banish|E]至其原生[umbra|E]领域。\n#flavor 堕天者能强制驱逐非上帝造物。#!"
 lore_cleanse_perk_name: "净化"
 lore_command_the_wind_perk_name: "御风而行"
 lore_many_places_at_once_perk_name: "身化万千"
