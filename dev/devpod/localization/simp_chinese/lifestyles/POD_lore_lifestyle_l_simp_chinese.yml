 FIND_THE_FAITHFUL_PERK_EFFECT:0 "#F The Fallen may locate an individual by their unique Faith if they know their name and are within a few miles of their target. #!"
 CLEANSE_PERK_EFFECT:0 "#F The Asharu purify their target of all toxins and disease.#!"
 HEAL_PERK_EFFECT:0 "#F The Asharu restore a body to full health, and may even heal aggravated damage with a touch.#!"
 ANIMATE_PERK_EFFECT:0 "#F The Asharu temporarily grant life to an inanimate object, and may direct the object's actions as long as they can see it.#!"
 RESTORE_LIFE_PERK_EFFECT:0 "#F The Asharu may restore life to a recently deceased body, and they might even restore a soul to that body.#!"
