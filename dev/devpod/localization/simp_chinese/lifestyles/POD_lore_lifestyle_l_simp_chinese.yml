 INVOKE_THE_STORM_PERK_EFFECT: "作为[character_interaction|E]，允许你对世界地区释放恶意天气效果。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_adad_modifier' ).GetNameWithTooltip|L]。\n#F 亵渎者可以随意用肆虐的风暴环绕自己，在小到一个房间大到一个街区的范围内制造风、水和闪电。风暴的中心在恶魔身上，随着恶魔的移动而移动。但不会对他们造成任何伤害。#!"
