 FADE_PERK_EFFECT: "作为[character_interaction|E]，允许你断绝两个目标间的盟约。\n作为[character_interaction|E]，允许你取消目标的停战协议。\n作为[character_interaction|E]，允许你终结针对目标的计谋。\n#F 这唤术允许恶魔欺骗大量群众的思想，使其变得超自然式模糊或易遗忘。#!"
 CONFESSION_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 堕天者可能会让凡人说出他们内心深处的秘密，而凡人甚至不记得向恶魔吐露心声。#!"
 ALTER_MEMORY_PERK_EFFECT: "作为[character_interaction|E]，允许你移除目标对你头衔或宝物的宣称。\n解锁[buy_artifact_claim_interaction|E]\n[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 堕天者可以以任意想要的方式改变一个凡人的记忆。#!"
