 TRANSLATE_PERK_EFFECT:0 "#F 此唤术在恶魔和人类目标之间建立了一种语言上的联系。#!"
 INSINUATE_PERK_EFFECT:0 "[white_peace|E]接受度：#P +10#!\n[alliance|E]谈判接受度：#P +25#!\n$PERK_CAN_SIGN_ALLIANCE$\n解锁$purchase_truce_interaction$[interaction|E]\n#F 此唤术使恶魔能够巧妙而迅速地打破人类的个人边界。#!"
 FADE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你断绝两个目标间的盟约。\n作为[character_interaction|E]，允许你取消目标的停战协议。\n作为[character_interaction|E]，允许你终结针对目标的计谋。\n#F 这唤术允许恶魔欺骗大量群众的思想，使其变得超自然式模糊或易遗忘。#!"
 CONFESSION_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 堕落者可能会让凡人说出他们内心深处的秘密，而凡人甚至不记得向恶魔吐露心声。#!"
 ALTER_MEMORY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你移除目标对你头衔或宝物的宣称。\n解锁[buy_artifact_claim_interaction|E]\n[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 堕落者可以以任意想要的方式改变一个凡人的记忆。#!"
