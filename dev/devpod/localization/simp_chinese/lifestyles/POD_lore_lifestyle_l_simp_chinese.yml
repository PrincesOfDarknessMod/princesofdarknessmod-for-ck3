 CLEANSE_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗疾病。\n#F 阿撒乌可以净化目标身上的毒素和疾病。#!"
 HEAL_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗伤口。\n#F 阿撒乌能让身体恢复健康，甚至可以通过触摸治愈严重损伤。#!"
