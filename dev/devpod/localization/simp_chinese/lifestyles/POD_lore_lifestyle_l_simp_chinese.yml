 the_fire_of_heaven_perk_name:0 "天堂之火"
 hand_of_faith_perk_name:0 "信仰之手"
 LAMP_OF_FAITH_PERK_EFFECT:0 "#F 此唤术可以让恶魔探测到她附近的凡人或其他恶魔的存在，让他们存有的信仰像灯塔一样闪烁，且只有她能看到。个体会发出淡蓝色的光芒，根据信仰的强度强弱而变化，而非生物则会逐渐变成黑暗的轮廓。#!"
 SEND_VISION_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌方指挥官[GetModifier('send_vision_perk_commander_negative_modifier').GetNameWithTooltip]修正。\n在战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手[GetModifier('send_vision_perk_knight_negative_modifier').GetNameWithTooltip]修正。\n作为指挥官时，在战争中给予友方指挥官[GetModifier('send_vision_perk_commander_positive_modifier').GetNameWithTooltip]修正。\n在战争中（作为指挥官时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('send_vision_perk_knight_positive_modifier').GetNameWithTooltip]修正。\n#F 纳玛鲁曾经是造物主的神圣信使，他们经常被要求将神的信息传递到宇宙的各个角落，将上天的命令化作强烈的幻象，让天人的脑海中充满了威严和惊奇的画面。堕天之后，恶魔们仍然广泛使用这一秘义，向叛军中的下属传达详细的命令，或用可怕的地狱之怒的幻象来打击他们的敌人。#!"
 PILLAR_OF_FAITH_PERK_EFFECT:0 "作为指挥官时，在战争中给予友方指挥官[GetModifier('pillar_of_faith_perk_commander_modifier').GetNameWithTooltip]修正。\n在战争中（作为指挥官时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('pillar_of_faith_perk_knight_modifier').GetNameWithTooltip]修正。\n#F 在宇宙诞生和乐园初期，先驱们一直站在天堂授权的每项重大工作的最前沿，并在必要时提供给其他天人能量。#!"
 THE_FIRE_OF_HEAVEN_PERK_EFFECT:0 "在战争中（作为指挥官时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手伤害。\n#F 此唤术可以让恶魔将她的信仰转化为尖厉的纯白火焰爆炸，用堕落天使的愤怒摧毁她的目标。#!"
 HAND_OF_FAITH_PERK_EFFECT:0 "#F 第一天族的任务是充当造物主的代言人，确保祂的伟大设计在天使自由意志的范围内得以实现。在创世过程中，如果某天人偏离造物主的设计太远，传令官们就能操纵唤术，将结果修改到可接受的范围内。虽然这种授权很少被执行，但这种唤术比其他任何唤术都更能引起其他天族对其特权的妒忌和对传令官的怨恨。#!"