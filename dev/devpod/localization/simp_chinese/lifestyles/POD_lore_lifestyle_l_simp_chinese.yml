 RESTORE_LIFE_PERK_EFFECT: "作为[character_interaction|E]，允许防止朋友、爱人、侧室、家人、内阁或骑士的意外死亡。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_dagan_modifier' ).GetNameWithTooltip|L]。\n#F 阿撒乌可以让刚刚死去的躯体恢复生机，他们甚至可以让灵魂回到躯体。#!"
