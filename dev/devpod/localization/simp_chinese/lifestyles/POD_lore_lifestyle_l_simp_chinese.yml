 MIND_RAPE_PERK_EFFECT: "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F 此唤术允许地缚魔探查他们视线内的凡人的思想，扫描他们的思想和记忆以获取信息。#!"
