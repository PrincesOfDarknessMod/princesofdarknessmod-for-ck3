 DEVOUR_THE_SOUL_PERK_EFFECT: "增强$EXECUTION_DEVOUR_SOUL$[execution|E]选项，允许你吞噬对方的心智来增强教育和属性。\n#F 通过这唤术，地缚魔可以从一个活生生的凡人身上撕下灵魂并吞噬它，汲取其的能量、记忆甚至是珍贵的信仰。#!"
