 ghostwalk_perk_name:0 "Ghostwalk"
 reach_across_the_barrier_perk_name:0 "Reach Across the Barrier"
 pierce_the_barrier_perk_name:0 "Pierce the Barrier"
 SENSE_THE_BARRIER_PERK_EFFECT:0 "#F The Halaku may determine the strength of the barrier between the physical realm and the Shadowlands.#!"
 STEP_BEYOND_THE_VEIL_PERK_EFFECT:0 "#F This evocation allows the Slayer to physically cross the barrier into the shadow world, a lifeless mirror image of the mortal world. Doing so allows the demon to travel vast distances in the shadow realm at the speed of thought and return to the physical world at a corresponding location.#!"
 GHOSTWALK_PERK_EFFECT:0 "#F The Halaku may move between the physical realm and the Shadowlands, becoming visible but intangible on either side unless they will themselves to become substantial.#!"
 REACH_ACROSS_THE_BARRIER_PERK_EFFECT:0 "#F The Halaku may reach into the Shadowlands from the physical realm without actually entering them, or they may reach into the physical realm without leaving the Shadowlands.#!"
 PIERCE_THE_BARRIER_PERK_EFFECT:0 "#F This evocation enables the Halaku to create a temporary doorway between the living and dead realms, allowing other demons to cross into the Shadowlands if the portal's creator wishes.#!"