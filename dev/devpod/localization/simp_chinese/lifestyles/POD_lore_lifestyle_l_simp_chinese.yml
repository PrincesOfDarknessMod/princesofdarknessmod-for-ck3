 INVOKE_THE_STORM_PERK_EFFECT:0 "#F The Defiler can surround themself with a raging storm at will, creating wind, water and lightning in an area as small as a room or as large as a city block. The heart of the storm is centered on the demon, and it moves as they move. It causes them no harm, though.#!"
