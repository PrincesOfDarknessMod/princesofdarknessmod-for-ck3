 FADE_PERK_EFFECT: "作为[character_interaction|E]，允许你断绝两个目标间的盟约。\n作为[character_interaction|E]，允许你取消目标的停战协议。\n作为[character_interaction|E]，允许你终结针对目标的计谋。\n#F 这唤术允许恶魔欺骗大量群众的思想，使其变得超自然式模糊或易遗忘。#!"
