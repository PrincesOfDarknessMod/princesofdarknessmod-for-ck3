 MANIPULATE_INERTIA_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('protection_from_projectile_modifier').GetNameWithTooltip][modifier|E]。\n作为[knight|E]时，增加作战中伤害或严重撕裂敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 堕落者可以把物体扔到很远的地方，或者干脆把攻击停下来。#!"
 MANIPULATE_ACCELERATION_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('momentum_boost_modifier').GetNameWithTooltip][modifier|E]。\n作为[knight|E]时，增加作战中严重撕裂或致残敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 堕落者的能以极快速度移动，并将他们的动量注入毁灭性的近身攻击中。#!"
 MANIPULATE_COHESION_PERK_EFFECT: "解锁$EXECUTION_EVAPORATION$[execution|E]选项。\n作为[knight|E]时，增加[combat_phase|E]中致残或杀死敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 堕落者可以改变物质的密度，使他们能够在水上行走或蒸发石头甚至肉体。#!"
