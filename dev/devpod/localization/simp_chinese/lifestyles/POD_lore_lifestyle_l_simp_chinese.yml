 COMMAND_THE_FLAME_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手伤害。\n#F 纳玛鲁可以操纵火焰本身。可以移动、浇灭或助火。#!"
 HOLOCAUST_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel|E]中给予对手伤害。\n#F 纳玛鲁能燃烧使物体保持现实的内有信仰，即使是钢门也能在短短几秒钟内化为灰烬，或者在严重伤害其他堕落者的同时夺走他们的力量。#!"
 RIDE_THE_FLAME_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L]变形选项。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_nusku_modifier' ).GetNameWithTooltip|L]。\n#F 纳玛鲁能化为火焰或成为现有火焰的一部分，并在此过程中获得对火焰的控制权。#!"
 voice_of_heaven_perk_name: "天国之音"
 exalt_perk_name: "擢颂"
 aura_of_legend_perk_name: "传奇灵光"
 the_mark_of_the_celestials_perk_name: "天之印记"
 lore_revelation_perk_name: "显圣"
 VOICE_OF_HEAVEN_PERK_EFFECT: "#F 这唤术可以增强和放大恶魔的声音，让他们以神一般的权威说话，淹没周围的一切噪音。他们的声音会迫使所有听到的人倾听恶魔所说的话，并本能地接受他们的命令。#!"
 EXALT_PERK_EFFECT: "#F 纳玛鲁的号令的力量足以让最脆弱的心灵充满希望，激励凡人抛开恐惧，从失败中夺取胜利。#!"
 AURA_OF_LEGEND_PERK_EFFECT: "#F 这唤术唤醒了埋藏在人类潜意识深处的原始记忆，重新唤起了古老的忠诚纽带，这纽带曾经在天堂的暴政面前将人类和堕落者紧密联系在一起。这种纽带如此之深，以至于当它们出现时，有时会将所有其他想法从凡人的脑海中驱除，只留下再次履行古老职责的冲动。#!"
 THE_MARK_OF_THE_CELESTIALS_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标[GetModifier('the_mark_of_the_celestials_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 在天怒之战期间，天使和恶魔都找到了标示朋友和敌人的方法，他们巧妙地改变灵光，使对象更容易被发现，或者作为愤怒和羞耻的标记，让任何遇到对象的人都知道他们的罪行，并相应地对待他们。#!"
 LORE_REVELATION_PERK_EFFECT: "作为[character_interaction|E]，允许你修改目标的性格特质。\n作为[character_interaction|E]，允许你修改目标的性取向。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_qingu_modifier' ).GetNameWithTooltip|L]。\n#F 虽然凡人和恶魔都会使用伪装来掩盖自己的真实本性，但这唤术可以让恶魔剥去凡人的层层伪装，揭示他们的真实面目。这是许多人无法忍受的真相时刻。#!"
 find_the_faithful_perk_name: "寻得信徒"
 cleanse_perk_name: "净化"
 heal_perk_name: "治疗"
 animate_perk_name: "活化"
 restore_life_perk_name: "恢复生命"
 FIND_THE_FAITHFUL_PERK_EFFECT: "作为[character_interaction|E]，允许你招来具有自定义[skills|E]的凡人。\n#F 如果堕落者知道一个人的名字，并在目标周围几英里内，他们就可以通过其独特的信仰找到这个人。#!"
 CLEANSE_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗疾病。\n#F 阿撒乌可以净化目标身上的毒素和疾病。#!"
 HEAL_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗伤口。\n#F 阿撒乌能让身体恢复健康，甚至可以通过触摸治愈严重损伤。#!"
 ANIMATE_PERK_EFFECT: "能够招募[GetMaA('golems').GetName]作为[men_at_arms|E]。\n[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 阿撒乌可以暂时赋予无生命物体以生命，只要他们能看到物体，就可以指挥物体的行动。#!"
 RESTORE_LIFE_PERK_EFFECT: "作为[character_interaction|E]，允许防止朋友、爱人、侧室、家人、内阁或骑士的意外死亡。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_dagan_modifier' ).GetNameWithTooltip|L]。\n#F 阿撒乌可以让刚刚死去的躯体恢复生机，他们甚至可以让灵魂回到躯体。#!"
 remote_viewing_perk_name: "遥视"
 lore_scry_perk_name: "侦测"
 mouth_of_the_damned_perk_name: "受诅者之嘴"
 lore_touch_from_afar_perk_name: "远处触摸"
 many_places_at_once_perk_name: "身在多处"
 REMOTE_VIEWING_PERK_EFFECT: "每有一[thrall|E]叠加一层：[GetModifier( 'remote_viewing_perk_modifier' ).GetNameWithTooltip|L]\n#F 堕落者可以通过魔奴的眼睛进行观看。#!"
 LORE_SCRY_PERK_EFFECT: "作为[character_interaction|E]，允许你得知对你有宝物宣称的目标的所有秘密和计谋。\n#F 利用属于目标的物体，阿撒乌可以随时观察目标。#!"
 MOUTH_OF_THE_DAMNED_PERK_EFFECT: "每有一[thrall|E]叠加一层：[GetModifier( 'mouth_of_the_damned_perk_modifier' ).GetNameWithTooltip|L]\n#F 堕落者可以通过魔奴的嘴说话。#!"
 LORE_TOUCH_FROM_AFAR_PERK_EFFECT: "作为[character_interaction|E]，允许你加速你针对对你有宝物宣称的目标的计谋。\n#F 如果堕落者拥有不在其视线范围内的目标的物品，其就可以将自己的力量引导该目标。#!"
 MANY_PLACES_AT_ONCE_PERK_EFFECT: "每有一[thrall|E]叠加一层：[GetModifier( 'many_places_at_once_perk_modifier' ).GetNameWithTooltip|L]\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_anshar_modifier' ).GetNameWithTooltip|L]。\n#F 阿撒乌可以同时对多人使用受诅者之嘴。#!"
 summon_wind_perk_name: "呼风"
 fist_of_air_perk_name: "气之拳"
 command_the_wind_perk_name: "驭风"
 wall_of_air_perk_name: "气之墙"
 cyclone_perk_name: "气旋"
