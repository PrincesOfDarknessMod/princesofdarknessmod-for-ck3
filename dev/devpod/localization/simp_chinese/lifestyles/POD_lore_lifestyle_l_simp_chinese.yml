 MANIPULATE_GRAVITY_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌方指挥官[GetModifier('high_gravity_modifier').GetNameWithTooltip]和友方指挥官[GetModifier('low_gravity_modifier').GetNameWithTooltip]修正。\n#F 堕落者可以悬空，跳跃很远的距离，或不受坠落伤害。#!"
 MANIPULATE_ADHESION_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌方指挥官[GetModifier('low_adhesion_modifier').GetNameWithTooltip]和友方指挥官[GetModifier('high_adhesion_modifier').GetNameWithTooltip]修正。\n#F 堕落者可以沿着墙壁或天花板行走，或依附在物体上。#!"
 MANIPULATE_INERTIA_PERK_EFFECT:0 "在战争中（作为指挥官时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('protection_from_projectile_modifier').GetNameWithTooltip]修正。\n作为[knight|E]时，增加作战中伤害或严重撕裂敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 堕落者可以把物体扔到很远的地方，或者干脆把攻击停下来。#!"
 MANIPULATE_ACCELERATION_PERK_EFFECT:0 "在战争中（作为指挥官时）给予友方[knights|E]或在[single_combat_duel|E]中给予自己[GetModifier('momentum_boost_modifier').GetNameWithTooltip]修正。\n作为[knight|E]时，增加作战中严重撕裂或致残敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 堕落者的能以极快速度移动，并将他们的动量注入毁灭性的近身攻击中。#!"
 MANIPULATE_COHESION_PERK_EFFECT:0 "解锁$EXECUTION_EVAPORATION$[execution|E]选项。\n作为[knight|E]时，增加作战中致残或杀死敌方[knights|E]的几率。\n解锁[single_combat_duel|E]招式。\n#F 堕落者可以改变物质的密度，使他们能够在水上行走或蒸发石头甚至肉体。#!"
 translate_perk_name:0 "翻译"
 insinuate_perk_name:0 "暗示"
 fade_perk_name:0 "淡出"
 confession_perk_name:0 "坦白"
 alter_memory_perk_name:0 "更改记忆"
 TRANSLATE_PERK_EFFECT:0 "#F 此唤术在恶魔和人类目标之间建立了一种语言上的联系。#!"
 INSINUATE_PERK_EFFECT:0 "[white_peace|E]接受度：#P +10#!\n[alliance|E]谈判接受度：#P +25#!\n$PERK_CAN_SIGN_ALLIANCE$\n解锁$purchase_truce_interaction$[interaction|E]\n#F 此唤术使恶魔能够巧妙而迅速地打破人类的个人边界。#!"
 FADE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你断绝两个目标间的盟约。\n作为[character_interaction|E]，允许你取消目标的停战协议。\n作为[character_interaction|E]，允许你终结针对目标的计谋。\n#F 这唤术允许恶魔欺骗大量群众的思想，使其变得超自然式模糊或易遗忘。#!"
 CONFESSION_PERK_EFFECT:0 "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 堕落者可能会让凡人说出他们内心深处的秘密，而凡人甚至不记得向恶魔吐露心声。#!"
 ALTER_MEMORY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你移除目标对你头衔或宝物的宣称。\n解锁[buy_artifact_claim_interaction|E]\n[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 堕落者可以以任意想要的方式改变一个凡人的记忆。#!"
