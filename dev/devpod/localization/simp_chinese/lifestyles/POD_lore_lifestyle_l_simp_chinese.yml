 LORE_EXTINGUISH_LIFE_PERK_EFFECT: "作为[war|E]攻守方发起战争时，为敌方所有统治者施加[GetModifier('lore_extinguish_life_modifier').GetNameWithTooltip]。\n#flavor 堕天者能强制其他存在直面死亡概念。#!"
 LORE_ANCHOR_THE_SOUL_PERK_EFFECT: "#flavor 堕天者能将灵体锚定在现实。#!"
 LORE_PIERCE_THE_BARRIER_PERK_EFFECT: "可操控尸幕与险棘。\n#flavor 堕天者能击穿现实之间的壁垒。#!"