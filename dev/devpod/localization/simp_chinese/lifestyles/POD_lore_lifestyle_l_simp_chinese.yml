 LORE_PHANTASM_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('lore_phantasm_perk_knight_modifier').GetNameWithTooltip][modifier|E]。\n作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('lore_phantasm_perk_commander_modifier').GetNameWithTooltip][modifier|E]。\n#F 尼比鲁可以生成微弱、透明的图像，这种图像可以持续数天。#!"
 LORE_ILLUSION_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('lore_illusion_perk_knight_modifier').GetNameWithTooltip][modifier|E]。\n作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('lore_illusion_perk_commander_modifier').GetNameWithTooltip][modifier|E]。\n作为战争参与者时，在[war|E]中给予敌方参与者[GetModifier('lore_illusion_perk_ruler_modifier').GetNameWithTooltip][modifier|E]。\n#F 尼比鲁可以制造坚固、逼真的幻象，并能持续很短的时间。#!"
 COHERENT_LIGHT_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('coherent_light_perk_knight_modifier').GetNameWithTooltip][modifier|E]。\n作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('coherent_light_perk_commander_modifier').GetNameWithTooltip][modifier|E]。\n作为战争参与者时，在[war|E]中给予敌方参与者[GetModifier('coherent_light_perk_ruler_modifier').GetNameWithTooltip][modifier|E]。\n允许变身为[GetModifier( 'POD_shapeshift_form_apocalyptic_shamash_modifier' ).GetNameWithTooltip|L]。\n#F 尼比鲁可以为幻象赋予实质，让它们可以被触摸。#!"
