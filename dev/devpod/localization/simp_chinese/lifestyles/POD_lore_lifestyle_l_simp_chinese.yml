 READ_FATE_PERK_EFFECT:0 "#F The Fallen learns what caused a target's death, and may even witness the last few days before the death occurred.#!"
 DECAY_PERK_EFFECT:0 "#F The Fallen causes an object to decay by touch.#!"
 VISION_OF_MORTALITY_PERK_EFFECT:0 "#F The Fallen inflicts a vision of death on the target to frighten it. This is one of the few evocations that works against Fallen, too.#!"
 EXTINGUISH_LIFE_PERK_EFFECT:0 "#F The Fallen separates body and spirit, causing the target to die peacefully and painlessly. When the target is a Fallen, they simply take damage.#!"
 UNLIFE_PERK_EFFECT:0 "#F The Fallen raises a dead body to do their bidding, though these walking-dead need tight supervision.#!"
