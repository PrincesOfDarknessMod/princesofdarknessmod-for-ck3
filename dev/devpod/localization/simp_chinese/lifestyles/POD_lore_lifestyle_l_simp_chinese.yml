 wave_of_mutilation_perk_name:0 "残害波"
 summon_outsider_perk_name:0 "召唤界外者"
 hell_on_earth_perk_name:0 "人间地狱"
 REALITY_TREMORS_PERK_EFFECT:0 "允许释放[GetModifier('reality_tremors_modifier').GetNameWithTooltip]到目标国度。\n#F 地缚魔在一个地区创造了一个令人不安但基本上无害的效果。#!"
 SPHERE_OF_CHAOS_PERK_EFFECT:0 "允许释放[GetModifier('sphere_of_chaos_modifier').GetNameWithTooltip]到目标国度。\n#F 地缚魔暂时中止在一个地区内的因果律。#!"
 WAVE_OF_MUTILATION_PERK_EFFECT:0 "允许释放[GetModifier('wave_of_mutilation_modifier').GetNameWithTooltip]到目标国度。\n#F 地缚魔给附近的所有活人肉体注入混沌能量，随机激发神经元，并通过混乱的大脑化学反应引发随机情绪。#!"
 SUMMON_OUTSIDER_PERK_EFFECT:0 "允许摧毁目标首都的男爵领。\n能够招募[GetMaA('the_unnamable').GetName]作为[men_at_arms|E]。\n#F 地缚魔从宇宙之外召唤出了什么。#!"
 HELL_ON_EARTH_PERK_EFFECT:0 "允许释放[GetModifier('hell_on_earth_modifier').GetNameWithTooltip]到目标国度。\n#F 这唤术会召唤出一个微型末日。#!"
