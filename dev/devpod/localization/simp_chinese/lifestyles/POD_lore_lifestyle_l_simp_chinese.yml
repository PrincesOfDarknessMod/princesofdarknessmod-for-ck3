 CONCEAL_PATH_PERK_EFFECT:0 "#F The Annunaki may hide paths made by Lay Path from detection by others.#!"
 SEAL_PATH_PERK_EFFECT:0 "#F The Annunaki seals a path, trapping anyone inside, and may set up a password so that anybody who knows it can open the path.#!"
 ALTER_PATH_PERK_EFFECT:0 "#F The Annunaki alters an existing path's parameters, like destination, gravity, size, or the even the flow of time inside the path.#!"
