 COMMAND_THE_STORM_PERK_EFFECT: "#F The Lammasu can create or dismiss any kind of weather.#!"
 INVOKE_THE_STORM_PERK_EFFECT: "Allow shapeshift to [GetModifier( 'POD_shapeshift_form_apocalyptic_adad_modifier' ).GetNameWithTooltip|L].\n#F The Defiler can surround themself with a raging storm at will, creating wind, water and lightning in an area as small as a room or as large as a city block. The heart of the storm is centered on the demon, and it moves as they move. It causes them no harm, though.#!"
