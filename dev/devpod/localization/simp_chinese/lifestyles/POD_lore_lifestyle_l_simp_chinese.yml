 LORE_COMMAND_THE_WIND_PERK_EFFECT: "#flavor 堕天者能以意志号令狂风。#!"
 LORE_MANY_PLACES_AT_ONCE_PERK_EFFECT: "$countermeasures_unlocks_t4_supernatural_high_alert$\n#flavor 堕天者能通过附近生灵的双眼观察世界。#!"
 LORE_ANIMATE_PERK_EFFECT: "允许招募[GetMaA('golems').GetName]、[GetMaA('guardians').GetName]与[GetMaA('homunculus').GetName]作为[men_at_arms|E]。\n#flavor 堕天者能为无机之物注入生命。#!"
 LORE_RESTORE_LIFE_PERK_EFFECT: "作为[character_interaction|E]，使被束缚的$POD_splat_wraith$重获凡躯，并因此获得10点决心。\n#flavor 堕天者能让亡者重获生命气息。#!"
 lore_create_object_perk_name: "无中生有"
 lore_enchant_object_perk_name: "附魔秘术"
 lore_mold_earth_perk_name: "大地塑造"
 lore_alter_path_perk_name: "更改路径"
 LORE_CREATE_OBJECT_PERK_EFFECT: "$unlock_forging_node$使用3点决心为[artifact|E]添加基于类型的[modifier|E]。\n#flavor 堕天者能从虚无中创造物品。#!"
 LORE_ENCHANT_OBJECT_PERK_EFFECT: "强化[GetPerk('lore_create_object_perk').GetName(GetPlayer)]，赋予2个[modifiers|E]而非1个。\n#flavor 堕天者能为凡物附魔。#!"
 LORE_MOLD_EARTH_PERK_EFFECT: "强化[GetPerk('lore_enchant_object_perk').GetName(GetPlayer)]，消耗从3点决心降至2点。\n#flavor 堕天者能像捏陶般塑造金属。#!"
 LORE_ALTER_PATH_PERK_EFFECT: "作为[war|E]攻守方发起战争时，为敌方所有统治者施加[GetModifier('lore_alter_path_modifier').GetNameWithTooltip]。\n#flavor 堕天者能扭曲物体间的空间关系。#!"
 lore_foresee_perk_name: "预知未来"
 lore_teleport_perk_name: "瞬息移动"
 lore_causal_influence_perk_name: "因果干涉"
 lore_coherent_light_perk_name: "凝聚之光"
