 WYRD_PERK_EFFECT:0 "作为指挥官时，在战争中给予敌方骑士[GetModifier('wyrd_perk_commander_modifier').GetNameWithTooltip]以及敌方指挥官[GetModifier('wyrd_perk_knight_modifier').GetNameWithTooltip]。\n#F 导致另一个人失去正确的时间观，无法分辨哪些事件发生在其他事件之前或之后。#!"
 BACKWARD_GLANCE_PERK_EFFECT:0 "#F 瞥见过去发生的事情，帮助回忆以前看到的图像，并提供当时没有看到的新图像。#!"
 DREAM_TIME_PERK_EFFECT:0 "作为[character_interaction|E]，允许你给予目标角色或地区正面或负面速度修正。\n#F 改变一个地区或一个人的时间速度，要么使它比正常情况下快得多或慢得多。#!"
 PERMANENCE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你刷新目标的魔咒修正。\n#F 延长另一个人施展的术艺的持续时间，使其持续时间大大超过最初应是的时间。#!"
 REVERSA_OF_FORTUNE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你给予自己持续#V 1#!天的[GetModifier( 'reversa_of_fortune_perk_modifier' ).GetNameWithTooltip|L]。\n#F 极其复杂和昂贵的术艺，允许施术者倒回过去的几分钟，并做出新的选择。#!"
 FIND_SILVER_PATH_PERK_EFFECT:0 "灵游脱逃时间：#P -5%#!\n灵界探索花费：[piety_i]#P -5%#!\n#F 显示银之径——一条在整个[dreaming|E]中引导妖精的道路——的位置，并提供有关目前在其上的人或物的信息。#!"
 DETERMINISM_PERK_EFFECT:0 "灵界探索事件触发概率：#P +100%#!\n灵游逃脱时间：#P -5%#!\n灵界探索花费：[piety_i]#P -5%#!\n#F 展示仙路——神秘的[dreaming|E]之路，在这条路上，空间和时间被严重扭曲——的另一端是什么。#!"
 HOMESTEAD_PERK_EFFECT:0 "梦之节点[building|E]所需年数：#P -50%#!\n#F 固定[dreaming|E]的某一点，使其不再随奇原的冲动而变化，而是保持为施法者所需那样。#!"
 ATTUNEMENT_PERK_EFFECT:0 "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 与一个人、一个地方或一件事联系在一起，使其无论发生什么事，你都能第一个知道。#!"
 DREAM_WEAVING_PERK_EFFECT:0 "#F 生成奇魅，类似于幻想映射魔咒，但是，那个奇魅是暂时的，而这奇魅是永久的——只要它不离开[dreaming|E]。#!"
 SEEK_N_SPELL_PERK_EFFECT:0 "#F 能够阅读任何文本，无论你是否理解其书面语言，甚至哪怕内容被加密。#!"
 RUNE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你升级宝物的修正或给予它新修正。\n#F 在物体上刻上力量之语，让它在特定的用途中发挥更大的效力。#!"
 RUNIC_CIRCLE_PERK_EFFECT:0 "给予所有廷臣，内阁成员，朋友或爱人[GetModifier('runic_circle_perk_modifier').GetNameWithTooltip]。\n#F 用防护性话语构成法环，提供对试图突破法环的超自然力量的抵抗。#!"
 SAINING_PERK_EFFECT:0 "作为[character_interaction|E]，你能发掘其他角色的真名。\n#F 呼唤戚族第一次经历破蛹时使用的真名仪式，向施术者展示个人的真名。#!"
 REWEAVING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你修改目标的特质。\n#F 一旦知道了真名，该魔咒就允许施法者编辑这真名，并以此来编辑该人或物的核心特质。#!"
 PROTOCOL_PERK_EFFECT:0 "#F 用魔法保障宫廷开庭，防止平民扰乱程序。#!"
 DICTUM_PERK_EFFECT:0 "作为[character_interaction|E]，允许你获得对目标的牵制。\n#F 向魔咒对象提出要求，他们必须尽其所能地满足这个要求，除非要求太过危险。#!"
 GRANDEUR_PERK_EFFECT:0 "作为[character_interaction|E]，允许你招募或[imprison|E]目标无地角色。\n#F 带上纯美和优雅地伪装，使别人几乎不可能会去违背你的诉求。#!"
 WEAVER_WARD_PERK_EFFECT:0 "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]\n驱逐无地角色会获得其拥有的宝物\n#F 封锁门洞或狭窄通道，使指定的物品类型无法通过。#!"
 GEAS_BAN_PERK_EFFECT:0 "解锁誓言[character_interaction|E]，让目标在破誓时成为[GetTrait('oathbreaker').GetName( GetPlayer )]。\n#F 生成誓言，要么要求完成某类行动（誓约），或者放弃某类行动（禁制）；违背该誓言的人将因此受到一定诅咒。#!"
 HARDEN_PERK_EFFECT:0 "#F 通过将野奇魅变成工制奇魅来进行预备，允许对其进一步使用聚合。#!"
 TOUGHEN_PERK_EFFECT:0 "#F 增加奇魅材料的耐用性或换生灵的坚韧，给予对伤害和板讷的抵抗。#!"
 FUBAR_GENERATION_PERK_EFFECT:0 "允许制造梦华容器。\n#F 制造并奴役一只FUBAR——一种可以作为梦华能量池的奇魅生物。#!"
 ANIMANTIS_PERK_EFFECT:0 "允许制作[GetTrait('statue').GetName( GetPlayer )]角色。\n能够招募[GetMaA('golems').GetName]作为[men_at_arms|E]。\n#F 生产出魔像——一种机械仆从——来为诺克服务并协助他工作。#!"
 GILGUL_PERK_EFFECT:0 "作为[character_interaction|E]，允许你随意修改目标[GetTrait('statue').GetName( GetPlayer )]的心理和生理特质。\n#F 一个非常危险的魔咒，若成功的话，会给于奇魅或活像意志思想，甚至可能给予真正的灵魂。#!"
 AGEMOS_BLESSING_PERK_EFFECT:0 "#F 一次性读懂整个人群的情绪，以确定如何最好地进行娱乐他们。#!"
 FLICKERING_FIRELIGHT_PERK_EFFECT:0 "#F 用小型奇魅幻象塑造出故事中所说的物件，为叙事提供布景。#!"
 MURMUR_IN_THE_CROWD_PERK_EFFECT:0 "#F 在人群中灌输一种情感，增加逸抒的故事的吸引力，同时也提供讲述故事的理由。#!"
 STICKS_AND_STONES_PERK_EFFECT:0 "#F 将文字变成临时庇护所，保护叙事者不受损害，只要他们不停地讲述他们的故事。#!"
 MOMENT_OF_TRUTH_PERK_EFFECT:0 "#F 生成一个以施术者希望的形式显现的具有一定限制的临时奇魅。#!"
 THE_MERRY_DANCE_PERK_EFFECT:0 "灵界探索事件触发概率：#P +100%#!\n灵游逃脱时间：#P -5%#!\n灵界探索花费：[piety_i]#P -5%#!\n#F 梦变是虚幻界域中的一股强大力量。梦界是不断变化的，而梦变是这种变化的一个关键来源。熟练的妖精可以通过集中精力和准备工作，影响梦变带来的变化。#!"
 ANCHOR_PERK_EFFECT:0 "梦之节点[building|E]所需年数：#P -50%#!\n#F 有了这魔咒，换生灵可以在一定程度上“巩固”梦界，这使他们能够在虚幻界域中建立一个永久的堡垒。#!"
 DREAM_RIDING_PERK_EFFECT:0 "作为[character_interaction|E]，允许你从目标获得好感。\n#F 这魔咒允许换生灵在戚族处于[dreaming|E]时与凡人的梦境互动。这并不总是一件明智的事情，因为戚族的互动会对梦境本身造成奇怪的改变。虽然互动是可能的，但对梦的实际控制是不可能的。#!"