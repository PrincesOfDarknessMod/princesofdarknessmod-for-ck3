 STONESKIN_PERK_EFFECT: "#F 为物体涂上防护石层，帮助它们抵御伤害。#!"
 IRONARM_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('ironarm_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 赋予受术者额外的力量，让其有能力搬动沉重的石头。#!"
 ART_STASIS_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('stasis_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 减缓目标速度，使其几乎无法移动。#!"
 QUAKE_PERK_EFFECT: "参战时，对敌方所有统治者施加[GetModifier('quake_perk_modifier').GetNameWithTooltip]。\n#F 劈开大地，伤害周围的人和物。#!"
 AURA_PERCEPTION_PERK_EFFECT: "#F 从灵光中了解一个人的各种品质，如情绪状态和诚实度。#!"
 HOLD_PERK_EFFECT: "#F 在飞行物抵达施术者面前前阻止其运动。#!"
 ART_TEMPUS_FUGIT_PERK_EFFECT: "#F 允许让一个物体以难以置信的速度移动。#!"
 FRICTION_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('friction_perk_knight_positive_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('friction_perk_knight_negative_modifier').GetNameWithTooltip][modifier|E]。\n#F 加热或冷却物体内的水，使其沸腾或冻结成冰。#!"
 HEALING_WATERS_PERK_EFFECT: "作为[character_interaction|E]，允许你治疗目标，或修复目标宝物。\n#F 通过浇水来修复物体或治疗病人。#!"
 FLAME_PERK_EFFECT: "#F 变出大小不一的火焰，有时候像一支小蜡烛，有时候像一个大篝火。#!"
 TORTURED_HEART_PERK_EFFECT: "#F 牵动人心，编辑已有情感的强度。#!"
 ARES_FIST_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('ares_fist_perk_modifier').GetNameWithTooltip][modifier|E]。\n#F 引导神力，提高徒手格斗的能力。#!"
 STRINGS_OF_THE_SOUL_PERK_EFFECT: "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]。\n#F 将无中生有的情感植入目标体内。#!"
 INFERNO_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标[GetModifier('firebombs_modifier').GetNameWithTooltip]或[GetModifier('firespewer_modifier').GetNameWithTooltip]。\n#F 完全控制火焰，按照使用者的意愿塑造和变幻火焰。#!"
 MARATHON_PERK_EFFECT: "#F 缩短了移动时间，但矛盾的是，施术者似乎并没有走得更快。#!"
 CONCEAL_CONFUSE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('conceal_confuse_perk_knight_modifier').GetNameWithTooltip][modifier|E]。\n作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('conceal_confuse_perk_commander_modifier').GetNameWithTooltip][modifier|E]。\n作为战争参与者时，在[war|E]中给予敌方参与者[GetModifier('conceal_confuse_perk_ruler_modifier').GetNameWithTooltip][war|E]。\n#F 化出能骗过一两种感官的简单且静止的幻觉。#!"
 FLIGHT_PERK_EFFECT: "#F 允许目标飞行，像有翅膀一样飞向天空。#!"
 ILLUSION_PERK_EFFECT: "作为[character_interaction|E]，使目标获得[GetTrait('blind').GetName( GetPlayer )]、[GetModifier('sensory_deprivation_deaf_modifier').GetNameWithTooltip]……等等。\n#F 化出能骗过多种感官的更复杂幻觉。#!"
 ART_PHANTASM_PERK_EFFECT: "#F 产生强大的、活化的幻象，能够如同奇魅一般活动。#!"
 SOLARIUM_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标地区植物相关修正。\n#F 改变活体植物的大小、健康状况或形状。#!"
 BABEL_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -50%#!\n#F 允许施术者与任何物体对话，就像它拥有人类智慧一样。#!"
 COALESCE_PERK_EFFECT: "作为[character_interaction|E]，允许你将梦华转为金钱。\n#F 将植物物质转化为任何想要的物体。#!"
 WEB_OF_LIFE_PERK_EFFECT: "#F 通过研究相互关联的生态系统的一个方面，可以确定其未来的方方面面。#!"
 MOLD_PERK_EFFECT: "$unlock_forging_node$献祭[prisoner|E]，根据牺牲者的[traits|E]强化[artifact|E]\n#F 将一种生物物质转化为另一种生物物质，且不会在转化过程中杀死它。#!"
