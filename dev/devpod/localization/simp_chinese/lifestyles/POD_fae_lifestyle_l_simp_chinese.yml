l_simp_chinese:
 game_concept_realm_lifestyle:0 "领域"
 game_concept_realm_lifestyle_desc:0 "戚族与世界的五方面有亲和力，直接决定其能影响的人或事物。如果不了解适当的领域，戚族就无法影响任何东西。领域是施展魔咒的必要条件。"
 realm_lifestyle_name:0 "领域"
 realm_lifestyle_desc:0 "专注于戚族与世界的亲和力。"
 realm_lifestyle_highlight_desc:0 "由于你的梦华，这个生活方式中会给予额外#P [GetPlayer.Custom('GetGlamourLifestylePercentageBoost')]#!的[experience|E]积累。"
 monthly_realm_lifestyle_xp_gain_mult:0 "每月领域[lifestyle|E][experience|E]"
 realm_actor_focus:0 "角色重心"
 realm_actor_focus_modifier:1 "[GetFocus('realm_actor_focus').GetName]"
 realm_actor_focus_desc:0 "角色是与所有世俗众生相连的领域，与你对他们的了解程度直接相关。"
 realm_actor_focus_effect_desc:0 "角色重心给予："
 realm_fae_focus:0 "妖精重心"
 realm_fae_focus_modifier:1 "[GetFocus('realm_fae_focus').GetName]"
 realm_fae_focus_desc:0 "妖精领域与其他[dreaming|E]生物相关。影响其他换生灵、仙族贵胄、魔妖、奇魅，甚至是控制妖精魔法本身，都属于妖精的范畴。"
 realm_fae_focus_effect_desc:0 "妖精重心给予："
 realm_scene_focus:0 "场景重心"
 realm_scene_focus_modifier:1 "[GetFocus('realm_scene_focus').GetName]"
 realm_scene_focus_desc:0 "场景是对空间的控制。你对场景领域掌握得越多，你就能影响更大的区域或（与其他领域结合）影响更多的目标。"
 realm_scene_focus_effect_desc:0 "场景重心给予："
 realm_time_focus:0 "时间重心"
 realm_time_focus_modifier:1 "[GetFocus('realm_time_focus').GetName]"
 realm_time_focus_desc:0 "时间是对你的魔咒何时发生或持续多久的控制。对时间的掌握决定了你的法术可以持续多长时间，或者你可以对它们设置的延后“触发”时间。"
 realm_time_focus_effect_desc:0 "时间重心给予："
