 TAI_SU_PERK_EFFECT:0 "#F The first step of the Tao Te Hsien is the last step of creation where the forms of nature were settling into place.\n$BULLET_WITH_TAB$Shapechange - A Yang effect, Magnitude of Change governs most of the effects.\n$BULLET_WITH_TAB$Visage of the Dead - This Yin effect lets the hsien effectively kill their bodies for a period of time.#!"
 TAI_I_PERK_EFFECT:0 "#F T'ai I marked the birth of reality as the elements formed around the Great Pole. This is the coalescing of Chi and the birth of time. The alchemist can manipulate how time affects them and gain some control of their chi. Some texts speak of a great ritual that can stop the ravages of time on the hotei. It is said to include drinking powdered Jade while traveling a Dragon Line.\n$BULLET_WITH_TAB$Axis of Time - The Hsien can decrease time's hold on them, speeding up their own movement through time to gain extra actions in combat.\n$BULLET_WITH_TAB$The Mutable Furies - The hsien can manipulate their Chi values.#!"
 TAI_CHI_PERK_EFFECT:0 "#F In the midst of the swirling of Hun T'un (Chaos) T'ai Chi was formed, the locus and anchor for reality. Some wise shinma in the Di Fu believe Earth formed the T'ai Chi or was at least the first element formed on it.\n$BULLET_WITH_TAB$The Typhoon's Eye - T'ai Chi grants the shinma the power to pass through storms unscathed.#!"
 HU_TUN_PERK_EFFECT:0 "#F The limitless possibilities of Wu Chi created Chaos: Hu T'un. This is a frightening time for the one seeking the Tao Te Hsien. They have almost made it back to the point of No Limit and the Jade Key but for the moment are on the edge of total discord.\n$BULLET_WITH_TAB$The Benevolent Hand of Jade - This I Chih makes the improbable probable...\n$BULLET_WITH_TAB$Backside of the Monkey King - This I Chih makes the probable improbable...#!"
 WU_CHI_PERK_EFFECT:0 "#F Just after Wu-wo (Not Nothing) came Wu Chi (No Limit), a time of unbounded potential. This state is only reached by those who are most pure in following the teachings of the Tao Te Hsien. This revelation, strangely enough, comes quietly and unexpectedly during a moment of peace.\n$BULLET_WITH_TAB$Fortify the Wall - The wielder of the key can temporarily strengthen the Wall of a place.\n$BULLET_WITH_TAB$Unlock the Jade Portal - To unlock the Wall and travel beyond it#!"