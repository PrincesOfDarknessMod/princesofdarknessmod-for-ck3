 WYRD_PERK_EFFECT:0 "#F Causes another to lose sight of the proper order of time, being unable to tell which events occurred before or after others.#!"
 BACKWARD_GLANCE_PERK_EFFECT:0 "#F Glance something that happened in the past, aiding in recall of images seen before, and providing new images that weren't seen at the time.#!"
 DREAM_TIME_PERK_EFFECT:0 "#F Changes the speed of time in an area or for a person, either causing it to go far faster than it normally should, or slow to a crawl.#!"
 PERMANENCE_PERK_EFFECT:0 "#F Extends the duration of an Art cast by another, allowing it to last substantially longer than what the result originally mandated.#!"
 REVERSA_OF_FORTUNE_PERK_EFFECT:0 "#F An extremely complex and expensive Art that allows the user to reverse the last few minutes, and make new choices.#!"
 FIND_SILVER_PATH_PERK_EFFECT:0 "#F Shows the location of the Silver Path, the path that guides fae throughout the Dreaming, and grants information about who or what is currently upon it.#!"
 DETERMINISM_PERK_EFFECT:0 "#F Shows what is on the other end of a trod, a mysterious path of the Dreaming upon which space and time are heavily distorted.#!"
 HOMESTEAD_PERK_EFFECT:0 "#F Fixes a point of the Dreaming so that, instead of ever-changing at the whims of the Wyld, it will remain as the caster intended it.#!"
 ATTUNEMENT_PERK_EFFECT:0 "#F Ties a Kithain to a person, place, or thing, making it so that whatever happens to it, the Kithain will be the first to know.#!"
 DREAM_WEAVING_PERK_EFFECT:0 "#F Produces a chimera, similar to the Phantom Shadows cantrip, but, while that chimera is temporary, this chimera is permanent - so long as it never leaves the Dreaming.#!"
 SEEK_N_SPELL_PERK_EFFECT:0 "#F Whether you understand the language or not, or even if the contents are magically locked, it becomes possible to read any text.#!"
 RUNE_PERK_EFFECT:0 "#F Inscribes a word of power onto an object, allowing it to be far more effective for a specific task.#!"
 RUNIC_CIRCLE_PERK_EFFECT:0 "#F Produces a circle of protective words, that provides resistance against supernatural forces that attempt to breach the circle.#!"
 SAINING_PERK_EFFECT:0 "#F Recalls the ritual of the True Name that is used when a Kithain first goes through Chrysalis, showing the user that individual's True Name.#!"
 REWEAVING_PERK_EFFECT:0 "#F Once the True Name is known, this cantrip permits the caster to edit that Name, and in doing so edits core traits of what that person or object is.#!"
 PROTOCOL_PERK_EFFECT:0 "#F Brings a magically ensured Court into session, preventing commoners from disrupting the proceedings.#!"
 DICTUM_PERK_EFFECT:0 "#F Specifies a request to the subject of the cantrip, which they must fulfill to the best of their ability, unless it is too dangerous.#!"
 GRANDEUR_PERK_EFFECT:0 "#F Take on a mantle of pure beauty and grace, making it nearly impossible for others to try to contradict your desires.#!"
 WEAVER_WARD_PERK_EFFECT:0 "#F Block off a doorway or narrow passage, making it impossible for a specified group of objects to pass through.#!"
 GEAS_BAN_PERK_EFFECT:0 "#F Produces an Oath, either requiring a person to fulfill an action (Geas), or abstain from doing a certain action (Ban); breakers of this Oath will suffer some curse as a result.#!"
 HARDEN_PERK_EFFECT:0 "#F Prepares a wild chimera by turning it into a crafted chimera, allowing further applications of Infusion to be used on it.#!"
 TOUGHEN_PERK_EFFECT:0 "#F Adds durability to chimerical materials, including other changelings, granting resistance both to damage and Banality's undoing.#!"
 FUBAR_GENERATION_PERK_EFFECT:0 "#F Creates and enslaves a FUBAR, a chimerical creature that can serve as a Glamour battery.#!"
 ANIMANTIS_PERK_EFFECT:0 "#F Produces a golem, a mechanical servant that will serve the Nocker and aid him in his work.#!"
 GILGUL_PERK_EFFECT:0 "#F A terribly dangerous cantrip that, if successful, adds sentient thought to a chimera or animantis, and possibly even a true soul.#!"
 AGEMOS_BLESSING_PERK_EFFECT:0 "#F Reads the emotions of an entire crowd at once, in order to determine how best to proceed with entertaining them.#!"
 FLICKERING_FIRELIGHT_PERK_EFFECT:0 "#F Shapes a small chimerical illusion into something spoken of in the story, providing set pieces with which to tell the tale.#!"
 MURMUR_IN_THE_CROWD_PERK_EFFECT:0 "#F Instills an emotion within the crowd, increasing the appeal of the Eshu's story, as well as providing a reason for them to tell it.#!"
 STICKS_AND_STONES_PERK_EFFECT:0 "#F Turns words into a temporary shelter, protecting the talecrafter from damage, so long as they keep telling their tale without pause.#!"
 MOMENT_OF_TRUTH_PERK_EFFECT:0 "#F Produces a temporary chimera that appears in the form of what the user desires it to, with some limitation.#!"