 SUMMON_DISPEL_METAL_PERK_EFFECT:0 "#F When you need a weapon and don't care what you get, this ability can be helpful.#!"
 SUMMON_DISPEL_LIN_SHEN_PERK_EFFECT:0 "#F The Alchemist can summon and dispel Wood Spirits, which includes spirits of plants, but not animals.#!"
 SUMMON_DISPEL_SHUI_SHEN_PERK_EFFECT:0 "#F With this ability an alchemist may exert some control over Shui Shen.#!"
 DI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT:0 "#F The Alchemist may hide object governed by earth within his or her own body.#!"