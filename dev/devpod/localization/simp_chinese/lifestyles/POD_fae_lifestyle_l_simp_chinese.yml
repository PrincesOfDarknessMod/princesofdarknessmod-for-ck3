 game_concept_metal_soul: "金魂"
 game_concept_metal_soul_desc: "金魂包含一个人的正义、诚实和公平竞争感。法官、义务警员、人权活动家和民权支持者都拥有强大的金魂。"
 game_concept_wood_soul: "木魂"
 game_concept_wood_soul_desc: "木魂掌管一个人的道德。它控制欲望和同情心。所有生物都拥有木魂。虽然生物以生物为食，但它也包含同情心。护士、运动员、医生和大多数母亲都拥有强大的木魂。"
 game_concept_water_soul: "水魂"
 game_concept_water_soul_desc: "水魂包含一个人对他人和宇宙力量的信念。它还与忠诚和自信相对应。资本家、犯罪头子和那些喜欢获得忠诚和权力的人都拥有强大的水魂，真正忠诚的人也是如此。"
 game_concept_fire_soul: "火魂"
 game_concept_fire_soul_desc: "火魂掌管礼仪感以及对礼仪和行为准则的理解。它控制着责任感和执行社会法律的热忱。警察甚至政府官员都可能拥有强大的火魂。"
 game_concept_earth_soul: "土魂"
 game_concept_earth_soul_desc: "智慧生物的土魂掌管智慧、洞察力、理解力和常识。它掌管着做出明智选择的能力。领导者、牧师和顾问通常都拥有强大的土魂。"
