 FANCY_PERK_EFFECT: "作为[character_interaction|E]，允许让目标对你获得正面好感。\n#F 制造一个良好的第一印象，给别人一个想法，即其欣赏一个其从未见过的特定对象。#!"
 YEARN_PERK_EFFECT: "作为[character_interaction|E]，让目标的临近领主想要盗取其的宝物。\n#F 改变一个人的思路，使其得出结论，在未来的某个时候，其渴望某个人、某个地方或某件事。#!"
 COVET_PERK_EFFECT: "作为[character_interaction|E]，让目标想要成为你的朋友或爱人。\n#F 导致痴迷，导致一个人对他以前可能没有兴趣的人或事耿耿于怀或具有需求。#!"
 CRAVE_PERK_EFFECT: "作为[character_interaction|E]，让目标的临近领主想要宣称和征服其的头衔。\n#F 对爱上的对象产生非理性的欲望，导致受术者几乎不惜一切代价来获得它，除非会危及自己。#!"
 NEED_PERK_EFFECT: "作为[character_interaction|E]，让目标向有任何头衔或宝物宣称的角色，或跟目标有共同朋友、爱人、或夫妻的角色，发起[single_combat_duel|E]。\n#F 该术艺最可怕也最不低调的招数，在这等级，一种短暂的需求被创造而出，但这需求是如此强烈，以至于任何人，甚至受术者或她的需求对象，都可以被牺牲来满足它。#!"
 COLD_SHOCK_PERK_EFFECT: "作为[character_interaction|E]，允许让目标的廷臣和宾客对其获得负面好感。\n#F 使一个房间或一个人降温，很少造成真正的伤害，但使感受到的人因温度而感到不舒服。#!"
 GELID_RIME_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('gelid_rime_perk_commander_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('gelid_rime_perk_knight_modifier').GetNameWithTooltip][modifier|E]。\n#F 将一片小区域裹在一层薄薄的冰下，防止其上的人移动身体的任一部分。#!"
 FROST_FACSIMILE_PERK_EFFECT: "$unlock_forging_node$根据[artifact|E]类型添加[modifier|E]并提升最大[durability|E]\n#F 用固冰制作物品，可能像普通的冰一样脆弱，或者如果制作得好，会像金属一样坚固。#!"
 CRYSTA_PRISON_PERK_EFFECT: "作为[character_interaction|E]，允许你[imprison|E]目标。\n#F 将某物包裹在固体冰块中，迅速冷却它们，如果是生物，可能会使其窒息。#!"
 COLDHEART_PERK_EFFECT: "作为[character_interaction|E]，允许你使目标陷入[GetTrait('torpor').GetName( GetPlayer )]。\n#F 彻底冻结某个对象，使其变得寒冷、无意识，且易碎；从这种状态中醒来是很困难的，尤其是魔咒持续时间结束之前。#!"
 HIDDEN_FORM_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 伪装一个对象，使其几乎不可能被眼睛发现。#!"
 IMPERSONATE_PERK_EFFECT: "增强变形[character_interaction|E]以改变面貌。\n作为[character_interaction|E]，允许你复制目标的面貌。\n#F 变成另一个人的形状，包括将自己的戚系掩饰为另一个人。#!"
 GO_ASK_ALICE_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L]和[GetModifier( 'POD_shapeshift_form_lilliputian_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 允许改变大小，使人和物体变得奇大无比，或奇小无比。#!"
 MERLINS_LESSONS_PERK_EFFECT: "允许变身为数种动物。\n#F 比冒充更夸张的形状变化，允许变成一种动物；当与去问爱丽丝结合时，这动物可以是任何大小。#!"
 MYTHIC_TRANSFORMATION_PERK_EFFECT: "允许变身为数种逝兽，如[GetModifier( 'POD_shapeshift_form_celestial_dragon_modifier' ).GetNameWithTooltip|L]。\n#F 将妖精化为不属于这世界的生物，拥有其的力量，只要施咒者能够避免伴随着这力量而来的板讷反噬。#!"
 WIL_O_THE_WISP_PERK_EFFECT: "#F 变出一个虚假的火球，引导施咒者通过非直线的路径到达所需的物体或人。#!"
 WILLOW_LIGHT_PERK_EFFECT: "#F 使一个物体在数个小时内散发出难以被忽视的明亮光芒。#!"
 PROMETHEUS_FIST_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中给予友方[commanders|E][GetModifier('prometheus_fist_perk_commander_modifier').GetNameWithTooltip][modifier|E]。\n在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('prometheus_fist_perk_knight_modifier').GetNameWithTooltip][modifier|E]。\n#F 将一个物体包在火焰中，不会烧毁物体本身，但该物体所接触到的任何东西都会正常着火。#!"
 BURN_AND_BOIL_PERK_EFFECT: "#F 点燃一个物体，且会对物体本身造成伤害；这火会吞噬这个物体，无法控制，就像普通的火一样。#!"
 STAR_BODY_PERK_EFFECT: "#F 将一个物体化为纯火，对其固有属性不造成任何改变，但使它具有点燃易燃物体的光辉和概率。#!"
 game_concept_slivers_lifestyle: "派衍"
