 flicker_flash_perk_name:0 "电光石火"
 FUDDLE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你给予目标[GetModifier( 'fuddle_perk_positive_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'fuddle_perk_negative_modifier' ).GetNameWithTooltip|L]。\n#F 轻微地改变现有感知，例如用一个响亮的声音替换另一个响亮的声音，或者从阴影的掩护下假装隐形。#!"
 VEILED_EYES_PERK_EFFECT:0 "作为[character_interaction|E]，允许你中止所有针对目标的计谋或从目标获取停战协定。\n#F 导致一个物体被忽略；虽然不是真正的隐形，但旁观者不会想到要注意这个物体。#!"
 FUGUE_PERK_EFFECT:0 "作为[character_interaction|E]，让你使一个受知秘密不会被目标揭露，移除目标对你的宣称，或使目标浪费掉对你有的牵制。\n作为[character_interaction|E]，允许你将罪恶特质重新变为秘密。\n#F 将记忆从一个人的脑海中移除，或导致一个特定的回忆脱颖而出，掩盖其他回忆。#!"
 HAUNTED_HEART_PERK_EFFECT:0 "解锁[GetScheme('PODsoul_bridge').GetTypeName][scheme|E]\n#F 通过让目标重温过去感受到的情感，唤起目标的某种幻觉情感。#!"
 CAPTIVE_HEART_PERK_EFFECT:0 "作为指挥官时，在战争中给予友方指挥官[GetModifier('captive_heart_perk_commander_modifier').GetNameWithTooltip]修正。\n在战争中（作为指挥官时）给予友方骑士或在[single_combat_duel|E]中给予自己[GetModifier('captive_heart_perk_knight_modifier').GetNameWithTooltip]修正。\n#F 将情感作为一种控制力，使一个人相信关于自己的从未是真实的事。#!"
 GIMMIX_PERK_EFFECT:0 "#F 简单的念力移物，允许在一定范围内移动物体，但不能进行精细的操作。#!"
 ART_ENSNARE_PERK_EFFECT:0 "#F 移动过重而不能被隔空探物移动的的物体，或可弯曲的物体以试图捆绑一个人。#!"
 EFFIGY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你复制目标宝物。\n#F 制造一个给定物品的副本，尽管该物品在表面以下的特征未能被复制。#!"
 MOOCH_PERK_EFFECT:0 "作为[character_interaction|E]，允许你窃取目标宝物。\n#F 对施法者可见的物体被立即转移到施法者的身上。#!"
 PHANTOM_SHADOWS_PERK_EFFECT:0 "作为[character_interaction|E]，允许你制造目标角色的复制体。\n#F 制造一个临时的，有一些限制的，以施法者想要的模样出现的奇魅。#!"
 WILLOW_WHISPER_PERK_EFFECT:0 "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#F 与物体交谈，无论它们是否拥有用于说话的嘴或用于思考的头脑。#!"
 ELDRITCH_PRIME_PERK_EFFECT:0 "作为[character_interaction|E]，允许你向目标地区释放天气魔咒。\n#F 制造最基本元素的纯粹显现：火、水、土、气或木。#!"
 OAKENSHIELD_PERK_EFFECT:0 "作为[character_interaction|E]，允许召唤[GetModifier('oakenshield_modifier').GetNameWithTooltip]到目标地区。\n#F 将物体包裹在坚固的树皮中，保护它们免受损害。#!"
 HEATHE_BALM_HOLLY_STRIKE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你治疗或伤害目标，或将目标宝物分解。\n#F 修复物体或治疗人（石南花膏）；或以同等力度损坏物体或伤害人（神圣打击 ）。#!"
 ELDER_FORM_PERK_EFFECT:0 "解锁变形[character_interaction|E]。\n#F 变成元素物体的形状，如果它存在就获得它的属性，如果不存在就只是它的外观。#!"
 OMEN_PERK_EFFECT:0 "作为[character_interaction|E]，允许你得知目标的所有秘密和计谋。\n#F 作为预言的最基本形式，这魔咒能让人瞬间洞悉一个物体的最终宿命。#!"
 FAIR_IS_FOUL_FOUL_IS_FAIR_PERK_EFFECT:0 "作为[character_interaction|E]，允许你花费通常术艺经验来使目标获得或失去金钱和威望。\n#F 稍微插手命运，给盟友带来一点好运，或给敌人带来一丁点坏运。#!"
 TATTLETALE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你给予目标宝物[GetModifier('artifact_tattletale_modifier').GetNameWithTooltip]。\n#F 从施法者过去遇到的物品的视角进行观察，或知道其真名。#!"
 AUGURY_PERK_EFFECT:0 "作为[character_interaction|E]，允许你让随机事件在目标上发生。\n#F 决定未来将发生的事件；无论怎样，该事件都会发生，尽管导致其发生的背后事实可能是非常出乎意料的。#!"
 FATE_FIRE_PERK_EFFECT:0 "作为[character_interaction|E]，允许你增加计谋进度。\n#F 一个奇怪而复杂的魔咒，它加快了因果报应的速度，使任何即将发生在某人身上的事情，无论好坏，都比预期的要快得多。#!"
 HOPSCOTCH_PERK_EFFECT:0 "#F 进行一个不可能的跳跃，无论是向上还是向下，并且不受由此产生的碰撞的损害。#!"
 QUICKSILVER_PERK_EFFECT:0 "#F 允许让一个物体以难以置信的速度移动。#!"
