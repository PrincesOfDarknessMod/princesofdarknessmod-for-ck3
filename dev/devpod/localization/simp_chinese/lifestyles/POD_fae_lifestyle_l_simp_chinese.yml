 LIVING_ROCK_PERK_EFFECT:0 "#F Shapes earth, changing its shape or composition.#!"
 STONESKIN_PERK_EFFECT:0 "#F Coats an object in protective stone, helping them to protect themselves against damage.#!"
 IRONARM_PERK_EFFECT:0 "#F Grants additional strength to a subject, granting them the ability to move heavy stones.#!"
 ART_STASIS_PERK_EFFECT:0 "#F Slows down a target, causing them to barely move at all.#!"
 QUAKE_PERK_EFFECT:0 "#F Splits apart the earth, damaging people and things in the area.#!"
 AURA_PERCEPTION_PERK_EFFECT:0 "#F Learn various qualities of a person, such as emotional state and honesty, from their aura.#!"
 HOLD_PERK_EFFECT:0 "#F Halts the motion of an object in flight before it reaches the caster.#!"
 ART_TEMPUS_FUGIT_PERK_EFFECT:0 "#F Allows an object to move at an incredibly fast speed.#!"
 FRICTION_PERK_EFFECT:0 "#F Heat or chill the water within an object, to the point of boiling it or freezing it into ice.#!"
 HEALING_WATERS_PERK_EFFECT:0 "#F Fixes an object or heals a person by pouring water over the wound.#!"
 FLAME_PERK_EFFECT:0 "#F Produces a flame varying in size from a tiny candle to a great bonfire.#!"
 TORTURED_HEART_PERK_EFFECT:0 "#F Pulls at the heart to edit the intensity of an existing emotion.#!"
 ARES_FIST_PERK_EFFECT:0 "#F Channels divine strength to improve prowess in hand-to-hand combat.#!"
 STRINGS_OF_THE_SOUL_PERK_EFFECT:0 "#F Creates an emotion from nothing, and implants it into the target.#!"
 ART_INFERNO_PERK_EFFECT:0 "#F Allows full control of a fire, shaping and bending it to the user's will.#!"
 MARATHON_PERK_EFFECT:0 "#F Reduces travel time, yet paradoxically the user does not appear to go faster.#!"
 CONCEAL_CONFUSE_PERK_EFFECT:0 "#F Produces a simple, static illusion fooling one or two senses.#!"
 FLIGHT_PERK_EFFECT:0 "#F Allows a target to fly, taking to the sky as if they had wings.#!"
 ILLUSION_PERK_EFFECT:0 "#F Produces a more complex illusion capable of fooling many distinct senses.#!"
 ART_PHANTASM_PERK_EFFECT:0 "#F Produces powerful, living illusions that act as Chimerae in their own right.#!"
 SOLARIUM_PERK_EFFECT:0 "#F Produces a change in the size, health, or shape of a living plant.#!"
 BABEL_PERK_EFFECT:0 "#F Allows the user to speak with any object as if it possesses human intelligence.#!"
 COALESCE_PERK_EFFECT:0 "#F Transforms plant matter into any object desired.#!"
 WEB_OF_LIFE_PERK_EFFECT:0 "#F By examining one aspect of an interconnected ecosystem, aspects of its future can be determined.#!"
 MOLD_PERK_EFFECT:0 "#F Transforms one type of living matter to another, without killing it in the process.#!"
