 REALM_ACTOR_1_PERK_EFFECT:0 "You can now cast a cantrip to a friend, lover, courtier, direct vassal, house member, character who you have strong title claim or strong hook, or a character who you know their criminal secret.\nAlso the character shouldn't have any bad relation, war, truce with you or be imprisoned by you."
 REALM_ACTOR_2_PERK_EFFECT:0 "You can now cast a cantrip to a friend, lover, courtier, guest, vassal, liege, dynasty member, character who you have title claim or hook, or a character who you known their secret.\nAlso the character shouldn't have any bad relation, war, truce with you or be imprisoned be you."
 REALM_ACTOR_3_PERK_EFFECT:0 "You can now cast a cantrip to a character with any good relation, courtier, guest, vassal, liege, dynasty member, ally, a character who you have claim or hook, or a character who you know their secret.\nAlso the character shouldn't have any bad relation or war with you."
 REALM_ACTOR_4_PERK_EFFECT:0 "You can now cast a cantrip to any character as long as they are not a rival or at war."
 REALM_ACTOR_5_PERK_EFFECT:0 "You can now cast a cantrip to any character, even a rival or during a war."
 REALM_FAE_1_PERK_EFFECT:0 "You can now cast a cantrip to lesser supernaturals or mortals with lesser powers."
 REALM_FAE_2_PERK_EFFECT:0 "You can now cast a cantrip to Changeling."
 REALM_FAE_3_PERK_EFFECT:0 "You can now cast a cantrip to Fae."
 REALM_FAE_4_PERK_EFFECT:0 "You can now cast a cantrip to most supernaturals or mortals with powerful powers."
 REALM_FAE_5_PERK_EFFECT:0 "You can now cast a cantrip to even the rarest supernatural."
 REALM_SCENE_1_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a small realm away (example : Wales top to bottom)."
 REALM_SCENE_2_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a medium realm away (example : Ireland top to bottom)."
 REALM_SCENE_3_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a big realm away (example : France top to bottom)."
 REALM_SCENE_4_PERK_EFFECT:0 "You can now cast a cantrip to a character of roughly a massive realm away (example : Holy Roman Empire left to right)."
 REALM_SCENE_5_PERK_EFFECT:0 "You can now cast a cantrip to any character on the map."
 REALM_TIME_1_PERK_EFFECT:0 "Cantrip modifier now last #V 1#! year instead of #V 4#! months."
 REALM_TIME_2_PERK_EFFECT:0 "Cantrip modifier now last #V 2#! years instead of #V 1#! year."
 REALM_TIME_3_PERK_EFFECT:0 "Cantrip modifier now last #V 5#! years instead of #V 2#! year."
 REALM_TIME_4_PERK_EFFECT:0 "Cantrip modifier now last #V 10#! years instead of #V 5#! year."
 REALM_TIME_5_PERK_EFFECT:0 "Cantrip modifier now last forever."
