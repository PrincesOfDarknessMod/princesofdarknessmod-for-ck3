 GREAT_GRANDFATHERS_SUMMONS_PERK_EFFECT: "#F 在紧急的时刻或危急情况下，这个强大而很少使用的灵赋使得大祖父（或古老者）能够向所有的古拉赫勒发出召唤，将他们召集到他身边，以便他能够告知他们召唤的原因。这个召唤是如此强大，以至于甚至可以唤醒那些陷入冬眠状态的古拉赫勒。古拉赫勒们不必回应这个召唤，实际上，有些人会拒绝或忽视古老者的召唤。然而，大多数古拉赫勒会聚集起来，准备好治疗物品、武器和食物，然后前往大祖父等待他们的地方。正是通过这灵赋，在风暴吞噬者被释放时，许多古拉赫勒大规模苏醒。#!"
