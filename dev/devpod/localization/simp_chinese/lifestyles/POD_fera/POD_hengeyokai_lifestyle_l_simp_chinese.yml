l_simp_chinese:
 hengeyokaigifts_lifestyle_name: "兽妖灵赋"
 hengeyokaigifts_lifestyle_desc: "专注于由兽庭所赠予的力量。"
 hengeyokaigifts_lifestyle_highlight_desc: "由于你的[GetModifier('POD_gnosis_5_modifier').GetNameWithTooltip]，这个生活方式中会给予额外#P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#!的[experience|E]积累。"
 monthly_hengeyokaigifts_lifestyle_xp_gain_mult: "每月兽妖灵赋[lifestyle|E]的[experience|E]"
 hengeyokaigifts_focus: "兽妖灵赋重心"
 hengeyokaigifts_focus_modifier: "[GetFocus('hengeyokaigifts_focus').GetName]"
 hengeyokaigifts_focus_desc: "齐心合力。"
 hengeyokaigifts_focus_effect_desc: "兽妖灵赋重心给予："
 create_element_perk_name: "化出元素"
 mindspeak_perk_name: "心语"
 sense_imbalance_perk_name: "感知失衡"
 blaze_talons_perk_name: "炽焰利爪"
 courtly_speech_perk_name: "宫廷雅言"
 waking_dream_of_unity_perk_name: "唤醒团结之梦"
 exorcism_perk_name: "驱魔"
 part_the_wall_perk_name: "分开绝壁"
 hengeyokaigifts_court_visible: "兽庭灵赋"
 MINDSPEAK_PERK_EFFECT: "可以不受任何惩罚地多学习#V 2#!门[languages|E]。\n#flavor 此灵赋在初入兽庭之人中相当常见，被视为最基本的通用沟通方式。#!\n"
 CREATE_ELEMENT_PERK_EFFECT: "#flavor 与相应元素协调的兽妖可以召唤\"月亮\"元素；此将显化为纯净的月光提供照明，通常还能带来一定程度的舒适感。#!"
 COURTLY_SPEECH_PERK_EFFECT: "#flavor 担任使者时，兽妖认为用东道主的语言交谈是礼貌之举。此灵赋使兽妖能够像当地人一样说任何一种化身种族的语言。#!"
 BLAZE_TALONS_PERK_EFFECT: "#flavor 兽妖的武艺之一，此灵赋使化形者能够点燃自己的手、爪或翼，使其攻击拥有野火般的凶猛威力。#!"
 SENSE_IMBALANCE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n你的[court_chaplain|E][convert_county|E][councillor_task|E]加快#P 25%#!。\n#flavor 此灵赋使兽妖能够将感知集中于三者之间的平衡，辨别出任何局部能量失衡的情况——无论是$glossary_triat$还是阴、阳和黄泉。#!"
 WAKING_DREAM_OF_UNITY_PERK_EFFECT: "#flavor 此灵赋可将一群兽妖连结于无声心灵通讯之中，透过向其意识投射\"清醒梦\"来传递讯息，常用于向整个朝廷同步沟通。#!"
 PART_THE_WALL_PERK_EFFECT: "#flavor 此灵赋是由无法正常小撇步的兽妖所共享的，使其能够像幸运的亲族一样轻松地进入镜像之地。#!"
 EXORCISM_PERK_EFFECT: "可将$POD_splat_wraith_plural$[POD_banish|E]至其原生[umbra|E]领域。\n你再也不会被$POD_splat_wraith_plural$附身。\n#flavor 阎魔经常派出灵类喽啰骚扰兽庭；因此，放逐邪灵的知识在兽子之间自由流传。 #!"
 walking_the_bone_road_perk_name: "沿着白骨之路行走"
 WALKING_THE_BONE_ROAD_PERK_EFFECT: "#flavor 兽妖得小撇步进入阴界一如进入阳界般轻松。#!"
 way_of_ten_thousand_cities_perk_name: "万城之道"
 WAY_OF_TEN_THOUSAND_CITIES_PERK_EFFECT: "树立新[culture_traditions|E]的基础花费减少：#P 25%#!。\n#flavor 兽妖能够顺利融入任何文化，无论该文化有多奇特或陌生。#!"