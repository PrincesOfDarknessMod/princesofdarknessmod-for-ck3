 essential_transformation_perk_name: "精华转变"
 EARTH_SENSE_PERK_EFFECT: "#F 狼族可以感觉到一个地区的“灵光”，并确定它是健康的还是虚弱的。#!"
 HERB_CALL_PERK_EFFECT: "#F 通过唱歌或吟唱，狼族可以找到有用的或药用的植物、树根或树皮，即使在沙漠等贫困地区。#!"
 OAKSONG_PERK_EFFECT: "#F 通过使用这灵赋，狼族可以与木头或其他有机物质制成的无生命物体进行交流。#!"
 LORE_OF_THE_LAND_PERK_EFFECT: "#F 通过进食、吸入或以其他方式摄入一部分土地，狼族可以感知过去发生在附近的事情。#!"
 EARTH_HEAL_PERK_EFFECT: "#F 该灵赋允许狼族帮助一块土地从枯萎、$glossary_wyrm$玷污、毒害或其他类型的环境异变中恢复。#!"
 LAMBENT_SIGHT_PERK_EFFECT: "#F 该灵赋允许狼族在通常不可见的情况下看到东西，例如完全黑暗或被蒙住眼睛。#!"
 MOONPOOL_OF_SOKHTA_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。\n#F 这种灵赋使狼族能够将清澈的积水变成月池，展现可能的未来的前景。#!"
 MOONRIVER_PERK_EFFECT: "#F 通过使用这灵赋，狼族可以迅速踏过反射着月光的水体表面。#!"
 MOONCAT_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_mooncat_modifier' ).GetNameWithTooltip|L]变形选项。\n#F 该灵赋允许狼族变成一只小白猫。这能对于进入小地方（或逃离小地方）和保持隐蔽很有用。#!"
 MOONDREAM_PERK_EFFECT: "#F 狼族可在在月光下睡着之前请求索赫塔赐予她一个预言梦。#!"
 FIND_THE_HEARTS_FLAME_PERK_EFFECT: "#F 有了这灵赋，狼族可以识别能量或力量的来源，即使它们是隐藏的或未知的。#!"
 FLAME_OF_THE_WIND_RIDER_PERK_EFFECT: "#F 这灵赋使狼族更难受到伤害，因为她会被一种鬼火般的蓝白色火焰所包裹。#!"
 RIDE_THE_SOLAR_WINDS_PERK_EFFECT: "#F 该灵赋能让狼人驾驭席卷[UmbraGlossary('aetherial_realm')]的太阳风，而不必担心被风暴吹离航向。#!"
 HAND_OF_THE_SUN_PERK_EFFECT: "#F 狼族的手发出白热光芒，散发着类似于烙铁般的可怕热量。#!"
 CLEANSING_FLAME_PERK_EFFECT: "#F 狼族可以确定一个区域（或一个人），用强烈的净化火焰点燃目标。这把火可以烧掉一个地区的所有$glossary_wyrm$玷污或人为的污染，或者净化一个人（如果受术者能活下来的话）的妖蛆玷污。#!"
 SPEED_OF_THE_MESSENGER_PERK_EFFECT: "#F 该灵赋增加了狼族的移动速度，使他能在短时间内进行长距离的跨越。#!"
 PLANETARYGIFTS_STICKY_FINGERS_PERK_EFFECT: "#F 这一招允许狼族在手指上浮现出一种银色物质，它可以粘附在任何东西上，使她能够轻松地攀登垂直表面。#!"
 PLANETARYGIFTS_DELIBERATE_MISINFORMATION_PERK_EFFECT: "#F 狼族可以在他的目标谈话中塞进令人困惑和相反的信息，使他们的计划分崩离析，或以其他方式使他们遭受严重的通信中断。#!"
 MERCURIAL_MESSENGER_PERK_EFFECT: "#F 该灵赋使偷听到谈话或被委托传递信息的狼族能够不会忘掉她所听到的内容。#!"
 MADTHOUGHT_PERK_EFFECT: "#F 狼族能使她的敌人的思维过程急剧加快，以至于他们实际上思考得太快，无法将任何一个计划付诸行动。#!"
 UNCLOAK_THE_HIDDEN_PERK_EFFECT: "#F 通过专注于一个人、一个物体或一个区域，狼族可以确定她的目标是否隐藏了什么。#!"
 SHADOW_OF_THE_EBON_WHISPERER_PERK_EFFECT: "#F 该灵赋使狼族像影子一样没有形体，也很难看到。#!"
 HIDDEN_HEART_PERK_EFFECT: "#F 该灵赋允许狼族将她所拥有的危险的知识片断锁在她的脑海中，使其在没有钥匙的情况下变得不可获取。#!"
 WHISPER_IN_THE_DARK_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F 这种天赋允许狼族确定一个对某个体不利的事实。#!"
 WHISPER_IN_THE_DARK_PERK_BONUS_VALUE: "[GetPerk('whisper_in_the_dark_perk').GetName(GetPlayer)]"
 PLANETARYGIFTS_EBON_BINDING_PERK_EFFECT: "[espionage|E]进展速度：#P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n作为[character_interaction|E]，允许你给予一个你知晓其[secrets|E]的人[GetModifier('ebon_binding_modifier').GetNameWithTooltip][modifier|E]。\n#F 该灵赋允许狼族利用她对某人的过失、做法或秘密恶习的了解，对该人进行适当的惩罚。#!"
 PLANETARYGIFTS_EBON_BINDING_PERK_BONUS_VALUE: "[GetPerk('planetarygifts_ebon_binding_perk').GetName(GetPlayer)]"
 FIND_THE_CHILD_WITHIN_PERK_EFFECT: "#F 有了这灵赋，狼族可以利用一个人对父母权威或感情的本能反应，说服这个人服从命令或对他们可能拒绝的建议作出正面的反应。#!"
 MANTLE_OF_THE_LAND_PERK_EFFECT: "#F 狼族从大气中的水中抽出雾或霭。#!"
 VEIL_OF_THE_MOTHER_PERK_EFFECT: "#F 该灵赋允许狼族在短时间内表现出不同的外观，以迷惑追捕者或逃避检测。#!"
 MOTHERLY_GUARDIAN_PERK_EFFECT: "#F 该灵赋允许狼族“标记”一个人，以便她能跟踪她的目标的健康和安康。#!"
 BRING_FORTH_THE_FUTURE_PERK_EFFECT: "#F 该灵赋允许狼族召唤坦比娅来改变个人未来的一个片段。#!"
 PLANETARYGIFTS_BATTLESENSE_PERK_EFFECT: "#F 狼族能感觉到进行攻击的最佳方向，考虑到战场的地形、敌人的数量和位置以及狼族指挥的或与她结盟的现有部队。#!"
 SHARDS_OF_ICY_RAGE_PERK_EFFECT: "#F 援引这灵赋的狼族会调用她魂怒的冷冻力量，将她的愤怒转化为物理上的冰霜。#!"
 NERIGALS_CALL_TO_ARMS_PERK_EFFECT: "#F 这灵赋允许狼族召唤任何与尼格尔结盟或亲近冰战士的灵体到她身边。#!"
 CHALLENGE_OF_SINGLE_COMBAT_PERK_EFFECT: "允许你在战争中使用向仇敌发起挑战[character_interaction|E]。\n#F 通过调用冰战士的名字并向敌人发出直接挑战，狼族可以迫使她的对手按照公平竞争的潜规则进行一对一的战斗。#!"
 HEART_OF_THE_ICE_WARRIOR_PERK_EFFECT: "允许你不死于受伤。\n#F 通常只在最危急的情况下使用，这种天赋使狼族不受伤害，足以给她的对手以最后一击。#!"
 ROUSE_TO_ANGER_PERK_EFFECT: "#F 该灵赋使狼族能够说或做一些事情，使她的目标激起她内心的魂怒。#!"
 FOETRACKER_PERK_EFFECT: "#F 通过使用这灵赋，狼族在跟踪她的猎物时不会有失去踪迹的风险。#!"
 SAVAGERY_OF_THE_TALONED_HUNTER_PERK_EFFECT: "作为[character_interaction|E]，允许你花费一点$POD_energy_gnosis$来获得两点$POD_energy_gnosis$怒。\n#F 该灵赋使狼族获得两倍魂怒的优势，从而增加攻击的凶猛程度和频率，或者使他在压力下取得比平时更多的成就。#!"
 HUNTERS_HORN_PERK_EFFECT: "#F 这灵赋使狼族能够创造出一种可怕的、令人心寒的声音，使敌人陷入彻底的恐慌，并使他们不顾方向和目的地逃离一个区域。#!"
 PACK_MIND_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('pack_mind_modifier').GetNameWithTooltip][modifier|E]。\n#F 该灵赋迫使一群敌人表现得像同一心智的群体。#!"
 AURA_OF_LEADERSHIP_PERK_EFFECT: "#F 这灵赋给狼族带来了权威灵光，使她能在短暂的时间内承担起领导的衣钵。#!"
 PROCLAMATION_OF_ACTION_PERK_EFFECT: "#F 这灵赋使狼族能够强迫结束讨论，并采取该角色认为最好的行动方案。#!"
 PLANETARYGIFTS_UNDISPUTED_RULER_PERK_EFFECT: "#F 该灵赋允许狼族接管一小群人类或一小群灵类的领导权。#!"
 ENTHRONEMENT_PERK_EFFECT: "#F 狼族可以从空气中创造出小型或纯粹的物体——包括雾、云或风。#!"
 GRAND_GESTURE_PERK_EFFECT: "#F 通过向个人或团体赠送适当的礼物，狼族在受赠者眼中增加了她的尊严和声誉。#!"
 SENSE_LIMITS_PERK_EFFECT: "#F 狼族可以确定一个人体内大约有多少魂怒、灵知或意志力。#!"
 PEACE_OF_THE_COUNSELOR_PERK_EFFECT: "解锁$purchase_truce_interaction$[interaction|E]。\n#F 该天赋使狼族能够使最激烈的讨论得到和平的结论。#!"
 PALL_OF_DESPAIR_PERK_EFFECT: "当战争开始时，你的敌人中勇武最高的骑士将会受伤。\n#F 该灵赋给目标人物带来一股绝望的情绪，使受害者因极度忧郁的感受而无法行动。#!"
 HARMONIOUS_SLUMBER_PERK_EFFECT: "#F 这灵赋使狼族即使在最困难的情况下也能创造一个完美的睡眠环境。#!"
 BURDEN_OF_KNOWLEDGE_PERK_EFFECT: "作为[character_interaction|E]，允许你使目标获得[GetModifier('murderous_frenzy_modifier').GetNameWithTooltip]，[GetModifier('change_for_better_modifier').GetNameWithTooltip]或自杀。\n#F 狼族用她自己所有的局限性知识来淹没一个人，使受害者意识到她所有的缺陷或失败，并提醒她所有已经犯下或造成的错误。#!"
 FIND_THE_PORTENT_PERK_EFFECT: "#F 有了这灵赋，狼族可以呼唤并获得一些预兆或预言，这可以帮助她决定下一步的行动。#!"
 HIDDEN_DEPTHS_PERK_EFFECT: "#F 这灵赋使狼族能够发现一些隐藏的信息，或破译一些隐秘的文字段落。#!"
 UNRAVEL_PERK_EFFECT: "#F 这灵赋使狼族能够将看似随机的信息碎片放在一起，形成对某种情况的初步分析，并制定行动方案。#!"
 BLANK_SLATE_PERK_EFFECT: "#F 狼族可以从她自己或他人的头脑中完全删除一个信息。#!"
 DIPLOMATIC_IMMUNITY_PERK_EFFECT: "#F 这灵赋使狼族能够在敌对的群体中走动，而不引起敌对行动的爆发。#!"
 THREADS_OF_THE_TAPESTRY_PERK_EFFECT: "#F 这灵赋使狼族能够确定一个看似混乱或故意混淆的状况的基本要素。#!"
 FIXIT_PERK_EFFECT: "#F 狼族能找出设备的问题所在，并进行现场维修，使该物品能够在短时间内运行或发挥作用。#!"
 TANGLING_THE_SKEIN_PERK_EFFECT: "#F 这灵赋使狼族能够在她的敌人中造成混乱，混淆他们的感知，使他们无法决定跟随谁或下一步该做什么。#!"
 SHANTARS_LOOM_PERK_EFFECT: "能够招募[GetMaA('golems').GetName]作为[men_at_arms|E]\n#F 使用这灵赋可以让狼族用灵知、魂怒或意志力提供的能量制作一些道具。#!"
 DROWN_PERK_EFFECT: "#F 这灵赋使对手的肺部充满液体。受害者必须立即接受医疗或魔法援助，否则在几分钟内死亡。#!"
 SENSE_OF_THE_TRANSFORMATION_PERK_EFFECT: "若你的任何亲朋好友本将死于死因神秘，现在将直接揭露谋杀他们的人。\n#F 有了该灵赋，狼族可以识别生物或物体的状态转变或重大变化。#!"
 SHORTEN_THE_ROAD_PERK_EFFECT: "#F 该灵赋使狼人即使在[umbra|E]中也能将正常行进时间缩短三分之一。#!"
 WYLD_SPIRITS_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('erratic_behavior_modifier').GetNameWithTooltip][modifier|E]。\n#F 狼族可以利用梅罗斯的反复无常的本性，用来使她的一个或多个对手受到无常行为的影响，从而使受害者在任何特定情况下都更难协调攻击或采取明智的行动。#!"
 SLEEPS_TRAVELS_PERK_EFFECT: "#F 通过这灵赋，狼族的灵魂可以在他的身体睡眠时前往另一个地方。#!"
 ESSENTIAL_TRANSFORMATION_PERK_EFFECT: "作为[character_interaction|E]，允许你受伤来获得$POD_energy_gnosis$。\n#F 该灵赋允许狼族将她的部分精华转化为灵知，以便在需要消耗大量灵性力量的情况下使用。#!"