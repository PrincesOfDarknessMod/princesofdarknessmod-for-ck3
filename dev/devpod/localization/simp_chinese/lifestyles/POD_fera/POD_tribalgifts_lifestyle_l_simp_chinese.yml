 TOXIC_CLAWS_PERK_EFFECT: "作为[knight|E]时，增加在[combat_phase|E]中致残敌方[knights|E]的几率。\n#flavor 黑螺旋舞者可以将毒性废料从其爪挤出，使利爪包裹在有害的绿灰黏液中。由这些利爪造成的伤口容易形成难看的伤疤。#!"
 SUMMON_WYRM_ELEMENTAL_PERK_EFFECT: "#flavor 黑螺旋舞者绕着纯粹元素碎片跳了一段短舞。舞蹈会腐蚀元素，并召唤出$glossary_wyrm$元素。#!"
 THE_WHITE_HOWL_PERK_EFFECT: "作为[commander|E]时，在[combat_phase|E]中对敌方[knights|E]；以及在[single_combat_duel_plural|E]向对手施加[GetModifier('the_white_howl_modifier_enemy').GetNameWithTooltip]；对友方[knights|E]则为[GetModifier('the_white_howl_modifier_ally').GetNameWithTooltip]。\n#flavor 曾是白嚎最神圣的赐福之一。而今，这项强大灵赋仍在黑螺旋舞者之中代代相传，作为对其狼族敌人昭示往昔的残酷象征。白嚎之声，足以撕裂妖蛆之作与那些听闻此声、骤然意识到盖亚究竟失去了多少的狼人的耳膜与心魂。#!"
 TOTEM_FORM_PERK_EFFECT: "允许变形为与你[pack_totem|E]相应的形态。\n#flavor 此强大灵赋使黑螺旋得应用其战群忌灵图腾的外观及力量。#!"
 PRELUDE_TO_APOCALYPSE_PERK_EFFECT: "解锁操纵险棘[umbra|E]行动中的拆毁险棘选项。\n#flavor 黑螺旋舞者可以在短时间内撕裂$glossary_weaver$的万古作品。此灵赋能完全撕裂险棘，将物质世界和精神世界融合为过往传说中的世界。而这片重塑区域，更将化作一道耀眼的信标，向妖蛆诸灵发出召唤，引来无数忌灵如洪流般涌至，协助黑螺旋舞者。#!"
 PRELUDE_TO_APOCALYPSE_REQUIREMENT: "@warning_icon!#X 你需要完成恶神灵君的任务以解锁技能（通过在[UmbraGlossary('black_spiral_labyrinth')]驻扎探员并进行[umbra_expedition|E]来接任务）。 #!"
 shining_sigils_perk_name: "闪耀印记"
 haunting_howl_perk_name: "作祟之嚎"
 maddening_howl_perk_name: "发狂之嚎"
 white_fire_perk_name: "白焰"
 howl_of_healing_perk_name: "治愈之嚎"
 HAUNTING_HOWL_PERK_EFFECT: "#flavor One of the howl-Gifts peculiar to the tribe, this eerie cry often echoed across the desolate moors prior to a While Howler raid.#!"
 MADDENING_HOWL_PERK_EFFECT: "Inflict #V 40#! [stress|E] to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].\n\n#flavor The supernatural quality of the White Howlers' howls was what gave them their tribal name, to say nothing of their reputation. This howl-Gift represents one of their worst howls, a terrible ululating wail that bends the minds of those who hear it to the breaking point.#!"
 WHITE_FIRE_PERK_EFFECT: "Inflict #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] [POD_aggravated_damage|E]#! to enemy [knights|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E], inflict double the amount if they serve the $glossary_wyrm$.\n\n#flavor This forgotten Gift is the last link to the sacred bone-fires that the White Howlers kept before their Fall and conversion to Balefire. The werewolf can hurl a stream of blinding white fire from his hand, searing the flesh from the bones of his foes.#!"
 HOWL_OF_HEALING_PERK_EFFECT: "#flavor The White Howler tribe is closely knit, sharing a bond rivaled by few others. This tie allows them to channel healing in a fashion others can only aspire to.#!"
 dream_of_a_thousand_cranes_perk_name: "千鹤之梦"
 fair_path_perk_name: "正路"
 storm_winds_slash_perk_name: "暴风斩"
 dark_of_night_perk_name: "夜之暗"
 living_treasure_perk_name: "活宝"
 divine_wind_perk_name: "神风"
 STORM_WINDS_SLASH_PERK_EFFECT: "[character_interaction|E]：对角色施加[POD_superficial_damage|E]，其伤势程度根据你所装备的武士刀[rarity|E]。\n#flavor 当八犬从远处挥舞武士刀时，她的对手身上出现了一道非常真实的伤口，与狼族的利爪遥相呼应。 #!"
 DARK_OF_NIGHT_PERK_EFFECT: "[character_interaction|E]：对角色施加[GetModifier('dark_of_night_perk_modifier').GetNameWithTooltip]。\n#flavor 对选定的对象造成暂时失明；他眼前只有一片漆黑。在正式决斗中使用这种灵赋被视为极大的冒犯。 #!"
 DIVINE_WIND_PERK_EFFECT: "解锁天气魔法选项：[duchy|E]范围的#V 风暴#!。\n#flavor 八犬对目标区域召唤一场可怕的风暴。 #!"
 tribalgifts_werewolf_warderofmen_focus: "人类监护者生活重心"
 tribalgifts_werewolf_warderofmen_focus_modifier: "[GetFocus('tribalgifts_werewolf_warderofmen_focus').GetName]"
 tribalgifts_werewolf_warderofmen_focus_desc: "人类监护者的部族灵赋。"
 tribalgifts_werewolf_warderofmen_focus_effect_desc: "专注于人类监护者灵赋可以获得以下奖励："
 tribalgifts_werewolf_warderofmen_visible: "[CharacterLifestyleWindow.GetCharacter.Custom( 'glasswalker_custom_name' )]"
 DREAM_OF_A_THOUSAND_CRANES_PERK_EFFECT: "#flavor 此灵赋给予使用者短期好运。#!"
 FAIR_PATH_PERK_EFFECT: "#flavor 在部族月会或仪式进行时，以蓬头垢面或未经净化的状态下出席被视为极可耻之举。此灵赋可使八犬以完美无瑕的仪容和着装示人。#!"
 LIVING_TREASURE_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花費：#P -25%#!\n#flavor 八犬珍视古代艺术品，家中通常收藏此类物品。此灵赋哄劝物品之灵使其讲述自身故事。#!"
 spiral_shadow_dance_perk_name: "螺旋影舞"
 SPIRAL_SHADOW_DANCE_PERK_EFFECT: "#flavor 黑螺旋舞者学会使自身化为黑暗蜿蜒前行，化作如尖啸般迅疾的存在。此灵赋由诸多忌灵共同传授。#!"
 TERRIFY_PERK_EFFECT: "#flavor 掌握此灵赋的黑螺旋舞者更令人畏惧。其冷笑之威摄堪比一般狼人的宏亮怒吼。#!"
 UNSEELIE_FAERIE_KIN_PERK_EFFECT: "解锁数种[POD_faerie_maa|E][men_at_arms|E]。\n#flavor 黑螺旋舞者可呼唤哀怒廷换生灵前来协助。#!"
 burning_scars_perk_name: "灼热疤痕"
 BURNING_SCARS_PERK_EFFECT: "[character_interaction|E]：对目标及自身施加火焰[POD_aggravated_damage|E]。\n#flavor 黑螺旋舞者常在身上雕刻象征着对妖蛆忠诚的风格化伤痕。此灵赋会使其伤痕发出一种黑暗的光芒，仿佛要钻进受害者的体内，从内而外地灼烧他，留下与舞者自身伤痕相似的可怕烧伤痕迹。#!"
 tribalgifts_werewolf_uktena_focus: "乌克特纳生活重心"
 tribalgifts_werewolf_uktena_focus_modifier: "[GetFocus('tribalgifts_werewolf_uktena_focus').GetName]"
 tribalgifts_werewolf_uktena_focus_desc: "乌克特纳部族灵赋。"
 tribalgifts_werewolf_uktena_focus_effect_desc: "乌克特纳赋重心给予："
 tribalgifts_werewolf_whitehowler_focus: "白嚎生活重心"
 tribalgifts_werewolf_whitehowler_focus_modifier: "[GetFocus('tribalgifts_werewolf_whitehowler_focus').GetName]"
 tribalgifts_werewolf_whitehowler_focus_desc: "白嚎部族灵赋。"
 tribalgifts_werewolf_whitehowler_focus_effect_desc: "白嚎部族重心给予："
 tribalgifts_werewolf_uktena_visible: "乌克特纳"
 banish_totem_perk_name: "放逐图腾"
 banish_totem_modifier: "放逐图腾"
 banish_totem_modifier_desc: "Targeted by a powerful Gift, this character cannot use teamwork or pack tactics anymore."
 spirit_bird_perk_name: "灵鸟"
 spirit_fish_perk_name: "灵鱼"
 uktena_invisibility_perk_name: "隐形"
 uktena_call_elemental_perk_name: "召唤元素"
 fetish_doll_perk_name: "灵具玩偶"
 SHINING_SIGILS_PERK_EFFECT: "#flavor Glowing sigils representing the Garou's tales of Renown appear upon their skin or pelt. The marks shine a luminescent woad-blue, although each Renown bears its own subtle inflection of color.#!"
 lions_bite_perk_name: "狮咬"
 LIONS_BITE_PERK_EFFECT: "Inflict #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] [POD_aggravated_damage|E]#! to enemy [knights|E] and [commanders|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E] if they have less [prowess|E] than you.\n\n#flavor Lion's children learned many things from their patron, including some hunting tactics more familiar to big cats than to wolves. The Garou with this Gift gains an unerring ability to bite down on the throat of his prey, choking it unconscious or to death, or even crushing its windpipe as lions do.#!"
 spectral_authority_perk_name: "Spectral Authority"
 SPECTRAL_AUTHORITY_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n\n#flavor The Garou is able to command any ghost or spirit she knows by their full name.#!"
 sense_of_the_deep_perk_name: "深渊之感"
 SENSE_OF_THE_DEEP_PERK_EFFECT: "#flavor Up until the Fall, Lion's tribe was convinced it was their duty to Gaia to hunt down Her enemies even beneath the surface of the earth. This Gift aided them in their endeavors to fight $glossary_wyrm$ creatures in their own burrows.#!"
 BANISH_TOTEM_PERK_EFFECT: "Inflict every ruler on the opposing side with [GetModifier('banish_totem_modifier').GetNameWithTooltip] when starting a [war|E] as the primary attacker or defender.\n#flavor Calling out ancient and powerful words, the Uktena can bar a totem from aiding its children, disrupting their sense of being part of a pack.#!"
 SPIRIT_BIRD_PERK_EFFECT: "#flavor Almost nobody expects a werewolf to soar like a bird, which is an excellent reason for the Uktena to do just that. This Gift allows a Garou to fly or hover in place.#!"
 SPIRIT_FISH_PERK_EFFECT: "#flavor The werewolf can breathe underwater, and swim as fast as he can run in Hispo form#!"
 UKTENA_INVISIBILITY_PERK_EFFECT: "Unlock a [character_interaction|E] to stop all schemes targeting you.\n#flavor By concentrating, the Garou can vanish from sight. She must walk slowly, and cannot draw attention to herself when doing so.#!"
 UKTENA_CALL_ELEMENTAL_PERK_EFFECT: "Unlock Elemental [men_at_arms|E].\n#flavor The Garou can call one of the classical elementals to his aid.#!"
 FETISH_DOLL_PERK_EFFECT: "After you perform a successful artifact or gold heist [infiltration_missions|E], the court owner who has been stolen from is inflicted three [POD_aggravated_damage_with_box|E] damage.\n#flavor The werewolf can harm her victims from afar using a specially-crafted effigy. She must have a small piece of the victim or an object belonging to him, which she must incorporate into the doll.#!"