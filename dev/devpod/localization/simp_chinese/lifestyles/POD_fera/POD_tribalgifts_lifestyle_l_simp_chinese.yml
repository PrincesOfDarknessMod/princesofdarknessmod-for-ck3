 RENEW_THE_CYCLE_PERK_EFFECT: "作为[character_interaction|E]，允许你让目标不死族沦为自然状态（化为灰尘或无法活动）。\n#F 作为狼族最强大的力量之一，这灵赋允许修正对盖亚自然循环中的严重错误。不死族的存在本身就是对自然秩序的侮辱，当受到这灵赋的力量打击时，它们会枯萎并化为尘土。无论是一具蹒跚而行的、一个月前才被复活的尸体，还是一个古老的吸血鬼，银牙只需一瞥就能摧毁它。#!"
