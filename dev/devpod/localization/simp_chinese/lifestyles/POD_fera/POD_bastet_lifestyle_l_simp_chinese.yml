l_simp_chinese:
 tribalgifts_bastet_focus: "部族灵赋重心"
 tribalgifts_bastet_focus_modifier: "[GetFocus('tribalgifts_bastet_focus').GetName]"
 tribalgifts_bastet_focus_desc: "芭丝特部族灵赋。"
 tribalgifts_bastet_focus_effect_desc: "部族灵赋重心给予："
 pathfinders_pride_perk_name: "开拓者的自豪"
 silent_stalking_perk_name: "无声潜行"
 shriek_perk_name: "尖啸"
 cheshire_prank_perk_name: "柴郡猫的恶作剧"
 freyjas_blessing_perk_name: "芙蕾雅的祝福"
 fortuna_perk_name: "命运"
 jump_to_the_moon_perk_name: "蹦到月球"
 withering_stare_perk_name: "枯竭凝视"
 PATHFINDERS_PRIDE_PERK_EFFECT: "#flavor 猫的方向感非常好。有了这一灵赋，芭丝特就能改善这一本能，在大多数迷宫、沙漠或林地中找到出路。够格的人可以从鸟灵那里学到这灵赋，但没有猫人愿意在公开场合承认自己拥有这灵赋。#!"
 SILENT_STALKING_PERK_EFFECT: "#flavor 这常见技巧可以让芭丝特在移动时不发出任何声音。即使是在吱吱作响或晃动的表面，如木地板或堆放的树枝，也能无声无息地通过。#!"
 CHESHIRE_PRANK_PERK_EFFECT: "#flavor 有远见的芭丝特发现了从众人视线中消失的秘法。这很快成为了一项宝贵而流行的技巧。#!"
 FORTUNA_PERK_EFFECT: "#flavor 猫爱他们的朋友，他们以好运闻名。这个灵赋让他们能够与他人分享一些好运，甚至可以自己使用一点好运。#!"
 SHRIEK_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('shriek_perk_modifier').GetNameWithTooltip][modifier|E]。\n#flavor 随着一声震耳欲聋的尖啸，芭丝特把附近的所有人都震聋了。#!"
 FREYJAS_BLESSING_PERK_EFFECT: "作为[character_interaction|E]，允许你使目标怀孕。\n#flavor 古老的北欧生殖与爱情女神曾乘坐猫拉的战车旅行。现在，她通过赐予某些猫民一种深厚的生育能力来纪念这种服务，如果他们愿意，可以将这种能力赐予其他人。虽然这灵赋并不能保证交配一定会生下一只芭丝特小猫，但许多猫民都声称，如果没有这份祝福，他们的同类可能会几乎灭绝。#!"
 JUMP_TO_THE_MOON_PERK_EFFECT: "#flavor 最伟大的芭丝特可以回到塞勒涅进行短期访问。通过在她的巢域与月球之间架设月桥，猫人就能前往露娜的宫殿。在那里，她可以正常呼吸和活动；只要她小心谨慎，这将是一段美好的时光。#!"
 WITHERING_STARE_PERK_EFFECT: "作为[character_interaction|E]，允许你根据自身勇武给予对方受伤特质。\n#flavor 该灵赋能让猫人通过眼光杀人，是辛巴领主和流浪的普蒙卡最喜欢的伎俩。使用此天赋对付其他芭丝特被认为是极不光彩的行为，但也偶尔发生。#!"
 sweet_hunters_smile_perk_name: "猎人的甜蜜微笑"
 cat_claws_perk_name: "猫爪"
 eavesdroppers_ear_perk_name: "窃听者之耳"
 craft_of_the_maker_perk_name: "工匠手艺"
 babels_cure_perk_name: "巴别治疗"
 monkeys_uncle_perk_name: "猴子的叔叔"
 deny_the_hungry_perk_name: "否定饥饿"
 madness_perk_name: "疯狂"
 SWEET_HUNTERS_SMILE_PERK_EFFECT: "#flavor 这个天赋赋予人子的话语自然而然的可信度和说服力，使其言辞听起来真实可信，并让人产生深深的情感共鸣。#!"
 CAT_CLAWS_PERK_EFFECT: "#flavor 通过召唤她的血脉力量，处于人形或人猫形的芭丝特可以伸出她的爪子，并像处于战争形态一样发动攻击。#!"
 EAVESDROPPERS_EAR_PERK_EFFECT: "允许你使用揭露计谋[character_interaction|E]。\n#flavor 秘密是一种重要的商品，那些努力保守秘密的人很可能隐藏着危险的东西。这灵赋被研发出来的目的就是为了找出潜在的叛徒或阴谋家。#!"
 BABELS_CURE_PERK_EFFECT: "#flavor 通过运用罗阇的力量，芭丝特能够翻译她周围的任何人类语言。#!"
 MONKEYS_UNCLE_PERK_EFFECT: "增强变形[character_interaction|E]以改变面貌。\n#flavor 芭丝特可以变得与任何其他人、其他大猫或其他芭丝特完全相似。#!"
 DENY_THE_HUNGRY_PERK_EFFECT: "作为[character_interaction|E]，允许你使目标伯爵领获得[GetModifier( 'deny_the_hungry_perk_modifier' ).GetNameWithTooltip|L]。\n#flavor 传说中，古埃及的布巴斯提曾用这灵赋来惩罚不敬的族群，使其遭受饥荒和干旱。#!"
 MADNESS_PERK_EFFECT: "作为[character_interaction|E]，允许你给予目标负面精神特质。\n#flavor 有了这灵赋，施术者可以强迫他人面对内心的恶魔，包括精神错乱和疯狂。失常的性质因人而异，但总是很严重，使受害者无法正常运作。#!"
 CRAFT_OF_THE_MAKER_PERK_EFFECT: "赞助灵感或委托制作宝物现在花费更少。\n#flavor 施法者可以将曾经有生命的物质（但非不死族！）瞬间塑造成各种物体。#!"
 kittens_cry_perk_name: "小猫的哭声"
 mark_as_mine_perk_name: "标为我的"
 killers_leap_perk_name: "杀手之跃"
 perfect_cover_perk_name: "完美掩护"
 underbelly_perk_name: "完美掩护"
 hand_of_will_perk_name: "意志之手"
 judgement_of_pestilence_perk_name: "瘟疫审判"
 revolt_of_the_land_perk_name: "大地的反抗"
 KITTENS_CRY_PERK_EFFECT: "#flavor 这个灵赋赋予使用者一种极其可怜的语调，听到的人都会不由自主地去安慰她。大多数芭丝特认为这是一个卑鄙但实用的伎俩。#!"
 MARK_AS_MINE_PERK_EFFECT: "解锁[buy_artifact_claim_interaction|E]。\n#flavor 通过向某一区域或物体喷洒她的麝香，芭丝特就能对其提出所有权要求。任何有魔法亲和的生物都会将其视为“请勿靠近！”的标志。#!"
 KILLERS_LEAP_PERK_EFFECT: "#flavor 古老的传说讲述了芭丝特如何跃过敌人，跨越河流而脚不沾水；这个灵赋就是他们做到这一点的方法之一。#!"
 PERFECT_COVER_PERK_EFFECT: "#flavor 通过在要隐藏的地点、路径或物体周围抓挠，芭丝特能够将其从正常视野和魔法视野中隐藏自己。#!"
 UNDERBELLY_PERK_EFFECT: "#flavor 通过评估敌人或障碍物，芭丝特能够感知其最薄弱的弱点。#!"
 HAND_OF_WILL_PERK_EFFECT: "#flavor 芭丝特通过意念使物体移动，仅凭目光就能举起物体或打开障碍。#!"
 REVOLT_OF_THE_LAND_PERK_EFFECT: "#flavor 芭丝特召唤周围地区的灵体来攻击入侵者。同时地形将尽其所能回应：岩石会自行滚动撞击，藤蔓舞动使人绊倒，水流将受害者吸入水底。盖亚的化身亲自教授了这个灵赋。#!"
 JUDGEMENT_OF_PESTILENCE_PERK_EFFECT: "作为[character_interaction|E]，允许你吸收疾病并释放到目标的宫廷。\n#flavor 尊重猫类的社区会发现瘟疫被驱逐而出，而其他社区则会收到疾病。必须保持平衡。#!"
 tribalgifts_bastet_bagheera_visible: "巴希拉灵赋"
 tribalgifts_bastet_bubasti_visible: "布巴斯提灵赋"
 tribalgifts_bastet_khan_visible: "可汗灵赋"
 tribalgifts_bastet_simba_visible: "辛巴灵赋"
 tribalgifts_bastet_swara_visible: "斯瓦拉灵赋"
 tribalgifts_bastet_celican_visible: "祟利坎灵赋"
 humbabas_escape_perk_name: "胡姆巴巴的逃脱"
 treeclimber_perk_name: "攀树者"
 ojas_surge_perk_name: "元气涌出"
 cobras_dance_perk_name: "眼镜蛇之舞"
 travelers_tongues_perk_name: "旅者之舌"
 the_paradox_of_time_perk_name: "时间矛盾"
 shivas_might_perk_name: "湿婆之力"
 part_the_curtain_perk_name: "分开帷幕"
 TREECLIMBER_PERK_EFFECT: "#flavor 通过伸展和磨尖自己的爪子，再调用这一灵赋，芭丝特可以攀爬任何垂直表面，从树皮到混凝土。豹子是擅长攀爬的，大多数库阿莎会首先教导这个秘技。#!"
 TRAVELERS_TONGUES_PERK_EFFECT: "#flavor 通过运用罗阇的力量，芭丝特能够翻译她周围的任何人类语言。调用抹除者的力量会使一切变成无意义的胡言乱语。#!"
 PART_THE_CURTAIN_PERK_EFFECT: "#flavor 如同四级通常灵赋：行在世界之间，这法术可以让豹子穿越到近影界。不过，此变体还能让她带其他人穿越。#!"
 HUMBABAS_ESCAPE_PERK_EFFECT: "你不会再在[siege|E]或[raid|E]中被囚禁。\n#flavor 这灵赋使得豹人能够脱臼自己的四肢，从而穿过狭小的开口。#!"
 OJAS_SURGE_PERK_EFFECT: "作为[character_interaction|E]，允许你临时增强一项属性。\n#flavor 通过引导自己体内的灵性能量，巴希拉可以将自己的体能和感知能力提升到不可思议的水平。#!"
 COBRAS_DANCE_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]\n#flavor 很久以前，一只名叫托拉的黑豹与蛇王进行了谈判。经过几周的讨论和争论，双方达成了某种共识。没人知道托拉给蛇王提供了什么秘密，但作为交易的一部分，他学会了此灵赋。此舞可以让猫看一眼就把猎物定住。#!"
 THE_PARADOX_OF_TIME_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('the_paradox_of_time_perk_modifier').GetNameWithTooltip][modifier|E]。\n#flavor 猫人向她的目标展示令人眼花缭乱的非线性叙事且时长浩瀚的视角，给予恶心和困惑，而不是启迪。#!"
 SHIVAS_MIGHT_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_shiva_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'POD_shapeshift_form_kali_modifier' ).GetNameWithTooltip|L]变形选项\n#flavor 最强大的豹人可以变身为类仿毁灭神湿婆的尤多形态。在一阵圣光中，芭丝特会变成一只十二英尺高、有六只手臂的战争形态猫人，挥舞着神秘的火焰武器，将周围的一切都摧毁，直到不剩任何能活动的东西。#!"
 alms_to_the_poor_perk_name: "施舍穷苦"
 scholars_friend_perk_name: "学者之友"
 mousemaze_perk_name: "困鼠迷宫"
 banish_cahlashs_brood_perk_name: "放逐[Glossary('卡赫拉什', 'glossary_wyrm_tt')]之子"
 the_many_tongues_of_ptah_perk_name: "卜塔的众舌"
 the_scarabs_flight_perk_name: "圣甲虫之飞"
 shadow_brethren_perk_name: "暗影同胞"
 spirit_wall_perk_name: "灵壁"
 the_fleeing_scarab_perk_name: "圣甲虫脱壳"
 ALMS_TO_THE_POOR_PERK_EFFECT: "#flavor 猫人可以召唤出一些钱或食物，通常是为了施舍给乞丐。如果猫人自己使用这些“施舍”，他会感到嘴里有苦味，双手油腻。#!"
 SCHOLARS_FRIEND_PERK_EFFECT: "#flavor 布巴斯提能够阅读摆在他面前的任何卷轴、石碑或书籍，无论其使用何种语言。但加密信息依然保持加密状态。#!"
 BANISH_CAHLASHS_BROOD_PERK_EFFECT: "#flavor 通过召唤黑暗之灵之父，布巴斯提可以命令妖蛆的灵体离去。每次布巴斯提这样做时，他的毛发都会变得更加深邃的黑色，而他的行为也变得更加……不稳定。探测妖蛆的能力在接下来的一周内会在这只芭丝特身上感知到微弱的$glossary_wyrm$痕迹。#!"
 THE_MANY_TONGUES_OF_PTAH_PERK_EFFECT: "#flavor 这个灵赋让盖亚的战士能够读懂并操控语言之灵，从而无需学习不同的语言和方言。#!"
 THE_SCARABS_FLIGHT_PERK_EFFECT: "#flavor 通过召集她自己灵魂的元素，芭丝特能够将它们暂时从身体中释放出去。此时，她的身体会进入类似死亡的恍惚状态，尽管它不会腐烂，但所有其他迹象（无论是魔法的还是其他的）都会表明这只猫已经死亡。飞行的圣甲虫看起来像一只普通的昆虫，但使用魔法感知检测时它会发出明亮的光芒。#!"
 SHADOW_BRETHREN_PERK_EFFECT: "作为[character_interaction|E]，允许你制造自己的克隆。\n#flavor 布巴斯提召唤出自己的影子复制体，在战斗中与自己并肩作战。这些影猫与布巴斯提十分相似，并拥有一些相同的能力。这种天赋由夜灵传授。#!"
 SPIRIT_WALL_PERK_EFFECT: "#flavor 布巴斯提所学到的最强大技巧之一，就是召集周围的微小灵体，并将它们汇聚成一道哀嚎的影界之墙。这种魔法通常不会让猫与灵体建立良好关系，但当布巴斯提达到这个等级时，她应当有足够的智慧来明智地使用这种力量——以及足够的力量在使用时保护自己。#!"
 MOUSEMAZE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('mousemaze_perk_modifier').GetNameWithTooltip][modifier|E]。\n#flavor 这是一种令人不安的混惑法术，会让目标失去方向感，直到他惊慌失措地四处乱跑。墙壁会移动并合拢，影子会拉长，声音会从各个角落飘到他的耳边，熟悉的地方会显得陌生而充满威胁。虽然魔法对目标周围的环境没有实际影响，但他的惊恐和困惑让他陷入疯狂，很容易成为潜伏在附近的猫人的目标。#!"
 THE_FLEEING_SCARAB_PERK_EFFECT: "允许在非自然死亡后复活。\n#F 作为布巴斯提部族最为隐秘的秘密之一，这灵赋使得猫能够将自己的灵魂抽离出来，并将其具现化，将其送离危险之地，而躯体则会死亡。灵魂通常以一只飞行圣甲虫的形式存在，它会寻找一个合适的新宿主躯体，趁其熟睡时爬进它的嘴里，然后将旧的灵魂“放置”到新的宿主中。掌握这个禁忌秘密的布巴斯提（只有不到八只这样的猫存在）在理论上是永生的，尽管这长生是以其他生命为代价的。#!"
 THE_FLEEING_SCARAB_REQUIREMENT: "@warning_icon!#X 你需要完成低语者（通过在[umbra|E]的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
 rhinos_favor_perk_name: "犀牛之宠"
 skin_of_jade_perk_name: "玉皮"
 ricepaper_walk_perk_name: "行于米纸"
 paws_of_the_raging_spirit_tiger_perk_name: "灵虎之怒爪"
 makers_charm_perk_name: "造物者的魅力"
 dragonroar_perk_name: "龙吟"
 call_to_battle_perk_name: "战争呼唤"
 thousand_thunder_strike_perk_name: "千雷击"
 RHINOS_FAVOR_PERK_EFFECT: "#flavor 通过召唤犀牛之灵，可汗虎族可以在头骨上长出一根角。尽管外观不雅，但这凸起物是一个强大的武器。#!"
 SKIN_OF_JADE_PERK_EFFECT: "#flavor 通过强大的意志力，可汗虎族的皮肤变得如翡翠般坚硬。#!"
 RICEPAPER_WALK_PERK_EFFECT: "#flavor 通过调整自己的内在能量，可汗可以在轻质或易碎的表面上行走而不受干扰，无论他穿着什么。#!"
 MAKERS_CHARM_PERK_EFFECT: "赞助灵感或委托制作宝物现在花费更少。\n#flavor 芭丝特可以将曾经有生命的物质（但非不死族！）瞬间塑造成各种物体。树木可以变成住所，鹿角可以变成长矛，兽皮可以变成盔甲，鲜花可以变成香水。#!"
 DRAGONROAR_PERK_EFFECT: "#flavor 如雷鸣般怒吼，可汗虎族可以向敌人喷出火球。#!"
 THOUSAND_THUNDER_STRIKE_PERK_EFFECT: "#flavor 可汗虎族愤怒地将双爪猛然合拢，呼唤罗阇或其化身之一（湿婆、盘古等），产生一道震波，可以摧毁建筑物或破坏不洁之灵。猫之王会在保持威严庄重的形象，将这项灵赋传授给值得信赖的虎族。#!"
 PAWS_OF_THE_RAGING_SPIRIT_TIGER_PERK_EFFECT: "#flavor 通过这灵赋，可汗将自己的气引导到爪子或手上，使其充满噼啪作响的灵力。这样，只要能看到敌人，虎人就能在[spirit_world|E]中不费吹灰之力地撕裂敌人。#!"
 CALL_TO_BATTLE_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('call_to_battle_perk_modifier').GetNameWithTooltip]。\n#flavor 如果需要的话，拥有这种灵赋的可汗可以将他的狮群引向地狱之门。#!"
 bastet_majesty_perk_name: "威压"
 submit_perk_name: "威压"
 rallying_challenge_perk_name: "集结挑战"
 fireroar_perk_name: "火哮"
 shadow_the_moons_light_perk_name: "月光之影"
 king_of_beasts_perk_name: "万兽之王"
 command_the_multitude_perk_name: "命令众生"
 rising_sun_perk_name: "旭日初升"
 royal_privilege_perk_name: "皇家特权"
 BASTET_MAJESTY_PERK_EFFECT: "#flavor 这个灵赋允许辛巴赢得他人的尊敬。它是由鲨鱼之灵传授的。#!"
 SUBMIT_PERK_EFFECT: "#flavor 辛巴只需用手指或爪子指向目标，便能迫使其跪倒。唯有意志极其坚强者才能做出挣扎和咒骂的回应。这个灵赋由天马的子嗣传授。#!"
 RALLYING_CHALLENGE_PERK_EFFECT: "作为[character_interaction|E]，允许你临时增强目标的一项属性。\n#flavor 通过向外释放内在力量，辛巴可以振作起来，完成通常在她能力范围之外的事情。随着一声震耳欲聋的呐喊，她会将自己的体力或人格力量提升到不同寻常的程度。#!"
 FIREROAR_PERK_EFFECT: "#flavor 辛巴如雷鸣般怒吼，向敌人喷出一团火焰。这燃烧的吐息将持续燃烧，直至火焰或目标被完全吞噬。#!"
 SHADOW_THE_MOONS_LIGHT_PERK_EFFECT: "#flavor 一切都有其时机，甚至隐匿也是如此。作为夜行猎手，猫之王们精通一种秘术，可以在接近时让光线变暗。虽然无法真正熄灭月光，但这个灵赋可以同样有效地压制自然、魔法以及人造的光源。#!"
 COMMAND_THE_MULTITUDE_PERK_EFFECT: "#flavor 与一级灵赋“服从”类似，但它会影响方圆200英尺内的所有人，并且需要使用灵知。#!"
 KING_OF_BEASTS_PERK_EFFECT: "#flavor 辛巴的权威甚至能延伸到所有野兽，使他能够命令方圆300英尺内所有动物的忠诚。如果成功，这些动物将愿意并无条件地遵从他的命令。#!"
 RISING_SUN_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。\n#flavor 有人说，狮子心中装着太阳，这句话也许可不止是诗歌比喻。有些强大的辛巴甚至在夜晚也能让周围的土地洒满阳光。#!"
 ROYAL_PRIVILEGE_PERK_EFFECT: "允许无需相应[trait|E]或[faith|E]就能点选其他血种和部族灵赋。\n#F 这被深深鄙视的把戏使得一只古老而强大的狮子能够窃取其他猫人的灵赋，甚至是那些传统上只属于特定部族或血种的灵赋。黑牙通过这个致命的秘密积聚了很多力量。那些曾经遇见过他的人声称，他通过杀死其他芭丝特，并在他们灵魂将逝之际从他们的灵魂中夺取他们的秘密来发动自己的“特权”。虽然可能还有其他芭丝特知道这灵赋，但他们并不会有很多朋友。#!"
 ROYAL_PRIVILEGE_REQUIREMENT: "@warning_icon!#X 你需要完成抹除者（通过在[umbra|E]的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
 diamond_claws_perk_name: "金刚爪"
 impalas_flight_perk_name: "斑羚飞渡"
 walking_between_worlds_perk_name: "行在世界之间"
 dance_of_the_chaya_perk_name: "察雅之舞"
 clearwater_passage_perk_name: "清水通道"
 ghost_caress_perk_name: "鬼魂爱抚"
 river_of_blood_perk_name: "血河"
 all_beasts_under_the_sun_perk_name: "日下万兽"
 DIAMOND_CLAWS_PERK_EFFECT: "#flavor 芭丝特通过爪子划过石头、钢铁或其他坚硬表面，将其磨砺得锋利如刀。这项灵赋由猫或熊之灵教授。#!"
 IMPALAS_FLIGHT_PERK_EFFECT: "#flavor 芭丝特能够将她的奔跑速度加倍。这项天赋由走鹃或猎豹之灵教授。#!"
 RIVER_OF_BLOOD_PERK_EFFECT: "#flavor  数万年来，非洲的土地已被鲜血浸染。通过这个灵赋，斯瓦拉可以通过土壤汇聚那流逝的鲜血，并赋予它形态，创造一个血池、一条血河、一团触手，或其他形态的存在。#!"
 WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor 有些传说是郊狼神教芭丝特小撇步的；有些则坚持认为这是从狼族那里偷学来的。无论如何，这灵赋都能让猫人像狼族一样走进[umbra|E]。#!"
 DANCE_OF_THE_CHAYA_PERK_EFFECT: "解锁$seek_aid_of_the_spirits_decision$[decision|E]。\n#flavor 芭丝特能给予灵类的最大恩惠之一就是有机会暂时给予其的肉身。虽然大多数猫都不会考虑这种“借用”，但许多斯瓦拉都将自愿附身视为一种服务，而不是苦差事。这灵赋以狂热的舞蹈开始，它允许一位察雅进入猫人体内并暂时“控制”它。灵魂得到了一个可以驾驭的身体，而猫人则得到了某些……好处。与其说此舞是一种奴役，不如说是一种爱或感情的表达——很少有芭丝特会理解这感情。#!"
 CLEARWATER_PASSAGE_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L]变形选项\n#flavor 通过将自己变成液体，斯瓦拉可以穿过障碍而不完全进入[umbra|E]。她就像水一样，可以淌过裂缝，渗入障碍物周围，浸透材料。#!"
 GHOST_CARESS_PERK_EFFECT: "作为[character_interaction|E]，允许你根据宣称的宝物稀有度给予对方受伤特质。\n#flavor 斯瓦拉可以使用共情魔法将情感传到远处。虽然这魔法不会对目标造成身体伤害，但却会让他发疯，因为幻痛或幻乐会无缘无故地侵袭他。#!"
 ALL_BEASTS_UNDER_THE_SUN_PERK_EFFECT: "允许变身为数种动物。\n#flavor 拥有此灵赋的芭丝特可以将自己变成小鸟和野牛大小之间的任何动物。芭丝特会获得所模仿动物的所有特殊能力（飞行、鳃、毒、感官能力等）。#!"
 not_kinfolk_tt: "#N 兽嫡无法获得此能力或任何在它之上的能力#!\n"
 mothers_blessing_curse_perk_name: "母亲的祝福/诅咒"
 satyrs_wisdom_perk_name: "萨堤尔的智慧"
 banish_burning_perk_name: "放逐燃烧"
 sorcerers_blade_perk_name: "术士之刃"
 phantasm_perk_name: "幻影"
 small_cousin_perk_name: "小表亲"
 chariot_of_lions_perk_name: "狮之战车"
 the_madness_of_crowds_perk_name: "群众的疯狂"
 SATYRS_WISDOM_PERK_EFFECT: "#flavor 祟利坎能够弹奏任何乐器，如同从小就在手中操练一般。#!"
 BANISH_BURNING_PERK_EFFECT: "#flavor 曾几何时，人类驯服了火，用以取暖并驱赶野兽，这成为了他们与火焰诸灵之间的古老契约。当芭丝特触碰火焰时，火焰诸灵便会抑制它们的饥渴。#!"
 PHANTASM_PERK_EFFECT: "#flavor 芭丝特能够创造一个静止的幻象，其中包含视觉、听觉、嗅觉，甚至触觉元素。一个谷物精灵——所谓的“诸灵之灵”——会教导这项灵赋。#!"
 CHARIOT_OF_LIONS_PERK_EFFECT: "#flavor 这个不那么微妙的灵赋让祟利坎能够召唤一辆由巨型猫拉动的战车。就像女神芙蕾雅的猫车一样，这辆战车由粗糙的木材制成，木材上面满是北欧的图案。拉动战车的两只巨猫跑得和普通汽车一样快，甚至在紧急情况下，能载着祟利坎和一名乘客飞行片刻。只有猫族之女主能传授这个灵赋；如果未经她的许可学习此技，将被视为一种极大的冒犯。#!"
 MOTHERS_BLESSING_CURSE_PERK_EFFECT: "作为[character_interaction|E]，允许你给予怀孕目标[GetModifier( 'mothers_blessing_perk_modifier' ).GetNameWithTooltip|L]或[GetModifier( 'mothers_curse_perk_modifier' ).GetNameWithTooltip|L]。\n#flavor 民间传说认为，猫有能力给予孕妇祝福或诅咒。在祟利坎上，这个传说是真的。善良的芭丝特会给孕妇带来好处，而邪恶的芭丝特则会以某种微小但令人难忘的方式伤害孕妇。#!"
 SORCERERS_BLADE_PERK_EFFECT: "$unlock_enhancing_node$[GetModifier('sorcerers_blade_modifier').GetNameWithTooltip]\n#flavor 猫人可以为刃具附魔，使其具有超自然的威力。#!"
 SMALL_COUSIN_PERK_EFFECT: "解锁[GetModifier( 'POD_shapeshift_form_cat_modifier' ).GetNameWithTooltip|L]变形选项\n#flavor 祟利坎获得了变形为家猫的能力。虽然这种形态在生理上并不十分有用，但却非常不显眼。#!"
 THE_MADNESS_OF_CROWDS_PERK_EFFECT: "作为[character_interaction|E]，允许启动[GetModifier( 'lunatic_summon_modifier' ).GetNameWithTooltip|L]。\n能够招募[GetMaA('maniacs').GetName]作为[men_at_arms|E]。\n#flavor 此灵赋会召唤一大群邪恶灵类，挑起城市居民的暴力骚乱。该灵赋利用了城市中落魄者（无家可归者、穷人甚至流浪动物）的仇恨和恐惧。#!"