l_simp_chinese:
 urgetaints_lifestyle_name: "恶惑污染"
 urgetaints_lifestyle_desc: "这些黑暗灵赋乃是恶惑蛆赐予寻求力量者，然而这些永远都伴随代价。"
 urgetaints_lifestyle_highlight_desc: "因为你的[GetModifier('POD_gnosis_5_modifier').GetNameWithTooltip]，你在此生活方式获得#P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#!更多[experience|E]。"
 monthly_urgetaints_lifestyle_xp_gain_mult: "每月恶惑污染[lifestyle|E]的[experience|E]"
 urgetaints_physical_visible: "身"
 urgetaints_mental_visible: "心"
 URGETAINTS_REQ: "@warning_icon!#X 恶惑污染[lifestyle_experience|E]从探索[UmbraGlossary('malfeas')]中的特定界域获得。#!"
 malformed_flesh_perk_name: "畸变之肉"
 MALFORMED_FLESH_PERK_EFFECT: "#flavor 血肉干燥硬化，形成一层保护性的甲壳。#!"
 malformed_muscle_perk_name: "畸变之肌"
 MALFORMED_MUSCLE_PERK_EFFECT: "#flavor 肌肉不成比例地变得巨大强壮，使人能够展现出惊人之力。#!"
 malformed_bone_perk_name: "畸变之骨"
 MALFORMED_BONE_PERK_EFFECT: "#flavor 骨骼变得强壮有力，足以抵御时间的侵蚀。#!"
 bestial_limbs_perk_name: "兽化之肢"
 BESTIAL_LIMBS_PERK_EFFECT: "变形为$glossary_fera$的天生动物型态不再花费$POD_energy_gnosis$。\n#flavor 即使处于人形你的肢体仍能维持兽化外表，变形时所需改变之处更少。#!"
 forked_tongue_perk_name: "岔裂之舌"
 FORKED_TONGUE_PERK_EFFECT: "可无惩罚地额外学习#V 1#!门[language|E]。\n#flavor 谎话在那结束和另一个谎话在哪开始，没人说得清。#!"
 reversed_eye_perk_name: "反向之眼"
 REVERSED_EYE_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor 脑后有只眼，就没东西能偷袭你了。#!"
 bane_stomach_perk_name: "忌灵之胃"
 BANE_STOMACH_PERK_EFFECT: "解锁吞食[execution|E]。\n吞食角色将给予你所有忌灵[spirit_companions|E][trait_level_track_xp|E]。\n#flavor 被吞噬者的精华将滋养的不仅是你的血肉之躯。#!"
 BANE_STOMACH_REASON: "\"$bane_stomach_perk_name$：$VALUE|+=0$\""
 thundering_throat_perk_name: "轰鸣之喉"
 THUNDERING_THROAT_PERK_EFFECT: "邀请加入[court|E]接受度：#P +10#!\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手(如果对方[intimidated|E]你)[GetModifier('wyrm_thundering_throat_modifier').GetNameWithTooltip]和#V 30#![stress|E]。\n#flavor 有着能够撼动地球的声音，你的宣誓将被听见。#!"
 THUNDERING_THROAT_INVITE: "[GetPerk('thundering_throat_perk').GetName(GetPlayer)]：$VALUE|=+0$"
 profaned_lungs_perk_name: "亵渎之肺"
 PROFANED_LUNGS_PERK_EFFECT: "与[GetPlayer.Custom('PODCoterieNoTooltip')]训练[journey|E]速度：#P +25%#!\n#flavor 随着空气灌入你那巨大的肺部，你便能达到完美耐力，但受益者并非你。#!"
 unholy_heart_perk_name: "不洁之心"
 UNHOLY_HEART_PERK_EFFECT: "[POD_health_track|E]生命格：#P +1#!\n减少[POD_aggravated_damage|E]转变至[POD_superficial_damage|E]时间：#V 1#!年。\n#flavor 又一被妖蛆占有的肉体。 #!"
 dominance_perk_name: "至高掌控"
 DOMINANCE_PERK_EFFECT: "#flavor 让他们见识你的过人之处。#!"
 indulgence_perk_name: "纵欲狂欢"
 INDULGENCE_PERK_EFFECT: "#flavor 去吧，这是你应得的。#!"
 obsession_perk_name: "痴迷不悟"
 OBSESSION_PERK_EFFECT: "解锁[GetScheme('abduct').GetTypeName][scheme|E]\n#flavor 你必须得到它，无论付出多大的代价。#!"
 warped_reflection_perk_name: "扭曲倒影"
 WARPED_REFLECTION_PERK_EFFECT: "#flavor 你的倒影变得模糊难辨，但你坚信自己依旧光彩夺目。#!"
 dancing_shadows_perk_name: "影舞随行"
 DANCING_SHADOWS_PERK_EFFECT: "[character_interaction|E]：对一名角色造成#V 1-3#![POD_superficial_damage|E]。\n#flavor 你的影子偶尔会离开你向仇敌发起攻击，至少你是这么认为的。#!"
 fragmented_psyche_perk_name: "精神分裂"
 FRAGMENTED_PSYCHE_PERK_EFFECT: "#flavor 精神分裂之后，你实现目标的效率会大幅提升。当然，是你自己的目标。#!"
 splintered_soul_perk_name: "灵魂碎裂"
 SPLINTERED_SOUL_PERK_EFFECT: "[character_interaction|E]：创造一个你自己的[ancestor_spirit|E]分身。\n#flavor 灵魂凝为独立实体，只为更好地侍奉它的主人。#!"
 maniacal_mind_perk_name: "癫狂心智"
 MANIACAL_MIND_PERK_EFFECT: "[character_interaction|E]：增加一名角色对你的[opinion|E]，同时给予其[stress|E]。\n$countermeasures_unlocks_t3_mental_fortress$\n#flavor 沉溺于妄想之中的心智固若金汤，与现实彻底隔绝。#!"
 sanguine_spirit_perk_name: "浴血之魂"
 SANGUINE_SPIRIT_PERK_EFFECT: "强化忌灵现在只对你造成#V 1#![POD_aggravated_damage|E]。\n能招募[GetMaA('nexus_crawlers').GetName][men_at_arms|E]。\n#flavor 你的灵魂散发着黑暗辐光，吸引着相似诸灵。 #!"
 embrace_oblivion_perk_name: "拥抱湮灭"
 EMBRACE_OBLIVION_PERK_EFFECT: "[character_interaction|E]：使[wyrm_tainted|E]的$glossary_fera$完全向$glossary_wyrm$堕落。\n解锁[investiture_lifestyle|E][lifestyle|E]。\n#flavor 又一被妖蛆占有的灵魂。 #! "