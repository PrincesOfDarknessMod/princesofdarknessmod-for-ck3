l_simp_chinese:
 razor_claws_perk_name: "剃刀爪"
 RAZOR_CLAWS_PERK_EFFECT: "#flavor 莫科莱会用爪子在石头、钢铁或其他坚硬表面上摩擦，使爪子变得像剃刀一样锋利。 #!"
 talk_perk_name: "对话"
 TALK_PERK_EFFECT: "可以不受任何惩罚地学习额外#V 1#!门[language|E]。\n#flavor 此灵赋使莫科莱在龙子或半龙型形态下能够说出他所知的任何人类语言。 #!"
 blessings_of_the_nest_perk_name: "育生之赐"
 BLESSINGS_OF_THE_NEST_PERK_EFFECT: "可以招募[GetMaA('crocodiles').GetName][men_at_arms|E]。\n#flavor 莫科莱用龙语嘶声祝福，赐予多产的赠礼。 #!"
 mokole_axis_mundi_perk_name: "世界轴心"
 MOKOLE_AXIS_MUNDI_PERK_EFFECT: "#flavor 莫科莱用其灵魂去感受盖亚的存在，专注于自身与玉母的联系。#!"
 dragonfear_perk_name: "龙威"
 DRAGONFEAR_PERK_EFFECT: "#flavor 莫科莱展现出全部的恐怖力量──露出牙齿或利爪，发出咆哮，或只是阴森森地俯视着敌人。#!"
 mokole_walking_between_worlds_perk_name: "行在世界之间"
 MOKOLE_WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor 莫科莱能够突破险棘，进入影界。不过在穿越时，他应当警惕[innocents|E]。#!"
 dragons_breath_perk_name: "龙息"
 DRAGONS_BREATH_PERK_EFFECT: "解锁新的[single_combat_duel|E]招式。\n#flavor 莫科莱向其敌人吐出火焰。 #!"
 cocoon_perk_name: "魔茧"
 COCOON_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor 莫科莱将自己包裹在厚厚的、不透明的几丁质石棺中，虽然无法动弹，但也使其几乎不受伤害。#!"
 serenity_perk_name: "宁静"
 SERENITY_PERK_EFFECT: "#flavor 即使在战斗之中，莫科莱也能用盖亚的宁静注满炽热的心灵。#!"
 grasp_the_beyond_perk_name: "掌握彼方"
 GRASP_THE_BEYOND_PERK_EFFECT: "可在[umbra|E]中变形，并维持变形形态。\n#flavor 莫科莱可携带物品进出影界，而无需先将其绑定自身。#!"
 song_of_the_great_beast_perk_name: "巨兽之歌"
 SONG_OF_THE_GREAT_BEAST_PERK_EFFECT: "在[war|E]中作为主要攻击方或防御方时，施加强大的负面[modifier|E]予敌方[rulers|E]，其强度根据你的[GetTrait('mokole').GetName(GetNullCharacter)]位阶。\n#flavor 莫科莱前往幽深的荒野，发出悠长而哀伤的咆哮。一只上古巨兽回应其召唤，出现在蜥裔附近的界域。#!"
 streamgifts_lifestyle_name: "源流灵赋"
 streamgifts_lifestyle_desc: "莫科勒的四条源流，皆由其栖息地的特质与当地的爬行亲族所塑造。"
 streamgifts_lifestyle_highlight_desc: "由于你的$POD_energy_gnosis$，这个生活方式中会给予额外#P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#!的[experience|E]积累。"
 monthly_streamgifts_lifestyle_xp_gain_mult: "每月源流灵赋[lifestyle|E]的[experience|E]"
 streamgifts_mokole_mbembe_visible: "莫科莱-姆贝姆贝灵赋"
 streamgifts_gumagan_visible: "古玛甘灵赋"
 streamgifts_makara_visible: "摩迦罗灵赋"
 streamgifts_zhong_lung_visible: "中龙灵赋"
 streamgifts_mokole_mbembe_focus: "莫科莱-姆贝姆贝重心"
 streamgifts_mokole_mbembe_focus_modifier: "[GetFocus('streamgifts_mokole_mbembe_focus').GetName]"
 streamgifts_mokole_mbembe_focus_desc: "战士源流的馈赠"
 streamgifts_mokole_mbembe_focus_effect_desc: "专注于莫科莱-姆贝姆贝灵赋可以获得以下奖励："
 streamgifts_gumagan_focus: "古玛甘重心"
 streamgifts_gumagan_focus_modifier: "[GetFocus('streamgifts_gumagan_focus').GetName]"
 streamgifts_gumagan_focus_desc: "先源源流的馈赠"
 streamgifts_gumagan_focus_effect_desc: "专注于古玛甘灵赋可以获得以下奖励："
 streamgifts_makara_focus: "摩迦罗重心"
 streamgifts_makara_focus_modifier: "[GetFocus('streamgifts_makara_focus').GetName]"
 streamgifts_makara_focus_desc: "众庶源流的馈赠"
 streamgifts_makara_focus_effect_desc: "摩迦罗灵赋重心给予："
 streamgifts_zhong_lung_focus: "中龙灵赋重心"
 streamgifts_zhong_lung_focus_modifier: "[GetFocus('streamgifts_zhong_lung_focus').GetName]"
 streamgifts_zhong_lung_focus_desc: "哲人源流的馈赠"
 streamgifts_zhong_lung_focus_effect_desc: "中龙灵赋重心给予："
 NEEDS_MOKOLE_MBEMBE_STREAM: "@warning_icon!#X 你的源流灵赋必须是莫科莱-姆贝姆贝#!"
 NEEDS_GUMAGAN_STREAM: "@warning_icon!#X 你的源流灵赋必须是古玛甘#!"
 NEEDS_MAKARA_STREAM: "@warning_icon! #X 你的源流灵赋必须是摩迦罗#!"
 NEEDS_ZHONG_LUNG_STREAM: "@warning_icon!#X 你的源流灵赋必须是中龙#!"
 speed_of_thought_perk_name: "思绪疾速"
 SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor 莫科莱能够将她的奔跑速度加倍。#!"
 sense_dissolver_perk_name: "感知[Glossary('妖蛆', 'glossary_wyrm_tt')]"
 SENSE_DISSOLVER_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor 莫科莱能感知附近[Glossary('解体者', 'glossary_wyrm_tt')]的迹象。 #!"
 silver_claws_perk_name: "真银之爪"
 SILVER_CLAWS_PERK_EFFECT: "[character_interaction|E]：給予你3年的[GetModifier('POD_mokole_silver_claws_modifier').GetNameWithTooltip]。\n#flavor 露娜派遣她的孩子們去教導那些贏得她青睞的戰士們這種強大卻痛苦的灵赋。祈求后，莫科莱的爪子會轉變成銀。#!"
 bark_of_the_mudpuppy_perk_name: "泥螈之吼"
 BARK_OF_THE_MUDPUPPY_PERK_EFFECT: "解锁新的[single_combat_duel|E]招式。\n#flavor 此灵赋让莫科莱能够对着任何人或物品大声嗥叫，粉碎玻璃，劈开轻木，甚至在活物身上造成伤口。 #!"
 beak_of_the_finch_perk_name: "雀鸟之喙"
 BEAK_OF_THE_FINCH_PERK_EFFECT: "#flavor 为了生存，莫科莱会适应新的环境。他们透过改变自身形态来达成目标。#!"
 heat_wave_perk_name: "热浪"
 HEAT_WAVE_PERK_EFFECT: "#flavor 莫科莱能够将太阳之神的炽热力量释放出来，用来焚烧敌人。#!"
 walk_into_my_eyes_perk_name: "凝视我眼眸"
 WALK_INTO_MY_EYES_PERK_EFFECT: "[character_interaction|E]：强制与目标[truce|E]。当停战到期时，目标其一[personality_traits|E]会转变成相反特质。\n#flavor 此强大灵赋迫使目标从莫科莱的角度看待世界。在此期间，他将无法攻击莫科莱。恢复意识后，目标往往会发生深刻的改变。#!"
 songlines_perk_name: "歌之径"
 SONGLINES_PERK_EFFECT: "#flavor 此灵赋以歌谣覆盖大地。古玛甘可以借助传说，从班达扬的一端航行至另一端。#!"
 dreamwalk_perk_name: "梦行术"
 DREAMWALK_PERK_EFFECT: "可操纵险棘。\n#flavor 古马甘能凭借它与沉梦时代的连接削弱险棘。#!"
 bunyips_boom_perk_name: "本耶普之吼"
 BUNYIPS_BOOM_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_mokole_bunyips_boom_modifier').GetNameWithTooltip]。\n#flavor 古玛甘得进入龙梦并模仿本耶普的哀鸣。 #!"
 landspeak_perk_name: "大地之歌"
 LANDSPEAK_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n每三年有机会被动地获知你一位[vassals|E]的[secret|E]。\n#flavor 透过仔细聆听，古玛甘人可以听到地球的歌声。 #!"
 nightmare_mnesis_perk_name: "噩梦追忆"
 NIGHTMARE_MNESIS_PERK_EFFECT: "[character_interaction|E]：强迫一名角色遭受[mental_break|E]。\n#flavor 古玛甘可以用龙梦克制任何敌人，迫使其回忆起自己所犯下的暴行。#!"
 bilabong_walk_perk_name: "水域漫步"
 BILABONG_WALK_PERK_EFFECT: "#flavor 古玛甘利用此灵赋，以水体为捷径，成功地穿越了大片地形。 #!"
 bloody_mindedness_perk_name: "嗜血执念"
 BLOODY_MINDEDNESS_PERK_EFFECT: "当你有[nemesis|E]获得[GetModifier('POD_mokole_bloody_mindedness_nemesis_modifier').GetNameWithTooltip]；[rival|E]则为获得[GetModifier('POD_mokole_bloody_mindedness_rival_modifier').GetNameWithTooltip]。\n#flavor 古玛甘可以\"将自己指向\"所选定的目标或敌人。她将追随这个目标直至死亡，甚至死后。#!"
 sense_prey_perk_name: "感知猎物"
 SENSE_PREY_PERK_EFFECT: "减少狩猎[activity|E]花费：#P ‑10%#!\n#flavor 此灵赋让蜥裔定位到足够猎物以喂饱其亲巢。#!"
 SENSE_PREY_REASON: "$sense_prey_perk_name$：$VALUE|+=0$"
 scent_of_sweet_nectar_perk_name: "甜美花蜜之香"
 SCENT_OF_SWEET_NECTAR_PERK_EFFECT: "[character_interaction|E]：赋予一名角色[GetModifier('POD_mokole_scent_of_sweet_nectar_modifier').GetNameWithTooltip]。\n可以招募[GetMaA('insects').GetName][men_at_arms|E]。\n#flavor 莫科莱的受害者开始散发出一种美妙的甜香。各种各样的害虫迅速出现，覆盖在受害者身上。这层由蚊蚋、苍蝇、蜜蜂和甲虫组成的\"外套\"会爬行、叮咬，并严重损害其视力和听力。#!"
 shed_perk_name: "蜕皮"
 SHED_PERK_EFFECT: "越狱[decision|E]成功率提升。\n#flavor 莫科莱可以脱掉一层皮和/或羽毛，轻松地从对手的掌握中挣脱或逃脱束缚。 #!"
 waxwork_monster_perk_name: "蜡像怪物"
 WAXWORK_MONSTER_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$\n#flavor 此灵赋莫科莱利用\"恐龙已经灭绝\"这一事实，隐身于众目睽睽之下。 #!"
 view_the_seed_perk_name: "直视因果"
 VIEW_THE_SEED_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n[character_interaction|E]：发现一名角色的随机[scheme|E]或[secret|E]。\n#flavor 此灵赋源自于这样的信念：被孕育的万物不过是理念或存在的梦境。它使使用者能看见任何事物的\"源种\"，从孩子的父母到阴谋的策划者，无所不包。#!"
 the_thousand_arrows_perk_name: "千箭术"
 THE_THOUSAND_ARROWS_PERK_EFFECT: "#flavor 此灵赋可以让摩迦罗神射手在投射物飞行途中大幅增加其数量。#!\n"
 great_as_a_white_hill_perk_name: "白丘巨躯"
 GREAT_AS_A_WHITE_HILL_PERK_EFFECT: "#flavor 摩迦罗可以增长到正常体型的三倍，也可以缩小到小型沼泽鳄的大小。#!\n"
 dragon_milk_perk_name: "龙乳"
 DRAGON_MILK_PERK_EFFECT: "[character_interaction|E]：治疗另一角色1[POD_aggravated_damage_with_box|E]。\n#flavor 中龙透过血液注入灵力，治愈其他任何生物的伤口。 #!"
 chiih_ming_perk_name: "气鸣"
 CHIIH_MING_PERK_EFFECT: "#flavor 此灵赋使中龙得御风而行。#!"
 clap_of_thunder_perk_name: "雷鸣掌"
 CLAP_OF_THUNDER_PERK_EFFECT: "解锁新的[single_combat_duel|E]招式。\n#flavor 中龙双手拍击，发出震耳欲聋的雷鸣令所有听到的人眩晕。#!\n"
 the_dragons_tongue_perk_name: "龙舌"
 THE_DRAGONS_TONGUE_PERK_EFFECT: "[character_interaction|E]：对另一角色施加最多2[POD_aggravated_damage_with_box|E]。\n#flavor 中龙呼唤闪电攻击其敌人。#!"
 anger_of_the_wani_perk_name: "和迩之怒"
 ANGER_OF_THE_WANI_PERK_EFFECT: "解锁天气魔法选项：#V 风暴#!和#V 暴风雪#!\n#flavor 中龙几乎可以召唤任何她想要的天气现象，浓雾、龙卷风、暴风雪和雷暴都等待着其召唤。#!"
 sleep_of_hsi_wang_mu_perk_name: "西王母之眠"
 SLEEP_OF_HSI_WANG_MU_PERK_EFFECT: "#flavor 此灵赋使中龙进入休眠状态，集中生命力以延长其寿命。#!\n"
 a_thousand_secret_faces_perk_name: "万千秘面"
 A_THOUSAND_SECRET_FACES_PERK_EFFECT: "[character_interaction|E]：使你能修改自身[personality_traits|E]或复制其他角色外观。\n#flavor 此灵赋使中龙能够完美地变成任何年龄、种族或地位的人。#!"
 solar_auspicegifts_lifestyle_name: "日兆灵赋"
 solar_auspicegifts_lifestyle_desc: "专注于与你的日兆相随的灵赋。"
 solar_auspicegifts_lifestyle_highlight_desc: "由于你的$POD_energy_gnosis$，这个生活方式中会给予额外#P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#!的[experience|E]积累。"
 monthly_solar_auspicegifts_lifestyle_xp_gain_mult: "每月日兆灵赋[lifestyle|E][experience|E]"
 solar_auspicegifts_rising_sun_visible: "初阳"
 solar_auspicegifts_noonday_sun_visible: "正阳"
 solar_auspicegifts_setting_sun_visible: "斜阳"
 solar_auspicegifts_midnight_sun_visible: "夜阳"
 solar_auspicegifts_shrouded_sun_visible: "遮阳"
 solar_auspicegifts_decorated_sun_visible: "饰阳"
 solar_auspicegifts_eclipsed_sun_visible: "蚀阳"
 solar_auspicegifts_focus: "日兆灵赋重心"
 solar_auspicegifts_focus_modifier: "[GetFocus('solar_auspicegifts_focus').GetName]"
 solar_auspicegifts_focus_desc: "伟大的太阳"
 solar_auspicegifts_focus_effect_desc: "日兆灵赋重心给予："
 RISING_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('rising_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('vasanta').GetName(GetPlayer)]#!"
 NOONDAY_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('noonday_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('nam_hsia').GetName(GetPlayer)]#!"
 SETTING_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('setting_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('tung_chun').GetName(GetPlayer)]#!"
 MIDNIGHT_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('midnight_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('hemanta').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('pei_tung').GetName(GetPlayer)]#!"
 SHROUDED_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('shrouded_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('zarad').GetName(GetPlayer)]#!"
 DECORATED_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('decorated_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('grisma').GetName(GetPlayer)]#!"
 ECLIPSED_SUN_PERK_REQ: "@warning_icon!#warning 要求下列特质之一：\n$BULLET_WITH_TAB$[GetTrait('eclipsed_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('sai_chau').GetName(GetPlayer)]#!"
 bellow_perk_name: "咆哮"
 BELLOW_PERK_EFFECT: "莫科莱发出一声震天动地、令人胆寒的爬行动物般的咆哮。"
 master_of_fire_perk_name: "烈焰之主"
 MASTER_OF_FIRE_PERK_EFFECT: "获得对火焰伤害的免疫能力。\n#flavor   莫科莱想起了与诸灵所订立的古老契约。在怒嚎末日的最后烈焰逼近之际，为自己披上护盾。#!"
 eye_of_the_raptor_perk_name: "猛禽之眼"
 EYE_OF_THE_RAPTOR_PERK_EFFECT: "#flavor 莫科勒可清晰洞察数英里外的景象。#!"
 paint_the_meadows_perk_name: "血染草甸"
 PAINT_THE_MEADOWS_PERK_EFFECT: "#flavor 科勒可发出凄厉呻吟引诱猎物靠近。#!"
 call_the_tides_perk_name: "呼唤潮汐"
 CALL_THE_TIDES_PERK_EFFECT: "解锁天气魔法选项：#V 洪水#!\n如果你有[GetPerk('flood_the_land_perk').GetName(GetPlayer)]减少#V 洪水#!花费并增加持续时间\n#flavor 此灵赋使莫科莱能够随心所欲地操控潮汐。 #!"
 might_of_kings_perk_name: "龙王之力"
 MIGHT_OF_KINGS_PERK_EFFECT: "作为[knight|E]时，增加[combat_phase|E]中伤害敌方[knights|E]的几率。\n#flavor 莫科莱使用这种力量，你能极大地增强自己的力量，以便更好地击败敌人。。#!"
 lash_of_ages_perk_name: "万古鞭笞"
 LASH_OF_AGES_PERK_EFFECT: "#flavor 初阳可摧毁任何人造物质。#!"
 scream_of_gaia_perk_name: "盖亚的尖啸"
 SCREAM_OF_GAIA_PERK_EFFECT: "[character_interaction|E]：对你目标的所有[knights|E]施加1[POD_superficial_damage_with_box|E]。\n#flavor 莫科莱发出可怕嘶哑的尖叫，其中充满了盖亚的愤怒和痛苦。#!"
 jointsnakes_mojo_perk_name: "关节蛇的巫咒"
 JOINTSNAKES_MOJO_PERK_EFFECT: "#flavor 莫科勒无需接触断肢，肢体便会自行蠕动回归残肢处重新接合。#!"
 wall_of_granite_perk_name: "花岗岩之墙"
 WALL_OF_GRANITE_PERK_EFFECT: "$unlock_forging_node$[GetModifier('shards_of_granite_modifier').GetNameWithTooltip]\n#flavor 接触大地或岩石时，升阳可召唤护墙自保。#!"
 truth_of_olodumare_perk_name: "奥乐杜马尔的真理"
 TRUTH_OF_OLODUMARE_PERK_EFFECT: "[espionage|E]速度：#P +25%#!\n#flavor 身为命定的裁判者，午日可以轻易地将真理与谬误区分开来。#!"
 TRUTH_OF_OLODUMARE_REASON: "$truth_of_olodumare_perk_name$：$VALUE|+=0$"
 fangs_of_judgement_perk_name: "审判之牙"
 FANGS_OF_JUDGEMENT_PERK_EFFECT: "有[imprisonment_reason|E]的[imprison|E]机率：#P +20%#!\n[revoke|E]头衔接受度：#P +10#!\n#flavor 午日不只要审判，还要惩罚那些堕落之人。 #!"
 strength_of_purpose_perk_name: "崇高力量"
 STRENGTH_OF_PURPOSE_PERK_EFFECT: "#flavor 正阳利用此灵赋在末日浩劫中坚守信念，将炽热激情与灼烧魂怒淬炼成冰冷钢铁般的决心。#!"
 tame_sunbeam_perk_name: "驯服阳光"
 TAME_SUNBEAM_PERK_EFFECT: "[character_interaction|E]：对无法抵御阳光的另一角色施加2[POD_aggravated_damage_with_box|E]并使其五年不得治愈。\n#flavor 太阳一直是莫科莱最坚定的盟友，总是会在其最需要时赐予光明。#!"
 clear_mind_perk_name: "清醒头脑"
 CLEAR_MIND_PERK_EFFECT: "#flavor 此灵赋助人排除干扰保持思维清明。#!"
 weak_arm_perk_name: "以小博大"
 WEAK_ARM_PERK_EFFECT: "#flavor 通过观察对手的战斗风格，正阳能迅速评估其力量和劣势。#!"
 eye_of_the_cobra_perk_name: "眼镜蛇之眼"
 EYE_OF_THE_COBRA_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('POD_mokole_eye_of_the_cobra_modifier').GetNameWithTooltip].GetNameWithTooltip]。\n#flavor 凭借着一种诡异的眼神，该蜥裔能将任何人吸引到攻击范围之内。#!"
 raptors_gaze_perk_name: "猛禽的凝视"
 RAPTORS_GAZE_PERK_EFFECT: "#flavor 莫科勒的单眼骤然绽放炽烈红光，所有被其目光锁定的敌人将陷入剧痛折磨。#!"
 wisdom_of_the_sun_perk_name: "太阳的智慧"
 WISDOM_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$[GetModifier('suns_wisdom_modifier').GetNameWithTooltip]。\n#flavor 在太阳之主的容颜下冥想，正午的太阳将成为大地之灵智慧的通道，几乎能解答任何问题。#!"
 sleep_of_the_dragon_perk_name: "龙眠"
 SLEEP_OF_THE_DRAGON_PERK_EFFECT: "#flavor 此灵赋使莫科勒进入夏眠状态。其睡眠时长受持续时间（如\"三个月\"）或条件（如\"湖水蓄满之时\"）限制，无论何种情况，唤醒条件均由她自行设定。沉睡期间莫科勒不会衰老，但可能做梦。通常她会将自己埋入泥中休眠。#!"
 resist_pain_perk_name: "抵抗疼痛"
 RESIST_PAIN_PERK_EFFECT: "#flavor 莫科勒以意志与决心强化自身，屏蔽伤痛侵袭。#!"
 rage_of_the_nest_mother_perk_name: "巢母之怒"
 RAGE_OF_THE_NEST_MOTHER_PERK_EFFECT: "你每个未成年的子女使你获得一层[GetModifier('POD_mokole_rage_of_the_nest_mother_modifier').GetNameWithTooltip]。\n#flavor 当莫科莱家族或亲巢中无助的成员面临威胁时，夕日会超越她通常的极限来保护他们。 #!"
 combat_healing_perk_name: "战斗治疗"
 COMBAT_HEALING_PERK_EFFECT: "#flavor 此灵赋能让龙人无需休息、毫不犹豫地治愈自身的伤势，即便是在战斗之中也是如此。#!"
 warding_dance_perk_name: "护身舞步"
 WARDING_DANCE_PERK_EFFECT: "#flavor 斜阳将心中烈焰灌注四肢，毫发无伤地冲破盖亚敌人的阵列。#!"
 clenched_jaw_perk_name: "下颚紧咬"
 CLENCHED_JAW_PERK_EFFECT: "在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]\n#flavor 该蜥裔咬合力极强，除非她自己选择松口，否则绝不会松开；即使死后，她的下颚也依然紧闭。 #!"
 armor_of_the_tortoise_perk_name: "龟甲"
 ARMOR_OF_THE_TORTOISE_PERK_EFFECT: "#flavor 莫科勒可在皮肤外形成坚硬甲壳，抵御伤害。#!"
 clarity_perk_name: "明察"
 CLARITY_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor 此灵赋赋予穿透雾霭、极暗环境与隐形状态的能力，并能识破幻象。#!"
 hand_of_the_earth_lords_perk_name: "大地之主的掌印"
 HAND_OF_THE_EARTH_LORDS_PERK_EFFECT: "能够招募[GetMaA('earth_elemental').GetName][men_at_arms|E]。\n#flavor 夕日利用大地的能量，只要轻轻指向某个物体，就能移动它。#!"
 halo_of_the_sun_perk_name: "太阳光环"
 HALO_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$[GetModifier('cleansing_sun_modifier').GetNameWithTooltip]。\n#flavor 角色诵出赫利俄斯神圣的古语，瞬间被炽烈日光球体笼罩。#!"
 fossilize_perk_name: "化石化"
 FOSSILIZE_PERK_EFFECT: "[character_interaction|E]：使一名角色陷入[GetTrait('torpor').GetName(GetNullCharacter)]。\n#flavor 莫科莱将敌人化石化，以此录入记忆，供后世学习借镜。 #!"
 brothers_scent_perk_name: "兄弟气息"
 BROTHERS_SCENT_PERK_EFFECT: "#flavor 莫科勒借由盖亚万物共生的兄弟情谊，无论身处何地皆能融于环境。#!"
 spirits_of_laughter_perk_name: "欢笑之灵"
 SPIRITS_OF_LAUGHTER_PERK_EFFECT: "[vassals|E]的[faction_military_power|E]阈值：#P +10%#!\n#flavor 夜日向诸灵祈求幽默感，让每个人都感到愉悦。 #!"
 FACTION_POWER_SPIRITS_OF_LAUGHTER: "$spirits_of_laughter_perk_name$：$VALUE|+=0$"
 glib_tongue_perk_name: "口齿伶俐"
 GLIB_TONGUE_PERK_EFFECT: "#flavor 听者只能听见莫科勒想让他们听到的内容。夜阳可以说任何话，哪怕是彻头彻尾的胡言乱语，但所有听众都会深表赞同。#!"
 GLIB_TONGUE_ACCEPTANCE: "$glib_tongue_perk_name$：$VALUE|+=0$"
 dreamspeak_perk_name: "梦境行者"
 DREAMSPEAK_PERK_EFFECT: "[espionage|E]速度：#P +25%#!\n#flavor 夜日可以穿梭于他人的梦境之中，进而影响其走向。 #!"
 DREAMSPEAK_REASON: "$dreamspeak_perk_name$：$VALUE|+=0$"
 invisibility_perk_name: "隐形术"
 INVISIBILITY_PERK_EFFECT: "解锁[GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip]变形选项。\n#flavor 莫科勒可隐匿于视线之外，但需持续专注维持隐形状态。#!"
 shadows_by_the_firelight_perk_name: "火光之影"
 SHADOWS_BY_THE_FIRELIGHT_PERK_EFFECT: "[character_interaction|E]：减少自身[stress|E]。\n#flavor 夜日藉由阴影和梦境，为一场其他莫科莱参与的戏剧搭建舞台。 #!"
 open_sun_bridge_perk_name: "开启日桥"
 OPEN_SUN_BRIDGE_PERK_EFFECT: "[character_interaction|E]：作为[army_commander]或[traveling|E]中传送至栖巢或圣地。\n#flavor 蜥裔拥有开启日桥的能力，无论是否得到栖巢图腾的许可。 #!"
 take_the_true_form_perk_name: "显现真形"
 TAKE_THE_TRUE_FORM_PERK_EFFECT: "[character_interaction|E]：移除一名角色的变形形态并使其十年不能变形。\n#flavor 夜日能迫使存在展现其真实形态。#!"
 fools_luck_perk_name: "傻人有傻福"
 FOOLS_LUCK_PERK_EFFECT: "此灵赋可暂时免疫厄运。"
 thousand_forms_perk_name: "千变之躯"
 THOUSAND_FORMS_PERK_EFFECT: "允许变身为数种动物。\n$unlock_forging_node$[GetModifier('beast_rampage_modifier').GetNameWithTooltip]。\n#flavor 拥有此灵赋的蜥裔可以变身成体型介于小型鸟类和野牛之间的任何动物。 #!"
 sense_magic_perk_name: "窃形术"
 SENSE_MAGIC_PERK_EFFECT: "不再受$POD_splat_wraith_plural$附身。\n#flavor 蜥裔能够感知神秘能量的脉动和流动，无论其源头为何。 #!"
 mokole_spirit_speech_perk_name: "灵语"
 MOKOLE_SPIRIT_SPEECH_PERK_EFFECT: "#flavor 此灵赋赋予理解灵界语言的能力，使莫科勒能清晰理解并和遇到的任何灵体对话。#!"
 command_spirit_perk_name: "命令灵体"
 COMMAND_SPIRIT_PERK_EFFECT: "能招募[GetMaA('jagglings').GetName][men_at_arms|E]。\n#flavor 掩日可以向她遇到的诸灵发出命令，并要求其服从。#!"
 COMMAND_SPIRIT_REASON: "$command_spirit_perk_name$：$VALUE|+=0$"
 umbral_shadow_wings_perk_name: "幽影之翼"
 UMBRAL_SHADOW_WINGS_PERK_EFFECT: "#flavor 此灵赋使莫科勒族能穿行于影界的\"虚无\"之中，无视各条路径与轨迹，在界域间开辟更直接的航线。#!"
 breaking_the_tomorrow_wall_perk_name: "打破明日之墙"
 BREAKING_THE_TOMORROW_WALL_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n如果有人打算谋杀你的朋友或家人，你会收到通知。\n#flavor 莫科莱逆流而上，游过龙梦之河，隐约瞥见未来。 #!"
 call_water_spirit_perk_name: "召唤水灵"
 CALL_WATER_SPIRIT_PERK_EFFECT: "能招募[GetMaA('water_elemental').GetName][men_at_arms|E]。\n#flavor 莫科莱能召唤水元素来帮助她。 #!"
 walk_the_matres_mind_perk_name: "漫步母心"
 WALK_THE_MATRES_MIND_PERK_EFFECT: "能以身体进入[umbra|E]。\n#flavor 此灵赋让莫科莱能进入影界，而无需留下脆弱的躯体，也无需银绳。#!"
 gorgons_gaze_perk_name: "蛇发女妖的凝视"
 GORGONS_GAZE_PERK_EFFECT: "[character_interaction|E]：减少一名角色的[prowess|E]并施加[GetTrait('scaly').GetName(GetNullCharacter)][trait|E]。\n#flavor 莫科莱的双眼燃烧着红色、金色和绿色的光芒，传说中那可怕的力量只需一眼就能将血肉之躯化为石头。 #!"
 mokole_living_treasure_perk_name: "活体秘宝"
 MOKOLE_LIVING_TREASURE_PERK_EFFECT: "[buy_claim_interaction|E]和[buy_artifact_claim_interaction|E]花费：#P -25%#!\n$unlock_forging_node$[GetModifier('inscribed_legacy_modifier').GetNameWithTooltip]\n#flavor 掩日能够说服宝藏之灵讲述其历史和传说。#!"
 malleable_spirit_perk_name: "精魂塑形"
 MALLEABLE_SPIRIT_PERK_EFFECT: "#flavor 莫科勒可改变灵体的形态或使命。#!"
 mercy_perk_name: "慈悲"
 MERCY_PERK_EFFECT: "#flavor 饰阳认为除对抗解体者爪牙外无需动用致命武力[Glossary('Dissolver', 'glossary_wyrm_tt')]。#!"
 mokole_pack_tactics_perk_name: "狼群战术"
 MOKOLE_PACK_TACTICS_PERK_EFFECT: "#flavor 尽管饰阳作为莫科勒整体领袖的地位存疑，但战场上谁该掌控狼群行动毫无争议。饰阳通过率先行动并协调群狼战术，使所有同巢成员在激战中展现非凡能力。#!"
 mothers_touch_perk_name: "地母之触"
 MOTHERS_TOUCH_PERK_EFFECT: "[character_interaction|E]：治疗另一角色1[POD_superficial_damage_with_box|E]。\n#flavor 幻日透过其双手传递灵力，治愈任何生物的伤口。#!"
 pilot_snake_perk_name: "领航蛇"
 PILOT_SNAKE_PERK_EFFECT: "能够招募[GetMaA('snakes').GetName][men_at_arms|E]。\n#flavor 此灵赋让莫科莱能召唤乐于助人的领航蛇，该生物知道如何到达目的地。#!"
 wind_beneath_my_wings_perk_name: "张翅防风"
 WIND_BENEATH_MY_WINGS_PERK_EFFECT: "#flavor 此灵赋通过队列行进或编队飞行提升莫科勒的移动效率。#!"
 call_to_duty_perk_name: "使命召唤"
 CALL_TO_DUTY_EFFECT: "#flavor 姓名在灵界蕴藏巨大力量，饰阳可借此召唤并指挥任何她知晓姓名之灵体。#!"
 dragon_drill_perk_name: "龙之演练"
 DRAGON_DRILL_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予[GetModifier('POD_mokole_dragon_drill_modifier').GetNameWithTooltip]。\n#flavor 莫科莱能将其盟友组织成一支强大的队伍，并将学到的能力分享给所有成员。#!"
 reshape_object_perk_name: "重塑物体"
 RESHAPE_OBJECT_PERK_EFFECT: "摧毁[artifacts|E]时获得[gold|E]\n#flavor 莫科莱能瞬间将曾经鲜活的物质塑造成其他东西。 #!\n"
 chaos_mechanics_perk_name: "混沌力学"
 CHAOS_MECHANICS_PERK_EFFECT: "$unlock_forging_node$增加随机四种修正的其中一种。\n#flavor 此灵赋使蜥裔能够同时召唤原始能量和神秘形态。#!"
 strength_of_the_dominator_perk_name: "主宰之力"
 STRENGTH_OF_THE_DOMINATOR_PERK_EFFECT: "[character_interaction|E]：减少另一角色的[splat|E]能量并获得其三分之一的[prowess|E]。\n#flavor 蜥裔会利用目标的愤怒来壮大自己的力量。#!"
 mokole_aura_of_confidence_perk_name: "信心灵光"
 MOKOLE_AURA_OF_CONFIDENCE_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\n#flavor 魔克拉散发凌驾气场，可抵御他人寻找破绽或读取灵能的尝试（但无法阻止读取其思想）。#!"
 lambent_flame_perk_name: "摇曳火焰"
 LAMBENT_FLAME_PERK_EFFECT: "#flavor 那只“龙使它的身体闪耀出银色的光芒。#!"
 mokole_awe_perk_name: "威仪"
 MOKOLE_AWE_PERK_EFFECT: "#flavor 魔克拉化身为原始荣耀与威严的化身，头戴太阳冠冕，披着岁月长袍。#!"
 dazzle_perk_name: "眼花缭乱"
 DAZZLE_PERK_EFFECT: "#flavor 魔克拉可将盖亚的荣耀与慈爱倾注于目标意识。#!"
 dragon_kings_majesty_perk_name: "龙王威仪"
 DRAGON_KINGS_MAJESTY_PERK_EFFECT: "#flavor 蚀日者形体骤然膨胀，化作自身阴影般的恐怖化身。此等外貌足以令所有目击者心生极度恐惧。#!"
 wrath_of_the_dragon_perk_name: "巨龙之怒"
 WRATH_OF_THE_DRAGON_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）对敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中施加40[stress|E]，如果对方是$glossary_wyrm$之仆。\n#flavor 魔克拉以盖亚选中的战士身份，展现出他完整而可怕的荣耀。他的威严压倒了[Glossary('解体者', 'glossary_wyrm_tt')]。#!"
 mokole_mastery_perk_name: "帝王控御"
 MOKOLE_MASTERY_PERK_EFFECT: "[character_interaction|E]：获得另一[GetTrait('mokole').GetName(GetNullCharacter)]的[strong_hook|E]。\n#flavor 蚀日可以命令其他魔克拉，甚至是那些堕落臣服于[Glossary('解体者', 'glossary_wyrm_tt')]的魔克拉为其效力。#!"
 army_of_the_ancestors_perk_name: "先祖之军"
 ARMY_OF_THE_ANCESTORS_PERK_EFFECT: "在战争中召唤三名强大[ancestor_spirits|E]作为[knights|E]来协助你。\n#flavor 魔克拉可以召唤赋予他如今形态的祖先，将他们从记忆的迷雾中带出来挑战其对手。#!"
 sun_enfleshed_perk_name: "化身为日"
 SUN_ENFLESHED_PERK_EFFECT: "在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手1[POD_aggravated_damage_with_box|E]，如果其弱点为太阳。\n$unlock_forging_node$[GetModifier('sun_scales_modifier').GetNameWithTooltip]。\n#flavor 魔克拉变成太阳圣火的活化身。她化为无声的太阳火焰，轻轻一触便可灼伤对手。 #!"
 dream_semblence_perk_name: "梦相"
 DREAM_SEMBLENCE_PERK_EFFECT: "[character_interaction|E]：获得一年的[GetModifier('POD_mokole_dream_semblence_modifier').GetNameWithTooltip]并最大化你的[dread|E]。\n#flavor 此罕见灵赋使魔克拉能够梦见自己化身为真龙形态。一旦冲突结束，梦境便会消散。#!"
 mnesis_lifestyle_name: "龙梦"
 mnesis_lifestyle_desc: "唤回远古莫科莱的能力与技艺。"
 monthly_mnesis_lifestyle_xp_gain_mult: "每月龙梦[lifestyle|E]的[experience|E]"
 mnesis_lifestyle_tree_visible: "龙梦"
 MNESIS_PERK_COST_EFFECT: "#clickable 该技能需消耗$VALUE|V0$点技能[Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), '点数', '点数' )]#!"
 MNESIS_PREVIOUS_AGE_REQ: "@warning_icon!#warning 你必须获得上一个纪元中的所有[perks|E]。#!"
 DEEPER_MNESIS_EFFECT: "在进一步深入龙梦的过程中，你的[skills|E]将受到更进一步的#N 削弱#!。"
 age_of_man_perk_name: "人之纪元"
 AGE_OF_MAN_PERK_EFFECT: "允许在[UmbraGlossary('astral_reaches')]中寻找宝物碎片。"
 sun_spark_perk_name: "太阳火花"
 SUN_SPARK_PERK_EFFECT: "$unlock_forging_node$取代基础锻造节点，根据宝物种类增加一种修正并增加10[durability|E]。"
 strengthening_chant_perk_name: "强化咏唱"
 STRENGTHENING_CHANT_PERK_EFFECT: "$unlock_forging_node$取代基础锻造节点，增加20[durability|E]。"
 curing_the_body_perk_name: "治愈躯体"
 CURING_THE_BODY_PERK_EFFECT: "$unlock_brewing_node$治疗1[POD_superficial_damage_with_box|E]和凡俗疾病，\n$unlock_brewing_node$为目标带领的军队增加25[supply|E]。"
 brews_of_the_mokole_perk_name: "魔克拉的酿剂"
 BREWS_OF_THE_MOKOLE_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('matre_medicine_modifier').GetNameWithTooltip]，如果是已婚女性角色，她将怀孕。\n\n$unlock_brewing_node$[GetModifier('snake_herbs_modifier').GetNameWithTooltip]\n$unlock_brewing_node$[GetModifier('swimmers_medicine_modifier').GetNameWithTooltip]"
 stones_of_power_perk_name: "力量之石"
 STONES_OF_POWER_PERK_EFFECT: "$unlock_forging_node$[GetModifier('sunstones_modifier').GetNameWithTooltip]\n$unlock_enhancing_node$[GetModifier('bloodstones_modifier').GetNameWithTooltip]"
 flood_the_land_perk_name: "淹没大地"
 FLOOD_THE_LAND_PERK_EFFECT: "解锁天气魔法选项：#V 洪水#!"
 bring_the_apocalypse_perk_name: "带来末日"
 BRING_THE_APOCALYPSE_PERK_NAME: ""
