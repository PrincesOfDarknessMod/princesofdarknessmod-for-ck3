 scent_beyond_perk_name: "彼方气息"
 roll_over_perk_name: "累积"
 release_from_bondage_perk_name: "解脱束缚"
 NEEDS_PHILODOX_TEXT: "@warning_icon!#X 须知你得有[GetTrait('philodox').GetName( GetPlayer )][traits|E]才能点此树上的技能 #!"
 AURA_LEADERSHIP_PERK_STATS_EFFECT: "你解锁了'地方判官'的[decision|E]。它将为你的首都提供加成。该生活方式树的部分技能还提供额外加成可供选择。"
 COMMAND_GATHERING_PERK_STATS_EFFECT: "'地方判官'[decision|E]将给予额外加成。"
 RELEASE_FROM_BONDAGE_PERK_STATS_EFFECT: "获得强力精神防护，让你免疫精神相关能力。\n作为[character_interaction|E]，允许你使用灵知来让目标浪费掉对你有的牵制。\n#F 有许多方法可以神秘地扭曲他人的意志。该灵赋能够打破所有这类束缚，无论是吸血鬼的血力控制，还是法师的心灵控制，亦或是半月狼的誓约。那些掌握该灵赋的人可以对任何生物使用，包括自己。这灵赋只能由一位灵君或同样强大的灵体所赐予，通常是作为对一些伟大使命的奖励。#!"
 RELEASE_FROM_BONDAGE_REQUIREMENT: "@warning_icon!#X 你需要完成一位灵君（通过在灵界的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
