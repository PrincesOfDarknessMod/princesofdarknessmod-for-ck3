 prophetic_vision_perk_name: "先知远见"
 spirit_vessel_perk_name: "灵壳"
 rebirthing_perk_name: "再生产"
 NEEDS_THEURGE_TEXT: "@warning_icon!#X 须知你得有[GetTrait('theurge').GetName( GetPlayer )][traits|E]才能点此树上的技能 #!"
 SPIRIT_SPEECH_PERK_STATS_EFFECT: "能够招募[GetMaA('jagglings').GetName]作为[men_at_arms|E]"
 HEAR_SILENCE_PERK_STATS_EFFECT: "解锁避世冥想[decision|E]"
 NAME_SPIRIT_PERK_STATS_EFFECT: "解锁寻求诸灵的援助[decision|E]。"
 PROPHETIC_VISION_PERK_STATS_EFFECT: "解锁占星[decision|E]\n如果有人打算谋杀你的朋友或家人，你会收到通知。\n如果有人打算勾引你的爱人或夫妻，你会收到通知。\n你的囚犯从你的监狱成功逃跑的概率更低。"
 REBIRTHING_PERK_STATS_EFFECT: "如果你死亡，你将重生为一个#V 1#!岁的角色。\n#F 这是盖亚最神圣和罕见的灵赋，使得狼族在死亡后能够立即转世为一个新生儿，该新生儿出生在距离狼族死亡地点2000英里以内。转世通常是与狼族前世相同的血种，但如果范围内唯一的新生儿不属于该血种，也可以转世为另一种血种，甚至是忌子。如果在死亡后的一个月内范围内没有新生儿，那么狼族将不会重生，而是去往所有狼族在死亡时该去的地方。#!"
 REBIRTHING_REQUIREMENT: "@warning_icon!#X 你需要完成盖亚本人（通过在灵界的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
 PERSUASION_PERK_EFFECT: "#flavor This Gift allows a homid to become more persuasive when dealing with others; his statements and arguments are imbued with meaning or credibility.#!"
 apecrafts_blessing_perk_name: "Apecraft's Blessing"
 APECRAFTS_BLESSING_PERK_EFFECT: "#flavor Though many of Gaia's children use tools, none have mastered them so thoroughly as humanity. The homid focuses this mastery into the tools she uses, causing their spirits to awaken and lend her aid.#!"
 DIVIDE_PERK_EFFECT: "[character_interaction|E]: Give a negative vassal opinion modifier.\n\n#flavor This Gift raises up hatred and suspicion among the Garou's enemies.#!"
 STAREDOWN_PERK_EFFECT: "#flavor $glossary_rage$ burns in a werewolf's eyes, striking fear into the hears of mortals and animals, causing them to flee for their lives.#!"
 reshape_object_perk_name: "Reshape Object"
 RESHAPE_OBJECT_PERK_EFFECT: "$unlock_forging_node$ Add a modifier depending on Artifact type and [GetModifier('artifact_minor_monthly_prestige_mult_2_modifier').GetNameWithTooltip]\n\n#flavor The Garou can shape once-living material into a variety of objects. Trees may become shelter, buck antlers become spears, animal hides become armor and flowers become perfumes.#!"
 weave_of_steel_perk_name: "Weave of Steel"
 WEAVE_OF_STEEL_PERK_EFFECT: "#flavor The homid can mystically reinforce any manmade structure or material, giving planks the strength of steel and steel the toughness of diamond.#!"
 body_shift_perk_name: "Body Shift"
 BODY_SHIFT_PERK_EFFECT: "#flavor Garou raised in the shifting maze of human society are well-prepared for the endless adaptations Gaia demands of her protectors.#!"
 false_comfort_perk_name: "False Comfort"
 FALSE_COMFORT_PERK_EFFECT: "Inflict enemy [rulers|E] with [GetModifier('false_comfort_modifier').GetNameWithTooltip] when starting a [war|E] as the primary attacker or defender.\n\n#flavor Humanity has done much to surround itself with comfort and safety. A Garou using this Gift does not shred armor or smash through doors, he simply ignores them entirely. Safety is an illusion.#!"
 false_comfort_modifier: "False Comfort"
 cousins_coat_perk_name: "Cousin's Coat"
 COUSINS_COAT_PERK_EFFECT: "#flavor Garou with this Gift can blend in with their natural surroundings easier than others of their kind.#!"
 hares_leap_perk_name: "Hare's Leap"
 HARES_LEAP_PERK_EFFECT: "#flavor The werewolf can leap truly incredible distances by invoking this Gift.#!"
 sense_the_unnatural_perk_name: "Sense the Unnatural"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n\n#flavor The werewolf can pick out any unnatural presence, gauging its approximate strength and type.#!"
 devils_child_perk_name: "Devil's Child"
 DEVILS_CHILD_PERK_EFFECT: "#flavor Wolves are often seen as the offspring of the Devil himself, and while they don't fully understand that implication, the lupus are happy to capitalize on the fear it inspires. The Garou lets out a fierce snarl that terrifies opponents and cows them into submission. #!"
 gift_of_the_porcupine_perk_name: "Gift of the Porcupine"
 GIFT_OF_THE_PORCUPINE_PERK_EFFECT: "#flavor This Gift allows a Garou's fur to become bristly and sharp like the quills of a porcupine, and you never mess with porcupine.#!"
 lord_of_the_wilds_perk_name: "Lord of the Wilds"
 LORD_OF_THE_WILDS_PERK_EFFECT: "#flavor The Garou may not only communicate with animals, but attract and command them.#!"
 umbral_body_perk_name: "Umbral Body"
 UMBRAL_BODY_PERK_EFFECT: "Can shapeshift and maintain shapeshifted forms while staying in the [umbra|E].\n\n#flavor With this Gift, the user can partially reach into the Umbra, sending certain body parts into it while maintaining others in the physical world.#!"
 ELEMENTAL_GIFT_PERK_EFFECT: "Unlock Elemental [men_at_arms|E].\n\n#flavor The werewolf calls upon the primal force of Gaia Herself, thereby commanding the spirits of the elements to rise up, undulate forward and even engulf foes.#!"