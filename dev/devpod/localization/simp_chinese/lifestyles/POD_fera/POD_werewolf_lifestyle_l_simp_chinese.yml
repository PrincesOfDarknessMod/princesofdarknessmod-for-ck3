 FIREBRINGER_PERK_STATS_EFFECT: "在杀死超自然时，有机会获得随机的生活方式点数。\n在你使用[interaction|E]传授技能点时，获得[prestige|E]和[dynasty_prestige|E]。\n#F 新月狼执行终极的戏法，窃取超自然的力量，并将其转化为一份灵赋，这份灵赋可以在新月赋予他人，就像一位灵类导师一样。然而，可惜的是，新月狼必须首先遭受该力量对他的效果。郊狼神或其他欺诈者灵君教授该灵赋。#!"
 FIREBRINGER_REQUIREMENT: "@warning_icon!#X 你需要完成一位诡骗师灵君（通过在灵界的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
