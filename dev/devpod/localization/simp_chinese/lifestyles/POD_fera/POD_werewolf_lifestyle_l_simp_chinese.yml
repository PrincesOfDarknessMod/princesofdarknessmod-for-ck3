 storyteller_perk_name: "说书人"
 NEEDS_GALLIARD_TEXT: "@warning_icon!#X 须知你得有[GetTrait('galliard').GetName( GetPlayer )][traits|E]才能点此树上的技能 #!"
 PRIMAL_SONG_PERK_STATS_EFFECT: "你解锁针对自己的“原始之歌”[character_interaction|E]。你将能挑选一首歌曲进行演奏。该生活方式树的部分技能还提供更多的歌曲可供选择。"
 SONG_HEROES_PERK_STATS_EFFECT: "你解锁一首可以使用“原始之歌”[character_interaction|E]来演奏的额外歌曲。"
 SONG_RAGE_PERK_STATS_EFFECT: "你解锁一首可以使用“原始之歌”[character_interaction|E]来演奏的额外歌曲。"
 SONG_SIREN_PERK_STATS_EFFECT: "你解锁一首可以使用“原始之歌”[character_interaction|E]来演奏的额外歌曲。"
 STORYTELLER_PERK_STATS_EFFECT: "作为[character_interaction|E]，允许你使用灵知来让随机事件发生。\n#F 不仅仅是简单地讲述和重复古老的故事，甚至不用等待当天的事件成为新的故事，凸月狼可以改变围绕她展开的正在进行的戏剧事件。她可以添加新的“角色”，改变事件链，甚至改变主要参与者的动机。然而，由于这灵赋可能真正产生改变世界的后果，历史上掌握它的几个狼族都不愿意真正使用它。没有人知道是哪种灵类教授这份灵赋；推测可能是盖亚的化身，但由于甚至只有很少的狼族知道这灵赋的存在，没有人能够确定。#!"
 STORYTELLER_REQUIREMENT: "@warning_icon!#X 你需要完成一位盖亚化身（通过在灵界的任意界域驻扎探员以获得所在地线索并进行[umbra_expedition|E]）的任务以解锁技能。#!"
 truth_gaia_perk_name: "盖亚真相"
