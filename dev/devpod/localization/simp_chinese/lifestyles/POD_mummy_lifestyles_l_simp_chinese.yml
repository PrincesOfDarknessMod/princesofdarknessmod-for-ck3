 DEATHS_SHROUD_PERK_EFFECT: "#flavor 木乃伊可以困住目标的真灵或灵魂，并将其封印在准备好的专用容器中。#!"
 SEPARATE_KA_PERK_EFFECT: "#flavor 木乃伊可以将他的灵魂从身体中出窍，使他能够逃到[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
 GHOST_LANTERN_PERK_EFFECT: "#flavor 木乃伊将塞赫变成鬼火般的光球，以便在[UmbraGlossaryLocalized('shadowlands','冥界')]引导行动。#!"
 STORMWALK_PERK_EFFECT: "你不再会于[UmbraGlossary('tempest')]迷失方向。\n#flavor 木乃伊可以通过专注去想熟悉的地方（如阿蒙提），在[UmbraGlossary('shadowlands')]的不断变化的[UmbraGlossary('tempest')]中确定自己的方向。#!"
 BODY_PRESERVATION_PERK_EFFECT: "#flavor 木乃伊可以通过食用数种混合物，以及用油和膏沐浴来保养她的躯体以防腐烂。#!"
 JUDGE_THE_SOUL_PERK_EFFECT: "#flavor 木乃伊可以看见他的目标的灵魂，以及它与玛阿特的联系有多紧密。也可以用这个咒语来辨别超自然生物。#!"
 SUMMON_THE_DEAD_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor 木乃伊可以发出召唤，召唤一只木乃伊知道的特定死灵。该法术不授予对该生物的控制权。#!"
 STORM_SHIELD_PERK_EFFECT: "#flavor 通过引导他的塞赫，木乃伊可以在[UmbraGlossaryLocalized('shadowlands','冥界')]竖起防御风暴的屏障，以及怨灵和类似生物。#!"
 FERTILITY_OF_OSIRIS_PERK_EFFECT: "#flavor 该仪式允许已故男性使活着的凡间女性受孕。#!"
 REVISIT_DEATH_PERK_EFFECT: "若你的任何亲朋好友本将死于死因神秘，现在将直接揭露谋杀他们的人。\n#flavor 通过触摸尸体的皮肤，木乃伊可以重温这具尸体的最后经历。#!"
 BANISH_THE_DEAD_PERK_EFFECT: "你将不再会被$POD_splat_wraith_plural$附身。\n#flavor 木乃伊可以驱除附在凡人身上的死灵。#!"
 BIND_THE_DEAD_PERK_EFFECT: "解锁[GetMaA('wraiths').GetName]和[men_at_arms|E]\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor 木乃伊可以强迫死灵完成一个特定的任务。#!"
 SENSE_THE_DEAD_PERK_EFFECT: "#flavor 木乃伊能感知是否有怨灵在监视或靠近自己。#!"
 MANIFESTATION_PERK_EFFECT: "允许在留在[umbra|E]的同时与[UmbraGlossary('earth')]上的角色互动。\n#flavor 身处杜阿特时，木乃伊可使其灵魂在生者世界以半透明灵体显形。#!"
 SEPARATE_BA_PERK_EFFECT: "#flavor 木乃伊可以随心所欲地进入任何[umbra|E]。#!"
 SHADOW_PORTAL_PERK_EFFECT: "#flavor 木乃伊可以在[UmbraGlossaryLocalized('shadowlands','冥界')]内制造出门道，以允许快速移动。#!"
 DEATHS_HAND_PERK_EFFECT: "#flavor 木乃伊可以通过触摸来引导[UmbraGlossaryLocalized('shadowlands','冥界')]的纯粹灵质对付他的敌人。#!"
 BIND_THE_LIVING_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n$POD_can_summon_on_death_trigger_loca$\n#flavor 木乃伊可以施展一个仪式，确保这个人将作为死灵留存。#!"
 AMENTIS_GRACE_PERK_EFFECT: "#flavor 通过这个仪式，木乃伊可以制作护符，形成临时的[UmbraGlossary('shadow_realm')]。#!"
 SIN_EATING_PERK_EFFECT: "[execution|E]囚禁的$POD_splat_wraith$可减少25点[stress|E]。\n#flavor 木乃伊能消除目标的强烈负面冲动，甚至黑暗炽情。#!"
 KHAIBITS_EMBRACE_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#flavor 木乃伊可以将凡人目标封在黑色灵质匣子里。#!"
 SEVER_SOUL_PERK_EFFECT: "解锁[GetMaA('walker').GetName],[GetMaA('shambler').GetName],[GetMaA('skeletons').GetName]与[GetMaA('dragons_teeth').GetName]作为[men_at_arms|E]\n#flavor 木乃伊可以分离离开身体的超自然生物和身体本身之间的联系。#!"
 HEART_OF_LIFE_PERK_EFFECT: "在复活过程中可以与[UmbraGlossary('earth')]角色互动。\n#flavor 木乃伊在切断自己身体的一部分——如手或头后，可以在重生期间中使这部分先复活，进入活人的世界。#!"
 PANOPLY_OF_SHADOW_PERK_EFFECT: "#flavor 通过呼唤[UmbraGlossary('oblivion')]的力量，木乃伊可以把自己包裹在自己的影子里，成为无形无状的生物，无视任何物理攻击。#!"
 SCOURING_OBLIVION_PERK_EFFECT: "对目标施加持续5年的[GetModifier('POD_hekau_scouring_oblivion_modifier').GetNameWithTooltip]效果。\n#flavor 木乃伊可以通过从生物的身体中提走死亡能量来治疗生物。#!"
 ENTRAP_THE_BA_PERK_EFFECT: "#flavor 木乃伊可以困住目标的真灵或灵魂，并将其封印在准备好的专用容器中。#!"
 CALL_THE_KHAIBIT_PERK_EFFECT: "解锁[GetMaA('spectres').GetName]和[men_at_arms|E]\n作为[execution|E]选项，处决一名囚犯可获得2点[GetTrait('integrity').GetName(GetPlayer)]特质经验；如果未有[GetTrait('integrity').GetName(GetPlayer)]特质，则承受-10点[static_stress|E]。\n#flavor 在死亡的瞬间，木乃伊可以切断灵魂的黯影，让它继续往生而它的黑影则作为怨灵留在那里。#!"
 RESHAPE_THE_LOST_SOUL_PERK_EFFECT: "#flavor 木乃伊能修改怨灵的炽情。#!"
 OPEN_THE_SEBKHET_PERK_EFFECT: "可以同时操纵尸幕与险棘。\n#flavor 木乃伊撕开了尸幕，让自己和他人走入杜阿特。#!"
 KHU_OF_TWO_LANDS_PERK_EFFECT: "当你在物质世界中时，也可以与[umbra|E]的存在互动。\n#flavor 木乃伊可以与物质世界和[UmbraGlossaryLocalized('shadowlands','冥界')]相互互动而不受惩罚。#!"
 ASPECT_OF_DUAT_PERK_EFFECT: "可以在[umbra|E]维持变形形态。\n#flavor 木乃伊可以按照自己的意愿塑造自己在[UmbraGlossaryLocalized('shadowlands','冥界')]的形态。#!"
 EATING_THE_HEART_PERK_EFFECT: "每#V 50#!年可在复活过程中欺骗玛阿特审判者免受惩罚。\n#flavor 木乃伊制造虚假心脏短暂蒙蔽审判#!"
 SHADOW_TALISMAN_PERK_EFFECT: "#flavor 木乃伊可以通过护符赫考将他创造的护身符带入[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
 LIGHTEN_THE_SHADOW_PERK_EFFECT: "提升[GetPerk('scouring_oblivion_perk').GetName(GetPlayer)]效果，并额外消除[GetTrait('spectre').GetName(GetNullCharacter)]、[GetTrait('shadow').GetName(GetNullCharacter)]或[GetTrait('wight').GetName(GetNullCharacter)]特质。\n#flavor 可以平息目标黑暗面，例如使吸血鬼脱离血狂#!"
 GIFT_OF_PURPOSE_PERK_EFFECT: "#flavor 木乃伊可以将他自己内心的部分冲动转移到目标身上。#!"
 SPEAR_OF_ANUBIS_PERK_EFFECT: "解锁[single_combat_duel|E]招式。\n#flavor 通过切开他的手掌，木乃伊可以将[UmbraGlossary('oblivion')]的力量体现在一支黑暗长矛上，它可以绕过任何世俗的保护并造成恶性伤害。#!"
 LOYAL_COMPANION_PERK_EFFECT: "你的宠物和战马在死后会被复活。\n#flavor 在将你忠诚的动物伙伴制成木乃伊后，木乃伊能将它复活为你的幽灵从者#!"
 CALL_FORTH_THE_REAVERS_OF_UR_PERK_EFFECT: "能够招募[GetMaA('the_reavers_of_ur').GetName]作为[men_at_arms|E]。\n#flavor 木乃伊从一个不知名的地方召唤出一群可怕的起伏不定的灰色形体，以残酷的方式分尸敌人。#!"
 DARK_WALL_OF_HATSHEPSUT_PERK_EFFECT: "#flavor 该法术是由贤荷鲁哈特谢普苏特所发明，作为太阳王仪式的一个小变种，该法术创造了一堵塞赫墙，阻碍了任何灵魂越过它，并提高了当地的尸幕。#!"
 WALKING_IN_THE_SHADOW_OF_ANUBIS_PERK_EFFECT: "#flavor 木乃伊可以瞬间穿越实相中的不同世界，只要他知道它们的存在。#!"
 SPIRIT_THE_BODY_AWAY_PERK_EFFECT: "#flavor 将死尸转化为灵质，携肉身穿越尸幕。#!"
 EMPOWER_KA_PERK_EFFECT: "#flavor 木乃伊加强了他的卡，以便在他的重生周期中更有效地保护他的身体。#!"
 EMPOWER_BA_PERK_EFFECT: "#flavor 木乃伊可强化其巴魂，以更快地回归其尸躯。#!"
 CASTING_AWAY_PERK_EFFECT: "作为[character_interaction|E]，在通过[prowess|E]检定后，将你的目标抛入[UmbraGlossary('tempest')]。如果目标无法进入[UmbraGlossaryLocalized('shadowlands','冥界')]，则会死亡。\n#flavor 木乃伊可将其目标投入[UmbraGlossary('tempest')]的狂暴风涡中。#!"
 HEART_OF_REINCARNATION_PERK_EFFECT: "每#V 25#!年，如果你尚未拥有[GetModifier('extra_life_1_modifier').GetNameWithTooltip]，则获得。这将绕过$POD_splat_mummy_plural$正常的复活流程。\n#flavor 通过将自身精粹注入一件小物件，木乃伊可在下一名触碰该物件的女性所生子嗣中转生，从而规避其形神俱灭。#!"
 TRANSFIXING_GAZE_PERK_EFFECT: "#flavor 只要一瞪眼，木乃伊就能激起目标体内的黑影，使他们在短时间内瘫痪。#!"
 SEPARATE_KHAIBIT_PERK_EFFECT: "作为[character_interaction|E]，允许你制造自身的克隆。\n#flavor 木乃伊可以切断自己的黑影，将其转化为类似[GetTrait('spectre').GetName( GetNullCharacter )]的生物，按照其创造者的要求行事。#!"
 BARRING_THE_GATES_PERK_EFFECT: "作为[character_interaction|E]，为整个领地操纵尸幕\n#flavor 木乃伊可以提高当地尸幕的强度，防止任何死灵入侵。#!"
 PROMISE_MADE_BEFORE_AMMUTS_SCALES_PERK_EFFECT: "作为[character_interaction|E]，赋予你的目标[GetModifier('extra_life_1_modifier').GetNameWithTooltip]，同时自身获得2点$POD_splat_mummy$回忆[trait_level_track_xp|E]。\n#flavor 在就此事请示玛阿特审判者后，木乃伊可将生命神咒的碎片转移给一名自愿的凡人。#!"
 UNMAKING_PERK_EFFECT: "作为一种[execution|E]选项，永久处决囚犯，并规避任何复活手段。\n#flavor 木乃伊可将任何事物投入虚空之井，将其存在彻底抹消。#!"
 CALL_OF_OBLIVION_PERK_EFFECT: "作为[character_interaction|E]，在通过[prowess|E]检定后，将你的目标抛入[UmbraGlossary('oblivion')]，将其存在彻底抹消。仅对非不朽目标生效。\n#flavor 木乃伊即刻将目标的灵魂逐出躯壳，任其奔赴命中注定的归宿。#!"
