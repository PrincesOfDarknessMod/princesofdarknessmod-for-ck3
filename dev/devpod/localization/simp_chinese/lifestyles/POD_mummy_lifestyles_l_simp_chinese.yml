 ANALYZE_MATERIAL_PERK_EFFECT: "药剂持续时间：#P +1#!\n#flavor 木乃伊可以获得关于物体构成的信息。#!"
 CLOUD_OF_SMOKE_PERK_EFFECT: "#flavor 木乃伊通过向火中投掷打包好的粉末，使它发出浓厚的窒息黑烟。#!"
 DRINK_OF_SEVEN_DAYS_REST_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip]。\n#flavor 这种药水可以解除饮用者的任何疲劳，使他从轻微的损伤中得到治疗。#!"
 MILD_POISON_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('mild_poison_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造了具有一定的致命性的轻微毒药。#!"
 POTION_OF_RESILIENCE_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('potion_of_resilience_modifier').GetNameWithTooltip]\n#flavor 这药水可作为一种超自然的麻醉剂。#!"
 SIMPLE_ELIXIR_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('simple_elixir_diplomacy_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造出一种灵药，可以在其持续时间内提升单一属性。#!"
 SIMPLE_PHILTRE_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('simple_philtre_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造出一种催情药，能诱发目标的特定情绪。#!"
 SIMPLE_TONIC_PERK_EFFECT: "$unlock_brewing_node$[GetModifier('simple_tonic_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造出一种治疗用的药膏或药水。#!"
 STASIS_PERK_EFFECT: "药剂[artifact|E]持续时间#P +5#!\n#flavor 乃伊使单一材料不被外界力量改变。#!"
