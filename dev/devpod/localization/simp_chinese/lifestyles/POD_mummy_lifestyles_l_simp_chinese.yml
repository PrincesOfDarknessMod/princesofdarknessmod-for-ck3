 DANGEROUS_POISON_PERK_EFFECT: "强化[GetPerk('cobra_spit_perk').GetName(GetPlayer)]，将[GetModifier('cobra_spit_modifier').GetNameWithTooltip]替换为[GetModifier('dangerous_poison_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造了更有效的毒药。#!"
 ONE_HUNDRED_THOUSAND_TONGUES_PERK_EFFECT: "#flavor 通过制造一种涂于嘴唇和耳朵的特殊药膏，木乃伊可以听懂周围人说的任何语言。#!"
 POTION_OF_VALOR_PERK_EFFECT: "强化[GetPerk('drink_of_seven_days_rest_perk').GetName(GetPlayer)]，将[GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip]替换为[GetModifier('potion_of_valor_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造出一种药水，让服药者在短时间内无视受伤惩罚。#!"
 SALTS_OF_THE_DEAD_PERK_EFFECT: "强化[GetPerk('blood_of_the_snake_perk').GetName(GetPlayer)]，将[GetModifier('blood_of_the_snake_modifier').GetNameWithTooltip]替换为[GetModifier('salts_of_the_dead_modifier').GetNameWithTooltip]\n#flavor 木乃伊可以吸收特殊的盐，使他对某些只对活物有影响的伤害免疫（如缺氧）。#!"
 TEARS_OF_ISIS_PERK_EFFECT: "药剂[artifact|E]持续时间：#P +5#!\n#flavor 木乃伊可以将塞赫提炼成物理形式，允许它被储存起来供以后使用。#!"
