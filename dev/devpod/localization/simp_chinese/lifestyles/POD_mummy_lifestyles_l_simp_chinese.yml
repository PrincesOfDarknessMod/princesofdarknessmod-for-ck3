 SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT: "#flavor 有了这法术，天宗可以进入影界。#!"
 SENSE_LUCKS_FLOW_PERK_EFFECT: "#flavor 拥有此咒的天宗能感觉到气运的波动，分辨出围绕着人、地方和事件的好坏运气。#!"
 BODY_MENDING_TECHNIQUE_PERK_EFFECT: "作为[character_interaction|E]，治疗目标\n#flavor 修体技艺允许不朽者通过仪式性的手段来治疗受伤或生病造成的伤害。#!"
 LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT: "#flavor 掌握该仪轨的仙人可以注入足够多的能量，以使他的病人即使离开他身边也能以更快的速度痊愈。#!"
 SWEET_DREAMSS_CARESS_PERK_EFFECT: "作为[character_interaction|E]，使目标增加50点[static_stress|E]\n#flavor  以纯阳能量的振奋活力抵消疲惫，甜梦抚慰允许仙人通过在主要穴位上轻按手指来驱逐自己或他人的疲惫。#!                              "
 SNAKE_FIST_STRIKE_PERK_EFFECT: "#flavor 为了对抗恶魔和其他超自然的再生能力，天宗可以使用此咒来神秘地加速他们的攻击，并将他们的身体变成致命的武器。#!"
 CALL_THE_SPIRITS_PERK_EFFECT: "解锁元素与灵类[men_at_arms|E]\n#flavor 此咒允许仙人放逐或束缚次等的灵体和阳界的诸魔。#!"
 SPIRIT_LANTERN_PERK_EFFECT: "#flavor 拥有灵灯的天宗只要做个结印，就能在手掌中形成一颗鬼火球，用柔和的金光照亮周围的环境，使妖魔和其他不洁的生命感到害怕。#!"
 LEAPING_TIGER_POUNCE_PERK_EFFECT: "#flavor 为他的肌肉注入能量，拥有此咒的天宗可以跃出惊人的距离。#!"
 DRUNKEN_MONKEY_DANCE_PERK_EFFECT: "#flavor 在此咒的作用下，天宗摇摇晃晃，好像完全醉了一样，不知不觉地避开了拳头、子弹和其他针对他的攻击，使他的对手感到困惑和沮丧。#!"
 STORMWIND_PRANA_PERK_EFFECT: "#flavor 天宗根据体现阳之本性的移动原理，使用此咒来大幅提高他们的速度。#!"
 BIND_THE_DEMONS_SERVANT_PERK_EFFECT: "作为[character_interaction|E]，将[imprisoned|E]$POD_splat_fae$、$POD_splat_demon$或$POD_splat_wraith$[POD_banish|E]至原生界域\n#flavor 此咒允许仙人放逐或束缚次等的灵体和阳界的诸魔。#!"
 OPENING_THE_THIRD_EYE_PERK_EFFECT: "作为[character_interaction|E]，赋予[GetTrait('mortal').GetName(GetPlayer)]或$POD_splat_hunter$ #P +5#! 全[skills|E]（[prowess|E]额外获得#P +10#!），并将其转化为[GetTrait('sorcerer').GetName(GetPlayer)]\n#flavor 此法使巫天刺破迷障，令凡人觉醒于诸神的隐秘世界#!"
 THE_CLEARING_OF_THE_WAY_PERK_EFFECT: "可以操控险棘\n#flavor 通过此咒，巫凤可以操纵他周围的绝壁等级。#!"
 FLAME_HAND_STRIKE_PERK_EFFECT: "#flavor 双手笼罩在燃烧着的气的灵光中，一个拥有此咒的仙人每次触碰都会让他的敌人沐浴在火中。#!"
 ELEGANT_CRANE_DEFTNESS_PERK_EFFECT: "#flavor 在阳气的推动下，掌握这功法的天宗变得异常轻盈和敏捷，能够在最狭窄的壁架上毫不费力地保持平衡，在水和流沙等不稳定的表面上奔跑，或利用树叶支撑他们的体重进行攀升。#!"
 MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT: "#flavor 在[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]的授权和八仙的忠实授任下，敢于说出此咒核心的天人之言的天宗，能召唤出玉皇大帝的权威和正义的力量。#!"
 WALK_THE_BARRIERS_PERK_EFFECT: "#flavor 行于屏障允许仙人将其物质躯体转移到阳界。#!"
 PLAGUE_CURING_METHOD_PERK_EFFECT: "强化[GetPerk('body_mending_technique_perk').GetName(GetPlayer)]耗损降低三分之二\n#flavor 有了此咒，在照顾病人至少15分钟后，天宗可以将阳气转移到病人的身体里。#!"
 TEN_PACES_STRIKE_PERK_EFFECT: "#flavor 绕过通常需要的身体接触，拥有此咒的天宗可以通过其集中的气力，无形地将一次武术攻击的力量投射到有着间隔的距离外。#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT: "#flavor 天帝神体让人想起了[Glossary('万仙','game_concept_kuei_jin_desc')]在堕落之前的威严，它将施咒者包围在一片银色的光晕中，照亮天宗的道路，给凡人带来了类似于雾迷的精神状态，并迫使受污染的超自然逃离。#!"
 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT: "作为[character_interaction|E],使目标[GetTrait('mortal').GetName(GetPlayer)]或$POD_splat_hunter$[GetModifier('tan_restoration_of_youths_vigor_modifier').GetNameWithTooltip]\n#flavor 凤丹大师可以制造出凤凰磐涅的奇迹，消除时间的摧残，恢复凡人的青春活力。#!"
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT: "作为[character_interaction|E]，赋予[GetTrait('mortal').GetName(GetPlayer)]或$POD_splat_hunter$[GetModifier('extra_life_1_modifier').GetNameWithTooltip]，自身[piety_level|E]-1\n#flavor 有了这秘传之咒，只要上天认为情况足够危急，天宗就能使自己或盟友恢复到全盛状态。#!"
 GENTLE_TYPHOONS_PASSING_PERK_EFFECT: "#flavor 在战斗中调用，台风过境会将一个凤丹大师变成在狂暴的拳脚风暴中心的完美平静风眼。#!"
