 COBRA_SPIT_PERK_EFFECT: "强化[GetPerk('mild_poison_perk').GetName(GetPlayer)]，将[GetModifier('mild_poison_modifier').GetNameWithTooltip]替换为[GetModifier('cobra_spit_modifier').GetNameWithTooltip]\n#flavor 木乃伊会产生一种酸性液体，对活体组织具有破坏性。#!"
 ESSENCE_LONGING_PERK_EFFECT: "强化[GetPerk('simple_philtre_perk').GetName(GetPlayer)]，将[GetModifier('simple_philtre_modifier').GetNameWithTooltip]替换为[GetModifier('essence_longing_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造了一种香水，可以作为一种轻微的催情剂。#!"
 EYES_OF_THE_KA_PERK_EFFECT: "#flavor 木乃伊会制造一种药膏，当涂在眼睛和耳朵上时，就可以目睹[UmbraGlossary('shadowlands')]。#!"
 ICE_OF_THE_DESERT_PERK_EFFECT: "药剂[artifact|E]持续时间：#P +5#!\n#flavor 木乃伊可以一定得改变自然状态。#!"
 LESSER_QUIDDITY_PERK_EFFECT: "#flavor 通过使用塞赫，木乃伊激活出一个物体的实质（其的象征性精神属性）。#!"
 LESSER_QUIDDITY_EFFECT_DESC: "[GetPerk('lesser_quiddity_perk').GetName(GetPlayer)]"
