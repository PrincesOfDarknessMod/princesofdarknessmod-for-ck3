 STILL_THE_FLUTTERING_WING_PERK_EFFECT: "#flavor 受定风波影响的目标会遭受短暂的麻痹。#!"
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT: "#flavor 静心之道允许天宗缓解一个人的恐慌或焦虑（如血狂）。#!"
 IRON_BODY_MEDITATION_PERK_EFFECT: "#flavor 钢体冥思让天宗通过肉体运转阴气，通过冥想一小时来强化身体，使其免受伤害。#!"
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT: "#flavor 有了此咒，天气就可以从他的影子里制造出厚厚的幽暗之云，像黑雾一样飘散。#!"
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT: "#flavor 通过启动此咒，仙龙可以影响他的秘隐等级，以保持匿名，成为一个近乎无面的人。#!"
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT: "#flavor 有了这法术，天宗可以进入[UmbraGlossaryLocalized('shadowlands','冥界')]。#!"
 ICE_HAND_STRIKE_PERK_EFFECT: "#flavor 在此咒的作用下，天宗的双手被一层蓝色的冰冻阴气所笼罩，每一次攻击都会留下令人麻木的寒气。#!"
 NO_MIND_KATA_PERK_EFFECT: "#flavor 通过理清思路，让“道”的宁静冲刷他，拥有此咒的天宗可以发挥自己的意志，在选定的领域中完成真正的超人壮举。#!"
 EBON_BONDS_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor 只要一句话和一个结印，仙人就能从目标的影子中变出像丝绸一样柔软、像钢铁一样结实的神秘黑丝带将其绑住。#!"
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT: "#flavor 有了此仪轨，仙龙可以深入了解最奇怪的凡人、动物和灵。#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT: "#flavor 仙龙可以用气运包裹自己，给那些想伤害他的人带来厄运。#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT: "#flavor 有了此咒，天宗可以通过给目标的影子注入气来揭开隐藏的超自然生物的面纱，使其呈现出所有者的真实形态（变化妖怪的半兽形形态，妖仙的本相等等）。#!"
 GHOST_WALKING_METHOD_PERK_EFFECT: "#flavor 当引用此咒时，仙龙会在选定的感官中变得无法被发现。#!"
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT: "可以操控尸幕操纵尸幕选项。\n#flavor 通过此咒，仙龙可以操纵他周围的亡者障壁等级。#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT: "不再受$POD_splat_wraith_plural$附身\n#flavor 通过这仪轨，仙龙可以创造出阻止妖魔和其他[Glossary('阎魔王','podgloss.yamaking')]走狗进入一个区域的护身符。#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT: "作为[character_interaction|E]，为目标施加持续20年的[GetModifier('tan_scroll_of_the_minds_eye_modifier').GetNameWithTooltip]\n#flavor 仪式乃仙龙为[Glossary('第六纪元','game_concept_sixth_age_desc')]所作之预备#!"
 BLUR_THE_MIND_PERK_EFFECT: "#flavor 通过调用此咒，仙龙可以使他的受害者忘记最近发生在其附近的事件。#!"
 WHISPERING_STONES_PERK_EFFECT: "#flavor 用这仪轨，仙龙可以从[UmbraGlossary('tempest')]中记录死者的记忆，以翻译未知或已灭绝语言的文件。#!"
 DEATH_TOUCH_PERK_EFFECT: "作为[character_interaction|E]，以100点[static_stress|E]为代价，对目标施加[GetModifier('tan_death_touch_modifier').GetNameWithTooltip]\n#flavor 只保留给最可怕的妖魔，传说中的点穴术使龙丹大师能够灾难性地扰乱单个目标的能量流动，只需一触就能使其残废或死亡。#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT: "#flavor 通过冥想放下所有的恐惧和怀疑，仙龙的内心平静甚至可以平息风暴，或者在风暴过于猛烈时创造一个保护性的 “气泡”。#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT: "作为[character_interaction|E]，允许你传送你带的军队到目标所在地或于行进时瞬抵下一目的地。\n#flavor 有了这仪轨，仙龙可以将他的内气与附近的龙脉流动相调和，在花半时辰在龙穴内或龙脉边冥想后，于数秒到达另一龙穴。#!"