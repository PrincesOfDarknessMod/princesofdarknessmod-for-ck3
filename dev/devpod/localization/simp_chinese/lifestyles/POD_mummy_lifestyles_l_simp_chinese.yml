 ASKING_THE_TREES_PERK_EFFECT: "作为[character_interaction|E]，吟诵一种你已知其[Glossary('真名','podgloss.truename')]的植物之名以促其生长，对你目标所在地点施加一个正面或负面的领地[modifier|E]。\n#flavor 阿蒙提可在有限程度上操控植物生命。#!"
 FORGETTING_THE_STONE_PERK_EFFECT: "作为[character_interaction|E]，吟诵一种你已知其[Glossary('真名','podgloss.truename')]的金属之名以在区域内将其湮灭，对你目标所在地点施加一个负面的领地[modifier|E]。\n#flavor 阿蒙提可使特定无机物质消弭于无形。#!"
 FORGETTING_THE_TREE_PERK_EFFECT: "作为[character_interaction|E]，吟诵一种你已知其[Glossary('真名','podgloss.truename')]的植物之名以在区域内将其湮灭，对你目标所在地点施加一个正面或负面的领地[modifier|E]。\n#flavor 阿蒙提可使有机物质（如木材）消弭于无形。#!"
 NAME_THE_SECRET_PERK_EFFECT: "#flavor 阿蒙提可以通过研究目标的真名来了解隐藏的弱点。#!"
 NAMING_THE_WARNING_PERK_EFFECT: "#flavor 通过念叨真名的音节，阿蒙提可以把敌人吓跑。#!"
 BECOMING_THE_STONE_PERK_EFFECT: "作为[character_interaction|E]，允许变身为你已知其[Glossary('真名','podgloss.truename')]的金属形态。\n#flavor 阿蒙提可以将他的肉体转化为一种他们知晓真名的矿物。#!"
 BECOMING_THE_TREE_PERK_EFFECT: "作为[character_interaction|E]，允许变身为你已知其[Glossary('真名','podgloss.truename')]的植物形态。\n#flavor 阿蒙提可将其血肉转化为植物。#!"
 CLOUD_THE_NAME_PERK_EFFECT: "对‘获知真名’[journey|E]免疫。\n#flavor 阿蒙提可以掩盖自己的真名，掩蔽同样使用这技艺的敌人。#!"
 COMMAND_THE_BEAST_PERK_EFFECT: "能够招募动物[men_at_arms|E]，只要你知道其[Glossary('真名','podgloss.truename')]。\n#flavor 阿蒙提可慑服动物为其效命。#!"
 MEND_FLESH_PERK_EFFECT: "作为[character_interaction|E]，治疗一种你已知其[Glossary('真名','podgloss.truename')]的创伤[trait|E]。\n#flavor 阿蒙提可以指挥细胞重新生长在一起。#!"
 BECOME_ANIMAL_PERK_EFFECT: "作为[character_interaction|E]，允许变身为你已知其[Glossary('真名','podgloss.truename')]的动物形态。\n#flavor 阿蒙提可以将他的肉体转化为一种他们知晓真名的动物。#!"
 COMMAND_THOUGHT_PERK_EFFECT: "可使用‘获知真名’[journey|E]。\n#flavor 阿蒙提可下达一个智慧目标必须遵从的言令。#!"
 NAME_THE_HEKAU_PERK_EFFECT: "#flavor 阿蒙提可以解开其他针对他的超自然技艺。#!"
 WHISPERS_TO_THE_HEART_PERK_EFFECT: "#flavor 阿蒙提可在目标心中激发任意情感。#!"
 HEKAU_ENSLAVE_PERK_EFFECT: "习得一名角色的[Glossary('真名','podgloss.truename')]名时，使其爱慕你#weak (+200好感度)#!。\n#flavor 阿蒙提可以将目标长久束缚于其意志之下。#!"
 FORTIFY_FLESH_PERK_EFFECT: "#flavor 阿蒙提可赋予其肌肤磐石之质。#!"
 NAMING_THE_BODYS_DESTRUCTION_PERK_EFFECT: "作为[character_interaction|E]，对你知晓其[Glossary('真名','podgloss.truename')]的目标施加一个[trait|E]。\n#flavor 阿蒙提可以通过吟诵敌人身体部位的真名并令其枯萎，从而锁定目标。#!"
 SPEAKING_ALL_NAMES_PERK_EFFECT: "#flavor 阿蒙提可以通过他的真名知识以立即能够读写任何语言。#!"
 FORGETTING_THE_NAME_PERK_EFFECT: "作为[character_interaction|E]，将一名你已知其[Glossary('真名','podgloss.truename')]的角色存在彻底抹消。\n#flavor 阿蒙提可以抹去一个目标的真名，将其抹除存在并抹去所有相关记录。#!"
 PTAHS_WORD_PERK_EFFECT: "#flavor 阿蒙提可以通过吟诵其真名创造一件小型无生命物体。#!"
 WHISPERS_TO_THE_BODY_PERK_EFFECT: "作为[character_interaction|E]，只要你已知其[Glossary('真名','podgloss.truename')]，即可改变自身的生理[traits|E]。\n#flavor 阿蒙提可以通过说出自己形态的真名并命令来重塑它以及做自己想做的事。#!"
 WORDS_OF_AUTHORITY_PERK_EFFECT: "#flavor 阿蒙提说出一句话，所有听到这句话的人都有义务尽其所能地履行。#!"
 ECHO_THE_LESSER_NAME_PERK_EFFECT: "#flavor  阿蒙提仅通过聆听塞赫所带的共鸣，就能获得对基本事物或概念的真名的理解。#!"
 NAME_OF_SEKHEM_PERK_EFFECT: "每月减少5点[stress|E]\n#flavor 阿蒙提可以指挥塞赫，把它引向自己以补充自己，或把它引向盟友。#!"
 NAME_OF_SKILL_PERK_EFFECT: "#flavor 阿蒙提可以通过对该领域的真名的了解来学习或提高一项技能。#!"
 RIDDLE_OF_THE_SPHINX_PERK_EFFECT: "#flavor 阿蒙提可以提出一个问题，并向目标人物灌输回答这个问题的必要性。#!"
 BECOMING_THE_PERSON_PERK_EFFECT: "强化[GetPerk('whispers_to_the_body_perk').GetName(GetPlayer)]效果，现在可以额外调整角色性格、压力及健康[traits|E]。\n#flavor 通过使用一个人的真名，阿蒙提成为那个人，真正获得对这个人的了解。#!"
 ECHO_THE_GREATER_NAME_PERK_EFFECT: "#flavor 阿蒙提可领悟更复杂事物或概念的真名#!"
 NAME_OF_THE_ATTRIBUTE_PERK_EFFECT: "#flavor 阿蒙提可以通过使用其真名来提高其的属性。#!"
 NAMES_OF_THE_FORGOTTEN_PERK_EFFECT: "允许招募[GetMaA('the_lost_ancients').GetName]作为[men_at_arms|E]\n#flavor 通过勤奋的研究，阿蒙提可以为失去真名的东西创造一个真名。#!"
 NAME_OF_THE_WILL_PERK_EFFECT: "每月减少7点[stress|E]\n#flavor 阿蒙提可以通过使用其真名来提高其的意志力。#!"
 RENAMING_THE_HEKAU_PERK_EFFECT: "解锁一项决议，让你能从另一个[splat|E]学习#V 1#!项能力。\n#flavor 阿蒙提可以重新安排特定超自然力量的法则，例如重新定义吸血鬼的血律或法师的范式。#!"
