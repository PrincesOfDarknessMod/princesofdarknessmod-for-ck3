 SIMPLE_INERTION_PERK_EFFECT: "#flavor 木乃伊可以驱散无生命物质目标上的任何一级效果。#!"
 SIMPLE_CREATURE_PERK_EFFECT: "#flavor 木乃伊制造出一个动物小雕像（例如，老鼠或青蛙）来充当仆人。#!"
 SIMPLE_SERVITOR_PERK_EFFECT: "作为[character_interaction|E]，给予或[modifier|E]少量所选资源[gold_i][prestige_i][piety_i][dynasty_prestige_i]，代价是每月为自己增加#N 2#![static_stress|E]\n#flavor 木乃伊制造出一个小型从者来执行简单的任务。#!"
 SIMPLE_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从一级魔法控制中夺走构装体。#!"
 COMMAND_LESSER_IMPLEMENT_PERK_EFFECT: "#flavor 通过在粗劣物体上刻下简单的圣书字，木乃伊获得对其灵性本质的控制。#!"
 FALSE_DOOR_PERK_EFFECT: "#flavor 木乃伊可以在墙上创造一个门洞，或通过仪式或使用他的塞赫将墙强行变成门。#!"
 LESSER_INERTION_PERK_EFFECT: "#flavor 木乃伊可以驱散无生命物质目标上的任何二级效果。#!"
 LESSER_CHATTEL_PERK_EFFECT: "作为[character_interaction|E]，复制一件非唯一的#COMMONBROWN 普通#![artifact|E]。\n#flavor 木乃伊可以制作简单物体（如剑或划艇）的复制模型，激活后可以变成全尺寸的物体。#!"
 LESSER_CREATURE_PERK_EFFECT: "#flavor 木乃伊制作出小型动物塑像（如猫或羊）来充当仆人。#!"
 LESSER_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从二级魔法控制中夺走构装体。#!"
 COMMAND_COMPLEX_IMPLEMENT_PERK_EFFECT: "#flavor 通过在粗劣物体上刻下简单的圣书字，木乃伊获得对其灵性本质的控制。#!"
 MAJOR_INERTION_PERK_EFFECT: "#flavor 木乃伊可以驱散无生命物质目标上的任何三级效果。#!"
 COMPLEX_CHATTEL_PERK_EFFECT: "提升[GetPerk('lesser_chattel_perk').GetName(GetPlayer)]，使其能复制非唯一的#color_dark_green 大师#![artifacts|E]。\n#flavor 木乃伊可以制作更复杂的物体（如车或枪）的复制模型，激活后可以变成全尺寸的物体。#!"
 MAJOR_BOND_OF_FATE_PERK_EFFECT: "允许装备#color_dark_green 大师#!级的仆从[artifacts|E]。\n#flavor 木乃伊在俑像和其不比中型房屋大的无生命物体对应物之间建立了相似律联系以影响它。#!"
 EFFIGY_OVERSEER_PERK_EFFECT: "强化[GetPerk('simple_servitor_perk').GetName(GetPlayer)]，增加资源获取量。\n#flavor 木乃伊创造了可以被指派去协调数个从者的小雕像。主管能够理解更复杂的命令。#!"
 MAJOR_CREATURE_PERK_EFFECT: "#flavor 木乃伊制作出动物塑像（如狗或猴子）来充当仆人。#!"
 MODEST_REFLECTION_PERK_EFFECT: "允许向灵类存在赠送#COMMONBROWN 普通级#![artifacts|E]和$POD_splat_wraith_plural$\n#flavor 木乃伊可以对简单的物体施以魔法，使其可以在[UmbraGlossaryLocalized('shadowlands','冥界')]使用。#!"
 MAJOR_RELIC_PERK_EFFECT: "作为[character_interaction|E]，将一件[artifact|E]粉碎成#V 1#!个基于其[rarity|E]的碎片。\n#flavor 木乃伊可以在物质世界摧毁一个物体，以便[UmbraGlossaryLocalized('shadowlands','冥界')]创造同样的临时遗物。#!"
 MAJOR_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从三级魔法控制中夺走构装体。#!"
 MAJESTIC_REFLECTION_PERK_EFFECT: "提升[GetPerk('modest_reflection_perk').GetName(GetPlayer)]，允许你将#color_dark_green 大师#![artifacts|E]赠予$POD_splat_wraith_plural$。\n#flavor 木乃伊可以对更加复杂的物体施以魔法，使其可以在[UmbraGlossaryLocalized('shadowlands','冥界')]使用。#!"
 SUPERIOR_CHATTEL_PERK_EFFECT: "强化[GetPerk('complex_chattel_perk').GetName(GetPlayer)]：允许复制非唯一的#FAMEDBLUE 名作级#![artifacts|E]类物品。\n#flavor 木乃伊可以制作复杂物体（如飞机或电脑）的复制模型，激活后可以变成全尺寸的物体。#!"
 GREATER_RELIC_PERK_EFFECT: "强化[GetPerk('major_relic_perk').GetName(GetPlayer)]技能，将获取的碎片数量从#V 1个#!增加到#V 2#!个\n#flavor 木乃伊可以在物质世界摧毁一个物体，以便冥界创造同样的永久遗物。#!"
 SUPERIOR_CREATURE_PERK_EFFECT: "#flavor 木乃伊制作出动物塑像（如狮子或鳄鱼）来充当仆人。#!"
 GUARD_PERK_EFFECT: "强化[GetPerk('effigy_overseer_perk').GetName(GetPlayer)]技能，增加每3个月获取的资源量\n#flavor 木乃伊制造出一个小型武装雕像，它将保护分配让它守护的任何东西，直到它被摧毁。#!"
 SUPERIOR_INERTION_PERK_EFFECT: "#flavor 木乃伊可以驱散无生命物质目标上的任何四级效果。#!"
 SUPERIOR_BOND_OF_FATE_PERK_EFFECT: "强化[GetPerk('major_bond_of_fate_perk').GetName(GetPlayer)]：可以装备#FAMEDBLUE 名作级#!奴役制造的[artifacts|E]。\n#flavor 木乃伊在俑像和其任意大小的无生命物体对应物之间建立了相似律联系以影响它。#!"
 SUPERIOR_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从四级魔法控制中夺走构装体。#!"
 PRINCELY_CHATTEL_PERK_EFFECT: "强化[GetPerk('superior_chattel_perk').GetName(GetPlayer)]：允许复制非唯一的#ILLUSTRIOUSPURPLE 卓越级#![artifacts|E]。\n#flavor 木乃伊可以制作非常复杂物体（如战斗机或游轮）的复制模型，激活后可以变成全尺寸的物体。#!"
 PRINCELY_INERTION_PERK_EFFECT: "#flavor 木乃伊可以驱散无生命物质目标上的任何五级效果。#!"
 PRINCELY_REFLECTION_PERK_EFFECT: "强化[GetPerk('majestic_reflection_perk').GetName(GetPlayer)]：允许向$POD_splat_wraith_plural$赠予#FAMEDBLUE 名作级#![artifacts|E]。\n#flavor 木乃伊可以对极度复杂的物体施以魔法，使其可以在[UmbraGlossaryLocalized('shadowlands','冥界')]使用。#!"
 PRINCELY_CREATURE_PERK_EFFECT: "#flavor 木乃伊制作出任何动物的塑像来充当仆人。该动物保留了其创造者的所有能力和知识。#!"
 PRINCELY_RELIC_PERK_EFFECT: "强化[GetPerk('greater_relic_perk').GetName(GetPlayer)]技能，将获取的碎片数量从#V 2#!个增加到#V 3#!个\n#flavor 木乃伊可以在物质世界摧毁一个物体，以便[UmbraGlossaryLocalized('shadowlands','冥界')]创造同样的强化遗物。#!"
 LIVING_BOND_OF_FATE_PERK_EFFECT: "强化[GetPerk('superior_chattel_perk').GetName(GetPlayer)]可以装备#ILLUSTRIOUSPURPLE 卓越级#!奴役制造的[artifacts|E]。\n#flavor 木乃伊在俑像和其活人对应物之间建立了相似律联系以影响它。#!"
 PRINCELY_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从五级魔法控制中夺走构装体。#!"
 THE_CRAWLING_EYE_PERK_EFFECT: "强化[GetPerk('guard_perk').GetName(GetPlayer)]增加资源获取量。\n#flavor 木乃伊可以制造小昆虫塑像，并把它作为间谍。#!"
 MAJOR_RESTORATION_PERK_EFFECT: "$unlock_forging_node$ 消耗3个#COMMONBROWN 普通#!或#color_dark_green 大师级#!宝物碎片，根据[artifact|E]类型添加1或2个修正。\n#flavor 木乃伊可以通过其在[UmbraGlossary('shadowlands')]的灵性残留来重新创造出被摧毁的小物件。#!"
 VIZIERS_BEAST_PERK_EFFECT: "#flavor 通过俑像制造出可以用普通食物而非塞赫来维持的三级生物。#!"
 SANCTIFY_CHATTEL_PERK_EFFECT: "允许向$POD_splat_wraith_plural$赠送[gold|E]。\n强化[GetPerk('princely_reflection_perk').GetName(GetPlayer)]：允许向$POD_splat_wraith_plural$赠予#ILLUSTRIOUSPURPLE 卓越级#![artifacts|E]。\n#flavor 木乃伊可以对任意物体施以魔法，使其可以在[UmbraGlossaryLocalized('shadowlands','冥界')]使用。#!"
 SCEPTER_OF_THE_VIZIER_PERK_EFFECT: "#flavor 木乃伊制造出允许其他人控制他的最高一级俑像的节杖。#!"
 VIZIERS_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从六级魔法控制中夺走构装体。#!"
 GREATER_RESTORATION_PERK_EFFECT: "$unlock_forging_node$消耗3个#FAMEDBLUE 名作级#!宝物碎片，根据[artifact|E]类型添加3条修正。\n#flavor 木乃伊可以通过其在[UmbraGlossary('shadowlands')]的灵性残留来重新创造出被摧毁的复杂物件。#!"
 SPIRIT_SCEPTER_PERK_EFFECT: "#flavor 木乃伊制造出灵杖——权威之节杖——可以透过尸幕伤害生物。#!"
 KINGLY_BEAST_PERK_EFFECT: "#flavor 通过俑像制造出可以用普通食物而非塞赫来维持的四级生物。#!"
 GREATER_SCEPTER_OF_THE_VIZIER_PERK_EFFECT: "#flavor 木乃伊制造出允许其他人控制他的最高三级俑像的节杖。#!"
 STALKING_HOUND_OF_TYPHON_PERK_EFFECT: "强化[GetPerk('the_crawling_eye_perk').GetName(GetPlayer)]技能，增加每3个月获取的资源量\n#flavor 木乃伊创造大致上有一张野兽的脸和强有力的利爪的小型人形雕像。#!"
 KINGLY_WREST_PERK_EFFECT: "#flavor 木乃伊可以尝试从七级魔法控制中夺走构装体。#!"
 EFFIGY_OF_SIN_PERK_EFFECT: "#flavor 通过牺牲自己并自愿承担他人的罪过，木乃伊可以在玛阿特的审判面前免除这些罪过。#!"
 PRINCELY_RESTORATION_PERK_EFFECT: "$unlock_forging_node$消耗3个#ILLUSTRIOUSPURPLE 卓越级#!宝物碎片，根据[artifact|E]类型添加4条修正。\n#flavor 木乃伊可以通过其在[UmbraGlossary('shadowlands')]的灵性残留来重新创造出被摧毁的极度复杂物件。#!"
 DIVINE_BEAST_PERK_EFFECT: "#flavor 通过俑像制造出可以用普通食物而非塞赫来维持的五级生物。#!"
