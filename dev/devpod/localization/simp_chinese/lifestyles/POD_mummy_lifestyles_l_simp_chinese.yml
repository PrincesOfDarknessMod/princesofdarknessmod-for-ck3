 SIMPLE_WEATHER_MAGIC_PERK_EFFECT: "作为[character_interaction|E]，操控目标所在[county|E]的天气。\n#flavor 木乃伊对当地环境中产生了一个小型的、非破坏性的改变。#!"
 GRIP_THE_WATER_PERK_EFFECT: "解锁[GetPerk('simple_weather_magic_perk').GetName(GetPlayer)]的#V 洪水#!选项[character_interaction|E]\n#flavor 乃伊可以提高或降低水体的水平。#!"
 BECALM_PERK_EFFECT: "可增强或减弱自然灾害。\n免疫所有天界战争的[modifiers|E]。\n#flavor 木乃伊在她所到之处消除了不利的天气影响。#!"
 WEATHER_SIGHT_PERK_EFFECT: "可预知自然灾害。\n#flavor 木乃伊可以非常准确地预测天气。#!"
 HANGING_THE_STARS_PERK_EFFECT: "#flavor 木乃伊可以推迟赫考的效果，直到她想要发动它的时候。#!"
 HIDING_THE_STARS_PERK_EFFECT: "#flavor 木乃伊被掩盖在占卜或定位法术之外。#!"
 LESSER_WEATHER_MAGIC_PERK_EFFECT: "提升[GetPerk('simple_weather_magic_perk').GetName(GetPlayer)]，使其能针对整个[duchy|E]生效。\n#flavor 如同简易天气魔法，但木乃伊能造成更大的改变。#!"
 WEATHER_WHISPERS_PERK_EFFECT: "#flavor 木乃伊能够听到发生在她现在位置的上风口的对话。#!"
 BOOK_OF_THOTH_PERK_EFFECT: "如果有人打算谋杀你的朋友或家人，你会收到通知。\n#flavor 通过呢喃咒语，木乃伊可以获得对其周围环境中的秘密的认知。#!"
 SAHU_RA_PERK_EFFECT: "在[combat_phase|E]期间作为[commander|E]时，或在进行[single_combat_duel_plural|E]时，对身为$POD_splat_vampire_plural$（或其他惧怕太阳的 [splats|E]）的敌方[knights|E]和[commanders|E]或你的对手造成伤害。\n#flavor 木乃伊闪耀着阳光的力量。#!"
 READ_THE_STARS_PERK_EFFECT: "作为[character_interaction|E]，给予你的目标[GetModifier('POD_hekau_read_the_stars_modifier').GetNameWithTooltip]，持续 5 年。\n#flavor 木乃伊能根据环境调整魔法，为其后续仪式增添助力。#!"
 MAJOR_WEATHER_MAGIC_PERK_EFFECT: "提升[GetPerk('lesser_weather_magic_perk').GetName(GetPlayer)]，使其能针对整个[kingdom|E]生效。\n#flavor 如同简易天气魔法，但木乃伊能造成更大的改变。#!"
 CALL_THE_STARS_PERK_EFFECT: "在 [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)][character_interaction|E]中解锁#V 陨石雨#!选项，使[development|E] 等级降低#N 2#!。\n#flavor 通过呼唤努特，木乃伊召唤出毁灭性的流星雨。#!      "
 DIVINE_FORMS_PERK_EFFECT: "作为[character_interaction|E]，给予自己一个[modifier|E]，使自选的[skill|E]增加#P +3#!#weak ([GetModifier('POD_hekau_divine_form_diplomacy_modifier').GetNameWithTooltip])#!。\n#flavor 通过召唤一位神灵，木乃伊能暂时提高其的一项属性。#!"
 GREATER_WEATHER_MAGIC_PERK_EFFECT: "提升[GetPerk('major_weather_magic_perk').GetName(GetPlayer)]，使其能针对整个[empire|E]生效。\n#flavor 如同简易天气魔法，但木乃伊能造成更大的改变。#!"
 SANDSTORM_PERK_EFFECT: "在[GetPerk('simple_weather_magic_perk').GetName(GetPlayer)][character_interaction|E]中解锁#V 沙漠风暴#!选项。\n#flavor 木乃伊召唤出毁灭性的沙尘暴。#!"
 READ_THE_TREE_OF_LIFE_PERK_EFFECT: "#flavor 木乃伊可以读取任何一个人的命运，窥视他们的过去或未来。#!"
 WISDOM_OF_ISIS_PERK_EFFECT: "对天气魔法免疫。\n获得对所有形式魔法的高度抗性。\n#flavor 通过向伊西斯祈求，木乃伊能反制敌人的魔法。#!"
 RAS_AWAKENING_PERK_EFFECT: "你所有的[children|E]将获得[GetModifier('POD_hekau_ras_awakening_modifier').GetNameWithTooltip]。\n#flavor 木乃伊将拉的力量引导至最多五个目标。#!"
 POTENT_WEATHER_MAGIC_PERK_EFFECT: "提升[GetPerk('lesser_weather_magic_perk').GetName(GetPlayer)]，使其能针对整个大陆生效。\n#flavor 如同简易天气魔法，但木乃伊能造成更大的改变。#!"
 ROUSING_APOPHIS_PERK_EFFECT: "将[GetPerk('call_the_stars_perk').GetName(GetPlayer)]的#V 陨石雨#!选项升级为#V 末日降临#!，使[development|E]降低#N 5#!。\n#flavor 木乃伊引发了一场地震。#!"
 PLAGUE_OF_MAAT_PERK_EFFECT: "作为[character_interaction|E]，在你目标当前所在地点召唤一场普通的[epidemic|E]。\n#flavor 木乃伊可以调用埃及十灾。#!"
 DIVINE_GREATNESS_PERK_EFFECT: "提升[GetPerk('divine_forms_perk').GetName(GetPlayer)]，将[modifier|E]增加量由#P +3#!改为#P +6#!#weak ([GetModifier('POD_hekau_divine_greatness_diplomacy_modifier').GetNameWithTooltip])#!。\n#flavor 如同神圣形态，但效果更强。#!"
 GEBS_GRASP_PERK_EFFECT: "#flavor 此法术针对施法者视线范围内的任何一个对象。增加受术者所经历的重力。#!"
 INUNDATION_OF_THE_NILE_PERK_EFFECT: "来自[GetPerk('grip_the_water_perk').GetName(GetPlayer)]的#V 洪水#!不再需要消耗而且持续时间更长。\n#flavor 这一仪式可能制造可怕的洪水，或者让河床干涸只剩下孤零零的水坑。#!"
 CALL_OF_THE_NORTH_STAR_PERK_EFFECT: "#flavor 这个有用的咒语根据施法者的意愿调整该地区的磁力。#!"
 FESTIVAL_OF_MAAT_PERK_EFFECT: "作为[character_interaction|E]，将500[piety_i]转化为5点[GetTrait('integrity').GetName(GetPlayer)][trait_level_track_xp|E]若你没有[GetTrait('integrity').GetName(GetPlayer)]则减少-5[static_stress|E]。\n#flavor 在有限时间内获得仪式参与者的福祉。#!"
 ARCH_OF_NUIT_PERK_EFFECT: "#flavor 该仪式通过阻碍所有负面灵性能量来增强努特的保护性影响。#!"
 CYCLE_OF_RA_PERK_EFFECT: "在[GetPerk('simple_weather_magic_perk').GetName(GetPlayer)] [character_interaction|E]中解锁#V 操纵险棘#!选项。\n#flavor 此法术使施法者散发出拉那令人目眩的光芒，并使其在昼夜循环中快速脉动。#!"
 STAR_OF_THE_MESSIAH_PERK_EFFECT: "#flavor 该仪式允许临时操纵凡人影响，让那些收到迹象的人以为施法者在某种程度上是他们希望和梦想的关键。#!"
 WHISPERS_OF_THE_TREE_OF_LIFE_PERK_EFFECT: "作为[character_interaction|E]，给予自[GetModifier('POD_hekau_whispers_of_the_tree_of_life_modifier').GetNameWithTooltip]，持续2年。\n#flavor 流遍宇宙中的塞赫脉流携带着对生命之树所持有的秘密的低语，而这法术让木乃伊能通过探究这个神秘的脉流来倾听它们。#!"
 CROSSED_BY_THE_STARS_PERK_EFFECT: "作为[character_interaction|E]，使你的目标遭受[GetModifier('POD_hekau_crossed_by_the_stars_modifier').GetNameWithTooltip]。\n#flavor 天体赫考的大师们学会通过将敌人与凶兆、负面影响力以及“灾星”莫名地捆绑在一起来击败他们。#!"
