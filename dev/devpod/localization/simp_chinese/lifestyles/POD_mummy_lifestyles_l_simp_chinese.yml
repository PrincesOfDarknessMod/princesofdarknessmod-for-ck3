 POTENT_ELIXIR_PERK_EFFECT: "强化[GetPerk('complex_elixir_perk').GetName(GetPlayer)]，将[GetModifier('complex_elixir_diplomacy_modifier').GetNameWithTooltip]替换为[GetModifier('potent_elixir_diplomacy_modifier').GetNameWithTooltip]\n#flavor 木乃伊制造了一种更强大的灵药，对单一属性进行了提升。#!"
