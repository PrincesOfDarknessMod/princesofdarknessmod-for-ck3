l_simp_chinese:
 pod_power_struggle_diarchy_type: "权力斗争"
 pod_power_struggle_diarch_title: "共治者"
 pod_diarch_domain_limit_bonus: "共治者的支持"
 pod_diarch_stress_malus: "在权力斗争"
 pod_diarch_prestige_bonus: "为权力斗争"
 diarch_value_good_ventrue_name: "氏族利益先于个人恩怨"
 POD_start_powerstruggle_decision: "发起权力斗争"
 POD_start_powerstruggle_decision_desc: "你的领主很弱，但一场内战可能会带来巨大的损失。然而，还有其他方法可以获得你所渴望的权力。"
 POD_start_powerstruggle_decision_tooltip: "这个国度需要在领导层进行改变！"
 POD_start_powerstruggle_decision_effect_tooltip: "你将威胁你的领主给你更多的权力。\n如果其接受，这将开始权力斗争共治，由你担任共治者。\n如果其拒绝，这将使其失去很多威望并赢得其的敌意。"
 POD_start_powerstruggle_decision_confirm: "这是我的要求！"
 diarchy_prestige_tt: "你的威望要比你的领主更高。"
 POD_diarchy_events.0002.t: "你的领导权被争夺！"
 POD_diarchy_events.0002.desc: "你的一个野心勃勃的封臣最近提出了对你的权力的挑战。其利用自己强大的军事力量、巨大的威望和其不喜欢你的事实，现在公开要求在你的王国里进行新的权力分配。\n现在其的要求已经完成，这将是难以对抗的，但你仍然可以做最后的努力来进行遏制。另一个选择是接受其的要求，毕竟这样的约定可能有一些好处。"
 POD_diarchy_events.0002.a: "这是“我的”灵地！"
 liege_warning_diarchy_tt: "之所以发生这种情况，是因为该封臣有更多的威望、军事力量和对你的负面好感。\n如果你现在拒绝他们的要求，只要他们仍然符合前提，他们就能在10年后再次提出要求。"
 POD_diarchy_events.0002.b: "领地可能会从这样的动荡中受益。"
 POD_diarchy_events.0003.t: "暴君！"
 POD_diarchy_events.0003.desc: "你完全合法的“提议”在国度建立一个新的权力分配，却被你的暴君领主拒绝。这使其在国度的眼中失去了相当多的合法性，并可能在未来为你带来新的机遇。这也激怒了其，但显然这是你在夺权道路上付出的一个小代价。"
 POD_diarchy_events.0003.a: "时间在我这边。"
 POD_diarchy_events.0004.t: "共治者万岁！"
 POD_diarchy_events.0004.desc: "你完全合法的“提议”在国度建立一个新的权力分配，已经被你明智的领主接受。这是一个巨大的机会，让你展示你的能力。也许如果你做得足够好，并在这个过程中设法让你的领主靠边，你也许能够说服国度，彻底改变领导层……"
 POD_diarchy_events.0004.a: "我的第一项改革将是……"
 POD_end_powerstruggle_decision: "放弃权力斗争"
 POD_end_powerstruggle_decision_tooltip: "是时候结束这无稽之谈了。"
 POD_end_powerstruggle_decision_desc: "有些权力斗争永远不会有结果，最终只会削弱双方的力量。也许是时候放弃这把戏了，把你从领主那里夺走的权力还给他。"
 POD_end_powerstruggle_decision_confirm: "获取权力还有其他途径"
 diarchy_legitimacy_tt: "你需要拥有比你的领主更高的正统性。"
 diarchy_military_strength_tt: "你需要拥有超过你领主最大军事力量（以军队数量表示）的150%。"