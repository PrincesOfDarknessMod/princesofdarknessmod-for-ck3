l_simp_chinese:
 PoD_war_of_seasons: "四季之战"
 PoD_war_of_seasons_desc: "The War of Seasons is a long standing conflict between the four Seasonal Courts fighting over the dominance of the Autumn World. Even though an Oath-Truce was signed, it already expired and fighting can once more continue. But will it?"
 situation_type_PoD_war_of_seasons: "$PoD_war_of_seasons$"
 situation_type_PoD_war_of_seasons_desc: "$PoD_war_of_seasons_desc$"
 situation_PoD_war_of_seasons: "$PoD_war_of_seasons$"
 situation_PoD_war_of_seasons_desc: "$PoD_war_of_seasons_desc$"
 PoD_war_of_seasons_sub_region_core: "$PoD_war_of_seasons$"
 PoD_war_of_seasons_sub_region_core_desc: "$PoD_war_of_seasons_desc$"
 PoD_war_of_seasons_situation_status_quo: "僵持"
 PoD_war_of_seasons_situation_status_quo_icon: "@fae_icon!$PoD_war_of_seasons_situation_status_quo$"
 PoD_war_of_seasons_situation_status_quo_desc_short: "僵持"
 PoD_war_of_seasons_situation_status_quo_desc: "Oath Truce should have ended in 1230. But we are not fully convinced into returning into War, nor to fully abandon our rightful hatred.\n\n...But such state cannot last forever, sooner or later hatred will flourish in war, or maybe it will completely die out?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_status_quo_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 PoD_war_of_seasons_situation_war: "四季之战"
 PoD_war_of_seasons_situation_war_icon: "@fae_icon!$PoD_war_of_seasons_situation_war$"
 PoD_war_of_seasons_situation_war_desc_short: "战争"
 PoD_war_of_seasons_situation_war_desc: "Oath Truce has ended. War is upon us, Fighting between [Concept('religion','Courts')|E] flare in glorious fire. And there can be only one winner! Pick the swords, cast [cantrips|E] and kill them all!\n\n... But maybe, just maybe. We can reconcile again? Bring Oath Truce into life again?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_war_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 PoD_war_of_seasons_situation_peace: "和谐"
 PoD_war_of_seasons_situation_peace_icon: "@fae_icon!$PoD_war_of_seasons_situation_peace$"
 PoD_war_of_seasons_situation_peace_desc_short: "僵持"
 PoD_war_of_seasons_situation_peace_desc: "Oath Truce was a great success, hatred between [Concept('religion','Courts')|E] has slowly died out. And what once was considered impossible, a friendship between members of different [Concept('religion','Courts')|E] has sprout, and we can all finally unite? Like at the old times, right? Friends?\n\n... But hatred hasn't died fully, there are small fires of conflict. What would happen if they fully sprout? Would war return?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_peace_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"
 PoD_war_of_seasons_participant_group_spring_fae: "$spring_court_religion$妖精"
 PoD_war_of_seasons_participant_group_spring_fae_desc: "$spring_court_religion_desc$"
 PoD_war_of_seasons_participant_group_summer_fae: "$summer_court_religion$妖精"
 PoD_war_of_seasons_participant_group_summer_fae_desc: "$summer_court_religion_desc$"
 PoD_war_of_seasons_participant_group_autumn_fae: "$autumn_court_religion$妖精"
 PoD_war_of_seasons_participant_group_autumn_fae_desc: "$autumn_court_religion_desc$"
 PoD_war_of_seasons_participant_group_winter_fae: "$winter_court_religion$妖精"
 PoD_war_of_seasons_participant_group_winter_fae_desc: "$winter_court_religion_desc$"
 PoD_war_of_seasons_participant_group_solstice_fae: "$solstice_court_religion$妖精"
 PoD_war_of_seasons_participant_group_solstice_fae_desc: "$solstice_court_religion_desc$"
 PoD_war_of_seasons_character_effects: "#bold 角色#!"
 PoD_war_of_seasons_character_effects_concept: "[GetSituationType('PoD_war_of_seasons').GetName]"
 PoD_war_of_seasons_court_effects: "#bold 王廷#!"
 PoD_war_of_seasons_court_effects_concept: "[GetSituationType('PoD_war_of_seasons').GetName]"
 situation_parameter_war_of_seasons_situation_war_active: "All Kithain [faiths|E] will gain [GetDoctrine('special_doctrine_war_of_seasons_hostility_war').GetBaseName] for duration of [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]"
 situation_parameter_war_of_seasons_situation_peace_active_active: "所有戚族[faiths|E]将在[GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]期间获得[GetDoctrine('special_doctrine_war_of_seasons_hostility_peace').GetBaseName]"
 situation_parameter_war_of_seasons_convert_to_militant_fraction: "解锁[character_interaction|E]对[court_leader|E]的使用，将同一[Concept('religion','王廷')|E]中的$POD_splat_fae$转化为[GetFaithDoctrine('doctrine_fae_agenda_militant').GetBaseName]"
 situation_parameter_war_of_seasons_convert_to_truce_bearer_fraction: "Unlock [character_interaction|E] for [court_leader|E], to convert $POD_splat_fae$ of the same [Concept('religion','Court')|E] to become [GetFaithDoctrine('doctrine_fae_agenda_trucebearer').GetBaseName]"
 situation_parameter_war_of_seasons_unlock_peace_objective: "解锁目标，让一位[court_leader|E]一劳永逸地终结[GetSituationType('PoD_war_of_seasons').GetName]。"
 situation_parameter_war_of_seasons_unlock_war_objective: "解锁让一位[court_leader|E]在[GetSituationType('PoD_war_of_seasons').GetName]中宣布你的季节为胜利的目标。"
 PoD_war_of_seasons_return_to_base_desc: "缓慢回升至#bold 0#!点"
 PoD_war_of_seasons_kill_court: "谋杀"
 PoD_war_of_seasons_kill_court_desc: "杀死来自其他[Concept('religion', '王廷')|E]的$POD_splat_fae$"
 PoD_war_of_seasons_start_war_court: "开战[war|E]"
 PoD_war_of_seasons_start_war_court_desc: "对来自其他[Concept('religion','王廷')|E]的$POD_splat_fae$发动[war|E]"
 PoD_war_of_seasons_win_war_court: "赢得[war|E]"
 PoD_war_of_seasons_win_war_court_desc: "Win [war|E] against $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_gain_rival_court: "获得[rival|E]"
 PoD_war_of_seasons_gain_rival_court_desc: "从其他[Concept('religion', '王廷')|E]获取[rival|E]$POD_splat_fae$"
 PoD_war_of_seasons_usurp_title_court: "篡夺 [title]|E"
 PoD_war_of_seasons_usurp_title_court_desc: "篡夺/获取对$POD_splat_fae$的[title|E]宣称，来自其他[Concept('religion', '王廷')|E]"
 PoD_war_of_seasons_gift_court: "赠送"
 PoD_war_of_seasons_gift_court_desc: "Gift [gold|E] or [artifact|E] to $POD_splat_fae$ from other [Concept('religion', 'Court')|E]"
 PoD_war_of_seasons_befriend_court: "结交"
 PoD_war_of_seasons_befriend_court_desc: "与其他[Concept('religion', '王廷')|E]的$POD_splat_fae$交好"
 PoD_war_of_seasons_seduce_court: "引诱"
 PoD_war_of_seasons_seduce_court_desc: "从其他[Concept('religion', '王廷')|E]中引诱$POD_splat_fae$"
 PoD_war_of_seasons_sign_truce_outside_war__court: "True outside [war|E]"
 PoD_war_of_seasons_sign_truce_outside_war_court_desc: "在[war|E]之外与来自其他[Concept('religion', '王廷')|E]的$POD_splat_fae$签署[truce|E]"
 PoD_war_of_seasons_pay_random_court: "支付赎金"
 PoD_war_of_seasons_pay_random_court_desc: "支付赎金以将$POD_splat_fae$从其他[Concept('religion', '王廷')|E]中释放"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS: "[Concept('religion', '王廷')|E]领袖"
 PODWarOfSeasonsLeader_spring: "Leader of Spring"
 PODWarOfSeasonsLeader_summer: "Summer Sovereign"
 PODWarOfSeasonsLeader_autumn: "Autumn Autocrat"
 PODWarOfSeasonsLeader_winter: "Winter Warlord"
 PODWarOfSeasonsLeader_solstice: "Solstice Leader"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_WAR: "This bar shows progress towards [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]. It currently is at [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_PEACE: "This bar shows progress towards [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]. It currently is at [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_STATUS_QUO: "This bar shows progress towards [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo').GetName]. It currently is at [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetTakeoverPoints]"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL: "当任意进度条填满时，[GetSituationType('PoD_war_of_seasons').GetName]将向对应的[situation_phase|E]推进。另一条进度条进展多少并不重要，关键在于哪一条先完全填满。"
 WINDOW_POD_WAR_OF_SEASONS_FUTURE_EFFECTS: "未来阶段产生的效果"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING: "[GetReligionByKey('spring_court_religion').GetName]领袖由所有[independent_rulers|E]的民众投票选举产生。\n\n选举每#V 10年#!举行一次，但可通过消耗[prestige|E]来强制举行。"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING_BUTTON: "开始选举！"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SUMMER: "[GetReligionByKey('summer_court_religion').GetName]领袖的选拔基于其[vassals|E]。拥有最多[vassals|E]的$POD_splat_fae$将被选中。\n\n\n"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN: "[GetReligionByKey('autumn_court_religion').GetName] Leaders are not chosen, but replaced. Every Autumn $POD_splat_fae$ can start [scheme|E] against current leader to replace them.[AddTextIf(Not(ObjectsEqual(GetPlayer.Self,Situation.MakeScope.GetVariable('autumn_leader').Char)), Localize('WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT'))]"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT: "\n\nClicking button will open [character_interaction|E] to start [scheme|E]"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON: "到了[scheming|E]的时候了"
 autumn_button_script: "这将针对[GetSituation('PoD_war_of_seasons').MakeScope.GetVariable('autumn_leader').Char.GetName]展开[character_interaction|E]#V $PODClaimLeadership_scheme_interaction$#!。"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_WINTER: "[GetReligionByKey('winter_court_religion').GetName] Leaders are chosen based on their [dread|E]. $POD_splat_fae$ with highest [dread|E] among [independent_rulers|E] will be chosen as $PODWarOfSeasonsLeader_winter$\n\nThis is checked every #V year#!"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE: "[GetReligionByKey('solstice_court_religion').GetName] Don't have a leader. They are too small, too marginalized for other [Concept('religion', 'Court')|E] to think about them as an equal.\n\nBut you can change that. With enough [realm|E] size and number of [vassals|E] you could force yourself into position of power."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_BUTTON: "我们需要被听见！"
 solstice_button_script_vassal: "你需要25名#V [vassals|E]#!！#weak (#V [SCOPE.GetValue('vassal_num')]#!)#!"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_LEADER: "[GetReligionByKey('solstice_court_religion').GetName] Leaders are heritable from First Solstice Leader up to their children.\n\nIf main line of Solstice Leaders would die out, random Solstice ruler would step up onto potion of power."