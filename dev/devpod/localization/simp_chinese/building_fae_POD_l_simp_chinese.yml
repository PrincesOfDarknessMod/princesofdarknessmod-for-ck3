 building_type_manor_freehold_01:0 "庄园"
 building_type_manor_freehold_01_desc:0 "#F 庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。#!"
 building_manor_freehold_01:0 "小型庄园"
 building_manor_freehold_01_desc:0 "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_manor_freehold_02:0 "中型庄园"
 building_manor_freehold_02_desc:0 "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
