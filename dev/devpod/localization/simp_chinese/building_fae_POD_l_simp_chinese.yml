l_simp_chinese:
 GLADE_FREEHOLD_BUILDING_ENABLED:0 "省份是丛林[terrain|E]、森林[terrain|E]、或针叶林[terrain|E]"
 EYRIE_FREEHOLD_BUILDING_ENABLED:0 "省份是山地[terrain|E]或沙漠山地[terrain|E]"
 building_type_glade_freehold_01:0 "秘境"
 building_type_glade_freehold_01_desc:0 "#F 秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。与大多数永契堡不同，秘境是自然形成的梦华之源。#!"
 building_glade_freehold_01:0 "小型秘境"
 building_glade_freehold_01_desc:0 "秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。"
 building_glade_freehold_02:0 "中型秘境"
 building_glade_freehold_02_desc:0 "秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。"
 building_glade_freehold_03:0 "大型秘境"
 building_glade_freehold_03_desc:0 "秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。"
 building_type_hearth_freehold_01:0 "炉地"
 building_type_hearth_freehold_01_desc:0 "#F 炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。只要有东西可以交易，所有的换生灵都受到欢迎。#!"
 building_hearth_freehold_01:0 "小型炉地"
 building_hearth_freehold_01_desc:0 "炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。"
 building_hearth_freehold_02:0 "中型炉地"
 building_hearth_freehold_02_desc:0 "炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。"
 building_hearth_freehold_03:0 "大型炉地"
 building_hearth_freehold_03_desc:0 "炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。"
 building_type_lodge_freehold_01:0 "门房"
 building_type_lodge_freehold_01_desc:0 "#F 村舍、房屋和豪宅，统称为门房，都能是永契堡。门房通常是贵族的据点，他们大部分时间都在那里居住。#!"
 building_lodge_freehold_01:0 "小型门房"
 building_lodge_freehold_01_desc:0 "村舍、房屋和豪宅，统称为门房，都能是永契堡。"
 building_lodge_freehold_02:0 "中型门房"
 building_lodge_freehold_02_desc:0 "村舍、房屋和豪宅，统称为门房，都能是永契堡。"
 building_lodge_freehold_03:0 "大型门房"
 building_lodge_freehold_03_desc:0 "村舍、房屋和豪宅，统称为门房，都能是永契堡。"
 building_type_manor_freehold_01:0 "庄园"
 building_type_manor_freehold_01_desc:0 "#F 庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。#!"
 building_manor_freehold_01:0 "小型庄园"
 building_manor_freehold_01_desc:0 "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_manor_freehold_02:0 "中型庄园"
 building_manor_freehold_02_desc:0 "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_manor_freehold_03:0 "大型庄园"
 building_manor_freehold_03_desc:0 "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_type_eyrie_freehold_01:0 "鹰巢"
 building_type_eyrie_freehold_01_desc:0 "#F 鹰巢是高山上的永契堡，通常是被遗弃者的避难所。#!"
 building_eyrie_freehold_01:0 "小型鹰巢"
 building_eyrie_freehold_01_desc:0 "鹰巢是高山上的永契堡，通常是被遗弃者的避难所。"
 building_eyrie_freehold_02:0 "中型鹰巢"
 building_eyrie_freehold_02_desc:0 "鹰巢是高山上的永契堡，通常是被遗弃者的避难所。"
 building_eyrie_freehold_03:0 "大型鹰巢"
 building_eyrie_freehold_03_desc:0 "鹰巢是高山上的永契堡，通常是被遗弃者的避难所。"
 building_type_grotto_freehold_01:0 "石窟"
 building_type_grotto_freehold_01_desc:0 "#F 石窟通常是杂草丛生的秘境或废弃矿井。斯珞俄和诺克经常聚集在这样偏僻的永契堡上，不过其他族也经常使用它。#!"
 building_grotto_freehold_01:0 "小型石窟"
 building_grotto_freehold_01_desc:0 "石窟通常是杂草丛生的秘境或废弃矿井。"
 building_grotto_freehold_02:0 "中型石窟"
 building_grotto_freehold_02_desc:0 "石窟通常是杂草丛生的秘境或废弃矿井。"
 building_grotto_freehold_03:0 "大型石窟"
 building_grotto_freehold_03_desc:0 "石窟通常是杂草丛生的秘境或废弃矿井。"
 building_type_faerie_ring_freehold_01:0 "妖精环"
 building_type_faerie_ring_freehold_01_desc:0 "#F 妖精环通常是一种位于森林深处的非常小的幽谷。随着荒野的减少，这些自然形成的永契堡越来越稀有。#!"
 building_faerie_ring_freehold_01:0 "小型妖精环"
 building_faerie_ring_freehold_01_desc:0 "妖精环通常是一种位于森林深处的非常小的幽谷。"
 building_faerie_ring_freehold_02:0 "中型妖精环"
 building_faerie_ring_freehold_02_desc:0 "妖精环通常是一种位于森林深处的非常小的幽谷。"
 building_faerie_ring_freehold_03:0 "大型妖精环"
 building_faerie_ring_freehold_03_desc:0 "妖精环通常是一种位于森林深处的非常小的幽谷。"
 building_type_isle_freehold_01:0 "隐岛"
 building_type_isle_freehold_01_desc:0 "#F 这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。隐岛是私人的避难所，是最具价值的永契堡之一。#!"
 building_isle_freehold_01:0 "小型隐岛"
 building_isle_freehold_01_desc:0 "这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。"
 building_isle_freehold_02:0 "中型隐岛"
 building_isle_freehold_02_desc:0 "这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。"
 building_isle_freehold_03:0 "大型隐岛"
 building_isle_freehold_03_desc:0 "这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。"
 building_type_thorpe_freehold_01:0 "妖精乡"
 building_type_thorpe_freehold_01_desc:0 "#F 妖精乡即是妖精的村镇。#!"
 building_thorpe_freehold_01:0 "小型妖精乡"
 building_thorpe_freehold_01_desc:0 "妖精乡即是妖精的村镇。"
 building_thorpe_freehold_02:0 "中型妖精乡"
 building_thorpe_freehold_02_desc:0 "妖精乡即是妖精的村镇。"
 building_thorpe_freehold_03:0 "大型妖精乡"
 building_thorpe_freehold_03_desc:0 "妖精乡即是妖精的村镇。"
 building_type_urban_freehold_01:0 "都市契堡"
 building_type_urban_freehold_01_desc:0 "#F 只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。这里的板讷是最高的，而未受污染的梦华是稀缺的。这些永契堡处于永冬末日的边缘。#!"
 building_urban_freehold_01:0 "小型都市契堡"
 building_urban_freehold_01_desc:0 "只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。"
 building_urban_freehold_02:0 "中型都市契堡"
 building_urban_freehold_02_desc:0 "只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。"
 building_urban_freehold_03:0 "大型都市契堡"
 building_urban_freehold_03_desc:0 "只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。"
 building_type_market_freehold_01:0 "市场"
 building_type_market_freehold_01_desc:0 "#F 妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。这些地方通常与人类市场暗中共享空间，尽管它们大概率完全存在于[dreaming|E]中，如精灵市集。有时人类会“意外”地购买到一件妖精制品。这交易对疏忽的人类来说可能是幸运的，也可能是灾难性的。#!"
 building_market_freehold_01:0 "小型市场"
 building_market_freehold_01_desc:0 "妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。"
 building_market_freehold_02:0 "中型市场"
 building_market_freehold_02_desc:0 "妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。"
 building_market_freehold_03:0 "大型市场"
 building_market_freehold_03_desc:0 "妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。"
 building_type_homestead_freehold_01:0 "宅地"
 building_type_homestead_freehold_01_desc:0 "#F 宅地是完全在[dreaming|E]中的永契堡，但没有通往梦梯的入口。它们不具备大多数永契堡的双重性质；它们的主要优点是稳定。戚族建造宅地，以抵御[dreaming|E]的严酷考验。宅地的人数不多，但却有强烈的独立性。来自各族的换生灵在近[dreaming|E]建立了宅地（甚至是小村庄）。#!"
 building_homestead_freehold_01:0 "小型宅地"
 building_homestead_freehold_01_desc:0 "宅地是完全在[dreaming|E]中的永契堡，但没有通往梦梯的入口。"
 building_homestead_freehold_02:0 "中型宅地"
 building_homestead_freehold_02_desc:0 "宅地是完全在[dreaming|E]中的永契堡，但没有通往梦梯的入口。"
 building_homestead_freehold_03:0 "大型宅地"
 building_homestead_freehold_03_desc:0 "宅地是完全在[dreaming|E]中的永契堡，但没有通往梦梯的入口。"
 GROTTO_FREEHOLD_BUILDING_ENABLED:0 "省份有秘境[building|E]或任何矿产[special_building|E]"
 building_type_land_trod_01:0 "地之仙路"
 building_type_land_trod_01_desc:0 "#F 地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。它们可以穿过田园诗般的妖精城镇，也可以经过真的在燃烧的沙漠，或者穿过迷雾和低吟的森林。换生灵可以沿着这些道路步行、骑马或开车；旅行方式只受地形的限制。#!"
 building_land_trod_01:0 "小型地之仙路"
 building_land_trod_01_desc:0 "地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。"
 building_land_trod_02:0 "中型地之仙路"
 building_land_trod_02_desc:0 "地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。"
 building_land_trod_03:0 "大型地之仙路"
 building_land_trod_03_desc:0 "地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。"
 building_type_water_trod_01:0 "水之仙路"
 building_type_water_trod_01_desc:0 "#F 这些仙路可能小如山涧，也可能大如汪洋。由于缺乏可识别的地标，在该类型的仙路上旅行的人必须依靠海图和其他导航珍宝来安全地穿越。#!"
 building_water_trod_01:0 "小型水之仙路"
 building_water_trod_01_desc:0 "这些仙路可能小如山涧，也可能大如汪洋。"
 building_water_trod_02:0 "中型水之仙路"
 building_water_trod_02_desc:0 "这些仙路可能小如山涧，也可能大如汪洋。"
 building_water_trod_03:0 "大型水之仙路"
 building_water_trod_03_desc:0 "这些仙路可能小如山涧，也可能大如汪洋。"
 building_type_sun_trod_01:0 "日之仙路"
 building_type_sun_trod_01_desc:0 "#F 日之仙路是只在白天开放的天路。只有那些会飞的换生灵（即使是使用气球）才可以穿越这些空灵的公路。日之仙路可能以聚焦的太阳光轴的形式出现，也可能是照着阳光的云层路径。在日之仙路上旅行的换生灵必须提前找到月之仙路，以便在天黑后继续他们的旅行。#!"
 building_sun_trod_01:0 "小型日之仙路"
 building_sun_trod_01_desc:0 "日之仙路是只在白天开放的天路。"
 building_sun_trod_02:0 "中型日之仙路"
 building_sun_trod_02_desc:0 "日之仙路是只在白天开放的天路。"
 building_sun_trod_03:0 "大型日之仙路"
 building_sun_trod_03_desc:0 "日之仙路是只在白天开放的天路。"
 building_type_moon_trod_01:0 "月之仙路"
 building_type_moon_trod_01_desc:0 "#F 月之仙路是只在夜间开放的天路。只有那些会飞的换生灵可以穿越这些月光幻影小径。月之仙路可能以在苍白的月光下飞舞的尘埃微粒的形式显现，或者以夜空中的云朵为路面。#!"
 building_moon_trod_01:0 "小型月之仙路"
 building_moon_trod_01_desc:0 "月之仙路是只在夜间开放的天路。"
 building_moon_trod_02:0 "中型月之仙路"
 building_moon_trod_02_desc:0 "月之仙路是只在夜间开放的天路。"
 building_moon_trod_03:0 "大型月之仙路"
 building_moon_trod_03_desc:0 "月之仙路是只在夜间开放的天路。"
 building_type_chimerical_trod_01:0 "奇魅仙路"
 building_type_chimerical_trod_01_desc:0 "#F 奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。一些奥秘术艺可以让换生灵进入这些奇异仙路。即使是对最强大的戚族来说，这种道路也是非常危险的。银之径并没有延伸到这等仙路上。#!"
 building_chimerical_trod_01:0 "小型奇魅仙路"
 building_chimerical_trod_01_desc:0 "奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。"
 building_chimerical_trod_02:0 "中型奇魅仙路"
 building_chimerical_trod_02_desc:0 "奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。"
 building_chimerical_trod_03:0 "大型奇魅仙路"
 building_chimerical_trod_03_desc:0 "奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。"
 building_type_nightmare_trod_01:0 "噩梦仙路"
 building_type_nightmare_trod_01_desc:0 "#F 噩梦仙路在深[dreaming|E]中发酵，就像贪得无厌的癌变。黑暗和扭曲的仙路盘旋而过，几乎触及[dreaming|E]的每一个部分。邪恶奇魅和更黑暗的生物在这些可怕的道路上游荡。一些哀怒廷利用这些仙路进行秘密任务，但即使对他们来说这些道路也很危险。银之径就存在于这等仙路的某些地方。大多数人相信达南神族在与弗摩尔族的战争中建造了这些道路。#!"
 building_nightmare_trod_01:0 "小型噩梦仙路"
 building_nightmare_trod_01_desc:0 "噩梦仙路在深[dreaming|E]中发酵，就像贪得无厌的癌变。"
 building_nightmare_trod_02:0 "中型噩梦仙路"
 building_nightmare_trod_02_desc:0 "噩梦仙路在深[dreaming|E]中发酵，就像贪得无厌的癌变。"
 building_nightmare_trod_03:0 "大型噩梦仙路"
 building_nightmare_trod_03_desc:0 "噩梦仙路在深[dreaming|E]中发酵，就像贪得无厌的癌变。"
 building_type_wild_portal_01:0 "狂乱传送门"
 building_type_wild_portal_01_desc:0 "#F 没人确切地知道这些现象来自哪里，或者它们是如何存在的。喜乐廷妖精认为它们是哀怒廷的作品，而哀怒廷则把它们归咎于喜乐廷。双方都声称，强大的妖精故意制作了这些传送门来引诱和捕捉敌人。还有人推测，这些传送门是大碎溃时期的梦界本身的造物……当旧的通道败坏并关闭时，魔法试图维持与凡界的联系的最后挣扎。#!"
 building_wild_portal_01:0 "小型狂乱传送门"
 building_wild_portal_01_desc:0 "狂乱传送门是一种不受控制的、未知的[dreaming|E]入口。"
 building_wild_portal_02:0 "中型狂乱传送门"
 building_wild_portal_02_desc:0 "狂乱传送门是一种不受控制的、未知的[dreaming|E]入口。"
 building_wild_portal_03:0 "大型狂乱传送门"
 building_wild_portal_03_desc:0 "狂乱传送门是一种不受控制的、未知的[dreaming|E]入口。"
 building_type_silvers_gate_01:0 "银之门"
 building_type_silvers_gate_01_desc:0 "#F 梦幻岛在水面上闪闪发光，一望无际的翠绿土地缓缓上升，岛中央的圆形山丘将它推向顶峰。山顶上，一座由水晶尖塔和棱柱塔组成的妖精城堡耸立在岛屿的最高点。城堡门前矗立着一对石像，他们都是衣着优雅、长发飘飘的骑士。#!"
 building_silvers_gate_01:0 "银之门"
 building_silvers_gate_01_desc:0 "在岛屿的中心，有一扇银门，它是通往提尔纳诺主心的通道——现在被称为桃源"
 building_type_gwyddnos_track_01:0 "Gwyddno's Track"
 building_type_gwyddnos_track_01_desc:0 "#F 只有在谣传和传说中才被铭记，通往远古之力仙路的入口就隐藏在波伊斯.#!"
 building_gwyddnos_track_01:0 "Gwyddno's Track"
 building_gwyddnos_track_01_desc:0 "Last in use during the reign of King Gwyddno Garanhir, the sarn extended to all cantrevs in Cymru as well as Hibernia."
 building_type_pookas_favor_01:0 "Pooka's Favor"
 building_type_pookas_favor_01_desc:0 "#F 这条仙路从格温特一直延伸到爱丁堡，控制它的噗咔对从塞姆鲁到苏格兰首府的旅行不收取任何费用。#!"
 building_pookas_favor_01:0 "Pooka's Favor"
 building_pookas_favor_01_desc:0 "然而，当旅行者试图从苏格兰返回格温特时，来回的车费是昂贵的，至少在面子方面是如此。噗咔对单纯的金钱毫无兴趣；他们更喜欢拍在脸上的馅饼、剃光头或裸体，这取决于他们的心情和旅行者的个性。"
 building_type_pen_mynydd_01:0 "Pen Mynydd"
 building_type_pen_mynydd_01_desc:0 "#F Leading from Mount Snowdon in Cymru to Ben Nevis in Scotland, this is a secret Unseelie sluagh sarn (Welsh for trod), guarded jealously by the Scottish ban durrag that maintain it. These foul creatures call this trod Ban-Durrag's Squirm.#!"
 building_pen_mynydd_01:0 "Pen Mynydd"
 building_pen_mynydd_01_desc:0 "Ban-Durrag's Squirm is a series of trods connecting the heights of Ben Nevis with the sewers of Glasgow and the crags of Mt. Snowdon in Wales. The Ban-Durrag who control these trods form a group of Unseelie sluagh who use them to hide bodies of their victims and to exchange information. Only sluagh can squeeze through the entrances to these tunnels."
 building_type_cefn_yr_oguf_01:0 "Cefn yr Oguf"
 building_type_cefn_yr_oguf_01_desc:0 "#F Running from Clwyd down to London Bridge and up to Chester, this sarn (Welsh for trod) is a hotly contested prize in Clwyd.#!"
 building_cefn_yr_oguf_01:0 "Cefn yr Oguf"
 building_cefn_yr_oguf_01_desc:0 "Running from Clwyd down to London Bridge and up to Chester, this sarn (Welsh for trod) is a hotly contested prize in Clwyd."
 building_type_camelot_01:0 "卡美洛"
 building_type_camelot_01_desc:0 "#F For the proof, I give you Camelot. There are not many who remember that the legend of King Arthur rose first in Cymru, in the incomparable tale of Culhwch and Olwen, which is too long to tell here. What I say is, the tales of Arthur spring from this land of Wales, no matter the Dark Age versions you hear now, the propaganda made up by the Technocracy.#!"
 building_camelot_01:0 "废弃的卡美洛"
 building_camelot_01_desc:0 "The real legends, the true heart of Camelot, have grown large in the Dreaming. All the visions of Arthur's myth exist there together, and all are right. The people of the stories do live there, as you and I here, but in their many aspects, and we who reach them see only one aspect at a time, as you may see only one glittering of the many facets of a diamond."
 building_camelot_02:0 "复苏的卡美洛"
 building_camelot_02_desc:0 "The real legends, the true heart of Camelot, have grown large in the Dreaming. All the visions of Arthur's myth exist there together, and all are right. The people of the stories do live there, as you and I here, but in their many aspects, and we who reach them see only one aspect at a time, as you may see only one glittering of the many facets of a diamond."
 building_camelot_03:0 "凯旋的卡美洛"
 building_camelot_03_desc:0 "The real legends, the true heart of Camelot, have grown large in the Dreaming. All the visions of Arthur's myth exist there together, and all are right. The people of the stories do live there, as you and I here, but in their many aspects, and we who reach them see only one aspect at a time, as you may see only one glittering of the many facets of a diamond."
 building_type_chaw_gully_mine_01:0 "渠沟矿井"
 building_type_chaw_gully_mine_01_desc:0 "#F 早在神话纪元，当诺克还只是一个年轻的戚系时，他们来到了有朝一日被称为康沃尔和查拉科姆山脊的地方。为了贪图土地下面的锡，但更多的是里面的黄金，他们撕毁了荒地的核心。#!"
 building_chaw_gully_mine_01:0 "受封矿井"
 building_chaw_gully_mine_01_desc:0 "传说中，除了该地区的锡之外，还有黄金。而且有……很多的黄金。诺克只暗示了足以维持人们梦想它的数量，但很少允许凡人去寻找它。"
 building_type_balors_tower_01:0 "巴烙之塔"
 building_type_balors_tower_01_desc:0 "#F On the eastern edge of Tory Island, a rock promontory for called Balor’s Tower marks the legendary home of Balor of the Evil Eye.#!"
 building_balors_tower_01:0 "巴烙之塔"
 building_balors_tower_01_desc:0 "On the eastern edge of Tory Island, a rock promontory for called Balor’s Tower marks the legendary home of Balor of the Evil Eye."
 building_type_brides_lodge_01:0 "Bride's Lodge"
 building_type_brides_lodge_01_desc:0 "#F Just west of Glastonbury on the banks of a river lies yet another hill, this one called Bride's Mound by locals. Near the foot of Bride's Mound sits a three-story house with a small patch of garden outside, at 19 Bride's Lane.#!"
 building_brides_lodge_01:0 "Bride's Lodge"
 building_brides_lodge_01_desc:0 "这座房子是整个阿尔比恩最古老的永契堡之一。它由十几间小卧室（大多位于二楼和三楼）、厨房、浴室和位于中央的大会议室组成。尽管多年来这所房子发生了许多变化，但有一样东西始终未变：壁炉。主厅的焦点是一个大石炉，自古以来，阿尔比恩的大烽火就在这里燃烧。"
 building_type_bullring_01:0 "斗牛场"
 building_type_bullring_01_desc:0 "#F The Bullring is found in Barcelona, Spain and whether it got its name from the acts of daring that the guests have performed there or the amount of truth behind the stories they share is a matter of opinion.#!"
 building_bullring_01:0 "斗牛场"
 building_bullring_01_desc:0 "无论如何，这都是一个不错的地方：在凡人眼中，它是一座时尚的大院；在奇魅眼里，它是一座摩尔风格的宏伟古堡。"
 building_type_rock_of_cashel_01:0 "Cashelmore"
 building_type_rock_of_cashel_01_desc:0 "#F Rising 200 feet above the plains of County Tipperary, the steep, craggy hill known as the Rock of Cashel served as both the site from which the kings of Munster ruled and as a religious landmark.#!"
 building_rock_of_cashel_01:0 "Cashelmore"
 building_rock_of_cashel_01_desc:0 "Inside the rock, accessible through a hidden doorway near the base of the hill, is Cashelmore."
 building_type_dun_aenghus_01:0 "Dún Aenghus"
 building_type_dun_aenghus_01_desc:0 "#F Once the fortress home of a legendary Fir-bholg chieftain after that race's exile by the Tuatha de Danaan to the west of Ireland, Dún Aenghus later became a powerful site of faerie magic.#!"
 building_dun_aenghus_01:0 "Dún Aenghus"
 building_dun_aenghus_01_desc:0 "在被原住民遗弃后，杜伽尔世家的一位王子发现了三层石圈与大地沉睡魔法的内在联系。这位无名王子用梦华唤起并唤醒了沉睡的力量，并建造了一个巨大的藏宝库，用来存放仙族最珍贵的财产。"
 building_type_glenlea_01:0 "Glenlea"
 building_type_glenlea_01_desc:0 "#F Not far from Glencolumbkille, though it won’t be found on any map, lies the faerie Thorpe of Glenlea, a small enchanted village entirely inhabited by Kithain and a few enchanted mortals lucky (or unlucky) enough to fall in with one of the villagers and receive an invitation to “leave the cares of the world behind.”#!"
 building_glenlea_01:0 "Glenlea"
 building_glenlea_01_desc:0 "小镇本身由一条主要街道组成，街道两旁是商店和茅草房，还有几条小巷通往其他住宅。"
 building_type_shalott_01:0 "夏洛特"
 building_type_shalott_01_desc:0 "#F One freehold that did not survive is stipulated by scholars to have been the basis for tales of \"Shalott\".#!"
 building_shalott_01:0 "失落的夏洛特"
 building_shalott_01_desc:0 "一个被施了魔法的塔，里面的居民被诅咒了，只能通过一幅魔法挂毯上出现的景象来了解凡人的世界。"
 building_type_tuath_of_chronos_01:0 "时刻之丘"
 building_type_tuath_of_chronos_01_desc:0 "#F The Tuath of Chronos is a mysterious place believed to be in a fae mound somewhere on the banks of the Tay. Many fae believe that a powerful Seer of Chronos and his fae wife managed to hide a pre-Shattering site from the ravages of time and Banality.#!"
 building_tuath_of_chronos_01:0 "时刻之丘"
 building_tuath_of_chronos_01_desc:0 "如果换生灵在泰河畔漫步时发现了一个山岗，上面有一棵巨大的树，树上长满了许多枝条，每根枝条上都有新的叶芽，那么他们可能来到了时刻之丘。树枝上挂着一只银角，树根下有一口白石井。生活在这棵树上的法师和妖精都在小心翼翼地守护着它的秘密。"
 building_type_pearl_of_dawn_01:0 "Pearl of Dawn"
 building_type_pearl_of_dawn_01_desc:0 "#F 该永契堡包含着一片郁郁葱葱的绿洲，矗立在梦界中几条主要仙路的交汇处，在部族内部享有盛誉，是许多独特旅程的起点。由于这里的妖精混杂在一起，几乎能保证迟早会有冒险发生。#!"
 building_pearl_of_dawn_01:0 "Pearl of Dawn"
 building_pearl_of_dawn_01_desc:0 "该永契堡包含着一片郁郁葱葱的绿洲，矗立在梦界中几条主要仙路的交汇处，在部族内部享有盛誉，是许多独特旅程的起点。由于这里的妖精混杂在一起，几乎能保证迟早会有冒险发生。"
 building_type_garden_of_olives_01:0 "橄榄园"
 building_type_garden_of_olives_01_desc:0 "#F 橄榄园接待着来自世界各地的换生灵。统治者定期指导并参与经典希腊戏剧的演出。#!"
 building_garden_of_olives_01:0 "橄榄园"
 building_garden_of_olives_01_desc:0 "橄榄园接待着来自世界各地的换生灵。统治者定期指导并参与经典希腊戏剧的演出。"
 building_type_eternal_story_01:0 "永恒的故事"
 building_type_eternal_story_01_desc:0 "#F From the Eternal Story, near the outskirts of Addis Ababa, the ruler orchestrates a sizable collection of eshu, satyrs, and pookas.#!"
 building_eternal_story_01:0 "永恒的故事"
 building_eternal_story_01_desc:0 "From the Eternal Story, near the outskirts of Addis Ababa, the ruler orchestrates a sizable collection of eshu, satyrs, and pookas."
 building_type_oasis_of_lingering_dreams_01:0 "Oasis of Lingering Dreams"
 building_type_oasis_of_lingering_dreams_01_desc:0 "#F The changelings of Saudi Arabia combine desert chic with the romantic tales of the Bedouin tribes. The current ruler, dwells in their freehold, the Oasis of Lingering Dreams, located in the desert outside the capital of Riyadh. #!"
 building_oasis_of_lingering_dreams_01:0 "Oasis of Lingering Dreams"
 building_oasis_of_lingering_dreams_01_desc:0 "The changelings of Saudi Arabia combine desert chic with the romantic tales of the Bedouin tribes. The current ruler, dwells in their freehold, the Oasis of Lingering Dreams, located in the desert outside the capital of Riyadh. "
 building_type_grimsfen_tor_01:0 "Grimsfen Tor"
 building_type_grimsfen_tor_01_desc:0 "#F A particularly powerful and ancient faerie mound at Grimsfen Tor in the Midlands.#!"
 building_grimsfen_tor_01:0 "Grimsfen Tor"
 building_grimsfen_tor_01_desc:0 "A particularly powerful and ancient faerie mound at Grimsfen Tor in the Midlands."
 glade_freehold_effect_desc:0 "若建在首都，每月额外恢复梦华（每一级增加33%的概率）。"
 building_chaw_gully_mine_02:0 "再开矿井"
 building_chaw_gully_mine_02_desc:0 "传说中，除了该地区的锡之外，还有黄金。而且有……很多的黄金。诺克只暗示了足以维持人们梦想它的数量，但很少允许凡人去寻找它。"
 building_chaw_gully_mine_03:0 "深掘矿井"
 building_chaw_gully_mine_03_desc:0 "传说中，除了该地区的锡之外，还有黄金。而且有……很多的黄金。诺克只暗示了足以维持人们梦想它的数量，但很少允许凡人去寻找它。"
 building_type_emain_macha_01:0 "Emain Macha"
 building_type_emain_macha_01_desc:0 "#F Legends refer to Navan Fort as Emain Macha (“Macha’s Twins”) and associate it with the dying curse of the fleet-footed wife of Cruinniuc.#!"
 building_emain_macha_01:0 "Emain Macha"
 building_emain_macha_01_desc:0 "Palace is beautiful, its odd geometry and the dark, rich colors of its interior induce a moodiness redolent with the weight of history and legend, full of latent violence and deep passion."
 land_trod_effect_desc:0 "若建在首都，允许在灵游时进入[dreaming|E]。"