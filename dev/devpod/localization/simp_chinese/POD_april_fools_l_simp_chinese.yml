 POD_marauder_mode_stewardship_modifier: "矛盾的管理"
 POD_marauder_mode_intrigue_modifier: "矛盾的谋略"
 POD_marauder_mode_learning_modifier: "矛盾的学识"
 POD_marauder_mode_goldform: "黄金铸就"
 POD_april_fools.102.t: "矛盾的日子"
 POD_april_fools.102.desc: "你只想要片刻的宁静。你出门散步，然后便看到了它——那场疯狂的第一征兆：一棵纯金铸就的树。\n\n你惊叹着伸手触碰。那棵树骤然炸开，化作漫天飞舞的飞蛾，每一只都在高喊“恭喜！恭喜！恭喜！”，绕着你头顶盘旋，活像一顶最惹人厌的光环。当你挥手驱散虫群时，它们四散开来，又重新聚合成一棵完全普通的树。\n\n你匆匆赶回宫廷，却发现那里已陷入混乱。家具在融化、漂浮，或是粘在天花板上。某人的衣物变成了蜈蚣。空气中闪烁着不可能的彩虹色光芒。\n\n若这是幻象，你不敢想象谁有如此强大的力量能制造这般规模的幻境。但若非如此……"
 POD_april_fools.102.a: "我该怎么找到那个罪魁祸首？"
 POD_april_fools.102.tt.1: "你的[skills|E]将每月随机变化。"
 POD_april_fools.102.tt.2: "你的[personality_traits|E]将每年随机化。"
 POD_april_fools.102.tt.3: "这肯定只是暂时的，你只需静待风波平息。"
 POD_april_fools.103.desc.intro: "你的[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))][courtier.GetFirstName]为你带来有关这场混乱局势的最新消息。"
 POD_april_fools.103.desc: "\"我捡到它，它是不是可爱的小宝宝啊？\"我们必须好好照顾它，把它培养成这个家的正式成员。 \"\n\n这个所谓的\"可爱的小宝宝\"是条龙。"
 POD_april_fools.103.a: "太美妙了，我一直都想要条龙。"
 POD_april_fools.104.desc: "虽然不需要你通过[courtier.GetHerHim]来确认，因为发生了什么显而易见。[courtier.GetSheHe|U]安然无恙，你也一样。这个[ROOT.Char.Custom('GetCourt')|l]里的所有人，你所有的家具，你所有的武器，也都安然无恙。"
 POD_april_fools.104.a: "我们可以借此牟利，但可惜那些武器了。"
 POD_april_fools.105.desc: "“今早我检查牢房时发现了[prisoner.GetName]。不知道[prisoner.GetSheHe]是怎么进去的。[prisoner.GetSheHe|U]自己也不清楚。不过，白捡的便宜咱就别挑三拣四了，对吧？”"
 POD_april_fools.105.a: "我应决定如何处理[prisoner.GetHerHim]。"
 POD_april_fools.106.desc: "“我的头发没了。”[courtier.GetHerHis]眼中流露出深深的忧郁，这让你颇感意外。你从未想过[courtier.GetFirstNameNoTooltip]会如此在意[courtier.GetHerHis]的外表。"
 POD_april_fools.106.a: "是啊，我发现了。我的也没了。"
 POD_april_fools.106.a.alreadybald: "嗯哼。一定很糟糕。"
 POD_april_fools.107.desc: "“奶酪。”[courtier.GetSheHe]拒绝进一步解释，直接把奶酪递给了你。"
 POD_april_fools.107.a: "呃……谢谢？"
 POD_april_fools.108.desc: "\"呃，是啊，有个大消息。\"[courtier.GetSheHe|U]紧张地扭动着身子。\"你知道前几天那场大爆炸吗？那道直冲天际的绿色火柱，像一群受诅咒的灵魂在尖叫？\"\n\n嗯，你看到了。想忽略都难。不过当时你也没太在意。这么多事情发生了，那天感觉就像是又一个普通的日子。\n\n\"好吧，这件事给当地的$POD_splat_hunter_plural$留下了深刻印象。他们一路报告上去，现在圣座正在调动资源，要根除‘我们中间的魔鬼’。\"\n\n\"他们管这个叫裁判。\""
 POD_april_fools.108.a: "好像我们麻烦还不够多似的。"
 POD_april_fools.108.a.hunter: "我想这对我们来说是件好事。"
 POD_april_fools.108.a.premature: "又 一 个？？"
 POD_april_fools.108.a.premature.hunter: "又一个？哈利路亚。"
 POD_april_fools.109.desc: "“外面简直疯了。审判官们正在出动，到处焚烧庇护所。照这个速度，他们迟早要把我们赶尽杀绝。”\n\n你揉了揉太阳穴。“那是不是意味着我们终于可以放下分歧，团结起来对抗共同的敌人？”\n\n“什么？不，那太疯狂了。听着，你还没学会像企业家那样思考。这可是个千载难逢的好机会，可以趁所有人不备大捞一笔。没人会想到我们会在他们忙于应付更大麻烦时背后捅刀子。”"
 POD_april_fools.109.desc.hunter: "“外面简直乱成一锅粥了。审判官们正四处出动，到处焚烧庇护所。那些吸血鬼们开始焦躁不安，他们知道自己时日无多了。”\n\n你叹了口气。“是啊，然后呢？梵蒂冈正在处理这事。我们大可置身事外。何必在那些两次受福三次涂油的首席混蛋们愿意战死前线的时候，拿自己的性命去冒险？”\n\n“什么？不，那太疯狂了。听着，你还没学会像企业家那样思考。这可是个千载难逢的好机会，可以趁所有人不备大捞一笔。没人会想到我们会在他们忙于应付更大麻烦时背后捅刀子。”"
 POD_april_fools.109.a: "这是我听过最愚蠢的事了。"
 POD_april_fools.109.tt: "现在所有人都可以[raid|E]了。"
 POD_april_fools.110.desc: "\"Aboeisrd moieaon kstlbv og. Goob broncpsdz ib? Plib e bib. Zbilbrekwlommbiorbeon aglonmeqwas eorleor ir immnimnim plembaf, nor limnon leqbaf, nor zeblorneqis rirghhb nekbaf. Ya bib?\""
 POD_april_fools.110.a: "Hor hor hor! Sik nempis irliq nempo bib."
 POD_marauder_mode_tongues: "讲神的语言"
 POD_marauder_mode_tongues_desc: "Ha blemqas nirtuilzvkkir tiglpvnmbonan giruen bib. Giruen? Og pilnis? Hor hor hor."
 POD_april_fools.111.desc: "“我恨你。只是想让你知道。”"
 POD_april_fools.111.a: "什么？"
 POD_april_fools.112.t: "负责人"
 POD_april_fools.112.desc: "一阵低沉的轰鸣宣告了它的降临。地板与天花板碎裂成千上万片色彩斑斓的碎片，随即重组为旋转的晶格。你房中的光线扭曲成令人作呕的角度。现实为之哀鸣，俯首称臣。\n\n在这风暴的中心，端坐着一个黑洞，其轮廓形似人形。你姑且认为那是个人——至少没有可辨认的五官。这实体仅靠轮廓及其对周遭施加的引力显现，仿佛既是这个世界存在的基石，却又无法容身于其中。\n\n活到如今，你学会何时战斗，何时退让。这一战，你无法取胜。你所能做的只有旁观，并期盼最好的结果。"
 POD_april_fools.113.t: "劫夺者"
 POD_april_fools.113.desc: "这个东西用一种直接来自地狱的回响声向你打招呼。\n\n听起来有点像“早安”。\n\n除此之外，它似乎很乐意进行礼貌的交谈。它对造成的所有麻烦深表歉意，并给了你一通冗长的辩解，其中充满了你完全听不懂的科学术语，关于“领域”、“仪器”和“劫夺者现实领域”。你推断它在躲避“那个皱巴巴的#italic 狗娘养的#!”，并且它造访此地“为时过早”，但有一天“时机成熟时”，你可能会遇到像它一样的其他存在。然后它打开一个旋转的传送门，准备离开。\n\n你向那个实体喊道，仍然困惑不解。“你是谁？”\n\n它说：“你可以叫我让。”"
 POD_april_fools.113.a: "我想，就这样吧。"
 POD_april_fools.113.a.tt: "疯狂终于结束了。"
 POD_april_fools.113.b: "说实话，这还挺有意思的。"
 POD_april_fools.113.b.tt: "你的[skills|E]和[personality_traits|E]将继续随机生成。"