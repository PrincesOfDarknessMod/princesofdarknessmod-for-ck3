 Wetrius: "韦特里乌斯"
 Wetrius_Prime: "至高韦特里乌斯"
 Cainetrius: "该隐韦特里乌斯"
 POD_april_fools.2.t: "这就是巅峰表现的样子"
 POD_april_fools.2.desc: "世界发生了一些事情。 \n\n你不太确定那是什么。一直以来都是这样。不是吗？ \n\n好吧，可能没什么重要的。 \n\n大概吧。"
 POD_april_fools.2.a: "我的邻居们一直都长这样吗？"
 POD_april_fools.2.tt: "你有一个新目标，要弄清楚这个发展的来龙去脉。"
 POD_april_fools.3.t: "他回来了"
 POD_april_fools.3.desc: "看哪，雷霆乍响。自神弃之地的土壤中，升起一切韦特里乌斯族类的始祖，前来为他的子嗣复仇。\n\n此后再无目标。无事可做。\n\n此刻放弃，或在你创造的末日世界中苟延残喘。"
 POD_april_fools.3.a: "好吧，该死"
 POD_wetrius_objective: "韦特里乌斯天启"
 POD_wetrius_objective_desc: "难道没人阻止这些潮湿的恶徒？\n总得有人给他们点教训。"
 POD_wetrius_objective_tooltip: "所以说，他们是每天日落时全身涂婴儿油吗，还是怎么着？"
 POD_wetrius_objective_confirm: "滚开，你们这些油腻的混蛋"
 POD_wetrius_objective_is_valid: "已亲手击杀[EmptyScope.ScriptValue('POD_wetrius_kill_requirement')|V0]名韦特里乌斯#weak (当前击杀数：[GetPlayer.MakeScope.ScriptValue('POD_wetrius_killcount')|0])#!"
 POD_wetrius_objective_is_valid_2: "#V [GetScriptedCharacterByHistoryID('505084').GetFirstName]#!已死亡"
 POD_wetrius_objective_effect: "肯定会有好事发生。"
 wetrius_event_troops: "圣杯骑士"
 setting_pod_april_fools_2026: "#high 巫师#!"
 setting_pod_april_fools_2026_desc: "世界变得有点混乱了。#weak (愚人节 2026)#!"
