 building_type_night_sky_01:0 "夜空圣地"
 building_type_night_sky_01_desc:0 "#F 尽管有剥皮瘟疫和受诅的棘秘魑的攻击，这座从未倒下的圣地成为了影爵坚韧不拔的证明。#!"
 building_night_sky_01:0 "萌芽的夜空圣地"
 building_night_sky_01_desc:0 "尽管有剥皮瘟疫和被诅咒的棘秘魑的攻击，这座从未倒下的圣地成为了影爵坚韧不拔的证明。"
 building_night_sky_02:0 "扩张的夜空圣地"
 building_night_sky_02_desc:0 "尽管有剥皮瘟疫和被诅咒的棘秘魑的攻击，这座从未倒下的圣地成为了影爵坚韧不拔的证明。"
 building_night_sky_03:0 "雄伟的夜空圣地"
 building_night_sky_03_desc:0 "尽管有剥皮瘟疫和受诅的棘秘魑的攻击，这座从未倒下的圣地成为了影爵坚韧不拔的证明。"
 building_type_wheel_ptah_01:0 "卜塔之轮圣地"
 building_type_wheel_ptah_01_desc:0 "#F 一处神秘的圣地，显然是在寂静漫游者从埃及流亡出来后被赠送于他们作为新家。从那时起，它就一直很好地服务于这个部族。#!"
 building_wheel_ptah_01:0 "萌芽的卜塔之轮圣地"
 building_wheel_ptah_01_desc:0 "一处神秘的圣地，显然是在寂静漫游者从埃及流亡出来后被赠送于他们作为新家。从那时起，它就一直很好地服务于这个部族。"
 building_wheel_ptah_02:0 "扩张的卜塔之轮圣地"
 building_wheel_ptah_02_desc:0 "一处神秘的圣地，显然是在寂静漫游者从埃及流亡出来后被赠送于他们作为新家。从那时起，它就一直很好地服务于这个部族。"
 building_wheel_ptah_03:0 "雄伟的卜塔之轮圣地"
 building_wheel_ptah_03_desc:0 "一处神秘的圣地，显然是在寂静漫游者从埃及流亡出来后被赠送于他们作为新家。从那时起，它就一直很好地服务于这个部族。"
 building_type_crescent_moon_01:0 "新月圣地"
 building_type_crescent_moon_01_desc:0 "#F 银牙坐落于俄罗斯的权力中心，也许这是他们在全世界当中最大的圣地。#!"
 building_crescent_moon_01:0 "萌芽的新月圣地"
 building_crescent_moon_01_desc:0 "新月圣地是在刀耕之治时期被发现的，它坐落在乌拉尔山脉深处的一个隐蔽山谷中。"
 building_crescent_moon_02:0 "扩张的新月圣地"
 building_crescent_moon_02_desc:0 "这里最初是可怕的戈里尼奇的家园，许多银牙的传奇英雄为了给部族夺取该地区的控制权而牺牲"
 building_crescent_moon_03:0 "雄伟的新月圣地"
 building_crescent_moon_03_desc:0 "在赶走了戈里尼奇之后，强大的弦月狼净化了这片土地，确保新月将作为银牙的余威矗立在未来的岁月里。"
 building_type_snow_leopard_01:0 "雪豹圣地"
 building_type_snow_leopard_01_desc:0 "#F 世上最知名的星占圣地，一座无与伦比的学习与协作中心。#!"
 building_snow_leopard_01:0 "萌芽的雪豹圣地"
 building_snow_leopard_01_desc:0 "这座圣地是由拜占庭的星占查士丁尼所建立，也是与一位名为米拉日巴的神秘吸血鬼共同努力的成果。"
 building_snow_leopard_02:0 "扩张的雪豹圣地"
 building_snow_leopard_02_desc:0 "就在这里，查士丁尼面对强大的节点爬虫做出了最后的抵抗。虽然他在战斗中失去了生命，但圣地的安全却得到了保证。"
 building_snow_leopard_03:0 "雄伟的雪豹圣地"
 building_snow_leopard_03_desc:0 "在查士丁尼对节点爬虫的胜利之后，圣地的名气迅速增长，并很快成为星占文化的一个重要中心。"
 building_type_field_stars_01:0 "星域圣地"
 building_type_field_stars_01_desc:0 "#F 一座靠近河流源头的强大领导圣地。这座圣地的位置非常暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。#!"
 building_field_stars_01:0 "萌芽的星域圣地"
 building_field_stars_01_desc:0 "一座靠近河流源头的强大领导圣地。这座圣地的位置非常暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_field_stars_02:0 "扩张的星域圣地"
 building_field_stars_02_desc:0 "一座靠近河流源头的强大领导圣地。这座圣地的位置非常暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_field_stars_03:0 "雄伟的星域圣地"
 building_field_stars_03_desc:0 "一座靠近河流源头的强大领导圣地。这座圣地的位置相当暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_type_shemsu_heru_central_port_01:0 "贤荷鲁中心港"
 building_type_shemsu_heru_central_port_01_desc:1 "#F 荷鲁斯带着一群最忠诚的弟子离开后，位于亚历山大的贤荷鲁中心港口。#!"
 building_shemsu_heru_central_port_01:0 "贤荷鲁中心港"
 building_shemsu_heru_central_port_01_desc:1 "荷鲁斯带着一群最忠诚的弟子离开后，位于亚历山大的贤荷鲁中心港口。"
 building_type_horus_hidden_tomb_01:0 "荷鲁斯的疑冢"
 building_type_horus_hidden_tomb_01_desc:1 "#F 荷鲁斯在阿尔卑斯山建造的隐秘陵墓，接近凡人的日内瓦城。#!"
 building_horus_hidden_tomb_01:0 "荷鲁斯的疑冢"
 building_horus_hidden_tomb_01_desc:1 "荷鲁斯在阿尔卑斯山建造的隐秘陵墓，接近凡人的日内瓦城。"
 building_type_temple_of_horus_01:0 "荷鲁斯神庙"
 building_type_temple_of_horus_01_desc:1 "#F 复仇者最大的神庙，介乎伊斯纳及阿斯旺之间的埃德富。虽然原来的埃德富城市已经大部分沦为废墟，但荷鲁斯神庙仍然矗立。#!"
 building_temple_of_horus_01:0 "荷鲁斯神庙"
 building_temple_of_horus_01_desc:1 "复仇者最大的神庙，介乎伊斯纳及阿斯旺之间的埃德富。虽然原来的埃德富城市已经大部分沦为废墟，但荷鲁斯神庙仍然矗立着，像它的神一样顽强。"
 building_type_scarlet_screen_family_01:0 "家族障幕"
 building_type_scarlet_screen_family_01_desc:0 "#F 最重要的障幕。像幽影颂一样的心法甚至有维护家族的义务。此外，鬼人的凡人家庭往往是他们最忠诚的支持者。#!"
 building_scarlet_screen_family_01:0 "次级家族障幕"
 building_scarlet_screen_family_01_desc:0 "你已经为家族障幕奠定了基础。这是一个起步，但需要一些工作。"
 building_scarlet_screen_family_02:0 "中级家族障幕"
 building_scarlet_screen_family_02_desc:0 "你现在有数个家族和一代人组成的家族障幕。这是很好的进展。"
 building_scarlet_screen_family_03:0 "高级家族障幕"
 building_scarlet_screen_family_03_desc:0 "在一个特别老的鬼人的带领下，世世代代养成的，对其他事情一无所知的世家。"
 building_type_scarlet_screen_usagigumi_01:0 "兔队障幕"
 building_type_scarlet_screen_usagigumi_01_desc:0 "#F 兔队的价值仅在于人数。#!"
 building_scarlet_screen_usagigumi_01:0 "次级兔队障幕"
 building_scarlet_screen_usagigumi_01_desc:0 "你已经开始为你的兔队开始了一场小规模的募兵。他们现在还行。"
 building_scarlet_screen_usagigumi_02:0 "中级兔队障幕"
 building_scarlet_screen_usagigumi_02_desc:0 "你的兔队现在是一个实际的、值得尊敬的部队。有时，你可以为他们感到骄傲。"
 building_scarlet_screen_usagigumi_03:0 "高级兔队障幕"
 building_scarlet_screen_usagigumi_03_desc:0 "你的兔队现在甚至可以击溃阎魔的军队。"
 building_type_scarlet_screen_inugumi_01:0 "犬幢障幕"
 building_type_scarlet_screen_inugumi_01_desc:0 "#F 犬幢更加忠诚，有时甚至与超自然有联系。#!"
 building_scarlet_screen_inugumi_01:0 "次级犬幢障幕"
 building_scarlet_screen_inugumi_01_desc:0 "你的犬幢刚刚被安置好了。目前，他们能够达成职务，但他们可以做得更好。"
 building_scarlet_screen_inugumi_02:0 "中级犬幢障幕"
 building_scarlet_screen_inugumi_02_desc:0 "你的犬幢现在是一个真正值得尊敬的机构，有些已经开始将你的影响力扩展到变化妖怪和天宗的隐秘领域。总有一天。"
 building_scarlet_screen_inugumi_03:0 "高级犬幢障幕"
 building_scarlet_screen_inugumi_03_desc:0 "你的犬幢已经成为你在整个地区的眼睛和耳朵，因为你的野心一直在向外延伸。"
 building_type_scarlet_screen_ryugumi_01:0 "龙军障幕"
 building_type_scarlet_screen_ryugumi_01_desc:0 "#F 龙军被训练用于打击对其鬼人主人的高度威胁。#!"
 building_scarlet_screen_ryugumi_01:0 "次级龙军障幕"
 building_scarlet_screen_ryugumi_01_desc:0 "你的龙军现在是一支强有力的仪仗队。他们现在只是少数人，但现在你可以在白天睡得很香。"
 building_scarlet_screen_ryugumi_02:0 "中级龙军障幕"
 building_scarlet_screen_ryugumi_02_desc:0 "你的龙军现在遍布你的整个巢穴，而且你有足够的余力让他们可以加入你的战斗中。不单独作战的感觉真好。"
 building_scarlet_screen_ryugumi_03:0 "高级龙军障幕"
 building_scarlet_screen_ryugumi_03_desc:0 "你的龙军会让所有帝国的皇家卫队感到畏惧，因为任何人在你的精英面前都会颤抖，无论是妖魔、鬼神，还是凡人。"
 building_type_scarlet_screen_spies_01:0 "细作障幕"
 building_type_scarlet_screen_spies_01_desc:0 "#F 细作障幕是用于收集情报的。#!"
 building_scarlet_screen_spies_01:0 "次级细作障幕"
 building_scarlet_screen_spies_01_desc:0 "你现在在这个地区有一个间谍网络，为你提供当地的八卦信息。琐碎，但在慢慢熟练。"
 building_scarlet_screen_spies_02:0 "中级细作障幕"
 building_scarlet_screen_spies_02_desc:0 "区域性事务现在对你来说是一个已知的因素，因为你已经开始在所有地方都有耳目。"
 building_scarlet_screen_spies_03:0 "高级细作障幕"
 building_scarlet_screen_spies_03_desc:0 "你的触角现在支配着这个地方，没有什么能逃过你强硬的目光。"
 building_type_scarlet_screen_merchants_01:0 "商人障幕"
 building_type_scarlet_screen_merchants_01_desc:0 "#F 商人障幕负责鬼人的财务需求。#!"
 building_scarlet_screen_merchants_01:0 "次级商人障幕"
 building_scarlet_screen_merchants_01_desc:0 "你已经开始从这个地区吸走少量的硬币，为你的事业提供支持。"
 building_scarlet_screen_merchants_02:0 "中级商人障幕"
 building_scarlet_screen_merchants_02_desc:0 "你的地方财政现在是安全的，源自于你对该地区看不见的“税收”。"
 building_scarlet_screen_merchants_03:0 "高级商人障幕"
 building_scarlet_screen_merchants_03_desc:0 "在你的“照顾”下，黄金现在像破碎蜂巢流出的蜂蜜一样从中流进你的库房。"
 building_type_scarlet_screen_artisans_01:0 "匠师障幕"
 building_type_scarlet_screen_artisans_01_desc:0 "#F 匠师障幕通过民事手段，努力提高他们主人在城市中的影响力。#!"
 building_scarlet_screen_artisans_01:0 "次级匠师障幕"
 building_scarlet_screen_artisans_01_desc:0 "你已经资助了一群手艺人和艺术家。这是个很有启发性的经验。"
 building_scarlet_screen_artisans_02:0 "中级匠师障幕"
 building_scarlet_screen_artisans_02_desc:0 "你的影响现在在地区内传播，因为你已经成为当地作坊的中心。"
 building_scarlet_screen_artisans_03:0 "高级匠师障幕"
 building_scarlet_screen_artisans_03_desc:0 "在这地区，即使是行会首领也比不上你对工民的掌控。"
 building_type_scarlet_screen_peasants_01:0 "民众障幕"
 building_type_scarlet_screen_peasants_01_desc:0 "#F 民众障幕负责保护鬼人的安全。在[fifth_age|E]，地方政治团体也被归类为“民众”。#!"
 building_scarlet_screen_peasants_01:0 "次级民众障幕"
 building_scarlet_screen_peasants_01_desc:0 "你的藏身处现在由一小群凡人“守卫”，因为任何攻击者都必须先穿过他们才能接近你。"
 building_scarlet_screen_peasants_02:0 "中级民众障幕"
 building_scarlet_screen_peasants_02_desc:0 "现在，你的藏身处被一个镇子守着，被普通农民保护得很好，他们中的一些人甚至知道他们在做什么。"
 building_scarlet_screen_peasants_03:0 "高级民众障幕"
 building_scarlet_screen_peasants_03_desc:0 "攻击你就是攻击城市本身。"
 building_type_occult_affiliation_01:0 "玄秘隶属"
 building_type_occult_affiliation_01_desc:1 "#F 许多玄秘团体，如俄耳甫斯法会、贝南丹蒂或秘术士会，的队伍中都有卡比里，他们躲避他们的同胞，扩大他们的神秘学知识，以促进他们自己的议程。#!"
 building_occult_affiliation_01:0 "简易玄秘隶属"
 building_occult_affiliation_01_desc:1 "你只是一位落后玄秘团体中的新人。"
 building_occult_affiliation_02:0 "下等玄秘隶属"
 building_occult_affiliation_02_desc:1 "你只是一位小型玄秘团体中的侍从。"
 building_occult_affiliation_03:0 "中等玄秘隶属"
 building_occult_affiliation_03_desc:1 "你只是本地玄秘团体中的新人。"
 building_occult_affiliation_04:0 "上等玄秘隶属"
 building_occult_affiliation_04_desc:1 "你是一位像样玄秘团体中的受敬成员。"
 building_occult_affiliation_05:0 "强力玄秘隶属"
 building_occult_affiliation_05_desc:1 "你是一位强力玄秘团体中的知名成员。"
 building_occult_affiliation_06:0 "王级玄秘隶属"
 building_occult_affiliation_06_desc:1 "你是一位重大玄秘团体中的重要成员。"
 building_occult_affiliation_07:0 "帝级玄秘隶属"
 building_occult_affiliation_07_desc:1 "你是一位地区玄秘团体首领的心腹。"
 building_occult_affiliation_08:0 "神级玄秘隶属"
 building_occult_affiliation_08_desc:1 "你是地区玄秘关系网的幕后负责人，所有的人都秘密地听从你的召唤。"
 building_type_flaming_mountain_dragon_nest_01:0 "火焰山龙穴"
 building_type_flaming_mountain_dragon_nest_01_desc:0 "#F 塔克拉玛干的两大龙穴之一，位于敦煌外的火焰山中。#!"
 building_flaming_mountain_dragon_nest_01:0 "火焰山龙穴"
 building_flaming_mountain_dragon_nest_01_desc:0 "据说这里曾经是通向斗姆的剥皮地狱的通道，在[third_age|E]末期被万仙清理并净化。"
 building_type_tianchi_dragon_nest_01:0 "天池龙穴"
 building_type_tianchi_dragon_nest_01_desc:0 "#F 白虎皇朝在西部的控制的第二大龙穴。#!"
 building_tianchi_dragon_nest_01:0 "天池龙穴"
 building_tianchi_dragon_nest_01_desc:0 "位于天池，一座寒冷得令人窒息的美丽冰川湖的岸边，"
 building_type_influence_animals_01:0 "驯服动物"
 building_type_influence_animals_01_desc:0 "#F 有人类的地方，就有动物为他们提供衣物、食物和货运，与他们作伴或靠他们生产的垃圾生活。你的野心和能力包括这个地方的所有生物。#!"
 building_influence_animals_01:0 "阴沟助手"
 building_influence_animals_01_desc:0 "你设法成为当地害虫中的权威，并得到训练有素的猫咪们的帮助，使它们受到控制。"
 building_influence_animals_02:0 "牧场合伙人"
 building_influence_animals_02_desc:0 "你对镇上牧场的拜访得到了回报，那就是牲畜和看守牲畜的狗们的信任和忠诚。"
 building_influence_animals_03:0 "养狗场同伴"
 building_influence_animals_03_desc:0 "确保进入养狗场的安全通道，让你成为猎犬的真正主人。它们为了运动兴趣与贵族们一起打猎，但它们为在夜里为你工作。"
 building_influence_animals_04:0 "丛林家庭"
 building_influence_animals_04_desc:0 "你对本伯爵领动物的权威是如此全面，甚至连远在天边的狼群都听到你的名字在夜里嚎叫赞美。"
 building_type_forest_people_01:0 "森林中人"
 building_type_forest_people_01_desc:1 "#F 你的狩猎场位于城镇之外，居住在这些郊区的居民是你需要依靠的人，他们是你的棋子或猎物。#!"
 building_forest_people_01:0 "追踪牧羊人"
 building_forest_people_01_desc:1 "一只人形野兽在荒野中徘徊的故事并没有给城市人留下什么印象，但那些在牲畜吃草的地方度过许多夜晚的人已经学会了害怕和服从你。"
 building_forest_people_02:0 "向偷猎者施压"
 building_forest_people_02_desc:1 "这片荒野只有一只顶级掠食者，且不是凡人贵族。与他不同，你愿意与那些承诺忠诚的人分赃。"
 building_forest_people_03:0 "召集匪徒"
 building_forest_people_03_desc:1 "有足够多的人往返于这个小镇，使捕杀他们成为一项团队工作，只要那些希望参与的人明白谁在负责。"
 building_type_forest_treasures_01:0 "森林之宝"
 building_type_forest_treasures_01_desc:1 "#F 荒野曾经是我们所有人的家园，仍然有一些人没有用在荒野中茁壮成长所需的知识来交换文明的舒适。你要把他们的才能都用上。#!"
 building_forest_treasures_01:0 "灌木丛中的丰收"
 building_forest_treasures_01_desc:1 "需要有敏锐的眼光和对森林的初步了解，才能以觅食森林的财富为生。你确保那些拥有它的人愿意分享。"
 building_forest_treasures_02:0 "飞掠者"
 building_forest_treasures_02_desc:1 "荒野发出无数的声音，都证明了它维持生命的能力。你和那些懂得倾听的人结成了亲密的朋友。"
 building_forest_treasures_03:0 "大型狩猎"
 building_forest_treasures_03_desc:1 "只有真正的森林之主才能参与森林中捕食者和猎物之间的永恒军备竞赛，并获得回报。在这的狩猎者中，没有人敢拒绝上贡你的份额。"
 building_type_forest_paths_01:0 "森林路径"
 building_type_forest_paths_01_desc:1 "#F 在外人看来，荒野就像一个迷宫，到处都是难以逾越的障碍，但对你来说，它将成为一个配备了丰富地隐藏通道和秘密捷径的堡垒。#!"
 building_forest_paths_01:0 "峡谷和沟壑"
 building_forest_paths_01_desc:1 "过去和现在的水流形成了森林的天然道路网。那些对它了如指掌的人不费吹灰之力就能智胜闯入者。"
 building_forest_paths_02:0 "山洞和隧道"
 building_forest_paths_02_desc:1 "许多林地生物在地下宣称自己的统治权，挖掘出的巢穴和洞穴往往连接成复杂的隧道网络。那些学会模仿它们并利用它们的劳动的人永远不必打一场他们没主动发起的战斗。"
 building_forest_paths_03:0 "树顶公路"
 building_forest_paths_03_desc:1 "在森林最密集的地方，天空被为争夺阳光而搏斗的树枝所遮蔽，最敏捷的捕食者可以从上面跟踪他们的猎物，在树顶上远距离移动而不被注意。"
 building_type_inquisition_knightly_01:0 "骑士大区"
 building_type_inquisition_knightly_01_desc:1 "#F 军事组织的地产。宣过誓的战士们在这里生活和训练。#!"
 building_inquisition_knightly_01:0 "骑士管领地"
 building_inquisition_knightly_01_desc:1 "管领地是一个骑士团所能拥有的最小的土地划分。它由骑士们在一位指挥官的领导下维持。"
 building_inquisition_knightly_02:0 "骑士辖区"
 building_inquisition_knightly_02_desc:1 "辖区代表着军事集团的权力范围，其中包含的设施构成了宗教社会的基础设施骨干。"
 building_inquisition_knightly_03:0 "骑士大区"
 building_inquisition_knightly_03_desc:1 "大区是一个强大的权力中心，骑士团的高级成员在这里管理它的许多地产并计划军事行动。 "
 building_type_inquisition_lay_01:0 "社群大厅"
 building_type_inquisition_lay_01_desc:1 "#F 你的家庭和其赞助下的信众的力量来自于他们的虔诚，而不是任何物质财富。然而，即使是已经极其神圣的努力，若有一个屋顶在头上，也将能更顺利地进行。#!"
 building_inquisition_lay_01:0 "集会大厅"
 building_inquisition_lay_01_desc:1 "勉强比直接邀请信徒群体到你的寝室更有尊严，然而，这个小而简陋的房间却容纳了宏大而高贵的想法。"
 building_inquisition_lay_02:0 "社群大厅"
 building_inquisition_lay_02_desc:1 "就像教堂滋养一个人的灵魂一样，这个专业的大厅也滋养那些寻求摆脱邪恶的人的集体意志。"
 building_inquisition_lay_03:0 "社群地产"
 building_inquisition_lay_03_desc:1 "由于你的家庭的慷慨赞助，这个庄园拥有所有的空间、设施和安保，使其成为正义的堡垒和使馆。"
 building_type_inquisition_contemplative_01:0 "默观修道院"
 building_type_inquisition_contemplative_01_desc:1 "#F 这些庄严的大厅是为了远离淹没上帝的声音的世俗噪音而建造的。#!"
 building_inquisition_contemplative_01:0 "默观修会庄园"
 building_inquisition_contemplative_01_desc:1 "修道院的斯巴达式生活条件是理想的特点，但在空间和可用设施方面的一些扩展可以帮助修道士专注于祈祷工作。"
 building_inquisition_contemplative_02:0 "默观小隐修院"
 building_inquisition_contemplative_02_desc:1 "这个院落的每一个物质方面都提醒其居民期望他们过什么样的生活。在这里，肉体的需求只不过是令人遗憾地分散了对造物主的思考。"
 building_inquisition_contemplative_03:0 "默观隐修院"
 building_inquisition_contemplative_03_desc:1 "仅仅是踏入这座献给上帝智慧的朴素宫殿，就能让一个坚定的非信徒重新找到信仰，因为他的声音在无所不在的寂静中轰鸣。"
 building_type_inquisition_mendicant_01:0 "托钵修道院"
 building_type_inquisition_mendicant_01_desc:1 "#F 受苦是走基督的道途，但减轻他人的痛苦也同样是基督会做的。这些设施使它成为可能。#!"
 building_inquisition_mendicant_01:0 "托钵修会庄园"
 building_inquisition_mendicant_01_desc:1 "这远远不能反映出你的教友们的无限同情心，但这微不足道的设施还是让他们在照顾羊群的漫长一天后得以恢复。"
 building_inquisition_mendicant_02:0 "托钵修士院"
 building_inquisition_mendicant_02_desc:1 "虽然这座建筑的主要目的是成为祈祷用地，但它同时也是一个相当大的慈善活动物流中心。"
 building_inquisition_mendicant_03:0 "托钵隐修院"
 building_inquisition_mendicant_03_desc:1 "在冷漠之情的边界上有一座同情心之堡垒。这片土地上的羊群望着这座高耸的建筑，提醒自己世界上还有善的存在。"
 building_type_bard_gathering_01:0 "吟游诗人聚所"
 building_type_bard_gathering_01_desc:0 "#F 在这，人们在好伙伴中分享荒诞不经的故事，在肆意的狂欢中巩固了部族的团结。#!"
 building_bard_gathering_01:0 "吟游诗人聚所"
 building_bard_gathering_01_desc:0 "在这，人们在好伙伴中分享荒诞不经的故事，在肆意的狂欢中巩固了部族的团结。"
 building_type_rookery_01:0 "石像鬼群栖地"
 building_type_rookery_01_desc:0 "#F 石像鬼群栖地#!"
 building_rookery_01:0 "石像鬼群栖地"
 building_rookery_01_desc:0 "石像鬼群栖地"
 building_rookery_02:0 "石像鬼群栖地"
 building_rookery_02_desc:0 "石像鬼群栖地"
 building_rookery_03:0 "石像鬼群栖地"
 building_rookery_03_desc:0 "石像鬼群栖地"
 building_type_maats_haven_01:0 "玛阿特圣所"
 building_type_maats_haven_01_desc:1 "#F [GetGeographicalRegion('pod_lands_of_faith').GetName]以外的地方强烈受到阿波菲斯的力量的影响，使得塞赫更加难以获得。虽然仍有少数玛阿特仍然占据优势的孤立场地，但它们往往受到其他超自然势力的掌控。#!"
 building_maats_haven_01:0 "简易玛阿特圣所"
 building_maats_haven_01_desc:1 "你截下了一丁点的塞赫脉流，但没法再多了。"
 building_maats_haven_02:0 "下等玛阿特圣所"
 building_maats_haven_02_desc:1 "你截下了一丝丝的塞赫脉流，但没法再多了。"
 building_maats_haven_03:0 "中等玛阿特圣所"
 building_maats_haven_03_desc:1 "你截下了微弱的塞赫脉流，但没法再多了。"
 building_maats_haven_04:0 "上等玛阿特圣所"
 building_maats_haven_04_desc:1 "你在这一地区截下一小股塞赫脉流。"
 building_maats_haven_05:0 "强力玛阿特圣所"
 building_maats_haven_05_desc:1 "你在这个地区截下一定的塞赫脉流。"
 building_maats_haven_06:0 "王级玛阿特圣所"
 building_maats_haven_06_desc:1 "你截下了这地区的一股强力塞赫脉流。"
 building_maats_haven_07:0 "帝级玛阿特圣所"
 building_maats_haven_07_desc:1 "整个圣地都在你的控制之下。"
 building_maats_haven_08:0 "神级玛阿特圣所"
 building_maats_haven_08_desc:1 "在过去漫长的岁月中，这个圣地是无与伦比的，且塞赫从这个美丽的地方不断涌出。"
 building_pairidaeza_02:0 "体面的波斯庭院"
 building_pairidaeza_02_desc:1 "个休息和缅怀失去已久的黄金时代的地方。内心风暴的风暴眼。"
 building_pairidaeza_03:0 "壮丽的波斯庭院"
 building_pairidaeza_03_desc:1 "一个隐藏的奇迹国度。一个被遗忘的信仰的不驯堡垒。"
 building_type_wyrm_taint_01:0 "妖蛆污染"
 building_type_wyrm_taint_01_desc:0 "#F 由妖蛆污染而被破坏、诅咒或荒芜的土地。#!"
 building_wyrm_taint_01:0 "微小玷污"
 building_wyrm_taint_01_desc:0 "由妖蛆污染而被破坏、诅咒或荒芜的土地。"
 building_wyrm_taint_02:0 "严重污染"
 building_wyrm_taint_02_desc:0 "由妖蛆污染而被破坏、诅咒或荒芜的土地。"
 building_wyrm_taint_03:0 "重大腐化"
 building_wyrm_taint_03_desc:0 "由妖蛆污染而被破坏、诅咒或荒芜的土地。"
 building_wyrm_taint_04:0 "灾难性妖蛆污秽"
 building_wyrm_taint_04_desc:0 "由妖蛆污染而被破坏、诅咒或荒芜的土地。"
 building_type_patroned_temple_01:0 "资助神殿"
 building_type_patroned_temple_01_desc:0 "#F 礼拜场所，无论是清真寺、教堂还是其他场所，都是黑暗时代艺术能够真正繁荣的最后一个地方。#!"
 building_patroned_temple_01:0 "资助神殿"
 building_patroned_temple_01_desc:0 "礼拜场所，无论是清真寺、教堂还是其他场所，都是黑暗时代艺术能够真正繁荣的最后一个地方。"
 building_type_patroned_musicians_01:0 "资助音乐家"
 building_type_patroned_musicians_01_desc:0 "#F 游吟诗人、吟游诗人，甚至是牧师的复调和声……黑暗时代对音乐艺术爱好者来说是一个令人兴奋的时代。#!"
 building_patroned_musicians_01:0 "资助音乐家"
 building_patroned_musicians_01_desc:0 "游吟诗人、吟游诗人，甚至是牧师的复调和声……黑暗时代对音乐艺术爱好者来说是一个令人兴奋的时代。"
 building_type_patroned_theaters_01:0 "资助剧院"
 building_type_patroned_theaters_01_desc:0 "#F 虽然古典戏剧的鼎盛时期早已过去，但仍有许多文艺演出，往往是由希望获得曝光的富商赞助。#!"
 building_patroned_theaters_01:0 "资助剧院"
 building_patroned_theaters_01_desc:0 "虽然古典戏剧的鼎盛时期早已过去，但仍有许多文艺演出，往往是由希望获得曝光的富商赞助。"
 building_type_patroned_manuscripts_01:0 "资助书写者"
 building_type_patroned_manuscripts_01_desc:0 "#F 在一个黑暗的世界里，书面文字是真正知识的最后堡垒。#!"
 building_patroned_manuscripts_01:0 "资助书写者"
 building_patroned_manuscripts_01_desc:0 "在一个黑暗的世界里，书面文字是真正知识的最后堡垒。"
 building_type_patroned_painters_01:0 "资助画家"
 building_type_patroned_painters_01_desc:0 "#F 绘画仍处于起步阶段，但对于那些愿意使自己的故事化为不朽并有能力做到这一点的人来说，它已经是一个有利可图的生意。#!"
 building_patroned_painters_01:0 "资助画家"
 building_patroned_painters_01_desc:0 "绘画仍处于起步阶段，但对于那些愿意使自己的故事化为不朽并有能力做到这一点的人来说，它已经是一个有利可图的生意。"
 building_type_crescent_moon_dragon_nest_01:0 "月牙泉龙穴"
 building_type_crescent_moon_dragon_nest_01_desc:0 "#F 塔克拉玛干的两大龙穴之一，位于敦煌外的月牙泉中。#!"
 building_crescent_moon_dragon_nest_01:0 "月牙泉龙穴"
 building_crescent_moon_dragon_nest_01_desc:0 "该水体给凶民的预言家们带来了极大的信心，因为它确实刻画出几乎是数学级精确的新月。这无疑是月亮上的女神发出的信号，但这个信号的含义是一个有争议的话题。"
 building_type_perugia_chantry_01:0 "佩鲁贾秘所"
 building_type_perugia_chantry_01_desc:0 "#F 依偎在乡间小城的荒凉山丘上，这秘所远离着塞里奥斯的阴谋诡计和[GetTrait('tzimisce').GetName(GetNullCharacter)]的侵略肆虐。再加上宜人的气候，这里是饱受风霜的[GetTrait('tremere').GetName(GetNullCharacter)]最喜欢的度假地。#!"
 building_perugia_chantry_01:0 "佩鲁贾秘所：中立地"
 building_perugia_chantry_01_desc:0 "佩鲁贾由不太重要的雏儿们管理，与议会的权力斗争相去甚远。"
 building_perugia_chantry_02:0 "佩鲁贾秘所：远离风暴"
 building_perugia_chantry_02_desc:0 "在意大利[GetTrait('tzimisce').GetName(GetNullCharacter)]的存在感不强。厌倦了战争的法师们经常前往佩鲁贾，以便在远离着暗淡和血腥的特兰西瓦尼亚的地方获得休息。"
 building_perugia_chantry_03:0 "佩鲁贾秘所：度假胜地"
 building_perugia_chantry_03_desc:0 "由豪华别墅组成的庞大建筑群在等待着疲惫不堪的[GetTrait('tremere').GetName(GetNullCharacter)]，他们在这里逗留，诗歌、游戏和雕塑竞相缓解他们的心灵。"
 building_type_abbey_crown_01:0 "圣冠隐修院"
 building_type_abbey_crown_01_desc:0 "#F 圣冠隐修院坐落在小型高地上（150英尺高），所处空地的周围混杂生长着森林和荆棘丛（有些像小树一样高）。隐修院建于12世纪初，由受一堵坚固的石墙围绕的建筑群组成。#!"
 building_abbey_crown_01:0 "小型圣冠隐修院"
 building_abbey_crown_01_desc:0 "圣冠隐修院最令人满意的特点是位于隐修院下面的一列地下房间。这些小房间旨在作为冥想区或忏悔室使用，为访客提供了足够的休息场所。"
 building_abbey_crown_02:0 "大型圣冠隐修院"
 building_abbey_crown_02_desc:0 "圣冠隐修院的名字来自一个传说，该传说将荆棘丛的起源归结为公元一世纪亚利马太的约瑟对英格兰的造访。"
 building_abbey_crown_03:0 "著名圣冠隐修院"
 building_abbey_crown_03_desc:0 "自成立以来，该隐修院一直被作为一个中立场所，用于解决争斗中的贵族甚至互争的吸血鬼领主之间的争吵。"
 building_type_mestra_farmstead_01:0 "梅伊瑟娜农庄"
 building_type_mestra_farmstead_01_desc:0 "#F 一座不起眼的小农庄，早就被遗忘在历史中了。然而，对于了解的人来说，这个地方似乎有着奇特的意义。#!"
 building_mestra_farmstead_01:0 "梅伊瑟娜农庄：历史残片"
 building_mestra_farmstead_01_desc:0 "伊西斯与阿努比斯在逃避赛特的势力时，曾经在这所房子里避难，受到一个忠实的家庭的庇护。"
 building_mestra_farmstead_02:0 "梅伊瑟娜农庄：神话回忆"
 building_mestra_farmstead_02_desc:0 "这座小房子见证了第一位木乃伊获得亡生的过程，这是伊西斯为了拯救荷鲁斯和奥西里斯而匆忙进行的测试。"
 building_mestra_farmstead_03:0 "梅伊瑟娜农庄：神战战场"
 building_mestra_farmstead_03_desc:0 "赛特追上了伊西斯和阿努比斯，在这里发生了一场伟大的战斗，一场神与神的战斗。"
 building_type_main_isis_01:0 "伊西斯主殿"
 building_type_main_isis_01_desc:0 "#F 曾是伊西斯信徒最强大的堡垒，因背叛和粗心而沦为废墟。#!"
 building_main_isis_01:0 "废弃的伊西斯神殿"
 building_main_isis_01_desc:0 "一次背叛结束了伊西斯教对埃及的统治，但其衰落的种子早已经埋下。"
 building_main_isis_02:0 "复原的伊西斯神殿"
 building_main_isis_02_desc:0 "在荷鲁斯的继承人的帮助下，伊西斯信仰可以再次找到它的目标，并重新获得它的传承。"
 building_main_isis_03:0 "伊西斯主殿"
 building_main_isis_03_desc:0 "伊西斯教派再次为对抗赛特、阿波菲斯和所有威胁玛阿特的事物的长久战争做好准备。"
 building_type_nest_corrupt_01:0 "龙穴污染"
 building_type_nest_corrupt_01_desc:0 "#F 一位恶鬼污染了这龙穴，玷污了它，使它成为黑暗、邪恶和痛苦的来源。它不再是所有鬼神的力量源泉，而是成为阎魔的前哨，成为只有恶鬼和像他们一样的存在可以利用的能量源泉。#!"
 building_nest_corrupt_01:0 "低级污染"
 building_nest_corrupt_01_desc:0 "这龙穴已经堕入黑暗，污染了它周围的环境。"
 building_nest_corrupt_02:0 "中级污染"
 building_nest_corrupt_02_desc:0 "这龙穴已是阎魔的前哨。"
 building_nest_corrupt_03:0 "高级污染"
 building_nest_corrupt_03_desc:0 "通往幽冥的门户，无量地狱之力从这里蔓延开来。"
 occult_affiliation_effect_desc:0 "#P 若建在首都，减少普纽玛回复互动的花费（每一级减少1金）。#!"
 maats_haven_effect_desc:0 "#P 若建在首都，每月恢复塞赫（每一级增加25%的概率）。#!"
 POD_has_special_building_slot_tt:0 "该建筑只能建在有特殊建筑槽的省份。"
 building_type_den_realm_01:0 "巢域"
 building_type_den_realm_01_desc:0 "#F 巢域是一个与化形族裔联系在一起，作为她的个人退路的影界补丁。大多数巢域与物质现实中的区域相联系，并提供一条进入近影界的通道，这样从小撇步或用类似的方式进入影界就会更容易。巢域受到很好地防护，很难突破它们的防御。#!"
 den_realm_effect_desc:0 "若建在首都，每一级使进入灵界花费：[gold_i]#P -25%#!"
 building_den_realm_01:0 "小型巢域"
 building_den_realm_01_desc:0 "一个通往影界口袋位面的小而实用的传送门。"
 building_den_realm_02:0 "中型巢域"
 building_den_realm_02_desc:0 "一个通往影界口袋位面的传送门，且有小型防御系统保护。"
 building_den_realm_03:0 "大型巢域"
 building_den_realm_03_desc:0 "一个通往小型影界界域的隧道，且有坚固的防御系统保护。"
 building_den_realm_04:0 "巨型巢域"
 building_den_realm_04_desc:0 "一个通往大型影界界域的隧道，且有坚固的防御系统保护，是拥有者安享晚年的理想场所。"
 building_type_sylie_01:0 "仪式之网"
 building_type_sylie_01_desc:0 "#F 对于阿南西来说，仪式之网就相当于巢域。它的主要作用是连接安娜纳莎，并作为休息场所，以方便过渡到影界。仪式之网交织在式样网络的线路之间，与蜘蛛人的休息场所完全不同。大多数阿南西选择在他们的仪式之网中觅食，引诱猎物进入仪式之网并确保它们无法逃离。大多数阿南西会选择城市环境作为其仪式之网的背景，例如公寓、废弃的地下室甚至橱柜。#!"
 sylie_effect_desc:0 "若建在首都，每一级使进入灵界花费：[gold_i]#P -25%#!"
 building_sylie_01:0 "小型仪式之网"
 building_sylie_01_desc:0 "一个通往影界口袋位面的小而实用的传送门。"
 building_sylie_02:0 "中型仪式之网"
 building_sylie_02_desc:0 "一个通往影界口袋位面的传送门，且有小型防御系统保护。"
 building_sylie_03:0 "大型仪式之网"
 building_sylie_03_desc:0 "一个通往小型影界界域的隧道，且有坚固的防御系统保护。"
 building_sylie_04:0 "巨型仪式之网"
 building_sylie_04_desc:0 "一个通往大型影界界域的隧道，且有坚固的防御系统保护，是拥有者安享晚年的理想场所。"
 building_type_hanging_gardens_01:0 "空中花园"
 building_type_hanging_gardens_01_desc:0 "#F 巴比伦空中花园是古代世界七大奇迹之一，又称悬园。#!"
 building_hanging_gardens_01:0 "空中花园"
 building_hanging_gardens_01_desc:0 "空中花园，又称悬苑，是古代七大奇迹之一。传说是公元前6世纪由巴比伦王国的尼布甲尼撒二世在巴比伦城附近为其患思乡病的王妃安美依迪丝修建。据说空中花园采用立体造园手法，将花园放在四层平台之上，由沥青及砖块建成，平台由25米高的柱子支撑，并且有灌溉系统，奴隶不停地推动连系着齿轮的把手。园中种植各种花草树木，远看犹如花园悬在半空中，由此得名空中花园。"
 building_type_ramessu_court_01:0 "拉美苏之庭"
 building_type_ramessu_court_01_desc:0 "#F 拉美苏的宫廷仿效古埃及习俗，对潜藏不屑一顾，却对古老的礼仪、华丽和荣耀十分在意。#!"
 building_ramessu_court_01:0 "拉美苏之庭"
 building_ramessu_court_01_desc:0 "拉美苏的宫廷仿效古埃及习俗，对潜藏不屑一顾，却对古老的礼仪、华丽和荣耀十分在意。"
 building_type_sundervere_cult_01:0 "孙陀罗伐罗密教"
 building_type_sundervere_cult_01_desc:0 "#F 孙陀罗伐罗是操纵和煽动狂热的大师，他的信徒比大多数人想象的要多得多。#!"
 building_sundervere_cult_01:0 "小型密教"
 building_sundervere_cult_01_desc:0 "即使是在早期阶段，孙陀罗伐罗的影响力也让许多热血沸腾的狂热分子愿意为他的功业献身。"
 building_sundervere_cult_02:0 "中型密教"
 building_sundervere_cult_02_desc:0 "孙陀罗伐罗的邪恶影响渗透到这个地区，给了他打击不信者的力量。"
 building_sundervere_cult_03:0 "大型密教"
 building_sundervere_cult_03_desc:0 "无论你走到哪里，都会被孙陀罗伐罗的狂热分子盯上。不管别人知道与否，这片土地都是他的。"
 building_type_necromantic_sekhem_01:0 "亡灵塞赫源泉"
 building_type_necromantic_sekhem_01_desc:0 "#F 由于远离埃及，又被冥界的力量所包围，伊努哈顿不得不适应环境，寻找一些…….不同寻常的塞赫来源。#!"
 building_necromantic_sekhem_01:0 "小型亡灵塞赫源泉"
 building_necromantic_sekhem_01_desc:0 "来自[shadowlands|E]的一些能量正被伊努哈顿引导到这里，用于他的神秘目的。"
 building_necromantic_sekhem_02:0 "中型亡灵塞赫源泉"
 building_necromantic_sekhem_02_desc:0 "在这，通过伊努哈顿的自创仪式，死者的能量以神秘的方式与塞赫融合。"
 building_necromantic_sekhem_03:0 "大型亡灵塞赫源泉"
 building_necromantic_sekhem_03_desc:0 "这一地区的[shadowlands|E]散发着令人毛骨悚然的灵光，被伊努哈顿完全吸收，为他奇特而繁多的仪式提供能量。"