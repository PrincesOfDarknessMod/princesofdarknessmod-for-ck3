 building_type_bright_promise_01_desc:0 "#F 在亚柯中心存在着一处罕见的城镇圣地。吸血鬼们无法进入城市从而使得这个多元文化和和平的圣地得以蓬勃发展。#!"
 building_bright_promise_01:0 "萌芽的光誓圣地"
