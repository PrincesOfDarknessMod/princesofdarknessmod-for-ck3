 building_type_winter_forest_01:0 "冬林圣地"
 building_type_winter_forest_01_desc:0 "#F 这是牡鹿赠送给赤爪的一座圣地并由这个部族所支配，但由于与天马达成的谅解，这地方也默许了黑怒狼子的存在。#!"
 building_winter_forest_01:0 "萌芽的冬林圣地"
 building_winter_forest_01_desc:0 "这是牡鹿赠送给赤爪的一座圣地并由这个部族所支配，但由于与天马达成的谅解，这地方也默许了黑怒狼子的存在。"
 building_winter_forest_02:0 "扩张的冬林圣地"
