l_simp_chinese:
 building_type_blood_tax_01:0 "血税"
 building_type_blood_tax_01_desc:1 "#F 你正确保你的臣民们正在工作，直到他们咽下最后一口气。#!"
 building_blood_tax_01:0 "宽松的血税"
 building_blood_tax_01_desc:1 "你在这里公开向凡人们征税，但这不是促进伯爵领经济繁荣的最合理计划。"
 building_blood_tax_02:0 "沉重的血税"
 building_blood_tax_02_desc:1 "在你的统治下凡人正在为钱流血。虽然只在他们幸运的情况下。"
 building_blood_tax_03:0 "严荷的血税"
 building_blood_tax_03_desc:1 "你的金库正在迅速的被填充。你在统治一片贫瘠之地又怎样？"
 building_type_open_rule_01:0 "公开统治"
 building_type_open_rule_01_desc:1 "#F 没有你的坚定领导，无助的凡人没有任何益处。奇怪的是，他们似乎并不都赞同这个显而易见的事实。#!"
 building_open_rule_01:0 "强硬统治"
 building_open_rule_01_desc:1 "你是这片土地的主人，无论是对于吸血鬼还是其他种族。你是被敬畏的，但是反叛的声音开始增长了。"
 building_open_rule_02:0 "迫压统治"
 building_open_rule_02_desc:1 "凡人们坐等着每夜的一个处决。至少，在他们认为你听得到他们的时候……"
 building_open_rule_03:0 "暴政统治"
 building_open_rule_03_desc:1 "凡人是牲畜，在你的恐惧和绝望的国度亦被视为此。他们会抓住任何机会来拯救自己。"
 building_type_forced_conscription_01:0 "强制征兵"
 building_type_forced_conscription_01_desc:1 "#F 你给了你国度所有人在你军队服务的荣誉。遗憾的是，这会使你的下仆实际掌控伯爵领的能力过度膨胀。#!"
 building_forced_conscription_01:0 "小幅征兵效果"
 building_forced_conscription_01_desc:1 "你的一些人在外面，说服人们为你而死实际上是一件好事。"
 building_forced_conscription_02:0 "正规征兵效果"
 building_forced_conscription_02_desc:1 "在你的国度里，到处都是征兵中心，不参加是不可能的。"
 building_forced_conscription_03:0 "大规模征兵效果"
 building_forced_conscription_03_desc:1 "他们贡献服务并到时再死，但不是现在就死。"
 building_type_night_terror_01:0 "夜之猎手"
 building_type_night_terror_01_desc:1 "#F 带着你的仆群在晚上四处觅食是你的天性，你无法抗拒这种出门猎食猎物的渴望。#!"
 building_night_terror_01:0 "夜之敬畏"
 building_night_terror_01_desc:1 "当你屈服在你的欲望时，人们就会不断消失。你对伯爵领的控制力降低了，但是你的仆群增多了。"
 building_night_terror_02:0 "夜之恐怖"
 building_night_terror_02_desc:1 "在频繁的掠食之间，你几乎无法恢复理智并统治自己的国度。"
 building_night_terror_03:0 "夜之惊骇"
 building_night_terror_03_desc:1 "你的仆群是唯一真理。其他人都是将被掠食的猎物。"
 building_type_influence_noble_01:0 "掌控贵族"
 building_type_influence_noble_01_desc:1 "#F 通过影响、勒索和诱惑，你可以密切关注这伯爵领的凡人统治阶级。这样做会抑制其他凡人和黄金流动。#!"
 building_influence_noble_01:0 "轻度贵族掌控"
 building_influence_noble_01_desc:1 "这种程度的影响，已经开始破坏统治阶级的凝聚力，削弱他们的军事意识。"
 building_influence_noble_02:0 "显著贵族掌控"
 building_influence_noble_02_desc:1 "你对他们的控制越来越大，但从局外人的角度来看，事情开始恢复正常。"
 building_influence_noble_03:0 "重度贵族掌控"
 building_influence_noble_03_desc:1 "统治阶级可能不知道，但他们现在是你的了，并且无人怀疑。"
 building_type_influence_underworld_01:0 "掌控下层社会"
 building_type_influence_underworld_01_desc:1 "#F 你可以从这个地区的法外之徒身上榨取很多利益，无论是金钱还是为你的精锐卫队雇佣经验丰富的新兵。然而，煽动犯罪团伙也有其缺点。#!"
 building_influence_underworld_01:0 "轻度下层社会掌控"
 building_influence_underworld_01_desc:1 "帮助罪犯已经开始让你赚钱了。但这也激怒了当地的民众。"
 building_influence_underworld_02:0 "显著下层社会掌控"
 building_influence_underworld_02_desc:1 "有了你的指导，你的恶棍团伙制造的不必要的麻烦越来越少，赚取的利润越来越多。"
 building_influence_underworld_03:0 "重度下层社会掌控"
 building_influence_underworld_03_desc:1 "你已经尽可能地压制了你的犯罪同伙们最恶劣的本性。他们几乎和正规的战斗部队一样纪律严明。"
 building_type_influence_merchant_01:0 "掌控商人"
 building_type_influence_merchant_01_desc:1 "#F 商人很富有，而你需要黄金。这个等式很简单，但他们可能不会轻易给出来。#!"
 building_influence_merchant_01:0 "轻度商人掌控"
 building_influence_merchant_01_desc:1 "他们在抗拒，在抱怨，在挑起事端。但有些人已经开始支付给你完全合法的税。"
 building_influence_merchant_02:0 "显著商人掌控"
 building_influence_merchant_02_desc:1 "大多数商人都被吓到了，持不同意见者也只能在小巷里交头接耳。"
 building_influence_merchant_03:0 "重度商人掌控"
 building_influence_merchant_03_desc:1 "你现在可以重新组合公会，展示你的增税计划，并仍然赢得雷鸣般的掌声。"
 building_type_prince_city_00:0 "亲王领"
 building_type_prince_city_00_desc:1 "#F 吸血鬼是城市居民。城市越大，吸血鬼就越令人恐惧，也越有声望。#!"
 building_prince_city_00:0 "城镇亲王"
 building_prince_city_00_desc:1 "你控制着一个人口稀少地区的首府。虽然不多，但总比没有好。"
 building_prince_city_005:0 "大城镇亲王"
 building_prince_city_005_desc:1 "你正在控制一个人口较少的地区首府。虽然不多，但总比没有好。"
 building_prince_city_01:0 "城市亲王"
 building_prince_city_01_desc:1 "你控制着整个小城市，或者一个大城市的一小部分。这只是第一步。"
 building_prince_city_02:0 "郡城亲王"
 building_prince_city_02_desc:1 "你的宫廷受到尊敬和钦佩，因为你统治着这么多的凡人。"
 building_prince_city_025:0 "大郡城亲王"
 building_prince_city_025_desc:1 "一个你控制下的重要城市，许多凡人都自愿在这里受你的奴役。"
 building_prince_city_03:0 "首都亲王"
 building_prince_city_03_desc:1 "凡人、国王和军阀居住在这个令人印象深刻的城市。你是他们在夜间的同类。"
 building_prince_city_04:0 "大都会亲王"
 building_prince_city_04_desc:1 "世上最伟大的城市之一在你的阴影之下。你的影响力在你的领地几乎没有任何限制。"
 building_type_temple_set_01:0 "赛特神殿"
 building_type_temple_set_01_desc:1 "#F 你做梦也想不到的快乐就在这里。如果你愿意付出代价。#!"
 building_temple_set_01:0 "体面的赛特神殿"
 building_temple_set_01_desc:1 "你已经为腐化之神建立了一个小而可敬的神殿，数个灵魂已经落入他的黑暗怀拥。"
 building_type_devasthana_01:0 "控制印度庙"
 building_type_devasthana_01_desc:1 "#F 印度陷入了一场千年之久的圣战，以阻止阿修罗提伽耶。要赢得胜利，你需要信仰和坚不可摧的信念。#!"
 building_devasthana_01:0 "体面的印度庙"
 building_devasthana_01_desc:1 "在这里，在提婆的保护下，你会找到继续前行的力量。"
 building_type_brahmavihara_01:0 "婆罗门的导师"
 building_type_brahmavihara_01_desc:1 "#F 你的身体状况，虽然只是一段漫长旅程的一部分，却让你更难遵从佛陀的教诲。你可能需要一些帮助。#!"
 building_brahmavihara_01:0 "体面的等舍"
 building_brahmavihara_01_desc:1 "在所有情况下保持中立是平和的检验。它是心灵平静和涅槃的途径。"
 building_type_low_war_01:0 "局部战争"
 building_type_low_war_01_desc:1 "#F 每时每刻都是战场，无论是政治上的还是现实上的。玉之战士时刻准备着。#!"
 building_low_war_01:0 "无尽局部战争"
 building_low_war_01_desc:1 "你总是在战斗，而休息是早已逝去的记忆。但是你的敌人也一样。"
 building_type_chantry_01:0 "歌祷堂"
 building_type_chantry_01_desc:1 "#F 一群不死族法师的集会。睿魔尔在此处修习他们隐秘的血魔法之术。#!"
 building_chantry_01:0 "体面的歌祷堂"
 building_chantry_01_desc:1 "这里立着一座小秘所，以及你那段金字塔的单个[cainite|E]和数个术士。这只是开始。"
 building_type_underworld_portal_01:0 "通往冥界的门"
 building_type_underworld_portal_01_desc:1 "#F 作为少数了解冥界的吸血鬼之一，你可以利用它的专横的存在作为你的优势#!"
 building_underworld_portal_01:0 "通往冥界的通道"
 building_underworld_portal_01_desc:1 "鬼魂是饥肠辘辘的。环绕在你周围时，他们会更加渴望你敌人的心灵。"
 building_type_pairidaeza_01:0 "波斯庭院"
 building_type_pairidaeza_01_desc:1 "#F 这些花园是波斯祆教最伟大时代的遗留物，是吸血鬼坚持长期信仰的绿洲。#!"
 building_pairidaeza_01:0 "谦卑的波斯庭院"
 building_pairidaeza_01_desc:1 "道德沙漠中的精神养料之井。过往的微弱回声。"
 building_type_unending_party_01:0 "无尽派对"
 building_type_unending_party_01_desc:1 "#F 只有把每件事都推到极致，才能感受到生命的存在。一直都是。#!"
 building_unending_party_01:0 "年度派对"
 building_unending_party_01_desc:1 "有些客人永远都不想离开你的宴会。大多数客人却如何都，不能。"
 building_type_fallen_church_01:0 "堕落教堂"
 building_type_fallen_church_01_desc:1 "#F 你的灵魂早已迷失。所以，在这里，你要确保拯救每个人的灵魂。不管他们喜欢不喜欢#!"
 building_fallen_church_01:0 "堕者神龛"
 building_fallen_church_01_desc:1 "这里能听到如此多的哭声，如此多的宽恕请求。而，在最后，几乎不会有救赎。"
 building_type_laboratory_01:0 "研究室"
 building_type_laboratory_01_desc:1 "#F 很多东西进入这里。很少离开。有些甚至成为该整体的一部分。#!"
 building_laboratory_01:0 "体面的血肉塑造实验室"
 building_laboratory_01_desc:1 "一个很恰当的地方，如果你需要方便的空间去塑捏那些自愿者又或不自愿者的骨肉。"
 building_type_mother_garden_01:0 "莉莉丝的庭园"
 building_type_mother_garden_01_desc:1 "#F 真正的伊甸园只存在对第一个女人的崇拜中，那个被亚当、该隐和天主自己背叛的女人。#!"
 building_mother_garden_01:0 "少女的庭园"
 building_mother_garden_01_desc:1 "作为“少女”，莉莉丝诱使其他人去发现隐藏在现实面纱背后的真相。"
 building_type_legacies_gathering_01:0 "传承集会"
 building_type_legacies_gathering_01_desc:1 "#F 大多数时候，莱本喜欢在草率行动之前把事情商量一下。举办这样的聚会是一项享有声望的活动。#!"
 building_legacies_gathering_01:0 "大型集会"
 building_legacies_gathering_01_desc:1 "相当数量的宗族代表聚集在这里，讨论该地区和其他地区的未来。"
 building_type_influence_people_01:0 "掌控人群"
 building_type_influence_people_01_desc:1 "#F 从最好的到最坏的，人性就是一切。因此，你可以与社会的每一个层面相互纠缠，并从中学习。#!"
 building_influence_people_01:0 "轻度人群掌控"
 building_influence_people_01_desc:1 "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才能不变成怪物。"
 building_type_influence_clergy_01:0 "掌控圣职"
 building_type_influence_clergy_01_desc:1 "#F 圣职人员是牧人类的牧羊人，控制牧羊人就意味着控制羊群。#!"
 building_influence_clergy_01:0 "轻微圣职掌控"
 building_influence_clergy_01_desc:1 "有着当地的牧师在你的锦囊里可能是最有用的。"
 building_type_crypt_01:0 "墓穴"
 building_type_crypt_01_desc:1 "#F 你的工作需要适当的地点和用品。而且，最好是一个非常安静和隐蔽的地方，一个邻居们不会抱怨的地方。#!"
 building_crypt_01:0 "体面墓穴"
 building_crypt_01_desc:1 "独自在黑暗中，周围是一些新死者和老死者的骨头。它需要完善，但就这样也能用。"
 building_type_assassins_cell_01:0 "刺客群"
 building_type_assassins_cell_01_desc:1 "#F 哈基姆的子嗣在世界的每一个角落都有一个庞大的由特工，线人和其他有用的工具人组成的网络。#!"
 building_assassins_cell_01:0 "小型刺客群"
 building_assassins_cell_01_desc:1 "在这一地区的小规模哈基姆派允许你有一些非常有用的备用手段，以实现你更多的.……幕后目标。"
 building_type_alamut_01:0 "鹰巢"
 building_type_alamut_01_desc:1 "#F [GetTrait('assamite').GetName(GetNullCharacter)][Clan|E]的可怕隐形坚垒是由信仰、力量和谎言铸成的。#!"
 building_alamut_01:0 "分裂的鹰巢"
 building_alamut_01_desc:1 "与[GetTrait('assamite').GetName(GetNullCharacter)][Clan|E]一样，鹰巢内也被分为不同的种姓。修补这种分裂需要相当大的投资。"
 building_alamut_02:0 "恢复的鹰巢"
 building_alamut_02_desc:1 "尽管人们仍能听到和看到背后的激烈言辞和刀锋，但最严重的暴力爆发已被这些神圣的城墙排斥在外。"
 building_alamut_03:0 "阿拉穆特，鹰巢"
 building_alamut_03_desc:1 "至少在这里，[GetTrait('assamite').GetName(GetNullCharacter)][Clan|E]表现出了完美的凝聚力和对单一目标的奉献，使其成为一股可怕的力量。"
 building_type_rome_01:0 "罗马"
 building_type_rome_01_desc:1 "#F 罗马是[cainite|E]的中心，也是人类世界的中心。恢复它不死的伟大将是一个巨大的成就。#!"
 building_rome_01:0 "凡人的罗马"
 building_rome_01_desc:1 "圣职人员在街道上徘徊，反对任何直接控制欧洲世界中心的企图。在这个阶段，罗马对他的主人来说是一个有声望的头衔，仅此而已。"
 building_rome_02:0 "分裂的罗马"
 building_rome_02_desc:1 "慢慢地，罗马的信仰被侵蚀，吸血鬼可以再次利用他们微妙的影响力为亲王谋利。"
 building_rome_03:0 "永恒罗马"
 building_rome_03_desc:1 "最后，罗马又回到了吸血鬼的手中。当该隐子嗣歌颂征服圣城的伟大统治者时，圣职人员在黑暗中畏缩。"
 building_type_ceoris_01:0 "塞里奥斯"
 building_type_ceoris_01_desc:1 "#F [GetTrait('tremere').GetName(GetNullCharacter)]的坚固堡垒是其大本营和学习中心。这是被围困的魔法师[Clan|E]最好的资产#!"
 building_ceoris_01:0 "分裂的塞里奥斯"
 building_ceoris_01_desc:1 "在歌祷堂里有些[GetTrait('tremere').GetName(GetNullCharacter)]仍然是凡人。他们怀疑那些诡计多舛的吸血鬼有奸诈行为，并且一直是议会计划的障碍。"
 building_ceoris_02:0 "掌控中的塞里奥斯"
 building_ceoris_02_desc:1 "随着他们的凡人同行的消失或转化，[GetTrait('tremere').GetName(GetNullCharacter)]家族们终于可以利用塞里奥斯的全部潜力。"
 building_ceoris_03:0 "无法攻取的塞里奥斯"
 building_ceoris_03_desc:1 "只要这个坚固的堡垒还在，[GetTrait('tremere').GetName(GetNullCharacter)][Clan|E]就不会倒下。换言之，从外部来看至少如此……"
 building_type_carthage_01:0 "迦太基"
 building_type_carthage_01_desc:1 "#F [GetTrait('brujah').GetName(GetNullCharacter)][Clan|E]的幻梦早已被复仇心切的[GetTrait('ventrue').GetName(GetNullCharacter)]埋葬。但是梦真的会消亡吗？#!"
 building_carthage_01:0 "重建中的迦太基"
 building_carthage_01_desc:1 "重建特洛伊尔的城市将是一件代价高昂的事情，这是对世界的一个强有力的宣言。但回报和危险可能都是巨大的。"
 building_carthage_02:0 "新迦太基"
 building_carthage_02_desc:1 "罗马[cainites|E]最可怕的噩梦在你的领导下复活了。它不会再倒下。"
 building_carthage_03:0 "迦太基，布鲁赫之梦"
 building_carthage_03_desc:1 "教化的灯塔，以及人类与[cainites|E]之间合作的愿景，在此处再次可见。"
 building_type_ombos_temple_01:0 "建立翁布神殿"
 building_type_ombos_temple_01_desc:1 "#F [GetTrait('setite').GetName(GetNullCharacter)][Clan|E]的奢华核心，翁布据说也是赛特的最后休眠之地。#!"
 building_ombos_temple_01:0 "失色的翁布"
 building_ombos_temple_01_desc:1 "翁布在近些年代被年轻的#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!视为过去纪元的遗迹，其合法性受到质疑。"
 building_ombos_temple_02:0 "复苏的翁布"
 building_ombos_temple_02_desc:1 "改革和重建使神殿重新站在了时代的前沿。"
 building_ombos_temple_03:0 "高耸的翁布"
 building_ombos_temple_03_desc:1 "作为整个宗教无可争议的中心，翁布是思想、信仰和计谋的摇篮。一如既往。"
 building_type_erciyes_01:0 "埃尔吉耶斯"
 building_type_erciyes_01_desc:1 "#F 在古典时代，[GetTrait('cappadocian').GetName(GetNullCharacter)][Clan|E]从#TOOLTIP:GAME_TRAIT,malkavian,[GetNullCharacter] #L 末卡维#!#!手中夺走了山上的堡垒。从那时起，它就成为了学习和冥想的中心。#!"
 building_erciyes_01:0 "孤立的埃尔吉耶斯"
 building_erciyes_01_desc:1 "从各方面来看，埃尔吉耶斯都是一个完美的冥想场所。遗憾的是，它往往会让访客忽视来自外部的威胁。"
 building_erciyes_02:0 "开放的埃尔吉耶斯"
 building_erciyes_02_desc:1 "随着心态的改变和外部世界可以整理出通往堡垒的道路，埃尔吉耶斯成为一个世界性的学习中心。"
 building_erciyes_03:0 "埃尔吉耶斯，暗影修道院"
 building_erciyes_03_desc:1 "这座山堡既是一个休息的地方，也是整个[Clan|E]的中心，在它的城墙内可以看到连续的，但有控制的活动。"
 building_type_cathedral_of_flesh_01:0 "血肉大教堂"
 building_type_cathedral_of_flesh_01_desc:1 "#F 这极其令人憎恶的东西是几千年来由农民、奴隶、敌人、禽兽和许多其他受害者的血肉雕刻而成的，这些人被埋进搏动着的、化脓溃烂的墙壁里。#!"
 building_cathedral_of_flesh_01:0 "怀敌意的大教堂"
 building_cathedral_of_flesh_01_desc:1 "受土地本身的污染，大教堂是任何入侵者的敌人，正如它是它的主人的敌人一样。输掉这场战斗意味着要成为其中的一部分。"
 building_cathedral_of_flesh_02:0 "激昂的大教堂"
 building_cathedral_of_flesh_02_desc:1 "库帕拉的影响随着怪物开始服从它的主人而逐渐减弱。"
 building_cathedral_of_flesh_03:0 "退缩的大教堂"
 building_cathedral_of_flesh_03_desc:1 "库帕拉似乎暂时离开了。大教堂已经成为任何一个疯狂的库都术师都梦想着使用的极度可怕的工具。"
 building_type_castel_del_ombro_01:0 "暗影之堡"
 building_type_castel_del_ombro_01_desc:1 "#F 从远处是不可能分辨墙壁是由什么构成的，因为动态的阴影在几乎看不见的潮起潮落中爬过每一个表面。每天晚上日落后，潮水般的阴影从城堡深处升起，环绕城堡呈螺旋形，午夜过后，阴影会逆转并逐渐消失。#!"
 building_castel_del_ombro_01:0 "暗影之墓"
 building_castel_del_ombro_01_desc:1 "作为[antediluvian|E]的休眠之处，这座城堡是一个可怕的地方，提醒着人们在每一个[GetTrait('lasombra').GetName(GetNullCharacter)]周围都有不自然的空气。"
 building_castel_del_ombro_02:0 "暗影之堡"
 building_castel_del_ombro_02_desc:1 "作为血之法庭的中心，城堡是[Clan|E]长者的司法工具。"
 building_castel_del_ombro_03:0 "公开城堡"
 building_castel_del_ombro_03_desc:1 "城门的开启意味着勒森魃本人已经离开了城堡。在这段时间里，它周围的疯狂气氛稍稍消退，让这个地方成为[Clan|E]的政治中心。"
 building_type_rabble_thugs_01:0 "暴民和恶棍"
 building_type_rabble_thugs_01_desc:1 "#F 有时，你必须忘记你的自尊并接触一些讨厌的人，以得到一些急需的支援。#!"
 building_rabble_thugs_01:0 "征召卑贱之人"
 building_rabble_thugs_01_desc:1 "很多人是不会被任何人错过的。他们是那种你可以用来快速创建一支战斗力的人。"
 building_rabble_thugs_02:0 "征召暴民"
 building_rabble_thugs_02_desc:1 "街头的乌合之众在夜晚的战场上毫无用处。但有时候，你不能太挑剔。"
 building_rabble_thugs_03:0 "征召不法之徒"
 building_rabble_thugs_03_desc:1 "不法之徒们数量众多且至少有一点战斗经验，是很好的兵源。"
 building_type_sherwood_01:0 "舍伍德森林"
 building_type_sherwood_01_desc:1 "#F 狂徒运动就是在这里诞生的，并将繁荣几个世纪。这是避开了夜晚的暴君辛苦挣来的喘息之机。#!"
 building_sherwood_01:0 "掌控中的舍伍德"
 building_sherwood_01_desc:1 "罗宾·李兰德从密特拉的眼皮底下夺走了舍伍德并接掌了数个世纪。这一对抗老暴君的大胆成就激励着狂徒聚集起来，为该功业更加努力地战斗。"
 building_sherwood_02:0 "扩展中的舍伍德"
 building_sherwood_02_desc:1 "舍伍德的自由男女现在在森林外战斗，这让罗宾为他的学生感到骄傲。"
 building_sherwood_03:0 "凯旋的舍伍德"
 building_sherwood_03_desc:1 "只要一提到舍伍德的勇敢捍卫者、暴君的歼灭者和自由之战士，就会令暴君们胆战心惊。"
 building_type_shrine_of_telyavel_01:0 "特亚维神龛"
 building_type_shrine_of_telyavel_01_desc:1 "#F 工匠之神对凡类或超凡的事物不感兴趣。除非付出相应的代价……#!"
 building_shrine_of_telyavel_01:0 "象征性的特亚维神龛"
 building_shrine_of_telyavel_01_desc:1 "即使没有神的祝福，这座神龛仍然是一个垂死的原始教徒世界的强大呼声。"
 building_shrine_of_telyavel_02:0 "觉醒的特亚维神龛"
 building_shrine_of_telyavel_02_desc:1 "铁匠之神注视着他的信徒，被他们对他的功业再次投入的热情所吸引。"
 building_shrine_of_telyavel_03:0 "暗影之林"
 building_shrine_of_telyavel_03_desc:1 "现在此处已与神的国度直接相连，许多勇士来到这里寻求神圣祝福。"
 building_type_giovanni_mausoleum_01:0 "乔凡尼陵墓"
 building_type_giovanni_mausoleum_01_desc:1 "#F 有很多人进入这里。但很少有人离开。#!"
 building_giovanni_mausoleum_01:0 "狭小的乔凡尼陵墓"
 building_giovanni_mausoleum_01_desc:1 "[GetTrait('giovanni').GetName(GetNullCharacter)]家庭作为夜之眷族来说还很年轻，但他们仍然非常专注于对死亡和灵魂的研究。"
 building_giovanni_mausoleum_02:0 "体面的乔凡尼陵墓"
 building_giovanni_mausoleum_02_desc:1 "慢慢的，亡灵术师们将他们的注意力放到了外界，他们对新的环境给带来的机会很感兴趣。"
 building_giovanni_mausoleum_03:0 "宏伟的乔凡尼陵墓"
 building_giovanni_mausoleum_03_desc:1 "意大利人现在是一股不可忽视的力量。他们仍然是强大的亡灵术师，但也有能力参与政治游戏。"
 building_type_pit_of_malkav_01:0 "末卡维地穴"
 building_type_pit_of_malkav_01_desc:1 "#F 耶路撒冷的地下有个裂口。仅仅靠近就会让人感到痛苦。你的头感觉就要爆炸了。#!"
 building_pit_of_malkav_01:0 "开放的末卡维坑堑"
 building_pit_of_malkav_01_desc:1 "如此之多的声音说出了如此之多矛盾的事情……即使是你也可以瞥见其中一些微弱的智慧。"
 building_pit_of_malkav_02:0 "半隐的末卡维坑堑"
 building_pit_of_malkav_02_desc:1 "你已经将石头扔进了坑堑中，现在这声音不再那么疯狂。你将能够更好地理解它们。"
 building_pit_of_malkav_03:0 "关闭的末卡维坑堑"
 building_pit_of_malkav_03_desc:1 "现在声音们清静了许多，除非你非常靠近坑堑。现在靠近它可以让你轻松地将疯狂的声音从智慧的声音中分出来。"
 building_type_well_of_sacrifice_01:0 "献祭之井"
 building_type_well_of_sacrifice_01_desc:1 "#F 地狱就在地球上，它就在这里。#!"
 building_well_of_sacrifice_01:0 "小型献祭之井"
 building_well_of_sacrifice_01_desc:1 "扔进井里后，他们就停止了哭泣。这让你不快。"
 building_well_of_sacrifice_02:0 "大型献祭之井"
 building_well_of_sacrifice_02_desc:1 "还有非常多的人需要感受永恒的空虚和无尽的饥饿。"
 building_well_of_sacrifice_03:0 "魔邪献祭之井"
 building_well_of_sacrifice_03_desc:1 "他们很快就会醒来。他们很快就会来。到那时，一切都会明白。"
 building_type_london_mithraeum_01:0 "伦敦密特拉神圣所"
 building_type_london_mithraeum_01_desc:1 "#F 密特拉教信仰最古老神殿之一，至今仍为太阳神的追随者所关注。#!"
 building_london_mithraeum_01:0 "隐蔽的密特拉神圣所"
 building_london_mithraeum_01_desc:1 "因为惧怕十字，信徒们聚集在从前荣耀的阴影里。"
 building_london_mithraeum_02:0 "复苏的密特拉神圣所"
 building_london_mithraeum_02_desc:1 "密特拉的信徒在这里祈祷，寻求光明神应许的救恩，这现在是一个公开的秘密。"
 building_london_mithraeum_03:0 "凯旋的密特拉神圣所"
 building_london_mithraeum_03_desc:1 "现在是轮到十字躲藏的时候了，因为这片土地的真正信仰已经回归！"
 building_type_influence_law_01:0 "掌控立法者"
 building_type_influence_law_01_desc:1 "#F 很明显，你凌驾于凡人的法律之上。但是让你的手下在里面维持这伯爵领的公共秩序依然是有益的。#!"
 building_influence_law_01:0 "轻度立法者掌控"
 building_influence_law_01_desc:1 "经常在耳边吹风有助于在保持很长的一段时间的民间平息。"
 building_influence_law_02:0 "显著立法者掌控"
 building_influence_law_02_desc:1 "你在这里对司法系统有很强的拉动作用。强大到可以在很多方面加以利用。"
 building_influence_law_03:0 "重度立法者掌控"
 building_influence_law_03_desc:1 "你猜对了：在这个阶段，你就是法律。"
 building_type_haven_defenses_01:0 "藏身处防护"
 building_type_haven_defenses_01_desc:1 "#F 这不是妄想，你的敌人总有一天会来找你。当这种情况发生时，你最好有一个应急计划。#!"
 building_haven_defenses_01:0 "轻度藏身处防护"
 building_haven_defenses_01_desc:1 "分散在省份各地的一些陷阱和可靠的岗哨是任何强大防御的良好开端。"
 building_haven_defenses_02:0 "重度藏身处防护"
 building_haven_defenses_02_desc:1 "你已经做好了最坏的打算，你有对应急计划的应急计划。"
 building_haven_defenses_03:0 "极度藏身处防护"
 building_haven_defenses_03_desc:1 "他们要带一整支突击兵团才能把你打倒！"
 building_type_remote_haven_01:0 "偏远藏身处"
 building_type_remote_haven_01_desc:1 "#F 有时候，你不得不退一步来计划下一步，远离窥探的目光。#!"
 building_remote_haven_01:0 "空荡的偏远藏身处"
 building_remote_haven_01_desc:1 "这个藏身处远离文明的气息。这可能是它唯一的好处。"
 building_remote_haven_02:0 "舒适的偏远藏身处"
 building_remote_haven_02_desc:1 "这不是你的宫廷，但对于一个短期假期来说，这已经足够好了。"
 building_remote_haven_03:0 "奢华的偏远藏身处"
 building_remote_haven_03_desc:1 "你住在离家很远的地方，非常安全并且符合你的精致品味。"
 building_type_influence_barracks_01:0 "掌控兵营"
 building_type_influence_barracks_01_desc:1 "#F 职业军队正在凡人社会中卷土重来。这对[cainites|E]是一个难得的机会，来获取一些经验丰富的战士用于他的功业。#!"
 building_influence_barracks_01:0 "轻度兵营掌控"
 building_influence_barracks_01_desc:1 "这一带的一些士兵都在你的工资单上。他们在危急时刻是有用的盟友。"
 building_influence_barracks_02:0 "显著兵营掌控"
 building_influence_barracks_02_desc:1 "大部分地方军队都知道你的名字，或者为那些知道你名字的人工作。"
 building_influence_barracks_03:0 "重度兵营掌控"
 building_influence_barracks_03_desc:1 "当地的军队知道谁才是他们真正的主人。当然也不是什么浮夸的地方贵族。"
 building_type_influence_burghers_01:0 "掌控市民"
 building_type_influence_burghers_01_desc:1 "#F 在凡人的世界，一个新的社会阶层正在出现。这些“布尔乔亚”有充足的金钱，但几乎没有实际的军事力量。用于秘密交易的完美目标。#!"
 building_influence_burghers_01:0 "轻度市民掌控"
 building_influence_burghers_01_desc:1 "你已经对这个地区的商人阶层做了一些初步的接触。"
 building_influence_burghers_02:0 "显著市民掌控"
 building_influence_burghers_02_desc:1 "作为这个地区一些最富有商人的背后赞助人，你从中获得了可观的利润。"
 building_influence_burghers_03:0 "重度市民掌控"
 building_influence_burghers_03_desc:1 "钱在这里只流进一个方向，那就是你的口袋。"
 building_type_fortress_cross_01:0 "十字堡垒"
 building_type_fortress_cross_01_desc:1 "#F 亚柯骑士们戒备森严的总殿可能是裁判所里最令人惊叹的要塞。#!"
 building_fortress_cross_01:0 "孤立的十字堡垒"
 building_fortress_cross_01_desc:1 "真令人感慨，亚柯骑士的首领在裁判所的其他一些圣地仍然缺乏政治权力。"
 building_fortress_cross_02:0 "熙攘的十字堡垒"
 building_fortress_cross_02_desc:1 "被重新翻修成了一处提供给所有胸怀大志的裁判官使用的重要朝圣地后，堡垒如今成为了精锐们的训练中心。"
 building_fortress_cross_03:0 "真十字堡垒"
 building_fortress_cross_03_desc:1 "因为城墙受到了真十字架的碎片的祝福，堡垒如今成为了一个坚不可摧的信标。"
 building_type_st_scholastica_01:0 "圣思嘉"
 building_type_st_scholastica_01_desc:1 "#F 红修会第二重要的赞助者圣思嘉是圣本笃的孪生姐妹，一位意志坚定但信仰虔诚的女人。#!"
 building_st_scholastica_01:0 "圣思嘉修道院"
 building_st_scholastica_01_desc:1 "红修女们最重要的修道院是一个奇怪的地方，在那里修女们享有远超她们大多数圣职同胞们的自由。"
 building_st_scholastica_02:0 "圣思嘉图书馆"
 building_st_scholastica_02_desc:1 "裁判所最大的图书馆之一，它还收藏着禁忌的传说。只有最虔诚的修女才能进入。"
 building_st_scholastica_03:0 "圣思嘉圣物室"
 building_st_scholastica_03_desc:1 "为了和敌人战斗，红修会不羞于使用非常规的手段。在这里她们找到了她们最强大的武器。"
 building_type_castle_von_murnau_01:0 "穆尔瑙的城堡"
 building_type_castle_von_murnau_01_desc:1 "#F 著名裁判官家族的祖宅。一个享有荣耀和财富的地方。#!"
 building_castle_von_murnau_01:0 "穆尔瑙的庄园"
 building_castle_von_murnau_01_desc:1 "品味奢华而又构思精巧，这座庄园和复杂的德意志贵族景观完美地融为一体。"
 building_castle_von_murnau_02:0 "穆尔瑙的城堡"
 building_castle_von_murnau_02_desc:1 "专门预留了一间侧厅用于裁判官事务，穆尔瑙的城堡成为了来访猎人的重要休息处。"
 building_castle_von_murnau_03:0 "冯·穆尔瑙堡垒"
 building_castle_von_murnau_03_desc:1 "堡垒挑衅着黑暗的下仆，准备好抵御任何威胁。这是家族所受的诅咒和祝福这两者的证明。"
 building_type_the_nest_01:0 "窟穴"
 building_type_the_nest_01_desc:1 "#F 罗德里格的偏执建成了这座位于潘普洛纳地下的迷宫隧道，期待着有朝一日能在对抗被诅咒的吸血怪物时产生出其不意的效果。#!"
 building_the_nest_01:0 "小型窟穴"
 building_the_nest_01_desc:1 "建得很好，但依然很小，主要是作为圣雅各伯骑士分享信息的安全途径。"
 building_the_nest_02:0 "大型窟穴"
 building_the_nest_02_desc:1 "罗德里格的隧道网络和间谍网覆盖了潘普洛纳的大部分地方，如今成为了伊比利亚裁判所最惊人的财产。"
 building_the_nest_03:0 "坚固窟穴"
 building_the_nest_03_desc:1 "任何圣雅各伯的敌人一旦踏入潘普洛纳就不可能活着离开。罗德里格的网络如今准备好应对一切麻烦。"
 building_type_st_cecila_01:0 "圣则济利亚修道院"
 building_type_st_cecila_01_desc:1 "#F 圣约翰修女会的训练总部是一个需要在令人发狂的幻觉海洋里保持宁静和进行冥想的地方。#!"
 building_st_cecila_01:0 "圣则济利亚医院"
 building_st_cecila_01_desc:1 "任何在不列颠群岛受伤的裁判官都知道他们应该感谢博学的修女们能在这里照料他们。"
 building_st_cecila_02:0 "圣则济利亚驱魔师"
 building_st_cecila_02_desc:1 "裁判所最厉害的驱魔师是在圣则济利亚受训的。世上没有灵类能抵抗他们的召唤，无论是处于和平或是战争。"
 building_st_cecila_03:0 "圣则济利亚裁判官"
 building_st_cecila_03_desc:1 "修女们是信奉和平的女人，但她们知道敌人不是。少数选择将一生投入到战争中的人拥有着卓越的智慧和虔诚。"
 building_type_everard_players_01:0 "埃弗拉德的演员"
 building_type_everard_players_01_desc:1 "#F 阿拉斯的埃弗拉德名下的著名艺术家剧团实际上是属于神目——裁判所的间谍的最重要的财产之一。#!"
 building_everard_players_01:0 "《阿拉斯的宫廷》"
 building_everard_players_01_desc:1 "让·博德尔写的剧本之一是对圣经中的浪子故事的改编。"
 building_everard_players_02:0 "《圣尼古拉斯》"
 building_everard_players_02_desc:1 "剧本中一位虔诚的圣徒被委托了属于异教徒国王的黄金。"
 building_everard_players_03:0 "《杰纳的虔信者》"
 building_everard_players_03_desc:1 "剧团实际上受到圣雅各伯之剑的骑士们保护。有着如此强力的助臂，演员们总能逃离他们最热情的批评者。"
 building_type_ipeasants_01:0 "掌控农田"
 building_type_ipeasants_01_desc:1 "#F 那些在田野间辛勤劳作，诚实而又敬畏天主的人们是这个国度和我们的斗争的支柱。#!"
 building_ipeasants_01:0 "布道农民"
 building_ipeasants_01_desc:1 "农奴们很容易被那些上流阶级的人影响，将我们的密探派到他们之中能确保我们获取他们的支持。"
 building_ipeasants_02:0 "催化农民"
 building_ipeasants_02_desc:1 "乡下人都很害怕，但若被我们的热情赋予力量，他们可以变成我们功业的忠实盟友。"
 building_ipeasants_03:0 "从农民到士兵"
 building_ipeasants_03_desc:1 "合理地煽动他们反抗黑暗力量，这些田地人民可以变成向我们的权威效忠的有组织的军队。"
 building_ipeasants_04:0 "夏祭战争"
 building_ipeasants_04_desc:1 "农民们的内心因正义的怒火而熊熊燃烧。他们是天主的愤怒羊群，而我们是他们的羊倌。"
 building_type_ieducation_01:0 "掌控信仰教育"
 building_type_ieducation_01_desc:1 "#F 通过支持教授当地人天主之言的行动，我们可以帮助他们变得更加虔诚，更有文化和对我们的行动表现出更多的赞同。#!"
 building_ieducation_01:0 "建设主日学校"
 building_ieducation_01_desc:1 "百姓的孩子们需要意识到我们使命的重要性，就算不知道它确切的本质。"
 building_ieducation_02:0 "建设神学院"
 building_ieducation_02_desc:1 "在我们的精心指导下，下一代在此接受教育的牧师们将为我们的功业做好加入的准备。"
 building_ieducation_03:0 "建设神学大学"
 building_ieducation_03_desc:1 "这里是教廷的学者塑造教廷未来的地方。我们的影响力将确保我们能在其中扮演关键的角色。"
 building_ieducation_04:0 "武器化神学"
 building_ieducation_04_desc:1 "由于将涉及到宗教教育有关的一切事物都牢牢掌控在了手里，我们能按照我们的需要修改善与恶的定义。"
 building_type_ioutskirts_01:0 "掌控郊区"
 building_type_ioutskirts_01_desc:1 "#F 一旦被掌控，当地的荒原就能掩蔽我们的行动，而不会反过来帮助我们的敌人#!"
 building_ioutskirts_01:0 "统治者林区的通行"
 building_ioutskirts_01_desc:1 "狩猎区是统治者家庭的专属资产，请求通行权力让我们在其中巡行并找到入侵者"
 building_ioutskirts_02:0 "颁发偷猎者特赦"
 building_ioutskirts_02_desc:1 "森林是偷猎者的家园，在这里违法者并非出于自愿，而是被生存所迫。他们对于这片土地的熟悉值得我们赢得他们的忠诚。"
 building_ioutskirts_03:0 "确保狩猎权利"
 building_ioutskirts_03_desc:1 "通过贿赂，威胁和提供更高的地位，我们可以让森林脱离当地统治者的官方控制。"
 building_ioutskirts_04:0 "领主的树林"
 building_ioutskirts_04_desc:1 "没有哪个住在这片荒原里的猎人，药剂师，采莓人或隐士不是我们的密探。"
 building_type_itownsfolk_01:0 "镇民掌控"
 building_type_itownsfolk_01_desc:1 "#F 人群在这里聚集，金钱在这里流通，我们的功业需要这两方面的支持。#!"
 building_itownsfolk_01:0 "街区传教士"
 building_itownsfolk_01_desc:1 "在这里人们至少假装正派，宣扬拒绝罪恶，荒淫无道的行为差不多必定会被富有同理心的人发现。"
 building_itownsfolk_02:0 "大赦商人"
 building_itownsfolk_02_desc:1 "教廷的宽恕可不便宜。我们有办法让它打个折，商人们会对这一不错的交易心存感激。"
 building_itownsfolk_03:0 "收买行会领导层"
 building_itownsfolk_03_desc:1 "如果不能利用信仰，那就依靠人脉方面的承诺，手工艺者们的领头人可以成为有价值的密探。"
 building_itownsfolk_04:0 "神圣企业"
 building_itownsfolk_04_desc:1 "这座城镇的商人和手工艺者们自从我们到来后变得越来越虔诚。看上去这里已经没有可以让那些不虔诚的人做生意的地方。"
 building_type_iunderworld_01:0 "控制下层社会"
 building_type_iunderworld_01_desc:1 "#F 我们的敌人居住在阴影下的国度里。和那里的凡人住民合作虽然不合宜，但是很有必要。#!"
 building_iunderworld_01:0 "援助乞丐和孤儿"
 building_iunderworld_01_desc:1 "正经人会把目光从可怜人身上移开。这也是他们成为无价之宝的一部分原因。"
 building_iunderworld_02:0 "转化常见罪犯"
 building_iunderworld_02_desc:1 "社会已经对这些暴徒，窃贼和骗子关上了大门，但是我们依然有他们的用武之地。"
 building_iunderworld_03:0 "渗透犯罪集团"
 building_iunderworld_03_desc:1 "和犯罪团体的上层做交易一定会给我们带来危害，但是其中的收益或许值得我们这么做。"
 building_iunderworld_04:0 "赦罪"
 building_iunderworld_04_desc:1 "人生来有罪，让那些基于这一事实谋生的人失业不是我们的优先任务。只要他们为我们的功业作出贡献。"
 building_type_igarrison_01:0 "控制守军"
 building_type_igarrison_01_desc:1 "这片聚居地的士兵在戒备着他们领主的敌人。我们可以把他们的注意力转到那些更邪恶的敌人身上。#!"
 building_igarrison_01:0 "援助守夜人"
 building_igarrison_01_desc:1 "守夜人的工作无休无止，我们的密探提供的帮助将让他们大为感激。"
 building_igarrison_02:0 "收买守军长官"
 building_igarrison_02_desc:1 "优秀的士兵从来不质疑他们长官下达的命令。这使得后者成为了我们功业的基础。"
 building_igarrison_03:0 "夺取守军控制权"
 building_igarrison_03_desc:1 "我们会采用一切可行的手段确保这些守军的最高等级长官的服从。"
 building_igarrison_04:0 "虔信者要塞"
 building_igarrison_04_desc:1 "驻扎在这座城市的各级士兵服从于我们的代表，心中充满了对保护他们这一神圣使命的自豪。"
 building_type_inquisition_church_01:0 "裁判教堂"
 building_type_inquisition_church_01_desc:1 "#F 虔信者们需要一个免受吸血蚂蟥影响的聚集地，而我们的教友和修女，需要一个用来冥想的地方。#!"
 building_inquisition_church_01:0 "裁判礼拜堂"
 building_inquisition_church_01_desc:1 "一个由天主的骑士们保护的宁静的小地方。沙漠里的一处绿洲。"
 building_inquisition_church_02:0 "裁判教堂"
 building_inquisition_church_02_desc:1 "在这里，吸血鬼腐化的影响被拒之门外。"
 building_inquisition_church_03:0 "大裁判教堂"
 building_inquisition_church_03_desc:1 "黑暗世界中的一座灯塔。希望能有更多的后继者。"
 building_inquisition_church_04:0 "大总主裁判教座堂"
 building_inquisition_church_04_desc:1 "铭记我们的虔诚的丰碑，它高高地矗立在岛上，对于邪恶力量来说是一项十足的挑战。"
 building_type_inquisition_office_01:0 "裁判所办公处"
 building_type_inquisition_office_01_desc:1 "#F 一个让我们远离窥视用来进行管理的地方。#!"
 building_inquisition_office_01:0 "办公室"
 building_inquisition_office_01_desc:1 "一个隐藏良好的空间来存储和处理我们的文件。"
 building_inquisition_office_02:0 "偏远办公所"
 building_inquisition_office_02_desc:1 "一栋低调的住宅，于此我们可以在不引起他人注意的情况下协调我们的行动。"
 building_inquisition_office_03:0 "办公楼"
 building_inquisition_office_03_desc:1 "位于城镇最繁华地段的一栋显眼的办公楼，镇里最富有和最有影响力的居民都来此办公。"
 building_inquisition_office_04:0 "办公城区"
 building_inquisition_office_04_desc:1 "城里专门留给我们的兄弟和姐妹的区域。不会有人质疑我们对当地和区域内的事务的支配权。"
 building_type_inquisition_palace_01:0 "裁判所宫殿"
 building_type_inquisition_palace_01_desc:1 "#F 一个让我们的骑士聚集、训练和办宴的地方。#!"
 building_inquisition_palace_01:0 "猎人小屋"
 building_inquisition_palace_01_desc:1 "一处偏僻的地产，适合用来从事骑士们最喜爱的世俗娱乐活动。"
 building_inquisition_palace_02:0 "裁判所府邸"
 building_inquisition_palace_02_desc:1 "一栋招待规格符合最高标准的雅致居所。"
 building_inquisition_palace_03:0 "裁判所宫殿"
 building_inquisition_palace_03_desc:1 "一座壮观的宫殿，也是我们功业高尚性的证明。这片土地上很少有贵族会拒绝来这里的邀请。"
 building_inquisition_palace_04:0 "裁判所大宫殿"
 building_inquisition_palace_04_desc:1 "我们神圣的居所，即豪华又威严。适合招待国王，皇帝和圣父教宗。"
 building_type_inquisition_armory_01:0 "裁判所军械库"
 building_type_inquisition_armory_01_desc:1 "#F 我们在这片地区的城镇要维持大规模的军事存在需要有足够的基础设施。#!"
 building_inquisition_armory_01:0 "武器储藏处"
 building_inquisition_armory_01_desc:1 "我们的密探都不缺武器，但有些任务需要更重型的装备。这种时候，这些储藏处就派上了用场。"
 building_inquisition_armory_02:0 "裁判所军械库"
 building_inquisition_armory_02_desc:1 "这些装满武器和护甲的大厅确保了我们在黑暗抬头时有所准备。"
 building_inquisition_armory_03:0 "裁判所武器工坊"
 building_inquisition_armory_03_desc:1 "生产我们自己的装备是确保它能满足我们的任务所需的特殊要求的最好方式。"
 building_inquisition_armory_04:0 "裁判所军事学院"
 building_inquisition_armory_04_desc:1 "在这个巨大的军事设施综合体内，我们的骑士可以将平民打造成对抗邪恶的强大武器。"
 building_type_inquisition_keep_01:0 "裁判所城堡"
 building_type_inquisition_keep_01_desc:1 "#F 一个可以保护包括我们自己，我们的囚犯和我们的秘密在内的一切东西的地方。#!"
 building_inquisition_keep_01:0 "裁判所塔楼"
 building_inquisition_keep_01_desc:1 "我们授予这片土地的第一个物理形式上的保护。"
 building_inquisition_keep_02:0 "裁判所主楼"
 building_inquisition_keep_02_desc:1 "只有我们的密探能够神不知鬼不觉地进来，而唯有尖叫才能以这种方式离开。"
 building_inquisition_keep_03:0 "裁判所城堡"
 building_inquisition_keep_03_desc:1 "一座对抗我们邪恶敌人的强大要塞。我们的所有谋划和诡计就如同流淌于动脉中的血液一样于此萌芽。"
 building_inquisition_keep_04:0 "裁判所堡垒"
 building_inquisition_keep_04_desc:1 "一座由石头和锋锐的钢铁组成的山脉，和我们的信仰一样无懈可击。没有任何理智的夜间生物会疯到直接对它发起进攻。"
 building_type_inquisition_contact_01:0 "联系修士会同僚"
 building_type_inquisition_contact_01_desc:1 "#F 尽管我们人数很少且任务必须保持隐秘，但是我们在斗争中并不孤单。#!"
 building_inquisition_contact_01:0 "秘密情报交换点"
 building_inquisition_contact_01_desc:1 "一个指定的用来交换加密信息和与我们的教友分享技艺的绝密地点。"
 building_inquisition_contact_02:0 "会面地点"
 building_inquisition_contact_02_desc:1 "一个足够隐秘的，用来让我们教团的密探面对面和同伴交谈的地方。"
 building_inquisition_contact_03:0 "周度会议"
 building_inquisition_contact_03_desc:1 "一个由对抗邪恶力量的专家们召开的定期会议，常常在我们的地产内秘密举行。"
 building_type_inquisition_acre_01:0 "亚柯骑士训练场"
 building_type_inquisition_acre_01_desc:1 "#F 在这里我们的兄弟能精进他们用于击败魔鬼仆从的神圣技艺。#!"
 building_inquisition_acre_01:0 "陪练场"
 building_inquisition_acre_01_desc:1 "一块配备了大量战斗训练房间的封闭草坪。"
 building_inquisition_acre_02:0 "训练营地"
 building_inquisition_acre_02_desc:1 "一座基础设施完善的森林训练营地，哪怕是最菜鸟的新兵也能从此地的专家的指导中受益。"
 building_inquisition_acre_03:0 "比武大赛"
 building_inquisition_acre_03_desc:1 "一场由我们赞助的比武大赛，吸引了这片土地上最棒的骑士们。淡季时场地还能提供有用的训练设施。"
 building_type_inquisition_james_01:0 "圣雅各伯骑士团住宿所"
 building_type_inquisition_james_01_desc:1 "#F 给朝圣者提供安全和招待是我们的主要目的，同时也能保持我们的特色。#!"
 building_inquisition_james_01:0 "朝圣招待所"
 building_inquisition_james_01_desc:1 "一家条件一般的招待所，但是对一位疲惫的朝圣者，或者一位处于危急关头且精疲力竭的天主士兵来说是一个不错的地方。"
 building_inquisition_james_02:0 "朝圣旅店"
 building_inquisition_james_02_desc:1 "一间氛围热烈，空间宽敞，温暖舒适且有着足够的配套设施用于满足旅客任何需求的旅店。"
 building_inquisition_james_03:0 "朝圣住宿大院"
 building_inquisition_james_03_desc:1 "一座人来人往的建筑综合体，作为多功能后勤枢纽为那些被信仰吸引而来的人提供服务。"
 building_type_inquisition_john_01:0 "圣约翰慈善修女会"
 building_type_inquisition_john_01_desc:1 "#F 我们为那些穷苦之人，病痛之人，以及苦难之人服务且不期待任何尘世间的嘉奖，然而我们的努力付出却换来了惊人的回报。#!"
 building_inquisition_john_01:0 "救济粥棚"
 building_inquisition_john_01_desc:1 "一项为有需要的人提供食物的倡议，简陋但非常有价值。"
 building_inquisition_john_02:0 "移动医院"
 building_inquisition_john_02_desc:1 "一支由手推车和货车组成的大篷车队，装满了在偏远地区用于医疗护理的物品。"
 building_inquisition_john_03:0 "庇护所"
 building_inquisition_john_03_desc:1 "一个为国度里的不幸之人准备的安全和宽敞的地方。是天主的神圣恩典在尘世间的小小显现。"
 building_type_inquisition_red_01:0 "红修会图书馆"
 building_type_inquisition_red_01_desc:1 "#F 一个收藏着众多对我们的神圣功业有帮助的书籍的地方，在这里你可以找到天主，人类和那些最渎神罪恶的家伙的言论。#!"
 building_inquisition_red_01:0 "地下墓窟的图书馆"
 building_inquisition_red_01_desc:1 "一座除了摆放修士们的遗体外，还收藏着我们最珍贵的著作的地窖。"
 building_inquisition_red_02:0 "修道院图书馆"
 building_inquisition_red_02_desc:1 "当地修道院贡献出了一部分房间用来进行我们的秘密研究。对门外汉来说根本找不到进去的路。"
 building_inquisition_red_03:0 "禁忌图书馆"
 building_inquisition_red_03_desc:1 "一片堆满了手稿和魔法书的城市区域，这里的书若不受到严格管制，会对外界带来极大的危险。"
 building_type_inquisition_murnau_01:0 "冯·穆尔瑙家族宅第"
 building_type_inquisition_murnau_01_desc:1 "#F 那些将一生投入神圣功业的冯·穆尔瑙们对尘世间的舒适并不在意，然而树立他们表面上的贵族形象在这种斗争中十分重要。#!"
 building_inquisition_murnau_01:0 "冯·穆尔瑙住房"
 building_inquisition_murnau_01_desc:1 "一间不怎么和冯·穆尔瑙的名字相称的市区住宅，但是作为传播我们影响力的哨点起着很大作用。"
 building_inquisition_murnau_02:0 "冯·穆尔瑙豪宅"
 building_inquisition_murnau_02_desc:1 "一栋家族成员居住的奢华住所，很适合用来招待当地重要的客人。"
 building_inquisition_murnau_03:0 "冯·穆尔瑙市内宫殿"
 building_inquisition_murnau_03_desc:1 "一座宏伟的建筑杰作，处处彰显着家族的显赫。"
 building_type_inquisition_oculi_01:0 "神目猎群"
 building_type_inquisition_oculi_01_desc:1 "#F 眼目总能确保无人听到窃语私议。我们在隐蔽的地方策划的行动确保了这一点。#!"
 building_inquisition_oculi_01:0 "安全屋"
 building_inquisition_oculi_01_desc:1 "一排完全相同的房间，看起来没有什么特别之处。"
 building_inquisition_oculi_02:0 "迷宫"
 building_inquisition_oculi_02_desc:1 "宽敞的地下密室枢纽，每个入口都在我们的控制之下。"
 building_inquisition_oculi_03:0 "隧道网络"
 building_inquisition_oculi_03_desc:1 "一个由相互连接的地下室、地下城、下水道和地下洞穴组成的错综复杂的网络。可以用来跨越很远的距离而不被发现。"
 building_type_elysium_01:0 "秘盟欢会​"
 building_type_elysium_01_desc:1 "#F 血族社交生活的焦点，亲王在此掌控宫廷。一个不限暴力但没有恶斗的地方。#!"
 building_elysium_01:0 "特设欢会​"
 building_elysium_01_desc:1 "一个为了安全和方便而选择的地方，并不出名。不会给任何大人物留下深刻印象，但顾客们还是很欣赏它。"
 building_elysium_02:0 "互敬欢会​"
 building_elysium_02_desc:1 "一个能让血族的文化蓬勃发展的专属建筑。建筑四周的外墙能鼓励来访者遵守该有礼节。"
 building_elysium_03:0 "杰赫欢会​"
 building_elysium_03_desc:1 "秘盟社交关系网络的中心场所。管理着这个精美建筑的亲王享受着世界范围的赞誉。"
 building_type_haven_01:0 "魔宴密所"
 building_type_haven_01_desc:1 "#F 对于那些魔宴的前武装群体来说，这个地方既是家园，也是武装哨所。#!"
 building_haven_01:0 "群体密所"
 building_haven_01_desc:1 "虽然这个地方足够安全，可以举行公共仪式和发动武装行动，但它可以有更多的庄严装饰和基础设施。"
 building_haven_02:0 "公共密所"
 building_haven_02_desc:1 "这个庄严的寺庙、军营和休息室的混合体成为了千年圣战体系结构中的构建部分。"
 building_haven_03:0 "黑手支柱"
 building_haven_03_desc:1 "这是魔宴最可怕的战士们的罕见永久密所。其等可怖的存在，只在对党派利益至关重要的地方才准驻留。"
 building_type_inquisition_george_01:0 "圣乔治社团的战马牧场"
 building_type_inquisition_george_01_desc:1 "#F 有些修士会以啤酒而闻名，有些则以草药而闻名，圣乔治教友饲养的马匹对他们的金主来说很值。#!"
 building_inquisition_george_01:0 "战马牧场"
 building_inquisition_george_01_desc:1 "最适合给最好的英格兰马儿吃草的草地。"
 building_inquisition_george_02:0 "战马马厩"
 building_inquisition_george_02_desc:1 "一个相当大的牧场，有足够的设施和工作人员来保持马匹的健康和纵容。"
 building_inquisition_george_03:0 "战马拍卖行"
 building_inquisition_george_03_desc:1 "远道而来的旅行者来到这里见证你那声名远扬的骏马，并对它们下标。"
 building_chantry_02:0 "大型歌祷堂"
 building_chantry_02_desc:1 "众多的[cainites|E]和一个小型术士密教待在这里，都血缚于你的意志。这很完美。"
 building_chantry_03:0 "巨型歌祷堂"
 building_chantry_03_desc:1 "睿魔尔的长者们赞扬你的秘所，因为你坐在你自己的小金字塔的顶端，是氏族和家族的荣耀。"
 building_laboratory_02:0 "大型血肉塑造实验室"
 building_laboratory_02_desc:1 "一个储备充足的血肉塑造实验室是任何蜕变者都羡慕的对象。"
 building_laboratory_03:0 "巨型血肉塑造实验室"
 building_laboratory_03_desc:1 "在一件艺术作品中，总能瞥见艺术家的身影。有时，也可能是制作者的“朋友”。"
 building_type_lordly_manor_01:0 "领主府邸"
 building_type_lordly_manor_01_desc:1 "#F 这是一个适合地主居住的令人印象深刻的庄园。#!"
 building_lordly_manor_01:0 "体面府邸"
 building_type_lordly_manor_02_desc:1 "#F 这是一个适合地主居住的令人印象深刻的庄园。#!"
 building_lordly_manor_02:0 "大型府邸"
 building_lordly_manor_02_desc:1 "一个受人敬仰的房屋，你的阴谋诡计和目标都是在这里完成的，不受窥视和耳目的影响。"
 building_lordly_manor_03:0 "巨型府邸"
 building_lordly_manor_03_desc:1 "刀光剑影的宫殿，在这里，你就像蜘蛛一样坐在一张巨大的网中心。"
 building_influence_people_02:0 "重度人群掌控"
 building_influence_people_02_desc:1 "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才能不变成怪物。"
 building_influence_people_03:0 "完全人群掌控"
 building_influence_people_03_desc:1 "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才算人类。"
 building_crypt_02:0 "大型墓穴"
 building_crypt_02_desc:1 "独自在黑暗中，周围有相当数量的尸体和骷髅。现在你有了点头绪。"
 building_crypt_03:0 "巨型地下墓穴"
 building_crypt_03_desc:1 "独自在黑暗中，被尸体和腐烂的可憎之物包围。定义乐园的地方。"
 building_type_family_estates_01:0 "家庭地产"
 building_type_family_estates_01_desc:1 "#F 无论你是凭自己的智慧和勇气赢得的，还是别人给你的，拥有一个真正的家和可耕种的土地是一种特权，即使是你的创造者也很少能享受到。#!"
 building_family_estates_01:0 "家庭宅地"
 building_family_estates_01_desc:1 "对于这个简陋的庄园来说，生活舒适度并不是最需要改进的，但是土地很肥沃，你会得到丰厚的回报。"
 building_family_estates_02:0 "家庭地产"
 building_family_estates_02_desc:1 "广大又多产的地产让你觉得自己是一个有地位的人，即使不在贵族同行中也至少是在你拥有的农奴中。"
 building_family_estates_03:0 "家庭大庄园"
 building_family_estates_03_desc:1 "这片广阔的土地不仅提供足够的粮食养活军队，它还拥有值得大贵族居住的地方。"
 building_type_family_enterprise_01:0 "家庭企业"
 building_type_family_enterprise_01_desc:1 "#F 一个成功的企业家会根据最新的时尚来迎合客户的奇思妙想。血族对此毫不关心，所以他们把任务交给了你们。#!"
 building_family_enterprise_01:0 "家庭店铺"
 building_family_enterprise_01_desc:1 "你独特的联系为你提供了可以在凡人中获得优惠价格的商品供应。只要把血迹清理干净就行。"
 building_family_enterprise_02:0 "家庭市场"
 building_family_enterprise_02_desc:1 "他们想要，你就卖。不管是一把已故贵族的华丽的剑还是一袋芜菁，利润各不相同，但资金源源不断地流入。"
 building_family_enterprise_03:0 "家庭进口公司"
 building_family_enterprise_03_desc:1 "从该地区不知名的食物，到异国的家具与武器和古代文物，所有这些商品都通过你的贸易网络带到这里，其网延伸自与永生者之间的连接。"
 building_type_family_connections_01:0 "家庭人脉"
 building_type_family_connections_01_desc:1 "#F 与贵族混在一起就意味着参与了一场挥霍无度的军备竞赛。但有一件事你可以肯定，那就是认识对的人很重要。#!"
 building_family_connections_01:0 "依靠小贵族"
 building_family_connections_01_desc:1 "那些以你为代价吃喝的人很少比男爵的二表哥更重要，但你必须开始在某个地方让自己出名和受人尊敬。"
 building_family_connections_02:0 "依靠贵族"
 building_family_connections_02_desc:1 "你热情好客的消息已经传开了，现在来拜访你的人都是有能力回报你的人。迟早你会和统治精英们结识的。"
 building_family_connections_03:0 "依靠大贵族"
 building_family_connections_03_desc:1 "你努力使自己成为一个有财富和影响力的人，你成功了。国家里最有权力的人会找你，让你选择获得前者或后者。"
 building_type_family_rights_01:0 "家庭权利"
 building_type_family_rights_01_desc:1 "#F 你把自己描绘成一个辉煌却被遗忘的家族的继承人。这是不是真的并不重要，重要的是谁承认这一点。#!"
 building_family_rights_01:0 "领地所有权权利"
 building_family_rights_01_desc:1 "仅仅确保拥有土地的权利不会让你变得有影响力，但如果你不必埋葬每个到小屋后面敲门的人时，你的生意就会更容易开展。"
 building_family_rights_02:0 "骑主头衔"
 building_family_rights_02_desc:1 "当地统治者在他的骑兵旗帜上指定你为战士并授予你相应的特权。他还没发现你不侍奉凡人领主。"
 building_family_rights_03:0 "堡主头衔"
 building_family_rights_03_desc:1 "国家的统治者现在认为你的财产是其防御基础设施的重要组成部分。这种认可会带来好处。"
 building_family_rights_04:0 "巨头地位"
 building_family_rights_04_desc:1 "你的贵族血统的细节，以及如何演绎你在贵族中的地位，相比于你明面上的财富和权力，完全是次要的。不管你是不是大贵族，你都是不容小觑的人。"
 building_type_gpeasants_01:0 "煽动农民"
 building_type_gpeasants_01_desc:1 "长期以来，为贵族提供食物的人受到剥削和虐待。现在是赋予他们广大群众权力的时候了。"
 building_gpeasants_01:0 "煽动不幸者"
 building_gpeasants_01_desc:1 "由于不拥有自己耕种的土地，那些收成特别糟糕的农民已经没有什么可失去的了。给点希望，他们就会跟着我们走。"
 building_gpeasants_02:0 "煽动过劳者"
 building_gpeasants_02_desc:1 "在把大部分收成交给领主之后，很少有农民能从他们工作的土地上获得比可怜的生活更多的保障。现在是时候让他们相信，天主并不打算让他们过这种生活。"
 building_gpeasants_03:0 "煽动虔信者"
 building_gpeasants_03_desc:1 "每一个农民都本能地懂得，那些工作最辛苦的人应该最先享受劳动的果实。信仰能给他们勇气让世界以这种方式运转。"
 building_type_gcraftsmen_01:0 "煽动工人"
 building_type_gcraftsmen_01_desc:1 "城镇劳动者虽然比农村劳动者享有更高的地位，但在腐朽信仰的推动下，他们仍然受到剥削。现在是向他们介绍另一种选择的时候了。"
 building_gcraftsmen_01:0 "煽动学徒"
 building_gcraftsmen_01_desc:1 "学徒们忍受的苦难远比他们的教育所要求的要严重得多。我们可以利用他们的挫折感，将其转化为正义的愤怒。"
 building_gcraftsmen_02:0 "煽动熟练工"
 building_gcraftsmen_02_desc:1 "这些熟练工花了他们一生中最有生产力的部分，为丰富他们的主人而劳动。这不是神的旨意，而匠人想听到这旨意。"
 building_gcraftsmen_03:0 "煽动工匠大师"
 building_gcraftsmen_03_desc:1 "工匠大师在行会中居于最高地位，但即使如此，他们也要服从于他们高贵的领主。一个人的高贵之处在于他对他的兄弟的有用之处，甚至大师们也能认同这个概念。"
 building_type_gfootmen_01:0 "煽动步兵"
 building_type_gfootmen_01_desc:1 "没有得到应有报酬的士兵是什么？一个等待目标的叛逆者。而我们有正当的目标。"
 building_gfootmen_01:0 "煽动无饷者"
 building_gfootmen_01_desc:1 "没有得到应有报酬的士兵是什么？一个等待目标的叛逆者。而我们有正当的目标。"
 building_gfootmen_02:0 "煽动遭虐者"
 building_gfootmen_02_desc:1 "如果生活能提供更好的选择，还会有人会忍受疲惫、饥饿和寒冷，冒着疾病和暴死的危险，只为让自己的领主拥有更多的土地和头衔吗？我们可以为这些武装分子提供一条通往天主的道路。"
 building_gfootmen_03:0 "煽动有志者"
 building_gfootmen_03_desc:1 "如果高级领导职位早已预留给贵族，士兵的勇敢、能力、忠诚和主动性又有什么意义呢？我们神圣的功业为那些努力争取更多机会来证明自己价值的人提供了机会。"
 building_type_heretic_hall_01:0 "人民之殿"
 building_type_heretic_hall_01_desc:1 "#F 我们欢迎所有信神的孩子到我们的住所来滋养他们的身体和灵魂。#!"
 building_heretic_hall_01:0 "人民集会"
 building_heretic_hall_01_desc:1 "天主是无所不在的，聚集在祂圣殿的唯一需求的就是指定一个地点。不过买几把椅子就更好了。"
 building_heretic_hall_02:0 "人民之家"
 building_heretic_hall_02_desc:1 "信徒们渴望精神食粮，而我们的布道鼓舞人心，能让其在忍受落雨，但有个屋顶并不会伤害他们。"
 building_heretic_hall_03:0 "人民之殿"
 building_heretic_hall_03_desc:1 "一个足够宽敞的建筑，可以举行弥撒、公共聚餐、集会和对我们神圣功业的敌人的审判。"
 building_heretic_hall_04:0 "人民之宫"
 building_heretic_hall_04_desc:1 "这是我们集群团结的证明。每一个忠诚的灵魂的家园都因共同的劳动而辉煌。"
 building_type_inquisition_forsaken_01:0 "弃民的游击队"
 building_type_inquisition_forsaken_01_desc:1 "#F 所有现存的，无论是凡人的还是[cainite|E]的势力，都反对我们的神圣功业，为此工具必须暗中发挥作用。#!"
 building_inquisition_forsaken_01:0 "难民营"
 building_inquisition_forsaken_01_desc:1 "森林虽然荒凉，却为摆脱主人束缚的人提供了一个安全的避风港。"
 building_inquisition_forsaken_02:0 "游击队聚居地"
 building_inquisition_forsaken_02_desc:1 "一个隐藏在荒野深处的庞大军事设施。我们教友中希望与敌人作战的人都来这里训练。"
 building_inquisition_forsaken_03:0 "无形要塞"
 building_inquisition_forsaken_03_desc:1 "由狭窄的森林小径、树梢平台、桥梁和隧道组成的迷宫，陷阱和哨位随处可见。它既可怕又隐蔽。"
 building_temple_set_02:0 "赛特神殿"
 building_temple_set_02_desc:1 "对赛特的信仰在这片土地上恢复了某种能力，腐化从内部流露出来。"
 building_temple_set_03:0 "赛特神殿"
 building_temple_set_03_desc:1 "赞美赛特之名！这座神殿为他的黑暗之名带来了荣耀，而你所拥有的凡人和[cainite|E]侍从为他带来了无尽的荣耀！"
 building_devasthana_02:0 "大型印度庙"
 building_devasthana_02_desc:1 "在这些大厅里，你会寻得更大的力量来保护提婆的土地不受阿修罗提伽耶的影响。"
 building_devasthana_03:0 "宏大的印度庙"
 building_devasthana_03_desc:1 "提婆的大厅与许多最伟大的凡人建筑一样，是你的奉献和战胜阿修罗提伽耶的纪念碑。"
 building_brahmavihara_02:0 "大型等舍"
 building_brahmavihara_02_desc:1 "在这里，沉思和专注是充足的，使你感到更接近于平静。这很美妙。"
 building_brahmavihara_03:0 "宏大的等舍"
 building_brahmavihara_03_desc:1 "在这个神圣的地方，你又找到了平静。这应是足够的。这算是足够的。"
 building_type_pillars_of_the_ashirra_01:0 "阿什拉派支柱"
 building_type_pillars_of_the_ashirra_01_desc:1 "#F [ashirra|E]渴望成为一个统一的社区，但在现实中却只是由共同的信仰联系在一起的多样[cainite|E]飞地。#!"
 building_pillars_of_the_ashirra_01:0 "第二初拥"
 building_pillars_of_the_ashirra_01_desc:1 "[ashirra|E]的信仰基于两个原则：任何接受伊斯兰教并尊重其法律的人都有可能获得救赎，具有永生不意味着将[cainite|E]教徒排除在真主的审判外。"
 building_pillars_of_the_ashirra_02:0 "塔里克·贝都因"
 building_pillars_of_the_ashirra_02_desc:1 "穆斯林[cainite|E]会追随塔里克·贝都因，因为他们相信宫殿和城市的懒散和诱人的奢华会削弱个人的自律和道德勇气。"
 building_pillars_of_the_ashirra_03:0 "塔里克·乌玛"
 building_pillars_of_the_ashirra_03_desc:1 "塔里克·乌玛的追随者善于通过善良和同情的行为来重申他们的基本本性。他们常常寻求不留名的保护和帮助他们的凡人邻居，为不公正伸张正义，或见证有罪的人受到惩罚。"
 building_unending_party_02:0 "十年派对"
 building_unending_party_02_desc:1 "过量和贪食，欲望和骄傲在这些大厅里像血一样流动。这很美。"
 building_unending_party_03:0 "世纪派对"
 building_unending_party_03_desc:1 "如此美妙的地方，如此美妙的脸。你的客人可以随时退房，但他们永远无法离开。"
 building_mother_garden_02:0 "母亲的庭园"
 building_mother_garden_02_desc:1 "作为“母亲”，莉莉丝诱使我们粉碎自满的枷锁，带来新的真理。"
 building_mother_garden_03:0 "老妪的庭院"
 building_mother_garden_03_desc:1 "作为“老妪”，莉莉丝诱使我们接受死亡的不可避免性，而在这里，我们就是这不可避免性。"
 building_influence_clergy_02:0 "显著圣职掌控"
 building_influence_clergy_02_desc:1 "大量给当地宗教当局的“捐赠”确保你在社区享有良好的声誉。"
 building_influence_clergy_03:0 "重度圣职掌控"
 building_influence_clergy_03_desc:1 "你从圣人那里学得很多，从恶人那里学得更多。你只需要偶尔弄清楚其中的区别就行了。"
 building_assassins_cell_02:0 "大型刺客之室"
 building_assassins_cell_02_desc:1 "哈基姆派在这个地区的大量活动，让你有一些非常有用的后备用于你更多的……秘密目的。"
 building_assassins_cell_03:0 "宏大的刺客之室"
 building_assassins_cell_03_desc:1 "哈基姆派在这个地区的大量活动，保证了你有非常有用的后备力量来实现你更多的……不正当的目标。但只是看看你在这里所拥有的资源，你就知道你会成功。"
 building_type_influence_nightwatch_01:0 "掌控守夜人"
 building_type_influence_nightwatch_01_desc:1 "#F 当地驻军可能是一个受欢迎的资产，能帮助训练你的个人随从，以及，喂养。不过你得动用一些关系才能办到。#!"
 building_influence_nightwatch_01:0 "轻度守夜人掌控"
 building_influence_nightwatch_01_desc:1 "在大多数官员的眼皮底下，通过贿赂其他人，你的私人保镖已经开始与当地民兵组织合作了。"
 building_influence_nightwatch_02:0 "显著守夜人掌控"
 building_influence_nightwatch_02_desc:1 "你的手下现在是一个有价值的“佣兵团”，在当地人的帮助下保护城市。一个双赢的局面。至少对你来说是这样。"
 building_influence_nightwatch_03:0 "重度守夜人掌控"
 building_influence_nightwatch_03_desc:1 "你再也分不清手下和本地人了。他们都以这样或那样的方式为你服务。"
 building_type_influence_mercenaries_01:0 "掌控佣兵"
 building_type_influence_mercenaries_01_desc:1 "#F 凡人发展出了“雇佣兵”的概念，可雇佣的有经验的士兵。这当然是你可以用来为自己谋利益的东西。#!"
 building_influence_mercenaries_01:0 "轻度佣兵掌控"
 building_influence_mercenaries_01_desc:1 "你在一个本地团队中有一些人际关系。足够给你一些选择。"
 building_influence_mercenaries_02:0 "显著佣兵掌控"
 building_influence_mercenaries_02_desc:1 "你可以依靠一群经验丰富的凡人士兵来捍卫你在这地区的利益。"
 building_influence_mercenaries_03:0 "重度佣兵掌控"
 building_influence_mercenaries_03_desc:1 "这里的雇佣兵现在是你的私人防卫部队。"
 building_type_influence_outriders_01:0 "掌控郊区人"
 building_type_influence_outriders_01_desc:1 "#F 护林人、侦察兵、看守和信使在这伯爵领的郊区游荡，他们都能成为有价值的资产，但要付出一定的代价。#!"
 building_influence_outriders_01:0 "轻度郊区人掌控"
 building_influence_outriders_01_desc:1 "只要在正确的口袋里装上一些钱，就有少数忠诚的郊区人将通报你了解你的领地边界上的事件。"
 building_influence_outriders_02:0 "显著郊区人掌控"
 building_influence_outriders_02_desc:1 "数十名郊区人臣服于你的统治之下，他们首先向你报告这片土地上发生的事情，然后才向他们的领主报告。"
 building_influence_outriders_03:0 "重度郊区人掌控"
 building_influence_outriders_03_desc:1 "领地内近乎全部看守和巡林人在与任何人之前向你报告，只以非常少的工资。"
 building_fallen_church_02:0 "堕者神殿"
 building_fallen_church_02_desc:1 "反对恐怖造物的呼声在这里听到更多。这开始变得响亮了。"
 building_fallen_church_03:0 "堕者大教堂"
 building_fallen_church_03_desc:1 "在这座宏伟的大教堂内，救赎与希望的低语现在都浸透了这些墙壁，因此它们现在变得极度神圣。"
 building_lordly_manor_01_desc:1 "在那里，某人做出决议，策划谋略，执行审判。希望那人是你。"
 building_type_inquisition_cell_01:0 "裁判室"
 building_type_inquisition_cell_01_desc:1 "#F 在这里，征服非人类邪恶势力的人们聚集在一起，协调行动，相互指导，存放捐款，并守护着这片土地。#!"
 building_inquisition_cell_01:0 "初建的裁判室"
 building_inquisition_cell_01_desc:1 "不要期待防御用门之外的家具，最多一个包含必要资源的箱子和最基本的设施，放于一个新建立的猎人猎群。尽管如此，它仍是希望的芽种。"
 building_inquisition_cell_02:0 "站稳的裁判猎群"
 building_inquisition_cell_02_desc:1 "为那些与黑暗作战的人提供一个安全的藏身处和运作基地。一个休息，疗伤，完善技艺的地方。"
 building_inquisition_cell_03:0 "裁判所枢纽"
 building_inquisition_cell_03_desc:1 "这个熙熙攘攘的大厅不仅仅是一个哨所，这里是计划和调整针对地狱仆从的特大行动的地方。"
 building_influence_noble_04:0 "完全贵族掌控"
 building_influence_noble_04_desc:1 "大家都知道，谁才是这里真正的规则制定者。"
 building_influence_nightwatch_04:0 "完全守夜人掌控"
 building_influence_nightwatch_04_desc:1 "守夜人？他们直接向我的人报告。"
 building_influence_underworld_04:0 "完全下层社会掌控"
 building_influence_underworld_04_desc:1 "犯罪头目蜂拥而至，亲吻你的戒指。"
 building_influence_merchant_04:0 "完全商人掌控"
 building_influence_merchant_04_desc:1 "钱必须流出来！进入你的口袋。"
 building_rabble_thugs_04:0 "征召罪犯"
 building_rabble_thugs_04_desc:1 "没人会想念他们，你也不会。"
 building_influence_law_04:0 "完全立法者掌控"
 building_influence_law_04_desc:1 "法律很没意思。为啥不自己制订呢？"
 building_haven_defenses_04:0 "完美藏身处防御"
 building_haven_defenses_04_desc:1 "这些讨厌的冒险者将永远无法在你的地牢中存活！"
 building_remote_haven_04:0 "奢靡的偏远藏身处"
 building_remote_haven_04_desc:1 "古罗马元老院会为这些墙后发生的事感到害羞。"
 building_influence_mercenaries_04:0 "完全佣兵掌控"
 building_influence_mercenaries_04_desc:1 "这时候你还能叫他们雇佣兵吗？很难说。"
 building_influence_barracks_04:0 "完全兵营掌控"
 building_influence_barracks_04_desc:1 "你现在可以用活人来玩战棋了！"
 building_influence_burghers_04:0 "完全市民掌控"
 building_influence_burghers_04_desc:1 "你喜欢他们和他们的钱，但你还不完全热衷于他们的时尚选择。"
 building_type_family_worship_01:0 "家庭信仰"
 building_type_family_worship_01_desc:1 "#F 每个家庭都有自己的传统，很少有比他们信仰的方式更重要的。#!"
 building_family_worship_01:0 "家庭神龛"
 building_family_worship_01_desc:1 "一个谦逊，但有尊严的地方，指定来崇拜人类的神，或将你引导向你的永生的力量。"
 building_family_worship_02:0 "家庭礼拜堂"
 building_family_worship_02_desc:1 "一个宽敞的房间或一个独立的建筑，这个礼拜的地方可以方便共同祈祷，即使是最人数众多的[Clans|E]。"
 building_family_worship_03:0 "私密神殿"
 building_family_worship_03_desc:1 "无论是伪装成难以接近的教堂，还是工业规模的酒窖，这个设施都是你家庭奉献的见证。"
 building_type_family_muscle_01:0 "家庭打手"
 building_type_family_muscle_01_desc:1 "#F 生活在凡人世界和黑夜领主领地之间的门槛是危险和困难的，得有暴力类型的帮凶帮助#!"
 building_family_muscle_01:0 "当地暴徒"
 building_family_muscle_01_desc:1 "把邻居暴徒和麻烦制造者放在你的牌库里并不会为大征服铺平道路，但在小争端中却非常有用。"
 building_family_muscle_02:0 "家族守卫"
 building_family_muscle_02_desc:1 "这些人值得信赖，装备精良，保卫着你们家所珍视的东西。"
 building_family_muscle_03:0 "家庭旗队"
 building_family_muscle_03_desc:1 "他们拥有一位战士所能梦寐以求的训练和装备，能够组成那个时代最具毁灭性的军伍——重骑兵旗队。"
 building_influence_outriders_04:0 "完全郊区人掌控"
 building_influence_outriders_04_desc:1 "即使是可怖的狼人也会嫉妒你对荒野的了解。"
 building_type_northern_throne_01:0 "北境王座"
 building_type_northern_throne_01_desc:1 "#F 这是[GetTrait('tzimisce').GetName(GetNullCharacter)]权威向喀尔巴阡以外扩散的象征#!"
 building_northern_throne_01:0 "北境王座"
 building_northern_throne_01_desc:1 "这个区域性大都市完全受其[GetTrait('tzimisce').GetName(GetNullCharacter)]霸权的独家控制。铁律代表了魔物们通过要得[Clan|E]尊重来取得霸权地位的新标准。"
 building_type_den_of_screams_01:0 "尖嚎之窝巢"
 building_type_den_of_screams_01_desc:1 "#F 在这个悲惨的地方，痛苦和恐惧的哭喊与虐待狂的狂喜的嚎叫混合成一种不洁的嘈杂声。#!"
 building_den_of_screams_01:0 "尖嚎之窝巢"
 building_den_of_screams_01_desc:1 "在这里，折磨和屠杀是在近乎虔诚的勤奋中进行的。"
 building_den_of_screams_02:0 "恐怖之窝巢"
 building_den_of_screams_02_desc:1 "在这里举行的即残忍又有开创性的可怕仪式重新定义了痛苦一词的概念。"
 building_den_of_screams_03:0 "疯狂之窝巢"
 building_den_of_screams_03_desc:1 "仅仅是试图描述这里发生的邪恶行为，就会对交换情报的双方的精神造成不可弥补的损害。"
 building_type_summoning_chamber_01:0 "召唤之间"
 building_type_summoning_chamber_01_desc:1 "#F 从堕者那里得到恩惠既不容易，也不便宜，需要有充分的准备以在一些安全的地方征求他们。#!"
 building_summoning_chamber_01:0 "召唤之间"
 building_summoning_chamber_01_desc:1 "一个适合尝试私下接触堕落灵类的地方。"
 building_summoning_chamber_02:0 "召唤之厅"
 building_summoning_chamber_02_desc:1 "这里着举行不洁的仪式，以确保与灵类国度的黑暗居民达成交易。"
 building_summoning_chamber_03:0 "召唤之场"
 building_summoning_chamber_03_desc:1 "这是域外世界的最黑暗的国度们的隐秘大使馆。"
 building_influence_clergy_04:0 "完全圣职掌控"
 building_influence_clergy_04_desc:1 "比起其神更加服从于你的人真的比其他走狗更重要么？如果是这样，这就还不是最糟糕的麻烦。"
 building_type_eternal_parish_01:0 "永恒牧区"
 building_type_eternal_parish_01_desc:1 "#F 在这里，那些认为血族是天主之子的信仰得到了背书。#!"
 building_eternal_parish_01:0 "永恒牧区"
 building_eternal_parish_01_desc:1 "在这里，布道是为所有天主之子所讲的。"
 building_eternal_parish_02:0 "永恒教区"
 building_eternal_parish_02_desc:1 "在这里，所有天主之子在教会法面前都是平等的。"
 building_eternal_parish_03:0 "永恒教省"
 building_eternal_parish_03_desc:1 "在这里，信仰的教义被写在天主之子的心中。"
 building_type_founding_temple_01:0 "根基神殿"
 building_type_founding_temple_01_desc:0 "每一赛特密教都起源于一座根基神殿。其中最具影响力和最受尊敬的由圣显者直接管辖。"
 building_founding_temple_01:0 "根基神殿"
 building_founding_temple_01_desc:0 "每一赛特密教都起源于一座根基神殿。其中最具影响力和最受尊敬的由圣显者直接管辖。"
 building_type_sanctuary_of_flesh_01:0 "血肉圣所"
 building_type_sanctuary_of_flesh_01_desc:0 "这是[GetTrait('tzimisce').GetName(GetNullCharacter)][Clan|E]世代以来所掌握的血肉塑造力量的一个可怕的例子"
 building_sanctuary_of_flesh_01:0 "血肉圣所"
 building_sanctuary_of_flesh_01_desc:0 "这是[GetTrait('tzimisce').GetName(GetNullCharacter)][Clan|E]世代以来所掌握的血肉塑造力量的一个可怕的例子"
 building_type_ashen_court_01:0 "贵族家庭家臣"
 building_type_ashen_court_01_desc:1 "#F 你的影响直达当地贵族的城堡。#!"
 building_ashen_court_01:0 "受控个体"
 building_ashen_court_01_desc:1 "由于你对当地贵族的影响，你现在控制了一些乐意为你服务的人。"
 building_ashen_court_02:0 "受控家庭"
 building_ashen_court_02_desc:1 "你的影响达到更深处，现在你控制了这个地区的一些贵族家庭。"
 building_ashen_court_03:0 "受控宗族"
 building_ashen_court_03_desc:1 "你对当地贵族的控制如此之强，以至于你现在控制了这个地区的数个宗族。"
 building_type_ashen_commandery_01:0 "灰之骑士分团会堂"
 building_type_ashen_commandery_01_desc:1 "#F 一个由[cainites|E]和他们的凡人家臣组成的军团的分团。#!"
 building_ashen_commandery_01:0 "小型骑士管领地"
 building_ashen_commandery_01_desc:1 "一个容纳许多[cainites|E]和凡人副手的小型骑士管领地。"
 building_ashen_commandery_02:0 "大型骑士管领地"
 building_ashen_commandery_02_desc:1 "骑士管领地被扩展，好容纳更多的凡人家臣，以及大型马厩和库存充足的军械库。"
 building_ashen_commandery_03:0 "要塞化骑士管领地"
 building_ashen_commandery_03_desc:1 "现在，骑士管领地本身就是一个令人生畏的防御工事，有着厚实的城墙和沉重的大门，容纳了大量的[cainite|E]骑士和他们信任的家臣。"
 building_type_ashen_office_01:0 "受控的执事所"
 building_type_ashen_office_01_desc:1 "#F 为你服务的[cainite|E]管家和商人，和他们的凡人家臣的办公室。#!"
 building_ashen_office_01:0 "小型办公室"
 building_ashen_office_01_desc:1 "一间由当地管家和商人组成的小型办公室，帮助你管理当地土地。"
 building_ashen_office_02:0 "中型办公室"
 building_ashen_office_02_desc:1 "一间中型办公室，你的下仆控制着这个地区的资金流动，填装着你的口袋。"
 building_ashen_office_03:0 "大型办公室"
 building_ashen_office_03_desc:1 "一间大型办公室，里面只有最好的执事，管家和商人，负责将经济重新分配给你。"
 building_type_ashen_ring_01:0 "犯罪圈"
 building_type_ashen_ring_01_desc:1 "#F 对当地的[cainite|E]罪犯和他们的凡人家臣的影响。#!"
 building_ashen_ring_01:0 "小型圈子"
 building_ashen_ring_01_desc:1 "这个地区的罪犯开始和你达成谅解。"
 building_ashen_ring_02:0 "中型圈子"
 building_ashen_ring_02_desc:1 "随着你对这个地区的不法之徒世界的影响力越来越大，一些不法之徒开始为你服务。"
 building_ashen_ring_03:0 "大型圈子"
 building_ashen_ring_03_desc:1 "你对这片土地上的不法之徒的影响是如此之大，以至于这片土地上所有的[cainite|E]亡命之徒都为你服务。"
 building_type_ashen_cult_site_01:0 "信仰之地"
 building_type_ashen_cult_site_01_desc:1 "#F 强大的[cainites|E]聚集他们虔诚信徒的地方。#!"
 building_ashen_cult_site_01:0 "血林"
 building_ashen_cult_site_01_desc:1 "一些密教徒聚集在这里崇拜和侍奉你。"
 building_ashen_cult_site_02:0 "血堂"
 building_ashen_cult_site_02_desc:1 "你大量的虔诚密教徒侍从崇拜和侍奉你的地方。"
 building_ashen_cult_site_03:0 "血殿"
 building_ashen_cult_site_03_desc:1 "一个显示你比血畜和血族优越的地方，众多的信徒聚集在这里崇拜和侍奉你。"
 building_type_dragon_nest_01:0 "掌握龙穴"
 building_type_dragon_nest_01_desc:1 "#F 一些特殊地区积蓄着大量的气，这会吸引大量的鬼神和感知敏锐的凡人，此类地区被鬼神称作圣地，节点，鬼屋，鬼人们则称其为龙穴。#!"
 building_dragon_nest_01:0 "掌握龙脉"
 building_dragon_nest_01_desc:1 "联系两个或多个龙穴的强大气脉，拥有适当力量的鬼神，能使用龙脉进行传送。"
 building_dragon_nest_02:0 "掌握龙穴"
 building_dragon_nest_02_desc:1 "气的流动十分强大，并且绝壁薄弱的地区。"
 building_dragon_nest_03:0 "掌握龙门"
 building_dragon_nest_03_desc:1 "当进入龙门之后，龙脉开始发光并像是河流一样奔腾，发光的颜色取决于气的类型，其无数的分岔也导向了不同的目的地。"
 building_type_aphrodisium_01:0 "安科纳的阿佛洛狄忒殿"
 building_type_aphrodisium_01_desc:1 "#F 一座隐秘的神殿，致力于满足凡人和[cainites|E]的自然饥渴，在那里，唯一真正的圣礼是爱和那些带来愉悦的行为。#!"
 building_aphrodisium_01:0 "隐蔽的阿佛洛狄忒殿"
 building_aphrodisium_01_desc:1 "阿佛洛狄忒的最后几位女祭司藏在安科纳地下深处，害怕着十字的报复。"
 building_aphrodisium_02:0 "崛起的阿佛洛狄忒殿"
 building_aphrodisium_02_desc:1 "教育着所有寻求欲求途径的知识的人，阿佛洛狄忒殿正在再次成为一个愉悦信仰中心。"
 building_aphrodisium_03:0 "凯旋的阿佛洛狄忒殿"
 building_aphrodisium_03_desc:1 "这是一个在逆境中生存的象征，是基督教降临前原罪之道的美好夜晚的余韵。"
 building_type_castle_lake_01:0 "湖中堡"
 building_type_castle_lake_01_desc:1 "#F 濒死的苦烬骑士团的总部位于一个被神圣洪水净化的山谷中。#!"
 building_castle_lake_01:0 "沉沒的城堡"
 building_castle_lake_01_desc:1 "城堡几乎无法居住，但仍然是[cainite|E]骑士团的一个重要聚会场所。"
 building_castle_lake_02:0 "受淹的城堡"
 building_castle_lake_02_desc:1 "修复和扩建工作夜以继日地进行，让古老的废墟重新获得了一些荣耀。"
 building_castle_lake_03:0 "现世的城堡"
 building_castle_lake_03_desc:1 "可敬的[cainites|E]战胜了他们的恶魔，精神上的和其他方面的恶魔。"
 building_type_fire_court_01:0 "火之庭"
 building_type_fire_court_01_desc:1 "#F 这是一个充满奇异和禁忌愉悦的地方，在#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!的注视下，过去各王朝的知识被收集于此。#!"
 building_fire_court_01:0 "冒头的火之庭"
 building_fire_court_01_desc:1 "在太阳王之祭礼将#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!驱逐出孟菲斯和吉萨后建立的火之庭，在后来发展到不仅仅是一个临时解决方案。"
 building_fire_court_02:0 "奠基的火之庭"
 building_fire_court_02_desc:1 "如果一个人寻找别人无法提供的知识，访问火之庭会有很大的收获。但当然，人们必须准备好付出代价。"
 building_fire_court_03:0 "权威的火之庭"
 building_fire_court_03_desc:1 "现在，埃及的主要[GetTrait('setite').GetName(GetNullCharacter)]神殿，火之庭的荣耀和危险，都是远近闻名的。"
 building_type_black_college_01:0 "黑学院"
 building_type_black_college_01_desc:1 "#F 这所致力于黑暗技艺的臭名昭著的学院也被称为黑学校，在无数次内战中被[GetTrait('baali').GetName(GetNullCharacter)]自身粉碎。#!"
 building_black_college_01:0 "废弃的黑学院"
 building_black_college_01_desc:1 "有些书仍然保留着，保持着最好永远被遗忘的秘密。"
 building_black_college_02:0 "复苏的黑学院"
 building_black_college_02_desc:1 "学院的一些部分已经被修复，向粗心的主人揭示了它们的恐怖。"
 building_black_college_03:0 "霸权的黑学院"
 building_black_college_03_desc:1 "再一次，房间里充满了学习技艺的魔邪学生。再一次，世界因异世界的实体如饥似渴地看着它而颤抖。"
 building_type_knossos_labyrinth_01:0 "克诺索斯迷宫"
 building_type_knossos_labyrinth_01_desc:1 "#F 内尔伽勒有一次几乎从这里毁灭了世界，只是被一个从未有过的、也不再会有的所有[cainite|E][Clans|E]的联盟所阻止。#!"
 building_knossos_labyrinth_01:0 "废弃的克诺索斯迷宫"
 building_knossos_labyrinth_01_desc:1 "岛屿震荡，凡人恐惧，谣言四起。"
 building_knossos_labyrinth_02:0 "复原的克诺索斯迷宫"
 building_knossos_labyrinth_02_desc:1 "疯狂之源再次增长。它能否被及时阻止？"
 building_knossos_labyrinth_03:0 "地狱般的克诺索斯迷宫"
 building_knossos_labyrinth_03_desc:1 "这一次，这个世界将无法存活。内尔伽勒可怕的笑容再次笼罩着这个注定末日的世界。"
 building_type_sernog_monastery_01:0 "塞尔诺格修道院"
 building_type_sernog_monastery_01_desc:1 "#F 一座气势汹汹的废弃堡垒，其发黑的墙壁仿若对抗天空的黑暗骷髅，且有着向星空开放的建筑外壳。与堡垒相连的是一座古老的大教堂，表面看上去不错，但其险恶程度不亚于其相邻建筑。#!"
 building_sernog_monastery_01:0 "废弃的塞尔诺格修道院"
 building_sernog_monastery_01_desc:1 "大教堂的内部反映出一种黑暗的不祥气氛。建筑似乎是通过一些疯狂设计师的狂想所雕刻出来的。那些可能是天使但却像魔鬼的怪异雕刻俯视着那些通过拱门进入前圣所的人。"
 building_sernog_monastery_02:0 "复原的塞尔诺格修道院"
 building_sernog_monastery_02_desc:1 "大教堂内的空气有一种发霉的、令人窒息的气味，仿佛有什么永久垂死之物嵌在石头里，并正在永恒腐烂的瘴气中渗出其精华。"
 building_sernog_monastery_03:0 "巍峨的塞尔诺格修道院"
 building_sernog_monastery_03_desc:1 "阴森的呻吟声充斥着空旷的中央大厅，在高高的拱形梁柱上回荡，并回馈为嘈杂的尖叫声，仿佛大量受害者在经历长期剧烈折磨时的哭泣。"
 building_type_iglesia_01:0 "圣仆圣尼可拉斯教堂"
 building_type_iglesia_01_desc:1 "#F 这座雄伟的教堂建在一座清真寺的废墟上，其内部隐藏着一些黑暗的东西。它呼唤着[GetTrait('lasombra').GetName(GetNullCharacter)]的阴暗灵魂。#!"
 building_iglesia_01:0 "教堂地基"
 building_iglesia_01_desc:1 "一个看起来很平凡的教堂地下室，如果你忽略在所有入侵者周围旋转的阴影。"
 building_iglesia_02:0 "教堂废墟"
 building_iglesia_02_desc:1 "清真寺的废墟在地基深处依然可见。它们的神圣性早已不复存在，只给任何拜访者留下令人不安的记忆和幻觉。"
 building_iglesia_03:0 "教堂的地下墓穴"
 building_iglesia_03_desc:1 "扭曲的隧道、移动的影子、疯狂的闪光……教堂的地下墓穴是源自深渊真实性质的令人不安的风景。通往一个永远没有光亮的世界的大门。"
 building_type_castle_avalon_01:0 "阿瓦隆之堡"
 building_type_castle_avalon_01_desc:1 "#F 勇敢的阿瓦隆骑士们在这个令人印象深刻的建筑中扬帆起航，延续着密特拉——不屈之阳的传说。#!"
 building_castle_avalon_01:0 "圣欧斯特雷贝尔特礼拜堂"
 building_castle_avalon_01_desc:1 "驯狼修女是骑士团的守护神，可以看到许多骑士在困难时期向她祈祷。"
 building_castle_avalon_02:0 "阿瓦隆堡垒"
 building_castle_avalon_02_desc:1 "一个强大的，不过空荡的堡垒。寻求崇高的功业的年轻骑士们的救赎希望。"
 building_castle_avalon_03:0 "夜中卡美洛"
 building_castle_avalon_03_desc:1 "也许不是真正的哪个，但这个强大的堡垒仍然是阿瓦隆骑士们的亚瑟派和密特拉派灯塔。"
 building_type_kerak_in_dan_01:0 "丹中卡拉克"
 building_type_kerak_in_dan_01_desc:1 "#F 黑骑士团的城堡，被遗忘在沙和血中。一个消逝的时代的遗迹。#!"
 building_kerak_in_dan_01:0 "废弃的卡拉克"
 building_kerak_in_dan_01_desc:1 "黑蔷薇，就像该隐异端本身一样，曾经有过更好的夜晚。废墟上充满了回忆和蜘蛛网，但没有更多的东西了。"
 building_kerak_in_dan_02:0 "复原的卡拉克"
 building_kerak_in_dan_02_desc:1 "在废墟中，可以找到古老的石碑。这里有许多来自黎凡特各种密教的卷轴和圣像。"
 building_kerak_in_dan_03:0 "凯旋的丹中卡拉克"
 building_kerak_in_dan_03_desc:1 "这堡垒象征着隐异端的回归，并且再也不会离开。"
 building_type_barcelona_library_01:0 "巴塞罗那图书馆"
 building_type_barcelona_library_01_desc:1 "#F 由好奇心强的米雷亚·苏比拉亲王开始，巴塞罗那图书馆作为一个广泛的知识的源泉在整个西班牙闻名。#!"
 building_barcelona_library_01:0 "平凡工程"
 building_barcelona_library_01_desc:1 "从肮脏的法律到深奥的哲学，凡人曾经产有的一切有价值的东西都在这里。"
 building_barcelona_library_02:0 "隐秘工程"
 building_barcelona_library_02_desc:1 "异端邪说、其他亲王的名字、秘密图书馆及其禁忌的资料都可以在这里找到。"
 building_barcelona_library_03:0 "独特工程"
 building_barcelona_library_03_desc:1 "挪得学家的碎片、布鲁赫的背叛和迦太基的陷落……巴塞罗那现在是各地神秘主义者的圣地。"
 building_type_mercy_ra_01:0 "拉的慈悲"
 building_type_mercy_ra_01_desc:1 "#F 阿玛纳，异端国王埃赫那吞的城市，是许多神龛的所在地。这座坐落在灰烬和骨堆中的神庙，在[cainites|E]的心中有着特殊的地位。吸血鬼可以在日落时分来到这里，将黄金、香火和血液等祭品献给拉神。如果祭品让神高兴，拉就会在一日出期间给予[cainite|E]安全。#!"
 building_mercy_ra_01:0 "拉的神龛"
 building_mercy_ra_01_desc:1 "被#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!谩骂的拉神在这个世界上仍有一些力量。尽管他们尽了最大努力，但始终无法完全亵渎这个地方。"
 building_mercy_ra_02:0 "拉的祭坛"
 building_mercy_ra_02_desc:1 "关于这个地方的危险的传言比比皆是，不管是天然的还是由嫉妒的#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!所种下的。但真正的朝圣者并不害怕。"
 building_mercy_ra_03:0 "拉的神殿"
 building_mercy_ra_03_desc:1 "能违背天主的诅咒，在阳光下行走，哪怕只有一天的时间，这奇迹确实证明了拉的伟大。"
 building_type_tower_flies_01:0 "蝇之塔"
 building_type_tower_flies_01_desc:1 "#F 像伸出的手臂一样突出于地中海的是一个长长的土制突堤，在突堤的尽头矗立着一个高大的、由白石制成的禁忌结构。#!"
 building_tower_flies_01:0 "废弃的蝇之塔"
 building_tower_flies_01_desc:1 "他们曾经是可怕的[GetTrait('baali').GetName(GetNullCharacter)]的堡垒，在圣保罗到来后被迫撤离。然后他们在水线下的一个小洞穴里开张。"
 building_tower_flies_02:0 "复原的蝇之塔"
 building_tower_flies_02_desc:1 "当[GetTrait('baali').GetName(GetNullCharacter)]回到他们的堡垒时，空气中弥漫着黑暗和可怕的幻觉，这是一个可怕时代的余波。"
 building_tower_flies_03:0 "可怖的蝇之塔"
 building_tower_flies_03_desc:1 "黑暗又回来了，从塔中蔓延开来，就像一波无尽的恐怖。而这一次，没有圣人可以拯救凡间。"
 building_type_library_malta_01:0 "马耳他图书馆"
 building_type_library_malta_01_desc:1 "#F [cainite|E]世界最大的秘密图书馆，存书放于许多口袋状的洞穴中，由一条隧道连接。#!"
 building_library_malta_01:0 "初见房间"
 building_library_malta_01_desc:1 "希腊文和拉丁文作品、阿拉伯文著作、德鲁伊符文、古老绘画的遗迹，一张张猥琐的人脸在迎接任何访客……"
 building_library_malta_02:0 "隐匿房间"
 building_library_malta_02_desc:1 "地板上的所罗门印记存放着更黑暗的宝藏、神秘学资料、恶魔学、色情书以及战争和酷刑手册。"
 building_library_malta_03:0 "被封印的房间"
 building_library_malta_03_desc:1 "被一块刻有雪松树标志的巨大石头挡住，可以感知到这里的存在，但这个房间从未被打开过。可能也不应该被打开。"
 building_type_hamilcar_palaestra_01:0 "哈米尔卡角力学校"
 building_type_hamilcar_palaestra_01_desc:1 "#F 训练厅是[GetTrait('brujah').GetName(GetNullCharacter)]的圣地，是它远离外部世界的退路。他们可以在此研习书籍，练习刀剑或磨练生理[disciplines|E]。#!"
 building_hamilcar_palaestra_01:0 "小型哈米尔卡角力学校"
 building_hamilcar_palaestra_01_desc:1 "仅剩的最大的训练厅，用汉尼拔的著名大象的象牙装饰着。"
 building_hamilcar_palaestra_02:0 "大型哈米尔卡角力学校"
 building_hamilcar_palaestra_02_desc:1 "经过多年的重建和扩建，训练厅再次无愧于古典时代的光荣前身。"
 building_hamilcar_palaestra_03:0 "壮观的哈米尔卡角力学校"
 building_hamilcar_palaestra_03_desc:1 "一个学习、锻体和展现历史自豪的中心。[GetTrait('brujah').GetName(GetNullCharacter)][Clan|E]的定义。"
 building_type_castle_hardestadt_01:0 "哈德施塔特堡"
 building_type_castle_hardestadt_01_desc:1 "#F 随着哈德施塔特对吸血鬼世界的影响越来越大，他最喜欢的城堡也是如此。如果信他，那此处就是传家宝。#!"
 building_castle_hardestadt_01:0 "小型哈德施塔特堡"
 building_castle_hardestadt_01_desc:1 "一座典型的德意志城堡，此处为各地[cainites|E]的未来做出了重大决定。"
 building_castle_hardestadt_02:0 "大型哈德施塔特堡"
 building_castle_hardestadt_02_desc:1 "一座巨大的德意志城堡，防守非常好。若没有主人的邀请，很少有人敢进入。"
 building_castle_hardestadt_03:0 "雄伟的哈德施塔特堡"
 building_castle_hardestadt_03_desc:1 "就像它的主人一样，哈德施塔特堡在[cainite|E]的历史上是一股可怕的力量。一个许多人都想进入的地方，如果他们不害怕无法离开的话。"
 building_type_castle_bran_01:0 "布兰城堡"
 building_type_castle_bran_01_desc:1 "#F 一座非常小的城堡，由条顿骑士团为控制博尔戈帕斯建造。一个无关紧要的、毫不重要的地方……#!"
 building_castle_bran_01:0 "小型布兰城堡"
 building_castle_bran_01_desc:1 "被遗忘和空置，特兰西瓦尼亚众多小城堡中的一座。但这座城堡有一些不同之处……"
 building_castle_bran_02:0 "杰出布兰城堡"
 building_castle_bran_02_desc:1 "从这，一位传奇将诞生。主人将成就他的城堡，而城堡将成就他的主人。"
 building_castle_bran_03:0 "传奇布兰城堡"
 building_castle_bran_03_desc:1 "听，黑夜之子。听他们发出了怎样的音乐！"
 building_type_vienna_chantry_01:0 "维也纳歌祷堂"
 building_type_vienna_chantry_01_desc:1 "#F 维也纳歌祷堂由埃特里乌斯建造，作为塞里奥斯沦陷时的一个潜在后方，是保守派[GetTrait('tremere').GetName(GetNullCharacter)]派的要塞。#!"
 building_vienna_chantry_01:0 "小型维也纳歌祷堂"
 building_vienna_chantry_01_desc:1 "维也纳歌祷堂坐落在城市北部数英里外的锯齿状海角上，看起来就像一个大型的、气派的狩猎小屋。"
 building_vienna_chantry_02:0 "大型维也纳歌祷堂"
 building_vienna_chantry_02_desc:1 "它的墙壁是由大块的灰色石头组成的，通过埃特里乌斯的魔法从大地中凿出。"
 building_vienna_chantry_03:0 "雄伟的维也纳歌祷堂"
 building_vienna_chantry_03_desc:1 "通过平凡和魔法的手段达成的巨大规模和严谨防御，没有任何东西可以打破这个化为堡垒的歌祷堂。"
 building_type_lion_green_01:0 "狮之绿园"
 building_type_lion_green_01_desc:1 "#F 梅琳达在英格兰的要塞。这是个虚开的地方，精明的议员在这里策划着她的下一步外交行动。#!"
 building_lion_green_01:0 "小型狮之绿园"
 building_lion_green_01_desc:1 "狮之绿园是一座高大的石塔。大多数当地人认为它是一位对城市生活有兴趣的贵族的次级庄园。"
 building_lion_green_02:0 "大型狮之绿园"
 building_lion_green_02_desc:1 "自从塞莱廷离开后，曾经宏伟的图书馆已经年久失修。目前正计划进行翻新，以改变这种状况。"
 building_lion_green_03:0 "宏伟的狮之绿园"
 building_lion_green_03_desc:1 "令人惊讶的是，狮之绿园缺乏刑具或牢房。囚犯们都直接被带到梅琳达的住处。那些事后离开房间的人，对女主人的态度总变得好得多。"
 building_type_spring_yzebel_01:0 "耶洗别之泉"
 building_type_spring_yzebel_01_desc:1 "#F 耶洗别是第一位来到伊比利亚的迦太基[GetTrait('brujah').GetName(GetNullCharacter)]。她在与罗马[GetTrait('ventrue').GetName(GetNullCharacter)]的战斗中陨落，不过争斗的双方都尊重她。#!"
 building_spring_yzebel_01:0 "被遗忘的耶洗别之泉"
 building_spring_yzebel_01_desc:1 "布拉加北部的一个小喷泉。耶洗别因其对未来的敏锐洞察力而闻名，喝了这些水似乎也能获得同样的能力。"
 building_spring_yzebel_02:0 "流动的耶洗别之泉"
 building_spring_yzebel_02_desc:1 "耶洗别是一名具有相当才能的将军，她对战争的洞察力在这些水域中自由流动。"
 building_spring_yzebel_03:0 "珍贵的耶洗别之泉"
 building_spring_yzebel_03_desc:1 "这是一个难得的信仰之地，也是氏族之间的和谐之地，在这里，每个人都能回忆一位光荣而受人尊敬的战士。"
 building_type_castle_hunedoara_01:0 "胡内多阿拉城堡"
 building_type_castle_hunedoara_01_desc:1 "#F 在这里，历史和幻想将相遇，传奇将诞生并被焚毁。#!"
 building_castle_hunedoara_01:0 "小型胡内多阿拉城堡"
 building_castle_hunedoara_01_desc:1 "胡内多阿拉建在一个古老堡垒的地基上，看起来没有什么花哨的东西，但这地方给予人一种不祥的预感。"
 building_castle_hunedoara_02:0 "畏人的胡内多阿拉城堡"
 building_castle_hunedoara_02_desc:1 "历史著于此处，当龙之子第一次了解到黑夜。"
 building_castle_hunedoara_03:0 "暗藏的胡内多阿拉城堡"
 building_castle_hunedoara_03_desc:1 "这里没有什么可看的。城堡不为人知。\n遁世会。"
 building_type_castle_vysehrad_01:0 "维谢赫拉德城堡"
 building_type_castle_vysehrad_01_desc:1 "#F 布拉格的第二座防御城堡是该地区一些最强大的实体的家园，也是监狱。#!"
 building_castle_vysehrad_01:0 "维谢赫拉德卫城"
 building_castle_vysehrad_01_desc:1 "曾经是布拉格的鲁道夫·布兰德尔亲王的住所，维谢赫拉德实际上容纳了更多强大的实体。"
 building_castle_vysehrad_02:0 "维谢赫拉德堡垒"
 building_castle_vysehrad_02_desc:1 "两位强大的棘秘魑玛土撒拉莎格拉与布克迪拉卡的家乡，维谢赫拉德对吸血鬼来说有着悠久的历史。"
 building_castle_vysehrad_03:0 "维谢赫拉德王座间"
 building_castle_vysehrad_03_desc:1 "在这里，克里斯托夫·罗慕铎与强大的布克迪拉卡作战。如果有人知道如何倾听，仍然可以隐约听到他们的战斗的回声。"
 building_type_uppsala_01:0 "乌普萨拉神殿"
 building_type_uppsala_01_desc:1 "#F 北欧原始教徒最神圣的地方早已被凡人遗忘，但还没有被吸血鬼遗忘。#!"
 building_uppsala_01:0 "焚毁的乌普萨拉"
 building_uppsala_01_desc:1 "这座神殿躺在废墟中，被十字架的追随者烧毁，痛苦地提醒着[einherjar|E]的失败。"
 building_uppsala_02:0 "复苏的乌普萨拉"
 building_uppsala_02_desc:1 "在十字架的阴影下，信徒们正在慢慢返回，他们仍然心怀恐惧，但还没有崩溃。"
 building_uppsala_03:0 "乌普萨拉神殿"
 building_uppsala_03_desc:1 "[einherjar|E]正在返回他们的祖传神殿。而十字架之神这次没法再阻止他们了。"
 building_type_hermitage_01:0 "隐居所"
 building_type_hermitage_01_desc:1 "#F 一个与世隔绝用于冥想和练武的地方。#!"
 building_hermitage_01:0 "下等隐居所"
 building_hermitage_01_desc:1 "小隐隐于野"
 building_hermitage_02:0 "中等隐居所"
 building_hermitage_02_desc:1 "中隐隐于市。"
 building_hermitage_03:0 "上等隐居所"
 building_hermitage_03_desc:1 "大隐隐于朝。"
 building_type_kunlun_school_01:0 "昆仑学宫"
 building_type_kunlun_school_01_desc:1 "#F 曾经天军的最大的学院，建筑于昆仑山之上。这座建筑是一座雄伟的堡垒，墙壁镀金，家具奢华。#!"
 building_kunlun_school_01:0 "废弃的昆仑学宫"
 building_kunlun_school_01_desc:1 "曾经是[GetTrait('shih').GetName( GetNullCharacter )]的最宏伟学塾，因有意者制造的地震而损毁。"
 building_kunlun_school_02:0 "复原的昆仑学宫"
 building_kunlun_school_02_desc:1 "[GetTrait('shih').GetName( GetNullCharacter )]的传承在此教授，因[GetTrait('shih').GetName( GetNullCharacter )]正在陆续回到他们的总部。"
 building_kunlun_school_03:0 "凯旋的昆仑学宫"
 building_kunlun_school_03_desc:1 "[GetTrait('shih').GetName( GetNullCharacter )]宏伟的学院已然归来，再也没有鬼神可以再次阻止他们了。"
 building_type_salianna_court_01:0 "爱之庭"
 building_type_salianna_court_01_desc:1 "#F 爱之庭是一个致力于爱本身的地方，以及通过死去的吸血鬼之心对它进行冷酷无情的研究。#!"
 building_salianna_court_01:0 "小型爱之庭"
 building_salianna_court_01_desc:1 "在法兰西著名的或标志性的地区运行，爱之庭以其对致命的爱情阴谋的关注而闻名。"
 building_salianna_court_02:0 "大型爱之庭"
 building_salianna_court_02_desc:1 "许多年轻的骑士涌向著名的宫廷，希望获得荣耀和名声。大多数人都是在被里面的致命生物完全迷住后才走了。"
 building_salianna_court_03:0 "权威的爱之庭"
 building_salianna_court_03_desc:1 "[cainite|E]法兰西的政治中心不适合胆小的人，甚至有经验的吸血鬼也成为其致命游戏的牺牲品。"
 building_type_paris_01:0 "巴黎"
 building_type_paris_01_desc:1 "#F 奇迹之城是西方世界的中心，但它也是一个难以真正掌握的地方。#!"
 building_paris_01:0 "自由巴黎"
 building_paris_01_desc:1 "巴黎是不屈不挠的，没有人能够真正控制它的精神，至少目前是这样。"
 building_paris_02:0 "受限巴黎"
 building_paris_02_desc:1 "一点一点，巴黎正在与它的主人融为一体，也许是一个不断增长的帝国的中心。"
 building_paris_03:0 "受控巴黎"
 building_paris_03_desc:1 "巴黎正在向外看，将自己视为一个新时代的灯塔。"
 building_type_gavrinis_01:0 "加夫里尼斯"
 building_type_gavrinis_01_desc:1 "#F 靠近瓦讷的地方有一个小岛，岛上有一个史前洞穴……而且声名狼藉。#!"
 building_gavrinis_01:0 "废弃的加夫里尼斯修道院"
 building_gavrinis_01_desc:1 "医院骑士团试图在这里建立自己的地位，但即使他们的信仰也不足以保护他们免受下面的恐怖。"
 building_gavrinis_02:0 "加夫里尼斯洞穴"
 building_gavrinis_02_desc:1 "很久以前，人们就在这里进行献祭。而某人，或某物，仍在等待下一个。"
 building_gavrinis_03:0 "加夫里尼斯海域"
 building_gavrinis_03_desc:1 "这座岛屿本身似乎以绝望和死亡为生。而且最终总是有更多的人来到这里。"
 building_type_toulouse_university_01:0 "图卢兹大学"
 building_type_toulouse_university_01_desc:1 "#F 由教宗额我略九世于1229年创建的图卢兹大学很快就拥有了自己的身位。#!"
 building_toulouse_university_01:0 "小型图卢兹大学"
 building_toulouse_university_01_desc:1 "这所大学最初是为了向经常被带入歧途的阿基坦人民传授基督教正道，但很快就赢得了思想自由的声誉。"
 building_toulouse_university_02:0 "扩张的图卢兹大学"
 building_toulouse_university_02_desc:1 "从语言到神学，大学教授最常见的科目，日趋著名。"
 building_toulouse_university_03:0 "著名图卢兹大学"
 building_toulouse_university_03_desc:1 "这所大学的阴暗赞助人投入了大量精力来帮助图卢兹与巴黎竞争。结果说明了他们的成功。"
 building_type_cecilia_palace_01:0 "塞西莉娅的寝宫"
 building_type_cecilia_palace_01_desc:0 "#F 有人说它曾是用于卖淫圣事的神殿。在群众中，它只是被称为妓院——尽管它是一个昂贵的妓院。许多钱财从它的门前流过。#!"
 building_cecilia_palace_01_desc:0 "有人说它曾是用于卖淫圣事的神殿。在群众中，它只是被称为妓院——尽管它是一个昂贵的妓院。许多钱财从它的门前流过。"
 building_cecilia_palace_01:0 "塞西莉娅的寝宫"
 building_type_web_of_faith_01:0 "连接信仰之网"
 building_type_web_of_faith_01_desc:1 "#F 信仰之网是覆盖整个中东地区的由圣地和塞赫（神秘能量）构成的网络。#!"
 building_web_of_faith_01:0 "微弱信仰之网连接"
 building_web_of_faith_01_desc:1 "你截下了一丁点的塞赫脉流，但没法再多了。"
 building_web_of_faith_02:0 "下等信仰之网连接"
 building_web_of_faith_02_desc:1 "你截下了一丝丝的塞赫脉流，但没法再多了。"
 building_web_of_faith_03:0 "中等信仰之网连接"
 building_web_of_faith_03_desc:1 "你截下了微弱的塞赫脉流，但没法再多了。"
 building_type_from_the_ties_of_faith_01:0 "凡人军队"
 building_type_from_the_ties_of_faith_01_desc:1 "#F 凡人已经听到了他们的神王的召唤，他们正在创建能够击败即将到来的灾变的大军以提供帮助。#!"
 building_from_the_ties_of_faith_01:0 "微弱凡人军队"
 building_from_the_ties_of_faith_01_desc:1 "少量的凡人听到了你的召唤，宣誓一生在你的军队中服务。"
 building_from_the_ties_of_faith_02:0 "下等凡人军队"
 building_from_the_ties_of_faith_02_desc:1 "更多的凡人已经响应了号召。这不是很多，但这是一个相当大的起步。"
 building_from_the_ties_of_faith_03:0 "中等凡人军队"
 building_from_the_ties_of_faith_03_desc:1 "你的凡人军队现在已经达到了一个相当的规模。外人可能会认为他们是一个小型的雇佣军团。"
 building_type_from_the_cult_of_isis_01:0 "信徒密教"
 building_type_from_the_cult_of_isis_01_desc:1 "#F 这些最忠实的追随者甚至能使对重生者的信仰延续数千年。#!"
 building_from_the_cult_of_isis_01:0 "微弱信徒密教"
 building_from_the_cult_of_isis_01_desc:1 "少数的崇拜者在这里秘密地保持着古老的信仰。"
 building_from_the_cult_of_isis_02:0 "下等信徒密教"
 building_from_the_cult_of_isis_02_desc:1 "在这一地区，信众的数量已经增加。一个小密教正在形成中。"
 building_from_the_cult_of_isis_03:0 "中等信徒密教"
 building_from_the_cult_of_isis_03_desc:1 "在这片土地上，围绕你和古老信仰已经形成了一个小密教。你的政治影响力已经开始增长。"
 building_type_from_the_children_of_osiris_01:0 "买办住所"
 building_type_from_the_children_of_osiris_01_desc:1 "#F 买办，指为为其他超自然生物工作的吸血鬼。#!"
 building_from_the_children_of_osiris_01:0 "微弱买办住所"
 building_from_the_children_of_osiris_01_desc:1 "在这里，你收集其他超自然加入你的事业的基础工作。"
 building_from_the_children_of_osiris_02:0 "下等买办住所"
 building_from_the_children_of_osiris_02_desc:1 "你的网络已经开始结出果实，即一些新的超自然联系。"
 building_from_the_children_of_osiris_03:0 "中等买办住所"
 building_from_the_children_of_osiris_03_desc:1 "你的网络终于建立起来了，虽然规模不大，而且是同类中较弱的，但你有多个买办可以联系。"
 building_type_from_shemsu_heru_01:0 "陵墓"
 building_type_from_shemsu_heru_01_desc:1 "#F 当你的灵在冥界准备复活的时候，你的躯体得放在一个安全的地方。它可能是一个隐蔽的地下室，一个与世隔绝的山洞，一个博物馆的安全存储区，甚至是帝王谷中一个未被发现的陵墓。#!"
 building_from_shemsu_heru_01:0 "微弱陵墓"
 building_from_shemsu_heru_01_desc:1 "把这称为陵墓可能有点夸张。它更像是一个隐藏在地下室或凹室中的简单石棺。"
 building_from_shemsu_heru_02:0 "下等陵墓"
 building_from_shemsu_heru_02_desc:1 "虽然这可能只不过是一个竖井式的陵墓，或者是山洞里的一个简单的陵墓，但它是一个陵墓。"
 building_from_shemsu_heru_03:0 "中等陵墓"
 building_from_shemsu_heru_03_desc:1 "你的陵墓已经得到了一定程度的扩展。它现在容纳了一些遗物和壁画。"
 building_type_from_eset_a_01:0 "遗产"
 building_type_from_eset_a_01_desc:1 "#F 你在你的第一或第二人生中给世界留下了一些重要的印记，你仍然从中汲取力量。#!"
 building_from_eset_a_01:0 "微弱遗产"
 building_from_eset_a_01_desc:1 "自从你回到这个世界，你完全不为人所知。你希望能解决这个悲剧。"
 building_from_eset_a_02:0 "下等遗产"
 building_from_eset_a_02_desc:1 "你现在是乡下人的地区故事，一个传言。但这仅仅是你的遗产的第一章。"
 building_from_eset_a_03:0 "中等遗产"
 building_from_eset_a_03_desc:1 "你现在在少数人中被记住了，他们现在才开始了解你过去和现在是多么重要。"
 building_type_genealogie_01:0 "族谱"
 building_type_genealogie_01_desc:1 "#F 少数家庭确实作为[GetTrait('shih').GetName( GetNullCharacter )]的猎人单位而存在，但它们非常罕见。大多数人的根源可以追溯到羿本人，尽管他们的家谱是否准确是一个巨大的潜在争论来源。#!"
 building_genealogie_01:0 "短小族谱"
 building_genealogie_01_desc:1 "没人信你的家族是羿的后裔。"
 building_genealogie_02:0 "中长族谱"
 building_genealogie_02_desc:1 "少数人信你的家族是羿的后裔。"
 building_genealogie_03:0 "悠久族谱"
 building_genealogie_03_desc:1 "多数人信你的家族是羿的后裔。"
 building_genealogie_04:0 "荒古族谱"
 building_genealogie_04_desc:1 "所有人都信你的家族是羿的后裔。"
 building_web_of_faith_04:0 "上等信仰之网连接"
 building_web_of_faith_04_desc:1 "你在这一地区截下一小股塞赫脉流。"
 building_web_of_faith_05:0 "强力信仰之网连接"
 building_web_of_faith_05_desc:1 "你在这个地区截下一定的塞赫脉流。"
 building_web_of_faith_06:0 "王级信仰之网连接"
 building_web_of_faith_06_desc:1 "你截下了这地区的一股强力塞赫脉流。"
 building_web_of_faith_07:0 "帝级信仰之网连接"
 building_web_of_faith_07_desc:1 "整个圣地都在你的控制之下。"
 building_web_of_faith_08:0 "神级信仰之网连接"
 building_web_of_faith_08_desc:1 "在过去漫长的岁月中，这个圣地是无与伦比的，且塞赫从这个美丽的地方不断涌出。"
 building_from_the_ties_of_faith_04:0 "上等遗产"
 building_from_the_ties_of_faith_04_desc:1 "你的军队现在已经达到了专业标准。它可以与凡人和超自然的力量相抗衡。"
 building_from_the_ties_of_faith_05:0 "强力凡人军队"
 building_from_the_ties_of_faith_05_desc:1 "你现在拥有一支规模和技能都能让你的敌人感到恐惧而犹豫的军队。"
 building_from_the_ties_of_faith_06:0 "王级凡人军队"
 building_from_the_ties_of_faith_06_desc:1 "虽然你的这支军队由凡人组成，但他们将为你进军鬼门关。"
 building_from_the_ties_of_faith_07:0 "帝级凡人军队"
 building_from_the_ties_of_faith_07_desc:1 "如果克里奥帕特拉有这军队，那么埃及就不会成为罗马的一部分了。"
 building_from_the_ties_of_faith_08:0 "神级凡人军队"
 building_from_the_ties_of_faith_08_desc:1 "如果克里奥帕特拉有这军队，那么罗马就会成为埃及的一部分了。"
 building_from_the_cult_of_isis_04:0 "上等信徒密教"
 building_from_the_cult_of_isis_04_desc:1 "你在这片土地上的影响已经根深蒂固。你密教的成员已经在大多数重要机构中找到了自己的位置。"
 building_from_the_cult_of_isis_05:0 "强力信徒密教"
 building_from_the_cult_of_isis_05_desc:1 "这片土地上到处都能听到你的许多绰号的私语。一个公开的秘密是，有一位不朽者看守着这片土地。"
 building_from_the_cult_of_isis_06:0 "王级信徒密教"
 building_from_the_cult_of_isis_06_desc:1 "你的密教已经壮大。这片土地上的大多数居民要么在它的控制之下，要么是活跃的成员。"
 building_from_the_cult_of_isis_07:0 "帝级信徒密教"
 building_from_the_cult_of_isis_07_desc:1 "这个地方的居民公开地同情旧神，并会听从你的命令。"
 building_from_the_cult_of_isis_08:0 "神级信徒密教"
 building_from_the_cult_of_isis_08_desc:1 "你的话语在这片土地上是神圣的。古老的传统经常被奉行，隐秘的神殿也开始被建立起来。"
 building_from_the_children_of_osiris_04:0 "上等买办住所"
 building_from_the_children_of_osiris_04_desc:1 "由于你的网络已经增长，一些庇护所已经为你的新买办建造。这是一个地狱般的开始。"
 building_from_the_children_of_osiris_05:0 "强力买办住所"
 building_from_the_children_of_osiris_05_desc:1 "你的影响力正在进一步扩大，你能接触到的庇护所和买办也开始反映出这一点。"
 building_from_the_children_of_osiris_06:0 "王级买办住所"
 building_from_the_children_of_osiris_06_desc:1 "你现在可以指挥整个帮派或战群。你把他们带到你身边的成就是了不起的，也是你意志的证明。"
 building_from_the_children_of_osiris_07:0 "帝级买办住所"
 building_from_the_children_of_osiris_07_desc:1 "在你的领地和其他地方的超自然都听说了只有你能提供的机遇，其中一些人已经听从了你的召唤。"
 building_from_the_children_of_osiris_08:0 "神级买办住所"
 building_from_the_children_of_osiris_08_desc:1 "即使是奥西里斯联盟在这里也微不足道。"
 building_from_shemsu_heru_04:0 "上等陵墓"
 building_from_shemsu_heru_04_desc:1 "你现在有了一个合适的陵墓，最近还获得了一个护卫，可以在当你的灵魂在[shadowlands|E]时，照看你的躯体。"
 building_from_shemsu_heru_05:0 "强力陵墓"
 building_from_shemsu_heru_05_desc:1 "你的陵墓现在已经扩展到一个更大的墓室群中。更多你选的追随者守护着你的安息之地。"
 building_from_shemsu_heru_06:0 "王级陵墓"
 building_from_shemsu_heru_06_desc:1 "你的陵墓现在有一系列的陷阱、诅咒和武器，供你的凡人守卫使用。打搅你的躯体的人有祸了。"
 building_from_shemsu_heru_07:0 "帝级陵墓"
 building_from_shemsu_heru_07_desc:1 "你的陵墓可与古代法老的陵墓媲美。它被隐藏起来，不为无知的凡人所知，但任何偶然发现它的人都会心生敬畏。"
 building_from_shemsu_heru_08:0 "神级陵墓"
 building_from_shemsu_heru_08_desc:1 "你的陵墓虽然被隐藏起来不被人窥视，但却超过了古代的伟大国王的坟墓。要想打扰您的休眠，就需要一场围城。"
 building_from_eset_a_04:0 "上等遗产"
 building_from_eset_a_04_desc:1 "你现在是整个地区的一个神话，你过去的故事和事迹成为激励儿童的故事。"
 building_from_eset_a_05:0 "强力遗产"
 building_from_eset_a_05_desc:1 "说起你的名字，人们都很尊敬和敬畏，认为你是当地的传奇人物，是影响力的来源，现在当地的政治家引用你的名字，也是一种威望的来源。"
 building_from_eset_a_06:0 "王级遗产"
 building_from_eset_a_06_desc:1 "你的遗产和神话如此伟大，以至于当地贵族通过宣称有你的血统来声称正统。"
 building_from_eset_a_07:0 "帝级遗产"
 building_from_eset_a_07_desc:1 "国王们现在从你的血统中声称正统，对古老的神王和神后进行认祖宗。"
 building_from_eset_a_08:0 "神级遗产"
 building_from_eset_a_08_desc:1 "即使是亚历山大大帝的遗产，与你的遗产相比也是一个可悲的、呜咽的阴影。"
 building_type_kinfolk_meeting_grounds_01:0 "兽嫡聚集地"
 building_type_kinfolk_meeting_grounds_01_desc:0 "#F 在这里，附近部族的重要[GetTrait('kinfolk').GetName(GetNullCharacter)]聚集在一起，与当地民众打成一片，希望能培养出下一代的战士。#!"
 building_kinfolk_meeting_grounds_01:0 "小型兽嫡聚集地"
 building_kinfolk_meeting_grounds_01_desc:0 "一个专门为附近的[GetTrait('kinfolk').GetName(GetNullCharacter)]提供服务的小社区。虽然不怎么好看，但仍是他们的家。"
 building_kinfolk_meeting_grounds_02:0 "中型兽嫡聚集地"
 building_kinfolk_meeting_grounds_02_desc:0 "在这里，[GetTrait('kinfolk').GetName(GetNullCharacter)]与彼此和周围的环境互动，在不需响应部族的召集时，过着自己的生活。"
 building_kinfolk_meeting_grounds_03:0 "大型兽嫡聚集地"
 building_kinfolk_meeting_grounds_03_desc:0 "这里有大量得到很好的安置的[GetTrait('kinfolk').GetName(GetNullCharacter)]。甚至还有为下一代提供的房间。"
 building_type_kinfolk_healers_01:0 "兽嫡医师"
 building_type_kinfolk_healers_01_desc:0 "#F 草药与其他老秘方，在[GetTrait('kinfolk').GetName(GetNullCharacter)]之间代代相传。#!"
 building_kinfolk_healers_01:0 "兽嫡医师学徒"
 building_kinfolk_healers_01_desc:0 "在治疗师刚开启旅程时，他们仍然受到部族的重视。"
 building_kinfolk_healers_02:0 "兽嫡医师"
 building_kinfolk_healers_02_desc:0 "当必须为最不可能发生的疾病找到拯救办法时，部族知道该去哪里找。"
 building_kinfolk_healers_03:0 "训练有素的兽嫡医师"
 building_kinfolk_healers_03_desc:0 "部族的战士们毫无顾虑地投入战斗，他们清楚地知道，他们将被这些蒙福的人从死亡中拯救出来。"
 building_type_kinfolk_militia_01:0 "兽嫡民兵"
 building_type_kinfolk_militia_01_desc:0 "#F 在需要的时候，每个男人、女人和孩子都必须准备好保护族群。#!"
 building_kinfolk_militia_01:0 "小型兽嫡民兵"
 building_kinfolk_militia_01_desc:0 "并不多以真正吓到一个坚定的对手，但总比没有好。"
 building_kinfolk_militia_02:0 "中型兽嫡民兵"
 building_kinfolk_militia_02_desc:0 "足够数量的战士，准备好行军，保卫他们的家园。"
 building_kinfolk_militia_03:0 "大型兽嫡民兵"
 building_kinfolk_militia_03_desc:0 "该部族无法再要求比这更强大的坚定战士们在需要时支持他们。"
 building_type_kinfolk_markets_01:0 "兽嫡市场"
 building_type_kinfolk_markets_01_desc:0 "#F 在那里，你与部族成员聚集在一起，以物易物，讨价还价，讨论族群需要什么。#!"
 building_kinfolk_markets_01:0 "小型兽嫡市场"
 building_kinfolk_markets_01_desc:0 "一个小型兽嫡市场，供[GetTrait('kinfolk').GetName(GetNullCharacter)]聚在一起进行交易。"
 building_kinfolk_markets_02:0 "中型兽嫡市场"
 building_kinfolk_markets_02_desc:0 "一些当地居民被允许来到这里，允许与当地的[GetTrait('kinfolk').GetName(GetNullCharacter)]族群交易。"
 building_kinfolk_markets_03:0 "大型兽嫡市场"
 building_kinfolk_markets_03_desc:0 "令族群中的一些传统主义者懊恼的是，你的[GetTrait('kinfolk').GetName(GetNullCharacter)]现在已经是当地贸易不可分割的一部分了。"
 building_type_kinfolk_bonfire_01:0 "兽嫡篝火"
 building_type_kinfolk_bonfire_01_desc:0 "#F 你祖辈的伟大事迹被传于下一代之处。#!"
 building_kinfolk_bonfire_01:0 "小型兽嫡篝火"
 building_kinfolk_bonfire_01_desc:0 "讲故事是一门艺术，而有才华的艺术家在你的族群中目前还很少。"
 building_kinfolk_bonfire_02:0 "中型兽嫡篝火"
 building_kinfolk_bonfire_02_desc:0 "在此讲述旧日之传说，或将启发明日之传奇。"
 building_kinfolk_bonfire_03:0 "大型兽嫡篝火"
 building_kinfolk_bonfire_03_desc:0 "少者来此聆听，而长者来此追忆。部族成员们聚拢到一起。"
 building_type_werewolf_hunting_party_01:0 "狼人狩猎队"
 building_type_werewolf_hunting_party_01_desc:0 "#F 总有一些人类试图侵犯你的领地。同样，总有殷切的部族幼崽们准备获取这垂手可得的荣耀。#!"
 building_werewolf_hunting_party_01:0 "小型狼人狩猎队"
 building_werewolf_hunting_party_01_desc:0 "一支简单的巡逻队，移除你领地上最猖獗的人类侵犯者。"
 building_werewolf_hunting_party_02:0 "中型狼人狩猎队"
 building_werewolf_hunting_party_02_desc:0 "殷切的部族幼崽们用靠近你族群的不明智人类来磨练他们的技能。"
 building_werewolf_hunting_party_03:0 "大型狼人狩猎队"
 building_werewolf_hunting_party_03_desc:0 "人类害怕狼群是有原因的。你绝不会让它们所谓的“文明”在此处猖獗。"
 building_type_werewolf_scouting_party_01:0 "狼人侦察队"
 building_type_werewolf_scouting_party_01_desc:0 "#F 每时每刻都有幼崽们经历他们的原始觉醒，而他们需要被找到。这就是这些熟练的追踪者们的任务。#!"
 building_werewolf_scouting_party_01:0 "小型狼人侦察队"
 building_werewolf_scouting_party_01_desc:0 "一两个熟练的追踪者，只够覆盖周围的村庄。  "
 building_werewolf_scouting_party_02:0 "中型狼人侦察队"
 building_werewolf_scouting_party_02_desc:0 "这群训练有素的追踪者在广泛的区域中搜寻，寻找任何幼崽来帮助他们完成原始觉醒。 "
 building_werewolf_scouting_party_03:0 "大型狼人侦察队"
 building_werewolf_scouting_party_03_desc:0 "多亏了你众多的侦察队，在这地区很少有幼崽能逃脱你的视线。对他们的救援使部族稳步发展。 "
 building_type_werewolf_training_grounds_01:0 "狼人训练场"
 building_type_werewolf_training_grounds_01_desc:0 "#F 兽嫡必须得到训练才能成为成为族群的有用之材。#!"
 building_werewolf_training_grounds_01:0 "小型狼人训练场"
 building_werewolf_training_grounds_01_desc:0 "兽嫡们在这里得到基础的战斗训练。至少足够让他们知道剑的尖端在哪。"
 building_werewolf_training_grounds_02:0 "中型狼人训练场"
 building_werewolf_training_grounds_02_desc:0 "他们永远不会像狼人那样令人生畏。但他们会竭尽全力。 "
 building_werewolf_training_grounds_03:0 "大型狼人训练场"
 building_werewolf_training_grounds_03_desc:0 "这其中没有多少真正了解战争。但多亏了你的绝世教官，你的兽嫡很快就会通晓。 "
 building_type_werewolf_warden_01:0 "狼人看守"
 building_type_werewolf_warden_01_desc:0 "#F [GetTrait('kinfolk').GetName(GetNullCharacter)]对部族的未来至关重要。他们的安全远比他们的自由来得重要。#!"
 building_werewolf_warden_01:0 "宽松狼人看守"
 building_werewolf_warden_01_desc:0 "一个友好而合群的看守也许并非最好的保护者，但这至少是个开始。"
 building_werewolf_warden_02:0 "严厉狼人看守"
 building_werewolf_warden_02_desc:0 "一个粗暴的、或许有点粗鲁的长者，将确保让愚蠢的兽嫡遵守规矩。 "
 building_werewolf_warden_03:0 "苛刻狼人看守"
 building_werewolf_warden_03_desc:0 "其等不能在他不知道的情况下出任何棉薄之力。尤其是在他不赞同的情况下。 "
 building_type_werewolf_raiding_party_01:0 "狼人劫掠队"
 building_type_werewolf_raiding_party_01_desc:0 "#F 狼人们被惧怕是有原因的。他们会对任何觉察到的敌人发起难以预测且致命的攻击。#!"
 building_werewolf_raiding_party_01:0 "小型狼人劫掠队"
 building_werewolf_raiding_party_01_desc:0 "一小队熟练的战士，足够让周边地区对潜伏的狼群保持忌惮。"
 building_werewolf_raiding_party_02:0 "中型狼人劫掠队"
 building_werewolf_raiding_party_02_desc:0 "数个战群在乡村游荡，在任何有威胁的团体组织起来之前就对其进行攻击。 "
 building_werewolf_raiding_party_03:0 "大型狼人劫掠队"
 building_werewolf_raiding_party_03_desc:0 "惧怕夜里的狼嚎吧。掠食到不敢来招惹，其等会意识到这是多么徒劳的行为。 "
 building_type_amazon_camp_01:0 "亚马逊营地"
 building_type_amazon_camp_01_desc:0 "#F 部族中最年轻的女儿们将通过鲜血与狂怒证明她们自己。#!"
 building_amazon_camp_01:0 "亚马逊营地"
 building_amazon_camp_01_desc:0 "盖亚的女战士是如此可怖，显然是地母本人之狂怒的化身。"
 building_type_scavengers_01:0 "清道夫"
 building_type_scavengers_01_desc:0 "#F 聪明的啮骨者们从不会浪费任何好东西，尤其是他们倒下敌人的尸首。#!"
 building_scavengers_01:0 "清道夫"
 building_scavengers_01_desc:0 "聪明的啮骨者们从不会浪费任何好东西，尤其是他们倒下敌人的尸首。"
 building_type_black_spiral_01:0 "黑螺旋"
 building_type_black_spiral_01_desc:0 "#F 随着螺旋起舞。起舞，然后获得自由。起舞，直至你的理智散去，获得新生。#!"
 building_black_spiral_01:0 "黑螺旋"
 building_black_spiral_01_desc:0 "随着螺旋起舞。起舞，然后获得自由。起舞，直至你的理智散去，获得新生。"
 building_type_gaia_refuge_01:0 "盖亚的庇护所"
 building_type_gaia_refuge_01_desc:0 "#F 盖亚之子赐予落魄之人盖亚的怜悯，不管他们是来自其他部落还是人类当中的弃子。#!"
 building_gaia_refuge_01:0 "盖亚的庇护所"
 building_gaia_refuge_01_desc:0 "盖亚之子赐予落魄之人盖亚的怜悯，不管他们是来自其他部族还是来自人类的流浪者。"
 building_type_heroes_summit_01:0 "英雄峰会"
 building_type_heroes_summit_01_desc:0 "#F 传说可不仅止于过去。只要诸神黄昏的阴影持续笼罩着，芬里斯的英雄们就会奋起迎接挑战。#!"
 building_heroes_summit_01:0 "英雄峰会"
 building_heroes_summit_01_desc:0 "萨迦可不仅止于过去。只要诸神黄昏的阴影持续逼近，芬里斯的英雄们就会奋起为这准备。"
 building_type_city_wolves_01:0 "城狼"
 building_type_city_wolves_01_desc:0 "#F 人类监护者与人类一起合作，试图引导它走向共同繁荣。#!"
 building_city_wolves_01:0 "城狼"
 building_city_wolves_01_desc:0 "人类监护者与人类一起合作，试图引导它走向共同繁荣。"
 building_type_constant_impergium_01:0 "刀耕之治"
 building_type_constant_impergium_01_desc:0 "#F 人类是一种瘟疫。赤爪会将他们一一宰杀，将瘟疫扑灭。#!"
 building_constant_impergium_01:0 "刀耕之治"
 building_constant_impergium_01_desc:0 "人类是一种瘟疫。赤爪会将他们一一宰杀，将瘟疫扑灭。"
 building_type_shadowy_summit_01:0 "暗影峰会"
 building_type_shadowy_summit_01_desc:0 "#F 狡黠的影爵经常被他们的狼人同伴称为无耻之徒，但没有人能够否认他们能够取得的成果。#!"
 building_shadowy_summit_01:0 "暗影峰会"
 building_shadowy_summit_01_desc:0 "狡黠的影爵经常被他们的狼人同伴称为无耻之徒，但没有人能够否认他们能够取得的成果。"
 building_type_travelers_lodging_01:0 "旅人宿处"
 building_type_travelers_lodging_01_desc:0 "#F 作为流浪者，寂静漫游者们比任何人都懂得一处可供休憩和分享旅途故事的宜人之所的价值。#!"
 building_travelers_lodging_01:0 "旅人宿处"
 building_travelers_lodging_01_desc:0 "作为流浪者，寂静漫游者们比任何人都懂得一处可供休憩和分享旅途故事的宜人之所的价值。"
 building_type_noble_trappings_01:0 "贵族标志"
 building_type_noble_trappings_01_desc:0 "#F 作为狼国的贵族，银牙被认为是万物光荣而公正的统治者。#!"
 building_noble_trappings_01:0 "贵族标志"
 building_noble_trappings_01_desc:0 "作为狼国的贵族，银牙被认为是万物光荣而公正的统治者。"
 building_type_hidden_retreat_01:0 "狡兔三窟"
 building_type_hidden_retreat_01_desc:0 "#F 星占部族完全掌控着他们的魂怒，在展开行动前总能作出冷静的判断。#!"
 building_hidden_retreat_01:0 "狡兔三窟"
 building_hidden_retreat_01_desc:0 "星占部族完全掌控着他们的魂怒，在展开行动前总能作出冷静的判断。"
 building_type_caern_rage_01:0 "魂怒圣地"
 building_type_caern_rage_01_desc:0 "#F 致力于追求战争的圣地，在这里，狼人和兽嫡一直在寻找新的值得一战的战斗。#!"
 building_caern_rage_01:0 "初建魂怒圣地"
 building_caern_rage_01_desc:0 "一个不断壮大的圣地，拥有熟练的战士，尽管数量很少。"
 building_caern_rage_02:0 "小型魂怒圣地"
 building_caern_rage_02_desc:0 "一座小型魂怒圣地，这里每天都能听到训练的声音。"
 building_caern_rage_03:0 "中型魂怒圣地"
 building_caern_rage_03_desc:0 "战争与痛苦之灵在这圣地筑巢，将它们相当的专业知识借给这里的狼人。"
 building_caern_rage_04:0 "大型魂怒圣地"
 building_caern_rage_04_desc:0 "在长者的指引下，新一代的战士将在此地诞生。"
 building_caern_rage_05:0 "巨型魂怒圣地"
 building_caern_rage_05_desc:0 "该地区最令人印象深刻的圣地，在这里，战争是一种艺术，战斗是一种被需要的物资。"
 building_type_caern_leadership_01:0 "领导圣地"
 building_type_caern_leadership_01_desc:0 "#F 致力于部族团结的圣地，吸引了许多来自不同背景的战群来到这里。#!"
 building_caern_leadership_01:0 "初建领导圣地"
 building_caern_leadership_01_desc:0 "一位强大的领袖或将在此诞生，但此地规模对于如此宏伟的野心而言暂时还太小。"
 building_caern_leadership_02:0 "小型领导圣地"
 building_caern_leadership_02_desc:0 "令你的下属们牢记职责是一项不容搁置的任务。  "
 building_caern_leadership_03:0 "中型领导圣地"
 building_caern_leadership_03_desc:0 "狼群的强大程度取决于头狼；圣地的强大程度取决于君王。"
 building_caern_leadership_04:0 "大型领导圣地"
 building_caern_leadership_04_desc:0 "如果领导能力能够后天习得，那么此处便是研习之所。"
 building_caern_leadership_05:0 "巨型领导圣地"
 building_caern_leadership_05_desc:0 "当每个成员都各司其职，部族才能在明智而强大的领导下发展壮大。"
 building_type_caern_will_01:0 "意志圣地"
 building_type_caern_will_01_desc:0 "#F 致力于通过世俗和特异手段改善部族的圣地。#!"
 building_caern_will_01:0 "初建意志圣地"
 building_caern_will_01_desc:0 "狼人们在此处探究他们在当今世界中的角色。"
 building_caern_will_02:0 "小型意志圣地"
 building_caern_will_02_desc:0 "与邻近社区的试探性贸易正在缓解圣地不稳定的孤立状态。"
 building_caern_will_03:0 "中型意志圣地"
 building_caern_will_03_desc:0 "一位祖灵对这圣地降下了祝福，带来了有关过去与未来的宝贵经验。"
 building_caern_will_04:0 "大型意志圣地"
 building_caern_will_04_desc:0 "一位土元素保护着这个圣地，对其居民坚忍不拔的决心感到高兴。"
 building_caern_will_05:0 "巨型意志圣地"
 building_caern_will_05_desc:0 "这座圣地与周围环境巧妙地融为一体，赢得了整个地区的尊重和感谢。"
 building_type_caern_enigmas_01:0 "隐谜圣地"
 building_type_caern_enigmas_01_desc:0 "#F 一个专门研究狼族最微妙的技艺的圣地，经常受到狡猾的影爵的青睐。#!"
 building_caern_enigmas_01:0 "初建隐谜圣地"
 building_caern_enigmas_01_desc:0 "这里满是千术和幻术，年轻的小崽子得以模仿，学会了更微妙的做事办法的价值。"
 building_caern_enigmas_02:0 "小型隐谜圣地"
 building_caern_enigmas_02_desc:0 "这座圣地的长者知道一些可以让你思考数周答案的谜题。如果真的有答案的话。"
 building_caern_enigmas_03:0 "中型隐谜圣地"
 building_caern_enigmas_03_desc:0 "奇魅之灵祝福了这座圣地，很高兴看到这里的狡猾。"
 building_caern_enigmas_04:0 "大型隐谜圣地"
 building_caern_enigmas_04_desc:0 "阴影混淆了这座圣地，成就了友好之灵聚集在一起，保卫并观察居住在其中的狡猾的居民的结果。"
 building_caern_enigmas_05:0 "巨型隐谜圣地"
 building_caern_enigmas_05_desc:0 "在这甚至可以策划让吸血鬼感到疑惑的阴谋，逆转狼人作为无脑野蛮人的声誉。"
 building_type_caern_wisdom_01:0 "智慧圣地"
 building_type_caern_wisdom_01_desc:0 "#F 在一个被战争蹂躏的世界里的和平圣地，对于精神被削弱的狼人来说是一个非常有用的绿洲。#!"
 building_caern_wisdom_01:0 "初建智慧圣地"
 building_caern_wisdom_01_desc:0 "这里提供了灵魂和身体的憩息。在一个残酷的世界当中，这是一种难得的慈悲。"
 building_caern_wisdom_02:0 "小型智慧圣地"
 building_caern_wisdom_02_desc:0 "这座圣地的教义在整个地区以智慧和值得审议而闻名。"
 building_caern_wisdom_03:0 "中型智慧圣地"
 building_caern_wisdom_03_desc:0 "一只睿智的枭灵把这个圣地当作自己的家，从上面暗中观察着它的居民。"
 building_caern_wisdom_04:0 "大型智慧圣地"
 building_caern_wisdom_04_desc:0 "教导，辩论，治疗……各种形式的精神帮助都能在这里找到。"
 building_caern_wisdom_05:0 "巨型智慧圣地"
 building_caern_wisdom_05_desc:0 "有了这样一处繁荣的智慧圣地 ，像魂怒之战这样的错误就有希望在未来当中被避免。"
 building_type_sun_glory_01:0 "日耀圣地"
 building_type_sun_glory_01_desc:0 "#F 这座以一个永冻的湖泊为中心的圣地也许是欧洲最重要的多部族聚会场所。#!"
 building_sun_glory_01:0 "萌芽的日耀圣地"
 building_sun_glory_01_desc:0 "在创立之初被称作大山圣地，后来为了表彰纪尧姆在该地区日耀的功绩而改名。"
 building_sun_glory_02:0 "扩张的日耀圣地"
 building_sun_glory_02_desc:0 "以纪尧姆为榜样，日耀圣地致力于消灭吸血鬼，为它赢得了可怕的名声。"
 building_sun_glory_03:0 "雄伟的日耀圣地"
 building_sun_glory_03_desc:0 "赫利俄斯保护着圣地，他那致命的射线确保没有吸血鬼可以毫无意外地进入这里。"
 building_type_white_sea_01:0 "白海圣地"
 building_type_white_sea_01_desc:0 "#F 芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。#!"
 building_white_sea_01:0 "萌芽的白海圣地"
 building_white_sea_01_desc:0 "芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。"
 building_white_sea_02:0 "扩张的白海圣地"
 building_white_sea_02_desc:0 "芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。"
 building_white_sea_03:0 "雄伟的白海圣地"
 building_white_sea_03_desc:0 "芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。"
 building_type_wild_sea_01:0 "狂海圣地"
 building_type_wild_sea_01_desc:0 "#F 这座圣地的中心是一座古老的原始教徒之墓，在凯尔特人到来之前，居住在这一带的鬼魂一直困扰着这里。#!"
 building_wild_sea_01:0 "萌芽的狂海圣地"
 building_wild_sea_01_desc:0 "这圣地是一处幽静之地， 但自从接待被剥皮瘟疫肆虐的难民后使其资源紧张到极点。"
 building_wild_sea_02:0 "扩张的狂海圣地"
 building_wild_sea_02_desc:0 "原始教徒墓地的鬼魂的无声悲泣穿透了世界之间的迷障，并允许芬尼安弦月狼从影界汲取灵知。"
 building_wild_sea_03:0 "雄伟的狂海圣地"
 building_wild_sea_03_desc:0 "这是芬尼安在经历剥皮瘟疫后所剩下的最终据点。一座强大到可以重建它们整个部族的地方？"
 building_type_fimbul_winter_01:0 "芬布尔之冬夜圣地"
 building_type_fimbul_winter_01_desc:0 "#F 斯堪的纳维亚上的芬里尔仔兽最为威武的圣地，英雄们在与沃坦恶战后聚集在此。#!"
 building_fimbul_winter_01:0 "萌芽的芬布尔之冬夜圣地"
 building_fimbul_winter_01_desc:0 "斯堪的纳维亚半岛上的芬里尔传人最为威武的圣地，英雄们在与沃坦恶战后聚集在此。"
 building_fimbul_winter_02:0 "扩张的芬布尔之冬夜圣地"
 building_fimbul_winter_02_desc:0 "斯堪的纳维亚半岛上的芬里尔传人最为威武的圣地，英雄们在与沃坦恶战后聚集在此。"
 building_fimbul_winter_03:0 "雄伟的芬布尔之冬夜圣地"
