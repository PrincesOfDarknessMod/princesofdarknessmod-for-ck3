l_simp_chinese:
 traditions_government:0 "诫律制"
 traditions_government_adjective:0 "诫律制"
 traditions_government_realm:0 "该隐之子国度"
 traditions_government_vassals_label:1 "[cainite|E][obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 traditions_government_desc:1 "绝大多数吸血鬼国家都遵循该隐诫律，这是一套关于如何在人类和其他同类面前表现自己的行为的粗略准则。"
 legacy_rights:0 "#BLOODRED 第一诫律：血约#!"
 legacy_rights_none:0 "不受宗教保护"
 legacy_rights_none_short:0 "#BLOODRED 强制执行#!"
 legacy_rights_none_desc:2 "#flavor “尔之血造就吾之血脉，以吾之形。吾之诅咒归于尔，吾之救赎归于尔。吾代为神立于尔之上。吾既如此，吾之传统为吾之约。弃余既弃希望。”该隐说。#!\n\n[liege|E]可以[demand_conversion|E][vassal|E]\n[liege|E]可以在[vassals|E]的领地用[convert_county|E]"
 legacy_rights_protected:0 "受宗教保护"
 legacy_rights_protected_desc:2 "#flavor “尔之血造就吾之血脉，以吾之形。吾之诅咒归于尔，吾之救赎归于尔。吾代为神立于尔之上。吾既如此，吾之传统为吾之约。弃余既弃希望。”该隐说。#!\n\n#emphasis #bold [vassal|E]特权：#!#!\n[liege|E]不可以[demand_conversion|E][vassal|E]\n[liege|E]不可以在[vassals|E]的领地用[convert_county|E]\n\n#flavor [vassal|E]被授予特殊的保护地位，国家正式承认他们行使自己信仰[faith|E]的权利。#!"
 legacy_rights_protected_short:0 "#BLOODRED 自愿执行#!"
 progeny_rights:0 "#BLOODRED 第三诫律：后嗣#!"
 progeny_rights_none:0 "取缔造嗣权利"
 progeny_rights_none_short:0 "#BLOODRED 无#!"
 progeny_rights_none_desc:0 "#flavor “惟得[Sire|E]许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。#!\n\n#emphasis #bold [vassal]不被其的[liege]允许制造后嗣。甚至制造血仆也是被禁止的。#!#!"
 progeny_rights_granted:0 "完全造嗣权利"
 progeny_rights_granted_short:0 "#BLOODRED 任意#!"
 progeny_rights_granted_desc:0 "#flavor “惟得[Sire|E]许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。#!\n\n#emphasis #bold [vassal]被其的[liege]允许制造后嗣。 其中包含吸血鬼子嗣和血仆。#!#!"
 progeny_rights_ghouls:0 "血仆制造权"
 progeny_rights_ghouls_short:0 "#BLOODRED 血仆#!"
 progeny_rights_ghouls_desc:0 "#flavor “惟得长者许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。#!\n\n#emphasis #bold [vassal]被其的[liege]给予制造血仆的权利，但是吸血鬼子嗣不行。#!#!"
 progeny_rights_childer:0 "血族后嗣权利"
 progeny_rights_childer_short:0 "#BLOODRED 血族#!"
 progeny_rights_childer_desc:0 "#flavor “惟得长者许与祝，乃可再造。作为其最近我者之天，以其所掌。破此，汝与汝之后皆将死。”该隐说。#!\n\n#emphasis #bold [vassal]被其的[liege]给予制造吸血鬼子嗣的权利，但是血仆不行。#!#!"
 domain_revocation_rights:0 "#BLOODRED 第二诫律：领权#!"
 domain_revocation_rights_default:0 "剥夺领地"
 domain_revocation_rights_default_short:0 "#BLOODRED 领主第一#!"
 domain_revocation_rights_default_desc:0 "如果君权法允许，[liege]将被剥夺领地。"
 domain_revocation_rights_protected:0 "受保领地"
 domain_revocation_rights_protected_desc:0 "#flavor “如吾乃挪得之主也，汝之域自汝事。君为其主，凡人皆当尊此，不则受君之怒。其于入时献其，汝当以保其报。按理，汝可于君之境内田，其血自汝之。受之者也，管子之地，并与人君望之钧重。”该隐说。#!\n\n[vassal|E]特权：#!#!\n[liege|E]不能剥夺[vassals_possessive|E][titles|E]\n\n#flavor [vassal]被确保了他们的[titles]所有权，防止[liege|E]的剥夺——无论[liege|E]是否有[revoke_title_reason]。#!"
 domain_revocation_rights_protected_short:0 "#BLOODRED 蒙受保护#!"
 blood_tithe:0 "#BLOODRED 血贡#!"
 blood_tithe_none:0 "没有$blood_tithe$"
 blood_tithe_none_short:0 "#BLOODRED 无#!"
 blood_tithe_none_desc:0 "#emphasis #bold [vassal]不应该为他们的[liege]献血。#!#!"
 blood_tithe_required:0 "血畜血贡"
 blood_tithe_required_short:0 "#BLOODRED 血畜#!"
 blood_tithe_required_desc:0 "#emphasis #bold 应要求的情况下，[vassal]必须向其[liege]的宫廷提供一个血畜。通常，这意味着凡人的死亡。#!#!"
 blood_tithe_vampiric:0 "封臣精血血贡"
 blood_tithe_vampiric_short:0 "#BLOODRED 精血#!"
 blood_tithe_vampiric_desc:0 "#emphasis #bold 应要求的情况下，[vassal]必须向其[liege]提供他们自己的吸血鬼之血。这会增加提供者的饥渴。#!#!"
 blood_tithe_childer:0 "子嗣血贡"
 blood_tithe_childer_short:0 "#BLOODRED 子嗣#!"
 blood_tithe_childer_desc:0 "#emphasis #bold 应要求的情况下，[vassal]必须向其[liege]提供他们的一个子嗣。这常常会导致那个子嗣的消亡。#!#!"
 primogen_rights:0 "#BLOODRED 内环#!"
 primogen_rights_none:0 "无内环席位"
 primogen_rights_none_desc:0 "#emphasis 在内环[council]中，[vassal]不会被授予任何特殊的特权。#!"
 primogen_rights_none_short:0 "#BLOODRED 无#!"
 primogen_rights_guaranteed:0 "内环席位"
 primogen_rights_guaranteed_desc:0 "#emphasis #bold [vassal|E]特权：#!#!\n#high $force_onto_council$#![interaction|E]可以自行使用\n\n#flavor [vassal]被赋予了特殊内环[council]特权，并会期望一个永久[council]席位。授予这项特权给过多[vassals]会最终导致[realm|E]的[powerful_vassals]失望。#!"
 primogen_rights_guaranteed_short:0 "#BLOODRED 确保#!"
 inquisition_government:0 "裁判所"
 inquisition_government_adjective:0 "裁判所"
 inquisition_government_realm:0 "裁判所"
 inquisition_government_vassals_label:1 "裁判官[obligations|E]基于[opinion|E]"
 inquisition_government_desc:1 "裁判官猎群，他们会摧毁所有遇到的超自然事物。"
 celestial_army_government:0 "天军制"
 celestial_army_government_adjective:0 "天军制"
 celestial_army_government_realm:0 "天军制"
 celestial_army_government_vassals_label:1 "天军制[obligations|E]基于[liege|E]的[piety_level|E]"
 celestial_army_government_desc:1 "被认为早已消失的东方猎人的宏伟组织已经归来。"
 august_court_government:0 "至尊皇朝"
 august_court_government_adjective:0 "至尊皇朝"
 august_court_government_realm:0 "至尊皇朝"
 august_court_government_vassals_label:1 "至尊皇朝[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 august_court_government_desc:1 "中原最早的万鬼社会结构组织。"
 heretical_court_government:0 "异端皇朝"
 heretical_court_government_adjective:0 "异端皇朝"
 heretical_court_government_realm:0 "异端皇朝"
 heretical_court_government_vassals_label:1 "异端皇朝[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 heretical_court_government_desc:1 "由某帝级老祖自行统治的皇朝，其没有得到诸至尊皇朝的承认。"
 type_of_courts:3 "宫廷类型"
 type_of_courts_political:0 "政治宫廷"
 type_of_courts_political_desc:2 "#flavor 到目前为止，政治宫廷是最常见的。他们召开会议，监督鬼人的利益和某一特定地理区域的凡人，如城镇或城市。大城市可能会有数个政治宫廷，每个宫廷都有自己的领土和传统，每个宫廷都有一套独特的麻烦，对郡城老祖进行严峻的考验。#!"
 type_of_courts_social:0 "社会宫廷"
 type_of_courts_social_desc:2 "#flavor 社会宫廷比政治宫廷不那么常见，而且位于最不寻常的地方。它们围绕社会目标（如保护和维护龙穴）、学术兴趣领域，甚至是区域性问题而形成。#!"
 type_of_courts_political_short:0 "政治"
 type_of_courts_social_short:0 "社会"
 litany_government:0 "律令制"
 litany_government_adjective:0 "律令制"
 litany_government_realm:0 "狼人部族"
 litany_government_vassals_label:1 "律令制[obligations|E]基于[opinion|E]"
 litany_government_desc:1 "律令，或黑螺旋舞者的黑暗律令，是狼族所遵守的法规条律。于刀耕之治的末期编写。"
 hierarchy_government:0 "冥秩"
 hierarchy_government_adjective:0 "冥秩"
 hierarchy_government_realm:0 "铁之冥府"
 hierarchy_government_vassals_label:1 "冥秩[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 hierarchy_government_desc:1 "由卡戎建立的，作为统一和整理混乱的来世的手段，它已经发展成为一个阶级化、固化的官僚机构，以奴役成千上万的灵魂作为灵奴或原材料为基础，并由互战的亡主“领导”。"
 guild_government:0 "冥河行会"
 guild_government_adjective:0 "行会"
 guild_government_realm:0 "冥河行会"
 guild_government_vassals_label:1 "行会[obligations|E]基于[liege|E]的[prestige_level|E]"
 guild_government_desc:1 "在冥河社会，对冥法的掌握历来由冥河行会控制。这些组织促进了对每个冥法的使用、研究和管理。"
 heretic_government:0 "异端"
 heretic_government_adjective:0 "异端"
 heretic_government_realm:0 "异端"
 heretic_government_vassals_label:1 "异端[obligations|E]基于[liege|E]的[piety_level|E]"
 heretic_government_desc:1 "与冥秩相对立的是异端，他们拥护[underworld|E]中的特殊宗教观点。许多异端强调超脱，认为所有死灵都应该为之努力，并利用他们的资源来协助其他人的努力。"
 ferryman_government:0 "船夫协会"
 ferryman_government_adjective:0 "摆渡人"
 ferryman_government_realm:0 "船夫协会"
 ferryman_government_vassals_label:1 "摆渡人[obligations|E]基于[liege|E]的[piety_level|E]"
 ferryman_government_desc:1 "船夫协会，或称桨之誓会，不熟悉其秘密的人通常称之为摆渡人（这个名单几乎涵盖了所有人），是[underworld|E]最古老和最强大的社团之一。"
 far_shore_government:0 "彼岸"
 far_shore_government_adjective:0 "彼岸"
 far_shore_government_realm:0 "彼岸"
 far_shore_government_vassals_label:1 "彼岸[obligations|E]基于[liege|E]的[piety_level|E]"
 far_shore_government_desc:1 "彼岸是[underworld|E]的一块神秘领地，由被称为闪耀者的皮提亚人实体控制。"
 renegade_government:0 "叛逆"
 renegade_government_adjective:0 "叛逆"
 renegade_government_realm:0 "叛逆"
 renegade_government_vassals_label:1 "叛逆[obligations|E]基于[opinion|E]"
 renegade_government_desc:1 "叛逆是目标并不在于遵循死者政府，也不在于寻求超脱的冥河死灵。相反，叛逆们在广阔地行事范畴内按照自己的节奏前行，从积极反抗冥秩到简单地想要滞留。"
 hive_mind_government:0 "蜂巢心智"
 hive_mind_government_adjective:0 "蜂巢"
 hive_mind_government_realm:0 "蜂巢心智"
 hive_mind_government_vassals_label:1 "所有蜂巢[vassals|E]的蜂巢心智[obligations|E]都是相同的"
 hive_mind_government_desc:1 "所有的怨灵都是蜂巢心智的一部分，允许怨灵们彼此进行心灵感应。"
 hive_mind_government_obligations:0 "[GetGovernment( 'hive_mind_government' ).GetName][obligations|E]"
 infernal_court_government:0 "地狱王庭"
 infernal_court_government_adjective:0 "王庭"
 infernal_court_government_realm:0 "地狱王庭"
 infernal_court_government_vassals_label:1 "地狱王庭[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 infernal_court_government_desc:1 "从深渊回归的恶魔通常会将自己组织成王庭，这是愤怒年代的遗留物，当时堕落者在与天堂的战争中统治着自己的要塞。"
 yellow_springs_government:0 "黄泉"
 yellow_springs_government_adjective:0 "黄泉"
 yellow_springs_government_realm:0 "黄泉"
 yellow_springs_government_vassals_label:1 "黄泉[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 yellow_springs_government_desc:1 "黄泉是一个绝对的君主制帝国，由中国第一位皇帝秦始皇的渊影——钰皇控制。"
 cell_government:0 "猎群"
 cell_government_adjective:0 "猎群"
 cell_government_realm:0 "猎群"
 cell_government_vassals_label:1 "猎群[obligations|E]基于[opinion|E]"
 cell_government_desc:1 "一群为了保护、团队合作和共同理想而联合起来的猎人。"
 cult_government:0 "木乃伊密教"
 cult_government_adjective:0 "密教"
 cult_government_realm:0 "木乃伊密教"
 cult_government_vassals_label:1 "木乃伊密教[obligations|E]基于[liege|E]的[piety_level|E]"
 cult_government_desc:1 "自古以来，重生者就指挥着为他们服务的凡人团体。即使在他们长期睡眠期间，这些组织仍在延续，将他们的秘密和职责传给下一代，并看守他们主人的陵墓。"
 household_government:0 "家堡制"
 household_government_adjective:0 "家堡制"
 household_government_realm:0 "家堡制"
 household_government_vassals_label:1 "家堡制[obligations|E]基于每个[vassal|E]的[feudal_contract|E]"
 household_government_desc:1 "“家堡”是指同住在某座永契堡中的换生灵群体，他们为这座永契堡的贵胄领主效劳，其身份可以是封臣也可以是亲随。"
 celestial_army_government_modifier:0 "天军政体给予创建[title|E]花费削减、[army|E]金钱维护费削减、AI战争概率增加、以及每月[prestige|E]。"
 hierarchy_government_modifier:0 "冥秩政体给予[stress|E]减少。"
 guild_government_modifier:0 "行会政体给予冥法[lifestyle|E][experience|E]增益。"
 yellow_springs_government_modifier:0 "黄泉政体解锁[jade_arcanoi|E][lifestyle|E]。"
 antagonistic2: "对抗"
 antagonistic2_desc: "很少有东西能像仇恨或嫉妒那样激励人。在这个家族里你最好小心自己的后背，不然可能会有人试图刺一把刀进去。。"
 competitive2: "竞争"
 competitive2_desc: "家族里有竞争是一件好事。它会推动家族成员互相超越，无论是在战场上，还是在夺位的过程中……"
 impassive2: "冷漠"
 impassive2_desc: "为什么要花时间和精力去关心家里其他人在干什么？这些家族成员往往首先关心自己。"
 friendly2: "友善"
 friendly2_desc: "这个家族的成员或许并不总是意见一致，但他们总是友好相处。"
 harmonious2: "和谐"
 harmonious2_desc: "完美和谐的家族。家族成员尽其所能团结一致，随时准备好互相帮助。"
 legacy_rights_protected_tax_collector:0 "传承保留权"
 legacy_rights_protected_tax_collector_desc:0 "#emphasis #bold 该[liege|E]不能对该[vassal|E]进行[demand_conversion|E]互动\n该[liege|E]不能对该[vassals|E]的领地指派[convert_county|E]内阁任务#!#!"
 legacy_rights_protected_tax_collector_flavor_desc:0 "#flavor 汝身之血，吾嗣之证，汝象法吾。吾詛汝受，吾恩汝承。吾为天子，于汝之上。替天行政，于汝之先。吾即是道，吾之古道，即吾之契。弃我不顾，永夜失路。 ”该隐若曰。#!"
 domain_revocation_rights_protected_tax_collector:0 "领地权利"
 domain_revocation_rights_protected_tax_collector_desc:0 "#emphasis #bold 该[liege|E]不能剥夺[vassals_possessive|E]的[titles|E]\n\n该[vassal]被保证他[titles]的所有权，免于[liege|E]剥夺——无论[liege|E]有无[revoke_title_reason]。#!#!"
 domain_revocation_rights_protected_tax_collector_flavor_desc:0 "#flavor 如吾为挪得之主，汝土汝治。汝为其主，他人敬之，人之侮慢，汝怒是承。人入汝土，袒裎以见，投木报琼，汝其护之。汝之领土，即汝之囿。血既收之，任亦受之。汝事汝土，人之敬汝，汝其报之。”该隐若曰。#!"
 guaranteed_council_tax_collector:0 "内阁职位"
 guaranteed_council_tax_collector_desc:0 "#emphasis #bold 该封臣总能强制进入领主的内阁。#!#!"
 guaranteed_council_tax_collector_flavor_desc:0 "#flavor 在有权有势领主的显赫内阁席位占有一席之地是一种荣誉，有些人认为这是他们应得的。#!"
 POD_strict_taxation_tax_collector:0 "严峻征税"
 POD_strict_taxation_tax_collector_flavor_desc:0 "#flavor 你要金钱。他有金钱。适逢其会。#!"
 POD_tributary_tax_collector:0 "朝贡体系"
 POD_tributary_tax_collector_desc:0 "#emphasis #bold 该[liege|E]不能剥夺[vassals_possessive|E]的[titles|E]\n\n该[vassal]被保证他[titles]的所有权，免于[liege|E]剥夺——无论[liege|E]有无[revoke_title_reason]。该[liege|E]不能对该[vassal|E]进行[demand_conversion|E]互动\n该[liege|E]不能对该[vassals|E]的领地指派[convert_county|E]内阁任务#!#!"
 POD_tributary_tax_collector_flavor_desc:0 "#flavor 该封臣几乎不承认你的统治。你对他领土的控制充其量也是摇摇欲坠。#!"
 POD_hard_control_tax_collector:0 "绝对控制"
 POD_hard_control_tax_collector_desc:0 "#emphasis #bold 封臣如果没有对其领主的牵制，就不能宣战。#!#!"
 POD_hard_control_tax_collector_flavor_desc:0 "#flavor 他们缴税。他们服役。他们顺从。他们别无选择。#!"
 POD_is_giovanni_trigger_tt:0 "必须是乔凡尼"
 vampire_tax_collector_obligations:0 "[tax_collector|E]称职度"
 POD_frontier_region_tax_collector:0 "帝国边疆"
 POD_frontier_region_tax_collector_flavor_desc:0 "#flavor 此区建有坚固的堡垒以预防大群蛮族入侵我们的边疆。#!"
 POD_tightened_bureaucracy_tax_collector:0 "严官酷吏"
 POD_tightened_bureaucracy_tax_collector_flavor_desc:0 "#flavor 有胜任的专员领导此次调查，你肯定能找出需要纠正的“违规行为”吧？#!"
 POD_tightened_bureaucracy_tax_collector_tt:0 "你的税吏必须要有比缴税封臣更高的管理。"
 POD_core_region_tax_collector:0 "核心地区"
