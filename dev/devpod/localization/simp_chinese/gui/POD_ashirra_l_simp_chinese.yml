 ASHIRRA_WINDOW_INFLUENCE_GAIN:0 "每年狂热：#TOOLTIP:ashirra_influence_gain_tt #P;L +[GetPlayer.MakeScope.ScriptValue('ashirra_influence_value')|0]#!#!"
 ashirra_influence_gain_tt:0 "[GetPlayer.MakeScope.GetScriptValueDesc('ashirra_influence_value')]"
 ashirra_county_mod:0 "阿什拉派伯爵领#weak （每个加一）#!"
 HAVE_AT_LEAST_COUNT_ASHIRRA_INFLUENCE:2 "阿什拉派有至少$VALUE|0V$狂热"
 NOT_HAVE_AT_LEAST_COUNT_ASHIRRA_INFLUENCE:2 "阿什拉派#bold 没#!有至少$VALUE|0V$狂热"
 GAINS_ASHIRRA_INFLUENCE:1 "获得$VALUE|+0$狂热"
 GAINED_ASHIRRA_INFLUENCE:1 "获得了$VALUE|+0$狂热"
 LOSES_ASHIRRA_INFLUENCE:1 "失去$VALUE|-0$狂热"
 LOST_ASHIRRA_INFLUENCE:1 "失去了$VALUE|-0$狂热"
 ASHIRRA_WINDOW_MY_STATUS:0 "我的地位：#V [GetPlayer.Custom('AshirraStatus')]#!"
 ASHIRRA_WINDOW_TAB_EDICTS:0 "敕令"
 temporary_doctrine_tt:0 "该教条将在#V 10#!年后被移除。"
 ashirra_idealism_doctrine_name:0 "阿什拉派主义"
 ashirra_edict_adopt_mysticism:0 "拥护改良主义"
 ashirra_mysticism_doctrine_name:0 "阿什拉派改良主义"
 ashirra_mysticism_doctrine_desc:0 "Spearheaded by Haroun el-La'il, this approach challenges the traditionalists on many subjects (like arguing that the Ashirra already fulfill their duties to the Sawn by their nocturnal existence). More broadly, it is a call for debate and change that is argued to be a slippery slope by the Elders."
 ashirra_edict_adopt_legalism:0 "贯彻传统主义"
 ashirra_legalism_doctrine_name:0 "阿什拉派传统主义"
 ashirra_legalism_doctrine_desc:0 "The traditional viewpoint of most Ashirra is a strict adherence to the teachings, interpreted for their own undead state by the earliest Ashirra. To its detractors, this approach leaves no room for debate and enforces the rule of the Elders."
 ashirra_edict_army:0 "影响扎维叶"
 ashirra_army_doctrine_name:0 "扎维叶已影响"
 ashirra_army_doctrine_desc:0 "While far from being as numerous as the Christian ones, Islam still is home to some military orders. The Ashirra have some solid influence in those and don't hesitate to use it on times of need."
 ashirra_edict_tax:0 "确保麦地那"
 ashirra_tax_doctrine_name:0 "麦地那已确保"
 ashirra_tax_doctrine_desc:0 "The social center of a Muslim town or city, the Madina are where the Ashirra influence mortal affairs the most."
 ashirra_edict_opinion:0 "忠实执行教法"
 ashirra_opinion_doctrine_name:0 "集结马格里布"
 ashirra_opinion_doctrine_desc:0 "A group of grim and devout Ashirra, the Maghrib are dedicated to uprooting any threats to the faith, be they internal or external."
 ashirra_edict_gain_fervor:0 "召集信众"
 fervor_gain_ashirra_edict:0 "阿什拉派法令"