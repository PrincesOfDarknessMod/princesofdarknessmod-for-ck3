 HAVE_AT_LEAST_COUNT_ASHIRRA_INFLUENCE: "阿什拉派有至少$VALUE|0V$狂热#weak （对非穆拉则为#V $VALUE|0$0#!狂热）#!"
 NOT_HAVE_AT_LEAST_COUNT_ASHIRRA_INFLUENCE: "阿什拉派#bold 没#!有至少$VALUE|0V$狂热#weak （对非穆拉则为#V $VALUE|0$0#!狂热）#!"
 GAINS_ASHIRRA_INFLUENCE: "获得$VALUE|+0$狂热"
