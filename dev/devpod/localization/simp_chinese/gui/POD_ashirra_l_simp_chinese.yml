 ASHIRRA_WINDOW_INFLUENCE_GAIN: "每年狂热：#TOOLTIP:ashirra_influence_gain_tt #P;L +[GetPlayer.MakeScope.ScriptValue('ashirra_influence_value')|0]#!#!"
