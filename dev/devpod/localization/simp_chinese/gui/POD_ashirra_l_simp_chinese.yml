 ASHIRRA_WINDOW_MY_STATUS: "我的地位：#V [GetPlayer.Custom('AshirraStatus')]#!"
 ASHIRRA_WINDOW_TAB_EDICTS: "敕令"
 temporary_doctrine_tt: "该教条将在#V 10#!年后被移除。"
 ashirra_idealism_doctrine_name: "阿什拉派主义"
 ashirra_edict_adopt_mysticism: "拥护改良主义"
 ashirra_mysticism_doctrine_name: "阿什拉派改良主义"
 ashirra_mysticism_doctrine_desc: "在哈罗恩·拉伊尔的带领下，这在许多问题上挑战了传统主义者（比如认为阿什拉派已经通过夜行履行了对索恩的责任）。更广泛地说，长者们认为这是在呼吁辩论和变革。"
 ashirra_edict_adopt_legalism: "贯彻传统主义"
 ashirra_legalism_doctrine_name: "阿什拉派传统主义"
 ashirra_legalism_doctrine_desc: "大多数阿什拉派的传统观点是严格遵守最早的阿什拉派为自己的不死族状态所诠释的教义。在批评者看来，这种做法不给予任何争论的余地，是在执行长者之治。"
 ashirra_edict_army: "影响扎维叶"
 ashirra_army_doctrine_name: "扎维叶已影响"
 ashirra_army_doctrine_desc: "伊斯兰教的军队数量远不及基督教，但仍有一些军事教团。阿什拉派在这些组织中拥有一定的影响力，并在需要时毫不犹豫地加以使用。"
 ashirra_edict_tax: "确保麦地那"
 ashirra_tax_doctrine_name: "麦地那已确保"
 ashirra_tax_doctrine_desc: "麦地那是穆斯林城镇或城市的社会中心，也是阿什拉派对凡人事务影响最大的地方。"
 ashirra_edict_opinion: "忠实执行教法"
 ashirra_opinion_doctrine_name: "集结马格里布"
 ashirra_opinion_doctrine_desc: "马格里布是一群严峻而虔诚的阿什拉派，他们致力于铲除任何对信仰的威胁，无论是内部的还是外部的。"
 ashirra_edict_gain_fervor: "召集信众"
 fervor_gain_ashirra_edict: "阿什拉派法令"
 doctrine_parameter_ashirra_opinion_active: ""
 doctrine_parameter_opinion_of_ashirra_opinion_active: "对[Glossary('阿什拉派','game_concept_ashirra_desc')]有$VALUE|+=0$[opinion|E]加成"
 ashirra_opinion_active_opinion_name: "阿什拉派同僚"
 GAIN_ASHIRRA_INFLUENCE: "你获得$VALUE|+0$狂热"
 LOSE_ASHIRRA_INFLUENCE: "你失去$VALUE|-0$狂热"