l_simp_chinese:
 POD_fleshcrafting_tutorial: "六个身体部位各包含两层，#bold;clickable @flesh_icon!肉体#!与#bold;clickable @bone_icon!骨骼 #!。每个身体部位的每一层仅可进行一项改造。\n\n每项改造均带有#bold;clickable @vicissitude_icon!复杂度#!属性。改造的成功率由所有身体部位的总复杂度结合你的#bold;clickable [learning_i]学识#!及所有额外加成共同决定。\n\n点击左侧任意方框即可开始操作。"
 POD_fleshcrafting_title: "血肉塑造：#bold [GetPlayer.MakeScope.Var('fleshcraft_target').Char.GetFirstNameNoTooltip]#!"
