 custom_lungin_artifact_name: "隆金"
 custom_lungin_artifact_desc: "一根木制烟斗和各种草药。吸食这些草药可以舒缓身心。"
 custom_arrows_of_the_sun_artifact_name: "太阳之箭"
 custom_arrows_of_the_sun_artifact_desc: "这些箭矢蕴含着太阳的精华，并以黄金装饰。它们被注入了太阳之灵的碎片。箭矢击中目标后会燃烧殆尽，造成巨大的伤害。"
 custom_thunder_dart_artifact_name: "雷霆飞矛"
 custom_thunder_dart_artifact_desc: "这件强大的武器尺寸与一般投矛相当，却致命得多。当掷向敌人时，它会如雷霆般轰击目标，对敌人及其周围区域造成闪电伤害。这些飞矛以怪物之骨制成，尾部缀以彩羽，并将雷霆或降雨之灵哄引入其中寄宿。"
 custom_edge_of_the_sun_artifact_name: "[fetish_artifact_icon]太阳之锋"
 custom_edge_of_the_sun_artifact_desc: "这是一件由莫科莱持有的致命武器，专用于仪式决斗与处刑。 \"丧命于金刃之下\"是对违法者下场的惯用说法。此刀通体以纯金铸就，饰以宝石。锻造时须于日出熔金塑形，再附魔，使其坚硬如钢；随后将宝石镶入柚木柄中，最后使战争之灵寄宿。"
 custom_blade_of_the_kings_artifact_name: "[fetish_artifact_icon]诸王之刃"
 custom_blade_of_the_kings_artifact_desc: "#bold 将所有伤害转化为[POD_aggravated_damage|E]，目标的[prowess|E]必须低于此刃的[artifact_power_with_icon|E]。 #!\n\n这是一柄由古代莫科莱所持的远古之剑。昔日的蜥王长者在进入龙眠时，必以此刃伴侧。剑身会随持有者形态而变；当莫科莱化为半龙形之姿，诸王之刃亦随之改变，以匹配其巨大的战争形态。此类武器需于锻造时引入变形之灵——如蝴蝶之灵或章鱼之灵——并将其束缚于刃中。每一次锤击，无论是塑形金属还是石材，匠者皆须呼唤灵之名。"
 custom_fetish_artifact_desc: "一个由[artifact.MakeScope.GetVariable('crafter').GetCharacter.GetTitledFirstName]创造的[fetish|E]，一名[GetTrait('spirit').GetName(GetPlayer)]寄宿其中。"
