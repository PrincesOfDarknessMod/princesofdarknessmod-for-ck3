l_simp_chinese:
 pod_combat_tune_window_title: "#high;bold 战斗调校（调试）#!"
 pod_combat_tune_reset_all: "重置所有"
 pod_combat_tune_reset_all_tt: "移除所有调整过的覆盖项-恢复为默认设置"
 pod_combat_tune_footer: "#weak * =调整后的覆盖(保存在存档中)。AP/主动性/命中/等级调整键自下一回合或掷骰起生效；起始士气自下一场战斗起生效；装载上限在编辑器中设置。#!"
 pod_combat_tune_base_ap_label: "最大AP上限"
 pod_combat_tune_base_ap_tt: "每回合最大AP值（满格）。从下一回合开始生效。点数条最多显示6格。"
 pod_combat_tune_ap_regen_label: "每轮AP恢复"
 pod_combat_tune_ap_regen_tt: "每回合恢复的AP；未使用的AP会在该槽位累积，上限为AP上限。未设置时=整条能量条恢复满。战斗者的第一回合总是从满能量开始。"
 pod_combat_tune_ap_regen_clear_tt: "清除:每回合恢复至满格"
 pod_combat_tune_ap_cap_start_label: "AP上限开启（第1回合）"
 pod_combat_tune_ap_cap_start_tt: "升级上限:第1轮中的AP上限。仅在设置了每轮AP上限增减时才起作用。"
 pod_combat_tune_ap_cap_increment_label: "每回合AP上限+/"
 pod_combat_tune_ap_cap_increment_tt: "升级上限:每回合AP上限增加此数值（起始+N每回合），直至达到最大AP上限。清除=关闭。"
 pod_combat_tune_ap_cap_increment_clear_tt: "明确:没有升级上限。"
 pod_combat_tune_starting_morale_label: "起始士气"
 pod_combat_tune_starting_morale_tt: "每位参战者进入战斗时的士气（角色特质额外加成会叠加，下限为1）。下次战斗生效。"
 pod_combat_tune_max_morale_label: "士气上限（六格）"
 pod_combat_tune_max_morale_tt: "Morale ceiling for a 6-box combatant (vampire, kuei-jin, risen). Every wound box above or below 6 shifts that combatant's own ceiling by 5, so this moves the whole ladder rather than setting one flat cap. Drives heals and the end-of-fight strain deficit. Live."
 pod_combat_tune_morale_stress_mult_label: "士气->压力倍率"
 pod_combat_tune_morale_stress_mult_tt: "每点战斗结束时士气亏损造成的压力（精神消耗，在战斗结束时一次性施加）。"
 pod_combat_tune_max_per_category_label: "装备/类别"
 pod_combat_tune_max_per_category_tt: "每类装备上限(攻击/防御/控制/力量)。在配置编辑器中强制执行；点数条仍显示4格。战斗窗口加宽至每行可容纳5个以上的技能-超过5个时，可能会超出1920宽屏幕的范围。"
 pod_combat_tune_max_equipped_label: "配置总量"
 pod_combat_tune_max_equipped_tt: "所有类别上的总装备上限。在配装编辑器中强制执行。"
 pod_combat_tune_init_decouple_prowess_label: "主动:解除勇武关联"
 pod_combat_tune_init_decouple_prowess_tt: "Use a flat baseline instead of prowess as each combatant's initiative starting line. The baseline is the Init baseline knob below (default 20). Applies from the next roll."
 pod_combat_tune_init_decouple_prowess_cb_tt: "Use the flat Init baseline instead of prowess as the initiative starting line"
 pod_combat_tune_init_base_label: "Init baseline"
 pod_combat_tune_init_base_tt: "Flat initiative starting line used INSTEAD of prowess while decouple prowess is on (ignored otherwise). Applies from the next roll."
 pod_combat_tune_init_roll_max_label: "主动掷骰最大值"
 pod_combat_tune_init_roll_max_tt: "Random part of initiative: a roll of 1 to N added to the base (prowess, or the flat baseline if decoupled). 1 = near-deterministic (the base decides). Applies from the next roll."
 pod_combat_tune_init_celerity_bonus_label: "Init / speed perk"
 pod_combat_tune_init_celerity_bonus_tt: "在迅捷术(吸血鬼)或妖风(万鬼)速度树中每拥有一个技能所获得的主动性（0=关闭）。"
 pod_combat_tune_hit_base_label: "基础命中几率"
 pod_combat_tune_hit_base_tt: "勇武差距前的基础命中率。适用于下一次命中率重新计算时。"
 pod_combat_tune_hit_min_label: "最低命中几率"
 pod_combat_tune_hit_min_tt: "降低实际命中率下限。"
 pod_combat_tune_hit_max_label: "最大命中几率"
 pod_combat_tune_hit_max_tt: "对实时命中率上限(同时也限制条件性加成命中上限)。"
 pod_combat_tune_tier_small_label: "Tier small mag"
 pod_combat_tune_tier_small_tt: "Magnitude of tier-1 buffs and debuffs (soak and hit alike). Live via the recalcs."
 pod_combat_tune_tier_medium_label: "Tier medium mag"
 pod_combat_tune_tier_medium_tt: "Magnitude of tier-2 buffs and debuffs."
 pod_combat_tune_tier_large_label: "Tier large mag"
 pod_combat_tune_tier_large_tt: "Magnitude of tier-3 buffs and debuffs."
 pod_combat_tune_stealth_bonus_label: "潜行攻击加成"
 pod_combat_tune_stealth_bonus_tt: "潜行时命中率加成(将在下一次攻击时消耗)。帮助文本会一直显示+30，直到该数值得到提升。"
 pod_combat_tune_ai_trace_label: "AI决策追踪"
 pod_combat_tune_ai_trace_tt: "将每次AI动作选择和每次AI回合记录到debug.log(搜索“pod_combat_trace”)中，记录AI选择了什么、基于什么状态进行选择，以及每回合结束的原因。仅用于调试:开启时，每次动作选择的处理工作量大约会增加一倍。"
 pod_combat_tune_ai_trace_cb_tt: "将AI决策追踪追踪输出至debug.log(开启时影响性能)"
 pod_combat_tune_ai_hp_finish_label: "AI finish threshold"
 pod_combat_tune_ai_hp_finish_tt: "Empty wound boxes at or below which the AI treats an enemy as finishable - drives its emergency-heal restraint. Applies immediately. Default 1."
 pod_combat_tune_ai_band_width_label: "AI top-band width"
 pod_combat_tune_ai_band_width_tt: "How far below the BEST-scoring move a move may score and still be considered. Lower = sharper and more predictable; 0 means the AI always takes its top-scored move (plus ties). Raise it past ~100 and the band stops doing anything. Inside the band the AI still picks proportionally by score."
 pod_combat_tune_ai_kill_priority_label: "AI击杀优先级框"
 pod_combat_tune_ai_kill_priority_tt: "AI目标选择器将目标权重提升三倍（专注于濒死目标）时，目标箱为空或低于该值的状态。立即生效。默认值为2。"
 pod_combat_tune_ai_mor_finish_label: "AI morale-finish threshold"
 pod_combat_tune_ai_mor_finish_tt: "Enemy morale at or below which the AI counts that enemy as finishable by morale damage. Feeds the finishable flag, and through it the intent lottery's kill bonuses and a dying actor's restraint about healing instead of finishing. Target SELECTION is the morale kill-priority row below, not this one. Applies immediately. Default 2."
 pod_combat_tune_ai_mor_kill_label: "AI士气击杀优先级"
 pod_combat_tune_ai_mor_kill_tt: "敌方士气低于或等于该值时，AI目标选择器会将此目标的权重提高三倍，前提是攻击方确实能造成士气伤害。这是击杀优先级框的士气对应机制。请将其设定为不低于士气终结阈值，否则AI会集中攻击无法终结的敌人。此效果立即生效。默认值为3。"
 pod_combat_tune_init_reroll_label: "Initiative: reroll each round"
 pod_combat_tune_init_reroll_tt: "Re-roll every combatant's initiative at the start of each round, instead of keeping the roll they entered the fight with. Off by default. Initiative debuffs are a one-round shift either way."
 pod_combat_tune_init_reroll_cb_tt: "Re-roll initiative every round instead of keeping the roll each combatant entered with"