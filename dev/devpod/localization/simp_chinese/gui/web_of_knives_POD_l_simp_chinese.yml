l_simp_chinese:
 kill_reward:0 "悬赏完成"
 POD_web_of_knives.7.t:0 "刀锋之网"
 POD_web_of_knives.7.desc:0 "哈基姆的子嗣们有一个长久以来的传统——尽管内部对其有激烈的争论——那就是为其他吸血鬼充当雇佣兵或杀手。在秘密的 刀锋之网派系的组织下，这些赏金为冒险的哈基姆圣裔带来了巨大的财富（也带来了[diablerie|E]不太谨慎的目标的机会）。虽然没有任何一个氏族成员被迫遵循这做法，但他们中的大多数人至少会涉足这种做法，至少可以加强其他吸血鬼对哈基姆圣裔人都是不能招惹的嗜血杀手的误解。\n#X 刀锋之网是哈基姆圣裔的一个决定性特征。你会定期收到完成悬赏的邀请。如果你接受，胜利将为你带来金币、声望和进行[diablerie|E]的机会。#! "
 POD_web_of_knives.7.a:0 "保持一个正面的声誉。"
 POD_web_of_knives.10.t:0 "The Price on their Head"
 POD_web_of_knives.10.desc:0 "You have contacted the shadowy organization known as the Web of Knives intend on putting a target on your rival's head. Their conditions are as such : you pay half the gold right now and half on fulfillment of the contract. The more you pay, the more skilled of a Web member they will send. No refund of your first half if the hit fails.\nThere is also this strange demand of you giving a small drop of your blood to apparently be shipped to the grandmaster of their order but they reassure you that it's only a tradition and nothing more sinister. If you can't trust hired killers, who can you trust really?"
 POD_web_of_knives.10.a:0 "一小笔钱就足够了。"
 wok_reward_low_tt:0 "If your target has more than 10 intrigue or 20 prowess, this option has no chance of success.\nYou will get a result in a couple of months.\nBetter options are available only in areas with a strong Web of Knives presence."
 POD_web_of_knives.10.b:0 "我可以提供更多。"
 wok_reward_medium_tt:0 "If your target has more than 15 intrigue or 30 prowess, this option has no chance of success.\nYou will get a result in a couple of months.\nBetter options are available only in areas with a strong Web of Knives presence."
 POD_web_of_knives.10.c:0 "I am a vampire of means."
 wok_reward_high_tt:0 "If your target has more than 20 intrigue or 40 prowess, this option has no chance of success.\nYou will get a result in a couple of months.\nOnly available where the Web of Knives presence is historically strong."
 POD_web_of_knives.10.d:0 "我要他们死！"
 wok_reward_very_high_tt:0 "If your target has more than 25 intrigue or 50 prowess, this option has no chance of success.\nYou will get a result in a couple of months.\nOnly available where the Web of Knives presence is historically at its strongest."
 POD_web_of_knives.10.e:0 "On second thought..."
 POD_web_of_knives.11.desc:0 "It has been a few months since you contacted the Web of Knives for their help in fixing your little problem. You have been keeping tabs on your rival and have recently learned of an assassination attempt targeting them. While their court is abuzz, you are thankful for the professionalism of the Web that makes sure that, whatever the result is, the event can't be traced back to you.\nNow, you only need to check if they were successful or not..."
 POD_web_of_knives.11.a:0 "They did it! Now to pay the other half..."
 POD_web_of_knives.11.b:0 "They failed! Useless thugs..."
 web_of_knives_diablerie_tt:0 "A duel to the death. You will be offered to perform a [diablerie|E] if you win."
 POD_web_of_knives.600.t:0 "Their Head and their Soul"
 POD_web_of_knives.600.desc:0 "Your direct assault against your victim paid off. They stand cowed before you, unable to muster any resistance to your next actions. A simple, clean, death would fulfill the contract and gives you the promised rewards but you also know that the Web of Knives encourages [diablerie|E] as part of the victor's spoils.\nThe allure is certainly there, with your defeated foe's blood calling to you, begging to be put to a more useful purpose..."
 POD_web_of_knives.600.option.a:0 "Your head and your soul."
 POD_web_of_knives.600.option.b:0 "Your head will suffice."
 POD_web_of_knives.13.desc:0 "Your contact in the Web of Knives has recently informed you of a contract being put on the head of a vampire in your area. The Web has several agents that could try to fulfill this mission but you get the first pick if you wish to pursue it yourself.\nAs always, two options lie before you. A subtle murder could work and leave you far from the (probably very angry) potential victim if things were to go south, or you could go for a more \"hands on\" approach. This is obviously way riskier but also the only way to ensure the potential for a [diablerie|E] in the end..."
 POD_web_of_knives.13.a:0 "No need for unnecessary risks."
 wok_intrigue_duel_tt:0 "This option doesn't risk you more than a prestige loss if you fail. You won't get a chance to diablerize your victim if you win however."
 POD_web_of_knives.13.effect.success.desc:0 "Silent and deadly"
 POD_web_of_knives.13.critical.failure.effect.desc:0 "失败……"
 POD_web_of_knives.13.b:0 "直接袭击！"
 POD_web_of_knives.13.c:0 "I won't take this contract."