 tab_tremere_council:0 "#T Inner Council#!"
 tremere_council_tab_tt:0 "Inner Council"
 tremere_council_intro:0 "The Inner Council leads Clan Tremere in its founder's stead. Each Councilor gives a specific doctrine to the Code of Tremere faith.\nIf a Councilor dies, converts away from the Code of Tremere or falls to 0 influence, they are replaced by someone Tremere himself deems worthy.\nA special character interaction with the Councilors allows you to ask for a boon, or raise/hinder their influence."
 council_influence_loc:0 "Influence"
 generic_prowess_council_doctrine_name:0 "Prowess Councilor"
 generic_prowess_council_doctrine_desc:0 "Having at least one Councilor with a Prowess education is bringing this doctrine for the Tremere."
 generic_intrigue_council_doctrine_name:0 "Intrigue Councilor"
 generic_intrigue_council_doctrine_desc:0 "Having at least one Councilor with an Intrigue education is bringing this doctrine for the Tremere."
 generic_stewardship_council_doctrine_name:0 "Stewardship Councilor"
 generic_stewardship_council_doctrine_desc:0 "Having at least one Councilor with a Stewardship education is bringing this doctrine for the Tremere."
 generic_learning_council_doctrine_name:0 "Learning Councilor"
 generic_learning_council_doctrine_desc:0 "Having at least one Councilor with a Learning education is bringing this doctrine for the Tremere."
 generic_martial_council_doctrine_name:0 "Martial Councilor"
 generic_martial_council_doctrine_desc:0 "Having at least one Councilor with a Martial education is bringing this doctrine for the Tremere."
 generic_diplomacy_council_doctrine_name:0 "Diplomacy Councilor"
 generic_diplomacy_council_doctrine_desc:0 "Having at least one Councilor with a Diplomacy education is bringing this doctrine for the Tremere."
 abetorius_council_doctrine_name:0 "Councilor Abetorius"
 abetorius_council_doctrine_desc:0 "Despite many setbacks, Abetorius has Tremere's trust in his ability to understand and manipulate foreign interests to the clan's benefit."
 grimgroth_council_doctrine_name:0 "Councilor Grimgroth"
 grimgroth_council_doctrine_desc:0 "Grimgroth betrayed his Hermetic colleagues, ushering a never ending war between them and the Order of Reason. He has been appropriately rewarded by Tremere for this deed."
 astio_council_doctrine_name:0 "Councilor Astio Giavetti"
 astio_council_doctrine_desc:0 "The old mentor is more at ease practicing his craft than politicking around the Council, making him a mostly dismissed force in the Pyramid."
 leduc_council_doctrine_name:0 "Councilor LeDuc"
 leduc_council_doctrine_desc:0 "LeDuc is more loyal than he is brilliant, but loyalty has its own perks."
 calderon_council_doctrine_name:0 "Councilor Calderon"
 calderon_council_doctrine_desc:0 "Calderon is quick to anger and slow to forgive. The slow moving Clan Tremere is roused to action by his wrath."
 xavier_council_doctrine_name:0 "Councilor Xavier de Cincao"
 xavier_council_doctrine_desc:0 "Xavier is a skilled coordinator, capable of handling several matters across a large region. His single mindedness on some specific tasks sometimes borders on the pathological however."
 meerlinda_council_doctrine_name:0 "Councilor Meerlinda"
 meerlinda_council_doctrine_desc:0 "The diplomatic Meerlinda is the true heart of the Council, the one that holds the Pyramid together despite its best efforts to crumble."
 goratrix_council_doctrine_name:0 "Councilor Goratrix"
 goratrix_council_doctrine_desc:0 "Goratrix lost his initial power struggle with Etrius, but it will take far more than that to really keep him down."
 etrius_council_doctrine_name:0 "Councilor Etrius"
 etrius_council_doctrine_desc:0 "The loyal one sits at the top of the Pyramid, keeping it stable in Tremere's stead."
 POD_tremere_council_interaction:0 "Audience with the Councilor"
 POD_tremere_council_interaction_desc:0 "Use your Piety to increase or decrease the Councilor's influence, or ask for a boon."
