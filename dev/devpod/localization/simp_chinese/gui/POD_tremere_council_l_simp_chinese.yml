 pod_tremere_council.2.t: "与议员会面"
 pod_tremere_council.2.desc: "睿魔尔的内部议会代替睿魔尔处理大部分的氏族事务。众所周知，睿魔尔有时会醒来并发布自己的法令，因此议员总是在争夺权力和影响力，希望能取悦他们的主人（或至少不使他不高兴）。\n在这场永恒的斗争中，所有的睿魔尔都扮演着自己的身份，创建了一些追随者小团体来赞扬他们的天选领袖，并希望在时机成熟时从他们那里获得回报。"
 pod_tremere_council.2.a: "赞美议员"
 pod_tremere_council.2.b: "贬低议员"
 pod_tremere_council.2.c: "向议员讨要恩典"
 tremere_council_gain_influence_tt: "该议员获得10影响力"
 tremere_council_lose_influence_tt: "该议员失去10影响力。\n如果影响力等于低于0，其将被从议会中移除。"
 pod_tremere_council.4.t: "金字塔之顶"
 pod_tremere_council.4.desc: "内部议会露出一个空缺，像往常一样，整个金字塔都在等待睿魔尔关于谁将成为受选者的通知。睿魔尔对此的思考过程和预期的一样神秘，但是，除了一些“奇怪”的选择之外，它似乎大多遵循政治规律。一个睿魔尔越强大，他们对睿魔尔法典表现得越热心，他们就越有可能被任命为内环议员。\n最后，在经历了一段紧张的等待期后，你会被目前的内环成员告知一个消息，睿魔尔已经选择了你。他们中的一些人似乎很高兴，另一些人则不高兴，但这是睿魔尔的意愿，因此，它已成事实。"
 pod_tremere_council.4.a: "阶梯已被登上"
 tremere_council_entry_tt: "你现在是睿魔尔内环的一员了"
 pod_tremere_council.6.t: "内环"
 pod_tremere_council.6.desc: "内部议会代替创始人领导睿魔尔家族。这些强大的吸血鬼由睿魔尔亲自挑选，是$pod_clan$的真正领导者，因为创始人要么处于[Glossary('蛰眠','game_concept_torpor_desc')]，要么被更重要的事务所困扰。他们是家族的核心人物，他们的教义和政治是所有忠诚的睿魔尔都要遵循的。\n#X 内环是忠于法典的睿魔尔的一个决定性特征。你可以在屏幕右侧的选项卡中获知它的信息。#!"
 pod_tremere_council.6.a: "金字塔矗立在纪律之上"
 pod_tremere_council.7.t: "金字塔争斗"
 pod_tremere_council.7.desc: "作为睿魔尔$pod_clan$的最高权力机构，除了创始人本人之外，内部议会显然是阴谋和竞争的温床。每位议员都想中伤他们的同事，提升自己对睿魔尔的好感，从而导致（通常是相当小的）冲突，可以在整个金字塔内产生回响。\n最近爆发了一场这样的冲突，许多人站在一边，说出他们自己的疑虑和关于争斗中的议员们的谣言，以增加火势。"
 pod_tremere_council.7.c: "这不是我该做的事。"
 pod_tremere_council.7.a: "[councilor1.GetFirstName]做了很多错事……"
 pod_tremere_council.7.b: "[councilor2.GetFirstName]并不对睿魔尔忠诚！"
 pod_tremere_council.8.t: "金字塔赞誉"
 pod_tremere_council.8.desc: "为争夺在议员中的影响力而进行的影子战争有许多不同的方式。从有影响力的睿魔尔那里收集支持是其中之一，一位议员已经为你争取了一段时间的支持。你的新“朋友”现在希望你能公开你对其的重视，小动作、奉承和赤裸裸的贿赂都可行。"
 pod_tremere_council.8.a: "客观上来讲，你是最棒的！"
 pod_tremere_council.8.b: "我对这种小打小闹的政治不感兴趣。"
 pod_tremere_council.8.c: "当然，我的支持很有价值……"
 pod_tremere_council.9.t: "金字塔知识"
 pod_tremere_council.9.desc: "你最近找到了一本关于你最新研究的重要书籍，幸运的是，它在睿魔尔$pod_clan$手中。更确切地说，是在一位议员的私人图书馆里。你可以提出正式的（相当艰难的）使用请求，或者采用一些老式的贿赂手段。毕竟，即使是知识也是有代价的。"
 pod_tremere_council.9.a: "发出正式请求。"
 pod_tremere_council.9.b: "向私人图书馆捐款是有必要的……"
 pod_tremere_council.9.c: "我不想要这本书了。"
 pod_tremere_council.10.t: "金字塔赞助"
 pod_tremere_council.10.desc: "一位议员对你感兴趣，并提出了建立研究伙伴关系的建议。在一起，你们可以为睿魔尔$pod_clan$（以及你们自己）在解开血族秘密方面取得巨大进展。然而，两个强大的奇术师之间的联盟往往很难达成，拒绝这个提议并继续自己一人可能会更轻松。"
 pod_tremere_council.10.a: "我们将取得伟大的成就！"
 pod_tremere_council.10.b: "也许就部分时间？"
 pod_tremere_council.10.c: "我不需要任何帮助！"
 pod_tremere_council.11.t: "金字塔密谋"
 pod_tremere_council.11.desc: "当你在处理另一件事时，你最近发现了一位议员的一些污点。问题不是很大，但如果这些敏感的信息被公开，足以让其的影响力受到影响。然而，这很可能会导致你和其之间的裂痕，你可以考虑直接将信息传递给其，以从这件事中获得一些善意。"
 pod_tremere_council.11.a: "睿魔尔家族必须知道真相！"
 pod_tremere_council.11.b: "让我们忘掉这失误。"
 window_council_session_tooltip: "内环会议允许内环讨论睿魔尔的政治并为家族提供有用的指导……或者只是在他们之间无休止地争吵。\n只有议员才可以启动议会会议。\n每20年只允许一次。"
 Council_Session: "#V 内环会议#!"
 pod_tremere_council.12.t: "内环会议"
 pod_tremere_council.12.desc: "内环很少聚会，但当他们聚会时，总是场重要事件。这里蕴藏着睿魔尔家族的真正力量，精心挑选的议员们为整个金字塔的荣耀而不懈努力着。\n至少，那是官方的说法。\n大多数时候，这些会议都会演变成敌对议员之间无益的争吵和谩骂，除了侮辱和威胁之外，没有什么成果。不过，如果你想在氏族事务中做出真正地改变，这就是它发生的地方。"
 tremere_council_player_lose_influence_tt: "你失去10影响力。\n如果影响力等于低于0，你将被从睿魔尔议会中移除。"
 tremere_council_gold_tt: "每位公爵或以上的忠诚睿魔尔将获得100金钱。"
 pod_tremere_council.12.a: "资助我们忠诚的族员们的努力！"
 tremere_council_military_tt: "你将可以选择数个睿魔尔武器库中的奇特玩意。"
 pod_tremere_council.12.b: "我们需要所有能得到的帮助……"
 pod_tremere_council.12.c: "我们必须对我们的敌人进行打击！"
 tremere_council_aggressive_tt: "每位公爵或以上的忠诚睿魔尔将获得持续十年的修正，增加参战的可能性和一些以压力为代价的军事进攻增益。"
 pod_tremere_council.12.d: "加强我们的防卫是关键。"
 tremere_council_defensive_tt: "每位公爵或以上的忠诚睿魔尔将获得持续十年的修正，减少参战的可能性和一些以压力为代价的军事防御增益。"
 tremere_council_player_gain_influence_tt: "你获得10影响力"
 pod_tremere_council.12.e: "在本届会议就单单玩政治游戏。"
 aggressive_order_modifier: "侵略主义"
 aggressive_order_modifier_desc: "内环已经下令，金字塔必须大胆地对抗它的敌人，睿魔尔家族将遵从。"
 defensive_order_modifier: "防御主义"
 defensive_order_modifier_desc: "内环已经下令，金字塔必须专注于加强其防御，睿魔尔家族将遵从。"
 pod_tremere_council.13.t: "军事事务"
 pod_tremere_council.13.desc: "睿魔尔家族有很多敌人，这不是什么大秘密。如果不是因为它在创造各种用于战争的畸形怪物方面的聪明才智（和缺乏克制），该氏族早就垮台了。\n石像鬼只是官方的、可见的、冰山一角。有很多由格拉崔克斯和维斯塔尼亚创造的更令人不安的实验品，如果内部议会批准的话，这些实验品可以被释放出来……"
 pod_tremere_council.13.a: "我们只是需要更多的石像鬼！"
 tremere_council_gargoyles_tt: "每位公爵或以上的忠诚睿魔尔将获得两组[GetMaA('gargoyle_warriors').GetName]。"
 pod_tremere_council.13.b: "像尖喙老鼠一样的狼？真的？"
 tremere_council_chitterers_tt: "忠诚睿魔尔现在可以招募[GetMaA('chitterers').GetName]。"
 pod_tremere_council.13.c: "装有刀片的甲虫？再多说一些……"
 tremere_council_reapers_tt: "忠诚睿魔尔现在可以招募[GetMaA('reapers').GetName]。"
 pod_tremere_council.13.d: "一群食肉虫群听起来很有意思……"
 tremere_council_skin_eaters_tt: "忠诚睿魔尔现在可以招募[GetMaA('skin_eaters').GetName]。"
 pod_tremere_council.13.e: "我们的军队就现在这样很好。"
 pod_gui_nick: "#V “[Character.GetNicknameNoTooltip|U]”#!"
 pod_tremere_council.30.t: "席位空缺？"
 pod_tremere_council.30.desc: "睿魔尔金字塔最近盛传内部议会有一个席位空缺。由于金字塔的最高层并不愿意透露内部交易的信息，所以细节还很模糊。无论这个空缺的原因是什么，所有忠诚的睿魔尔都在等待他们的创始人宣布接替人选。\n虽然睿魔尔的行事方式难以捉摸，但对于任何一位未来的议员来说，现在也许是证明自己忠于法典、对功业尽心尽力的好时机。"
 entry_tremere_council_tt: "你将被选为最新的睿魔尔议员。该选项的费用取决于各种因素，如你的声望、头衔等级和领地规模。"