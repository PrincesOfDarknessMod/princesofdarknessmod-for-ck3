l_simp_chinese:
 tab_tremere_council:0 "#T 内环议会#!"
 tremere_council_tab_tt:0 "内环议会"
 tremere_council_intro:0 "内环议会代替其创始人领导睿魔尔氏族。每位议员都为睿魔尔法典信仰提供特定的教义。\n如果一位议员死亡、不再信仰睿魔尔法典或者影响力下降到0，他们会被睿魔尔本人认为配得上的人取代。\n与议员们的专属角色互动允许你要求一种恩典，或者提高/降低他们的影响力。"
 council_influence_loc:0 "影响力"
 generic_prowess_council_doctrine_name:0 "勇武议员"
 generic_prowess_council_doctrine_desc:0 "因有一名有勇武教育特质的议员为睿魔尔带来了该教义。"
 generic_intrigue_council_doctrine_name:0 "谋略议员"
 generic_intrigue_council_doctrine_desc:0 "因有一名有谋略教育特质的议员为睿魔尔带来了该教义。"
 generic_stewardship_council_doctrine_name:0 "管理议员"
 generic_stewardship_council_doctrine_desc:0 "因有一名有管理教育特质的议员为睿魔尔带来了该教义。"
 generic_learning_council_doctrine_name:0 "学识议员"
 generic_learning_council_doctrine_desc:0 "因有一名有学识教育特质的议员为睿魔尔带来了该教义。"
 generic_martial_council_doctrine_name:0 "军事议员"
 generic_martial_council_doctrine_desc:0 "因有一名有军事教育特质的议员为睿魔尔带来了该教义。"
 generic_diplomacy_council_doctrine_name:0 "外交议员"
 generic_diplomacy_council_doctrine_desc:0 "因有一名有外交教育特质的议员为睿魔尔带来了该教义。"
 abetorius_council_doctrine_name:0 "议员阿贝托留斯"
 abetorius_council_doctrine_desc:0 "尽管有很多挫折，但阿贝托留斯得到了睿魔尔的信任，相信他有能力了解并操纵外国利益，为氏族谋取利益。"
 grimgroth_council_doctrine_name:0 "议员古林格罗斯"
 grimgroth_council_doctrine_desc:0 "古林格罗斯背叛了他的赫耳墨斯同僚，让他们与理性之子引发了一场无休止的战争。他这一行为得到了睿魔尔的适当奖励。"
 astio_council_doctrine_name:0 "议员阿斯蒂奥·贾维蒂"
 astio_council_doctrine_desc:0 "这位老导师更乐于实践他的手艺，而不是在议会周围搞政治活动，这使他在金字塔中成为一股游离的大势力。"
 leduc_council_doctrine_name:0 "议员勒杜克"
 leduc_council_doctrine_desc:0 "勒杜克的才华比不上他的忠诚，但忠诚有它的好处。"
 calderon_council_doctrine_name:0 "议员卡尔德隆"
 calderon_council_doctrine_desc:0 "卡尔德隆发怒快，原谅慢。行动迟缓的睿魔尔氏族被他的怒火唤起了行动。"
 xavier_council_doctrine_name:0 "议员哈维尔·德·辛考"
 xavier_council_doctrine_desc:0 "哈维尔是一位训练有素的协调人，能够在一个大区域内处理若干事务。然而，他对某些特定任务的一心一意有时近乎于病态。"
 meerlinda_council_doctrine_name:0 "议员梅琳达"
 meerlinda_council_doctrine_desc:0 "外交家梅琳达是议会的真正核心，尽管金字塔危如累卵，但她仍能将金字塔支撑起来。"
 goratrix_council_doctrine_name:0 "议员格拉崔克斯"
 goratrix_council_doctrine_desc:0 "格拉崔克斯在与埃特里乌斯的最初权力斗争中败下阵来，但要真正压制他，需要的远不止这些。"
 etrius_council_doctrine_name:0 "议员埃特里乌斯"
 etrius_council_doctrine_desc:0 "忠诚者坐在金字塔的顶端，代替睿魔尔保持它的稳定。"
 POD_tremere_council_interaction:0 "与议员会面"
 POD_tremere_council_interaction_desc:0 "用你的虔诚来增加或减少议员的影响力，或要求得到恩典。"
