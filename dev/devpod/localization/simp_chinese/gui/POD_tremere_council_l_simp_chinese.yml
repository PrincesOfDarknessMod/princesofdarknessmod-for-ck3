 pod_tremere_council.2.t:0 "与议员会面"
 pod_tremere_council.2.desc:0 "睿魔尔的内环议会代替睿魔尔处理大部分的氏族事务。众所周知，睿魔尔有时会醒来并发布自己的法令，因此议员总是在争夺权力和影响力，希望能取悦他们的主人（或至少不使他不高兴）。\n在这场永恒的斗争中，所有的睿魔尔都扮演着自己的身份，创建了一些追随者小团体来赞扬他们的天选领袖，并希望在时机成熟时从他们那里获得回报。"
 pod_tremere_council.2.a:0 "赞美议员"
 pod_tremere_council.2.b:0 "贬低议员"
 pod_tremere_council.2.c:0 "向议员讨要恩典"
 tremere_council_gain_influence_tt:0 "该议员获得10影响力"
 tremere_council_lose_influence_tt:0 "该议员失去10影响力。\n如果影响力等于低于0，其将被从议会中移除。"
 pod_tremere_council.4.t:0 "金字塔之顶"
 pod_tremere_council.4.desc:0 "内环议会露出一个空缺，像往常一样，整个金字塔都在等待睿魔尔关于谁将成为受选者的通知。睿魔尔对此的思考过程和预期的一样神秘，但是，除了一些“奇怪”的选择之外，它似乎大多遵循政治规律。一个睿魔尔越强大，他们对睿魔尔法典表现得越热心，他们就越有可能被任命为内环议员。\n最后，在经历了一段紧张的等待期后，你会被目前的内环成员告知一个消息，睿魔尔已经选择了你。他们中的一些人似乎很高兴，另一些人则不高兴，但这是睿魔尔的意愿，因此，它已成事实。"
 pod_tremere_council.4.a:0 "阶梯已被登上"
 tremere_council_entry_tt:0 "你现在是睿魔尔内环的一员了"
 pod_tremere_council.6.t:0 "内环"
 pod_tremere_council.6.desc:0 "内环议会代替创始人领导睿魔尔家族。这些强大的吸血鬼由睿魔尔亲自挑选，是[Clan|E]的真正领导者，因为创始人要么处于[torpor|E]，要么被更重要的事务所困扰。他们是家族的核心人物，他们的教义和政治是所有忠诚的睿魔尔都要遵循的。\n#X 内环是忠于法典的睿魔尔的一个决定性特征。你可以在屏幕右侧的选项卡中获知它的信息。#!"
 pod_tremere_council.6.a:0 "金字塔矗立在纪律之上"
 pod_tremere_council.7.t:0 "金字塔争斗"
 pod_tremere_council.7.desc:0 "作为睿魔尔[Clan|E]的最高权力机构，除了创始人本人之外，内环议会显然是阴谋和竞争的温床。每位议员都想中伤他们的同事，提升自己对睿魔尔的好感，从而导致（通常是相当小的）冲突，可以在整个金字塔内产生回响。\n最近爆发了一场这样的冲突，许多人站在一边，说出他们自己的疑虑和关于争斗中的议员们的谣言，以增加火势。"
 pod_tremere_council.7.c:0 "这不是我该做的事。"
 pod_tremere_council.7.a:0 "[councilor1.GetFirstName]做了很多错事……"
 pod_tremere_council.7.b:0 "[councilor2.GetFirstName]并不对睿魔尔忠诚！"
 pod_tremere_council.8.t:0 "金字塔赞誉"
 pod_tremere_council.8.desc:0 "为争夺在议员中的影响力而进行的影子战争有许多不同的方式。从有影响力的睿魔尔那里收集支持是其中之一，一位议员已经为你争取了一段时间的支持。你的新“朋友”现在希望你能公开你对其的重视，小动作、奉承和赤裸裸的贿赂都可行。"
 pod_tremere_council.8.a:0 "客观上来讲，你是最棒的！"
 pod_tremere_council.8.b:0 "我对这种小打小闹的政治不感兴趣。"
 pod_tremere_council.8.c:0 "当然，我的支持很有价值……"
 pod_tremere_council.9.t:0 "金字塔知识"
 pod_tremere_council.9.desc:0 "你最近找到了一本关于你最新研究的重要书籍，幸运的是，它在睿魔尔[Clan|E]手中。更确切地说，是在一位议员的私人图书馆里。你可以提出正式的（相当艰难的）使用请求，或者采用一些老式的贿赂手段。毕竟，即使是知识也是有代价的。"
 pod_tremere_council.9.a:0 "发出正式请求。"
 pod_tremere_council.9.b:0 "向私人图书馆捐款是有必要的……"
 pod_tremere_council.9.c:0 "我不想要这本书了。"
 pod_tremere_council.10.t:0 "金字塔赞助"
 pod_tremere_council.10.desc:0 "一位议员对你感兴趣，并提出了建立研究伙伴关系的建议。在一起，你们可以为睿魔尔[Clan|E]（以及你们自己）在解开血族秘密方面取得巨大进展。然而，两个强大的奇术师之间的联盟往往很难达成，拒绝这个提议并继续自己一人可能会更轻松。"
 pod_tremere_council.10.a:0 "我们将取得伟大的成就！"
 pod_tremere_council.10.b:0 "也许就部分时间？"
 pod_tremere_council.10.c:0 "我不需要任何帮助！"
 pod_tremere_council.11.t:0 "金字塔密谋"
 pod_tremere_council.11.desc:0 "当你在处理另一件事时，你最近发现了一位议员的一些污点。问题不是很大，但如果这些敏感的信息被公开，足以让其的影响力受到影响。然而，这很可能会导致你和其之间的裂痕，你可以考虑直接将信息传递给其，以从这件事中获得一些善意。"
 pod_tremere_council.11.a:0 "睿魔尔家族必须知道真相！"
 pod_tremere_council.11.b:0 "让我们忘掉这失误。"