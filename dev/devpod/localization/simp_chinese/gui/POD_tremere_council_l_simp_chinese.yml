 pod_tremere_council.2.t:0 "An Audience with the Councilor"
 pod_tremere_council.2.desc:0 "The Inner Council of the Tremere handles most of the Clan's affairs in Tremere's stead. As Tremere is known to sometimes wake up and issue his own edicts, the Councilors are always jockeying for power and influence, hoping to please their master (or at least not displease him).\nIn this eternal struggle, all Tremere play their part, creating cliques of followers praising their chosen champion and hoping to reap rewards from them when the time comes."
 pod_tremere_council.2.a:0 "Praise the Councilor"
 pod_tremere_council.2.b:0 "Hinder the Councilor"
 pod_tremere_council.2.c:0 "Ask the Councilor for a boon"
 tremere_council_gain_influence_tt:0 "The Councilor will gain 10 influence"
 tremere_council_lose_influence_tt:0 "The Councilor will lose 10 influence"
 pod_tremere_council.4.t:0 "Top of the Pyramid"
 pod_tremere_council.4.desc:0 "A vacancy on the Inner Council has just opened and, as always, the entire Pyramid is waiting for Tremere's call on who will be the chosen one. Tremere's thought process about this is as arcane as expected but, besides a few \"odd\" choices, it seems to mostly follow political lines. The more powerful a Tremere is, and the more zeal they show in the Code of Tremere, the more likely they will be to be appointed on the Inner Circle.\nAnd finally, after a stressful waiting period, you are presented with the news by the current Circle members, Tremere has chosen you. Some of them seem pleased, others unhappy but it is Tremere's will and as such, it is now a fact."
 pod_tremere_council.4.a:0 "The ladder is climbed"
 tremere_council_entry_tt:0 "You are now part of the Tremere Inner Circle"
 pod_tremere_council.6.t:0 "The Inner Circle"
 pod_tremere_council.6.desc:0 "The Inner Council leads House Tremere in its founder's stead. Those powerful vampires, handpicked by Tremere himself, are the true leaders of the [Clan|E], as the founder is either in [torpor|E] or preoccupied by more important affairs. At their core, they are the defining masterminds of the House, and their doctrines and politics are to be followed by all loyal Tremere.\n #X The Inner Circle is a defining feature of the Tremere loyal to the Code. You can get access to it in a tab on the right of your screen.#! "
 pod_tremere_council.6.a:0 "The Pyramid stands on discipline"