 game_concept_pod_combat_encounter: "战斗遭遇"
 game_concept_pod_combat_encounter_with_icon: "@pod_combat_encounter_icon!战斗遭遇"
 game_concept_pod_combat_encounters: "战斗遭遇"
 game_concept_pod_combat_encounters_with_icon: "@pod_combat_encounter_icon!战斗遭遇"
 game_concept_pod_combat_encounter_desc: "回合制战斗小游戏，在两个或更多角色以暴力解决分歧时启用。\n\n战斗者轮流花费[pod_combat_action_points|E]使用[pod_combat_skills|E]，直到敌人[pod_combat_knocked_out|E]。\n\n可以从[splat|E]特质、技能和其他来源解锁大量不同的[pod_combat_skills|E]。它们可以对[POD_health_track|E]或[pod_combat_morale|E]造成伤害，施加增益和减益，施加如[pod_combat_guard_with_icon|E]、[pod_combat_dodge_with_icon|E]或[pod_combat_stealth_with_icon|E]等姿态，以及更多。\n\n[prowess_i][prowess|E]是战斗中的重要因素，因为它决定[pod_combat_hit_chance|E]和[pod_combat_initiative|E]。\n\n#I 如需更深入地了解战斗机制，请点击战斗界面中的#bold 帮助#!按钮。#!"
 game_concept_pod_combat_skill: "战斗技能"
 game_concept_pod_combat_skills: "战斗技能"
 game_concept_pod_combat_skill_desc: "#I 在战斗前使用#bold [SelectLocalization(IsInGame,'pod_combat_configure_skills_link_ingame','pod_combat_configure_skills')]#![decision|E]来选择技能配置。#!\n\n这些技能会在[pod_combat_encounters_with_icon|E]中使用。战斗技能分为四类：\n\n#color_red;bold ATK（攻击）：#!对[POD_health_track|E]造成伤害。部分技能具有[POD_damage_types|E]，例如[fire_damage_short_with_icon]或[silver_damage_short_with_icon]。\n\n#color_light_blue;bold DEF（防御）：#!治疗、提高[soak_damage|E]或[pod_combat_hit_chance|E]，或施加如[pod_combat_guard_with_icon|E]、[pod_combat_dodge_with_icon|E]或[pod_combat_stealth_with_icon|E]等姿态。\n\n#color_porple;bold CTL（控制）：#!对[pod_combat_morale|E]造成伤害，削弱敌人的[soak_damage|E]或[pod_combat_hit_chance|E]，或抽取其[pod_combat_ap|E]。\n\n#color_pwr_orange;bold PWR（强力）：#!强大的终结技，通常带有使用限制。\n\n每个类别可装备#V;bold 4#!个技能，总共#V;bold 16#!个。\n\n战斗技能消耗[pod_combat_action_points|E]#V （AP）#!，并可能具有其他消耗，例如[hunger_with_icon|E]或[gold_i][gold|E]。"
 game_concept_pod_combat_morale: "士气"
 game_concept_pod_combat_morale_icon: "@stress_icon!"
 game_concept_pod_combat_morale_desc: "战斗中，战斗者的#bold 心理韧性#!士气通常从满值开始，并会在直接精神攻击、恐吓及其他压力下下降。每次命中在[soak_damage|E]后实际造成的每个生命格也会扣除#N 2#!点士气。\n\n当发生以下任一情况时，战斗者将被判定为#N 失能#!并从战斗中移除：\n$TAB$-士气降至#N 零#!\n$TAB$-其[POD_health_track|E]完全填满\n$TAB$-其死亡、变得#N 无法行动#!、进入蛰眠状态，或被困于黯影界或深渊中\n\n当一名战斗者倒下时，每名幸存的队友会因震惊而失去#N 2#!点士气。此损失士气为1时停止，因此震惊本身不会击倒任何人。\n\n在训练之外，每名存活人员在战斗结束时，会因每点尚未恢复的士气获得#N 5#!点[static_stress|E]。在战斗结束前恢复士气可以减少这种持续的负担。训练战斗不会施加持续的精神负担。"
 game_concept_pod_combat_hit_chance: "命中几率"
 game_concept_pod_combat_hit: "命中"
 game_concept_pod_combat_accuracy: "Accuracy"
 game_concept_pod_combat_hit_chance_desc: "对于需要#bold 命中检定#!的技能，命中几率是成功通过该判定的百分比概率。其基础值为60%，并根据你的[prowess|E]与所选目标的勇武之差的一半进行调整，随后应用你当前的命中增益与减益效果，以及[pod_combat_stealth_with_icon|E]提供的+30%加成。\n\n[pod_combat_dodge_with_icon|E]和[pod_combat_stealth_with_icon|E]在命中判定之前结算，而[pod_combat_guard_with_icon|E]可以格挡原本会命中的攻击。[soak_damage|E]以及影响非实体的诸灵的能力也属于独立的阶段。这些防御手段都不会改变显示的百分比。\n\n掷出的命中几率被限制在20%至95%之间。标记为#bold 无需命中判定#!的技能仅跳过该判定；它们未忽略的任何独立防御仍可阻止它们。"
 game_concept_pod_combat_guard: "戒备"
 game_concept_pod_combat_guard_with_icon: "@pod_combat_guard_icon!戒备"
 game_concept_pod_combat_guarding: "戒备"
 game_concept_pod_combat_guarding_with_icon: "@pod_combat_guard_icon!戒备"
 game_concept_pod_combat_guarded: "戒备"
 game_concept_pod_combat_guarded_with_icon: "@pod_combat_guard_icon!戒备"
 game_concept_pod_combat_guard_desc: "#bold 防御姿态#!。当一次需要判定格挡的攻击本应命中时，它会被转化为一次被格挡的打击，且不造成任何[POD_health_track|E]伤害。格挡在成功抵挡该次攻击后会被消耗。\n\n#weak 能够无视格挡的招式可以直接命中，且不会消耗格挡。#!"
 game_concept_pod_combat_dodge: "闪避"
 game_concept_pod_combat_dodge_with_icon: "@pod_combat_dodge_icon!闪避"
 game_concept_pod_combat_dodging: "闪避"
 game_concept_pod_combat_dodging_with_icon: "@pod_combat_dodge_icon!闪避"
 game_concept_pod_combat_dodged: "闪避"
 game_concept_pod_combat_dodged_with_icon: "@pod_combat_dodge_icon!闪避"
 game_concept_pod_combat_dodge_desc: "一个#bold 闪避姿态#!。当攻击进行闪避判定时，无论攻击者的[pod_combat_hit_chance|E]如何，该攻击都会自动落空，并消耗掉闪避效果。\n\n#weak 无法闪避的攻击会绕过闪避而不消耗它；而移除闪避的效果则在解决攻击前剥离该姿态。#!"
 game_concept_pod_combat_stealth: "潜行"
 game_concept_pod_combat_stealth_with_icon: "@pod_combat_stealth_icon!潜行"
 game_concept_pod_combat_stealthed: "潜行"
 game_concept_pod_combat_stealthed_with_icon: "@pod_combat_stealth_icon!潜行"
 game_concept_pod_combat_stealth_desc: "一种#bold 隐藏姿态#!，激活时增加+30%的[pod_combat_hit_chance|E]。潜行状态在以下任一情况最先发生时结束：\n$TAB$-持有者进行生命值攻击或敌对接触动作\n$TAB$-来犯攻击检测潜行并自动落空\n\n纯粹士气攻击不会消耗攻击者的潜行状态。\n\n#weak 不可闪避招式可绕过潜行而不消耗它，而移除潜行的招式会在解决其他效果前剥除该姿态。#!"
 game_concept_pod_combat_initiative: "主动"
 game_concept_pod_combat_init: "主动"
 game_concept_pod_combat_initiative_desc: "每轮战斗开始时进行的一次掷骰，决定[pod_combat_turn_order|E]。先攻值越高，动作越早。\n\n基础掷骰基于[prowess|E]和战斗者的种族；特长、特质以及招式附加的先攻增益或减益会调整结果。速度更快的战斗者（如超自然速度的律能、迅捷特质）能在较慢的对手做出反应之前率先发起攻击。"
 game_concept_pod_combat_turn_order: "回合顺序"
 game_concept_pod_combat_turn: "回合"
 game_concept_pod_combat_turn_order_desc: "本回合中各战斗单位的动作顺序，按1（最先）至N（最后）编号。该顺序由每个战斗单位在回合开始时掷出的[pod_combat_initiative|E]值决定。\n\n每回合结束时，动作顺序都会重置并重新掷骰，因此动作缓慢的单位若在主动性投掷中运气好，也可能在某回合率先行动或者因为速度快的单位上一回合受到了主动性减益效果。\n\n在三人或以上的战斗中，回合的动作顺序会在战斗窗口顶部以一排头像的形式展示——当前行动者会高亮显示，已行动或倒下的头像则会变暗。中途加入战斗的单位将在下一回合进入顺序队列。"
 game_concept_fire_damage: "火焰伤害"
 game_concept_fire_damage_icon: "@pod_combat_fire_icon!"
 game_concept_fire_damage_short: "#color:{1.00,0.55,0.20} 火焰#!"
 game_concept_fire_damage_short_with_icon: "$game_concept_fire_damage_icon$$game_concept_fire_damage_short$"
 game_concept_fire_damage_desc: "$BULLET_WITH_TAB$对任何有#bold 实体的[splat|E]#!造成[POD_aggravated_damage_with_box|E]。火焰伤害不会一夜痊愈。\n$BULLET_WITH_TAB$对虚体的#bold @wraith_icon!$POD_splat_wraith_plural$#!和#bold @spirit_icon!$POD_splat_spirit_plural$#!造成[POD_superficial_damage_with_box|E]。\n$BULLET_WITH_TAB$#bold [GetTrait('bushi').GetName(GetNullCharacter)]#!因$glossary_clan_curse$而承受#bold 双倍伤害#!。\n$BULLET_WITH_TAB$某些稀有技能可赋予对火焰伤害#bold 免疫#!。\n\n#weak 人类最古老的工具将驱散黑暗，无论字面还是隐喻。即便是农夫也能挥舞火把自卫以对抗怪物。#!"
 game_concept_cold_damage: "寒冷伤害"
 game_concept_cold_damage_icon: "@pod_combat_cold_icon!"
 game_concept_cold_damage_short: "#color:{0.55,0.85,1.00} 寒冷#!"
 game_concept_cold_damage_short_with_icon: "$game_concept_cold_damage_icon$$game_concept_cold_damage_short$"
 game_concept_cold_damage_desc: "$BULLET_WITH_TAB$对#bold @mortal_icon!$POD_splat_mortal_plural$#!造成[POD_aggravated_damage_with_box|E]，其血肉无法承受刺骨的严寒。\n$BULLET_WITH_TAB$对其他[splats|E]造成[POD_superficial_damage_with_box|E]。\n$BULLET_WITH_TAB$无额外伤害倍率或免疫效果。\n\n#weak 此元素对凡俗生物尤其致命，但即便是不死生物，也无法免受锋利冰晶撕裂其血肉之苦。#!"
 game_concept_lightning_damage: "闪电伤害"
 game_concept_lightning_damage_icon: "@pod_combat_lightning_icon!"
 game_concept_lightning_damage_short: "#color:{1.00,0.95,0.35} 闪电#!"
 game_concept_lightning_damage_short_with_icon: "$game_concept_lightning_damage_icon$$game_concept_lightning_damage_short$"
 game_concept_lightning_damage_desc: "$BULLET_WITH_TAB$对#bold 每一个[splat|E]#!造成[POD_aggravated_damage_with_box|E]。活肉、死肉与灵质皆同样传导。\n$BULLET_WITH_TAB$无额外伤害倍率或免疫效果。\n\n#weak 风暴之神须佐之男所钟爱的武器。无论那闪电是超自然的还是凡人的，没有什么能抵挡其毁灭之力。#!"
 game_concept_sun_damage: "阳光伤害"
 game_concept_sun_damage_icon: "@pod_combat_sun_icon!"
 game_concept_sun_damage_short: "#color:{1.00,0.92,0.50} 阳光#!"
 game_concept_sun_damage_short_with_icon: "$game_concept_sun_damage_icon$$game_concept_sun_damage_short$"
 game_concept_sun_damage_desc: "$BULLET_WITH_TAB$对#bold @vampire_icon!$POD_splat_vampire_plural$#!、@abomination_icon!#TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] #L;bold 恶煞#!#!以及#bold @kueijin_icon!$POD_splat_kueijin_plural$#!这些受太阳诅咒者造成[POD_aggravated_damage_with_box|E]。少数$POD_splat_kueijin_plural$的[Glossary('心法','podgloss.dharma')]对此不屑一顾，视为表面伤害。\n$BULLET_WITH_TAB$其他[splats|E]则#bold 免疫#!，因为阳光根本不会伤害生者或未受诅咒者。\n$BULLET_WITH_TAB$#bold #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!与[GetTrait('bushi').GetName(GetNullCharacter)]#!因其$glossary_clan_curse$而受到#bold 双倍伤害#!。\n\n#weak 太阳将上帝的温暖洒向祂的宇宙。因此，那些被祂诅咒之人再也无法感受这份温暖，又何其恰当。#!"
 game_concept_silver_damage: "银伤害"
 game_concept_silver_damage_icon: "@pod_combat_silver_icon!"
 game_concept_silver_damage_short: "#color:{0.85,0.85,0.95} 银#!"
 game_concept_silver_damage_short_with_icon: "$game_concept_silver_damage_icon$$game_concept_silver_damage_short$"
 game_concept_silver_damage_desc: "$BULLET_WITH_TAB$对#bold @werewolf_icon!$POD_splat_werewolf_plural$#!及大多数其他#bold $glossary_fera$#!造成[POD_aggravated_damage_with_box|E]，当其被#italic \"$glossary_luna$之金属\"#!所伤时，其再生能力会减弱。\n$BULLET_WITH_TAB$对其他[splats|E]造成[POD_superficial_damage_with_box|E]。\n$BULLET_WITH_TAB$无额外伤害倍率或免疫效果。\n\n#weak 银制武器可以缩小与狼人之间的战力差距，但请记住：即便其再生能力被抑制，他们依然是盖亚最强大的杀戮机器。#!"
 game_concept_gold_damage: "金伤害"
 game_concept_gold_damage_icon: "@pod_combat_gold_icon!"
 game_concept_gold_damage_short: "#color:{1.00,0.75,0.20} 金#!"
 game_concept_gold_damage_short_with_icon: "$game_concept_gold_damage_icon$$game_concept_gold_damage_short$"
 game_concept_gold_damage_desc: "$BULLET_WITH_TAB$对#bold @mokole_icon!$POD_splat_mokole_plural$#!和#bold @corax_icon!$POD_splat_corax_plural$#!造成[POD_aggravated_damage_with_box|E]，他们尤其弱于太阳金属。\n$BULLET_WITH_TAB$对其他[splats|E]造成[POD_superficial_damage_with_box|E]。\n$BULLET_WITH_TAB$无额外伤害倍率或免疫效果。\n\n#weak 莫科莱确保他们对赫利俄斯金属的弱点是一个严加保守的秘密。他们只能希望多嘴的科拉克斯也能如此。#!"
 game_concept_holy_damage: "神圣伤害"
 game_concept_holy_damage_icon: "@pod_combat_holy_icon!"
 game_concept_holy_damage_short: "#color:{1.00,0.95,0.65} 神圣#!"
 game_concept_holy_damage_short_with_icon: "$game_concept_holy_damage_icon$$game_concept_holy_damage_short$"
 game_concept_holy_damage_desc: "$BULLET_WITH_TAB$对#bold @vampire_icon!$POD_splat_vampire_plural$#!、@abomination_icon!#TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] #L;bold 恶煞#!#!、#bold @demon_icon!$POD_splat_demon_plural$#!、#bold @kueijin_icon!$POD_splat_kueijin_plural$#!、#bold @wraith_icon!$POD_splat_wraith_plural$#!和#bold @fae_icon!$POD_splat_fae_plural$#!造成[POD_aggravated_damage_with_box|E]，它们会因展现[Glossary('真信','game_concept_true_faith_desc')]而退缩\n$BULLET_WITH_TAB$对#bold @changeling_icon!$POD_splat_changeling_plural$#!造成[POD_superficial_damage_with_box|E]。\n$BULLET_WITH_TAB$其他[splats|E]则#bold 免疫#!。\n\n#weak 看哪，主的名从远方而来，带着怒气，负担沉重；他的嘴唇充满愤恨，他的舌头如同吞噬之火。#!"
 game_concept_poison_damage: "毒素伤害"
 game_concept_poison_damage_icon: "@pod_combat_poison_icon!"
 game_concept_poison_damage_short: "#color:{0.55,0.80,0.30} 毒素#!"
 game_concept_poison_damage_short_with_icon: "$game_concept_poison_damage_icon$$game_concept_poison_damage_short$"
 game_concept_poison_damage_desc: "$BULLET_WITH_TAB$对#bold @mortal_icon!$POD_splat_mortal_plural$#!造成[POD_aggravated_damage_with_box|E]，毒素会腐蚀其血肉之躯。\n$BULLET_WITH_TAB$#bold @vampire_icon!$POD_splat_vampire_plural$#!和#bold @kueijin_icon!$POD_splat_kueijin_plural$#!#bold 免疫#!，因为不死者没有活体可供毒素伤害。\n$BULLET_WITH_TAB$对其他[splats|E]造成[POD_superficial_damage_with_box|E]。\n\n#weak 这是毒素恶神尤尔女士选择的武器。常被斥为背刺者和懦夫的工具。但当你的性命悬于一线时，荣誉又有何用？#!"
 game_concept_cold_iron_damage: "寒铁伤害"
 game_concept_cold_iron_damage_icon: "@pod_combat_cold_iron_icon!"
 game_concept_cold_iron_damage_short: "#color:{0.65,0.70,0.78} 寒铁#!"
 game_concept_cold_iron_damage_short_with_icon: "$game_concept_cold_iron_damage_icon$$game_concept_cold_iron_damage_short$"
 game_concept_cold_iron_damage_desc: "$BULLET_WITH_TAB$对#bold @fae_icon!$POD_splat_fae_plural$#!和#bold @changeling_icon!$POD_splat_changeling_plural$#!造成[POD_aggravated_damage_with_box|E]，他们会因金属的[banality|E]而遭受可怕且冒烟的伤口。\n$BULLET_WITH_TAB$对其他[splats|E]造成[POD_superficial_damage_with_box|E]。\n$BULLET_WITH_TAB$无额外伤害倍率或免疫效果。\n\n#weak 由古老锻铁程序制成的武器。它们比钢更重更脆，但正是这种低技术特性能够带给妖精灵魂死亡。#!"
