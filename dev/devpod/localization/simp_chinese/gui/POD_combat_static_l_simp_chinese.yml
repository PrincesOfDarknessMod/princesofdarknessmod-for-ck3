 pod_combat.0001.t: "战斗系统概述"
 pod_combat.0001.desc: "Combat is turn-based: each combatant spends Action Points on [pod_combat_skills|E], and you choose from the loadout you equipped beforehand. You win when every enemy is knocked out. Unless that happens first, you lose as soon as your character falls, even if allies remain. Every blue label in the combat window has a hover tooltip - use them any time you need a refresher.\n\nPick a topic below for the details. You can re-open this menu from the #bold Help#! button at any time."
