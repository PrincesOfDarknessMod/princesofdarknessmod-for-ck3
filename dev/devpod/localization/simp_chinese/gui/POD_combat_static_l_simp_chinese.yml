 pod_combat.0200.t: "血必流之"
 pod_combat.0200.desc: "此事无法用言语解决。[pod_combat_encounter|E]会在战斗窗口中逐招展开：每个回合，你花费[pod_combat_action_points|E]来使用已装备的[pod_combat_skills|E]，当所有敌人都被[pod_combat_knocked_out|E]时战斗结束——或者在你倒下的那一刻结束。\n\n目前已经装备了一套实用的技能组合，不过你可能想在战斗前检查一番，因为一旦[pod_combat_encounter|E]开始，它们就无法更改。战斗开始后，#bold 帮助#!按钮会解释其余内容，而#bold 配置战斗技能#!则可在你未处于战斗时，通过决议菜单随时访问。"
