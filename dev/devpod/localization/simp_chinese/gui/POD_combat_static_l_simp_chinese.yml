 pod_combat.0100.desc: "#bold YOUR TURN#!\nEach round you start with #bold 6 Action Points#! (more or less if something buffed, drained, or refunded AP). Spend AP on the skills on your bar; skills you can't afford are greyed out. Click #bold End Turn#! when you're done - unspent AP is forfeited.\n\nMany skills also cost #bold supernatural energy#! - Blood for vampires, Gnosis for shifters, Pathos or Angst for wraiths, Glamour for changelings, and so on. It is paid from your splat's regular pool, so leaning on expensive disciplines drains you over a fight and leaves you depleted afterward. A few skills also cost Gold, Piety, Prestige, or [static_stress|E].\n\nTo choose what's on your bar, open #bold Configure Combat Skills#! before combat. You're capped at four skills per category (ATK / DEF / CTL / PWR). Enable #bold Show all moves#! there to browse skills you haven't unlocked - each locked skill lists exactly which traits, powers, or perks you're missing.\n\n#bold PICKING YOUR TARGET#!\nClick an ally or enemy's #bold card#! (or their portrait in the turn-order strip) to mark them as your current target; their card shows a @check_icon! #bold Targeted#! badge, and your target plus your [pod_combat_hit_chance|E] against them appear at the top of the window. Offensive skills fire on your enemy target, support skills (heals, buffs) on your ally target, and self-only skills ignore targeting. Some skills are #bold area-of-effect#! - they hit every enemy or every ally at once, whatever you have selected. Switching targets recalculates your Hit Chance from your [prowess|E] against theirs, your active Hit modifiers, and your own [pod_combat_stealth_with_icon|E] bonus. The target's [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E], [pod_combat_stealth_with_icon|E], and [soak_damage|E] resolve separately and do not change that percentage.\n\n#bold WHO THE AI IS AFTER#!\nEach AI combatant's card carries an #bold Attacking#! line naming who they last went after - both enemies and your own AI allies show it (your target is the readout up top). It is the foe they have been #italic focusing#! on: a strong tendency, since combatants tend to keep hammering the same victim, but not a promise - an AI will break off to finish a nearly-downed target. The line is blank before a combatant has taken its first turn, and while a combatant is #bold dominated#! (its focus clears for that turn). Read it to spot who is about to get ganged up on, and to pull a fragile ally out of the line of fire.\n\n#bold TURN ORDER#!\nIn fights of three or more, a #bold turn-order strip#! of portraits runs across the top - this round's acting order, left to right. The current actor is highlighted in gold; portraits dim once they've acted or fallen, and the strip scrolls sideways when the brawl gets crowded. Combatants can join a fight already underway - a necromancer raising a wraith ally, reinforcements arriving - and they fold into the order from the next round."
 pod_combat.0101.t: "阅读战斗"
 pod_combat.0101.desc: "#bold THE COMBATANT CARDS#!\nEach combatant's card shows:\n• [POD_health_track|E] - wound boxes; fills as they take hits.\n• [pod_combat_morale|E] - mental composure, separate from HP. Direct mental attacks reduce it; every wound box a hit actually deals after Soak also removes #bold 2#! Morale.\n• [prowess|E] / [pod_combat_hit|E] / [soak_damage|E] - offensive and defensive numbers.\n• [pod_combat_init|E] / [pod_combat_turn|E] - when they act this round.\nStatus icons along the card's bottom edge flag active stances and afflictions (Guard, Dodge, Stealth, Retaliate, burning, daze, domination); hover any of them for the specifics.\n\n#bold THE COMBAT LOG#!\nThe scrolling panel below the skill bar captures every meaningful event in order, newest at the top. Each row shows who acted, the skill, the target, and everything the move did - damage, healing, drains, afflictions, recoil, and counters surface inline, as do the misses, blocks, and soaks that stopped them. Allies are tinted gold, enemies red, so a quick scroll back tells you the rhythm of the fight at a glance.\n\nA few row patterns to recognise:\n• #bold Area-of-effect#! attacks push #bold one row per target#! so you can see exactly who took what (e.g. \"Mithras → All enemies (Steve)\").\n• When a stance like Retaliate fires, the row that triggered it shows a #bold + Counter#! rider next to the main outcome.\n• Bookend markers frame the fight - \"— Combat begins —\" at the bottom, \"— Round 2 begins —\" at each round break, and \"— Combat ends · Victory —\" or \"— Combat ends · Defeat —\" at the top when it's over."
 pod_combat.0102.t: "进攻、防御与效果"
 pod_combat.0102.desc: "#bold LANDING A HIT#!\nA move's tooltip tells you which defensive stages it skips. A normal physical attack must first be able to affect an incorporeal spirit. [pod_combat_stealth_with_icon|E] or [pod_combat_dodge_with_icon|E] can then evade it, its [pod_combat_hit_chance|E] roll can miss, and [pod_combat_guard_with_icon|E] can block a blow that would otherwise land. [soak_damage|E] is then rolled separately against each point of damage, so a heavy hit is usually reduced rather than stopped outright.\n\n#bold No Hit roll#! skips only the percentage roll; #bold Undodgeable#! bypasses Dodge and Stealth; #bold Affects incorporeal spirits#! passes the spirit gate; and #bold Ignores Guard#! lands through Guard. #bold Strips Guard#! or #bold Removes Dodge / Stealth#! deletes that stance before the move's other effects resolve. Supernatural and mental attacks normally skip the Hit roll and Guard, but Dodge and Stealth can still evade them.\n\n#bold DAMAGE TYPES#!\n• [Concept('POD_superficial_damage','Superficial')|E]: soakable point by point, heals between combats.\n• [Concept('POD_aggravated_damage','Aggravated')|E]: unsoakable by default, heals slowly. Elemental blows - fire, cold, lightning, sun, silver, gold, holy, balefire, poison and cold iron - land aggravated only against the splats vulnerable to them, and some splats are outright #bold immune#!: a werewolf dreads silver, a vampire fears sun and true faith, the fae recoil from cold iron, and the undead simply shrug off poison. Each damage type's concept card lists exactly who it wounds.\nA handful of skills are #bold draining attacks#! - bites, soul-feasts and the like that heal you, but only if the attack deals HP Damage after Soak. A few #bold wound you back#! when used: reckless all-out attacks that trade some of your own HP for a heavier hit.\n\n#bold DEFENSIVE PLAY#!\nYou can stack defenses in advance - they stay up until something tests them. A good turn often sets up a defense instead of attacking:\n• [pod_combat_guard_with_icon|E] - block the next attack that checks Guard and would otherwise land.\n• [pod_combat_dodge_with_icon|E] - negate the next attack that checks Dodge; Undodgeable moves leave it ready.\n• [pod_combat_stealth_with_icon|E] - +30% Hit while active; consumed by your next HP or hostile contact move, or when you evade an attack.\n• #bold Retaliate on Hit / on Miss#! - counter whoever tests you. The skill tooltip lists the exact counter and whether it lands superficial or aggravated.\n\n#bold BUFFS & DEBUFFS#!\nTemporary Hit and Soak effects come in small, medium, and large tiers. Hit buffs and debuffs, and Soak debuffs, add or subtract #bold 10 / 20 / 30#! percentage points. Soak buffs instead reduce the damage remaining after existing Soak by #bold 10 / 20 / 30%#!, so their displayed gain depends on the combatant's current Soak.\n\nRound and combat versions occupy separate slots, as do buffs and debuffs, so they can coexist. Within the same stat, direction, and duration, only a strictly stronger tier replaces the current one; an equal or weaker tier adds nothing. A round buff expires when its holder's next turn starts, while a round debuff lasts through its holder's next turn and expires at that turn's end. Combat-duration effects last until the fight ends.\n\n#bold AFFLICTIONS & CONTROL#!\nSome skills leave more than a wound:\n• #bold Damage over time#! - burning, freezing and their kin bite again at each round's end for a few rounds, each tick marked with its damage-type icon. Mental afflictions fray [pod_combat_morale|E] instead; untyped ones simply wound. A status icon on the victim's card marks it - hover for the damage and rounds left.\n• #bold Daze & stun#! - some blows drain the target's Action Points for their next turn. A full drain starts that turn at #bold 0 AP#!; eligible 0-AP moves remain usable.\n• #bold Domination#! - a few mental powers steal a combatant's next turn and turn it against their own side. Strong mental defenses shrug it off unless the caster can pierce them, and #bold your#! character can never be puppeted."
 pod_combat.0103.t: "结果与控制"
 pod_combat.0103.desc: "#bold 被击倒#!\n当出现以下任一情况时，战斗人员即退出战斗：\n•其[POD_health_track|E]完全填满。\n•其[pod_combat_morale|E]降至零。\n•其死亡、变为#N 无能#!、进入蛰眠，或被困于影界或深渊。\n\n每一次倒下都会动摇幸存者：每位剩余队友失去#bold 2#!点[pod_combat_morale|E]，但此冲击永远不会将其降至1点士气以下。当没有敌人存留时，你即#bold 获胜#!。否则，若#bold 你的角色#!被击倒，即便还有盟友存留，你也会立即失败。\n\n#bold 战斗之后#!\n在练习之外，战斗结束时，每位存活的战斗人员每缺少1点[pod_combat_morale|E]都会受到#bold 5#!点[static_stress|E]。在此之前恢复士气可以减少该持久的代价。伤害根据决斗模式持续存在，消耗于技能的，超自然能量或其他资源保持消耗状态。你装备的技能配置在多次战斗之间保持不变。\n\n#bold 决斗模式#!\n触发战斗的事件决定致命规则：\n•#bold 致命#!：伤害持续存在，且适用正常的PoD伤害、死亡及特定类型生存规则。某些触发事件保证败者死亡。\n•#bold 非致命#!：伤害正常生效并可击倒战斗人员，但伤害致死被阻止。战斗结束时，完全填满的伤害路线会被回拉以留出一个空格。\n•#bold 练习#!：伤害、治疗和士气在比试中生效并决定谁倒下，但所有战前伤害路线在结束后恢复，缺失的士气不会产生持久的心理压力。正常技能消耗仍需支付，条件性能量获取可持续存在。\n\n#bold 窗口按钮#!\n•#bold 结束回合#!：提交你的回合并轮到主动性顺序中的下一位战斗人员。未使用的AP点将丢失。\n•#bold 自动解决#!：跳过剩余战斗。每支存活队伍当前的[prowess|E]总值被计算，然后获得从零到该总值的随机加成；分数高者获胜，平局偏向你的阵营。落败方领袖的士气降至零，若该领袖存活且不在练习模式，则产生最大基于士气的心理压力。有一项因素覆盖该掷骰：若有一个你#bold 无法伤害#!的敌人仍站立—一个无形的灵体，且你方无人能触及它—则没有任何总值能获胜，因此自动解决会认输而非掷骰。该按钮仍然可用，正因为这场战斗没有其他出路，其提示会在你点击前警告你。反之亦然，但仅当#bold 你自己的角色#!是无法被触及的那一个：无形的盟友也救不了你，因为你的角色倒下时你即失败。\n•#bold 结束战斗#!：在战斗解决后关闭窗口（在胜利或失败后取代结束回合/自动解决）。\n•#bold 自动推进#!复选框：开启时，一轮中所有AI回合可在一次点击中解决，而非逐一进行。\n•#bold 帮助#!：随时重新打开该指南。\n\n以决斗开始的战斗会在其自己的卡片上结束：一旦事态判定，会出现#bold $pod_combat.9995.a$#!提示，点击该提示会将结果带回给发起决斗之人。决斗一旦开始便无法中途离开——坚持下去，或让自动解决来定夺。"
