 game_concept_the_homeland_of_the_croatan:0 "克洛坦之母界"
 game_concept_the_homeland_of_the_croatan_desc:0 "克洛坦的土地酷似北美的针叶林。气候永远凉爽而多雾，偶尔会有降雨。这片故乡没有任何能量散发，整个地区异常安静。龟神在界域的中心处沉睡，偶尔在梦中微动。"
