 game_concept_kingdom_of_dan:0 "Kingdom of Dán"
 game_concept_kingdom_of_dan_desc:0 "The Kingdom of Dán is one of the [oneiric_realms|E] of the [deep_dreaming|E].\n\nIn a world without constant borders, there are two hypothetical lines by which some dream cartographers measure the extant of the Known [dreaming|E]: The Axle and the Equinoctial. The first measures the [dreaming|E] from top to bottom. The second traverses the [dreaming|E]'s horizontal median, acting as a rough equator. As with any measurements in the [dreaming|E], this is largely an intellectual conceit designed to give some sense of order to an otherwise chaotic universe. At the top of this fictitious Axle lies the Kingdom of Dán."
 kingdom_of_dan_confirm:0 "Wander the Kingdom of Dán"
