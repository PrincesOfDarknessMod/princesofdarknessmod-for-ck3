 SPIRIT_TRAVELING_TOOLTIP:0 "穿越中……"
 spirit_travel_arrived_title:0 "目的地已触及"
 spirit_travel_arrived_desc:0 "你已经到达灵界的选定目标位置。"
 shadow_realm_to_skinlands_option_tooltip:0 "这个选项可用是因为你拥有[GetPerk('empower_ba_perk').GetName( GetPlayer )][perk|E]。"
 shadowlands_fetter_maintenance_tooltip:0 "你付出了没[Fetters|E]还待在皮囊之地的代价。"
 skinlands_title:0 "皮囊之地"
 skinlands_desc:0 "死灵把活人的世界称为皮囊之地；这与幽土形成鲜明对比，后者是死者的土地和死灵的家园。\n这基本上是你的起点，从这里开始，你有数个可选项——取决于你的能力——从这里开始前往哪里。\n请注意，从一个位面到另一个位面的旅行将需要时间。\n小心点，你可能在穿越中得到一些好处，但你也可能迷失。\n\n #R 注意，在灵游时，你将无法使用大多数普通角色互动和决议。 #!"
 skinlands_tooltip:0 "$UMBRA_HEAD$$skinlands_custom_1$$UMBRA_BREAK$$skinlands_custom_2$"
 skinlands_confirm:0 "回到物质世界"
 periphery_title:0 "周界"
 periphery_desc:0 "周界，有时也被称为“软影界”，是介于[penumbra|E]和物质世界之间的地方或——如许多化兽族裔所说——思想状态。"
 periphery_tooltip:0 ""
 periphery_confirm:0 "若我改变思绪……"
 glen_title:0 "幽谷"
 glen_desc:0 "幽谷是[penumbra|E]的一个区域，饱和于奇原能量。幽谷通常与物质世界中未受开发的荒野地区联系在一起（所有它们越来越稀少，越来难进入）。"
 glen_tooltip:0 "$UMBRA_HEAD$$glen_custom_1$"
 glen_confirm:0 "休于幽谷"
 near_dreaming_title:0 "近梦界"
 near_dreaming_desc:0 "近梦界是[dreaming|E]中最接近世俗世界的部分。"
 near_dreaming_tooltip:0 "$UMBRA_HEAD$$near_dreaming_custom_1$"
 near_dreaming_confirm:0 "漫游近梦界"
 far_dreaming_title:0 "远梦界"
 far_dreaming_desc:0 "远梦界是[dreaming|E]的一部分，对应于人类的集体梦境。"
 far_dreaming_tooltip:0 ""
 far_dreaming_confirm:0 "漫游远梦界"
 deep_dreaming_title:0 "深梦界"
 deep_dreaming_desc:0 "深梦界是[dreaming|E]中离着苏醒世界最远的部分。"
 deep_dreaming_tooltip:0 ""
 deep_dreaming_confirm:0 "漫游深梦界"
 astral_plane_title:0 "星界"
 astral_plane_desc:0 "广义上讲，星界可以被认为是全人类意识的投射，随后根据不同种类的思想被细分为不同界域。"
 astral_plane_tooltip:0 ""
 astral_plane_confirm:0 "升入星界"
 vulgate_title:0 "庸底"
 vulgate_desc:0 "庸底——也被称为想象世界——是[astral_reaches|E]的最低部分。它包含了人类（也许还有一些其他物种）的集体哲学和思维方式所想到的常识概念。"
 vulgate_tooltip:0 ""
 vulgate_confirm:0 "升入庸底"
 spires_title:0 "众峰"
 spires_desc:0 "宇宙学家认为，众峰是众人的思想集中在同一个概念上的结果，导致它从庸底上升到更高的界域。"
 spires_confirm:0 "升入众峰"
 inventium_title:0 "构界"
 inventium_desc:0 "构界是[astral_reaches|E]的界域之一，充满了人类梦寐以求的所有发明。这些发明以一种可察的爆裂声显现出来，并轻轻地落入巨大的堆积物中，充满了整个界域的各地。"
 inventium_tooltip:0 "$UMBRA_HEAD$$inventium_custom_1$"
 inventium_confirm:0 "进入构界"
 epiphamy_title:0 "悟韵"
 epiphamy_desc:0 "悟韵体现了最抽象的概念，如“自然法则”或“真爱”。它们显现为庸底天空中的彩色云彩，可以给旅者提供关于它们所体现的概念的线索。"
 epiphamy_tooltip:0 ""
 epiphamy_confirm:0 "升入悟韵"
 shadowlands_title:0 "幽土"
 shadowlands_desc:0 "幽土是现实的镜像“皮肤”，生者界域的每一个地点在幽土都有一个相应的地点，在大多数情况下，这些地点遵守传统的距离法则。它是死灵蛰居等待着救赎，或是湮灭的地方。"
 shadowlands_tooltip:0 "$UMBRA_HEAD$$shadowlands_custom_1$$UMBRA_BREAK$$shadowlands_custom_2$$UMBRA_BREAK$$shadowlands_custom_3$"
 shadowlands_confirm:0 "深入幽土"
 river_of_death_title:0 "死亡之河"
 river_of_death_desc:0 "死亡之河是大风暴中的一条水路，是冥河城通往幽土和其他冥府的主要旁路。"
 river_of_death_tooltip:0 ""
 river_of_death_confirm:0 "潜入死亡之河"
 sunless_sea_title:0 "无日之海"
 sunless_sea_desc:0 "命名缘由自它上面的天空永远是黑暗的，来自船只和信标等来源的光线在无日之海可在几英里外看到，因为它从水面上散射开来。"
 sunless_sea_tooltip:0 ""
 sunless_sea_confirm:0 "潜入无日之海"
 far_shore_title:0 "彼岸"
 far_shore_desc:0 "彼岸是[underworld|E]的一块神秘领地，由被称为“闪耀者”的皮提亚人实体控制。对现代冥河城民来说，彼岸是由异端控制的领土，不值得信任。"
 far_shore_tooltip:0 ""
 far_shore_confirm:0 "前往彼岸"
 weeping_bay_title:0 "泣湾"
 weeping_bay_desc:0 "泣湾位于灵魂之海和无日之海的中间，是冥河城的主要港口，也是与其他各个死城的联系。海湾的形状很有特点，呈半月形，并不断充斥着被灵铸成海湾的死灵的呜咽和呻吟。"
 weeping_bay_tooltip:0 ""
 weeping_bay_confirm:0 "前往泣湾"
 sea_of_souls_title:0 "灵魂之海"
 sea_of_souls_desc:0 "围绕着冥河城和泣绝岛建造的保护性海墙。它的名字来自于那些被锻造或灌进墙体结构中的不幸的死灵。"
 sea_of_souls_tooltip:0 ""
 sea_of_souls_confirm:0 "潜入灵魂之海"
 isle_of_sorrows_title:0 "泣绝岛"
 isle_of_sorrows_desc:0 "泣绝岛是一个岩石岛，位于死亡之河的三角洲，在大风暴的深处。"
 isle_of_sorrows_tooltip:0 ""
 isle_of_sorrows_confirm:0 "前往泣绝岛"
 veinous_stair_title:0 "静脉阶梯"
 veinous_stair_desc:0 "静脉阶梯是一条从冥河城直接通往迷宫域的通道。幽土最稳定的地方，由未知类型的黑色石头组成。"
 veinous_stair_tooltip:0 ""
 veinous_stair_confirm:0 "潜入静脉阶梯"
 dark_kingdom_of_iron_title:0 "铁之冥府"
 dark_kingdom_of_iron_desc:0 "冥河城是西方死灵的首都，是一座难以理解的巨大城市，位于大风暴深处的泣绝岛。它是西方死灵各组织的主要总部所在地。"
 dark_kingdom_of_iron_tooltip:0 ""
 dark_kingdom_of_iron_confirm:0 "前往冥河城"
 dark_kingdom_of_clay_title:0 "黏土冥府"
 dark_kingdom_of_clay_desc:0 "业境，外人称为黏土[dark_kingdom|E]，是大风暴中属于澳大利亚原住民的界域。"
 dark_kingdom_of_clay_tooltip:0 ""
 dark_kingdom_of_clay_confirm:0 "前往业境"
 dark_kingdom_of_ivory_title:0 "象牙冥府"
 dark_kingdom_of_ivory_desc:0 "幽灵之丛，也被称为象牙[dark_kingdom|E]，是非洲死灵——又称阿班博——的幽土。"
 dark_kingdom_of_ivory_tooltip:0 ""
 dark_kingdom_of_ivory_confirm:0 "前往幽灵之丛"
 dark_kingdom_of_jade_title:0 "玉之冥府"
 dark_kingdom_of_jade_desc:0 "黄泉，又称玉之[dark_kingdom|E]，是专门为亚洲的死者服务的[underworld|E]部分，并由他们控制。"
 dark_kingdom_of_jade_tooltip:0 ""
 dark_kingdom_of_jade_confirm:0 "前往黄泉"
 dark_kingdom_of_obsidian_title:0 "黑曜石冥府"
 dark_kingdom_of_obsidian_desc:0 "剥皮之地是对中美洲掌握的死者国度的称呼，是强大的黑曜石[dark_kingdom|E]的一部分。"
 dark_kingdom_of_obsidian_tooltip:0 ""
 dark_kingdom_of_obsidian_confirm:0 "前往剥皮之地"
 dark_kingdom_of_sand_title:0 "沙之冥府"
 dark_kingdom_of_sand_desc:0 "沙之[dark_kingdom|E]阿蒙提是属于不朽者的[underworld|E]冥府。它的居民不是死灵，而是不朽者，其等在死后会来到这幽土。"
 dark_kingdom_of_sand_tooltip:0 "$UMBRA_HEAD$$dark_kingdom_of_sand_custom_1$"
 dark_kingdom_of_sand_confirm:0 "前往阿蒙提"
 swar_title:0 "施瓦"
 swar_desc:0 "施瓦（意为天界）——喜悦之城——是印度的亡者之城，施瓦是印度幽土——空界——的首要城市。"
 swar_tooltip:0 ""
 swar_confirm:0 "前往施瓦"
 night_markets_title:0 "夜市"
 night_markets_desc:0 "夜市，名义上是施瓦的一部分，是东南亚亡者蜗居的地方。"
 night_markets_tooltip:0 ""
 night_markets_confirm:0 "前往夜市"
 mantaqat_khayal_title:0 "曼塔卡特·卡哈耶"
 mantaqat_khayal_desc:0 "曼塔卡特·卡哈耶，中东的幽土。人们对这片土地知之甚少，只知道至少从伊斯兰教的黎明开始，哀恸就把它吞没在永恒的沙暴中。只有死城提供了躲避沙暴的庇护所，而且只有商人、朝圣者和游牧者才会跨越它。"
 mantaqat_khayal_tooltip:0 ""
 mantaqat_khayal_confirm:0 "前往曼塔卡特·卡哈耶"
 shadow_realm_title:0 "影子国度"
 shadow_realm_desc:0 "影子国度是木乃伊在[underworld|E]的根据地，在他们准备好再次回到在自己的身体里之前，他们会去那里进行自我再生，且在此处其等可避免怨灵或恶湍的侵袭。"
 shadow_realm_tooltip:0 ""
 hades_title:0 "哈迪斯"
 hades_desc:0 "卡比里木乃伊的主要[shadow_realm|E]被称为哈迪斯，来自希腊神话中的[underworld|E]。"
 hades_tooltip:0 ""
 gates_of_heaven_title:0 "天门"
 gates_of_heaven_desc:0 "天降大任于重生者。八仙给予天亲使命旨意。他们奉旨，且必须执行天意。当他们失败时，他们将在天门花时间沉思，为自己做好准备，以便不再失败。"
 gates_of_heaven_tooltip:0 ""
 yomi_wan_title:0 "幽冥"
 yomi_wan_desc:0 "幽冥，也被称为无量地狱，是阎魔在[yin_world|E]与阳界之间的罅隙制造出来的一个人造灵性维度，以作为他们的总部。"
 yomi_wan_tooltip:0 ""
 tempest_title:0 "[GetPlayer.Custom( 'tempest_custom_name' )]"
 tempest_desc:0 "[GetPlayer.Custom( 'tempest_custom_desc' )]"
 tempest_tooltip:0 "$UMBRA_HEAD$$tempest_custom_1$$UMBRA_BREAK$$tempest_custom_2$"
 tempest_confirm:0 "#X 深入[GetPlayer.Custom( 'tempest_custom_name' )]#!"
 labyrinth_title:0 "迷宫域"
 labyrinth_desc:0 "迷宫域的结构相对来说很少，任何地图都无法描绘它；所有的地标随时可能移动。"
 labyrinth_tooltip:0 "$UMBRA_HEAD$$labyrinth_custom_1$$UMBRA_BREAK$$labyrinth_custom_2$"
 labyrinth_confirm:0 "#X 深入迷宫域#!"
 well_of_the_void_title:0 "虚空之井"
 well_of_the_void_desc:0 "虚空之井是湮灭的物理表象，位于迷宫域的中心和底部。"
 well_of_the_void_tooltip:0 "$UMBRA_HEAD$$well_of_the_void_custom_1$$UMBRA_BREAK$$well_of_the_void_custom_2$$UMBRA_BREAK$$well_of_the_void_custom_3$"
 well_of_the_void_confirm:0 "#X 落入虚空之井#!"
 oblivion_title:0 "#X 湮灭#!"
 oblivion_desc:0 "#X 湮灭是熵本身，是不断变幻的毁灭与疯狂之力，没有什么能从那回来。#!"
 oblivion_confirm:0 "#X 末于湮灭#!"
 abyss_title:0 "深渊"
 abyss_desc:0 "深渊，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕落者的永恒监狱。"
 abyss_tooltip:0 "$UMBRA_HEAD$$abyss_custom_1$$UMBRA_BREAK$$abyss_custom_2$"
 abyss_confirm:0 "#X 堕入深渊#!"
 spirit_wilds_title:0 "灵之荒野"
 spirit_wilds_desc:0 "灵之荒野是中影界的另一个名称，是近界之间的空间。这一影界部分反映了自然环境，包括其原始状态和受污染的状态。"
 spirit_wilds_tooltip:0 "$UMBRA_HEAD$$spirit_wilds_custom_1$$UMBRA_BREAK$$spirit_wilds_custom_2$"
 spirit_wilds_confirm:0 "踏入灵之荒野"
 atrocity_realm_title:0 "暴行界域"
 atrocity_realm_desc:0 "暴行界域，被法师们称为荒土，是近界域之一。千年来，世界上所有受害者的痛苦造就了这界域，一个已固为永恒的残酷和折磨。"
 atrocity_realm_tooltip:0 ""
 atrocity_realm_confirm:0 "踏入暴行界域"
 battleground_title:0 "战界"
 battleground_desc:0 "战界，在东方被称为斗魂界，是影界中的近界域之一，包含着有史以来的每一场战斗，从最早的新石器时代部落与熊和狼的冲突，刀耕之治和魂怒之战，直到目前中东和伊比利亚内部的冲突。"
 battleground_tooltip:0 "$UMBRA_HEAD$$battleground_custom_1$"
 battleground_confirm:0 "踏入战界"
 cyberrealm_title:0 "赛博界"
 cyberrealm_desc:0 "赛博界是影界的十三近界域之一。这界域也许代表了织者在影界的影响力的顶峰。它被法师们称为敌托邦。"
 cyberrealm_tooltip:0 ""
 cyberrealm_confirm:0 "踏入赛博界"
 erebus_title:0 "厄瑞玻斯"
 erebus_desc:0 "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。它充满了熔化的银化为的河，既能燃烧，又能治疗，将囚犯的折磨延长到几个月、几年，甚至可能是几个世纪。"
 erebus_tooltip:0 ""
 erebus_confirm:0 "踏入厄瑞玻斯"
 flux_realm_title:0 "变界"
 flux_realm_desc:0 "变界，变化界，或辐射界是近影界中的界域。它是强大的纯净、未被稀释的奇原能量库，未被织者的章程所污染。"
 flux_realm_tooltip:0 ""
 flux_realm_confirm:0 "踏入变界"
 hy_brasil_title:0 "易巴席尔"
 hy_brasil_desc:0 "易巴席尔似乎是一个充满无尽幻想故事的土地。在这里，季节永远不会改变，白天永远锁定为黄昏。在这块土地的西半部，太阳挂在仲夏天空中。在东边，月亮升起，寒冷而可怕，笼罩着隆冬夜晚。"
 hy_brasil_tooltip:0 ""
 hy_brasil_confirm:0 "踏入易巴席尔"
 legendary_realm_title:0 "传奇界"
 legendary_realm_desc:0 "传奇界是位于近影界的近界域之一。在该界域穿越的狼族可以体验他们传奇先祖的生活。然而，界域内的事件并非严格的历史再现；它们可能随着时间推移而改变故事滤镜，以适应当前世界的思想。"
 legendary_realm_tooltip:0 ""
 legendary_realm_confirm:0 "踏入传奇界"
 mountains_of_heaven_title:0 "天山"
 mountains_of_heaven_desc:0 "天山是阳界中的影界界域。该界域表现为在云海之上的庞大山脉链，甚至使伟大的喜马拉雅山脉也相形见绌。"
 mountains_of_heaven_tooltip:0 ""
 mountains_of_heaven_confirm:0 "爬上天山"
 pangaea_title:0 "盘古界"
 pangaea_desc:0 "盘古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。"
 pangaea_tooltip:0 ""
 pangaea_confirm:0 "踏入盘古界"
 scar_title:0 "疤痕"
 scar_desc:0 "疤痕是影界的近界域之一。它是工业革命在生锈的繁荣理想下被腐蚀成对灵魂的磨砺压榨的显现。"
 scar_tooltip:0 ""
 scar_confirm:0 "踏入疤痕"
 summer_country_title:0 "夏乡"
 summer_country_desc:0 "夏乡是位于地球近影界的近界域之一。它现在只是个神话，因为它已经消逝了几十年了。传说中，该界域反映了盖亚对她的孩子们的纯洁又无尽的爱。"
 summer_country_tooltip:0 ""
 summer_country_confirm:0 "踏入夏乡"
 tiger_lands_title:0 "虎原"
 tiger_lands_desc:0 "虎原是东方影界的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。"
 tiger_lands_tooltip:0 ""
 tiger_lands_confirm:0 "踏入虎原"
 umi_title:0 "羽海"
 umi_desc:0 "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围，尽管某些波利尼西亚和印度尼西亚的灵域对此不以为然。"
 umi_tooltip:0 ""
 umi_confirm:0 "踏入羽海"
 wolfhome_title:0 "狼之家"
 wolfhome_desc:0 "狼之家是近界域之一，位于地球的近影界。它是狼族经常光顾的地方。该界域是一片广阔的原始荒野。这里隐藏着对原始奥秘的答案。"
 wolfhome_tooltip:0 ""
 wolfhome_confirm:0 "踏入狼之家"
 aetherial_realm_title:0 "以太界"
 aetherial_realm_desc:0 "以太界。也被称为乙太界，是影界内最广的近界域，横跨灵之荒野，直到影幕。它在物质世界的景象即是天空，不断循环着黑夜和白天。"
 aetherial_realm_tooltip:0 ""
 aetherial_realm_confirm:0 "飞入以太界"
 court_of_eshtarra_title:0 "埃什塔拉的宫廷"
 court_of_eshtarra_desc:0 "埃什塔拉，歌者，是狼族占星学中的地球星君。"
 court_of_eshtarra_tooltip:0 "$UMBRA_HEAD$$court_of_eshtarra_custom_1$"
 court_of_eshtarra_confirm:0 "拜见地球星君"
 court_of_sokhta_title:0 "索赫塔的宫廷"
 court_of_sokhta_desc:0 "索赫塔是露娜的法相之一，该天神是狼族和其他许多变形者的守护神，她的宫廷里有许多月使和其他同情狼国的灵。"
 court_of_sokhta_tooltip:0 "$UMBRA_HEAD$$court_of_sokhta_custom_1$"
 court_of_sokhta_confirm:0 "拜见月之星君"
 court_of_katanka_sonnak_title:0 "卡坦卡·索纳克的宫廷"
 court_of_katanka_sonnak_desc:0 "卡坦卡·索纳克，风骑士，是狼族占星学中的太阳星君。"
 court_of_katanka_sonnak_confirm:0 "拜见日之星君"
 court_of_mitanu_title:0 "米塔努的宫廷"
 court_of_mitanu_desc:0 "米塔努，聪慧浪人，是狼族占星学中的水星的星君。他既是诡计大师，也是喜剧爱好者。"
 court_of_mitanu_tooltip:0 "$UMBRA_HEAD$$court_of_mitanu_custom_1$"
 court_of_mitanu_confirm:0 "拜见水星灵君"
 court_of_hakahe_title:0 "哈卡赫的宫廷"
 court_of_hakahe_desc:0 "哈卡赫是祝融星——比水星更靠近太阳的假想星球——的星君，他被认为是铸造新生狼族的灵魂的负责者。"
 court_of_hakahe_tooltip:0 "$UMBRA_HEAD$$court_of_hakahe_custom_1$"
 court_of_hakahe_confirm:0 "拜见祝融星灵君"
 court_of_tambiyah_title:0 "坦比娅的宫廷"
 court_of_tambiyah_desc:0 "坦比娅，蒙面母亲，是狼族占星学中的金星的星君。 "
 court_of_tambiyah_tooltip:0 "$UMBRA_HEAD$$court_of_tambiyah_custom_1$"
 court_of_tambiyah_confirm:0 "拜见金星灵君"
 court_of_nerigal_title:0 "尼格尔的宫廷"
 court_of_nerigal_desc:0 "尼格尔，冰战士，是狼族占星学中的火星的星君。"
 court_of_nerigal_tooltip:0 "$UMBRA_HEAD$$court_of_nerigal_custom_1$"
 court_of_nerigal_confirm:0 "拜见火星灵君"
 court_of_rorg_title:0 "罗尔格的宫廷"
 court_of_rorg_desc:0 "罗尔格，多爪猎人，是狼族占星学中的罗尔格星的星君，罗尔格星的毁灭导致了小行星带的形成。"
 court_of_rorg_tooltip:0 "$UMBRA_HEAD$$court_of_rorg_custom_1$"
 court_of_rorg_confirm:0 "拜见小行星带灵君"
 court_of_zarok_title:0 "扎罗克的宫廷"
 court_of_zarok_desc:0 "扎罗克，加冕君主，是狼族占星学中的木星的星君。"
 court_of_zarok_tooltip:0 "$UMBRA_HEAD$$court_of_zarok_custom_1$"
 court_of_zarok_confirm:0 "拜见木星灵君"
 court_of_lu_bat_title:0 "鲁·帕特的宫廷"
 court_of_lu_bat_desc:0 "鲁·帕特，和平顾问，是狼族占星学中的土星的星君。"
 court_of_lu_bat_tooltip:0 "$UMBRA_HEAD$$court_of_lu_bat_custom_1$"
 court_of_lu_bat_confirm:0 "拜见土星灵君"
 court_of_ruatma_title:0 "鲁阿特玛的宫廷"
 court_of_ruatma_desc:0 "鲁阿特玛，阴影者，是天王星的星君。"
 court_of_ruatma_tooltip:0 "$UMBRA_HEAD$$court_of_ruatma_custom_1$"
 court_of_ruatma_confirm:0 "拜见天王星灵君"
 court_of_shantar_title:0 "尚塔尔的宫廷"
 court_of_shantar_desc:0 "尚塔尔，织机造者，是海王星的星君。"
 court_of_shantar_tooltip:0 "$UMBRA_HEAD$$court_of_shantar_custom_1$"
 court_of_shantar_confirm:0 "拜见海王星灵君"
 court_of_meros_title:0 "梅罗斯的宫廷"
 court_of_meros_desc:0 "梅罗斯，流浪者，是冥王星的星君。"
 court_of_meros_tooltip:0 "$UMBRA_HEAD$$court_of_meros_custom_1$"
 court_of_meros_confirm:0 "拜见冥王星灵君"
 weaver_reaches_title:0 "织者境"
 weaver_reaches_desc:0 "织者境是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。没有生命的迹象存在。巨大的织者之灵，如“星蜘蛛”，在网中巡逻和维护，并确保一切都保持在其规定的位置。"
 weaver_reaches_tooltip:0 "$UMBRA_HEAD$$weaver_reaches_custom_1$"
 weaver_reaches_confirm:0 "进入织者境"
 wyld_reaches_title:0 "奇原境"
 wyld_reaches_desc:0 "奇原境是一个混沌的地方。行星和彗星根据不断变化的法则相互碰撞，相互舞动。燃烧的冷太阳冻结了周围的一切，而其他的恒星则以其周边的反重力波将一切推开。"
 wyld_reaches_tooltip:0 "$UMBRA_HEAD$$wyld_reaches_custom_1$"
 wyld_reaches_confirm:0 "进入奇原境"
 wyrm_reaches_title:0 "妖蛆境"
 wyrm_reaches_desc:0 "妖蛆境的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向秽恶界域。满是污染和火焰的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。"
 wyrm_reaches_tooltip:0 "$UMBRA_HEAD$$wyrm_reaches_custom_1$"
 wyrm_reaches_confirm:0 "进入妖蛆境"
 shard_realm_of_prime_title:0 "根源之碎域"
 shard_realm_of_prime_desc:0 "与地球和月球相关联的[shard_realm|E]。"
 shard_realm_of_prime_tooltip:0 "$UMBRA_HEAD$$shard_realm_of_prime_custom_1$"
 shard_realm_of_prime_confirm:0 "进入根源之碎域"
 first_horizon_title:0 "初穹界"
 first_horizon_desc:0 "初穹界位于地球大气层的边缘，遍布着穹界界域，包括有[shade_realm|E]。"
 first_horizon_tooltip:0 ""
 first_horizon_confirm:0 "飞入初穹界"
 true_horizon_title:0 "真穹界"
 true_horizon_desc:0 "真穹界，被科技联盟称为亚空间，被以太之子称为以太空间，是位于近影界和远影界之间的广阔影界。对沉睡者来说，它表现为太阳和小行星带之间的空间。"
 true_horizon_tooltip:0 ""
 true_horizon_confirm:0 "飞入真穹界"
 far_horizon_title:0 "远穹界"
 far_horizon_desc:0 "远穹界大致对应于小行星带的所在处。"
 far_horizon_tooltip:0 ""
 far_horizon_confirm:0 "飞入远穹界"
 deep_umbra_title:0 "深影界"
 deep_umbra_desc:0 "深影界，也叫深宇宙，是地球影界空间之外的浩瀚界域。它主要是无穷无尽的虚空。从人类的角度来看，深影界即是深太空、外太空或整个宇宙。"
 deep_umbra_tooltip:0 "$UMBRA_HEAD$$deep_umbra_custom_1$"
 deep_umbra_confirm:0 "飞入深影界"
 malfeas_title:0 "秽恶界域"
 malfeas_desc:0 "秽恶界域是位于深影界的疯狂妖蛆神体界域。这是一个地狱般的噩梦世界，充满了所有可以想象的可怕东西，还有一些可怕到仅仅试图想象就会使人发疯的事物。"
 malfeas_tooltip:0 "$UMBRA_HEAD$$malfeas_custom_1$"
 malfeas_confirm:0 "#X 堕入秽恶界域#!"
 black_spiral_labyrinth_title:0 "黑螺旋迷宫"
 black_spiral_labyrinth_desc:0 "黑螺旋迷宫，在中原被称为玄黑迷宫，是秽恶界域内的一个螺旋形迷宫，里面有难以想象的妖蛆之恐怖。"
 black_spiral_labyrinth_tooltip:0 "$UMBRA_HEAD$$black_spiral_labyrinth_custom_1$$UMBRA_BREAK$$black_spiral_labyrinth_custom_2$"
 black_spiral_labyrinth_confirm:0 "#X 行于黑螺旋#!"
 first_city_title:0 "第一城"
 first_city_desc:0 "第一城，除其他别名外，也被称为以诺城，被挪得学家认为是《挪得之书》所记载的该隐神话的历史上的第一座城市。"
 first_city_tooltip:0 "$UMBRA_HEAD$$first_city_custom_1$"
 first_city_confirm:0 "#X 传送到第一城#!"
 shard_realm_of_infinity_title:0 "无限之碎域"
 shard_realm_of_infinity_desc:0 "与太阳相关联的[shard_realm|E]。"
 shard_realm_of_infinity_tooltip:0 ""
 shard_realm_of_infinity_confirm:0 "进入无限之碎域"
 shard_realm_of_correspondence_title:0 "空间之碎域"
 shard_realm_of_correspondence_desc:0 "与水星相关联的[shard_realm|E]。"
 shard_realm_of_correspondence_tooltip:0 ""
 shard_realm_of_correspondence_confirm:0 "进入空间之碎域"
 shard_realm_of_life_title:0 "生命之碎域"
 shard_realm_of_life_desc:0 "与金水星相关联的[shard_realm|E]。"
 shard_realm_of_life_tooltip:0 ""
 shard_realm_of_life_confirm:0 "进入生命之碎域"
 shard_realm_of_forces_title:0 "力之碎域"
 shard_realm_of_forces_desc:0 "与火星相关联的[shard_realm|E]。"
 shard_realm_of_forces_tooltip:0 ""
 shard_realm_of_forces_confirm:0 "进入力之碎域"
 shard_realm_of_matter_title:0 "物质之碎域"
 shard_realm_of_matter_desc:0 "与木星相关联的[shard_realm|E]。"
 shard_realm_of_matter_tooltip:0 ""
 shard_realm_of_matter_confirm:0 "进入物质之碎域"
 shard_realm_of_time_title:0 "时间之碎域"
 shard_realm_of_time_desc:0 "与土星相关联的[shard_realm|E]。"
 shard_realm_of_time_tooltip:0 ""
 shard_realm_of_time_confirm:0 "进入时间之碎域"
 shard_realm_of_spirit_title:0 "灵之碎域"
 shard_realm_of_spirit_desc:0 "与天王星相关联的[shard_realm|E]。"
 shard_realm_of_spirit_tooltip:0 ""
 shard_realm_of_spirit_confirm:0 "进入灵之碎域"
 shard_realm_of_mind_title:0 "心智之碎域"
 shard_realm_of_mind_desc:0 "与海王星相关联的[shard_realm|E]。"
 shard_realm_of_mind_tooltip:0 ""
 shard_realm_of_mind_confirm:0 "进入心智之碎域"
 shard_realm_of_entropy_title:0 "熵之碎域"
 shard_realm_of_entropy_desc:0 "与冥王星相关联的[shard_realm|E]。"
 shard_realm_of_entropy_tooltip:0 ""
 shard_realm_of_entropy_confirm:0 "进入熵之碎域"
 shade_realm_of_correspondence_title:0 "空间之影域"
 shade_realm_of_correspondence_desc:0 "与水星相关联的[shade_realm|E]。无法从地球直接抵达这个影域，而那些设法抵达那里的人发现自己在全维空间中按照不可知的几何移动。"
 shade_realm_of_correspondence_tooltip:0 ""
 shade_realm_of_correspondence_confirm:0 "进入空间之影域"
 shade_realm_of_life_title:0 "生命之影域"
 shade_realm_of_life_desc:0 "与金星相关联的[shade_realm|E]。该界域是郁郁葱葱、不断变化的丛林。它与地球的相对可及性使其成为升华之战的频繁战场。"
 shade_realm_of_life_tooltip:0 ""
 shade_realm_of_life_confirm:0 "进入生命之影域"
 shade_realm_of_forces_title:0 "力之影域"
 shade_realm_of_forces_desc:0 "与火星相关联的[shade_realm|E]。力之影域是永无止境的风暴，罕见的有相对平静的孤立地点。多赛梯堡占据了安定点之一，至少在它被摧毁之前是如此。和生命之影域一样，它也是一个频繁的（和危险的）法师战斗场地。"
 shade_realm_of_forces_tooltip:0 ""
 shade_realm_of_forces_confirm:0 "进入力之影域"
 shade_realm_of_matter_title:0 "物质之影域"
 shade_realm_of_matter_desc:0 "与木星相关联的[shade_realm|E]。这个领域可能与空心地球有关，也可能只是类似，但规模要大得多——一个由恐龙、失落文明和其他不复存在的事物组成的帝国。"
 shade_realm_of_matter_tooltip:0 ""
 shade_realm_of_matter_confirm:0 "进入物质之影域"
 shade_realm_of_time_title:0 "时间之影域"
 shade_realm_of_time_desc:0 "与土星相关联的[shade_realm|E]。任何进入时间之影域的访客都冒着严重的风险，因为即使是最轻微的移动也会导致时间扭曲和不受控制的时间旅行。"
 shade_realm_of_time_tooltip:0 ""
 shade_realm_of_time_confirm:0 "进入时间之影域"
 shade_realm_of_spirit_title:0 "灵之影域"
 shade_realm_of_spirit_desc:0 "与天王星相关联的[shade_realm|E]。在灵之影域没有险棘：灵与凡人可以直接互动。法师的化身也有可能在这里显现躯体并与他们交谈。"
 shade_realm_of_spirit_tooltip:0 ""
 shade_realm_of_spirit_confirm:0 "进入灵之影域"
 shade_realm_of_mind_title:0 "心智之影域"
 shade_realm_of_mind_desc:0 "与海王星相关联的[shade_realm|E]。正如人们所期望的那样，心智之影域的性质是由人们觉得那里会有什么的想法所决定的。它像一面镜子一样反射出来访者自己的想法和感受。"
 shade_realm_of_mind_tooltip:0 ""
 shade_realm_of_mind_confirm:0 "进入心智之影域"
 shade_realm_of_entropy_title:0 "熵之影域"
 shade_realm_of_entropy_desc:0 "与冥王星相关联的[shade_realm|E]。据称在这里，宇宙的大因果轮回被暴露无遗，它甚至可能与幽土有直接关联。"
 shade_realm_of_entropy_tooltip:0 ""
 shade_realm_of_entropy_confirm:0 "进入熵之影域"
