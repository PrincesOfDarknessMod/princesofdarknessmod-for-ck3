 game_concept_kureksarra:0 "库雷克萨拉"
 game_concept_kureksarra_desc:0 "库雷克萨拉，被称为红色平原，是[dreaming|E]中的[hearts_realm|E]。\n\n作为一片战争不断的领域，库雷克萨拉是斗争、竞争、胜利和复仇的梦的故乡。广袤的平原上散落着坚固设施的废墟，它曾经是一片绿色界域，拥有宜人的风景和宁静的庄园。如今，只剩下一片尸骨和破碎武器遍布的土地，地面不再孕育生命。只有枯萎的老橡树依然屹立，下雨时滴下红色树液，如同鲜血。通往库雷克萨拉的道路是刀刃和剃刀组成的路径。这个曾经优雅的双子首都如今成了充满骨头和尘土中的血腥残垣断壁。"
 kureksarra_confirm:0 "漫游库雷克萨拉"
