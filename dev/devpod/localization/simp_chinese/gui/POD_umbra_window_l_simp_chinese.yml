 game_concept_earth:0 "地球"
 game_concept_earth_desc:0 "物质世界。在实相的“固体”现实的星球中，地球通常被称为“世界”，以表明她的首要地位。地球之灵是盖亚，地球之影被称为[penumbra|E]。\n\n$POD_splat_werewolf_plural$和其他化形者称之“[gaia_realm|E]”，以赞颂地球之灵盖亚。\n\n$POD_splat_wraith_plural$称这一界域为[skinlands|E]，与连接[underworld|E]（暗影界）的[shadowlands|E]（暗半影界）相对。\n\n在#TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L 戚族#!#!的通俗说法中，苏醒世界就是地球……地球上不在影界或[dreaming|E]中的部分。也被称为迟暮界、未实现的梦境和肉体界。"
