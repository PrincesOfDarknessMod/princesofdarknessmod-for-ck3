 game_concept_sun:0 "太阳"
 game_concept_sun_desc:0 "深影界中，托举着赫利俄斯的地方充满了灼热的白光。由类似太阳耀斑的红光构成的桥梁横跨着深不见底的峡谷，其中充满了超高温的原子化元素。火元素灵君在此居住，开朗而爽快，却怀揣着保卫界域免受入侵者侵扰的使命。它们会攻击任何进入领域的狼人，但对崇拜太阳神赫利俄斯的科拉克斯和其他信仰者则表示欢迎。赫利俄斯界域内的任何表面都过于炙热，无法长时间站立或靠近。只有飞行的灵体才能进入深影界的这个区域，而没有飞行能力的旅行者还没来得及意识到自己的错误，就已经在火焰中烧毁。"
