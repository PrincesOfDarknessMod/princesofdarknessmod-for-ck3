 umbra_realm_neter_khertet: "尼特–赫特"
 umbra_realm_neter_khertet_desc: "在[UmbraGlossary('dark_kingdom_of_sand')]建立之前，埃及的亡者居住在尼特–赫特，即“神圣的地下场所”。"
