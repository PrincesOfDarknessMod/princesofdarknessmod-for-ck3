 game_concept_the_homeland_of_the_wendigo:0 "温迪戈之母界"
 game_concept_the_homeland_of_the_wendigo_desc:0 "温迪戈的母界是一片永恒寒冬的冰川苔原，夜空上有着巨大的北极光。暴风雪在这片土地上咆哮着，迅速摧毁那些找不到温迪戈隐藏定居点的人。它与其他各种邻近界域相连，包括以太诸境、传奇界、泛古界以及乌克特纳和克洛坦的母界。"
