 game_concept_hell_of_spiked_chains:0 "刺链地狱"
 game_concept_hell_of_spiked_chains_desc:0 "刺链地狱是一个广阔而平坦的平原，居住着那些在大草原上死去的凡人的灵魂。阎魔会随机将这些灵魂分配给一个部落，而他本人则定期选择其中一个部落作为自己的宠儿。其他部落则会被剥夺一种感官（或肢体），并且必须在所有事情上服从宠儿部落的命令。如果他们违抗，或者宠儿心情不好，他们将被处以刺链地狱的折磨。受害者们被用冥铸的带刺铁链束缚起来，悬挂在一座巨大洞穴的钟乳石上，时间不确定。每当受害者挣扎时，刺会更深地咬进他们的本质中，供养阎魔。"
