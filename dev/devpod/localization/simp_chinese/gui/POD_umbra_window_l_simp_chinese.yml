 umbra_realm_kingdom_of_dan: "大梦之国"
 umbra_realm_kingdom_of_dan_desc: "[Glossary('大梦','game_concept_dan_desc')]之国是[UmbraGlossary('deep_dreaming')]的[Glossary('梦呓界域','game_concept_oneiric_realm_desc')]之一。\n\n在一个没有固定边界的世界中，存在着两条假设的线，一些梦境地图制作者用它们来衡量已知[UmbraGlossary('dreaming')]的范围：中轴线和平分线。第一条线从上到下测量[UmbraGlossary('dreaming')]。第二条线从左到右横穿[UmbraGlossary('dreaming')]，作为一个粗略的赤道。与对[UmbraGlossary('dreaming')]的任何测量一样，这主要是一种构想，旨在为本来混乱的宇宙赋予一些秩序感。在这个虚构的中轴线的顶端，就是[Glossary('大梦','game_concept_dan_desc')]之国。"
 umbra_realm_kureksarra: "库雷克萨拉"
 umbra_realm_kureksarra_desc: "库雷克萨拉，被称为红色平原，是[UmbraGlossary('dreaming')]中的[Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')]。\n\n作为一片战争不断的领域，库雷克萨拉是斗争、竞争、胜利和复仇的梦的故乡。广袤的平原上散落着坚固设施的废墟，它曾经是一片绿色界域，拥有宜人的风景和宁静的庄园。如今，只剩下一片尸骨和破碎武器遍布的土地，地面不再孕育生命。只有枯萎的老橡树依然屹立，下雨时滴下红色树液，如同鲜血。通往库雷克萨拉的道路是刀刃和剃刀组成的路径。这个曾经优雅的双子首都如今成了充满骨头和尘土中的血腥残垣断壁。"
 umbra_realm_rubezhal: "鲁贝扎尔"
 umbra_realm_rubezhal_desc: "鲁贝扎尔是[UmbraGlossary('dreaming')]中的[Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')]。\n\n隐藏在[UmbraGlossary('dreaming')]的表面之下，位于山丘下的隧道、洞穴和魔法洞窟中，鲁贝扎尔领域几乎成为一个独立的世界。妖精们在梦的根部和山脉之间建造了许多最华丽的国度，这些国度由宝石和贵金属编织而成，由巧妙制作的内部太阳和月亮照亮。"
 umbra_realm_capecia: "开辟锡亚"
 umbra_realm_capecia_desc: "开辟锡亚，时钟之城，是[UmbraGlossary('dreaming')]的[Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')]之一。\n\n开辟锡亚的梦华是巧夺天工。在时钟之城，被奴役的换生灵和其人类盟友创造出由锡制玩具、自动机器、傀儡纸偶统治的界域。工匠的技艺业已征服时间，借着其非血肉所构筑，而是更耐用的材质——黄铜塑胶；电线皮革、心木橡胶。这座繁华城市的一切不只是人造的，还是全自动的。这是一个使血肉换生灵像困惑的幽灵一样漂流的世界。人体模型挤满了移动的人行道，用僵硬的双腿快速前行，像是跳着永无休止的舞蹈。在上方傀儡们用玻璃眼睛透过办公室窗户凝视着，而其他造物则在喋喋不休地谈论着他们装满报纸的脑袋里想到的任何事情。锡狗追着锡猫，锡猫追着锡鼠永无止尽。"
 umbra_realm_irrgarten: "一篱迷宫"
 umbra_realm_irrgarten_desc: "一篱迷宫是[UmbraGlossary('dreaming')]中关于漫游的[Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')]。\n\n一篱迷宫位处蜿蜒仙路的交织之处。此界域是梦游时分歧纠結道路的中心和源头。无论这些小路是石头迷宫的回廊、翻花绳的丝线，还是森林荆棘丛生的小径，都是一篱迷宫的面貌。所有来到此处求索仙路之艺或者其他智慧的存在都必须面对再也找不到出路的可能性。那些太不幸的个体意外寻到此处注定会失败，除非他们运气和机智兼备。"
 umbra_realm_arike: "爱离客"
 umbra_realm_arike_desc: "爱离客，悔恨帝国，是[UmbraGlossary('dreaming')]的[Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')]之一。\n\n你失去的事物都在此。再也无法相见的朋友与情人，未曾走过的道路，你愿意付出一切来重活一次的那一刻……都在此处。这就是爱离客，曾经的和可能的梦想创造之处。"
 umbra_realm_myrmitown: "摩尔摩镇"
 umbra_realm_myrmitown_desc: "摩尔摩镇是博甘的[Glossary('梦乡','game_concept_home_realm_desc')]。\n\n摩尔摩镇最令人吃惊之处是建筑技术和博甘用作驮兽的巨大奇魅蚂蚁。这些蚂蚁被用于从食物到运输的各种用途。这里的博甘非常擅长培育这种奇魅，以至于他们为每种类型的工作都准备了不同的蚂蚁。"
 umbra_realm_the_tunnels: "百隧"
 umbra_realm_the_tunnels_desc: "百隧是斯珞俄的[Glossary('梦乡','game_concept_home_realm_desc')]。\n\n百隧是迷宫般的地下网路，十分容易迷路。尽管有新形成的地面巨大裂缝也是几乎无光照。即使是熟悉此区域的斯珞俄有时都会迷路，因为岩崩会使先前可通行的道路变得无法通行。此处也有许多危险的奇魅居民。大多数对斯珞俄很友好，但偶尔疯狂的奇魅对斯珞俄的攻击也并非闻所未闻。"
 umbra_realm_balloon: "噗弄"
 umbra_realm_balloon_desc: "噗弄是噗咔的[Glossary('梦乡','game_concept_home_realm_desc')]。\n\n进入噗弄有数个入口，每一个沿途都有测试陷阱，常客来来往往。几乎欢迎所有存在，除了那些有暴力倾向的个体（掉进噗弄来寻找晚餐的哀怒廷红帽子很可能被羞辱打伤，最后被弹出。如果他能活过弹出过程的话，其身体也会有千处伤口）。即使是仙族也被欢迎，有时甚至被接受，只要他不试图对每个看到的存在都发号施令并保持一种“有趣”的气氛。当然，没有入口陷阱或是常见的社交玩笑可以使仙族出乖露丑，但这也不会阻止大多数噗弄居民的不断尝试。"
 umbra_realm_vale_of_mists: "迷障谷"
 umbra_realm_vale_of_mists_desc: "迷障谷是将[UmbraGlossary('near_dreaming')]与[UmbraGlossary('far_dreaming')]、[UmbraGlossary('deep_dreaming')]隔开的神秘屏障，此处的遗忘迷障最为强烈。"
 umbra_realm_fields_behind: "后域"
 umbra_realm_fields_behind_desc: "后域是近梦界和[UmbraGlossary('far_dreaming')]之间的过渡地带，在[UmbraGlossary('vale_of_mists')]和更大领域的一部份之中。"
 umbra_realm_bullydale_wastes: "不利岱尔荒野"
 umbra_realm_bullydale_wastes_desc: "不利岱尔荒野是[UmbraGlossary('dreaming')]的[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]之一。\n\n通过[UmbraGlossary('fields_behind')]后仙路逐渐凶险，越来越不能称为道路，而更近于狩猎小径。妖精村庄规模更小更少见，逐渐稀疏到只剩下孤身旅客，与零散的简陋小屋。小屋居民也越来越诡怪，此处是食人者、怪客、强盗、女巫的地区。"
 umbra_realm_low_dukedoms: "恶俗公国"
 umbra_realm_low_dukedoms_desc: "夸可思和骂可思的恶俗公国是临近[UmbraGlossary('vale_of_mists')]的[Glossary('美梦界域','game_concept_dream_realm_desc')]。\n\n走向[UmbraGlossary('bullydale_wastes')]的极限，狭隘的自私和暴力变得更加不经大脑，阴谋越来越令人发指。通常法则扭曲最后塌碎成荒谬。一旦荒谬的行为才是规则，那旅行者终于抵达恶俗公国——[UmbraGlossary('dreaming')]的诡计与闹剧中心。"
 umbra_realm_blotkeldur: "怖拉忑剋渡尔"
 umbra_realm_blotkeldur_desc: "怖拉忑剋渡尔是[UmbraGlossary('near_dreaming')]中的[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]之一。\n\n居无定所的阿切詈从未有过[Glossary('梦乡','game_concept_home_realm_desc')]，但如果有的话，有些人认为怖拉忑剋渡尔会很适合他们。寒冷潮湿、灰暗惨淡，怖拉忑剋渡尔是一片无止尽的毒沼泽，有着蜿蜒曲折的小河和令人作呕的植披。在该界域最黑暗的地区深处，有独眼巨人的巨大城市群，用剥下来的巨兽白骨所建造，这些巨兽在[UmbraGlossary('dreaming')]最深处之外早已灭绝。"
 umbra_realm_wastelands: "废土"
 umbra_realm_wastelands_desc: "废土是[UmbraGlossary('deep_dreaming')]的[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]之一，也是细数悲伤之池的所在。\n\n废土是黑暗悲惨的地方，噩梦永远统治着此处。在这无尽的[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]中，凡人更加扭曲的激情和恐惧不断恶化和增长。伞菌森林和充满潮湿有毒地衣的山谷覆盖着曾经拥有与[UmbraGlossary('arcadia')]宫殿相媲美的土地。于此黑暗是完全的，塔林对这片土地有着不可否认的统治。没有任何理智的换生灵敢造访此处，除了为了一个简单的事实——细数悲伤之池坐落在废土的中心。据说，这座水池向任何能够凝视其深处的人揭示了一切过去。深层界域中的许多换生灵声称看过水池的幻象。这可能只是[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]统治者编造的谎言，也可能不止如此。一些人声称这是所有戚族一条可能的道路。"
 umbra_realm_hieronymus_continuum: "耶罗尼米斯连续体"
 umbra_realm_hieronymus_continuum_desc: "耶罗尼米斯连续体是远梦界或[UmbraGlossary('deep_dreaming')]的[Glossary('美梦界域','game_concept_dream_realm_desc')]之一，有些声称是诺克发祥地。\n\n该界域的实际外观和维度是诺克物理学家争论的焦点。一些传说记载第一批诺克来自此梦域，他们乘坐一个巨大的机械蛋来到地球。很少诺克拥护此传说，私下认可[UmbraGlossary('arcadia')才是他们真正的家园，但他们几乎所有人都会在争论中像弹簧刀弹出般快速说出这个故事，作为他们比其他妖精优越的“证据”。有些声称这个连续体不仅仅是另一个梦域，而是一个完全不同维度的一部分，这个维度存在于[UmbraGlossary('dreaming')]之外时空连续体的折叠中。达到此界域并回归的诺克总是带着对发明的深刻洞察。唯一已知的到达方法是佩戴德尔塔波头盔通过[UmbraGlossary('far_dreaming')]中的裂隙异常。"
 umbra_realm_wyldweir: "荒野堰"
 umbra_realm_wyldweir_desc: "荒野堰是[UmbraGlossary('near_dreaming')]的[Glossary('美梦界域','game_concept_dream_realm_desc')]之一。\n\n这片森林覆盖的山区之前是阿卡迪亚的保护国，在日蚀时分裂成数个势力。"
 umbra_realm_the_homeland_of_the_corax: "科拉克斯之母界"
 umbra_realm_the_homeland_of_the_corax_desc: "科拉克斯的母界是一棵巨大的树，树上有无数伸展的枝条，枝条上布满了适合筑巢的角落。赫利俄斯的光辉永远照耀着这棵树，它几乎连接着每一个影界领域，让渡鸦人可以快速通过。"
 umbra_realm_the_homeland_of_the_nuwisha: "努维沙之母界"
 umbra_realm_the_homeland_of_the_nuwisha_desc: "努维沙的母界被称为郊狼神的隧道。整个界域是一个椭圆形的房间，中央有一张巨大的桌子，上面摆满了食物，永远不会空。墙壁上鳞次栉比的门通向努维沙去过的任何地方。其中有些门是锁着的，但会在看似随意的时候打开。"
 umbra_realm_brobdingnag: "大人国"
 umbra_realm_brobdingnag_desc: "在大人国[Glossary('美梦界域','game_concept_dream_realm_desc')]中，居住着一些巨人，他们的体型非常巨大，还没有哪个旅行者能引起他们的注意：来访者会被忽略或无意中被压扁。"
 umbra_realm_arawns_forge: "阿隆的煅炉"
 umbra_realm_arawns_forge_desc: "阿伦恩的煅炉是[UmbraGlossary('far_dreaming')]的[Glossary('稳定点','game_concept_stable_point_desc')]。\n\n这座孤立的山黑如弗摩尔族的心脏，阿隆曾在此统治王庭。山的侧面像湿玻璃一样光滑，山峰周围呼啸的风甚至阻止了龙飞近着陆。空气寒冷刺骨，周围土地都覆盖着一层厚厚的冰霜。但在漆黑的夜色中，此山中心位于巅峰的深坑喷涌出一道光芒。光芒明亮到足以将总是围绕着这个作呕地方的云层底部染成血红色。"
 umbra_realm_great_dream_forest: "梦之巨林"
 umbra_realm_great_dream_forest_desc: "梦之巨林，也被称为[Glossary('大梦','game_concept_dan_desc')]林或是和缓之林，是[UmbraGlossary('far_dreaming')]中绝无仅有的森林。\n\n[UmbraGlossary('far_dreaming')]只有一座森林。这座巨林古老雄伟，危机四伏，占地比清醒世界的任何大陆都广阔。任何可以想见的树种，无论其“真实”与否都存在于此。甚至延伸至[UmbraGlossary('slumbering_oceans')]底下，远至于多数戚族视界之外的土地。"
 umbra_realm_discordant_woods: "不谐林区"
 umbra_realm_discordant_woods_desc: "不谐林区是[UmbraGlossary('great_dream_forest')]的一部份，也是[UmbraGlossary('far_dreaming')]相对的[Glossary('稳定点','game_concept_stable_point_desc')]之一。\n\n尽管果树之实甜美营养，林间之土舒适安卧，栖息之兽玲琅满目，不谐林区却弥漫无声的恐怖。不谐林区是迷人的。"
 umbra_realm_sea_of_sorrow: "哀伤之海"
 umbra_realm_sea_of_sorrow_desc: "哀伤之海是[UmbraGlossary('far_dreaming')]的[Glossary('稳定点','game_concept_stable_point_desc')]之一。\n\n在远离巨林之处，细如粉末的沙子吹过贫瘠的土地，吞噬了所有敢于穿越这片广阔土地的存在。有一条仙路蜿蜒穿过这片尘埃海洋，在不断的湍流中延伸出银色路径，而这些湍流常常会完全吞噬仙路，过段时间它才再次发光。据说巨大的沙浪可以轻易地撕碎血肉，留下的东西少到甚至连秃鹰也找不到任何值得注意之物。哀伤之海保守着秘密。从来没有人沿着银色路径穿过这片荒漠并回来讲述另一边的情况。"
 umbra_realm_great_chasm: "大裂口"
 umbra_realm_great_chasm_desc: "大裂口是[UmbraGlossary('near_dreaming')]中的[Glossary('稳定点','game_concept_stable_point_desc')]。\n\n大裂口位于与凡俗世界的大峡谷相同的位置，它是[UmbraGlossary('near_dreaming')]表面上的一道无底裂缝。很少有戚族敢于大胆或愚蠢到深入其中，因为这里隐藏着许多谜团。"
 umbra_realm_great_engine: "宏伟引擎"
 umbra_realm_great_engine_desc: "宏伟引擎是[UmbraGlossary('deep_dreaming')]的[Glossary('稳定点','game_concept_stable_point_desc')]之一。\n\n在无尽之夜的贫瘠冰原之外，冰巨人居住于此并使用巨魔作为私人奴隶，有一台非凡的机器。宏伟引擎一直都在安放的地方。梦变并没有改变这座耸天遗迹的形状，亿万年的流逝也没有对这座巨大建筑造成任何损害。宏伟引擎静止在一个角度，一动不动，沉默无声。该机器等待的地方无风吹拂。没有生物居住其阴影下。"
 umbra_realm_lake_of_sorrows: "哀伤之湖"
 umbra_realm_lake_of_sorrows_desc: "哀伤之湖是[UmbraGlossary('near_dreaming')]的[Glossary('稳定点','game_concept_stable_point_desc')]之一。\n\n在炽日王国大盐湖的位置，哀伤之湖则是[UmbraGlossary('near_dreaming')]中的镜像。湖水深处藏着一座难以置信美丽和难以言喻雄伟的城市。塔楼矗立在水下，距离空中只有几英寸。偶尔当个体凝视着深处时，会看到这座城市的居民抬头回望。超出凡人想象范围的宝藏在深处闪闪发光，时而握在居民手中，时而搁在湖深处珍珠母色的鹅卵石上。这座城市蓬勃发展，充满了换生灵熟悉或陌生的戚族。然而，就算拥有强大力量和惊人能力，也无法到达这座水面下的城市。"
 umbra_realm_rivers_of_phantasia: "幻河"
 umbra_realm_rivers_of_phantasia_desc: "幻河是[UmbraGlossary('near_dreaming')]中的[Glossary('稳定点','game_concept_stable_point_desc')]。\n\n诸条幻河在[UmbraGlossary('near_dreaming')]覆盖着北美大陆，就像科罗拉多河、密西西比河和格兰德河覆盖着北美一样。尽管只有少数王国被这些水域所赐福，但当换生灵设法找到它们时，它们的影响力总是能被感受到。这些河流的水清澈甘甜，如同最美的梦境。饮用它们足以平息一切渴望，甚至可以治愈真实和虚幻的伤口。据说，在幻河的某些地方，换生灵甚至可以抹去岁月的痕迹。从这些水域中饮水的老者可以变得年轻，甚至恢复到儿童时代。虽然这种年龄变化并不会导致记忆的丧失，但观念却会颠倒：不仅身体变得年轻，灵魂也随之年轻。"
 umbra_realm_seas_of_dream: "梦海"
 umbra_realm_seas_of_dream_desc: "梦海是[UmbraGlossary('near_dreaming')]中对应着地球诸海的[Glossary('稳定点','game_concept_stable_point_desc')]。\n\n[UmbraGlossary('near_dreaming')]中有海洋，就像清醒世界中有海洋一样。虽然它们反映了各片世俗海洋的位置，但梦海本身就是一种奇迹。在海洋的深处，亚特兰蒂斯仍然沉睡，人鱼们在那里建造自己的家园。巨大的利维坦在这里沉睡，等待着适当的时机展现自己的存在，并做着连戚族也无法理解的梦。城市漂浮在海浪之下，有些繁荣兴旺，有些早已被遗弃，所有的一切都等待着将它们的秘密揭示给任何足够好奇和勇敢去探索的人。"
 umbra_realm_slumbering_oceans: "沉眠之洋"
 umbra_realm_slumbering_oceans_desc: "沉眠之洋是[UmbraGlossary('far_dreaming')]中的[Glossary('稳定点','game_concept_stable_point_desc')]。\n\n[UmbraGlossary('far_dreaming')]中的巨大海洋与近和[UmbraGlossary('deep_dreaming')]相连。这里的水域浑浊深沉，太过深邃和黑暗，无法揭示它们的秘密。这些广袤的海洋延伸至[UmbraGlossary('dreaming')]中的其他土地，从未有过戚族踪迹的神秘界域。有人声称达南神族乘船航行过沉眠之洋，返回他们最初——在[UmbraGlossary('dreaming')]真正形成之前的时代——的所在地。"
 umbra_realm_splintered_mountains: "碎裂山脉"
 umbra_realm_splintered_mountains_desc: "碎裂山脉是[UmbraGlossary('far_dreaming')]的相对[Glossary('稳定点','game_concept_stable_point_desc')]之一。\n\n碎裂山脉横跨千里，在[UmbraGlossary('far_dreaming')]的黑暗土地中开出一条大道。在这里，传说中的巨人和往昔的怪物们安家落户，寻找任何愚蠢到他们领地的人作为营养。鹰身女妖驾驭着寒冷的石峡谷之风，渴望折磨换生灵，而蛇怪则潜伏在破碎塔楼的阴影中。在大碎溃之前达南神族统治的时代，许多戚族在碎裂山脉中丧生。山洞中隐藏着宝藏，有人相信通往[UmbraGlossary('arcadia')]道路只能通过寻找那些如今废墟般的达南神族宫殿中被抛弃的宝藏来找到。这可能是谎言，也可能是真相，但所有仙族都记得经过这一片阴险、耸立着石塔的山脉回到清醒世界。"
 umbra_realm_middlemarch: "米德尔马契"
 umbra_realm_middlemarch_desc: "米德尔马契是[UmbraGlossary('near_dreaming')]的一个界域。\n\n在巨大的[UmbraGlossary('splintered_mountains')]的山脚下，米德尔马契地区的干旱石地构成了[UmbraGlossary('near_dreaming')]中最严酷的一些地区。"
 umbra_realm_chakravada: "查克拉瓦达"
 umbra_realm_chakravada_desc: "查克拉瓦达是[UmbraGlossary('dreaming')]中最大的山峰。\n\n查克拉瓦达山位于[UmbraGlossary('splintered_mountains')]中，是所有山峰中最大的一座，也是所有世界的中心，至少在梦中，它是有或的。"
 umbra_realm_goblin_market: "哥布林市场"
 umbra_realm_goblin_market_desc: "哥布林市场是[UmbraGlossary('deep_dreaming')]中的妖精市场。\n\n在[UmbraGlossary('deep_dreaming')]的[UmbraGlossary('mistweir')]旁，距离[UmbraGlossary('fin_bheara')]妖精乡数百里之遥，矗立着一座由帐篷和亭子组成的集市，被称为哥布林市场。市场上有无与伦比的强大和稀有的珍宝出售，还有超越凡人理解的愉悦和秘密。哥布林市场由十几位哥布林和他们的红帽子打手统治。只要拥有金钱或货物可供交易，任何人都可以进入市场。"
 umbra_realm_distant_cities: "梦市蜃楼"
 umbra_realm_distant_cities_desc: "梦市蜃楼是[UmbraGlossary('near_dreaming')]的一种现象。\n\n在[UmbraGlossary('near_dreaming')]中，有一种常见的现象被称为梦市蜃楼。这些奇特的地方无疑是美丽的，几乎总是难以到达的。它们是地平线上的景象，奇迹和荣耀的所在，犹如春天初日的阳光一样明亮。有时，它们似乎只有几英里远，而有时又仿佛相隔百里。但无论如何，它们都令人陶醉，充满了晶莹的塔楼和金桥，五彩斑斓的旗帜和萦绕在耳边的音乐。即使在数英里之外，人们也能看到梦市蜃楼的居民，并渴望与他们相遇，因为毫无疑问，如此美景中的人一定知道通往[UmbraGlossary('arcadia')]的路径。"
 umbra_realm_fin_bheara: "芬贝拉镇"
 umbra_realm_fin_bheara_desc: "芬·贝拉是一位真妖精博甘，而在[UmbraGlossary('deep_dreaming')]中的妖精乡就以他的名字命名。\n\n沿着大屏障，几个世纪以来涌现出各种大小的村庄和城镇，由妖精平民居民组成，他们声称离开了[UmbraGlossary('arcadia')]，前往远离仙族的地方。其中最大的城镇被称为芬贝拉镇，以殖民这片土地的博甘命名。芬贝拉镇包括各种仙族，甚至包括许多声称在大碎溃前[UmbraGlossary('arcadia')]就拒绝他们的仙族。"
 umbra_realm_mistweir: "迷障堰"
 umbra_realm_mistweir_desc: "迷障堰[UmbraGlossary('far_dreaming')]和[UmbraGlossary('deep_dreaming')]之间的最后屏障。迷障堰完全环绕着[UmbraGlossary('deep_dreaming')]，是凡世与梦幻之间的屏障。"
 umbra_realm_dream_burrow: "梦窟"
 umbra_realm_dream_burrow_desc: "梦窟是由噗咔换生灵在[UmbraGlossary('near_dreaming')]中挖掘的袖珍界域，用于躲避板讷。\n\n许多不同的梦窟容纳了各种数量不同的噗咔。它们相互隔离，每一个都以自己独特的方式演化。这些穴居的大小不一，有些只能容纳一家兔噗咔，而有些则是由各种物种组成的奇幻森林。每一个梦窟都有其独特的风味和景观，这取决于将其梦化为现实的换生灵或换生灵们。即使经过这么长时间，许多梦窟仍然存在，隐藏起来并茁壮成长。"
 umbra_realm_madness_realm: "狂乱域"
 umbra_realm_madness_realm_desc: "一座狂乱域指代[UmbraGlossary('near_dreaming')]中的部分之一，某些疯癫的人类梦种会给这儿的戚族带来时不时的麻烦。\n\n狂乱域也许是[UmbraGlossary('near_dreaming')]中最为危险的地区。那些与理智脱钩的凡物之梦往往会在这儿实体化为可怖之物。狂乱之梦有着极其强大的力量，在梦境中漫游的旅行者稍有不慎，便会被扭曲的现实困住，非一时半会能够脱身。"
 umbra_realm_meridianus: "午界"
 umbra_realm_meridianus_desc: "午界是达南神族留下的一个类似虚空的领域，充满了狂暴的风和阴影奇魅，用来抵御魔妖。\n\n前往秋暮世界的魔妖很快就会发现，到达地球比返回要容易得多。地球对于虚幻的黑暗一族施加着一种黑暗而沉重的心灵引力，让他们很难逃脱。这种“心灵引力”以几种方式显现。其中最重要的是位于迷障之外的[UmbraGlossary('near_dreaming')]中的一个区域，被称为午界。这个区域是达南神族留下的古老防御措施，用来强制执行银之禁令。这是一个呼啸着风暴和几乎没有实质的界域，几乎无法导航，而且还有危险的奇魅出没。这些黑色的、阴影般的物质被称为梦影，它们会攻击任何前来的黑暗一族，溶解他们的奇魅物质。魔妖只有在离开清醒世界时才会遇到这个界域的奇特之处，而不是进入时。"
 umbra_realm_sea_of_silver: "白银之海"
 umbra_realm_sea_of_silver_desc: "白银之海，是[UmbraGlossary('deep_dreaming')]的浩瀚大洋。\n\n这是无尽的光明、黄昏和阴影的海洋，成为了[UmbraGlossary('deep_dreaming')]和弗摩尔族的黑王廷；这片海洋有千千万万个名字，每一个名字都代表着一个梦想的心灵；这无边无际的海洋将[UmbraGlossary('far_dreaming')]与[UmbraGlossary('deep_dreaming')]分隔开来。可以称之为无底之海，或者黄昏之海，或者暮色之海，或者梦境之海，甚至是大风暴。所有希望离开远梦界的旅程从此而起，也必须告别银之径和所有其他舒适的指引和试炼标记所划定的明确边界。"
 umbra_realm_snail_graveyards: "蜗牛坟场"
 umbra_realm_snail_graveyards_desc: "蜗牛坟场是在[UmbraGlossary('dreaming')]中已知的六个地点，蜗牛在意识到自己将要死去时前往这些地方。\n\n由于路途艰难，垂死的蜗牛行动缓慢，大多数蜗牛都无法到达坟场，而是在途中的某个地方死去。事实上，对于换生灵来说，找到最近的蜗牛坟场最简单的方法之一就是跟随脚下碎片般的蜗牛壳的残迹。一路上，壳在地面上逐渐变厚，最终来到了蜗牛坟场。最古老和最强壮的蜗牛前往[UmbraGlossary('arike')]以死去。"
 umbra_realm_spawning_fields: "梦诞域"
 umbra_realm_spawning_fields_desc: "梦诞域是凡人梦境直接注入[UmbraGlossary('dreaming')]的地方。\n\n在最好的情况下，梦诞域都是危险的。它们是纯粹梦华的混乱海洋，是[UmbraGlossary('dreaming')]与秋暮世界之间的直接、单向连接。奇魅不断在这些能量喷泉中诞生，但往往很快就会死去。梦诞域似乎随机地出现在[UmbraGlossary('near_dreaming')]中，也同样变幻莫测地消失。"
 umbra_realm_tenebrous_realm: "阴暗界域"
 umbra_realm_tenebrous_realm_desc: "阴暗界域是那些银之径之外的界域之一，除了知道它居住着魔妖，换生灵几乎不了解它。\n\n阴暗界域没有明确的地图或边界，它是换生灵用来定义那些银之径之外的界域的一个总称。对于除了最冒险的换生灵之外的所有人来说，这些地方被认为是黑暗、陌生和危险的。而对于居住在那里的魔妖来说，它们只是……家园。"
 umbra_realm_winterweir: "凛冬堰"
 umbra_realm_winterweir_desc: "凛冬堰是[UmbraGlossary('far_dreaming')]的界域之一。\n\n凛冬堰位于[UmbraGlossary('forest_of_lies')]的冬季区域，沿着[UmbraGlossary('sea_of_silver')]的一条近海支流，是一个凉爽、迷雾重重的神秘之地。这里是水妖族的家园，森林中很少有地方能像凛冬堰一样茂密而荒凉……也很少有地方能像凛冬堰一样危险。生活在这里的水妖族对陌生人疑神疑鬼，除非其受到适当的庇护，一般都会将其赶走。有些这样做只是为了确保自己独处，有些则是恶意的。前者的怀疑理由是充分的，尤其是考虑到最近的伯格之裔袭击和近距离活动。"
 umbra_realm_forest_of_lies: "谎言之森"
 umbra_realm_forest_of_lies_desc: "谎言之森是[UmbraGlossary('great_dream_forest')]的一部分，也是[UmbraGlossary('far_dreaming')]中的相对[Glossary('稳定点','game_concept_stable_point_desc')]之一。\n\n谎言之森的运行模式对于大多数人来说过于复杂，难以理解。它总是与[UmbraGlossary('far_dreaming')]和[UmbraGlossary('deep_dreaming')]的分界线相接。正是在谎言之森中，阿斯特兰和他的随从与叹息峡谷的蜘蛛展开了激战。谎言之森内没有任何善良之物。这里一切皆是黑暗和沉思，很可能是由人类对原始森林的恐惧所孕育出来的。古老而扭曲的树木结出的果实苦涩，常常对戚族有毒。这里的动物都以捕食为生，大多数都长得足够庞大，足以让一支巨魔军队犹豫不决。"
 umbra_realm_maharaurava: "大叫唤大地狱"
 umbra_realm_maharaurava_desc: "大叫唤大地狱是奈落在[UmbraGlossary('near_dreaming')]的[Glossary('梦乡','game_concept_home_realm_desc')]。\n\n罗波那之死给予了奈落的[Glossary('梦乡','game_concept_home_realm_desc')]最大的打击，它昔日的美丽已经永远消失。大叫唤大地狱位于相当于印度西北部的[UmbraGlossary('near_dreaming')]，当隐匿之人部署他们的灵之炸弹时，它位于爆炸中心。除了阿及利外，几乎没有其他生物曾经到访过这个界域。换生灵的传说称这个地区曾经是最美丽而残酷的领域之一，由巨大的宝石山脉组成，即使是最小的石头也价值连城。奈落是阿修罗妖精种族的一部分，他们生活在文明而残酷的辉煌中，居住在雪白山脉上雕刻的巨大宫殿中，在果园里悠然自得，完善音乐、爱与痛苦的艺术。根据传说，他们的职责是惩罚邪恶的人类灵魂，将他们煮沸在这个地区的铜河中。"
 umbra_realm_sun: "太阳"
 umbra_realm_sun_desc: "[UmbraGlossary('deep_umbra')]中，托举着赫利俄斯的地方充满了灼热的白光。由类似太阳耀斑的红光构成的桥梁横跨着深不见底的峡谷，其中充满了超高温的原子化元素。火元素灵君在此居住，开朗而爽快，却怀揣着保卫界域免受入侵者侵扰的使命。它们会攻击任何进入领域的狼人，但对崇拜太阳神赫利俄斯的科拉克斯和其他信仰者则表示欢迎。赫利俄斯界域内的任何表面都过于炙热，无法长时间站立或靠近。只有飞行的灵体才能进入深影界的这个区域，而没有飞行能力的旅行者还没来得及意识到自己的错误，就已经在火焰中烧毁。"
 umbra_realm_paradox_realms: "矛盾界域"
 umbra_realm_paradox_realms_desc: "矛盾界域是由特别粗俗的法师积累的矛盾所创造的专属界域。矛盾界域通常会呈现与引发它们的冒犯行为相关的形式；一个因投掷火球而被放逐的法师可能会发现自己置身于一片永恒之火的湖畔，或者是一座火柴城中。"
 umbra_realm_heaven: "天堂"
 umbra_realm_heaven_desc: "天堂，是超凡且飘渺的神圣居所，是上帝和众耶洛因的居所。它曾是堕天者在叛乱之前的家园。\n\n自天怒之战结束以来，天堂与人间已经断绝了联系，造物主的手也大多远离了堕落的尘世。\n\n天堂的倒影仍然存在于[umbra|E]中，居民将其命名为乐土。它更多地是以人类对天堂的感知为蓝本，而非真正意义上的天堂。"
 umbra_realm_dark_kingdom_of_wire: "线之冥府"
 umbra_realm_dark_kingdom_of_wire_desc: "线之[Glossary('冥府','game_concept_dark_kingdom_desc')]是欧洲[UmbraGlossaryLocalized('shadowlands','冥界')]的一个区域，是在纳粹大屠杀中丧生的死灵——附鬼的家园。虽然它不是真正的[Glossary('冥府','game_concept_dark_kingdom_desc')]，但它独立于统治着欧洲大部分死者的[UmbraGlossary('dark_kingdom_of_iron')]。"
 umbra_realm_digital_web: "数位网络"
 umbra_realm_digital_web_desc: "数位网络是完全基于虚拟现实的区域，也是虚拟行者的非官方基地。它将成为虚拟行者“现实2.0”计划的基础，将人类引向一个摆脱地球物质现实问题的更美好世界。就像互联网是一种虚拟的“空间”，与实际位置无关一样，数位网络在理论上是一个重要的对应点。它可能与阿里巴廷的卡夫山有某种联系。"
 umbra_realm_kakuri: "断绝"
 umbra_realm_kakuri_desc: "断绝亦被称为夜域，是由[Glossary('阎魔王','podgloss.yamaking')][Glossary('艾玛·欧','podgloss.emmao')]所掌控的[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]。\n乃是一个无光、无乐、无荣誉的阴性冰雪世界。\n作为阿伊努人的故有领地，断绝地狱为[Glossary('艾玛·欧','podgloss.emmao')]的原始崇拜者提供了一条秘密出路。"
 umbra_realm_wicked_city: "妖邪之城"
 umbra_realm_wicked_city_desc: "妖邪之城，一个充满了赛博朋克和极端动漫元素的噩梦，结合了疯狂的风水和管理理论，此处汇聚了贪婪与资本主义最恶劣的元素，浸淫在幽冥的腐化氛围中，同时也是幽冥界内扩张最迅猛的地狱之一。"
 umbra_realm_hell_of_burrowing_maggots: "蛀蛆地狱"
 umbra_realm_hell_of_burrowing_maggots_desc: "蛀蛆地狱。由瘟疫母主让达控制。蛀蛆地狱和它听起来差不多。这是一个地狱。里面有蛆虫。很多。各种形状和大小。你是它们的午餐。"
 umbra_realm_hell_of_being_skinned_alive: "剥皮地狱"
 umbra_realm_hell_of_being_skinned_alive_desc: "剥皮地狱。[Glossary('斗姆','podgloss.toumu')]的领域。剥皮地狱是一片不断吹拂着快速、细腻、刺人的沙尘的沙漠。没有防护的生物在几分钟内就会被剥皮。[Glossary('斗姆','podgloss.toumu')]本人统治着一座位于近地轨道上的宫殿，宫殿装饰着那些惹恼她的人的受穿刺（和活着的）躯体。"
 umbra_realm_hell_of_boiling_oil: "滚油地狱"
 umbra_realm_hell_of_boiling_oil_desc: "滚油地狱。其实都是脂肪。美味的人类脂肪。"
 umbra_realm_hell_of_bitter_truth: "痛苦事实之地狱"
 umbra_realm_hell_of_bitter_truth_desc: "痛苦事实之地狱是宗教狂热者的归宿。虽然痛苦事实之地狱没有身体上的折磨，但对于这些虔诚的信徒来说，被告知他们不配进入天堂，甚至更糟糕的是，他们所信仰的宗教是错误的，这种想法成为了他们持续的痛苦之源。恨天的恶魔仆从经常提醒囚犯们他们不配见证众神，并有时提供灵魂一种“救赎”办法，以达到他们神明的领域。当然，所有这些都是诡计，往往涉及效忠[Glossary('阎魔王','podgloss.yamaking')]，一旦他们了解真相，受害者们会陷入更深的绝望。"
 umbra_realm_hell_of_spiked_chains: "刺链地狱"
 umbra_realm_hell_of_spiked_chains_desc: "刺链地狱是一个广阔而平坦的平原，居住着那些在大草原上死去的凡人的灵魂。[Glossary('阎魔王','podgloss.yamaking')]会随机将这些灵魂分配给一个部落，而他本人则定期选择其中一个部落作为自己的宠儿。其他部落则会被剥夺一种感官（或肢体），并且必须在所有事情上服从宠儿部落的命令。如果他们违抗，或者宠儿心情不好，他们将被处以刺链地狱的折磨。受害者们被用[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]铸造的带刺铁链束缚起来，悬挂在一座巨大洞穴的钟乳石上，时间不确定。每当受害者挣扎时，刺会更深地咬进他们的本质中，供养[Glossary('阎魔王','podgloss.yamaking')]。"
 umbra_realm_earth: "地球"
 umbra_realm_earth_desc: "物质世界。在实相的“固体”现实的星球中，地球通常被称为“世界”，以表明她的首要地位。地球之灵是盖亚，地球之影被称为[UmbraGlossary('penumbra')]。\n\n$POD_splat_werewolf_plural$和其他化形者称之“[Glossary('盖亚界域','game_concept_gaia_realm_desc')]”，以赞颂地球之灵盖亚。\n\n$POD_splat_wraith_plural$称这一界域为[Glossary('皮囊之地','game_concept_skinlands_desc')]，与连接[UmbraGlossaryLocalized('shadowlands','冥界')]（暗影界）的[UmbraGlossary('shadowlands')]（暗半影界）相对。\n\n在#TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L 戚族#!#!的通俗说法中，清醒世界就是地球……地球上不在影界或[UmbraGlossary('dreaming')]中的部分。也被称为秋暮界、未实现的梦境和肉体界。"
 umbra_realm_the_homeland_of_the_uktena: "乌克特纳之母界"
 umbra_realm_the_homeland_of_the_uktena_desc: "乌克特纳的母界酷似未受殖民的净土。如今，这些部族的最后祖灵只居住在母界中。独特的神话生物和美洲原住民传说中的英雄也在这个领域中定居，并与乌克特纳交换秘密以获取持续的保护。这个界域与[UmbraGlossary('abyss')]有联系，还与角蛇本神居住的[UmbraGlossary('galunlati')]有着联系。"
 umbra_realm_the_homeland_of_the_wendigo: "温迪戈之母界"
 umbra_realm_the_homeland_of_the_wendigo_desc: "温迪戈的母界是一片永恒寒冬的冰川苔原，夜空上有着巨大的北极光。暴风雪在这片土地上咆哮着，迅速摧毁那些找不到温迪戈隐藏定居点的人。它与其他各种邻近界域相连，包括以太诸境、[UmbraGlossary('legendary_realm')]、[UmbraGlossary('pangaea')]以及乌克特纳和克洛坦的母界。"
 umbra_realm_the_homeland_of_the_croatan: "克洛坦之母界"
 umbra_realm_the_homeland_of_the_croatan_desc: "克洛坦的土地酷似北美的针叶林。气候永远凉爽而多雾，偶尔会有降雨。这片故乡没有任何能量散发，整个地区异常安静。龟神在界域的中心处沉睡，偶尔在梦中微动。"
 umbra_realm_the_homeland_of_the_bunyip: "本耶普之母界"
 umbra_realm_the_homeland_of_the_bunyip_desc: "这片界域拥有多样的气候，包括热带红树林沼泽、深谷、温带灌木丛和寒带雨林。这里代表着本耶普建造了家园和歌颂的每片土地。它不仅有[UmbraGlossary('dreamtime')]的生物，还有澳大利亚已经灭绝的动物的灵体。"
 umbra_gaia_possesion_confirm: "请求盖亚眷染"
 umbra_gaia_possesion_tooltip: "召唤盖亚将你重塑为她意志的延伸。"
