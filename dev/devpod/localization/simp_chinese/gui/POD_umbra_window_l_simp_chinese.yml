 game_concept_hell_of_bitter_truth:0 "痛苦事实之地狱"
 game_concept_hell_of_bitter_truth_desc:0 "痛苦事实之地狱是宗教狂热者的归宿。虽然痛苦事实之地狱没有身体上的折磨，但对于这些虔诚的信徒来说，被告知他们不配进入天堂，甚至更糟糕的是，他们所信仰的宗教是错误的，这种想法成为了他们持续的痛苦之源。恨天的恶魔仆从经常提醒囚犯们他们不配见证众神，并有时提供灵魂一种“救赎”办法，以达到他们神明的领域。当然，所有这些都是诡计，往往涉及效忠阎魔，一旦他们了解真相，受害者们会陷入更深的绝望。"
