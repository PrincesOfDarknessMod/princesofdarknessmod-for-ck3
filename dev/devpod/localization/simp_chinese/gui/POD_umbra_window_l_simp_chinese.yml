 game_concept_blotkeldur:0 "Blotkeldur"
 game_concept_blotkeldur_desc:0 "The Blotkeldur is a [nightmare_realm|E] in the [near_dreaming|E].\n\nThe nomadic acheri have never had a home realm, but if they did, some say the Blotkeldur would suit them. Cold, wet, and dismal, the Blotkeldur is an endless morass of poisoned marshes, shallow meandering rivers, and sickly scrub. Deep in the darkest regions of the realm are vast, cyclopean cities built from the denuded ivory bones of behemoths long extinct in all but the deepest [dreaming|E]."
