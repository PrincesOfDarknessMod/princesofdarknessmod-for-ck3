 has_gauntlet5_modifier_tooltip: "地产有修正：[GetModifier( 'gauntlet5_modifier' ).GetNameWithTooltip|L]"
 umbra_realm_grand_hall: "荣耀大厅"
 umbra_realm_grand_hall_desc: "它像幻影一样从星雾中升起——有着无数门的荣耀大厅。它从不在原地停留太久，但总是保持着类似的模样——稀疏但温馨的跨世界走廊，采用地中海古典风格，用古老的木材和马赛克瓷砖装饰。"
 umbra_realm_the_homeland_of_the_black_furies: "黑怒之母界"
 umbra_realm_the_homeland_of_the_black_furies_desc: "黑怒的母界类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中，最近还出现了来自世界各地的建筑。众多的捕食者、猎物和人类居住在这母界。所有的生物都作为自然界中生物链的一部分而活着，任何一方都不会被过度猎杀或饿死。"
 umbra_realm_the_homeland_of_the_bone_gnawers: "啮骨者之母界"
 umbra_realm_the_homeland_of_the_bone_gnawers_desc: "啮骨者的母界就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。城外是一片丘陵地带，有轻盈的森林和肥硕的牛群。"
 umbra_realm_the_homeland_of_the_children_of_gaia: "盖亚之子之母界"
 umbra_realm_the_homeland_of_the_children_of_gaia_desc: "盖亚之子的母界是一片广阔的森林，其下山丘连绵起伏，潺潺的溪流在山谷中蜿蜒流淌。摆脱了妄悸的人类在母界各地游荡，中央的大都市是座纯洁化的古苏美尔城市。成群的独角兽之灵在山上吃草，每位访客都会得到一只独角兽魂侣，他们会引导访客穿越这个王国。"
 umbra_realm_the_homeland_of_the_fianna: "芬尼安之母界"
 umbra_realm_the_homeland_of_the_fianna_desc: "芬尼安的母界是一片由丘陵、峡谷和山谷组成的绿色景观，看起来像是从经典奇幻小说中汲取的一样。妖精们在树林里玩耍，雄鹿之灵在牡鹿的指导形成“狂猎”在土地上游荡，保护母界免受入侵者的侵扰。自发的庆祝活动在母界很常见，往往会把所有听到的人吸引到一起。"
 umbra_realm_the_homeland_of_the_get_of_fenris: "芬里尔仔兽之母界"
 umbra_realm_the_homeland_of_the_get_of_fenris_desc: "被永恒冬季所笼罩的峡湾、广袤的苔原、和寒冷黑暗的寒温带针叶林构成了芬里尔的母界。冰河时代的巨型动物群，如冰原狼和猛犸象，在这片土地上游荡，并攻击任何孤行的狼人。芬里尔聚集在长屋村，他们在那里喝酒、打斗、狂欢，并将他们的事迹传为萨迦。"
 umbra_realm_the_homeland_of_the_glass_walkers: "[SelectLocalization( And(GetVariableSystem.Exists( 'spirit_travel_open' ), IsDefaultGUIMode), 'glasswalker_CUSTOM', 'glasswalker_modern_name')]之母界"
 umbra_realm_the_homeland_of_the_glass_walkers_desc: "[SelectLocalization( And(GetVariableSystem.Exists( 'spirit_travel_open' ), IsDefaultGUIMode), 'glasswalker_CUSTOM', 'glasswalker_modern_name')]的母界是一座按照盖亚风格设计建造的大都市。有着带着几十层露天花园的高塔，充满了植被和自然吸引到这些植物边的鸟类和动物。每个花园都迎合了不同的生态环境。许多人类愉快地在少数的几座塔内度过他们的一生。"
 umbra_realm_the_homeland_of_the_red_talons: "赤爪之母界"
 umbra_realm_the_homeland_of_the_red_talons_desc: "赤爪的母界是一个广大的、未受开发的荒野。捕食者不受限制地捕猎，相互竞争。最重要的是大群的狼，它们已经主宰了这片母界。"
 umbra_realm_the_homeland_of_the_shadow_lords: "影爵之母界"
 umbra_realm_the_homeland_of_the_shadow_lords_desc: "影爵生活在一个以大山为主的区域，天空永远被乌云和闪电风暴笼罩。山下的山峰和森林处于永恒的阴影之中，影爵们聚集在城堡里，互相密谋，寻找登山的方法。"
 umbra_realm_the_homeland_of_the_stargazers: "星占之母界"
 umbra_realm_the_homeland_of_the_stargazers_desc: "星占的母界是一个旨在检验狼族五大形态的界域。比喜马拉雅山还高的山峰占据了该界域的中心。一圈山麓围绕着这些山峰的底部，覆盖着茂密的草原、沙漠或雄伟的森林。还有可以满足任何狼族炼心所需要的寺庙。"
 umbra_realm_the_homeland_of_the_silver_fangs: "银牙之母界"
 umbra_realm_the_homeland_of_the_silver_fangs_desc: "银牙的母界是一片广阔的领土，类似于大草原。猎鹰之灵在天空中翱翔，监视着任何访客，并提醒猎鹰他们的存在。在王国的中心矗立着英雄城堡，这是纪念银牙为狼国所奉献的事迹的纪念碑。"
 umbra_realm_the_homeland_of_the_silent_striders: "寂静漫游者之母界"
 umbra_realm_the_homeland_of_the_silent_striders_desc: "寂静漫游者的母界被一条巨大的河流所主导，它被称为生命之河。它被永远的黑夜所笼罩，其他地方都是由大片银色的沙漠组成，以刻有象形文字的方尖碑和类似的纪念性建筑为中心，精心排列出纪念古老的寂静漫游者英雄的星座。"
 umbra_realm_the_former_homeland_of_the_white_howlers: "前白嚎之母界"
 umbra_realm_the_former_homeland_of_the_white_howlers_desc: "白嚎的前母界已经被$glossary_wyrm$扭曲得面目全非。空气中弥漫着浓浓的烟雾，荡漾着热浪。病态的绿色阳光照射在地面上，没有任何形式的臭氧层阻挡。夜晚，污染物冷却并沉入地表，没有带来任何缓解，导致月亮在蒸汽中呈现荧光黄色。"
 umbra_realm_elemental_courts: "元素庭"
 umbra_realm_elemental_courts_desc: "在旅行者真正到达五大门之前，在众峰的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。"
 umbra_realm_the_court_of_the_muses: "缪斯庭"
 umbra_realm_the_court_of_the_muses_desc: "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。"
 umbra_realm_dis: "狄斯"
 umbra_realm_dis_desc: "摆渡人所拥有的一点组织是以狄斯为中心的，狄斯是[UmbraGlossary('tempest')]中的一个由堡垒、洞穴和船只组成的马尾藻海。这里有他们的主要聚集地，他们的档案和制造部门的总部，以及他们的小型委员会。"
 umbra_realm_mirror_zone: "镜域"
 umbra_realm_mirror_zone_desc: "神秘的“镜域”喜欢向它的“客人”展示可能发生的事情。"
 umbra_realm_null_zone: "巫径"
 umbra_realm_null_zone_desc: "巫径是一条由小路组成的迷宫，通往[umbra|E]的大部分领域。这里的定位很困难，因为道路总是在变化，看起来都是一样的。"
 umbra_realm_city_of_brass: "黄铜城"
 umbra_realm_city_of_brass_desc: "黄铜之城看上去是一座巨大的城市，有八条由各种色调的黄铜和红铜制成的大街道。它是无形世界的巨灵帕夏和想要获得巨灵帮助的术士之间的一个经济中心，而不需要通过使用所罗门法则强迫他们服役来无谓地激怒他们。"
 umbra_realm_calumn: "卡列姆"
 umbra_realm_calumn_desc: "卡列姆是近影界中的一座$glossary_wyrm$领域。当一种特别强烈的、负面的情绪在物理世界的某个地方表达出来时，它们就会显现出来，并在[umbra|E]留下痕迹。它是一块磁铁，吸引着呆在卡列姆附近的忌灵和灵类，用迹象显示出它们各自情绪，甚至无生命的物体也会因接近而受到污染。"
