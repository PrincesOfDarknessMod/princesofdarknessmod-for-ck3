 umbra_cooldown_tt: "[umbra_expedition|E]处于冷却期#weak （[GetPlayer.MakeScope.ScriptValue('next_umbra_expedition_date')|0]天剩余）#!"
 umbra_cooldown_text: "[SelectLocalization( GetScriptedGui('umbra_expedition_cooldown').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'umbra_cooldown_desc', '')]"
 umbra_cooldown_end_toast: "[umbra_expedition|E]可用"
 umbra_cooldown_end_tooltip: "[umbra_expedition|E]现在又可用了"
 umbra_bow_to_demon_confirm: "向恶魔献祭"
 umbra_bow_to_demon_tooltip: "你见不到任何脱离的机会，也许你应该献祭一位囚犯……"
 umbra_realm_galunlati: "加伦拉蒂"
 umbra_realm_galunlati_desc: "加仑拉蒂是乌克特纳部族的图腾——大乌克特纳的灵界居所。这里是神兽的栖息地，也是大自然最危险、最雄伟的地方。在加仑拉蒂中，自然的表现更为显著：山峰更高峻，森林更茂密，河流更湍急，风暴更猛烈。许多想成为长老的乌克特纳必须先到加仑拉蒂是，在那里生存下来，才能被部族的高层接纳。"
 umbra_realm_heavenly_flower_garden: "天之花园"
 umbra_realm_heavenly_flower_garden_desc: "天之花园被描述为众神之家。在这里，死者的灵魂被培养成花朵，并最终绽放成新的躯体，而生者的灵魂则表现为盛开的花朵。在这里，古巫用歌声和诗歌奉承他们，直到他们被接纳为他们在人间的仆人。这旅行被称为“忏法”，巫觋不仅能占卜新生命的诞生，还能与已故亲人的灵魂沟通。"
 umbra_realm_xi_wang_chin: "西王池"
 umbra_realm_xi_wang_chin_desc: "这是一个充满无尽风暴和咆哮波浪的水域，充满了原始元素的愤怒，让所有不属于这个界域的生物都感到不快。只有魔克拉和娜迦知道它的存在，但他们大多避而远之，因为这里的居民极其危险，不可轻易打扰。不过，在某些情况下，娜迦可能会冒险前往西王池寻找他们特别需要的灵赋。"
 umbra_realm_hollow_worlds: "地心世界"
 umbra_realm_hollow_worlds_desc: "空心地球存在的理论不是一个版本，而是一系列版本。从表面上看，地心空洞与中影界中的种种界域相似但其独特之处在于普通人类可以通过某些地下通道、矿井和普通的电梯进入其中。此外，有些人认为地心空洞构成了一种完全不同的[umbra|E]，并将其称为内影界，声称如果地球是一个剧院，大厅外的世界是[umbra|E]，那么地心空洞就在后台。无论如何，试图穿过险棘进入地心空洞的尝试总是以失败告终，这让大多数影界地形理论家感到困惑。"
 umbra_realm_darkside_moon_base: "月球暗面基地"
 umbra_realm_darkside_moon_base_desc: "月球暗面基地是一个虚空工程师建筑，位于月球“暗面”的代达罗斯环形山。据介绍，这里是一个黑暗、压抑的生活和工作场所。"
 umbra_realm_victoria_station: "维多利亚站"
 umbra_realm_victoria_station_desc: "维多利亚站是位于月球半影界的以太之子空间站。它最初是维多利亚时代伦敦的一个火车站，后来成为许多以太之子探索[UmbraGlossary('deep_umbra')]的前沿基地。"
 umbra_realm_mus: "慕斯"
 umbra_realm_mus_desc: "慕斯是水星的唯一卫星，一颗灰色的小石球，由于强大的魔法，地球上的观察者看不到它。"
 umbra_realm_fors_collegis_mercuris: "墨丘利天运学院"
 umbra_realm_fors_collegis_mercuris_desc: "墨丘利天运学院，是一所为赫耳墨斯秘会的新手法师开设的秘密魔法学校。它最初于1190年由博尼撒古斯家族的法师在意大利热那亚郊外建造。在1450年，面对理性之子的袭击压力不断增加，学院被转移到水穹界界域慕斯，即水星的隐形卫星。"
 umbra_realm_seasonal_realms: "四季界域"
 umbra_realm_seasonal_realms_desc: "圣叶的四季界域是[UmbraGlossary('shard_realm_of_life')]（被称为金星的影界倒影）中的四个不同的界域。"
 umbra_realm_cerberus: "刻耳柏洛斯"
 umbra_realm_cerberus_desc: "刻耳柏洛斯是太阳系中一颗冥王星卫星的名字。从地球上看不到它，因此沉睡者从未识别出它。"
 umbra_realm_autochthonia: "自动星"
 umbra_realm_autochthonia_desc: "自动星，被赫耳墨斯秘会派称为“束缚之界域”，是一个由科技联盟控制的停滞之神体界域，它是织者的宏伟化身。自动星存在于遥远的[UmbraGlossary('true_horizon')]上，环绕着太阳，与地球直线相对。"
 umbra_realm_balador: "巴拉多"
 umbra_realm_balador_desc: "巴拉多是由欢喜宗控制的穹界界域秘所，秘学九宗的成员和受尊敬的客人可以在这里享受各种改变心境的愉悦。\n\n关于巴拉多的历史有些模糊，但它在至尊议会召开前就已存在，当时它震惊了来自其他秘学九宗的访客，因为他们只看到了放纵而没有纪律。巴拉多唯一的主要规则是“只要不伤害他人，就任意行事”；在有太多访客违反了这一基本原则的第一部分后，还起草了更详细的行为准则。"
 umbra_realm_gernsback_continuum: "根斯巴克连续体"
 umbra_realm_gernsback_continuum_desc: "根斯巴克连续体是以太之子建造的穹界界域，是以太之子范式的理想化表达。\n\n这个界域看起来就像一座闪闪发光的装饰风艺术之城，到处都是科技奇迹。移动人行道、喷气背包和棱角分明的玻璃建筑都是该界域的特色。夜晚，可以看到天空中被放大的天体。"
 umbra_realm_midrealm: "中界"
 umbra_realm_midrealm_desc: "中界是位于影界中心的一片[umbra|E]界域。它包含了树中之树，构成了实相的原初世界树，还有一个小屋，供各种类型的影族在这里和平相聚。\n\n中界不仅是[umbra|E]的中心，也可能是现实的中心。一些学者认为它甚至可能是卡夫山和/或空间原点。"
 umbra_realm_moreauvia: "莫罗维亚"
 umbra_realm_moreauvia_desc: "莫罗维亚又称科研所第四号科技种植园，是先驱者的穹域构造体，其中有着公约组织的基因改造奴隶。"
 umbra_realm_red_donjon: "红主楼"
 umbra_realm_red_donjon_desc: "法师盟社奥德已经存在了近600年。虽然这个法师组织拥有一个相当大的穹界界域，名为红主楼，但法师们大部分时间都待在爱丁堡及其周边地区。"
 umbra_realm_yenosia: "耶诺西亚"
 umbra_realm_yenosia_desc: "耶诺西亚是一个穹界界域。它最初被称为梦之国，拥有一个名为阿科西亚的法师秘所，秘所成员大多是天国颂歌的和平主义者。"
 umbra_realm_null_b: "虚无贝塔"
 umbra_realm_null_b_desc: "虚无贝塔曾是科技联盟的构造体。它位于[UmbraGlossary('yenosia')]穹界界域的中心。"
 umbra_realm_horizon: "穹界域"
 umbra_realm_horizon_desc: "穹界域是秘学九宗的最大据点，一个穹界界域，其中每个传统宗派的文化和范式都与其他传统宗派相对和谐地共存。"
 umbra_realm_concordia: "肯考迪娅"
 umbra_realm_concordia_desc: "肯考迪娅是[UmbraGlossary('horizon')]的主要城市，是秘学九宗的会议厅的所在地。"
 umbra_realm_copernicus_research_center: "哥白尼研究中心"
 umbra_realm_copernicus_research_center_desc: "哥白尼研究中心是一个巨大的半透明戴森球，由虚空工程师控制。它环绕着半人马座阿尔法星的一颗恒星，半径达1天文单位。"
 umbra_place_periphery_confirm: "捕捉周界"
 broken_mirror_valid_tooltip: "你所处的位置（[GetPlayer.GetCurrentLocation.GetName]）并#bold 不#!拥有[GetBuilding('wyrm_taint_01').GetName]或接受崇魔的[faith|E]"
 umbra_realm_dreamtime: "梦时代"
 umbra_realm_dreamtime_desc: "梦时代是一个只有澳大利亚才有的浅层界域，一个处于[umbra|E]极度表面上的稀有界域，位于险棘和[umbra|E]的起点之间。"
 umbra_realm_islands_of_flint: "弗林特群岛"
 umbra_realm_islands_of_flint_desc: "弗林特群岛，被冥河城制图师称为弗林特[Glossary('冥府','game_concept_dark_kingdom_desc')]，是北美洲原住民的死灵的领地。"
 umbra_realm_feng_tu: "酆都"
 umbra_realm_feng_tu_desc: "酆都是黄泉中的一个界域，以钰皇之力专门创造，是地狱的镜像。"
 umbra_realm_fields_of_aaru: "雅卢平原"
 umbra_realm_fields_of_aaru_desc: "雅卢平原是玛阿特的判官团的居所，位于[UmbraGlossaryLocalized('shadowlands','冥界')]的[UmbraGlossary('dark_kingdom_of_sand')]废墟之中。只有在阿努比斯或其仆人阿肯的陪伴下，木乃伊的无主灵魂才能找到雅卢平原。这里是为那些已经证明自己有资格找到天堂的死灵准备的地方。"
 umbra_realm_isle_of_eurydice: "欧律狄刻岛"
 umbra_realm_isle_of_eurydice_desc: "欧律狄刻岛是命运灵座，也是命运军团及其领袖命运诸女和尊贵的命运女士的总部。欧律狄刻岛是唯一一个不位于冥河城的军团灵座，因此在军团所在地中独一无二。"
 umbra_realm_island_below_the_sea: "海下之岛"
 umbra_realm_island_below_the_sea_desc: "在[UmbraGlossary('mirrorlands')]和[UmbraGlossary('oblivion')]之间的[UmbraGlossary('abyss')]中央，有一座海下之岛，它是不可见者的所在地，也是洛阿的行动基地。"
 umbra_realm_mirrorlands: "镜土"
 umbra_realm_mirrorlands_desc: "镜土是加勒比群岛的[UmbraGlossary('shadowlands')]倒影的名称，是由被称为不可见者的死灵赋予的。"
 umbra_realm_mercury: "水星"
 umbra_realm_mercury_desc: "人们一致认为，水星是一个贫瘠、没有空气的世界，上面布满了数以千计的陨石坑。\n\n由于靠近太阳，水星的影界也很难居住。阿里巴廷曾经在这星球上建有一座秘所。法师们减缓了这星球的自转速度，因此这个建在陨石坑中的定居点总是处于黄昏的边缘。"
 umbra_realm_venus: "金星"
 umbra_realm_venus_desc: "在物质世界中，金星是一个炎热、闷热、无菌的世界，大气层被硫酸污染，令人窒息。然而，与大多数行星不同的是，金星有一个半影界，这反映了金星历史的早期阶段。半影界金星覆盖着郁郁葱葱的热带丛林和浅浅的沼泽海洋。它与生命之领域的联系意味着这里的环境富含各种生物：探险者如果停留时间过长，就有可能被苔藓或真菌侵占，可能需要定期清洁和消毒设备，以防止霉菌污染。"
 umbra_realm_mars: "火星"
 umbra_realm_mars_desc: "火星曾经有人居住，因此有一个半影界，在那里可以很容易地看到沿着古老灵脉的运河残余。不过，即使在半影界，空气也很稀薄，严重的沙尘暴更是一种危险。"
 umbra_realm_jupiter: "木星"
 umbra_realm_jupiter_desc: "木星本身是一个没有地面的气体球，但它的许多卫星却更适合接待访客。在穹界以外的地方，法师们可以施展非凡的魔法，而不必担心矛盾。目前，每颗所谓的伽利略卫星都由不同的法师派系控制，不过势力变换得很快，也很频繁。木星或土星的任何两颗卫星之间的传送门都很容易打开，因此必须加固防御工事，将入侵者拒之门外。"
 umbra_realm_saturn: "土星"
 umbra_realm_saturn_desc: "土星是外太阳系的一颗大型气体巨行星。和木星一样，土星的“地面”也无法真正进入。不过，它的卫星上有许多法师在使用的基地。"
 umbra_realm_uranus: "天王星"
 umbra_realm_uranus_desc: "与木星卫星和土星卫星不同，天王星的卫星不容易通过传送门到达，而且与穹界的距离也让其他旅行方式变得枯燥乏味。阿卡夏兄弟会在其中一颗卫星上设有一个秘所，劫夺者也占据了另外几颗卫星，但大多数访客都是冲着与世隔绝的环境来到天王星的，因此天王星系统在很大程度上还未被开发和占领。另一方面，天王星的[Glossary('影域','game_concept_shade_realm_desc')]却有大量的过客。"
 umbra_realm_neptune: "海王星"
 umbra_realm_neptune_desc: "和天王星一样，海王星上的法师活动也很少。海王星的各个卫星上都有几座秘所，但不清楚哪些有；其中一些秘所可能位于沉睡者尚未命名的卫星上。"
 umbra_realm_pluto: "冥王星"
 umbra_realm_pluto_desc: "冥王星是一个冰冷的小星球，它有一个大得不成比例的卫星，名叫卡戎。冥王星上有一颗隐秘的大卫星，名叫刻耳柏洛斯，善终者在那里建立了一个研究[Glossary('影域','game_concept_shade_realm_desc')]的秘所。他们不允许外人进入；对于试图闯入的法师，他们会毫不犹豫地使用武力击退。"
 umbra_realm_moon: "月亮"
 umbra_realm_moon_desc: "法师们认为月球至少有三种不同的形态，这取决于人们站在险棘的哪一边，以及如何接近它。\n\n月球的物质面是一片贫瘠的岩石荒地，人迹罕至。\n\n月球有半影界，但半影界月球仍然没有生命——尽管这里可以看到废墟，表明情况并非总是如此。\n\n月球的第三种形态是狼族所熟知的，那就是玉兔，或称索赫塔的宫廷，她是月球星君。"
 umbra_realm_qlippoth: "逆卡巴拉界"
 umbra_realm_qlippoth_desc: "逆卡巴拉界是被拒绝的世界，其中包含着一个未完全构建的宇宙，居住着源自织锦受造之前的生物。\n\n逆卡巴拉界的本质并非必然邪恶，但对人类和他们习惯的宇宙来说却是危险的。有些逆卡巴拉界包含了上帝的绝对属性，这将使自由意志不可能，不允许生命的进化；而其他逆卡巴拉界则包含更加超脱的概念，对人类思维来说过于陌生。"
 umbra_realm_doissetep: "以素帖堡"
 umbra_realm_doissetep_desc: "以素帖堡是一座巨大的城堡，直径可达一英里，高达三十层楼。在它存在的许多个世纪中，新的翼楼、层次和附加建筑被增添进来，使其呈现出一种折衷的外观。无数的房间和走廊构成了秘所的上部，而在下面，一条扭曲的隧道巢穴通向山中的各个地下墓穴。秘密通道连接着许多房间，使得知情者可以悄无声息地穿行其中。中心部分是一个巨大的具有东方特色的建筑。"
 umbra_place_blight_confirm: "修习于污秽"
 hellhole_desc: "地狱洞是[UmbraGlossary('penumbra')]中充满妖蛆能量的区域，通常是由于险棘物质侧存在某种特别具有破坏性或毒性的东西。地狱洞对周围的一切都具有极强的破坏性，也是强大忌灵的滋生地。"
 onyx_tower_desc: "玛瑙塔是冥河城永恒的皇帝卡戎的居所。它是冥河城最高的建筑，代表着卡戎的权力和他监管[UmbraGlossary('dark_kingdom_of_iron')]的能力。"
 broken_mirror_desc: "碎镜是指物质世界和[UmbraGlossary('yomi_wan')]之间的界限中因大量凡人的痛苦、污浊之气和荒芜之灵而松动的地方。"
 blight_desc: "污秽是[UmbraGlossary('penumbra')]中因$glossary_weaver$和$glossary_wyrm$之争而受到破坏的区域。从某种程度上说，它们代表了一个城市的所有负面因素，被重新整合并挤压到一个狭小的区域中。"
 umbra_realm_chimare: "奇梦衍"
 umbra_realm_chimare_desc: "有些狼族认为，每个梦境都有奇梦衍代表。事实并非如此，因为[UmbraGlossary('penumbra')]还不够大。它们也不是每个梦的代表，但只要梦在文化潜意识中达到一定程度，它们就会出现。流行的变体也有自己的奇梦衍。有一整组奇梦衍代表了“裸体表演”和“坠落”梦的变体。"
 umbra_realm_demesne: "辖领"
 umbra_realm_demesne_desc: "一座辖领可以指代法师在[UmbraGlossary('dreaming')]中的私有时空。\n\n为了抵达属于自己的辖领，能够深入梦境的特殊连结方式必不可缺，而这种连结方式绝非能言谈面授之物，但叠影也许会从中派上用场。一位法力高深的法师通常可以完全控制属于自己的梦境，而那些较为弱小的法师偶尔会有其余无意识前来的访客。"
 umbra_realm_hive_realm: "蜂巢界域"
 umbra_realm_hive_realm_desc: "蜂巢界域是化身风暴的结果。风暴将一些界域与影幕一同撕裂，并将它们融合到了点缀在[umbra|E]中的新界域中，令人不安。每个试图进入一个界域的法师都有很大机会与蜂巢界域接触。大多数蜂巢界域由血红色的破碎石头组成，空气稀薄，呼吸困难。"
 umbra_realm_central_duchy: "中央公国"
 umbra_realm_central_duchy_desc: "在这个大而不规则的区域中心，有一个镌刻着螺旋图案的圆形石头。庭院周围是极其精巧而威胁人心的建筑，每座都超过一英里高。其中一个巨大的建筑就是宏伟的大教堂，它有一个巨大的彩色玻璃窗，描绘着从地下涌出的触手怪物。这座教堂奉献给九头蛇的所有头领，是[UmbraGlossary('malfeas')]中唯一一个公开欢迎忠于任一头领的人的地方。"
 umbra_realm_maeljin_duchies: "恶神公国"
 umbra_realm_maeljin_duchies_desc: "一道由石头和化石骨头构成的巨大墙壁守卫着[UmbraGlossary('central_duchy')]，每个恶神灵君的领域都与这道墙壁相连，将其四面环绕。中央公国周围的墙壁顶部有着危险的锋利铁钉，经常装饰着那些特别得罪了与该墙壁相连的恶神灵君的人的尸体。"
 umbra_realm_border_duchies: "边境公国"
 umbra_realm_border_duchies_desc: "位于[UmbraGlossary('maeljin_duchies')]之间的[UmbraGlossary('malfeas')]的一些区域看似是贫瘠的荒地，但表象可能具有欺骗性。这些荒地实际上是属于两位回避与其同类互动的恶神灵君的公国。"
 umbra_realm_earth_pit: "地渊"
 umbra_realm_earth_pit_desc: "对于狼人来说，整个[UmbraGlossary('malfeas')]最危险的地方之一就是地渊。地渊位于熵之骑士的沼泽和无名绝望天使的沙漠之间的峡谷中，是一个宽阔的区域，它复制了地球上许多最原始、最繁荣的景观的整体特征，但却是对原始景观的有毒有害版。"
 umbra_realm_elemental_duchies: "元素公国"
 umbra_realm_elemental_duchies_desc: "[UmbraGlossary('malfeas')]的最边缘，有雾霾、恶火、淤泥和毒素四个元素公国。\n\n这四个元素的恶神的宫殿位于每个公国的中心附近。摧毁这些腐化之城堡中的一个可能会削弱该元素，尤其是如果狼族还能永久毁灭该元素恶神的话。"
 umbra_place_broken_lands_confirm: "探索破碎之地"
 umbra_place_vista_confirm: "眺望前景"
 broken_lands_desc: "破碎之地就像一个荒诞不经的故事。你会听到有人说，在一条小路上发现了一个岔路口，而两天前这里还没有岔路口，或者在悬崖上发现了一个洞口。马儿不想走那条路，越靠近就越紧张。有时，这条路会通向一片奇怪的荒野，那里的动物行为不太正常——野兔会猎杀土狼，蜘蛛会用白银织网，秃鹫会吃掉尸体的骨头而不伤害肉。太阳可能好几天都不出来，月亮可能闪着绿色或红色的光芒。"
 vista_desc: "前景是[umbra|E]中的一个区域，它展示出一种反映四个主题之一的表演：死亡、停滞、混沌或起源。\n\n前景无法与之互动，只是向遇到前景的实体展示其主题之一的另一个时间或地点的景象。所描绘的场景显示了一个发生着重大事件的世界，比如宇宙的诞生或僵化的秩序。这些影界场景遍布你的整个视野，仿佛发生的一切就在你的眼前。它们看起来更像是事件而不是影片，影响着旅行者的所有感官。"
