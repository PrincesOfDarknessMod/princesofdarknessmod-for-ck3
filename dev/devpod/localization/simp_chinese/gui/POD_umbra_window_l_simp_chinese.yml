 game_concept_great_chasm:0 "大裂口"
 game_concept_great_chasm_desc:0 "大裂口是[near_dreaming|E]中的[stable_point|E]。\n\n大裂口位于与凡俗世界的大峡谷相同的位置，它是[near_dreaming|E]表面上的一道无底裂缝。很少有戚族敢于大胆或愚蠢到深入其中，因为这里隐藏着许多谜团。"
