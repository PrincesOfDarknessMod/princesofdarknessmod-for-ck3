 game_concept_rubezhal:0 "鲁贝扎尔"
 game_concept_rubezhal_desc:0 "鲁贝扎尔是[dreaming|E]中的[hearts_realm|E]。\n\n隐藏在[dreaming|E]的表面之下，位于山丘下的隧道、洞穴和魔法洞窟中，鲁贝扎尔领域几乎成为一个独立的世界。妖精们在梦的根部和山脉之间建造了许多最华丽的国度，这些国度由宝石和贵金属编织而成，由巧妙制作的内部太阳和月亮照亮。"
