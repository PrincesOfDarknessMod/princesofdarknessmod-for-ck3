 has_prelude_to_apocalypse_perk_tooltip: "   @warning_icon!#X 你#bold 没#!有[perk|E]：[GetPerk('prelude_to_apocalypse_perk').GetName( GetPlayer )]#!"
 custom_name_seaofshadow:0 "黯影之海"
 custom_name_tempest:0 "大风暴"
 custom_name_stormwall:0 "风暴之墙"
 custom_desc_seaofshadow:0 "黯影之海是死灵们用来描述大风暴的“底层”的术语，它围绕着迷宫域和湮灭流淌和流入。"
 custom_desc_tempest:0 "大风暴是一个由能量、记忆和[GetTrait('spectre').GetName( GetPlayer )]组成的永恒恶湍，它从迷宫域中发出，并不断向幽土和冥府倾泻灵质和材料。"
 custom_desc_stormwall:0 "风暴之墙是活人和死人世界之间的一道概念屏障。"
 has_gauntlet4_modifier_tooltip: "伯爵领有修正：[GetModifier( 'gauntlet4_modifier' ).GetNameWithTooltip|L]"
 has_gauntlet5_modifier_tooltip: "伯爵领有修正：[GetModifier( 'gauntlet5_modifier' ).GetNameWithTooltip|L]"
 grand_hall_title:0 "$spirit_travel_header$荣耀大厅"
 grand_hall_desc:0 "它像幻影一样从星雾中升起——有着无数门的荣耀大厅。它从不在原地停留太久，但总是保持着类似的模样——稀疏但温馨的跨世界走廊，采用地中海古典风格，用古老的木材和马赛克瓷砖装饰。"
 grand_hall_effect_desc:0 ""
 grand_hall_option:0 "进入荣耀大厅"
 the_homeland_of_the_black_furies_title:0 "$spirit_travel_header$黑怒之祖界"
 the_homeland_of_the_black_furies_desc:0 "黑怒的祖界类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中，最近还出现了来自世界各地的建筑。众多的捕食者、猎物和人类居住在这祖界。所有的生物都作为自然界中生物链的一部分而活着，任何一方都不会被过度猎杀或饿死。"
 the_homeland_of_the_black_furies_effect_desc:0 ""
 the_homeland_of_the_black_furies_option:0 "回到黑怒之祖界"
 the_homeland_of_the_bone_gnawers_title:0 "$spirit_travel_header$啮骨者之祖界"
 the_homeland_of_the_bone_gnawers_desc:0 "啮骨者的祖界就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。城外是一片丘陵地带，有轻盈的森林和肥硕的牛群。"
 the_homeland_of_the_bone_gnawers_effect_desc:0 ""
 the_homeland_of_the_bone_gnawers_option:0 "回到啮骨者之祖界"
 the_homeland_of_the_children_of_gaia_title:0 "$spirit_travel_header$盖亚之子之祖界"
 the_homeland_of_the_children_of_gaia_desc:0 "The homeland of the Children of Gaia is a vast expanse of lush forests, rolling hills and bubbling streams meandering through the valleys. Humans free of the Delirium wander nomadic across the homeland, with central metropolises that reflect cleaner versions of the cities of ancient Sumer. Herds of unicorn-spirits graze the hills and every visitor gains a unicorn-anamae who guides the visitor through the realm."
 the_homeland_of_the_children_of_gaia_effect_desc:0 ""
 the_homeland_of_the_children_of_gaia_option:0 "回到盖亚之子之祖界"
 the_homeland_of_the_fianna_title:0 "$spirit_travel_header$芬尼安之祖界"
 the_homeland_of_the_fianna_desc:0 "The homeland of the Fianna is a green landscape of hills, dales and vales that look like they were drawn from the traditions of historical fantasy novels. Faeries play in the woods and stag-spirits roam the land under the guidance of Stag as the \"Wild Hunt\", protecting the homeland against intruders. Spontaneous celebrations are common in the homeland and tend to draw together anyone within earshot."
 the_homeland_of_the_fianna_effect_desc:0 ""
 the_homeland_of_the_fianna_option:0 "回到芬尼安之祖界"
 the_homeland_of_the_get_of_fenris_title:0 "$spirit_travel_header$芬里尔仔兽之祖界"
 the_homeland_of_the_get_of_fenris_desc:0 "Fjords, vast expanses of tundra and cold, dark taiga, all enshrouded by perpetual winter, make up the Fenrir's homeland. Packs of ice-age megafauna, like dire wolves and mammoths, roam the land and attack any solitary werewolf. The Fenrir congregate in lodge-villages where they drink, fight, carouse and pass on the sagas of their deeds."
 the_homeland_of_the_get_of_fenris_effect_desc:0 ""
 the_homeland_of_the_get_of_fenris_option:0 "回到芬里尔仔兽之祖界"
 the_homeland_of_the_glass_walkers_title:0 "$spirit_travel_header$[GetPlayer.Custom( 'glasswalker_custom_name' )]之祖界"
 the_homeland_of_the_glass_walkers_desc:0 "The homeland of the [GetPlayer.Custom( 'glasswalker_custom_name' )] is a metropolis build in accordance with Gaian designs. High towers have dozens of open-air garden levels brimming with vegetation and the birds and animals that are naturally attracted to these plants. Each garden caters to a different ecology. Many human happily spend their lives within just a few towers."
 the_homeland_of_the_glass_walkers_effect_desc:0 ""
 the_homeland_of_the_glass_walkers_option:0 "回到[GetPlayer.Custom( 'glasswalker_custom_name' )]之祖界"
 the_homeland_of_the_red_talons_title:0 "$spirit_travel_header$赤爪之祖界"
 the_homeland_of_the_red_talons_desc:0 "The Red Talon homeland is a large, unspoiled wilderness. Predators hunt unrestricted and compete with each other. Foremost are large packs of wolfs that have come to dominate the homeland."
 the_homeland_of_the_red_talons_effect_desc:0 ""
 the_homeland_of_the_red_talons_option:0 "回到赤爪之祖界"
 the_homeland_of_the_shadow_lords_title:0 "$spirit_travel_header$影爵之祖界"
 the_homeland_of_the_shadow_lords_desc:0 "The Shadow Lords live in an area dominated by a Great Mountain, the sky perpetually shrouded by dark clouds and lightning-storms. The peaks and forests below lie in eternal shadow, where the Shadow Lords gather in castles to conspire against each other to find a way to climb the mountain."
 the_homeland_of_the_shadow_lords_effect_desc:0 ""
 the_homeland_of_the_shadow_lords_option:0 "回到影爵之祖界"
 the_homeland_of_the_stargazers_title:0 "$spirit_travel_header$星占之祖界"
 the_homeland_of_the_stargazers_desc:0 "The domain of the Stargazers is a realm designed to test all five forms of the Garou. Mountains higher than the Himalayas occupy the center of the Realm. A ring of foothills surround the base of these peaks, covered in luscious grasslands, deserts or majestic forests. Shrines accommodate to the need of any Garou's internal spiritual exercise."
 the_homeland_of_the_stargazers_effect_desc:0 ""
 the_homeland_of_the_stargazers_option:0 "回到星占之祖界"
 the_homeland_of_the_silver_fangs_title:0 "$spirit_travel_header$银牙之祖界"
 the_homeland_of_the_silver_fangs_desc:0 "The Silver Fang's homeland is a vast expanse of territory that resembles the Russian steppes. Falcon-spirits soar through the sky, watching over any visitor and alerting Falcon of their presence. In the center of the realm stands the Castle of Heroes, a monument to the deeds of the Silver Fangs in service to the Garou Nation."
 the_homeland_of_the_silver_fangs_effect_desc:0 ""
 the_homeland_of_the_silver_fangs_option:0 "回到银牙之祖界"
 the_homeland_of_the_silent_striders_title:0 "$spirit_travel_header$寂静漫游者之祖界"
 the_homeland_of_the_silent_striders_desc:0 "The homeland of the Silent Striders is dominated by a gigantic river called the River of Life. Shrouded in ever-lasting night, it is otherwise made up of large silvery deserts and dominated by obelisks and similar monumental buildings inscribed with hieroglyphs. carefully aligned to highlight constellations commemorating Silent Strider heroes of old."
 the_homeland_of_the_silent_striders_effect_desc:0 ""
 the_homeland_of_the_silent_striders_option:0 "回到寂静漫游者之祖界"
 the_former_homeland_of_the_white_howlers_title:0 "$spirit_travel_header$前白嚎之祖界"
 the_former_homeland_of_the_white_howlers_desc:0 "The former homeland of the White Howlers has unrecognizably been twisted by the Wyrm. The air is thick with smoke and ripples with heat. A sickly green sun beats down on the surface, unblocked by any kind of ozone layer. Night brings no relief as pollutants cool and sink to the surface, causing the moon to appear fluorescent yellow through the vapors."
 the_former_homeland_of_the_white_howlers_effect_desc:0 ""
 the_former_homeland_of_the_white_howlers_option:0 "回到白嚎之祖界"
 elemental_courts_title:0 "$spirit_travel_header$元素庭"
 elemental_courts_desc:0 "在旅行者真正到达五大门之前，在锥界的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。"
 elemental_courts_effect_desc:0 ""
 elemental_courts_option:0 "拜访元素庭"
 the_court_of_the_muses_title:0 "$spirit_travel_header$缪斯庭"
 the_court_of_the_muses_desc:0 "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。"
 the_court_of_the_muses_effect_desc:0 ""
 the_court_of_the_muses_option:0 "拜访缪斯庭"
 dis_title:0 "$spirit_travel_header$帝乌斯"
 dis_desc:0 "摆渡人所拥有的一点组织是以帝乌斯为中心的，帝乌斯是大风暴中的一个由堡垒、洞穴和船只组成的马尾藻海。这里有他们的主要聚集地，他们的档案和制造部门的总部，以及他们的小型委员会。"
 dis_effect_desc:0 ""
 dis_option:0 "拜访帝乌斯"
 mirror_zone_title:0 "$spirit_travel_header$镜区"
 mirror_zone_desc:0 "神秘的“镜区”喜欢向它的“客人”展示可能发生的事情。"
 mirror_zone_effect_desc:0 ""
 mirror_zone_option:0 "拜访镜区？"
 null_zone_title:0 "$spirit_travel_header$巫径"
 null_zone_desc:0 "巫径是一条由小路组成的迷宫，通往影界的大部分领域。这里的定位很困难，因为道路总是在变化，看起来都是一样的。"
 null_zone_effect_desc:0 ""
 null_zone_option:0 "拜访巫径？"
 city_of_brass_title:0 "$spirit_travel_header$黄铜城"
 city_of_brass_desc:0 "黄铜之城看上去是一座巨大的城市，有八条由各种色调的黄铜和红铜制成的大街道。它是无形世界的巨灵帕夏和想要获得巨灵帮助的术士之间的一个经济中心，而不需要通过使用所罗门法则强迫他们服役来无谓地激怒他们。"
 city_of_brass_effect_desc:0 ""
 city_of_brass_option:0 "进入黄铜城"
 calumn_title:0 "$spirit_travel_header$卡列姆"
 calumn_desc:0 "A Calumn is a Wyrm domain within the Near Umbra. They develop when a particularly strong, negative emotion is expressed in a place within the physical world that it leaves a print within the Umbra. It is a magnet for Banes and Spirits that live near a Calumn show signs of their respective emotion and even inanimate objects becomes tainted by the proximity."
 calumn_effect_desc:0 "效果：\n$BULLET_WITH_TAB$每#V 3#!月获得少量[stress|E]。\n$BULLET_WITH_TAB$无视以上效果若你是妖蛆的仆从。"
 calumn_option:0 "堕入卡列姆"
