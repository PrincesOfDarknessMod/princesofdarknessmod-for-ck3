 paying_for_spirit_travel_toast:0 "你花费了金钱购买了一块[true_jade|E]"
 paying_for_spirit_travel_notification_yin:0 "你没有[GetPerk('semblance_of_the_ebon_dragon_perk').GetName( GetPlayer )][perk|E]，所以你必须得使用一块[true_jade|E]来执行进入[yin_world|E]的仪轨。"
 paying_for_spirit_travel_notification_yang:0 "你没有[GetPerk('semblance_of_the_scalet_queen_perk').GetName( GetPlayer )][perk|E]，所以你必须得使用一块[true_jade|E]来执行进入阳界的仪轨。"
 SPIRIT_TRAVELING_TOOLTIP:0 "逃脱中……"
 spirit_travel_arrived_title:0 "已达灵界"
 spirit_travel_arrived_desc:0 "你已经到达灵界。"
 shadowlands_fetter_maintenance_tooltip:0 "你付出了没[Fetters|E]还待在[shadowlands|E]的代价。"
 game_concept_periphery:0 "周界"
 game_concept_periphery_desc:0 "周界，有时也被称为“软影界”，是介于[penumbra|E]和物质世界之间的地方或——如许多化兽族裔所说——思想状态。"
 periphery_confirm:0 "若我改变思绪……"
 game_concept_glen:0 "幽谷"
 game_concept_glen_desc:0 "幽谷是[penumbra|E]的一个区域，饱和于奇原能量。幽谷通常与物质世界中未受开发的荒野地区联系在一起（所有它们越来越稀少，越来难进入）。"
 glen_confirm:0 "休于幽谷"
 game_concept_near_dreaming:0 "近梦界"
 game_concept_near_dreaming_desc:0 "近梦界是[dreaming|E]中最接近世俗世界的部分。"
 near_dreaming_confirm:0 "漫游近梦界"
 game_concept_far_dreaming:0 "远梦界"
 game_concept_far_dreaming_desc:0 "远梦界是[dreaming|E]的一部分，对应于人类的集体梦境。"
 far_dreaming_confirm:0 "漫游远梦界"
 game_concept_deep_dreaming:0 "深梦界"
 game_concept_deep_dreaming_desc:0 "深梦界是[dreaming|E]中离着苏醒世界最远的部分。"
 deep_dreaming_confirm:0 "漫游深梦界"
 game_concept_astral_plane:0 "星界"
 game_concept_astral_plane_desc:0 "广义上讲，星界可以被认为是全人类意识的投射，随后根据不同种类的思想被细分为不同界域。"
 astral_plane_confirm:0 "升入星界"
 game_concept_vulgate:0 "庸底"
 game_concept_vulgate_desc:0 "庸底——也被称为想象世界——是[astral_reaches|E]的最低部分。它包含了人类（也许还有一些其他物种）的集体哲学和思维方式所想到的常识概念。"
 vulgate_confirm:0 "升入庸底"
 game_concept_spires:0 "众峰"
 game_concept_spires_desc:0 "宇宙学家认为，众峰是众人的思想集中在同一个概念上的结果，导致它从庸底上升到更高的界域。"
 spires_confirm:0 "升入众峰"
 game_concept_inventium:0 "构界"
 game_concept_inventium_desc:0 "构界是[astral_reaches|E]的界域之一，充满了人类梦寐以求的所有发明。这些发明以一种可察的爆裂声显现出来，并轻轻地落入巨大的堆积物中，充满了整个界域的各地。"
 inventium_confirm:0 "进入构界"
 game_concept_epiphamy:0 "悟韵"
 game_concept_epiphamy_desc:0 "悟韵体现了最抽象的概念，如“自然法则”或“真爱”。它们显现为庸底天空中的彩色云彩，可以给旅者提供关于它们所体现的概念的线索。"
 epiphamy_confirm:0 "升入悟韵"
 game_concept_shadowlands:0 "幽土"
 game_concept_shadowlands_desc:0 "幽土是现实的镜像“皮肤”，生者界域的每一个地点在幽土都有一个相应的地点，在大多数情况下，这些地点遵守传统的距离法则。它是死灵蛰居等待着救赎，或是湮灭的地方。"
 shadowlands_confirm:0 "深入幽土"
 game_concept_river_of_death:0 "死亡之河"
 game_concept_river_of_death_desc:0 "死亡之河是[tempest|E]中的一条水路，是冥河城通往[shadowlands|E]和其他冥府的主要旁路。"
 river_of_death_confirm:0 "潜入死亡之河"
 game_concept_sunless_sea:0 "无光之海"
 game_concept_sunless_sea_desc:0 "命名缘由自它上面的天空永远是黑暗的，来自船只和信标等来源的光线在无光之海可在几英里外看到，因为它从水面上散射开来。"
 sunless_sea_confirm:0 "潜入无光之海"
 game_concept_far_shore:0 "彼岸"
 game_concept_far_shore_desc:0 "彼岸是[underworld|E]的一块神秘领地，由被称为“闪耀者”的皮提亚人实体控制。对现代冥河城民来说，彼岸是由异端控制的领土，不值得信任。"
 far_shore_confirm:0 "前往彼岸"
 game_concept_weeping_bay:0 "泣湾"
 game_concept_weeping_bay_desc:0 "泣湾位于灵魂之海和无光之海的中间，是冥河城的主要港口，也是与其他各个死城的联系。海湾的形状很有特点，呈半月形，并不断充斥着被灵铸成海湾的死灵的呜咽和呻吟。"
 weeping_bay_confirm:0 "前往泣湾"
 game_concept_sea_of_souls:0 "灵魂之海"
 game_concept_sea_of_souls_desc:0 "围绕着冥河城和泣绝岛建造的保护性海墙。它的名字来自于那些被锻造或灌进墙体结构中的不幸的死灵。"
 sea_of_souls_confirm:0 "潜入灵魂之海"
 game_concept_isle_of_sorrows:0 "泣绝岛"
 game_concept_isle_of_sorrows_desc:0 "泣绝岛是一个岩石岛，位于死亡之河的三角洲，在[tempest|E]的深处。"
 isle_of_sorrows_confirm:0 "前往泣绝岛"
 game_concept_veinous_stair:0 "静脉阶梯"
 game_concept_veinous_stair_desc:0 "静脉阶梯是一条从冥河城直接通往[labyrinth|E]的通道。[shadowlands|E]最稳定的地方，由未知类型的黑色石头组成。"
 veinous_stair_confirm:0 "潜入静脉阶梯"
 game_concept_dark_kingdom_of_iron:0 "铁之冥府"
 game_concept_dark_kingdom_of_iron_desc:0 "冥河城是西方死灵的首都，是一座难以理解的巨大城市，位于[tempest|E]深处的泣绝岛。它是西方死灵各组织的主要总部所在地。"
 dark_kingdom_of_iron_confirm:0 "前往冥河城"
 game_concept_dark_kingdom_of_clay:0 "黏土冥府"
 game_concept_dark_kingdom_of_clay_desc:0 "业境，外人称为黏土[dark_kingdom|E]，是[tempest|E]中属于澳大利亚原住民的界域。"
 dark_kingdom_of_clay_confirm:0 "前往业境"
 game_concept_dark_kingdom_of_ivory:0 "象牙冥府"
 game_concept_dark_kingdom_of_ivory_desc:0 "幽灵之丛，也被称为象牙[dark_kingdom|E]，是非洲死灵——又称阿班博——的[shadowlands|E]。"
 dark_kingdom_of_ivory_confirm:0 "前往幽灵之丛"
 game_concept_dark_kingdom_of_jade:0 "玉之冥府"
 game_concept_dark_kingdom_of_jade_desc:0 "黄泉，又称玉之[dark_kingdom|E]，是专门为亚洲的死者服务的[underworld|E]部分，并由他们控制。"
 dark_kingdom_of_jade_confirm:0 "前往黄泉"
 game_concept_dark_kingdom_of_obsidian:0 "黑曜石冥府"
 game_concept_dark_kingdom_of_obsidian_desc:0 "剥皮之地是对中美洲掌握的死者国度的称呼，是强大的黑曜石[dark_kingdom|E]的一部分。"
 dark_kingdom_of_obsidian_confirm:0 "前往剥皮之地"
 game_concept_dark_kingdom_of_sand:0 "沙之冥府"
 game_concept_dark_kingdom_of_sand_desc:0 "沙之[dark_kingdom|E]阿蒙提是属于不朽者的[underworld|E]冥府。它的居民不是死灵，而是不朽者，其等在死后会来到这[shadowlands|E]。"
 dark_kingdom_of_sand_confirm:0 "前往阿蒙提"
 game_concept_swar:0 "施瓦"
 game_concept_swar_desc:0 "施瓦（意为天界）——喜悦之城——是印度的亡者之城，施瓦是印度[shadowlands|E]——空界——的首要城市。"
 swar_confirm:0 "前往施瓦"
 game_concept_night_markets:0 "夜市"
 game_concept_night_markets_desc:0 "夜市，名义上是施瓦的一部分，是东南亚亡者蜗居的地方。"
 night_markets_confirm:0 "前往夜市"
 game_concept_mantaqat_khayal:0 "曼塔卡特·卡哈耶"
 game_concept_mantaqat_khayal_desc:0 "曼塔卡特·卡哈耶，中东的[shadowlands|E]。人们对这片土地知之甚少，只知道至少从伊斯兰教的黎明开始，哀恸就把它吞没在永恒的沙暴中。只有死城提供了躲避沙暴的庇护所，而且只有商人、朝圣者和游牧者才会跨越它。"
 mantaqat_khayal_confirm:0 "前往曼塔卡特·卡哈耶"
 game_concept_shadow_realm:0 "影子国度"
 game_concept_shadow_realm_desc:0 "影子国度是木乃伊在[underworld|E]的根据地，在他们准备好再次回到在自己的身体里之前，他们会去那里进行自我再生，且在此处其等可避免怨灵或恶湍的侵袭。"
 game_concept_hades:0 "哈迪斯"
 game_concept_hades_desc:0 "卡比里木乃伊的主要[shadow_realm|E]被称为哈迪斯，来自希腊神话中的[underworld|E]。"
 game_concept_gates_of_heaven:0 "天门"
 game_concept_gates_of_heaven_desc:0 "天降大任于重生者。八仙给予天宗使命旨意。他们奉旨，且必须执行天意。当他们失败时，他们将在天门花时间沉思，为自己做好准备，以便不再失败。"
 game_concept_yomi_wan:0 "幽冥"
 game_concept_yomi_wan_desc:0 "幽冥，也被称为无量地狱，是阎魔在[yin_world|E]与阳界之间的罅隙制造出来的一个人造灵性维度，以作为他们的总部。"
 game_concept_tempest:0 "大风暴"
 game_concept_tempest_desc:0 "大风暴是一个由能量、记忆和[GetTrait('spectre').GetName( GetNullCharacter )]组成的永恒恶湍，它从[labyrinth|E]中发出，并不断向[shadowlands|E]和冥府倾泻灵质和材料。"
 tempest_confirm:0 "#X 深入大风暴#!"
 game_concept_labyrinth:0 "迷宫域"
 game_concept_labyrinth_desc:0 "迷宫域的结构相对来说很少，任何地图都无法描绘它；所有的地标随时可能移动。"
 labyrinth_confirm:0 "#X 深入迷宫域#!"
 game_concept_well_of_the_void:0 "虚空之井"
 game_concept_well_of_the_void_desc:0 "虚空之井是湮灭的物理表象，位于[labyrinth|E]的中心和底部。"
 well_of_the_void_confirm:0 "#X 落入虚空之井#!"
 game_concept_oblivion:0 "湮灭"
 game_concept_oblivion_desc:0 "湮灭是熵本身，是不断变幻的毁灭与疯狂之力，没有什么能从那回来。"
 game_concept_abyss:0 "深渊"
 game_concept_abyss_desc:0 "深渊，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕落者的永恒监狱。"
 abyss_confirm:0 "#X 堕入深渊#!"
 game_concept_spirit_wilds:0 "灵野"
 game_concept_spirit_wilds_desc:0 "灵野是中影界的另一个名称，是近界之间的空间。这一影界部分反映了自然环境，包括其原始状态和受污染的状态。"
 spirit_wilds_confirm:0 "踏入灵野"
 game_concept_atrocity_realm:0 "暴行界域"
 game_concept_atrocity_realm_desc:0 "暴行界域，被法师们称为荒土，是近界域之一。千年来，世界上所有受害者的痛苦造就了这界域，一个已固为永恒的残酷和折磨。"
 atrocity_realm_confirm:0 "踏入暴行界域"
 game_concept_battleground:0 "战界"
 game_concept_battleground_desc:0 "战界，在东方被称为斗魂界，是影界中的近界域之一，包含着有史以来的每一场战斗，从最早的新石器时代部落与熊和狼的冲突，刀耕之治和魂怒之战，直到目前中东和伊比利亚内部的冲突。"
 battleground_confirm:0 "踏入战界"
 game_concept_cyberrealm:0 "赛博界"
 game_concept_cyberrealm_desc:0 "赛博界是影界的十三近界域之一。这界域也许代表了织者在影界的影响力的顶峰。它被法师们称为敌托邦。"
 cyberrealm_confirm:0 "踏入赛博界"
 game_concept_erebus:0 "厄瑞玻斯"
 game_concept_erebus_desc:0 "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。它充满了熔化的银化为的河，既能燃烧，又能治疗，将囚犯的折磨延长到几个月、几年，甚至可能是几个世纪。"
 erebus_confirm:0 "踏入厄瑞玻斯"
 game_concept_flux_realm:0 "变界"
 game_concept_flux_realm_desc:0 "变界，变化界，或辐射界是近影界中的界域。它是强大的纯净、未被稀释的奇原能量库，未被织者的章程所污染。"
 flux_realm_confirm:0 "踏入变界"
 game_concept_hy_brasil:0 "易巴席尔"
 game_concept_hy_brasil_desc:0 "易巴席尔似乎是一个充满无尽幻想故事的土地。在这里，季节永远不会改变，白天永远锁定为黄昏。在这块土地的西半部，太阳挂在仲夏天空中。在东边，月亮升起，寒冷而可怕，笼罩着隆冬夜晚。"
 hy_brasil_confirm:0 "踏入易巴席尔"
 game_concept_legendary_realm:0 "传奇界"
 game_concept_legendary_realm_desc:0 "传奇界是位于近影界的近界域之一。在该界域穿越的狼族可以体验他们传奇先祖的生活。然而，界域内的事件并非严格的历史再现；它们可能随着时间推移而改变故事滤镜，以适应当前世界的思想。"
 legendary_realm_confirm:0 "踏入传奇界"
 game_concept_mountains_of_heaven:0 "天山"
 game_concept_mountains_of_heaven_desc:0 "天山是阳界中的影界界域。该界域表现为在云海之上的庞大山脉链，甚至使伟大的喜马拉雅山脉也相形见绌。"
 mountains_of_heaven_confirm:0 "爬上天山"
 game_concept_pangaea:0 "泛古界"
 game_concept_pangaea_desc:0 "泛古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。"
 pangaea_confirm:0 "踏入泛古界"
 game_concept_scar:0 "疤痕"
 game_concept_scar_desc:0 "疤痕是影界的近界域之一。它是工业革命在生锈的繁荣理想下被腐蚀成对灵魂的磨砺压榨的显现。"
 scar_confirm:0 "踏入疤痕"
 game_concept_summer_country:0 "夏乡"
 game_concept_summer_country_desc:0 "夏乡是位于地球近影界的近界域之一。它现在只是个神话，因为它已经消逝了几十年了。传说中，该界域反映了盖亚对她的孩子们的纯洁又无尽的爱。"
 summer_country_confirm:0 "踏入夏乡"
 game_concept_tiger_lands:0 "虎原"
 game_concept_tiger_lands_desc:0 "虎原是东方影界的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。"
 tiger_lands_confirm:0 "踏入虎原"
 game_concept_umi:0 "羽海"
 game_concept_umi_desc:0 "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围，尽管某些波利尼西亚和印度尼西亚的灵域对此不以为然。"
 umi_confirm:0 "踏入羽海"
 game_concept_wolfhome:0 "狼之家"
 game_concept_wolfhome_desc:0 "狼之家是近界域之一，位于地球的近影界。它是狼族经常光顾的地方。该界域是一片广阔的原始荒野。这里隐藏着对原始奥秘的答案。"
 wolfhome_confirm:0 "踏入狼之家"
 game_concept_aetherial_realm:0 "以太界"
 game_concept_aetherial_realm_desc:0 "以太界。也被称为乙太界，是影界内最广的近界域，横跨[spirit_wilds|E]，直到影幕。它在物质世界的景象即是天空，不断循环着黑夜和白天。"
 aetherial_realm_confirm:0 "飞入以太界"
 game_concept_court_of_eshtarra:0 "埃什塔拉的宫廷"
 game_concept_eshtarra_desc:0 "埃什塔拉，歌者，是狼族占星学中的地球星君。"
 court_of_eshtarra_confirm:0 "拜见地球星君"
 game_concept_court_of_sokhta:0 "索赫塔的宫廷"
 game_concept_sokhta_desc:0 "索赫塔是露娜的法相之一，该天神是狼族和其他许多变形者的守护神，她的宫廷里有许多月使和其他同情狼国的灵。"
 court_of_sokhta_confirm:0 "拜见月之星君"
 game_concept_court_of_katanka_sonnak:0 "卡坦卡·索纳克的宫廷"
 game_concept_katanka_sonnak_desc:0 "卡坦卡·索纳克，风骑士，是狼族占星学中的太阳星君。"
 court_of_katanka_sonnak_confirm:0 "拜见日之星君"
 game_concept_court_of_mitanu:0 "米塔努的宫廷"
 game_concept_mitanu_desc:0 "米塔努，聪慧浪人，是狼族占星学中的水星的星君。他既是诡计大师，也是喜剧爱好者。"
 court_of_mitanu_confirm:0 "拜见水星灵君"
 game_concept_court_of_hakahe:0 "哈卡赫的宫廷"
 game_concept_hakahe_desc:0 "哈卡赫是祝融星——比水星更靠近太阳的假想星球——的星君，他被认为是铸造新生狼族的灵魂的负责者。"
 court_of_hakahe_confirm:0 "拜见祝融星灵君"
 game_concept_court_of_tambiyah:0 "坦比娅的宫廷"
 game_concept_tambiyah_desc:0 "坦比娅，蒙面母亲，是狼族占星学中的金星的星君。 "
 court_of_tambiyah_confirm:0 "拜见金星灵君"
 game_concept_court_of_nerigal:0 "尼格尔的宫廷"
 game_concept_nerigal_desc:0 "尼格尔，冰战士，是狼族占星学中的火星的星君。"
 court_of_nerigal_confirm:0 "拜见火星灵君"
 game_concept_court_of_rorg:0 "罗尔格的宫廷"
 game_concept_rorg_desc:0 "罗尔格，多爪猎人，是狼族占星学中的罗尔格星的星君，罗尔格星的毁灭导致了小行星带的形成。"
 court_of_rorg_confirm:0 "拜见小行星带灵君"
 game_concept_court_of_zarok:0 "扎罗克的宫廷"
 game_concept_zarok_desc:0 "扎罗克，加冕君主，是狼族占星学中的木星的星君。"
 court_of_zarok_confirm:0 "拜见木星灵君"
 game_concept_court_of_lu_bat:0 "鲁·帕特的宫廷"
 game_concept_lu_bat_desc:0 "鲁·帕特，和平顾问，是狼族占星学中的土星的星君。"
 court_of_lu_bat_confirm:0 "拜见土星灵君"
 game_concept_court_of_ruatma:0 "鲁阿特玛的宫廷"
 game_concept_ruatma_desc:0 "鲁阿特玛，阴影者，是天王星的星君。"
 court_of_ruatma_confirm:0 "拜见天王星灵君"
 game_concept_court_of_shantar:0 "尚塔尔的宫廷"
 game_concept_shantar_desc:0 "尚塔尔，织机造者，是海王星的星君。"
 court_of_shantar_confirm:0 "拜见海王星灵君"
 game_concept_court_of_meros:0 "梅罗斯的宫廷"
 game_concept_meros_desc:0 "梅罗斯，流浪者，是冥王星的星君。"
 court_of_meros_confirm:0 "拜见冥王星灵君"
 game_concept_weaver_reaches:0 "织者境"
 game_concept_weaver_reaches_desc:0 "织者境是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。没有生命的迹象存在。巨大的织者之灵，如“星蜘蛛”，在网中巡逻和维护，并确保一切都保持在其规定的位置。"
 weaver_reaches_confirm:0 "进入织者境"
 game_concept_wyld_reaches:0 "奇原境"
 game_concept_wyld_reaches_desc:0 "奇原境是一个混沌的地方。行星和彗星根据不断变化的法则相互碰撞，相互舞动。燃烧的冷太阳冻结了周围的一切，而其他的恒星则以其周边的反重力波将一切推开。"
 wyld_reaches_confirm:0 "进入奇原境"
 game_concept_wyrm_reaches:0 "妖蛆境"
 game_concept_wyrm_reaches_desc:0 "妖蛆境的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向[malfeas|E]。满是污染和火焰的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。"
 wyrm_reaches_confirm:0 "进入妖蛆境"
 game_concept_shard_realm_of_prime:0 "根源之碎域"
 game_concept_shard_realm_of_prime_desc:0 "与地球和月球相关联的[shard_realm|E]。"
 shard_realm_of_prime_confirm:0 "进入根源之碎域"
 game_concept_first_horizon:0 "初穹界"
 game_concept_first_horizon_desc:0 "初穹界位于地球大气层的边缘，遍布着穹界界域，包括有[shade_realm|E]。"
 first_horizon_confirm:0 "飞入初穹界"
 game_concept_true_horizon:0 "真穹界"
 game_concept_true_horizon_desc:0 "真穹界，被科技联盟称为亚空间，被以太之子称为以太空间，是位于近影界和远影界之间的广阔影界。对沉睡者来说，它表现为太阳和小行星带之间的空间。"
 true_horizon_confirm:0 "飞入真穹界"
 game_concept_far_horizon:0 "远穹界"
 game_concept_far_horizon_desc:0 "远穹界大致对应于小行星带的所在处。"
 far_horizon_confirm:0 "飞入远穹界"
 game_concept_deep_umbra:0 "深影界"
 game_concept_deep_umbra_desc:0 "深影界，也叫深宇宙，是地球影界空间之外的浩瀚界域。它主要是无穷无尽的虚空。从人类的角度来看，深影界即是深太空、外太空或整个宇宙。"
 deep_umbra_confirm:0 "飞入深影界"
 game_concept_malfeas:0 "秽恶界域"
 game_concept_malfeas_desc:0 "秽恶界域是位于[deep_umbra|E]的疯狂妖蛆神体界域。这是一个地狱般的噩梦世界，充满了所有可以想象的可怕东西，还有一些可怕到仅仅试图想象就会使人发疯的事物。"
 malfeas_confirm:0 "#X 堕入秽恶界域#!"
 game_concept_black_spiral_labyrinth:0 "黑螺旋迷宫"
 game_concept_black_spiral_labyrinth_desc:0 "黑螺旋迷宫，在中原被称为玄黑迷宫，是[malfeas|E]内的一个螺旋形迷宫，里面有难以想象的妖蛆之恐怖。"
 black_spiral_labyrinth_confirm:0 "#X 行于黑螺旋#!"
 game_concept_first_city:0 "第一城"
 game_concept_first_city_desc:0 "第一城，除其他别名外，也被称为以诺城，被挪得学家认为是《挪得之书》所记载的该隐神话的历史上的第一座城市。"
 first_city_confirm:0 "#X 传送到第一城#!"
 game_concept_shard_realm_of_infinity:0 "无限之碎域"
 game_concept_shard_realm_of_infinity_desc:0 "与太阳相关联的[shard_realm|E]。"
 shard_realm_of_infinity_confirm:0 "进入无限之碎域"
 game_concept_shard_realm_of_correspondence:0 "空间之碎域"
 game_concept_shard_realm_of_correspondence_desc:0 "与水星相关联的[shard_realm|E]。"
 shard_realm_of_correspondence_confirm:0 "进入空间之碎域"
 game_concept_shard_realm_of_life:0 "生命之碎域"
 game_concept_shard_realm_of_life_desc:0 "与金水星相关联的[shard_realm|E]。"
 shard_realm_of_life_confirm:0 "进入生命之碎域"
 game_concept_shard_realm_of_forces:0 "力之碎域"
 game_concept_shard_realm_of_forces_desc:0 "与火星相关联的[shard_realm|E]。"
 shard_realm_of_forces_confirm:0 "进入力之碎域"
 game_concept_shard_realm_of_matter:0 "物质之碎域"
 game_concept_shard_realm_of_matter_desc:0 "与木星相关联的[shard_realm|E]。"
 shard_realm_of_matter_confirm:0 "进入物质之碎域"
 game_concept_shard_realm_of_time:0 "时间之碎域"
 game_concept_shard_realm_of_time_desc:0 "与土星相关联的[shard_realm|E]。"
 shard_realm_of_time_confirm:0 "进入时间之碎域"
 game_concept_shard_realm_of_spirit:0 "灵之碎域"
 game_concept_shard_realm_of_spirit_desc:0 "与天王星相关联的[shard_realm|E]。"
 shard_realm_of_spirit_confirm:0 "进入灵之碎域"
 game_concept_shard_realm_of_mind:0 "心智之碎域"
 game_concept_shard_realm_of_mind_desc:0 "与海王星相关联的[shard_realm|E]。"
 shard_realm_of_mind_confirm:0 "进入心智之碎域"
 game_concept_shard_realm_of_entropy:0 "熵之碎域"
 game_concept_shard_realm_of_entropy_desc:0 "与冥王星相关联的[shard_realm|E]。"
 shard_realm_of_entropy_confirm:0 "进入熵之碎域"
 game_concept_shade_realm_of_correspondence:0 "空间之影域"
 game_concept_shade_realm_of_correspondence_desc:0 "与水星相关联的[shade_realm|E]。无法从地球直接抵达这个影域，而那些设法抵达那里的人发现自己在全维空间中按照不可知的几何移动。"
 shade_realm_of_correspondence_confirm:0 "进入空间之影域"
 game_concept_shade_realm_of_life:0 "生命之影域"
 game_concept_shade_realm_of_life_desc:0 "与金星相关联的[shade_realm|E]。该界域是郁郁葱葱、不断变化的丛林。它与地球的相对可及性使其成为升华之战的频繁战场。"
 shade_realm_of_life_confirm:0 "进入生命之影域"
 game_concept_shade_realm_of_forces:0 "力之影域"
 game_concept_shade_realm_of_forces_desc:0 "与火星相关联的[shade_realm|E]。力之影域是永无止境的风暴，罕见的有相对平静的孤立地点。多赛梯堡占据了安定点之一，至少在它被摧毁之前是如此。和生命之影域一样，它也是一个频繁的（和危险的）法师战斗场地。"
 shade_realm_of_forces_confirm:0 "进入力之影域"
 game_concept_shade_realm_of_matter:0 "物质之影域"
 game_concept_shade_realm_of_matter_desc:0 "与木星相关联的[shade_realm|E]。这个界域可能与空心地球有关，也可能只是类似，但规模要大得多——一个由恐龙、失落文明和其他不复存在的事物组成的帝国。"
 shade_realm_of_matter_confirm:0 "进入物质之影域"
 game_concept_shade_realm_of_time:0 "时间之影域"
 game_concept_shade_realm_of_time_desc:0 "与土星相关联的[shade_realm|E]。任何进入时间之影域的访客都冒着严重的风险，因为即使是最轻微的移动也会导致时间扭曲和不受控制的时间旅行。"
 shade_realm_of_time_confirm:0 "进入时间之影域"
 game_concept_shade_realm_of_spirit:0 "灵之影域"
 game_concept_shade_realm_of_spirit_desc:0 "与天王星相关联的[shade_realm|E]。在灵之影域没有险棘：灵与凡人可以直接互动。法师的化身也有可能在这里显现躯体并与他们交谈。"
 shade_realm_of_spirit_confirm:0 "进入灵之影域"
 game_concept_shade_realm_of_mind:0 "心智之影域"
 game_concept_shade_realm_of_mind_desc:0 "与海王星相关联的[shade_realm|E]。正如人们所期望的那样，心智之影域的性质是由人们觉得那里会有什么的想法所决定的。它像一面镜子一样反射出来访者自己的想法和感受。"
 shade_realm_of_mind_confirm:0 "进入心智之影域"
 game_concept_shade_realm_of_entropy:0 "熵之影域"
 game_concept_shade_realm_of_entropy_desc:0 "与冥王星相关联的[shade_realm|E]。据称在这里，宇宙的大因果轮回被暴露无遗，它甚至可能与[shadowlands|E]有直接关联。"
 shade_realm_of_entropy_confirm:0 "进入熵之影域"
 manipulate_the_shroud_valid:0 "你将操纵目标所在地的尸幕等级。"
