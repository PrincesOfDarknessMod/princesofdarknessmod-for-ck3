 game_concept_the_homeland_of_the_bunyip_desc:0 "这片界域拥有多样的气候，包括热带红树林沼泽、深谷、温带灌木丛和寒带雨林。这里代表着本耶普建造了家园和歌颂的每片土地。它不仅有梦时的生物，还有澳大利亚已经灭绝的动物的灵体。"
