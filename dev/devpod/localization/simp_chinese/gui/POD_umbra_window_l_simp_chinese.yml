 custom_name_seaofshadow:0 "黯影之海"
 custom_name_tempest:0 "大风暴"
 custom_name_stormwall:0 "风暴之墙"
 custom_desc_seaofshadow:0 "黯影之海是死灵们用来描述大风暴的“底层”的术语，它围绕着迷宫域和湮灭流淌和流入。"
 custom_desc_tempest:0 "大风暴是一个由能量、记忆和[GetTrait('spectre').GetName( GetPlayer )]组成的永恒恶湍，它从迷宫域中发出，并不断向幽土和冥府倾泻灵质和材料。"
 custom_desc_stormwall:0 "风暴之墙是活人和死人世界之间的一道概念屏障。"
 has_gauntlet4_modifier_tooltip: "伯爵领有修正：[GetModifier( 'gauntlet4_modifier' ).GetNameWithTooltip|L]"
 has_gauntlet5_modifier_tooltip: "伯爵领有修正：[GetModifier( 'gauntlet5_modifier' ).GetNameWithTooltip|L]"
 grand_hall_title:0 "荣耀大厅"
 grand_hall_desc:0 "它像幻影一样从星雾中升起——有着无数门的荣耀大厅。它从不在原地停留太久，但总是保持着类似的模样——稀疏但温馨的跨世界走廊，采用地中海古典风格，用古老的木材和马赛克瓷砖装饰。"
 grand_hall_tooltip:0 ""
 grand_hall_confirm:0 "进入荣耀大厅"
 the_homeland_of_the_black_furies_title:0 "黑怒之祖乡"
 the_homeland_of_the_black_furies_desc:0 "黑怒的祖乡类似于希腊神话中的风景：耸立在众多的小岛屿和半岛的石山延伸到碧绿的大海中。郁郁葱葱的松树和橄榄树遍布全岛，希腊风格的建筑点缀其中，最近还出现了来自世界各地的建筑。众多的捕食者、猎物和人类居住在这祖乡。所有的生物都作为自然界中生物链的一部分而活着，任何一方都不会被过度猎杀或饿死。"
 the_homeland_of_the_black_furies_tooltip:0 ""
 the_homeland_of_the_black_furies_confirm:0 "回到黑怒之祖乡"
 the_homeland_of_the_bone_gnawers_title:0 "啮骨者之祖乡"
 the_homeland_of_the_bone_gnawers_desc:0 "啮骨者的祖乡就像一个城市的贫民区。酒吧每天24小时营业，每家都提供一壶一壶的廉价啤酒。每个街区都有欢乐屋，但狡猾的啮骨者知道最好的总是在后巷里，通过敲打正确的门来找到。城外是一片丘陵地带，有轻盈的森林和肥硕的牛群。"
 the_homeland_of_the_bone_gnawers_tooltip:0 ""
 the_homeland_of_the_bone_gnawers_confirm:0 "回到啮骨者之祖乡"
 the_homeland_of_the_children_of_gaia_title:0 "盖亚之子之祖乡"
 the_homeland_of_the_children_of_gaia_desc:0 "盖亚之子的祖乡是一片广阔的森林，其下山丘连绵起伏，潺潺的溪流在山谷中蜿蜒流淌。摆脱了月狂的人类在祖乡各地游荡，中央的大都市是座纯洁化的古苏美尔城市。成群的独角兽之灵在山上吃草，每位访客都会得到一只独角兽魂侣，他们会引导访客穿越这个王国。"
 the_homeland_of_the_children_of_gaia_tooltip:0 ""
 the_homeland_of_the_children_of_gaia_confirm:0 "回到盖亚之子之祖乡"
 the_homeland_of_the_fianna_title:0 "芬尼安之祖乡"
 the_homeland_of_the_fianna_desc:0 "芬尼安的祖乡是一片由丘陵、峡谷和山谷组成的绿色景观，看起来像是从经典奇幻小说中汲取的一样。妖精们在树林里玩耍，雄鹿之灵在牡鹿的指导形成“狂猎”在土地上游荡，保护祖乡免受入侵者的侵扰。自发的庆祝活动在祖乡很常见，往往会把所有听到的人吸引到一起。"
 the_homeland_of_the_fianna_tooltip:0 ""
 the_homeland_of_the_fianna_confirm:0 "回到芬尼安之祖乡"
 the_homeland_of_the_get_of_fenris_title:0 "芬里尔仔兽之祖乡"
 the_homeland_of_the_get_of_fenris_desc:0 "被永恒冬季所笼罩的峡湾、广袤的苔原、和寒冷黑暗的寒温带针叶林构成了芬里尔的祖乡。冰河时代的巨型动物群，如冰原狼和猛犸象，在这片土地上游荡，并攻击任何孤行的狼人。芬里尔聚集在长屋村，他们在那里喝酒、打斗、狂欢，并将他们的事迹传为萨迦。"
 the_homeland_of_the_get_of_fenris_tooltip:0 ""
 the_homeland_of_the_get_of_fenris_confirm:0 "回到芬里尔仔兽之祖乡"
 the_homeland_of_the_glass_walkers_title:0 "[GetPlayer.Custom( 'glasswalker_custom_name' )]之祖乡"
 the_homeland_of_the_glass_walkers_desc:0 "[GetPlayer.Custom( 'glasswalker_custom_name' )]的祖乡是一座按照盖亚风格设计建造的大都市。有着带着几十层露天花园的高塔，充满了植被和自然吸引到这些植物边的鸟类和动物。每个花园都迎合了不同的生态环境。许多人类愉快地在少数的几座塔内度过他们的一生。"
 the_homeland_of_the_glass_walkers_tooltip:0 ""
 the_homeland_of_the_glass_walkers_confirm:0 "回到[GetPlayer.Custom( 'glasswalker_custom_name' )]之祖乡"
 the_homeland_of_the_red_talons_title:0 "赤爪之祖乡"
 the_homeland_of_the_red_talons_desc:0 "赤爪的祖乡是一个广大的、未受开发的荒野。捕食者不受限制地捕猎，相互竞争。最重要的是大群的狼，它们已经主宰了这片祖乡。"
 the_homeland_of_the_red_talons_tooltip:0 ""
 the_homeland_of_the_red_talons_confirm:0 "回到赤爪之祖乡"
 the_homeland_of_the_shadow_lords_title:0 "影爵之祖乡"
 the_homeland_of_the_shadow_lords_desc:0 "影爵生活在一个以大山为主的区域，天空永远被乌云和闪电风暴笼罩。山下的山峰和森林处于永恒的阴影之中，影爵们聚集在城堡里，互相密谋，寻找登山的方法。"
 the_homeland_of_the_shadow_lords_tooltip:0 ""
 the_homeland_of_the_shadow_lords_confirm:0 "回到影爵之祖乡"
 the_homeland_of_the_stargazers_title:0 "星占之祖乡"
 the_homeland_of_the_stargazers_desc:0 "星占的祖乡是一个旨在检验狼族五大形态的界域。比喜马拉雅山还高的山峰占据了该界域的中心。一圈山麓围绕着这些山峰的底部，覆盖着茂密的草原、沙漠或雄伟的森林。还有可以满足任何狼族炼心所需要的寺庙。"
 the_homeland_of_the_stargazers_tooltip:0 ""
 the_homeland_of_the_stargazers_confirm:0 "回到星占之祖乡"
 the_homeland_of_the_silver_fangs_title:0 "银牙之祖乡"
 the_homeland_of_the_silver_fangs_desc:0 "银牙的祖乡是一片广阔的领土，类似于大草原。猎鹰之灵在天空中翱翔，监视着任何访客，并提醒猎鹰他们的存在。在王国的中心矗立着英雄城堡，这是纪念银牙为狼国所奉献的事迹的纪念碑。"
 the_homeland_of_the_silver_fangs_tooltip:0 ""
 the_homeland_of_the_silver_fangs_confirm:0 "回到银牙之祖乡"
 the_homeland_of_the_silent_striders_title:0 "寂静漫游者之祖乡"
 the_homeland_of_the_silent_striders_desc:0 "寂静漫游者的祖乡被一条巨大的河流所主导，它被称为生命之河。它被永远的黑夜所笼罩，其他地方都是由大片银色的沙漠组成，以刻有象形文字的方尖碑和类似的纪念性建筑为中心，精心排列出纪念古老的寂静漫游者英雄的星座。"
 the_homeland_of_the_silent_striders_tooltip:0 ""
 the_homeland_of_the_silent_striders_confirm:0 "回到寂静漫游者之祖乡"
 the_former_homeland_of_the_white_howlers_title:0 "前白嚎之祖乡"
 the_former_homeland_of_the_white_howlers_desc:0 "白嚎的前祖乡已经被妖蛆扭曲得面目全非。空气中弥漫着浓浓的烟雾，荡漾着热浪。病态的绿色阳光照射在地面上，没有任何形式的臭氧层阻挡。夜晚，污染物冷却并沉入地表，没有带来任何缓解，导致月亮在蒸汽中呈现荧光黄色。"
 the_former_homeland_of_the_white_howlers_tooltip:0 ""
 the_former_homeland_of_the_white_howlers_confirm:0 "回到白嚎之祖乡"
 elemental_courts_title:0 "元素庭"
 elemental_courts_desc:0 "在旅行者真正到达五大门之前，在锥界的中段能找到元素庭，每个元素都有一个界域来代表其固有的性质。"
 elemental_courts_confirm:0 "拜访元素庭"
 the_court_of_the_muses_title:0 "缪斯庭"
 the_court_of_the_muses_desc:0 "随着古典希腊信仰的几乎完全消亡，缪斯庭遭受了巨大的损失。尽管如此，虽然他们的界域每天都在变小，但宙斯的九个女儿仍然在练习她们的艺术，希望她们的热情能将湮灭的时间延后一点。"
 the_court_of_the_muses_confirm:0 "拜访缪斯庭"
 dis_title:0 "帝乌斯"
 dis_desc:0 "摆渡人所拥有的一点组织是以帝乌斯为中心的，帝乌斯是大风暴中的一个由堡垒、洞穴和船只组成的马尾藻海。这里有他们的主要聚集地，他们的档案和制造部门的总部，以及他们的小型委员会。"
 dis_tooltip:0 ""
 dis_confirm:0 "拜访帝乌斯"
 mirror_zone_title:0 "镜域"
 mirror_zone_desc:0 "神秘的“镜域”喜欢向它的“客人”展示可能发生的事情。"
 mirror_zone_tooltip:0 ""
 mirror_zone_confirm:0 "拜访镜域？"
 null_zone_title:0 "巫径"
 null_zone_desc:0 "巫径是一条由小路组成的迷宫，通往影界的大部分领域。这里的定位很困难，因为道路总是在变化，看起来都是一样的。"
 null_zone_tooltip:0 ""
 null_zone_confirm:0 "拜访巫径？"
 city_of_brass_title:0 "黄铜城"
 city_of_brass_desc:0 "黄铜之城看上去是一座巨大的城市，有八条由各种色调的黄铜和红铜制成的大街道。它是无形世界的巨灵帕夏和想要获得巨灵帮助的术士之间的一个经济中心，而不需要通过使用所罗门法则强迫他们服役来无谓地激怒他们。"
 city_of_brass_tooltip:0 ""
 city_of_brass_confirm:0 "进入黄铜城"
 calumn_title:0 "卡列姆"
 calumn_desc:0 "卡列姆是近影界中的一座妖蛆领域。当一种特别强烈的、负面的情绪在物理世界的某个地方表达出来时，它们就会显现出来，并在影界留下痕迹。它是一块磁铁，吸引着呆在卡列姆附近的忌灵和灵类，用迹象显示出它们各自情绪，甚至无生命的物体也会因接近而受到污染。"
 calumn_tooltip:0 "$UMBRA_HEAD$$calumn_custom_1$"
 calumn_confirm:0 "堕入卡列姆"
