 umbra_recruit_bygone_desc:0 "你在影界中跋涉了一段时间，直到你遇到了一些从未见过的野兽，传说中的逝兽。这些灵兽早已被凡人所遗忘，但它们仍然在影界的最深处安家；招募它们吧，它们肯定是有用的。"
 UMBRA_BOW_TO_WYRM:0 "巨蛇救我！"
 umbra_bow_to_wyrm_desc:0 "你见不到任何脱离的机会，也许你应该听从那诱人的低语……"
 UMBRA_COLLECT_ARTIFACT_PIECES:0 "每月恶湍冒险"
 umbra_collect_artifact_pieces_desc:0 "恶湍从[labyrinth|E]中喷发而出，可以触及[tempest|E]所在的任何地方——从[shadowlands|E]到[dark_kingdom|E]。恶湍由[underworld|E]的事物组成——遗器、怨灵和大风暴本身，从灵质雨到灵火雨不等。大风暴是一场回忆的风暴，幸运的拾荒者可以找到一两件藏在渣滓中的有用物品。"
 UMBRA_GAIN_COMMANDER_TRAIT:0 "学习战略"
 umbra_gain_commander_trait_sucess:0 "你将获取一个新将领特质。"
 UMBRA_SEARCH_INVENTION:0 "每月发明搜寻"
 umbra_search_invention_desc:0 "在填满这个界域的大量堆积物中寻找神秘装置。"
 UMBRA_SEARCH_INNOVATION:0 "每月革新搜寻"
 umbra_search_innovation_desc:0 "你想在构界的巨大堆积物中搜索，找到什么有用的发明吗？"
 UMBRA_CALIBURN:0 "拔剑"
 umbra_caliburn_desc:0 "一把插在石头上的剑出现在你面前，它会是……\n只有有德者（正义、慈悲、勇敢……）才能拔出这把剑。"
 UMBRA_BANE_POSSESION:0 "召唤忌灵"
