 game_concept_wicked_city:0 "妖邪之城"
 game_concept_wicked_city_desc:0 "妖邪之城。瓮星的领域是一个充满了赛博朋克和极端动漫元素的噩梦，结合了疯狂的风水和管理理论，令史宾赛·约翰逊都会蜷缩在角落里，用钉子戳自己的眼睛。瓮星对他的小项目非常自豪；他不断调整从能源生成到系统经济的一切，并期待着与他的城市翻新计划一同入侵中原。"
