 has_gauntlet2_modifier_tooltip: "地产有修正：[GetModifier( 'gauntlet2_modifier' ).GetNameWithTooltip|L]"
 has_gauntlet3_modifier_tooltip: "地产有修正：[GetModifier( 'gauntlet3_modifier' ).GetNameWithTooltip|L]"
 has_anger_enough_for_two_worlds_perk_tooltip: "@warning_icon!#X 你#bold 没#!有[perk|E]：[GetPerk('anger_enough_for_two_worlds_perk').GetName( GetPlayer )]#!"
 has_brambles_on_the_road_perk_tooltip: "@warning_icon!#X #bold 没#!有[perk|E]：[GetPerk('brambles_on_the_road_perk').GetName( GetPlayer )]#!"
 has_the_clearing_of_the_way_perk_tooltip: "@warning_icon!#X #bold 没#!有[perk|E]：[GetPerk('the_clearing_of_the_way_perk').GetName( GetPlayer )]#!"
 paying_for_spirit_travel_toast: "你花费了金钱购买了一块[Glossary('真玉','game_concept_true_jade_desc')]"
 SPIRIT_TRAVELING_TOOLTIP: "逃脱中……"
 spirit_travel_arrived_title: "已达[umbra|E]"
 spirit_travel_arrived_desc: "你已经到达[umbra|E]。"
 shadowlands_fetter_maintenance_tooltip: "你付出了没[Fetters|E]还待在[UmbraGlossary('shadowlands')]的代价。"
 periphery_desc: "周界，有时也被称为“软影界”，是介于[UmbraGlossary('penumbra')]和物质世界之间的地方或——如许多$glossary_fera$所说——思想状态。"
 glen_desc: "幽谷是[UmbraGlossary('penumbra')]的一个区域，饱和于$glossary_wyld$能量。幽谷通常与物质世界中未受开发的荒野地区联系在一起（所有它们越来越稀少，越来难进入）。"
 umbra_realm_near_dreaming: "近梦界"
 umbra_realm_near_dreaming_desc: "近梦界是[UmbraGlossary('dreaming')]中最接近世俗世界的部分。"
 umbra_realm_far_dreaming: "远梦界"
 umbra_realm_far_dreaming_desc: "远梦界是[UmbraGlossary('dreaming')]的一部分，对应于人类的集体梦境。"
 umbra_realm_deep_dreaming: "深梦界"
 umbra_realm_deep_dreaming_desc: "深梦界是[UmbraGlossary('dreaming')]中离着清醒世界最远的部分。"
 umbra_realm_astral_plane: "星界"
 umbra_realm_astral_plane_desc: "广义上讲，星界可以被认为是全人类意识的投射，随后根据不同种类的思想被细分为不同界域。"
 umbra_realm_vulgate: "庸底"
 umbra_realm_vulgate_desc: "庸底——也被称为想象世界——是[UmbraGlossary('astral_reaches')]的最低部分。它包含了人类（也许还有一些其他物种）的集体哲学和思维方式所想到的常识概念。"
 umbra_realm_spires: "众峰"
 umbra_realm_spires_desc: "宇宙学家认为，众峰是众人的思想集中在同一个概念上的结果，导致它从[UmbraGlossary('vulgate')]上升到更高的界域。"
 umbra_realm_inventium: "构界"
 umbra_realm_inventium_desc: "构界是[UmbraGlossary('astral_reaches')]的界域之一，充满了人类梦寐以求的所有发明。这些发明以一种可察的爆裂声显现出来，并轻轻地落入巨大的堆积物中，充满了整个界域的各地。"
 umbra_realm_epiphamy: "悟韵"
 umbra_realm_epiphamy_desc: "悟韵体现了最抽象的概念，如“自然法则”或“真爱”。它们显现为[UmbraGlossary('vulgate')]天空中的彩色云彩，可以给旅者提供关于它们所体现的概念的线索。"
 umbra_realm_shadowlands: "幽土"
 umbra_realm_shadowlands_desc: "幽土是现实的镜像“皮肤”，生者界域的每一个地点在幽土都有一个相应的地点，在大多数情况下，这些地点遵守传统的距离法则。它是死灵蛰居等待着救赎，或是[UmbraGlossary('oblivion')]的地方。"
 umbra_realm_river_of_death: "死亡之河"
 umbra_realm_river_of_death_desc: "死亡之河是[UmbraGlossary('tempest')]中的一条水路，是冥河城通往[UmbraGlossary('shadowlands')]和其他[Glossary('冥府','game_concept_dark_kingdom_desc')]的主要旁路。"
 umbra_realm_sunless_sea: "无光之海"
 umbra_realm_sunless_sea_desc: "命名缘由自它上面的天空永远是黑暗的，来自船只和信标等来源的光线在无光之海可在几英里外看到，因为它从水面上散射开来。"
 umbra_realm_far_shore: "彼岸"
 umbra_realm_far_shore_desc: "彼岸是[UmbraGlossaryLocalized('shadowlands','冥界')]的一块神秘领地，由被称为“闪耀者”的皮提亚人实体控制。对现代冥河城民来说，彼岸是由异端控制的领土，不值得信任。"
 umbra_realm_weeping_bay: "泣湾"
 umbra_realm_weeping_bay_desc: "泣湾位于灵魂之海和[UmbraGlossary('sunless_sea')]的中间，是冥河城的主要港口，也是与其他各个死城的联系。海湾的形状很有特点，呈半月形，并不断充斥着被灵铸成海湾的死灵的呜咽和呻吟。"
 umbra_realm_sea_of_souls: "灵魂之海"
 umbra_realm_sea_of_souls_desc: "围绕着冥河城和[UmbraGlossary('isle_of_sorrows')]建造的保护性海墙。它的名字来自于那些被锻造或灌进墙体结构中的不幸的死灵。"
 umbra_realm_isle_of_sorrows: "泣绝岛"
 umbra_realm_isle_of_sorrows_desc: "泣绝岛是一个岩石岛，位于[UmbraGlossary('river_of_death')]的三角洲，在[UmbraGlossary('tempest')]的深处。"
 veinous_stair_desc: "静脉阶梯是一条从冥河城直接通往[UmbraGlossary('pod_realm_labyrinth')]的通道。[UmbraGlossary('shadowlands')]最稳定的地方，由未知类型的黑色石头组成。"
 umbra_realm_dark_kingdom_of_iron: "铁之冥府"
 umbra_realm_dark_kingdom_of_iron_desc: "冥河城是西方死灵的首都，是一座难以理解的巨大城市，位于[UmbraGlossary('tempest')]深处的[UmbraGlossary('isle_of_sorrows')]。它是西方死灵各组织的主要总部所在地。"
 umbra_realm_dark_kingdom_of_clay: "黏土冥府"
 umbra_realm_dark_kingdom_of_clay_desc: "业境，外人称为黏土[Glossary('冥府','game_concept_dark_kingdom_desc')]，是[UmbraGlossary('tempest')]中属于澳大利亚原住民的界域。"
 umbra_realm_dark_kingdom_of_ivory: "象牙冥府"
 umbra_realm_dark_kingdom_of_ivory_desc: "幽灵之丛，也被称为象牙[Glossary('冥府','game_concept_dark_kingdom_desc')]，是非洲死灵——又称阿班博——的[UmbraGlossary('shadowlands')]。"
 umbra_realm_dark_kingdom_of_jade: "玉之冥府"
 umbra_realm_dark_kingdom_of_jade_desc: "黄泉，又称玉之[Glossary('冥府','game_concept_dark_kingdom_desc')]，是专门为亚洲的死者服务的[UmbraGlossaryLocalized('shadowlands','冥界')]部分，并由他们控制。"
 umbra_realm_dark_kingdom_of_obsidian: "黑曜石冥府"
 umbra_realm_dark_kingdom_of_obsidian_desc: "剥皮之地是对中美洲掌握的死者国度的称呼，是强大的黑曜石[Glossary('冥府','game_concept_dark_kingdom_desc')]的一部分。"
 umbra_realm_dark_kingdom_of_sand: "沙之冥府"
 umbra_realm_dark_kingdom_of_sand_desc: "沙之[Glossary('冥府','game_concept_dark_kingdom_desc')]阿蒙提是属于不朽者的[UmbraGlossaryLocalized('shadowlands','冥界')][Glossary('冥府','game_concept_dark_kingdom_desc')]。它的居民不是死灵，而是不朽者，其等在死后会来到这[UmbraGlossary('shadowlands')]。"
 umbra_realm_swar: "施瓦"
 umbra_realm_swar_desc: "施瓦（意为天界）——喜悦之城——是印度的亡者之城，施瓦是印度[UmbraGlossary('shadowlands')]——空界——的首要城市。"
 umbra_realm_night_markets: "夜市"
 umbra_realm_night_markets_desc: "夜市，名义上是[UmbraGlossary('swar')]的一部分，是东南亚亡者蜗居的地方。"
 umbra_realm_mantaqat_khayal: "曼塔卡特·卡哈耶"
 umbra_realm_mantaqat_khayal_desc: "曼塔卡特·卡哈耶，中东的[UmbraGlossary('shadowlands')]。人们对这片土地知之甚少，只知道至少从伊斯兰教的黎明开始，哀恸就把它吞没在永恒的沙暴中。只有死城提供了躲避沙暴的庇护所，而且只有商人、朝圣者和游牧者才会跨越它。"
 umbra_realm_shadow_realm: "影子国度"
 umbra_realm_shadow_realm_desc: "影子国度是木乃伊在[UmbraGlossaryLocalized('shadowlands','冥界')]的根据地，在他们准备好再次回到在自己的身体里之前，他们会去那里进行自我再生，且在此处其等可避免怨灵或死涡的侵袭。"
 umbra_realm_hades: "哈迪斯"
 umbra_realm_hades_desc: "卡比里木乃伊的主要[UmbraGlossary('shadow_realm')]被称为哈迪斯，来自希腊神话中的[UmbraGlossaryLocalized('shadowlands','冥界')]。"
 umbra_realm_gates_of_heaven: "天门"
 umbra_realm_gates_of_heaven_desc: "天降大任于重生者。八仙给予天宗使命旨意。他们奉旨，且必须执行天意。当他们失败时，他们将在天门花时间沉思，为自己做好准备，以便不再失败。"
 umbra_realm_yomi_wan: "幽冥"
 umbra_realm_yomi_wan_desc: "幽冥，直译为无量地狱，是由[Glossary('阎魔王','podgloss.yamaking')]们结合[Glossary('阳界','game_concept_yang_world_desc')]与[UmbraGlossaryLocalized('shadowlands','阴界')]的灵界所创造的人工精神维度，作为其统治核心。\n\n这些地狱被划分为若干囚禁亡魂的狱境，每一层都以其主宰的[Glossary('阎魔王','podgloss.yamaking')]为主题，各层之间为争夺统治权而争斗不休。"
 umbra_realm_well_of_the_void: "虚空之井"
 umbra_realm_well_of_the_void_desc: "虚空之井是[UmbraGlossary('oblivion')]的物理表象，位于[UmbraGlossary('pod_realm_labyrinth')]的中心和底部。"
 umbra_realm_oblivion: "湮灭"
 umbra_realm_oblivion_desc: "湮灭是熵本身，是不断变幻的毁灭与疯狂之力，没有什么能从那回来。"
 umbra_realm_abyss: "深渊"
 umbra_realm_abyss_desc: "深渊，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕天者的永恒监狱。"
 umbra_realm_spirit_wilds: "灵野"
 umbra_realm_spirit_wilds_desc: "灵野是中影界的另一个名称，是近界之间的空间。这一[umbra|E]部分反映了自然环境，包括其原始状态和受污染的状态。"
 umbra_realm_atrocity_realm: "暴行界域"
 umbra_realm_atrocity_realm_desc: "暴行界域，被法师们称为荒土，是近界域之一。千年来，世界上所有受害者的痛苦造就了这界域，一个已固为永恒的残酷和折磨。"
 umbra_realm_battleground: "战界"
 umbra_realm_battleground_desc: "战界，在东方被称为斗魂界，是[umbra|E]中的近界域之一，包含着有史以来的每一场战斗，从最早的新石器时代部落与熊和狼的冲突，刀耕之治和魂怒之战，直到目前中东和伊比利亚内部的冲突。"
 umbra_realm_cyberrealm: "赛博界"
 umbra_realm_cyberrealm_desc: "赛博界是[umbra|E]的十三近界域之一。这界域也许代表了$glossary_weaver$在[umbra|E]的影响力的顶峰。它被法师们称为敌托邦。"
 umbra_realm_erebus: "厄瑞玻斯"
 umbra_realm_erebus_desc: "厄瑞玻斯常常被比作狼族的“地狱”，但实际上是个净化精神的地方。它充满了熔化的银化为的河，既能燃烧，又能治疗，将囚犯的折磨延长到几个月、几年，甚至可能是几个世纪。"
 umbra_realm_flux_realm: "变界"
 umbra_realm_flux_realm_desc: "变界，变化界，或辐射界是近影界中的界域。它是强大的纯净、未被稀释的奇原能量库，未被织者的章程所污染。"
 umbra_realm_hy_brasil: "易巴席尔"
 umbra_realm_hy_brasil_desc: "易巴席尔似乎是一个充满无尽幻想故事的土地。在这里，季节永远不会改变，白天永远锁定为黄昏。在这块土地的西半部，太阳挂在仲夏天空中。在东边，月亮升起，寒冷而可怕，笼罩着隆冬夜晚。"
 umbra_realm_legendary_realm: "传奇界"
 umbra_realm_legendary_realm_desc: "传奇界是位于近影界的近界域之一。在该界域穿越的狼族可以体验他们传奇先祖的生活。然而，界域内的事件并非严格的历史再现；它们可能随着时间推移而改变故事滤镜，以适应当前世界的思想。"
 umbra_realm_mountains_of_heaven: "天山"
 umbra_realm_mountains_of_heaven_desc: "天山是[Glossary('阳界','game_concept_yang_world_desc')]中的影界界域。该界域表现为在云海之上的庞大山脉链，甚至使伟大的喜马拉雅山脉也相形见绌。"
 umbra_realm_pangaea: "泛古界"
 umbra_realm_pangaea_desc: "泛古界是原始地球的投影，展示了文明、人类历史，甚至是刀耕之治之前的世界面貌。"
 umbra_realm_scar: "疤痕"
 umbra_realm_scar_desc: "疤痕是[umbra|E]的近界域之一。它是工业革命在生锈的繁荣理想下被腐蚀成对灵魂的磨砺压榨的显现。"
 umbra_realm_summer_country: "夏乡"
 umbra_realm_summer_country_desc: "夏乡是位于地球近影界的近界域之一。它现在只是个神话，因为它已经消逝了几十年了。传说中，该界域反映了盖亚对她的孩子们的纯洁又无尽的爱。"
 umbra_realm_tiger_lands: "虎原"
 umbra_realm_tiger_lands_desc: "虎原是东方[umbra|E]的一个阳界域，是濒危动物的灵和因人类砍伐而失去家园的灵的避难所。"
 umbra_realm_umi: "羽海"
 umbra_realm_umi_desc: "作为中原最强大的影界界域之一，羽海声称整个太平洋都是它的管辖范围，尽管某些波利尼西亚和印度尼西亚的灵域对此不以为然。"
 umbra_realm_wolfhome: "狼之家"
 umbra_realm_wolfhome_desc: "狼之家是近界域之一，位于地球的近影界。它是狼族经常光顾的地方。该界域是一片广阔的原始荒野。这里隐藏着对原始奥秘的答案。"
 umbra_realm_aetherial_realm: "以太界"
 umbra_realm_aetherial_realm_desc: "以太界。也被称为乙太界，是影界内最广的近界域，横跨[UmbraGlossary('spirit_wilds')]，直到影幕。它在物质世界的景象即是天空，不断循环着黑夜和白天。"
 umbra_realm_court_of_eshtarra: "埃什塔拉的宫廷"
 umbra_realm_eshtarra_desc: "埃什塔拉，歌者，是狼族占星学中的地球星君。"
 umbra_realm_court_of_sokhta: "索赫塔的宫廷"
 umbra_realm_sokhta_desc: "索赫塔是露娜的法相之一，该天神是狼族和其他许多化形种族的守护神，她的宫廷里有许多月使和其他同情狼国的灵。"
 umbra_realm_court_of_katanka_sonnak: "卡坦卡·索纳克的宫廷"
 umbra_realm_katanka_sonnak_desc: "卡坦卡·索纳克，风骑士，是狼族占星学中的太阳星君。"
 umbra_realm_court_of_mitanu: "米塔努的宫廷"
 umbra_realm_mitanu_desc: "米塔努，聪慧浪人，是狼族占星学中的水星的星君。他既是诡计大师，也是喜剧爱好者。"
 umbra_realm_court_of_hakahe: "哈卡赫的宫廷"
 umbra_realm_hakahe_desc: "哈卡赫是祝融星——比水星更靠近太阳的假想星球——的星君，他被认为是铸造新生狼族的灵魂的负责者。"
 umbra_realm_court_of_tambiyah: "坦比娅的宫廷"
 umbra_realm_tambiyah_desc: "坦比娅，蒙面母亲，是狼族占星学中的金星的星君。"
 umbra_realm_court_of_nerigal: "尼格尔的宫廷"
 umbra_realm_nerigal_desc: "尼格尔，冰战士，是狼族占星学中的火星的星君。"
 umbra_realm_court_of_rorg: "罗尔格的宫廷"
 umbra_realm_rorg_desc: "罗尔格，多爪猎人，是狼族占星学中的罗尔格星的星君，罗尔格星的毁灭导致了小行星带的形成。"
 umbra_realm_court_of_zarok: "扎罗克的宫廷"
 umbra_realm_zarok_desc: "扎罗克，加冕君主，是狼族占星学中的木星的星君。"
 umbra_realm_court_of_lu_bat: "鲁·帕特的宫廷"
 umbra_realm_lu_bat_desc: "鲁·帕特，和平顾问，是狼族占星学中的土星的星君。"
 umbra_realm_court_of_ruatma: "鲁阿特玛的宫廷"
 umbra_realm_ruatma_desc: "鲁阿特玛，阴影者，是天王星的星君。"
 umbra_realm_court_of_shantar: "尚塔尔的宫廷"
 umbra_realm_shantar_desc: "尚塔尔，织机造者，是海王星的星君。"
 umbra_realm_court_of_meros: "梅罗斯的宫廷"
 umbra_realm_meros_desc: "梅罗斯，流浪者，是冥王星的星君。"
 umbra_realm_weaver_reaches: "织者境"
 umbra_realm_weaver_reaches_desc: "织者境是搁浅的固化现实，类似于天文学家的数据化地图。这张网的交叉节点将冷恒星和冻结行星锁定在一个非自然的对称性上。没有生命的迹象存在。巨大的$glossary_weaver$之灵，如“星蜘蛛”，在网中巡逻和维护，并确保一切都保持在其规定的位置。"
 umbra_realm_wyld_reaches: "奇原境"
 umbra_realm_wyld_reaches_desc: "奇原境是一个混沌的地方。行星和彗星根据不断变化的法则相互碰撞，相互舞动。燃烧的冷太阳冻结了周围的一切，而其他的恒星则以其周边的反重力波将一切推开。"
 umbra_realm_wyrm_reaches: "妖蛆境"
 umbra_realm_wyrm_reaches_desc: "妖蛆境的恒星已经烧成了没有生命的躯壳，或者坍塌成了黑洞，通常直接通向[UmbraGlossary('malfeas')]。满是污染和恶火的星云在它们周围旋转，遮住了它们的星座，使它们成为影界天空中的黑暗斑点，不被任何人看到。"
 umbra_realm_shard_realm_of_prime: "根源之碎域"
 umbra_realm_shard_realm_of_prime_desc: "与地球和月球相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_first_horizon: "初穹界"
 umbra_realm_first_horizon_desc: "初穹界位于地球大气层的边缘，遍布着穹界界域，包括有[Glossary('影域','game_concept_shade_realm_desc')]。"
 umbra_realm_true_horizon: "真穹界"
 umbra_realm_true_horizon_desc: "真穹界，被科技联盟称为亚空间，被以太之子称为以太空间，是位于近影界和远影界之间的广阔[umbra|E]。对沉睡者来说，它表现为太阳和小行星带之间的空间。"
 umbra_realm_far_horizon: "远穹界"
 umbra_realm_far_horizon_desc: "远穹界大致对应于小行星带的所在处。"
 umbra_realm_deep_umbra: "深影界"
 umbra_realm_deep_umbra_desc: "深影界，也叫深宇宙，是地球影界空间之外的浩瀚界域。它主要是无穷无尽的虚空。从人类的角度来看，深影界即是深太空、外太空或整个宇宙。"
 umbra_realm_malfeas: "秽恶界域"
 umbra_realm_malfeas_desc: "秽恶界域是位于[UmbraGlossary('deep_umbra')]的疯狂妖蛆神体界域。这是一个地狱般的噩梦世界，充满了所有可以想象的可怕东西，还有一些可怕到仅仅试图想象就会使人发疯的事物。"
 umbra_realm_black_spiral_labyrinth: "黑螺旋迷宫"
 umbra_realm_black_spiral_labyrinth_desc: "黑螺旋迷宫，在中原被称为玄黑迷宫，是[UmbraGlossary('malfeas')]内的一个螺旋形迷宫，里面有难以想象的妖蛆之恐怖。"
 umbra_realm_first_city: "第一城"
 umbra_realm_first_city_desc: "第一城，除其他别名外，也被称为以诺城，被挪得学家认为是《挪得之书》所记载的该隐神话的历史上的第一座城市。"
 umbra_realm_shard_realm_of_infinity: "无限之碎域"
 umbra_realm_shard_realm_of_infinity_desc: "与太阳相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_correspondence: "空间之碎域"
 umbra_realm_shard_realm_of_correspondence_desc: "与水星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_life: "生命之碎域"
 umbra_realm_shard_realm_of_life_desc: "与金水星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_forces: "力之碎域"
 umbra_realm_shard_realm_of_forces_desc: "与火星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_matter: "物质之碎域"
 umbra_realm_shard_realm_of_matter_desc: "与木星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_time: "时间之碎域"
 umbra_realm_shard_realm_of_time_desc: "与土星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_spirit: "灵之碎域"
 umbra_realm_shard_realm_of_spirit_desc: "与天王星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_mind: "心智之碎域"
 umbra_realm_shard_realm_of_mind_desc: "与海王星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shard_realm_of_entropy: "熵之碎域"
 umbra_realm_shard_realm_of_entropy_desc: "与冥王星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。"
 umbra_realm_shade_realm_of_correspondence: "空间之影域"
 umbra_realm_shade_realm_of_correspondence_desc: "与水星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。无法从地球直接抵达这个[Glossary('碎域','game_concept_shard_realm_desc')]，而那些设法抵达那里的人发现自己在全维空间中按照不可知的几何移动。"
 umbra_realm_shade_realm_of_life: "生命之影域"
 umbra_realm_shade_realm_of_life_desc: "与金星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。该界域是郁郁葱葱、不断变化的丛林。它与地球的相对可及性使其成为升华之战的频繁战场。"
 umbra_realm_shade_realm_of_forces: "力之影域"
 umbra_realm_shade_realm_of_forces_desc: "与火星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。力之影域是永无止境的风暴，罕见的有相对平静的孤立地点。[doissetep|E]占据了安定点之一，至少在它被摧毁之前是如此。和生命之影域一样，它也是一个频繁的（和危险的）法师战斗场地。"
 umbra_realm_shade_realm_of_matter: "物质之影域"
 umbra_realm_shade_realm_of_matter_desc: "与木星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。这个界域可能与空心地球有关，也可能只是类似，但规模要大得多——一个由恐龙、失落文明和其他不复存在的事物组成的帝国。"
 umbra_realm_shade_realm_of_time: "时间之影域"
 umbra_realm_shade_realm_of_time_desc: "与土星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。任何进入时间之影域的访客都冒着严重的风险，因为即使是最轻微的移动也会导致时间扭曲和不受控制的时间旅行。"
 umbra_realm_shade_realm_of_spirit: "灵之影域"
 umbra_realm_shade_realm_of_spirit_desc: "与天王星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。在灵之影域没有险棘：灵与凡人可以直接互动。法师的化身也有可能在这里显现躯体并与他们交谈。"
 umbra_realm_shade_realm_of_mind: "心智之影域"
 umbra_realm_shade_realm_of_mind_desc: "与海王星相关联的[Glossary('影域','game_concept_shade_realm_desc')]。正如人们所期望的那样，心智之影域的性质是由人们觉得那里会有什么的想法所决定的。它像一面镜子一样反射出来访者自己的想法和感受。"
 umbra_realm_shade_realm_of_entropy: "熵之影域"
 umbra_realm_shade_realm_of_entropy_desc: "与冥王星相关联的[Glossary('碎域','game_concept_shard_realm_desc')]。据称在这里，宇宙的大因果轮回被暴露无遗，它甚至可能与[UmbraGlossary('shadowlands')]有直接关联。"
