 game_concept_low_dukedoms:0 "Low Dukedoms"
 game_concept_low_dukedoms_desc:0 "The Low Dukedoms of Quox and Mux are [dream_realms|E] near the Vale of Mists.\n\nToward the limits of the Bullydale Wastes, the petty selfishness and violence becomes more mindless; the schemes increasingly more outrageous. The usual rules bend and finally collapse into absurdity. Once totally absurd behavior is the rule, then the traveler has arrived in the Low Dukedoms, the heart of trickery and slapstick comedy in the [dreaming|E]."
