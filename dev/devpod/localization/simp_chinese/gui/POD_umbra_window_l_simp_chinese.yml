 custom_name_den_realm:0 "巢域"
 custom_desc_den_realm:0 "巢域是一个与化形族裔联系在一起，作为她的个人退路的影界补丁。大多数巢域与物质现实中的区域相联系，并提供一条进入近影界的通道，这样从小撇步或用类似的方式进入影界就会更容易。巢域受到很好地防护，很难突破它们的防御。"
