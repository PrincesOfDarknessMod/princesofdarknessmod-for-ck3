 game_concept_winterweir:0 "Winterweir"
 game_concept_winterweir_desc:0 "The Winterweir is a Realm of the [far_dreaming|E].\n\nSituated in the Winter portion of the Forest of Lies along a Nearward tributary of the Sea of Silver, the Winterweir is a cool, misty place shrouded in mystery. Home of the fuaths, few parts of the Forest are as thick and wild as the Winterweir... or as dangerous. The fuaths who live in this realm are suspicious of strangers and generally drive them away unless properly propitiated. Some do this merely to ensure their solitude while others are actively malevolent. The former have good cause for suspicion, especially given recent fir-bholg raids and the activities of the second category."
