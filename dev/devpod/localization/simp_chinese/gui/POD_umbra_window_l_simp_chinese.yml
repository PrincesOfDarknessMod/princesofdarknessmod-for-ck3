 umbra_discovery_muse_expedition: "缪斯庭"
 umbra_discovery.muse_expedition.desc: "$umbra_discovery_finder$发现了传说中的$umbra_discovery_region$。你被缪斯们邀请了，值得进行[umbra_expedition|E]"
 umbra_discovery_elemental_court_armor_expedition: "元素护甲"
 umbra_discovery.elemental_court_armor_expedition.desc: "$umbra_discovery_finder$发现了传说中的$umbra_discovery_region$。$umbra_discovery_finder$在地元素庭找到了值得一见的宝物，现在正请求[umbra_expedition|E]以便研究。"
 umbra_discovery_elemental_court_armor_expedition2: "元素护甲"
 umbra_discovery.elemental_court_armor_expedition2.desc: "$umbra_discovery_finder$发现了传说中的$umbra_discovery_region$，准确来说是火元素庭。一项增强你的元素护甲的[umbra_expedition|E]可被发起。"
 umbra_discovery_elemental_court_armor_expedition3: "元素护甲"
 umbra_discovery.elemental_court_armor_expedition3.desc: "$umbra_discovery_finder$发现了传说中的$umbra_discovery_region$，准确来说是水元素庭。一项增强你的元素护甲的[umbra_expedition|E]可被发起。"
 umbra_discovery_elemental_court_armor_expedition4: "元素护甲"
 umbra_discovery.elemental_court_armor_expedition4.desc: "$umbra_discovery_finder$发现了传说中的$umbra_discovery_region$，准确来说是风元素庭。一项增强你的元素护甲的[umbra_expedition|E]可被发起。"
 umbra_discovery_grand_hall_expedition: "灵界探险家"
 umbra_discovery.grand_hall_expedition.desc: "在探索像$umbra_discovery_region$这样的迷宫时，$umbra_discovery_finder$遇到了一位友好的精灵，它愿意为进一步探索提供服务。这个提议值得进行一次[umbra_expedition|E]。"
 umbra_discovery_heaven_expedition: "天堂之梯"
 umbra_discovery.heaven_expedition.desc: "在探索深影界最偏远的地区时，$umbra_discovery_finder$发现了一扇闪闪发光的熔珠之门。白色的光芒从屏障中散发出来，让其沐浴在无以言表的舒适之中。其不被允许进入，但也许你不妥协的信念能带你到其失败的地方？如果是这样，那么前往$umbra_discovery_region$的[umbra_expedition|E]之旅就很有必要了。"
 umbra_discovery_epiphamies_expedition: "人愚之堡垒"
 umbra_discovery.epiphamies_expedition.desc: "$umbra_discovery_finder$在探索$umbra_discovery_region$（抽象概念的形式领域）时，发现了一座充满力量的不朽城堡。虽然它周围弥漫着不安的气氛，但仍然值得进行一次[umbra_expedition|E]。"
