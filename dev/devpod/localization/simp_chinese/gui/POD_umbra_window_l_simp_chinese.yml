 game_concept_the_homeland_of_the_uktena:0 "乌克特纳之母界"
 game_concept_the_homeland_of_the_uktena_desc:0 "乌克特纳的母界酷似未受殖民的净土。如今，这些部族的最后祖灵只居住在母界中。独特的神话生物和美洲原住民传说中的英雄也在这个领域中定居，并与乌克特纳交换秘密以获取持续的保护。这个界域与深渊有联系，还与角蛇本神居住的加伦拉蒂有着联系。"
 the_homeland_of_the_uktena_confirm:0 "回到乌克特纳之母界"
