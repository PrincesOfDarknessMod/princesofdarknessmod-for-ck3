 game_concept_digital_web:0 "数位网络"
 game_concept_digital_web_desc:0 "数位网络是完全基于虚拟现实的区域，也是虚拟行者的非官方基地。它将成为虚拟行者“现实2.0”计划的基础，将人类引向一个摆脱地球物质现实问题的更美好世界。就像互联网是一种虚拟的“空间”，与实际位置无关一样，数位网络在理论上是一个重要的对应点。它可能与阿里巴廷的卡夫山有某种联系。"
