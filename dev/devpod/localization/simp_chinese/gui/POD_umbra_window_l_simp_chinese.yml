 game_concept_kingdom_of_dan:0 "大梦之国"
 game_concept_kingdom_of_dan_desc:0 "[dan|E]之国是[deep_dreaming|E]的[oneiric_realms|E]之一。\n\n在一个没有固定边界的世界中，存在着两条假设的线，一些梦境地图制作者用它们来衡量已知[dreaming|E]的范围：中轴线和平分线。第一条线从上到下测量[dreaming|E]。第二条线从左到右横穿[dreaming|E]，作为一个粗略的赤道。与对[dreaming|E]的任何测量一样，这主要是一种构想，旨在为本来混乱的宇宙赋予一些秩序感。在这个虚构的中轴线的顶端，就是[dan|E]之国。"
 kingdom_of_dan_confirm:0 "漫游大梦之国"
