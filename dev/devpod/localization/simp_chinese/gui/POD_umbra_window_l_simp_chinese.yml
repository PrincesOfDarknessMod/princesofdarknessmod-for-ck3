 umbra_caliburn_confirm: "拔剑"
 umbra_caliburn_tooltip: "一把插在石头上的剑出现在你面前，它会是……\n只有有德者（正义、慈悲、勇敢……）才能拔出这把剑。"
 umbra_search_invention_tooltip: "在填满这个界域的大量堆积物中寻找神秘装置。"
 umbra_search_innovation_tooltip: "你想在[inventium|E]的巨大堆积物中搜索，找到什么有用的发明吗？"
 umbra_gain_commander_trait_confirm: "学习战略"
 umbra_collect_artifact_pieces_tooltip: "死涡从[UmbraGlossary('pod_realm_labyrinth')]中喷发而出，可以触及[UmbraGlossary('tempest')]所在的任何地方——从[UmbraGlossary('shadowlands')]到[Glossary('冥府','game_concept_dark_kingdom_desc')]。死涡由[UmbraGlossaryLocalized('shadowlands','冥界')]的事物组成——遗器、怨灵和大风暴本身，从灵质雨到灵火雨不等。大风暴是一场回忆的风暴，幸运的拾荒者可以找到一两件藏在渣滓中的有用物品。"
