 game_concept_snail_graveyards:0 "Snail Graveyards"
 game_concept_snail_graveyards_desc:0 "The Snail Graveyards are six known sites in the [dreaming|E] to which the snails travel when they realize they are dying.\n\nBecause the way is difficult and dying snails travel slowly, most never make it to the graveyards and die somewhere along the way. In fact, one of the easiest ways for changeling to find the way to the nearest Snail Graveyard is to follow the fragmentary trail of snail shells underfoot. As one was, the shells grow gradually thicker on the ground and eventually one is in a Snail Graveyard. The oldest and strongest snails go to Ariké to die."
