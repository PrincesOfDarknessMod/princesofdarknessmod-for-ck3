 game_concept_hieronymus_continuum:0 "Hieronymus Continuum"
 game_concept_hieronymus_continuum_desc:0 "The Hieronymus Continuum is a [dream_realm|E] in the Far or [deep_dreaming|E] said, by some, to be the birthplace of the Nockers.\n\nThe realm's actual appearance and dimensions are a subject of much debate among nocker physicists. Some legends hold that the first nockers came from this Dreamrealm and traveled to Earth in a giant mechanical egg. Few nockers support this tale, privately recognizing Arcadia as their true home, but almost all of them will whip out the tale like a switchblade in an argument as \"proof\" of their superiority to the other fae. Some claim the continuum is more than just another dreamrealm but is part of an altogether different dimension that exists outside the [dreaming|E] in a fold of the space-time continuum. Nockers who have reached this realm and returned always do so with profound insights into invention. The only known way to reach it is through rift anomalies in the [far_dreaming|E] and with a Delta-Wave Helmet."
