l_simp_chinese:
 pod_mod_compatibility_header: "#bold;beast 警告：存在不兼容模组#!"
 pod_mod_compatibility_character: "你的一个模组正在覆盖文件：\n\n#bold /gui/窗口字符.#!\n\n这将导致字符窗口出现许多问题，包括但不限于：缺少按钮、缺少或错误显示字符信息或缺少关系。\n\n我们强烈建议删除其他模组，直到不再显示此警告。"
 pod_mod_compatibility_hud: "你的一个模组正在覆盖文件：\n\n#bold /gui/hud.gui#!\n\n这将导致HUD（用户界面）问题，例如侧边栏按钮缺失。\n\n我们强烈建议删除其他模组，直到不再显示此警告。"
 pod_mod_compatibility_county: "你的一个模组正在覆盖文件：\n\n#bold /gui/window_county_view.gui#!\n\n此文件是维护建筑脚本所必需的。\n\n我们强烈建议删除其他模组，直到不再显示此警告。"
 pod_mod_compatibility_interaction: "你的一个模组正在覆盖文件：\n\n#bold /gui/interaction_menu_window.gui#!\n\n/gui/interaction_menu_window.gui\n\n我们强烈建议你关闭这些模组，直到本窗口不再出现"
 pod_mod_compatibility_lifestyle: "你的一个模组正在覆盖文件：\n\n#bold /gui/window_character_lifestyle.gui#!\n\n此文件确保大型生活方式树会出现滚动条。\n\n我们强烈建议你关闭这些模组，直到本窗口不再出现"
 pod_mod_compatibility_language_header: ""
 pod_mod_compatibility_language: ""
 pod_mod_compatibility_domicile: "检测到模组冲突：\n\n#bold /gui/window_domicile.gui#!\n\n该文件用于切换政体或有无领地时维持藏身处据点建筑。\n\n强烈建议移除冲突模组直至本警告消失。"