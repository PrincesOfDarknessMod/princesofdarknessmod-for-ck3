 POD_bloodmagic_events.3.t: "[Localize(Concatenate3('ritual_',ROOT.Var('current_journey').Var('ritual').GetFlagName,'_name'))]"
 POD_bloodmagic_events.3.desc: "即使经过了数世纪的实验，世界各地由$pod_cainites$开发出的无数仪式仍然建立在相同的基础之上。无论这些仪式源自奇术、术法、亡灵术，还是其他更加奇异的实践，它们都召唤了#R 血#! 的力量。\n\n在血族深红的本源之中，蕴藏着强大的力量：一股等待被带上地表的原始力量。通过他们强大的意志力，这些该隐之子将这股力量强行带到现实中，展示出奇迹般的壮举。为了引导和聚焦这种新生力量，不受已知$pod_disciplines$限制的仪式应运而生。\n\n只有一个词可以形容这股回响于各个时代的力量：\n\n魔法。"
 POD_bloodmagic_events.3.a: "我激起我的精血，开始了……"
