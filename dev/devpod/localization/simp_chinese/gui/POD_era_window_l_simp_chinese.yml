l_simp_chinese:
 ERA_EFFECT_HEAD:0 "$line_break$#S 效果：#!$line_break$"
 custom_era_name:0 "[GetPlayer.Custom( 'custom_era_name' )]"
 custom_era_desc:0 "[GetPlayer.Custom( 'custom_era_desc' )]"
 kj_era_name:0 "[GetPlayer.Custom( 'kj_era_name' )]"
 kj_era_desc:0 "[GetPlayer.Custom( 'kj_era_desc' )]"
 era_name_fourth_age:0 "第四纪元"
 era_desc_fourth_age:0 "[GetTrait('kueijin').GetName( GetPlayer )]和[GetTraitGroup('hsien').GetName()]将这个纪元称为万物轮回的第四纪元或凄美纪元。它标志着鬼人承受诅咒，从天兵转变为源自幽冥魔物的开端。$era_effect_fourth_age$"
 era_effect_fourth_age:0 "$ERA_EFFECT_HEAD$获得[godbodies_lifestyle|E]。"
 era_name_fifth_age:0 "第五纪元"
 era_desc_fifth_age:0 "对[GetTrait('kueijin').GetName( GetPlayer )]来说，当前的时代是万物轮回的第五纪元或黑暗纪元。雷民说目前的世界是由“石人 ”主宰的，他们从遥远的地方来到这里，将中原置于他们的控制之下。$era_effect_fifth_age$"
 era_effect_fifth_age:0 "$ERA_EFFECT_HEAD$获得[shintai_lifestyle|E]。$line_break$$godbody_valid$"
 godbody_valid:0 "[GetPlayer.Custom( 'godbody_valid' )]"
 godbody_valid_dharma10:0 "因为你有[GetTrait('dharma10').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]。"
 godbody_valid_dharma9:0 "因为你有[GetTrait('dharma9').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到第六纪元。"
 godbody_valid_dharma8:0 "因为你有[GetTrait('dharma8').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1650年。"
 godbody_valid_dharma7:0 "因为你有[GetTrait('dharma7').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1600年。"
 godbody_valid_dharma6:0 "因为你有[GetTrait('dharma6').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1550年。"
 godbody_valid_dharma5:0 "因为你有[GetTrait('dharma5').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1450年。"
 godbody_valid_dharma4:0 "因为你有[GetTrait('dharma4').GetName( GetPlayer )]，所以你将保留[godbodies_lifestyle|E]到1350年。"
 godbody_invalid:0 "[godbodies_lifestyle|E]现在对你不可见，你可以保留你目前的技能，但你不能再在[godbodies_lifestyle|E]中取得进展。"
 era_name_sixth_age:0 "第六纪元"
 era_desc_sixth_age:0 "[GetTrait('kueijin').GetName( GetPlayer )]称即将到来的纪元为万物轮回的第六纪元，也被称为哀伤纪元。它是轮回的低谷，玉皇大帝从他的宝座上走下来，阎魔中的一位将飞升为魔帝。"
 fae_era_name:0 "[GetPlayer.Custom( 'fae_era_name' )]"
