 pod_ventrue_ephorate.4.t: "督政会传唤"
 pod_ventrue_ephorate.4.desc: "随着一位受人尊敬的督政会成员最近的去世，一个空位已经开放。督政决定，你是替代他们失去的同事的最佳人选。这当然是一个非常有声望的荣誉，因为督政对族内事务有很大的影响力。\n虽然你只是十二人中的一个，但这仍会对你产生良好的影响，并可能在未来为你带来新的机遇。现在是时候让你在世界最强大的梵卓中占据一席之地了。"
 pod_ventrue_ephorate.4.a: "我的才能终于得到了回报。"
 ventrue_ephorate_entry_tt: "你现在是督政会的一部分，并将根据你的宗教和特质自动支持一个派系。\n涉及你塑造宗族的新事件将在未来发生。"
 pod_ventrue_ephorate.6.t: "督政会"
 pod_ventrue_ephorate.6.desc: "督政会由12位最有权力和影响力的梵卓长者组成。督政会在“氏族政策”事务上确立先例。它是梵卓内部阶级中的最高阶级。督政会最重要的职能不是那么容易量化的；他们为整个$pod_clan$定下基调。他们的理念、领导风格和政治立场在各阶级进行讨论和辩论，因此在一定程度上影响了大多数梵卓。\n#X 督政会是梵卓的一个决定性特征。根据督政会派系的对比，梵卓会获得不同宗族修正。每位督政还可以获得独特的宫廷职位。督政是终身制的，这意味着只有其中一人死亡才开放新的席位。\n你可以通过屏幕右侧的按钮来查看它！#!"
 pod_ventrue_ephorate.6.a: "团结使我们更强大。"
 ventrue_ephorate_intro_tt: "目前的督政会是分裂的，但隐隐的受贵人主导，给于整个梵卓氏族修正。\n如果督政会的组成发生了变化，修正也会随之改变。"
 ventrue_ephorate_intro_member_tt: "目前的督政会是分裂的，但隐隐的受贵人主导，给于整个梵卓氏族修正。\n如果督政会的组成发生了变化，修正也会随之改变。\n你的角色起始为这机构的成员，这将为你在未来影响氏族提供新的可能性。"
 pod_ventrue_ephorate.100.t: "督政会的终末"
 pod_ventrue_ephorate.100.desc: "自罗马时代以来，督政会一直被分成不同的派系。这分裂实际上是该机构的救命索，因为它意味着梵卓氏族缺乏一个无可争议的权威，可以有力地推动它向前发展。\n这种状况已经改变，一个派系已经成功地实现了对该机构的完全统治。随着梵卓氏族再次统一于一个愿景之下，督政会本身也失去了所有的权力，很快就会成为一个已逝的混乱时代的遗迹。"
 pod_ventrue_ephorate.100.a: "一个面向未来的大胆举措。"
 ventrue_ephorate_end_tt: "督政会被解散了，获胜的派系对梵卓氏族的强行施加了更强的宗族修正。"
 ephorate_distributing_funds_modifier: "督政会再分配"
 ephorate_distributing_funds_modifier_desc: "督政会正在重新分配其部分资金，以资助梵卓在世界各地的项目。"
 pod_ventrue_ephorate.7.t: "督政会金库"
 pod_ventrue_ephorate.7.desc: "督政会坐落在吸血鬼历史上最令人印象深刻的金库之一上。梵卓氏族以精明的投资而闻名，而且这些投资可以永远持续。因此，在将这财富重新分配给世界上的其他梵卓项目之前，督政会先进行计划。\n你被选为处理目前这十年的再分配的人，这意味着你现在负责一个巨大的黄金储备。\n这是一种荣誉，也是一种诱惑……"
 pod_ventrue_ephorate.7.a: "金钱有时会失踪……"
 pod_ventrue_ephorate.7.b: "是时候重新投资了。"
 ephorate_decorum_modifier: "督政会礼仪"
 ephorate_decorum_modifier_desc: "督政会很好地保持了礼节，塑造了一个强大而有纪律的梵卓氏族形象。"
 pod_ventrue_ephorate.8.t: "精英礼仪"
 pod_ventrue_ephorate.8.desc: "督政会是一个有声望的机构，被期望代表梵卓氏族的精英。问题是，在同一个组织里有这么多有权势的长者，气氛可能很快就会暴躁起来，激烈的会议可能会导致争吵持续到督政会的大厅之外。这样一个艰难辩论已经开始在你与同事间变得激烈，你们都还没有退缩。\n如果这种情况继续下去，这个问题很可能会在机构外传开，并打破梵卓氏族会想要呈现的纪律严明的团结的面子。如果你想避免这可怕的可能性，现在退缩仍然是一个选择。"
 pod_ventrue_ephorate.8.a: "我们可以慢慢平息这场辩论。"
 pod_ventrue_ephorate.8.b: "让我们妥协吧。"
 pod_ventrue_ephorate.8.c: "我才是对的！"
 ephorate_decorum_broken_modifier: "督政会礼仪崩坏"
 ephorate_decorum_broken_modifier_desc: "督政会的团结门面正在出现裂缝，削弱了梵卓氏族的整体实力。"
 pod_ventrue_ephorate.9.t: "威胁无处不在"
 pod_ventrue_ephorate.9.desc: "督政会雇佣了一支秘密警察，同时也是一支快速反应部队，即刀斧手。这些强大的特工确保在需要的时候，梵卓氏族的利益总是受到武力的保护，多年来一直是许多虚弱的亲王的重要资产。\n可悲的是，对梵卓氏族的威胁似乎从未停止过，而刀斧手们也报告说，他们要扑灭的火灾数量太多，已经不堪重负。因此，他们要求得到更多的资源，无论是黄金还是中立亲王的政治恩惠。\n作为负责内部安全的现任督政，你有责任响应这一求助呼吁。"
 pod_ventrue_ephorate.9.a: "刀斧手只需要更加努力地工作。"
 pod_ventrue_ephorate.9.b: "正当的理由。"
 ephorate_overwhelmed_lictor_modifier: "督政会刀斧手过劳"
 ephorate_overwhelmed_lictor_modifier_desc: "督政会的快速反应部队，刀斧手，被要求压得喘不过气来，在氏族的防御中留下许多漏洞"
 pod_ventrue_ephorate.10.t: "梵卓的耳目"
 pod_ventrue_ephorate.10.desc: "督政会的最低级别成员是护民官，他们是该组织和整个梵卓氏族的信使和间谍。虽然不是一个有声望的阶级，但他们的重要性是不可低估的，因为他们往往是梵卓亲王最可靠的信息来源。\n护民官人数众多，但协调性很差，他们大多向所在地区最年长的梵卓报告，而不是直接向督政会报告。由于你是这十年来负责他们的督政，你正在考虑进行彻底的改革，使他们更接近督政会本身，希望能同时改善他们的表现。"
 pod_ventrue_ephorate.10.a: "我将起草一份改革方案。"
 pod_ventrue_ephorate.10.b: "没有改变的必要。"
 ephorate_empowered_tribunes_modifier: "督政会护民官已强化"
 ephorate_empowered_tribunes_modifier_desc: "督政会的信使和间谍已被重组，为氏族的阴暗利益提供更多支持。"
 pod_ventrue_ephorate.11.t: "雄心勃勃的下属"
 pod_ventrue_ephorate.11.desc: "督政会的直接代理人是军区将军，他们是拥有督政武力的强大个人，也是唯一真正知道他们名字的人。军区将军是非常有用的，他们可以在不危及自己的情况下行使督政会的权力，但他们也经常是麻烦的，因为他们贪婪地盯着督政的位置，是组织中背叛的主要原因。\n按照惯例，督政几乎要不时地对军区将军进行彻底审查（这往往会导致清洗），而你就是这十年来负责这项可疑的荣誉的人。"
 pod_ventrue_ephorate.11.a: "军区将军是忠诚的。"
 pod_ventrue_ephorate.11.b: "其不可被信任。"
 ephorate_empowered_strategoi_modifier: "督政会的军区将军受权"
 ephorate_empowered_strategoi_modifier_desc: "督政会的直接代理人比以往任何时候都更努力工作，但往往是为了其自己的利益而不是氏族的利益。"
