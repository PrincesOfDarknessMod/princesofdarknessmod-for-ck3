 sinner_rome_gui_loc: "罪人罗马支持度："
 eternal_senate_gui_loc: "永恒元老院支持度："
 patricians_gui_loc: "贵人支持度："
 merchant_princes_gui_loc: "商贾亲王支持度："
 ephorate_support_gui_loc: "#bold 支持等级的效果为：\n- 0/4：无影响\n- 5/8：次等宗族修正\n- 8/11：高等宗族修正\n- 12：该派系接管了督政会，将其解散并给予强力宗族修正#!"
 Learn_Ephorate: "#V 更多地了解派系#!"
 window_learn_ephorate_tooltip: "点击此处以了解更多关于每个派系和它们所代表的事物。"
 pod_ventrue_ephorate.667.t: "争议点"
 pod_ventrue_ephorate.667.desc: "梵卓在很多方面都是分裂的，他们有不同的土地、传统、血统和生存方式。各个派系几乎唯一达成共识的是他们高贵的传承和他们应该团结一致，但由哪个派系负责，又是为了什么目标？这些仍然是梵卓之间最大的争论点。\n你想了解哪一个派系？"
 pod_ventrue_ephorate.667.a: "贵人"
 pod_ventrue_ephorate.667.b: "永恒元老院"
 pod_ventrue_ephorate.667.c: "罪人罗马"
 pod_ventrue_ephorate.667.d: "商贾亲王"
 pod_ventrue_ephorate.667.e: "灰之骑士"
 pod_ventrue_ephorate.667.f: "现在不选"
 pod_ventrue_ephorate.668.t: "唯一真王"
 pod_ventrue_ephorate.668.desc: "贵人们（也被称为牧首）要求以诺继承统治所有该隐之子的权利。他们主要由反映凡人贵族的亲王组成。虽然他们尊重卡米拉和罗马的成就，但他们将享乐主义和颓废视为其衰落背后的原因，并且比起倾向于罗马的同行更加严厉和纪律严明。\n牧首是保守的梵卓，采用古典模式。他们认为自己是暗夜被选中的贵族，受到该隐本人的宠爱，生来为了统治。他们在很大程度上坚持王者之路的原则，并坚持旧的做事方式（也就是说欧洲的封建传统，这是大多数先祖在凡人生活中所知道的）。他们提倡梵卓的力量并且不信任变化。毕竟，当事情是上帝和该隐从一开始就命定的事情时，为什么事情会改变呢？\n其在原作中的未来命运\n与商贾亲王合并，贵人中每个人都将在现代之夜被认为是真正的梵卓。"
 pod_ventrue_ephorate.669.t: "罗马人之梦"
 pod_ventrue_ephorate.669.desc: "永恒元老院也被称为安塔西亚派，它以朱莉娅·安塔西亚的思想为指导，朱莉娅·安塔西亚是一位罗马梵卓，在该城市没落之前曾是该市永恒元老院的成员。作为人类之路的典范，安塔西娅教导她的追随者为了所有人的更大利益而平等和相互合作的重要性。她坚持罗马该隐之子真正的“古老”方式和帝国的辉煌岁月，并希望重现永恒元老院的成就。不用说，牧首们认为安塔西亚派往好里说是受骗了，往坏里说是正在酝酿的危险叛乱。元老院认为牧首梵卓是傲慢、自私的精英主义者，只关心自己的权力和地位，仅此而已。\n其在原作中的未来命运\n随着他们的导师和领袖的消失，永恒元老院将失去对贵人们的大部分影响，在接下来的几个世纪里，只有少数城市（如法兰克福）仍追随其理想。"
 pod_ventrue_ephorate.670.t: "甜蜜颓废的罗马"
 pod_ventrue_ephorate.670.desc: "提图斯·梵卓鲁·卡米拉（更广为人知的名字是卡米拉）是梵卓历史上的一个争议人物。人们庆祝他对罗马的长达几个世纪的统治，以及他为该隐世界带来的前无古人后无来者的统一，并为他在净化崇魔的迦太基方面的作用感到自豪。但他们对他对原罪之路的狂热坚持以及他给罗马带来的纯粹颓废并不那么热情。因此，大多数梵卓都满足于将卡米拉视为真正的中世纪梵卓应有的原型：一个强大而精明的统治者，统一了他身后的氏族。但其他人仍然知道真相，卡米拉被原罪之路定义为他是一个梵卓，他们尊重双方。\n也许梵卓氏族在罗马沦陷后走错了路，回到过去的美好夜晚可能比目前的行动更可取……\n其在原作中的未来命运\n卡米拉将在梵卓历史上留下奇怪且有争议的篇章，但无论好坏，梵卓氏族将永远不会再经历他在古罗马实现的团结和颓废。"
 pod_ventrue_ephorate.671.t: "有钱能使鬼推磨"
 pod_ventrue_ephorate.671.desc: "梵卓内部新崛起了一个作为商人和贸易商发家致富，而不是寻求自己的土地和领地的新势力。这些所谓的商贾亲王中的大多数都是商贾之道的追随者，他们在财富而不是土地和封臣中寻求力量。商贾亲王们不受任何特定地点的束缚，并且（大部分）从亲王战争中获利，他们在欧洲组织了各种行会和联系网络。\n尽管许多梵卓对“贪财”和“放高利贷”的商贾亲王们不屑一顾，但这些年来商贾们在财富之外也慢慢积聚了权力和影响力。与永恒元老院一样，商贾们寻求像罗马时代一样重新统一梵卓，但是在商业行会而非元老院或皇帝的领导下。他们已经开始支持某些该隐之子领主在欧洲创造合适的环境，在那里他们可以蓬勃发展并成为王座背后的力量。\n其在原作中的未来命运\n历史将证明商贾亲王们是正确的，因为金钱将在未来几个世纪真正成为力量。与贵人们结盟，商贾亲王将成为梵卓核心身份中不可或缺的一部分。"
 pod_ventrue_ephorate.672.t: "荣誉猎犬"
 pod_ventrue_ephorate.672.desc: "灰之骑士是梵卓中对积累力量不太感兴趣的分支。他们反而严格遵守自己的骑士准则，希望梵卓氏族能为其他氏族树立勇敢、克制和纪律的榜样，而不是直接试图统治他们。大多数灰之骑士与其他派系合作得很好，只要他们认为自己的行为是“光荣的”，这是一个有点神秘的限定词，因骑士而异。\n被其他梵卓低估的灰之骑士们被其他氏族赞赏为看似不那么傲慢的梵卓，他们并没有试图使用一些有争议的借口来统治他们。这使他们成为一支政治力量，在需要时可以召集数量惊人的盟友。\n其在原作中的未来命运\n灰之骑士们不会接受以贵人和商贾亲王联盟为首的梵卓氏族的改造。作为回应他们将加入新生的魔宴，他们将组成梵卓叛族者的中坚力量，为恢复他们氏族久违的荣誉而战。"
 pod_ventrue_ephorate.4.b: "我要支持灰之骑士"
 pod_ventrue_ephorate.4.c: "我要支持商贾亲王"
 pod_ventrue_ephorate.4.d: "我要支持永恒元老院"
 pod_ventrue_ephorate.4.e: "我要支持罪人罗马"
 pod_ventrue_ephorate.4.f: "我要支持贵人"
 pod_ventrue_ephorate.30.t: "席位空缺"
 pod_ventrue_ephorate.30.desc: "在梵卓辉煌的小世界里，关于一位督政——$pod_clan$的十二位主要成员之一——最近去世的传言甚嚣尘上。作为永远的义务，这张桌子上的席位很少开放，这在野心勃勃的梵卓之间引发了一场阴暗的影响力之战，所有人都试图打动剩下的督政，希望被选中填补空缺。\n你是否也将自己定位为潜在候选人？"
 pod_ventrue_ephorate.30.a: "我自然是最佳人选。"
 pod_ventrue_ephorate.30.b: "还不是轮到我的时候。"
 entry_ephorate_tt: "你将被选为最新的督政。该选项的费用取决于各种因素，如你的声望、头衔等级和领地规模。"