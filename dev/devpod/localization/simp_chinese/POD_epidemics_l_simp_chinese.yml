l_simp_chinese:
 supernatural_diseases: "超自然瘟疫"
 epidemic_crimson_fever: "阳疾"
 disease_crimson_fever: "阳疾。"
 health.2101.crimson_fever_outbreak.desc: "阳盛阴衰的中原族裔身上表现出来的一种超自然疾病。虽然这种疾病相当罕见，但据传传染性极强。它的罕见性也意味着人们从未真正探索过潜在的治疗方法，这使它成为一种可怕的疾病。\n\n阳疾的危险病例已经悄悄进入宫廷。皮疹、咳嗽和发烧困扰着患者。"
 health.2101.crimson_fever_spreads.desc: "又有一例阳疾出现了。"
 POD_epidemic.1001.t: "[SCOPE.Custom('EventTitleDisease')]：阳疾"
 POD_epidemic.1001.desc: "阳盛阴衰的中原族裔身上表现出来的一种超自然疾病。虽然这种疾病相当罕见，但据传传染性极强。它的罕见性也意味着人们从未真正探索过潜在的治疗方法，这使它成为一种可怕的疾病。\n\n我从未想过自己会遭受这种痛苦，这痛苦的发烧噩梦不该是我的命运。\n\n当我考虑自己失衡的后果时，我的鼻孔被胆汁的刺鼻气味所刺痛，我祈祷获得救赎。"
 POD_epidemic.1001.court_physician.desc: "\n\n“别担心，[ROOT.Char.GetLadyLord]！我向你保证阳疾是可以治愈的。”"
 POD_epidemic.1001.a: "求你了，让它结束吧！"
 POD_epidemic.1002.t: "[SCOPE.Custom('EventTitleDisease')]：一次胜利"
 POD_epidemic.1002.desc: "与我之前的许多人不同，我的身体足够强壮，能够在可怕的阳疾的蹂躏中幸存下来。我不否认这是一次残酷的挑战，但我坚持下来了！"
 POD_epidemic.1002.a: "活着是为了明天的抗争！"
 epidemic_chulorviosis: "克苏洛症"
 disease_chulorviosis: "克苏洛症。"
 health.2101.chulorviosis_outbreak.desc: "克苏洛病是一种无法分类的怪异传染，具有明显地超自然性质。它将宿主变异成一个人和触手怪的腐化杂种，慢慢剥夺宿主的自由意志，直到他们也变成克苏洛夫亚，并开始进一步传播污染。\n\n最近该寄生病的不幸受害者出现了。虽然他们很快就被处理了，但在他们被安乐死去之前，他们也许感染了其他人……"
 health.2101.chulorviosis_spreads.desc: "肉体和灵魂的双重死亡。"
 POD_epidemic.1101.t: "[SCOPE.Custom('EventTitleDisease')]：一点又一点"
 POD_epidemic.1101.desc: "克苏洛病是一种无法分类的怪异传染，具有明显地超自然性质。它将宿主变异成一个人和触手怪的腐化杂种，慢慢剥夺宿主的自由意志，直到他们也变成克苏洛夫亚，并开始进一步传播污染。\n\n斑驳的墨鱼皮肤，是那么的鲜明。我难以置信地盯着它，抑制着又一次咳嗽。难道是……？难道我……？\n\n我用手指擦拭了一下嘴唇，再颤抖着收回手。我能感觉到手帕上的温暖和湿润，但我不敢看它。"
 POD_epidemic.1101.court_physician.desc: "\n\n“恐怕您感染了恶疾，[ROOT.Char.GetLadyLord]。我立刻为您治疗。”"
 POD_epidemic.1101.a: "这就是我的命运吗？慢慢的地被失去自我？"
 POD_epidemic.1102.t: "[SCOPE.Custom('EventTitleDisease')]：第二次机会"
 POD_epidemic.1102.desc: "我变得憔悴，还会咳嗽，流血。我以为我会衰弱直到死去。当我几乎无法从床上爬起来的时候，我自然会有这种想法。\n\n然而，我的健康和力量相当缓慢地恢复了。最终，我准备好面对世界及它的全部挑战了。"
 POD_epidemic.1102.a: "是时候征服全世界了！"
 POD_epidemic.1103.t: "[SCOPE.Custom('EventTitleDisease')]：深海的呼唤"
 POD_epidemic.1103.desc: "变异一开始来得很慢，比如你的前臂会出现小吸盘。然后，它开始削弱你的智力。最后，那些声音用他们的奇异语言说话。尽管你竭尽全力，他们的吟唱还是越来越大。直到有一天，你终于听懂了他们的话。\n\n大海在等着你。"
 POD_epidemic.1103.a: "我必须抵抗！"
 POD_epidemic.1103.b: "终于，该回归整体了。"
 POD_epidemic.1111.t: "[SCOPE.Custom('EventTitleDisease')]：治愈方法？"
 POD_epidemic.1111.desc: "显然，你无法用凡人的方式治疗克苏洛症，甚至连疗愈能力也不起作用。事实证明，这种寄生物病对你迄今为止尝试过的所有方法都有很强的抵抗力，随着变异的加剧，你逐渐感到绝望。还能有什么办法？"
 POD_epidemic.1111.a: "神圣之力。"
 POD_epidemic.1111.b: "魔邪之力。"
 POD_epidemic.1111.c: "三相和盖亚之力。"
 POD_epidemic.1111.d: "复活可能是一个出路。"
 POD_epidemic.1111.fallback: "应该还有别的办法。"
 POD_epidemic.1111.fallback.tt: "查看决议列表，其中有一条是关于如何治疗克苏洛症的。"
 epidemic_demonic_plague: "魔疫"
 disease_demonic_plague: "魔疫。"
 health.2101.demonic_plague_outbreak.desc: "The terrible power named Bring the Plague calls down a Biblical plague on the caster's enemies, cursing them with a highly infectious disease that plagues mortal and Cainite alike. It causes violent, painful boils that look like bleeding burn wounds when they burst. The target attracts swarms of insects and vermin wherever he goes as they wait for his inevitable death and their inevitable feast.\n\nThis terrible power has been used once again, raising death's scythe over my realm."
 health.2101.demonic_plague_spreads.desc: "又一个灵魂站在死亡之门前，可怕的淋巴腺肿毁坏了[sick_character.GetHerHis]的皮肤。"
 POD_epidemic.1201.t: "[SCOPE.Custom('EventTitleDisease')]：死神之触"
 POD_epidemic.1201.desc: "The terrible power named Bring the Plague calls down a Biblical plague on the caster's enemies, cursing them with a highly infectious disease that plagues mortal and Cainite alike. It causes violent, painful boils that look like bleeding burn wounds when they burst. The target attracts swarms of insects and vermin wherever he goes as they wait for his inevitable death and their inevitable feast.\n\nThis power is no longer just a scary story. Gingerly, I push my fingers against the lump in my armpit. A dark and deadly force is tainting my flesh, consuming me with every step I take."
 POD_epidemic.1201.court_physician.desc: "\n\n“[ROOT.Char.GetLadyLord]，我会尽我所能，但是请做好最坏的打算……”"
 POD_epidemic.1201.a: "哦，[ROOT.Char.GetFaith.HealthGodName]！请把我从这个梦魇中拯救出去！"
 POD_epidemic.1202.t: "[SCOPE.Custom('EventTitleDisease')]：排除万难"
 POD_epidemic.1202.desc: "似乎死神穿过了我的房门，在我的床边徘徊了会，但是最终还是决定让我活着。我永远不会忘记被[ROOT.Char.GetFaith.DeathDeityHerHis|U]触碰的痛苦，然而[ROOT.Char.GetFaith.DeathDeitySheHe|U]使我睁开眼，看到了生命的奇迹。\n\n魔疫夺取了许多人的生命，但我不会是他们中的一员。"
 POD_epidemic.1202.a: "为这奇迹赞美[ROOT.Char.GetFaith.HealthGodName]！"
 POD_epidemic.1202.a.tt: "我现在对[GetTrait('demonic_plague').GetName( GetNullCharacter )]免疫了"
 epidemic_gift_of_melancholia: "忧郁之赠"
 disease_gift_of_melancholia: "忧郁之赠。"
 health.2101.gift_of_melancholia_outbreak.desc: "Gift of Melancholia inflicts a virulent wasting illness on mortals and Cainites alike. Both are afflicted with a disease that causes dizziness, weakness, malaise, and nausea. The disease is highly contagious among mortals, who can spread it to each other by mere proximity. A vampire must either be directly targeted with the power or feed on an infected mortal in order to contract it. An infected vampire, however, will spread the plague to everyone he feeds upon until he is cured.\n\nA case has recently discovered in your realm."
 health.2101.gift_of_melancholia_spreads.desc: "又一个被恶疾诅咒的灵魂。"
 POD_epidemic.1301.t: "[SCOPE.Custom('EventTitleDisease')]：忧郁之赠"
 POD_epidemic.1301.desc: "Gift of Melancholia inflicts a virulent wasting illness on mortals and Cainites alike. Both are afflicted with a disease that causes dizziness, weakness, malaise, and nausea. The disease is highly contagious among mortals, who can spread it to each other by mere proximity. A vampire must either be directly targeted with the power or feed on an infected mortal in order to contract it. An infected vampire, however, will spread the plague to everyone he feeds upon until he is cured.\n\nWith the first wave of fever and vomiting, I can no longer deny it, I have been infected."
 POD_epidemic.1301.end.desc: "\n\n而现在我的皮肤上到处都是无法遮掩的病灶……"
 POD_epidemic.1301.court_physician.desc: "\n\n“确实，这些病变是感染忧郁之赠的一个确切迹象。如果不及时处理它是非常危险的。”"
 POD_epidemic.1301.a: "我能坚持过去！"
 POD_epidemic.1302.t: "[SCOPE.Custom('EventTitleDisease')]：摆脱死神"
 POD_epidemic.1302.desc: "虽然身心上的伤疤依然存在，但是似乎痛苦已经离开。我会活下去。还有时间。"
 POD_epidemic.1302.a: "荣耀归于[ROOT.Char.GetFaith.HealthGodName]！我好了！"
 POD_epidemic.1302.a.tt: "我现在对[GetTrait('gift_of_melancholia').GetName( GetNullCharacter )]免疫了"
 epidemic_flaying_plague: "剥皮瘟疫"
 disease_flaying_plague: "剥皮瘟疫。"
 health.2101.flaying_plague_outbreak.desc: "并非所有狼族的敌人都可以用尖牙利爪来对付。1229年冬天，立陶宛的狼人患上了高烧。起初，这似乎是一种奇怪的痨病后遗症，接着出现了疖子，接着皮肤从骨头上脱落，令人痛苦不堪。该地区的狼族全部死亡，疾病开始向西蔓延。数以百计的狼族和狼嫡死于此病，眉月狼似乎几乎无法控制它。\n\n现在，它来到了你的领地，要求得到它应得的牺牲。"
 health.2101.flaying_plague_spreads.desc: "我们必须找到根源！"
 POD_epidemic.1401.t: "[SCOPE.Custom('EventTitleDisease')]：魔鬼之触"
 POD_epidemic.1401.desc: "并非所有狼族的敌人都可以用尖牙利爪来对付。1229年冬天，立陶宛的狼人患上了高烧。起初，这似乎是一种奇怪的痨病后遗症，接着出现了疖子，接着皮肤从骨头上脱落，令人痛苦不堪。该地区的狼族全部死亡，疾病开始向西蔓延。数以百计的狼族和狼嫡死于此病，眉月狼似乎几乎无法控制它。\n\n剥皮瘟疫不再只是一个可怕的传言。我用手指轻轻按压腋下的肿块。一股黑暗而致命的力量正在玷污我的肉体，吞噬着我的呼吸。"
 POD_epidemic.1401.court_physician.desc: "\n\n“[ROOT.Char.GetLadyLord]，我会尽我所能，但是请做好最坏的打算……”"
 POD_epidemic.1401.a: "哦，[ROOT.Char.GetFaith.HealthGodName]！请把我从这个梦魇中拯救出去！"
 POD_epidemic.1402.t: "[SCOPE.Custom('EventTitleDisease')]：排除万难"
 POD_epidemic.1402.desc: "似乎[ROOT.Char.GetFaith.DeathDeityName]穿过了我的房门，在我的床边徘徊了会，但是最终还是决定让我活着。我永远不会忘记被[ROOT.Char.GetFaith.DeathDeityHerHis|U]触碰的痛苦，然而[ROOT.Char.GetFaith.DeathDeitySheHe|U]使我睁开眼，看到了生命的奇迹。\n\n瘟疫夺取了许多人的生命，但我不会是他们中的一员。"
 POD_epidemic.1402.a: "为这奇迹赞美[ROOT.Char.GetFaith.HealthGodName]！"
 POD_epidemic.1402.a.tt: "我现在对[GetTrait('flaying_plague').GetName( GetNullCharacter )]免疫了"
 epidemic_scourge: "灾疫"
 disease_scourge: "灾疫。"
 health.2101.scourge_outbreak.desc: "灾疫是一种感染血液的吸血鬼特有瘟疫。这种疾病是麻风病与鼠疫杂交的变异品种，直接攻击吸血鬼的精血。一旦感染，受害者每次消耗精血时都必须消耗更多的血液。受害者每遭受灾疫折磨一晚，情况就会变得更糟。在某些情况下，受害者还会患上影响外观但不会危及生命的毁容性疾病。\n\n虽然灾疫可以根据具体情况治愈，但这疾病本身却无法消灭。在极少数情况下，患病的吸血鬼会成为疾病的携带者，并对疾病的作用免疫。携带者会把这种疾病传染给其他吸血鬼。\n\n你的领地最近发现了一个病例，让所有人都陷入了（比平常更严重的）妄想癫狂之中。"
 health.2101.scourge_spreads.desc: "是时候重新考虑我的食谱了……"
 POD_epidemic.1501.t: "[SCOPE.Custom('EventTitleDisease')]：感染！"
 POD_epidemic.1501.desc: "灾疫不放过任何人……至少没放过你。这真是一种奇怪的感觉，疾病本已经成为你对凡生时代的模糊记忆，现在它又回来纠缠你了。\n\n你感觉很虚弱，你的血液难以化出它曾经拥有的力量，你可以从你的随从的眼中看到没法与你隔离的恐惧……以及看你因此而虚弱的时候思考反水的贪婪光芒。\n\n这将是一段多灾多难的时期。"
 POD_epidemic.1501.a: "我只是需要躺下休息一下……"
 POD_epidemic.1502.t: "[SCOPE.Custom('EventTitleDisease')]：排除万难"
 POD_epidemic.1502.desc: "似乎[ROOT.Char.GetFaith.DeathDeityName]穿过了我的房门，在我的床边徘徊了会，但是最终还是决定让我活着。我永远不会忘记被[ROOT.Char.GetFaith.DeathDeityHerHis|U]触碰的痛苦，然而[ROOT.Char.GetFaith.DeathDeitySheHe|U]使我睁开眼，看到了生命的奇迹。\n\n灾疫夺取了许多人的生命，但我不会是他们中的一员。"
 POD_epidemic.1502.a: "为这奇迹赞美[ROOT.Char.GetFaith.HealthGodName]！"
 POD_epidemic.1502.a.tt: "我现在对[GetTrait('scourge').GetName( GetNullCharacter )]免疫了"