l_simp_chinese:
 bond_famulus_perk_name:0 "伙伴动物"
 sense_the_beast_perk_name:0 "感知心兽"
 feral_whispers_perk_name:0 "野性低语"
 animal_succulence_perk_name:0 "鲜美野味"
 quell_the_beast_perk_name:0 "平息心兽"
 call_of_the_wild_perk_name:0 "荒野呼唤"
 subsume_the_spirit_perk_name:0 "占据兽灵"
 unliving_hive_perk_name:0 "尸身化巢"
 tongue_of_beasts_perk_name:0 "兽之舌"
 drawing_out_the_beast_perk_name:0 "放逐心兽"
 animal_dominion_perk_name:0 "动物支配"
 send_the_eighth_plague_perk_name:0 "第八灾降临"
 crimson_fury_perk_name:0 "绯红怒火"
 eyes_of_the_forest_perk_name:0 "森林之眼"
 plague_of_beasts_perk_name:0 "兽疫"
 animalismadvanced_perk_name:0 "高阶兽性术"
 bond_famulus_perk_effect:0 "使你能[bind_famulus|E]的[character_interaction|E]，与一只动物血缚并与其形成精神链接。"
 bond_famulus_perk_flavor:0 "#flavor 只有死亡才能释放受缚的动物伙伴。只要它定期接受吸血鬼的血液，动物伙伴就不会衰老。#!"
 sense_the_beast_perk_flavor:0 "#flavor 吸血鬼可以感觉到存在于凡人、吸血鬼和其他超自然内的[beast|E]，获得对他们的本性、饥渴和敌意的察觉。#!"
 feral_whispers_perk_flavor:0 "#flavor 吸血鬼可以与野外和城市中的野兽交流。野性的私语允许他们与动物进行双向交流。一只猫可能对辩论教堂经文的优劣不感兴趣，但却很乐意讨论当地大教堂四周缺乏猎物的问题。#!"
 animal_succulence_perk_effect:0 "吸血鬼可以通过捕食动物来消除额外的饥渴。通过[character_interaction|E]，你可以比其他吸血鬼更好的汲取动物。"
 animal_succulence_perk_flavor:0 "#flavor 吸血鬼普遍认为动物的血缺乏营养。它的味道令人厌恶，而且很难滋养他们那不死的血管。然而，一些年长的兽性术修行者已经对野兽的血液有了足够的亲和力，他们可以有效地从野外维持自己的生命。#!"
 quell_the_beast_perk_flavor:0 "#flavor 通过与目标对视，吸血鬼会让他们内心的[beast|E]进入暂时地沉睡状态。受影响的凡人因此变得麻木不仁，无法采取任何行动，只想活下去，而吸血鬼的兽性冲动则暂时减弱，无论好坏。#!"
 call_of_the_wild_perk_effect:0 "解锁招募[GetMaA('POD_controlled_animals').GetName]作为[men_at_arms|E]的能力。你最多只能拥有一军团，且它们开始时很弱小，规模取决于你拥有的任何革新。"
 call_of_the_wild_perk_flavor:0 "#flavor 通过这能力，[beast|E]给吸血鬼的声音灌输了一种对特定动物的深刻亲和力。她嚎叫、嘶吼、鸣叫，或以其他方式模仿该动物的声音。所有听到的所选动物物种受到去到吸血鬼身边的呼唤，取决于吸血鬼的基础能力来决定有多少会来。#!"
 subsume_the_spirit_perk_flavor:0 "#flavor 吸血鬼可以将自己的思想完全转移到动物的身体中。他们可以控制动物并自由使用其感官，甚至在白天也能设法保持清醒。#!"
 unliving_hive_perk_flavor:0 "#flavor 这种令人不安的能力最常见于诺斯费拉图，它允许使用者将他们的动物效应扩展到成群的昆虫，如苍蝇或蟑螂。#!"
 drawing_out_the_beast_perk_effect:0 ""
 drawing_out_the_beast_perk_flavor:0 "#flavor 吸血鬼可以在惊骇或暴走的时刻投射他们的[beast|E]，将其转移到附近的对象身上，无论是凡人还是吸血鬼。这个人将立即体验到血狂的感觉，根据触发的情况进行无情的横冲直撞或惊恐地逃窜。#!"
 animal_dominion_perk_flavor:0 "#flavor 吸血鬼对野兽拥有的力量现在已经大到足以指挥成群结队的动物，就好像它们是自己身体的延伸。只要一个手势，成千上百的动物们就会舍弃自己的生命来讨好它们的主人。#!"
 tongue_of_beasts_perk_flavor:0 "#flavor 这能力加强了荒野低语天赋。吸血鬼不再能与单一的动物说话，而是可以与任何和所有的动物说话，且不需要建立目光接触。#!"
 send_the_eighth_plague_perk_effect:0 "作为[character_interaction|E]，允许你释放[GetModifier('weather_magic_plague_modifier').GetNameWithTooltip]到敌人的国度。"
 send_the_eighth_plague_perk_flavor:0 "#flavor 这是所有[disciplines|E]中最具破坏性的力量之一。第四次十字军东征后不久，一位名叫瓦伦提尼安的古代冈格罗展示了其巨大的破坏潜力。他对闯入他土地的意大利该隐之子感到愤怒，于是调用了他掌握的兽性术，使整个贸易镇陷入了饥荒之中。#!"
 crimson_fury_perk_effect:0 "使得试图吞噬你灵魂的吸榨者更有可能承受不从之魂事件。"
 crimson_fury_perk_flavor:0 "#flavor 这能力是许多谣言和猜测的话题，因为它的效果非常不明显。在达到这种掌握程度后，吸血鬼可以选择让他的[beast|E]在他的血管中自由游荡。他的血会使品尝它的凡人和吸血鬼感到血狂。如果一位吸榨者成功地吞噬了该吸血鬼的灵魂，她很可能会遇到一个可怕的结局，因为吸血鬼的心兽会从内部把她吃掉。#!"
 eyes_of_the_forest_perk_flavor:0 "#flavor 这令人敬畏的力量是许多关于幽暗的森林和禁忌的山脉的民间故事的根源。该地区的动物甚至昆虫都是吸血鬼的眼睛和耳朵，为她提供了对其领域内夜间活动的深入了解。#!"
 plague_of_beasts_perk_flavor:0 "#flavor 一个精通兽性术的玛土撒拉带来圣经中的瘟疫。在 野性的呼唤的基础上扩展，吸血鬼召唤动物到她们身边。然而，召唤的过程并不是通过某种动物的舌头，而是由[beast|E]在数英里或数公里范围内呼叫。这将召唤每一种动物涌向该隐之子周围，导致彻底的悖廊。#!"