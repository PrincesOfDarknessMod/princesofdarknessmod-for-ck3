l_simp_chinese:
 changing_moon_decision:0 "换月仪式"
 changing_moon_decision_tooltip:1 "你将永久转换到你的下一个月兆。"
 changing_moon_decision_desc:0 "这场仪式标志着一名古拉赫勒进入她一生月兆的下一个阶段。仪式首先以仪式性净化开始，包括为期一天的禁食和仪式沐浴。在净化结束后，她需要点燃一件象征她过去月兆的物品（比如，代表阿卡斯的儿童玩具，或是代表乌兹马提的木矛）。接下来，她会穿上适合她新月兆的衣服和面部彩绘。最后，她在仪式的其他参与者面前正式宣布她的名字和（新）月兆。其他参与者再使用她的名字和新月兆头衔向她致意。在仪式正式部分后通常紧跟着庆祝活动。"
 changing_moon_decision_confirm:0 "换月"
 hengeyokai_advance_rank_decision:0 "Advance Your Beast Court Rank"
 hengeyokai_advance_rank_decision_desc:0 "Regardless of Auspice, all of the members of the Beast Courts earn three types of Renown — Glory, Virtue and Wisdom. Every member of the hengeyokai understands that all three types of Renown are facets of a greater whole.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, killing them (only shapeshifters count) doing a spirit quest. Building caerns also work."
 hengeyokai_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 hengeyokai_advance_rank_decision_confirm:0 "My fame grows!"
 ajaba_advance_rank_decision:0 "Advance Your Ajaba Rank"
 ajaba_advance_rank_decision_desc:0 "Like their Bastet cousins, the Ajaba value Ferocity and Cunning; unlike the cats, the social werehyenas also hold Obligation sacred. To advance in Ferocity, an Ajaba must be both fearless and vicious; to advance in Obligation, the werehyena must put the good of his people before his own; and to advance in Cunning, he must be clever and resourceful. Advancement in rank is handled by social challenges and rites similar to those of the Garou.\n\nYou can gain rank experience by winning non practice duels, besieging a capital province or granting title to a fellow ajaba. Building a Den-Realm also work."
 ajaba_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ajaba_advance_rank_decision_confirm:0 "My fame grows!"
 bastet_advance_rank_decision:0 "Advance Your Bastet Rank"
 bastet_advance_rank_decision_desc:0 "Werecat Renown is based on individual respect first and foremost; the werecats are more concerned with their personal views of another Bastet than they are with what the Breed as a whole thinks of him. Bastet use Renown in the categories of Cunning, Ferocity, and Honor.\n\nYou can gain rank experience by winning non practice duels, besieging a capital province, winning wars against servants of the Wyrm (or of Gaia if you are following the Wyrm) as a defender. Building caerns also work."
 bastet_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 bastet_advance_rank_decision_confirm:0 "My fame grows!"
 corax_advance_rank_decision:0 "Advance Your Corax Rank"
 corax_advance_rank_decision_desc:0 "Corax follow Glory, Honor and Wisdom as do the Garou, though they value Wisdom most of all.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, or killing them (only shapeshifters count). doing a spirit quest. Building caerns also work."
 corax_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 corax_advance_rank_decision_confirm:0 "My fame grows!"
 gurahl_advance_rank_decision:0 "Advance Your Gurahl Rank"
 gurahl_advance_rank_decision_desc:0 "Werebears value Honor, Succor, and Wisdom.\n\nYou can gain rank experience by succeeding hostile schemes on servants of the Wyrm (or of Gaia if you are following the Wyrm), winning wars against them as a defender, doing a spirit quest, acts of healing or building caerns."
 gurahl_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 gurahl_advance_rank_decision_confirm:0 "My fame grows!"
 kitsune_advance_rank_decision:0 "Grow a new Tail"
 kitsune_advance_rank_decision_desc:0 "The three categories of werefox Renown are Chie, Toru, and Kagayaki, roughly corresponding to Cunning, Honor, and Glory. The Kitsune put little stock in Renown; it mostly seems useful when dealing with the other Breeds — although, the Kitsune reason, if the other Changers have been keeping track of the stuff for millennia, there must be something to it.\n\nYou can gain rank experience by besieging a capital province, winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), or killing them (only shapeshifters count). Building caerns also work."
 kitsune_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 kitsune_advance_rank_decision_confirm:0 "My fame grows!"
 mokole_advance_rank_decision:0 "Advance Your Mokolé Rank"
 mokole_advance_rank_decision_desc:0 "Mokolé gain Renown and advance in rank in largely the same manner and categories as Garou.\n\nYou can gain rank experience by winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), succeeding schemes against them, or killing them (only shapeshifters count). doing a spirit quest. Building caerns also work."
 mokole_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 mokole_advance_rank_decision_confirm:0 "My fame grows!"
 nuwisha_advance_rank_decision:0 "Advance Your Nuwisha Rank"
 nuwisha_advance_rank_decision_desc:0 "Nuwisha value Humor, Glory, and Cunning. They’re not very status-conscious, as Changing Breeds go, but do appreciate having a system in place for measuring bragging rights.\n\nYou can gain rank experience by besieging a capital province, winning a board game, winning wars against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm) as attacker, or killing them (only shapeshifters count)."
 nuwisha_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 nuwisha_advance_rank_decision_confirm:0 "My fame grows!"
 nagah_advance_rank_decision:0 "Advance Your Nagah Rank"
 nagah_advance_rank_decision_desc:0 "The Nagah don’t follow a set of Renown categories. The Sesha decide when a Nagah advances in rank.\n\nNagah advance by reporting to the Sesha, the highest governing body of their kind. This takes place in Nandana (the Sesha’s Ananta). Afterwards, the petitioner may rest for one week while their case is judged. The members of a nest usually report together."
 nagah_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 nagah_advance_rank_decision_confirm:0 "My fame grows!"
 ratkin_advance_rank_decision:0 "Advance Your Ratkin Rank"
 ratkin_advance_rank_decision_desc:0 "Ratkin put stock in Infamy, Obligation, and Cunning.\n\nYou can gain rank experience by besieging a capital province, purchasing a truce, ranking up in the landed tiers or granting title to a fellow ratkin."
 ratkin_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ratkin_advance_rank_decision_confirm:0 "My fame grows!"
 rokea_advance_rank_decision:0 "Advance Your Rokea Rank"
 rokea_advance_rank_decision_desc:0 "Rokea acknowledge Valor, Harmony, and Innovation.\n\nYou can gain rank experience by completing a hunt, learning a gift, teaching a gift, or gaining a coastal county from a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm)."
 rokea_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 rokea_advance_rank_decision_confirm:0 "My fame grows!"
 ananasi_advance_rank_decision:0 "Advance Your Ananasi Rank"
 ananasi_advance_rank_decision_desc:0 "Ananasi are judged by Queen Ananasa, not each other. They advance in rank as they adhere to the ways of the Triat: Cunning for the Wyrm, Obedience for the Weaver, and Wisdom for the Wyld.\n\nYou can gain rank experience by succeeding schemes against a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm), executing a known [criminal|E], besieging a capital province or doing a spirit quest."
 ananasi_advance_rank_decision_tooltip:0 "Progressing the tribal ladder takes time and commitment."
 ananasi_advance_rank_decision_confirm:0 "My fame grows!"