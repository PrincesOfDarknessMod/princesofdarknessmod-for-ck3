 setting_banu_haqim_never_darken:0 "从不变黑"
 setting_banu_haqim_never_darken_desc:0 "哈基姆圣裔从不会因为年龄而变得黑曜石一般。"
 rule_world_of_darkness:0 "黑暗世界"
 setting_world_of_monsters:0 "黑暗世界"
 setting_world_of_monsters_desc:0 "大多数有地的角色都是超自然生物，又或是追杀他们的存在。"
 setting_world_of_minions_and_monsters:0 "暗影世界"
 setting_world_of_minions_and_monsters_desc:0 "大多数有地的角色都是超自然生物，又或是服侍或追杀他们的存在。"
 setting_world_of_minions:0 "腐化世界"
