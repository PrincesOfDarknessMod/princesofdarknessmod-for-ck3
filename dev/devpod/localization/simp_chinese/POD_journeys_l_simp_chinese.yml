 seek_knowledge_demonology_name:0 "学习#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!"
 seek_knowledge_demonology_desc:0 "#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonology#!#!, in and of itself, is merely the academic study of #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Demons#!#!. Of course, most Demonologists are not content with simple theory, and go the much more drastic route of selling their soul — a pathway to many abilities some might consider unnatural."
 seek_knowledge_demonology_effects:0 "你将获知一位懂得#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的导师的位置。前往那里后，你可以获得[GetTrait('demonology').GetName(GetPlayer)][trait|E]，从而有可能成为一名[GetTrait('infernalist').GetName(GetNullCharacter)]——无论是通过将[GetTrait('demon').GetName(GetNullCharacter)]束缚在你的意志之下的艰难途径，还是自愿成为他们奴隶这一简单得多的途径……"
