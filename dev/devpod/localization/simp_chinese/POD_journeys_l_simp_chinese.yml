 seek_knowledge_koldunic_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_koldunic_travel_desc: "库都术法从概念上来说类似于奇术，但实际应用却天差地别。主要区别在于库都术法依靠自然之灵的服务，而非背诵仪式和典礼；低级的库都术法往往比奇术更加隐秘；此外，库都术法更注重对所操控之物的掌握，而非单纯意志的延展。"
 seek_knowledge_koldunic_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_name: "学习[GetTrait('obtenebration').GetName(GetNullCharacter)]（深渊秘术）"
 seek_knowledge_abyssal_mysticism_desc: "深渊秘术师沉浸在对一种超越并究极相反与所有光和生命的力量的永恒研究中，对人性或凡人的道德准则几乎毫无兴趣。\n勒森魃氏族的秘术师深入黑暗的角落，寻找秘密、答案，或者更多的问题。对于这些执着的灵魂来说，传统的幽暗术只是一个起点。通过将血术法的原理应用于幽暗术，勒森魃氏族的秘术师在黑暗时代发展出仪式，解锁隐藏的暗影力量，并召唤深渊中无名的原始恐怖，从而将幽暗术有效地扩展为一种血术法的形式。"
 seek_knowledge_abyssal_mysticism_effects: "你将获知一位懂得深渊秘术的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。"
