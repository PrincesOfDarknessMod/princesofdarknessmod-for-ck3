 seek_knowledge_theurgy_name:0 "学习灵迹（#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L 神通术#!#!）"
 seek_knowledge_theurgy_desc:0 "#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L 神通术#!#!是一种最初由犹太神秘主义者使用的魔法，最近被基督教学者重新发现。它被分为多种道途，如[GetPerk('via_medicamenti_perk').GetName(GetPlayer)]、[GetPerk('via_oraculi_perk').GetName(GetPlayer)]或[GetPerk('via_necromantiae_perk').GetName(GetPlayer)]。"
 seek_knowledge_theurgy_effects:0 "你将获知一位懂得#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L 神通术#!#!的导师的位置。前往那里后，你可以获得[GetTrait('theurgist').GetName(GetPlayer)][trait|E]，从而解锁#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#![lifestyle|E]中的神通术[perks|E]。"
 seek_knowledge_theurgy_tt:0 "我将体现高我。"
 seek_knowledge_theurgy_planning_title:0 "探寻神通术之旅"
 seek_knowledge_theurgy_planning_desc:0 "在翻阅了深奥的典籍和阅读了各种关于#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L 神通术#!#!的论文之后，我现在对其理论有了一定的掌握。\n\n不过，实践方面又是另一回事。要想真正成为一名[GetTrait('theurgist').GetName(GetPlayer)]，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_theurgy_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_theurgy_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_theurgy_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_theurgy_travel_desc:0 "我很高兴能有机会学习#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L 神通术#!#!。我的神力将无人能挡。只要足够专注，天堂的秘密就会闪现在我的眼前。"
 seek_knowledge_theurgy_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_psychic_name:0 "学习灵迹（#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L 灵能#!#!）"
 seek_knowledge_psychic_desc:0 "某些凡人能够表现出#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L 灵能#!#!。其能力种类繁多，如[GetPerk('astral_projection_perk').GetName(GetPlayer)]、[GetPerk('psychometry_perk').GetName(GetPlayer)]、[GetPerk('animal_psi_perk').GetName(GetPlayer)]等等。灵能据说是与生俱来的，但也许有办法迫使一个人敞开心智……"
 seek_knowledge_psychic_effects:0 "你将获知一位懂得#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L 灵能#!#!的导师的位置。前往那里后，你可以获得[GetTrait('psychic').GetName(GetPlayer)][trait|E]，从而解锁#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L 灵能#!#![lifestyle|E]中的[perks|E]。"
 seek_knowledge_psychic_tt:0 "我将唤醒心智之力。"
 seek_knowledge_psychic_planning_title:0 "探寻灵能之旅"
 seek_knowledge_psychic_planning_desc:0 "在翻阅了深奥的典籍和阅读了各种关于#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L 灵能#!#!的论文之后，我现在对其理论有了一定的掌握。\n\n遗憾的是，理论和修习都无法真正开启我的心智潜能。必须由知晓它的人来打开它。必要的话，还得强行用力打开。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_psychic_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_psychic_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_psychic_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_psychic_travel_desc:0 "我很高兴能有机会学习#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L 灵能#!#!。一旦我的思维摆脱了目前的束缚，它将会能做到什么？"
 seek_knowledge_psychic_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_demonology_name:0 "学习#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!"
 seek_knowledge_demonology_desc:0 "#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!本身只是对#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 恶魔#!#!的学术研究。当然，大多数恶魔学家并不满足于简单的理论，他们会采取更为激烈的方式——出卖灵魂——来获得许多可能被某些人视为非自然的能力。"
 seek_knowledge_demonology_effects:0 "你将获知一位懂得#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的导师的位置。前往那里后，你可以获得[GetTrait('demonology').GetName(GetPlayer)][trait|E]，从而有可能成为一名[GetTrait('infernalist').GetName(GetNullCharacter)]——无论是通过将[GetTrait('demon').GetName(GetNullCharacter)]束缚在你的意志之下的艰难途径，还是自愿成为他们奴隶这一简单得多的途径……"
 seek_knowledge_demonology_isvalid:0 "$EFFECT_LIST_BULLET$你的[faith|E]必须不视#TOOLTIP:GAME_TRAIT,infernalist,[GetNullCharacter] #L 崇魔#!#!为[crime|E]。\n$EFFECT_LIST_BULLET$你必须在有#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 恶魔#!#!作为可玩[splats|E]的剧本中。"
 seek_knowledge_demonology_requirement_date:0 "你在[GetTrait('vampire').GetName(GetNullCharacter)]专属剧本，在这里#TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L 恶魔#!#!（以及其他[splats|E]）皆不可见。"
 seek_knowledge_demonology_tt:0 "为了真正的力量，我愿意付出任何代价。"
 seek_knowledge_demonology_planning_title:0 "探寻恶魔学之旅"
 seek_knowledge_demonology_planning_desc:0 "在翻阅了深奥的典籍和阅读了各种关于#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的论文之后，我现在对其理论有了一定的掌握。\n\n不过，实践方面又是另一回事。要想真正成为一名#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学家#!#!，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_demonology_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_demonology_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_demonology_travel_title:0 "追求禁忌知识之旅"
 seek_knowledge_demonology_travel_desc:0 "我不能否认学习#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的想法让我有些惶恐，但我已经下定决心。我会被蔑视，被鄙视，甚至被追杀。全世界都会忌讳我。但最终……我会笑到最后"
 seek_knowledge_demonology_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 find_artifact_name:0 "寻宝"
 find_artifact_desc:0 "选择一件[artifact|E]来搜寻。"
 find_artifact_tt:0 "这个宝物应该属于我。"
 assemble_artifact_name:0 "组装宝物"
 assemble_artifact_desc:0 "选择一件[artifact|E]来搜寻。"
 assemble_artifact_tt:0 "知识有价。"
 assemble_artifact_planning_title:0 "另一块拼图"
 assemble_artifact_planning_desc:0 "终于，我的斥候带着好消息回来了。他们找到了《挪得之书》另一章的下落，取回它将使我离恢复这本书更近一步\n\n我只能希望目前持有它的人能够……被说服放弃它"
