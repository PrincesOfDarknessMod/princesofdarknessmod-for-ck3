 seek_knowledge_demonology_planning_title:0 "探寻恶魔学之旅"
 seek_knowledge_demonology_planning_desc:0 "After poring over forbidden tomes and reading blasphemous treatises on #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonology#!#!, I now have a decent grasp on its theory.\n\nHowever, practice is a different matter. I will need a teacher before I can call myself a #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonologist#!#! in earnest.\n\nMy scouts have told me where such a person can be found."
