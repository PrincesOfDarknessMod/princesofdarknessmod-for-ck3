 hunt_in_capital_planning_confirm_gui_tt: "$EFFECT_LIST_BULLET$一旦[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetSheHe]落入你的掌中，你将能决定如何处理[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip]。\n$EFFECT_LIST_BULLET$[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip]将在之后加入你的宫廷。\n$EFFECT_LIST_BULLET$你将不会再见到其他几位凡人。"
