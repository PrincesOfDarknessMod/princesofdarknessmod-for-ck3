 siochain_1_name: "传奇般的平衡：灰暗世界"
 siochain_1_desc: "无论是通过刻意的研究还是临近死亡的恐惧，你已经有了一个领悟。完美平衡你凡人和妖精的状态是可行的。然而，要达到这一点意味着需要对梦华和板讷有全面的理解。这无疑是一场艰难的战斗。"
 siochain_1_effects: "你将专注于思考何为板讷，并离完美更进一步。"
 siochain_1_tt: "答案就在秋暮世界中。"
 siochain_1_planning_title: "追寻平衡"
 siochain_1_planning_desc: "我沉浸在凡人的世界中，被他们压抑的规则和僵化的仪式所束缚。\n\n即使板讷试图扼住我命运的咽喉，我也将其视为人生中的一次教训。而最近，这样的教训已不胜枚举。\n\n但这样就足够了吗？"
 siochain_1_planning_confirm: "是时候思考我所学到的东西了。"
 siochain_1_planning_decline: "时候未到。"
 siochain_2_name: "传奇般的平衡：绚烂世界"
 siochain_2_desc: "我沉浸于板讷之中并安然无恙地走出来，但那只是第一步。接下来，我需要与我的妖精那一面自我取得联系。"
 siochain_2_effects: "你将专注于思考何为梦华，并向完美更进一步。"
 siochain_2_tt: "只有梦界可以给予我答复。"
 siochain_2_planning_title: "追寻平衡"
 siochain_2_planning_desc: "我在梦华的风暴中冥想，任由梦界的原始力量将我淹没，直到自我完全消失，没有内外之别，再无界限之分。\n\n这种混沌能凝结为真正的领悟吗？"
 siochain_2_planning_confirm: "是时候思考我所学到的东西了。"
 siochain_2_planning_decline: "时候未到。"
 siochain_3_name: "传奇般的平衡：交错汇流的世界"
 siochain_3_desc: "似乎没有办法调和我对梦华和板讷的理解。它们是对立的。这显而易见。这只是常识而已。但是，常识什么时候阻挡过一个换生灵呢？"
 siochain_3_effects: "你将尝试将板讷与梦华在自己体内融合的冒险之举。"
 siochain_3_tt: "在矛盾中寻找平衡。"
 siochain_3_planning_title: "达到平衡"
 siochain_3_planning_desc: "板讷与梦华就像油与水，没有人能成功将它们混合。\n\n至少迄今为止还没有。\n\n我已经准备了足够久，我已将这门技艺练习到极致。现在，我需要将全心全灵投入其中。"
 siochain_3_planning_confirm: "现在马上立刻！"
 siochain_3_planning_decline: "这听起来太让我紧张了，还是改天再做吧。"
 seek_knowledge_thaumaturgy_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]（奇术）"
 seek_knowledge_thaumaturgy_desc: "[GetTrait('bloodsorcery').GetName(GetNullCharacter)]是一门神秘的[Glossary('血律','game_concept_discipline_desc')]，主要与[GetTrait('tremere').GetName(GetNullCharacter)]相关，但有数个不同的[Glossary('氏族','game_concept_Clan_desc')]修习。它允许修习者使用其血来进行各种各样的魔法仪式：专注心智，增强军队，诅咒敌人……以及更多。 \n奇术师通常令人生畏，并且他们会利用这一点为自己谋利。敌人很难准确估计在与他们正面冲突时会遇到什么。对魔法一无所知的人往往不了解奇术师所拥有的力量，甚至只是想象便足以让他们陷入恐慌。"
 seek_knowledge_thaumaturgy_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。\n\n#warning 学习奇术意味着你永远无法掌握西尔。#!"
 seek_knowledge_thaumaturgy_tt: "我将揭开精血最深层的秘密。"
 seek_knowledge_thaumaturgy_planning_title: "探寻奇术之旅"
 seek_knowledge_thaumaturgy_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_thaumaturgy_travel_desc: "我很高兴能有机会学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]。它的秘密被严密守护是有原因的。一旦我解开了这些秘密，我将拥有难以想象的能力。\n据说，真正的奇术师足够自律，能为各种危险的可能性做好准备，并使用那些乍看之下似乎并不强大的仪式。一个优秀的奇术师总是为各种情况做好准备，并能在紧急情况下释放她聚集的力量。那些惯于厮杀的奇术师往往将这种准备比作确保他们有额外的弹药，以防战局不利。"
 seek_knowledge_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_dur_an_ki_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]（杜–安–奇）"
 seek_knowledge_dur_an_ki_desc: "阿刹迈术法起源于第二城，当时凡人魔法师被初拥，承诺给予他们力量和永生。这些不死的术士在与巴力教徒的战争中充当拷问者和猎魔人。在第二城陷落后，这些术士被用来进行远距离的魔法通信，保持氏族的统一和组织性。此外，他们利用自己的技艺保护氏族的牧群，并如同种植一般培育维持这些牧群，并持续打击威胁氏族的力量。\n随后，这些术士将他们的天赋转向杜–安–奇的技艺来帮助他们实现目标。杜–安–奇源于古代美索不达米亚，在苏美尔语中代表着天地的主宰。并且在上千年的发展中融合了中东地区的众多神话与宗教元素。根本上，杜–安–奇允许术士（被称为阿西普）与灵体之间达成契约，从而增强他们的力量和影响力。"
 seek_knowledge_dur_an_ki_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。"
 seek_knowledge_dur_an_ki_tt: "我将揭开精血最深层的秘密。"
 seek_knowledge_dur_an_ki_planning_title: "探寻杜–安–奇之旅"
 seek_knowledge_dur_an_ki_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_dur_an_ki_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_dur_an_ki_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_dur_an_ki_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_dur_an_ki_travel_desc: "相比于奇术的守序性和精密性，阿刹迈术法则显得更加灵活。它从众多文化源头汲取灵感与形式，经过数个世纪的实验发展而成：包括印度教、英雄史诗、风水、伊斯兰炼金术与天文学、美索不达米亚的魔法与术法、以及波斯的密特拉仪式，不胜枚举。\n每位术士在施展每个仪式时，都会经历一系列的关键步骤。然而，这些步骤的完成顺序和方式因施法者不同而异，这取决于他们所汲取的文化源头及其如何体现这些魔法实践的特点。"
 seek_knowledge_dur_an_ki_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_akhu_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]（咒术）"
 seek_knowledge_akhu_desc: "赛特术法是一种奇特的魔法现象。它融合了各种魔法元素，尽管其执行形式主要是仪式性和宗教性的。话虽如此，“赛特术法”这个名称其实有些用词不当。这个术语暗示它是单一的书法，更准确的说法应该是复数的术法集合，因为它实际上是世界各地赛特信徒所使用的多种不同实践的集合。在古埃及的鼎盛时期，基督教还未因罗马帝国的统治而传入时，魔法十分普遍，凡人和吸血鬼都践行着魔法。古埃及人有多个词汇用于描述魔法；赛特之子使用赫卡 （字面意思为“魔法”）指代凡人魔法，而用阿库（意为“咒语”）称呼他们的血术法。时至今日，咒术仍然是最广为人知的“赛特术法”变体之一。"
 seek_knowledge_akhu_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。"
 seek_knowledge_akhu_tt: "我将揭开精血最深层的秘密。"
 seek_knowledge_akhu_planning_title: "探寻咒术之旅"
 seek_knowledge_akhu_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_akhu_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_akhu_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_akhu_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_akhu_travel_desc: "咒术是赛特之子术法中最广泛流行的流派，它与古埃及宗教相似。对古埃及人而言，赛特不仅是其他事物的主宰，还是风暴之神。因此，咒术的修行者会竖起仪式避雷针，以此吸引赛特的雷电，为她后续的仪式提供力量。然而，为了获得赛特的青睐，她必须向这位黑暗之神献上令其满意的供品。在咒术修行者（被称为诵经祭司）中，公认的方式是遵循赛特在《离世夜之书》中亲自指定的指引。"
 seek_knowledge_akhu_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sadhana_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)] (修持)"
 seek_knowledge_sadhana_desc: "抵达印度后，赛特信徒发现了印度教中的一些元素，可以加以利用来将吸血鬼转化为他们的信徒。修持的修行者主要来自赛特之子血系的分支——称为底提耶的赛特之子血系成员。这些赛特之子崇拜湿婆神，认为他源自风暴之神楼陀罗，并将其视为赛特的面相。印度的赛特之子认为自己是受肉的恶魔，并以推翻众神、夺取他们的力量为己任。"
 seek_knowledge_sadhana_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。"
