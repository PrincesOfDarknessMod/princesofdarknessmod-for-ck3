 seek_knowledge_daimonion_desc: "[GetTrait('daimonion').GetName(GetNullCharacter)]是一门地狱[Glossary('血律','game_concept_discipline_desc')]，由[GetTrait('baali').GetName(GetNullCharacter)]血系所修习。修习者将获得[GetPerk('psychomachia_perk').GetName(GetPlayer)]，以及通过罪恶和美德操纵他人的能力。但这值得付出灵魂做为代价吗？"
 seek_knowledge_daimonion_effects: "你将获知一位懂得[GetTrait('daimonion').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[Glossary('血律','game_concept_discipline_desc')][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('daimonion').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_daimonion_tt: "只要目的正当，可以不择手段"
 seek_knowledge_daimonion_planning_title: "探寻崇魔术之旅"
 seek_knowledge_daimonion_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('daimonion').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
