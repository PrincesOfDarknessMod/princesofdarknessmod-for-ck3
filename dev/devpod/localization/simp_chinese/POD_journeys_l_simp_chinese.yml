 golconda_2_trigger: "你需要解散所有通过邪恶行径#weak （[GetMaA('szlachta').GetName]或[GetMaA('vozhd').GetName]）创建的[men_at_arms|E]#!"
 seek_knowledge_kai_name: "学习稀有血律（[GetTrait('kai').GetName(GetNullCharacter)])"
 seek_knowledge_kai_desc: "[GetTrait('kai').GetName(GetNullCharacter)]是[GetTrait('bushi').GetName(GetNullCharacter)]修习的[Glossary('血律','game_concept_discipline_desc')]，这些日本本土的吸血鬼通过纯粹的信念与控制汲取力量。凭借无畏的精神和对自我的坚守，他们能以独特的方式驾驭血气之力。"
 seek_knowledge_kai_effects: "你将获知一位懂得[GetTrait('kai').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[Glossary('血律','game_concept_discipline_desc')][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('kai').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_kai_tt: "力量与荣耀。"
 seek_knowledge_kai_planning_title: "探寻凯术之旅"
 seek_knowledge_kai_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('kai').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_kai_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_kai_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_kai_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_kai_travel_desc: "我很期待学习[GetTrait('kai').GetName(GetNullCharacter)]。借此我将能从内心激发强大力量，并唤起他人的荣誉感。"
 seek_knowledge_kai_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_thaumaturgy_isvalid: "$disciplines_learning_thaumaturgy_tt$"
 seek_knowledge_sihr_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]（西尔）"
 seek_knowledge_sihr_desc: "这种由少数[Glossary('阿什拉派','game_concept_ashirra_desc')]术士修习的西尔，起源于九世纪穆塔沙里德（[GetTrait('nosferatu').GetName(GetNullCharacter)]）塔里克·哈吉。塔里克与[GetTrait('assamite').GetName(GetNullCharacter)]建立了联系，包括该氏族术士阶层的显赫成员哈立德·穆尼尔。他们共同开发了西尔的路径，其力量既源于施法者的信仰，也来自血气的能量。\n\n尽管奇术和其他形式的西尔在伊斯兰教中被视为亵渎（因其寻求真主之外的力量），许多西尔修习者相信其力量仅通过真主显现。施法通常依赖祈祷文作为咒语。"
 seek_knowledge_sihr_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。\n\n#warning 学习西尔后将无法修习奇术#!"
 seek_knowledge_sihr_tt: "我将揭开精血最深层的秘密。"
 seek_knowledge_sihr_planning_title: "探寻西尔之旅"
 seek_knowledge_sihr_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_sihr_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sihr_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sihr_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sihr_travel_desc: "与其他血魔法不同，西尔主要通过祈祷而非晦涩的咒语和符号施放。许多法术和仪式要求修习者进行深度祷告与专注，因此唯有真正虔诚者方能成功施展。"
 seek_knowledge_sihr_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sihr_isvalid: "$EFFECT_LIST_BULLET$仅追随[GetReligionByKey('ashirra_religion').GetName][faith|El]或[GetFaithByKey('tariqelhaqim').GetName]的吸血鬼可修习西尔"
 thaumaturgy_sihr_incompatible: "#warning 奇术与西尔不可兼得#!"
 can_learn_sihr_bloodmagic_trigger_ashirra_tooltip: "#warning 仅追随[GetReligionByKey('ashirra_religion').GetName][faith|El]或[GetFaithByKey('tariqelhaqim').GetName]的吸血鬼可修习西尔#!"
 seek_knowledge_rift_name: "学习稀有血律（[GetTrait('rift').GetName(GetNullCharacter)]）"
 seek_knowledge_rift_desc: "[GetTrait('rift').GetName(GetNullCharacter)]是[GetTrait('kizoku').GetName( GetNullCharacter )]修习的诡谲[Glossary('血律','game_concept_discipline_desc')]，使用者能开启通往自身梦魇的维度裂隙。虽常为他人招致厄运，但也可用于心灵感应或传送等无害用途。"
 seek_knowledge_rift_effects: "你将获知一位懂得[GetTrait('rift').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[Glossary('血律','game_concept_discipline_desc')][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('rift').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_rift_tt: "我愿与梦魇合一。"
 seek_knowledge_rift_planning_title: "探寻裂隙术之旅"
 seek_knowledge_rift_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('rift').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_rift_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_rift_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_rift_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_rift_travel_desc: "研习[GetTrait('rift').GetName(GetNullCharacter)]令我振奋。既然罪孽与悔恨永世纠缠我的噩梦，何不让敌人也尝尝这般滋味？"
 seek_knowledge_rift_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 study_true_name_journey_name: "学习真名"
 study_true_name_journey_desc: "[Glossary('真名','podgloss.truename')]，至少在某些存在看来，是现实的根基。知晓某物的真名即意味着对其拥有绝对掌控。然而真名始终处于流变之中，这使得探寻真名成为漫长而艰辛的历程。"
 study_true_name_journey_effects: "你将获知某种随机物质，动物或植物的[Glossary('真名','podgloss.truename')]。"
 study_true_name_journey_isvalid: ""
 study_true_name_journey_tt: "命名真我"
 study_true_name_trait_journey_name: "研习真名"
 study_true_name_trait_journey_desc: "在某些人眼中，[Glossary('真名','podgloss.truename')]乃是现实的根基；知其真名，便可掌其全权。然而真名时刻变幻莫测，因此寻获真名是一条漫长而艰辛的旅途。"
 study_true_name_trait_journey_effects: "你将获知某种随机物质，动物或植物的[Glossary('真名','podgloss.truename')]。"
 study_true_name_trait_journey_isvalid: ""
 study_true_name_trait_journey_tt: "命名真我"
