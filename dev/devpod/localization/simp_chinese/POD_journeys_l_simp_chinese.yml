 seek_knowledge_bardo_travel_desc:0 "我很高兴能有机会学习[GetTrait('bardo').GetName(GetNullCharacter)]。[the_beast|E]是无情的。给它一根手指，它就会咬断你的整条手臂。即使是暂时地解脱，也是每位[cainite|E]都渴望的。"
