 seek_knowledge_koldunic_planning_title: "探寻库都术法之旅"
 seek_knowledge_koldunic_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
