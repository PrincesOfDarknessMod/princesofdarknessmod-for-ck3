 provoke_vatican_name:0 "向梵蒂冈揭露你自己"
 provoke_vatican_desc:0 "I'm tired of always skulking about in the shadows, always cowering in fear of the mortals, always making sure our existence stays hidden. No more! I will show them that our kind is to be respected. I will show them all..."
 provoke_vatican_effects:0 "You will travel to Rome and reveal your supernatural nature during a destructive rampage, provoking a retaliation from the Inquisition.\n\n#warning This unprecedented breach of [masquerade|E] will have massive, world-changing consequences.\n\nYou will be [GetModifier('forever_infamous_modifier').GetNameWithTooltip] and [GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]. You will certainly go down in the history books. You will almost certainly go down, period.\n\nAre you willing to risk it?#!"
 provoke_vatican_isvalid:0 "$EFFECT_LIST_BULLET$你有[GetTrait('arrogant').GetName(GetPlayer)]特质\n$EFFECT_LIST_BULLET$你的[capital|E]在[GetGeographicalRegion('world_europe').GetName]\n$EFFECT_LIST_BULLET$你追随[GetReligionByKey('roadofheaven_religion').GetName]的[faiths|E]之一，如[GetFaithByKey('vianoctis').GetName]"
 provoke_vatican_tt:0 "I will go down in infamy."
 provoke_vatican_planning_title:0 "唤醒猛虎"
 provoke_vatican_planning_desc:0 "The decision was made. The preparations are done. I'm as ready as I'll ever be. Now all that's left to do is a quick trip to the Holy City.\n\nNot everyone will share my vision. In fact, I expect there will be many who'll try to dissuade me from this quest, thinking it a fool's errand. They simply don't understand the breadth of my ambition.\n\nBut soon, they will."
 provoke_vatican_planning_confirm:0 "This will be my magnum opus."
 provoke_vatican_planning_decline:0 "I'd better make sure I'm ready for this."
 provoke_vatican_travel_title:0 "Journey to the Vatican"
 provoke_vatican_travel_desc:0 "The path ahead will be dangerous, and I can't help but feel a sense of trepidation. Is this how Caesar felt when he crossed the Rubicon? Was he aware that his actions would change the fate of an entire people? Did he feel the weight of history? I can only hope that one day, when all is said and done and the dust has settled, my actions will be vindicated."
 provoke_vatican_travel_confirm:0 "Soon, the entire world will know my name."
 provoke_vatican_caelestius_name:0 "$provoke_vatican_name$"
 provoke_vatican_caelestius_desc:0 "Our kind has been cowering in the shadows for too long, and for what? The Church is branding us as sinners, yet their very concept of Sin was drawn from false premises. I know how to reveal their logical inconsistencies. I know how to right this wrong. I will... debate the Pope."
 provoke_vatican_caelestius_effects:0 "You will travel to Rome and try to introduce the Holy Father to your personal brand of Noddism, earning you his blessing... or provoking a retaliation from the Inquisition.\n\n#warning This unprecedented breach of [masquerade|E] will have massive, world-changing consequences.\n\nYou will be [GetModifier('forever_infamous_modifier').GetNameWithTooltip] and [GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]. You will certainly go down in the history books. You will almost certainly go down, period.\n\nAre you willing to risk it?#!"
 provoke_vatican_caelestius_isvalid:0 ""
 provoke_vatican_caelestius_tt:0 "Surely the Holy Father will bless me."
 provoke_vatican_caelestius_planning_title:0 "Preparing a Revelation"
 provoke_vatican_caelestius_planning_desc:0 "The decision was made. The preparations are done. I'm as ready as I'll ever be. Now all that's left to do is a quick trip to the Holy City.\n\nNot everyone will share my vision. In fact, I expect there will be many who'll try to dissuade me from this quest, thinking it a fool's errand. They simply don't understand the depth of my faith.\n\nBut soon, they will."
 provoke_vatican_caelestius_planning_confirm:0 "$provoke_vatican_planning_confirm$"
 provoke_vatican_caelestius_planning_decline:0 "$provoke_vatican_planning_decline$"
 provoke_vatican_caelestius_travel_title:0 "$provoke_vatican_travel_title$"
 provoke_vatican_caelestius_travel_desc:0 "$provoke_vatican_travel_desc$"
 hunt_target_name:0 "掠食"
 hunt_target_tt:0 "是时候解渴了。"
 hunt_target_planning_title:0 "掠食进行时"
 hunt_target_planning_desc:0 "现在可以开始掠食[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamed]了。"
 hunt_target_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 hunt_target_planning_decline:0 "$POD_journey_planning_decline_default$"
 hunt_target_travel_title:0 "掠食开始"
 hunt_target_travel_desc:0 "我通常不会到[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]以外的地方去掠食，但我决定这次值得一去。[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamed]逃不出我的手掌心了。"
 hunt_target_travel_confirm:0 "[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l]血液的味道如何？"
 wake_from_torpor_name:0 "唤醒"
 wake_from_torpor_tt:0 "我将唤醒蛰眠者。"
 wake_from_torpor_planning_title:0 "唤醒蛰眠者"
 wake_from_torpor_planning_desc:0 "我已经尽可能多地了解了[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamedPossessive]的躯体行踪，目前处于[GetTrait('torpor').GetName(GetPlayer.MakeScope.Var('current_journey').Var('target').Char)]状态。\n\n我现在知道了[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l]的大致位置，但如果我想找到[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l]的真正藏身之处，我还得在当地内进行更彻底的搜索。"
 wake_from_torpor_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 wake_from_torpor_planning_decline:0 "$POD_journey_planning_decline_default$"
 wake_from_torpor_travel_title:0 "搜寻蛰眠者"
 wake_from_torpor_travel_desc:0 "一旦找到[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNameNicknamed]，[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetSheHe|l]将完全任由我摆布，但其仍能感知[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l]的周围环境。想想都觉得可怕。我想知道，如果我们的位置颠倒过来，[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetSheHe|l]会怎么做。"
 wake_from_torpor_travel_confirm:0 "我们只需要先找到[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis|l]的巢穴。"
 seek_knowledge_bardo_name:0 "学习稀有律能（[GetTrait('bardo').GetName(GetNullCharacter)]）"
 seek_knowledge_bardo_desc:0 "[GetTrait('bardo').GetName(GetNullCharacter)] is a mysterious [discipline|E] practiced by the Children of [GetDynastyHouseByID('house_osiris').GetName]. It is an unusually peaceful technique, allowing the practicioner to gain great benefits from meditating in seclusion, and pacify [factions|E] via [GetPerk('paradox_perk').GetName(GetPlayer)]."
 seek_knowledge_bardo_effects:0 "你将获知一位懂得[GetTrait('bardo').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[discipline|E][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('bardo').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_bardo_tt:0 "Starve the Beast, feed the soul."
 seek_knowledge_bardo_planning_title:0 "探寻中有术之旅"
 seek_knowledge_bardo_planning_desc:0 "I have roused my blood and prepared myself to the best of my ability, but the finer points of [GetTrait('bardo').GetName(GetNullCharacter)] still elude me.\n\nIf I want to master this [discipline|E] all the way, I will need a teacher.\n\nLuckily, my scouts have told me where just such a person can be found."
 seek_knowledge_bardo_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_bardo_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_bardo_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_bardo_travel_desc:0 "I'm excited to get a chance to learn [GetTrait('bardo').GetName(GetNullCharacter)]. [the_beast|E] is unrelenting. Give it a finger, and it'll take your whole arm. Reprieve from it, even if temporary, is something every [cainite|E] yearns for."
 seek_knowledge_bardo_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 provoke_vatican_caelestius_travel_confirm:0 "$provoke_vatican_travel_confirm$"
 seek_knowledge_theurgy_isvalid:0 "$EFFECT_LIST_BULLET$你的[faith|E]必须不视#TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L 魔法#!#!为[crime|E]。\n#help $EFFECT_LIST_BULLET$源自亚伯拉罕宗教的信仰无视此限制（[GetReligionByKey('roadofheaven_religion').GetName]、[GetReligionByKey('ashirra_religion').GetName][GetReligionByKey('bloodgnosticism_religion').GetName]、[GetReligionByKey('hunters_religion').GetName]，[GetDoctrine('tenet_constantinian').GetBaseName]）#!"
 werewolf_training_isvalid:0 "$EFFECT_LIST_BULLET$你需要有一个有至少#V 1#!位其他成员的[coterie_werewolf|E]"
 assault_lair_name:0 "袭击巢穴："
 assault_lair_tt:0 "世上又少了一只怪物。"
 assault_lair_planning_title:0 "已准备好袭击"
 assault_lair_planning_desc:0 "我的耐心终于得到了回报。\n\n虽然花了点时间，但我的间谍和线人网络终于给我带来了我想要的东西：[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstNamePossessive]巢穴的确切位置。\n\n当然，这次[journey|E]最危险的部分还在前方……"
 assault_lair_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 assault_lair_planning_decline:0 "$POD_journey_planning_decline_default$"
 assault_lair_travel_title:0 "猎杀开始了"
 assault_lair_travel_desc:0 "在[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetFirstName]主场与[GetPlayer.MakeScope.Var('current_journey').Var('target').Char.GetHerHis]这样的魔物对峙总是充满风险，但我们有出其不意作为优势。这够了吗？在猎杀这种猎物时，稍有不慎就会丧命。"
 assault_lair_travel_confirm:0 "我绝不留情。"
 hunt_in_capital_planning_confirm_tt:0 "$EFFECT_LIST_BULLET$一旦[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip]落入你的魔掌，你就可以决定如何处理[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetSheHe]。\n$EFFECT_LIST_BULLET$你将不会再见到其他几位凡人。"
 hunt_in_capital_planning_decline_tt:0 "你的$POD_current_journey$[journey|E]就此结束。"
 hunt_in_capital_planning_decline_tt_2:0 "你将不会再见到这几位凡人。"
 hunt_in_capital_widget_desc:0 "继续掠食#bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagName ))]#!?"
 hunt_in_capital_widget_tt:0 "你立即进行新的[journey|E]来在首都掠食#bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagName ))]#!。\n[GetPlayer.Custom('PODShowJourneyCostHunt')]"
 hunt_in_capital_planning_restart:0 "这些都不适合我。我将再次掠食。"