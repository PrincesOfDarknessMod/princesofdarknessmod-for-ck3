 seek_knowledge_rosselini_name: "学习[GetTrait('necromancy').GetName(GetNullCharacter)](罗塞里尼)"
 seek_knowledge_rosselini_desc: "与乔凡尼家族一样，罗塞利尼家族与威尼斯有着紧密联系，两大家族均在此研习亡灵术。其他法师常认为罗塞利尼家族是更具天赋的死灵术士。他们以对死灵仆从的残酷对待（即使以乔凡尼的标准而言）而闻名。多数死灵术士为追求力量而研习此术，但罗塞利尼家族纯粹乐在其中，这种随意的施虐倾向在其创造的咒术中亦可见一斑。"
 seek_knowledge_rosselini_effects: "你将获知一位懂得罗塞利尼 [GetTrait('necromancy').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以学习其的秘技。如果你还没有[GetTrait('necromancy').GetName(GetNullCharacter)][trait|E]，你还将获得[Glossary('血律','game_concept_discipline_desc')][trait|E]，它可以让你解锁[lifestyle|E]中的[GetTrait('necromancy').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_rosselini_tt: "死亡成就了他们"
 seek_knowledge_rosselini_planning_title: "探寻亡灵术之旅"
 seek_knowledge_rosselini_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟罗塞利尼[GetTrait('necromancy').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_rosselini_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_rosselini_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_rosselini_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_rosselini_travel_desc: "我很兴奋能有机会学习罗塞里尼[GetTrait('necromancy').GetName(GetNullCharacter)]。对熵本身的控制将使我成为一股不可忽视的力量。 "
 seek_knowledge_rosselini_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 ritual_blood_sorcery_casting_name: ""
 ritual_blood_sorcery_casting_tt: "正筹备驾驭玄奥之力。"
 ritual_blood_sorcery_casting_planning_title: "展现[bs_ritual|E]"
 ritual_blood_sorcery_casting_planning_desc: "准备工作需要极为强大的血律和精神上的坚韧。现在，我已经尽可能地做好了准备。\n\n通过这个[bs_ritual|E]，我的意志将通过血液作为媒介，铭刻在现实之中。\n\n我最好确保自己备齐了所有所需的药剂。"
 ritual_blood_sorcery_casting_planning_confirm: "$POD_journey_planning_confirm_default$"
 ritual_blood_sorcery_casting_planning_decline: "$POD_journey_planning_decline_default$"
 ritual_blood_sorcery_casting_travel_title: "启程前往[bs_ritual|E]"
 ritual_blood_sorcery_casting_travel_desc: "无论我进行多少次这些仪式，它们总会唤起一种遥远的恐惧感。我们最伟大的学者们远未能理解那沉睡在我们血液中的伟大[Glossary('心兽','game_concept_beast_desc')]，它在我们需要其力量时便会苏醒。在所有巧妙的伪饰、流程、仪式和戏法的掩盖之下，我们依然是试图驾驭大自然力量的稚子。"
 ritual_blood_sorcery_casting_travel_confirm: "继续行进，直至抵达[bs_ritual|E]仪式地点"
