 seek_knowledge_feng_shui_name: "学习气功([GetTrait('chi_art_feng_shui').GetName(GetNullCharacter)])"
 seek_knowledge_feng_shui_desc: "风水是一门古老的地相术，专精于根据天象地脉来调整建筑、墓穴与室内布局，使之顺应吉兆，让气得以自由流动，从而令个体与周围环境和谐共生。"
