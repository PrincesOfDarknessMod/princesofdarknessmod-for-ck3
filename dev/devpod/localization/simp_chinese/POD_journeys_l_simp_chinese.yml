 cthonic_womb_widget_tt:0 "#help 这只在你选择吸干目标时生效。#!"
 golconda_1_name:0 "学会驾驭心兽"
 golconda_1_desc:0 "有传言说有$POD_splat_vampire_plural$成功地永远超越了[the_beast|E]，达到了不再需要吸血的境界。这听起来好得不像是真的，但如果真的有答案，那就值得去寻找。"
 golconda_1_effects:0 "你将得知到一名导师的位置，其能让你走上正确的道途。"
 golconda_1_tt:0 "真能做到内心平静么？"
 golconda_1_planning_title:0 "了解内敌"
 golconda_1_planning_desc:0 "#R 饥渴#!是每位[cainite|E]都要学会忍受……或沉溺其中的东西。它变成了环境噪声。成为我们亡生中不可改变的事。\n\n但非得如此吗？\n\n我的斥候告诉我一个可以找到更多答案的地方。"
 golconda_1_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 golconda_1_planning_decline:0 "$POD_journey_planning_decline_default$"
 golconda_1_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 golconda_1_travel_desc:0 "我寻找的答案一定有什么极难之处。难道不是每位[cainite|E]都想从[the_beast|E]那里得到解脱吗？那为什么这个问题的解决方法不广为人知呢？我想我很快就会知道原因了。"
 golconda_1_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 golconda_2_name:0 "与你的心兽和平相处"
 golconda_2_desc:0 "既然我已经知道了[golconda|E]之道，我就面临着深入了解我的[beast|E]的艰巨任务。在我之前的许多人已经为这件事花费了几个世纪的时间，但除了挫折之外一无所获。我能在他们失败的地方取得成功吗？"
 golconda_2_effects:0 "你将获得[GetTrait('golconda_seeker').GetName(GetPlayer)]的[trait_level_track_xp|E]。如果你还没有该[trait|E]，你也将获得它。\n\n你拥有的[trait_level_track_xp|E]越多，取得重要突破的几率就越大。\n\n#X 一旦犯下血狂、谋杀或盗窃，所有[journey|E]进度都会丢失。#!"
 golconda_2_tt:0 "千里之行。"
 golconda_2_planning_title:0 "反思内心的掠食者"
 golconda_2_planning_desc:0 "[the_beast|E]一如既往地萦绕在我的脑海中，我花了很长时间观察它，试图更深入地了解它的行为。\n\n我需要一些安静的时间来深入思考我所学到的东西。\n\n这可能会造成一些[stress|E]。"
 golconda_2_planning_confirm:0 "我准备好了。"
 golconda_2_planning_decline:0 "我应该在压力较小的时候考虑这个问题。"
 golconda_widget_desc:0 "继续与你的[beast|E]和平相处？"
 golconda_widget_tt:0 "你将立即开始又一[journey|E]，以获得对[golconda|E]的见解。\n费用：[piety_i|E]#V 1000#!"
 golconda_3_name:0 "欢息"
 golconda_3_desc:0 "我所有的准备都是为了这一刻。我将一劳永逸地迎战[the_beast|E]。"
 golconda_3_effects:0 "你将进入灵魂的最深处，进行最后的对抗。\n\n#X 根据你作为[GetTrait('golconda_seeker').GetName(GetPlayer)]的[trait_level_track_xp|E]，你有#V [GetPlayer.MakeScope.ScriptValue('suspire_success_chance')]%#!的几率可以保持安然无恙。#!"
 golconda_3_tt:0 "孤注一掷。"
 golconda_3_planning_title:0 "最后一站"
 golconda_3_planning_desc:0 "我知道该怎么做。就像使用[GetTrait('auspex').GetName(GetNullCharacter)]一样，我会让精血增强我的感知。然后，我将把我的意识投射到内部，送到[the_beast|E]所在的地方。\n\n我不知道等待我的会是什么。\n\n只有试一试才知道了。"
 golconda_3_planning_confirm:0 "信仰之跃的时候到了。"
 golconda_3_planning_decline:0 "还不是跳跃的时候。"
 seek_knowledge_visceratika_name:0 "学习稀有血律（[GetTrait('visceratika').GetName(GetNullCharacter)]）"
 seek_knowledge_visceratika_desc:0 "[GetTrait('visceratika').GetName(GetNullCharacter)]是源自#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!对石头的自然亲和的一门变形[discipline|E]。它可以让修习者[GetPerk('flowwiththemountain_perk').GetName(GetPlayer)]，并获得[prowess|E]和[scheme_resistance|E]增益。"
 seek_knowledge_visceratika_effects:0 "你将获知一位懂得[GetTrait('visceratika').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[discipline|E][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('visceratika').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_visceratika_isvalid:0 "$EFFECT_LIST_BULLET$必须有一位[GetTrait('gargoyle').GetName(GetNullCharacter)]或[GetTrait('tremere').GetName(GetNullCharacter)]是通过[decision|E]发明了这[discipline|E]。"
 seek_knowledge_visceratika_requirement:0 "[GetTrait('visceratika').GetName(GetNullCharacter)]尚未被发明"
 seek_knowledge_visceratika_tt:0 "不动如山。"
 seek_knowledge_visceratika_planning_title:0 "探寻石变术之旅"
 seek_knowledge_visceratika_planning_desc:0 "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('visceratika').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门[discipline|E]，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_visceratika_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_visceratika_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_visceratika_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_visceratika_travel_desc:0 "我很高兴能有机会学习[GetTrait('visceratika').GetName(GetNullCharacter)]。所有的防御工事都是土石砌成的。若能操控土石，就能获得巨大的战术优势。"
 seek_knowledge_visceratika_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
