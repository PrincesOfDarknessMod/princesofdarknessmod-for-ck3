 azhi_dahaka_1_travel_title: "研究阿兹·达哈卡"
 azhi_dahaka_1_travel_desc: "这次我学到了什么？"
 azhi_dahaka_1_travel_confirm: "找到它。"
 azhi_dahaka_2_name: "阿兹·达哈卡秘仪"
 azhi_dahaka_2_desc: "要成为永恒变化之龙，必须在身心上彻底重塑自我。你已经准备了最宏大的仪式，来脱去现有的形态，重生为真正的蜕变之路典范。"
 azhi_dahaka_2_effects: "你将开始收集材料并准备仪式，以成就你自己的阿兹·达哈卡。"
 azhi_dahaka_2_tt: "原始巨龙咆哮着。"
 azhi_dahaka_2_planning_title: "阿兹·达哈卡秘仪"
 azhi_dahaka_2_planning_desc: "仪式已准备就绪。是时候迈出这一步，去寻找永恒变化之龙跳动的心脏——混沌与永恒交汇之处……然后啜饮龙的力量。"
 azhi_dahaka_2_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_2_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_2_travel_title: "阿兹·达哈卡秘仪"
 azhi_dahaka_2_travel_desc: "我正处于这场漩涡的中心。"
 azhi_dahaka_2_travel_confirm: "永恒变化之龙等待着我。"
 hunt_for_sargon_codex_shard_name: "追寻萨尔贡圣典的残篇。"
 hunt_for_sargon_codex_shard_desc: "萨尔贡圣典是一块由卡帕多修斯在凡人时期写就的泥板。在他经历了$pod_Embrace$之后，因失去了他的化身，他的记忆陷入了混乱与破碎之中。他无法记起自己曾写下的内容，也不记得将其留在了何处。历经千年，萨尔贡圣典被毁，其残页散落世界各地。若有人能将其修复，将会获得巨大的力量。"
 hunt_for_sargon_codex_shard_effects: "你将开始收集有关萨尔贡圣典残篇可能地点的信息。"
 hunt_for_sargon_codex_shard_tt: "一位无与伦比的学者的巨著。"
 hunt_for_sargon_codex_shard_isvalid: "$EFFECT_LIST_BULLET$还有残篇未被发现。"
 hunt_for_sargon_codex_shard_planning_title: "残篇被发现"
 hunt_for_sargon_codex_shard_planning_desc: "终于，我的斥候带着好消息回来了：萨尔贡圣典其中一部分残篇的大致位置。\n\n现在我知道该去哪里了，我可以把它解救出来。\n\n如果有必要的话，可以动武。"
 hunt_for_sargon_codex_shard_planning_confirm: "$POD_journey_planning_confirm_default$"
 hunt_for_sargon_codex_shard_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_for_sargon_codex_shard_travel_title: "追寻知识"
 hunt_for_sargon_codex_shard_travel_desc: "萨尔贡圣典早已散落四方。将所有碎片拼凑起来将是一项艰巨的任务。然而，对于求知者来说，最终的奖赏会让所有的努力都变得值得。"
 hunt_for_sargon_codex_shard_travel_confirm: "卡帕多修斯一定会保佑这一努力的。"
