 azhi_dahaka_1_name: "研究阿兹·达哈卡"
 azhi_dahaka_1_desc: "成就，甚至理解阿兹·达哈卡都绝非易事。你必须首先了解前人所取得的成就与犯下的错误，以减少失败的风险。"
 azhi_dahaka_1_effects: "你将隐匿潜踪，搜寻关于阿兹·达哈卡的记载，期望找到通向真正蜕变之路的方法。"
 azhi_dahaka_1_tt: "永恒的改变。"
 azhi_dahaka_1_planning_title: "研究阿兹·达哈卡"
 azhi_dahaka_1_planning_desc: "我在追寻阿兹·达哈卡上能投入的时间有限，我停滞在此，无法继续推动计划前进。我需要从另一个角度来评估我目前的进展。"
