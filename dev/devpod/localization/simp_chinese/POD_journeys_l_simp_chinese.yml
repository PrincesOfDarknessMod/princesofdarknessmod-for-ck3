 seek_knowledge_demonology_name: "学习#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!"
 seek_knowledge_demonology_desc: "#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!本身只是对$POD_splat_demon_plural$的学术研究。当然，大多数恶魔学家并不满足于简单的理论，他们会采取更为激烈的方式——出卖灵魂——来获得许多可能被某些人视为非自然的能力。"
 seek_knowledge_demonology_effects: "你将获知一位懂得#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的导师的位置。前往那里后，你可以获得[GetTrait('demonology').GetName(GetPlayer)][trait|E]，从而有可能成为一名[GetTrait('witch').GetName(GetNullCharacter)]——无论是通过[diabolism_binding|E][GetTrait('demon').GetName(GetNullCharacter)]这样艰难的役魔之道，还是[Concept('thralldom','自愿成为其仆从',)|E]这一简单得多的途径……"
 seek_knowledge_demonology_isvalid: "$EFFECT_LIST_BULLET$你必须在有$POD_splat_demon_plural$作为可玩[splats|E]的剧本中。"
 seek_knowledge_demonology_requirement_date: "你在[GetTrait('vampire').GetName(GetNullCharacter)]专属剧本，在这里$POD_splat_demon_plural$（以及其他[splats|E]）皆不可见。"
 seek_knowledge_demonology_tt: "为了真正的力量，我愿意付出任何代价。"
 seek_knowledge_demonology_planning_title: "探寻恶魔学之旅"
 seek_knowledge_demonology_planning_desc: "在翻阅了深奥的典籍和阅读了各种关于#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的论文之后，我现在对其理论有了一定的掌握。\n\n不过，实践方面又是另一回事。要想真正成为一名#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学家#!#!，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_demonology_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_demonology_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_demonology_travel_title: "追求禁忌知识之旅"
 seek_knowledge_demonology_travel_desc: "我不能否认学习#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学#!#!的想法让我有些惶恐，但我已经下定决心。我会被蔑视，被鄙视，甚至被追杀。全世界都会忌讳我。但最终……我会笑到最后"
 seek_knowledge_demonology_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 find_artifact_name: "寻宝"
 find_artifact_desc: "选择一件[artifact|E]来搜寻。"
 find_artifact_tt: "这个宝物应该属于我。"
 assemble_artifact_name: "组装宝物"
 assemble_artifact_desc: "选择一件[artifact|E]来搜寻。"
 assemble_artifact_tt: "知识有价。"
 assemble_artifact_planning_title: "另一块拼图"
 assemble_artifact_planning_desc: "终于，我的斥候带着好消息回来了。他们找到了《挪得之书》另一章的下落，取回它将使我离恢复这本书更近一步\n\n我只能希望目前持有它的人能够……被说服放弃它"
 assemble_artifact_planning_confirm: "$POD_journey_planning_confirm_default$"
 assemble_artifact_planning_decline: "$POD_journey_planning_decline_default$"
 assemble_artifact_travel_title: ""
 assemble_artifact_travel_desc: ""
 assemble_artifact_travel_confirm: ""
 provoke_vatican_name: "向梵蒂冈揭露你自己"
 provoke_vatican_desc: "我厌倦了总是躲在暗处，总是害怕凡人，总是要确保我们的存在不被发现。再也不了！我要让他们知道，我族是值得尊敬的。我要让他们知道……"
 provoke_vatican_effects: "你将前往罗马，并在一次狂暴肆虐中暴露自己的超自然本质，从而引起裁判所的反击。\n\n$provoke_vatican_warning$"
 provoke_vatican_isvalid: "$EFFECT_LIST_BULLET$你是[GetTrait('arrogant').GetName(GetPlayer)]\n$EFFECT_LIST_BULLET$你的[capital|E]是在[GetGeographicalRegion('world_europe').GetName]\n$EFFECT_LIST_BULLET$你追随[christian_derived_faith|E]"
 provoke_vatican_tt: "我将遗臭万年。"
 provoke_vatican_planning_title: "唤醒猛虎"
 provoke_vatican_planning_desc: "决定已经做出。准备工作已经完成。我已经准备就绪。现在要做的就是快速前往圣城\n\n不是每个人都会赞同我的观点。事实上，我估计会有很多人劝我放弃这次历险，认为这是愚蠢的行为。他们根本不了解我的野心有多大。\n\n但很快，他们就会明白。"
 provoke_vatican_planning_confirm: "这将是我的巨作。"
 provoke_vatican_planning_decline: "我最好确保我已经准备好了。"
 provoke_vatican_travel_title: "梵蒂冈之行"
 provoke_vatican_travel_desc: "前路凶险，我不禁心有余悸。这就是凯撒跨过卢比孔河时的感受吗？他是否意识到自己的行为将改变整族的命运？他是否感受到了历史的重量？我只能寄希望于有朝一日，当一切都尘埃落定，我的行为会得到辩护。"
 provoke_vatican_travel_confirm: "很快，全世界都将知道我的名字。"
 provoke_vatican_caelestius_name: "$provoke_vatican_name$"
 provoke_vatican_caelestius_desc: "我族蜷缩在阴影中太久了，为了什么？教会给我们打上了罪人的烙印，然而他们对原罪的概念却是从错误的前提中得出的。我知道如何揭示他们逻辑上的前后矛盾。我知道如何纠正这个错误。我会……与教宗辩论。"
 provoke_vatican_caelestius_effects: "你将前往罗马，尝试向圣父教宗介绍你自创的挪得思想，从而赢得他的祝福……或者激起裁判所的反击。\n\n$provoke_vatican_warning$"
 provoke_vatican_caelestius_tt: "圣父教宗一定会保佑我的。"
 provoke_vatican_caelestius_planning_title: "准备揭露"
 provoke_vatican_caelestius_planning_desc: "决定已经做出。准备工作已经完成。我已经准备就绪。现在要做的就是快速前往圣城\n\n不是每个人都会赞同我的观点。事实上，我估计会有很多人劝我放弃这次历险，认为这是愚蠢的行为。他们根本不了解我信仰的深度。\n\n但很快，他们就会明白。"
 provoke_vatican_caelestius_planning_confirm: "$provoke_vatican_planning_confirm$"
 provoke_vatican_caelestius_planning_decline: "$provoke_vatican_planning_decline$"
 provoke_vatican_caelestius_travel_title: "$provoke_vatican_travel_title$"
 provoke_vatican_caelestius_travel_desc: "$provoke_vatican_travel_desc$"
 hunt_target_name: "掠食"
 hunt_target_tt: "是时候解渴了。"
 hunt_target_planning_title: "掠食进行时"
 hunt_target_planning_desc: "现在可以开始掠食[PlayerJourneyTarget.GetFirstNameNicknamed]了。"
 hunt_target_planning_confirm: "$POD_journey_planning_confirm_default$"
 hunt_target_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_target_travel_title: "掠食开始"
 hunt_target_travel_desc: "我通常不会到[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]以外的地方去掠食，但我决定这次值得一去。[PlayerJourneyTarget.GetFirstNameNicknamed]逃不出我的手掌心了。"
 hunt_target_travel_confirm: "[PlayerJourneyTarget.GetHerHis|l]血液的味道如何？"
 wake_from_torpor_name: "唤醒"
 wake_from_torpor_tt: "我将唤醒蛰眠者。"
 wake_from_torpor_planning_title: "唤醒蛰眠者"
 wake_from_torpor_planning_desc: "我已经尽可能多地了解了[PlayerJourneyTarget.GetFirstNameNicknamedPossessive]的躯体行踪，目前处于[GetTrait('torpor').GetName(PlayerJourneyTarget)]状态。\n\n我现在知道了[PlayerJourneyTarget.GetHerHis|l]的大致位置，但如果我想找到[PlayerJourneyTarget.GetHerHis|l]的真正藏身之处，我还得在当地内进行更彻底的搜索。"
 wake_from_torpor_planning_confirm: "$POD_journey_planning_confirm_default$"
 wake_from_torpor_planning_decline: "$POD_journey_planning_decline_default$"
 wake_from_torpor_travel_title: "搜寻蛰眠者"
 wake_from_torpor_travel_desc: "一旦找到[PlayerJourneyTarget.GetFirstNameNicknamed]，[PlayerJourneyTarget.GetSheHe|l]将完全任由我摆布，但其仍能感知[PlayerJourneyTarget.GetHerHis|l]的周围环境。想想都觉得可怕。我想知道，如果我们的位置颠倒过来，[PlayerJourneyTarget.GetSheHe|l]会怎么做。"
 wake_from_torpor_travel_confirm: "我们只需要先找到[PlayerJourneyTarget.GetHerHis|l]的巢穴。"
 seek_knowledge_bardo_name: "学习稀有血律（[GetTrait('bardo').GetName(GetNullCharacter)]）"
 seek_knowledge_bardo_desc: "[GetTrait('bardo').GetName(GetNullCharacter)]是[GetDynastyHouseByID('house_osiris').GetName]之子所修习的一门神秘[Glossary('血律','game_concept_discipline_desc')]。这是一种异常平和的技艺，修习者可以在隐居冥想获得更多收益，并通过[GetPerk('paradox_perk').GetName(GetPlayer)]平定[factions|E]。"
 seek_knowledge_bardo_effects: "你将获知一位懂得[GetTrait('bardo').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[Glossary('血律','game_concept_discipline_desc')][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('bardo').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_bardo_tt: "饿死心兽，喂饱灵魂。"
 seek_knowledge_bardo_planning_title: "探寻中阴术之旅"
 seek_knowledge_bardo_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bardo').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_bardo_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_bardo_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_bardo_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_bardo_travel_desc: "我很高兴能有机会学习[GetTrait('bardo').GetName(GetNullCharacter)]。[Glossary('心兽','game_concept_beast_desc')]是无情的。给它一根手指，它就会咬断你的整条手臂。即使是暂时地解脱，也是每位$pod_cainite$都渴望的。"
 seek_knowledge_bardo_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 provoke_vatican_caelestius_travel_confirm: "$provoke_vatican_travel_confirm$"
 seek_knowledge_theurgy_isvalid: "$EFFECT_LIST_BULLET$你的[faith|E]必须不视#TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L 魔法#!#!为[crime|E]。\n#help $EFFECT_LIST_BULLET$源自亚伯拉罕宗教的信仰无视此限制（[GetReligionByKey('roadofheaven_religion').GetName]、[GetReligionByKey('ashirra_religion').GetName]、[GetReligionByKey('bloodgnosticism_religion').GetName]、[GetReligionByKey('roadofblood_religion').GetName]、[GetReligionByKey('calomenasforsaken_religion').GetName]、[GetReligionByKey('fishers_religion').GetName]、[GetFaithByKey('shadowinquisition').GetName]、[GetFaithByKey('akritai').GetName]、[GetFaithByKey('ikhwan_al_safa').GetName]、[GetFaithByKey('judge').GetName]、[GetFaithByKey('crestofthehorn').GetName]、[GetFaithByKey('orderofourmercifulmother').GetName]、或[GetDoctrine('tenet_constantinian').GetBaseName]）#!"
 assault_lair_name: "袭击巢穴，目标"
 assault_lair_tt: "世上又少了一只怪物。"
 assault_lair_planning_title: "已准备好袭击"
 assault_lair_planning_desc: "我的耐心终于得到了回报。\n\n虽然花了点时间，但我的间谍和线人网络终于给我带来了我想要的东西：[PlayerJourneyTarget.GetFirstNamePossessive]巢穴的确切位置。\n\n当然，这次[journey|E]最危险的部分还在前方……"
 assault_lair_planning_confirm: "$POD_journey_planning_confirm_default$"
 assault_lair_planning_decline: "$POD_journey_planning_decline_default$"
 assault_lair_travel_title: "猎杀开始了"
 assault_lair_travel_desc: "[PlayerJourneyTarget.GetFirstName]主场与[PlayerJourneyTarget.GetHerHis]这样的魔物对峙总是充满风险，但我们有出其不意作为优势。这够了吗？在猎杀这种猎物时，稍有不慎就会丧命。"
 assault_lair_travel_confirm: "我绝不留情。"
 hunt_in_capital_planning_decline_tt: "你的$POD_current_journey$[journey|E]就此结束。"
 hunt_in_capital_planning_decline_tt_2: "你将不会再见到这几位凡人。"
 hunt_in_capital_widget_desc: "继续掠食#bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#!？"
 hunt_in_capital_widget_tt: "你立即进行新的[journey|E]来在首都掠食#bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#!。\n[GetPlayer.Custom('PODShowJourneyCostHunt')]"
 hunt_in_capital_planning_restart: "这些都不适合我。我将再次掠食。"
 provoke_vatican_warning: "#warning 这场史无前例的[the_masquerade|E]破漏将带来巨大的、改变世界的后果。\n\n你将[GetTrait('forever_infamous').GetName(GetPlayer)]和[GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]。你肯定会被载入史册。你几乎肯定会万劫不复，就这么简单。\n\n你愿意冒这个险吗？#!"
 provoke_vatican_religion_tt: "你必须追随一个[christian_derived_faith|E]"
 cthonic_womb_widget_desc: "是否在杀死[EventWindowWidget.GetScope.sC('victim').GetShortUINameNoTooltip]后，将[EventWindowWidget.GetScope.sC('victim').GetHerHim]转为[GetTrait('wraith').GetName(GetNullCharacter)]？"
 cthonic_womb_widget_tt: "#help 这只在你选择吸干目标时生效。#!"
 golconda_1_name: "学会驾驭心兽"
 golconda_1_desc: "有传言说有$POD_splat_vampire_plural$成功地永远超越了[Glossary('心兽','game_concept_beast_desc')]，达到了不再需要吸血的境界。这听起来好得不像是真的，但如果真的有答案，那就值得去寻找。"
 golconda_1_effects: "你将得知到一名导师的位置，其能让你走上正确的道途。"
 golconda_1_tt: "真能做到内心平静么？"
 golconda_1_planning_title: "了解内敌"
 golconda_1_planning_desc: "#beast 饥渴#!是每位$pod_cainite$都要学会忍受……或沉溺其中的东西。它变成了环境噪声。成为我们亡生中不可改变的事。\n\n但非得如此吗？\n\n我的斥候告诉我一个可以找到更多答案的地方。"
 golconda_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 golconda_1_planning_decline: "$POD_journey_planning_decline_default$"
 golconda_1_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 golconda_1_travel_desc: "我寻找的答案一定有什么极难之处。难道不是每位$pod_cainite$都想从[Glossary('心兽','game_concept_beast_desc')]那里得到解脱吗？那为什么这个问题的解决方法不广为人知呢？我想我很快就会知道原因了。"
 golconda_1_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 golconda_2_name: "与你的心兽和平相处"
 golconda_2_desc: "既然我已经知道了[golconda|E]之道，我就面临着深入了解我的[Glossary('心兽','game_concept_beast_desc')]的艰巨任务。在我之前的许多人已经为这件事花费了几个世纪的时间，但除了挫折之外一无所获。我能在他们失败的地方取得成功吗？"
 golconda_2_effects: "你将获得[GetTrait('golconda_seeker').GetName(GetPlayer)]的[trait_level_track_xp|E]。如果你还没有该[trait|E]，你也将获得它。\n\n你拥有的[trait_level_track_xp|E]越多，取得重要突破的几率就越大。\n\n#X 一旦犯下血狂、谋杀或盗窃，所有[journey|E]进度都会丢失。#!"
 golconda_2_tt: "千里之行。"
 golconda_2_planning_title: "反思内心的掠食者"
 golconda_2_planning_desc: "[Glossary('心兽','game_concept_beast_desc')]一如既往地萦绕在我的脑海中，我花了很长时间观察它，试图更深入地了解它的行为。\n\n我需要一些安静的时间来深入思考我所学到的东西。\n\n这可能会造成一些[stress|E]。"
 golconda_2_planning_confirm: "我准备好了。"
 golconda_2_planning_decline: "我应该在压力较小的时候考虑这个问题。"
 golconda_widget_desc: "继续与你的[Glossary('心兽','game_concept_beast_desc')]和平相处？"
 golconda_widget_tt: "你将立即开始又一[journey|E]，以获得对[golconda|E]的见解。\n费用：[piety_i|E]#V 1000#!"
 golconda_3_name: "欢息"
 golconda_3_desc: "我所有的准备都是为了这一刻。我将一劳永逸地迎战[Glossary('心兽','game_concept_beast_desc')]。"
 golconda_3_effects: "你将进入灵魂的最深处，进行最后的对抗。\n\n#X 根据你作为[GetTrait('golconda_seeker').GetName(GetPlayer)]的[trait_level_track_xp|E]，你有#V [GetPlayer.MakeScope.ScriptValue('suspire_success_chance')]%#!的几率可以保持安然无恙。#!"
 golconda_3_tt: "孤注一掷。"
 golconda_3_planning_title: "最后一站"
 golconda_3_planning_desc: "我知道该怎么做。就像使用[GetTrait('auspex').GetName(GetNullCharacter)]一样，我会让$pod_vitae$增强我的感知。然后，我将把我的意识投射到内部，送到[Glossary('心兽','game_concept_beast_desc')]所在的地方。\n\n我不知道等待我的会是什么。\n\n只有试一试才知道了。"
 golconda_3_planning_confirm: "信仰之跃的时候到了。"
 golconda_3_planning_decline: "还不是跳跃的时候。"
 seek_knowledge_visceratika_name: "学习稀有血律（[GetTrait('visceratika').GetName(GetNullCharacter)]）"
 seek_knowledge_visceratika_desc: "[GetTrait('visceratika').GetName(GetNullCharacter)]是源自#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!对石头的自然亲和的一门变形[Glossary('血律','game_concept_discipline_desc')]。它可以让修习者[GetPerk('flowwiththemountain_perk').GetName(GetPlayer)]，并获得[prowess|E]和[scheme_resistance|E]增益。"
 seek_knowledge_visceratika_effects: "你将获知一位懂得[GetTrait('visceratika').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[Glossary('血律','game_concept_discipline_desc')][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('visceratika').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_visceratika_isvalid: "$EFFECT_LIST_BULLET$必须有一位[GetTrait('gargoyle').GetName(GetNullCharacter)]或[GetTrait('tremere').GetName(GetNullCharacter)]通过[decision|E]发明了此$pod_discipline$。\n$EFFECT_LIST_BULLET$至少包含以下其中一条：\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_20$\n$BULLET_WITH_TAB$你是[GetTrait('gargoyle').GetName(GetPlayer)]\n$BULLET_WITH_TAB$你拥有[GetTrait('fortitudeadvanced').GetName(GetPlayer)]和[GetTrait('proteanadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"
