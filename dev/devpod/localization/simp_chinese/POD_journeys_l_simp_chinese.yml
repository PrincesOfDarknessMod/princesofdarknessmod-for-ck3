l_simp_chinese:
 POD_journey_planning_confirm_default:0 "我现在就开始行动！"
 POD_journey_planning_decline_default:0 "现在有更紧急的事情需要处理。"
 POD_journey_travel_title_seek_knowledge:0 "漫步求知"
 POD_journey_travel_confirm_seek_knowledge:0 "这将开阔我的眼界。"
 hunt_in_capital_name:0 "在首都掠食"
 hunt_in_capital_desc:0 "每位[cainite|E]都对鲜血充满渴望，我也不例外。在接下来的夜晚，[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]将成为我的狩猎场。\n\n#help (你也可以右键单击特定角色，通过[character_interaction|E]选择掠食[journey|E]，从而掠食该角色）。#!"
 hunt_in_capital_tt:0 "是时候满足我的饥渴了。"
 hunt_in_capital_planning_title:0 "掠食进行中"
 hunt_in_capital_planning_desc:0 "在[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]的街道上闲逛时，我发现附近有许多凡人很容易受我操控。\n\n我只来得及追捕其中一个。"
 hunt_in_capital_planning_confirm:0 "我将掠食[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip]并吸食[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetHerHis]的血液。"
 hunt_in_capital_planning_decline:0 "我改变主意了。放弃掠食。"
 werewolf_training_name:0 "与你[coterie_werewolf|E]一同旅行"
 werewolf_training_desc:0 "你和你的战群成员们不仅仅是简单的朋友，在最危急的情况下，他们会一直支持你。你们必须齐心协力。"
 werewolf_training_effects:0 "你将审查你的[coterie_werewolf|E]，并决定重点进行哪种形式的训练。"
 werewolf_training_tt:0 "[GetPlayer.GetFaith.HighGodName]需要更强而有力的士兵。"
 werewolf_training_planning_title:0 "打磨爪牙"
 werewolf_training_planning_desc:0 "$POD_player_coterie$的成员们又抽空聚在一起进行了一次训练。\n\n这将有助于我们更好地发挥团队精神，完成[GetPlayer.GetFaith.HighGodName]需要我们完成的使命。"
 werewolf_training_planning_confirm:0 "我们马上开始训练！"
 werewolf_training_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_name:0 "学习新能力"
 seek_knowledge_desc:0 "选择一项能力来学习。"
 seek_knowledge_tt:0 "我将开阔我的眼界。"
 seek_knowledge_animalism_name:0 "学习血律（[GetTrait('animalism').GetName(GetNullCharacter)]）"
 seek_knowledge_animalism_desc:0 "[GetTrait('animalism').GetName(GetNullCharacter)]是关于掌控动物的[discipline|E]。它解锁数项动物相关能力，如[GetPerk('bond_famulus_perk').GetName(GetPlayer)]或[GetPerk('call_of_the_wild_perk').GetName(GetPlayer)]。"
 seek_knowledge_animalism_effects:0 "你将获知一位懂得[GetTrait('animalism').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[discipline|E][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('animalism').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_animalism_tt:0 "黑夜中的野兽将服从我。"
 seek_knowledge_animalism_planning_title:0 "探寻兽性术之旅"
 seek_knowledge_animalism_planning_desc:0 "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('animalism').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门[discipline|E]，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_animalism_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_animalism_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_animalism_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_animalism_travel_desc:0 "我很高兴能有机会学习[GetTrait('animalism').GetName(GetNullCharacter)]。他们说，只要懂得倾听，黑夜中的野兽就有很多趣事可以讲。"
 seek_knowledge_animalism_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_auspex_name:0 "学习血律（[GetTrait('auspex').GetName(GetNullCharacter)]）"
 seek_knowledge_auspex_desc:0 "[GetTrait('auspex').GetName(GetNullCharacter)]是关于超自然感知的[discipline|E]。它允许施术者知晓他人的[resonance|E]，进行[GetPerk('psychic_projection_perk').GetName(GetPlayer)]，以及促进[schemes|E]。"
 seek_knowledge_auspex_effects:0 "你将获知一位懂得[GetTrait('auspex').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[discipline|E][trait|E]，从而解锁[lifestyle|E]中的[GetTrait('auspex').GetName(GetNullCharacter)][perks|E]。"
