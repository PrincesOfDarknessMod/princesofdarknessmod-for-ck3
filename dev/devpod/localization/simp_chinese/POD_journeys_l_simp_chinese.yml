 seek_knowledge_abyssal_mysticism_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_travel_desc: "深渊魔法召唤来自另一个维度的灵体，这个维度类似于黑暗炼狱。施术者奴役并控制这些灵体，但这些灵体与世间其他存在截然不同，似乎没有任何对于真正的魔邪的记忆或关联。"
