 seek_knowledge_bloodsorcery_name:0 "学习稀有血律（[GetTrait('bloodsorcery').GetName(GetNullCharacter)]）"
 seek_knowledge_bloodsorcery_desc:0 "[GetTrait('bloodsorcery').GetName(GetNullCharacter)]是一门神秘的[discipline|E]，主要与[GetTrait('tremere').GetName(GetNullCharacter)]相关，但有数个不同的[Clans|E]修习。它允许修习者使用其血来进行各种各样的魔法仪式：专注心智，增强军队，诅咒敌人……以及更多。"
 seek_knowledge_bloodsorcery_effects:0 "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得[discipline|E][trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁 [blood_sorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。"
