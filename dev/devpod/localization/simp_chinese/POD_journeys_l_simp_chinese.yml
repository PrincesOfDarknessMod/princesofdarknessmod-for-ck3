 mokole_mnesis_quest_name: "龙梦之旅"
 mokole_mnesis_quest_desc: "远古[GetTrait('mokole').GetName(GetNullCharacter)]的力量已随岁月流逝而湮没无存。凭借龙梦之力，魔克拉可溯游时光之河，在其先祖的记忆中探寻这些被遗忘的伟力。"
 mokole_mnesis_quest_effects: "在[journey|E]结束时，你将获得[mnesis_lifestyle|E]的[lifestyle_experience|E]。[journey|E]的长度和难度取决于你试图回忆的时间跨度。\n获得[lifestyle_experience|E]的数量取决于以下因素：\n$EFFECT_LIST_BULLET$[learning|E]\n$EFFECT_LIST_BULLET$[prestige_level|E]\n$EFFECT_LIST_BULLET$[piety_level|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level|E]\n$EFFECT_LIST_BULLET$[GetTrait('mokole').GetName(GetNullCharacter)][trait_level_track_xp|E]\n\n在进入深度睡眠的旅程中，将施加一个负面修正。你也可能遭到梦猎者的袭击，这是一些试图伤害你的$POD_splat_spirit_plural$。"
 mokole_mnesis_quest_tt: "龙梦之河深不可测。"
 mokole_mnesis_quest_planning_title: "记忆已重拾"
 mokole_mnesis_quest_planning_desc: "你在龙梦之河中的旅程已完成。许多幻象与记忆仍萦绕在你的脑海，但你究竟学到了什么？\n"
 mokole_mnesis_quest_planning_confirm: "我想起来了。"
 mokole_mnesis_quest_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sielanic_thaumaturgy_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]（瑟拉尼克奇术）"
 seek_knowledge_sielanic_thaumaturgy_desc: "瑟拉尼克奇术是一种受原始神祇特亚维启发、由立陶宛本土睿魔尔氏族血系——特亚维派[GetTrait('tremere').GetName(GetNullCharacter)]所掌握的一种奇术形式。\n\n特亚维派学会了利用瑟拉的力量，瑟拉是潜伏在他们所居住的土地、石头、植物和动物中的万物之灵。基于萨满仪式，这些道途融合了自然与灵类魔法的双重特质。\n\n部分血系外的睿魔尔成员认为，瑟拉尼克奇术实为库都术法的分支，并对其修习者抱以猜疑与不信任的态度。这种疑虑并非全无依据，因瑟拉尼克奇术的修习者确实能触及库都之道某些[bs_paths|E]的奥秘。"
 seek_knowledge_sielanic_thaumaturgy_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。\n\n#warning 学习奇术意味着你永远无法掌握西尔。#!"
 seek_knowledge_sielanic_thaumaturgy_tt: "我将揭开精血最深层的秘密。"
 seek_knowledge_sielanic_thaumaturgy_planning_title: "探寻瑟拉尼克奇术之旅"
 seek_knowledge_sielanic_thaumaturgy_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_sielanic_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sielanic_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sielanic_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_travel_desc: "通过瑟拉尼克奇术，吸血鬼能够融入自然世界，汲取其所契合的土地、树木、岩石与生命所固有的能力。同时，他们还能跨越生与死的界限，以自身不死之躯为媒介与亡者沟通。瑟拉尼克之术融合了传统的[GetTrait('tremere').GetName(GetNullCharacter)]奇术与[GetTrait('tzimisce').GetName(GetNullCharacter)]库都术法，以此获得超越单一[bs_tradition|E]所能企及的力量。"
 seek_knowledge_sielanic_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_isvalid: "$disciplines_learning_sielanic_tt$"
 breaking_the_blond_bond_name: "破除血缚"
 breaking_the_blond_bond_desc: "你是[Glossary('血缚','game_concept_bloodbond_desc')]者，这意味着#italic 反抗#!这个概念本身都难以想象——因为那份被植入血脉的、人造的爱早已压倒了一切可能萌生的念头。\n\n可即便是那样的爱，也无法阻止你的内心看清正在发生的一切，更无法阻止那个久违的自由之念重新苏醒。"
 breaking_the_blond_bond_effects: "你将开始一段漫长的[journey|E]，逐渐削弱[Glossary('血缚','game_concept_bloodbond_desc')]的束缚，直到能够逃离或反抗你的[Glossary('侍主','game_concept_domitor_desc')]。请注意，这个过程需要你全力以赴，任何[mental_break|E]都会立刻导致前功尽弃。此外，完成任何带有血仆图标[bound_ghoul_mission_with_icon|E]都会使你的进展倒退#N 10%#!。"
 breaking_the_blond_bond_tt: "即使是债券也不是永恒的。"
 breaking_the_blond_bond_planning_title: "接近了，但还不够接近。"
 breaking_the_blond_bond_planning_desc: "你很接近了，你能感觉到你的爱逐渐变成了一种简单的迷恋。然而，你仍然需要再推一把才能真正自由。"
 breaking_the_blond_bond_planning_confirm: "这是爱吗…是假的吗？"
 breaking_the_blond_bond_planning_decline: "$POD_journey_planning_decline_default$"
