 realm_mastery_tt: "将梦华推向极致。"
 realm_mastery_actor_name: "达成[GetTrait('realm_actor').GetName(GetNullCharacter)]"
 realm_mastery_actor_desc: "#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L 角色术域#!#!是关于熟悉度的[fae_realm|E]。如果$POD_splat_fae$对这[fae_realm|E]所知甚少，就只能对自己非常熟悉的角色施放[cantrips|E]。如果想对憎恨的敌人施放[cantrips|E]，就必须精通它。"
 realm_mastery_actor_effects: "你将前往一座永契堡，并请求[Select_CString( DidShatteringHappen, '失落者', '贵胄' )]给予你关于#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L 角色#!#![fae_realm|E]的知识。如果你成功，你将获得[GetTrait('realm_actor').GetName(GetNullCharacter)][trait|E]，允许你解锁#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L 角色#!#!技能树的最终技能。"
 realm_mastery_actor_tt: "我将施法于我的对手。"
 realm_mastery_actor_planning_title: "探寻角色术域精通之旅"
 realm_mastery_actor_planning_desc: "虽然我已经努力释放自己的想象力，但在某些方面仍然受到限制。\n\n如果我想全面了解#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L 角色术域#!#!，就需要向精通它的[Select_CString( DidShatteringHappen, '失落者', '贵胄' )]寻求帮助。\n\n我已经准备好觐见临近的永契堡了。"
