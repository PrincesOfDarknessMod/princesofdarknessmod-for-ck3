 seek_knowledge_bloodsorcery_name:0 "学习稀有律能（[GetTrait('bloodsorcery').GetName(GetNullCharacter)]）"
 seek_knowledge_bloodsorcery_desc:0 "[GetTrait('bloodsorcery').GetName(GetNullCharacter)] is a mysterious [discipline|E] most commonly associated with the [GetTrait('tremere').GetName(GetNullCharacter)], but practiced by various different [Clans|E]. It lets the practicioner use their blood for a diverse array of magical rituals: focusing one's mind, improving one's armies, cursing one's enemies... and many more."
