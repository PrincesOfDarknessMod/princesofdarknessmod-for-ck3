 fera_spirit_quest_name: "开启灵界追寻"
 fera_spirit_quest_desc: "灵类是$glossary_fera$世界中的老师，但学习他们的灵赋是有代价的。一次灵类追寻将带你踏上一段充满多样际遇的旅程。"
 fera_spirit_quest_effects: "旅程结束时你可从以下奖励中选择：\n$EFFECT_LIST_BULLET$$glossary_fera$[lifestyle_experience|E]\n$EFFECT_LIST_BULLET$灵具[artifacts|El]\n$EFFECT_LIST_BULLET$生活方式或声望[traits|E]\n$EFFECT_LIST_BULLET$一位友善的[GetTrait('spirit').GetName(GetNullCharacter)]\n\n可以选奖励及其品质取决于所选旅程难度、你的[learning|E]与[piety_level|E]"
 fera_spirit_quest_tt: "听从他们的请求，学习他们的能力。"
 fera_spirit_quest_planning_title: "任务完成"
 fera_spirit_quest_planning_desc: "你的灵界追寻已达终点。此刻当与精魂共鸣，领取应得之馈。"
 fera_spirit_quest_planning_confirm: "我的任务完成了。"
