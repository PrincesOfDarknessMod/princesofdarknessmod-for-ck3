 seek_knowledge_psychic_desc:0 "Certain mortals are able to manifest #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Psychic Phenomena#!#!. These encompass a large variety of abilities such as [GetPerk('astral_projection_perk').GetName(GetPlayer)], [GetPerk('psychometry_perk').GetName(GetPlayer)], [GetPerk('animal_psi_perk').GetName(GetPlayer)], any many more. Psychic abilities are said to be innate, but maybe there are ways to force one's mind open..."
