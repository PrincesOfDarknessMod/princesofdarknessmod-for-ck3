 assemble_artifact_travel_desc:0 ""
 assemble_artifact_travel_confirm:0 ""
 provoke_vatican_name:0 "向梵蒂冈揭露你自己"
 provoke_vatican_desc:0 "我厌倦了总是躲在暗处，总是害怕凡人，总是要确保我们的存在不被发现。再也不了！我要让他们知道，我族是值得尊敬的。我要让他们知道……"
 provoke_vatican_effects:0 "你将前往罗马，并在一次狂暴肆虐中暴露自己的超自然本质，从而引起裁判所的反击。\n\n$provoke_vatican_warning$"
 provoke_vatican_isvalid:0 "$EFFECT_LIST_BULLET$你有[GetTrait('arrogant').GetName(GetPlayer)]特质\n$EFFECT_LIST_BULLET$你的[capital|E]在[GetGeographicalRegion('world_europe').GetName]\n$EFFECT_LIST_BULLET$你追随源自天主教的[religion|E]#italic （[GetReligionByKey('roadofheaven_religion').GetName]或[GetReligionByKey('bloodgnosticism_religion').GetName]）#!"
 provoke_vatican_tt:0 "我将遗臭万年。"
 provoke_vatican_planning_title:0 "唤醒猛虎"
 provoke_vatican_planning_desc:0 "决定已经做出。准备工作已经完成。我已经准备就绪。现在要做的就是快速前往圣城\n\n不是每个人都会赞同我的观点。事实上，我估计会有很多人劝我放弃这次历险，认为这是愚蠢的行为。他们根本不了解我的野心有多大。\n\n但很快，他们就会明白。"
 provoke_vatican_planning_confirm:0 "这将是我的巨作。"
 provoke_vatican_planning_decline:0 "我最好确保我已经准备好了。"
 provoke_vatican_travel_title:0 "梵蒂冈之行"
 provoke_vatican_travel_desc:0 "前路凶险，我不禁心有余悸。这就是凯撒跨过卢比孔河时的感受吗？他是否意识到自己的行为将改变整族的命运？他是否感受到了历史的重量？我只能寄希望于有朝一日，当一切都尘埃落定，我的行为会得到辩护。"
 provoke_vatican_travel_confirm:0 "很快，全世界都将知道我的名字。"
 provoke_vatican_caelestius_name:0 "$provoke_vatican_name$"
 provoke_vatican_caelestius_desc:0 "我族蜷缩在阴影中太久了，为了什么？教会给我们打上了罪人的烙印，然而他们对原罪的概念却是从错误的前提中得出的。我知道如何揭示他们逻辑上的前后矛盾。我知道如何纠正这个错误。我会……与教宗辩论。"
 provoke_vatican_caelestius_effects:0 "你将前往罗马，尝试向圣父教宗介绍你自创的挪得思想，从而赢得他的祝福……或者激起裁判所的反击。\n\n$provoke_vatican_warning$"
 provoke_vatican_caelestius_isvalid:0 ""
 provoke_vatican_caelestius_tt:0 "圣父教宗一定会保佑我的。"
 provoke_vatican_caelestius_planning_title:0 "准备揭露"
 provoke_vatican_caelestius_planning_desc:0 "决定已经做出。准备工作已经完成。我已经准备就绪。现在要做的就是快速前往圣城\n\n不是每个人都会赞同我的观点。事实上，我估计会有很多人劝我放弃这次历险，认为这是愚蠢的行为。他们根本不了解我信仰的深度。\n\n但很快，他们就会明白。"
 provoke_vatican_caelestius_planning_confirm:0 "$provoke_vatican_planning_confirm$"
 provoke_vatican_caelestius_planning_decline:0 "$provoke_vatican_planning_decline$"
