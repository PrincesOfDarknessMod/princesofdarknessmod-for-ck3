 seek_knowledge_sorcery_name: "学习灵迹（#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#!）"
 seek_knowledge_sorcery_desc: "#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#!是一种简化的魔法，即使是未觉醒的凡人也能学会。它包含多种魔法能力：#TOOLTIP:PERK,numina_conveyance_5_perk #L 转移#!#!、#TOOLTIP:PERK,numina_conjuration_4_perk #L 咒法#!#!、#TOOLTIP:PERK,numina_divination_5_perk #L 占卜#!#!、#TOOLTIP:PERK,numina_enchantment_2_perk #L 附魔#!#!，以及更多。技艺精湛的修行者甚至能运用[GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)]或[GetPerk('numina_healing_6_perk').GetName(GetPlayer)]来达成不朽。"
 seek_knowledge_sorcery_effects: "你将获知一位懂得#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#!的导师的位置。前往那里后，你可以获得[GetTrait('sorcerer').GetName(GetPlayer)][trait|E]，从而解锁#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#![lifestyle|E]中的术法[perks|E]。"
 seek_knowledge_sorcery_isvalid: "$EFFECT_LIST_BULLET$你的[faith|E]必须不视#TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L 魔法#!#!为[crime|E]。"
