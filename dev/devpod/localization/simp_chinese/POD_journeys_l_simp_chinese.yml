 fera_training_name: "与你[GetPlayer.Custom('PODCoterieNoTooltip')]一同旅行"
 fera_training_desc: "你和你的[GetPlayer.Custom('PODCoterieNoTooltip')]成员们不仅仅是简单的朋友，在最危急的情况下，他们会一直支持你。你们必须齐心协力。"
 fera_training_effects: "你将审查你的[GetPlayer.Custom('PODCoterie')]，并决定重点进行哪种形式的训练。"
