 seek_knowledge_sadhana_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sadhana_travel_desc: "修持是一种通过思想驾驭物质的修行。虽然可以说他们的力量来自内心，而不是从黑暗之神那里引导，但正是对湿婆神的信仰与虔诚，使他们能够集中注意力，进而引导这种力量。有人认为，没有这种信仰，他们只会在冥想中迷失自我。没有湿婆，他们将毫无力量，因此归根结底，这一切都应归功于黑暗之神。"
 seek_knowledge_sadhana_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_koldunic_name: "学习[GetTrait('bloodsorcery').GetName(GetNullCharacter)]（库都术）"
 seek_knowledge_koldunic_desc: "棘秘魑的库都们声称他们在其他氏族之前就已掌握魔法。库都术法汲取原始元素之力，奴役弱小的灵或与更强大的灵达成交易。这些元素之灵中最为显赫的是喀尔巴阡本尊——库帕拉，最古老的库都术士称其为“万物根源”。与这一存在的持续交涉已引发了严重问题，因为与自然诸灵交易和堕入恶魔崇拜之间仅有一步之遥。"
 seek_knowledge_koldunic_effects: "你将获知一位懂得[GetTrait('bloodsorcery').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]。它不仅能让你解锁[GetTrait('bloodsorcery').GetName(GetNullCharacter)][lifestyle|E]中的[perks|E]，还能解锁[bloodsorcery|E][character_interaction|E]，让你施放各种有益和有害的法术。"
