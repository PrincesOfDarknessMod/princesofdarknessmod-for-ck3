 seek_knowledge_auspex_planning_title:0 "探寻观占术之旅"
 seek_knowledge_auspex_planning_desc:0 "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('auspex').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门[discipline|E]，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
