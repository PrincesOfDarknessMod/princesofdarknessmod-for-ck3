 seek_knowledge_obligation_name: "学习气功([GetTrait('chi_art_obligation').GetName(GetNullCharacter)])"
 seek_knowledge_obligation_desc: "敕令是一门让$pod_kueijin$能够对他人施加控制的技艺。它是对古代万仙辉煌的追忆，他们的权威源自[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]的钦命。尽管他们已失去这份恩宠，但仍有部分人能激发或支配周围生灵的精神。"
