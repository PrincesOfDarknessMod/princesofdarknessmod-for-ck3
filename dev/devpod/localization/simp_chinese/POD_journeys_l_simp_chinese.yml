 fera_training_planning_title: "打磨爪牙"
 fera_training_planning_desc: "$POD_player_coterie$的成员们又抽空聚在一起进行了一次训练。\n\n这将有助于我们更好地发挥团队精神，完成[GetPlayer.GetFaith.HighGodName]需要我们完成的使命。"
 fera_training_planning_confirm: "我们马上开始训练！"
