 hunt_in_capital_name: "在首都掠食"
 hunt_in_capital_desc: "每位$pod_cainite$都对鲜血充满渴望，我也不例外。在接下来的夜晚，[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]将成为我的狩猎场。\n\n#help (你也可以右键单击特定角色，通过[character_interaction|E]选择掠食[journey|E]，从而掠食该角色）。#!"
 hunt_in_capital_tt: "是时候满足我的饥渴了。"
 hunt_in_capital_planning_title: "掠食进行中"
 hunt_in_capital_planning_desc: "又到了我用[GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]的凡人们充饥的时候了。\n\n等我没那么忙的时候，我应该抽空去掠食。"
 hunt_in_capital_planning_confirm: "不幸的是，我现在没时间掠食。"
 hunt_in_capital_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_name: "学习新能力"
 seek_knowledge_desc: "选择一项能力来学习。"
 seek_knowledge_tt: "我将开阔我的眼界。"
 seek_knowledge_animalism_name: "学习血律（[GetTrait('animalism').GetName(GetNullCharacter)]）"
 seek_knowledge_animalism_desc: "[GetTrait('animalism').GetName(GetNullCharacter)]是关于掌控动物的$pod_discipline$。它解锁数项动物相关能力，如[GetPerk('bond_famulus_perk').GetName(GetPlayer)]或[GetPerk('call_of_the_wild_perk').GetName(GetPlayer)]。"
 seek_knowledge_animalism_effects: "你将获知一位懂得[GetTrait('animalism').GetName(GetNullCharacter)]的导师的位置。前往那里后，你可以获得$pod_discipline$[trait|E]，从而解锁[lifestyle|E]中的[GetTrait('animalism').GetName(GetNullCharacter)][perks|E]。"
 seek_knowledge_animalism_tt: "黑夜中的野兽将服从我。"
 seek_knowledge_animalism_planning_title: "探寻兽性术之旅"
 seek_knowledge_animalism_planning_desc: "我已经激发了我的血，并尽我所能做好了准备，但我依然难以领悟[GetTrait('animalism').GetName(GetNullCharacter)]的精髓。\n\n如果我想完全掌握这门$pod_discipline$，我需要一位导师。\n\n幸运的是，我的斥候告诉了我在哪里可以找到这样一个人。"
 seek_knowledge_animalism_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_animalism_planning_decline: "$POD_journey_planning_decline_default$"
