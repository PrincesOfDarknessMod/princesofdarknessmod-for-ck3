 single_combat.0001.desc.opponent_response.POD_prowess_from_pain: "我的敌人伤口供养了其，让其在瞬间内变得更强大。"
 single_combat.0001.desc.opponent_response.POD_feral_weapons: "我敌人的利爪长了出来，准备把我劈成两半。"
 single_combat.0001.desc.opponent_response.POD_shapechange: "我敌人通过动物形态，先用獠牙扑向了我。"
 single_combat.0001.desc.opponent_response.POD_vanish: "我的敌人从视线中消失，试图迷惑我。"
