 single_combat.0001.desc.my_feedback.POD_bone_dance: "舞蹈已成，在该地区形成了一层让人昏昏欲睡的幔幕。"
 single_combat.0001.desc.my_feedback.POD_dragon_dance: "舞蹈已成，该兴奋起来了。"
 single_combat.0001.desc.my_feedback.POD_chi_interrupt: "我冲向我的对手，寻找其的气脉穴位。"
 single_combat.0001.desc.my_feedback.POD_thousand_hell_stare: "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0001.desc.my_feedback.POD_wind_attack: "风起云涌，我从未如此之快。"
 single_combat.0001.desc.my_feedback.POD_demon_claws: "我乃恶魔而其为我。我等将获胜。"
 single_combat.0001.desc.my_feedback.POD_tormented_essence: "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
