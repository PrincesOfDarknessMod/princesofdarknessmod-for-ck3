 single_combat.0001.POD_spark_of_ra: "拉神火花"
 single_combat.0001.tt.POD_spark_of_ra: "#D 你用塞赫点燃易燃物并将其丢向目标。#!"
 single_combat.0001.POD_deaths_hand: "死亡之手"
 single_combat.0001.tt.POD_deaths_hand: "#D 你尝试通过触摸来引导[UmbraGlossaryLocalized('shadowlands','冥界')]的纯粹灵质对付敌人。#!"
 single_combat.0001.POD_ashes_to_ashes: "尘归尘"
 single_combat.0001.tt.POD_ashes_to_ashes: "#D 你尝试瞬间改变敌人物质组成的状态。#!"
 single_combat.0001.POD_dust_to_dust: "土归土"
 single_combat.0001.tt.POD_dust_to_dust: "#D 你尝试通过触摸引导塞赫将敌人的血肉转化为泥土。#!"
 single_combat.0001.POD_khaibits_embrace: "黑影之拥"
 single_combat.0001.tt.POD_khaibits_embrace: "#D 你尝试将目标封在黑色灵质匣子里。#!"
 single_combat.0001.POD_serqets_sting: "塞尔凯特的刺针"
 single_combat.0001.tt.POD_serqets_sting: "#D 你携有少量毒液，且尝试通过结印隔空给人注射。#!"
 single_combat.0001.POD_voracious_scarab_of_nyarashahim: "尼亚拉沙欣的饕餮圣甲虫"
 single_combat.0001.tt.POD_voracious_scarab_of_nyarashahim: "#D 你制造出一个能将敌人瞬间吃光的小圣甲虫。#!"
 single_combat.0001.POD_spear_of_anubis: "阿努比斯之矛"
 single_combat.0001.tt.POD_spear_of_anubis: "#D 你切开你的手掌，将湮灭的力量化为一支黑暗长矛。#!"
 single_combat.0001.desc.my_feedback.POD_spark_of_ra: "我把一个点燃的火焰球扔向我的对手。"
 single_combat.0001.desc.my_feedback.POD_deaths_hand: "我举起手掌，用幽影能量轰击我的敌人。"
 single_combat.0001.desc.my_feedback.POD_ashes_to_ashes: "我施法将对手的肉体转化为灰烬。"
 single_combat.0001.desc.my_feedback.POD_dust_to_dust: "我试图接触我的对手，将其的肉体变成黑泥。"
 single_combat.0001.desc.my_feedback.POD_khaibits_embrace: "我抓住我敌人的脸，说出一些话语，操纵使人无法动弹的阴影缠绕在其身上。"
 single_combat.0001.desc.my_feedback.POD_serqets_sting: "我做出了蝎子结印，用剧毒蜇伤我的对手。"
 single_combat.0001.desc.my_feedback.POD_voracious_scarab_of_nyarashahim: "我释放出一只圣甲虫，来吞噬我的对手。"
 single_combat.0001.desc.my_feedback.POD_spear_of_anubis: "我手中显现出一把影矛，向我的敌人发动攻击。"
 single_combat.0001.desc.opponent_response.POD_spark_of_ra: "我的对手向我扔了一个点燃的火焰球。"
 single_combat.0001.desc.opponent_response.POD_deaths_hand: "我的敌人举起手掌，朝我轰击幽影能量。"
 single_combat.0001.desc.opponent_response.POD_ashes_to_ashes: "我的敌人试图施法将我变成灰烬。"
 single_combat.0001.desc.opponent_response.POD_dust_to_dust: "我的对手试图接触我，把我的肉体变成黑泥。"
 single_combat.0001.desc.opponent_response.POD_khaibits_embrace: "我的敌人抓着我的脸，道出神秘的话语。令人无法动弹的阴影开始包裹我的身体。"
