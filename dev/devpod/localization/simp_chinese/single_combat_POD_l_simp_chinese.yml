 single_combat.0031.desc.opponent_response.POD_blood_atemi.fatality: "我被击中了一下，两下，三下……随着我体内循环会陷入紊乱，我失能了。没过多久，我的对手就结束了我的苦难。"
 single_combat.0031.desc.opponent_response.POD_stand_upon_the_dragons_back.fatality: "我甚至没能打退对手，而反击则会心一击了。我再也没机会了。"
