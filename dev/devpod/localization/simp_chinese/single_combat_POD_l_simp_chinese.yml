 single_combat.0001.desc.opponent_response.POD_terminal_decree: "我的敌人向我发出命令，让我伤害自己。"
 single_combat.0001.desc.opponent_response.POD_daunt: "我的敌人变得更宏伟，更有力量，也许足以震慑我。"
 single_combat.0001.desc.opponent_response.POD_dread_gaze: "我的敌人显现为我最惧怕的噩梦。令人心烦意乱的景象。"
