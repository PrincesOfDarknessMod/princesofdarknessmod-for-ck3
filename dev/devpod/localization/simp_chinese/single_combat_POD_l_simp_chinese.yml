 single_combat.0001.desc.opponent_response.POD_lightning_strike: "我的敌人用迅捷术的力量进行本能地攻击，试图抓住我的破绽。"
 single_combat.0001.desc.opponent_response.POD_split_second: "随着迅捷术的生效，时间在我们周围变慢了。我的对手肯定会利用这个机会。"
 single_combat.0001.desc.opponent_response.POD_unerring_aim: "由于其对迅捷术的掌握，我敌人的下一击将是绝对精准的。"
 single_combat.0001.desc.opponent_response.POD_lethal_body: "通过蛮力术，我的对手得以用雪崩般的冲击力蹦向了我。"
