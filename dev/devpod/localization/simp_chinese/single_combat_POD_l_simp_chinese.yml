 single_combat.0031.desc.sc_attacker.POD_dragons_ire: "我试图把我的对手撕开，但[my_foe.GetSheHe]比我想得还要强壮"
 single_combat.0031.desc.sc_attacker.POD_dragons_ire.injury: "我被推了回去，近乎不能站稳。"
 single_combat.0031.desc.sc_attacker.POD_dragons_ire.fatality: "我的对手躲开了我的攻击，并回以强而有力的一击。"
 single_combat.0041.desc.sc_defender.POD_dragons_ire: "我用尽全力试图把对手撕成碎片"
 single_combat.0041.desc.opponent_response.POD_dragons_ire: "我的对手使用[my_foe.GetHerHis]的力量，想把我撕成碎片"
 single_combat.0041.desc.opponent_response.POD_dragons_ire.injury: "我对我的敌人造成伤害，试图把[my_foe.GetHerHim]撕碎。"
 single_combat.0041.desc.opponent_response.POD_dragons_ire.fatality: "我避开了敌人的攻击，将[my_foe.GetHerHim]撕成两片。"
 single_combat.0041.desc.sc_attacker.POD_dragons_ire: "我用尽全力试图把对手撕成碎片"
 single_combat.0041.desc.sc_attacker.POD_dragons_ire.injury: "我对我的敌人造成伤害，试图把[my_foe.GetHerHim]撕碎。"
 single_combat.0041.desc.sc_attacker.POD_dragons_ire.fatality: "用我庞大的力量，我将我的敌人撕裂。"
 single_combat.0001.POD_dragons_breath: "我要烧死你！"
 single_combat.0001.tt.POD_dragons_breath: "#D 你向敌人喷出火焰。#!"
 single_combat.0001.POD_bark_mudpuppy: "我的声音将摧毁你！"
 single_combat.0001.tt.POD_bark_mudpuppy: "#D 你使用了你的龙吼到敌人身上#!"
 single_combat.0001.POD_clap_of_thunder: "聆听天空的怒吼！"
 single_combat.0001.tt.POD_clap_of_thunder: "#D 一声惊雷震晕了你的敌人#!"
 single_combat.0001.POD_dragon_slash: "龙斩！"
 single_combat.0001.tt.POD_dragon_slash: "#D 用龙的力量猛击你的敌人!#!"
 single_combat.0001.desc.my_feedback.POD_dragons_breath: "我深吸一口气，朝着[my_foe.GetFirstNameNoTooltip]的大致方位喷出一股熊熊烈焰。"
 single_combat.0001.desc.my_feedback.POD_bark_mudpuppy: "我提高嗓门，用尽全力向[my_foe.GetFirstNameNoTooltip]咆哮，将一声怒吼凝聚成足以撕裂血肉的武器。"
 single_combat.0001.desc.my_feedback.POD_clap_of_thunder: "我双手一拍，一声突如其来的雷鸣巨响震得[my_foe.GetFirstNameNoTooltip]肝胆俱裂。"
 single_combat.0001.desc.my_feedback.POD_dragon_slash: "忆起所受的训练，我向[my_foe.GetFirstNameNoTooltip]猛扑过去，利爪连番挥出流畅而精准的斩击，将沉稳的技巧与原始的力量融为一体。"
 single_combat.0001.desc.opponent_response.POD_dragons_breath: "[my_foe.GetFirstNameNoTooltip]深吸一口气，如巨龙般喷吐出熊熊烈焰，瞬间照亮了我们四周。"
 single_combat.0001.desc.opponent_response.POD_bark_mudpuppy: "[my_foe.GetFirstNameNoTooltip]#italic 怒吼一声#!，其力量之强出乎意料，撕裂了我的皮肤，将我向后推去。"
 single_combat.0001.desc.opponent_response.POD_clap_of_thunder: "[my_foe.GetFirstNameNoTooltip]双手一拍，震耳欲聋的巨响瞬间让我双耳嗡鸣，几乎失聪。"
 single_combat.0001.desc.opponent_response.POD_dragon_slash: "[my_foe.GetFirstNameNoTooltip]神色凝重，[my_foe.GetSheHe]以凶猛的爪击朝我发起猛攻。"
 single_combat.0031.desc.sc_defender.POD_dragons_breath: "我的对手躲开了我的火焰。"
 single_combat.0031.desc.sc_defender.POD_bark_mudpuppy: "这对我的对手似乎没什么影响，他很快就恢复了[sc_victor.GetHerHis]的攻势。"
 single_combat.0031.desc.sc_defender.POD_clap_of_thunder: "我的对手只是稳稳地站定双脚，忍受着这喧嚣。"
 single_combat.0031.desc.sc_defender.POD_dragon_slash: "我的对手早有准备，用[sc_victor.GetHerHis]的[sc_victor.Custom('signature_weapon')]格挡了我的猛攻。"
 single_combat.0031.desc.opponent_response.POD_dragons_breath: "[sc_victor.GetFirstNameNoTooltip]深吸一口气，朝我喷吐出一股巨大的火焰。"
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy: "[sc_victor.GetFirstNameNoTooltip]以一股意想不到的力量#italic 怒喝#!。"
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder: "[sc_victor.GetFirstNameNoTooltip] 双手一拍。"
 single_combat.0031.desc.opponent_response.POD_dragon_slash: "[sc_victor.GetFirstNameNoTooltip]神情严肃，[sc_victor.GetSheHe]以一阵猛烈的爪击朝我袭来。"
 single_combat.0031.desc.opponent_response.POD_dragons_breath.injury: "我闪身躲避，以免被烧成焦炭，但火焰还是燎到了我，留下了灼痛的伤痕。在下一波攻击把我变成一堆灰烬之前，我不得不认输退出。"
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.injury: "那噪音如此猛烈地撕扯着我的皮肤，仿佛被无数刀刃切割，伤口遍布全身。我咬紧牙关忍受着剧痛，[sc_victor.GetFirstNameNoTooltip]已准备好给予最后一击，我意识到自己彻底败了。"
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.injury: "震耳欲聋的巨响让我头晕目眩，耳鸣不止，视线也变得模糊不清。等我回过神来，[sc_victor.GetFirstNameNoTooltip]早已趁我分神之际，夺走了我的武器。"
 single_combat.0031.desc.opponent_response.POD_dragon_slash.injury: "我对[sc_victor.GetHerHis]的猛烈攻势毫无招架之力，当[sc_victor.GetSheHe]上前擒抱将我摔倒在地时，我不得不承认败北。"
 single_combat.0031.desc.opponent_response.POD_dragons_breath.fatality: "难以言喻的痛苦将我吞噬，烈焰如海般将我包围，在原地灼烧。我最后看到的，是自己在[sc_victor.GetFirstNamePossessiveNoTooltip]那双冷漠眼眸中摇曳的倒影。"
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.fatality: "那噪音如此猛烈地撕裂我的皮肤，伤口遍布全身，仿佛被无数刀刃切割。当我咬牙忍痛时，[sc_victor.GetFirstNameNoTooltip]发动了致命一击，[sc_victor.GetHerHis]的[sc_victor.Custom('signature_weapon')]直取我的咽喉。"
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.fatality: "震耳欲聋的轰鸣让我头晕目眩，双耳嗡鸣，视线模糊。在完全无法感知周遭环境与对手动向的情况下，我的生命就这样猝然熄灭。"
 single_combat.0031.desc.opponent_response.POD_dragon_slash.fatality: "我对[sc_victor.GetHerHis]的猛烈攻势毫无还手之力。[sc_victor.GetSheHe|U]持续不断地进攻，永不停歇，甚至在我被撕断双臂、开膛破肚，最终[sc_victor.GetSheHe]用我自己的脊椎骨将我活活打死时依然如此。"
 single_combat.0031.desc.sc_attacker.POD_dragons_breath: "我深吸一口气，朝着[sc_victor.GetFirstNameNoTooltip]的大致方位喷出一股巨大的火焰，但[sc_victor.GetSheHe]轻松地闪身躲开了。"
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy: "我竭尽全力向[sc_victor.GetFirstNameNoTooltip]高声怒吼，但[sc_victor.GetSheHe]却轻松化解了这次攻击。"
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder: "我双手合十，击出雷鸣般的声响，但[sc_victor.GetFirstNameNoTooltip]却显得不为所动。"
 single_combat.0031.desc.sc_attacker.POD_dragon_slash: "我以一连串流畅而精准的爪击扑向[sc_victor.GetFirstNameNoTooltip]，却徒劳无功。"
 single_combat.0031.desc.sc_attacker.POD_dragons_breath.injury: "\"也许我这次进攻太过冒进了。\"这是我最后的念头，随后[sc_victor.GetSheHe]逼近，将我击昏。"
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy.injury: "[sc_victor.GetSheHe|U]只是夸张地展示[sc_victor.GetHerHis]的肌肉，趁我恢复时一拳击中我的喉咙，就这样，决斗结束了。"
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder.injury: "[sc_victor.GetSheHe|U]无视了噪音的干扰，迅速发起反击，打得我措手不及，这场决斗就此告终。"
 single_combat.0031.desc.sc_attacker.POD_dragon_slash.injury: "[sc_victor.GetSheHe|U]借力打力，侧身一闪便轻叩我的后脑，宛如武学大师在训诫[sc_victor.GetHerHis]的弟子。"
 single_combat.0031.desc.sc_attacker.POD_dragons_breath.fatality: "\"也许我这次进攻太过冒进了\"这是我最后的念头，因为[sc_victor.GetSheHe]已逼近身前，将[sc_victor.GetHerHis]的武器刺入了我的喉咙。"
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy.fatality: "[sc_victor.GetSheHe|U]只是夸张地展示了一下[sc_victor.GetHerHis]的肌肉，趁我恢复之际割开了我的喉咙，就这样，我永远地沉默了。"
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder.fatality: "[sc_victor.GetSheHe|U]无视了噪音的冲击，发动一连串迅捷的反击，打得我见血。伴随着我声音的动摇，这场决斗几乎已经结束了。"
 single_combat.0031.desc.sc_attacker.POD_dragon_slash.fatality: "[sc_victor.GetSheHe|U]借我自身冲势反制，[sc_victor.GetSheHe]侧身举刃，当锋刃落向颈项之际，我心中唯余一念：这真是对骄兵必败最完美的诠释。"
 single_combat.0041.desc.sc_defender.POD_dragons_breath: "我朝着[sc_loser.GetFirstNamePossessiveNoTooltip]大致方位喷出一大股火焰，吓得[sc_loser.GetHerHim]惊慌失措。"
 single_combat.0041.desc.sc_defender.POD_bark_mudpuppy: "我提高嗓门，用尽全力向[sc_loser.GetFirstNameNoTooltip]怒吼，这足以让[sc_loser.GetHerHim]心神大乱，犯下致命的错误。"
 single_combat.0041.desc.sc_defender.POD_clap_of_thunder: "我双手一拍，一声突如其来的雷鸣巨响让[sc_loser.GetFirstNameNoTooltip]心神俱震。"
 single_combat.0041.desc.sc_defender.POD_dragon_slash: "我以一连串流畅而精准的爪击扑向[sc_loser.GetFirstNameNoTooltip]，而[sc_loser.GetHerHis]的反击显得完全徒劳无功。"
 single_combat.0041.desc.opponent_response.POD_dragons_breath: "[sc_loser.GetFirstNameNoTooltip]朝我喷出一团徒有其表的火焰，与其说是凶猛的巨龙，不如说更像是个耍把戏的江湖艺人。"
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy: "[sc_loser.GetFirstNameNoTooltip]用尽全力嘶吼，尽管那噪音冲击着我，我仍继续前进。"
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder: "[sc_loser.GetFirstNameNoTooltip]双手一拍，试图用震耳欲聋的声响让我失去平衡，但我岿然不动。"
 single_combat.0041.desc.opponent_response.POD_dragon_slash: "[sc_loser.GetFirstNameNoTooltip]以一连串流畅而精准的爪击向我袭来，但[sc_loser.GetSheHe]并未意识到，[sc_loser.GetHerHis]前冲的势头让[sc_loser.GetHerselfHimself]门户大开。"
 single_combat.0041.desc.opponent_response.POD_dragons_breath.injury: "我利用[sc_loser.GetHerHis]过度投入的破绽，在[sc_loser.GetHerHis]喉咙仍发着光时将其击晕。"
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.injury: "我拉近距离，一记手刀劈在[sc_loser.GetHerHim]的喉咙上让其噤声。请别再嚷嚷了。"
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.injury: "这雷声似乎对[sc_loser.GetHerHim]的影响比对我更大，我迅捷的反击几乎没有遇到任何抵抗。决斗在片刻间便已结束。"
 single_combat.0041.desc.opponent_response.POD_dragon_slash.injury: "我只需侧身一步，然后像武术大师教训徒弟那样，在[sc_loser.GetHerHim]后脑勺上轻轻敲一下。"
 single_combat.0041.desc.opponent_response.POD_dragons_breath.fatality: "我趁[sc_loser.GetHerHis]攻势过猛之际，一剑刺入[sc_loser.GetHerHis]尚在发光的咽喉。龙斩。"
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.fatality: "我逼近距离，扼住[sc_loser.GetHerHis]的喉咙令其噤声。[sc_loser.GetSheHe|U]再也无法发出呼喊。"
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.fatality: "这雷声似乎对[sc_loser.GetHerHim]的影响比对我更大，我迅捷的反击几乎没有遇到抵抗。顷刻之间，我的[sc_victor.Custom('signature_weapon')]便刺入血肉，决斗就此结束。"
 single_combat.0041.desc.opponent_response.POD_dragon_slash.fatality: "侧身闪避，将武器挥向[sc_loser.GetHerHis]毫无防备的脖颈简直易如反掌。值得称道的是，[sc_loser.GetHerHis]身躯仍向前滑行了一小段距离，仿佛在印证这一击蕴含的力道。"
 single_combat.0041.desc.sc_attacker.POD_dragons_breath: "我深吸一口气，朝着[sc_loser.GetFirstNameNoTooltip]的大致方位喷出一股熊熊烈焰。"
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy: "我提高嗓门，用尽全力朝[sc_loser.GetFirstNameNoTooltip]怒吼，将一声咆哮凝聚成撕裂血肉的武器。"
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder: "我双手一拍，一声突如其来的雷鸣巨响让[sc_loser.GetFirstNameNoTooltip]心神俱震。"
 single_combat.0041.desc.sc_attacker.POD_dragon_slash: "忆起所受的训练，我向[sc_loser.GetFirstNameNoTooltip]猛扑过去，利爪连番挥出流畅而精准的斩击，将沉稳的技巧与原始的力量融为一体。"
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.injury: "[sc_loser.GetSheHe|U] 勉强闪开，却还是慢了一步。火焰擦过[sc_loser.GetHerHim]的侧腹，对手不得不在我下一次吐息造成更大伤害前认输。"
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.injury: "[sc_loser.GetSheHe|U]咬紧牙关，浑身上下皮开肉绽，这一瞬间的分神足以让我将武器抵上[sc_loser.GetHerHis]的咽喉。"
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.injury: "[sc_loser.GetSheHe|U]毫无反抗地被我缴械，这场决斗以令人扫兴的方式草草收场。"
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.injury: "[sc_loser.GetSheHe|U]很快便招架不住，毫无还手之力，甚至在我上前擒抱并将[sc_loser.GetHerHis]摔倒在地时也无力抵抗。我赢了。"
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.fatality: "[sc_loser.GetSheHe|U]正被困在火海中央，我听到了[sc_loser.GetHerHis]痛苦的绝望尖叫，随后一切归于沉寂。"
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.fatality: "[sc_loser.GetSheHe|U]咬紧牙关，伤口在[sc_loser.GetHerHis]皮肤上绽开，这一瞬间的分神足以让我将武器刺穿[sc_loser.GetHerHis]的喉咙。"
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.fatality: "[sc_loser.GetSheHe|U]毫无反抗，我轻易地斩下了[sc_loser.GetHerHim]的首级，这场决斗以令人扫兴的方式告终。"
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.fatality: "[sc_loser.GetSheHe|U]对我的攻击毫无反应，甚至在我扯下[sc_loser.GetHerHis]双臂、剖开[sc_loser.GetHerHim]腹腔、用[sc_loser.GetHerHis]自己的脊椎将[sc_loser.GetHerHim]活活打死时，也未曾做出任何抵抗。"