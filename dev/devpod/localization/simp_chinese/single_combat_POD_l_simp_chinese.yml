 single_combat.0031.desc.sc_defender.POD_feral_weapons: "晓得危险，我的敌人巧妙地躲开了我致命的利爪。"
 single_combat.0031.desc.sc_defender.POD_shapechange: "在动物本能的支配下，我的攻击是强力的，但缺乏足够的精准，没法命中。"
 single_combat.0031.desc.sc_defender.POD_vanish: "察觉到了微小的不致之处，我的对手设法发现了我。"
 single_combat.0031.desc.sc_defender.POD_nocturne: "我的敌人似乎几乎没有被暗影所拖累，仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_defender.POD_arms_of_ahriman: "迅速移开，我的对手设法摆脱了触手的束缚。"
 single_combat.0031.desc.sc_defender.POD_the_darkness_within: "没有破绽，我的敌人近乎完美地避开了回旋的暗影。"
 single_combat.0031.desc.sc_defender.POD_aegis_of_shadows: "如同光驱散黑暗，我的对手强大的攻击击碎了我的暗影盔甲。"
 single_combat.0031.desc.sc_defender.POD_compel: "由于其顽强的意志力，我的对手无视了我的命令。"
 single_combat.0031.desc.sc_defender.POD_terminal_decree: "由于其顽强的意志力，我的对手无视了我的命令。"
 single_combat.0031.desc.sc_defender.POD_daunt: "我的对手完全没有被我的强化所吓倒，仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_defender.POD_dread_gaze: "我的对手实际上似乎很喜欢把他最惧怕的噩梦打成肉酱，使得恐惧目光相当无用。"
 single_combat.0031.desc.sc_defender.POD_extinguish_vitae: "我对手的血对这些花招来说太强了，其血还如原样。"
 single_combat.0031.desc.sc_defender.POD_scorpions_touch: "如果你不会用毒，那再致命也没用，你的对手非常小心地避开了你的下一击。"
 single_combat.0031.desc.sc_defender.POD_theft_of_vitae: "我对手的血对这些花招来说太强了，其血还在原躯。"
 single_combat.0031.desc.sc_defender.POD_baals_curse: "如果你不会用毒，那再致命也没用，你的对手非常小心地避开了你的下一击。"
 single_combat.0031.desc.sc_defender.POD_cauldron_of_blood: "我对手的血对我来说太强了，尽管我尽了最大努力，其血仍然是冷的。"
 single_combat.0031.desc.sc_defender.POD_touch_of_oblivion: "湮灭之触甚至都没能给我的对手造成擦伤，真是无用。"
 single_combat.0031.desc.sc_defender.POD_stygian_shroud: "即使其的感官被障壁所遮断，我的对手仍然如同最佳状态一般战斗。"
 single_combat.0031.desc.sc_defender.POD_fire_torch: "这次并不幸运，我的火把被毫不费力地躲开了。"
 single_combat.0031.desc.sc_defender.POD_fire_bombs: "我的敌人轻而易举地躲过了这一小块的调制物。"
 single_combat.0031.desc.sc_defender.POD_fire_spewer: "在疯狂的不准确的瞄准下，弹药甚至没有打近它的预定目标。"
 single_combat.0031.desc.sc_defender.POD_crossbow_shot: "这一射远远偏离了预定目标。"
 single_combat.0031.desc.sc_defender.POD_unleash_dogs: "这些动物很快就被打发了。"
 single_combat.0031.desc.sc_defender.POD_stake_attack: "我鲁莽的攻击很容易就被躲开了。"
 single_combat.0031.desc.sc_defender.POD_oculi_trust: "不过，这似乎并不能真正阻止其很长时间。"
