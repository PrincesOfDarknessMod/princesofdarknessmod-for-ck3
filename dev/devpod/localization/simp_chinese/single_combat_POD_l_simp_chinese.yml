l_simp_chinese:
 single_combat.0001.POD_bite: "我的利齿就足以对付你了！"
 single_combat.0001.tt.POD_bite: "#D 你咬了[my_foe.GetFirstName]。#!"
 single_combat.0001.tt.POD_bite.beast: "#beast 咬！咬！咬！#!"
 single_combat.0001.POD_blood_surge: "我的血将给予我力量"
 single_combat.0001.tt.POD_blood_surge: "#D 你激涌起你的血并变得更强了#!"
 single_combat.0001.tt.POD_blood_surge.beast: "#beast 我们会用这份力量碾碎一切！#!"
 single_combat.0001.POD_blood_heal: "回复时间到"
 single_combat.0001.tt.POD_blood_heal: "#D 你治愈了你的伤口#!"
 single_combat.0001.tt.POD_blood_heal.beast: "#beast 区区小伤对我们不值一提！#!"
 single_combat.0001.POD_blink: "你都见不到我出手！"
 single_combat.0001.tt.POD_blink: "#D 通过你的迅捷术力量，[my_foe.GetFirstName]还没注意到就被你攻击了#!"
 single_combat.0001.tt.POD_blink.beast: "#beast [my_foe.GetSheHe]都见不到我们出手！#!"
 single_combat.0001.POD_lightning_strike: "我将神速一击！"
 single_combat.0001.tt.POD_lightning_strike: "#D 通过你的迅捷术力量，你将以[my_foe.GetSheHe]没能反应的速度攻击[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_lightning_strike.beast: "#beast 瞬闪一击！#!"
 single_combat.0001.POD_split_second: "迅如疾风！"
 single_combat.0001.tt.POD_split_second: "#D 通过你的迅捷术力量，你将变得超快，以至于[my_foe.GetFirstName]都反应不能#!"
 single_combat.0001.tt.POD_split_second.beast: "#beast 我等既快又猛！#!"
 single_combat.0001.POD_unerring_aim: "必中！"
 single_combat.0001.tt.POD_unerring_aim: "#D 你以非自然的准头击向了[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_unerring_aim.beast: "#beast 我等必中！#!"
 single_combat.0001.POD_lethal_body: "我要灭了你！"
 single_combat.0001.tt.POD_lethal_body: "#D 你攻向了[my_foe.GetFirstName]，徒手切开[my_foe.GetHerHis]的肉体。#!"
 single_combat.0001.tt.POD_lethal_body.beast: "#beast 手撕[my_foe.GetHerHim]！就现在！#!"
 single_combat.0001.POD_brutal_feed: "我要吸干你！"
 single_combat.0001.tt.POD_brutal_feed: "#D 通过你的蛮力术力量，你可以迅速吸取[my_foe.GetFirstNamePossessive]的部分血液#!"
 single_combat.0001.tt.POD_brutal_feed.beast: "#beast 好！我们将大快朵颐！#!"
 single_combat.0001.POD_earthshock: "我将劈开大地！"
 single_combat.0001.tt.POD_earthshock: "#D 你做出引起地震的强烈攻击#!"
 single_combat.0001.tt.POD_earthshock.beast: "#beast 地面无法承受我们的力量！#!"
 single_combat.0001.POD_fist_of_caine: "我要手撕你！"
 single_combat.0001.tt.POD_fist_of_caine: "#D 你用能够手撕对方的如此之强的力量攻击[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_fist_of_caine.beast: "#beast 手撕[my_foe.GetHerHim]！就现在！#!"
 single_combat.0001.POD_toughness: "伤我可不容易！"
 single_combat.0001.tt.POD_toughness: "#D 你调用你的血来变得更坚韧#!"
 single_combat.0001.tt.POD_toughness.beast: "#beast 盔甲有何用？#!"
 single_combat.0001.POD_flesh_of_marble: "你伤不了我！"
 single_combat.0001.tt.POD_flesh_of_marble: "#D 你的皮肤变得几乎无坚不摧#!"
 single_combat.0001.tt.POD_flesh_of_marble.beast: "#beast 没人能摧毁我们！#!"
 single_combat.0001.POD_prowess_from_pain: "受伤只会让我变得更强！"
 single_combat.0001.tt.POD_prowess_from_pain: "#D 你将从你的伤口获得额外的力量#!"
 single_combat.0001.tt.POD_prowess_from_pain.beast: "#beast 一点小伤没法阻碍我们！#!"
 single_combat.0001.POD_feral_weapons: "我的利爪将抓伤你！"
 single_combat.0001.tt.POD_feral_weapons: "#D 你调用你的天然武器来攻击[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_feral_weapons.beast: "#beast 狩猎时间到！#!"
 single_combat.0001.POD_shapechange: "我将变兽！"
 single_combat.0001.tt.POD_shapechange: "#D 你转变成一种可怖的动物形态来攻击[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_shapechange.beast: "#beast 猛兽来了！#!"
 single_combat.0001.POD_vanish: "你看不到我！"
 single_combat.0001.tt.POD_vanish: "#D 你消失了#!"
 single_combat.0001.tt.POD_vanish.beast: "#beast 猎物可见不着猎人#!"
 single_combat.0001.POD_nocturne: "你无法逃离我的暗影！"
 single_combat.0001.tt.POD_nocturne: "#D 你招出一片能取走[my_foe.GetFirstNamePossessive]能量的可怕暗影#!"
 single_combat.0001.tt.POD_nocturne.beast: "#beast [my_foe.GetSheHe]将害怕黑暗#!"
 single_combat.0001.POD_arms_of_ahriman: "连影子也将攻击你！"
 single_combat.0001.tt.POD_arms_of_ahriman: "#D 你召唤出暗影触手来攻击你的敌人#!"
 single_combat.0001.tt.POD_arms_of_ahriman.beast: "#beast 即使影子也听从我们！#!"
 single_combat.0001.POD_the_darkness_within: "黑暗使我更强！"
 single_combat.0001.tt.POD_the_darkness_within: "#D 你吸收影子并变得更强了#!"
 single_combat.0001.tt.POD_the_darkness_within.beast: "#beast 我等即是黑暗！#!"
 single_combat.0001.POD_aegis_of_shadows: "你无法穿透我的暗影盔甲！"
 single_combat.0001.tt.POD_aegis_of_shadows: "#D 你召唤暗影盔甲来保护你#!"
 single_combat.0001.tt.POD_aegis_of_shadows.beast: "#beast 暗影将护佑我们！#!"
 single_combat.0001.POD_compel: "听从于我！"
 single_combat.0001.tt.POD_compel: "#D 你下达了简单的命令来获得对[my_foe.GetFirstName]的优势#!"
 single_combat.0001.tt.POD_compel.beast: "#beast 我们统御一切！#!"
 single_combat.0001.POD_terminal_decree: "伤害自己！"
 single_combat.0001.tt.POD_terminal_decree: "#D 你命令[my_foe.GetFirstName]去伤害[my_foe.GetHerselfHimself]自己#!"
 single_combat.0001.tt.POD_terminal_decree.beast: "#beast 我们有着绝对的控制！#!"
 single_combat.0001.POD_daunt: "我即是你的至暗恐惧！"
 single_combat.0001.tt.POD_daunt: "#D 你调用了你的威仪术力量来威吓[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_daunt.beast: "#beast 我们是[my_foe.GetHerHis]最害怕的恐惧！#!"
 single_combat.0001.POD_dread_gaze: "看着我的眼睛！"
 single_combat.0001.tt.POD_dread_gaze: "#D 通过你的威仪术力量，你将[my_foe.GetFirstName]凝固于一处#!"
 single_combat.0001.tt.POD_dread_gaze.beast: "#beast 我们双眼如蛇！#!"
 single_combat.0001.POD_extinguish_vitae: "给我你的血！"
 single_combat.0001.tt.POD_extinguish_vitae: "#D 你偷走了[my_foe.GetFirstName]一部分的血#!"
 single_combat.0001.tt.POD_extinguish_vitae.beast: "#beast 血！终于！#!"
 single_combat.0001.POD_scorpions_touch: "一点毒液就能对付你！"
 single_combat.0001.tt.POD_scorpions_touch: "#D 你毒害了[my_foe.GetFirstName]#!"
 single_combat.0001.tt.POD_scorpions_touch.beast: "#beast 我们直击如蝎！#!"
 single_combat.0001.POD_theft_of_vitae: "你的血将是我的！"
 single_combat.0001.tt.POD_theft_of_vitae: "#D 你偷走了[my_foe.GetFirstName]的一部分血，并在过程中伤害[my_foe.GetHerHim]#!"
 single_combat.0001.tt.POD_theft_of_vitae.beast: "#beast 血！我们将大快朵颐！#!"
 single_combat.0001.POD_baals_curse: "你无法抵抗我的毒！"
 single_combat.0001.tt.POD_baals_curse: "#D 你于[my_foe.GetFirstName]施加了强力的毒#!"
 single_combat.0001.tt.POD_baals_curse.beast: "#beast 你将因痛苦而嚎！#!"
 single_combat.0001.POD_cauldron_of_blood: "你的血将沸腾！"
 single_combat.0001.tt.POD_cauldron_of_blood: "#D 通过血术法的力量，你将沸腾[my_foe.GetFirstNamePossessive]体内的血#!"
 single_combat.0001.tt.POD_cauldron_of_blood.beast: "#beast 你将熟！#!"
 single_combat.0001.POD_touch_of_oblivion: "我的触碰将摧毁你的身体！"
 single_combat.0001.tt.POD_touch_of_oblivion: "#D 你使用你的湮灭术力量，触碰[my_foe.GetFirstName]来造成伤害#!"
 single_combat.0001.tt.POD_touch_of_oblivion.beast: "#beast 凋零！#!"
 single_combat.0001.POD_stygian_shroud: "黑暗将为你而来！"
 single_combat.0001.tt.POD_stygian_shroud: "#D 通过你的湮灭术力量，你召唤了让[my_foe.GetFirstName]盲目的黑暗#!"
 single_combat.0001.tt.POD_stygian_shroud.beast: "#beast 黑暗将袭击[my_foe.GetHerHim]！#!"
 single_combat.0001.POD_fire_torch: "天主之火将驱逐你！"
 single_combat.0001.tt.POD_fire_torch: "#D 你疯狂地挥舞着光炬。#!"
 single_combat.0001.POD_fire_bombs: "该调和物应该有效……"
 single_combat.0001.tt.POD_fire_bombs: "#D 你掷出一些炼金火。#!"
 single_combat.0001.POD_fire_spewer: "火！火！火！"
 single_combat.0001.tt.POD_fire_spewer: "#D 你使用了你的临时喷火器。#!"
 single_combat.0001.POD_crossbow_shot: "稳住，瞄准……开火！"
 single_combat.0001.tt.POD_crossbow_shot: "#D 弩箭将被射出。#!"
 single_combat.0001.POD_unleash_dogs: "放出战犬！"
 single_combat.0001.tt.POD_unleash_dogs: "#D 字面意思上的血肉造物。#!"
 single_combat.0001.POD_stake_attack: "我知道你的弱点！"
 single_combat.0001.tt.POD_stake_attack: "#D 你将尖桩对准了对方心脏。#!"
 single_combat.0001.POD_oculi_trust: "赞美天主！"
 single_combat.0001.tt.POD_oculi_trust: "#D 你尝试强制使对方为其的罪忏悔。#!"
 single_combat.0001.POD_oculi_wine: "生命将放逐死亡！"
 single_combat.0001.tt.POD_oculi_wine: "#D 你尝试触碰对方来转变他的血肉。#!"
 single_combat.0001.POD_acre_catechumen: "主即我剑！"
 single_combat.0001.tt.POD_acre_catechumen: "#D 通过祈祷，你尝试强化你的能力。#!"
 single_combat.0001.POD_acre_flesh: "主即我盾！"
 single_combat.0001.tt.POD_acre_flesh: "#D 通过祈祷，你尝试强化你的能力。#!"
 single_combat.0001.POD_acre_flight: "吾乃天主之怒！"
 single_combat.0001.tt.POD_acre_flight: "#D 你成为火与剑的神圣旋风。#!"
 single_combat.0001.POD_acre_auto: "……肃静"
 single_combat.0001.tt.POD_acre_auto: "#D 你沉寂了所有的想法，只专注于这场决斗的终结一击。#!"
 single_combat.0001.POD_murnau_mirror: "你偷走的力量是我的了！"
 single_combat.0001.tt.POD_murnau_mirror: "#D 你尝试强化你自己到同级于你的对手#!"
 single_combat.0001.POD_murnau_arcana: "你的力量变换无常……"
 single_combat.0001.tt.POD_murnau_arcana: "#D 你尝试让你对手的能力对付其自己。#!"
 single_combat.0001.POD_sisters_hosanna: "主将赐予你力量"
 single_combat.0001.tt.POD_sisters_hosanna: "#D 你赞颂着天主的荣光，期望祂回应。#!"
 single_combat.0001.POD_sisters_oratorio: "唱诵天主之歌。"
 single_combat.0001.tt.POD_sisters_oratorio: "#D 这首圣洁的赞美诗可能会使这些不洁的生物受残害。#!"
 single_combat.0001.POD_bone_obedience: "我无敌了！"
 single_combat.0001.tt.POD_bone_obedience: "#D 你使你的骨骼结构钙化，像岩石晶体一样增长。#!"
 single_combat.0001.POD_five_poison_cloud: "我呸！"
 single_combat.0001.tt.POD_five_poison_cloud: "#D 你喷吐出一阵高度浓缩的阴气吐息#!"
 single_combat.0001.POD_ching_shih: "吾将化僵……"
 single_combat.0001.tt.POD_ching_shih: "#D 你转变成魃犼僵尸形态，畸形但加强版的你真实自我。#!"
 single_combat.0001.POD_long_neck: "触手及远。"
 single_combat.0001.tt.POD_long_neck: "#D 你延伸你的四肢或颈部到令人印象深刻的长度#!"
 single_combat.0001.POD_bloodlash: "血即吾兵。"
 single_combat.0001.tt.POD_bloodlash: "#D 允许你制造出致命的血鞭。#!"
 single_combat.0001.POD_goblin_scorch: "焚烧吧！"
 single_combat.0001.tt.POD_goblin_scorch: "#D 你喷出一团真火。#!"
 single_combat.0001.POD_goblin_lantern: "吾将化身为火！"
 single_combat.0001.tt.POD_goblin_lantern: "#D 你暂时进入自焚状态，允许你变成一团鬼火太阳。#!"
 single_combat.0001.POD_bone_dance: "该睡了。"
 single_combat.0001.tt.POD_bone_dance: "#D 通过仪式，你试图让每个人都变得昏昏欲睡。#!"
 single_combat.0001.POD_dragon_dance: "该来真的了。"
 single_combat.0001.tt.POD_dragon_dance: "#D 你进入战斗专注状态。#!"
 single_combat.0001.POD_chi_interrupt: "点穴！"
 single_combat.0001.tt.POD_chi_interrupt: "#D 你试图阻止对手体内的气的流动，造成痛苦的痉挛。#!"
 single_combat.0001.POD_thousand_hell_stare: "感受吾痛！"
 single_combat.0001.tt.POD_thousand_hell_stare: "#D 你把你的负面精神能量像刀子一样掷到受害者的灵魂中。#!"
 single_combat.0001.POD_wind_attack: "你跟的上么？"
 single_combat.0001.tt.POD_wind_attack: "#D 通过使用妖风，你以超自然速度移动。#!"
 single_combat.0001.POD_demon_claws: "我受够了！"
 single_combat.0001.tt.POD_demon_claws: "#D 你转变出你的魔态，尝试劈开你的对手。#!"
 single_combat.0001.POD_tormented_essence: "感受吾痛！"
 single_combat.0001.tt.POD_tormented_essence: "#D 你把你的负面精神能量像刀子一样掷到受害者的灵魂中。#!"
 single_combat.0001.desc.my_feedback.POD_bite: "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0001.desc.my_feedback.POD_blood_surge: "我催动了我的血之力获得力量。"
 single_combat.0001.desc.my_feedback.POD_blood_heal: "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0001.desc.my_feedback.POD_blink: "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0001.desc.my_feedback.POD_lightning_strike: "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0001.desc.my_feedback.POD_split_second: "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0001.desc.my_feedback.POD_unerring_aim: "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0001.desc.my_feedback.POD_lethal_body: "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0001.desc.my_feedback.POD_brutal_feed: "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0001.desc.my_feedback.POD_earthshock: "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0001.desc.my_feedback.POD_fist_of_caine: "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0001.desc.my_feedback.POD_toughness: "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0001.desc.my_feedback.POD_flesh_of_marble: "我的肉体转换为超自然的坚石，应该不再会受任何伤害。"
 single_combat.0001.desc.my_feedback.POD_prowess_from_pain: "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0001.desc.my_feedback.POD_feral_weapons: "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0001.desc.my_feedback.POD_shapechange: "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0001.desc.my_feedback.POD_vanish: "我从视线中消失，试图迷惑我的对手。"
 single_combat.0001.desc.my_feedback.POD_nocturne: "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0001.desc.my_feedback.POD_arms_of_ahriman: "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0001.desc.my_feedback.POD_the_darkness_within: "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0001.desc.my_feedback.POD_aegis_of_shadows: "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0001.desc.my_feedback.POD_compel: "我向我的对手发出了简短的命令。"
 single_combat.0001.desc.my_feedback.POD_terminal_decree: "我向我的对手发出命令，让其伤害自己。"
 single_combat.0001.desc.my_feedback.POD_daunt: "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0001.desc.my_feedback.POD_dread_gaze: "我显现为我敌人最惧怕的噩梦。"
 single_combat.0001.desc.my_feedback.POD_extinguish_vitae: "我手一挥，使我对手的血液静止了。"
 single_combat.0001.desc.my_feedback.POD_scorpions_touch: "我抽出一些我的血，将它转化为毒。"
 single_combat.0001.desc.my_feedback.POD_theft_of_vitae: "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0001.desc.my_feedback.POD_baals_curse: "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0001.desc.my_feedback.POD_cauldron_of_blood: "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0001.desc.my_feedback.POD_touch_of_oblivion: "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0001.desc.my_feedback.POD_stygian_shroud: "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0001.desc.my_feedback.POD_fire_torch: "我疯狂地挥舞火炬期望能幸运的击中。"
 single_combat.0001.desc.my_feedback.POD_fire_bombs: "我向我的对手丢出炼金火。"
 single_combat.0001.desc.my_feedback.POD_fire_spewer: "奇怪的机器开始疯狂喷火"
 single_combat.0001.desc.my_feedback.POD_crossbow_shot: "我对着目标一箭射出。"
 single_combat.0001.desc.my_feedback.POD_unleash_dogs: "充满着对血和肉的渴望，这些狗冲向我的敌人。"
 single_combat.0001.desc.my_feedback.POD_stake_attack: "我带着尖桩向前冲出。"
