 single_combat.0001.POD_snout_strike: "断吻击！"
 single_combat.0001.tt.POD_snout_strike: "#D 你试着对口吻打出短而恶毒的刺拳，或者直接抓取。#!"
 single_combat.0001.POD_chi_breaker: "破炁式！"
 single_combat.0001.tt.POD_chi_breaker: "#D 你试图将一只手插入鬼神的躯干，破坏妖魔的内气流。#!"
 single_combat.0001.POD_hundred_star_shower: "千星雨！"
 single_combat.0001.tt.POD_hundred_star_shower: "#D 你用你的生命力给飞镖充能。#!"
 single_combat.0001.POD_jaw_hammer: "碎颚捶！"
 single_combat.0001.tt.POD_jaw_hammer: "#D 你试图做出旨在粉碎目标颌骨的强而有力的一击。#!"
 single_combat.0001.POD_fading_light_strike: "晦明击！"
 single_combat.0001.tt.POD_fading_light_strike: "#D 你尝试从你对手处窃走能量。#!"
 single_combat.0001.POD_chain_snake: "天蛇索！"
 single_combat.0001.tt.POD_chain_snake: "#D 你试图挡住对手的攻击，同时抓住攻击的肢体。同时让链索的另一端进行反击。#!"
 single_combat.0001.POD_twisting_thrust: "恶旋式！"
 single_combat.0001.tt.POD_twisting_thrust: "#D 你试图深深地切入对手的身体，转动你的武器的刀刃以造成巨大的伤害。#!"
 single_combat.0001.POD_prone_attacks: "地趟式！"
 single_combat.0001.tt.POD_prone_attacks: "#D 你躺平面对站着的对手，并保持这样继续战斗。#!"
 single_combat.0001.POD_dagger_claw: "宝匕爪！"
 single_combat.0001.tt.POD_dagger_claw: "#D 你将两只手的手指以更大的弧度展开，并将它们插入你对手的腹部。#!"
