 single_combat.0031.desc.sc_defender.POD_bite: "我的对手毫不费力地躲开了我的前扑，并具有了反击的机会。"
 single_combat.0031.desc.sc_defender.POD_blood_surge: "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_defender.POD_blood_heal: "我没能催起我体内的血，因为我需要每一份注意力来保持对敌人的优势。"
 single_combat.0031.desc.sc_defender.POD_blink: "过快过速，我偏离了原本锁定的位置。"
 single_combat.0031.desc.sc_defender.POD_lightning_strike: "我的攻击，虽然快，但没准头，打空了。"
 single_combat.0031.desc.sc_defender.POD_split_second: "尽管时间的流逝有偏差，但我的敌人却似乎适应得相当好。"
 single_combat.0031.desc.sc_defender.POD_unerring_aim: "绝对精准……但缺乏强度，勉强擦伤目标。"
 single_combat.0031.desc.sc_defender.POD_lethal_body: "如果没有精确度，强度就什么都不是，因为我强力的攻击没有击中目标。"
 single_combat.0031.desc.sc_defender.POD_brutal_feed: "我的獠牙错过了对手的脖子，使其了有机会进行反击。"
 single_combat.0031.desc.sc_defender.POD_earthshock: "保持平稳，我的对手几乎没有受到地震的影响。"
 single_combat.0031.desc.sc_defender.POD_fist_of_caine: "我蛮力术强化的攻击所带起的风对我的敌人来说如同春风一般。"
 single_combat.0031.desc.sc_defender.POD_toughness: "尽管我的韧性被增强，但对手强大的攻击仍然让我痛不欲生。"
 single_combat.0031.desc.sc_defender.POD_flesh_of_marble: "坚石可以被击碎，正如我的对手现在那开天辟地的一击所要证明的那样。"
