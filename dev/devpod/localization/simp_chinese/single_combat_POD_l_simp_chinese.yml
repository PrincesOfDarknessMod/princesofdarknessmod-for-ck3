 single_combat.0001.desc.my_feedback.POD_acre_auto: "我准备好了最后一击。"
 single_combat.0001.desc.my_feedback.POD_murnau_mirror: "天主之镜为我指明了与这个魔物的勇武相匹配的途径。"
 single_combat.0001.desc.my_feedback.POD_murnau_arcana: "我准备好接管这个魔物的力量了。"
 single_combat.0001.desc.my_feedback.POD_sisters_hosanna: "我歌颂天主的荣耀，这使我充满了力量。"
 single_combat.0001.desc.my_feedback.POD_sisters_oratorio: "我歌颂天主的荣耀，这使我敌人充满了惊恐。"
 single_combat.0001.desc.my_feedback.POD_bone_obedience: "我的骨头开始变得牢不可破。"
 single_combat.0001.desc.my_feedback.POD_five_poison_cloud: "阴气云雾向我敌人飘了过去。"
 single_combat.0001.desc.my_feedback.POD_ching_shih: "当前这可怖的怪物形态就是我"
 single_combat.0001.desc.my_feedback.POD_long_neck: "我伸展我的四肢，让我能无不可及。"
