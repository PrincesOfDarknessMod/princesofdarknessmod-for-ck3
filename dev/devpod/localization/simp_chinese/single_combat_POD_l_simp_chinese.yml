 single_combat.0041.desc.opponent_response.POD_blood_surge: "我的敌人催动了其血之力来给予其力量。"
 single_combat.0041.desc.opponent_response.POD_blood_heal: "我的敌人催动了其血之力来缝合其的伤口。"
