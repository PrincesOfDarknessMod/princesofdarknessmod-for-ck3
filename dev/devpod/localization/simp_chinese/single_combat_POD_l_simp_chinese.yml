 single_combat.0001.desc.my_feedback.POD_oculi_wine: "我向我的对手冲去，想要碰到其便我的诅咒能够生效。"
 single_combat.0001.desc.my_feedback.POD_acre_catechumen: "天主之语被口述而出，给予了我力量。"
 single_combat.0001.desc.my_feedback.POD_acre_flesh: "天主之语被口述而出，给予了我坚韧。"
