 single_combat.0041.desc.opponent_response.POD_bite.injury: "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。在为时已晚之前，其勉强从这个致命的擒抱中抽身而出。"
 single_combat.0041.desc.opponent_response.POD_blood_surge.injury: "我可以看到我变得更高、更强，被血赋予了力量。我迅速地利用了我的优势。"
 single_combat.0041.desc.opponent_response.POD_blood_heal.injury: "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速的利用了我的优势。"
 single_combat.0041.desc.opponent_response.POD_blink.injury: "而其没料到，在狂攻之下，其很快就沦落到需要进行回复的地步。"
 single_combat.0041.desc.opponent_response.POD_lightning_strike.injury: "而我做到了，我的敌人很快就被该出其不意的攻击击退。"
 single_combat.0041.desc.opponent_response.POD_split_second.injury: "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。"
 single_combat.0041.desc.opponent_response.POD_unerring_aim.injury: "我的对手什么也做不了，只能接招，感得其的不死族肉体在抗议这种虐待。"
 single_combat.0041.desc.opponent_response.POD_lethal_body.injury: "我的对手勉强的站起来了，感觉像是一整栋屋子垮在了其身上。"
 single_combat.0041.desc.opponent_response.POD_brutal_feed.injury: "我的对手设法从该致命的擒抱中挣脱了出来，但还是感受到了我的獠牙所带来的剧痛。"
 single_combat.0041.desc.opponent_response.POD_earthshock.injury: "我的对手摔倒了，而我利用了这个机会残酷地攻击。其勉强避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.injury: "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。"
 single_combat.0041.desc.opponent_response.POD_toughness.injury: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.injury: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.injury: "在这种可怕力量的推动下，我打出了可怕的一击，让我的对手踉跄后退。"
 single_combat.0041.desc.opponent_response.POD_feral_weapons.injury: "它近乎发生了，因为我的敌人勉强设法避免了绝对致命的一扫。"
 single_combat.0041.desc.opponent_response.POD_shapechange.injury: "我的对手被这突如其来的变化惊呆了，被我击中了，不得不用尽全力地推开我变成的怪物。"
 single_combat.0041.desc.opponent_response.POD_vanish.injury: "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.opponent_response.POD_nocturne.injury: "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.injury: "我的毒死后避开了其中一条，但没能避开第二条……而这些东西打人很疼。"
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.injury: "它突然地冲进了我对手的喉中，其不得不动用其所有的意志力来驱赶它。"
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.injury: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.opponent_response.POD_compel.injury: "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.opponent_response.POD_terminal_decree.injury: "其顺从地做了，感到更多的是羞辱而不是痛苦。"
 single_combat.0041.desc.opponent_response.POD_daunt.injury: "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.opponent_response.POD_dread_gaze.injury: "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.injury: "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。"
 single_combat.0041.desc.opponent_response.POD_scorpions_touch.injury: "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae.injury: "我敌人无力阻止它，其宝贵的血是我的了！"
 single_combat.0041.desc.opponent_response.POD_baals_curse.injury: "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.injury: "烫！烫！"
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.injury: "我敌人的血中突然混入了恶性的暗影，试图占据其的身体。这不是一个愉快的经历。"
 single_combat.0041.desc.opponent_response.POD_stygian_shroud.injury: "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.opponent_response.POD_fire_torch.injury: "我对手险险的避开了它，但一些火焰还是伤到了其的肉体。"
 single_combat.0041.desc.opponent_response.POD_fire_bombs.injury: "我对手险险的避开了它，但一些火焰还是伤到了其的肉体。"
 single_combat.0041.desc.opponent_response.POD_fire_spewer.injury: "我对手险险的避开了它，但一些火焰还是伤到了其的肉体。"
 single_combat.0041.desc.opponent_response.POD_crossbow_shot.injury: "它以响亮一声击中了我敌人，这一回合其已落入下风。"
 single_combat.0041.desc.opponent_response.POD_unleash_dogs.injury: "我对手打发了它们，但不够快，它们已经在其身上撕咬了一阵子。"
 single_combat.0041.desc.opponent_response.POD_stake_attack.injury: "尖桩没有击中我对手的心脏，但仍然相当痛苦地伤了其。"
 single_combat.0041.desc.opponent_response.POD_oculi_trust.injury: "因此，我敌人没能避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_oculi_wine.injury: "我对手受伤了，而其肉体的一部分在其能做任何事前变成了灰。"
 single_combat.0041.desc.opponent_response.POD_acre_catechumen.injury: "向我敌人袭来的下一击特别疼痛。"
 single_combat.0041.desc.opponent_response.POD_acre_flesh.injury: "我敌人没能打破我的防御，而反击则很伤。"
 single_combat.0041.desc.opponent_response.POD_acre_flight.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_acre_auto.injury: "没成，但是它的冲击依然让我敌人非常疼痛。"
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.injury: "因此，我敌人没能避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.injury: "意外的一击，反噬对我对手造成的伤害很大。"
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.injury: "向我敌人袭来的下一击特别疼痛。"
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_bone_obedience.injury: "我敌人没能打破我的防御，而反击则很伤。"
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.injury: "我对手被吞没在其中，在为时已晚之前勉强设法逃脱。"
 single_combat.0041.desc.opponent_response.POD_ching_shih.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.opponent_response.POD_long_neck.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_bloodlash.injury: "我对手对此感到意外，并很快被攻击击溃开来。"
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.injury: "我对手被吞没在其中，在为时已晚之前勉强设法逃脱。"
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.injury: "这种奇怪的战术我敌人没所预料，其被严重烧伤后才回过神来。"
 single_combat.0041.desc.opponent_response.POD_bone_dance.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_dragon_dance.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.injury: "我对手避开了一击，但没能避开第二击。这很伤。"
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.injury: "在这种难受的心灵状态下，我的敌人无法准确地保护自己。"
 single_combat.0041.desc.opponent_response.POD_wind_attack.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.opponent_response.POD_demon_claws.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.opponent_response.POD_tormented_essence.injury: "在这种难受的心灵状态下，其无法准确地保护自己。"
 single_combat.0041.desc.opponent_response.POD_bite.fatality: "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.opponent_response.POD_blood_surge.fatality: "我可以看到我变得更高，更强壮，被血赋予了力量。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.opponent_response.POD_blood_heal.fatality: "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.opponent_response.POD_blink.fatality: "而其没料到。狂攻在其在我面前化为灰烬前不会停止。"
 single_combat.0041.desc.opponent_response.POD_lightning_strike.fatality: "而我做到了，我的敌人很快就被该出其不意的攻击击退。再退……再退……直到没有地方可以再退。"
 single_combat.0041.desc.opponent_response.POD_split_second.fatality: "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。这招将其适当地切成了两半，且令人舒适地对称。"
 single_combat.0041.desc.opponent_response.POD_unerring_aim.fatality: "我的对手什么也做不了，只能在看着我击中其两眼之间的位置。当他们向后倒下时，我没有抑制住胜利的喜悦。"
 single_combat.0041.desc.opponent_response.POD_lethal_body.fatality: "我的对手感觉像是一整栋屋子垮在了其身上，而当其陷入下风时，我占据了上风。所以这一切都结束了。"
 single_combat.0041.desc.opponent_response.POD_brutal_feed.fatality: "我的对手并没能设法从这个致命的擒抱中抽身。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.opponent_response.POD_earthshock.fatality: "我的对手摔倒了，而我利用了这个机会残酷地攻击。其没能避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.fatality: "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。直到只剩下一副骨架。随后便是灰烬。"
 single_combat.0041.desc.opponent_response.POD_toughness.fatality: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.fatality: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.fatality: "在这种可怕力量的推动下，我打出了强有力的一击，将敌人的内脏炸得血肉模糊。"
 single_combat.0041.desc.opponent_response.POD_feral_weapons.fatality: "而这一切都发生了，因为我的对手没能避开向其袭来的致命一扫。"
 single_combat.0041.desc.opponent_response.POD_shapechange.fatality: "我的对手被这突如其来的变化惊呆了，被我击中了，试图用尽全力地推开我变成的怪物。但这没有用，自然在这一回合已经赢了人类。"
 single_combat.0041.desc.opponent_response.POD_vanish.fatality: "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.opponent_response.POD_nocturne.fatality: "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.fatality: "我的对手避开了其中一条，但没有避开第二条……这使其又被弹向第一条。感谢猛烈抨击的触手我得到了胜利。"
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.fatality: "它突然冲进了我对手的喉中，仅仅几秒钟后，一场血与影的爆炸结束了这场决斗。"
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.fatality: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.opponent_response.POD_compel.fatality: "这让我的敌人措手不及，我利用了这机会，干净利落地割断了其的脖子。"
 single_combat.0041.desc.opponent_response.POD_terminal_decree.fatality: "而其顺从地做了，一次又一次。我发出邪恶的笑声，因为我曾经的敌人把自己砸死了。"
 single_combat.0041.desc.opponent_response.POD_daunt.fatality: "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.opponent_response.POD_dread_gaze.fatality: "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.fatality: "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。我向前冲去，一拳打穿了心脏。"
 single_combat.0041.desc.opponent_response.POD_scorpions_touch.fatality: "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae.fatality: "我敌人无力阻止它，其宝贵的血是我的了！没有血，吸血鬼就只是灰烬。正如其很快在我面前证明的那样。"
 single_combat.0041.desc.opponent_response.POD_baals_curse.fatality: "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.fatality: "烫！烫！多么令人愉快的百变篝火。"
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.fatality: "我敌人的血中突然混入了恶性的暗影，试图占据我的身体。当每一盎司的血液都被消灭时，暗影就会顺从地消失。"
 single_combat.0041.desc.opponent_response.POD_stygian_shroud.fatality: "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.opponent_response.POD_fire_torch.fatality: "我对手那可怜的攻击就被高超的一拳反击了。其没能从这一击回复过来。"
 single_combat.0041.desc.opponent_response.POD_fire_bombs.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.opponent_response.POD_fire_spewer.fatality: "不过我的下一击却比这要准。干脆利落又令人满意的斩首。"
 single_combat.0041.desc.opponent_response.POD_crossbow_shot.fatality: "不过我的下一击却比这要准。干脆利落又令人满意的斩首。"
 single_combat.0041.desc.opponent_response.POD_unleash_dogs.fatality: "我把其的狗丢向了其作为报复。其反射性地抓住了它，给了我足够的时间来进行致命一击。"
 single_combat.0041.desc.opponent_response.POD_stake_attack.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.opponent_response.POD_oculi_trust.fatality: "其很快就被无情的攻击击退了回来。被逼到角落后，其无助的倒在了地上。"
 single_combat.0041.desc.opponent_response.POD_oculi_wine.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.opponent_response.POD_acre_catechumen.fatality: "我的反击让其措手不及。结局在钢铁的闪烁中到来。"
 single_combat.0041.desc.opponent_response.POD_acre_flesh.fatality: "而这很疼。足以分散其对下一击的注意。这一次并没有疼很久。"
 single_combat.0041.desc.opponent_response.POD_acre_flight.fatality: "甚至超过了其，因为其被逼退了。再退。直到没有地方可以再退。"
 single_combat.0041.desc.opponent_response.POD_acre_auto.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.fatality: "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.fatality: "这炸了其一脸。头都炸没了。"
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.fatality: "我的反击让其措手不及。结局在钢铁的闪烁中到来。"
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.fatality: "我的反击让其措手不及。结局在钢铁的闪烁中到来。"
 single_combat.0041.desc.opponent_response.POD_bone_obedience.fatality: "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.opponent_response.POD_ching_shih.fatality: "其受伤了，但其还站着。直到其站不住了。其终如其始。于黑暗之中。"
 single_combat.0041.desc.opponent_response.POD_long_neck.fatality: "我无事，而我的对手受伤了。伤势严重到剩下的战斗结果已经注定。"
 single_combat.0041.desc.opponent_response.POD_bloodlash.fatality: "并接上迅速的一击，使其受了伤。糟糕到剩下的战斗已经成为定局了。"
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.opponent_response.POD_bone_dance.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.opponent_response.POD_dragon_dance.fatality: "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.opponent_response.POD_wind_attack.fatality: "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.opponent_response.POD_demon_claws.fatality: "其受伤了，但其还站着。直到其站不住了。其终如其始。于黑暗之中。"
 single_combat.0041.desc.opponent_response.POD_tormented_essence.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.sc_attacker.POD_bite: "我向前扑去，试图将我锋利的獠牙刺入我面前诱人的脖子。"
 single_combat.0041.desc.sc_attacker.POD_blood_surge: "我催动了我的血之力获得力量。"
 single_combat.0041.desc.sc_attacker.POD_blood_heal: "我催动了我的血之力来缝合我的伤口，并医治我自己。"
 single_combat.0041.desc.sc_attacker.POD_blink: "我向前冲的速度比眼睛所能捕捉的还要快，希望我的对手没能预料到我的动作。"
 single_combat.0041.desc.sc_attacker.POD_lightning_strike: "我用迅捷术的力量进行本能地攻击，试图抓住我的对手的破绽。"
 single_combat.0041.desc.sc_attacker.POD_split_second: "随着迅捷术的生效，时间在我周围变慢了。我必须利用这个机会。"
 single_combat.0041.desc.sc_attacker.POD_unerring_aim: "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0041.desc.sc_attacker.POD_lethal_body: "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0041.desc.sc_attacker.POD_brutal_feed: "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0041.desc.sc_attacker.POD_earthshock: "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine: "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0041.desc.sc_attacker.POD_toughness: "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble: "我的肉体转换为超自然的坚石，应该不再会受任何伤害。"
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain: "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0041.desc.sc_attacker.POD_feral_weapons: "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0041.desc.sc_attacker.POD_shapechange: "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0041.desc.sc_attacker.POD_vanish: "我从视线中消失，试图迷惑我的对手。"
 single_combat.0041.desc.sc_attacker.POD_nocturne: "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman: "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within: "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows: "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0041.desc.sc_attacker.POD_compel: "我向我的对手发出了简短的命令。"
 single_combat.0041.desc.sc_attacker.POD_terminal_decree: "我向我的对手发出命令，让其伤害自己。"
 single_combat.0041.desc.sc_attacker.POD_daunt: "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_dread_gaze: "我显现为我敌人最惧怕的噩梦。"
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae: "我手一挥，使我对手的血液静止了。"
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch: "我抽出一些我的血，将它转化为毒。"
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae: "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0041.desc.sc_attacker.POD_baals_curse: "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood: "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion: "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud: "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.sc_attacker.POD_fire_torch: "我疯狂地挥舞火炬期望能幸运的击中。"
 single_combat.0041.desc.sc_attacker.POD_fire_bombs: "我向我的对手丢出炼金火。"
 single_combat.0041.desc.sc_attacker.POD_fire_spewer: "奇怪的机器开始疯狂喷火"
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot: "我对着目标一箭射出。"
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs: "充满着对血和肉的渴望，这些狗冲向我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_stake_attack: "我带着尖桩向前冲出。"
 single_combat.0041.desc.sc_attacker.POD_oculi_trust: "天主之语被口述而出，我的敌人感到了畏惧。"
 single_combat.0041.desc.sc_attacker.POD_oculi_wine: "我向我的对手冲去，想要碰到其便我的诅咒能够生效。"
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen: "天主之语被口述而出，给予了我力量。"
 single_combat.0041.desc.sc_attacker.POD_acre_flesh: "天主之语被口述而出，给予了我坚韧。"
 single_combat.0041.desc.sc_attacker.POD_acre_flight: "在神圣的保佑下，我从未如此之快。"
 single_combat.0041.desc.sc_attacker.POD_acre_auto: "我准备好了最后一击。"
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror: "天主之镜为我指明了与这个魔物的勇武相匹配的途径。"
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana: "我准备好接管这个魔物的力量了。"
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna: "我歌颂天主的荣耀，这使我充满了力量。"
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio: "我歌颂天主的荣耀，这使我敌人充满了惊恐。"
 single_combat.0041.desc.sc_attacker.POD_bone_obedience: "我的骨头开始变得牢不可破。"
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud: "阴气云雾向我敌人飘了过去。"
 single_combat.0041.desc.sc_attacker.POD_ching_shih: "当前这可怖的怪物形态就是我"
 single_combat.0041.desc.sc_attacker.POD_long_neck: "我伸展我的四肢，让我能无不可及。"
 single_combat.0041.desc.sc_attacker.POD_bloodlash: "一条条血鞭被制造了出来，给了我新的机会。"
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch: "真火向我的敌人飘了过去。"
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern: "我变成了一团鬼火太阳。"
 single_combat.0041.desc.sc_attacker.POD_bone_dance: "舞蹈已成，在该地区形成了一层让人昏昏欲睡的幔幕。"
 single_combat.0041.desc.sc_attacker.POD_dragon_dance: "舞蹈已成，该兴奋起来了。"
 single_combat.0041.desc.sc_attacker.POD_chi_interrupt: "我冲向我的对手，寻找其的气脉穴位。"
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare: "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0041.desc.sc_attacker.POD_wind_attack: "风起云涌，我从未如此之快。"
 single_combat.0041.desc.sc_attacker.POD_demon_claws: "我乃恶魔而其为我。我等将获胜。"
 single_combat.0041.desc.sc_attacker.POD_tormented_essence: "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0041.desc.sc_attacker.POD_bite.injury: "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。在为时已晚之前，其勉强从这个致命的擒抱中抽身而出。"
 single_combat.0041.desc.sc_attacker.POD_blood_surge.injury: "我可以看到我变得更高、更强，被血赋予了力量。我迅速地利用了我的优势。"
 single_combat.0041.desc.sc_attacker.POD_blood_heal.injury: "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速的利用了我的优势。"
 single_combat.0041.desc.sc_attacker.POD_blink.injury: "而其没料到，在狂攻之下，其很快就沦落到需要进行回复的地步。"
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.injury: "而我做到了，我的敌人很快就被该出其不意的攻击击退。"
 single_combat.0041.desc.sc_attacker.POD_split_second.injury: "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。"
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.injury: "我的对手什么也做不了，只能接招，感得其的不死族肉体在抗议这种虐待。"
 single_combat.0041.desc.sc_attacker.POD_lethal_body.injury: "我的对手勉强的站起来了，感觉像是一整栋屋子垮在了其身上。"
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.injury: "我的对手设法从该致命的擒抱中挣脱了出来，但还是感受到了我的獠牙所带来的剧痛。"
 single_combat.0041.desc.sc_attacker.POD_earthshock.injury: "我的对手摔倒了，而我利用了这个机会残酷地攻击。其勉强避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.injury: "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。"
 single_combat.0041.desc.sc_attacker.POD_toughness.injury: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.injury: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.injury: "在这种可怕力量的推动下，我打出了可怕的一击，让我的对手踉跄后退。"
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.injury: "它近乎发生了，因为我的敌人勉强设法避免了绝对致命的一扫。"
 single_combat.0041.desc.sc_attacker.POD_shapechange.injury: "我的对手被这突如其来的变化惊呆了，被我击中了，不得不用尽全力地推开我变成的怪物。"
 single_combat.0041.desc.sc_attacker.POD_vanish.injury: "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.sc_attacker.POD_nocturne.injury: "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.injury: "我的毒死后避开了其中一条，但没能避开第二条……而这些东西打人很疼。"
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.injury: "它突然地冲进了我对手的喉中，其不得不动用其所有的意志力来驱赶它。"
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.injury: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。"
 single_combat.0041.desc.sc_attacker.POD_compel.injury: "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.injury: "其顺从地做了，感到更多的是羞辱而不是痛苦。"
 single_combat.0041.desc.sc_attacker.POD_daunt.injury: "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.injury: "这使得我的敌人措手不及，被猛地借机一击。"
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.injury: "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。"
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.injury: "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.injury: "我敌人无力阻止它，其宝贵的血是我的了！"
 single_combat.0041.desc.sc_attacker.POD_baals_curse.injury: "受此影响，我敌人感到了不适，行动迟缓了起来。"
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.injury: "烫！烫！"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.injury: "我敌人的血中突然混入了恶性的暗影，试图占据其的身体。这不是一个愉快的经历。"
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.injury: "因此，我的对手没有看到来自其背后的下一击。而且这将很痛。"
 single_combat.0041.desc.sc_attacker.POD_fire_torch.injury: "我对手险险的避开了它，但一些火焰还是伤到了其的肉体。"
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.injury: "我对手险险的避开了它，但一些火焰还是伤到了其的肉体。"
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.injury: "我对手险险的避开了它，但一些火焰还是伤到了其的肉体。"
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.injury: "它以响亮一声击中了我敌人，这一回合其已落入下风。"
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.injury: "我对手打发了它们，但不够快，它们已经在其身上撕咬了一阵子。"
 single_combat.0041.desc.sc_attacker.POD_stake_attack.injury: "尖桩没有击中我对手的心脏，但仍然相当痛苦地伤了其。"
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.injury: "因此，我敌人没能避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.injury: "我对手受伤了，而其肉体的一部分在其能做任何事前变成了灰。"
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.injury: "向我敌人袭来的下一击特别疼痛。"
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.injury: "我敌人没能打破我的防御，而反击则很伤。"
 single_combat.0041.desc.sc_attacker.POD_acre_flight.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_acre_auto.injury: "没成，但是它的冲击依然让我敌人非常疼痛。"
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.injury: "因此，我敌人没能避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.injury: "意外的一击，反噬对我对手造成的伤害很大。"
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.injury: "向我敌人袭来的下一击特别疼痛。"
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_bone_obedience.injury: "我敌人没能打破我的防御，而反击则很伤。"
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.injury: "我对手被吞没在其中，在为时已晚之前勉强设法逃脱。"
 single_combat.0041.desc.sc_attacker.POD_ching_shih.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.sc_attacker.POD_long_neck.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_bloodlash.injury: "我对手对此感到意外，并很快被攻击击溃开来。"
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch.injury: "我对手被吞没在其中，在为时已晚之前勉强设法逃脱。"
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern.injury: "这种奇怪的战术我敌人没所预料，其被严重烧伤后才回过神来。"
 single_combat.0041.desc.sc_attacker.POD_bone_dance.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_dragon_dance.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.sc_attacker.POD_chi_interrupt.injury: "我对手避开了一击，但没能避开第二击。这很伤。"
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare.injury: "在这种难受的心灵状态下，我的敌人无法准确地保护自己。"
 single_combat.0041.desc.sc_attacker.POD_wind_attack.injury: "因此，我的对手无法避开向其袭来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_demon_claws.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.sc_attacker.POD_tormented_essence.injury: "在这种难受的心灵状态下，其无法准确地保护自己。"
 single_combat.0041.desc.sc_attacker.POD_bite.fatality: "而该刺入了其中，令人陶醉的血腥味弥漫在了空气中。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.sc_attacker.POD_blood_surge.fatality: "我可以看到我变得更高，更强壮，被血赋予了力量。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.sc_attacker.POD_blood_heal.fatality: "随着血之力对我的治疗，我所有的伤口都在我眼前消失了。我迅速利用了我的优势，以以迅雷不及掩耳之势进行斩首的方式结束了战斗。败者的头颅在地上滚动着，直到与我的脚碰撞后才停了下来。"
 single_combat.0041.desc.sc_attacker.POD_blink.fatality: "而其没料到。狂攻在其在我面前化为灰烬前不会停止。"
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.fatality: "而我做到了，我的敌人很快就被该出其不意的攻击击退。再退……再退……直到没有地方可以再退。"
 single_combat.0041.desc.sc_attacker.POD_split_second.fatality: "我的对手没有做好足够的准备，一发强烈的一击就向其袭来，对于其被扰乱的时间感来说这太快了。这招将其适当地切成了两半，且令人舒适地对称。"
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.fatality: "我的对手什么也做不了，只能在看着我击中其两眼之间的位置。当他们向后倒下时，我没有抑制住胜利的喜悦。"
 single_combat.0041.desc.sc_attacker.POD_lethal_body.fatality: "我的对手感觉像是一整栋屋子垮在了其身上，而当其陷入下风时，我占据了上风。所以这一切都结束了。"
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.fatality: "我的对手并没能设法从这个致命的擒抱中抽身。其很快就屈服于该迷吻，而我胜利的滋味是血腥且甜蜜的。"
 single_combat.0041.desc.sc_attacker.POD_earthshock.fatality: "我的对手摔倒了，而我利用了这个机会残酷地攻击。其没能避开了要落在其脖子上的那一击。"
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.fatality: "该暴风就像匕首一样刺入其的皮肤，每次唰过都会割掉其大片的永生血肉。直到只剩下一副骨架。随后便是灰烬。"
 single_combat.0041.desc.sc_attacker.POD_toughness.fatality: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.fatality: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.fatality: "在这种可怕力量的推动下，我打出了强有力的一击，将敌人的内脏炸得血肉模糊。"
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.fatality: "而这一切都发生了，因为我的对手没能避开向其袭来的致命一扫。"
 single_combat.0041.desc.sc_attacker.POD_shapechange.fatality: "我的对手被这突如其来的变化惊呆了，被我击中了，试图用尽全力地推开我变成的怪物。但这没有用，自然在这一回合已经赢了人类。"
 single_combat.0041.desc.sc_attacker.POD_vanish.fatality: "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.sc_attacker.POD_nocturne.fatality: "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.fatality: "我的对手避开了其中一条，但没有避开第二条……这使其又被弹向第一条。感谢猛烈抨击的触手我得到了胜利。"
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.fatality: "它突然冲进了我对手的喉中，仅仅几秒钟后，一场血与影的爆炸结束了这场决斗。"
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.fatality: "似乎没有什么能够穿透我的防护。我的敌人因过多的突破尝试而耗尽了力气。我的反击是迅捷且致命的。"
 single_combat.0041.desc.sc_attacker.POD_compel.fatality: "这让我的敌人措手不及，我利用了这机会，干净利落地割断了其的脖子。"
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.fatality: "而其顺从地做了，一次又一次。我发出邪恶的笑声，因为我曾经的敌人把自己砸死了。"
 single_combat.0041.desc.sc_attacker.POD_daunt.fatality: "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.fatality: "这让我的敌人措手不及，我立刻将我的优势利用到了极点。"
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.fatality: "因此，我的对手突然感到变得相当虚弱，而心兽正在为预定的胜利而咆哮。我向前冲去，一拳打穿了心脏。"
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.fatality: "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.fatality: "我敌人无力阻止它，其宝贵的血是我的了！没有血，吸血鬼就只是灰烬。正如其很快在我面前证明的那样。"
 single_combat.0041.desc.sc_attacker.POD_baals_curse.fatality: "受此影响，我敌人感到了不适，行动迟缓了起来。我仁慈将其赐死，用迅速的一击杀死其，而非死于毒的缓慢折磨。"
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.fatality: "烫！烫！多么令人愉快的百变篝火。"
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.fatality: "我敌人的血中突然混入了恶性的暗影，试图占据我的身体。当每一盎司的血液都被消灭时，暗影就会顺从地消失。"
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.fatality: "因此，我的对手没能预到来自其背后的下一击。而这是其最后所能感到的。"
 single_combat.0041.desc.sc_attacker.POD_fire_torch.fatality: "我对手那可怜的攻击就被高超的一拳反击了。其没能从这一击回复过来。"
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.fatality: "不过我的下一击却比这要准。干脆利落又令人满意的斩首。"
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.fatality: "不过我的下一击却比这要准。干脆利落又令人满意的斩首。"
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.fatality: "我把其的狗丢向了其作为报复。其反射性地抓住了它，给了我足够的时间来进行致命一击。"
 single_combat.0041.desc.sc_attacker.POD_stake_attack.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.fatality: "其很快就被无情的攻击击退了回来。被逼到角落后，其无助的倒在了地上。"
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.fatality: "我的反击让其措手不及。结局在钢铁的闪烁中到来。"
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.fatality: "而这很疼。足以分散其对下一击的注意。这一次并没有疼很久。"
 single_combat.0041.desc.sc_attacker.POD_acre_flight.fatality: "甚至超过了其，因为其被逼退了。再退。直到没有地方可以再退。"
 single_combat.0041.desc.sc_attacker.POD_acre_auto.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.fatality: "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.fatality: "这炸了其一脸。头都炸没了。"
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.fatality: "我的反击让其措手不及。结局在钢铁的闪烁中到来。"
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.fatality: "我的反击让其措手不及。结局在钢铁的闪烁中到来。"
 single_combat.0041.desc.sc_attacker.POD_bone_obedience.fatality: "其被推了回去，近乎不能站稳。出局吧！"
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.sc_attacker.POD_ching_shih.fatality: "其受伤了，但其还站着。直到其站不住了。其终如其始。于黑暗之中。"
 single_combat.0041.desc.sc_attacker.POD_long_neck.fatality: "我无事，而我的对手受伤了。伤势严重到剩下的战斗结果已经注定。"
 single_combat.0041.desc.sc_attacker.POD_bloodlash.fatality: "并接上迅速的一击，使其受了伤。糟糕到剩下的战斗已经成为定局了。"
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch.fatality: "其没能轻易躲开接下来打在其脸上的那一拳。或者下一击，直到其的头从肩膀上掉下来。"
 single_combat.0041.desc.sc_attacker.POD_goblin_lantern.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
 single_combat.0041.desc.sc_attacker.POD_bone_dance.fatality: "我送以强有力的一击。其头没能受住，啪的一下掉到了地上。"
