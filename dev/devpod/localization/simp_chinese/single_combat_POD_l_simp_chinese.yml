 single_combat.0031.desc.opponent_response.POD_snout_strike.injury: "短而恶毒的刺拳集中了我，虽然不足以致命，但也足以让人担忧……"
 single_combat.0031.desc.opponent_response.POD_chi_breaker.injury: "我对手将一只手插入了我的躯干，虽然不足以致命，但也足以让人担忧……"
 single_combat.0031.desc.opponent_response.POD_hundred_star_shower.injury: "附气飞行物具有着远远大于正常情况的冲击力。这很痛！"
 single_combat.0031.desc.opponent_response.POD_jaw_hammer.injury: "我的颌骨碎了，虽然不足以致命，但也足以让人担忧……"
 single_combat.0031.desc.opponent_response.POD_fading_light_strike.injury: "我的能量被窃取了，虽然不足以致命，但也足以让人担忧……"
 single_combat.0031.desc.opponent_response.POD_chain_snake.injury: "我的攻击被挡住了，同时链索的另一端集中了我的脸。"
 single_combat.0031.desc.opponent_response.POD_twisting_thrust.injury: "深入我体内的一刀，虽然不足以致命，但也足以让人担忧……"
 single_combat.0031.desc.opponent_response.POD_prone_attacks.injury: "我没能打破对手的防御，而反击也很伤。"
 single_combat.0031.desc.opponent_response.POD_dagger_claw.injury: "比我更快、更准、更狠，我陷入下风。"
 single_combat.0031.desc.opponent_response.POD_snout_strike.fatality: "我的口吻被抓住了。并在迅速而无情的打击中被立即粉碎了。"
 single_combat.0031.desc.opponent_response.POD_chi_breaker.fatality: "我对手将一只手插入了我的躯干，我的气脉被扰乱了。糟糕到剩下的战斗结果已经注定。"
 single_combat.0031.desc.opponent_response.POD_hundred_star_shower.fatality: "附气飞行物具有着远远大于正常情况的冲击力。我再也没机会了。"
 single_combat.0031.desc.opponent_response.POD_jaw_hammer.fatality: "我的颌骨碎了。我的头骨也是。"
 single_combat.0031.desc.opponent_response.POD_fading_light_strike.fatality: "我的能量被窃取了。糟糕到剩下的战斗结果已经注定。"
 single_combat.0031.desc.opponent_response.POD_chain_snake.fatality: "我的攻击被挡住了，同时链索的另一端集中了我的要害。"
 single_combat.0031.desc.opponent_response.POD_twisting_thrust.fatality: "深入我体内的一刀。我再也没机会了。"
 single_combat.0031.desc.opponent_response.POD_prone_attacks.fatality: "我没能打破对手的防御，而反击则会心一击了。我再也没机会了。"
 single_combat.0031.desc.opponent_response.POD_dagger_claw.fatality: "比我更快、更准、更狠，我陷入下风。并在迅速而无情的打击中被立即粉碎了。"
