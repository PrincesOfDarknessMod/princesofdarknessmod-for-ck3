 single_combat.0001.POD_typhonic_maw: "提丰吞没！"
 single_combat.0001.tt.POD_typhonic_maw: "#D 你张大下颌，长出分叉的舌头，向你的对手抽打过去。#!"
 single_combat.0001.POD_cobra_fangs: "眼镜蛇之刺！"
 single_combat.0001.tt.POD_cobra_fangs: "#D 你的毒牙滴着毒液，寻找机会插入对手的肉体。#!"
 single_combat.0001.desc.my_feedback.POD_adramelechs_wrath: "我乃恶魔而其为我。我等将获胜。"
 single_combat.0001.desc.my_feedback.POD_typhonic_maw: "我把我的下颌张大到足以把我的对手整个吞下。"
 single_combat.0001.desc.my_feedback.POD_cobra_fangs: "我的獠牙变得剧毒，寻找机会插入我对手的肉体。"
 single_combat.0001.desc.opponent_response.POD_adramelechs_wrath: "我的对手已经变成了一位可怕的恶魔。"
 single_combat.0001.desc.opponent_response.POD_typhonic_maw: "我的对手把其下颌张大到足以把我整个吞下。"
 single_combat.0001.desc.opponent_response.POD_cobra_fangs: "我对手的獠牙变得剧毒，寻找机会插入我的肉体。"
 single_combat.0031.desc.sc_defender.POD_adramelechs_wrath: "但我的对手并不以为然，并迅速出击。"
 single_combat.0031.desc.sc_defender.POD_typhonic_maw: "我的敌人轻而易举地躲过了笨重而不方便的提丰之颌。"
 single_combat.0031.desc.sc_defender.POD_cobra_fangs: "没有找到机会，我獠牙的毒全滴到在地上，变得无害。"
 single_combat.0031.desc.opponent_response.POD_adramelechs_wrath: "我的对手已经变成了一位可怕的恶魔。"
 single_combat.0031.desc.opponent_response.POD_typhonic_maw: "我的对手把其下颌张大到足以把我整个吞下。"
 single_combat.0031.desc.opponent_response.POD_cobra_fangs: "我对手的獠牙变得剧毒，寻找机会插入我的肉体。"
 single_combat.0031.desc.opponent_response.POD_adramelechs_wrath.injury: "比我更快、更准、更狠，我陷入下风。"
 single_combat.0031.desc.opponent_response.POD_typhonic_maw.injury: "提丰之颌划伤了我。而这鬼东西很疼。"
 single_combat.0031.desc.opponent_response.POD_cobra_fangs.injury: "毒牙划伤了我，虽然不足以致命，但也足以让人担忧……"
 single_combat.0031.desc.opponent_response.POD_adramelechs_wrath.fatality: "比我更快、更准、更狠，我陷入下风。并在迅速而无情的打击中被立即粉碎了。"
 single_combat.0031.desc.opponent_response.POD_typhonic_maw.fatality: "提丰之颌吞噬了我，在酸性胃坑中结束了我的永生。"
 single_combat.0031.desc.opponent_response.POD_cobra_fangs.fatality: "毒牙命中了我。毒液迅速蔓延到我的血液中，将它，然后是我，变成了酸液。我的终末充满了硫磺气味，以及我的对手的狂笑。"
 single_combat.0031.desc.sc_attacker.POD_adramelechs_wrath: "但我的对手并不以为然，并迅速出击。"
 single_combat.0031.desc.sc_attacker.POD_typhonic_maw: "我的敌人轻而易举地躲过了笨重而不方便的提丰之颌。"
 single_combat.0031.desc.sc_attacker.POD_cobra_fangs: "没有找到机会，我獠牙的毒全滴到在地上，变得无害。"
 single_combat.0031.desc.sc_attacker.POD_adramelechs_wrath.injury: "我受伤了，但我还站着。"
 single_combat.0031.desc.sc_attacker.POD_typhonic_maw.injury: "这笨重的东西被借机一击，很快就迫使我恢复到我的自然形态。"
 single_combat.0031.desc.sc_attacker.POD_cobra_fangs.injury: "我的对手迅速抓住我无害但仍然在外的獠牙，把它捏碎了。疼啊！"
 single_combat.0031.desc.sc_attacker.POD_adramelechs_wrath.fatality: "我受伤了，但我还站着。直到我站不住了。其终如其始。在黑暗之中。"
 single_combat.0031.desc.sc_attacker.POD_typhonic_maw.fatality: "这笨重的东西被借机一击，使我漏了破绽。接着因为没能跟上，我的整个身体都切开了。"
 single_combat.0031.desc.sc_attacker.POD_cobra_fangs.fatality: "我的对手迅速抓住我无害但仍然在外的獠牙，把它捏碎了。接着因为没能跟上，我的头也跟着被碎了。"
 single_combat.0041.desc.sc_defender.POD_adramelechs_wrath: "我乃恶魔而其为我。我等将获胜。"
 single_combat.0041.desc.sc_defender.POD_typhonic_maw: "我把我的下颌张大到足以把我的对手整个吞下。"
 single_combat.0041.desc.sc_defender.POD_cobra_fangs: "我的獠牙变得剧毒，寻找机会插入我对手的肉体。"
 single_combat.0041.desc.opponent_response.POD_adramelechs_wrath: "我的对手已经变成了一位可怕的恶魔。"
 single_combat.0041.desc.opponent_response.POD_typhonic_maw: "我的对手把其下颌张大到足以把我整个吞下。"
 single_combat.0041.desc.opponent_response.POD_cobra_fangs: "我对手的獠牙变得剧毒，寻找机会插入我的肉体。"
 single_combat.0041.desc.opponent_response.POD_adramelechs_wrath.injury: "比其更快、更准、更狠，我的敌人陷入了下风。"
 single_combat.0041.desc.opponent_response.POD_typhonic_maw.injury: "我砍开了那张怪异的大嘴。这一定很疼。"
 single_combat.0041.desc.opponent_response.POD_cobra_fangs.injury: "当毒从对手的獠牙上消散时，我把它抓在手里，尽大力把它捏碎。"
 single_combat.0041.desc.opponent_response.POD_adramelechs_wrath.fatality: "其受伤了，但其还站着。直到其站不住了。其终如其始。于黑暗之中。"
 single_combat.0041.desc.opponent_response.POD_typhonic_maw.fatality: "我砍开了那张怪异的大嘴。这一定很疼。沿着这张丑陋的脸，一个干净的切口结束了这场战斗。"
 single_combat.0041.desc.opponent_response.POD_cobra_fangs.fatality: "当毒从对手的獠牙上消散时，我拼命一击其伸出的头，确保其这次不会再爬起来。"
