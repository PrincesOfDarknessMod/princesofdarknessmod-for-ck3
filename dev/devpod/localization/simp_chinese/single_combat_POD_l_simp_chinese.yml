 single_combat.0041.desc.sc_defender.POD_unerring_aim: "由于我对迅捷术的掌握，我的下一击将是绝对精准的。"
 single_combat.0041.desc.sc_defender.POD_lethal_body: "蛮力术使我能够以用雪崩般的冲击力蹦向我的对手。"
 single_combat.0041.desc.sc_defender.POD_brutal_feed: "我冲向前扑往颈部，期望能在几秒钟内就给我的对手放空血。"
 single_combat.0041.desc.sc_defender.POD_earthshock: "猛击大地，我将使地面在我等之下颤抖。"
 single_combat.0041.desc.sc_defender.POD_fist_of_caine: "多亏蛮力术，我的斗殴动作所催动的空气本身就成了致命的武器。"
 single_combat.0041.desc.sc_defender.POD_toughness: "我的肉体具有了非自然的抗性，应该能挡住任何来袭的攻击。"
 single_combat.0041.desc.sc_defender.POD_flesh_of_marble: "我的肉体转换为超自然的坚石，应该不再会受任何伤害。"
 single_combat.0041.desc.sc_defender.POD_prowess_from_pain: "我的伤口供养我，让我在瞬间内变得更强大。"
 single_combat.0041.desc.sc_defender.POD_feral_weapons: "我的利爪长了出来，准备把我的对手劈成两半。"
 single_combat.0041.desc.sc_defender.POD_shapechange: "通过我的动物形态，我先用獠牙扑向我的对手。"
 single_combat.0041.desc.sc_defender.POD_vanish: "我从视线中消失，试图迷惑我的对手。"
 single_combat.0041.desc.sc_defender.POD_nocturne: "暗影在我们的战场中回旋，使人伸手不见五指。"
 single_combat.0041.desc.sc_defender.POD_arms_of_ahriman: "黑色的触手从地里出现，试图攻击我的敌人。"
 single_combat.0041.desc.sc_defender.POD_the_darkness_within: "暗影在我的对手周围回旋，寻找破绽。"
 single_combat.0041.desc.sc_defender.POD_aegis_of_shadows: "暗影盔甲显现在我身上，保护我免受伤害。"
 single_combat.0041.desc.sc_defender.POD_compel: "我向我的对手发出了简短的命令。"
 single_combat.0041.desc.sc_defender.POD_terminal_decree: "我向我的对手发出命令，让其伤害自己。"
 single_combat.0041.desc.sc_defender.POD_daunt: "我变得更宏伟，更有力量，应该足以震慑我的敌人。"
 single_combat.0041.desc.sc_defender.POD_dread_gaze: "我显现为我敌人最惧怕的噩梦。"
 single_combat.0041.desc.sc_defender.POD_extinguish_vitae: "我手一挥，使我对手的血液静止了。"
 single_combat.0041.desc.sc_defender.POD_scorpions_touch: "我抽出一些我的血，将它转化为毒。"
 single_combat.0041.desc.sc_defender.POD_theft_of_vitae: "我让血从我的敌人喉内涌出，然后将它引向我。"
 single_combat.0041.desc.sc_defender.POD_baals_curse: "我抽出一些我的血液，并将它转化为一种极度激烈的毒。"
 single_combat.0041.desc.sc_defender.POD_cauldron_of_blood: "随着我的手一挥，我让对手的血液在其血管中沸腾。"
 single_combat.0041.desc.sc_defender.POD_touch_of_oblivion: "我触碰我的对手，将湮灭的原始熵力注入其中。"
 single_combat.0041.desc.sc_defender.POD_stygian_shroud: "我将压抑的黑暗扩散到一大片区域，屏蔽声音，并压制所有其他感官。"
 single_combat.0041.desc.sc_defender.POD_fire_torch: "我疯狂地挥舞火炬期望能幸运的击中。"
 single_combat.0041.desc.sc_defender.POD_fire_bombs: "我向我的对手丢出炼金火。"
 single_combat.0041.desc.sc_defender.POD_fire_spewer: "奇怪的机器开始疯狂喷火"
 single_combat.0041.desc.sc_defender.POD_crossbow_shot: "我对着目标一箭射出。"
 single_combat.0041.desc.sc_defender.POD_unleash_dogs: "充满着对血和肉的渴望，这些狗冲向我的敌人。"
 single_combat.0041.desc.sc_defender.POD_stake_attack: "我带着尖桩向前冲出。"
 single_combat.0041.desc.sc_defender.POD_oculi_trust: "天主之语被口述而出，我的敌人感到了畏惧。"
 single_combat.0041.desc.sc_defender.POD_oculi_wine: "我向我的对手冲去，想要碰到其便我的诅咒能够生效。"
 single_combat.0041.desc.sc_defender.POD_acre_catechumen: "天主之语被口述而出，给予了我力量。"
 single_combat.0041.desc.sc_defender.POD_acre_flesh: "天主之语被口述而出，给予了我坚韧。"
 single_combat.0041.desc.sc_defender.POD_acre_flight: "在神圣的保佑下，我从未如此之快。"
 single_combat.0041.desc.sc_defender.POD_acre_auto: "我准备好了最后一击。"
 single_combat.0041.desc.sc_defender.POD_murnau_mirror: "天主之镜为我指明了与这个魔物的勇武相匹配的途径。"
 single_combat.0041.desc.sc_defender.POD_murnau_arcana: "我准备好接管这个魔物的力量了。"
 single_combat.0041.desc.sc_defender.POD_sisters_hosanna: "我歌颂天主的荣耀，这使我充满了力量。"
 single_combat.0041.desc.sc_defender.POD_sisters_oratorio: "我歌颂天主的荣耀，这使我敌人充满了惊恐。"
 single_combat.0041.desc.sc_defender.POD_bone_obedience: "我的骨头开始变得牢不可破。"
 single_combat.0041.desc.sc_defender.POD_five_poison_cloud: "阴气云雾向我敌人飘了过去。"
 single_combat.0041.desc.sc_defender.POD_ching_shih: "当前这可怖的怪物形态就是我"
 single_combat.0041.desc.sc_defender.POD_long_neck: "我伸展我的四肢，让我能无不可及。"
 single_combat.0041.desc.sc_defender.POD_bloodlash: "一条条血鞭被制造了出来，给了我新的机会。"
 single_combat.0041.desc.sc_defender.POD_goblin_scorch: "真火向我的敌人飘了过去。"
 single_combat.0041.desc.sc_defender.POD_goblin_lantern: "我变成了一团鬼火太阳。"
 single_combat.0041.desc.sc_defender.POD_bone_dance: "舞蹈已成，在该地区形成了一层让人昏昏欲睡的幔幕。"
 single_combat.0041.desc.sc_defender.POD_dragon_dance: "舞蹈已成，该兴奋起来了。"
 single_combat.0041.desc.sc_defender.POD_chi_interrupt: "我冲向我的对手，寻找其的气脉穴位。"
 single_combat.0041.desc.sc_defender.POD_thousand_hell_stare: "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
 single_combat.0041.desc.sc_defender.POD_wind_attack: "风起云涌，我从未如此之快。"
 single_combat.0041.desc.sc_defender.POD_demon_claws: "我乃恶魔而其为我。我等将获胜。"
 single_combat.0041.desc.sc_defender.POD_tormented_essence: "痛苦、愤怒和绝望瞬间吞噬了我对手的灵魂。"
