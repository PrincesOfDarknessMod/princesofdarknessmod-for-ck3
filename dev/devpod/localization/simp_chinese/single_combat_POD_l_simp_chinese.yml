 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim: "我的对手尝试向我释放一只饥肠辘辘的圣甲虫。"
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis: "我的对手手中显现出一把影矛，向我发动攻击。"
 single_combat.0041.desc.opponent_response.POD_spark_of_ra.injury: "我的对手被火焰球击中，但即使烧伤他们仍在战斗。"
 single_combat.0041.desc.opponent_response.POD_deaths_hand.injury: "我的对手被幽影能量击中了。其受伤了，但仍在与我作战。"
 single_combat.0041.desc.opponent_response.POD_ashes_to_ashes.injury: "我施法将我的敌人转化为灰烬。他们的部分肉体开始干化。"
 single_combat.0041.desc.opponent_response.POD_dust_to_dust.injury: "我对手的肉体在我的触碰下开始变成黑泥。"
 single_combat.0041.desc.opponent_response.POD_khaibits_embrace.injury: "我的对手无法挣脱我的控制，被阴影所伤。"
 single_combat.0041.desc.opponent_response.POD_serqets_sting.injury: "我的对手中了塞尔凯特的剧毒。"
 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.injury: "我的活化的圣甲虫在我的对手体内钻得愈来愈深。"
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis.injury: "我用阿努比斯之矛击中对手，使他们受伤。"
 single_combat.0041.desc.opponent_response.POD_spark_of_ra.fatality: "我以拉神的火花反击。我的对手被火焰球击中而焚灭了。"
 single_combat.0041.desc.opponent_response.POD_deaths_hand.fatality: "我用幽影能量的爆炸来反击我的敌人。其倒在了地上。"
 single_combat.0041.desc.opponent_response.POD_ashes_to_ashes.fatality: "我躲开敌人的攻击，施法将其的肉体转化为灰烬。其干化溃散在地。"
 single_combat.0041.desc.opponent_response.POD_dust_to_dust.fatality: "我躲开敌人的攻击，触碰其的皮肤。被我触碰到的肉体在变成黑泥时溃散了。"
 single_combat.0041.desc.opponent_response.POD_khaibits_embrace.fatality: "我躲开敌人的攻击，抓住他们的脸。阴影吞噬了他们。"
 single_combat.0041.desc.opponent_response.POD_serqets_sting.fatality: "我用塞尔凯特的结印来反击。我的对手因中毒而倒下了。"
 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.fatality: "我通过释放一个贪婪的圣甲虫来反击。它在敌人屈服时深深地钻进他们体内。"
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis.fatality: "我用阿努比斯之矛攻击对手，以此反击其。其都倒在了地上。"
 single_combat.0041.desc.sc_attacker.POD_spark_of_ra: "我把一个点燃的火焰球扔向我的对手。"
 single_combat.0041.desc.sc_attacker.POD_deaths_hand: "我举起手掌，用幽影能量轰击我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_ashes_to_ashes: "我施法将我的敌人转化为灰烬。"
 single_combat.0041.desc.sc_attacker.POD_dust_to_dust: "我上前接触我的对手，将他们的肉体转化为黑泥。"
 single_combat.0041.desc.sc_attacker.POD_khaibits_embrace: "我试图抓住对手的脸，把他们吞没在阴影当中。"
 single_combat.0041.desc.sc_attacker.POD_serqets_sting: "我做出了蝎子结印，用剧毒蜇伤我的对手。"
 single_combat.0041.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim: "我释放出一只圣甲虫，来吞食我的对手。"
 single_combat.0041.desc.sc_attacker.POD_spear_of_anubis: "我用影矛攻击我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_spark_of_ra.injury: "火焰球连接起来，烧伤了我的对手。"
 single_combat.0041.desc.sc_attacker.POD_deaths_hand.injury: "幽影能量的爆炸击中了我的对手，使其受伤。"
 single_combat.0041.desc.sc_attacker.POD_ashes_to_ashes.injury: "我敌人的部分肉体在法术生效后开始干枯。"
 single_combat.0041.desc.sc_attacker.POD_dust_to_dust.injury: "我的敌人在他们的肉体变成泥土时尖叫着。"
 single_combat.0041.desc.sc_attacker.POD_khaibits_embrace.injury: "我的对手在吞噬他们的阴影中挣扎。"
 single_combat.0041.desc.sc_attacker.POD_serqets_sting.injury: "快速做出了蝎子结印，我的对手没能预到接下来的下一击。"
 single_combat.0041.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.injury: "我的对手在为时已晚之前勉强挤出了那只钻入的圣甲虫。"
 single_combat.0041.desc.sc_attacker.POD_spear_of_anubis.injury: "我的影矛深深地咬住了我的敌人。"
 single_combat.0041.desc.sc_attacker.POD_spark_of_ra.fatality: "火焰球连接起来，把我的对手变成了一个垂灭的火炬。"
 single_combat.0041.desc.sc_attacker.POD_deaths_hand.fatality: "幽影能量的爆炸击中我的敌人，打败了其。"
 single_combat.0041.desc.sc_attacker.POD_ashes_to_ashes.fatality: "我施展法术将对手的肉体转化为灰烬。其轰然倒地。"
 single_combat.0041.desc.sc_attacker.POD_dust_to_dust.fatality: "我的敌人在他们的肉体转化为泥土的过程中皱缩在地。"
 single_combat.0041.desc.sc_attacker.POD_khaibits_embrace.fatality: "我的敌人完全被阴影所擒抱。其现在任由我摆布。"
 single_combat.0041.desc.sc_attacker.POD_serqets_sting.fatality: "剧毒在他们的血管中燃烧，我的对手很快就倒下了。"
 single_combat.0041.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.fatality: "随着圣甲虫钻得更深，我的对手很快就倒下了。"
 single_combat.0041.desc.sc_attacker.POD_spear_of_anubis.fatality: "我用阿努比斯之矛击倒我的对手。"
 signature_weapon_claws_brandished: "挥舞"
 single_combat.0001.POD_feral_clawing: "我会剥了你的皮！"
 single_combat.0001.tt.POD_feral_clawing: "#D 你用裸露的爪子攻击.#!"
 single_combat.0001.POD_feral_bite: "我会嚼碎你"
 single_combat.0001.tt.POD_feral_bite: "#D 你用你的牙齿撕咬咀嚼.#!"
 single_combat.0001.POD_feral_assault: "撕裂！抓咬！"
 single_combat.0001.tt.POD_feral_assault: "#D 你疯狂攻击，全力以赴.#!"
 single_combat.0001.POD_feral_taunt: "你称呼自己是战士吗？！"
 single_combat.0001.tt.POD_feral_taunt: "#D 你出言挑衅对手。#!"
 single_combat.0001.POD_feral_evasion: "你太慢了！"
 single_combat.0001.tt.POD_feral_evasion: "#D 你开始躲避你的对手.#!"
 single_combat.0001.POD_jaw_lock: "你将无法移动！"
 single_combat.0001.tt.POD_jaw_lock: "#D 你撕咬并试图锁定你的敌人.#!"
 single_combat.0001.POD_hamstring: "我要咬掉你的四肢！"
 single_combat.0001.tt.POD_hamstring: "#D 你试图咬掉你对手的四肢#!"
 single_combat.0001.POD_leaping_rake: "快躲开！"
 single_combat.0001.tt.POD_leaping_rake: "#D 你跳向对手，同时疯狂地挥舞你的爪子#!"
 single_combat.0001.POD_wishbone: "我要手撕你！"
 single_combat.0001.tt.POD_wishbone: "#D 凭借你传奇般的实力，你尝试将对手撕成碎片.#!"
