 single_combat.0001.desc.opponent_response.POD_arms_of_ahriman: "黑色的触手从地里出现，试图攻击我。"
 single_combat.0001.desc.opponent_response.POD_the_darkness_within: "暗影在我周围回旋，寻找破绽。"
 single_combat.0001.desc.opponent_response.POD_aegis_of_shadows: "暗影盔甲显现在我的敌人身上，保护其免受伤害。"
