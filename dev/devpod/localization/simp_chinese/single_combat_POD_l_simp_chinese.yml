 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim: "我的对手释放出一只圣甲虫来攻击我。"
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis: "我的对手手持着影矛向我袭来。"
 single_combat.0031.desc.opponent_response.POD_spark_of_ra.injury: "火球击中并燃烧着我。"
 single_combat.0031.desc.opponent_response.POD_deaths_hand.injury: "幽影能量击中并持续伤害着我。"
 single_combat.0031.desc.opponent_response.POD_ashes_to_ashes.injury: "对手的法术让我的部分肉体干枯了。"
 single_combat.0031.desc.opponent_response.POD_dust_to_dust.injury: "我的对手触摸了我，我感觉到我的肉体变成了黑泥。"
 single_combat.0031.desc.opponent_response.POD_khaibits_embrace.injury: "我没能打破对手的束缚，被阴影所伤。"
 single_combat.0031.desc.opponent_response.POD_serqets_sting.injury: "我感觉到剧毒在我的血管中燃烧。"
 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.injury: "我感受到饥饿的圣甲虫钻进了我的肉体。"
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis.injury: "我感受到了敌人长矛的噬咬。"
 single_combat.0031.desc.opponent_response.POD_spark_of_ra.fatality: "火球击中了我，我的视线变得漆黑一片，所有意识都被燃烧的火焰所占据。"
 single_combat.0031.desc.opponent_response.POD_deaths_hand.fatality: "幽影能量击中了我，我的视野变得漆黑一片。"
 single_combat.0031.desc.opponent_response.POD_ashes_to_ashes.fatality: "我的敌人施法将我的肉体转化为灰烬。当我感觉到我的肉体在枯竭时，我坍塌了。"
 single_combat.0031.desc.opponent_response.POD_dust_to_dust.fatality: "我的对手触摸了我。我的身体开始转化为黑泥。我快死了。"
 single_combat.0031.desc.opponent_response.POD_khaibits_embrace.fatality: "黑影之拥完全吞噬了我。我被困住了。"
 single_combat.0031.desc.opponent_response.POD_serqets_sting.fatality: "我感觉到剧毒在我的血管中燃烧，我的视线变得漆黑一片。"
 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.fatality: "圣甲虫钻进了我的身体，我很快感觉到它在啃噬我的心脏。"
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis.fatality: "我的对手击破了我的防御，并将我打倒。"
 single_combat.0031.desc.sc_attacker.POD_spark_of_ra: "我的对手在最后一秒躲开了火焰球。"
 single_combat.0031.desc.sc_attacker.POD_deaths_hand: "其在最后一秒躲开了幽影能量。"
 single_combat.0031.desc.sc_attacker.POD_ashes_to_ashes: "我的法术未能生效。"
 single_combat.0031.desc.sc_attacker.POD_dust_to_dust: "我的对手躲开了我的接触。"
 single_combat.0031.desc.sc_attacker.POD_khaibits_embrace: "我的对手挣脱了我的擒抱。"
 single_combat.0031.desc.sc_attacker.POD_serqets_sting: "剧毒几乎没有对我的敌人产生作用。"
 single_combat.0031.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim: "圣甲虫没对我的敌人起到太大的作用。"
 single_combat.0031.desc.sc_attacker.POD_spear_of_anubis: "我的对手躲开了我的攻击。"
 single_combat.0031.desc.sc_attacker.POD_spark_of_ra.injury: "我的对手躲开了，并回以强而有力的一击。"
 single_combat.0031.desc.sc_attacker.POD_deaths_hand.injury: "我的敌人躲开并反击了我。"
 single_combat.0031.desc.sc_attacker.POD_ashes_to_ashes.injury: "我的咒语失效了，我只能被反击了。"
 single_combat.0031.desc.sc_attacker.POD_dust_to_dust.injury: "我的对手躲开了，让我面临反击。"
 single_combat.0031.desc.sc_attacker.POD_khaibits_embrace.injury: "我的对敌人的束缚被挣脱，这让我很容易受到反击。"
 single_combat.0031.desc.sc_attacker.POD_serqets_sting.injury: "我受伤了，但我还站着。"
 single_combat.0031.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.injury: "我的对手回以强而有力的一击。"
 single_combat.0031.desc.sc_attacker.POD_spear_of_anubis.injury: "我的敌人回以强而有力的一击。"
 single_combat.0031.desc.sc_attacker.POD_spark_of_ra.fatality: "对手的反击击倒了我。"
 single_combat.0031.desc.sc_attacker.POD_deaths_hand.fatality: "其还以强有而力的反击。我的脸狠狠的砸到了地上。"
 single_combat.0031.desc.sc_attacker.POD_ashes_to_ashes.fatality: "对面回赠了我充满力量的一次攻击。我眼前一黑。"
 single_combat.0031.desc.sc_attacker.POD_dust_to_dust.fatality: "对手的反击命中了我。我陷入到黑暗之中。"
 single_combat.0031.desc.sc_attacker.POD_khaibits_embrace.fatality: "他们挣脱了我的擒抱，并把我击倒。"
 single_combat.0031.desc.sc_attacker.POD_serqets_sting.fatality: "我的敌人不为所动，然后迅速将我击倒。"
 single_combat.0031.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.fatality: "我的对手发动反击，并将我打倒在地。"
 single_combat.0031.desc.sc_attacker.POD_spear_of_anubis.fatality: "我被对手的反击击倒了。"
