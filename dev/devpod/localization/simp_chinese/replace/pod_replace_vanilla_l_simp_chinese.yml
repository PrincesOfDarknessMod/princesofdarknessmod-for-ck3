 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$找到更多[mercenary_task_contracts|E]\n$EFFECT_LIST_BULLET$找到更多涉及[prowess|E]与[martial|E]的[task_contracts|E]\n\n#WEAK 雇佣兵首先靠刀剑赚取钱财。通常是合法的，但在时局艰难、而你只有一把战斧的时候……#!"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$均等概率发现任何类型的[task_contracts|E]\n$EFFECT_LIST_BULLET$无需花费大量[prestige|E]就能切换到其他$camp_purpose$\n\n#WEAK 开放的道路提供了一种与其他道路截然不同的自由：为什么要用一个不必要的基地来玷污它呢？#!"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$找到更多涉及[learning|E]与[stewardship|E]的[task_contracts|E]\n$EFFECT_LIST_BULLET$找到稍多一些涉及[diplomacy|E]的[task_contracts|E]\n\n#WEAK 只藏于一馆的书卷是沉寂的，只存于一心的思想是浪费的。#!"
 camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$找到更多各类[criminal_task_contracts|E]\n$EFFECT_LIST_BULLET$找到更多涉及[prowess|E]与[intrigue|E]的[task_contracts|E]\n\n#WEAK “强盗”是个难听的词——果断务实没什么错，尤其当你能同时赚点小钱的时候。#!"
 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$平等几率找到任何类型的[task_contracts|E]\n$EFFECT_LIST_BULLET$可以对国王和皇帝使用$request_laamp_legitimist_support$互动\n$EFFECT_LIST_BULLET$可以使用$claim_cb$[casus_belli|E]\n$EFFECT_LIST_BULLET$找到独特的$laamp_legitimist_support_contract$[task_contract|E]\n\n#WEAK 他们称之为宣称。仅仅是个宣称。这不仅是宣称，这是一张债务凭证，一份意图声明，更是即将到来的收复行动的明确标记。#!"
