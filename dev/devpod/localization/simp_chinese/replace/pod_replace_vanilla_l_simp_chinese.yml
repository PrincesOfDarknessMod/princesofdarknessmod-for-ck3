 warhorse.1101.t:1 "[ROOT.Char.Custom('WarhorseStoryName')|U]：良宵"
 warhorse.1101.b:0 "天气太好了，我要好好欣赏一番！"
 find_suitable_accolade_successor_interaction_desc:0 "你的角色无法自动寻找合适的勋号继任者。"
 bp1_yearly.7100.desc:0 "前一刻我还在[owned_county.GetName]走路散心，下一刻我就浑身是屎，摔倒在泥巴地里。我愤怒地将[ROOT.Char.Custom('EyeEyes')]上面的粪便抹掉，发现罪魁祸首正在偷着乐。\n\n“[potential_nemesis.GetTitledFirstName]送来[potential_nemesis.GetHerHis]的问候！”一个农民把身子探出窗户，大声叫道，然后火速逃离了现场。\n\n非常可悲的是，我本来打算去旁边的小溪清洗一张我特别珍爱的毛皮，但很显然，现在这张毛皮已经抢救不回来了。"
 trait_tourney_participant:2 "枪斗士"
 trait_tourney_participant_desc:1 "该角色参加过武术比赛，磨练了自己在作战和个人格斗上的技巧。"
 trait_tourney_participant_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip]参加过武术比赛，磨练了自己在作战和个人格斗上的技巧。"
 trait_track_foot:0 "步战"
 bp1_yearly.9010.desc.drunk:0 "浑身散发着恶臭味。[bp1_yearly_9007_doppelganger.GetSheHe|U]摇摇晃晃地向我走来，眼中满是愤怒。\n\n“冒名顶替的骗子！那个*#EMP 嗝#!*"
 bp1_yearly.9010.desc.stoner:0 "浑身散发着臭味。[bp1_yearly_9007_doppelganger.GetHerHis|U]那泛着血丝的眼睛怒视着我的头，同时踉踉跄跄地朝我走来，还一直像个疯子一样咯咯地笑。\n\n“冒名顶替者！那个*#EMP 咳嗽#!*"
 bp1_yearly.9010.desc.outro:0 "[ROOT.Char.Custom('InsultAdjective')][ROOT.Char.Custom('InsultNoun')]不是[ROOT.Char.GetNameNoTooltip]！我才是真正的[ROOT.Char.GetNameNoTooltip]！”\n\n虽然这是一个明显的谎言，但我的宫廷不知为何被说服了，我的真实身份陷入了争议！随着[bp1_yearly_9007_doppelganger.GetNameNoTooltip]拔出[bp1_yearly_9007_doppelganger.GetHerHis]的武器，暴力成了唯一的答案。"
 gruesomefestivalname_spectacle:0 "搏斗"
 gruesomefestivalname_spectacles:0 "搏斗"
 fp1_other_decisions.0002.b:0 "为每个[blotter.Custom('WomanManPerson_GenderPreference')]都准备一只野兽或野禽！"
 fp1_other_decisions.0003.desc.intro.colosseum_small:0 "虽然聚会的规模不大，但[blotter.Custom('GruesomeFestivalName')]的气氛热烈，喜悦的观众推推搡搡，争相起哄，只见"
 fp1_other_decisions.0003.desc.intro.colosseum_medium:0 "斗兽场里挤满了喜悦的观众，一阵喧哗后，只见"
 fp1_other_decisions.0003.desc.intro.colosseum_large:0 "[blotter.Custom('GruesomeFestivalName')]中宾客云集，坐满了整个斗兽场，人声鼎沸，只见"
 fp1_other_decisions.0003.desc.colosseum_animals.regular:0 "一群凶猛的狼被赶入竞技场。 \n\n"
 fp1_other_decisions.0003.desc.colosseum_animals.magnificent:0 "一群雄伟的狮被赶入竞技场。 \n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.regular.sans_chief:0 "一群囚犯被带入竞技场，给予武器，然后释放与我们的狼群战斗。\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.magnificent.sans_chief:0 "一群令人生畏的角斗士进入竞技场，雄伟的狮群紧随其后。\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.regular.plus_chief:0 "[sacrifice.GetFirstName]被引入竞技场，赤手空拳，被留下来对抗一大群囚犯和狼。\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.magnificent.plus_chief:0 "[sacrifice.GetFirstName]被引入竞技场，赤手空拳，被留下来对抗一大群角斗士和狮子。\n\n"
 fp1_other_decisions.0003.desc.sacrifice.named.colosseum:0 "永无止尽的猛攻终于让[sacrifice.GetHerHim|l]精疲力竭。在诚然可笑的暴行和流血后，[sacrifice.GetFirstName]断了气，鼓动观众爆发出震耳欲聋的欢呼。"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.colosseum:0 "有些角斗士被训练来战斗，有些则不是。这无关紧要，到头来他们没人能活到最后。"
 fp1_other_decisions.0003.desc.sacrifice.animal.colosseum:0 "许多饥饿的野兽将彼此撕成碎块，这让我们受训的猎手省了不少事。"
 fp1_other_decisions.0003.desc.outro.colosseum:0 "\n\n这场盛大表演将会是我宫廷未来数月的谈资。"
 fp1_other_decisions.0003.g:0 "这似乎是给贵族留下深刻印象的好机会。"
 fp1_other_decisions.0003.h:0 "是时候要跟泥腿子接触下了！"
 religious_decision.0201.basilica:0 "圣辛普利西奥大教堂。"
 religious_decision.0211.desc.beginning.basilica:0 "我退隐到圣米歇尔大教堂的一个僻静礼拜堂，开始了长时间的禁食和冥想。\n\n教堂里不拘一格的建筑和宗教艺术鼓舞人心。 在上帝的土地上，没有其他地方能让我感觉与祂如此接近。"
 religious_decision.0211.desc.result.medium_stress:0 "\n\n这偏远的地方好处多多，让我暂时摆脱了宫廷中通常必须处理的日常问题。"
 religious_decision.0211.desc.result.major_stress:0 "\n\n我独自待在荒野中，宫廷里几乎压垮我的烦恼现在没有任何重量。许久以来，我第一次感觉到了平静。"
