 game_concept_levies_desc: "$game_concept_levies$常常卷入超自然存在的战争，却往往不知自己真正效忠于谁。\n\n每个[holding|E]为其[holder|E]提供一定数量的$game_concept_levies$。[vassals|E]据此向其[liege|E]提供自己的一部分$game_concept_levies$。\n\n$game_concept_levies$主要由装备简陋的战士#weak （农民民兵，市井无赖，当地佣兵，穷困贵族，小地主，等等）#!构成，并被认为是一种独有的部队类型。\n\n一支$game_concept_levy$有着[GetDefine('NCombat', 'LEVY_ATTACK')|0][damage|E]和[GetDefine('NCombat', 'LEVY_TOUGHNESS')|0][toughness|E]。游戏中的另一种[soldiers|E]是[men_at_arms|E]——昂贵而训练有素的职业士兵。"
