l_simp_chinese:
 POD_book_of_nod_decision: "挪得之书"
 POD_book_of_nod_decision_tooltip: "挪得之书是该隐之子传说中的著名宝物。"
 POD_book_of_nod_decision_opening_desc: "你将回顾你所收集的挪得之书故事，供集会或阅读。"
 POD_book_of_nod_decision_effect_tooltip: "你可以合成挪得之书的篇章或阅读内容。\n\n一套古老的文书，被挪得学家该隐之子视为圣物。它由多页修订和残页组成，被不同的血族学者重新组合。传统上，该隐的故事的主要传播方式是口述，而带有该隐之子历史上最重要事件的文本则被严密保护，以保护该隐之子。它的作者不详，尽管末卡维、扫罗，甚至该隐都经常被引证为写了它的部分内容，即使不是全部内容。有些人认为整本书是神话或谎言，是吸血鬼为了解释他们的存在而编造的故事，或者是用来误导他人以某种方式思考和行动的工具。该书最古老的片段被确定为在苏美尔时代之前，大约是公元前4500年。"
 POD_book_of_nod_decision_confirm: "参考挪得之书"
 POD_book_of_nod_decision_custom_cain: "你必须拥有该隐传"
 POD_book_of_nod_decision_custom: "你必须拥有[ARTIFACT.Custom('ColorizedArtifactName')]"