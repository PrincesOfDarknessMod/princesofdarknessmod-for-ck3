 seasons_struggle: "四季之战"
 seasons_struggle_desc: "$bm_1230_fae_desc$"
 struggle_seasons_phase_opportunity: "机会"
 struggle_seasons_phase_opportunity_desc: "在$struggle_seasons_phase_conciliation$的长期合并共处后，自满情绪开始出现。农民和贵族都安逸地感到各种事情都#EMP 能运作#!，使得更多精明的[characters|E]得以利用他们的天真。\n\n最终，新的滥用权力要么导致事态升级为$struggle_seasons_phase_hostility$，要么在高明的政治活动下通过$struggle_seasons_phase_conciliation$达成不稳定平衡。"
 struggle_seasons_phase_hostility: "互有敌意"
 struggle_seasons_phase_hostility_desc: "在这个$game_concept_struggle_phase_phase$中，局势变得紧张，火星四溅。$struggle_seasons_phase_opportunity$中反复出现的恶意行为和不断升级的误解，导致不同[cultures|E]或不同[faiths|E]的[characters|E]之间的仇恨日益高涨，如果二者均不同的话，甚至#EMP 更糟#!\n\n不过，这样的流血事件不会永远持续下去。最终，三岛将走进$struggle_seasons_phase_compromise$，无论是出自一个冷静头脑的引领下，还是他们单纯打不动了。"
 struggle_seasons_phase_compromise: "相互妥协"
 struggle_seasons_phase_compromise_desc: "无论是由于对$struggle_seasons_phase_hostility$的冲突的反感，还是由于$struggle_seasons_phase_conciliation$中巧妙的逐步升级，$game_concept_struggle_phase_iberia_compromise$代表着妖精人民之间关系的日益和缓。分歧被搁置，共同的历史和传承将昔日的敌人联系在了一起。\n\n三岛正处于一个十字路口：如果纷争再次出现，那么等待着的将是$struggle_seasons_phase_opportunity$。"
 struggle_seasons_phase_conciliation: "和平调解"
 struggle_seasons_phase_conciliation_desc: "这是成功的$struggle_seasons_phase_compromise$的产物，在这个$game_concept_struggle_phase_phase$中，妖精人民之间的关系变得如此友善，以至于外人很难理解他们的宽容。跨[faith|E][marriages|E]非常常见。\n\n但是，这种情况不会永远持续下去，滥用信任最终会将$seasons_struggle$带回$struggle_seasons_phase_compromise$。"
 struggle_seasons_ending_hostility_decision: "中立赢家"
 struggle_seasons_ending_hostility_decision_desc: "没妖精能猜到一个至日妖精能够赢得四季之战，但你做到了，现在他们会听你的，因为你将选择哪个季节应该掌权。"
 struggle_seasons_ending_hostility_decision_tooltip: "结束四季之战[struggle|E]"
 struggle_seasons_ending_hostility_decision_confirm: "结束四季之战"
 struggle_seasons_ending_winter_victory_decision: "永恒冬日"
 struggle_seasons_ending_winter_victory_decision_desc: "事已至此，是时候由一位强大的领导者将妖精王廷从王廷和分裂的四季之战泥潭中拉出来了。冬季已到，且不再走。"
 struggle_seasons_ending_winter_victory_decision_confirm: "永恒冬日"
 struggle_seasons_ending_spring_victory_decision: "希望永不止息"
 struggle_seasons_ending_spring_victory_decision_desc: "事已至此，是时候由一位强大的领导者将妖精王廷从战争和分裂的四季之战泥潭中拉出来了。春已再临。"
 struggle_seasons_ending_spring_victory_decision_confirm: "希望永不止息"
 struggle_seasons_ending_summer_victory_decision: "夏日长青"
 struggle_seasons_ending_summer_victory_decision_desc: "事已至此，是时候由一位强大的领导者将妖精王廷从战争和分裂的四季之战泥潭中拉出来了。夏将持续。"
 struggle_seasons_ending_summer_victory_decision_confirm: "夏日长青"
 struggle_seasons_ending_autumn_victory_decision: "必定之秋"
 struggle_seasons_ending_autumn_victory_decision_desc: "事已至此，是时候由一位强大的领导者将妖精王廷从战争和分裂的四季之战泥潭中拉出来了。秋是不可避免的。"
 struggle_seasons_ending_autumn_victory_decision_confirm: "必定之秋"
 struggle_seasons_ending_compromise_decision: "僵持"
 struggle_seasons_ending_compromise_decision_desc: "四季无尽的冲突只会削弱我们所有人。是时候接受妖精王廷永远不会统一。"
 struggle_seasons_ending_compromise_decision_tooltip: "结束四季[struggle|E]"
 struggle_seasons_ending_compromise_decision_confirm: "结束四季斗争"
 struggle_seasons_ending_conciliation_decision: "四季联合"
 struggle_seasons_ending_conciliation_decision_desc: "过去数世纪的伤口不会轻易愈合，但我们必须努力，才能让妖精王廷寻得长久的和平。四季实在应当轮回。"
 struggle_seasons_ending_conciliation_decision_tooltip: "结束四季之战[struggle|E]"
 struggle_seasons_ending_conciliation_decision_confirm: "结束四季之战"
