 pod_seasons_struggle.0501.t: "四季之战"
 pod_seasons_struggle.0501.desc: "$bm_1230_fae_desc$"
 pod_seasons_struggle.0501.a: "把握命运！"
 pod_seasons_struggle.100.t: "哪个季节应当掌权？"
 pod_seasons_struggle.100.desc: "虽处逆境，至日王廷赢得了四季之战。妖精将听从您的选择，由哪个季节来统治妖精世界。\n\n#EMP “我们没有宏伟的歌曲。\n没有诗文。\n没有词章。\n然而，我们不受任何人的束缚；\n既不是四季轮回的奴隶，\n也不是命运之轮的奴仆。”#!"
 pod_seasons_struggle.100.a: "冬季应当掌权！"
 pod_seasons_struggle.100.b: "春季应当掌权！"
 pod_seasons_struggle.100.c: "夏季应当掌权！"
 pod_seasons_struggle.100.d: "秋季应当掌权！"
 pod_seasons_struggle.101.t: "冬日不息"
 pod_seasons_struggle.101.desc: "四季之前几个世纪所遭受的混乱在妖精心中留下了阴影。今天，四季的历史翻开了新的篇章……冬季已到，且不再走。\n\n#EMP “太阳低垂在她的天空中，害怕她所创造的阴影，\n而夜晚坐在他阴湿的洞穴里等待，\n等待她沉入冰封的贫瘠土地深处，\n让霜冻从鲜血中吸取温暖，\n再次释放森林的掠食生物。”#!"
 pod_seasons_struggle.101.a: "永恒冬日"
 pod_seasons_struggle.102.t: "春意盎然"
 pod_seasons_struggle.102.desc: "四季之前几个世纪所遭受的混乱在妖精心中留下了阴影。今天，四季的历史翻开了新的篇章……春已再临。\n\n#EMP “黎明破晓了纯净的白昼，新的生命开始了，\n冬天残缺的手紧握的束缚也解开了，\n融化的雪水顺着大自然的成长之躯流淌，\n然而，绽放的花朵虽然美丽，\n并没有足够的力量来保护它免受她的风暴。”#!"
 pod_seasons_struggle.102.a: "春已再临。"
 pod_seasons_struggle.103.t: "夏日长青"
 pod_seasons_struggle.103.desc: "四季之前几个世纪所遭受的混乱在妖精心中留下了阴影。今天，四季的历史翻开了新的篇章……夏将持续。\n\n#EMP “大自然的果实巅峰在午后的温暖中膨胀，\n这是一年中最充盈的时刻，黑暗离我们最远，\n一种宁静的镇定笼罩着野兽和人类，\n就像夏日的懒散编织出可怕的外衣，\n将软弱者笼罩在意志的缺失中，让狡猾者露出獠牙。”#!"
 pod_seasons_struggle.103.a: "夏将持续。"
 pod_seasons_struggle.104.t: "秋暮世界"
 pod_seasons_struggle.104.desc: "四季之前几个世纪所遭受的混乱在妖精心中留下了阴影。今天，四季的历史翻开了新的篇章……秋是不可避免的。\n\n#EMP “黄昏时分，色彩随着凋零的叶子一同下降，\n就像蝴蝶的翅膀是一个警示，它们的美丽欺骗了我们，\n因为它们的色彩像墨水一样洒落，它们正在死去，\n正如季节的薄雾悄悄低语，\n这种生机勃勃只是种幻觉，秋天一直在撒谎。”#!"
 pod_seasons_struggle.104.a: "秋是不可避免的。"
 pod_seasons_struggle.110.t: "分配"
 pod_seasons_struggle.110.desc: "如果事情继续这样发展，显然现在这种流血的循环不会停止，妖精王廷不会统一。作为协调者，你将选择哪个王国属于哪个王廷。"
