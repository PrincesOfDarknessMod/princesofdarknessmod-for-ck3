 foster_sprite_decision: "寻找继承人"
 foster_sprite_decision_tooltip: "你的仆人将会列出一些合适的候选人"
 foster_sprite_decision_desc: "真妖精的繁育能力不强，但能促生小精灵为真妖精。因此，如果你不想让你的努力因为一次不幸的事故而前功尽弃的话，你必须做好准备。你将要求你的仆人列出一些合适的候选人。"
