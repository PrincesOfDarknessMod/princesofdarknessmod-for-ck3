 a_way_back_to_heaven_objective_decision: "重返天庭"
 a_way_back_to_heaven_objective_decision_desc: "在美猴王设法找到返回天庭的方法，并将他的知识分享给小神之前，妖仙们无法自保，无法抵御食气的敌人。学习内丹术，占据最强大的龙穴，你就有可能达成道德仙道，重返天庭。"
