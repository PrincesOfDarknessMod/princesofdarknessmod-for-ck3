l_simp_chinese:
 elixir_of_eternal_life_starter_decision: "寻找长生不老药的任务"
 elixir_of_eternal_life_starter_decision_desc: "对许多人而言，长生不老药是由八仙或其仆从吴天赐予的。然而，传说中也有不经他们帮助便达到如此启蒙境界，并获得随之而来的永生之人。许多人认为这样的成就简直不可能。正如大师本人所言，尽管聋者听不见雷声或欣赏音乐，盲者看不见太阳与皇袍的光辉，但这并不意味着这些事物不存在。有人说，亲自取得仙药本身就是一场考验，以证明你配得上它。另一些人则说，那是上天赐予你的选择，让你自行决定是否沉沦。\n\n#R 你在此任务中成功的机会极为渺茫。若你在意你角色的安危，切勿尝试。\n即便你通过保存并重新载入游戏来赌运气，也无法在日后拯救你。你已得到警告。#!"
 elixir_of_eternal_life_starter_decision_tooltip: "长生不老药可以让我们获得永生，且没有任何副作用。"
 elixir_of_eternal_life_starter_decision_confirm: "好的，我们开始吧。"
 elixir_of_eternal_life_starter_decision_requirement_dutchman: "拥有并装备#TOOLTIP:artifact_flying_dutchman_description #L $artifact_flying_dutchman_name$#!#![artifact|E]"
 elixir_of_eternal_life_starter_decision_requirement_redeyes: "拥有并装备#TOOLTIP:artifact_redeyes_description #L $artifact_redeyes_name$#!#![artifact|E]"
 elixir_of_eternal_life_starter_decision_requirement_quarters: "拥有并装备#TOOLTIP:artifact_ship_of_the_four_quarters_description #L $artifact_ship_of_the_four_quarters_name$#!#![artifact|E]"
 elixir_of_eternal_life_stage1_unlock_next_phase: "解锁当前路径的下一步"
 elixir_of_eternal_life_stage1_unlock_next_phase_caveat: "如果你成功的话，$spell_of_life_stage1_unlock_next_phase$"
 elixir_of_eternal_life_stage1_do_multiple_stages: "#help \n\n虽然更具挑战性，但你会发现完成一条道路能在之后带来额外的奖励。#!"
 elixir_of_eternal_life_stage1_warning: "\n\n#R 准备好为了追求真正的不朽而牺牲一切，因为这条道路充满危险！#!"
 elixir_of_eternal_life_stage1_decision_completion_message_title: "你的理解加深了。"
 elixir_of_eternal_life_stage1_decision_completion_message_desc: "你已解锁该道路下一个目标。"
 elixir_of_eternal_life_request_aid_decision: "请求援助"
 elixir_of_eternal_life_request_aid_decision_desc: "你已成就了几乎无人敢想之事：守护中原，阻遏了[Glossary('魔皇','podgloss.demonemperor')]的崛起。正因如此，你得以跻身统御屋室的八仙之列。如今你寻求永生灵药，八仙或许愿助你一臂之力。"
 elixir_of_eternal_life_request_aid_decision_confirm: "我应当寻求他们的指引。"
 elixir_of_eternal_life_request_aid_decision_tooltip: "作为第九不朽者，其他人或许愿意协助我最新的任务"
 elixir_of_eternal_life_ninth_immortal_bonus_xp: "每当你完成一段[journey|E]旅程，八仙的洞见将会赋予#color_white 5.00#!额外的[trait_level_track_xp|E]经验值，用于长生不老药#weak （[GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]）#!"
 elixir_of_eternal_life_remove_bad_traits_decision: "掌控内腑"
 elixir_of_eternal_life_remove_bad_traits_decision_tooltip: "苦难铸就律能，纷乱孕育清明。"
 elixir_of_eternal_life_remove_bad_traits_decision_desc: "我所肩负的重担无需定义我。昔日我在压力之下动摇，如今我视之为机遇。\n\n我不再沉溺于破坏性的习惯。相反，我将掌握自我。"
 elixir_of_eternal_life_remove_bad_traits_decision_confirm: "我自己是大师。"
 elixir_of_eternal_life_remove_bad_traits_decision_effect: "特质将被新特质所取代"
 elixir_of_eternal_life_stage1_internal_phase1_decision: "将精华提炼为气息"
 elixir_of_eternal_life_stage1_internal_phase1_decision_desc: "在追寻[Concept('POD_elixir_of_eternal_life', '长生不老药')|E]的过程中，宇宙与人体的三大主要成分——灵、气、精——依次回归于前一个成分。此举旨在逆转它们从道中衍生的顺序，从而回归过程的起点。通过这样的回归，气得以蓄存，死亡的结扣得以解开。\n\n伊始，须提炼、凝聚并固化内心的精气，以孕育一个由气构成的内在胚胎。$elixir_of_eternal_life_stage1_do_multiple_stages$$elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_internal_phase1_decision_tooltip: "将本质重新融入气息，以回到程序的起点。"
 elixir_of_eternal_life_stage1_internal_phase1_decision_confirm: "如此，便开始了。"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_stress: "你拥有#color_white 0#![stress|E]"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_illness: "你没有#bold 任何疾病#!。"
 elixir_of_eternal_life_stage1_internal_phase2_decision: "凝气化灵"
 elixir_of_eternal_life_stage1_internal_phase2_decision_desc: "随着重生的胚胎孕育成形，是时候继续精炼并统一三者内在之力了。你身体的所有病痛皆源于阻塞气息循环、挤压五脏的节点。内在隐秘气息的正确循环，不受身体束缚，方能治愈这些困扰。与其他万物一样，你的气息必须循环流动，形成永不停歇的式样。此程序融合了多种身体动作，包括弯曲、扩张、收缩与伸展，以及呼吸技巧。"
 elixir_of_eternal_life_stage1_internal_phase2_decision_tooltip: "将气息重新融入灵中，以回归程序之始。"
 elixir_of_eternal_life_stage1_internal_phase2_decision_confirm: "后来者居上"
 elixir_of_eternal_life_stage1_internal_phase3_decision: "炼灵归虚"
 elixir_of_eternal_life_stage1_internal_phase3_decision_desc: "随着灵性的精炼，你的脏腑将逐一转化为金玉。呼吸化为硫磺之气，血液变为朱砂之液。假以时日，独处静思，灵性净化至虚无，直至身体空澈。愚者视空为终结，你却见其中蕴含无限相连之机。\n\n若万物中心无虚空，以形为实，阳中无阴，何以生成？知白守黑，此乃存世之秘，鲜有人知，而今……为你所悟。"
 elixir_of_eternal_life_stage1_internal_phase3_decision_tooltip: "回到程序的起点。"
 elixir_of_eternal_life_stage1_internal_phase3_decision_confirm: "最初的返乡之旅，应道而行。"
 elixir_of_eternal_life_stage1_internal_phase3_decision_requirement_schemes: "你需要拥有#color_white 0#!激活的[schemes|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision: "采集金花与玉露"
 elixir_of_eternal_life_stage1_external_phase1_decision_desc: "你为制作[Concept('POD_elixir_of_eternal_life', '长生不老药')|E]而进行的实验与仪式需要大量原料，而这些原料并非全部生长在你的故土。若想达成使命，你必须能随时获取这些原料及其原生生态环境。$elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_external_phase1_decision_tooltip: "原料必须从许多地方采集"
 elixir_of_eternal_life_stage1_external_phase1_decision_confirm: "将其移植到我的花园中"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_desert: "你的领地包含一个旱地、沙漠或沙漠山地[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cold: "你的领地包含一个山地或针叶林[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cultivated: "你的领地包含一个农田或梯田丘陵[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_water: "你的领地包含一个洪泛平原或绿洲[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_forest: "你的领地包含一个森林或丘陵[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_wet_forest: "你的领地包含一个丛林或湿地[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_plains: "你的领地包含一个平原或草原[terrain|E]省份"
 elixir_of_eternal_life_stage1_external_phase2_decision: "准备余烬辉光灌注"
 elixir_of_eternal_life_stage1_external_phase2_decision_desc: "草药材料已经备齐，现在是时候准备烬光药液了。要酿造它，你需要收集多种能增强身体不同部位的物品。若你愿意探索，也可以从[umbra|E]中采集替代材料。"
 elixir_of_eternal_life_stage1_external_phase2_decision_tooltip: "要继续，你必须收集各种食材。"
 elixir_of_eternal_life_stage1_external_phase2_decision_confirm: "首先，将飞龙爪和九节菇一起研磨..."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bygones: "你拥有至少1个强力或强大[POD_bygones_maa|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_umbra_aptitude: "你拥有#V 150%#![umbra_aptitude|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bound_wraith_skills: "你所束缚$POD_splat_wraith_plural$的技能总和必须超#V 100#!"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_can_use: "#color_white 你#!可以使用该宝物。"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_health: "拥有增加[health|E]或抵消[health|E]惩罚的宝物修正"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_diplomacy: "拥有一个增加[diplomacy|E]或抵消[diplomacy|E]惩罚的宝物修正"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_martial: "拥有一个宝物修正，增加[martial|E]或抵消[martial|E]惩罚"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_stewardship: "拥有一个增加[stewardship|E]或抵消[stewardship|E]惩罚的宝物修正"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_intrigue: "拥有增加[intrigue|E]或抵消[intrigue|E]惩罚的宝物修正"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_learning: "拥有增加[learning|E]或抵消[learning|E]惩罚的宝物修正"
 elixir_of_eternal_life_stage1_external_phase3_decision: "调制紫色黄金药水"
 elixir_of_eternal_life_stage1_external_phase3_decision_desc: "灌注完成后，下一步是在龙穴深处配制紫金仙丹。天紫晶魂兰不可或缺，唯有从[UmbraGlossary('heavenly_flower_garden')]中取得。至于其他材料，你可以调配其他药剂，并提取强力物品的特性。或者，与某些诸灵立约，也能获得所需的成分与魔法。"
 elixir_of_eternal_life_stage1_external_phase3_decision_tooltip: "此药剂的成分要求颇为不寻常。"
 elixir_of_eternal_life_stage1_external_phase3_decision_confirm: "将花瓣浸泡在草酒的浴液中，历时……"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_health: "拥有增加[health|E]或抵消[health|E]惩罚的宝物修正，不包括同一修正多次叠加带来的加成"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_diplomacy: "拥有增加[diplomacy|E]或抵消[diplomacy|E]惩罚的宝物修正，不包括同一修正多次叠加带来的加成"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_martial: "拥有增加[martial|E]或抵消[martial|E]惩罚的宝物修正，不包括同一修正多次叠加带来的加成"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_stewardship: "拥有增加[stewardship|E]或抵消[stewardship|E]惩罚的宝物修正，不包括同一修正多次叠加带来的加成"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_intrigue: "拥有增加[intrigue|E]或抵消[intrigue|E]惩罚的宝物修正，不包括同一修正多次叠加带来的加成"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_learning: "拥有增加[learning|E]或抵消[learning|E]惩罚的宝物修正，不包括同一修正多次叠加带来的加成"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision: "一个愿景，一个目标"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_desc: "Before one can nourish their [Concept('POD_elixir_of_eternal_life', 'inner life')|E], they must nourish the lives of those around them. Unlike the bellow breathers, a true follower of the Tao seeks immortality alongside and to benefit their family and community. One hand struggles where many hands build, and endless life comes from a fruitful connection with all of creation. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_tooltip: "让我们团结一致"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_confirm: "团结则存，孤立则亡。"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_development: "你的领地拥有至少100点[development|E]。"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_prisoners: "你#bold 没有#!任何[prisoners|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_dread: "你的[dread|E]少于#color_white 10#!"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_vassals: "所有强力封臣对你的好感度至少为#color_green 50#!。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision: "气息交融"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_desc: "成就他人之生命后，是时候将目光转向内，培育你的内在生命。你必须孕育一个不受死亡影响、作为未来重生之种的内胎。他人致力于炼化内息，而你知晓一条别样途径。要孕育此胎，你必须与他人激发并交换气机。阴须与阳相会。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_tooltip: "阴必须与阳交融。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_confirm: "两息必须合而为一"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_relations: "你至少拥有#color_white 1#!位[spouse|E]、[concubine|E]或[lover|E]"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_skills: "你所有[spouses|E]的技能平均水平至少达到#color_white 15#!"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_opinions: "你所有的[spouses|E]对你好感至少为#color_green 25#!。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_skills: "你所有[concubines|E]能力平均至少达到#color_white 15#!。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_opinions: "你所有[concubines|E]对你的好感至少为#color_green 25#!。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_skills: "你的所有[lovers|E]能力平均至少达到#color_white 15#!。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_opinions: "你所有[lovers|E]对你的好感至少为#color_green 25#!。"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_high_skill: "至少#color_white 1#!位[spouse|E]、[concubine|E]或[lover|E]的所有能力平均不低于#color_white 25#!。"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision: "目的地无需旅程"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_desc: "A pursued goal is never reached. The sage does not act, yet nothing is left undone. Rooted in stillness, the myriad things flourish. Wealth and life flow and are not hoarded. Like water, the sage benefits all life without being noticed. They flow even to the lowliest places where no one chooses to be, unchanged and constant yet capable of reshaping the landscape."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_tooltip: "无为则无所不为"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_confirm: "我本可以采取行动，但选择不去做。"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_child_count: "你至少有#color_white 5#!个孩子"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_skills: "你所有[friends|E]的技能平均水平至少达到#color_white 15#!"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_lowborn: "At least #color_white 1#! [friend|E] is [lowborn|E] or has a [prestige_level|E] of @prestige_level_1_icon! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] or below."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_income: "你的[gold_i][gold|E][income|E]至少为#color_white 10#!。"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_gold_hoard: "你最多拥有[gold_i]#color_white 250#![gold|E]。"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_lifestyle_perks: "未使用的[diplomacy_lifestyle|E]、[martial_lifestyle|E]、[stewardship_lifestyle|E]、[intrigue_lifestyle|E]和[learning_lifestyle|E]生活方式点数总和至少为#color_white 10#!"
 elixir_of_eternal_life_stage2_meditation_decision: "关于永恒的沉思"
 elixir_of_eternal_life_stage2_meditation_decision_tooltip: "沉思所学，或能加深你的理解。"
 elixir_of_eternal_life_stage2_meditation_decision_desc: "虽然研究与学习颇为重要，但没有什么能比得上独处静思，冥想所习得的教训。前方道途或许缓慢而艰辛，因为深思如此深奥之事绝非易事。然而，教义将得以巩固，概念将更为精炼。"
 elixir_of_eternal_life_stage2_meditation_decision_confirm: "是时候进行栽培了。"
 elixir_of_eternal_life_stage2_meditation_decision_effect: "你将选择一个地方来冥想，并[journey|E]前往那里。"
 elixir_of_eternal_life_stage4_internal_decision: "完美平衡"
 elixir_of_eternal_life_stage4_internal_decision_tooltip: "我将先调息自省，最终归于静心。"
 elixir_of_eternal_life_stage4_internal_decision_desc: "时机成熟之时，你将完成远古所始之事。自你受孕之日周年起，你将解开死亡之结。随着时日流转，你的心、脾、肺、肝、肾将化为玉质。至你诞生之时，一念之间，心即静止。如此，凡尘之缚将被斩断，因受尘世所羁者，永难成仙。如此，你的灵魂将升华，因凡俗之躯，终不可精炼。若八仙垂怜，赐你仙丹，你将重生为适合玉皇大帝侍从的新形态。\n\n#N 倘若失败，八仙将百年不再垂听你的请求，确保你得以成长。#!"
 elixir_of_eternal_life_stage4_internal_decision_confirm: "我将自我隔离。"
 elixir_of_eternal_life_stage4_internal_decision_skills: "没有任何[skill|E]高于你所有[skills|E]平均值#color_white 15#!以上（你的平均值：#weak [GetPlayer.MakeScope.ScriptValue('average_of_all_skills')]#!）"
 elixir_of_eternal_life_stage4_external_decision: "炼制九转轮回仙药"
 elixir_of_eternal_life_stage4_external_decision_tooltip: "我要炼制完美的仙药，以便能与八仙对话。"
 elixir_of_eternal_life_stage4_external_decision_desc: "炼制最后所需仙药的时刻已至。你须择吉日攀登至高山之巅，以诸多珍奇材料——包括逝兽之躯——完美炼制此灵药。不容丝毫差错，亦无试炼之机。唯有八仙视为正直之人，方能重获新生之躯。\n\n#N 若失败，则百年之内八仙不再赐见，以确保你成长。#!"
 elixir_of_eternal_life_stage4_external_decision_confirm: "让我们开始攀登吧。"
 elixir_of_eternal_life_stage4_external_decision_bygones: "你至少拥有3个不同的高级或强力[POD_bygones_maa|E]#weak （[GetPlayer.MakeScope.ScriptValue('number_maa_regiments_greater_and_potent_bygones')]）#!"
 elixir_of_eternal_life_stage4_nourishing_decision: "分娩胚胎不朽者"
 elixir_of_eternal_life_stage4_nourishing_decision_tooltip: "我们将共同开启超脱仪式。"
 elixir_of_eternal_life_stage4_nourishing_decision_desc: "你的超脱并非独行，他人将作为接生者促成你的重生。时机一到，你信任的随从们便会开始那一场颇为私密的超脱仪式。在你用亲自打造的仪式武器了断自身、脱离生命之基后，他们将继续进行仪式。他们会在你的尸体上描绘符文，为你穿上特制的服饰，并将你的遗体安置于气的枢纽之处。直至太阳再次西沉或东升，他们将冥想、祈祷并诵唱，为你的归来铺路。毋庸置疑，你将凯旋而归，已经打动了八仙。\n\n#N 倘若你失败，八仙将在一百年内不再召见你，以此确保你的成长。#!"
 elixir_of_eternal_life_stage4_nourishing_decision_confirm: "准备仪式。"
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_size: "你的[GetPlayer.Custom('PODCoterie')]目前有[EmptyScope.ScriptValue('coterie_max_size')]名成员"
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_skills: "你的[GetPlayer.Custom('PODCoterie')]在所有[skills|E]中必须至少达到25点"
 elixir_of_eternal_life_stage4_infernalist_decision: "The Marshaling Grounds"
 elixir_of_eternal_life_stage4_infernalist_decision_tooltip: "在最慷慨主人的帮助下，你可以进入其领域"
 elixir_of_eternal_life_stage4_infernalist_decision_desc: "至高大师已有计策。与恶鬼奴隶不同，你是真正活着，而非仅凭死躯驱动的幽灵，这带来诸多可能。至高大师宣示需要更多如你者。众多凡人渴求永生。经由至仁大师，他们仅需付出与新生同等永恒的服役之代价即可获得。然而，此类人需在至威大师的领域中预备一处空间，借至强大师的生命之气赋力，使其得以重返人世，亦需在愚者辜负至高大师之时受训。至高大师赐你一道炼金秘方，使你得以降临至至高大师的领域，开辟出这样一处所在。"
 elixir_of_eternal_life_stage4_infernalist_decision_confirm: "至高的大师在等待着我"
 elixir_of_eternal_life_stage4_infernalist_decision_effect: "You will enter the Most-Sovereign Master's realm"
 elixir_of_eternal_life_stage4_infernalist_decision_success: "至仁至善的主人赐予了强大的力量"
 elixir_of_eternal_life_stage4_infernalist_decision_failure: "The Most-Dread Master's disappointment lingers for a very long time"
 elixir_of_eternal_life_stage4_success_eoel_caveat: "若你成功，便能获得长生不老药。"
