 pod1230objectives_fera.6.desc: "通过以下选项选择你的种族应遵循的声望类型。"
 advance_rank_decision_desc.wisdom: "#bold 智慧#!：成功对妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）施展敌对计谋、或完成诸灵任务（无论是在灵界还是旅程）来获得声望经验。"
 advance_rank_decision_desc.glory: "#bold 荣耀#!：作为进攻方赢得与妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）的战争、或杀死其等（只有化形者算数）。"
 advance_rank_decision_desc.honor: "#bold 名誉#!：作为防御方赢得与妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）的战争、或建筑圣地来获得声望经验。"
 advance_rank_decision_desc.ferocity: "#bold 凶猛#!：通过赢得非比试决斗或在与圈子同伴训练时选择备战选项来获得声望经验。"
 advance_rank_decision_desc.cunning: "#bold 狡诈#!：率军攻占首都省份、成功达成[infiltration_missions|E]、建筑巢域（只有芭丝特或古拉赫勒可以）来获得声望经验。"
 advance_rank_decision_desc.obligation: "#bold 责任#!：给予同族化形者头衔或提升头衔等级来获得声望经验。"
 advance_rank_decision_desc.succor: "#bold 救助#!：使用治疗互动来获得声望经验。"
 advance_rank_decision_desc.humor: "#bold 幽默#!：赢得棋盘游戏来获得声望经验。"
 advance_rank_decision_desc.infamy: "#bold 恶名#!：购买和平条约或提升头衔等级来获得声望经验。"
 advance_rank_decision_desc.valor: "#bold 勇气#!：完成狩猎来获得声望经验。"
 advance_rank_decision_desc.harmony: "#bold 和谐#!：成功对妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）夺取海边的伯爵领获得声望经验。"
 advance_rank_decision_desc.innovation: "#bold 创新#!：学习或教授灵赋来获得声望经验。 "
 advance_rank_decision_desc.obedience: "#bold 服从#!：处决暴露的[criminals|E]来获得声望经验。"
 restore_per_bast_objective_decision: "重建帕巴斯特"
 restore_per_bast_objective_decision_desc: "“芭丝特之城”曾经是感恩戴德的埃及人对其影猫恩主的信仰中心。它还能再次如此吗？"
 restore_per_bast_objective_decision_tooltip: "我们的古都在等待着我们。"
 restore_per_bast_objective_decision_confirm: "赞美猫咪"
 the_fleeing_scarab_objective_decision: "圣甲虫脱壳"
 the_fleeing_scarab_objective_decision_desc: "圣甲虫脱壳是布巴斯提最珍贵的秘密，它是一种黑暗仪式，允许布巴斯提用其他生物的灵魂来取得永生。"
 the_fleeing_scarab_objective_decision_tooltip: "永生，近在咫尺。"
 the_fleeing_scarab_objective_decision_confirm: "不惜代价"
 fleeing_scarab_decision_custom: "你有任意木乃伊作为你的[best_friend|E]或[soulmate|E]。"
 fleeing_scarab_decision_custom2: "你必须有15名或更多有凡人特质的囚犯。"
 royal_privilege_objective_decision: "皇家特权"
 royal_privilege_objective_decision_desc: "皇家特权是辛巴稀有而珍贵的秘密，它允许辛巴学习其他芭丝特部族的力量。只有最成功的辛巴（也有人说是最冷酷无情的人）才能被抹除者之灵视为配得学习。"
 royal_privilege_objective_decision_tooltip: "作为一国之主有其好处。"
 royal_privilege_objective_decision_confirm: "终于，真正的猫王。"