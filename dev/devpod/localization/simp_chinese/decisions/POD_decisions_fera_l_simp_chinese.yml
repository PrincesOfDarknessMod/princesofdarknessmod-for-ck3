l_simp_chinese:
 changing_moon_decision: "换月仪式"
 changing_moon_decision_tooltip: "你将永久转换到你的下一个月兆。"
 changing_moon_decision_desc: "这场仪式标志着一名古拉赫勒进入她一生月兆的下一个阶段。仪式首先以仪式性净化开始，包括为期一天的禁食和仪式沐浴。在净化结束后，她需要点燃一件象征她过去月兆的物品（比如，代表阿卡斯的儿童玩具，或是代表乌兹马提的木矛）。接下来，她会穿上适合她新月兆的衣服和面部彩绘。最后，她在仪式的其他参与者面前正式宣布她的名字和（新）月兆。其他参与者再使用她的名字和新月兆头衔向她致意。在仪式正式部分后通常紧跟着庆祝活动。"
 changing_moon_decision_confirm: "换月"
 hengeyokai_advance_rank_decision: "提升你的兽庭声望级别"
 hengeyokai_advance_rank_decision_desc: "无论兆相如何，兽庭的所有成员都能获得三种声望——荣耀、美德和智慧。每一位变化妖怪都明白，这三种声望都是更大整体的一部分。"
 hengeyokai_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 hengeyokai_advance_rank_decision_confirm: "我的名望越来越大！"
 ajaba_advance_rank_decision: "提升你的声望级别"
 ajaba_advance_rank_decision_desc: "阿迦巴和他们的芭丝特表亲一样，重视凶猛和狡诈；与猫不同的是，鬣狗人也将责任视为神圣。要想提升凶猛，阿迦巴必须既无畏又凶狠；要想提升责任，鬣狗人必须把族人的利益放在自己的利益之前；要想提升狡诈程度，鬣狗人必须聪明机智。阶级的提升是通过社会挑战和类似于狼族的仪式来实现的。"
 ajaba_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 ajaba_advance_rank_decision_confirm: "我的名望越来越大！"
 bastet_advance_rank_decision: "提升你的声望级别"
 bastet_advance_rank_decision_desc: "猫人声望首先建立在个人尊重的基础上；猫人们更在意个人对另一只芭丝特的看法，而不是整个种群对他的看法。芭丝特的声望分为狡诈、凶猛和名誉三个类别。"
 bastet_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 bastet_advance_rank_decision_confirm: "我的名望越来越大！"
 corax_advance_rank_decision: "提升你的声望级别"
 corax_advance_rank_decision_desc: "科拉克斯和狼族一样追求荣耀、名誉和智慧，但他们最看重的是智慧。"
 corax_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 corax_advance_rank_decision_confirm: "我的名望越来越大！"
 gurahl_advance_rank_decision: "提升你的声望级别"
 gurahl_advance_rank_decision_desc: "熊人重视名誉、救助和智慧。"
 gurahl_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 gurahl_advance_rank_decision_confirm: "我的名望越来越大！"
 kitsune_advance_rank_decision: "长出新尾"
 kitsune_advance_rank_decision_desc: "狐人的声望分为三类，分别是知惠、道德和闪耀，大致相当于狡猾、名誉和荣耀。狐人不太看重声望，它似乎只在与其他种群打交道时有用——不过，狐人认为，如果其他化形者千年来一直在记录声望，那么声望一定有它的道理。"
 kitsune_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 kitsune_advance_rank_decision_confirm: "我的名望越来越大！"
