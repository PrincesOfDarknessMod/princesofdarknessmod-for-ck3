 nuwisha_advance_rank_decision: "提升你的声望级别"
 nuwisha_advance_rank_decision_desc: "努维沙重视幽默、荣耀和狡诈。就化形种族而言，它们并不太注重地位，但很欣赏有一个衡量炫耀权利的系统。"
 nuwisha_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 nuwisha_advance_rank_decision_confirm: "我的名望越来越大！"
 nagah_advance_rank_decision: "提升你的声望级别"
 nagah_advance_rank_decision_desc: "娜迦并不遵循一套声望阶级制度。而是由舍沙决定娜迦何时晋级。\n\n娜迦通过向其同类的最高管理机构舍沙报告而晋级。报告会在南达娜（舍沙的阿南塔）举行。之后，请愿者可以休息一周，等待裁决。同蛇巢的成员通常会一同报告。"
 nagah_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 nagah_advance_rank_decision_confirm: "我的名望越来越大！"
