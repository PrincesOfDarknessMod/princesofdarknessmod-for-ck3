 pod1230objectives_fera.6.desc: "Choose which renown type your breed should follow with the following options."
 advance_rank_decision_desc.wisdom: "智慧：成功对妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）施展敌对计谋、或完成诸灵任务来获得声望经验。"
 advance_rank_decision_desc.glory: "荣耀：作为进攻方赢得与妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）的战争、或杀死其等（只有化形者算数）。"
 advance_rank_decision_desc.honor: "名誉：作为防御方赢得与妖蛆仆从（或盖亚的仆从，如果你信仰妖蛆）的战争、或建筑圣地来获得声望经验。"
 advance_rank_decision_desc.ferocity: "Ferocity: Gain rank experience by winning non practice duels."
 advance_rank_decision_desc.cunning: "Cunning: Gain rank experience by besieging a capital province."
 advance_rank_decision_desc.obligation: "Obligation: Gain rank experience by ranking up in the landed tiers or granting title to a fellow shifter of same changing breeds."
 advance_rank_decision_desc.succor: "Succor: Gain rank experience by acts of healing."
 advance_rank_decision_desc.humor: "Humor: Gain rank experience by winning a board game."
 advance_rank_decision_desc.infamy: "Infamy: Gain rank experience by purchasing a truce or ranking up in the landed tiers."
 advance_rank_decision_desc.valor: "Valor: Gain rank experience by completing a hunt."
 advance_rank_decision_desc.harmony: "Harmony: Gain rank experience by gaining a coastal county from a follower of the Wyrm (or of Gaia if you are a servant of the Wyrm)."
 advance_rank_decision_desc.innovation: "Innovation: Gain rank experience by learning a gift or teaching a gift."
 advance_rank_decision_desc.obedience: "Obedience: Gain rank experience by executing a known [criminal|E]."