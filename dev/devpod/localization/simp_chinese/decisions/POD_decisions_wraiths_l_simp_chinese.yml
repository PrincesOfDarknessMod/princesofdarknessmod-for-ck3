l_simp_chinese:
 POD_wraith_passion_gaining_passions_decision: "获得炽情"
 POD_wraith_passion_gaining_passions_decision_desc: "你的炽情是你存在的核心，也是让你维持存在的部分原因。你从来没有因为自己迫人的爱而停止追随，或者你的复仇之火一直在燃烧，直到伸张正义才会停止。无论细节如何，它们都迫使你坚持下来。"
 POD_wraith_passion_gaining_passions_decision_tooltip: "你将选择新炽情。"
 POD_wraith_passion_gaining_passions_decision_confirm: "让我想想……"
 POD_wraith_passion_find_killer_decision: "炽情：找到我的凶手"
 POD_wraith_passion_find_killer_decision_desc: "没有什么比复仇之火更能让人激情燃烧。"
 POD_wraith_passion_find_killer_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_find_killer_decision_confirm: "没想到我还会回来吧？"
 POD_wraith_passion_find_killer_decision_condition: "杀你的凶手，[TARGET_CHARACTER.GetFirstName]，必须死。"
 POD_wraith_passion_amass_wealth_decision: "炽情：积蓄财富"
 POD_wraith_passion_amass_wealth_decision_desc: "贪即是善，冥界本身也遵循这一核心原则。死亡不会阻止你变得富有。"
 POD_wraith_passion_amass_wealth_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_amass_wealth_decision_confirm: "一座黄金的死者之城，或许？"
 POD_wraith_passion_become_exalted_decision: "炽情：成为高贵之鬼"
 POD_wraith_passion_become_exalted_decision_desc: "荣耀与崇拜驱使着你。随着你的逝去，人群已变，但目标本身未改。"
 POD_wraith_passion_become_exalted_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_become_exalted_decision_confirm: "毕竟，荣耀是永恒的。"
 POD_wraith_passion_become_paragon_decision: "炽情：成为超脱典范"
 POD_wraith_passion_become_paragon_decision_desc: "如果你的狂热未能如你所愿地带你进入天堂，它可能仍是你继续存在的关键。"
 POD_wraith_passion_become_paragon_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_become_paragon_decision_confirm: "信仰的考验成功了吗？"
 POD_wraith_passion_create_a_treasury_decision: "炽情：充实你的宝库"
 POD_wraith_passion_create_a_treasury_decision_desc: "在冥界，宝物与遗物是稀有的商品。那些囤积它们的人能迅速提升影响力与权力。"
 POD_wraith_passion_create_a_treasury_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_create_a_treasury_decision_confirm: "我的宝贝！"
 POD_wraith_passion_create_a_treasury_decision_conditiona: "你必须得有#V 3#!件普通或更高级的宝物在库存中"
 POD_wraith_passion_create_a_treasury_decision_conditionb: "你必须得有#V 3#!件大师或更高级的宝物在库存中"
 POD_wraith_passion_create_a_treasury_decision_conditionc: "你必须得有#V 3#!件名作或更高级的宝物在库存中"
 POD_wraith_passion_create_a_treasury_decision_conditiond: "你必须得有#V 3#!件卓越级的宝物在库存中"
 POD_wraith_passion_build_a_great_work_decision: "炽情：建造一座奇观"
 POD_wraith_passion_build_a_great_work_decision_desc: "一些建筑奇迹比它们的建筑师更持久。你将尝试反过来。"
 POD_wraith_passion_build_a_great_work_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_build_a_great_work_decision_confirm: "宏伟壮丽！"
 POD_wraith_passion_build_a_great_work_decision_condition: "[TARGET_TITLE.GetNameNoTier]的特殊建筑，必须已被建筑。"
 POD_wraith_passion_make_a_friend_decision: "炽情：交至交朋友"
 POD_wraith_passion_make_a_friend_decision_desc: "毕竟，同病相怜"
 POD_wraith_passion_make_a_friend_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_make_a_friend_decision_confirm: "一段永恒的友谊？"
 POD_wraith_passion_protect_family_decision: "炽情：保护我的家族"
 POD_wraith_passion_protect_family_decision_desc: "它们承载着你的一部分，并且可以永远继续下去……如果它们能幸存的话。"
 POD_wraith_passion_protect_family_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_protect_family_decision_confirm: "守护着它们……"
 POD_wraith_passion_protect_family_decision_condition: "你家族在#V 1#!年内没有成员死亡。"
 passion_fail_notification: "炽情受毁"
 passion_fail_protect_family_tooltip: "你家族的一名成员死了。"
 POD_wraith_passion_kill_rival_decision: "炽情：杀了我的仇人"
 POD_wraith_passion_kill_rival_decision_desc: "没有什么比复仇之火更能让人激情燃烧。"
 POD_wraith_passion_kill_rival_decision_tooltip: "你将完成该炽情。"
 POD_wraith_passion_kill_rival_decision_confirm: "没想到我还会回来吧？"
 POD_wraith_passion_kill_rival_decision_condition: "你的对手，[TARGET_CHARACTER.GetFirstName]，必须死。"
 POD_wraith_fetter_adquire_fetters_decision: "取得[Fetters|E]"
 POD_wraith_fetter_adquire_fetters_decision_desc: "很少有死灵对[Glossary('皮囊之地','game_concept_skinlands_desc')]的新人或新事物产生足够深的依恋，从而形成真正的[Fetter|E]，但这并非不可能。"
 POD_wraith_fetter_adquire_fetters_decision_tooltip: "获得新$pod_Fette获得新[Fetter|E]。。"
 POD_wraith_fetter_adquire_fetters_decision_confirm: "值得存在的理由？"
 POD_wraith_dark_passion_start_a_hostile_scheme_decision: "黑暗炽情：发起敌对计谋"
 POD_wraith_dark_passion_start_a_hostile_scheme_decision_desc: "他们拥有你想要的一切，却甚至不懂得享受。让他们付出代价。"
 POD_wraith_dark_passion_start_a_hostile_scheme_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_start_a_hostile_scheme_decision_confirm: "现在他们明白了。"
 POD_wraith_dark_passion_start_a_seduction_decision: "黑暗炽情：发起勾引计谋"
 POD_wraith_dark_passion_start_a_seduction_decision_desc: "有什么比心碎更能拖垮一个人呢？"
 POD_wraith_dark_passion_start_a_seduction_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_start_a_seduction_decision_confirm: "一个悲剧的爱情故事。"
 POD_wraith_dark_passion_start_a_war_decision: "黑暗炽情：发起战争"
 POD_wraith_dark_passion_start_a_war_decision_desc: "如此多无意义的死亡，为了一个他们甚至不会理解的事业。"
 POD_wraith_dark_passion_start_a_war_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_start_a_war_decision_confirm: "如此多的新怨灵……"
 POD_wraith_dark_passion_raise_tyranny_decision: "黑暗炽情：提高暴政度"
 POD_wraith_dark_passion_raise_tyranny_decision_desc: "在死亡中，没有规则。除了你的规则。"
 POD_wraith_dark_passion_raise_tyranny_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_raise_tyranny_decision_confirm: "他们将学会服从。"
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision: "黑暗炽情：超过直辖上限"
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision_desc: "你尚未无处不在。立即改变这一点。"
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision_confirm: "好多了。"
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision: "黑暗炽情：超过封臣上限"
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision_desc: "是时候开始建造混乱之梯了。"
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_blackmail_decision: "黑暗炽情：勒索"
 POD_wraith_dark_passion_blackmail_decision_desc: "他们认为自己的秘密有价值？是时候让他们明白并非如此了。"
 POD_wraith_dark_passion_blackmail_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_blackmail_decision_confirm: "在这里，“朋友”之间没有秘密！"
 POD_wraith_dark_passion_blackmail_decision_condition: "你使用过勒索[character_interaction|E]。"
 POD_wraith_dark_passion_revoke_title_decision: "黑暗炽情：剥夺头衔"
 POD_wraith_dark_passion_revoke_title_decision_desc: "我的我的我的我的！"
 POD_wraith_dark_passion_revoke_title_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_revoke_title_decision_confirm: "我的。"
 POD_wraith_dark_passion_revoke_title_decision_condition: "你使用过剥夺头衔[character_interaction|E]。"
 POD_wraith_dark_passion_execute_prisoner_decision: "黑暗炽情：处决囚犯"
 POD_wraith_dark_passion_execute_prisoner_decision_desc: "你，那边。去死吧。"
 POD_wraith_dark_passion_execute_prisoner_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_execute_prisoner_decision_confirm: "接下来是什么？"
 POD_wraith_dark_passion_execute_prisoner_decision_condition: "你使用过处决囚犯[character_interaction|E]。"
 POD_wraith_dark_passion_banish_prisoner_decision: "黑暗炽情：驱逐囚犯"
 POD_wraith_dark_passion_banish_prisoner_decision_desc: "从我的视线中消失。"
 POD_wraith_dark_passion_banish_prisoner_decision_tooltip: "你将完成该黑暗炽情。"
 POD_wraith_dark_passion_banish_prisoner_decision_confirm: "并且别再回来。"
 POD_wraith_dark_passion_banish_prisoner_decision_condition: "你使用过驱逐囚犯[character_interaction|E]。"
 POD_wraith_devils_dare_spend_gold_decision: "魔鬼对赌：浪费奥波勒斯"
 POD_wraith_devils_dare_spend_gold_decision_desc: "你的黯影赌你不敢浪费你有的奥波勒斯，如果你不接受这挑战，你将获得#N 150#![stress|E]。"
 POD_wraith_devils_dare_spend_gold_decision_tooltip: "你接受这魔鬼对赌。"
 POD_wraith_devils_dare_spend_gold_decision_confirm: "我敢！"
 POD_wraith_devils_dare_spend_piety_decision: "魔鬼对赌：停止超脱"
 POD_wraith_devils_dare_spend_piety_decision_desc: "你的黯影赌你不敢停止超脱，如果你不接受这挑战，你将获得#N 150#![stress|E]。"
 POD_wraith_devils_dare_spend_piety_decision_tooltip: "你接受这魔鬼对赌。"
 POD_wraith_devils_dare_spend_piety_decision_confirm: "我敢！"
 POD_wraith_devils_dare_spend_prestige_decision: "魔鬼对赌：毁掉你的声誉"
 POD_wraith_devils_dare_spend_prestige_decision_desc: "你的黯影赌你不敢毁掉你的声誉，如果你不接受这挑战，你将获得#N 150#![stress|E]。"
 POD_wraith_devils_dare_spend_prestige_decision_tooltip: "你接受这魔鬼对赌。"
 POD_wraith_devils_dare_spend_prestige_decision_confirm: "我敢！"
 POD_wraith_request_obolus_decision: "所求冥币"
 POD_wraith_request_obolus_decision_desc: "作为军团士兵，你在[Glossary('皮囊之地','game_concept_skinlands_desc')]的任务是狩猎违反亡者律令的生者和亡者。你可以向上级申请一些冥币来协助你完成任务。"
 POD_wraith_request_obolus_decision_tooltip: "你将花费威望来获得金钱。"
 POD_wraith_request_obolus_decision_confirm: "听我解释……"
 decision_group_type_wraith_dark_passions: "黑暗炽情"
 POD_dark_passion_decision: "一旦满足条件，黑暗炽情将自动执行"
 POD_wraith_dark_passion_decision_tooltip: "触发条件："
 POD_wraith_dark_passion_war_decision: "黑暗炽情：战争"
 POD_wraith_dark_passion_war_decision_desc: "正如怨灵可以通过践行其炽情获得执念，他们的阴影也有产生惧念的黑暗激情"
 POD_wraith_dark_passion_war_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$发动战争"
 POD_wraith_dark_passion_war_decision_confirm: "……"
 POD_wraith_dark_passion_kill_decision: "黑暗炽情：谋杀"
 POD_wraith_dark_passion_kill_decision_desc: "正如怨灵可以通过践行其炽情获得执念，他们的阴影也有产生惧念的黑暗激情"
 POD_wraith_dark_passion_kill_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$杀死某人"
 POD_wraith_dark_passion_kill_decision_confirm: "……"
 POD_wraith_dark_passion_steal_decision: "黑暗炽情：窃取"
 POD_wraith_dark_passion_steal_decision_desc: "正如怨灵可以通过践行其炽情获得执念，他们的阴影也有产生惧念的黑暗激情"
 POD_wraith_dark_passion_steal_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$偷取某物。"
 POD_wraith_dark_passion_steal_decision_confirm: "……"
 POD_wraith_dark_passion_cruelity_decision: "黑暗炽情：残暴"
 POD_wraith_dark_passion_cruelity_decision_desc: "正如怨灵可以通过践行其炽情获得执念，他们的阴影也有产生惧念的黑暗激情"
 POD_wraith_dark_passion_cruelity_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$折磨某人或拥有超过25点[tyranny|E]"
 POD_wraith_dark_passion_cruelity_decision_confirm: "……"
 transcendence_objective_decision: "超脱"
 transcendence_objective_decision_desc: "超脱是一种状态，幽灵接受自己的死亡，并从冥界继续前行，前往那不可言喻的存在。超脱从根本上讲是关于接受自己的死亡。那些将幽灵束缚在冥界的事物——炽情与羁绊——必须被解决。一旦一切得到解决，幽灵必须寻求与其黯影的某种和谐。"
 transcendence_objective_decision_tooltip: "超越死亡。"
 transcendence_objective_decision_confirm: "终于自由了"
 transcendence_objective_tooltip: "你将最终获得自由。"
 descendence_objective_decision: "死而复生"
 descendence_objective_decision_desc: "我的死亡是不公平的！为什么我要满足于这种不公平的死亡！我将活下去，并且我将以自己的方式死去！"
 descendence_objective_decision_tooltip: "超越生命。"
 descendence_objective_decision_confirm: "改变你的命运。"
 war_with_the_tyrant_objective_decision: "与暴君之战"
 war_with_the_tyrant_objective_decision_tooltip: "你将面对冥秩，终结死者的法则。"
 war_with_the_tyrant_objective_decision_custom: "将对你发动战争。若你获胜，将获得[GetModifier('the_gravedigger_of_dictum_mortuum').GetNameWithTooltip]。但若失败，你的整个家族将被灵魂熔铸。"
 war_with_the_tyrant_objective_decision_desc: "卡戎是个暴君，这是不争的事实。而你讨厌他。还需要多少理由呢？"
 war_with_the_tyrant_objective_decision_confirm: "我准备好了"
 war_with_the_tyrant_objective_decision_skills: "综合[skills|E]必须高于60"
 charon_wraith_maa_modifier: "卡戎之怒"
 charon_troops: "卡戎的军队"
 enforce_the_dictum_mortuum_objective_decision: "强制执行亡者律令"
 enforce_the_dictum_mortuum_objective_decision_desc: "以卡戎之名，你带着使命来到皮囊之地，追捕那些试图接触皮囊之地的幽灵和试图接触幽土的活人，其中乔凡尼家族最为活跃。"
 enforce_the_dictum_mortuum_objective_decision_tooltip: "你将阻止死灵法师危及尸幕。"
 enforce_the_dictum_mortuum_objective_decision_confirm: "安全！"
 enforce_the_dictum_mortuum_objective_decision_custom: "在地图上不能有信仰[GetTrait('giovanni').GetName( GetPlayer )]或[GetTrait('wraith').GetName(GetPlayer)][independent_ruler|E]在地图上"
 enforce_the_dictum_mortuum_objective_decision_custom_ex: "$enforce_the_dictum_mortuum_objective_decision_custom$#weak ([example.GetFirstName])#!"
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision_confirm: "他们会没事的……或者不会。好像我在乎似的。"