l_simp_chinese:
 groom_successor_decision: "寻找继承人"
 groom_successor_decision_tooltip: "你的仆人将会列出一些合适的候选人"
 groom_successor_decision_desc: "[Glossary('万鬼','game_concept_kuei_jin_desc')]无法实行$pod_Embrace$，大多数情况下也不能正常地生育子女。因此，如果你不想让你的努力因为一次不幸的事故而前功尽弃的话，你必须做好准备。你将要求你的仆人列出一些合适的候选人。"
 groom_successor_decision_effect_tooltip: "你将看到一些候选人，并可以一定威望为代价，从中选择一位作为你的孩子"
 groom_successor_decision_confirm: "开始搜寻"
 practicing_arts_decision: "修炼功法"
 practicing_arts_decision_desc: "大彻大悟没有练习就不会到来。正如所有东方哲学所教导的那样，在迷雾为你分开之前，你必须在身心灵上完善自己。强烈的训练将烧掉红尘妄想；在这种状态下，（也许）顿悟将会显现。"
 practicing_arts_decision_tooltip: "你将把时间集中在功法的修炼。"
 practicing_arts_decision_confirm: "我想修炼功法"
 practicing_arts_decision_custom: "#bold 没#!有选择对应[focus|E]"
 treking_wilds_decision: "探索荒野"
 treking_wilds_decision_desc: "大部分[Glossary('屋室','podgloss.wu')]都有着心口相传的仪式，这一传统发自[Glossary('第四纪元','game_concept_fourth_age_desc')]的早期夜晚，[Glossary('屋室','podgloss.wu')]可能长途跋涉深入遍布变化妖怪的荒野来修行血经。"
 treking_wilds_decision_tooltip: "你将把时间集中在寻求冒险上。"
 treking_wilds_decision_confirm: "我想深入荒野"
 mortal_living_decision: "隐于凡间"
 mortal_living_decision_desc: "大部分[Glossary('屋室','podgloss.wu')]都有着心口相传的仪式，这一传统发自[Glossary('第四纪元','game_concept_fourth_age_desc')]的早期夜晚，[Glossary('屋室','podgloss.wu')]在每一年抽一个月扮演凡人角色。"
 mortal_living_decision_tooltip: "你将会拜访凡人的世界。"
 mortal_living_decision_confirm: "我要与凡人一同生活"
 POD_kueijin_become_enlightened_decision: "达成启蒙"
 POD_kueijin_become_enlightened_decision_tooltip: "修行之路的最终阶段"
 POD_kueijin_become_enlightened_decision_desc: "你已接近，如此接近摆脱一切阻碍你飞升的业债。你几乎洞悉了世界的运作，阴与阳几近融合。你的魂与魄几近止战。灵界与物质世界几近合一。而今，是时候将这一切彻底融合了……"
 POD_kueijin_become_enlightened_decision_confirm: "我将获得自由"
 POD_kueijin_become_enlightened_decision_deviltigers_religion: "你必须折磨囚犯150次"
 POD_kueijin_become_enlightened_decision_thousandwhispers_religion: "你必须总计失去50位亲属。"
 POD_kueijin_become_enlightened_decision_thrashingdragons_religion: "你必须拥有15位在世亲属。"
 POD_kueijin_become_enlightened_decision_flameoftherisingphoenix: "你必须举办25次宴会"
 POD_kueijin_become_enlightened_decision_faceofthegods: "你必须赢得25场战争"
 POD_kueijin_become_enlightened_decision_inwardway: "你必须冥想50次。"
 POD_kueijin_dharma_lifestyle_spend_decision: "追寻知识"
 POD_kueijin_dharma_lifestyle_spend_decision_tooltip: "知识是目的，而非手段"
 POD_kueijin_dharma_lifestyle_spend_decision_desc: "要理解你的[Glossary('心法','podgloss.dharma')]，你需要#italic;bold 知晓#!，而最好的方式莫过于隐居研习，直至彻底领悟一切。"
 POD_kueijin_dharma_lifestyle_spend_decision_confirm: "即是[Glossary('心法','podgloss.dharma')]"
 POD_kueijin_dharma_blood_spend_decision: "血祭"
 POD_kueijin_dharma_blood_spend_decision_tooltip: "以血启蒙"
 POD_kueijin_dharma_blood_spend_decision_desc: "血（或魔法转化的$pod_vitae$）确为万物之源。如你[Glossary('心法','podgloss.dharma')]所授，这珍贵的红色液体是通往启蒙的关键。是时候让它流淌了……"
 POD_kueijin_dharma_blood_spend_decision_confirm: "红色天堂"
 POD_kueijin_dharma_piety_spend_decision: "修补两界"
 POD_kueijin_dharma_piety_spend_decision_tooltip: "从浩恩到涅槃"
 POD_kueijin_dharma_piety_spend_decision_desc: "欲真正理解你的[Glossary('心法','podgloss.dharma')]，你须先理解自身及你在此世的位置。游历、教导与倾听，直至东西方对你再无奥秘。"
 POD_kueijin_dharma_piety_spend_decision_confirm: "信仰即是如此"
 you_will_get_dharma_10_tt: "如果你成功，你将达至十阶[Glossary('心法','podgloss.dharma')]觉悟巅峰，有机会在[Glossary('云开雾散','podgloss.hundredclouds')]之时结束游戏的机会。"
 POD_kj_notime: "我没时间。"