 groom_successor_decision: "寻找继承人"
 groom_successor_decision_tooltip: "你的仆人将会列出一些合适的候选人"
 groom_successor_decision_desc: "$pod_wan_kuei$无法实行[Embrace|E]，大多数情况下也不能正常地生育子女。因此，如果你不想让你的努力因为一次不幸的事故而前功尽弃的话，你必须做好准备。你将要求你的仆人列出一些合适的候选人。"
 groom_successor_decision_effect_tooltip: "你将看到一些候选人，并可以一定威望为代价，从中选择一位作为你的孩子"
 groom_successor_decision_confirm: "开始搜寻"
 practicing_arts_decision: "修炼功法"
 practicing_arts_decision_desc: "大彻大悟没有练习就不会到来。正如所有东方哲学所教导的那样，在迷雾为你分开之前，你必须在身心灵上完善自己。强烈的训练将烧掉红尘妄想；在这种状态下，（也许）顿悟将会显现。"
 practicing_arts_decision_tooltip: "你将把时间集中在功法的修炼。"
 practicing_arts_decision_confirm: "我想修炼功法"
 practicing_arts_decision_custom: "#bold 没#!有选择对应[focus|E]"
 treking_wilds_decision: "探索荒野"
 treking_wilds_decision_desc: "大部分屋室都有着心口相传的仪式，这一传统发自[fourth_age|E]的早期夜晚，屋室可能长途跋涉深入遍布变化妖怪的荒野来修行血经。"
 treking_wilds_decision_tooltip: "你将把时间集中在寻求冒险上。"
 treking_wilds_decision_confirm: "我想深入荒野"
 mortal_living_decision: "隐于凡间"
 mortal_living_decision_desc: "大部分屋室都有着心口相传的仪式，这一传统发自[fourth_age|E]的早期夜晚，屋室在每一年抽一个月扮演凡人角色。"
 mortal_living_decision_tooltip: "你将会拜访凡人的世界。"
 mortal_living_decision_confirm: "我要与凡人一同生活"
 POD_kueijin_become_enlightened_decision: "达成启蒙"
 POD_kueijin_become_enlightened_decision_tooltip: "The final step of the Dharmic journey."
 POD_kueijin_become_enlightened_decision_desc: "You are close, so close to being free from any karmic debt that is keeping you from ascending. You almost know how the world works, Yin and Yang almost fused together. Your Hun and P'o almost stopped fighting. Spirit and material world are almost the same. And it is time to finally merge them all together..."
 POD_kueijin_become_enlightened_decision_confirm: "我将获得自由"
 POD_kueijin_become_enlightened_decision_deviltigers_religion: "你必须折磨囚犯150次"
 POD_kueijin_become_enlightened_decision_thousandwhispers_religion: "You must have lost 50 relations in total"
 POD_kueijin_become_enlightened_decision_thrashingdragons_religion: "You must have 15 living relations"
 POD_kueijin_become_enlightened_decision_flameoftherisingphoenix: "你必须举办25次宴会"
 POD_kueijin_become_enlightened_decision_faceofthegods: "你必须赢得25场战争"
 POD_kueijin_become_enlightened_decision_inwardway: "You must meditate 50 times"
 POD_kueijin_dharma_lifestyle_spend_decision: "追寻知识"
 POD_kueijin_dharma_lifestyle_spend_decision_tooltip: "知识是目的，而非手段"
 POD_kueijin_dharma_lifestyle_spend_decision_desc: "要理解你的法，你需要#italic;bold 知晓#!，而最好的方式莫过于隐居研习，直至彻底领悟一切。"
 POD_kueijin_dharma_lifestyle_spend_decision_confirm: "法即是如此"
 POD_kueijin_dharma_blood_spend_decision: "血祭"
 POD_kueijin_dharma_blood_spend_decision_tooltip: "以血启蒙"
 POD_kueijin_dharma_blood_spend_decision_desc: "Blood (or vitae for magically transformed blood) is truly the source of everything. As your Dharma teaches, this precious red fluid is the key towards enlightenment. Time to spill it..."
 POD_kueijin_dharma_blood_spend_decision_confirm: "红色天堂"
 POD_kueijin_dharma_piety_spend_decision: "修补两界"
 POD_kueijin_dharma_piety_spend_decision_tooltip: "从浩恩到涅槃"
 POD_kueijin_dharma_piety_spend_decision_desc: "To truly understand your Dharma, you must first understand yourself and your place within this world. Travel, teach and listen until West and East both have no mysteries left for you."
 POD_kueijin_dharma_piety_spend_decision_confirm: "信仰即是如此"