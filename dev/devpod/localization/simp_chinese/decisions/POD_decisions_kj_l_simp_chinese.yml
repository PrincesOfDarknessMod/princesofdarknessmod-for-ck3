 groom_successor_decision: "寻找继承人"
 groom_successor_decision_tooltip: "你的仆人将会列出一些合适的候选人"
 groom_successor_decision_desc: "$pod_wan_kuei$无法实行[Embrace|E]，大多数情况下也不能正常地生育子女。因此，如果你不想让你的努力因为一次不幸的事故而前功尽弃的话，你必须做好准备。你将要求你的仆人列出一些合适的候选人。"
 groom_successor_decision_effect_tooltip: "你将看到一些候选人，并可以一定威望为代价，从中选择一位作为你的孩子"
 groom_successor_decision_confirm: "开始搜寻"
 advance_dharma_decision: "提升心法"
 advance_dharma_decision_tooltip: "随着开悟提升你的心法。"
 advance_dharma_decision_desc: "$pod_wan_kuei$的心法提升通过被称为大悟的开悟来实现，这种现象很少出现，可以由对心法的洞察或心法的巨大改变而提升，修行路上的每一步都越来越艰难，开悟最初需要几年，然后是几个世纪，最高等级需要几千年。最有见识的$pod_wan_kuei$大部分时间都在在冥想，追逐那些灵光。\n\n你可以通过以下方式提升心法特质经验："
 advance_dharma_decision_desc.boneflowers: "束缚死灵，在拥有受缚死灵和/或驻扎在[yin_world|E]时被动获得经验"
 advance_dharma_decision_desc.deviltigers: "杀人"
 advance_dharma_decision_desc.resplendentcranes: "获得头衔，用财政总管转换文化，在拥有同文化首都时被动获得经验"
 advance_dharma_decision_desc.thousandwhispers: "获得或失去关系（爱人、灵魂伴侣、朋友、至交、对手、死敌）"
 advance_dharma_decision_desc.thrashingdragons: "完成拉拢/勾引/求爱计谋，发生性关系，驻扎在[yang_world|E]时被动获得经验"
 advance_dharma_decision_desc.flameoftherisingphoenix: "建造[GetTrait('kueijin').GetName( GetNullCharacter )]建筑"
 advance_dharma_decision_desc.faceofthegods: "用宫廷司祭转换信仰，通过真信大规模转换信仰，在拥有同信仰首都时被动获得经验"
 advance_dharma_decision_desc.inwardway: "冥想、移动到下一个[umbra|E]地点，或在[GetTrait('kueijin').GetName( GetNullCharacter )]生活方式树中获得技能"
 advance_dharma_decision_desc.wayofthetenthousandscreams: "建造龙穴污染，折磨囚犯，将囚犯/领地/区域献祭给恶魔，作为魔奴或唤魔者时被动获得经验"
 advance_dharma_decision_confirm: "吾将上下而求索"
 become_enlightened_decision: "大彻大悟"
 become_enlightened_decision_tooltip: "你心法之道的终点。"
 become_enlightened_decision_desc: "你终于悟了；这往往需要几千年的时间，但当那一瞬间发生时，俗世的烦恼已然消失，你得以能够得道飞升。你的业债得到了偿还，你终于从万物轮回中获得了自由。"
 become_enlightened_decision_confirm: "大逍遥，大自在"
 become_enlightened_decision_thrashingdragon_tt: "拥有修正：[GetModifier( 'knowledge_of_thousand_cranes_mother_modifier' ).GetNameWithTooltip|L]"
 become_enlightened_decision_songoftheshadow_tt: "拥有修正：[GetModifier( 'wisdom_of_black_pearl_mistress_modifier' ).GetNameWithTooltip|L]"
 become_enlightened_decision_resplendentcrane_tt: "你的[capital|E][empire|E]（[THIS.Char.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]）的所有[de_jure|E][county|E]都必须是[THIS.Char.GetFaith.GetAdjective]信仰"
 deviltiger_become_enlightened_decision_trigger: "你杀死了#V 500#!人#weak （[SCOPE.ScriptValue('POD_killed_character_count')|0]）#!"
 thousandwhispers_become_enlightened_decision_trigger: "你必须生下了#V 23#!个[GetTrait('dhampyr').GetName( GetPlayer )]孩子，在抚养到成年后，杀了他们#weak （[SCOPE.ScriptValue('POD_killed_dhampyrchildren_count')|0]）#!"
 become_enlightened_decision_resplendentcrane_tt2: "你有#V 至尊皇朝#!政体"
