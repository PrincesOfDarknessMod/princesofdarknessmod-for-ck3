 prevent_black_death_objective_decision_before_last_date: "这一目标需要在#V 1347#!年前完成"
 prevent_black_death_rat_objective_decision: "鼠族阴谋"
 prevent_black_death_rat_objective_decision_desc: "妖精先知们都梦见了关于未来的一场灾难性事件，这场事件将导致数百万梦种的死亡。细节模糊不清，但似乎涉及大批从东方涌来的老鼠，成堆的燃烧尸体，舞动的骷髅，黑化的手指和脚趾。一些妖精深信鼠族及其带有疾病的妖蛆附属必须被消灭。"
 prevent_black_death_rat_objective_decision_tooltip: "你将试图阻止老鼠预言的实现。"
 prevent_black_death_rat_objective_decision_confirm: "制止黑死病"
 prevent_black_death_rat_objective_decision_custom1: "你必须雇有一位具有极佳[aptitude|E]的[GetCourtPositionType('court_physician_court_position').GetName()]"
 prevent_black_death_rat_objective_decision_custom2: "在地图上不能有[GetReligionFamily('rf_wyrm').GetName][religion|E]信徒[independent_ruler|E]"
 prevent_black_death_rat_objective_decision_custom2_ex: "$prevent_black_death_rat_objective_decision_custom2$#weak ([example.GetFirstName])#!"
 prevent_black_death_cat_objective_decision: "猫咪！"
 prevent_black_death_cat_objective_decision_desc: "很明显，为了阻止老鼠预言，你应该让每个人都爱上猫！"
 prevent_black_death_cat_objective_decision_tooltip: "你将通过使每个人都崇拜猫来阻止老鼠预言。"
 prevent_black_death_cat_objective_decision_confirm: "喵！"
 prevent_black_death_cat_objective_decision_custom1: "所有国王和皇帝都有[GetModifier('cat_story_modifier').GetNameWithTooltip][modifier|E]"
 prevent_black_death_cat_objective_decision_custom1_ex: "$prevent_black_death_cat_objective_decision_custom1$#weak ([example.GetFirstName])#!"
 prevent_black_death_cat_objective_decision_custom2: "能够招募[GetMaA('cats').GetName]作为[men_at_arms|E]"
 destroy_order_of_reason_objective_decision: "超越理性"
 destroy_order_of_reason_objective_decision_desc: "Men of learning seek to bind the world in Reason and Science. Their mundane efforts to catalog, define and limit the world is threatening to bring an end to belief in the mysterious and uncontrollable. They are tracing the ley lines to find fonts of glamour, which they call nodes, that they then drain and destroy. These 'reasonable men' slaughtered every Witch and Fae they could find in the ruins of Mistridge and its environs. They must be stopped at all costs!"
 destroy_order_of_reason_objective_decision_tooltip: "你将阻止理性之子给世界带来更多的板讷。"
 destroy_order_of_reason_objective_decision_confirm: "再无停滞"
 destroy_order_of_reason_objective_decision_mutually_exclusive: "#X Mutually exclusive with $POD_qareen_objective_decision$#!."
 destroy_order_of_reason_objective_decision_effect1: "$POD_splat_fae$ will no longer gain [GetTrait('banality').GetName(GetNullCharacter)] from [era|E]"
 arcadian_restoration_objective_decision: "阿卡迪亚光复"
 arcadian_restoration_objective_decision_desc: "Banality problem is solved, and Autumn World is closer to [UmbraGlossary('dreaming')] than ever before. Even [Glossary('Mythic Age','game_concept_mythic_age_desc')]'s Autumn World wasn't soo close, But this state won't last forever. Just like [Glossary('Mythic Age','game_concept_mythic_age_desc')] ended, this era will too.\n\nBut it doesn't have to, Thanks to sheer closeness to [UmbraGlossary('dreaming')], Autumn World needs a slight push to finally merge into Dreaming World where dreams and 'reality' coexist"
 arcadian_restoration_objective_decision_tooltip: "你将带回[Glossary('神话纪元','game_concept_mythic_age_desc')]。"
 arcadian_restoration_objective_decision_confirm: "终于"
