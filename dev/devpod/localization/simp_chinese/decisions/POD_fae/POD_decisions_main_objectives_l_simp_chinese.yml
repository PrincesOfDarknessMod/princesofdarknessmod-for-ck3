 destroy_inquisition_objective_decision_effect1: "大裁判将不会发生。"
 constantinian_objective_decision: "融入教会"
 constantinian_objective_decision_desc: "君士坦丁派将教会视为一个需要揭示、研究和引导的谜团，而非敌对和阻止的敌人。一旦理解了凡人信仰的力量，或许连迷雾都会回归更加仁慈的平衡，妖精也能收获信徒的创意梦华。"
 constantinian_objective_decision_tooltip: "教会将把妖精视为神圣：天使、先知、行奇迹者和真正的受祝福者。"
 constantinian_objective_decision_confirm: "建立君士坦丁派探题"
 constantinian_objective_decision_custom_artifact: "你必须拥有基督教的圣遗物[artifacts|E]之一：圣杯、真十字架的碎片、君士坦丁的神灯、受难之鞭、命运之矛、瓦伦西亚之杯或加百利的小号。"
 constantinian_objective_decision_custom1: "[GetTitleByKey('c_byzantion').GetNameNoTier] must be held by [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] $POD_splat_fae$/$POD_splat_changeling$, or [GetFaithByKey('shadowinquisition').GetName] $POD_splat_hunter$"
 constantinian_objective_decision_custom2: "[GetTitleByKey('c_roma').GetNameNoTier] must be held by [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] $POD_splat_fae$/$POD_splat_changeling$, or [GetFaithByKey('shadowinquisition').GetName] $POD_splat_hunter$"
 constantinian_objective_decision_custom3: "[GetTitleByKey('c_jerusalem').GetNameNoTier] must be held by [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] $POD_splat_fae$/$POD_splat_changeling$, or [GetFaithByKey('shadowinquisition').GetName] $POD_splat_hunter$"
 constantinian_objective_decision_effect1: "All western $POD_splat_hunter$ [faiths|E]#weak ([GetFaithByKey('shadowinquisition').GetName], [GetFaithByKey('akritai').GetName], [GetFaithByKey('independenthunters').GetName] etc.)#! will gain [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] and accept $POD_splat_fae$ as angels"
 constantinian_objective_decision_effect2: "能够招募[GetMaA('witchhunters').GetName]作为[men_at_arms|E]"
 constantinian_objective_decision_effect3: "[GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName]猎人将一定接受你的要求臣服提议"
