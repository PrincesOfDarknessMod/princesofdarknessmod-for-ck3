 destroy_inquisition_objective_decision: "摧毁暗影裁判所"
 destroy_inquisition_objective_decision_desc: "教会及其令人畏惧的裁判所迫害异教徒和妖精。它以刀剑使人皈依，折磨或将旧神的追随者与秘法修行者烧死。其祭司对换生灵孩童施行洗礼仪式，永久剥夺其魔法本性，熄灭火花般的梦华。为了让妖精留在地球上，是时候阻止这一切了。"
 destroy_inquisition_objective_decision_tooltip: "你将摧毁暗影裁判所。"
 destroy_inquisition_objective_decision_confirm: "结束火刑架的时代"
 destroy_inquisition_objective_decision_custom: "在地图上不能有[GetFaithByKey('shadowinquisition').GetName][faith|E]信徒[independent_ruler|E]"
 destroy_inquisition_objective_decision_custom_ex: "$destroy_inquisition_objective_decision_custom$#weak ([example.GetFirstName])#!"
 destroy_inquisition_objective_decision_custom1: "[GetTitleByKey('c_roma').GetNameNoTier] must be held by a $POD_splat_fae$ or $POD_splat_changeling$ that doesn't follow faith with [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] or [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName]"
