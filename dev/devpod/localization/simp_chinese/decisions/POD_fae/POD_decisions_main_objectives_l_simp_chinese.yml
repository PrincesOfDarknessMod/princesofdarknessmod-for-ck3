 become_santa_objective_decision: "成为圣诞老人"
 become_santa_objective_decision_desc: "你有一个特别的疯狂计划，以避免随着大碎溃而失去永生。每年的耶鲁节，你将定期分发奇魅玩具给无数孩子，因为他们对你的信仰，你将永生。他们会给你写信请求援助。他们会尊重古老传统，并留下供品来满足你无尽的饥饿。"
 become_santa_objective_decision_shattering: "你必须在[Glossary('大碎溃','game_concept_shattering_desc')]之前成为圣诞老人，或者至少度过其最糟糕的阶段。#weak 你不能拥有以下任何[modifiers|E]：[GetModifier('POD_shattering_1_modifier').GetNameWithTooltip]、[GetModifier('POD_shattering_2_modifier').GetNameWithTooltip]、[GetModifier('POD_shattering_3_modifier').GetNameWithTooltip]或[GetModifier('POD_shattering_4_modifier').GetNameWithTooltip]#!"
 become_santa_objective_decision_winter_capital: "你的首都必须处于冬季"
 become_santa_objective_decision_court_antiquarian_excellent: "你有一位具有极佳[aptitude|E]的[GetTrait('boggan').GetName( GetPlayer )]或[GetTrait('nocker').GetName( GetPlayer )][GetCourtPositionType('antiquarian_court_position').GetName()]"
 become_santa_objective_decision_tooltip: "每年的耶鲁节，你都会向无数儿童分发奇魅玩具，从而获得永生。"
 become_santa_objective_decision_deer_pooka: "你需要有有至少一位有[GetModifier('POD_pooka_deer_affinity_modifier').GetNameWithTooltip]的[GetTrait('pooka').GetName( GetPlayer )]廷臣。圣诞老人需要驯鹿！"
 become_santa_objective_decision_elves: "你有至少三位[GetTrait('nocker').GetName( GetPlayer )]和至少三位[GetTrait('boggan').GetName( GetPlayer )]作为廷臣。圣诞老人的工场需要“圣诞精灵”。"
 become_santa_objective_decision_confirm: "我将成为圣诞老人，礼物使者"
 become_santa_objective_decision_louhi: "邪恶的[GetScriptedCharacterByHistoryID('790633').GetFirstName]可能会试图阻止你的飞升，她必须死或处于[Glossary('蛰眠','game_concept_torpor_desc')]。"
 become_santa: "你成为了圣诞老人！"
 elemental_ascension_objective_decision: "元素升华"
 elemental_ascension_objective_decision_desc: "[GetTrait('fae').GetName(GetPlayer)] are almost a nature spirits, but not quite. They are the closest Fae are to pure elements, but some [GetTrait('fae').GetName(GetPlayer)] consider this 'imperfection' in becoming one with element as a flaw to be fixed.\n\nBy truly thinking and acting as element, [GetTrait('fae').GetName(GetPlayer)] can become perfect!"
 elemental_ascension_objective_decision_tooltip: "One with Element"
