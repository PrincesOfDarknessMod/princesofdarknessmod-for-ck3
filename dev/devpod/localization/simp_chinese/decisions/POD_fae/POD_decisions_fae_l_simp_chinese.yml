 POD_fae_mighty_legacy_3_decision_desc: "House [GetPlayer.GetDynasty.GetNameNoTooltip] has a tradition of studying ways of the blade. Do you wish to continue this tradition?"
 POD_fae_mighty_legacy_3_decision_tooltip: "I want to be the very best"
