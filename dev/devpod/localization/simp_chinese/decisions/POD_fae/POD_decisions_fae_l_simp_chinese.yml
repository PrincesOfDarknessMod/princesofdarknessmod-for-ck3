l_simp_chinese:
 POD_region_seasons_struggle: "四季战场"
 the_red_and_white_apple_of_avalon_decision: "阿瓦隆的红白苹果"
 the_red_and_white_apple_of_avalon_decision_desc: "在格拉斯顿伯里突岩的顶点坐落有两处泉水，红泉和白泉，象征着生死之力。在两处泉水的附近有着一颗全年结果的小苹果树，无论冬天，夏天亦或春天。有一半苹果是红色的，然而另一半却肤白似雪。"
 the_red_and_white_apple_of_avalon_decision_confirm: "摘走一个苹果"
 the_red_and_white_apple_of_avalon_decision_tooltip: "获得苹果宝物。"
 albion_pools_decision: "阿尔比恩池"
 albion_pools_decision_desc: "三座神秘的阿尔比恩池，在威尔士，苏格兰和布列塔尼这些地方各自藏着一座，它们是珍宝中最令法师们渴望拥有且广受欢迎的，因为据说无论谁得到全部的三池之力都能统治整个英格兰。一个传闻能让人永葆青春，一个能治愈所有创伤以及第三个据称被赋予了在凡人心灵上的控制力。至黑暗中世纪时期，已无人记得哪个池据传会造成哪种效益，虽然在多数妖精（据说是不朽的）中仍有些人记得。"
 albion_pools_decision_confirm: "阿尔比恩将是我的"
 albion_pools_decision_tooltip: "宣称阿尔比恩。"
 albion_pools_decision_custom: "的[realm_capital|E]位于[GetGeographicalRegion('ghw_region_britannia').GetName][region|E]"
 foster_sprite_decision: "寻找继承人"
 foster_sprite_decision_tooltip: "你的仆人将会列出一些合适的候选人"
 foster_sprite_decision_desc: "真妖精的繁育能力不强，但能促生小精灵为真妖精。因此，如果你不想让你的努力因为一次不幸的事故而前功尽弃的话，你必须做好准备。你将要求你的仆人列出一些合适的候选人。"
 foster_sprite_decision_effect_tooltip: "你将看到一些候选人，并可以一定威望为代价，从中选择一位作为你的孩子"
 foster_sprite_decision_confirm: "开始搜寻"
 POD_fable_decision: "传说"
 POD_fable_decision_desc: "Fae are highly connected to the myths of Dreamers, one can even say made and unmade by them.\n\nAs such, many Fae which either failed or haven't tried the political side of their Social Life has decided to pursue a myth or a legend of their own.\n\nBut one Fae cannot be at once a Great Shadow which manipulated entire kingdoms and a Great Herald which by their mythical diplomatic actions united people which should not be united. What Tale do you pursue?"
 POD_fable_decision_tooltip: "A new Legend."
 POD_fable_decision_confirm: "A Tale of my Own"
 POD_fable_decision_advance: "You will advance your Tale to next level, improving [domicile_building_upgrade|E] Tale unlocks but also increasing requirements for next advancement"
 POD_fable_decision_chose_fable: "You will chose one Tale you will strive towards, #X This action cannot be reverted nor changed later.#!"
 POD_eccentric_pooka_decision: "寻找噗咔"
 POD_eccentric_pooka_decision_desc: "噗咔真是太有趣了！它们种类繁多，我必须养一只！（找到它们可能需要一些时间）"
 POD_eccentric_pooka_decision_tooltip: "我要这个！"
 POD_eccentric_pooka_decision_confirm: "毛茸茸的伙伴！"
 POD_lilin_objective_decision: "与莉莉丝合一"
 POD_lilin_objective_decision_desc: "Similarly to the prodigals who call themselves vampires we Lilin are descended from Lilith, a demon who rebelled against her creator and refused to submit to the man she'd been forced to marry. But many things differentiate us from her, we lack her powers, we lack her status and most importantly lack her essence.\n\nBut we are Fae, the impossible is possible! If I were to gather artifacts related to the Dark Mother and enslave her brother and sisters I may be able to reenact Lilith's life."
 POD_lilin_objective_decision_tooltip: "黑暗之母的祝福"
 POD_lilin_objective_decision_confirm: "Reenacting the legend"
 POD_lilin_objective_decision_custom1: "You need to know [Glossary('True Names','podgloss.truename')] of #V 3#! $POD_splat_demon_plural$"
 POD_lilin_objective_decision_effect: "You unlock [journey|E] to learn new [GetTrait('bloodsorcery').GetName(GetPlayer)] [bs_tradition|E]"
 POD_qareen_objective_decision: "Humanity's Advisor"
 POD_qareen_objective_decision_desc: "You are an immortal with immense knowledge of the world, you are gifted or perhaps cursed to never forget a thing and there are many mortals devoided of any guidance, stumbling around blindly hoping to find a way forward.\n\nIt is of no surprise then when mortals find a way which is bad for everything fae. But with your control over major sources of knowledge you are in a prime position to guide humanity towards a future that benefits a fae of your kind."
 POD_qareen_objective_decision_tooltip: "Ask a Jinn"
 POD_qareen_objective_decision_confirm: "Become humanity's guiding light"
 POD_qareen_objective_decision_mutually_exclusive: "#X Mutually exclusive with $destroy_order_of_reason_objective_decision$#!."
 POD_qareen_objective_decision_effect1: "Significantly increase spread of culture councillor task and gain access to the develop county decision if not unseelie."
 POD_fae_qareen_goal_achieved_modifier_culture: "You are a guide of humanity"
 POD_shaytan_objective_decision: "Wishing legacy of the Djinn"
 POD_shaytan_objective_decision_desc: "Being a shaytan you are no stranger to mischief. By tricking those in power to take you up on your offer to grant wishes, you will ensure djinn will endure and outlast the ravages of banality as the story of the djinn and their granting of wishes will last for an eternity."
 POD_shaytan_objective_decision_tooltip: "Your wish is my command"
 POD_shaytan_objective_decision_confirm: "关于此事，将流传许多传说。"
 POD_shaytan_objective_decision_custom1: "You must successfully used the #V $POD_shaytan_trick_wish_interaction$#! [character_interaction|E] at least 30 times."
 POD_shaytan_objective_decision_info: "#I #V $POD_shaytan_trick_wish_interaction$#! [character_interaction|E] is unlocked by having [GetTrait('art_naming_advanced').GetName(GetPlayer)], [GetTrait('realm_fae').GetName(GetPlayer)], [GetTrait('realm_scene').GetName(GetPlayer)] and [GetTrait('realm_time').GetName(GetPlayer)]#!"
