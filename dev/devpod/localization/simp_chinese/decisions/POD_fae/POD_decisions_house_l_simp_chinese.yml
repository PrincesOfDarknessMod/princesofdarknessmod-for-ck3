 sidhe_inert_cold_iron_objective_decision: "惰化寒铁"
 sidhe_inert_cold_iron_objective_decision_tooltip: "你将改变科学“现实”，寻求一种方法来转化或以其他方式改变寒铁的属性，使其惰化失去作用。"
 sidhe_inert_cold_iron_objective_decision_desc: "妖精们努力理解为什么寒铁会伤害到它们。它可以永久性地摧毁一位妖精的灵。[GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName]为了试图打破寒铁对妖精的束缚而献出了自己的生命。许多人认为铁代表了大散断的力量；人类与[UmbraGlossary('dreaming')]之间的哲学分界……化为现实。它并不是由任何“事物”形成的，而是一种当板讷达到临界水平时的“自然”效应。妖精必须研究寒铁，并设法使其失去作用。"
 sidhe_inert_cold_iron_objective_decision_confirm: "转换范式！"
 sidhe_inert_cold_iron_objective_decision_custom1: "你必须属于[GetDynastyByID( 'POD_fae_dynasty_dougal' ).GetBaseName]世家。"
 sidhe_inert_cold_iron_objective_decision_custom2: "你[completely_control|E]杜伽尔的锻炉（[GetTitleByKey('c_lennox').GetNameNoTier]），以及周边的[GetTitleByKey('d_galloway').GetNameNoTier]公国"
 sidhe_inert_cold_iron_objective_decision_custom3: "你[completely_control|E]勇锻之庭（[GetTitleByKey('c_warwickshire').GetNameNoTier]），以及[GetTitleByKey('d_valiant_forge').GetNameNoTier]和[GetTitleByKey('d_hereford').GetNameNoTier]公国。"
 sidhe_inert_cold_iron_objective_decision_custom4: "你[completely_control|E]失落锻炉（[GetTitleByKey('c_messina').GetNameNoTier]），以及[GetTitleByKey('d_sicily').GetNameNoTier]公国"
 sidhe_inert_cold_iron_objective_decision_custom5: "你有10000金钱或[completely_control|E]任一以下金矿：[GetTitleByKey('b_turoc').GetNameNoTier]、[GetTitleByKey('b_abrudbanya').GetNameNoTier]、[GetTitleByKey('c_chalkidike').GetNameNoTier]、[GetTitleByKey('c_allaqi').GetNameNoTier]、[GetTitleByKey('b_wasulu').GetNameNoTier]、[GetTitleByKey('b_diakha').GetNameNoTier]、[GetTitleByKey('b_goundafa').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_effect1: "寒铁将被惰化，不再威胁妖精之灵。所有妖精将不再成为谋杀计谋的目标。"
 sidhe_inert_cold_iron_objective_decision_effect2: "#X 此[decision|E]与#V $destroy_order_of_reason_objective_decision$#!互斥#!"