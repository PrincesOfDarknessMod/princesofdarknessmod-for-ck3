 sidhe_house_dominance_danaan_objective_decision: "梦界守卫"
 sidhe_house_dominance_danaan_objective_decision_desc: "达南世家漫游于[UmbraGlossary('dreaming')]中的众多路径。他们守护着仙路，开辟新的小径。他们引导着梦种，并通过他们与龙之誓约获得了许多奇魅的青睐。当世家中的领导者在[UmbraGlossary('dreaming')]中远行后，也许能够召集一支令人印象深刻的奇魅军团，在合适的时机释放到秋暮世界上。"
 sidhe_house_dominance_danaan_objective_decision_tooltip: "游历世界和[UmbraGlossary('dreaming')]，了解其中的秘密，打造一支奇魅军团。"
 sidhe_house_dominance_danaan_objective_decision_confirm: "两条路在迷障中分岔，我选择了人迹罕至的那条"
 sidhe_house_dominance_danaan_objective_decision_custom1: "你是一位[GetTrait('eshu').GetName( GetPlayer )]、[GetTrait('lifestyle_traveler').GetName( GetPlayer )]、[GetTrait('pilgrim').GetName( GetPlayer )]或[GetTrait('adventurer').GetName( GetPlayer )]。"
 sidhe_house_dominance_danaan_objective_decision_custom2: "具有任意坐骑:[GetPODArtifactName('ship_of_the_four_quarters_link')]、[GetPODArtifactName('nightmare_horse_link')]、[GetPODArtifactName('sorn_link')]、[GetPODArtifactName('vozhd_palanquin_link')]、[GetPODArtifactName('sorel_link')]、马、狼、熊、狮、或虎"
 danaan_victory_modifier: "寻求梦卫"
 sidhe_house_dominance_leanhaun_objective_decision: "恋难舍的诅咒"
 sidhe_house_dominance_leanhaun_objective_decision_desc: "[GetScriptedCharacterByHistoryID('POD_fae_character_15').GetFirstName]身上的秘密诅咒延伸到了她整个世家，使其成员在没有乱梦凡人的情况下迅速衰老。有预言说这个诅咒将“直到星星哭泣鲜血，大地在你脚下变得寒冷”，这似乎不太可能在短期内发生。通常，恋难舍一次只会迷诱并乱梦于一位凡人受害者。有人猜测，如果有足够多的梦种被培养，并且这些梦种的梦华数量众多，诅咒的影响可能会减轻，甚至消除。"
 sidhe_house_dominance_leanhaun_objective_decision_tooltip: "利用足够的梦种来减轻诅咒"
 sidhe_house_dominance_leanhaun_objective_decision_confirm: "我们的痛苦可能成为我们的本分"
 sidhe_house_dominance_leanhaun_objective_decision_custom1: "You need at least #bold 4#! positive#weak (Like [friends|E] or [soulmates|E])#! [relations|E] of [epiphanies_quality|E] above #bold 0#! #weak ([SCOPE.GetValue('sidhe_house_dominance_leanhaun_objective_decision_custom1_val')])#!"
 sidhe_house_dominance_leanhaun_objective_decision_custom2: "You need at least #bold 1#! positive#weak (Like [friends|E] or [soulmates|E])#! [relation|E] with Great Person #weak ([SCOPE.GetValue('sidhe_house_dominance_leanhaun_objective_decision_custom2_val')])#!"
