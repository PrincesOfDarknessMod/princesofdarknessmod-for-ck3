l_simp_chinese:
 fera_advance_rank_decision: "晋升你的阶位"
 fera_advance_rank_decision_desc: "声望与位阶是衡量化形者在其社会中地位的标尺。声望越高，其言论的分量便越重。不同的$glossary_fera$类型采用三套不同的声望体系。"
 fera_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 fera_advance_rank_decision_confirm: "我的名望越来越大！"
 fera_advance_rank_decision_effect: "#clickable 你获得了名声[trait_level_track_xp|E]从这些来源#!"
 fera_advance_rank_renown_glory: "#clickable $POD_fera_renown_glory$:#!\n#medium $BULLET_WITH_TAB$若你信奉盖亚信仰，击败妖蛆阵营的统治者将赢得声望。\n$BULLET_WITH_TAB$若你信奉妖蛆信仰，击败盖亚阵营的统治者将赢得声望。\n$BULLET_WITH_TAB$若你信奉盖亚信仰，击杀妖蛆阵营的角色将赢得声望。\n$BULLET_WITH_TAB$若你信奉妖蛆信仰，击杀盖亚阵营的角色将赢得声望。#!\n"
 fera_advance_rank_renown_honor: "#clickable $POD_fera_renown_honor$:#!\n#medium $BULLET_WITH_TAB$放弃[grudge|E]、终结[rivalry|E]或失去[nemesis|E]。\n$BULLET_WITH_TAB$将[duchies|E]或更高头衔授予其他$glossary_fera$。\n$BULLET_WITH_TAB$将圣地提升至最高等级。\n$BULLET_WITH_TAB$提升你的[piety_level|E]。#!\n"
 fera_advance_rank_renown_wisdom: "#clickable $POD_fera_renown_wisdom$:#!\n#medium $BULLET_WITH_TAB$完成灵界远征。\n$BULLET_WITH_TAB$获取$glossary_fera$生活方式树的最终[perk|E]。\n$BULLET_WITH_TAB$完成一次精神探索[journey|E]。#!\n"
 fera_advance_rank_renown_power: "#clickable $POD_fera_renown_power$:#!\n#medium $BULLET_WITH_TAB$赢得战争。\n$BULLET_WITH_TAB$赢得决斗。\n$BULLET_WITH_TAB$提升你的[prestige_level|E]。#!\n"
 fera_advance_rank_renown_cunning: "#clickable $POD_fera_renown_cunning$:#!\n#medium $BULLET_WITH_TAB$成功完成[infiltration|E]。\n$BULLET_WITH_TAB$[blackmailing|E]其他角色。\n$BULLET_WITH_TAB$成功完成[GetScheme('abduct').GetTypeName][schemes|E]。#!\n"
 fera_advance_rank_renown_ferocity: "#clickable $POD_fera_renown_ferocity$:#!\n#medium $BULLET_WITH_TAB$携带至少#P 50#![raid|E][raid_loot|E]返回领地。\n$BULLET_WITH_TAB$在任何[GetTrait('lifestyle_hunter').GetName(GetNullCharacter)][trait_level_track|E]中提升[trait_level_track_xp|E]。\n$BULLET_WITH_TAB$与你的[GetPlayer.Custom('PODCoterie')]一同训练。#!\n"
 fera_advance_rank_renown_infamy: "#clickable $POD_fera_renown_infamy$:#!\n#medium $BULLET_WITH_TAB$成功完成[GetScheme('fabricate_hook').GetTypeName][schemes|E]。\n$BULLET_WITH_TAB$无正当[title_rank|E]处决自己的公爵领[execute_reason|E]或更高等级的封臣。\n$BULLET_WITH_TAB$篡夺王国[rank|E]或更高等级的头衔。\n$BULLET_WITH_TAB$违背停战协议。#!\n"
 fera_advance_rank_renown_bonuses: "\n#clickable 你的[GetPlayer.Custom('PODFeraAuspiceType')]为[GetPlayer.Custom('PODFeraAuspiceRenownBoost')]提供加成。#!"
 POD_fera_advance_to_next_rank_desc: "你在[TRAIT.GetName(GetPlayer)][trait|E]中晋升至#bold $VALUE|0V$#!位阶。"
 fera_advance_rank_decision_requirement_tributaries: "拥有至少2个王国[tributaries|E]或更高的[rank|E]。"