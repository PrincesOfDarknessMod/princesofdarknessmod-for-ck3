l_simp_chinese:
 fera_advance_rank_decision: "晋升你的阶位"
 fera_advance_rank_decision_desc: "声望与位阶是衡量化形者在其社会中地位的标尺。声望越高，其言论的分量便越重。不同的$glossary_fera$类型采用三套不同的声望体系。\n\n你可以从以下方面获得声望：\n"
 fera_advance_rank_decision_tooltip: "提升部族阶级中进步需要时间和决心。"
 fera_advance_rank_decision_confirm: "我的名望越来越大！"
 fera_advance_rank_renown_glory: "#clickable $POD_fera_renown_glory$:#!\n#medium $BULLET_WITH_TAB$若你信奉盖亚信仰，击败妖蛆阵营的统治者将赢得声望。\n$BULLET_WITH_TAB$若你信奉妖蛆信仰，击败盖亚阵营的统治者将赢得声望。\n$BULLET_WITH_TAB$若你信奉盖亚信仰，击杀妖蛆阵营的角色将赢得声望。\n$BULLET_WITH_TAB$若你信奉妖蛆信仰，击杀盖亚阵营的角色将赢得声望。#!\n$BULLET_WITH_TAB$以[adventurer|E]身份完成[mercenary_task_contracts|E]。\n"
 fera_advance_rank_renown_honor: "#clickable $POD_fera_renown_honor$:#!\n#medium $BULLET_WITH_TAB$放弃[grudge|E]、终结[rivalry|E]或失去[nemesis|E]。\n$BULLET_WITH_TAB$将[duchies|E]或更高头衔授予其他$glossary_fera$。\n$BULLET_WITH_TAB$将圣地提升至最高等级。\n$BULLET_WITH_TAB$提升你的[piety_level|E]。#!\n"
 fera_advance_rank_renown_wisdom: "#clickable $POD_fera_renown_wisdom$:#!\n#medium $BULLET_WITH_TAB$完成灵界远征。\n$BULLET_WITH_TAB$获取$glossary_fera$生活方式树的最终[perk|E]。\n$BULLET_WITH_TAB$完成一次精神探索[journey|E]。#!\n"
 fera_advance_rank_renown_power: "#clickable $POD_fera_renown_power$:#!\n#medium $BULLET_WITH_TAB$赢得战争。\n$BULLET_WITH_TAB$赢得决斗。\n$BULLET_WITH_TAB$提升你的[prestige_level|E]。#!\n$BULLET_WITH_TAB$获得肉体[urgetaints_lifestyle|E]。\n"
 fera_advance_rank_renown_cunning: "#clickable $POD_fera_renown_cunning$:#!\n#medium $BULLET_WITH_TAB$成功完成[infiltration|E]。\n$BULLET_WITH_TAB$[blackmailing|E]其他角色。\n$BULLET_WITH_TAB$成功完成[GetScheme('abduct').GetTypeName][schemes|E]。#!\n"
 fera_advance_rank_renown_ferocity: "#clickable $POD_fera_renown_ferocity$:#!\n#medium $BULLET_WITH_TAB$携带至少#P 50#![raid|E][loot|E]返回领地。\n$BULLET_WITH_TAB$在任何[GetTrait('lifestyle_hunter').GetName(GetNullCharacter)][trait_level_track|E]中提升[trait_level_track_xp|E]。\n$BULLET_WITH_TAB$与你的[GetPlayer.Custom('PODCoterie')]一同训练。#!\n"
 fera_advance_rank_renown_infamy: "#clickable $POD_fera_renown_infamy$:#!\n#medium $BULLET_WITH_TAB$成功完成[GetScheme('fabricate_hook').GetTypeName][schemes|E]。\n$BULLET_WITH_TAB$无正当[execute_reason|E]处决自己的公爵或更高[title_rank|E]的封臣。\n$BULLET_WITH_TAB$篡夺王国[rank|E]或更高等级的头衔。\n$BULLET_WITH_TAB$违背停战协议。#!\n$BULLET_WITH_TAB$获得精神[urgetaints_lifestyle|E]。\n"
 fera_advance_rank_renown_bonuses: "\n#clickable 你的[GetPlayer.Custom('PODFeraAuspiceType')]为[GetPlayer.Custom('PODFeraAuspiceRenownBoost')]提供加成。#!"
 POD_fera_advance_to_next_rank_desc: "你在[TRAIT.GetName(GetPlayer)][trait|E]中晋升至#bold $VALUE|0V$#!位阶。"
 fera_advance_rank_decision_requirement_tributaries: "拥有至少2个王国[tributaries|E]或更高的[rank|E]。"
 fera_recruit_beastborn_decision: "培养兽嫡"
 fera_recruit_beastborn_decision_desc_werewolf: "狼族与其狼嫡关系密切。每个部族，即便是如人类监护者这般最深入城市的，都悉心照料着它们四足的朋友，并留意它们之中出现原始觉醒的迹象。\n那些最终成为狼人的狼嫡，在成为部族正式成员前往往需要更多准备，因为人类世界的种种对它们而言是全新的。作为当地领袖，你需要决定你希望如何密切地监控并为这潜在的助力制定计划。"
 fera_recruit_beastborn_decision_desc_bubasti: "很久以前，芭丝特猫人曾加入荷鲁斯，参与他对抗其堕落叔父赛特的永恒之战。尽管这一事业充满正义，且芭丝特至今仍以其贡献为傲，但这场战争最终仍以惨败告终。得胜的赛特信徒俘获了芭丝特的同族猫人——布巴斯提，并将其杀害，或喂以鲜血，将它们变为畸形的怪物。\n然而，凭借近来取得的胜利及对最后一批布巴斯提的大胆营救，芭丝特猫人如今再次繁荣兴盛，守护着它们的猫裔亲族，帮助它们积聚力量，从长期侍奉赛特信徒的创伤中逐渐康复。"
 fera_recruit_beastborn_decision_desc_bastet: "猫人与猫族关系密切。每个部族都会仔细照看它们的四足朋友，并留意它们之中是否出现原始觉醒的迹象。由于猫类领地意识很强，这也意味着这些部族往往更倾向于留在它们同族所栖息的区域。\n那些最终转化为猫人的猫族往往需要更多准备，才能成为部族的正式成员，因为人类世界的规则对它们来说还很陌生。作为地方领袖，您需要决定以何种密切程度来监督并为这些潜在帮手做好规划。"
 fera_recruit_beastborn_decision_desc_mokole: "作为少数非哺乳类的化兽族裔，魔克拉与其更为孤僻的动物亲族之间的联系可能并不紧密。由于爬行类生命周期较短，魔克拉通常会选择专门的巢穴产卵，由人类兽嫡照看，等待幼体孵化——它们通常在几周内便会经历原始觉醒。作为当地领袖，你只需前往巢穴查看当前进展，检查是否有幼体已完成觉醒即可。\n那些最终成为魔克拉的爬行类个体，在成为巢穴的正式成员前往往需要更多准备，因为人类世界的种种对它们而言是全新的。作为当地领袖，你需要决定你希望如何密切地监控并为这潜在的助力制定计划。"
 fera_recruit_beastborn_decision_bubasti_requirement: "#bold 猫与蛇之战#!必须已完成"
 fera_recruit_beastborn_decision_effect: "[GetTrait('beast_born').GetName( GetPlayer )]$glossary_fera$来到你的宫廷。这可能会花费你一些资源。"
 fera_recruit_beastborn_decision_tooltip: "在野兽之中寻找$glossary_fera$。"
 fera_recruit_beastborn_decision_confirm: "开始搜索！"