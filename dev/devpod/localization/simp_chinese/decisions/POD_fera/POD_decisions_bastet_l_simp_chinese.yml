l_simp_chinese:
 restore_per_bast_objective_decision: "重建帕巴斯特"
 restore_per_bast_objective_decision_desc: "“芭丝特之城”曾经是感恩戴德的埃及人对其影猫恩主的信仰中心。它还能再次如此吗？"
 restore_per_bast_objective_decision_tooltip: "我们的古都在等待着我们。"
 restore_per_bast_objective_decision_confirm: "赞美猫咪"
 the_fleeing_scarab_objective_decision: "圣甲虫脱壳"
 the_fleeing_scarab_objective_decision_desc: "圣甲虫脱壳是布巴斯提最珍贵的秘密，它是一种黑暗仪式，允许布巴斯提用其他生物的灵魂来取得永生。"
 the_fleeing_scarab_objective_decision_tooltip: "永生，近在咫尺。"
 the_fleeing_scarab_objective_decision_confirm: "不惜代价"
 fleeing_scarab_decision_custom: "木乃伊必须是你最好的朋友或灵魂伴侣。"
 fleeing_scarab_decision_custom2: "你必须有15名或更多有凡人特质的囚犯。"
 royal_privilege_objective_decision: "皇家特权"
 royal_privilege_objective_decision_desc: "皇家特权是辛巴稀有而珍贵的秘密，它允许辛巴学习其他芭丝特部族的力量。只有最成功的辛巴（也有人说是最冷酷无情的人）才能被抹除者之灵视为配得学习。"
 royal_privilege_objective_decision_tooltip: "作为一国之主有其好处。"
 royal_privilege_objective_decision_confirm: "终于，真正的猫王。"