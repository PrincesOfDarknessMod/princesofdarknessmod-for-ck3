l_simp_chinese:
 POD_demon_demand_kill_pure_decision: "要求：摧毁纯洁者"
 POD_demon_demand_kill_pure_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_kill_pure_decision_desc: "纯洁是恶魔的厌恶。你的主人要求你铲除世上的光明使者，以示虔诚。"
 POD_demon_demand_kill_pure_decision_confirm: "遵您旨意，主人。"
 POD_demon_demand_kill_pure_decision_condition: "杀死一位猎人，浩恩永生吸血鬼，或有高[Glossary('心法','podgloss.dharma')]等级的[GetTrait('kueijin').GetName( GetNullCharacter )]。"
 POD_demon_demand_banish_rival_decision: "要求：放逐敌手"
 POD_demon_demand_banish_rival_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_banish_rival_decision_desc: "恶魔最可怕的敌人就是自己的同族。你的主人要求将一位敌对的堕天使驱逐出这个世界。"
 POD_demon_demand_banish_rival_decision_confirm: "遵您旨意，主人。"
 POD_demon_demand_banish_rival_decision_condition: "放逐一位恶魔到[UmbraGlossary('abyss')]。"
 POD_demon_demand_prepare_bodies_decision: "要求：准备宿体"
 POD_demon_demand_prepare_bodies_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_prepare_bodies_decision_desc: "肃灵仪式允许恶魔通过窃取自愿（或不自愿）宿主的身体，短暂显形。你的主人希望找到一些“志愿者”。"
 POD_demon_demand_prepare_bodies_decision_confirm: "遵您旨意，主人。"
 POD_demon_demand_prepare_bodies_decision_condition: "监禁#V 10#!位或更多凡人角色"
 POD_demon_demand_bring_infernalist_decision: "要求：带来崇魔者"
 POD_demon_demand_bring_infernalist_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_bring_infernalist_decision_desc: "[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetFirstName]已被你的主人选中为有前途的崇魔者。把[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetHerHim]带入你的密教，或者在[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetSheHe]成为对手之前解决掉[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetHerHim]。"
 POD_demon_demand_bring_infernalist_decision_confirm: "遵您旨意，主人。"
 POD_demon_demand_bring_infernalist_decision_condition: "[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetFirstName]必须对你好感为正或者死"
 POD_demon_demand_corrupt_place_decision: "要求：腐化圣地"
 POD_demon_demand_corrupt_place_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_corrupt_place_decision_desc: "圣地是恶魔的禁忌。要想让其自由行动，你必须玷污这些圣地好让你的主人可以与它自由互动。"
 POD_demon_demand_corrupt_place_decision_confirm: "遵您旨意，主人。"
 restore_babylon_objective_decision: "重建巴比伦"
 restore_babylon_objective_decision_tooltip: "升起你的空中花园。"
 restore_babylon_objective_decision_desc: "那是一个充满野蛮帝国和神圣战争的时代，是一个英雄受到在世神赐福（或诅咒）的时代，是一个在黄金、玄武岩和玉石神像前举行难以言喻的仪式的时代。当地上世界发生冲突时，虔诚的信徒们大举进攻。大地在颤抖，天空下起血雨，整座城市被夷为平地。\n那是巴比伦，那是人间地狱。"
 restore_babylon_objective_decision_confirm: "辉煌的时代"
 restore_babylon_objective_decision_effect_tooltip: "[GetTrait('demon').GetName( GetPlayer )]和[GetTrait('cultist').GetName( GetPlayer )]统治者将一定接受你的要求臣服提议。"
 sin_dragon_objective_decision: "原罪之龙"
 sin_dragon_objective_decision_tooltip: "抓住原罪。"
 sin_dragon_objective_decision_desc: "七条巨龙被曾经虔诚的凡人逐渐泯灭的希望所召唤，它们正等待着一位罪孽化身来拯救它们。你会成为那邪恶典范吗？"
 sin_dragon_objective_decision_confirm: "原始苏醒"
 sin_dragon_objective_decision_effect_tooltip: "解锁对应你[faith|E]的原罪之龙[men_at_arms|E]"
 unlock_sin_conversion_decision: "解锁$sin_conversion_decision$[decision|E]"
 sin_dragon_trainer_modifier: "原罪之龙的驯服者"
 demonic_knowledge_objective_decsion: "魔邪智慧之树"
 demonic_knowledge_objective_decsion_desc: "在深渊监狱的日子让你深刻认识到自己学识的局限性。上帝的计划似乎比你想象的要复杂得多。从那时起，你一直被求知的渴望所折磨。现在，是时候满足这份渴望了。"
 demonic_knowledge_objective_decsion_tooltip: "我能真正理解神圣吗？"
 demonic_knowledge_objective_decsion_confirm: "禁果，已服下。"
 POD_improve_ritual_of_sundered_soul_decision: "强化肃灵仪式"
 POD_improve_ritual_of_sundered_soul_decision_tooltip: "我岂会永世受困！"
 POD_improve_ritual_of_sundered_soul_decision_desc: "这道复杂的新仪式，是你将力量真实显化于地球的唯一途径。你需发掘其奥秘并完善它。"
 POD_improve_ritual_of_sundered_soul_decision_confirm: "很快，他们将见识我真正的力量。"
 POD_demon_gather_the_faithful_objective_decision: "召集信徒"
 POD_demon_gather_the_faithful_objective_decision_tooltip: "你的力量与凡人的信仰相连。是时候集结你的羔羊了。"
 POD_demon_gather_the_faithful_objective_decision_desc: "随着天堂之战的持续，天使们逐渐意识到宇宙中潜藏的庞大恶念。渴望化为贪欲，自制力土崩瓦解。他们曾因凡人对其神性的信仰而强大，但堕落为罪孽之身后，这份联系已然浑浊。如今的他们更似恶魔，以腐败为食，沦为昔日荣光的拙劣仿品。"
 POD_demon_gather_the_faithful_objective_decision_confirm: "罪孽交响曲"
 POD_demon_gather_the_faithful_decision_more_xp: "教徒提供的[arcana_lifestyle|E]经验值将#P;bold 翻倍#!**"
 POD_demon_gather_the_faithful_decision_next_objective: "解锁$POD_demon_breakdown_the_abyss_objective_decision$[decision|E]"
 POD_demon_gather_the_faithful_decision_unlock_sin_trait_vassalization: "允许你附庸持有与你信仰对应[trait|E]的统治者。"
 POD_demon_breakdown_the_abyss_objective_decision: "破碎深渊"
 POD_demon_breakdown_the_abyss_objective_decision_tooltip: "你将撕裂现存最重要的牢笼。"
 POD_demon_breakdown_the_abyss_objective_decision_desc: "[UmbraGlossary('abyss')]或称地狱、炼狱，是上帝为堕天者打造的永恒黑暗囚牢。你是为数不多的逃脱者，但若所有囚禁同胞皆得自由，世间当如何？他们多数已扭曲得不可名状，但谁又真该在这地狱中腐朽？\n你既已违逆上帝一次，何妨再叛第二次？"
 POD_demon_breakdown_the_abyss_objective_decision_confirm: "终获自由！"
 POD_demon_breakdown_the_abyss_objective_decision_custom1: "需在[arcana_lifestyle|E][lifestyle|E]中拥有至少45[perks|E]。"
 POD_demon_breakdown_the_abyss_objective_decision_free_lores: "恶魔将解锁全部[lore_lifestyle|E]。"
 POD_demon_breakdown_the_abyss_objective_decision_no_more_abyss: "恶魔将从[UmbraGlossary('abyss')]解放，意味着所有恶魔可再度穿行[umbra|E]。"
 POD_demon_breakdown_the_abyss_objective_decision_allow_create_demon: "你可为其他$POD_splat_demon_plural$制造容器，并招募其为宫廷宾客。"
 POD_demon_final_war_objective_decision: "终结之战"
 POD_demon_final_war_objective_decision_tooltip: "你将掀起第二次天怒之战。"
 POD_demon_final_war_objective_decision_desc: "上帝已背弃宇宙，任你沦落这污秽世间。是时候向这伟大的背叛者脸上啐一口唾沫，将这畸形造物焚为灰烬了。"
 POD_demon_final_war_objective_decision_confirm: "终结"
 POD_demon_final_war_objective_decision_custom1: "需点满[arcana_lifestyle|E][lifestyle|E]中所有[perks|E]。"
 POD_demon_final_war_objective_decision_end: "#X 终结一切战争的战争将开启。再无回头之路。你确定要亲手毁灭宇宙吗？#!"
 POD_demon_redemption_objective_decision: "神之宽恕"
 POD_demon_redemption_objective_decision_tooltip: "或许，渺远某处仍有希望残存。"
 POD_demon_redemption_objective_decision_desc: "天使往昔的记忆让你想起叛乱中失去的一切。若上帝真具慈悲，或许银之城仍有你一席之地？"
 POD_demon_redemption_objective_decision_confirm: "终见圣光"
 POD_demon_redemption_objective_decision_custom: "这将终结你的旅程——但愿是以救赎之名。"
 POD_demon_redemption_objective_decision_tt1: "释放你的密教徒。#weak (当前教徒数量：#V 0#!)#!"
 POD_demon_redemption_objective_decision_tt2: "背弃你的罪孽信仰。#weak (你的虔诚为#V 0#!或更低)#!"
 POD_new_genesis_objective_decision: "新创世纪"
 POD_new_genesis_objective_decision_desc: "上帝创造人类时赋予了他们一丝神性。若你能让足够多的凡人改信于你而非上帝，你与祂还有何区别？届时，或许该按你的意志重塑这世界了？"
 POD_new_genesis_objective_decision_tooltip: "他们将为您之名祈祷、生存、死亡。"
 POD_new_genesis_objective_decision_confirm: "开始吧……"
 demonic_knowledge_objective_decsion_custom1: "你必须拥有[lore_lifestyle|E][lifestyle|E]生活方式中的所有[perks|E]特性。"