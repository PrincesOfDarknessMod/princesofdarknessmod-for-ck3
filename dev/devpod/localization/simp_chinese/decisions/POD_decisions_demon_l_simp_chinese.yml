l_simp_chinese:
 POD_demon_demand_kill_pure_decision: "要求： 摧毁纯洁者"
 POD_demon_demand_kill_pure_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_kill_pure_decision_desc: "纯洁是恶魔的厌恶。你的主人要求你铲除世上的光明使者，以示虔诚。"
 POD_demon_demand_kill_pure_decision_confirm: "您的旨意已达成，主人"
 POD_demon_demand_kill_pure_decision_condition: "杀死一位猎人，浩恩永生吸血鬼，或有高心法等级的[GetTrait('kueijin').GetName( GetNullCharacter )]。"
 POD_demon_demand_banish_rival_decision: "要求：放逐敌手"
 POD_demon_demand_banish_rival_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_banish_rival_decision_desc: "恶魔最可怕的敌人就是自己的同族。你的主人要求将一位敌对的堕天使驱逐出这个世界。"
 POD_demon_demand_banish_rival_decision_confirm: "您的旨意已达成，主人"
 POD_demon_demand_banish_rival_decision_condition: "放逐一位恶魔到[UmbraGlossary('abyss')]。"
 POD_demon_demand_prepare_bodies_decision: "要求：准备宿体"
 POD_demon_demand_prepare_bodies_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_prepare_bodies_decision_desc: "肃灵仪式允许恶魔通过窃取自愿（或不自愿）宿主的身体，短暂显形。你的主人希望找到一些“志愿者”。"
 POD_demon_demand_prepare_bodies_decision_confirm: "您的旨意已达成，主人"
 POD_demon_demand_prepare_bodies_decision_condition: "监禁#V 10#!位角色"
 POD_demon_demand_bring_infernalist_decision: "要求：带来崇魔者"
 POD_demon_demand_bring_infernalist_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_bring_infernalist_decision_desc: "[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetFirstName]已被你的主人选中为有前途的崇魔者。把[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetHerHim]带入你的密教，或者在[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetSheHe]成为对手之前解决掉[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetHerHim]。"
 POD_demon_demand_bring_infernalist_decision_confirm: "您的旨意已达成，主人"
 POD_demon_demand_bring_infernalist_decision_condition: "[GetPlayer.MakeScope.GetVariable('to_infernalize').GetCharacter.GetFirstName]必须对你好感为正或者死"
 POD_demon_demand_corrupt_place_decision: "要求：腐化圣地"
 POD_demon_demand_corrupt_place_decision_tooltip: "你的主人给出要求。你必须回应。"
 POD_demon_demand_corrupt_place_decision_desc: "圣地是恶魔的禁忌。要想让其自由行动，你必须玷污这些圣地好让你的主人可以与它自由互动。"
 POD_demon_demand_corrupt_place_decision_confirm: "您的旨意已达成，主人"
 corrupt_the_world_objective_decision: "召集信众"
 corrupt_the_world_objective_decision_tooltip: "你的力量与凡人的信仰相连。是时候扩张你的羊群了。"
 corrupt_the_world_objective_decision_desc: "随着天怒之战的进行，天使们了解到尘世中巨大而未开发的邪恶潜力，这吸引变成了欲望，而控制这些欲望的能力却被削弱了。曾经，凡人对他们神圣本性的信仰为他们提供了力量，但他们重生为罪孽后，信仰的指向也变得混杂。现在，他们与其说是天使，不如说是恶魔，他们沉溺于堕落，空洞地嘲弄着自己曾经的存在。"
 corrupt_the_world_objective_decision_confirm: "原罪交响曲"
 corrupt_the_world_objective_decision_custom: "你的[capital|E][empire|E]（[THIS.Char.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]）的所有[de_jure|E][county|E]都必须是[THIS.Char.GetFaith.GetAdjective]信仰"
 unlock_lores_tooltip: "解锁天使的原初力量——[lore_lifestyle|E]生活方式。"
 unlock_breakdown_the_abyss_objective_decision: "解锁$breakdown_the_abyss_objective_decision$[decision|E]"
 unlock_sin_trait_vassalization: "允许直接附庸有着与你的信仰相对应的罪恶[trait|E]的统治者。"
 breakdown_the_abyss_objective_decision: "破碎深渊"
 breakdown_the_abyss_objective_decision_tooltip: "你将打破万物中最至高无上的监狱。"
 breakdown_the_abyss_objective_decision_desc: "[UmbraGlossary('abyss')]，也被称为地狱或无底坑，是上帝创造的黑暗维度，用于关押堕天者的永恒监狱。你是少数几个逃出来的恶魔之一，但如果你所有被囚禁的同胞们也都这样，会发生什么呢？许多都扭曲得令人难以置信，但真的有魔值得在这个字面意义上的地狱里腐烂吗？\n你违抗上帝的命令一次，就可以做第二次。"
 breakdown_the_abyss_objective_decision_confirm: "终于，自由了！"
 unlock_final_war_objective_decision: "解锁$final_war_objective_decision$[decision|E]"
 no_more_abyss_prison: "你不会再在无容器的情况下被困于[UmbraGlossary('abyss')]。"
 allow_create_demon: "你可以为其他[GetTrait('demon').GetName( GetPlayer )]提供容器，将其化为你的宫廷宾客。"
 final_war_objective_decision: "终结之战"
 final_war_objective_decision_tooltip: "你将发起第二场天怒之战。"
 final_war_objective_decision_desc: "上帝已经背弃了尘世，把你们抛弃在这个可悲的世界上。现在是时候将这个可憎的玩意彻底化为灰烬来唾弃无上叛徒的脸了。"
 final_war_objective_decision_confirm: "终"
 final_war_objective_decision_custom: "你将发动一场无休止的战争，直到地图不剩下不崇魔的独立统治者。"
 final_war_cb_modifier: "终结之战"
 POD_nephilim_decision: "拿非利人"
 POD_nephilim_decision_desc: "恶魔与凡人女性的后代，亚巴顿和阿斯莫德的实验的成果。他们被路西法和他的恶魔追随者追捕并杀害。\n\n不知是否有拿非利人幸存下来，除非你能找到现在位于北方的亚巴顿，或现在位于东方的阿斯莫德。或者更好，通过聚集足够多的灵媒来举办仪式，询问在[UmbraGlossaryLocalized('shadowlands','冥界')]的那些死去的拿非利[GetTrait('ferryman').GetName( GetPlayer )]们，那么也许你可以成为一支新拿非利人血种的先祖……"
 POD_nephilim_decision_tooltip: "你将找到创造新拿非利人所需的线索。"
 POD_nephilim_decision_confirm: "失落之人归来了……"
 nephilim_decision_modifier: "拿非利之祖"
 nephilim_decision_modifier_desc: "现在你的宿体将生产[GetTrait('nephilim').GetName( GetPlayer )]而非[GetTrait('laham').GetName( GetPlayer )]。"
 POD_nephilim_decision_custom: "你的宿主[TARGET_CHARACTER.GetFirstName]必须已结婚且能够生子，毕竟[TARGET_CHARACTER.GetHerHis]的子女会转为你的子女"
 demon_redemption_objective_decision: "神之宽恕"
 demon_redemption_objective_decision_tooltip: "也许，在遥远的某个地方，希望仍然存在。"
 demon_redemption_objective_decision_desc: "对你作为天使的过去的回忆使你想起了你在逆神中失去的一切。如果上帝真的宽宏大量，也许在祂的亮银之城还有你的位置？"
 demon_redemption_objective_decision_confirm: "终于，有了光"
 demon_redemption_objective_custom: "这将结束你的旅程于——希望是——救赎。"
 demon_redemption_tt1: "放弃你所有的世俗财产#weak （$demon_redemption_tt4$）#!"
 demon_redemption_tt2: "释放你的教徒们#weak （教徒数量为#V 0#!）#!"
 demon_redemption_tt3: "推翻你的原罪信仰#weak （你的虔诚为#V 0#!或更低）#!"
 demon_redemption_tt4: "你必须只剩一个伯爵领或是无地"
 demon_redemption_tt5: "平息你地狱般的怨恨#weak （$demon_redemption_tt6$）#!"
 demon_redemption_tt6: "你有#V 0#!磨难（[GetTrait('demon').GetName(GetPlayer)][trait_level_track_xp|E]）"
 restore_babylon_objective_decision: "重建巴比伦"
 restore_babylon_objective_decision_tooltip: "升起你的空中花园。"
 restore_babylon_objective_decision_desc: "那是一个充满野蛮帝国和神圣战争的时代，是一个英雄受到在世神赐福（或诅咒）的时代，是一个在黄金、玄武岩和玉石神像前举行难以言喻的仪式的时代。当地上世界发生冲突时，虔诚的信徒们大举进攻。大地在颤抖，天空下起血雨，整座城市被夷为平地。\n那是巴比伦，那是人间地狱。"
 restore_babylon_objective_decision_confirm: "辉煌的时代"
 restore_babylon_objective_decision_effect_tooltip: "[GetTrait('demon').GetName( GetPlayer )]和[GetTrait('cultist').GetName( GetPlayer )]统治者将一定接受你的要求臣服提议。"
 sin_dragon_objective_decision: "原罪之龙"
 sin_dragon_objective_decision_tooltip: "抓住原罪。"
 sin_dragon_objective_decision_desc: "七条巨龙被曾经虔诚的凡人逐渐泯灭的希望所召唤，它们正等待着一位罪孽化身来拯救它们。你会成为那邪恶典范吗？"
 sin_dragon_objective_decision_confirm: "原始苏醒"
 sin_dragon_objective_decision_effect_tooltip: "作为[character_interaction|E]，允许你在战争时召唤对应你[faith|E]的原罪之龙作为#bold 不可招募的#!事件[men_at_arms|E]。"
 unlock_sin_conversion_decision: "解锁$sin_conversion_decision$[decision|E]"
 sin_dragon_trainer_modifier: "原罪之龙的驯服者"
 overthrow_heaven_objective_decision: "新创世纪"
 overthrow_heaven_objective_decision_desc: "上帝在创造人类时，将他的神性火花注入了其中。如果你能够让足够多的凡人转向崇拜你而不是他，那么你和他之间又有什么区别呢？到了那时，或许就该按照你的形象重塑这个世界了？"
 overthrow_heaven_objective_decision_tooltip: "他们将以你的名义祈祷、生活并死去。"
 overthrow_heaven_objective_decision_confirm: "开始吧……"
 overthrow_heaven_objective_decision_custom: "你的[realm|E]的每个[county|E]都必须是[THIS.Char.GetFaith.GetAdjective]"
 demonic_knowledge_objective_decsion: "魔邪智慧之树"
 demonic_knowledge_objective_decsion_desc: "在深渊监狱的日子让你深刻认识到自己学识的局限性。上帝的计划似乎比你想象的要复杂得多。从那时起，你一直被求知的渴望所折磨。现在，是时候满足这份渴望了。"
 demonic_knowledge_objective_decsion_tooltip: "我能真正理解神圣吗？"
 demonic_knowledge_objective_decsion_confirm: "禁果，已服下。"