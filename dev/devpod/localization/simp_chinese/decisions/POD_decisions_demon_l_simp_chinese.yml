l_simp_chinese:
 restore_babylon_objective_decision: "重建巴比伦"
 restore_babylon_objective_decision_tooltip: "升起你的空中花园。"
 restore_babylon_objective_decision_desc: "那是一个充满野蛮帝国和神圣战争的时代，是一个英雄受到在世神赐福（或诅咒）的时代，是一个在黄金、玄武岩和玉石神像前举行难以言喻的仪式的时代。当地上世界发生冲突时，虔诚的信徒们大举进攻。大地在颤抖，天空下起血雨，整座城市被夷为平地。\n那是巴比伦，那是人间地狱。"
 restore_babylon_objective_decision_confirm: "辉煌的时代"
 restore_babylon_objective_decision_effect_tooltip: "[GetTrait('demon').GetName( GetPlayer )]和[GetTrait('witch').GetName( GetPlayer )]统治者将一定接受你的要求臣服提议。"
 sin_dragon_objective_decision: "原罪之龙"
 sin_dragon_objective_decision_tooltip: "抓住原罪。"
 sin_dragon_objective_decision_desc: "七条巨龙被曾经虔诚的凡人逐渐泯灭的希望所召唤，它们正等待着一位罪孽化身来拯救它们。你会成为那邪恶典范吗？"
 sin_dragon_objective_decision_confirm: "原始苏醒"
 sin_dragon_objective_decision_effect_tooltip: "解锁对应你[faith|E]的原罪之龙[men_at_arms|E]"
 unlock_sin_conversion_decision: "解锁$sin_conversion_decision$[decision|E]"
 sin_dragon_trainer_modifier: "原罪之龙的驯服者"
 demonic_knowledge_objective_decsion: "魔邪智慧之树"
 demonic_knowledge_objective_decsion_desc: "在深渊监狱的日子让你深刻认识到自己学识的局限性。上帝的计划似乎比你想象的要复杂得多。从那时起，你一直被求知的渴望所折磨。现在，是时候满足这份渴望了。"
 demonic_knowledge_objective_decsion_tooltip: "我能真正理解神圣吗？"
 demonic_knowledge_objective_decsion_confirm: "禁果，已服下。"
 POD_improve_ritual_of_sundered_soul_decision: "强化肃灵仪式"
 POD_improve_ritual_of_sundered_soul_decision_tooltip: "我岂会永世受困！"
 POD_improve_ritual_of_sundered_soul_decision_desc: "这道复杂的新仪式，是你将力量真实显化于地球的唯一途径。你需发掘其奥秘并完善它。"
 POD_improve_ritual_of_sundered_soul_decision_confirm: "很快，他们将见识我真正的力量。"
 POD_demon_gather_the_faithful_objective_decision: "召集信徒"
 POD_demon_gather_the_faithful_objective_decision_tooltip: "你的力量与凡人的信仰相连。是时候集结你的羔羊了。"
 POD_demon_gather_the_faithful_objective_decision_desc: "随着天堂之战的持续，天使们逐渐意识到宇宙中潜藏的庞大恶念。渴望化为贪欲，自制力土崩瓦解。他们曾因凡人对其神性的信仰而强大，但堕落为罪孽之身后，这份联系已然浑浊。如今的他们更似恶魔，以腐败为食，沦为昔日荣光的拙劣仿品。"
 POD_demon_gather_the_faithful_objective_decision_confirm: "罪孽交响曲"
 POD_demon_gather_the_faithful_decision_more_xp: "教徒提供的[arcana_lifestyle|E]经验值将#P;bold 翻倍#!"
 POD_demon_gather_the_faithful_decision_next_objective: "解锁$POD_demon_breakdown_the_abyss_objective_decision$[decision|E]"
 POD_demon_gather_the_faithful_decision_unlock_sin_trait_vassalization: "允许你附庸持有与你信仰对应[trait|E]的统治者。"
 POD_demon_breakdown_the_abyss_objective_decision: "破碎深渊"
 POD_demon_breakdown_the_abyss_objective_decision_tooltip: "你将撕裂现存最重要的牢笼。"
 POD_demon_breakdown_the_abyss_objective_decision_desc: "[UmbraGlossary('abyss')]或称地狱、炼狱，是上帝为堕天者打造的永恒黑暗囚牢。你是为数不多的逃脱者，但若所有囚禁同胞皆得自由，世间当如何？他们多数已扭曲得不可名状，但谁又真该在这地狱中腐朽？\n你既已违逆上帝一次，何妨再叛第二次？"
 POD_demon_breakdown_the_abyss_objective_decision_confirm: "终获自由！"
 POD_demon_breakdown_the_abyss_objective_decision_custom1: "需在[arcana_lifestyle|E] [lifestyle|E]中拥有至少45[perks|E]。"
 POD_demon_breakdown_the_abyss_objective_decision_free_lores: "恶魔将解锁全部[lore_lifestyle|E]。"
 POD_demon_breakdown_the_abyss_objective_decision_no_more_abyss: "恶魔将从[UmbraGlossary('abyss')]解放，意味着所有恶魔可再度穿行[umbra|E]。"
 POD_demon_breakdown_the_abyss_objective_decision_allow_create_demon: "你可为其他$POD_splat_demon_plural$制造容器，并招募其为宫廷宾客。"
 POD_demon_final_war_objective_decision: "终结之战"
 POD_demon_final_war_objective_decision_tooltip: "你将掀起第二次天怒之战。"
 POD_demon_final_war_objective_decision_desc: "上帝已背弃宇宙，任你沦落这污秽世间。是时候向这伟大的背叛者脸上啐一口唾沫，将这畸形造物焚为灰烬了。"
 POD_demon_final_war_objective_decision_confirm: "终结"
 POD_demon_final_war_objective_decision_custom1: "需点满[arcana_lifestyle|E] [lifestyle|E]中所有[perks|E]。"
 POD_demon_final_war_objective_decision_end: "#X 终结一切战争的战争将开启。再无回头之路。你确定要亲手毁灭宇宙吗？#!"
 POD_demon_redemption_objective_decision: "神之宽恕"
 POD_demon_redemption_objective_decision_tooltip: "或许，渺远某处仍有希望残存。"
 POD_demon_redemption_objective_decision_desc: "天使往昔的记忆让你想起叛乱中失去的一切。若上帝真具慈悲，或许银之城仍有你一席之地？"
 POD_demon_redemption_objective_decision_confirm: "终见圣光"
 POD_demon_redemption_objective_decision_custom: "这将终结你的旅程——但愿是以救赎之名。"
 POD_demon_redemption_objective_decision_tt1: "释放你的密教徒。#weak (当前教徒数量：#V 0#!)#!"
 POD_demon_redemption_objective_decision_tt2: "背弃你的罪孽信仰。#weak (你的虔诚为#V 0#!或更低)#!"
 POD_new_genesis_objective_decision: "新创世纪"
 POD_new_genesis_objective_decision_desc: "上帝创造人类时赋予了他们一丝神性。若你能让足够多的凡人改信于你而非上帝，你与祂还有何区别？届时，或许该按你的意志重塑这世界了？"
 POD_new_genesis_objective_decision_tooltip: "他们将为您之名祈祷、生存、死亡。"
 POD_new_genesis_objective_decision_confirm: "开始吧……"
 demonic_knowledge_objective_decsion_custom1: "你必须拥有[lore_lifestyle|E][lifestyle|E]生活方式中的所有[perks|E]特性。"
 landless_demon_objective_decision: "堕落之秘"
 landless_demon_objective_decision_tooltip: "上一个世界的残留。"
 landless_demon_objective_decision_desc: "天界叛乱之中，无数奇珍秘宝就此消失。你对那些过往只剩模糊的残忆，但或许这个时代的生灵还留存着些许零散的知识碎片可供你所用。"
 landless_demon_objective_decision_confirm: "消失但并未被遗忘……"
 landless_demon_objective_decision_valid_tt: "当你处于无地时，每识别出一名新的[cultist|E]都有机会获取关于天使失落秘典的新知识。更高的[learning|E]属性会提升该概率。\n\n你当前的知识进度：[GetPlayer.MakeScope.ScriptValue('POD_landless_demon_clues')|V0]。"
 landless_demon_objective_decision_effect_tt: "知识达到[EmptyScope.ScriptValue('POD_landless_demon_clues_for_1st_unlock')|V0]时，解锁[GetCourtPositionType('fell_knight_court_position').GetName()][court_position|E]\n\n知识达到[EmptyScope.ScriptValue('POD_landless_demon_clues_for_2nd_unlock')|V0]时，获得召唤$POD_splat_demon_plural$的能力，且所有召唤出的恶魔都会变得更强。\n\n知识达到[EmptyScope.ScriptValue('POD_landless_demon_clues_for_3rd_unlock')|V0]时，获得狩魂剑，一把威力极强的武器。"
 podintroductions.2406.t: "无地恶魔"
 podintroductions.2406.desc: "那些不直接掌控领地的恶魔，相较于固守一方的同类会更加依赖麾下的[cultists|E]。它们通常伪装成温和无害的宗教团体，实则是以末世为信条的狂热教派。不过四处迁徙也为它们带来了一项关键优势：知识。\n堕天使早已遗失了创世之初的大部分记忆，那些曾亲手缔造或亲眼见证的奇迹也已变得模糊。但残存的碎片仍藏于世间，它们寄望于吸纳各行各业的信徒，借此追寻并利用这些失传的造物与技法为自己谋求优势。\n\n#R 身为无地恶魔，每当你吸纳新的[cultist|E]时，都有可能基于自身的[learning|E]获得知识。这些知识可解锁各类丰厚奖励。你可以通过[GetDecision('landless_demon_objective_decision').GetName][decision|E]查看当前已掌握的知识进度，以及对应的奖励内容。#!"
 landless_demon_might_gain_clues_tt: "你或许能获得知识（详情见[GetDecision('landless_demon_objective_decision').GetName][decision|E]），具体取决于你的[learning|E]。"
 landless_demon_gain_clues_tt: "你获得[SCOPE.GetValue('landless_demon_clues_gained')|V0]知识"
 POD_demon_flavor.6.desc: "在天界战争的沙场上，堕天骑士凭借超凡的战技与无畏的悍勇崭露头角，效命于军团内高阶成员，或为其领主，或为其附庸。这些堕天骑士通常率领小型恶魔战团，担任高阶恶魔的近卫先锋，亦或戍守堕落者的堡垒与各类据点。\n\n自叛军溃败之后，这套晋升体系及其背后的仪式便已湮没于岁月长河。但你从人类传承的零星残忆中，成功复原了足够多的相关信息，得以将这一传统重焕生机。\n\n#R 堕天骑士的宫廷职位已解锁#!"
 POD_demon_flavor.7.t: "Building the Crucianomicon"
 POD_demon_flavor.7.desc: "The only way to reliably breach the Abyssal Prison is by knowing the True Name of one of its inhabitants, then using it for a summoning ritual. This is how your kind has been able to come back to Earth since the dawn of infernalism.\nStill, this is a slow and difficult process. By building a repository of all the fragmented knowledge gathered by humanity about the infernal, you could streamline the process and bring more of your (hopefully) grateful brethren back.\n\n#R The Summon Demon interaction is unlocked (if not already available). The demons summoned by said interaction will start stronger.#!"
 POD_demon_flavor.8.desc: "It was always at the back of your mind. It had to be somewhere after all. Such an unholy weapon couldn't just disappear, it just has to be found. And you found it.\n\nThe most infamous relic of the Fallen Angels, this massive broadsword is made of a dull, black metal, siyr which is the first metal mastered by Angels and Humanity alike after the Fall.\nForged at the bloody height of the war, Soultaker is an obscene and terrible weapon. The willing soul of a demon — his name long since forgotten — was bound into the black metal, where he could use this power upon anyone touched by the blade. The sword’s touch drained the energy and life from anyone it wounded — and if it killed a victim, his soul would be pulled from his corpse and imprisoned within the blade, there to be tortured and devoured by the original demon. Mortals and angels alike fell before Soultaker, their Faith torn apart for his sustenance.\nThen the sword’s bearer used it to slay another demon, and the sword changed. The two demonic souls fought for dominance within the blade, neither able to gain an advantage. Over time, their souls began to bleed into each other, creating a single fractured personality. As demonic infighting grew more serious in the war, more demons fell to Soultaker, and their souls became absorbed into a single insane entity — a being that called itself Legion. Soultaker was lost during the final days of the war, hidden deep in a forgotten weapons cache, and without new victims to devour for Faith, Legion grew weak and thin. Now it can think of nothing but food — Faith — and it will do anything to devour fresh souls once more."