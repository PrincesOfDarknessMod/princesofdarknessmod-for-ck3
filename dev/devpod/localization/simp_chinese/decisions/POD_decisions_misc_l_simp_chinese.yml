 challenge_house_head_decision: "挑战家主"
 challenge_house_head_decision_desc: "除了你，没有任何人可以带领你尊敬的世系走向辉煌。这只是一个让其他人理解（或至少接受）的问题。"
 challenge_house_head_decision_tooltip: "我的世系需要我。"
 challenge_house_head_decision_confirm: "现在我说了算！"
 challenge_house_head_decision_effect_tooltip: "根据你的家主目前的行踪，你将有数种选择来篡夺其的地位。"
 POD_diarchy_events.0005.desc: "有些吸血鬼氏族对于他们的世系比其他氏族更感兴趣，梵卓氏族就是一个典型的例子，但所有氏族至少都对这个概念表示一定的尊重。毕竟，当你的“家族”的长者往往已经活了几个世纪（或更久），比在底层争斗年轻稚子们更加强大，这很容易成为一种常态。\n然而，年轻成员在世系事务中掌握主导权也并非完全罕见。也许他们的长者已经厌倦了，或者在与受诅者们日夜的政治斗争完全不同的领域中行动。然而，很少有人会毫无条件地放弃家主的崇高地位，至少需要进行某种形式的考验或补偿。\n低估长者的傲慢者的灰烬可能会覆盖一个相当大的区域。"
 POD_diarchy_events.0005.a: "我比那些睡美人更有能力！"
 challenge_house_head_torpor: "你的家主正处于蛰眠。你夺取家主职位的唯一障碍就是你的族人们对你的鄙视和嫉妒。"
 POD_diarchy_events.0005.b: "转念一想……"
 POD_diarchy_events.0005.c: "你想要一个人情？好……"
 POD_diarchy_events.0005.d: "预备！"
 POD_diarchy_events.0005.duelwin: "现在我说了算！"
 POD_diarchy_events.0005.duelloss: "结果很糟……"
 POD_diarchy_events.0005.e: "我必须说服我的家族！"
 POD_diarchy_events.0005.f: "你就这么给我了？"
 challenge_house_head_content: "你的满意家主很乐意让您掌权。然而，你的家族对这种明目张胆的夺权行为并不满意。"
 challenged_house_head_modifier: "新兴家主"
 challenged_house_head_modifier_desc: "渺小的心灵无法理解你与生俱来的伟大。"
