 overwork_capital_decision: "对首都进行过度开发"
 overwork_capital_decision_desc: "这座城市仍在沉睡。它微弱地梦想着尚未实现的潜能。\n醒来吧，求索者，将它唤醒。街道将如血脉，宏伟建筑将钙化如骨骼，每一条灵魂都化作神经末梢，见证这饥饿的工业生命体。"
 overwork_capital_decision_tooltip: "驱使你领地中的凡人为实现你的愿景而努力"
 overwork_capital_decision_confirm: "工人们将为我流血"
 POD_county_overworked_modifier: "过劳"
 POD_county_overworked_modifier_desc: "这座城市的凡人们拼尽全力，只为实现其残酷主人的愿景。"
 judges_landless_special_tt: "你必须持有以下任一审判活动中心：[GetTitleByKey('c_jerusalem').GetNameNoTier]、[GetTitleByKey('c_cordoba').GetNameNoTier]、[GetTitleByKey('c_praha').GetNameNoTier]、[GetTitleByKey('c_kufa').GetNameNoTier]、[GetTitleByKey('c_tigre').GetNameNoTier]或[GetTitleByKey('c_kerala').GetNameNoTier]"
 judges_landless_objectives_tt: "解锁审判的更多目标"
 POD_shih_summon_decision: "召集士族盟友"
 POD_shih_summon_decision_desc: "[GetTrait('shih').GetName(GetNullCharacter)]消灭危害人类的超自然存在的目标，与我们为迎接第六纪元所做的准备不谋而合。虽非真正意义上的\"盟友\"，我们仍可不时向其求助，并期待得到积极回应。"
 POD_shih_summon_decision_confirm: "召唤士"
 POD_shih_summon_decision_tooltip: "共同对抗黄泉"
 POD_shih_summon_decision_effect: "你将召唤一位[GetTrait('shih').GetName(GetNullCharacter)]到[court|E]。"
 POD_demonology_focus_decision: "恶魔学重心"
 POD_demonology_focus_decision_desc: "[GetTrait('demonology').GetName(GetPlayer)]的许多方面仍令我困惑，或许通过接下来几年的专注研习，能让我得偿所愿？"
 POD_demonology_focus_decision_tooltip: "既可从速，何必枯等？"
 POD_demonology_focus_decision_confirm: "学习禁忌知识"
