 commit_suicide_decision_desc_mummy: "木乃伊有能力结束自己的不朽存在。奥西里斯不会强迫任何人永生。一位自杀的木乃伊被认为是没有生存意志的，不管其的意志力如何。木乃伊必须自愿打算真正和永久地死去。木乃伊因其他原因而实施的自杀行为不会结束木乃伊的存在。"
 POD_infernalist_study_demonology_1_decision: "入门恶魔学"
 POD_infernalist_study_demonology_1_decision_tooltip: "获得恶魔学特质。"
 POD_infernalist_study_demonology_1_decision_desc: "如果说邪恶的诱惑是诱人的，那么它所能给予的力量就更加诱人。你可以研究禁忌的学识……"
 POD_infernalist_study_demonology_1_decision_confirm: "学习崇魔"
