 POD_renaming_the_hekau_decision_desc: "当对\"列涅\"的掌控臻至化境，$POD_splat_mummy$甚至能改写其他超自然能力的法则。\n\n@warning_icon!#X 此决议仅能选择一次，请慎重抉择。#!"
