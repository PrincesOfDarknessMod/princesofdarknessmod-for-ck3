 restore_celestial_army_objective_decision: "重建天军"
 restore_celestial_army_objective_decision_desc: "数百年前，许多[GetTrait('shih').GetName( GetPlayer )]选择了一条更宏伟的道途：称为“天军”，他们试图消灭任何地方的鬼神，甚至就算没有必要也会采取行动。许多[GetTrait('shih').GetName( GetPlayer )]谴责这天军，因为他们对违反羿的主要教诲之一感到震惊。最终，[GetTrait('shih').GetName( GetPlayer )]变得傲慢，驱逐了所有不属于天军的狩魔人。不久之后，他们的总部在一次地震中被摧毁，只剩下了流浪者。"
