 repentant_brujah_modifier: "悔改的伪布鲁赫"
 repentant_brujah_modifier_desc: "对他们的祖先是特洛伊尔感到羞耻，假布鲁赫寻求救赎。"
 repentant_brujah_tooltip: "所有的布鲁赫，除了真布鲁赫，都会得到悔改的伪布鲁赫修正。只要他们有这修正，他们就会自动接受你的附庸和皈依提议。"
