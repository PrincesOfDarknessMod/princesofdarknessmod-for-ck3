 little_god_reinstatement_objective_decision: "复职小神"
 little_god_reinstatement_objective_decision_tooltip: "你将解除妖仙所受的流放。"
 little_god_reinstatement_objective_decision_desc: "天庭的官僚们在$pod_kueijin$堕落后的动荡岁月里被贬凡间。如今他们被迫如凡人般生活，背弃了天命职责。\n推动他们重新接受神圣使命，并在必要时迫使他人服从其权威，将极大修复衰弱的天庭秩序。"
 little_god_reinstatement_objective_decision_confirm: "崭新的（小）神圣时代"
