 reckoning_dragon_river_war_objective_decision: "龙河之战的九个太阳"
 reckoning_dragon_river_war_objective_decision_tooltip: "你将解除对[Glossary('万鬼','game_concept_kuei_jin_desc')]的太阳诅咒。"
 reckoning_dragon_river_war_objective_decision_desc: "龙河之战是上古时期一场席卷中原几乎所有超自然存在的灾难性战争。虽然战争的起因和经过已被时间迷雾掩盖，但其结果清晰可见——羿的诅咒使得$pod_kueijin$在阳光下灰飞烟灭。\n若能查明真相并找到羿射落九日的传奇之弓，或许会引发惊人的转机。"
 reckoning_dragon_river_war_objective_decision_confirm: "破除诅咒？"
