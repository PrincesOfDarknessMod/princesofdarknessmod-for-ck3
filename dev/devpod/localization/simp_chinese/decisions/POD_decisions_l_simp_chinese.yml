 poltzimi_objective_decision: "新的权力中心"
 poltzimi_objective_decision_desc: "长久以来，你的喀尔巴阡族人一直嘲笑你所谓的地方主义。虽然你的领地在军督领的外围，不像组成它的采地那么古老，但波兰王国及其首都克拉科夫比喀尔巴阡的任何部分都更加富饶，更接近广阔世界的事务。证明你在这里的霸权地位将不可否认地使$pod_clan$权力中心向你的方向转移。"
