 sacrifice_perk_from_obtenebration_decision_desc: "牺牲一个幽暗术等级以提升对深渊秘术的掌控，解锁新的[bs_rituals|E]。"
 sacrifice_perk_from_obtenebration_decision_confirm: "值得的牺牲。"
 one_with_shadows_objective_decision: "与暗影合一"
 one_with_shadows_objective_decision_tooltip: "潜入黑暗……"
 one_with_shadows_objective_decision_desc: "要真正理解深渊，你必须与其互动。你打算通过先使用一些可以抛弃的实验对象作为“探险者”，来使这一冒险变得更为安全。即使他们极有可能会惨死，但其死亡也会为你揭示深渊中的危险。"
 one_with_shadows_objective_decision_confirm: "……然后返回"
