 vaulderie_decision: "举行血盟仪式"
 vaulderie_decision_desc: "通过举行仪式并饮用盛有所有[GetPlayer.Custom('PODCoterie')]成员共享$pod_vitae$的酒杯，可以创建一个具有特殊属性的共同[Glossary('血缚','game_concept_bloodbond_desc')]。这种被称为血绊的联结会摧毁所有现有的血缚，并且不会随时间衰减。参与者之间会产生强烈的忠诚感，但没有通常伴随血缚而来的情感纠葛。"
 vaulderie_decision_tooltip: "与你的同伴缔结不可破的纽带"
 vaulderie_decision_confirm: "无锁链，无主宰"
 vaulderie_decision_is_valid: "你有一名拥有吸血鬼之血#weak ($POD_splat_vampire$,$POD_splat_ghoul$,$POD_splat_revenant$)#!的[GetPlayer.Custom('PODCoterie')]成员尚未参与此仪式"
 vaulderie_decision_effect: "所有拥有吸血鬼之血的[GetPlayer.Custom('PODCoterie')]成员彼此获得[perpetual_hooks|E]。当离开[GetPlayer.Custom('PODCoterieNoTooltip')]时，这些益处将失去。"
 POD_vaulderie_toast: "血中铸链"
