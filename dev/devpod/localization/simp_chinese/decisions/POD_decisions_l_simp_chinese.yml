 POD_contact_fellow_ghouls_decision_desc: "召唤你的血仆盟友前来相助，为你的随行队伍增添一名新角色。"
 POD_contact_fellow_ghouls_decision_tooltip: "在我需要帮助的时候"
 POD_contact_fellow_ghouls_decision_confirm: "我需要新鲜血液"
 POD_contact_fellow_ghouls_decision_effect1: "你将召唤一位[character|E]"
 generic_landless_mummy_objective_decision: "Immortals Around the World"
 generic_landless_mummy_objective_decision_desc: "Many cultures have tried to master, or at least studied, death and the afterlife. Learning from their discoveries and artifacts could prove to be a worthwhile endeavor."
 generic_landless_mummy_objective_decision_tooltip: "Dying from Ireland to Cathay."
 generic_landless_mummy_objective_decision_confirm: "A library worthy of my tomb."
 need_artifact_each_slot_decision_tt: "You need an equipped artifact in the following slots: Weapon, Regalia, Helmet, Armor and the four Miscellaneous ones."
 generic_landless_mummy_objective_decision_requirement: "You have visited #V 60#! [points_of_interest|E] #weak (Current: [THIS.Var('poi_visited').GetValue|V0])#!"
 withering_blood_objective_decision: "Cure the Withering Blood"
 withering_blood_objective_decision_tooltip: "The Bomkazi mortal line — our covenant partners, our sustenance — is failing. Each generation carries less of the old life-magic. We must find a way to save them or transcend our dependency."
 withering_blood_objective_decision_desc: "For centuries, the covenant between Impundulu and Bomkazi has sustained us. But the mortal witches grow fewer and weaker. The life-magic that once burned in their veins dims to embers.\n\nWe have traveled far, learned from Cappadocians and Giovanni alike. With the necromantic knowledge we have gathered, two paths open before us: renew the ancient covenant through ritual, or break free from it entirely through the Ishologu Rite."
 withering_blood_objective_decision_confirm: "The time has come."
 withering_blood_objective_decision_effect_tooltip: "You will choose between renewing the Bomkazi covenant or performing the Ishologu Rite to free your bloodline from its dependency."
 withering_blood_extra_necromancy_tt: "Has learned at least one necromancy path beyond Cenotaph and Haunting"
 imp_guardian_necromancy_level_tt: "Has Necromancy level 2 or higher"
 imp_guardian_bomkazi_died_tt: "A Bomkazi courtier has died recently"
 pod1230objectives.228.t: "Cure the Withering Blood"
 pod1230objectives.228.desc: "The knowledge is complete. The rituals are prepared. After centuries of searching, two paths lie before us — each offering salvation of a different kind.\n\nWe can renew the ancient covenant, binding Impundulu and Bomkazi together for eternity through a ritual of life and death intertwined. Or we can perform the Ishologu Rite, severing the dependency forever and transforming into something new — the Mla Watu, free but alone."
 pod1230objectives.228.a: "Renew the Covenant. Life and Death, together forever."
 pod1230objectives.228.custom_a: "Your dynasty gains the 'Covenant of Life and Death' modifier. Wraith effectiveness is strengthened. The Bomkazi bond endures."
 pod1230objectives.228.b: "Perform the Ishologu Rite. Break the chains."
 pod1230objectives.228.custom_b: "You gain the 'Ishologu' modifier. Your feeding restriction is removed, but the Bomkazi bond is severed."
 pod1230objectives.229.t: "The Impundulu's Choice"
 pod1230objectives.229.desc: "Word reaches us that the Impundulu bloodline has made a pivotal decision regarding their ancient covenant with the Bomkazi witches. The balance between life and death shifts."
 pod1230objectives.229.a: "有趣……"
 craft_shewstone_decision: "Craft a Shew-Stone"
 craft_shewstone_decision_tooltip: "Consecrate a polished stone and paint it with bird's blood. Spirits will whisper the secrets of those named upon it."
 craft_shewstone_decision_desc: "The Shew-Stone is a tradition older than the bloodline itself — a consecrated stone painted with a name in bird's blood. When the name is spoken, restless spirits whisper the named person's whereabouts and secrets.\n\nThe Cenotaph Path provides the knowledge to bind spirits to the stone."
 craft_shewstone_decision_confirm: "Begin the ritual."
 craft_nightmare_drums_decision: "Craft Nightmare Drums"
 craft_nightmare_drums_decision_tooltip: "Fashion drums from human skin. Inaudible to the living, they compel spirits to torment a rival's dreams."
 craft_nightmare_drums_decision_desc: "The Nightmare Drums are fashioned from human skin stretched over bone. No living ear can hear their rhythm — but the dead hear, and obey.\n\nStruck at midnight, the drums command ghosts to invade a rival's dreams, filling their sleep with terror and dread."
 craft_nightmare_drums_decision_confirm: "Fashion the instruments of dread."
 craft_witch_eye_decision: "Craft the Witch Eye"
 craft_witch_eye_decision_tooltip: "Implant an enchanted eye from a restless corpse into your own socket. The cost is your appearance; the reward is permanent Deathsight."
 craft_witch_eye_decision_desc: "The Witch Eye is the most extreme of Impundulu rituals. An eye is harvested from a restless corpse, enchanted with necromantic power, and implanted in the necromancer's own socket.\n\nThe price is terrible — the enchanted eye marks its bearer as something inhuman. But the gift of permanent Deathsight, the ability to see spirits and pierce all deception, is beyond value."
 craft_witch_eye_decision_confirm: "I accept the price."
 ennamaru_victory_objective_decision: "La Grande Tragédie"
 ennamaru_victory_objective_decision_tooltip: "Ah, what a grand stage of despair!"
 ennamaru_victory_objective_decision_desc: "We are the fractured shards of Ennamaru, and the only hymn our dark sire hears is pure despair. By plunging Francia into an orchestrated, nightmarish stage of tragedy, we will piece together our master and prepare the world for its glorious ruin."
 ennamaru_victory_objective_decision_custom: "You have at least #V 3#! Childer with #V 10#! [intrigue_i][intrigue|E] or more"
 ennamaru_victory_objective_decision_effect_tooltip: "Ennamaru is certain to reward your efforts."
 ennamaru_victory_objective_decision_confirm: "Take a bow. The masterpiece is complete."
 volgirre_objective_decision: "Magnum Opus"
 volgirre_objective_decision_desc: "The Fiends love to craft their flesh into grotesque, monstrous forms without a hint of aesthetic grace. By studying the intricacies of flesh and bone, I could transform myself into a terrifyingly beautiful form, better than what those savages could ever do."
 volgirre_objective_decision_custom: "You need at least #V 3#! [prisoners|E] with any positive beauty traits."
 volgirre_objective_decision_confirm: "Prepare the prisoners."
 volgirre_objective_decision_effect_tooltip: "You will unlock the [GetModifier('POD_shapeshift_form_dark_angel_modifier').GetNameWithTooltip] shapeshift option."
 volgirre_objective_decision_tooltip: "A form suited for a master artist."
 mnemachien_objective_decision: "Perfect the Humanitas"
 mnemachien_objective_decision_desc: "Since the nights of ancient Lutetia, we have resided in France, but a great rot festers in this land. To secure the future of our people, we must eradicate the infernal darkness growing in our borders. By mastering our sorceries and strengthening our harmony with the mortals, we could insulate ourselves from both the infernal and [Glossary('The Beast','game_concept_beast_desc')] inside us. Once the demonic shadow is purged and we grow strong, we can finally focus on elevating our domains and tend to our people in peace."
 mnemachien_objective_decision_custom: "You must have at least #V 3#! [GetCourtPositionType('touchstones_court_position').GetName()] filled with mortals of good [aptitude|E] or higher."
 mnemachien_objective_decision_customtwo: "No Children of Ennamaru must be landed in Francia."
 mnemachien_objective_decision_confirm: "Secure at last."
 mnemachien_objective_decision_effect_tooltip: "You will gain [GetModifier('lutetian_roots_modifier').GetNameWithTooltip] and the ability to develop your realm with the steward council action."
 mnemachien_objective_decision_tooltip: "The realm needs cleansing."