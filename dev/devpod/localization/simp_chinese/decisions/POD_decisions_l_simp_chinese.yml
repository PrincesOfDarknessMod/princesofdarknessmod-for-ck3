 POD_infernalist_sacrifice_to_great_demon_decision: "向地狱大公献祭"
 POD_infernalist_sacrifice_to_great_demon_decision_tooltip: "选择哪位大恶魔来献上祭品。"
 POD_infernalist_sacrifice_to_great_demon_decision_desc: "凭借你对恶魔学的掌握，你可以举行一个献给地狱大公之一的献祭大仪式。"
 POD_infernalist_sacrifice_to_great_demon_decision_confirm: "保佑我！"
 POD_infernalist_sacrifice_to_great_demon_decision_custom: "在选择献给哪个大恶魔后，你可以对自己使用[character_interaction|E]来选择进行哪种献祭。"
 POD_demon_maintenance.40.t: "地狱抉择"
 POD_demon_maintenance.40.desc: "凭借你对恶魔学的掌握，你可以举行一个献给地狱大公之一的献祭大仪式。\n长期以来，路西法的五位副手一直是地狱阶级的顶峰，他们相互竞争，以腐化宇宙并向上帝复仇。他们一直在寻找更多的追随者，并且对那些尊敬他们的人可是慷慨的……但最终总是要付出代价。"
