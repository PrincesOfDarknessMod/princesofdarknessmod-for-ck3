 toreador_grandeur_victory_objective_decision_desc: "最伟大的妥芮朵是潮流的引领者，因其大胆的艺术和学识努力而受到广泛的尊重和敬佩。你必须努力成为不死族世界最著名的赞助人。"
 toreador_grandeur_victory_objective_decision_effect_tooltip: "你将在妥芮朵中被尊重为领风者，这个时代最宏大的思潮将涌向你的领地。"
