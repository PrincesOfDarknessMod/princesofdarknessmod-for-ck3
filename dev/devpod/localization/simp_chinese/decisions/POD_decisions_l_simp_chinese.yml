 unhell_objective_decision: "侵扰魔皇"
 unhell_objective_decision_tooltip: "他的每一步登阶都需浴血奋战。"
 unhell_objective_decision_desc: "[Glossary('魔皇','podgloss.demonemperor')]的降临是中原不可回避的宿命。但只要有勇有谋者敢于直面其爪牙，仍可延缓其脚步、削弱其威能。"
 unhell_objective_decision_confirm: "暂时的……胜利。"
 unhellish_modifier: "幽冥克星"
 POD_demon_earthbound_kupala_decision: "特兰西瓦尼亚编年史"
 POD_demon_earthbound_kupala_decision_tooltip: "是时候从特兰西瓦尼亚当前的主人——库帕拉——手中夺走它了。"
 POD_demon_earthbound_kupala_decision_desc: "库帕拉也许是第一位逃出深渊监狱的恶魔，它将自己与特兰西瓦尼亚紧紧地束缚在一起。只要它不被击败，它就会成为你的危险对手。"
 kupala_victory_objective_decision_custom: "你需要一件专门用于杀死库帕拉的武器：[GetPODArtifactName('sword_of_dracula_link')]或它的原型——[GetPODArtifactName('ainkurn_link')]"
 kupala_victory_objective_decision_custom2: "将库帕拉束缚（或解缚）于这片土地上的唯一方法，可以在库帕拉摇篮本中找到，需使用五件库帕拉条约宝物进行汇编。"
 POD_demon_earthbound_kupala_decision_confirm: "特兰西瓦尼亚是我的！"
 azhi_dahaka_objective_decision: "寻求阿兹·达哈卡"
 azhi_dahaka_objective_decision_tooltip: "与变化合一"
 azhi_dahaka_objective_decision_desc: "阿兹·达哈卡是蜕变者追求的神话状态。这是转变的预兆，在这种状态下，身体和心理规范和结构失去了对吸血鬼灵魂的控制。为了实现这一目标，每个有抱负的人都必须找到自己的路，因为停滞终究是一种灭绝。"
 azhi_dahaka_objective_decision_confirm: "让我们开始实验吧……"
 azhi_dahaka_objective_decision_prisoner: "至少有#color_white 10#!个为[GetTrait('vampgeneration10').GetName(GetNullCharacter)]或者更前的[prisoners|E]。"
