 POD_infernalist_study_demonology_3_decision_tooltip: "完毕增强恶魔学特质。"
 POD_infernalist_study_demonology_3_decision_desc: "要付出可怕的代价来获取恶魔们最梦寐以求的秘密。但它们能释放出什么样的可怕力量？"
