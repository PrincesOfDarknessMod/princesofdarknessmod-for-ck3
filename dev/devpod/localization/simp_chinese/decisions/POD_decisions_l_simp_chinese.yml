 ikhwan_al_safa_egypt_objective_decision: "援助兴光者"
 ikhwan_al_safa_egypt_objective_decision_desc: "更加实际的古兰赛义德成员认识到，木乃伊们比精诚兄弟社更有经验，更了解夜行者，因此向他们提供了援助。"
 ikhwan_al_safa_egypt_objective_decision_tooltip: "你将清洗信仰之地的核心，并从这援助受益。"
 ikhwan_al_safa_egypt_objective_decision_confirm: "不朽朋友？"
 ikhwan_al_safa_arabia_objective_decision: "解放恸鸣"
 ikhwan_al_safa_arabia_objective_decision_desc: "恸鸣来自于卡巴天房内的黑石，其始于先知穆罕默德征服麦加之后，人们普遍认为它是真主力量的显现。被污染的超自然，如吸血鬼，会觉得恸鸣是一种喧嚣的哀号和尖啸。在其历史上，恸鸣只停止过一次，那是在950年，当伊斯兰教派卡尔马特派的成员偷走了黑石。这使得吸血鬼塔利克能够建立起术法封印，限制住一部分恸鸣，尽管他们不能完全压制它。"
 ikhwan_al_safa_arabia_objective_decision_tooltip: "你将把恸鸣从塔利克的邪恶术法中释放出来。"
 ikhwan_al_safa_arabia_objective_decision_confirm: "真主将怒斥"
 ikhwan_al_safa_arabia_objective_decision_effect_tooltip: "恸鸣会释放出它所蕴含的力量，使所有吸血鬼远离阿拉伯。\n他们将失去头衔而你会获得它们。"
 ikhwan_al_safa_persia_objective_decision: "联系塔夫尼"
 ikhwan_al_safa_persia_objective_decision_desc: "被称为塔夫尼的隐居波斯法师过去曾是我们偶尔的盟友。证明你的价值并与他们结成持久的联盟可以为双方的合作开辟新的可能性。"
 ikhwan_al_safa_persia_objective_decision_tooltip: "塔夫尼会教授你一种更弱版本的魔法。"
 ikhwan_al_safa_persia_objective_decision_confirm: "我将开道"
 ikhwan_al_safa_persia_objective_decision_effect_tooltip: "[ROOT.Char.GetFaith.GetName]将在圣职授任时获得[GetTrait('sorcerer').GetName( GetPlayer )][trait|E]。"
 POD_demon_unearthbound_decision: "清除恶魔污染"
 POD_demon_unearthbound_decision_tooltip: "处理被腐化的土地。"
 POD_demon_unearthbound_decision_desc: "你的部分地产已经被恶魔污染所玷污。虽然很昂贵，但它可以被修复。"
 POD_demon_unearthbound_decision_confirm: "来位驱魔师！"
 POD_demon_maintenance.30.t: "清除恶魔污染"
 POD_demon_maintenance.30.desc: "恶魔的腐化在大多数时候都是不见天日的。但在有些情况下，地狱居民并不那么迂回，他们试图腐化土地本身，希望把自己束缚在上面。\n你不太清楚“为什么”和“怎么做”，但最终的结果是一副可怕的景象，自然被这个地狱般的存在所玷污。幸运的是，如果你用心（和资源）去做，消除这痕迹是可行的。你已经聚集了最伟大的猎魔人，愿意在这方面与你一起合作，时刻可以触发。"
 POD_demon_maintenance.30.option.a: "吾放逐汝！"
