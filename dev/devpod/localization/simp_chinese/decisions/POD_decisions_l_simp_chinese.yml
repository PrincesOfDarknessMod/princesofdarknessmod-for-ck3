 achieve_ra_hekau_objective_decision: "成就拉-赫考"
 achieve_ra_hekau_objective_decision_desc: "古老的贤荷鲁将拉-赫考称为赫考的至高技艺，即通过运用万物的[Glossary('真名','podgloss.truename')]来掌控世界。\n根据古埃及传说，当太阳神拉将自己的[Glossary('真名','podgloss.truename')]赐予伊西斯，让她能够治愈自己致命的毒伤时，拉-赫考首次显现。这使她成为魔法女神，并构筑了生命神咒。\n自那以后，拉-赫考早已失传，并被木乃伊们认为无法习得——但更离奇的事情也曾发生……"
 achieve_ra_hekau_objective_decision_tooltip: "统御一切真名之力"
 achieve_ra_hekau_objective_decision_confirm: "超越魔法界限"
 achieve_ra_hekau_objective_decision_custom1: "你知晓#V 25#!的[Glossary('真名','podgloss.truename')][traits|E]#weak （[GetPlayer.MakeScope.ScriptValue('known_trait_true_names_number')]）#!"
