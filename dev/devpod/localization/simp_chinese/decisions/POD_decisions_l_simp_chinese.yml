 awake_hun_and_po_objective_decision_after_last_date: "时间是1421年或更迟"
 akritai_mend_hunter_schism_decision: "弥合大分裂"
 akritai_mend_hunter_schism_decision_desc: "教会大分裂见证了基督教分裂为两个分支，第四次十字军东征导致东正教势力减弱，但如果五大牧首区都支持边防军，基督教的暗影裁判所将屈服于我们。"
 akritai_mend_hunter_schism_decision_tooltip: "我将重新统一基督教世界"
 akritai_mend_hunter_schism_decision_confirm: "一个神，一个教会！"
 judge_sorcery_objective_decision: "卡巴拉"
 judge_sorcery_objective_decision_desc: "你将研习塔木德秘经的神圣文本和实践，它是早期民长的教义和论点的汇编，希望能找到如何汲取民间魔法力量为己所用的秘诀。"
 judge_sorcery_objective_decision_tooltip: "你找到了蕴涵在犹太神秘主义里的力量。"
 judge_sorcery_objective_decision_confirm: "我会找到出路"
 purifying_black_tortoise_objective_decision_custom: "[GetTitleByKey('e_anda').GetNameNoTier]头衔必须已被销毁。"
 enter_long_sleep_decision: "长眠仪式"
 enter_long_sleep_decision_desc: "随着仪式的进行，古拉赫勒可以让一个人进入活动中止状态，与熊的自然冬眠差不多。在这种状态下，受试者不会衰老；身体机能处于静止状态，呼吸降至绝对最低。这种仪式使得失能者可以无限期地维持下去，保持他们的生命力，以便他们可以在以后的日子里被治愈（无论是自然恢复还是使用法术）。"
 nosferatu_exclusive_decisions_tt: "“你体贴的祖母”与“黑暗中的恐怖”为互斥决议。"
 occupy_san_michele_decision: "占据圣弥额尔修道院"
 occupy_san_michele_decision_tooltip: "为裁判所创建总部"
 occupy_san_michele_decision_desc: "[st_peters_city|E]被束缚着。如果我们能解救她，我们将在她的一座修道院中居住，使其成为对抗黑暗势力的总部。"
 occupy_san_michele_decision_confirm: "解放圣城"
