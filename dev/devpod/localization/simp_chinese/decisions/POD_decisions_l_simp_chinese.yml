 pod1230inqui_prospect.2.e: "我需要一位红修会成员。"
 contact_fellow_hunters_decision: "联系猎人同僚"
 contact_fellow_hunters_decision_tooltip: "联合以对抗黑暗？"
 contact_fellow_hunters_decision_desc: "你已经从各种猎人组织那里获得了一些支持。这些支持可以被利用来获得帮助。"
 contact_fellow_hunters_decision_confirm: "世界上所有猎人们，团结起来！"
 contact_fellow_hunters_decision_tt: "你可以要求一位修会成员加入你或教导你，具体取决于你解锁的传承。"
 pod1230inqui_prospect.3.desc: "多亏了你为获得其他猎人组织的支持所做的努力，你现在可以利用他们的帮助为自己谋利。每个组织都有一套独特的技能，可以帮助你的事业。在那些完全无视威胁的民众中度过了这么长时间（并且经常无意中阻碍你的努力）之后，与这些知道琐碎的世俗不满在超自然危险面前是多么不值一提的人一起工作的感觉真好。"
 pod1230inqui_prospect.3.a: "我需要一位裁判官战士。"
 pod1230inqui_prospect.3.b: "我需要一位精诚兄弟社间谍大师。"
 pod1230inqui_prospect.3.bis: "精诚兄弟社可以教你术法。"
 pod1230inqui_prospect.3.c: "我需要一位博学的裁判官。"
