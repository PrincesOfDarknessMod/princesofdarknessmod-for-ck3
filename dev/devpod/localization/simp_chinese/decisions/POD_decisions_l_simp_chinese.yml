 new_yama_king_objective_decision_desc: "[Glossary('阎魔王','podgloss.yamaking')]乃幽冥的至高守护者，多为堕落的[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]仆从。其发现可通过折磨人类灵魂提取气，遂采用此类技术汲取能量。西方称阳之阎魔为“Bane”，阴之阎魔为“Malfeans”。\n阎魔的冥秩随时间更迭，旧者常为新者所败，而新者的崛起多与凡人世界的巨变相关。"
 new_yama_king_objective_decision_tooltip: "何须侍奉，何不掌控？"
 new_yama_king_objective_decision_confirm: "为阎魔之王，岂不快哉？"
