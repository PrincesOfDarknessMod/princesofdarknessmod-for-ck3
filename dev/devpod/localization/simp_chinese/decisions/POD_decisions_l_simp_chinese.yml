 POD_infernalist_wealth_and_influence_decision_tooltip: "向恶魔索求财富和声望。"
 POD_infernalist_wealth_and_influence_decision_desc: "巨大的财富、影响力或人际关系。几乎任何东西都可以通过与合适的“人”签订契约而获得或增加……"
 POD_infernalist_wealth_and_influence_decision_confirm: "合适的代价"
 POD_demon_longevity_decision: "永生？"
 POD_demon_longevity_decision_tooltip: "使用奥秘的力量来增长寿命。"
 POD_demon_longevity_decision_desc: "每使用一次该奥秘，魔奴就会在五年内停止衰老。这是向最伟大的奖赏迈出的一小步。"
 POD_demon_longevity_decision_confirm: "重获青春！"
 POD_infernalist_longevity_decision: "永生？"
 POD_infernalist_longevity_decision_tooltip: "向恶魔索求寿命。"
 POD_infernalist_longevity_decision_desc: "有了这契约，祈求者可以增加5年寿命。许多崇魔者每5年举行一次仪式，献祭几十个无辜者来争取更多的寿命。"
 POD_infernalist_longevity_decision_confirm: "重获青春！"
 ravnos_jati_decision: "雷伏诺迦提"
 ravnos_jati_decision_tooltip: "分裂的家庭，各自追求着自己的目标。"
 ravnos_jati_decision_desc: "雷伏诺氏族被划分为众多的迦提（种姓），每个种姓都追求自己的目标。如果你能实现它，你迦提的整体精神将得到改善。"
 ravnos_jati_decision_confirm: "我们的种姓将赢得胜利！"
 awake_hun_and_po_objective_decision: "觉醒魂魄"
 awake_hun_and_po_objective_decision_tooltip: "你将唤醒魂魄，成为[Glossary('万鬼','game_concept_kuei_jin_desc')]。"
 awake_hun_and_po_objective_decision_desc: "研究万鬼的传说的萨洛比通常受到[Glossary('万鬼','game_concept_kuei_jin_desc')]的冷遇以及礼貌回拒。萨洛比血律是[Glossary('万鬼','game_concept_kuei_jin_desc')]传承的神秘变异（或转化），所以有学术倾向的萨洛比对[Glossary('饿殍','game_concept_kuei_jin_desc')]有很多兴趣。谣言说，一位或更多的萨洛比实际上觉醒了魂魄，但这过程本身至少可以说是不为所知。"
 awake_hun_and_po_objective_decision_confirm: "谣言是真的"
 awake_hun_and_po_objective_decision_custom1: "你已捕获#V 5#!名[GetTrait('kueijin').GetName( GetPlayer )][GetTrait('dharma5').GetName( GetPlayer )]"
