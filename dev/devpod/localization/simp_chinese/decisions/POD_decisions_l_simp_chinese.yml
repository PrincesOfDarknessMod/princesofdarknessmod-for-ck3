 true_brujah_victory_objective_decision_tooltip: "所谓的“布鲁赫”是被满嘴谎言的特洛伊尔制造出来的受骗子嗣。真相必须被揭开。"
 true_brujah_victory_objective_decision_desc: "为了证明布鲁赫氏族的真相，你需要迫使迦太基的子嗣们支持你的主张……或者没有资格再与你争论。"
