 reckoning_war_of_shame_objective_decision_tooltip: "你将为堕落的[Glossary('万仙','game_concept_kuei_jin_desc')]复仇，并与狼族结盟。"
 reckoning_war_of_shame_objective_decision_desc: "在堕落之时，最初的$pod_kueijin$曾与$glossary_fera$展开了一场可耻的战争，几乎灭绝了其中一些族群。为纠正这一错误，必须归还战争中夺取的龙穴，并修复他们的祖灵。"
