 POD_demon_wealth_and_influence_decision_tooltip: "使用奥秘力量来获得凡俗恩惠。"
 POD_demon_wealth_and_influence_decision_desc: "命运似乎眷顾你，因为你很巧合的获得了不寻常的凡俗恩惠。是幸运女神在微笑，还是另有隐情？"
