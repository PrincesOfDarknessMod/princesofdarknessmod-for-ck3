 demonization_objective_decision: "不洁飞升：狩猎德查尼"
 demonization_objective_decision_tooltip: "不洁之力触手可及！"
 demonization_objective_decision_desc: "德查尼被描述为36个瘟疫恶魔组成的集群，实际上它们是沉睡中的纳姆塔尔的多个面相，而衰旦曾试图复苏纳姆塔尔。纳姆塔尔鼓励竞争与野心，而众所周知的是，熟练的崇魔者能够篡夺他们的地位，成为真正的恶魔。"
 demonization_objective_decision_confirm: "我够资格。"
 demonization_objective_decision_effect: "你将引发事件以开始你的狩猎。\n#X 若你毫无准备且实力不济，无法抵御德查尼，必将以惨败收场。#!"
 quest_for_sargon_codex_objective_decision: "追寻萨尔贡圣典"
 quest_for_sargon_codex_objective_decision_tooltip: "终极的知识等待着"
 quest_for_sargon_codex_objective_decision_desc: "萨尔贡圣典是一块由卡帕多修斯在凡人时期写就的泥板。在他经历了$pod_Embrace$之后，因失去了他的化身，他的记忆陷入了混乱与破碎之中。他无法记起自己曾写下的内容，也不记得将其留在了何处。历经千年，萨尔贡圣典被毁，其残页散落世界各地。若有人能将其修复，将会获得巨大的力量。"
 quest_for_sargon_codex_objective_decision_confirm: "上古者的智慧近在咫尺……"
 quest_for_sargon_codex_objective_decision_at_least_1_shard: "你必须拥有至少一片萨尔贡圣典的残篇。"
 quest_for_sargon_codex_objective_decision_at_effect1: "解锁[journey|E]，以允许搜寻世界各地的萨尔贡圣典残篇。"
 quest_for_sargon_codex_objective_decision_at_effect2: "解锁[character_interaction|E]，以允许开始研究你已获得的萨尔贡圣典残篇。"
 quest_for_sargon_codex_objective_decision_at_effect3: "解锁[decision|E]，以允许将你获得的萨尔贡圣典残篇赠与卡帕多修斯。"
 deliver_shards_to_cappadocius_objective_decision: "将残篇还给卡帕多修斯"
 deliver_shards_to_cappadocius_objective_decision_tooltip: "将它们归还到该去的地方"
 deliver_shards_to_cappadocius_objective_decision_desc: "萨尔贡圣典是一块由卡帕多修斯在凡人时期写就的泥板。在他经历了$pod_Embrace$之后，因失去了他的化身，他的记忆陷入了混乱与破碎之中。他无法记起自己曾写下的内容，也不记得将其留在了何处。历经千年，萨尔贡圣典被毁，其残页散落世界各地。若有人能将其修复，将会获得巨大的力量。\n\n但你并不贪图这种力量，因此你决定物归原主。"
 deliver_shards_to_cappadocius_objective_decision_confirm: "我向您呈上……"
 deliver_shards_to_cappadocius_objective_decision_effect: "将收集到的残篇交给卡帕多修斯，每个残篇都会给予你[GetModifier('cappadocius_boon_modifier').GetNameWithTooltip]"
 deliver_shards_to_cappadocius_objective_decision_effect2: "你失去研究你拥有残篇的[character_interaction|E]"
 deliver_shards_to_cappadocius_objective_decision_shard_custom: "你必须拥有至少一片萨尔贡圣典的残篇。$POD_understand_sargon_codex_shard_interaction_custom$"
 malkavian_aenigmatis_objective_decision: "解密会：俗世的谜语与拼图"
 malkavian_aenigmatis_objective_decision_tooltip: "寻找最伟大的秘密。"
 malkavian_aenigmatis_objective_decision_desc: "解密会旨在通过面对那些不可想象和壮丽的事物，例如上帝、时间、宇宙的全貌或是该隐本身，来消除末卡维的疯狂。每一个谜团都值得寻找解决方案。"
 malkavian_aenigmatis_objective_decision_confirm: "我将解决所有谜题！"
 malkavian_aenigmatis_objective_decision_effect: "作为[character_interaction|E]，你可以‘解开’书籍（这将摧毁它们）以获得一个修正。达到某些阈值后，你将获得额外的奖励。"
 malkavian_aenigmatis_objective_decision_has_5_book_artifact: "拥有至少 #color_white 5#! 本书籍[artifact|E]"
 malkavian_ecstasis_objective_decision: "狂喜会：痛苦与愉悦"
 malkavian_ecstasis_objective_decision_tooltip: "通过情感进行升华"
 malkavian_ecstasis_objective_decision_desc: "狂喜会认为真正的疯狂正是凡俗状态本身。在他们看来，心兽才是真正的神圣造物，因此必须倾听和安抚。理解它是理解上帝和自我的关键。"
 malkavian_ecstasis_objective_decision_confirm: "神圣的感官体验"
 malkavian_ecstasis_objective_decision_effect: "作为[character_interaction|E]，你可以通过强迫血狂来获得一个修正，该修正基于你组织的欢会​次数（在完成此[decision|E]之后）。\n达到一定次数的欢会后，你将获得额外奖励。"
 malkavian_maleficus_objective_decision: "为恶会：内在黑暗"
 malkavian_maleficus_objective_decision_tooltip: "向下寻找答案。"
 malkavian_maleficus_objective_decision_desc: "作为最隐秘（且异端）的教团之一，为恶会相信该隐之子的本性中存在固有的黑暗。因此，为了治愈他们的疯狂，他们不惜一切极端手段。对于真正被诅咒的人来说，崇魔又算得了什么？"
 malkavian_maleficus_objective_decision_confirm: "神明离弃我辈，但地狱聆听我辈"
 malkavian_maleficus_objective_decision_effect: "作为一个[character_interaction|E]，你可以通过献祭囚犯来获得一个修正，该修正会根据通过此互动进行的总牺牲数量而逐步增强。"
 has_supernatural_race_trigger_tt: "是一位超自然"
 pod1230inqui_prospect.2.desc: "你在天主教会和暗影裁判所中的地位和影响力使你得以拜访这个强力组织的创始成员。他们早已凭自己的本事成为猎人，并能以更直接的方式在战斗中帮上忙，不过你没法让他们成为你的猎人学徒。"
