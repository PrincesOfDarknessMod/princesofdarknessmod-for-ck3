 POD_mummy_spell_of_life_cabiri: "获得制作卡比里木乃伊的能力"
 POD_mummy_spell_of_life_custom_mummy_dynasty: "获得制作新王朝木乃伊的能力"
 spell_of_life_abandon_vampirism_decision: "为生命神咒放弃吸血鬼之道"
 spell_of_life_abandon_vampirism_decision_desc: "尽管吸血有其优势，却也背负着诸多诅咒。然而，你的学识提供了一种副作用较少的永生之道：永恒重生。\n\n遗憾的是，像吸血鬼这样的不死生物无法转化为木乃伊。此外，吸血鬼也无法施展诸如生命神咒之类的魔法。因此，你需要找到方法规避这些难题……并决定自己是否愿意。毕竟，仪式中你必须死去，所以还需寻得一位可信任之人来执行。\n\n#warning 若你幸存下来，将会成为木乃伊，这将彻底改变游戏玩法，禁用你的建筑，并可能摧毁你更高等级领地头衔。\n若你未做好准备，这很可能令你的道路陷入瘫痪。#!"
 spell_of_life_abandon_vampirism_decision.second_step: "我该如何实现它？"
 spell_of_life_abandon_vampirism_decision_confirm: "开始仪式"
 spell_of_life_abandon_vampirism_decision_tooltip: "吸血鬼化有许多诅咒，但替代的不朽之源同样存在。"
 spell_of_life_abandon_vampirism_decision_kemintiri: "[GetScriptedCharacterByHistoryID('790512').GetFirstName]对木乃伊魔法有着独特的理解，这使[GetScriptedCharacterByHistoryID('790512').GetHerHim]在加入其行列后占得先机"
 spell_of_life_abandon_vampirism_decision.tt.wraith_route: "通过死灵之道\n#low $spell_of_life_abandon_vampirism_decision.tt.wraith_route_desc$#!"
