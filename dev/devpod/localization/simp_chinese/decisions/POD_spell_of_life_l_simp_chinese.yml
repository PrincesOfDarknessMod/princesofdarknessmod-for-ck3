 POD_newborn_mummy_modifier: "新生儿"
 POD_newborn_mummy_modifier_desc: "#help 死亡之时，这一切都将失去#!\n对于$POD_splat_mummy_plural$的世界而言，你尚属新生。你还未经历轮回循环，也未在新形态中沉浸许久。"
 spell_of_life_give_to_horus_decision: "将生命神咒交给荷鲁斯"
 spell_of_life_give_to_horus_decision_desc: "荷鲁斯法典第六条禁止使用生命神咒或制造新的木乃伊。若你是荷鲁斯的忠诚信徒，就应将你所有的研究上交给他，并允许他从你的记忆中抹除这些知识。这样的馈赠很可能会在他眼中洗刷你任何被禁止的行为。此外，荷鲁斯向来依据所献服务的价值，给予伟大功绩相应的奖赏。"
 spell_of_life_give_to_horus_decision_confirm: "请求觐见"
 spell_of_life_give_to_horus_decision_tooltip: "一位忠诚的贤荷鲁会交出他们的生命神咒。"
 spell_of_life_decision_must_know_sol: "了解完整的生命神咒#weak （在$trait_track_spell_of_life$[GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)]中拥有100点[trait_level_track_xp|E]）#!"
 spell_of_life_give_to_kemintiri_decision: "对刻茉媞里使用生命神咒"
 spell_of_life_give_to_kemintiri_decision_desc: "曾是伊西斯女祭司的刻茉媞里，被赛特初拥只是为了惩罚她对伊西斯的忠诚。自那之后，她投入了大量时间猎杀赛特之子。她忠于伊西斯的教义，不愿仅为己利而将生命神咒授予你。不过，鉴于你与她的交情以及你对这神咒的新认识，说服她让你对她施展生命神咒并非难事。"
 spell_of_life_give_to_kemintiri_decision_confirm: "让我们与伊西斯最后的祭司交谈"
 spell_of_life_give_to_kemintiri_decision_tooltip: "刻茉媞里曾因初拥而饱受折磨，如今她或欲寻求摆脱血族之身的方法。"
 spell_of_life_give_to_set_decision: "将生命神咒交给赛特"
 spell_of_life_give_to_set_decision_desc: "赛特耗费了无数岁月追寻生命神咒，为此编织了数不清的阴谋诡计。他未能得手之事，你却成功了，如今你有了机会将它交到他手中。只要你表现得足够恭顺，他便会心怀感激，赐予你丰厚的奖赏，而不是因嫉妒而惩罚你。"
 spell_of_life_give_to_set_decision_confirm: "我是赛特的仆人。"
 spell_of_life_give_to_set_decision_tooltip: "赛特追寻着生命神咒，而你正有机会将它赐予他。"
 spell_of_life_give_to_apophis_decision: "金盘盛食，侍奉天下"
 spell_of_life_give_to_apophis_decision_desc: "[UmbraGlossaryLocalized('oblivion','阿波菲斯')]寻求生命神咒。在盛宴上献上此咒，目睹世界被生命神咒的魔法吞噬。是时候让[UmbraGlossaryLocalized('oblivion','阿波菲斯')]吞噬这个世界了。"
 spell_of_life_give_to_apophis_decision_confirm: "终结已至。"
 spell_of_life_give_to_apophis_decision_tooltip: "阿波菲斯之宴"
 spell_of_life_give_to_apophis_decision_prisoners: "至少抓获#color_white 25#!名拥有#color_white 50#![prowess|E]的囚犯以供享用"
 spell_of_life_find_new_home_decision: "找到新家"
 spell_of_life_find_new_home_decision_desc: "经过大量研究，你获得了一个生命神咒的版本。然而，这个神咒旨在将灵魂绑定到一个不同于你死后所前往的[UmbraGlossary('shadow_realm')]。虽然你无法修改生命神咒来利用与你自身灵魂相同的[UmbraGlossary('shadow_realm')]，但你应当能够通过对自身重新施放生命神咒，并稍作改动，将你的灵魂重新绑定到另一个界域。"
 spell_of_life_find_new_home_decision_confirm: "为了新的开始！"
 spell_of_life_find_new_home_decision_tooltip: "你的生命神咒所联系的影子国度与你的灵魂所属界域不同。"
 spell_of_life_stabilize_new_realm_decision: "稳定[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]"
 spell_of_life_stabilize_new_realm_decision_desc: "与更为成熟的[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]不同，你新建立的[UmbraGlossary('shadow_realm')]缺乏一定的稳定性。复活是一段充满诸多风险的危险旅程。没有审判者，新的不死者可能会被创造出来，并在无人监督的情况下行动。[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]必须得到稳固。"
 spell_of_life_stabilize_new_realm_decision_confirm: "我将拿起木槌。"
 spell_of_life_stabilize_new_realm_decision_tooltip: "专属安息之地"
 spell_of_life_stabilize_new_realm_decision_wraith_friends: "拥有至少5个[GetTrait('wraith').GetName(GetNullCharacter)][friends|E]或其他积极[relations|E]"
 spell_of_life_stabilize_new_realm_decision_faith_followers: "至少有10名[GetFaithByKey('custom_mummy_dynasty').GetName]的追随者。"
 spell_of_life_stabilize_new_realm_decision_effect1: "所有[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]$POD_splat_mummy_plural$在死亡后将不再承受双倍的回忆损失"
 spell_of_life_stabilize_new_realm_decision_effect2: "所有[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]$POD_splat_mummy_plural$都将获得[GetTrait('integrity').GetName(GetNullCharacter)]"
 spell_of_life_preserving_roots_decision: "守护我们的根源"
 spell_of_life_preserving_roots_decision_desc: "[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]建立于某片土地上的某种文化之上，将这些特质融入[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]，并将[UmbraGlossary('shadow_realm')]不可逆转地与那特定的文化记忆绑定。然而，年复一年，曾经辉煌的文明正逐渐被时间的黄沙所掩埋。我们不能允许这种情况发生，因为记忆是让我们保持人性、守护我们新家园的根本。"
 spell_of_life_preserving_roots_decision_confirm: "留在凡人的记忆中"
 spell_of_life_preserving_roots_decision_tooltip: "让我们的心保持鲜活"
 spell_of_life_preserving_roots_decision_custom1: "你的[culture|E]必须至少有 #V 10#! 个伯爵领。"
 spell_of_life_preserving_roots_decision_custom2: "你的[culture|E]中至少要有#V 5#!$POD_splat_mummy$位统治者"
 spell_of_life_preserving_roots_decision_effect1: "[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]$POD_splat_mummy_plural$复活速度快一倍#weak (所需时间从10年缩短至5年)#!"
 spell_of_life_establish_ourselves_decision: "第五王朝"
 spell_of_life_establish_ourselves_decision_desc: "我们重新发现了生命神咒。我们由此创造了一个新的[UmbraGlossary('shadow_realm')]，即[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]。我们基于那神咒，在那个界域中创立了[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]。然而，贤荷鲁、以实玛利、卡比里和阿佩普派视我们不过为僭越之徒，插手一场我们太过年轻而无法理解的游戏。\n\n他们知之甚少。我们将超越那些古老的愚者。我们将证明自己配得上与他们比肩！"
 spell_of_life_establish_ourselves_decision_confirm: "我们是第五王朝！"
 spell_of_life_establish_ourselves_decision_tooltip: "今日之新贵，明日之征服者！"
 spell_of_life_establish_ourselves_decision_custom1: "需至少#V 25#!个[GetFaithByKey('custom_mummy_dynasty').GetName][faith|E]领地"
 spell_of_life_establish_ourselves_decision_custom2: "至少需要有#V 5#!位[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]$POD_splat_mummy$统治者"
 spell_of_life_establish_ourselves_decision_effect1: "所有[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]的$POD_splat_mummy_plural$将获得[GetModifier('custom_mummy_dynasty_secured_future_modifier').GetNameWithTooltip]"
 spell_of_life_joining_the_league_decision: "加入联盟"
 spell_of_life_joining_the_league_decision_desc: "尽管荷鲁斯支持他的事业，但不会原谅你的存在。然而，还有其他选择。\n\n上次他离开一段时间后，其追随者腐败堕落，开始输掉战争。若此类情况再次发生，他们会张开双臂欢迎你，而待荷鲁斯归来时，或许不愿将你驱逐。或许你可以加速这一进程。"
 spell_of_life_joining_the_league_decision_confirm: "感谢您的欢迎"
 spell_of_life_joining_the_league_decision_tooltip: "我们应当考虑加入奥西里斯联盟。"
 spell_of_life_joining_the_league_decision_custom1: "绝不允许有任何[GetTrait('shemsuheru').GetName(GetPlayer)]$POD_splat_mummy_plural$，属于[GetFaithByKey('code_of_horus').GetName][faith|E]，且对你的[opinion|E]低于#V 25#!"
 spell_of_life_joining_the_league_decision_custom1_ex: "$spell_of_life_joining_the_league_decision_custom1$#weak （[example.GetFirstName]）#!"
 spell_of_life_ending_the_hunt_decision: "终结追猎"
 spell_of_life_ending_the_hunt_decision_desc: "太多人觊觎你的头颅、你的知识，或两者兼得。若你能铲除最强大派系的领袖及多数追踪者，便可终结这一对你存在的威胁。你无需再时刻提防身后，等待下一群人追捕你。附带的好处是，这些关键人物的死亡将使其派系陷入混乱，为你巩固权力留下空间。"
 spell_of_life_ending_the_hunt_decision_confirm: "终于和平了……"
 spell_of_life_ending_the_hunt_decision_tooltip: "狩猎终于要结束了吗？"
 spell_of_life_ending_the_hunt_decision_custom1: "绝不能有任何#TOOLTIP:GAME_TRAIT,eternal_rebirth_seeker,[GetNullCharacter] #L 生命神咒追寻者#!#!既不是$POD_splat_mummy_plural$，也不是无意识的，并且不是你的[friend|E]、[best_friend|E]、[coterie|E]成员、[lover|E]或[soulmate|E]。"
 spell_of_life_ending_the_hunt_decision_custom1_ex: "$spell_of_life_ending_the_hunt_decision_custom1$#weak （[example.GetFirstName]）#!"
 spell_of_life_ending_the_hunt_decision_custom2: "你的[prowess|E]必须高于[GetScriptedCharacterByHistoryID('505094').GetFirstName]#weak （#V [GetPlayer.GetProwess]#!对比#V [GetScriptedCharacterByHistoryID('505094').GetProwess]#!）#!"
 spell_of_life_ending_the_hunt_decision_remove_eternally_hunted: "你信仰的所有追随者将不再遭受[GetModifier('hunted_down_eternity_modifier').GetNameWithTooltip]"
 spell_of_life_correcting_your_form_decision: "修正你的形态"
 spell_of_life_correcting_your_form_decision_desc: "你通过一种不完整的永生魔法获得了延长的寿命。随着你对魔法知识的增长，出现了修正自身缺陷形态并改进当前永生之源的可能性。不幸的是，此类魔法仅能让你改善自己的形态，而无法强化他人残缺的身体。"
 spell_of_life_correcting_your_form_decision_confirm: "没有什么能阻挡我"
 spell_of_life_correcting_your_form_decision_tooltip: "你的不朽或许还能再改进些。"
