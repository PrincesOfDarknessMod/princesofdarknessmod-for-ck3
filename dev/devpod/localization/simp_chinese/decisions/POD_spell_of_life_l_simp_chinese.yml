 spell_of_life_stage1_setite_phase3_bonus_xp: "你广泛的实验在生命神咒中获得了#color_white 1.00#!额外被动[trait_level_track_xp|E]#weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 spell_of_life_stage4_warning: "\n\n#warning 你成功的机会低得离谱。如果你在乎你角色的存续，就不要尝试这样做。\n存档读档是徒劳的，伪随机的判定结果现在就已经决定。\n你已经被警告过了。#!"
 spell_of_life_stage4_amenti_decision: "让阿蒙提成为你的家园"
 spell_of_life_stage4_amenti_decision_desc: "创造[Concept('POD_spell_of_life', '生命咒术')|E]的最后一步是将咒术与[UmbraGlossaryLocalized('shadowlands','冥界')]中的某个空间相绑定，让我们的灵魂在那里安息直至重生。虽然其他人可能需要自己开辟空间，但我们与永生第一王朝及其支持者，如刻茉媞里的良好关系提供了一条更简便的途径。如果我们能前往[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]，便可以与奥西里斯们会面，说服他们给予我们在[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]中的居所。\n\n#warning 这最后阶段带有一定风险，玛阿特的审判官只会给你一次陈述理由的机会。#!"
 spell_of_life_stage4_amenti_decision_tooltip: "也许我们可以在[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]找到安身之所。"
 spell_of_life_stage4_amenti_decision_confirm: "打开门！"
 spell_of_life_stage4_amenti_decision_wraith_friends: "至少拥有2名[GetTrait('wraith').GetName(GetNullCharacter)][friends|E]或其他正面的[relations|E]关系"
 spell_of_life_stage4_amenti_decision_control_land: "你[hold|E]至少#Z [SCOPE.ScriptValue('POD_mummy_lands_of_faith_target_percent_value')|0]%#!的[counties|E]位于[GetGeographicalRegion('pod_lands_of_faith').GetName][region|E]（当前：[SCOPE.ScriptValue('POD_mummy_lands_of_faith_percent_value')|0]%）\n"
 spell_of_life_stage4_hades_decision: "扩展并稳固冥界"
 spell_of_life_stage4_hades_decision_desc: "制造[Concept('POD_spell_of_life', '生命神咒')|E]的最后一步，是将神咒与[UmbraGlossaryLocalized('shadowlands','冥界')]中的一片空间绑定，以供我们的灵魂栖居直至重生。在你的协助下，卡比洛斯已同意你使用[UmbraGlossary('hades')]作为我们的[UmbraGlossary('shadow_realm')]。这将免去你为生命神咒开辟独立空间的需要。然而，[UmbraGlossary('hades')]并不像埃及的[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]那样稳定，在死后复活时会产生诸多严重问题。而一旦你开始使用它，随着栖居者数量的增加，这些问题只会愈发加剧。若你期望使用[UmbraGlossary('hades')]，就必须改善这一界域。$spell_of_life_stage4_warning$"
 spell_of_life_stage4_hades_decision_tooltip: "或许我们能在[UmbraGlossary('hades')]中找到归宿"
 spell_of_life_stage4_hades_decision_confirm: "磨利你的剑！"
 spell_of_life_stage4_hades_decision_pomegranate: "你必须拥有[GetPODArtifactName('pomegranate_link')]"
 spell_of_life_stage4_custom_decision: "开辟一个新界域"
 spell_of_life_stage4_custom_decision_desc: "创造[Concept('POD_spell_of_life', '生命神咒')|E]的最后一步，是将咒语绑定到[UmbraGlossaryLocalized('shadowlands','冥界')]中的一个空间，让你的灵魂居住其中，直到其重生。由于你缺乏拥有自己[UmbraGlossary('shadow_realm')]的盟友，你将需要为生命神咒开辟属于自己的空间。这将十分困难，因为[umbra|E]及其所有居民都会反对你。$spell_of_life_stage4_warning$"
 spell_of_life_stage4_custom_decision_tooltip: "也许我们可以开辟一个新的[UmbraGlossary('shadow_realm')]"
 spell_of_life_stage4_custom_decision_confirm: "磨利你的剑！"
 spell_of_life_stage4_custom_decision_wraith_friends: "拥有至少4个[GetTrait('wraith').GetName(GetNullCharacter)][friends|E]或其他积极[relations|E]"
 spell_of_life_stage4_custom_decision_pomegranate: "你必须拥有[GetPODArtifactName('pomegranate_link')]"
 spell_of_life_stage4_success_sol_caveat: "如果你成功，你将获得完整的生命神咒"
