 world_africa_greater_west: "大西非"
 world_africa_greater_east: "大东非"
 world_steppe_north: "北方草原"
 world_steppe_south: "南方草原"
 world_asia_greater_north_east: "大东北亚"
 world_asia_greater_japan: "大日本"
 world_india_south: "南印度"
 world_india_north: "北印度"
 spell_of_life_starter_decision: "寻找[Concept('POD_spell_of_life', '生命咒术')|E]的任务"
 spell_of_life_starter_decision_desc: "许多人都在寻求永生的方式，一种纯粹的不朽形态，没有其他选择所承载的弱点和诅咒。已被证实的一种方法，即生命神咒，被西方的#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L 木乃伊#!#!所使用。虽然这可能是耗费一生的追求，并且你应该准备好牺牲一切，但追寻真正的不朽或许值得一试。\n\n#R 你在此追求中成功的几率极低。如果你关心角色福祉，请不要尝试。\n即使保存并重新加载游戏来碰运气，也无法在日后拯救你。你已得到警告。#!"
 spell_of_life_starter_decision_tooltip: "生命神咒能赐予我们永生，且无任何副作用。"
 spell_of_life_starter_decision_confirm: "好的，我们开始吧。"
 spell_of_life_stage1_unlock_next_phase: "解锁当前路径的下一步"
 spell_of_life_stage1_unlock_next_phase_caveat: "如果你成功的话，$spell_of_life_stage1_unlock_next_phase$"
 spell_of_life_stage1_do_multiple_stages: "#help \n\n虽然更具挑战性，但你会发现完成一条道路能在之后带来额外的奖励。#!"
 spell_of_life_stage1_warning: "\n\n#R 准备好为了追求真正的不朽而牺牲一切，因为这条道路充满危险！#!"
 spell_of_life_stage1_hide_requirement: ""
 spell_of_life_stage1_decision_completion_message_title: "你的理解加深了。"
 spell_of_life_stage1_decision_completion_message_desc: "你已解锁该道路下一个目标。"
 spell_of_life_stage1_horus_phase1_decision: "获得觐见机会"
 spell_of_life_stage1_horus_phase1_decision_desc: "荷鲁斯法典第六条写道：“不要试图创造像我们一样的同类。”要说服他违背这一条几乎不可能。然而，好处是无法估量的，因为他是唯一掌握完整且无瑕的[Concept('POD_spell_of_life', '生命神咒')|E]之人。在我们说服他之前，必须先赢得与他见面的机会。也许一份赐予能派上用场。$spell_of_life_stage1_do_multiple_stages$$spell_of_life_stage1_warning$"
 spell_of_life_stage1_horus_phase1_decision_tooltip: "为了说服荷鲁斯，我们需要争取到与他会面的机会。"
 spell_of_life_stage1_horus_phase1_decision_confirm: "我们赐予你……上埃及！"
 spell_of_life_stage1_horus_phase1_decision_cairo: "你或[GetScriptedCharacterByHistoryID('792593').GetFirstName][completely_control|E][GetTitleByKey('d_cairo').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_delta: "你或[GetScriptedCharacterByHistoryID('792593').GetFirstName][completely_control|E][GetTitleByKey('d_delta').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_alexandria: "你或[GetScriptedCharacterByHistoryID('792593').GetFirstName][completely_control|E][GetTitleByKey('d_alexandria').GetNameNoTier]"
 spell_of_life_stage1_horus_phase2_decision: "一场宏大的辩论"
 spell_of_life_stage1_horus_phase2_decision_desc: "若我们能交好荷鲁斯，凭我们的赐予或先前之效劳，应当足以求得一见。此事不易，但论及[Concept('POD_spell_of_life', '生命神咒')|E]，无人比他更通晓。"
 spell_of_life_stage1_horus_phase2_decision_tooltip: "我们的赐予为我们赢得了觐见的机会。让我们充分利用它。"
 spell_of_life_stage1_horus_phase2_decision_confirm: "前往他的宫廷"
 spell_of_life_stage1_horus_phase3_decision: "证明我们的价值"
 spell_of_life_stage1_horus_phase3_decision_desc: "我们的争辩打动了荷鲁斯，他屈尊赐予我们一个机会，以证明我们是其事业忠诚的盟友。赛特之子与叛徒们必须倒在我们的刀刃之下。唯有如此，荷鲁斯才会助我们寻求生命神咒，尽管他不会将完整的神咒赐予我们。唯有亲自动手取得它，我们才能证明自己配得上使用它。"
 spell_of_life_stage1_horus_phase3_decision_tooltip: "要获得荷鲁斯的智慧，我们必须证明自己值得拥有。"
 spell_of_life_stage1_horus_phase3_decision_confirm: "于是，沙土染成了红色……"
 spell_of_life_stage1_horus_phase3_decision_no_emperor_requirement: "没有#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!或信仰中带有[GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName]或[GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName][doctrine|E]的[faith|E]追随者持有帝国[title|E]"
 spell_of_life_stage1_horus_phase3_bonus_xp: "每当你完成一段[journey|E]时，荷鲁斯的洞察力会赋予#color_white 5.00#!额外的[trait_level_track_xp|E]生命神咒经验#weak （[GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]）#!"
 spell_of_life_stage1_horus_phase3_decision_effect: "随着时间推移，你与他的关系或许能让你进入[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]"
 spell_of_life_stage1_kemintiri_phase1_decision: "恢复遗失的记忆"
 spell_of_life_stage1_kemintiri_phase1_decision_desc: "刻茉媞里曾是伊西斯的女祭司，并持有[Concept('POD_spell_of_life', '生命神咒')|E]，在赛特的#EMP 温和照料#!下，她失去了太多。如果我们能赢得她的信任，并找回她往昔生活的碎片，或许能帮助她恢复那些失去的记忆。$spell_of_life_stage1_do_multiple_stages$$spell_of_life_stage1_warning$"
 spell_of_life_stage1_kemintiri_phase1_decision_tooltip: "刻茉媞里曾知晓生命神咒。或许她还能记得……"
 spell_of_life_stage1_kemintiri_phase1_decision_confirm: "我讲的是时间的开端……"
 spell_of_life_stage1_kemintiri_phase2_decision: "失散多年的朋友"
 spell_of_life_stage1_kemintiri_phase2_decision_desc: "在阅读她协助撰写的文物的过程中，刻茉媞里的记忆中仍有太多空白。然而，她曾提及过去有人试图帮助她，而你也知道，在某些传统中流传着许多关于她过往的故事。如果我们能够联系并赢得这些人的信任，他们或许能够恢复刻茉媞里所失去的一切，包括对[Concept('POD_spell_of_life', '生命神咒')|E]的认识。"
 spell_of_life_stage1_kemintiri_phase2_decision_tooltip: "我们不是第一个尝试帮助生命神咒的人。或许其他人也能派上用场。"
 spell_of_life_stage1_kemintiri_phase2_decision_confirm: "昔日之众多已然消逝，然此物犹存……"
 spell_of_life_stage1_kemintiri_phase2_decision_osiris_requirement: "[GetDynastyHouseByID('house_osiris').GetName][house|E]的一名成员是你的[friend|E]、[best_friend|E]、[coterie|E]成员、[lover|E]或[soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_bubasti_requirement: "一位[GetFaithByKey('bubasti').GetName]信徒是你的[friend|E]、[best_friend|E]、[coterie|E]成员、[lover|E]或[soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_sobek_requirement: "#TOOLTIP:FAITH,children_sobek #L 索贝克之子#!#!#!是你的[friend|E]、[best_friend|E]、[coterie|E]成员、[lover|E]或[soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_silent_strider_requirement: "#TOOLTIP:RELIGION,silentstrider_religion #L 寂静漫游者#!#!#!是你的[friend|E]、[best_friend|E]、[coterie|E]成员、[lover|E]或[soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_khetamon_requirement: "[GetScriptedCharacterByHistoryID('791151').GetFirstName]曾一度接近治愈刻茉媞里的心灵，如今活跃于你的[court|E]中，或是你的[friend|E]、[best_friend|E]、[coterie|E]成员、[lover|E]或[soulmate|E]。"
 spell_of_life_stage1_kemintiri_phase2_decision_effect: "[GetScriptedCharacterByHistoryID('790512').GetFirstName]将学会生命神咒"
 spell_of_life_stage1_kemintiri_phase3_decision: "复仇宜冷"
 spell_of_life_stage1_kemintiri_phase3_decision_desc: "尽管她的大部分记忆已经恢复，并且她记得足够多的[Concept('POD_spell_of_life', '生命神咒')|E]来帮助我们，但凯敏提莉告诉我们，在复仇完成之前，她无法抽出时间教导我们。托尔特和她的整个[house|E]必须被彻底消灭。只有那时，她才会将注意力转向其他事务。"
 spell_of_life_stage1_kemintiri_phase3_decision_tooltip: "刻茉媞里在愿意教导我们之前，必须先完成复仇。"
 spell_of_life_stage1_kemintiri_phase3_decision_confirm: "复仇，然后教训"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed: "[GetDynastyHouseByID('house_tawaret').GetName][house|E]中没有任何吸血鬼成员是[ruler|E]。"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed$#weak （[landed_tawaret_example.GetFirstName]）#!"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living: "[GetDynastyHouseByID('house_tawaret').GetName][house|E]的成员中，存活、活跃且为吸血鬼者不超过5个人。"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living$#weak ([living_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_effect: "随着时间推移，你与她的关系或许能让你进入[UmbraGlossaryLocalized('dark_kingdom_of_sand','阿蒙提')]。"
 spell_of_life_stage1_cabirus_phase1_decision: "阅读卡比洛斯的秘密手稿"
 spell_of_life_stage1_cabirus_phase1_decision_desc: "卡比洛斯的秘密手稿是卡比洛斯原作的完整但翻译拙劣的版本。尽管如此，它们描述了奥西里斯的[Concept('POD_spell_of_life', '生命神咒')|E]的内部运作，如果我们能够接触它们并具备运用其知识的能力，或许能从中获得一些有益的见解。$spell_of_life_stage1_do_multiple_stages$$spell_of_life_stage1_warning$"
 spell_of_life_stage1_cabirus_phase1_decision_alt_desc: "卡比洛斯的秘密手稿曾是一部完整但翻译拙劣的卡比洛斯原著版本。在它们被毁之前，这些著作描述了奥西里斯的[Concept('POD_spell_of_life', '生命神咒')|E]的内在运作机制，并可能提供一些有益的见解，因此荷鲁斯才会促成其毁灭。\n\n尽管原稿已失，残片仍以腐烂的纸莎草纸、受损的魅纸羊皮卷、重写本、陶片上的摘录、倾颓建筑上的铭文、口述记录、法师教科书与经课集、评注以及抄录的辩论等形式存世。若能收集足够多的残片，通过适当的文本批判或许能重建卡比洛斯的秘密手稿。$spell_of_life_stage1_do_multiple_stages$"
 spell_of_life_stage1_cabirus_phase1_decision_tooltip: "如果我们能翻译卡比洛斯的秘密手稿，或许能获得一些见解。"
 spell_of_life_stage1_cabirus_phase1_decision_confirm: "“Does”的意思是“前行”还是“死亡”？"
 spell_of_life_stage1_cabirus_phase1_decision_alt_confirm: "微不足道的知识才是真正无可救药的。"
 spell_of_life_stage1_cabirus_phase1_decision_writing_access: "可以访问[GetPODArtifactName('writings_cabirus_link')]。"
 spell_of_life_stage1_cabirus_phase1_decision_university: "你拥有的一座[counties|E]建有大学[building|E]、[GetBuilding('black_college_01').GetName]、[GetBuilding('library_malta_01').GetName]、[GetBuilding('vienna_chantry_01').GetName]、[GetBuilding('erciyes_01').GetName]或其任一升级版本"
 request_access_writings_cabirus_decision: "请求访问卡比洛斯的秘密手稿"
 request_access_writings_cabirus_decision_desc: "为追求生命神咒研究，我们需要获取卡比洛斯的秘密手稿。幸运的是，我们既可说服其现任持有者，也可利用我们的效应要求查阅权。然而，他们或许会为此类查阅权索取代价。"
 request_access_writings_cabirus_decision_tooltip: "或许我们可以请求访问，而不是偷取它。"
 request_access_writings_cabirus_decision_confirm: "我们来听听价格吧。"
 request_access_writings_cabirus_decision_effect: "获得访问[GetPODArtifactName('writings_cabirus_link')]的权限"
 spell_of_life_stage1_cabirus_phase2_decision: "与卡比洛斯交谈"
 spell_of_life_stage1_cabirus_phase2_decision_desc: "书籍无法与原作者相提并论。如果我们能说服[GetScriptedCharacterByHistoryID('792600').GetFirstName]以迎合他的学术兴趣来帮助我们，我们就能在[Concept('POD_spell_of_life', '生命神咒')|E]方面学到很多。话虽如此，要理解他的教诲，我们还需要更深入地学习魔法。"
 spell_of_life_stage1_cabirus_phase2_decision_tooltip: "书籍难以与原作媲美。"
 spell_of_life_stage1_cabirus_phase2_decision_confirm: "让我们和他谈谈吧。"
 spell_of_life_stage1_cabirus_phase3_decision: "缓解压力"
 spell_of_life_stage1_cabirus_phase3_decision_desc: "附近的睿魔尔在追寻永生的过程中占用了卡比洛斯太多时间，迫使他不断奔波。如果我们削弱其效应，他或许能腾出更多时间来帮助我们，尽管他对荷鲁斯的顾虑仍会阻止他传授完整的生命神咒。"
 spell_of_life_stage1_cabirus_phase3_decision_tooltip: "卡比洛斯承受着来自睿魔尔的巨大压力。"
 spell_of_life_stage1_cabirus_phase3_decision_confirm: "让我们回到课程中来吧。"
 spell_of_life_stage1_cabirus_phase3_decision_no_emperor_requirement: "没有#TOOLTIP:GAME_TRAIT,tremere,[GetNullCharacter] #L 睿魔尔#!#!或信仰[GetReligionByKey('codeoftremere_religion').GetName]的[faith|E]信徒持有帝国[title|E]头衔"
 spell_of_life_stage1_cabirus_phase3_decision_effect: "随着时间推移，你与他之间的关系或许能让你进入[UmbraGlossary('hades')]"
 spell_of_life_stage1_setite_phase1_decision: "重生初步实验"
 spell_of_life_stage1_setite_phase1_decision_desc: "虽然达成永恒重生或许有多种途径，但[Concept('POD_spell_of_life', '生命神咒')|E]已被证实是可行之法。尽管所有他人皆获此赠予，但这并非获得它的唯一途径。正如赛特等前人尝试过的，只要有足够的实验与试验对象，我们或许能自行逆向推导出它。$spell_of_life_stage1_do_multiple_stages$$spell_of_life_stage1_warning$"
 spell_of_life_stage1_setite_phase1_decision_tooltip: "实验将继续进行，直到我的士气提高。"
 spell_of_life_stage1_setite_phase1_decision_confirm: "实验开始吧……"
 spell_of_life_stage1_setite_phase1_decision_bean_nighe_caul: "装备$artifact_bean_nighe_caul_name$"
 spell_of_life_stage1_setite_phase1_decision_mummy_prisoner: "至少要有#color_white 1#!名[prisoner|E]是[GetTrait('mummy').GetName(GetNullCharacter)]的人。"
 spell_of_life_stage1_setite_phase1_decision_sorcery_prisoner: "至少拥有#color_white 5#!名[prisoners|E]，他们#italic 可能#!学习#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#!#weak （[GetTrait('bastet').GetName(GetNullCharacter)]、[GetTrait('mortal').GetName(GetNullCharacter)]或类似凡人的半种族）#!"
 spell_of_life_stage1_setite_phase1_decision_execution_effect: "用于我们实验的所有囚犯都将死亡。"
 spell_of_life_stage1_setite_phase2_decision: "召开议会"
 spell_of_life_stage1_setite_phase2_decision_desc: "追寻[Concept('POD_spell_of_life', '生命神咒')|E]并非易事，需要投入大量精力。若能争取到同僚的支持，我们便能将更多时间与资源倾注于这项事业。即便只是承诺不加干涉，也足以助益。"
 spell_of_life_stage1_setite_phase2_decision_tooltip: "或许我们能寻得助力，或至少避免干扰。"
 spell_of_life_stage1_setite_phase2_decision_confirm: "集结其成员！"
 spell_of_life_stage1_setite_phase2_decision_house_head: "#color_white 你#!是#color_white 你的#![house|E]之首"
 spell_of_life_stage1_setite_phase2_decision_dynasty_members: "你的[dynasty|E]中至少有#color_white 5#!名成员拥有领地"
 spell_of_life_stage1_setite_phase2_decision_faith_members: "你的[faith|E]中至少有#color_white 5#!名信徒拥有领地"
 spell_of_life_stage1_setite_phase2_decision_debate: "若你的[dynasty|E]或[faith|E]成员至少有#color_white 5#!人，你将邀请其参加议会。"
 spell_of_life_stage1_setite_phase3_decision: "转世高级实验"
 spell_of_life_stage1_setite_phase3_decision_desc: "我们离下一阶段的理解越来越近了，非常近。然而，生命神咒的核心仍有些奥秘深不可测。显然，我们需要更多典籍、更多资源，还有更多试验对象。但，代价算不了什么。与永恒相比，几条性命又算得了什么，我的永恒。"
 spell_of_life_stage1_setite_phase3_decision_tooltip: "在足够的尝试和无数可牺牲的生命面前，即使是不可能的事也会变得可行。"
 spell_of_life_stage1_setite_phase3_decision_confirm: "让实验继续吧……"
 spell_of_life_stage1_setite_phase3_decision_mummies_prisoner: "至少拥有#color_white 3#!名[prisoners|E]是$POD_splat_mummy_plural$。"
 spell_of_life_stage1_setite_phase3_decision_sorcerer_prisoner: "至少要有#color_white 3#!名[prisoners|E]，他们必须是[GetTrait('sorcerer').GetName(GetNullCharacter)]或[GetTrait('theurgist').GetName(GetNullCharacter)]。"
 spell_of_life_stage1_setite_phase3_decision_sorcery_prisoner: "至少拥有#color_white 10#!名[prisoners|E]，他们#italic 可能#!学习#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L 术法#!#!#weak （[GetTrait('bastet').GetName(GetNullCharacter)]、[GetTrait('mortal').GetName(GetNullCharacter)]或类似凡人的半种族）#!"
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people: "因禁以下任一人物：#color_white 1#!，即[GetScriptedCharacterByHistoryID('792600').GetFirstName]、[GetScriptedCharacterByHistoryID('792593').GetFirstName]、[GetScriptedCharacterByHistoryID('790512').GetFirstName]、[GetScriptedCharacterByHistoryID('792870').GetFirstName]、[GetScriptedCharacterByHistoryID('792804').GetFirstName]、[GetScriptedCharacterByHistoryID('792605').GetFirstName]、一名[GetTrait('ferryman').GetName(GetNullCharacter)]，或其他知晓部分生命神咒的人物#weak （拥有超过15点[trait_level_track_xp|E]在$trait_track_spell_of_life$[GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)]中）#!。"
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people_no_mummies: "将[GetScriptedCharacterByHistoryID('790512').GetFirstName]、[GetScriptedCharacterByHistoryID('792870').GetFirstName]、一位[GetTrait('ferryman').GetName(GetNullCharacter)]或另一位知晓生命神咒部分内容的角色中的任意#color_white 1#!人监禁#weak （在$trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)]中至少有16点[trait_level_track_xp|E]）#!。"
