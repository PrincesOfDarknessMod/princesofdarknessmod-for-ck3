 spell_of_life_abandon_vampirism_decision.tt.vampgen: "该隐的诅咒试图腐化魔法，却以失败告终。"
 spell_of_life_abandon_vampirism_decision_sh_mode: "必须觉得各种流派的混合很有意思且可行。"
 spell_of_life_abandon_vampirism_decision_crazy: "要么是疯了，要么是恨自己，要么就是个狂热信徒。"
 spell_of_life_abandon_vampirism_decision_religion: "必须信仰一个重视实验或将吸血鬼视为诅咒的宗教"
