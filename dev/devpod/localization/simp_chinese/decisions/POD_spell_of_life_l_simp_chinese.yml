 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner_no_mummies: "将[GetScriptedCharacterByHistoryID('790512').GetFirstName]或任何已知完整生命神咒的角色中的#color_white 1#!人因禁。"
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner: "因禁[GetScriptedCharacterByHistoryID('792870').GetFirstName]、[GetScriptedCharacterByHistoryID('792804').GetFirstName]、[GetScriptedCharacterByHistoryID('792605').GetFirstName]中的任意#color_white 1#!人，一位[GetTrait('ferryman').GetName(GetNullCharacter)]，或另一位知晓完整生命神咒的角色。"
