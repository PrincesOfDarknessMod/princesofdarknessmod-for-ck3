l_simp_chinese:
 POD_inquihunt_interaction:0 "寻找巢穴"
 POD_inquihunt_interaction_desc:0 "你将尝试了解该魔物的确切位置。然后猎魔就开始了。显然，这有严重的风险……"
 I_CAN_ONLY_PLOT_ONE_INQUIHUNT_AT_A_TIME_TRIGGER:0 "同一时间只能计划一次猎魔"
 scheme_interaction_tt_inquihunt_approved:0 "你将尝试了解该魔物的确切位置。然后猎魔就开始了。显然，这有严重的风险……"
 inquihunt:0 "寻找巢穴计谋"
 inquihunt_action:0 "找出"
 inquihunt_interaction:0 "寻找巢穴#weak （计谋）#!"
 inquihunt_desc:0 "我将摧毁[SCHEME.GetTarget.GetShortUINameNoTooltip]，将他们的污秽从这片土地上清除。"
 inquihunt_desc_general:0 "在发动攻击之前，试着找到魔物"
 INQUIHUNT_SUCCESS_DESC:0 "您将对[TARGET_CHARACTER.GetShortUIName]展开最后的攻击。"
 INQUIHUNT_DISCOVERY_DESC:0 "@warning_icon!你的猎巫[crime|E]曝露了"
 inquihunt_my_intrigue:1 "你的谋略能力：$VALUE|=+0$"
 inquihunt_my_rival:1 "你目标的能力：$VALUE|=+0$"
 POD_inquihunt.667.t:0 "在审判中失败"
 POD_inquihunt.667.desc:0 "你的猎物成功逃脱了你的追捕。这可能是受到了其他魔鬼手下的帮助，他们从原在的洞里爬走了，躲开了你。神是有耐心的，你也是。他们无法永远躲过这木桩。"
 POD_inquihunt.667.option.a:0 "这是意料之中的事。"
 POD_inquihunt.1.t:0 "猎魔进行时"
 POD_inquihunt.1.desc:0 "你终于找到了那个魔物的巢穴。没错，因为周围的穷人已经明显地失去了对[ROOT.Char.GetFaith.HighGodName]的爱。他们变得偏执，变成了害怕在夜晚出没的无魂躯壳，甚至教堂也荒芜了。\n你和你的随从显然是这里唯一的希望。在你搭好帐篷后，是时候考虑你的下一步行动了。主已经把你带到了这个邪恶的巢穴，但是如何摧毁它还有待你自己的理解……"
 POD_inquihunt.1.desc.shifter:0 "你终于找到了那个魔物的巢穴。没错，因为周围的猿人都是偏执狂，被妖蛆污染的空壳，害怕在晚上出没。\n在你侦察完地区后，是时候考虑你的下一步行动了。你已经找到了这个邪恶的巢穴，但是如何摧毁它还有待你自己的理解……"
 POD_inquihunt.1.option.a:0 "平民还未迷失在黑暗中。让我们传道。"
 POD_inquihunt.1.option.a.shifter:0 "通过一些演讲，猿人可以被鞭策出对蚂蟥的怒火……"
 POD_inquihunt.1.option.aa.effect.success.desc:0 "大成功将确保你功业的迅速胜利"
 POD_inquihunt.1.option.ab.effect.success.desc:0 "平局……魔物依然会继续制造麻烦"
 POD_inquihunt.1.option.ac.effect.success.desc:0 "不要犯错，否则敌人一定会很快把你消灭。"
 POD_inquihunt.1.option.f:0 "我感到大事不妙。"
 POD_inquihunt.1.option.f.custom:0 "该时间和地点不对，你应改天再来。"
 POD_inquihunt.1.option.b:0 "[ROOT.Char.GetFaith.HighGodName]的士兵们！我们今天要攻破这座城堡！"
 POD_inquihunt.1.option.b.shifter:0 "盖亚的选民们！我们今天要攻破这座城堡！"
 POD_inquihunt.1.option.c:0 "让我们先摧毁它的资产，剪除该魔物的羽翼。"
 POD_inquihunt.1.option.d:0 "他们敬畏[ROOT.Char.GetFaith.HighGodName]的光。让我们在白天行动。"
 POD_inquihunt.1.option.d.shifter:0 "赫利俄斯会帮助我们。让我们在白天行动。"
 POD_inquihunt.1.option.e:0 "我的书里可能有关于这个特别的恶魔的内容……"
 POD_inquihunt.1.option.g:0 "我要亲手杀了你，魔物！"
 POD_inquihunt.2.t:0 "令人满意的火刑"
 POD_inquihunt.2.desc:0 "让这些可怜的灵魂重新皈依[ROOT.Char.GetFaith.HighGodName]比你想象的要容易得多。在黑暗中迷失了这么多年之后，他们渴望倾听和学习。\n一旦这样做了，与他们结盟就更容易了，还能利用他们所知道关于潜伏在夜晚的魔物的一切。就这样，你带着全镇的人冲进了其的巢穴，凭着人数和[ROOT.Char.GetFaith.HighGodName]赐予的光明，轻而易举地就将其遏制住了。\n说了这么多，做了这么多，你现在正享受地看着恶魔被烧死在火刑柱上，全镇的人都在欢呼[ROOT.Char.GetFaith.HighGodName]和你的名字。"
 POD_inquihunt.2.desc.shifter:0 "召集一群人类暴徒比你想象的要容易。他们渴望推翻在他们的亲族身上饕餮的妖蛆眷族。\n一旦这样做了，与他们结盟就更容易了，还能利用他们所知道关于潜伏在夜晚的魔物的一切。就这样，你带着全镇的人冲进了其的巢穴，轻而易举地就将其遏制住了他们。\n说了这么多，做了这么多，你现在正享受地在全镇人的欢呼声中看着恶魔被烧死在火刑柱上！"
 POD_inquihunt.2.option.a:0 "这样的景象让我心里暖暖的"
 POD_inquihunt.3.t:0 "子对父"
 POD_inquihunt.3.t.shifter:0 "不服管教的暴民"
 POD_inquihunt.3.desc:0 "魔物的魔爪似乎已经深入了这个村庄。你的讲道聚集了大量的追随者，但也有少量的叛乱者，他们现在在恶魔的巢穴门口对抗你的神圣队伍。\n很明显，他们已经被魔鬼腐蚀了，但是你没有时间去拯救他们的灵魂，因为吸血鬼一旦听到外面的骚动肯定会逃跑。不过，还有另一个选择，更快，但在道德上更有问题……"
 POD_inquihunt.3.desc.shifter:0 "魔物的魔爪似乎已经深入了这个村庄。你的煽动聚集了大量的追随者，但也有少量的叛乱者，他们现在在活尸的巢穴门口对抗你的神圣队伍。\n很明显，他们已经被妖蛆腐蚀了，但你不能拖延，因为吸血鬼一旦听到外面的骚动肯定会逃跑。不过，还有另一个选择，更快，但在道德上更有问题……"
 POD_inquihunt.3.option.a:0 "把他们都杀了，让天主来处理"
 POD_inquihunt.3.option.b:0 "没有无辜者会受到伤害，即使是误入歧途的无辜者"
 POD_inquihunt.4.t:0 "讽刺性的焚烧"
 POD_inquihunt.4.desc:0 "你严重低估了这位魔物对这个村庄的影响力。你的说教遭到了怀疑，甚至是彻底的暴动。当你发现真相的时候已经太晚了：他们一直都是吸血鬼的血奴。\n你的随从在睡觉的时候被杀了，而你被毫不客气地送到了你为魔物准备的火刑架上。当火焰开始吞噬你时，你回忆起[ROOT.Char.GetFaith.HighGodName]是仁慈的。因此，愿祂宽恕你的失败，以及这些误入歧途的无辜者的灵魂。"
 POD_inquihunt.4.desc.shifter:0 "你严重低估了魔物对这座村庄的影响力。你的煽动遭到了怀疑，甚至是彻底的怒火。当你发现他们一直都处于吸血鬼控制之下的真相时已经太晚了。\n你的支持者们在睡梦中被杀，而你则被毫不客气地抬到了你打算用来对付魔物的木桩前。当火焰开始吞噬你时，你希望你在下辈子能成为更好的盖亚战士。"
 POD_inquihunt.4.option.a:0 "阿门"
 POD_inquihunt.5.t:0 "完美的计划"
 POD_inquihunt.5.desc:0 "骄傲是一种原罪，但你必须承认：这是一次完美的袭击，由你在指挥下的勇敢的[ROOT.Char.GetFaith.HighGodName]之骑士熟练地执行。尽管有无数的血奴保卫着这个地区，甚至还有更多的陷阱，你还是设法以几乎没有损失的方式最终攻占了这个地方。\n很明显，你是在光天化日之下进攻的，你必须把功劳归于[ROOT.Char.GetFaith.HighGodName]的光，因为它让魔物在大战中沉睡着。占领城堡后，斩下沉睡中的吸血鬼头的那一刻让人感觉虎头蛇尾，但仍然很满足。胜利又是属于你的。"
 POD_inquihunt.5.desc.shifter:0 "这是一次完美的袭击，由你在指挥下的部队熟练地执行。尽管有无数的血奴保卫着这个地区，甚至还有更多的陷阱，你还是设法以几乎没有损失的方式最终攻占了这个地方。\n很明显，你是在光天化日之下进攻的，你必须把功劳归于赫利俄斯的光，因为它让魔物在大战中沉睡着。占领城堡后，斩下沉睡中的吸血鬼头的那一刻让人感觉虎头蛇尾，但仍然很满足。胜利又是属于你的。"
 POD_inquihunt.5.option.a:0 "我喜欢计划能够被达成。"
 POD_inquihunt.6.t:0 "皮洛士式的胜利？"
 POD_inquihunt.6.desc:0 "城堡里的战斗还在继续，你知道胜利就在你的掌握之中。但这样的代价值得吗？它的守军早就以逸待劳，无数的陷阱已经夺去了[ROOT.Char.GetFaith.HighGodName]的好士兵的生命。一只死去的魔物相对这些可怜的灵魂就够了吗？\n现在还不晚，你可能还可以取消今天的攻击，但吸血鬼会利用夜晚的掩护逃跑。或者你继续前进，永远背负着因此崇高的功业因而牺牲的善人的重担。"
 POD_inquihunt.6.desc.shifter:0 "城堡里的战斗还在继续，你知道胜利就在你的掌握之中。但这样的代价值得吗？它的守军早就以逸待劳，无数的陷阱已经夺去了盖亚战士的生命。一只死去的魔物相对这些可怜的亲族就够了吗？\n现在还不晚，你可能还可以取消今天的攻击，但吸血鬼会利用夜晚的掩护逃跑。或者你继续前进，永远背负着因此崇高的功业因而牺牲的追随者的重担。"
 POD_inquihunt.6.option.a:0 "天主会在祂的国度欢迎他们。"
 POD_inquihunt.6.option.b:0 "这不值得"
 POD_inquihunt.7.t:0 "最终决战"
 POD_inquihunt.7.desc:0 "这一切非常糟糕。城堡早就准备好了，你连围墙都打不破。更糟糕的是，对方的援军正从附近的城镇赶来，显然也被城堡的黑魔王的血奴所控制。魔物本身离我们那么近，却又那么远。\n你和你勇敢的骑士们已经无处可逃了，看来今天就是[ROOT.Char.GetFaith.HighGodName]把你们召回他的国度的日子。你希望能配得上祂的慈悲，但在那之前……你将尽可能多的消灭这些恶魔。"
 POD_inquihunt.7.desc.shifter:0 "这一切非常糟糕。城堡早就准备好了，你连围墙都打不破。更糟糕的是，对方的援军正从附近的城镇赶来，显然也被城堡的黑魔王的血奴所控制。魔物本身离我们那么近，却又那么远。\n你和你勇敢的战士们已经无处可逃了。你将尽可能多的消灭这些妖蛆眷族。"
 POD_inquihunt.7.option.a:0 "牺牲之日"
 POD_inquihunt.8.t:0 "焚烧资产"
 POD_inquihunt.8.desc:0 "你的突击进行得有条不紊。你针对了魔物掌握的每一个公会，民兵或者密教团体。你用了两件强大的武器：诱惑贪婪者的金钱和恐吓腐败者的教廷声名。\n就这样，你的行动孤立了吸血鬼，疏远了其的盟友，驱散了其的血奴。你现在看到魔物最后的藏身处在你眼前燃烧，里面生物的惨叫声像音乐一样传入你的耳朵。"
 POD_inquihunt.8.desc.shifter:0 "你的突击进行得有条不紊。你针对了魔物掌握的每一个公会，民兵或者密教团体。你用了两件强大的武器：诱惑贪婪者的金钱和恐吓腐败者的报复宣言。\n就这样，你的行动孤立了吸血鬼，疏远了其的盟友，驱散了其的血奴。你现在看到魔物最后的藏身处在你眼前燃烧，里面生物的惨叫声像音乐一样传入你的耳朵。"
 POD_inquihunt.8.option.a:0 "你被解雇了"
 POD_inquihunt.9.t:0 "唯利是图的雇佣军"
 POD_inquihunt.9.desc:0 "该邪恶的生物在这个地区的影响力比你最初想象的要大。但你一直坚忍着，现在你很确定其的大部分资产已经被你的行为摧毁了。\n可惜吸血鬼似乎不会轻易倒下，因为一支强大的雇佣军正在向你的阵地上行军，显然是被你的敌人雇佣来消灭你的。你有一个选择：雇佣兵喜欢金钱，你可以在他们的雇主逃跑之前让他们与之对抗。或者你可以减少你的损失，接受这次的平局。"
 POD_inquihunt.9.option.a:0 "我会向像你这样虔诚的人提供金子和救恩"
 POD_inquihunt.9.option.a.shifter:0 "只要价格合适，有些人就会与怪物战斗。"
 POD_inquihunt.9.option.b:0 "下次我一定能抓到它。"
 POD_inquihunt.10.t:0 "换位"
 POD_inquihunt.10.desc:0 "你算错了。你的行动每一步都遭到反击。这个吸血鬼拥有更多的金钱，更多的手下，对这个社区的影响力比你想象的要大。\n现在，一切都崩溃了，毫不夸张地说，在你最后一次的错误把你的位置暴露给魔物之后。一群冷酷的“雇佣兵”迅速出现，只有你忠实的骑士在保护着你，不久你就被包围在自己的基地。当最后的战斗声音在外面消失的时候，你现在可以听到从窗外扔进的火把的声音。庆幸的是，你还有时间念最后的主祷文。"
 POD_inquihunt.10.desc.shifter:0 "你算错了。你的行动每一步都遭到反击。这个吸血鬼拥有更多的金钱，更多的手下，对这个社区的影响力比你想象的要大。\n现在，一切都崩溃了，毫不夸张地说，在你最后一次的错误把你的位置暴露给魔物之后。一群冷酷的“雇佣兵”迅速出现，只有你忠实的亲族在保护着你，不久你就被包围在自己的基地。当最后的战斗声音在外面消失的时候，你现在可以听到从窗外扔进的火把的声音。看来一切都完了。"
 POD_inquihunt.10.option.a:0 "我们在天的父……"
 POD_inquihunt.10.option.a.shifter:0 "大饕嘲笑我的败北。"
 POD_inquihunt.11.t:0 "我的敌人的敌人……"
 POD_inquihunt.11.desc:0 "你知道关于吸血鬼的一件事那就是他们之间大多是相互敌对的。而你已经成为了利用这一事实来为自己获益的专家。\n把这座巢穴的一些线索留给了已知的邻近的魔鬼巢穴，然后你只是坐视你的目标在夜里被其对手雇佣的一些暴徒袭击。其赢了，但被削弱到足以让你的骑士们轻松制服其。你很快就在你的私人刑讯室里给其整了个新家。然后你和其一起度过了很有深刻见解的日子，直到让其失血过多而真正地死去。[ROOT.Char.GetFaith.HighGodName]的旨意已经完成。"
 POD_inquihunt.11.desc.shifter:0 "你知道关于吸血鬼的一件事那就是他们之间大多是相互敌对的。而你已经成为了利用这一事实来为自己获益的专家。\n把这座巢穴的一些线索留给了已知的邻近的魔鬼巢穴，然后你只是坐视你的目标在夜里被其对手雇佣的一些暴徒袭击。其赢了，但被削弱到足以让你的战士们轻松制服其。"
 POD_inquihunt.11.option.a:0 "他们在圣遗物面前发出的尖叫声非常有趣……"
 POD_inquihunt.11.option.a.shifter:0 "摧毁蚂蟥带来很多荣耀。"
 POD_inquihunt.12.t:0 "弩与匕首"
 POD_inquihunt.12.t.shifter:0 "掠食者与猎物"
 POD_inquihunt.12.desc:0 "该魔物的狡猾给你留下了深刻印象。一旦被你成功编织了阴谋网，大多数目标都很容易就会被击倒，但这一位……这一位回击了。有力的。\n你的网受到了攻击，恶意的谣言反了过来针对你。你知道你可以继续幕后战争，但是它会让你花费很多来修复敌人造成的伤害。但再多推进一点也许就能让你高兴地把这只吸血鬼带到你最好的刑讯室里……决定了么，快决定把。"
 POD_inquihunt.12.desc.shifter:0 "该魔物的狡猾给你留下了深刻印象。一旦被你成功编织了阴谋网，大多数目标都很容易就会被击倒，但这一位……这一位回击了。有力的。\n你的网受到了攻击，恶意的谣言反了过来针对你。你知道你可以继续幕后战争，但是它会让你花费很多来修复敌人造成的伤害。但再多推进一点也许就能让你击败这只吸血鬼。决定么，决定吧。"
 POD_inquihunt.12.option.a:0 "声望并不是一切。"
 POD_inquihunt.12.option.b:0 "这么做不值得。"
 POD_inquihunt.13.t:0 "寻找更好的自己"
 POD_inquihunt.13.desc:0 "你根本没机会。你的每一个行动都被预料到了，你的每一个行动都被轻易的反击回来。你只是个在举棋不定的孩子，不晓得下棋的规则。而该吸血鬼可能发明了该棋。\n即使你明白了自己所处的危险，也为时已晚。所以，你现在每晚都被你愚蠢地想要摧毁的那个人折磨着。即使在这个领域，其知道的也比你多……"
 POD_inquihunt.13.option.a:0 "长夜黑暗，处处险恶"
 POD_inquihunt.14.t:0 "了解敌人。"
 POD_inquihunt.14.desc:0 "你很高兴地看到你在你的书中找到了一些关于那个特别的魔物的旧事。你更高兴地知道了其对一个还活着的凡人家庭的特殊感情。好像这些生物还能感觉到凡人的感情似的！\n好吧，没关系，这是一个很容易利用的信息。通过使用这些凡人作为诱饵，你成功地引诱吸血鬼进入一个精心设计的圣地陷阱。这个特别的魔物在进入该区域后立即化为灰烬，你很快就把这个观察记录在你的日志中。"
 POD_inquihunt.14.option.a:0 "这对下一个可能有用"
 POD_inquihunt.15.t:0 "禁忌之书"
 POD_inquihunt.15.desc:0 "该魔物很是难以捉摸。其已经避开了你精心策划的两个陷阱，你开始失去一些阵地，例如你的几个手下已经失踪。\n但还有一种可能性，鉴于它的……“神秘”性质，你直到现在才会选择使用它。罗马教廷肯定不会同意这样的选择，但也许这个吸血鬼的死比你的名声更有价值？"
 POD_inquihunt.15.desc.shifter:0 "该魔物很是难以捉摸。其已经避开了你精心策划的两个陷阱，你开始失去一些阵地，例如你的几个手下已经失踪。\n但还有一种可能性，鉴于它的……“神秘”性质，你直到现在才会选择使用它。一位危险的灵联系了你，表示愿意提供“帮助”。"
 POD_inquihunt.15.option.a:0 "[ROOT.Char.GetFaith.HighGodName]最终会原谅我的……"
 POD_inquihunt.15.option.a.desc:0 "无论代价如何，我都会付。"
 POD_inquihunt.15.option.b:0 "这是一条我不会跨过的底线。"
 POD_inquihunt.16.t:0 "当你注视深渊……"
 POD_inquihunt.16.desc:0 "你根本不知道它是什么时候开始的。你在一本旧书里找到了关于吸血鬼的一条线索，然后又一条……然后你开始阅读。当一些你不记得雇佣过的手下给你带来新书时，情况就更糟了。\n你已经在你的工作中迷失了很长一段时间，你已经挖得很深，可能太深了。至少，教廷是这么认为的，正如你的一位骑士在“异端”宣证中所说的那样。所以，你又一次站在燃烧的火刑柱边，但这次不是在公众中……"
 POD_inquihunt.16.desc.shifter:0 "你根本不知道它是什么时候开始的。你在一本旧书里找到了关于吸血鬼的一条线索，然后又一条……然后你开始阅读。当一些你不记得雇佣过的手下给你带来新书时，情况就更糟了。\n你已经在你的工作中迷失了很长一段时间，你已经挖得很深，可能太深了。然后诸灵带着一个危险的提议来找你。这过于危险，把你带入了陷阱，导致你的死亡。"
 POD_inquihunt.16.option.a:0 "我离真理如此之近！如此之近！"
 POD_inquihunt.17.t:0 "神圣之怒"
 POD_inquihunt.17.t.shifter:0 "盖亚之怒"
 POD_inquihunt.17.desc:0 "其没想到会遭遇正面攻击。在找到其的安身之处之前，你已经冲破了大量毫无准备的吸血鬼血奴。虽然你在白天进攻，但战斗的喧嚣唤醒了等待你的魔物。\n你得承认，其表现得很出色，哪怕因在白天而行动迟缓，可是总而言之，在其在这场战斗中还没有真正弄清方向之前，你就很容易把其的脑袋砍掉了。[ROOT.Char.GetFaith.HighGodName]的美丽大地上又少了一只吸血鬼。"
 POD_inquihunt.17.desc.shifter:0 "其没想到会遭遇正面攻击。在找到其的安身之处之前，你已经冲破了大量毫无准备的吸血鬼血奴。虽然你在白天进攻，但战斗的喧嚣唤醒了等待你的魔物。\n你得承认，其表现得很出色，哪怕因在白天而行动迟缓，可是总而言之，在其在这场战斗中还没有真正弄清方向之前，你就很容易把其的脑袋砍掉了。少了一只寄生在盖亚上的妖蛆蚂蟥。"
 POD_inquihunt.17.option.a:0 "那么，谁是下一个？"
 POD_inquihunt.18.t:0 "一个可敬的对手"
 POD_inquihunt.18.desc:0 "该目标很难。尽管轻而易举地打发了大部分守卫，并且在白天进行攻击，该魔物仍然是一位可怕的敌人。感谢[ROOT.Char.GetFaith.HighGodName]的光，你相信你会赢，但这是一个缓慢而艰苦的过程。\n更糟糕的是，这场漫长的战斗给了吸血鬼的其他血奴时间来介入。你也许能一起打败他们，但你不可能在这样的战斗中毫发无损……"
 POD_inquihunt.18.option.a:0 "我一定会赢，不惜一切代价。"
 POD_inquihunt.18.option.b:0 "我一定要保住自己，以备将来之战。"
 POD_inquihunt.19.t:0 "逃跑"
 POD_inquihunt.19.desc:0 "就这样结束了。尽管魔物在白天受到攻击，但它比你更壮、更快、更坚强。你在对抗中很早就得出了这个结论，且你无法越过它。\n现在，只剩让其呆上足够长的时间，好让你的部队撤退，并再活一天，你很确定这会被达成。已经是最后一击，吸血鬼正准备终结你。但你比其更安心，因为[ROOT.Char.GetFaith.HighGodName]正在另一边等候你。"
 POD_inquihunt.19.desc.shifter:0 "就这样结束了。尽管魔物在白天受到攻击，但它比你更壮、更快、更坚强。你在对抗中很早就得出了这个结论，且你无法越过它。\n现在，只剩让其呆上足够长的时间，好让你的部队撤退，并再活一天，你很确定这会被达成。已经是最后一击，吸血鬼正准备终结你。下辈子做更好吧。"
 POD_inquihunt.19.option.a:0 "光明永远不会真正地消逝"
