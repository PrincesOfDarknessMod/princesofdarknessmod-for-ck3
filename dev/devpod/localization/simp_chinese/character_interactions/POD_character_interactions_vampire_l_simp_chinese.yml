 POD_awaketorpor.667.t:0 "失去线索"
 POD_awaketorpor.667.desc:0 "也许你的猎物已经苏醒，或者你的方向一直都是错误的。不管怎样，你已经失去了对那个[torpid|E]吸血鬼的踪迹，如果你还想找到他，就必须从头开始。"
 POD_awaketorpor.667.option.a:0 "这是意料之中的事！"
 POD_awaketorpor.1.t:0 "问题与答案"
 POD_awaketorpor.1.desc:0 "你找到了一条关于你要找的休眠着的吸血鬼的位置的重要线索。遗憾的是，线索只能把你带到这里，一个没人愿意和你交流的小村庄。\n也许他们是被你的猎物所奴役？这很难说，但实际上你不可能在这片区域徘徊太久，所以你必须说服他们回答你的问题。"
 POD_awaketorpor.1.option.a:0 "你在这！回答我！"
 POD_awaketorpor.1.option.aa.effect.success.desc:0 "大成功将是你的计划不带麻烦的推进。"
 POD_awaketorpor.1.option.ab.effect.success.desc:0 "你可能会在这个过程中失去一些东西……"
 POD_awaketorpor.1.option.ac.effect.success.desc:0 "你失去了线索……"
 POD_awaketorpor.1.option.b:0 "这算不上一个麻烦。"
 POD_awaketorpor.1.option.b.custom:0 "你在这里结束你的旅程，留下长眠的吸血鬼继续蛰伏。"
 POD_awaketorpor.1.success:0 "有钱能使鬼推磨"
 POD_awaketorpor.2.t:0 "迷宫"
 POD_awaketorpor.2.desc:0 "显然，这是一个迷宫。你的目标建造或借用了一堆地下洞穴，现在躲在那里。而且你猜对了，这里到处都是陷阱。\n你可以试着在迷宫中找到猎物，但在这个过程中你很可能会受伤。"
 POD_awaketorpor.2.option.a:0 "一步一步来……"
 POD_awaketorpor.2.success:0 "哎哟！别打头！"
 POD_awaketorpor.3.t:0 "血奴"
 POD_awaketorpor.3.desc:0 "你找到你的目标了……但你也发现了一整支雇佣军在保护这个地方，显然是因吸血鬼的仆从们操纵的复杂计谋所收买的。很明显，你有自己的军队，但雇佣兵已经盘根在此，他们正期待着麻烦。\n选择权在你手中，如果你继续前进，你需要在他们把[torpid|E]的吸血鬼转移到其他地方之前迅速取胜。如果你不想冒险，你也可以取消计划。"
 POD_awaketorpor.3.option.a:0 "冲锋！"
 POD_awaketorpor.3.option.b:0 "这算不上一个麻烦"
 POD_awaketorpor.3.success:0 "零乱的胜利"
 POD_awaketorpor.10.t:0 "抉择"
 POD_awaketorpor.10.desc:0 "通往你的目标的所有障碍都被移除。现在，你必须坚强起来面对你的猎物，因为刚苏醒的吸血鬼的态度并不会好。\n在还在休眠的怪物等着你的时候，你必须先选择你的目标。"
 POD_awaketorpor.10.option.a:0 "我想唤醒并招募他"
 POD_awaketorpor.10.option.b:0 "又一条可吞噬的灵魂！"
 POD_awaketorpor.11.t:0 "回家"
 POD_awaketorpor.11.desc:0 "你跟丢了目标的踪迹，回到宫廷时，也没带回多少东西。显然，这是一个艰难的时刻，因为你的对手已经在背后窃笑你了。\n你将如何处理这种情况？"
 POD_awaketorpor.11.option.a:0 "筹集资金以平息动乱"
 POD_awaketorpor.11.option.b:0 "他们终究会闭嘴的"
 POD_awaketorpor.12.t:0 "梦语"
 POD_awaketorpor.12.desc:0 "你已经找到了你的猎物，并使用了一位“自愿”的献血者来帮助洗去年长之倦。虽然你显然在整个过程中都躲得远远的，但这并不会太麻烦。\n现在，你的目标已经完全清醒，并且正在仔细倾听你所提供的东西。你必须保证其的赞同并将其带回你的宫廷。最好想清楚你接下来要说什么……"
 POD_awaketorpor.12.option.a:0 "你不会拒绝我的提议"
 POD_awaketorpor.12.option.aa.effect.success.desc:0 "你的目标加入了你的宫廷！"
 POD_awaketorpor.12.option.ab.effect.success.desc:0 "你得跪求，虽然的确有用"
 POD_awaketorpor.12.option.ac.effect.success.desc:0 "被断然拒绝，你独自离开"
 POD_awaketorpor.12.option.b.custom:0 "你在这里结束你的旅程，留下长眠的吸血鬼继续蛰伏。"
 POD_awaketorpor.12.success:0 "欢迎！"
 POD_awaketorpor.12.successb:0 "……欢迎！"
 POD_awaketorpor.12.successc:0 "徒劳一场……"
 POD_awaketorpor.13.t:0 "看守"
 POD_awaketorpor.13.desc:0 "你与你的猎物之间只剩下一个障碍了，一个守卫着休眠的吸血鬼的强悍战士。其可能是位[ghoul|E]，但其看起来训练有素，你还怀疑附近有其他人埋伏着。\n这空间太小了，无法用军队发动进攻，而且你现在不能回去，否则其会转移其主人的身体。所以这是一场你明显处于劣势的战斗，但你可以感觉到猎物的血液在附近脉动，呼唤着你……"
 POD_awaketorpor.13.option.a:0 "我会杀了你，然后吃了你的主人！"
 POD_awaketorpor.13.option.aa.effect.success.desc:0 "完全胜利！"
 POD_awaketorpor.13.option.ab.effect.success.desc:0 "那很难……"
 POD_awaketorpor.13.option.ac.effect.success.desc:0 "等等！使用火箭是作弊行为！"
 POD_awaketorpor.13.success:0 "……就差那么点了"
 POD_awaketorpor.14.t:0 "战利品"
 POD_awaketorpor.14.desc:0 "最后，你的目标毫无防备的沉眠在你面前。你几乎因为期待而颤抖，这在你的状态下显然是不可能的。当你露出尖牙，准备吞噬你为之奋斗的灵魂时，时间似乎都静止不动了。\n你的心兽很满意，你离开这里时，你会比你来时更强壮……但也许也更非人了。"
 POD_awaketorpor.14.option.a:0 "进食时间！"
