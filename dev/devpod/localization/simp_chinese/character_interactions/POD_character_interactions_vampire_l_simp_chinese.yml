 POD_malkavian_madness_network_borrow_skill_desc:0 "从疯网中挑出看似随机的想法来增强你的能力。"
 POD_malkavian_madness_network_borrow_skill_ct:0 "选择的能力将会得到疯网的奇怪知识的强化……它到底来自哪里？"
