 POD_maatkare_interaction_desc:0 "帮助这个被误导的[cainite|E]了解关于赛特之荣耀的真相。"
 POD_ventrue_succor_interaction:0 "应当的救助"
 POD_ventrue_succor_interaction_desc:0 "梵卓[Clan|E]遵守着互相救助的伦理——当一位梵卓处于危难时，其他梵卓都有义务帮助其。当然，凡事都有代价。"
