 POD_malkavian_madness_network_divine:0 "疯网：天启"
 POD_malkavian_madness_network_divine_desc:0 "利用你的末卡维同胞们提供的信息，并聆听黑暗的低语……让你的小小计谋得以接近目标。"
 POD_malkavian_madness_network_divine_ct:0 "每有一位末卡维在[recipient.GetFirstName]的宫廷，[recipient.GetHerHis]的计谋防御就会被削弱一些。"
 POD_malkavian_madness_network_backlash:0 "进入疯网会耗费你的心智和灵魂……禁忌的知识可以摧毁你，也可以帮助你。"
 NO_MALKAVIANS:0 "必须至少要有一位末卡维在目标的宫廷。"
