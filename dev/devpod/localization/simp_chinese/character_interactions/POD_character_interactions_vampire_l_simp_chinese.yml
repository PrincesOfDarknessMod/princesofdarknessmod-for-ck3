 POD_cappadocian_send_advisor_interaction:0 "送为顾问"
 POD_cappadocian_send_advisor_interaction_desc:0 "除了他们的学术追求之外，卡帕多西亚还因担任国王和亲王的顾问而闻名。知道这一点，你可以把你的孩子送到另一个统治者的朝廷里去，来收获一些好处。"
 POD_cappadocian_send_advisor_interaction_ct:0 "你的子嗣将被送给[recipient.GetFirstName]，在宫廷内担任顾问或内阁成员。如果做出了成果，你将会得到外地统治者的感激，你的子嗣甚至可能学到一些东西。然而，如果你的孩子一事无成，你可以预料到后果。"
