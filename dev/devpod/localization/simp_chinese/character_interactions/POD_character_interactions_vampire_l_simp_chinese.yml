 POD_mentoring_disciplines.0001.option.bardo:0 "否定心兽"
 POD_mentoring_disciplines.242.t:0 "魔法在于学习"
 POD_mentoring_disciplines.242.desc:0 "术法，法师们称之为“线性魔法”，或更轻蔑的称之“民间魔法”或民间巫术”，是非法师使用的魔法形式。与真正的魔法不同，使用术法不需要觉醒（或启蒙）。因此，任何拥有足够才能的人都可以成为术士，并使用民间魔法的诸线性道途。因此，术法是世界上最常见的魔法形式。与灵能相比，术法不是与生俱来的能力，必须通过学习才能掌握。\n慢慢地学，痛苦地学。\n你的导师埋头向你推荐你必须购买的书籍，显然，要掌握这门神秘的艺术，所有书籍都是必需的。除了钻研，别无选择。"
 POD_mentoring_disciplines.243.t:0 "学习是魔法"
 POD_mentoring_disciplines.243.desc:0 "你已经获得了钻研术法所需的书籍，你相信在掌握基础知识的道路上不会再有真正的障碍。新的力量唾手可得！……只是还有很多书要看。\n你很快就注意到，其中一些参考了其他更古老的术法典籍。你现在所拥有的可能足够你当学徒了，但你也可以多花点心思去学习这些。这可能是学习一些古老的、很可能已被遗忘的知识的好方法。"
 POD_mentoring_disciplines.243.a:0 "把那些文章找出来！"
 POD_mentoring_disciplines.243.b:0 "拒绝。更多。书籍。"
 POD_mentoring_disciplines.244.t:0 "信仰之魔法"
 POD_mentoring_disciplines.244.desc:0 "神通术与民间魔法（又称术法）相似，但该灵迹的迷信和仪轨遵循基督教会的习惯用语。神通术师经常引用大天使拉结尔的名字，他是“秘密之守护者”和“神秘之天使”，据说他站在上帝宝座的附近，将宇宙的所有秘密都记录在一本书中。\n作为一种高度法典化的习俗，只有勤奋学习才能掌握其基本要领。不过，你很快就会发现，其中的基督教色彩相当浓厚，如果你对这一宗教不甚了解，就很难取得进展。"
 POD_mentoring_disciplines.244.a:0 "圣经中一定有这方面的线索。"
 theurgy_mentoring_tt:0 "你越有罪（对于基督徒而言），进展所需的代价就越多。"
 POD_mentoring_disciplines.245.t:0 "共享福音"
 POD_mentoring_disciplines.245.desc:0 "经过努力，你已经掌握了神通术的基础知识，你也注意到神通术实际上比基督教还要古老得多。它的根源可以追溯到犹太神秘主义和密传基督教的教义——提升人的灵性，与更高的自我、内在的上帝对话，从而更好地揣摩上帝的智慧——听到、看到并说出肉耳、胶眼和泥舌无法说出的奥秘。\n这让你对各种信仰之间的相互联系以及它们所具有的许多共同理念有了全新的认识。"
 POD_mentoring_disciplines.245.a:0 "神性是多方面的。"
 POD_mentoring_disciplines.245.b:0 "这并不能改变事实！"
 POD_mentoring_disciplines.246.t:0 "见鬼"
 POD_mentoring_disciplines.246.desc:0 "哀恸是一个人将自己的灵魂投射到死者界域的方法。哀恸与人物的性格无关，而与他们的精神状态有关。与那些不相信鬼魂或从未与死亡擦肩而过的人相比，那些有过多次濒死经历或有勇气或目标感的人更有可能将自己的灵魂投射出去。\n由于它与一个人的核心属性密切相关，因此是一个很难传授的概念。往往需要进行多次尝试，而这些尝试本身就可能是痛苦的经历。"
 POD_mentoring_disciplines.246.a:0 "让我们开始吧……"
 POD_mentoring_disciplines.246.b:0 "我放弃！"
 lament_mentoring_tt:0 "你成功地投射出自己的灵体。"
 lament_mentoring_tt2:0 "不走运。你很快就可以再试一次。"
 POD_mentoring_disciplines.247.t:0 "魂牵梦萦"
 POD_mentoring_disciplines.247.desc:0 "你已经成功地通过灵体穿越到了死者界域，正式成为了一名哀恸。实现这一壮举的方法有很多种，包括撇取者、通过冥想或颜料等药物强行灵魂出窍的沉睡者、被冰冻至死的人，他们会被踢出自己的身体直到复活，以及介于两者之间的所有方法。\n如果你能再多花些心思，准确地找出自己喜欢的投射方法，就能在发展这项新才能的过程中占得先机。"
 POD_mentoring_disciplines.247.a:0 "更多测试……"
 POD_mentoring_disciplines.247.b:0 "够惊悚了，谢谢。"
 POD_mentoring_disciplines.248.t:0 "没有汤匙"
 POD_mentoring_disciplines.248.desc:0 "灵能者是指能够通过超感官感知隐藏在世俗感知之外的力量的人，他们可以用意念操纵这些超自然元素。有些人认为他们所操纵的力量与术士一样，只是依靠意念而非繁复的仪式。灵能往往不可靠且善变，很多人都对灵能者避之唯恐不及。\n有些人天生就有异于常人的天赋或才能，从而发现了心灵感应、念力和千里眼等超自然特殊功能。因此，第一步是测试自己是否拥有这种潜在才能，或者是否需要采取更复杂的措施。"
 POD_mentoring_disciplines.248.a:0 "打开我的心智……"
 psychic_mentoring_tt:0 "你有天赋！"
 psychic_mentoring_tt2:0 "不走运。必须考虑另一种方案。"
 POD_mentoring_disciplines.249.t:0 "开启心智之门"
 POD_mentoring_disciplines.249.desc:0 "遗憾的是，你似乎没有灵能天赋。不过，你并没有无计可施，因为有一些方法可以强行觉醒你的心灵……可怕而痛苦的方法。如果你走这条路，你将不得不忍受数次痛苦的心灵入侵。\n另一种方法是“冲击”你的大脑，让它迅速觉醒。这是一个既诱人又不那么复杂的解决方案，但这样做之后可能会产生一些副作用……"
 POD_mentoring_disciplines.249.a:0 "慢而稳……"
 POD_mentoring_disciplines.249.b:0 "……我跑的更快！"
 POD_mentoring_disciplines.250.t:0 "禁忌知识"
 POD_mentoring_disciplines.250.desc:0 "恶魔学是一门了解恶魔的科学，从恶魔的起源到恶魔的力量范畴与真名长度。因此，严格来说，它并不是崇魔，崇魔是指召唤、束缚或以其他方式与恶魔为伍的行为。但老实说，这两者之间的界限非常细，大多数人都分不清楚。\n你可以采取慢慢来的方法，从各处购买古书和文物，按自己的节奏学习。或者，你也可以走一条更轻松的路，试着从恶魔学的源头打听……"
 POD_mentoring_disciplines.250.a:0 "一切都可以在书中找到。"
 POD_mentoring_disciplines.250.b:0 "只是一点无害的召唤……"
 POD_mentoring_disciplines.251.t:0 "可怕真相"
 POD_mentoring_disciplines.251.desc:0 "你对恶魔学的探索让你了解了许多关于恶魔和世界起源的知识。它还让你看到了一些看似不祥的真相，比如上帝将他的目光从地球上移开，让地球慢慢陷入疯狂和绝望。摆在你面前的画面至少可以说是暗淡无光的，挑战着你之前看待世界的方式。\n要继续走这条道途，需要一颗钢铁般的心。"
 POD_mentoring_disciplines.251.a:0 "谣言罢了……对吧？"
 POD_mentoring_disciplines.251.b:0 "末日将临！"
