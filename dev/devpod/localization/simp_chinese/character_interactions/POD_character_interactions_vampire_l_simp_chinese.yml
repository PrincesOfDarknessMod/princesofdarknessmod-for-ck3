 awaketorpor_desc:0 "我将找到[SCHEME.GetTarget.GetShortUINameNoTooltip]所在并随后在我觉得合适的时候对付他"
 awaketorpor_desc_general:0 "尝试找到该[torpid|E]的吸血鬼的藏匿处"
