 POD_create_coterie_interaction_effect: "#V [actor.GetFirstNameNoTooltip]#!将成为一个新[GetPlayer.Custom('PODCoterie')]的创始人。"
 POD_create_coterie_interaction_effect2: "你将能选择它的名称。"
 POD_invite_to_coterie_interaction: "邀请至[GetPlayer.Custom('PODGetCoterieName')]"
