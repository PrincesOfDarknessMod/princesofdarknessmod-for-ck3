 POD_invite_to_coterie_interaction_effect: "[recipient.GetShortUIName]将成为你[GetPlayer.Custom('PODCoterie')]的成员。"
 POD_at_coterie_size_cap: "你的[GetPlayer.Custom('PODCoterie')]已经有[EmptyScope.ScriptValue('coterie_max_size')]位成员"
 POD_coterie_requirement_same_realm: "[recipient.GetShortUIName]必须与你在同一[realm|E]或与你结婚"
