 POD_invite_to_coterie_interaction_rivalry: "#help [GetPlayer.Custom('PODCoterie')]的成员资格被视为一种承诺。你以后可以将[recipient.GetShortUIName]踢出，但如果这样做，[recipient.GetSheHe]将成为你的[rival|E]。#!"
 POD_invite_to_coterie_multiplayer_interaction: "$POD_invite_to_coterie_interaction$"
 POD_invite_to_coterie_interaction_mortal_cultist: "你无法邀请非教徒$POD_splat_mortal_plural$为你的[GetPlayer.Custom('PODCoterie')]"