l_simp_chinese:
 POD_inspiration_interaction:0 "鼓舞"
 POD_inspiration_interaction_desc:0 "作为该战群的阿尔法，你有责任展示你的力量，以激励你的追随者。"
 inspiration_modifier:0 "鼓舞"
 inspiration_modifier_desc:0 "随着你的阿尔法在旁，你的战斗力得到了增强。"
 pack_tactics_modifier:0 "狼群战术"
 pack_tactics_modifier_desc:0 "在外人眼里，你们的队伍行动如一。"
 strength_will_modifier:0 "意志之力"
 strength_will_modifier_desc:0 "一股不可阻挡的力量，一个团结在一起的战群，他们只有一个目的：消灭敌人。"
 POD_primal_song_interaction:0 "原始之歌"
 POD_primal_song_interaction_desc:0 "你将从你会的歌曲中选择一首，你将根据选择获得各种加成。"
 POD_werewolves_interactions.1.t:0 "原始之歌"
 POD_werewolves_interactions.1.desc:0 "凸月狼是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。\n作为篝火旁的说书者，凸月狼自古以来代代相传的故事和歌曲。今天会演哪一个呢？"
 POD_werewolves_interactions.1.option.a:0 "一首关于部族团结的歌曲。"
 primal_song_modifier:0 "团结之歌"
 primal_song_modifier_desc:0 "像古代的英雄一样，我们必须同舟共济！"
 POD_werewolves_interactions.1.option.b:0 "复述古代胜利的故事。"
 song_heroes_modifier:0 "英雄之歌"
 song_heroes_modifier_desc:0 "在我们祖先的胜利，甚至是失败中，都可以找到智慧。"
 POD_werewolves_interactions.1.option.c:0 "关于血与战斗的故事。"
 song_rage_modifier:0 "魂怒之歌"
 song_rage_modifier_desc:0 "我们首先是战士，必须永远记住我们的战斗精神。"
 POD_werewolves_interactions.1.option.d:0 "关于团结与勇气的故事。"
 song_siren_modifier:0 "塞壬之歌"
 song_siren_modifier_desc:0 "通过遵从召唤，我们变得更加强大。"
 POD_wereshapeshift:0 "化形"
 POD_wereshapeshift_interaction:0 "化形"
