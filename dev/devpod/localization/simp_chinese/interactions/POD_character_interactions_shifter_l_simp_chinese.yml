 POD_dagger_of_the_mind_interaction:0 "播种情绪"
 POD_werewolves_interactions.15.t:0 "火之洗礼"
 POD_werewolves_interactions.15.desc:0 "大多数部族试图在孩子出生后一个月内检测所生的所有兽嫡孩子，看他们是否有“共同的血统”。让他们在对应月兆下，在仪式火堆旁接受“洗礼”。这种洗礼最常见的是将灰烬与几滴狼族的血混合在一起；然后将混合物触及孩子的耳朵、鼻子、眼睑和舌头。"
 POD_werewolves_interactions.15.option.a:0 "我的子嗣是否具有狼血？"
 POD_werewolves_interactions.15.a.sucess:0 "已受洗"
