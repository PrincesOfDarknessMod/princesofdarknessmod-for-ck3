 POD_ebon_binding_interaction:0 "乌黑约束"
 POD_ebon_binding_interaction_desc:0 "给[recipient.GetFirstName]绑定适当的惩罚。当[recipient.GetFirstName]想沉迷于被禁止的行为时，[recipient.GetSheHe]将遭受禁忌的痛苦。"
