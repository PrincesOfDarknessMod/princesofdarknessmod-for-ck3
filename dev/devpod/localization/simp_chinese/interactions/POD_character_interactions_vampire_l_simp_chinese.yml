 POD_mentoring_disciplines.254.t: "炉与石"
 POD_mentoring_disciplines.254.desc: "在许多方面，石变术是一种专注于土石的特殊变形术。从与之互动到变得像它一样坚韧，一切都以坚固的岩石为起点和终点。你的导师对你所在地区石制建筑的缺乏颇有微词，并敦促你看看这种重要材料如何被用来建造最伟大的建筑奇迹。\n对大多数吸血鬼来说，石变术是一个陌生的概念，要真正理解它，你必须先了解将一块普通的岩石转变为最强大的城堡的过程。"
 POD_mentoring_disciplines.254.a: "我一直想成为一名泥瓦匠。也许吧。"
 POD_mentoring_disciplines.254.b: "我想，是时候开一个新的采石场了。"
 POD_mentoring_disciplines.255.t: "不要眨眼"
 POD_mentoring_disciplines.255.desc: "石像鬼通常能够自然地掌握石变术，利用其强大的效果在数周甚至数月内完全静止不动。对于大多数其他吸血鬼来说，这并不容易，而你的导师现在想要评判你实现这一壮举的能力……听起来非常无聊。\n察觉到你对这个想法的不情愿，你的导师威胁要拿走你一直随身携带的用来进行石变术实验的石头。这并不是你听过的最可怕的威胁，但你非常喜欢这块石头！"
 POD_mentoring_disciplines.255.a: "你真混账，但你赢了。"
 POD_mentoring_disciplines.255.b: "没有我的宠物石头，我也能活。"
