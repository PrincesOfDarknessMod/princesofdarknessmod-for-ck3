 POD_mentoring_disciplines.258.t: "不祥之兆"
 POD_mentoring_disciplines.258.desc: "午夜时分，你来到导师指定的地点。\n\n眼前是一条石板小径，通向一座丝绸装饰的祭坛，坛上摆放着盛满鲜血的华丽铜盆。\n\n未见导师踪影，唯见盆前字条：\n\n#italic \"以血覆面，吾当示汝应见之物。\"#!"
 POD_mentoring_disciplines.258.a: "你依言而行。"
 POD_mentoring_disciplines.259.t: "噩梦具现"
 POD_mentoring_disciplines.259.beast.desc: "片刻间似乎无事发生……\n但你感觉到了，你的#beast 心兽#!在催促，不，是#beast 命令#!你饮下盆中之血。"
 POD_mentoring_disciplines.259.nobeast.desc: "片刻间似乎无事发生……\n但你感觉到，你的#beast 心兽#!带着#beast 复仇之火#!归来，它催促，不，是#beast 命令#!你饮下盆中之血。"
 POD_mentoring_disciplines.259.desc: "你无法抗拒，猛地扑向那碗鲜红的液体。\n\n令你恐惧的是，那血……竟然从你身边退缩了。它从碗中流淌而出，渗入泥土。\n\n你哀叹着血液渗入地底，发现自己瘫倒在地，徒劳地试图找到哪怕一滴。\n\n此刻你感受到信仰的千钧重压，所有#beast 错误#!与#beast 罪孽#!的将你彻底压垮。\n\n你可能拥有的所有力量都荡然无存，你感到一根木桩刺入你的心脏：一个吸血鬼猎人无声地笼罩在你上方。\n\n[recipient.GetSheHe|U]紧握着一支熊熊燃烧的火把，你的心兽在你体内无力地扭动着，竭力想要逃离火焰。\n\n心兽帮不了你。\n\n太阳开始升起。\n\n一瞬间你感到困惑，这怎么可能？你以为离日出还有好几个小时。\n\n一瞬间你似乎看到猎人笑了；\n\n那一瞬间，延伸成令人痛苦的永恒。\n\n你导师的獠牙刺入你的脖颈。\n\n于是时#color:{0.61,0.6,0.56,0.975} 光#!#color:{0.61,0.6,0.56,0.95} 凝#!#!#color:{0.61,0.6,0.56,0.925} 固#!#color:{0.61,0.6,0.56,0.9} ，#!#color:{0.61,0.6,0.56,0.875} 万#!#color:{0.61,0.6,0.56,0.85} 物#!#color:{0.61,0.6,0.56,0.825} 随#!#!#color:{0.61,0.6,0.56,0.8} 世#!#!#color:{0.61,0.6,0.56,0.775} 界#!#color:{0.61,0.6,0.56,0.75} 一#!#!#color:{0.61,0.6,0.56,0.725} 同#!#color:{0.61,0.6,0.56,0.7} 褪#!#!#color:{0.61,0.6,0.56,0.675} 色#!#color:{0.61,0.6,0.56,0.65} 为#!#!#color:{0.61,0.6,0.56,0.625} 永#!#color:{0.61,0.6,0.56,0.6} 夜#!#!#color:{0.61,0.6,0.56,0.575} 。#!"
