 absalon_svantevit_weakest_desc: "你对那些原始教徒在那座神殿里做什么一无所知"
 absalon_svantevit_weak: "对仪式的微弱了解"
 absalon_svantevit_weak_desc: "它仍然主要是一堆胡言乱语的符文之类等，但你正在取得进展。"
 absalon_svantevit_medium: "对仪式的中度了解"
 absalon_svantevit_medium_desc: "原来这就是这部分的意思！"
 absalon_svantevit_strong: "对仪式的强烈了解"
 absalon_svantevit_strong_desc: "你现在如此之近，这么近……"
 absalon_svantevit_reborn: "斯凡特维德再世"
 absalon_svantevit_reborn_desc: "战神又于夜间中行走了！……即使这对他可怜的宿主来说压力很大。"
 POD_trial_by_war_interaction: "战争审判"
 POD_trial_by_war_interaction_desc: "是时候教这个人这里谁才是真正的军督了。"
 POD_etrius_abuse_interaction: "睿魔尔政治"
 POD_etrius_abuse_interaction_desc: "作为睿魔尔本人的心腹，是时候使用你在[Clan|E]内的力量了。"
 POD_maatkare_interaction: "引诱"
 POD_maatkare_interaction_desc: "帮助这个被误导的[cainite|E]了解关于赛特之荣耀的真相。"
 POD_ventrue_succor_interaction: "应当的救助"
 POD_ventrue_succor_interaction_desc: "梵卓[Clan|E]遵守着互相救助的伦理——当一位梵卓处于危难时，其他梵卓都有义务帮助其。当然，凡事都有代价。"
 POD_malkavian_madness_network_divine: "疯网：天启"
 POD_malkavian_madness_network_divine_desc: "利用你的末卡维同胞们提供的信息，并聆听黑暗的低语……让你的小小计谋得以接近目标。"
 POD_malkavian_madness_network_divine_ct: "每有一位末卡维在[recipient.GetFirstNamePossessive]的宫廷，[recipient.GetHerHis]的密谋就会被削弱一些。"
