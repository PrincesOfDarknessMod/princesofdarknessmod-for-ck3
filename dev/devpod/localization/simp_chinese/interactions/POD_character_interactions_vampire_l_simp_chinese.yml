 POD_mummification_ritual_perk_interaction_desc: "使[recipient.GetFirstName]进入[torpor|E]。"
 POD_mentoring_disciplines.252.t: "静如岩石"
 POD_mentoring_disciplines.252.desc: "中阴术是一种奇怪的[discipline|E]。它的基础是否定心兽对吸血鬼的控制。中阴术最初是由埃及神灵奥西里斯传授给他的追随者的，需要深入的自我冥想才能理解它的概念。\n你的导师只能告诉你核心理念，并提供几种达到这种内心平静状态的方法，除此之外帮不了你什么。剩下的就靠你自己了，希望你的性格不会对静坐数小时的想法产生敌意……"
 POD_mentoring_disciplines.252.a: "深呼吸……"
 POD_mentoring_disciplines.253.t: "如水"
 POD_mentoring_disciplines.253.desc: "事实证明，你的冥想已经成功地“集中了你的内在精神”，你的导师也是这么说的。然而，在未来的日子里，你并不总能一直保持专注，因此你必须学会即使是在更复杂的情况下也能使用中阴术。\n这就是为什么你现在要在山顶练习一些古老的武术，你有点不确定这练习是否真的有用，但又不想让对每个姿势和动作都发表意见的突然非常严格的导师感到不快。"
 POD_mentoring_disciplines.253.a: "人人都爱功夫……"
