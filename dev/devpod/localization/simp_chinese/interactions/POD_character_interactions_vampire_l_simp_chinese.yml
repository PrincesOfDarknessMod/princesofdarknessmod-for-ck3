 confused_populace_modifier: "迷茫民众"
 confused_populace_modifier_desc: "这里的民众已经业余地吸血鬼血律施展所迷惑。"
 POD_mentoring_disciplines.10.t: "心智之力"
 POD_mentoring_disciplines.10.desc: "支配术就是用你的意志力来对付别人，迫使他们听从你的命令。随着你的学习，你将不得不开始在实际的对象上练习，以测试你的进展。凡人将是一个简单且相对不重要的选择，但你需要支配很多人，才能真正学到一些东西，因为他们的意志力是偏弱的。或者你也可以在你的一个封臣身上测试你新发现的力量，尽管他们可能不喜欢被用作这种侵入性力量的测试对象。"
 POD_mentoring_disciplines.10.a: "我正知道一个合适的人选！"
 POD_mentoring_disciplines.10.b: "周围到处都是可用的凡人。"
 POD_mentoring_disciplines.11.t: "心智把戏"
 POD_mentoring_disciplines.11.desc: "你很有信心，你对支配术的理解足以让你现在就使用它，但你的导师坚持不这么认为。他们说，你仍然需要自己成为支配术的目标，才能真正理解其效果。\n你对这种说法相当怀疑，因为这似乎是一种扰乱你心智的不正当手段。你可以简单地拒绝其的要求，享受你的新力量，但这将引起其的怀疑，或其的愤怒。"
 POD_mentoring_disciplines.11.a: "既然你说是安全的……"
 POD_mentoring_disciplines.11.b: "谢啦，但还是免了。"
 POD_mentoring_disciplines.20.t: "毛茸茸的朋友和敌人"
 POD_mentoring_disciplines.20.desc: "要学习兽性术，你必须与动物互动。这并出乎意料，但你仍然要做出选择。你可以响应荒野的呼唤，在有潜在威胁的目标身上尝试你新发现的力量。或者你可以简单地用一大堆驯化的动物充斥你的宫廷，让你自己更轻松。\n不过第二种选择可能会引起争议，因为不是每个人都喜欢在前往欢会​之前，要在一群猫和狗中开路。"
 POD_mentoring_disciplines.20.a: "蛇？真的吗？"
 POD_mentoring_disciplines.20.b: "比我的廷臣们更有包容性。"
 POD_mentoring_disciplines.21.t: "狂野一面"
 POD_mentoring_disciplines.21.desc: "你的兽性术导师坚持让你适当地接触你内心的野兽，通过使用你新发现的力量，采用动物的形态一段时间。你并不特别喜欢这个主意，因为作为黑夜的统治者，你要遵守一些礼仪标准。另一个选择是将自己隔离一段时间，以结束你的训练，这至少不太可能让你完全暴露。"
 POD_mentoring_disciplines.21.a: "我没有什么要藏着掖着的！"
 POD_mentoring_disciplines.21.b: "我只是需要一个人静一静。"
 court_tutor_mentoring_disc_tt: "拥有一个具有高称职度的宫廷教师减少了教导的威望花费。"
 POD_mentoring_disciplines.30.t: "神秘呼吁"
 POD_mentoring_disciplines.30.desc: "学习观占术意味着你必须用一种你以前没有真正考虑过的“第六感”来进行杂耍。微动作有了更深的意义，甚至谈话中的讨好也能显示出巨大的真相。\n因此，你已经开始放慢自己的脚步，更多地思考你的每一个行为和话语。这在某种程度上使你在宫廷上显得有些冷漠，你可能希望纠正这一点。但神秘感有其自身的吸引力。"
 POD_mentoring_disciplines.30.a: "我看到了更多。"
 POD_mentoring_disciplines.30.b: "我需要集中精神。"
 POD_mentoring_disciplines.31.t: "看到太多"
 POD_mentoring_disciplines.31.desc: "观占术是一门复杂的血律，为无数的可能性打开了大门，从简单的间谍活动到探索不可见的世界。这种奇妙而又可怕的可能性对最强壮的头脑来说也是一种压力。\n虽然最困难的部分现在已经过去了，但你仍然受到一些头痛和突然“闪回”所引起的危机的困扰。幸运的是，你的导师仍然在那里，并随着时间的推移帮助你控制你新发现的力量。"
 POD_mentoring_disciplines.31.a: "我很高兴你在我身边。"
 POD_mentoring_disciplines.40.t: "闪避！"
 POD_mentoring_disciplines.40.desc: "迅捷术是一门用于，额，动得快，做得快的血律。训练这技能有多种方法，你主要考虑的是比赛和其他体能锻炼，但似乎你的导师有其他计划。其现在正以几乎无法掩饰的喜悦向你扔东西，同时告诉你要躲避。\n值得称赞的是，你实际上至少有躲避一些东西。"
 POD_mentoring_disciplines.40.a: "这一点都不好笑！"
 POD_mentoring_disciplines.41.t: "跑，吸血鬼，跑！"
 POD_mentoring_disciplines.41.desc: "在大多数情况下，迅捷术是一种令人振奋的力量，因为只要在你的城市里快速奔跑，就能获得巨大的力量感。但它也会让你在一段时间内有些晕眩和迷失方向，因为你必须重新适应正常生活的缓慢爬行。你的导师建议你控制自己的节奏，但这并不像听起来那么容易。"
 POD_mentoring_disciplines.41.a: "一定要快！"
 POD_mentoring_disciplines.41.b: "一定要更快！"
 POD_mentoring_disciplines.50.t: "潜伏在周围"
 POD_mentoring_disciplines.50.desc: "混淆术是一种将自己和他人隐藏起来的能力。那么很明显，为了正确地训练它，你必须把用其他试图看到你的吸血鬼进行测试。凡人不行，因为他们的视力太差，无论如何都看不到任何东西，所以你将不得不承担一些风险。\n这可能会产生意想不到的效果，即在宫廷上传播关于你究竟“为什么”要学习这样一种不正当的工具的讨厌谣言……"
 POD_mentoring_disciplines.50.a: "我不是在监视你，我保证。"
 POD_mentoring_disciplines.51.t: "威胁无处不在"
 POD_mentoring_disciplines.51.desc: "你新发现的混淆术知识使你能更多地了解你的廷臣，因为你现在可以不露痕迹地监视他们。可悲的是，你对他们的了解主要是你不能相信任何人，因为他们中的大多数人都在策划一些琐碎的计谋或其他。你发现自己比往常更多地关注自己的背后，现在担心他们都是来背刺你的。\n实事求是地说，他们可能就是在。"
 POD_mentoring_disciplines.51.a: "叛徒，无处不在！"
 POD_mentoring_disciplines.51.b: "我必须保持冷静"
 POD_mentoring_disciplines.51.c: "嘛，他们是可信赖的。"
 POD_mentoring_disciplines.51.d: "我早就知道！"
 POD_mentoring_disciplines.60.t: "拳击袋"
 POD_mentoring_disciplines.60.desc: "蛮力术，作为用蛮力殴打东西的力量，可能是最容易训练的血律。只用殴打。\n它也可能是最令人振奋的，因为只是偶尔放纵一下，就能证明这对一个黑夜统治者经常感到沮丧的心智是相当有利的。因此，你可以尽情地殴打更大的东西，而不用担心明夜的问题。"
 POD_mentoring_disciplines.60.a: "我们不需要那堵墙！一拳打爆！"
 POD_mentoring_disciplines.61.t: "拳击外交"
 POD_mentoring_disciplines.61.desc: "由于蛮力术的存在，你新发现的力量给了你一个关于如何解决问题的歪曲的观点，那就是狠狠地殴打它们。可悲的是，用蛮力来解决所有问题是有限度的，而你已经开始碰到了这个问题。你将很快不得不回到日常阴谋、宫廷阴谋和无聊的外交活动中，而不是像拆迁队一样到处冲。"
 POD_mentoring_disciplines.61.a: "再来一点！"
 POD_mentoring_disciplines.61.b: "是时候回到现实世界了。"
 POD_mentoring_disciplines.70.t: "众人所爱"
 POD_mentoring_disciplines.70.desc: "威仪术是一种令人陶醉的能力。谁不喜欢有能力让每个人都爱上你，甚至直接崇拜你？你的导师说了一些警告，告诉你在你失去与受害者的直接联系后的后果，但你并不关心。最后，你的所有臣民都表现出了他们很久以前就应该有的适当的奉献精神！"
 POD_mentoring_disciplines.70.a: "我的伟大终于得到了认可。"
 POD_mentoring_disciplines.71.t: "爱的余韵"
 POD_mentoring_disciplines.71.desc: "你现在已经完成了对威仪术血律的学习，其中包括更加注意它的弊端。虽然被尊重和爱的能力肯定是非常强大的，但在你与受害者失去联系后，它不会持续很久，这最终会留下一个非常恼火的人。没有人喜欢自己的感情被超自然的力量玩弄。\n在过去的数晚，你也许有点太频繁使用你的新力量了，在这个过程中赢得了一些新的敌人。现在可能是时候为你过度的学习热情，过度到其他人的思想中去而做出补偿了。"
 POD_mentoring_disciplines.71.a: "我只是想让你们都喜欢我！"
 POD_mentoring_disciplines.71.b: "他们会熬过去的。"
 POD_mentoring_disciplines.80.t: "找到自我"
 POD_mentoring_disciplines.80.desc: "变形术是以各种方式改变自己的能力，并以一定的限制塑造自己的外在形象。虽然强大，但这使得它成为一门棘手的学问，因为你已经相当习惯于你的身体形态了。像你这样的不死族永远不会真正改变，能够突然转变你身体的某些部分，使你在情感上的困扰比你最初想象的要多。"
 POD_mentoring_disciplines.80.a: "这真正意味着什么？"
 POD_mentoring_disciplines.81.t: "不公平的优势"
 POD_mentoring_disciplines.81.desc: "当你掌握了变形术血律后，你发现它拥有很大的武术潜力。突然从你的手中长出爪子肯定能扭转战局，你发现自己越来越依赖这种战术。你的导师建议你谨慎行事，因为如果你不能在战斗中使用变形术，或者你的对手对它有所准备，这种优势就会成为你的败笔。\n但也许其只是嫉妒你学得这么好？"
 POD_mentoring_disciplines.81.a: "我很好！就这样！"
 POD_mentoring_disciplines.81.b: "一个明智的劝告。"
 POD_mentoring_disciplines.90.t: "恐怖之上"
 POD_mentoring_disciplines.90.desc: "易变术是该隐之子最可怕的能力之一，主要是因为它的应用常常导致参与的“实验对象”死亡。不过反正凡人很多，所以你认为在学习这些能力时，你可以很容易地在一些凡人上做实验，获得一些实际经验。另一方面，一位明智的亲王知道，其地区的凡人社区的福祉本身就是一种资产，所以确保不要在同一时间从它身上拿走太多也是有好处的。"
 POD_mentoring_disciplines.90.a: "我现在就把我需要的东西都拿走。"
 POD_mentoring_disciplines.90.b: "我将在一个较长的时期内进行实验。"
 POD_mentoring_disciplines.91.t: "内在恐怖"
 POD_mentoring_disciplines.91.desc: "你现在有足够的能力使用易变术，在没有导师的帮助下，你可以更自如地使用它。但是，你仍然无法摆脱这样一种感觉：自从你学会了这种新的力量，你就有些不对劲。这很难描述，但它几乎就像别人穿着你的皮肤，有时试图控制你。\n这可能只是你的想象力在作怪，但你还是很担心，考虑自己多调查一下这个问题。"
 POD_mentoring_disciplines.91.a: "不必担心。肯定的。"
 POD_mentoring_disciplines.91.b: "为什么我感觉如此……陌生？"
 POD_mentoring_disciplines.100.t: "用功看书"
 POD_mentoring_disciplines.100.desc: "对吸血鬼来说，血术法是一门奇特的血律，因为它不像所有其他血律那样是“天生”的。相反，它是一种非常像仪式的修习，有许多原料需要购买，秘方需要遵循。试图理解这样复杂的血律，就得为试验和错误付出昂贵的努力，一个不争的事实。\n是时候阅读书籍并尽可能地做好准备，以真正掌握你的不洁之血的力量。"
 POD_mentoring_disciplines.100.a: "第一卷。第一章。第一页……"
 learning_mentoring_tt: "你的学识越高，花费就越低。"
 POD_mentoring_disciplines.101.t: "夜间阅读"
 POD_mentoring_disciplines.101.desc: "你已经掌握了足够的血术法基本概念，可以真正理解这门血律的深度。它的成就是没有限制的，因为全世界都在以惊人的速度发现利用血的力量的新方法。一个人永远不可能真正希望掌握如此广泛的力量……但这肯定不会阻止许多人的尝试。\n被这些新发现所吸引，你发现自己越来越多地与你的宫廷隔绝，你的顾问们担心这可能会妨碍你实际统治能力。"
 POD_mentoring_disciplines.101.a: "我想，又回到了老样子……"
 POD_mentoring_disciplines.101.b: "还有这么多东西可学！"
 POD_mentoring_disciplines.110.t: "皮肉伤罢了"
 POD_mentoring_disciplines.110.desc: "坚韧术是一种使吸血鬼能够承受通常会轻易杀死凡人的伤口的血律。要学会正确地理解它，最好的方法是简单地被狠狠地殴打，直到你能忽略这些殴打。你对你的导师的意图有些怀疑，但他们已经开始殴打你了，几乎没有掩饰其的欢喜。\n很明显，这一切最终都是为了你的利益。"
 POD_mentoring_disciplines.110.a: "我可以忍受更多！"
 POD_mentoring_disciplines.111.t: "无敌？"
 POD_mentoring_disciplines.111.desc: "经过几天的紧张训练，你现在已经熟练掌握了坚韧术，对自己的能力有足够的信心，只要有时间就能掌握它。也许实际上是太自信了，因为众所周知，坚韧术会给使用者带来一种无懈可击的感觉（大多是虚假的）。有许多关于过度自信的坚韧术使用者达到了他们的极限，而事后却没有时间去后悔的故事。这是你的导师警告你的最后一件事，毕竟过度自信是一种缓慢而阴险的谋杀。"
 POD_mentoring_disciplines.111.a: "我必须保持谦虚。"
 POD_mentoring_disciplines.111.b: "真正的不死，终于！"
 POD_mentoring_disciplines.120.t: "被假象所包围"
 POD_mentoring_disciplines.120.desc: "你很容易就理解了虚幻术这门血律。制作小型幻象并不是一件非常困难的事情，你的导师正在帮助协调你的训练。\n然而，有些东西在你的脑海中纠缠不清。如果理解这个如此简单，谁能说它没有被你的敌人广泛使用？什么是真的，什么是假的？\n在发现这种新能力后的头几个晚上，你被一种狂热的自己做所有事情的想法所打动，因为你自己的观察确实是你唯一可以信任的。"
 POD_mentoring_disciplines.120.a: "只有我知道真实！"
 POD_mentoring_disciplines.121.t: "真实与虚幻"
 POD_mentoring_disciplines.121.desc: "虽然你的虚幻术训练进展顺利，你现在可以自己做了，但你的导师对你越来越多的偏执感到担忧，你认为你的敌人有可能用这战术来对付你。其正试图向你传授虚幻术的局限性，确保你明白这种规模的幻惑几乎是不现实的。\n你听了他们的话，正在考虑放慢你的事必躬亲的努力，但你仍然不完全相信。"
 POD_mentoring_disciplines.121.a: "也许这个建议有可取之处。"
 POD_mentoring_disciplines.121.b: "又一个谎言！"
 POD_mentoring_disciplines.130.t: "不再独自在黑暗中"
 POD_mentoring_disciplines.130.desc: "从表面上看，幽暗术似乎是一门相对简单的血律，只是把影子作为工具或武器。然而你的导师很快就推翻了这个想法，你明白这实际上是在使用一个叫做“深渊”的神秘界域的能量。而有时深渊会对你的入侵进行反击。\n你进入这个可怕的新领域的第一步是困难的，因为很明显，这深渊里住着各种危险的生物，对你闯入它们的家园感到非常不高兴。仿佛黑暗本身希望你灭亡……或者加入它们。"
 POD_mentoring_disciplines.130.a: "我不怕黑！"
 POD_mentoring_disciplines.130.b: "我需要一支蜡烛……"
 mentoring_slowed_tt: "你的教导将比平时进展得慢。"
 POD_mentoring_disciplines.131.t: "接纳黑暗"
 POD_mentoring_disciplines.131.desc: "你已经迈出了你进入深渊的第一步，并设法鼓起勇气为自己的目的使用它，完成了你对幽暗术血律的第一次实践。现在你对它更加熟悉了，你不能否认这个奇怪的黑暗界域正以某种方式把你拉回来，这是许多勒森魃都知道的感觉。\n即使现在你的训练已经完成，你仍然渴望回到它那里学习更多，即使那里潜伏着各种危险。"
 POD_mentoring_disciplines.131.a: "我们毕竟是黑暗之子。"
 POD_mentoring_disciplines.131.b: "说实话，我有点害怕。"
 POD_mentoring_disciplines.140.t: "阴暗本性"
 POD_mentoring_disciplines.140.desc: "崇魔术是一门与魔邪有很大关系的血律。虽然它没有直接要求你与恶魔订立契约，但你就像站在非常接近悬崖的边缘。试图理解它已经开始改变你的本性。你发现自己变得更加冷酷无情，比平时更容易陷入尖酸刻薄或纯粹残酷。\n你可以有意识地努力修正这种变化，或者直接拥抱这个新的你。"
 POD_mentoring_disciplines.140.a: "我比这更好。"
 POD_mentoring_disciplines.140.b: "他们都是傻瓜！"
 POD_mentoring_disciplines.141.t: "阴暗思想"
 POD_mentoring_disciplines.141.desc: "你已经完成了崇魔术的早期训练，你已经想要更多。这门血律所暗示的力量是令人上瘾的，并诱使你拥抱你的黑暗本性，以解开它所有的秘密。接受这样的改变可能会导致你统治你的领域的方式出现一些复杂的问题，但是，有时候，快速而简单的答案是最诱人的。"
 POD_mentoring_disciplines.141.a: "这些傻瓜不会让我慢下来的！"
 POD_mentoring_disciplines.141.b: "我需要独处一段时间。"
 POD_mentoring_disciplines.150.t: "蛇的诱惑"
 POD_mentoring_disciplines.150.desc: "古蛇术是用禁忌、错误、伊甸园中的禁果来诱惑他人的血律。它确实是一个强大的工具，学习它需要从你的导师那里得到一些深刻的指导，其从古蛇术力量的展示中获得一种犯罪快感，使你怀疑你曾经认为正确的一切。当然，这都是这个过程的一部分，这背后没有任何不体面的意图……"
 POD_mentoring_disciplines.150.a: "看着蛇的眼睛……"
 POD_mentoring_disciplines.150.b: "很诱人……"
 POD_mentoring_disciplines.150.c: "我的信仰很坚定！"
 POD_mentoring_disciplines.151.t: "放纵的蛇"
 POD_mentoring_disciplines.151.desc: "作为一门血律，古蛇术的主要吸引力之一是改变形态的能力，主要是朝向蛇形的那种。最近你在这部分训练得很好，实际上，当你以蛇的形态溜达时，你很享受从夜以继日的艰辛中解脱出来的感觉。\n然而，这并不是很威严的统治你的领地的方式，如果你不停止这训练，你的封臣们可能很快就会开始对他们奇怪的统治者嗤之以鼻。"
 POD_mentoring_disciplines.151.a: "蛇行，蛇行……"
 POD_mentoring_disciplines.151.b: "廷臣们一如既往地恼人。"
 POD_mentoring_disciplines.160.t: "心中的野兽"
 POD_mentoring_disciplines.160.desc: "阿本威利用吸血鬼与他们自己的心兽（以及他人的心兽）的密切联系和控制，以及为各种目的引导心兽的力量。这使得学习这门血律很费劲，因为心兽不容易被控制或被吓倒，它会全力抵抗你对它的掌控尝试。尽管你的导师提供了帮助，但你的第一次尝试基本上是在黑暗中盲射。"
 POD_mentoring_disciplines.160.a: "等一下！等一下！"
 POD_mentoring_disciplines.161.t: "怒火汹涌"
 POD_mentoring_disciplines.161.desc: "你已经能更好地掌握阿本威血律了，但这需要数夜的实验和试验。这导致了一些…事件，你对一些廷臣的心兽玩得有点过火了。因此，你发现你少了一些卫兵，这使你的领地比平时更不安全。时间会自行解决这个问题，但你可能有兴趣加快这个过程。"
 POD_mentoring_disciplines.161.a: "多几个或少几个……"
 POD_mentoring_disciplines.161.b: "雇用新的。"
 POD_mentoring_disciplines.170.t: "拜见亡者"
 POD_mentoring_disciplines.170.desc: "亡灵术是一门试图理解，有时甚至控制死亡的血律，无论是身体还是精神上的死亡。学习它需要一些可怕的实验，从踏入闹鬼的墓地到试图与[UmbraGlossaryLocalized('shadowlands','冥界')]的死灵交流。你已经知道，在未来的日子里，你的噩梦将充满鬼魂残影和幽灵幻像。"
 POD_mentoring_disciplines.170.a: "幽灵和吸血鬼？"
 POD_mentoring_disciplines.170.b: "我不会被吓到的！"
 POD_mentoring_disciplines.171.t: "死亡之心"
 POD_mentoring_disciplines.171.desc: "在过去的数夜，学习亡灵术是一件很费力的事情。你的脸色比平时苍白，（非）活人的陪伴已经让你感到紧张，以至于你最近多次向他们发火。他们终于得到了消息，让你独自完善你对死者秘密的理解，但你发现自己在徘徊，如果你走得太远。像你这样的黑夜统治者不应该永远独自漫游他们的城堡，不是吗？"
 POD_mentoring_disciplines.171.a: "死者与我同行，这就够了。"
 POD_mentoring_disciplines.171.b: "我将邀请大家回来。"
 POD_mentoring_disciplines.180.t: "迷失在时间中"
 POD_mentoring_disciplines.180.desc: "时光术被认为是早期布鲁赫氏族在“演变”为迅捷术之前的真正血律。迅捷术只关注身体的快速，而时光术则试图操纵时间本身，达到一些可怕的效果。你的导师敦促你保持谨慎和耐心，因为如果你不小心，很容易在历史的迷雾中搁浅，或者在这个过程中失去你自己的时间感。"
 POD_mentoring_disciplines.180.a: "我不怕。"
 POD_mentoring_disciplines.180.b: "慢而稳。"
 temporis_celerity_tt: "迅捷术和时光术是两种相反的力量。如果你之前已经学会了另一种力量，那么学习另一种就特别困难，使这个过程更加艰难。"
 POD_mentoring_disciplines.181.t: "准时"
 POD_mentoring_disciplines.181.desc: "你最近对时光术血律的奥秘的探索是成功的，使你现在有足够的信心称自己为这门技艺的使用者。不过先前的测试比较粗糙，你对那些事件中到底发生了什么感到一头雾水。毕竟，玩弄时间的流动是一个吸血鬼可以施展的最令人迷惑的力量之一。"
 POD_mentoring_disciplines.181.a: "我记得一个里面比外面大的蓝盒子？"
 awaketorpor_my_learning: "你的学识能力：$VALUE|=+0$"
 POD_mentoring_disciplines.190.t: "疯人院"
 POD_mentoring_disciplines.190.desc: "疯狂术是末卡维氏族的标志性血律，与他们有着内在的联系。有些人甚至认为，疯狂术是这个氏族精神不稳定的原因，并能使任何试图掌握其效果的人受到影响。当含有这种奇怪力量的血液开始进入你的不死族躯体时，你敏锐地意识到，这可能是一个可怕的错误……"
 POD_mentoring_disciplines.190.a: "无根据的谣言。"
 POD_mentoring_disciplines.190.b: " 我们要非常小心……"
 POD_mentoring_disciplines.190.c: "开玩笑，我已经疯了！"
 POD_mentoring_disciplines.191.t: "来来去去"
 POD_mentoring_disciplines.191.desc: "你已经掌握了你血液中的新力量，现在能够随意使用疯狂术。\n但有时你会觉得是疯狂术在使用你，而不是相反。\n自从学会了它，你就被幻觉和其他各种不稳定的预言狂热所困扰。这使你实际统治你的领域的能力受到了影响，你可能需要一些时间才能完全控制这些新的能力。"
 POD_mentoring_disciplines.191.a: "有这么多事情要分享……"
 POD_mentoring_disciplines.191.b: "你什么都不知道！"
 POD_mentoring_disciplines.200.t: "声音"
 POD_mentoring_disciplines.200.desc: "魔音术（墨尔波墨涅）以希腊的悲剧缪斯命名，它探索声音的力量，震动附近的人的灵魂，并允许吸血鬼完成他人不可能达成的音波壮举。\n这种特殊性使魔音术更容易与真正有能力唱歌的人运作。在魔音术的潜力能够被你发挥之前，你将不得不寻找能够帮助你掌握发音的合格导师。"
 POD_mentoring_disciplines.200.a: "虽然我不是在找陪审团……"
 diplomacy_mentoring_tt: "你的外交越高，花费就越低。"
 POD_mentoring_disciplines.201.t: "尾曲"
 POD_mentoring_disciplines.201.desc: "在过去的数夜，你一直在研究魔音术的错综复杂的问题，而且进展顺利。不过，你的宫廷已经知道了你的这个新爱好，现在正吵着要举办一场演奏会。这将是一个给大家留下深刻印象的好办法，因为魔音术的表演增幅令人震惊，但这也可能是相当大的压力。在开始这整个过程时，你并没有想到要在观众面前表演，真的。"
 POD_mentoring_disciplines.201.a: "深呼吸……"
 POD_mentoring_disciplines.201.b: "我没兴致。"
 POD_mentoring_disciplines.201.c: "下次有人向我点歌时，我会让他们唱。"
 POD_mentoring_disciplines.210.t: "动物图腾"
 POD_mentoring_disciplines.210.desc: "精魂术是一门允许使用者与兽灵互动的血律。在最基本的层面上，它允许吸血鬼与灵体对话和召唤灵体，但在更高的层面上，可以从灵体中输送力量来加强自己。\n学习它通常从灵性觉醒开始，最终注意到生活在世界各地的所有灵体居民，并能够从他们的洞察和经验中学习。"
 POD_mentoring_disciplines.210.a: "灵性觉醒"
 POD_mentoring_disciplines.211.t: "灵力"
 POD_mentoring_disciplines.211.desc: "早期的精魂术练习关注的是注意和学习周围的灵体，而后期的练习则更注重如何最好地利用这些新知识。通过吞噬动物的灵或召唤已死的灵，精魂术的使用者可以获得巨大的，即使是暂时的好处。不过，在学会如何寻找和尊重这些兽灵之后，它可能会带来麻烦的体验。"
 POD_mentoring_disciplines.211.a: "为力量付出的代价无论怎样都不算大。"
 POD_mentoring_disciplines.211.b: "我可以慢慢来。"
 POD_mentoring_disciplines.220.t: "战士训练"
 POD_mentoring_disciplines.220.desc: "在最基本的情况下，魂健术提供了对疼痛的控制和武术能力的提高，似乎让战士们能够借助天堂的力量来征服他们的敌人。\n但在精神上，它与萨洛比的战士种姓有很深的联系，并从他们那里吸取了许多仪式和修习。因此，对魂健术的任何指导都需要纪律和严格的条规，这确实会影响到你作为黑夜统治者的职责。"
 POD_mentoring_disciplines.220.a: "我全都做！"
 POD_mentoring_disciplines.221.t: "战士或统治者？"
 POD_mentoring_disciplines.221.desc: "你已经完成了对魂健术的早期训练，可能是时候让你回到你的夜生活了。然而，你的导师坚持要你继续你的新夜程，甚至加倍努力。当然，向外界展示一个有纪律的统治者的形象有一定的好处，但这也意味着你比以前更加劳累了。"
 POD_mentoring_disciplines.221.a: "回到日常。"
 POD_mentoring_disciplines.221.b: "我可以做到更多！"
 POD_mentoring_disciplines.230.t: "狩猎进行时"
 POD_mentoring_disciplines.230.desc: "寂灭术主要是作为哈基姆圣裔战士种姓手中的刺客工具而闻名，是最纯粹的血之力。在最简单的情况下（也就是你现在正在努力学习的），它是猎人工具，可以将你的血液转化为毒药，或者在接近之前使一个地区安静下来。你的导师鼓励你用猎杀动物来磨练这些新发现的技能，也许可以在这个过程中组织一次大规模的狩猎作为练习。"
 POD_mentoring_disciplines.230.a: "一个可靠的想法。"
 POD_mentoring_disciplines.230.b: "这并不便宜……"
 POD_mentoring_disciplines.231.t: "受惧的统治者"
 POD_mentoring_disciplines.231.desc: "你已经完成了掌握寂灭术的早期步骤，为你的武器库增加了一个新工具。然而，这是一个相当令人恐惧的工具，因为这门血律与刺客和其他黑暗中的交易有关。因此，你的宫廷一直在担心地嘀咕，为什么你会需要这种可怕的力量加入到你的剧目中。是时候让他们放心了……或者让担心。"
 POD_mentoring_disciplines.231.a: "你会看到……也许。"
 POD_mentoring_disciplines.231.b: "没有必要让大家恐慌。"
 POD_mentoring_disciplines.240.t: "疯狂之梦"
 POD_mentoring_disciplines.240.desc: "归因于是源自妖精的力量，以及展示新知识的倾向，仙灵术使许多受害者陷入胡言乱语的疯狂中，或者至少是沮丧的。\n因此，你的导师鼓励你谨慎行事，不要急于学习太多东西。但你真的有足够的时间吗？"
 POD_mentoring_disciplines.241.t: "妖精之魅"
 POD_mentoring_disciplines.241.desc: "仙灵术深深地汲取了妖精（真实或其他）的力量和围绕它们的神话。一门非常罕见的血律，现在你已经完成了训练，这也是你的宫廷中颇有争议的话题。有些人说你看起来更苍白，几乎是半透明的，而其他人则讨论你自己成为一个隐士，也许是被你血液中的新力量吸走了。"
 POD_mentoring_disciplines.241.a: "我现在看到了更多。"
 POD_mentoring_disciplines.241.b: "我不需要他们的一派胡言！"
 resilient_mind_valid: "你必须得有任意负面精神特质来使用坚韧心智。"
