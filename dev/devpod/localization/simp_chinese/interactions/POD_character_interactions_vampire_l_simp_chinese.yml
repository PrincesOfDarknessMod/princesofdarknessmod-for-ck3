 POD_mentoring_disciplines.256.t: "血祭"
 POD_mentoring_disciplines.256.desc: "你抵达时，发现导师正坐在树下，面前放着一碗油。\n\n\"要在内心寻得力量与专注，就必须在心兽疯狂啃噬神智时保持清明，\"[recipient.GetFirstName]说道，同时示意你放干体内血液。"
 POD_mentoring_disciplines.256.a: "你将体液完全排入碗中"
 POD_mentoring_disciplines.257.t: "火炼"
 POD_mentoring_disciplines.257.desc: "[recipient.GetFirstNamePossessiveNoTooltip]坚定的目光始终注视着你。你枯坐无言，血液尽失，不知这试炼意欲何为。[AddTextIf( PlayerHasBeast, ' 饥渴几乎难以忍受.' )]而后导师近乎冷漠地点燃了油碗。\n\n\"若屈服于恐惧，心兽就会#beast 操控#!你。若能克服恐惧，心兽便会#italic 畏惧#!你。\"\n\n导师取出厚实的木板架在碗上，命你徒手劈开。无情的火焰始终舔舐着木板。\n\n\"不得使用异能取巧。唯以意志撼动。点燃灵魂深处的油火，让烈焰灼灼燃烧。\""
 POD_mentoring_disciplines.257.a: "竭尽全力击出"
 POD_mentoring_disciplines.257.b: "不费吹灰之力。"
