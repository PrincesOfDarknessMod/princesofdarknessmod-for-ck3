 POD_create_homunculus_interaction_desc: "制造自己的凡人版克隆。"
 POD_vampshapeshift_interaction_paste_face: "赐予面貌"
 POD_vampshapeshift_interaction_restore_face_recipient: "恢复目标原貌"
 POD_mask_of_a_thousand_faces_interaction: "假面"
 POD_mask_of_a_thousand_faces_interaction_desc: "复制或交换[recipient.GetFirstName]的外貌。"
 POD_old_friend_interaction: "老朋友"
