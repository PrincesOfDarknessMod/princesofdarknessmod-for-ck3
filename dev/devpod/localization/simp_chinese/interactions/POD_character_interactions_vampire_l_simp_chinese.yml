 POD_create_name_interaction: "创名"
 POD_create_name_interaction_desc: "移除所有[recipient.GetFirstName]对你的[hook|E]、宣称、停战协定、秘密了解、和关系。"
 POD_horrid_blade_of_the_demons_interaction: "骇人魔刃"
 POD_horrid_blade_of_the_demons_interaction_desc: "无中生有地制造出一把危险武器。"
 POD_mirror_duplicate_interaction: "镜中人"
 POD_mirror_duplicate_interaction_desc: "制造自己的克隆。"
 POD_sensory_deprivation_interaction: "感官剥夺"
 POD_sensory_deprivation_interaction_desc: "使[recipient.GetFirstName]无法使用[recipient.GetHerHis]的感官。"
 POD_find_mortals_interaction_custom: "自定义"
 POD_the_mind_revealed_interaction: "揭露计谋"
