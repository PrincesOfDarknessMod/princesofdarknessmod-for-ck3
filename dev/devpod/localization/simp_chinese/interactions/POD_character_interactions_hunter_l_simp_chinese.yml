 POD_inquihunt.1.option.a.generic: "我必须说服他们！"
 POD_inquihunt.4.desc.generic: "你严重低估了这位魔物对这个村庄的影响力。你的辞藻遭到了怀疑，甚至是彻底的暴动。当你发现真相的时候已经太晚了：他们一直都是吸血鬼的血奴。\n你的随从在睡觉的时候被杀了，而你被毫不客气地送到了你为魔物准备的火刑架上。当火焰开始吞噬你时，你会想起，其实，这一切都注定要这样结束。你已经尽力了。"
 POD_inquihunt.5.desc.generic: "过度自信是缓慢而隐蔽的杀手，但你必须承认：这是一次完美的袭击，由你在指挥下的勇敢猎人熟练地执行。尽管有无数的血奴保卫着这个地区，甚至还有更多的陷阱，你还是设法以几乎没有损失的方式最终攻占了这个地方。\n很明显，你是在光天化日之下进攻的，而且你必须感谢这一计谋，因为它让魔物在大战中沉睡着。占领城堡后，斩下沉睡中的吸血鬼头的那一刻让人感觉虎头蛇尾，但仍然很满足。胜利又是属于你的。"
 POD_inquihunt.6.desc.generic: "城堡里的战斗还在继续，你知道胜利就在你的掌握之中。但这样的代价值得吗？它的守军早就以逸待劳，无数的陷阱已经夺去了你麾下优秀男女的生命。一只死去的魔物相对这些可怜的灵魂就够了吗？\n现在还不晚，你可能还可以取消今天的攻击，但吸血鬼会利用夜晚的掩护逃跑。或者你继续前进，永远背负着因此崇高的功业因而牺牲的同伴的重担。"
 POD_inquihunt.7.desc.generic: "这一切非常糟糕。城堡早就准备好了，你连围墙都打不破。更糟糕的是，对方的援军正从附近的城镇赶来，显然也被城堡的黑魔王的血奴所控制。魔物本身离我们那么近，却又那么远。\n你和你勇敢的猎人们已经无处可逃了，你的终结已经不可避免了。但在此之前……你将尽可能多地消灭这些魔物。"
 POD_inquihunt.8.desc.generic: "你的突击进行得有条不紊。你针对了魔物掌握的每一个公会，民兵或者邪教团体。你用了两件强大的武器：诱惑贪婪者的金钱和恐吓腐败者的报复宣言。\n就这样，你的行动孤立了吸血鬼，疏远了其的盟友，驱散了其的血奴。你现在看到魔物最后的藏身处在你眼前燃烧，里面生物的惨叫声像音乐一样传入你的耳朵。"
 POD_inquihunt.10.desc.generic: "你算错了。你的行动每一步都遭到反击。这个吸血鬼拥有更多的金钱，更多的手下，对这个社区的影响力比你想象的要大。\n现在，一切都崩溃了，毫不夸张地说，在你最后一次的错误把你的位置暴露给魔物之后。一群冷酷的“雇佣兵”迅速出现，只有你忠实猎人在保护着你，不久你就被包围在自己的基地。当最后的战斗声音在外面消失的时候，你现在可以听到从窗外扔进的火把的声音。结局即至。"
 POD_inquihunt.10.option.a.generic: "路的尽头。"
 POD_inquihunt.11.option.a.generic: "不费吹灰之力。"
 POD_inquihunt.15.desc.generic: "该魔物很是难以捉摸。其已经避开了你精心策划的两个陷阱，你开始失去一些阵地，例如你的几个手下已经失踪。\n但还有一种可能性，鉴于它的……“神秘”性质，你直到现在才会选择使用它。你在这一地区的一位可疑人脉表示愿意提供帮助，但依靠这个可能有污点的消息来源可能会损害你的声誉。"
 POD_inquihunt.16.desc.generic: "你根本不知道它是什么时候开始的。你在一本旧书里找到了关于吸血鬼的一条线索，然后又一条……然后你开始阅读。当一些你不记得雇佣过的手下给你带来新书时，情况就更糟了。\n你已经在你的工作中迷失了很长一段时间，你已经挖得很深，可能太深了。至少，当地的圣职人员是这么认为的，正如你的一位同伴举报了你的“异端”读物。所以，你又一次站在燃烧的火刑柱边，但这次不是在公众中……"
 POD_inquihunt.17.desc.generic: "其没想到会遭遇正面攻击。在找到其的安身之处之前，你已经冲破了大量毫无准备的吸血鬼血奴。虽然你在白天进攻，但战斗的喧嚣唤醒了等待你的魔物。\n你得承认，其表现得很出色，哪怕因在白天而行动迟缓，可是总而言之，在其在这场战斗中还没有真正弄清方向之前，你就很容易把其的脑袋砍掉了。你的弩又多了一笔战绩。"
 POD_inquihunt.19.desc.generic: "就这样结束了。尽管魔物在白天受到攻击，但它比你更壮、更快、更坚强。你在对抗中很早就得出了这个结论，且你无法越过它。\n现在，只剩拖延足够长的时间，让你的部队能够撤退并多活一天，你很确定这能做到。吸血鬼正准备用最后一击终结你。你很平静，因为你一直都知道这将是你生命的终结。"
 POD_inquihunt.50.t: "猎狼"
 POD_inquihunt.50.desc: "猎杀狼人对于即使是最经验丰富的猎人来说，都是一项非常棘手的任务。这些生物是一团庞大的肌肉，结成群体行动，并且很少离开他们设施完善、坚不可摧的圣地，任何闯入者都会被立即杀死。他们紧密团结的家庭，即“狼嫡”，也使他们不需要与外界互动。\n相比之下，猎杀吸血鬼似乎更容易些。\n最明显的方法是正面突击，利用压倒性的人数和银制武器，因为这些生物对银制物品较为脆弱。尽管你能够获得所有的优势，但是他们很可能不会轻易倒下。你确定要尝试吗？"
 POD_inquihunt.50.option.a: "现在没有回头路了。"
 POD_inquihunt.50.option.b: "给每个人配备银器！"
 POD_inquihunt.50.option.c: "让我们谨慎出击。"
 POD_inquihunt.50.option.z: "我不喜欢我的胜算。"
 hunt_give_up_tt: "你转回头，放弃了这次猎魔。"
 POD_inquihunt.51.t: "很好的一团糟"
 POD_inquihunt.51.desc: "这场战斗如你所想的那样混乱不堪。那些怪物在被击败的过程中，给你造成了与他们所受到的伤害相当（或更多）的代价。幸运的是，你们人数众多、装备精良、领导力强大，足以夺取胜利。\n当你的伙伴们恭敬地埋葬你们的战友并无情地焚烧这处肮脏的化兽族裔居所时，你在附近的一条河中洗去战斗中的血腥和残肢。\n火势开始蔓延，如今，胜利的气息将在风中弥漫，燃烧的树木散发出灰烬的气味。"
 POD_inquihunt.51.option.a: "我听到森林在哭泣吗？"
 POD_inquihunt.52.t: "一团糟"
 POD_inquihunt.52.desc: "这些怪物真的能被杀死吗？\n尽管你对它们的了解表明它们是可以被杀死的，但这场战斗似乎决意证明你错了。他们浑身青一块紫一块，被箭矢射穿，但仍然以可怕的轻松度闯入你的队伍之中。他们愤怒引发的狂暴只似乎让他们更强大，尽管你太有经验而不会害怕，但你能看到不祥之兆。\n下令全面撤退，你坚守后卫足够长的时间，逃离他们的部族领地，庆幸地看到他们选择不追击。这并不是一场胜利，但至少你活下来了，可以再战一天。考虑到对手的强大，这已经是一种胜利了。"
 POD_inquihunt.52.option.a: "我会回来的。"
 POD_inquihunt.53.t: "你的一团糟"
 POD_inquihunt.53.desc: "看来，优越的装备、人数和准备并不足以与纯粹的蛮力相匹敌。\n无论你往哪里看，都能看到你的伙伴被这些怪物的巨大爪子残忍地撕开。你自己的攻击似乎几乎不能穿透它们超自然强大的皮肤，即使是最深的伤口也只会让它们变得更加愤怒，从而更加强大。\n一切发生得太快，你甚至来不及下令撤退，因为你的一些士兵已经自行逃离。虽然化形者并不总是追击，但你很快注意到其中一些，包括你曾经的目标，已经包围了你，明显地意识到你是这里的领导者。\n看来，现在是最后的战斗时刻。作为一位猎人，你一直知道它会以这种方式结束。"
 POD_inquihunt.53.option.a: "我已经尽力了。"
 POD_inquihunt.80.t: "送回地狱"
 POD_inquihunt.80.desc: "猎杀恶魔带来了一个困扰，因为它们实际上是不死的。关于它们的一切都指向一个事实，那就是杀死它们的躯壳对它们来说只是个挫折，因为它们似乎首先是灵体层面的生物。\n然而，希望并未完全丧失，因为至少有办法确保它们被遣回它们所属的地狱。你相当有信心，对于一只恶魔来说，逃离地狱是困难的，需要崇魔者的帮助才能实现。\n因此，要追猎恶魔，你需要对它们特定的弱点有很好的了解，以及将它们与可能众多的奴仆隔离开来，以防止它们被召回，并且需要大量的勇气。你拥有后者，现在是时候着手解决前两者了。"
 POD_inquihunt.80.option.a: "我已经准备就绪。"
 POD_inquihunt.80.option.b: "我想知道关于这恶魔的一切。"
 hunt_demon_abyss_tt: "该恶魔将失去头衔，并被送回深渊监狱。"
 POD_inquihunt.81.t: "驱魔101问"
 POD_inquihunt.81.desc: "一切按计划进行。在对付这只恶魔之前，你收集到了重要的情报，包括它的[Glossary('真名','podgloss.truename')]的一部分，并着手对付它的邪教。幸运的是，邪教徒通常并不聪明（否则在你看来他们就不会是邪教徒了），所以你设法瞒过了他们，让他们去做一个注定会失败的愚蠢任务。\n美妙的是，你甚至不需直面恶魔本身。只需找到它在这个世界上的灵性锚点，使用它[Glossary('真名','podgloss.truename')]的一部分，并对其进行（可以说是复杂的）驱魔仪式，将它的灵从容器中驱逐出去。一旦“自由”了，深渊监狱的引力便会完成剩下的工作。\n一次完美执行的猎魔。"
 POD_inquihunt.81.option.a: "免费的遣回监狱旅行。"
 POD_inquihunt.82.t: "猎人对抗恶魔"
 POD_inquihunt.82.desc: "应对恶魔的邪教徒相对容易，利用他们邪恶的狂热进行一些误导就解决了问题。然而，恶魔本身则完全是另一回事。他们将与[Glossary('真名','podgloss.truename')]或与这个世界的灵性锚点有关的一切都隐藏在如此多层的欺骗之下，以至于你在此过程中也多次被误导。\n你“觉得”自己找到了线索，但现在你变得谨慎起来，因为这可能是你的目标留下的众多陷阱之一，用来对付像你这样的威胁。如果你触发了它并向恶魔显露自己，事情将会变得相当……令人不快。你明智地选择暂时放弃追逐。一旦希望中的可能通向你的线索消失，你总是可以稍后继续。"
 POD_inquihunt.83.t: "见鬼去吧"
 POD_inquihunt.83.desc: "你对这次的线索非常确信。经历了无数虚假情报和误导信息后，你终于收集到了你认为是恶魔[Glossary('真名','podgloss.truename')]的一部分以及他们灵性锚点的位置。终于有了一些具体的成果，你毅然决然地利用这个线索开始进行驱魔……然而，你却陷入了一个陷阱。\n当邪教徒们在有锁链束缚着你的祭坛周围高唱咒语，而恶魔本身则向你承诺甜蜜的折磨时，你不禁奇怪地在只是思考地狱是否真的存在。你有一种不愉快的感觉，很快你将会得到答案。"
 POD_inquihunt.83.option.a: "最后的单程旅行。"
 POD_inquihunt.110.t: "猎梦人"
 POD_inquihunt.110.desc: "关于神秘的妖精族群，有很多传说……然而这些传说并没有对我们的猎杀提供任何帮助，因为它们大多相互矛盾。穿透这些生物故意编织的欺骗并不容易，但你设法摸清了一个重要事实：寒铁可以杀死它们。\n然而，仅仅闯入它们的“王廷”就等于自寻死路。妖精是众所周知的诡计大师，他们隐藏在一层又一层的幻象之后。但是，他们对人类的兴趣也是他们的弱点。如果你能够让自己变得足够有趣，也许你能够被邀请并接近你的目标，从而发动攻击……"
 POD_inquihunt.110.option.a: "我得大梦。"
 POD_inquihunt.110.option.b: "我想要花钱能买到的最好的寒铁匕首。"
 POD_inquihunt.111.t: "梦的终结"
 POD_inquihunt.111.desc: "你经过一番准备，成功让自己显得足够有趣，吸引了当地妖精们的注意。你扮演着一个被这些奇幻生物迷住的无知凡人的角色，跟随着它们进入了一个充满奇迹的陌生世界。尽管周围一片混乱，你设法保持头脑清醒，吸引了你的目标的目光，他低声咕哝着要从你身上提取“梦华”。\n一等到僻静，在其能够实施任何计划之前，你的寒铁匕首划破了其的喉咙。几分钟后，你已经离开了妖精宫廷，而无人知晓。"
 POD_inquihunt.111.option.a: "回归现实。"
 POD_inquihunt.112.t: "无梦之夜"
 POD_inquihunt.112.desc: "尽管你尽力让自己对奇异的妖精族群显得有吸引力，但你陷入了死胡同。也许你并没有完全理解他们在一个凡人身上寻找的是什么，或者他们只是理解了你真正的意图。\n无论如何，妖精宫廷和你的目标对你依然固执地隔离着。现在他们很可能已经意识到了你的意图，冒然闯入将是一个非常糟糕的主意。你将不得不等待另一个机会。"
 POD_inquihunt.113.t: "美梦到噩梦"
 POD_inquihunt.113.desc: "你首次察觉到妖精宫廷出了问题。在此之前，你以为自己为了吸引目标的注意力而表演得足够有趣的行为完美无缺。然而，当他们开始围拢你，周围的环境变得更加阴暗，你才明白自己犯下了一个大错。\n你不知道是如何或何时，但可以确定的是，他们注意到了你带来了寒铁，这是他们中的严重忌讳。而且可以肯定，你最后的噩梦只是刚刚开始。"
 POD_inquihunt.113.option.a: "……而且永无止境。"
 POD_ha_holy_heal_depressed_genetic: "抑郁"
 POD_ha_holy_heal_lunatic_genetic: "精神错乱"
 POD_inquihunt.7010.t: "蓄势待发"
 POD_inquihunt.7010.desc: "夜行生物深知隐秘行事的重要性，唯有隐匿才能维系他们的存续。\n\n然而，偶尔也会有失手的时候。\n\n而这次，便是如此。"
 POD_inquihunt.7010.a: "猎杀开始。"
 POD_inquihunt.7010.b: "日后再说"
 POD_steal_chi_interaction: "窃取气"
 POD_steal_chi_interaction_desc: "从[recipient.GetFirstName]处窃取气"
 POD_steal_chi_interaction_weapon: "窃取气以强化武器"
 POD_steal_chi_interaction_yangchi: "窃取阳气滋养己身"
 POD_steal_chi_interaction_yinchi: "窃取阴气滋养己身"
 POD_inquihunt.1.desc.fera: "你终于找到了那个魔物的巢穴。没错，因为周围的猿人都是偏执狂，被$glossary_wyrm$污染的空壳，害怕在晚上出没。\n在你侦察完地区后，是时候考虑你的下一步行动了。你已经找到了这个邪恶的巢穴，但是如何摧毁它还有待你自己的理解……"
 POD_inquihunt.1.option.a.fera: "通过一些演讲，猿人可以被鞭策出对蚂蟥的怒火……"
 POD_inquihunt.1.option.b.fera: "盖亚的选民们！我们今天要攻破这座城堡！"
 POD_inquihunt.1.option.d.fera: "赫利俄斯会帮助我们。让我们在白天行动。"
 POD_inquihunt.2.desc.fera: "召集一群人类暴徒比你想象的要容易。他们渴望推翻在他们的同族身上饕餮的$glossary_wyrm$衍体。\n一旦这样做了，与他们结盟就更容易了，还能利用他们所知道关于潜伏在夜晚的魔物的一切。就这样，你带着全镇的人冲进了其的巢穴，轻而易举地就将其遏制住了他们。\n说了这么多，做了这么多，你现在正享受地在全镇人的欢呼声中看着恶魔被烧死在火刑柱上！"
 POD_inquihunt.3.t.fera: "不服管教的暴民"
 POD_inquihunt.3.desc.fera: "魔物的魔爪似乎已经深入了这个村庄。你的煽动聚集了大量的追随者，但也有少量的叛乱者，他们现在在活尸的巢穴门口对抗你的神圣队伍。\n很明显，他们已经被$glossary_wyrm$腐蚀了，但你不能拖延，因为吸血鬼一旦听到外面的骚动肯定会逃跑。不过，还有另一个选择，更快，但在道德上更有问题……"
 POD_inquihunt.4.desc.fera: "你严重低估了魔物对这座村庄的影响力。你的煽动遭到了怀疑，甚至是彻底的怒火。当你发现他们一直都处于吸血鬼控制之下的真相时已经太晚了。\n你的支持者们在睡梦中被杀，而你则被毫不客气地抬到了你打算用来对付魔物的木桩前。当火焰开始吞噬你时，你希望你在下辈子能成为更好的盖亚战士。"
 POD_inquihunt.5.desc.fera: "这是一次完美的袭击，由你在指挥下的部队熟练地执行。尽管有无数的血奴保卫着这个地区，甚至还有更多的陷阱，你还是设法以几乎没有损失的方式最终攻占了这个地方。\n很明显，你是在光天化日之下进攻的，你必须把功劳归于赫利俄斯的光，因为它让魔物在大战中沉睡着。占领城堡后，斩下沉睡中的吸血鬼头的那一刻让人感觉虎头蛇尾，但仍然很满足。胜利又是属于你的。"
 POD_inquihunt.6.desc.fera: "城堡里的战斗还在继续，你知道胜利就在你的掌握之中。但这样的代价值得吗？它的守军早就以逸待劳，无数的陷阱已经夺去了盖亚战士的生命。一只死去的魔物相对这些可怜的亲族就够了吗？\n现在还不晚，你可能还可以取消今天的攻击，但吸血鬼会利用夜晚的掩护逃跑。或者你继续前进，永远背负着因此崇高的功业因而牺牲的追随者的重担。"
 POD_inquihunt.7.desc.fera: "这一切非常糟糕。城堡早就准备好了，你连围墙都打不破。更糟糕的是，对方的援军正从附近的城镇赶来，显然也被城堡的黑魔王的血奴所控制。魔物本身离我们那么近，却又那么远。\n你和你勇敢的战士们已经无处可逃，终将走向灭亡。你将尽可能多的消灭这些$glossary_wyrm$衍体。"
 POD_inquihunt.8.desc.fera: "你的突击进行得有条不紊。你针对了魔物掌握的每一个公会，民兵或者邪教团体。你用了两件强大的武器：诱惑贪婪者的金钱和恐吓腐败者的报复宣言。\n就这样，你的行动孤立了吸血鬼，疏远了其的盟友，驱散了其的血奴。你现在看到魔物最后的藏身处在你眼前燃烧，里面生物的惨叫声像音乐一样传入你的耳朵。"
 POD_inquihunt.9.option.a.fera: "只要价格合适，有些人就会与怪物战斗。"
 POD_inquihunt.10.desc.fera: "你算错了。你的行动每一步都遭到反击。这个吸血鬼拥有更多的金钱，更多的手下，对这个社区的影响力比你想象的要大。\n现在，一切都崩溃了，毫不夸张地说，在你最后一次的错误把你的位置暴露给魔物之后。一群冷酷的“雇佣兵”迅速出现，只有你忠实的亲族在保护着你，不久你就被包围在自己的基地。当最后的战斗声音在外面消失的时候，你现在可以听到从窗外扔进的火把的声音。看来一切都完了。"
 POD_inquihunt.10.option.a.fera: "大饕嘲笑我的败北。"
 POD_inquihunt.11.desc.fera: "你知道关于吸血鬼的一件事那就是他们之间大多是相互敌对的。而你已经成为了利用这一事实来为自己获益的专家。\n把这座巢穴的一些线索留给了已知的邻近的魔鬼巢穴，然后你只是坐视你的目标在夜里被其对手雇佣的一些暴徒袭击。其赢了，但被削弱到足以让你的战士们轻松制服其。你只需一击必杀。"
 POD_inquihunt.11.option.a.fera: "摧毁蚂蟥带来很多荣耀。"
 POD_inquihunt.12.t.fera: "掠食者与猎物"
 POD_inquihunt.12.desc.fera: "该魔物的狡猾给你留下了深刻印象。一旦被你成功编织了阴谋网，大多数目标都很容易就会被击倒，但这一位……这一位回击了。有力的。\n你的网受到了攻击，恶意的谣言反了过来针对你。你知道你可以继续幕后战争，但是它会让你花费很多来修复敌人造成的伤害。但再多推进一点也许就能让你击败这只吸血鬼。决定么，决定吧。"
 POD_inquihunt.15.desc.fera: "该魔物很是难以捉摸。其已经避开了你精心策划的两个陷阱，你开始失去一些阵地，例如你的几个手下已经失踪。\n但还有一种可能性，鉴于它的……“神秘”性质，你直到现在才会选择使用它。一位危险的灵联系了你，表示愿意提供“帮助”。"
 POD_inquihunt.16.desc.fera: "你根本不知道它是什么时候开始的。你在一本旧书里找到了关于吸血鬼的一条线索，然后又一条……然后你开始阅读。当一些你不记得雇佣过的手下给你带来新书时，情况就更糟了。\n你已经在你的工作中迷失了很长一段时间，你已经挖得很深，可能太深了。然后诸灵带着一个危险的提议来找你。这过于危险，把你带入了陷阱，最终导致你的死亡。"
 POD_inquihunt.17.t.fera: "盖亚之怒"
 POD_inquihunt.17.desc.fera: "其没想到会遭遇正面攻击。在找到其的安身之处之前，你已经冲破了大量毫无准备的吸血鬼血奴。虽然你在白天进攻，但战斗的喧嚣唤醒了等待你的魔物。\n你得承认，其表现得很出色，哪怕因在白天而行动迟缓，可是总而言之，在其在这场战斗中还没有真正弄清方向之前，你就很容易把其的脑袋砍掉了。少了一只寄生在盖亚上的$glossary_wyrm$蚂蟥。"
 POD_inquihunt.19.desc.fera: "就这样结束了。尽管魔物在白天受到攻击，但它比你更壮、更快、更坚强。你在对抗中很早就得出了这个结论，且你无法越过它。\n现在，只剩拖延足够长的时间，让你的部队能够撤退并多活一天，你很确定这能做到。吸血鬼正准备用最后一击终结你。下辈子做更好吧。"