 inquihunt_desc: "我将摧毁[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]，将他们的污秽从这片土地上清除。"
 inquihunt_desc_general: "在发动攻击之前，试着找到魔物"
 INQUIHUNT_SUCCESS_DESC: "你将对[TARGET_CHARACTER.GetShortUIName]展开最后的攻击。"
