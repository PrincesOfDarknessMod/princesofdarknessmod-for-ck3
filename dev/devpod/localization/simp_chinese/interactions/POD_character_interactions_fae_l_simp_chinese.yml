 oath_of_secrecy_modifier: "保密之誓"
 oath_of_secrecy_modifier_desc: "就像笼罩着凡人心灵的迷障，就像无踪的[UmbraGlossary('arcadia')]的门径，我也将把我在这个时间和地点获得的知识紧紧地保密。永远不要让它传出我的嘴，否则黑夜就会变成白昼，所有隐藏的物事都将暴露。\n#weak 若角色揭露誓言对象的秘密，其将成为[GetTrait('oathbreaker').GetName( GetPlayer )]。#!"
 POD_oath_of_guardianship_interaction: "守护之誓"
 POD_oath_of_guardianship_interaction_desc: "保护一个人、一个地方或一件物品的誓言。"
 POD_oath_of_guardianship_interaction_tooltip: "若[secondary_recipient.GetFirstName]死去，[recipient.GetFirstName]将成为[GetTrait('oathbreaker').GetName( GetPlayer )]。"
 recipient_secondary_POD_oath_of_guardianship_interaction: "受护者"
 oath_of_guardianship_opinion: "守护之誓"
 oath_of_guardianship_modifier: "守护之誓"
 oath_of_guardianship_modifier_desc: "如同大地于白日被太阳守护，于黑夜被群星守护，我也当如此守护汝。这是我的职责。直到许诺之期前，我将绝不抛弃汝，否则星辰也当闭眼沉眠。\n#weak 角色将尝试从谋杀中拯救誓言对象。\n若誓言对象死亡，角色将成为[GetTrait('oathbreaker').GetName( GetPlayer )]。#!"
 POD_oath_of_truehearts_interaction: "真心之誓"
 POD_oath_of_truehearts_interaction_desc: "戚族恋人对彼此的誓言。"
 POD_oath_of_truehearts_interaction_tooltip: "若[recipient.GetFirstName]与其他人交配，[recipient.GetSheHe]将成为[GetTrait('oathbreaker').GetName( GetPlayer )]。"
 oath_of_truehearts_opinion: "真心之誓"
 oath_of_truehearts_modifier: "真心之誓"
 oath_of_truehearts_modifier_desc: "我把自己当礼物献给汝。汝随意接受；代价随意，你永远拥有我。我向你发誓爱你，向你保证我的誓言。愿那些守护爱情的存在看守这誓言和那些遵守誓言的人，愿我们在他们眼中永远不会有错。\n#weak 角色将避免与他人交配。\n若角色与他人交配，其将成为[GetTrait('oathbreaker').GetName( GetPlayer )]。#!"
 POD_fae_interactions.300.t: "$murder_save_header$誓卫"
 POD_fae_interactions.300.desc.assassin: "失败了，我的刺客没能除掉[target.GetTitledFirstName]！[target.GetFirstNamePossessiveNoTooltip]的誓卫[oath_guardian.GetTitledFirstName]出手，在暗杀就要成功前干掉了我雇佣的杀手。"
 POD_fae_interactions.300.desc.thugs: "我雇佣除掉[target.GetTitledFirstName]的暴徒失败了！尽管他们出手足够歹毒，[target.GetFirstNamePossessiveNoTooltip]的誓卫还是护住了[target.GetHerHim]相当长的时间，直到[target.GetHerHis]的护卫集结并干掉了剩余的强盗。"
 POD_fae_interactions.300.desc.mob: "尽管我煽动去杀死[target.GetTitledFirstName]的暴民成功将[target.GetHerHim]从[target.GetHerHis]的马上拽了下来，他们还是没能在[target.GetFirstNamePossessiveNoTooltip]的誓卫出手前完成任务。[oath_guardian.GetSheHe|U]无情地迅速杀死了[target.GetFirstNameNoTooltip]攻击范围内的农民，其他人当即吓得四散奔逃。"
 POD_fae_interactions.300.desc.lured_into_forest: "让[target.GetTitledFirstName]迷失在森林中的计划进展得很顺利，夜幕降临，那个任性的[target.Custom('GirlBoy')]不见了踪影。\n\n可惜的是，就当我打算回房睡觉时有消息传来，[target.GetFirstNamePossessiveNoTooltip]的誓卫将那[target.Custom('GirlBoy')]从林中带了出来。显然[oath_guardian.GetSheHe]将寻回[target.GetFirstNamePossessiveNoTooltip]视为[oath_guardian.GetHerselfHimself]自己的责任，并且先于饥饿的野兽找到了那孩子。"
 POD_fae_interactions.300.desc.child_pushed: "那个将会成为[target.GetTitleAsNameNoTooltip]的傻里傻气的小[target.Custom('GirlBoy')]果然不太聪明，居然蠢到落入我的陷阱！正如计划那样，[target.GetFirstName]爬到了阳台边缘，然后，我的探子助了[target.GetHerHim]一臂之力……\n\n……但接下来的事却没按照剧本进行，就在要与地面亲密接触前，[target.GetSheHe]被[target.GetHerHis]的誓卫接住了。[target.GetSheHe|U]活着看到了又一天的太阳，而且以后也不太可能会上当了。"
 POD_fae_interactions.300.oath_guardian_dies: "\n\n不过至少[oath_guardian.GetFirstNameNoTooltip]以后不会再妨碍我了，[oath_guardian.GetSheHe]在搏斗中受的重伤要了[oath_guardian.GetHerHis]的命。"
 POD_fae_interactions.300.a: "结束了……"
 POD_fae_interactions.300.b: "……我说没结束就是没结束！"
 POD_fae_interactions.301.t: "$murder_save_header$誓卫"
 POD_fae_interactions.301.desc.assassin: "今天我差点#EMP 死了#!！要不是[oath_guardian.GetFirstName]察觉到异样并跟着我返回住处，我现在已经是一具尸体了。\n\n[oath_guardian.GetFirstNameNoTooltip]将我身后的某个人按倒在地时我才察觉有刺客，然后就是一片刀光拳影，直到刺客倒在地上没了性命。"
 POD_fae_interactions.301.desc.assassin.oath_guardian_dies: "\n\n让人悲伤的是，[oath_guardian.GetFirstNameNoTooltip]也付出了惨痛的代价。尽管刺客死了，却给[oath_guardian.GetHerHis]留下了致命的伤口。"
 POD_fae_interactions.301.desc.thugs: "当时我正带着随从出行，突然树丛中传来一声大喊。“进攻！目标[ROOT.Char.GetTitleTierName]！”有埋伏！\n\n那些强盗不仅求财，还要夺命！我的誓卫[oath_guardian.GetFirstNameNoTooltip]冲了上去，将敌人拦在了[oath_guardian.GetHerHis]身前。\n\n虽然[oath_guardian.GetFirstNameNoTooltip|U]寡不敌众，且战且退，敌人挥舞着兵器压了上来，但我的其他卫兵很快组织好防御阵型，将剩余的进攻者一一砍到在地。"
 POD_fae_interactions.301.desc.thugs.oath_guardian_dies: "战斗结束之后，[oath_guardian.GetSheHe]倒在了地上，这时我才发现[oath_guardian.GetHerHis]身上深深的伤口。[oath_guardian.GetSheHe]真的保护我直到最后一刻……"
 POD_fae_interactions.301.desc.mob: "我骑行穿越[home_province.GetName]的街道时，一伙尖叫大喊的暴民冲向了我的随从。我还没意识到发生什么事了，这伙贱民就把我拉下马开始暴打我！\n\n我的誓卫[oath_guardian.GetFirstName]冲过来保护我，无情地[oath_guardian.Custom('SignatureWeaponWoundVerb1PresentParticiple')]着手中[oath_guardian.Custom('signature_weapon')]，杀向正在打我的暴民，说起来有些恶心，但他们的尸体压在我身上，反而保护了我免受进一步的伤害。"
 POD_fae_interactions.301.desc.mob.oath_guardian_lives: "\n\n战斗声结束后，[oath_guardian.GetFirstNameNoTooltip]推开压在我身上的尸体，扶我站了起来。现在这条街上只剩下了我俩，那些反贼不是死了就是逃跑了。"
 POD_fae_interactions.301.desc.mob.oath_guardian_dies: "\n\n等我从尸体堆里爬出来时，街上已空无一人，除了那些尸体——还有倒在他们中的[oath_guardian.GetFirstNameNoTooltip]。"
 POD_fae_interactions.301.desc.lured_into_forest: "当时我正在和几个廷臣在树林里捉迷藏，但是已经很久都没听到有人来找我了。太久了。\n\n我喊了出来，却什么也听不到。我被抛弃了……我试图找到回家的路，但不记得哪条路才是，而且天很快就黑了。\n\n没一会我就听到了在林中穿梭的野兽，但在它们找我之前，我的誓卫[oath_guardian.GetFirstName]出现了，喘着粗气，挥舞着火把。火焰似乎惊退了野兽，[oath_guardian.GetSheHe]气喘吁吁地说道：“走……我们回家……大人……”"
 POD_fae_interactions.301.desc.child_pushed: "\n\n#EMP 扑通#!\n\n我摔进了我的誓卫[oath_guardian.GetFirstNameNoTooltip]的怀里。“傻孩子！要是我没能及时找到你……算了。我们去安全的地方。”"
 POD_fae_interactions.301.owner_discovered: "\n\n这次袭击的幕后黑手只可能是一个人：[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]！"
 POD_fae_interactions.301.a: "到底是谁想要杀了#EMP 我#!？"
 POD_fae_interactions.301.b: "[owner.GetSheHe|U]将会为此付出代价！"
