 POD_impundulu.2001.desc: "We sit across from one another — two scholars of the grave, divided by blood but united by curiosity. The offer has been made. Now we must determine the price.\n\nWhat do we offer in return for their knowledge of death?"
 POD_impundulu.2001.a: "Gold. The universal solvent."
 POD_impundulu.2001.b: "A favor. I owe them one."
 POD_impundulu.2001.c: "Our own secrets. The Cenotaph and Haunting paths."
 POD_impundulu_exchange_offer_gold_tt: "You will pay 200 gold for the necromantic knowledge."
 POD_impundulu_exchange_offer_favor_tt: "You will owe them a favor (hook) in exchange for the knowledge."
 POD_impundulu_exchange_offer_secrets_tt: "You will share Impundulu necromancy secrets in exchange. They gain access to Cenotaph/Haunting paths."
 POD_impundulu.2002.t: "Knowledge Exchanged"
 POD_impundulu.2002.desc: "The exchange is complete. Nights of careful discussion, shared rituals, and guarded demonstrations have borne fruit. We have glimpsed their approach to the necromantic arts — a perspective different from our own, yet undeniably powerful.\n\nA new path of death opens before us."
 POD_impundulu.2002.a: "The dead speak in many tongues. Now I understand one more."
 POD_impundulu_exchange_success_tt: "You learn the target's necromancy path at level 1. They gain a 'Fellow Scholar of Death' opinion modifier toward you."
 POD_impundulu_learned_giovanni_necromancy_tt: "You have learned the Giovanni school of Necromancy."
 POD_impundulu_learned_cappadocian_necromancy_tt: "You have learned the Cappadocian school of Necromancy."
 POD_impundulu_learned_harbinger_necromancy_tt: "You have learned the Harbinger school of Necromancy."
 POD_impundulu_learned_lamia_necromancy_tt: "You have learned the Lamia school of Necromancy."
 POD_impundulu_learned_nagaraja_necromancy_tt: "You have learned the Nagaraja school of Necromancy."
 POD_impundulu_learned_rosselini_necromancy_tt: "You have learned the Rosselini school of Necromancy."