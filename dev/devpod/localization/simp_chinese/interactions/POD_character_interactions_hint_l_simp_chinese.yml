l_simp_chinese:
 POD_hint_fog_of_war_interaction: "#difficulty_hard Unknown Character#!"
 POD_hint_fog_of_war_interaction_desc: "You don't know this character, not even by reputation."
 POD_hint_apocalyptic_interaction: "#difficulty_hard Eternal Slumber#!"
 POD_hint_apocalyptic_interaction_desc: "No one knows this character's whereabouts. They are, for all intents and purposes, lost forever."
 POD_hint_torpor_interaction: "#difficulty_hard Slumbering#!"
 POD_hint_torpor_interaction_desc: "This character is in a catatonic state, making almost all interactions impossible."
 POD_hint_umbra_interaction: "#difficulty_hard Across the Shroud#!"
 POD_hint_umbra_interaction_desc: "One of the characters involved in this interaction is in the [umbra|E], making communication impossible. You could circumvent this limitation if both of you had a way to communicate with beings on the other side."
 POD_hint_wight_interaction: "#difficulty_hard Feral#!"
 POD_hint_wight_interaction_desc: "This character has lost their mind completely. All they can do now is act on pure animalistic instinct."
 POD_hint_robotic_interaction: "#difficulty_hard Artificial Construct#!"
 POD_hint_robotic_interaction_desc: "This being was animated through some form of magic. They can perform simple tasks and follow orders, but not much else."
 POD_hint_hostile_splat_interaction: "#difficulty_hard Hostile Splat#!"
 POD_hint_hostile_splat_interaction_desc: "This character considers your [splat|E] their mortal enemy. They have no interest in diplomatic dealings with your kind."