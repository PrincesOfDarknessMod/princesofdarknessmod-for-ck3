l_simp_chinese:
 POD_hint_fog_of_war_interaction: "#difficulty_hard 未知角色#!"
 POD_hint_fog_of_war_interaction_desc: "你不认识这个角色，甚至从未听说过其名号。"
 POD_hint_apocalyptic_interaction: "#difficulty_hard 永恒沉眠#!"
 POD_hint_apocalyptic_interaction_desc: "无人知晓[recipient.GetShortUINamePossessive]下落。无论从何种意义上说，[recipient.GetSheHe|U]都已永远迷失。"
 POD_hint_torpor_interaction: "#difficulty_hard 沉睡中#!"
 POD_hint_torpor_interaction_desc: "[recipient.GetShortUIName] 处于僵直状态，几乎无法进行任何互动。"
 POD_hint_umbra_interaction: "#difficulty_hard 尸幕彼端#!"
 POD_hint_umbra_interaction_desc: "您或 [recipient.GetShortUIName] 正处于[umbra|E]中，导致无法沟通。\n\n若双方都具备与彼界存在沟通的能力，则可规避此限制"
 POD_hint_wight_interaction: "#difficulty_hard 兽化#!"
 POD_hint_wight_interaction_desc: "[recipient.GetShortUIName]已完全丧失[recipient.GetHerHis]理智，如今[recipient.GetSheHe]只能凭纯粹兽性本能行事。"
 POD_hint_robotic_interaction: "#difficulty_hard 人造构体#!"
 POD_hint_robotic_interaction_desc: "此存在通过某种魔法被赋予活动能力。其能执行简单任务并遵循指令，但仅止于此。"
 POD_hint_hostile_splat_interaction: "#difficulty_hard 敌对血族#!"
 POD_hint_hostile_splat_interaction_desc: "这个角色视你的[splat|E]为死敌，拒绝与你的族群进行任何外交接触。"
 POD_hint_dummy_interaction: "#difficulty_hard 模组守护者#!"
 POD_hint_dummy_interaction_desc: "[recipient.GetShortUIName]必须存在才能使本模组中的某些脚本正常工作。如果你在宫廷中看到[recipient.GetHerHim]，只需微笑并挥手。[recipient.GetSheHe|U]很快就会消失。"
 POD_hint_umbra_trapped_interaction: "#difficulty_hard 被困在影界#!"
 POD_hint_umbra_trapped_interaction_desc: "[recipient.GetShortUIName]被困在[umbra|E]的危险区域。\n\n除非你能设法将[recipient.GetHerHim]救出，否则无法进行任何联系。"