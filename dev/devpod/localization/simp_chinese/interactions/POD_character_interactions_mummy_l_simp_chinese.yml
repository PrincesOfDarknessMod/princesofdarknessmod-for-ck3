 POD_elixir_of_eternal_life_interest_tt: "以下条件至少满足一项：\n$EFFECT_LIST_BULLET$拥有[GetTrait('eternal_rebirth_seeker').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$是[GetTrait('wutian').GetName( GetNullCharacter )]、[GetTrait('wukuei').GetName( GetNullCharacter )]或[GetTrait('kueijin').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$是[GetTrait('sorcerer').GetName( GetNullCharacter )]，或拥有至少#color_white 20#![crafting_brewing|E]#weak （[GetTrait('pod_crafter').GetName( GetNullCharacter )]）#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[faith|E]拥有[GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName]\n$EFFECT_LIST_BULLET$[faith|E]拥有[GetFaithDoctrine('special_doctrine_against_to_yomi_wan_hostility').GetBaseName]\n$EFFECT_LIST_BULLET$[faith|E]拥有[GetFaithDoctrine('special_doctrine_allied_to_yomi_wan_hostility').GetBaseName]\n$EFFECT_LIST_BULLET$信奉[GetReligionFamily('rf_kueijin').GetName]的[religion|E]\n$EFFECT_LIST_BULLET$宗教为东方宗教，例如#TOOLTIP:RELIGION,demon_hunters_religion #L 狩魔人#!#!#!或#TOOLTIP:RELIGION,roadofunexaminedhorizons_religion #L 未勘之路#!#!#!"
 POD_elixir_of_eternal_life_teach_interaction_knowledge_requirement: "[recipient.GetShortUINameNoTooltip]必须#TOOLTIP:POD_elixir_of_eternal_life_understanding_tt #L 能够理解长生不老药（详见提示）#!#!"
 POD_elixir_of_eternal_life_understanding_tt: "以下条件至少满足一项：\n$EFFECT_LIST_BULLET$[GetTrait('eternal_rebirth_seeker').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[learning_i][learning|E]#color_white 20#!+\n$EFFECT_LIST_BULLET$[GetTrait('education_learning_4').GetName( GetPlayer )]或[GetTrait('education_learning_5').GetName( GetPlayer )]\n$EFFECT_LIST_BULLET$至少#color_white 20#![crafting_brewing|E]#weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#![trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[faith|E]拥有[GetFaithDoctrine('tenet_knowledge_above_all').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTrait('sorcerer').GetName( GetPlayer )]或[GetTrait('bloodsorceryadvanced').GetName( GetPlayer )]\n$EFFECT_LIST_BULLET$[GetPerk( 'chi_arts_chi_mastery_perk' ).GetName( GetPlayer )]或[GetPerk( 'way_of_ten_thousand_cities_perk' ).GetName( GetPlayer )]\n$EFFECT_LIST_BULLET$#TOOLTIP:POD_is_scholarly_tt #L 具有学者特质（详见提示）#!#!"
 POD_elixir_of_eternal_life_teach_interaction_cant_teach_requirement: "#color_white 你#!必须愿意并且能够传授长生不老药"
 POD_request_to_be_neteru_interaction: "成为奈特鲁"
