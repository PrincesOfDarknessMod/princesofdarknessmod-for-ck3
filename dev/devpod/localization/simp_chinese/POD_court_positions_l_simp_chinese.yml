 cairo_brujah_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_raya_04').GetName]"
 brujah_primogen_court_position: "布鲁赫参议"
 brujah_primogen_court_position_desc: "按照传统，$brujah_primogen_court_position$负责一个地区的战略战争，尽管他们有时也会涉足学术研究，忠实于他们战士学者的称号。\n\n#help 有关[aptitude|E]需求，参见[brujah_primogen|E]。#!"
 cappadocian_primogen_court_position: "卡帕多西亚参议"
 cappadocian_primogen_court_position_desc: "很少有人像卡帕多西亚那样对不死族的状况了解得这么多。如果他们愿意谈的话，可以从他们那里学到很多东西。\n\n#help 有关[aptitude|E]需求，参见[cappadocian_primogen|E]。#!"
 lasombra_primogen_court_position: "勒森魃参议"
 lasombra_primogen_court_position_desc: "暗影大师是你身边的有用的盟友，但如果与之交恶，则是更致命的敌人。\n\n#help 有关[aptitude|E]需求，参见[lasombra_primogen|E]。#!"
 toreador_primogen_court_position: "妥芮朵参议"
 toreador_primogen_court_position_desc: "每个有自尊的宫廷都有一个有才华的妥芮朵来处理其聚会。不过，“才华”的定义有时可能会引起争议。\n\n#help 有关[aptitude|E]需求，参见[toreador_primogen|E]。#!"
 tzimisce_primogen_court_position: "棘秘魑参议"
 tzimisce_primogen_court_position_desc: "当一名客人不再受欢迎，但你仍然需要其回答几个问题时……你知道该找谁。\n\n#help 有关[aptitude|E]需求，参见[tzimisce_primogen|E]。#!"
 ventrue_primogen_court_position: "梵卓参议"
 ventrue_primogen_court_position_desc: "所谓的黑夜统治者期望有大量的权力和责任赋予他们，即使他们并不配拥有这些权力。\n\n#help 有关[aptitude|E]需求，参见[ventrue_primogen|E]。#!"
 assamite_primogen_court_position: "哈基姆圣裔参议"
 assamite_primogen_court_position_desc: "哈基姆的子嗣们很尽责，是为了共同事业而遵守纪律的典范。大部分时间如此。\n\n#help 有关[aptitude|E]需求，参见[assamite_primogen|E]。#!"
 gangrel_primogen_court_position: "冈格罗参议"
 gangrel_primogen_court_position_desc: "冈格罗从不远离他们的群落，随时准备为他们提供帮助或阻挠。\n\n#help 有关[aptitude|E]需求，参见[gangrel_primogen|E]。#!"
 malkavian_primogen_court_position: "末卡维参议"
 malkavian_primogen_court_position_desc: "预言家并不能控制预兆，但也许最好还是让他们站在你这边。\n\n#help 有关[aptitude|E]需求，参见[malkavian_primogen|E]。#!"
 nosferatu_primogen_court_position: "诺斯费拉图参议"
 nosferatu_primogen_court_position_desc: "让诺斯费拉图帮你的忙总是一个好主意。困难在于真正确保他们是站在你这边的……\n\n#help 有关[aptitude|E]需求，参见[nosferatu_primogen|E]。#!"
 ravnos_primogen_court_position: "雷伏诺参议"
 ravnos_primogen_court_position_desc: "分裂和不和的家庭仍然是一个家庭。\n\n#help 有关[aptitude|E]需求，参见[ravnos_primogen|E]。#!"
 setite_primogen_court_position: "赛特之子参议"
 setite_primogen_court_position_desc: "信仰之氏族可以在精神上引导你，但也许不能达到你所希望的结局。\n\n#help 有关[aptitude|E]需求，参见[setite_primogen|E]。#!"
 tremere_primogen_court_position: "睿魔尔参议"
 tremere_primogen_court_position_desc: "篡位者带来了大量的礼物，也带来了更多的诅咒。\n\n#help 有关[aptitude|E]需求，参见[tremere_primogen|E]。#!"
 salubri_primogen_court_position: "萨洛比参议"
 salubri_primogen_court_position_desc: "牧人者正在死去，但他们的职责依然存在。\n\n#help 有关[aptitude|E]需求，参见[salubri_primogen|E]。#!"
 gargoyle_primogen_court_position: "石像鬼参议"
 gargoyle_primogen_court_position_desc: "当你需要实施突然的暴力袭击时，石像鬼就是你需要的人。\n\n#help 有关[aptitude|E]需求，参见[gargoyle_primogen|E]。#!"
 aphrodisiac_celebrant_court_position: "美神节司仪"
 aphrodisiac_celebrant_court_position_desc: "一个被激烈竞争的社会政治职位，美神节司仪有主持美神节的荣誉，在那天，罪人用非常活跃和堕落的庆典来庆祝春天的到来。"
 lord_of_misrule_court_position: "狂宴之王"
 lord_of_misrule_court_position_desc: "在农神节期间当选的狂宴之王拥有完全的豁免权，并利用它来嘲笑和贬低该地区所有既定的该隐之子政权。"
 hidden_minister_of_jade_court_position: "玉部尚书"
 hidden_minister_of_jade_court_position_desc: "玉部尚书为皇朝收集和分配资金，无论是传统的凡人货币还是玉石。"
 hidden_minister_of_rites_court_position: "礼部尚书"
 hidden_minister_of_rites_court_position_desc: "礼部尚书负责监督广泛的活动，包括确保当地的暗战公正和公平执行。该职位还负责保障该地区的风水以及龙穴和脉络的整体活力。"
 hidden_minister_of_shen_court_position: "神部尚书"
 hidden_minister_of_shen_court_position_desc: "神部尚书是一个具有双重目的的外交职位。这个职位的公开目的是维持与本地鬼神的关系。然而，这个职位的私人目的是向至尊老祖提供敌对鬼神的可利用弱点。"
 hidden_minister_of_war_court_position: "兵部尚书"
 hidden_minister_of_war_court_position_desc: "当所有其他方法都失败，公开冲突不可避免时，兵部尚书往往是指挥地区万鬼部队打击敌人的将军。"
 hidden_minister_of_the_garden_court_position: "苑部尚书"
 hidden_minister_of_the_garden_court_position_desc: "苑部尚书负责处理地区的凡人事务，保障“民众的适当和优良的福祉”。"
 hidden_minister_of_hushed_lanterns_court_position: "宵部尚书"
 hidden_minister_of_hushed_lanterns_court_position_desc: "宵部尚书是麻烦处理者，处理“令人不快的问题”和至尊老祖或尚书们不想直接处理的尴尬情况。"
 minister_of_jade_court_position: "玉部司"
 minister_of_jade_court_position_desc: "玉部司与地方财政打交道，负责收取地区税收和要交给她上头的玉部尚书的贡品。"
 minister_of_rites_court_position: "礼部司"
 minister_of_rites_court_position_desc: "礼部司监督当地的暗战，如果没有郡城老祖来处理这些职责，他将帮助决定冲突的胜利者。"
 minister_of_shen_court_position: "神部司"
 minister_of_shen_court_position_desc: "神部司每每是神部尚书在与鬼神打交道时的大使，尽管至尊皇朝正式将他视为该地区神部尚书的助手。"
 minister_of_war_court_position: "兵部司"
 minister_of_war_court_position_desc: "如果兵部尚书是将军，那么兵部司则是他的助手。兵部司与实际的战斗没有什么关系，相反，他是尚书的眼睛、耳朵和喉舌，尚书通过他来发布命令，并通过他来获得信息。"
 minister_of_the_garden_court_position: "苑部司"
 minister_of_the_garden_court_position_desc: "苑部司代表为尚书监督当地的凡人问题，直到尚书认为情况严重到需要他亲自关注。"
 yin_ambassador_court_position: "阴使"
 yin_ambassador_court_position_desc: "阴使为当地老祖服务，作为她与当地[UmbraGlossaryLocalized('shadowlands','阴界')]及其可怕的诸界域的桥梁。"
 yang_ambassador_court_position: "阳使"
 yang_ambassador_court_position_desc: "阳使是阴使的类似物，提供了通往充满活力和生机的[Glossary('阳界','game_concept_yang_world_desc')]的桥梁。"
 first_oni_court_position: "鬼首"
 first_oni_court_position_desc: "鬼首类似于战将，负责主管地区安全，保护其不受恶鬼和[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]的影响，通常会领导针对敌人的制裁战役。"
 infant_devil_civilizer_court_position: "幼鬼太傅"
 infant_devil_civilizer_court_position_desc: "父母的温和劝说有其时间和地点，但在驯服那些从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]归来的野生$pod_kueijin$时却没有这样的时间。幼鬼太傅是各地方幼鬼点化社团的监督者，他们致力于将这些重返阳世的魂灵开化，引渡，并护送至最近的皇朝。"
 master_rite_court_position: "仪式掌控者"
 master_rite_court_position_desc: "$master_rite_court_position$是负责圣地的精神健康。所有要举办的仪式必须首先获得他们的批准。"
 gatekeeper_court_position: "守门人"
 gatekeeper_court_position_desc: "$gatekeeper_court_position$很可能是新来者遇到的第一个人。守门人负责收集来访者的贡品和信息，他们往往相当忙碌，因为维护月桥也是他们的责任。"
 wyrm_foe_court_position: "$glossary_wyrm$之敌"
 wyrm_foe_court_position_desc: "$wyrm_foe_court_position$是族群最凶猛的战士，不一定是最熟练的，但肯定是最热衷的。在对妖蛆的爪牙采取进攻行动时，他们作为族群领袖的副指挥。"
 talesinger_court_position: "唱书人"
 talesinger_court_position_desc: "$talesinger_court_position$负责维护圣地的声誉，创作和表演圣地英雄们的伟大事迹的故事或歌曲。他们还将狼族的历史传给年轻人。"
 master_challenges_court_position: "决斗掌控者"
 master_challenges_court_position_desc: "$master_challenges_court_position$在圣地发生的决斗中担任裁判。其等是令人生畏的人物，他们也被要求在和平时期维持战士们的秩序。"
 court_seer_court_position: "[SelectLocalization(GetPlayer.IsValid, 'court_seer_court_position_from_player', 'custom_court_seer')]"
 court_seer_court_position_from_player: "[GetPlayer.Custom('CourtSeer')]"
 custom_court_seer: "宫廷先知"
 custom_court_seer_oracle: "宫廷神谕"
 custom_court_seer_augur: "宫廷占兆官"
 court_seer_court_position_desc: "$court_seer_court_position$预见未来，决定举行官方活动的日子是否吉利。"
 minister_eagles_court_position: "鹰部"
 minister_eagles_court_position_desc: "鹰部专门研究任何类型的信息，无论是关于凡人设施和政治局势的世俗信息，还是他们被监禁前的失落传说，或是可能威胁到王庭的超自然活动。"
 minister_aurochs_court_position: "牛部"
 minister_aurochs_court_position_desc: "牛部，也被称为护卫者，其任务是保卫王庭并执行其法律。他们还保护高阶堕天者免受敌对恶魔的暗杀企图。"
 minister_dragons_court_position: "龙部"
 minister_dragons_court_position_desc: "龙部的使命是质疑和挑战权威。他们必须时刻注意腐化和背叛的迹象。恶魔们被鼓励在他们的交易中保持谨慎，监察官确保每个恶魔体内驱使他们反对上帝的叛逆火花被引导到更有建设性的地方。"
 minister_dust_court_position: "尘部"
 minister_dust_court_position_desc: "尘部的使命是保管凡人群众，以及推动王庭的发展。他们管理凡人机构，使他们远离王庭的基础设施，并通过支持宗教机构或管理城市，使人们更加紧紧依赖他们的迷信，从而增加人口中的普遍信仰量。"
 minister_swords_court_position: "狮部"
 minister_swords_court_position_desc: "狮部负责对抗对王庭的威胁，管理王庭的精英士兵。由于与愤怒之年相比，公开使用暴力和展示武力受到限制，所谓的“利剑”必须小心翼翼地履行其职责。"
 brujah_warmaster_court_position: "布鲁赫战帅"
 brujah_warmaster_court_position_desc: "$brujah_warmaster_court_position$是自古以来的新生布鲁赫的战斗导师。然而氏族已经衰落到如此程度，这传统也大多被遗忘了，但有些人仍然坚持这个传统，强迫稚子在进入宫廷后接受彻底的、近乎斯巴达式的训练。"
 underworld_ambassador_court_position: "冥界大使"
 underworld_ambassador_court_position_desc: "[UmbraGlossaryLocalized('shadowlands','冥界')]大使为当地统治者服务，作为她与当地[UmbraGlossaryLocalized('shadowlands','冥界')]的桥梁。"
 umbra_ambassador_court_position: "影界大使"
 umbra_ambassador_court_position_desc: "[umbra|E]大使为当地统治者服务，作为她与当地[umbra|E]的桥梁。"
 trod_wayfarer_court_position: "仙路旅人"
 trod_wayfarer_court_position_desc: "仙路是妖精与[UmbraGlossary('dreaming')]与[UmbraGlossary('arcadia')]的最近的联系点。它们也是力量。那些控制着仙路的人对妖精社会拥有巨大的控制力。"
 touchstones_court_position: "心眷"
 touchstones_court_position_desc: "心眷是吸血鬼与凡人世界的纽带，代表着一种他们珍视自己的心态。心眷必须是一个活着的人类。这个心眷可以是一位幸存的伴侣或家庭成员，与吸血鬼在早期亡生之前曾杀害过的某人有关，甚至只是他们经常遇到的某个人。\n由于与凡人世界的脱节，有些血族甚至可能选择一个不知道他们存在的心眷，而是选择潜伏并观察那个人，以保持他们与人性的联系。"
 alastor_court_position: "阿拉斯托"
 alastor_court_position_desc: "阿拉斯托是秘盟的一名血族派员，负责追捕咒逐：这些危险的吸血鬼已被列入秘盟的红名单，成为整个党派的消灭目标。"
 alastor_court_employer_custom_effect_description: "允许派遣阿拉斯托去猎杀咒逐来获得赏金。"
 praetor_court_position: "司法官"
 praetor_court_position_desc: "司法官，或项目领导者，是用来描述那些被赋予权力管理同僚的著名辅政官的术语。这个职位的任期通常与任务期限相同，但有些人仍以这个头衔为荣。"
 dogcatcher_court_position: "捕犬者"
 dogcatcher_court_position_desc: "捕犬者是一个非正式的称号，指的是那些习惯于对付狼人，对狼人的能力、习性和社会的了解远远超过其他吸血鬼的辅政官。"
 doppelganger_court_position: "二重身"
 doppelganger_court_position_desc: "二重身是一种非正式的称谓，指的是为了完成特定任务而采用深度卧底身份的辅政官。"
 josian_court_position: "约西亚派"
 josian_court_position_desc: "约西亚派是猎杀崇魔者的辅政官。他们还致力于铲除火焚末日邪教，同时秘密调查已发现的挪得学家知识，以寻找火焚末日可能是真正危险的证据。"
 quaesitor_court_position: "判官"
 quaesitor_court_position_desc: "判官是辅政官的一个分支，他们几乎都是睿魔尔吸血鬼。他们负责满足秘盟在术法方面的所有需求，无论是打击魔宴的库都术师、打击法师，还是猎杀叛逆睿魔尔。"
 oathsworn_mount_court_position: "约誓坐骑"
 oathsworn_mount_court_position_desc: "向妖精领主宣誓的[GetTrait('pooka').GetName( GetPlayer )]（有大型动物亲缘）或[GetTraitGroup('fera').GetName()][courtier|E]可以作为该君主的智能坐骑。"
 oathsworn_mount_employer_custom_effect_description: "根据[aptitude|e]提升旅行速度和行军速度。"
 strategoi_court_position: "军区将军"
 strategoi_court_position_desc: "军区将军们有效地管理着督政会日常事务的运作。每位负责督政会统治区的不同部分。从早到晚，军区将军们除了满足自己的需求和尊严之外，还要监督本地区的梵卓商业和政治事务。"
 lictor_court_position: "刀斧手"
 lictor_court_position_desc: "刀斧手是督政会的疑难解决者，这些梵卓被派去处理威胁氏族的问题。这种广泛的使命也导致他们需要广泛的技能，但大多数 刀斧手最终都成为了前线战士。他们的技能程度足以胜任，但并不重要到足以让人在意他们是否会因公殉职。"
 tribunes_court_position: "护民官"
 tribunes_court_position_desc: "督政会在世界各地维持着一个松散的人脉网和“外勤特工”。这些血族既被称为护民官，也被称为特工，他们在世界各地充当着督政的耳目。"
 POD_spread_legitimacy: "传播正统性"
 POD_spread_legitimacy_desc: "该角色的任务是在特定区域代表其[liege|E]，解决特定问题或成为领地某个地区的代言人。"
 POD_tribute_collecting: "收集贡品"
 POD_tribute_collecting_desc: "该角色的任务是确保领地中的每个人都向统治者表达适当的敬意和贡品，无论是通过魅力、武力还是良好的行政意识。"
 POD_war_preparations: "战争准备"
 POD_war_preparations_desc: "该角色的任务是确保领地中的中的每个人都做好了随时开战的准备，无论是通过魅力、武力还是良好的行政意识。"
 POD_vassal_handler: "下放权力"
 POD_vassal_handler_desc: "该角色的任务是在遥远的领地代表其的[liege|E]，确保即使是边疆地区也能感受到与中央的联系。"
 POD_home_seneschal: "巩固统治"
 POD_home_seneschal_desc: "该角色的任务是确保领地中心的一切顺利运行，而其的领主则可以专注于更重要的全局事务。"
 POD_home_builder: "改善统治"
 POD_home_builder_desc: "该角色的任务是确保即使领主不在身边，领民也能感受到领主的影响力。"
 POD_home_defender: "守护统治"
 POD_home_defender_desc: "该角色的任务是不惜一切代价保卫其领主的领地。"
 POD_stress_relief: "娱乐大师"
 POD_stress_relief_desc: "该角色的任务是确保为宫廷及其统治者提供的娱乐活动始终准备充分。"
 POD_spread_prestige: "传扬史诗传说"
 POD_spread_prestige_desc: "这个角色的任务是传播关于其领主的令人印象深刻的故事。有些甚至是真的。"
 POD_spread_piety: "传扬虔诚传说"
 POD_spread_piety_desc: "该角色的任务是传播其领主所做的令人印象深刻的虔诚壮举。有些甚至是真的。"
 POD_help_schemes: "帮助黑幕交易"
 POD_help_schemes_desc: "这个角色会为你的不光彩交易提供一些非官方帮助。"
 POD_organize_champions: "组织斗士"
 POD_organize_champions_desc: "这个角色可以帮助招募和管理领主的仪仗队。"
 POD_organize_retinue: "组织扈从"
 POD_organize_retinue_desc: "这个角色帮助招募和管理领主的精锐部队。"
 POD_organize_plasmic: "组织灵质体"
 POD_organize_plasmic_desc: "这个角色帮助招募和训练领主的灵质体。"
 POD_organize_wraith: "组织死灵"
 POD_organize_wraith_desc: "这个角色帮助招募和训练领主的死灵。"
 POD_organize_demonic: "组织魔族"
 POD_organize_demonic_desc: "这个角色帮助招募和训练领主的魔族。"
 POD_organize_spirit: "组织灵类"
 POD_organize_spirit_desc: "这个角色帮助招募和训练领主的灵类。"
 POD_organize_bygone: "组织逝兽"
 POD_organize_bygone_desc: "这个角色帮助招募和训练领主的逝兽。"
 POD_organize_chimera: "组织奇魅"
 POD_organize_chimera_desc: "这个角色帮助招募和训练领主的奇魅。"
 POD_organize_faerie: "组织妖精"
 POD_organize_faerie_desc: "这个角色帮助招募和训练领主的妖精。"
 imperial_envoy_court_position: "帝国特使"
 imperial_envoy_court_position_desc: "$imperial_envoy_court_position$在遥远的边疆代表他们的领主，提醒即使远在异国他乡也要进贡。"
 imperial_chancellor_court_position: "帝国财相"
 imperial_chancellor_court_position_desc: "$imperial_chancellor_court_position$确保他们的领主的声音被正确地听到。必要时，即使是怒斥也可以披上合法的外衣。"
 imperial_minister_court_position: "帝国首相"
 imperial_minister_court_position_desc: "$imperial_minister_court_position$帮助管理领地的日常事务（或夜常事务）。随着其领主的影响力不断扩大，他们的任务也变得越来越重要。"
 hanshii_arbiter_court_position: "汉什仲裁者"
 hanshii_arbiter_court_position_desc: "汉什是巴斯特文化的支柱，是用于娱乐或决定领土权利的仪式性战斗。这些比赛可能是猜谜游戏、正式决斗或爪牙对战。"
 seline_oracle_court_position: "塞勒涅神谕"
 seline_oracle_court_position_desc: "作为抚慰众生的盖亚姊妹，月亮显然偏爱猫人，并将它们视为自己最美妙的造物。她孕育了化形种族并将其作为给地球的礼物，而传言称她的身躯是所有芭丝特的最后庇护所。"
 master_taghairm_court_position: "塔格海姆大师"
 master_taghairm_court_position_desc: "塔格海姆是一种猫族聚会，常被召集以交换信息或寒暄。其通常在月圆之夜进行。"
 warleader_taklah_court_position: "塔喀赫的战将"
 warleader_taklah_court_position_desc: "塔喀赫是一支由所有猫族精英组成的随从团队，为了共同的目标而聚集在一起。"
 guardian_yava_court_position: "雅瓦的守护者"
 guardian_yava_court_position_desc: "雅瓦是一个部族的秘密，对外人严格保密，据说如果被外人得知，就能赋予对方对你的控制力。这是芭丝特传说中保护得最严密的，只有在最极端的情况下才会被暴露，即使是这样、也极为罕见。"
 ratcatcher_court_position: "抓鼠人"
 ratcatcher_court_position_desc: "$ratcatcher_court_position$的职责是牧养鼠群，确保它们可以食用，并把它们关在笼子里，为宫廷里不那么幸运的吸血鬼们提供$pod_vitae$。"
 scarlet_screen_family_court_position: "家族障幕"
 scarlet_screen_family_court_position_desc: "最重要的障幕。像幽影颂这样的[Glossary('心法','podgloss.dharma')]甚至将守护家族视为己任。此外，$POD_splat_kueijin$的凡人亲属往往是最忠诚的支持者。\n\n#help [aptitude|E]的[court_position|E]基于家族关系。"
 scarlet_screen_inugumi_court_position: "犬幢障幕"
 scarlet_screen_inugumi_court_position_desc: "士兵是最显眼的障幕，常以犯罪团伙或为$POD_splat_kueijin$提供武器等物资的人员形式存在。他们分为三类，其中\"犬幢\"更为忠诚，有时甚至能接触超自然事物。\n\n#help [aptitude|E]的[court_position|E]基于[martial|E][education|E]等级。"
 scarlet_screen_ryugumi_court_position: "龙军障幕"
 scarlet_screen_ryugumi_court_position_desc: "士兵是最显眼的障幕，常以犯罪团伙或为$POD_splat_kueijin$提供武器等物资的人员形式存在。他们分为三类，其中\"龙军\"经过专门训练，旨在对抗对其$POD_splat_kueijin$主人构成的高危威胁。\n\n#help [aptitude|E]的[court_position|E]基于[prowess|E][education|E]等级。"
 scarlet_screen_artisans_court_position: "匠师障幕"
 scarlet_screen_artisans_court_position_desc: "工匠通过民事手段（与士兵的作为形成对比）扩大主人在城市中的影响力，并以自身学识激励其他障幕成员。\n\n#help [aptitude|E]的[court_position|E]基于[learning|E][education|E]等级。"
 scarlet_screen_peasants_court_position: "民众障幕"
 scarlet_screen_peasants_court_position_desc: "负责保护$POD_splat_kueijin$安全的民众。在[Glossary('第五纪元','game_concept_fifth_age_desc')]，地方政治团体也被归类为“民众”。\n\n#help [aptitude|E]的[court_position|E]基于[diplomacy|E][education|E]等级。"
 scarlet_screen_spies_court_position: "细作障幕"
 scarlet_screen_spies_court_position_desc: "细作分为两类。常规密探负责情报收集。\n\n#help [aptitude|E]的[court_position|E]基于[intrigue|E][education|E]等级。"
 scarlet_screen_merchants_court_position: "商贾障幕"
 scarlet_screen_merchants_court_position_desc: "商人负责满足$POD_splat_kueijin$的财务需求。\n\n#help [aptitude|E]的[court_position|E]基于[stewardship|E][education|E]等级。"
 cult_leader_court_position: "密教领袖"
 cult_leader_court_position_desc: "$POD_splat_demon$个人密教的领袖与导师，负责凝聚信仰。这些教徒在主人的教派中地位特殊，处理日常事务，让恶魔专注于更重要的事宜。\n#help 此[court_position|E]的[aptitude|E]基于[stewardship|E]、[intrigue|E]和[learning|E]，以及[GetTrait('schemer').GetName(GetNullCharacter)]和[GetTrait('diligent').GetName(GetNullCharacter)][traits|E]。"
 court_position_auspice_trait: "月兆"
 fell_knight_court_position: "堕天骑士"
 fell_knight_court_position_desc: "身负创世之初传承的赐权仪式之力，堕天骑士是其堕天使主君麾下的钢铁重拳。"