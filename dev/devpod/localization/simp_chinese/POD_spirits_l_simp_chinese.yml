 learn_language_outcome_success.spirits.desc: "灵性语言与其使用者一般变幻莫测。有些尚可辨识规律，有些则全然无迹可寻。所幸最广为流传的那些往往经历了与凡人语言相似的演化历程，逐渐变得流线型以便非灵体存在使用。\n毕竟，诸灵与访客交涉时也需被理解。不过，那些最狡猾的灵体很可能也会利用自身语言的精妙之处，试图在谈判中占据上风。\n正因如此，你才未雨绸缪，学习了可谓更偏门的词汇，但愿能避免未来误解灵界契约的命运。"
 learn_language_outcome_failure.spirits.desc: "“费了九牛二虎之力……还是白忙一场！这门灵性语言根本#EMP 不可能#!学会！不管我怎么努力，说起话来都像个没断奶的娃娃，结结巴巴活像个傻子！\n\n呸！纯粹是浪费时间……”"
