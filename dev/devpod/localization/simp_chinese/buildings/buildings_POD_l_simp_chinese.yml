l_simp_chinese:
 building_type_blood_tax_01: "血税"
 building_type_blood_tax_01_desc: "#F 你正确保你的臣民们正在工作，直到他们咽下最后一口气。#!"
 building_blood_tax_01: "宽松的血税"
 building_blood_tax_01_desc: "你在这里公开向凡人们征税，但这不是促进伯爵领经济繁荣的最合理计划。"
 building_blood_tax_02: "沉重的血税"
 building_blood_tax_02_desc: "在你的统治下凡人正在为钱流血。虽然只在他们幸运的情况下。"
 building_blood_tax_03: "严荷的血税"
 building_blood_tax_03_desc: "你的金库正在迅速的被填充。你在统治一片贫瘠之地又怎样？"
 building_type_open_rule_01: "公开统治"
 building_type_open_rule_01_desc: "#F 没有你的坚定领导，无助的凡人没有任何益处。奇怪的是，他们似乎并不都赞同这个显而易见的事实。#!"
 building_open_rule_01: "强硬统治"
 building_open_rule_01_desc: "你是这片土地的主人，无论是对于吸血鬼还是其他种族。你是被敬畏的，但是反叛的声音开始增长了。"
 building_open_rule_02: "迫压统治"
 building_open_rule_02_desc: "凡人们坐等着每夜的一个处决。至少，在他们认为你听得到他们的时候……"
 building_open_rule_03: "暴政统治"
 building_open_rule_03_desc: "凡人是牲畜，在你的恐惧和绝望的国度亦被视为此。他们会抓住任何机会来拯救自己。"
 building_type_forced_conscription_01: "强制征兵"
 building_type_forced_conscription_01_desc: "#F 你给了你国度所有人在你军队服务的荣誉。遗憾的是，这会使你的下仆实际掌控伯爵领的能力过度膨胀。#!"
 building_forced_conscription_01: "小幅征兵效果"
 building_forced_conscription_01_desc: "你的一些人在外面，说服人们为你而死实际上是一件好事。"
 building_forced_conscription_02: "正规征兵效果"
 building_forced_conscription_02_desc: "在你的国度里，到处都是征兵中心，不参加是不可能的。"
 building_forced_conscription_03: "大规模征兵效果"
 building_forced_conscription_03_desc: "他们贡献服务并到时再死，但不是现在就死。"
 building_type_night_terror_01: "夜之猎手"
 building_type_night_terror_01_desc: "#F 带着你的仆群在晚上四处觅食是你的天性，你无法抗拒这种出门猎食猎物的渴望。#!"
 building_night_terror_01: "夜之敬畏"
 building_night_terror_01_desc: "当你屈服在你的欲望时，人们就会不断消失。你对伯爵领的控制力降低了，但是你的仆群增多了。"
 building_night_terror_02: "夜之恐怖"
 building_night_terror_02_desc: "在频繁的掠食之间，你几乎无法恢复理智并统治自己的国度。"
 building_night_terror_03: "夜之惊骇"
 building_night_terror_03_desc: "你的仆群是唯一真理。其他人都是将被掠食的猎物。"
 building_type_influence_noble_01: "掌控贵族"
 building_type_influence_noble_01_desc: "#F 通过影响、勒索和诱惑，你可以密切关注这伯爵领的凡人统治阶级。这样做会抑制其他凡人和黄金流动。#!"
 building_influence_noble_01: "轻度贵族掌控"
 building_influence_noble_01_desc: "这种程度的影响，已经开始破坏统治阶级的凝聚力，削弱他们的军事意识。"
 building_influence_noble_02: "显著贵族掌控"
 building_influence_noble_02_desc: "你对他们的控制越来越大，但从局外人的角度来看，事情开始恢复正常。"
 building_influence_noble_03: "重度贵族掌控"
 building_influence_noble_03_desc: "统治阶级可能不知道，但他们现在是你的了，并且无人怀疑。"
 building_type_influence_underworld_01: "掌控下层社会"
 building_type_influence_underworld_01_desc: "#F 你可以从这个地区的法外之徒身上榨取很多利益，无论是金钱还是为你的精锐卫队雇佣经验丰富的新兵。然而，煽动犯罪团伙也有其缺点。#!"
 building_influence_underworld_01: "轻度下层社会掌控"
 building_influence_underworld_01_desc: "帮助罪犯已经开始让你赚钱了。但这也激怒了当地的民众。"
 building_influence_underworld_02: "显著下层社会掌控"
 building_influence_underworld_02_desc: "有了你的指导，你的恶棍团伙制造的不必要的麻烦越来越少，赚取的利润越来越多。"
 building_influence_underworld_03: "重度下层社会掌控"
 building_influence_underworld_03_desc: "你已经尽可能地压制了你的犯罪同伙们最恶劣的本性。他们几乎和正规的战斗部队一样纪律严明。"
 building_type_influence_merchant_01: "掌控商人"
 building_type_influence_merchant_01_desc: "#F 商人很富有，而你需要黄金。这个等式很简单，但他们可能不会轻易给出来。#!"
 building_influence_merchant_01: "轻度商人掌控"
 building_influence_merchant_01_desc: "他们在抗拒，在抱怨，在挑起事端。但有些人已经开始支付给你完全合法的税。"
 building_influence_merchant_02: "显著商人掌控"
 building_influence_merchant_02_desc: "大多数商人都被吓到了，持不同意见者也只能在小巷里交头接耳。"
 building_influence_merchant_03: "重度商人掌控"
 building_influence_merchant_03_desc: "你现在可以重新组合公会，展示你的增税计划，并仍然赢得雷鸣般的掌声。"
 building_type_prince_city_01: "亲王领"
 building_type_prince_city_01_desc: "#F 吸血鬼是城市居民。城市越大，吸血鬼就越令人恐惧，也越有声望。#!"
 building_prince_city_01: "城镇亲王"
 building_prince_city_01_desc: "你控制着一个人口稀少地区的首府。虽然不多，但总比没有好。"
 building_prince_city_02: "大城镇亲王"
 building_prince_city_02_desc: "你正在控制一个人口较少的地区首府。虽然不多，但总比没有好。"
 building_prince_city_03: "小城亲王"
 building_prince_city_03_desc: "你控制着整个小城市，或者一个大城市的一小部分。这只是第一步。"
 building_prince_city_04: "城市亲王"
 building_prince_city_04_desc: "你的宫廷受到尊敬和钦佩，因为你统治着这么多的凡人。"
 building_prince_city_05: "郡城亲王"
 building_prince_city_05_desc: "一个你控制下的重要城市，许多凡人都自愿在这里受你的奴役。"
 building_prince_city_06: "大郡城亲王"
 building_prince_city_06_desc: "凡人、国王和军阀居住在这个令人印象深刻的城市。你是他们在夜间的同类。"
 building_prince_city_07: "王城亲王"
 building_prince_city_07_desc: "在这里做出的决定会影响到比这个城市更大的区域。你理所当然会因为这种潜在的影响力而受到尊重。"
 building_type_temple_set_01: "赛特神殿"
 building_type_temple_set_01_desc: "#F 你做梦也想不到的快乐就在这里。如果你愿意付出代价。#!"
 building_temple_set_01: "体面的赛特神殿"
 building_temple_set_01_desc: "你已经为腐化之神建立了一个小而可敬的神殿，数个灵魂已经落入他的黑暗怀拥。"
 building_type_devasthana_01: "控制印度庙"
 building_type_devasthana_01_desc: "#F 印度陷入了一场千年之久的圣战，以阻止[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]。要赢得胜利，你需要信仰和坚不可摧的信念。#!"
 building_devasthana_01: "体面的印度庙"
 building_devasthana_01_desc: "在这里，在提婆的保护下，你会找到继续前行的力量。"
 building_type_brahmavihara_01: "婆罗门的导师"
 building_type_brahmavihara_01_desc: "#F 你的身体状况，虽然只是一段漫长旅程的一部分，却让你更难遵从佛陀的教诲。你可能需要一些帮助。#!"
 building_brahmavihara_01: "体面的等舍"
 building_brahmavihara_01_desc: "在所有情况下保持中立是平和的检验。它是心灵平静和涅槃的途径。"
 building_type_low_war_01: "低劣战争"
 building_type_low_war_01_desc: "#F 每一刻都是一场战役，无论是政治还是肉体上的交锋。万千武者时刻严阵以待。#!"
 building_low_war_01: "无尽低劣战争"
 building_low_war_01_desc: "你总是在战斗，而休息是早已逝去的记忆。但是你的敌人也一样。\n唯有克服一切挑战——无论是政治、社会还是军事上的——方能赢得胜利。"
 building_type_chantry_01: "歌祷堂"
 building_type_chantry_01_desc: "#F 一群不死族法师的集会。睿魔尔在此处修习他们隐秘的血魔法之术。#!"
 building_chantry_01: "体面的歌祷堂"
 building_chantry_01_desc: "这里立着一座小秘所，以及你那段金字塔的单个$pod_cainite$和数个术士。这只是开始。"
 building_type_underworld_portal_01: "通往冥界的门"
 building_type_underworld_portal_01_desc: "#F 作为少数了解冥界的吸血鬼之一，你可以利用它的专横的存在作为你的优势#!"
 building_underworld_portal_01: "通往冥界的通道"
 building_underworld_portal_01_desc: "鬼魂是饥肠辘辘的。环绕在你周围时，他们会更加渴望你敌人的心灵。"
 building_type_pairidaeza_01: "波斯庭院"
 building_type_pairidaeza_01_desc: "#F 这些花园是波斯祆教最伟大时代的遗留物，是吸血鬼坚持长期信仰的绿洲。#!"
 building_pairidaeza_01: "谦卑的波斯庭院"
 building_pairidaeza_01_desc: "道德沙漠中的精神养料之井。过往的微弱回声。"
 building_type_unending_party_01: "无尽派对"
 building_type_unending_party_01_desc: "#F 只有把每件事都推到极致，才能感受到生命的存在。一直都是。#!"
 building_unending_party_01: "年度派对"
 building_unending_party_01_desc: "有些客人永远都不想离开你的宴会。大多数客人却如何都，不能。"
 building_type_fallen_church_01: "堕落教堂"
 building_type_fallen_church_01_desc: "#F 你的灵魂早已迷失。所以，在这里，你要确保拯救每个人的灵魂。不管他们喜欢不喜欢#!"
 building_fallen_church_01: "堕者神龛"
 building_fallen_church_01_desc: "这里能听到如此多的哭声，如此多的宽恕请求。而，在最后，几乎不会有救赎。"
 building_type_laboratory_01: "研究室"
 building_type_laboratory_01_desc: "#F 很多东西进入这里。很少离开。有些甚至成为该整体的一部分。#!"
 building_laboratory_01: "体面的血肉塑造实验室"
 building_laboratory_01_desc: "一个很恰当的地方，如果你需要方便的空间去塑捏那些自愿者又或不自愿者的骨肉。"
 building_type_mother_garden_01: "莉莉丝的庭园"
 building_type_mother_garden_01_desc: "#F 真正的伊甸园只存在对第一个女人的崇拜中，那个被亚当、该隐和天主自己背叛的女人。#!"
 building_mother_garden_01: "少女的庭园"
 building_mother_garden_01_desc: "作为“少女”，莉莉丝诱使其他人去发现隐藏在现实面纱背后的真相。"
 building_type_legacies_gathering_01: "传承集会"
 building_type_legacies_gathering_01_desc: "#F 大多数时候，莱本喜欢在草率行动之前把事情商量一下。举办这样的聚会是一项享有声望的活动。#!"
 building_legacies_gathering_01: "大型集会"
 building_legacies_gathering_01_desc: "相当数量的宗族代表聚集在这里，讨论该地区和其他地区的未来。"
 building_type_influence_people_01: "掌控人群"
 building_type_influence_people_01_desc: "#F 从最好的到最坏的，人性就是一切。因此，你可以与社会的每一个层面相互纠缠，并从中学习。#!"
 building_influence_people_01: "轻度人群掌控"
 building_influence_people_01_desc: "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才能不变成怪物。"
 building_type_influence_clergy_01: "掌控圣职"
 building_type_influence_clergy_01_desc: "#F 圣职人员是牧人类的牧羊人，控制牧羊人就意味着控制羊群。#!"
 building_influence_clergy_01: "轻微圣职掌控"
 building_influence_clergy_01_desc: "有着当地的牧师在你的锦囊里可能是最有用的。"
 building_type_crypt_01: "墓穴"
 building_type_crypt_01_desc: "#F 你的工作需要适当的地点和用品。而且，最好是一个非常安静和隐蔽的地方，一个邻居们不会抱怨的地方。#!"
 building_crypt_01: "体面墓穴"
 building_crypt_01_desc: "独自在黑暗中，周围是一些新死者和老死者的骨头。它需要完善，但就这样也能用。"
 building_type_assassins_cell_01: "刺客群"
 building_type_assassins_cell_01_desc: "#F 哈基姆的子嗣在世界的每一个角落都有一个庞大的由特工，线人和其他有用的工具人组成的网络。#!"
 building_assassins_cell_01: "小型刺客群"
 building_assassins_cell_01_desc: "在这一地区的小规模哈基姆派允许你有一些非常有用的备用手段，以实现你更多的.……幕后目标。"
 building_type_alamut_01: "鹰巢"
 building_type_alamut_01_desc: "#F $pod_clan$[GetTrait('assamite').GetName(GetNullCharacter)]的可怕隐形坚垒是由信仰、力量和谎言铸成的。#!"
 building_alamut_01: "分裂的鹰巢"
 building_alamut_01_desc: "与$pod_clan$[GetTrait('assamite').GetName(GetNullCharacter)]一样，鹰巢内也被分为不同的种姓。修补这种分裂需要相当大的投资。"
 building_alamut_02: "恢复的鹰巢"
 building_alamut_02_desc: "尽管人们仍能听到和看到背后的激烈言辞和刀锋，但最严重的暴力爆发已被这些神圣的城墙排斥在外。"
 building_alamut_03: "阿拉穆特，鹰巢"
 building_alamut_03_desc: "至少在这里，$pod_clan$[GetTrait('assamite').GetName(GetNullCharacter)]表现出了完美的凝聚力和对单一目标的奉献，使其成为一股可怕的力量。"
 building_type_rome_01: "罗马"
 building_type_rome_01_desc: "#F 罗马是$pod_cainite$的中心，也是人类世界的中心。恢复它不死的伟大将是一个巨大的成就。#!"
 building_rome_01: "凡人的罗马"
 building_rome_01_desc: "圣职人员在街道上徘徊，反对任何直接控制欧洲世界中心的企图。在这个阶段，罗马对他的主人来说是一个有声望的头衔，仅此而已。"
 building_rome_02: "分裂的罗马"
 building_rome_02_desc: "慢慢地，罗马的信仰被侵蚀，吸血鬼可以再次利用他们微妙的影响力为亲王谋利。"
 building_rome_03: "永恒罗马"
 building_rome_03_desc: "最后，罗马又回到了吸血鬼的手中。当该隐子嗣歌颂征服圣城的伟大统治者时，圣职人员在黑暗中畏缩。"
 building_type_ceoris_01: "塞奥里斯"
 building_type_ceoris_01_desc: "#F [GetTrait('tremere').GetName(GetNullCharacter)]的坚固堡垒是其大本营和学习中心。这是被围困的魔法师$pod_clan$最好的资产#!"
 building_ceoris_01: "分裂的塞奥里斯"
 building_ceoris_01_desc: "在歌祷堂里有些[GetTrait('tremere').GetName(GetNullCharacter)]仍然是凡人。他们怀疑那些诡计多舛的吸血鬼有奸诈行为，并且一直是议会计划的障碍。"
 building_ceoris_02: "掌控中的塞奥里斯"
 building_ceoris_02_desc: "随着他们的凡人同行的消失或转化，[GetTrait('tremere').GetName(GetNullCharacter)]家族们终于可以利用塞奥里斯的全部潜力。"
 building_ceoris_03: "无法攻取的塞奥里斯"
 building_ceoris_03_desc: "只要这个坚固的堡垒还在，$pod_clan$[GetTrait('tremere').GetName(GetNullCharacter)]就不会倒下。换言之，从外部来看至少如此……"
 building_type_carthage_01: "迦太基"
 building_type_carthage_01_desc: "#F [GetTrait('brujah').GetName(GetNullCharacter)]$pod_clan$的幻梦早已被复仇心切的[GetTrait('ventrue').GetName(GetNullCharacter)]埋葬。但是梦真的会消亡吗？#!"
 building_carthage_01: "重建中的迦太基"
 building_carthage_01_desc: "重建特洛伊尔的城市将是一件代价高昂的事情，这是对世界的一个强有力的宣言。但回报和危险可能都是巨大的。"
 building_carthage_02: "新迦太基"
 building_carthage_02_desc: "罗马$pod_cainites$最可怕的噩梦在你的领导下复活了。它不会再倒下。"
 building_carthage_03: "迦太基，布鲁赫之梦"
 building_carthage_03_desc: "教化的灯塔，以及人类与$pod_cainites$之间合作的愿景，在此处再次可见。"
 building_type_ombos_temple_01: "建立翁布神殿"
 building_type_ombos_temple_01_desc: "#F [GetTrait('setite').GetName(GetNullCharacter)]$pod_clan$的奢华核心，翁布据说也是赛特的最后休眠之地。#!"
 building_ombos_temple_01: "失色的翁布"
 building_ombos_temple_01_desc: "翁布在近些年代被年轻的#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!视为过去纪元的遗迹，其合法性受到质疑。"
 building_ombos_temple_02: "复苏的翁布"
 building_ombos_temple_02_desc: "改革和重建使神殿重新站在了时代的前沿。"
 building_ombos_temple_03: "高耸的翁布"
 building_ombos_temple_03_desc: "作为整个宗教无可争议的中心，翁布是思想、信仰和计谋的摇篮。一如既往。"
 building_type_erciyes_01: "埃尔吉耶斯"
 building_type_erciyes_01_desc: "#F 在古典时代，$pod_clan$[GetTrait('cappadocian').GetName(GetNullCharacter)]从#TOOLTIP:GAME_TRAIT,malkavian,[GetNullCharacter] #L 末卡维#!#!手中夺走了山上的堡垒。从那时起，它就成为了学习和冥想的中心。#!"
 building_erciyes_01: "孤立的埃尔吉耶斯"
 building_erciyes_01_desc: "从各方面来看，埃尔吉耶斯都是一个完美的冥想场所。遗憾的是，它往往会让访客忽视来自外部的威胁。"
 building_erciyes_02: "开放的埃尔吉耶斯"
 building_erciyes_02_desc: "随着心态的改变和外部世界可以整理出通往堡垒的道路，埃尔吉耶斯成为一个世界性的学习中心。"
 building_erciyes_03: "埃尔吉耶斯，暗影修道院"
 building_erciyes_03_desc: "这座山堡既是一个休息的地方，也是整个$pod_clan$的中心，在它的城墙内可以看到连续的，但有控制的活动。"
 building_type_cathedral_of_flesh_01: "血肉大教堂"
 building_type_cathedral_of_flesh_01_desc: "#F 这极其令人憎恶的东西是几千年来由农民、奴隶、敌人、禽兽和许多其他受害者的血肉雕刻而成的，这些人被埋进搏动着的、化脓溃烂的墙壁里。#!"
 building_cathedral_of_flesh_01: "怀敌意的大教堂"
 building_cathedral_of_flesh_01_desc: "受土地本身的污染，大教堂是任何入侵者的敌人，正如它是它的主人的敌人一样。输掉这场战斗意味着要成为其中的一部分。"
 building_cathedral_of_flesh_02: "激昂的大教堂"
 building_cathedral_of_flesh_02_desc: "库帕拉的影响随着怪物开始服从它的主人而逐渐减弱。"
 building_cathedral_of_flesh_03: "退缩的大教堂"
 building_cathedral_of_flesh_03_desc: "库帕拉似乎暂时离开了。大教堂已经成为任何一个疯狂的库都术师都梦想着使用的极度可怕的工具。"
 building_type_castel_del_ombro_01: "暗影之堡"
 building_type_castel_del_ombro_01_desc: "#F 从远处是不可能分辨墙壁是由什么构成的，因为动态的阴影在几乎看不见的潮起潮落中爬过每一个表面。每天晚上日落后，潮水般的阴影从城堡深处升起，环绕城堡呈螺旋形，午夜过后，阴影会逆转并逐渐消失。#!"
 building_castel_del_ombro_01: "暗影之墓"
 building_castel_del_ombro_01_desc: "作为[Glossary('上古耆宿','game_concept_antediluvian_desc')]的休眠之处，这座城堡是一个可怕的地方，提醒着人们在每一个[GetTrait('lasombra').GetName(GetNullCharacter)]周围都有不自然的空气。"
 building_castel_del_ombro_02: "暗影之堡"
 building_castel_del_ombro_02_desc: "作为血之法庭的中心，城堡是$pod_clan$长者的司法工具。"
 building_castel_del_ombro_03: "公开城堡"
 building_castel_del_ombro_03_desc: "城门的开启意味着勒森魃本人已经离开了城堡。在这段时间里，它周围的疯狂气氛稍稍消退，让这个地方成为$pod_clan$的政治中心。"
 building_type_rabble_thugs_01: "掌控流氓和恶棍"
 building_type_rabble_thugs_01_desc: "#F 有时，你必须忘记你的自尊并接触一些讨厌的人，以得到一些急需的支援。#!"
 building_rabble_thugs_01: "轻度流氓和恶棍掌控"
 building_rabble_thugs_01_desc: "很多人是不会被任何人错过的。他们是那种你可以用来快速创建一支战斗力的人。"
 building_rabble_thugs_02: "显著流氓和恶棍掌控"
 building_rabble_thugs_02_desc: "街头的乌合之众在夜晚的战场上毫无用处。但有时候，你不能太挑剔。"
 building_rabble_thugs_03: "重度流氓和恶棍掌控"
 building_rabble_thugs_03_desc: "不法之徒们数量众多且至少有一点战斗经验，是很好的兵源。"
 building_type_sherwood_01: "舍伍德森林"
 building_type_sherwood_01_desc: "#F 狂徒运动就是在这里诞生的，并将繁荣几个世纪。这是避开了夜晚的暴君辛苦挣来的喘息之机。#!"
 building_sherwood_01: "掌控中的舍伍德"
 building_sherwood_01_desc: "罗宾·李兰德从密特拉的眼皮底下夺走了舍伍德并接掌了数个世纪。这一对抗老暴君的大胆成就激励着狂徒聚集起来，为该功业更加努力地战斗。"
 building_sherwood_02: "扩展中的舍伍德"
 building_sherwood_02_desc: "舍伍德的自由男女现在在森林外战斗，这让罗宾为他的学生感到骄傲。"
 building_sherwood_03: "凯旋的舍伍德"
 building_sherwood_03_desc: "只要一提到舍伍德的勇敢捍卫者、暴君的歼灭者和自由之战士，就会令暴君们胆战心惊。"
 building_type_shrine_of_telyavel_01: "特亚维神龛"
 building_type_shrine_of_telyavel_01_desc: "#F 工匠之神对凡类或超凡的事物不感兴趣。除非付出相应的代价……#!"
 building_shrine_of_telyavel_01: "象征性的特亚维神龛"
 building_shrine_of_telyavel_01_desc: "即使没有神的祝福，这座神龛仍然是一个垂死的原始教徒世界的强大呼声。"
 building_shrine_of_telyavel_02: "觉醒的特亚维神龛"
 building_shrine_of_telyavel_02_desc: "铁匠之神注视着他的信徒，被他们对他的功业再次投入的热情所吸引。"
 building_shrine_of_telyavel_03: "暗影之林"
 building_shrine_of_telyavel_03_desc: "现在此处已与神的国度直接相连，许多勇士来到这里寻求神圣祝福。"
 building_type_giovanni_mausoleum_01: "乔凡尼陵墓"
 building_type_giovanni_mausoleum_01_desc: "#F 有很多人进入这里。但很少有人离开。#!"
 building_giovanni_mausoleum_01: "狭小的乔凡尼陵墓"
 building_giovanni_mausoleum_01_desc: "[GetTrait('giovanni').GetName(GetNullCharacter)]家庭作为夜之眷族来说还很年轻，但他们仍然非常专注于对死亡和灵魂的研究。"
 building_giovanni_mausoleum_02: "体面的乔凡尼陵墓"
 building_giovanni_mausoleum_02_desc: "慢慢的，亡灵术师们将他们的注意力放到了外界，他们对新的环境给带来的机会很感兴趣。"
 building_giovanni_mausoleum_03: "宏伟的乔凡尼陵墓"
 building_giovanni_mausoleum_03_desc: "意大利人现在是一股不可忽视的力量。他们仍然是强大的亡灵术师，但也有能力参与政治游戏。"
 building_type_pit_of_malkav_01: "末卡维地穴"
 building_type_pit_of_malkav_01_desc: "#F 耶路撒冷的地下有个裂口。仅仅靠近就会让人感到痛苦。你的头感觉就要爆炸了。#!"
 building_pit_of_malkav_01: "开放的末卡维坑堑"
 building_pit_of_malkav_01_desc: "如此之多的声音说出了如此之多矛盾的事情……即使是你也可以瞥见其中一些微弱的智慧。"
 building_pit_of_malkav_02: "半隐的末卡维坑堑"
 building_pit_of_malkav_02_desc: "你已经将石头扔进了坑堑中，现在这声音不再那么疯狂。你将能够更好地理解它们。"
 building_pit_of_malkav_03: "关闭的末卡维坑堑"
 building_pit_of_malkav_03_desc: "现在声音们清静了许多，除非你非常靠近坑堑。现在靠近它可以让你轻松地将疯狂的声音从智慧的声音中分出来。"
 building_type_well_of_sacrifice_01: "献祭之井"
 building_type_well_of_sacrifice_01_desc: "#F 地狱就在地球上，它就在这里。#!"
 building_well_of_sacrifice_01: "小型献祭之井"
 building_well_of_sacrifice_01_desc: "扔进井里后，他们就停止了哭泣。这让你不快。"
 building_well_of_sacrifice_02: "大型献祭之井"
 building_well_of_sacrifice_02_desc: "还有非常多的人需要感受永恒的空虚和无尽的饥饿。"
 building_well_of_sacrifice_03: "魔邪献祭之井"
 building_well_of_sacrifice_03_desc: "他们很快就会醒来。他们很快就会来。到那时，一切都会明白。"
 building_type_london_mithraeum_01: "伦敦密特拉神圣所"
 building_type_london_mithraeum_01_desc: "#F 密特拉教信仰最古老神殿之一，至今仍为太阳神的追随者所关注。#!"
 building_london_mithraeum_01: "隐蔽的密特拉神圣所"
 building_london_mithraeum_01_desc: "因为惧怕十字，信徒们聚集在从前荣耀的阴影里。"
 building_london_mithraeum_02: "复苏的密特拉神圣所"
 building_london_mithraeum_02_desc: "密特拉的信徒在这里祈祷，寻求光明神应许的救恩，这现在是一个公开的秘密。"
 building_london_mithraeum_03: "凯旋的密特拉神圣所"
 building_london_mithraeum_03_desc: "现在是轮到十字躲藏的时候了，因为这片土地的真正信仰已经回归！"
 building_type_influence_law_01: "掌控立法者"
 building_type_influence_law_01_desc: "#F 很明显，你凌驾于凡人的法律之上。但是让你的手下在里面维持这伯爵领的公共秩序依然是有益的。#!"
 building_influence_law_01: "轻度立法者掌控"
 building_influence_law_01_desc: "经常在耳边吹风有助于在保持很长的一段时间的民间平息。"
 building_influence_law_02: "显著立法者掌控"
 building_influence_law_02_desc: "你在这里对司法系统有很强的拉动作用。强大到可以在很多方面加以利用。"
 building_influence_law_03: "重度立法者掌控"
 building_influence_law_03_desc: "你猜对了：在这个阶段，你就是法律。"
 building_type_influence_barracks_01: "掌控兵营"
 building_type_influence_barracks_01_desc: "#F 职业军队正在凡人社会中卷土重来。这对$pod_cainites$是一个难得的机会，来获取一些经验丰富的战士用于他的功业。#!"
 building_influence_barracks_01: "轻度兵营掌控"
 building_influence_barracks_01_desc: "这一带的一些士兵都在你的工资单上。他们在危急时刻是有用的盟友。"
 building_influence_barracks_02: "显著兵营掌控"
 building_influence_barracks_02_desc: "大部分地方军队都知道你的名字，或者为那些知道你名字的人工作。"
 building_influence_barracks_03: "重度兵营掌控"
 building_influence_barracks_03_desc: "当地的军队知道谁才是他们真正的主人。当然也不是什么浮夸的地方贵族。"
 building_type_influence_burghers_01: "掌控市民"
 building_type_influence_burghers_01_desc: "#F 在凡人的世界，一个新的社会阶层正在出现。这些“布尔乔亚”有充足的金钱，但几乎没有实际的军事力量。用于秘密交易的完美目标。#!"
 building_influence_burghers_01: "轻度市民掌控"
 building_influence_burghers_01_desc: "你已经对这个地区的商人阶层做了一些初步的接触。"
 building_influence_burghers_02: "显著市民掌控"
 building_influence_burghers_02_desc: "作为这个地区一些最富有商人的背后赞助人，你从中获得了可观的利润。"
 building_influence_burghers_03: "重度市民掌控"
 building_influence_burghers_03_desc: "钱在这里只流进一个方向，那就是你的口袋。"
 building_type_fortress_cross_01: "十字堡垒"
 building_type_fortress_cross_01_desc: "#F 亚柯骑士们戒备森严的总殿可能是裁判所里最令人惊叹的要塞。#!"
 building_fortress_cross_01: "孤立的十字堡垒"
 building_fortress_cross_01_desc: "真令人感慨，亚柯骑士的首领在裁判所的其他一些圣地仍然缺乏政治权力。"
 building_fortress_cross_02: "熙攘的十字堡垒"
 building_fortress_cross_02_desc: "被重新翻修成了一处提供给所有胸怀大志的裁判官使用的重要朝圣地后，堡垒如今成为了精锐们的训练中心。"
 building_fortress_cross_03: "真十字堡垒"
 building_fortress_cross_03_desc: "因为城墙受到了真十字架的碎片的祝福，堡垒如今成为了一个坚不可摧的信标。"
 building_type_st_scholastica_01: "圣思嘉"
 building_type_st_scholastica_01_desc: "#F 红修会第二重要的赞助者圣思嘉是圣本笃的孪生姐妹，一位意志坚定但信仰虔诚的女人。#!"
 building_st_scholastica_01: "圣思嘉修女院"
 building_st_scholastica_01_desc: "红修女们最重要的修女院是一个奇怪的地方，在那里修女们享有远超她们大多数圣职同胞们的自由。"
 building_st_scholastica_02: "圣思嘉图书馆"
 building_st_scholastica_02_desc: "裁判所最大的图书馆之一，它还收藏着禁忌的传说。只有最虔诚的修女才能进入。"
 building_st_scholastica_03: "圣思嘉圣物室"
 building_st_scholastica_03_desc: "为了和敌人战斗，红修会不羞于使用非常规的手段。在这里她们找到了她们最强大的武器。"
 building_type_castle_von_murnau_01: "穆尔瑙的城堡"
 building_type_castle_von_murnau_01_desc: "#F 著名裁判官家族的祖宅。一个享有荣耀和财富的地方。#!"
 building_castle_von_murnau_01: "穆尔瑙的庄园"
 building_castle_von_murnau_01_desc: "品味奢华而又构思精巧，这座庄园和复杂的德意志贵族景观完美地融为一体。"
 building_castle_von_murnau_02: "穆尔瑙的城堡"
 building_castle_von_murnau_02_desc: "专门预留了一间侧厅用于裁判官事务，穆尔瑙的城堡成为了来访猎人的重要休息处。"
 building_castle_von_murnau_03: "冯·穆尔瑙堡垒"
 building_castle_von_murnau_03_desc: "堡垒挑衅着黑暗的下仆，准备好抵御任何威胁。这是家族所受的诅咒和祝福这两者的证明。"
 building_type_the_nest_01: "窟穴"
 building_type_the_nest_01_desc: "#F 罗德里格的偏执建成了这座位于潘普洛纳地下的迷宫隧道，期待着有朝一日能在对抗被诅咒的吸血怪物时产生出其不意的效果。#!"
 building_the_nest_01: "小型窟穴"
 building_the_nest_01_desc: "建得很好，但依然很小，主要是作为圣雅各伯骑士分享信息的安全途径。"
 building_the_nest_02: "大型窟穴"
 building_the_nest_02_desc: "罗德里格的隧道网络和间谍网覆盖了潘普洛纳的大部分地方，如今成为了伊比利亚裁判所最惊人的财产。"
 building_the_nest_03: "坚固窟穴"
 building_the_nest_03_desc: "任何圣雅各伯的敌人一旦踏入潘普洛纳就不可能活着离开。罗德里格的网络如今准备好应对一切麻烦。"
 building_type_st_cecila_01: "圣则济利亚修女院"
 building_type_st_cecila_01_desc: "#F 圣约翰修女会的训练总部是一个需要在令人发狂的幻觉海洋里保持宁静和进行冥想的地方。#!"
 building_st_cecila_01: "圣则济利亚医院"
 building_st_cecila_01_desc: "任何在不列颠群岛受伤的裁判官都知道他们应该感谢博学的修女们能在这里照料他们。"
 building_st_cecila_02: "圣则济利亚驱魔师"
 building_st_cecila_02_desc: "裁判所最厉害的驱魔师是在圣则济利亚受训的。世上没有灵类能抵抗他们的召唤，无论是处于和平或是战争。"
 building_st_cecila_03: "圣则济利亚裁判官"
 building_st_cecila_03_desc: "修女们是信奉和平的女人，但她们知道敌人不是。少数选择将一生投入到战争中的人拥有着卓越的智慧和虔诚。"
 building_type_everard_players_01: "埃弗拉德的演员"
 building_type_everard_players_01_desc: "#F 阿拉斯的埃弗拉德名下的著名艺术家剧团实际上是属于神目——裁判所的间谍的最重要的财产之一。#!"
 building_everard_players_01: "《阿拉斯的宫廷》"
 building_everard_players_01_desc: "让·博德尔写的剧本之一是对圣经中的浪子故事的改编。"
 building_everard_players_02: "《圣尼古拉斯》"
 building_everard_players_02_desc: "剧本中一位虔诚的圣徒被委托了属于异教徒国王的黄金。"
 building_everard_players_03: "《杰纳的虔信者》"
 building_everard_players_03_desc: "剧团实际上受到圣雅各伯之剑的骑士们保护。有着如此强力的助臂，演员们总能逃离他们最热情的批评者。"
 building_type_ipeasants_01: "掌控农田"
 building_type_ipeasants_01_desc: "#F 那些在田野间辛勤劳作，诚实而又敬畏天主的人们是这个国度和我们的斗争的支柱。#!"
 building_ipeasants_01: "布道农民"
 building_ipeasants_01_desc: "农奴们很容易被那些上流阶级的人影响，将我们的密探派到他们之中能确保我们获取他们的支持。"
 building_ipeasants_02: "催化农民"
 building_ipeasants_02_desc: "乡下人都很害怕，但若被我们的热情赋予力量，他们可以变成我们功业的忠实盟友。"
 building_ipeasants_03: "从农民到士兵"
 building_ipeasants_03_desc: "合理地煽动他们反抗黑暗力量，这些田地人民可以变成向我们的权威效忠的有组织的军队。"
 building_ipeasants_04: "夏祭战争"
 building_ipeasants_04_desc: "农民们的内心因正义的怒火而熊熊燃烧。他们是天主的愤怒羊群，而我们是他们的羊倌。"
 building_type_ieducation_01: "掌控信仰教育"
 building_type_ieducation_01_desc: "#F 通过支持教授当地人天主之言的行动，我们可以帮助他们变得更加虔诚，更有文化和对我们的行动表现出更多的赞同。#!"
 building_ieducation_01: "建设主日学校"
 building_ieducation_01_desc: "百姓的孩子们需要意识到我们使命的重要性，就算不知道它确切的本质。"
 building_ieducation_02: "建设神学院"
 building_ieducation_02_desc: "在我们的精心指导下，下一代在此接受教育的牧师们将为我们的功业做好加入的准备。"
 building_ieducation_03: "建设神学大学"
 building_ieducation_03_desc: "这里是教廷的学者塑造教廷未来的地方。我们的影响力将确保我们能在其中扮演关键的角色。"
 building_ieducation_04: "武器化神学"
 building_ieducation_04_desc: "由于将涉及到宗教教育有关的一切事物都牢牢掌控在了手里，我们能按照我们的需要修改善与恶的定义。"
 building_type_ioutskirts_01: "掌控郊区"
 building_type_ioutskirts_01_desc: "#F 一旦被掌控，当地的荒原就能掩蔽我们的行动，而不会反过来帮助我们的敌人#!"
 building_ioutskirts_01: "统治者林区的通行"
 building_ioutskirts_01_desc: "狩猎区是统治者家庭的专属资产，请求通行权力让我们在其中巡行并找到入侵者"
 building_ioutskirts_02: "颁发偷猎者特赦"
 building_ioutskirts_02_desc: "森林是偷猎者的家园，在这里违法者并非出于自愿，而是被生存所迫。他们对于这片土地的熟悉值得我们赢得他们的忠诚。"
 building_ioutskirts_03: "确保狩猎权利"
 building_ioutskirts_03_desc: "通过贿赂，威胁和提供更高的地位，我们可以让森林脱离当地统治者的官方控制。"
 building_ioutskirts_04: "领主的树林"
 building_ioutskirts_04_desc: "没有哪个住在这片荒原里的猎人，药剂师，采莓人或隐士不是我们的密探。"
 building_type_itownsfolk_01: "镇民掌控"
 building_type_itownsfolk_01_desc: "#F 人群在这里聚集，金钱在这里流通，我们的功业需要这两方面的支持。#!"
 building_itownsfolk_01: "街区传教士"
 building_itownsfolk_01_desc: "在这里人们至少假装正派，宣扬拒绝罪恶，荒淫无道的行为差不多必定会被富有同理心的人发现。"
 building_itownsfolk_02: "大赦商人"
 building_itownsfolk_02_desc: "教廷的宽恕可不便宜。我们有办法让它打个折，商人们会对这一不错的交易心存感激。"
 building_itownsfolk_03: "收买行会领导层"
 building_itownsfolk_03_desc: "如果不能利用信仰，那就依靠人脉方面的承诺，手工艺者们的领头人可以成为有价值的密探。"
 building_itownsfolk_04: "神圣企业"
 building_itownsfolk_04_desc: "这座城镇的商人和手工艺者们自从我们到来后变得越来越虔诚。看上去这里已经没有可以让那些不虔诚的人做生意的地方。"
 building_type_iunderworld_01: "控制下层社会"
 building_type_iunderworld_01_desc: "#F 我们的敌人居住在阴影下的国度里。和那里的凡人住民合作虽然不合宜，但是很有必要。#!"
 building_iunderworld_01: "援助乞丐和孤儿"
 building_iunderworld_01_desc: "正经人会把目光从可怜人身上移开。这也是他们成为无价之宝的一部分原因。"
 building_iunderworld_02: "转化常见罪犯"
 building_iunderworld_02_desc: "社会已经对这些暴徒，窃贼和骗子关上了大门，但是我们依然有他们的用武之地。"
 building_iunderworld_03: "渗透犯罪集团"
 building_iunderworld_03_desc: "和犯罪团体的上层做交易一定会给我们带来危害，但是其中的收益或许值得我们这么做。"
 building_iunderworld_04: "赦罪"
 building_iunderworld_04_desc: "人生来有罪，让那些基于这一事实谋生的人失业不是我们的优先任务。只要他们为我们的功业作出贡献。"
 building_type_igarrison_01: "控制守军"
 building_type_igarrison_01_desc: "这片聚居地的士兵在戒备着他们领主的敌人。我们可以把他们的注意力转到那些更邪恶的敌人身上。#!"
 building_igarrison_01: "援助守夜人"
 building_igarrison_01_desc: "守夜人的工作无休无止，我们的密探提供的帮助将让他们大为感激。"
 building_igarrison_02: "收买守军长官"
 building_igarrison_02_desc: "优秀的士兵从来不质疑他们长官下达的命令。这使得后者成为了我们功业的基础。"
 building_igarrison_03: "夺取守军控制权"
 building_igarrison_03_desc: "我们会采用一切可行的手段确保这些守军的最高等级长官的服从。"
 building_igarrison_04: "虔信者要塞"
 building_igarrison_04_desc: "驻扎在这座城市的各级士兵服从于我们的代表，心中充满了对保护他们这一神圣使命的自豪。"
 building_type_inquisition_church_01: "裁判教堂"
 building_type_inquisition_church_01_desc: "#F 虔信者们需要一个免受吸血蚂蟥影响的聚集地，而我们的教友和修女，需要一个用来冥想的地方。#!"
 building_inquisition_church_01: "裁判礼拜堂"
 building_inquisition_church_01_desc: "一个由天主的骑士们保护的宁静的小地方。沙漠里的一处绿洲。"
 building_inquisition_church_02: "裁判教堂"
 building_inquisition_church_02_desc: "在这里，吸血鬼腐化的影响被拒之门外。"
 building_inquisition_church_03: "大裁判教堂"
 building_inquisition_church_03_desc: "黑暗世界中的一座灯塔。希望能有更多的后继者。"
 building_inquisition_church_04: "大总主裁判教座堂"
 building_inquisition_church_04_desc: "铭记我们的虔诚的丰碑，它高高地矗立在岛上，对于邪恶力量来说是一项十足的挑战。"
 building_type_inquisition_office_01: "裁判所办公处"
 building_type_inquisition_office_01_desc: "#F 一个让我们远离窥视用来进行管理的地方。#!"
 building_inquisition_office_01: "办公室"
 building_inquisition_office_01_desc: "一个隐藏良好的空间来存储和处理我们的文件。"
 building_inquisition_office_02: "偏远办公所"
 building_inquisition_office_02_desc: "一栋低调的住宅，于此我们可以在不引起他人注意的情况下协调我们的行动。"
 building_inquisition_office_03: "办公楼"
 building_inquisition_office_03_desc: "位于城镇最繁华地段的一栋显眼的办公楼，镇里最富有和最有影响力的居民都来此办公。"
 building_inquisition_office_04: "办公城区"
 building_inquisition_office_04_desc: "城里专门留给我们的兄弟和姐妹的区域。不会有人质疑我们对当地和区域内的事务的支配权。"
 building_type_inquisition_palace_01: "裁判所宫殿"
 building_type_inquisition_palace_01_desc: "#F 一个让我们的骑士聚集、训练和办宴的地方。#!"
 building_inquisition_palace_01: "猎人小屋"
 building_inquisition_palace_01_desc: "一处偏僻的地产，适合用来从事骑士们最喜爱的世俗娱乐活动。"
 building_inquisition_palace_02: "裁判所府邸"
 building_inquisition_palace_02_desc: "一栋招待规格符合最高标准的雅致居所。"
 building_inquisition_palace_03: "裁判所宫殿"
 building_inquisition_palace_03_desc: "一座壮观的宫殿，也是我们功业高尚性的证明。这片土地上很少有贵族会拒绝来这里的邀请。"
 building_inquisition_palace_04: "裁判所大宫殿"
 building_inquisition_palace_04_desc: "我们神圣的居所，即豪华又威严。适合招待国王，皇帝和圣父教宗。"
 building_type_inquisition_armory_01: "裁判所军械库"
 building_type_inquisition_armory_01_desc: "#F 我们在这片地区的城镇要维持大规模的军事存在需要有足够的基础设施。#!"
 building_inquisition_armory_01: "武器储藏处"
 building_inquisition_armory_01_desc: "我们的密探都不缺武器，但有些任务需要更重型的装备。这种时候，这些储藏处就派上了用场。"
 building_inquisition_armory_02: "裁判所军械库"
 building_inquisition_armory_02_desc: "这些装满武器和护甲的大厅确保了我们在黑暗抬头时有所准备。"
 building_inquisition_armory_03: "裁判所武器工坊"
 building_inquisition_armory_03_desc: "生产我们自己的装备是确保它能满足我们的任务所需的特殊要求的最好方式。"
 building_inquisition_armory_04: "裁判所军事学院"
 building_inquisition_armory_04_desc: "在这个巨大的军事设施综合体内，我们的骑士可以将平民打造成对抗邪恶的强大武器。"
 building_type_inquisition_keep_01: "裁判所城堡"
 building_type_inquisition_keep_01_desc: "#F 一个可以保护包括我们自己，我们的囚犯和我们的秘密在内的一切东西的地方。#!"
 building_inquisition_keep_01: "裁判所塔楼"
 building_inquisition_keep_01_desc: "我们授予这片土地的第一个物理形式上的保护。"
 building_inquisition_keep_02: "裁判所主楼"
 building_inquisition_keep_02_desc: "只有我们的密探能够神不知鬼不觉地进来，而唯有尖叫才能以这种方式离开。"
 building_inquisition_keep_03: "裁判所城堡"
 building_inquisition_keep_03_desc: "一座对抗我们邪恶敌人的强大要塞。我们的所有谋划和诡计就如同流淌于动脉中的血液一样于此萌芽。"
 building_inquisition_keep_04: "裁判所堡垒"
 building_inquisition_keep_04_desc: "一座由石头和锋锐的钢铁组成的山脉，和我们的信仰一样无懈可击。没有任何理智的夜间生物会疯到直接对它发起进攻。"
 building_type_inquisition_contact_01: "联系修士会同僚"
 building_type_inquisition_contact_01_desc: "#F 尽管我们人数很少且任务必须保持隐秘，但是我们在斗争中并不孤单。#!"
 building_inquisition_contact_01: "秘密情报交换点"
 building_inquisition_contact_01_desc: "一个指定的用来交换加密信息和与我们的教友分享技艺的绝密地点。"
 building_inquisition_contact_02: "会面地点"
 building_inquisition_contact_02_desc: "一个足够隐秘的，用来让我们教团的密探面对面和同伴交谈的地方。"
 building_inquisition_contact_03: "周度会议"
 building_inquisition_contact_03_desc: "一个由对抗邪恶力量的专家们召开的定期会议，常常在我们的地产内秘密举行。"
 building_type_inquisition_acre_01: "亚柯骑士训练场"
 building_type_inquisition_acre_01_desc: "#F 在这里我们的兄弟能精进他们用于击败魔鬼仆从的神圣技艺。#!"
 building_inquisition_acre_01: "陪练场"
 building_inquisition_acre_01_desc: "一块配备了大量战斗训练房间的封闭草坪。"
 building_inquisition_acre_02: "训练营地"
 building_inquisition_acre_02_desc: "一座基础设施完善的森林训练营地，哪怕是最菜鸟的新兵也能从此地的专家的指导中受益。"
 building_inquisition_acre_03: "比武大赛"
 building_inquisition_acre_03_desc: "一场由我们赞助的比武大赛，吸引了这片土地上最棒的骑士们。淡季时场地还能提供有用的训练设施。"
 building_type_inquisition_james_01: "圣雅各伯骑士团住宿所"
 building_type_inquisition_james_01_desc: "#F 给朝圣者提供安全和招待是我们的主要目的，同时也能保持我们的特色。#!"
 building_inquisition_james_01: "朝圣招待所"
 building_inquisition_james_01_desc: "一家条件一般的招待所，但是对一位疲惫的朝圣者，或者一位处于危急关头且精疲力竭的天主士兵来说是一个不错的地方。"
 building_inquisition_james_02: "朝圣旅店"
 building_inquisition_james_02_desc: "一间氛围热烈，空间宽敞，温暖舒适且有着足够的配套设施用于满足旅客任何需求的旅店。"
 building_inquisition_james_03: "朝圣住宿大院"
 building_inquisition_james_03_desc: "一座人来人往的建筑综合体，作为多功能后勤枢纽为那些被信仰吸引而来的人提供服务。"
 building_type_inquisition_john_01: "圣约翰慈善修女会"
 building_type_inquisition_john_01_desc: "#F 我们为那些穷苦之人，病痛之人，以及苦难之人服务且不期待任何尘世间的嘉奖，然而我们的努力付出却换来了惊人的回报。#!"
 building_inquisition_john_01: "救济粥棚"
 building_inquisition_john_01_desc: "一项为有需要的人提供食物的倡议，简陋但非常有价值。"
 building_inquisition_john_02: "移动医院"
 building_inquisition_john_02_desc: "一支由手推车和货车组成的大篷车队，装满了在偏远地区用于医疗护理的物品。"
 building_inquisition_john_03: "庇护所"
 building_inquisition_john_03_desc: "一个为国度里的不幸之人准备的安全和宽敞的地方。是天主的神圣恩典在尘世间的小小显现。"
 building_type_inquisition_red_01: "红修会图书馆"
 building_type_inquisition_red_01_desc: "#F 一个收藏着众多对我们的神圣功业有帮助的书籍的地方，在这里你可以找到天主，人类和那些最渎神罪恶的家伙的言论。#!"
 building_inquisition_red_01: "地下墓窟的图书馆"
 building_inquisition_red_01_desc: "一座除了摆放修士们的遗体外，还收藏着我们最珍贵的著作的地窖。"
 building_inquisition_red_02: "修道院图书馆"
 building_inquisition_red_02_desc: "当地修道院贡献出了一部分房间用来进行我们的秘密研究。对门外汉来说根本找不到进去的路。"
 building_inquisition_red_03: "禁忌图书馆"
 building_inquisition_red_03_desc: "一片堆满了手稿和魔法书的城市区域，这里的书若不受到严格管制，会对外界带来极大的危险。"
 building_type_inquisition_murnau_01: "冯·穆尔瑙家族宅第"
 building_type_inquisition_murnau_01_desc: "#F 那些将一生投入神圣功业的冯·穆尔瑙们对尘世间的舒适并不在意，然而树立他们表面上的贵族形象在这种斗争中十分重要。#!"
 building_inquisition_murnau_01: "冯·穆尔瑙住房"
 building_inquisition_murnau_01_desc: "一间不怎么和冯·穆尔瑙的名字相称的市区住宅，但是作为传播我们影响力的哨点起着很大作用。"
 building_inquisition_murnau_02: "冯·穆尔瑙豪宅"
 building_inquisition_murnau_02_desc: "一栋家族成员居住的奢华住所，很适合用来招待当地重要的客人。"
 building_inquisition_murnau_03: "冯·穆尔瑙市内宫殿"
 building_inquisition_murnau_03_desc: "一座宏伟的建筑杰作，处处彰显着家族的显赫。"
 building_type_inquisition_oculi_01: "神目猎群"
 building_type_inquisition_oculi_01_desc: "#F 眼目总能确保无人听到窃语私议。我们在隐蔽的地方策划的行动确保了这一点。#!"
 building_inquisition_oculi_01: "安全屋"
 building_inquisition_oculi_01_desc: "一排完全相同的房间，看起来没有什么特别之处。"
 building_inquisition_oculi_02: "迷宫"
 building_inquisition_oculi_02_desc: "宽敞的地下密室枢纽，每个入口都在我们的控制之下。"
 building_inquisition_oculi_03: "隧道网络"
 building_inquisition_oculi_03_desc: "一个由相互连接的地下室、地下城、下水道和地下洞穴组成的错综复杂的网络。可以用来跨越很远的距离而不被发现。"
 building_type_elysium_01: "秘盟欢会​"
 building_type_elysium_01_desc: "#F 血族社交生活的焦点，亲王在此掌控宫廷。一个不限暴力但没有恶斗的地方。#!"
 building_elysium_01: "特设欢会​"
 building_elysium_01_desc: "一个为了安全和方便而选择的地方，并不出名。不会给任何大人物留下深刻印象，但顾客们还是很欣赏它。"
 building_elysium_02: "互敬欢会​"
 building_elysium_02_desc: "一个能让血族的文化蓬勃发展的专属建筑。建筑四周的外墙能鼓励来访者遵守该有礼节。"
 building_elysium_03: "杰赫欢会​"
 building_elysium_03_desc: "秘盟社交关系网络的中心场所。管理着这个精美建筑的亲王享受着世界范围的赞誉。"
 building_type_haven_01: "魔宴密所"
 building_type_haven_01_desc: "#F 对于那些魔宴的前武装群体来说，这个地方既是家园，也是武装哨所。#!"
 building_haven_01: "群体密所"
 building_haven_01_desc: "虽然这个地方足够安全，可以举行公共仪式和发动武装行动，但它可以有更多的庄严装饰和基础设施。"
 building_haven_02: "公共密所"
 building_haven_02_desc: "这个庄严的寺庙、军营和休息室的混合体成为了千年圣战体系结构中的构建部分。"
 building_haven_03: "黑手支柱"
 building_haven_03_desc: "这是魔宴最可怕的战士们的罕见永久密所。其等可怖的存在，只在对党派利益至关重要的地方才准驻留。"
 building_type_inquisition_george_01: "圣乔治社团的战马牧场"
 building_type_inquisition_george_01_desc: "#F 有些修士会以啤酒而闻名，有些则以草药而闻名，圣乔治教友饲养的马匹对他们的金主来说很值。#!"
 building_inquisition_george_01: "战马牧场"
 building_inquisition_george_01_desc: "最适合给最好的英格兰马儿吃草的草地。"
 building_inquisition_george_02: "战马马厩"
 building_inquisition_george_02_desc: "一个相当大的牧场，有足够的设施和工作人员来保持马匹的健康和纵容。"
 building_inquisition_george_03: "战马拍卖行"
 building_inquisition_george_03_desc: "远道而来的旅行者来到这里见证你那声名远扬的骏马，并对它们下标。"
 building_chantry_02: "大型歌祷堂"
 building_chantry_02_desc: "众多的$pod_cainites$和一个小型术士密教待在这里，都血缚于你的意志。这很完美。"
 building_chantry_03: "巨型歌祷堂"
 building_chantry_03_desc: "睿魔尔的长者们赞扬你的秘所，因为你坐在你自己的小金字塔的顶端，是氏族和家族的荣耀。"
 building_laboratory_02: "大型血肉塑造实验室"
 building_laboratory_02_desc: "一个储备充足的血肉塑造实验室是任何蜕变者都羡慕的对象。"
 building_laboratory_03: "巨型血肉塑造实验室"
 building_laboratory_03_desc: "在一件艺术作品中，总能瞥见艺术家的身影。有时，也可能是制作者的“朋友”。"
 building_type_lordly_manor_01: "领主府邸"
 building_type_lordly_manor_01_desc: "#F 这是一个适合地主居住的令人印象深刻的庄园。#!"
 building_lordly_manor_01: "体面府邸"
 building_type_lordly_manor_02_desc: "#F 这是一个适合地主居住的令人印象深刻的庄园。#!"
 building_lordly_manor_02: "大型府邸"
 building_lordly_manor_02_desc: "一个受人敬仰的房屋，你的阴谋诡计和目标都是在这里完成的，不受窥视和耳目的影响。"
 building_lordly_manor_03: "巨型府邸"
 building_lordly_manor_03_desc: "刀光剑影的宫殿，在这里，你就像蜘蛛一样坐在一张巨大的网中心。"
 building_influence_people_02: "重度人群掌控"
 building_influence_people_02_desc: "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才能不变成怪物。"
 building_influence_people_03: "完全人群掌控"
 building_influence_people_03_desc: "每天晚上，通过与人类分享你的生活，你会学到更多东西。它提醒你怎样才算人类。"
 building_crypt_02: "大型墓穴"
 building_crypt_02_desc: "独自在黑暗中，周围有相当数量的尸体和骷髅。现在你有了点头绪。"
 building_crypt_03: "巨型地下墓穴"
 building_crypt_03_desc: "独自在黑暗中，被尸体和腐烂的可憎之物包围。定义乐园的地方。"
 building_type_family_estates_01: "家庭地产"
 building_type_family_estates_01_desc: "#F 无论你是凭自己的智慧和勇气赢得的，还是别人给你的，拥有一个真正的家和可耕种的土地是一种特权，即使是你的创造者也很少能享受到。#!"
 building_family_estates_01: "家庭宅地"
 building_family_estates_01_desc: "对于这个简陋的庄园来说，生活舒适度并不是最需要改进的，但是土地很肥沃，你会得到丰厚的回报。"
 building_family_estates_02: "家庭地产"
 building_family_estates_02_desc: "广大又多产的地产让你觉得自己是一个有地位的人，即使不在贵族同行中也至少是在你拥有的农奴中。"
 building_family_estates_03: "家庭大庄园"
 building_family_estates_03_desc: "这片广阔的土地不仅提供足够的粮食养活军队，它还拥有值得大贵族居住的地方。"
 building_type_family_enterprise_01: "家庭企业"
 building_type_family_enterprise_01_desc: "#F 一个成功的企业家会根据最新的时尚来迎合客户的奇思妙想。血族对此毫不关心，所以他们把任务交给了你们。#!"
 building_family_enterprise_01: "家庭店铺"
 building_family_enterprise_01_desc: "你独特的联系为你提供了可以在凡人中获得优惠价格的商品供应。只要把血迹清理干净就行。"
 building_family_enterprise_02: "家庭市场"
 building_family_enterprise_02_desc: "他们想要，你就卖。不管是一把已故贵族的华丽的剑还是一袋芜菁，利润各不相同，但资金源源不断地流入。"
 building_family_enterprise_03: "家庭进口公司"
 building_family_enterprise_03_desc: "从该地区不知名的食物，到异国的家具与武器和古代文物，所有这些商品都通过你的贸易网络带到这里，其网延伸自与永生者之间的连接。"
 building_type_family_connections_01: "家庭人脉"
 building_type_family_connections_01_desc: "#F 与贵族混在一起就意味着参与了一场挥霍无度的军备竞赛。但有一件事你可以肯定，那就是认识对的人很重要。#!"
 building_family_connections_01: "依靠小贵族"
 building_family_connections_01_desc: "那些以你为代价吃喝的人很少比男爵的二表哥更重要，但你必须开始在某个地方让自己出名和受人尊敬。"
 building_family_connections_02: "依靠贵族"
 building_family_connections_02_desc: "你热情好客的消息已经传开了，现在来拜访你的人都是有能力回报你的人。迟早你会和统治精英们结识的。"
 building_family_connections_03: "依靠大贵族"
 building_family_connections_03_desc: "你努力使自己成为一个有财富和影响力的人，你成功了。领地里最有权力的人会找你，让你选择获得前者或后者。"
 building_type_family_rights_01: "家庭权利"
 building_type_family_rights_01_desc: "#F 你把自己描绘成一个辉煌却被遗忘的家族的继承人。这是不是真的并不重要，重要的是谁承认这一点。#!"
 building_family_rights_01: "领地所有权权利"
 building_family_rights_01_desc: "仅仅确保拥有土地的权利不会让你变得有影响力，但如果你不必埋葬每个到小屋后面敲门的人时，你的生意就会更容易开展。"
 building_family_rights_02: "骑主头衔"
 building_family_rights_02_desc: "当地统治者在他的骑兵旗帜上指定你为战士并授予你相应的特权。他还没发现你不侍奉凡人领主。"
 building_family_rights_03: "堡主头衔"
 building_family_rights_03_desc: "领地的统治者现在认为你的财产是其防御基础设施的重要组成部分。这种认可会带来好处。"
 building_family_rights_04: "巨头地位"
 building_family_rights_04_desc: "你的贵族血统的细节，以及如何演绎你在贵族中的地位，相比于你明面上的财富和权力，完全是次要的。不管你是不是大贵族，你都是不容小觑的人。"
 building_type_gpeasants_01: "煽动农民"
 building_type_gpeasants_01_desc: "长期以来，为贵族提供食物的人受到剥削和虐待。现在是赋予他们广大群众权力的时候了。"
 building_gpeasants_01: "煽动不幸者"
 building_gpeasants_01_desc: "由于不拥有自己耕种的土地，那些收成特别糟糕的农民已经没有什么可失去的了。给点希望，他们就会跟着我们走。"
 building_gpeasants_02: "煽动过劳者"
 building_gpeasants_02_desc: "在把大部分收成交给领主之后，很少有农民能从他们工作的土地上获得比可怜的生活更多的保障。现在是时候让他们相信，天主并不打算让他们过这种生活。"
 building_gpeasants_03: "煽动虔信者"
 building_gpeasants_03_desc: "每一个农民都本能地懂得，那些工作最辛苦的人应该最先享受劳动的果实。信仰能给他们勇气让世界以这种方式运转。"
 building_type_gcraftsmen_01: "煽动工人"
 building_type_gcraftsmen_01_desc: "城镇劳动者虽然比农村劳动者享有更高的地位，但在腐朽信仰的推动下，他们仍然受到剥削。现在是向他们介绍另一种选择的时候了。"
 building_gcraftsmen_01: "煽动学徒"
 building_gcraftsmen_01_desc: "学徒们忍受的苦难远比他们的教育所要求的要严重得多。我们可以利用他们的挫折感，将其转化为正义的愤怒。"
 building_gcraftsmen_02: "煽动熟练工"
 building_gcraftsmen_02_desc: "这些熟练工花了他们一生中最有生产力的部分，为丰富他们的主人而劳动。这不是神的旨意，而匠人想听到这旨意。"
 building_gcraftsmen_03: "煽动工匠大师"
 building_gcraftsmen_03_desc: "工匠大师在行会中居于最高地位，但即使如此，他们也要服从于他们高贵的领主。一个人的高贵之处在于他对他的兄弟的有用之处，甚至大师们也能认同这个概念。"
 building_type_gfootmen_01: "煽动步兵"
 building_type_gfootmen_01_desc: "没有得到应有报酬的士兵是什么？一个等待目标的叛逆者。而我们有正当的目标。"
 building_gfootmen_01: "煽动无饷者"
 building_gfootmen_01_desc: "没有得到应有报酬的士兵是什么？一个等待目标的叛逆者。而我们有正当的目标。"
 building_gfootmen_02: "煽动遭虐者"
 building_gfootmen_02_desc: "如果生活能提供更好的选择，还会有人会忍受疲惫、饥饿和寒冷，冒着疾病和暴死的危险，只为让自己的领主拥有更多的土地和头衔吗？我们可以为这些武装分子提供一条通往天主的道路。"
 building_gfootmen_03: "煽动有志者"
 building_gfootmen_03_desc: "如果高级领导职位早已预留给贵族，士兵的勇敢、能力、忠诚和主动性又有什么意义呢？我们神圣的功业为那些努力争取更多机会来证明自己价值的人提供了机会。"
 building_type_heretic_hall_01: "人民之殿"
 building_type_heretic_hall_01_desc: "#F 我们欢迎所有信神的孩子到我们的住所来滋养他们的身体和灵魂。#!"
 building_heretic_hall_01: "人民集会"
 building_heretic_hall_01_desc: "天主是无所不在的，聚集在祂圣殿的唯一需求的就是指定一个地点。不过买几把椅子就更好了。"
 building_heretic_hall_02: "人民之家"
 building_heretic_hall_02_desc: "信徒们渴望精神食粮，而我们的布道鼓舞人心，能让其在忍受落雨，但有个屋顶并不会伤害他们。"
 building_heretic_hall_03: "人民之殿"
 building_heretic_hall_03_desc: "一个足够宽敞的建筑，可以举行弥撒、公共聚餐、集会和对我们神圣功业的敌人的审判。"
 building_heretic_hall_04: "人民之宫"
 building_heretic_hall_04_desc: "这是我们集群团结的证明。每一个忠诚的灵魂的家园都因共同的劳动而辉煌。"
 building_type_inquisition_forsaken_01: "弃民的游击队"
 building_type_inquisition_forsaken_01_desc: "#F 所有现存的，无论是凡人的还是$pod_cainite$的势力，都反对我们的神圣功业，为此工具必须暗中发挥作用。#!"
 building_inquisition_forsaken_01: "难民营"
 building_inquisition_forsaken_01_desc: "森林虽然荒凉，却为摆脱主人束缚的人提供了一个安全的避风港。"
 building_inquisition_forsaken_02: "游击队聚居地"
 building_inquisition_forsaken_02_desc: "一个隐藏在荒野深处的庞大军事设施。我们教友中希望与敌人作战的人都来这里训练。"
 building_inquisition_forsaken_03: "无形要塞"
 building_inquisition_forsaken_03_desc: "由狭窄的森林小径、树梢平台、桥梁和隧道组成的迷宫，陷阱和哨位随处可见。它既可怕又隐蔽。"
 building_temple_set_02: "赛特神殿"
 building_temple_set_02_desc: "对赛特的信仰在这片土地上恢复了某种能力，腐化从内部流露出来。"
 building_temple_set_03: "赛特神殿"
 building_temple_set_03_desc: "赞美赛特之名！这座神殿为他的黑暗之名带来了荣耀，而你所拥有的凡人和$pod_cainite$侍从为他带来了无尽的荣耀！"
 building_devasthana_02: "大型印度庙"
 building_devasthana_02_desc: "在这些大厅里，你会寻得更大的力量来保护提婆的土地不受[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]的影响。"
 building_devasthana_03: "宏大的印度庙"
 building_devasthana_03_desc: "提婆的大厅与许多最伟大的凡人建筑一样，是你的奉献和战胜[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]的纪念碑。"
 building_brahmavihara_02: "大型等舍"
 building_brahmavihara_02_desc: "在这里，沉思和专注是充足的，使你感到更接近于平静。这很美妙。"
 building_brahmavihara_03: "宏大的等舍"
 building_brahmavihara_03_desc: "在这个神圣的地方，你又找到了平静。这应是足够的。这算是足够的。"
 building_unending_party_02: "十年派对"
 building_unending_party_02_desc: "过量和贪食，欲望和骄傲在这些大厅里像血一样流动。这很美。"
 building_unending_party_03: "世纪派对"
 building_unending_party_03_desc: "如此美妙的地方，如此美妙的脸。你的客人可以随时退房，但他们永远无法离开。"
 building_mother_garden_02: "母亲的庭园"
 building_mother_garden_02_desc: "作为“母亲”，莉莉丝诱使我们粉碎自满的枷锁，带来新的真理。"
 building_mother_garden_03: "老妪的庭院"
 building_mother_garden_03_desc: "作为“老妪”，莉莉丝诱使我们接受死亡的不可避免性，而在这里，我们就是这不可避免性。"
 building_influence_clergy_02: "显著圣职掌控"
 building_influence_clergy_02_desc: "大量给当地宗教当局的“捐赠”确保你在社区享有良好的声誉。"
 building_influence_clergy_03: "重度圣职掌控"
 building_influence_clergy_03_desc: "你从圣人那里学得很多，从恶人那里学得更多。你只需要偶尔弄清楚其中的区别就行了。"
 building_assassins_cell_02: "大型刺客之室"
 building_assassins_cell_02_desc: "哈基姆派在这个地区的大量活动，让你有一些非常有用的后备用于你更多的……秘密目的。"
 building_assassins_cell_03: "宏大的刺客之室"
 building_assassins_cell_03_desc: "哈基姆派在这个地区的大量活动，保证了你有非常有用的后备力量来实现你更多的……不正当的目标。但只是看看你在这里所拥有的资源，你就知道你会成功。"
 building_type_influence_nightwatch_01: "掌控守夜人"
 building_type_influence_nightwatch_01_desc: "#F 当地驻军可能是一个受欢迎的资产，能帮助训练你的个人随从，以及，喂养。不过你得动用一些关系才能办到。#!"
 building_influence_nightwatch_01: "轻度守夜人掌控"
 building_influence_nightwatch_01_desc: "在大多数官员的眼皮底下，通过贿赂其他人，你的私人保镖已经开始与当地民兵组织合作了。"
 building_influence_nightwatch_02: "显著守夜人掌控"
 building_influence_nightwatch_02_desc: "你的手下现在是一个有价值的“佣兵团”，在当地人的帮助下保护城市。一个双赢的局面。至少对你来说是这样。"
 building_influence_nightwatch_03: "重度守夜人掌控"
 building_influence_nightwatch_03_desc: "你再也分不清手下和本地人了。他们都以这样或那样的方式为你服务。"
 building_type_influence_mercenaries_01: "掌控佣兵"
 building_type_influence_mercenaries_01_desc: "#F 凡人发展出了“雇佣兵”的概念，可雇佣的有经验的士兵。这当然是你可以用来为自己谋利益的东西。#!"
 building_influence_mercenaries_01: "轻度佣兵掌控"
 building_influence_mercenaries_01_desc: "你在一个本地团队中有一些人际关系。足够给你一些选择。"
 building_influence_mercenaries_02: "显著佣兵掌控"
 building_influence_mercenaries_02_desc: "你可以依靠一群经验丰富的凡人士兵来捍卫你在这地区的利益。"
 building_influence_mercenaries_03: "重度佣兵掌控"
 building_influence_mercenaries_03_desc: "这里的雇佣兵现在是你的私人防卫部队。"
 building_type_influence_outriders_01: "掌控郊区人"
 building_type_influence_outriders_01_desc: "#F 护林人、侦察兵、看守和信使在这伯爵领的郊区游荡，他们都能成为有价值的资产，但要付出一定的代价。#!"
 building_influence_outriders_01: "轻度郊区人掌控"
 building_influence_outriders_01_desc: "只要在正确的口袋里装上一些钱，就有少数忠诚的郊区人将通报你了解你的领地边界上的事件。"
 building_influence_outriders_02: "显著郊区人掌控"
 building_influence_outriders_02_desc: "数十名郊区人臣服于你的统治之下，他们首先向你报告这片土地上发生的事情，然后才向他们的领主报告。"
 building_influence_outriders_03: "重度郊区人掌控"
 building_influence_outriders_03_desc: "领地内近乎全部看守和巡林人在与任何人之前向你报告，只以非常少的工资。"
 building_fallen_church_02: "堕者神殿"
 building_fallen_church_02_desc: "反对恐怖造物的呼声在这里听到更多。这开始变得响亮了。"
 building_fallen_church_03: "堕者大教堂"
 building_fallen_church_03_desc: "在这座宏伟的大教堂内，救赎与希望的低语现在都浸透了这些墙壁，因此它们现在变得极度神圣。"
 building_lordly_manor_01_desc: "在那里，某人做出决议，策划谋略，执行审判。希望那人是你。"
 building_type_inquisition_cell_01: "裁判室"
 building_type_inquisition_cell_01_desc: "#F 在这里，征服非人类邪恶势力的人们聚集在一起，协调行动，相互指导，存放捐款，并守护着这片土地。#!"
 building_inquisition_cell_01: "初建的裁判室"
 building_inquisition_cell_01_desc: "不要期待防御用门之外的家具，最多一个包含必要资源的箱子和最基本的设施，放于一个新建立的猎人猎群。尽管如此，它仍是希望的芽种。"
 building_inquisition_cell_02: "站稳的裁判猎群"
 building_inquisition_cell_02_desc: "为那些与黑暗作战的人提供一个安全的藏身处和运作基地。一个休息，疗伤，完善技艺的地方。"
 building_inquisition_cell_03: "裁判所枢纽"
 building_inquisition_cell_03_desc: "这个熙熙攘攘的大厅不仅仅是一个哨所，这里是计划和调整针对地狱仆从的特大行动的地方。"
 building_influence_noble_04: "完全贵族掌控"
 building_influence_noble_04_desc: "大家都知道，谁才是这里真正的规则制定者。"
 building_influence_nightwatch_04: "完全守夜人掌控"
 building_influence_nightwatch_04_desc: "守夜人？他们直接向我的人报告。"
 building_influence_underworld_04: "完全下层社会掌控"
 building_influence_underworld_04_desc: "犯罪头目蜂拥而至，亲吻你的戒指。"
 building_influence_merchant_04: "完全商人掌控"
 building_influence_merchant_04_desc: "钱必须流出来！进入你的口袋。"
 building_rabble_thugs_04: "完全流氓和恶棍掌控"
 building_rabble_thugs_04_desc: "没人会想念他们，你也不会。"
 building_influence_law_04: "完全立法者掌控"
 building_influence_law_04_desc: "法律很没意思。为啥不自己制订呢？"
 building_influence_mercenaries_04: "完全佣兵掌控"
 building_influence_mercenaries_04_desc: "这时候你还能叫他们雇佣兵吗？很难说。"
 building_influence_barracks_04: "完全兵营掌控"
 building_influence_barracks_04_desc: "你现在可以用活人来玩战棋了！"
 building_influence_burghers_04: "完全市民掌控"
 building_influence_burghers_04_desc: "你喜欢他们和他们的钱，但你还不完全热衷于他们的时尚选择。"
 building_type_family_worship_01: "家庭信仰"
 building_type_family_worship_01_desc: "#F 每个家庭都有自己的传统，很少有比他们信仰的方式更重要的。#!"
 building_family_worship_01: "家庭神龛"
 building_family_worship_01_desc: "一个谦逊，但有尊严的地方，指定来崇拜人类的神，或将你引导向你的永生的力量。"
 building_family_worship_02: "家庭礼拜堂"
 building_family_worship_02_desc: "一个宽敞的房间或一个独立的建筑，这个礼拜的地方可以方便共同祈祷，即使是最人数众多的氏族。"
 building_family_worship_03: "私密神殿"
 building_family_worship_03_desc: "无论是伪装成难以接近的教堂，还是工业规模的酒窖，这个设施都是你家庭奉献的见证。"
 building_type_family_muscle_01: "家庭打手"
 building_type_family_muscle_01_desc: "#F 生活在凡人世界和黑夜领主领地之间的门槛是危险和困难的，得有暴力类型的帮凶帮助#!"
 building_family_muscle_01: "当地暴徒"
 building_family_muscle_01_desc: "把邻居暴徒和麻烦制造者放在你的牌库里并不会为大征服铺平道路，但在小争端中却非常有用。"
 building_family_muscle_02: "家族守卫"
 building_family_muscle_02_desc: "这些人值得信赖，装备精良，保卫着你们家所珍视的东西。"
 building_family_muscle_03: "家庭旗队"
 building_family_muscle_03_desc: "他们拥有一位战士所能梦寐以求的训练和装备，能够组成那个时代最具毁灭性的军伍——重骑兵旗队。"
 building_influence_outriders_04: "完全郊区人掌控"
 building_influence_outriders_04_desc: "即使是可怖的狼人也会嫉妒你对荒野的了解。"
 building_type_northern_throne_01: "北境王座"
 building_type_northern_throne_01_desc: "#F 这是[GetTrait('tzimisce').GetName(GetNullCharacter)]权威向喀尔巴阡以外扩散的象征#!"
 building_northern_throne_01: "北境王座"
 building_northern_throne_01_desc: "这个区域性大都市完全受其[GetTrait('tzimisce').GetName(GetNullCharacter)]霸权的独家控制。铁律代表了魔物们通过要得$pod_clan$尊重来取得霸权地位的新标准。"
 building_type_den_of_screams_01: "尖嚎之窝巢"
 building_type_den_of_screams_01_desc: "#F 在这个悲惨的地方，痛苦和恐惧的哭喊与虐待狂的狂喜的嚎叫混合成一种不洁的嘈杂声。#!"
 building_den_of_screams_01: "尖嚎之窝巢"
 building_den_of_screams_01_desc: "在这里，折磨和屠杀是在近乎虔诚的勤奋中进行的。"
 building_den_of_screams_02: "恐怖之窝巢"
 building_den_of_screams_02_desc: "在这里举行的即残忍又有开创性的可怕仪式重新定义了痛苦一词的概念。"
 building_den_of_screams_03: "疯狂之窝巢"
 building_den_of_screams_03_desc: "仅仅是试图描述这里发生的邪恶行为，就会对交换情报的双方的精神造成不可弥补的损害。"
 building_type_summoning_chamber_01: "召唤之间"
 building_type_summoning_chamber_01_desc: "#F 从堕者那里得到恩惠既不容易，也不便宜，需要有充分的准备以在一些安全的地方征求他们。#!"
 building_summoning_chamber_01: "召唤之间"
 building_summoning_chamber_01_desc: "一个适合尝试私下接触堕落灵类的地方。"
 building_summoning_chamber_02: "召唤之厅"
 building_summoning_chamber_02_desc: "这里着举行不洁的仪式，以确保与灵类国度的黑暗居民达成交易。"
 building_summoning_chamber_03: "召唤之场"
 building_summoning_chamber_03_desc: "这是域外世界的最黑暗的国度们的隐秘大使馆。"
 building_influence_clergy_04: "完全圣职掌控"
 building_influence_clergy_04_desc: "比起其神更加服从于你的人真的比其他走狗更重要么？如果是这样，这就还不是最糟糕的麻烦。"
 building_type_eternal_parish_01: "永恒牧区"
 building_type_eternal_parish_01_desc: "#F 在这里，那些认为血族是天主之子的信仰得到了背书。#!"
 building_eternal_parish_01: "永恒牧区"
 building_eternal_parish_01_desc: "在这里，布道是为所有天主之子所讲的。"
 building_eternal_parish_02: "永恒教区"
 building_eternal_parish_02_desc: "在这里，所有天主之子在教会法面前都是平等的。"
 building_eternal_parish_03: "永恒教省"
 building_eternal_parish_03_desc: "在这里，信仰的教义被写在天主之子的心中。"
 building_type_founding_temple_01: "根基神殿"
 building_type_founding_temple_01_desc: "每一赛特密教都起源于一座根基神殿。其中最具影响力和最受尊敬的由圣显者直接管辖。"
 building_founding_temple_01: "根基神殿"
 building_founding_temple_01_desc: "每一赛特密教都起源于一座根基神殿。其中最具影响力和最受尊敬的由圣显者直接管辖。"
 building_type_sanctuary_of_flesh_01: "血肉圣所"
 building_type_sanctuary_of_flesh_01_desc: "这是[GetTrait('tzimisce').GetName(GetNullCharacter)]$pod_clan$世代以来所掌握的血肉塑造力量的一个可怕的例子"
 building_sanctuary_of_flesh_01: "血肉圣所"
 building_sanctuary_of_flesh_01_desc: "这是[GetTrait('tzimisce').GetName(GetNullCharacter)]$pod_clan$世代以来所掌握的血肉塑造力量的一个可怕的例子"
 building_type_ashen_court_01: "贵族家庭家臣"
 building_type_ashen_court_01_desc: "#F 你的影响直达当地贵族的城堡。#!"
 building_ashen_court_01: "受控个体"
 building_ashen_court_01_desc: "由于你对当地贵族的影响，你现在控制了一些乐意为你服务的人。"
 building_ashen_court_02: "受控家庭"
 building_ashen_court_02_desc: "你的影响达到更深处，现在你控制了这个地区的一些贵族家庭。"
 building_ashen_court_03: "受控宗族"
 building_ashen_court_03_desc: "你对当地贵族的控制如此之强，以至于你现在控制了这个地区的数个宗族。"
 building_type_ashen_commandery_01: "灰之骑士分团会堂"
 building_type_ashen_commandery_01_desc: "#F 一个由$pod_cainites$和他们的凡人家臣组成的军团的分团。#!"
 building_ashen_commandery_01: "小型骑士管领地"
 building_ashen_commandery_01_desc: "一个容纳许多$pod_cainites$和凡人副手的小型骑士管领地。"
 building_ashen_commandery_02: "大型骑士管领地"
 building_ashen_commandery_02_desc: "骑士管领地被扩展，好容纳更多的凡人家臣，以及大型马厩和库存充足的军械库。"
 building_ashen_commandery_03: "要塞化骑士管领地"
 building_ashen_commandery_03_desc: "现在，骑士管领地本身就是一个令人生畏的防御工事，有着厚实的城墙和沉重的大门，容纳了大量的$pod_cainite$骑士和他们信任的家臣。"
 building_type_ashen_office_01: "受控的执事所"
 building_type_ashen_office_01_desc: "#F 为你服务的$pod_cainite$管家和商人，和他们的凡人家臣的办公室。#!"
 building_ashen_office_01: "小型办公室"
 building_ashen_office_01_desc: "一间由当地管家和商人组成的小型办公室，帮助你管理当地土地。"
 building_ashen_office_02: "中型办公室"
 building_ashen_office_02_desc: "一间中型办公室，你的下仆控制着这个地区的资金流动，填装着你的口袋。"
 building_ashen_office_03: "大型办公室"
 building_ashen_office_03_desc: "一间大型办公室，里面只有最好的执事，管家和商人，负责将经济重新分配给你。"
 building_type_ashen_ring_01: "犯罪圈"
 building_type_ashen_ring_01_desc: "#F 对当地的$pod_cainite$罪犯和他们的凡人家臣的影响。#!"
 building_ashen_ring_01: "小型圈子"
 building_ashen_ring_01_desc: "这个地区的罪犯开始和你达成谅解。"
 building_ashen_ring_02: "中型圈子"
 building_ashen_ring_02_desc: "随着你对这个地区的不法之徒世界的影响力越来越大，一些不法之徒开始为你服务。"
 building_ashen_ring_03: "大型圈子"
 building_ashen_ring_03_desc: "你对这片土地上的不法之徒的影响是如此之大，以至于这片土地上所有的$pod_cainite$亡命之徒都为你服务。"
 building_type_ashen_cult_site_01: "礼拜之地"
 building_type_ashen_cult_site_01_desc: "#F 强大的$pod_cainites$聚集他们虔诚信徒的地方。#!"
 building_ashen_cult_site_01: "血林"
 building_ashen_cult_site_01_desc: "一些密教徒聚集在这里崇拜和侍奉你。"
 building_ashen_cult_site_02: "血堂"
 building_ashen_cult_site_02_desc: "你大量的虔诚密教徒侍从崇拜和侍奉你的地方。"
 building_ashen_cult_site_03: "血殿"
 building_ashen_cult_site_03_desc: "一个显示你比血畜和$pod_cainite$优越的地方，众多的信徒聚集在这里崇拜和侍奉你。"
 building_type_dragon_nest_01: "掌握龙穴"
 building_type_dragon_nest_01_desc: "#F 一些特殊地区积蓄着大量的气，这会吸引大量的鬼神和感知敏锐的凡人，此类地区被鬼神称作圣地，节点，鬼屋，中原族裔则称其为龙穴。#!"
 building_dragon_nest_01: "掌握龙脉"
 building_dragon_nest_01_desc: "此处气机旺盛，值得深入探查。"
 building_dragon_nest_02: "掌握龙穴"
 building_dragon_nest_02_desc: "龙脉是连接多个龙穴的强大气脉，拥有足够力量的神灵可借龙脉实现远距离传送等伟力。"
 building_dragon_nest_03: "掌握龙穴"
 building_dragon_nest_03_desc: "虽规模尚小且未充分开发，但此地气源潜力深厚。"
 building_type_aphrodisium_01: "安科纳的阿佛洛狄忒殿"
 building_type_aphrodisium_01_desc: "#F 一座隐秘的神殿，致力于满足凡人和$pod_cainites$的自然饥渴，在那里，唯一真正的圣礼是爱和那些带来愉悦的行为。#!"
 building_aphrodisium_01: "隐蔽的阿佛洛狄忒殿"
 building_aphrodisium_01_desc: "阿佛洛狄忒的最后几位女祭司藏在安科纳地下深处，害怕着十字的报复。"
 building_aphrodisium_02: "崛起的阿佛洛狄忒殿"
 building_aphrodisium_02_desc: "教育着所有寻求欲求途径的知识的人，阿佛洛狄忒殿正在再次成为一个愉悦信仰中心。"
 building_aphrodisium_03: "凯旋的阿佛洛狄忒殿"
 building_aphrodisium_03_desc: "这是一个在逆境中生存的象征，是基督教降临前原罪之道的美好夜晚的余韵。"
 building_type_castle_lake_01: "湖中堡"
 building_type_castle_lake_01_desc: "#F 濒死的苦烬骑士团的总部位于一个被神圣洪水净化的山谷中。#!"
 building_castle_lake_01: "沉沒的城堡"
 building_castle_lake_01_desc: "城堡几乎无法居住，但仍然是$pod_cainite$骑士团的一个重要聚会场所。"
 building_castle_lake_02: "受淹的城堡"
 building_castle_lake_02_desc: "修复和扩建工作夜以继日地进行，让古老的废墟重新获得了一些荣耀。"
 building_castle_lake_03: "现世的城堡"
 building_castle_lake_03_desc: "可敬的$pod_cainites$战胜了他们的恶魔，精神上的和其他方面的恶魔。"
 building_type_fire_court_01: "火之庭"
 building_type_fire_court_01_desc: "#F 这是一个充满奇异和禁忌愉悦的地方，在#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!的注视下，过去各王朝的知识被收集于此。#!"
 building_fire_court_01: "冒头的火之庭"
 building_fire_court_01_desc: "在太阳王之祭礼将#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L 赛特之子#!#!驱逐出孟菲斯和吉萨后建立的火之庭，在后来发展到不仅仅是一个临时解决方案。"
 building_fire_court_02: "奠基的火之庭"
 building_fire_court_02_desc: "如果一个人寻找别人无法提供的知识，访问火之庭会有很大的收获。但当然，人们必须准备好付出代价。"
 building_fire_court_03: "权威的火之庭"
 building_fire_court_03_desc: "现在，埃及的主要[GetTrait('setite').GetName(GetNullCharacter)]神殿，火之庭的荣耀和危险，都是远近闻名的。"
 building_type_black_college_01: "黑学院"
 building_type_black_college_01_desc: "#F 这所致力于黑暗技艺的臭名昭著的学院也被称为黑学校，在无数次内战中被[GetTrait('baali').GetName(GetNullCharacter)]自身粉碎。#!"
 building_black_college_01: "废弃的黑学院"
 building_black_college_01_desc: "有些书仍然保留着，保持着最好永远被遗忘的秘密。"
 building_black_college_02: "复苏的黑学院"
 building_black_college_02_desc: "学院的一些部分已经被修复，向粗心的主人揭示了它们的恐怖。"
 building_black_college_03: "霸权的黑学院"
 building_black_college_03_desc: "再一次，房间里充满了学习技艺的魔邪学生。再一次，世界因异世界的实体如饥似渴地看着它而颤抖。"
 building_type_knossos_labyrinth_01: "克诺索斯迷宫"
 building_type_knossos_labyrinth_01_desc: "#F 内尔伽勒有一次几乎从这里毁灭了世界，只是被一个从未有过的、也不再会有的所有$pod_cainite$的联盟所阻止。#!"
 building_knossos_labyrinth_01: "废弃的克诺索斯迷宫"
 building_knossos_labyrinth_01_desc: "岛屿震荡，凡人恐惧，谣言四起。"
 building_knossos_labyrinth_02: "复原的克诺索斯迷宫"
 building_knossos_labyrinth_02_desc: "疯狂之源再次增长。它能否被及时阻止？"
 building_knossos_labyrinth_03: "地狱般的克诺索斯迷宫"
 building_knossos_labyrinth_03_desc: "这一次，这个世界将无法存活。内尔伽勒可怕的笑容再次笼罩着这个注定末日的世界。"
 building_type_sernog_monastery_01: "塞尔诺格修道院"
 building_type_sernog_monastery_01_desc: "#F 一座气势汹汹的废弃堡垒，其发黑的墙壁仿若对抗天空的黑暗骷髅，且有着向星空开放的建筑外壳。与堡垒相连的是一座古老的大教堂，表面看上去不错，但其险恶程度不亚于其相邻建筑。#!"
 building_sernog_monastery_01: "废弃的塞尔诺格修道院"
 building_sernog_monastery_01_desc: "大教堂的内部反映出一种黑暗的不祥气氛。建筑似乎是通过一些疯狂设计师的狂想所雕刻出来的。那些可能是天使但却像魔鬼的怪异雕刻俯视着那些通过拱门进入前圣所的人。"
 building_sernog_monastery_02: "复原的塞尔诺格修道院"
 building_sernog_monastery_02_desc: "大教堂内的空气有一种发霉的、令人窒息的气味，仿佛有什么永久垂死之物嵌在石头里，并正在永恒腐烂的瘴气中渗出其精华。"
 building_sernog_monastery_03: "巍峨的塞尔诺格修道院"
 building_sernog_monastery_03_desc: "阴森的呻吟声充斥着空旷的中央大厅，在高高的拱形梁柱上回荡，并回馈为嘈杂的尖叫声，仿佛大量受害者在经历长期剧烈折磨时的哭泣。"
 building_type_iglesia_01: "圣仆圣尼可拉斯教堂"
 building_type_iglesia_01_desc: "#F 这座雄伟的教堂建在一座清真寺的废墟上，其内部隐藏着一些黑暗的东西。它呼唤着[GetTrait('lasombra').GetName(GetNullCharacter)]的阴暗灵魂。#!"
 building_iglesia_01: "教堂地基"
 building_iglesia_01_desc: "一个看起来很平凡的教堂地下室，如果你忽略在所有入侵者周围旋转的阴影。"
 building_iglesia_02: "教堂废墟"
 building_iglesia_02_desc: "清真寺的废墟在地基深处依然可见。它们的神圣性早已不复存在，只给任何拜访者留下令人不安的记忆和幻觉。"
 building_iglesia_03: "教堂的地下墓穴"
 building_iglesia_03_desc: "扭曲的隧道、移动的影子、疯狂的闪光……教堂的地下墓穴是源自深渊真实性质的令人不安的风景。通往一个永远没有光亮的世界的大门。"
 building_type_castle_avalon_01: "阿瓦隆之堡"
 building_type_castle_avalon_01_desc: "#F 勇敢的阿瓦隆骑士们在这个令人印象深刻的建筑中扬帆起航，延续着密特拉——不屈之阳的传说。#!"
 building_castle_avalon_01: "圣欧斯特雷贝尔特礼拜堂"
 building_castle_avalon_01_desc: "驯狼修女是骑士团的守护神，可以看到许多骑士在困难时期向她祈祷。"
 building_castle_avalon_02: "阿瓦隆堡垒"
 building_castle_avalon_02_desc: "一个强大的，不过空荡的堡垒。寻求崇高的功业的年轻骑士们的救赎希望。"
 building_castle_avalon_03: "夜中卡美洛"
 building_castle_avalon_03_desc: "也许不是真正的哪个，但这个强大的堡垒仍然是阿瓦隆骑士们的亚瑟派和密特拉派灯塔。"
 building_type_kerak_in_dan_01: "丹中卡拉克"
 building_type_kerak_in_dan_01_desc: "#F 黑骑士团的城堡，被遗忘在沙和血中。一个消逝的时代的遗迹。#!"
 building_kerak_in_dan_01: "废弃的卡拉克"
 building_kerak_in_dan_01_desc: "黑蔷薇，就像该隐异端本身一样，曾经有过更好的夜晚。废墟上充满了回忆和蜘蛛网，但没有更多的东西了。"
 building_kerak_in_dan_02: "复原的卡拉克"
 building_kerak_in_dan_02_desc: "在废墟中，可以找到古老的石碑。这里有许多来自黎凡特各种密教的卷轴和圣像。"
 building_kerak_in_dan_03: "凯旋的丹中卡拉克"
 building_kerak_in_dan_03_desc: "这堡垒象征着隐异端的回归，并且再也不会离开。"
 building_type_barcelona_library_01: "巴塞罗那图书馆"
 building_type_barcelona_library_01_desc: "#F 由好奇心强的米雷亚·苏比拉亲王开始，巴塞罗那图书馆作为一个广泛的知识的源泉在整个西班牙闻名。#!"
 building_barcelona_library_01: "平凡工程"
 building_barcelona_library_01_desc: "从肮脏的法律到深奥的哲学，凡人曾经产有的一切有价值的东西都在这里。"
 building_barcelona_library_02: "隐秘工程"
 building_barcelona_library_02_desc: "异端邪说、其他亲王的名字、秘密图书馆及其禁忌的资料都可以在这里找到。"
 building_barcelona_library_03: "独特工程"
 building_barcelona_library_03_desc: "挪得学家的碎片、布鲁赫的背叛和迦太基的陷落……巴塞罗那现在是各地神秘主义者的圣地。"
 building_type_tower_flies_01: "蝇之塔"
 building_type_tower_flies_01_desc: "#F 像伸出的手臂一样突出于地中海的是一个长长的土制突堤，在突堤的尽头矗立着一个高大的、由白石制成的禁忌结构。#!"
 building_tower_flies_01: "废弃的蝇之塔"
 building_tower_flies_01_desc: "他们曾经是可怕的[GetTrait('baali').GetName(GetNullCharacter)]的堡垒，在圣保罗到来后被迫撤离。然后他们在水线下的一个小洞穴里开张。"
 building_tower_flies_02: "复原的蝇之塔"
 building_tower_flies_02_desc: "当[GetTrait('baali').GetName(GetNullCharacter)]回到他们的堡垒时，空气中弥漫着黑暗和可怕的幻觉，这是一个可怕时代的余波。"
 building_tower_flies_03: "可怖的蝇之塔"
 building_tower_flies_03_desc: "黑暗又回来了，从塔中蔓延开来，就像一波无尽的恐怖。而这一次，没有圣人可以拯救凡间。"
 building_type_library_malta_01: "马耳他图书馆"
 building_type_library_malta_01_desc: "#F $pod_cainite$世界最大的秘密图书馆，存书放于许多口袋状的洞穴中，由一条隧道连接。#!"
 building_library_malta_01: "初见房间"
 building_library_malta_01_desc: "希腊文和拉丁文作品、阿拉伯文著作、德鲁伊符文、古老绘画的遗迹，一张张猥琐的人脸在迎接任何访客……"
 building_library_malta_02: "隐匿房间"
 building_library_malta_02_desc: "地板上的所罗门印记存放着更黑暗的宝藏、神秘学资料、恶魔学、色情书以及战争和酷刑手册。"
 building_library_malta_03: "被封印的房间"
 building_library_malta_03_desc: "被一块刻有雪松树标志的巨大石头挡住，可以感知到这里的存在，但这个房间从未被打开过。可能也不应该被打开。"
 building_type_hamilcar_palaestra_01: "哈米尔卡角力学校"
 building_type_hamilcar_palaestra_01_desc: "#F 训练厅是[GetTrait('brujah').GetName(GetNullCharacter)]的圣地，是它远离外部世界的退路。他们可以在此研习书籍，练习刀剑或磨练生理[Glossary('血律','game_concept_discipline_desc')]。#!"
 building_hamilcar_palaestra_01: "小型哈米尔卡角力学校"
 building_hamilcar_palaestra_01_desc: "仅剩的最大的训练厅，用汉尼拔的著名大象的象牙装饰着。"
 building_hamilcar_palaestra_02: "大型哈米尔卡角力学校"
 building_hamilcar_palaestra_02_desc: "经过多年的重建和扩建，训练厅再次无愧于古典时代的光荣前身。"
 building_hamilcar_palaestra_03: "壮观的哈米尔卡角力学校"
 building_hamilcar_palaestra_03_desc: "一个学习、锻体和展现历史自豪的中心。$pod_clan$[GetTrait('brujah').GetName(GetNullCharacter)]的定义。"
 building_type_castle_hardestadt_01: "哈德施塔特堡"
 building_type_castle_hardestadt_01_desc: "#F 随着哈德施塔特对吸血鬼世界的影响越来越大，他最喜欢的城堡也是如此。如果信他，那此处就是传家宝。#!"
 building_castle_hardestadt_01: "小型哈德施塔特堡"
 building_castle_hardestadt_01_desc: "一座典型的德意志城堡，此处为各地$pod_cainites$的未来做出了重大决定。"
 building_castle_hardestadt_02: "大型哈德施塔特堡"
 building_castle_hardestadt_02_desc: "一座巨大的德意志城堡，防守非常好。若没有主人的邀请，很少有人敢进入。"
 building_castle_hardestadt_03: "雄伟的哈德施塔特堡"
 building_castle_hardestadt_03_desc: "就像它的主人一样，哈德施塔特堡在$pod_cainite$的历史上是一股可怕的力量。一个许多人都想进入的地方，如果他们不害怕无法离开的话。"
 building_type_castle_bran_01: "布兰城堡"
 building_type_castle_bran_01_desc: "#F 一座非常小的城堡，由条顿骑士团为控制博尔戈帕斯建造。一个无关紧要的、毫不重要的地方……#!"
 building_castle_bran_01: "小型布兰城堡"
 building_castle_bran_01_desc: "被遗忘和空置，特兰西瓦尼亚众多小城堡中的一座。但这座城堡有一些不同之处……"
 building_castle_bran_02: "杰出布兰城堡"
 building_castle_bran_02_desc: "从这，一位传奇将诞生。主人将成就他的城堡，而城堡将成就他的主人。"
 building_castle_bran_03: "传奇布兰城堡"
 building_castle_bran_03_desc: "听，黑夜之子。听他们发出了怎样的音乐！"
 building_type_vienna_chantry_01: "维也纳歌祷堂"
 building_type_vienna_chantry_01_desc: "#F 维也纳歌祷堂由埃特里乌斯建造，作为塞奥里斯沦陷时的一个潜在后方，是保守派[GetTrait('tremere').GetName(GetNullCharacter)]派的要塞。#!"
 building_vienna_chantry_01: "小型维也纳歌祷堂"
 building_vienna_chantry_01_desc: "维也纳歌祷堂坐落在城市北部数英里外的锯齿状海角上，看起来就像一个大型的、气派的狩猎小屋。"
 building_vienna_chantry_02: "大型维也纳歌祷堂"
 building_vienna_chantry_02_desc: "它的墙壁是由大块的灰色石头组成的，通过埃特里乌斯的魔法从大地中凿出。"
 building_vienna_chantry_03: "雄伟的维也纳歌祷堂"
 building_vienna_chantry_03_desc: "通过平凡和魔法的手段达成的巨大规模和严谨防御，没有任何东西可以打破这个化为堡垒的歌祷堂。"
 building_type_lion_green_01: "狮之绿园"
 building_type_lion_green_01_desc: "#F 梅琳达在英格兰的要塞。这是个虚开的地方，精明的议员在这里策划着她的下一步外交行动。#!"
 building_lion_green_01: "小型狮之绿园"
 building_lion_green_01_desc: "狮之绿园是一座高大的石塔。大多数当地人认为它是一位对城市生活有兴趣的贵族的次级庄园。"
 building_lion_green_02: "大型狮之绿园"
 building_lion_green_02_desc: "自从塞莱廷离开后，曾经宏伟的图书馆已经年久失修。目前正计划进行翻新，以改变这种状况。"
 building_lion_green_03: "宏伟的狮之绿园"
 building_lion_green_03_desc: "令人惊讶的是，狮之绿园缺乏刑具或牢房。囚犯们都直接被带到梅琳达的住处。那些事后离开房间的人，对女主人的态度总变得好得多。"
 building_type_spring_yzebel_01: "耶洗别之泉"
 building_type_spring_yzebel_01_desc: "#F 耶洗别是第一位来到伊比利亚的迦太基[GetTrait('brujah').GetName(GetNullCharacter)]。她在与罗马[GetTrait('ventrue').GetName(GetNullCharacter)]的战斗中陨落，不过争斗的双方都尊重她。#!"
 building_spring_yzebel_01: "被遗忘的耶洗别之泉"
 building_spring_yzebel_01_desc: "布拉加北部的一个小喷泉。耶洗别因其对未来的敏锐洞察力而闻名，喝了这些水似乎也能获得同样的能力。"
 building_spring_yzebel_02: "流动的耶洗别之泉"
 building_spring_yzebel_02_desc: "耶洗别是一名具有相当才能的将军，她对战争的洞察力在这些水域中自由流动。"
 building_spring_yzebel_03: "珍贵的耶洗别之泉"
 building_spring_yzebel_03_desc: "这是一个难得的信仰之地，也是氏族之间的和谐之地，在这里，每个人都能回忆一位光荣而受人尊敬的战士。"
 building_type_castle_hunedoara_01: "胡内多阿拉城堡"
 building_type_castle_hunedoara_01_desc: "#F 在这里，历史和幻想将相遇，传奇将诞生并被焚毁。#!"
 building_castle_hunedoara_01: "小型胡内多阿拉城堡"
 building_castle_hunedoara_01_desc: "胡内多阿拉建在一个古老堡垒的地基上，看起来没有什么花哨的东西，但这地方给予人一种不祥的预感。"
 building_castle_hunedoara_02: "畏人的胡内多阿拉城堡"
 building_castle_hunedoara_02_desc: "历史著于此处，当龙之子第一次了解到黑夜。"
 building_castle_hunedoara_03: "暗藏的胡内多阿拉城堡"
 building_castle_hunedoara_03_desc: "这里没有什么可看的。城堡不为人知。\n遁世会。"
 building_type_castle_vysehrad_01: "维谢赫拉德城堡"
 building_type_castle_vysehrad_01_desc: "#F 布拉格的第二座防御城堡是该地区一些最强大的实体的家园，也是监狱。#!"
 building_castle_vysehrad_01: "维谢赫拉德卫城"
 building_castle_vysehrad_01_desc: "曾经是布拉格的鲁道夫·布兰德尔亲王的住所，维谢赫拉德实际上容纳了更多强大的实体。"
 building_castle_vysehrad_02: "维谢赫拉德堡垒"
 building_castle_vysehrad_02_desc: "两位强大的棘秘魑玛土撒拉莎格拉与布克迪拉卡的家乡，维谢赫拉德对吸血鬼来说有着悠久的历史。"
 building_castle_vysehrad_03: "维谢赫拉德王座间"
 building_castle_vysehrad_03_desc: "在这里，克里斯托夫·罗慕铎与强大的布克迪拉卡作战。如果有人知道如何倾听，仍然可以隐约听到他们的战斗的回声。"
 building_type_uppsala_01: "乌普萨拉神殿"
 building_type_uppsala_01_desc: "#F 北欧原始教徒最神圣的地方早已被凡人遗忘，但还没有被吸血鬼遗忘。#!"
 building_uppsala_01: "焚毁的乌普萨拉"
 building_uppsala_01_desc: "这座神殿躺在废墟中，被十字架的追随者烧毁，痛苦地提醒着[Glossary('英灵战士','game_concept_einherjar_desc')]的失败。"
 building_uppsala_02: "复苏的乌普萨拉"
 building_uppsala_02_desc: "在十字架的阴影下，信徒们正在慢慢返回，他们仍然心怀恐惧，但还没有崩溃。"
 building_uppsala_03: "乌普萨拉神殿"
 building_uppsala_03_desc: "[Glossary('英灵战士','game_concept_einherjar_desc')]正在返回他们的祖传神殿。而十字架之神这次没法再阻止他们了。"
 building_type_hermitage_01: "隐居所"
 building_type_hermitage_01_desc: "#F 一个与世隔绝用于冥想和练武的地方。#!"
 building_hermitage_01: "下等隐居所"
 building_hermitage_01_desc: "小隐隐于野"
 building_hermitage_02: "中等隐居所"
 building_hermitage_02_desc: "中隐隐于市。"
 building_hermitage_03: "上等隐居所"
 building_hermitage_03_desc: "大隐隐于朝。"
 building_type_kunlun_school_01: "昆仑学宫"
 building_type_kunlun_school_01_desc: "#F 曾经天军的最大的学院，建筑于昆仑山之上。这座建筑是一座雄伟的堡垒，墙壁镀金，家具奢华。#!"
 building_kunlun_school_01: "废弃的昆仑学宫"
 building_kunlun_school_01_desc: "曾经是[GetTrait('shih').GetName( GetNullCharacter )]的最宏伟学塾，因有意者制造的地震而损毁。"
 building_kunlun_school_02: "复原的昆仑学宫"
 building_kunlun_school_02_desc: "[GetTrait('shih').GetName( GetNullCharacter )]的传承在此教授，因[GetTrait('shih').GetName( GetNullCharacter )]正在陆续回到他们的总部。"
 building_kunlun_school_03: "凯旋的昆仑学宫"
 building_kunlun_school_03_desc: "[GetTrait('shih').GetName( GetNullCharacter )]宏伟的学院已然归来，再也没有鬼神可以再次阻止他们了。"
 building_type_salianna_court_01: "爱之庭"
 building_type_salianna_court_01_desc: "#F 爱之庭是一个致力于爱本身的地方，以及通过死去的吸血鬼之心对它进行冷酷无情的研究。#!"
 building_salianna_court_01: "小型爱之庭"
 building_salianna_court_01_desc: "在法兰西著名的或标志性的地区运行，爱之庭以其对致命的爱情阴谋的关注而闻名。"
 building_salianna_court_02: "大型爱之庭"
 building_salianna_court_02_desc: "许多年轻的骑士涌向著名的宫廷，希望获得荣耀和名声。大多数人都是在被里面的致命生物完全迷住后才走了。"
 building_salianna_court_03: "权威的爱之庭"
 building_salianna_court_03_desc: "$pod_cainite$法兰西的政治中心不适合胆小的人，甚至有经验的吸血鬼也成为其致命游戏的牺牲品。"
 building_type_paris_01: "巴黎"
 building_type_paris_01_desc: "#F 奇迹之城是西方世界的中心，但它也是一个难以真正掌握的地方。#!"
 building_paris_01: "自由巴黎"
 building_paris_01_desc: "巴黎是不屈不挠的，没有人能够真正控制它的精神，至少目前是这样。"
 building_paris_02: "受限巴黎"
 building_paris_02_desc: "一点一点，巴黎正在与它的主人融为一体，也许是一个不断增长的帝国的中心。"
 building_paris_03: "受控巴黎"
 building_paris_03_desc: "巴黎正在向外看，将自己视为一个新时代的灯塔。"
 building_type_gavrinis_01: "加夫里尼斯"
 building_type_gavrinis_01_desc: "#F 靠近瓦讷的地方有一个小岛，岛上有一个史前洞穴……而且声名狼藉。#!"
 building_gavrinis_01: "废弃的加夫里尼斯修道院"
 building_gavrinis_01_desc: "医院骑士团试图在这里建立自己的地位，但即使他们的信仰也不足以保护他们免受下面的恐怖。"
 building_gavrinis_02: "加夫里尼斯洞穴"
 building_gavrinis_02_desc: "很久以前，人们就在这里进行献祭。而某人，或某物，仍在等待下一个。"
 building_gavrinis_03: "加夫里尼斯海域"
 building_gavrinis_03_desc: "这座岛屿本身似乎以绝望和死亡为生。而且最终总是有更多的人来到这里。"
 building_type_toulouse_university_01: "图卢兹大学"
 building_type_toulouse_university_01_desc: "#F 由教宗额我略九世于1229年创建的图卢兹大学很快就拥有了自己的身位。#!"
 building_toulouse_university_01: "小型图卢兹大学"
 building_toulouse_university_01_desc: "这所大学最初是为了向经常被带入歧途的阿基坦人民传授基督教正道，但很快就赢得了思想自由的声誉。"
 building_toulouse_university_02: "扩张的图卢兹大学"
 building_toulouse_university_02_desc: "从语言到神学，大学教授最常见的科目，日趋著名。"
 building_toulouse_university_03: "著名图卢兹大学"
 building_toulouse_university_03_desc: "这所大学的阴暗赞助人投入了大量精力来帮助图卢兹与巴黎竞争。结果说明了他们的成功。"
 building_type_cecilia_palace_01: "塞西莉娅的寝宫"
 building_type_cecilia_palace_01_desc: "#F 有人说它曾是用于卖淫圣事的神殿。在群众中，它只是被称为妓院——尽管它是一个昂贵的妓院。许多钱财从它的门前流过。#!"
 building_cecilia_palace_01_desc: "有人说它曾是用于卖淫圣事的神殿。在群众中，它只是被称为妓院——尽管它是一个昂贵的妓院。许多钱财从它的门前流过。"
 building_cecilia_palace_01: "塞西莉娅的寝宫"
 building_type_web_of_faith_01: "连接信仰之网"
 building_type_web_of_faith_01_desc: "#F 信仰之网是覆盖整个中东地区的由圣地和塞赫（神秘能量）构成的网络。#!"
 building_web_of_faith_01: "微弱信仰之网连接"
 building_web_of_faith_01_desc: "你截下了一丁点的塞赫脉流，但没法再多了。"
 building_web_of_faith_02: "下等信仰之网连接"
 building_web_of_faith_02_desc: "你截下了一丝丝的塞赫脉流，但没法再多了。"
 building_web_of_faith_03: "中等信仰之网连接"
 building_web_of_faith_03_desc: "你截下了微弱的塞赫脉流，但没法再多了。"
 building_type_mortal_army_01: "凡人军队"
 building_type_mortal_army_01_desc: "#F 凡人已经听到了他们的神王的召唤，他们正在创建能够击败即将到来的灾变的大军以提供帮助。#!"
 building_mortal_army_01: "微弱凡人军队"
 building_mortal_army_01_desc: "少量的凡人听到了你的召唤，宣誓一生在你的军队中服务。"
 building_mortal_army_02: "下等凡人军队"
 building_mortal_army_02_desc: "更多的凡人已经响应了号召。这不是很多，但这是一个相当大的起步。"
 building_mortal_army_03: "中等凡人军队"
 building_mortal_army_03_desc: "你的凡人军队现在已经达到了一个相当的规模。外人可能会认为他们是一个小型的雇佣军团。"
 building_type_sets_of_worshipers_01: "信徒密教"
 building_type_sets_of_worshipers_01_desc: "#F 这些最忠实的追随者甚至能使对重生者的信仰延续数千年。#!"
 building_sets_of_worshipers_01: "微弱信徒密教"
 building_sets_of_worshipers_01_desc: "少数的崇拜者在这里秘密地保持着古老的信仰。"
 building_sets_of_worshipers_02: "下等信徒密教"
 building_sets_of_worshipers_02_desc: "在这一地区，信众的数量已经增加。一个小密教正在形成中。"
 building_sets_of_worshipers_03: "中等信徒密教"
 building_sets_of_worshipers_03_desc: "在这片土地上，围绕你和古老信仰已经形成了一个小密教。你的政治影响力已经开始增长。"
 building_type_comprador_residence_01: "买办住所"
 building_type_comprador_residence_01_desc: "#F 买办，指为为其他超自然生物工作的吸血鬼。#!"
 building_comprador_residence_01: "微弱买办住所"
 building_comprador_residence_01_desc: "在这里，你收集其他超自然加入你的事业的基础工作。"
 building_comprador_residence_02: "下等买办住所"
 building_comprador_residence_02_desc: "你的网络已经开始结出果实，即一些新的超自然联系。"
 building_comprador_residence_03: "中等买办住所"
 building_comprador_residence_03_desc: "你的网络终于建立起来了，虽然规模不大，而且是同类中较弱的，但你有多个买办可以联系。"
 building_type_tomb_01: "陵墓"
 building_type_tomb_01_desc: "#F 当你的灵在[UmbraGlossaryLocalized('shadowlands','冥界')]准备复活的时候，你的躯体得放在一个安全的地方。它可能是一个隐蔽的地下室，一个与世隔绝的山洞，一个博物馆的安全存储区，甚至是帝王谷中一个未被发现的陵墓。#!"
 building_tomb_01: "微弱陵墓"
 building_tomb_01_desc: "把这称为陵墓可能有点夸张。它更像是一个隐藏在地下室或凹室中的简单石棺。"
 building_tomb_02: "下等陵墓"
 building_tomb_02_desc: "虽然这可能只不过是一个竖井式的陵墓，或者是山洞里的一个简单的陵墓，但它是一个陵墓。"
 building_tomb_03: "中等陵墓"
 building_tomb_03_desc: "你的陵墓已经得到了一定程度的扩展。它现在容纳了一些遗物和壁画。"
 building_type_legacy_01: "遗产"
 building_type_legacy_01_desc: "#F 你在你的第一或第二人生中给世界留下了一些重要的印记，你仍然从中汲取力量。#!"
 building_legacy_01: "微弱遗产"
 building_legacy_01_desc: "自从你回到这个世界，你完全不为人所知。你希望能解决这个悲剧。"
 building_legacy_02: "下等遗产"
 building_legacy_02_desc: "你现在是乡下人的地区故事，一个传言。但这仅仅是你的遗产的第一章。"
 building_legacy_03: "中等遗产"
 building_legacy_03_desc: "你现在在少数人中被记住了，他们现在才开始了解你过去和现在是多么重要。"
 building_type_genealogie_01: "族谱"
 building_type_genealogie_01_desc: "#F 少数家庭确实作为[GetTrait('shih').GetName( GetNullCharacter )]的猎人单位而存在，但它们非常罕见。大多数人的根源可以追溯到羿本人，尽管他们的家谱是否准确是一个巨大的潜在争论来源。#!"
 building_genealogie_01: "短小族谱"
 building_genealogie_01_desc: "没人信你的家族是羿的后裔。"
 building_genealogie_02: "中长族谱"
 building_genealogie_02_desc: "少数人信你的家族是羿的后裔。"
 building_genealogie_03: "悠久族谱"
 building_genealogie_03_desc: "多数人信你的家族是羿的后裔。"
 building_genealogie_04: "荒古族谱"
 building_genealogie_04_desc: "所有人都信你的家族是羿的后裔。"
 building_web_of_faith_04: "上等信仰之网连接"
 building_web_of_faith_04_desc: "你在这一地区截下一小股塞赫脉流。"
 building_web_of_faith_05: "强力信仰之网连接"
 building_web_of_faith_05_desc: "你在这个地区截下一定的塞赫脉流。"
 building_web_of_faith_06: "王级信仰之网连接"
 building_web_of_faith_06_desc: "你截下了这地区的一股强力塞赫脉流。"
 building_web_of_faith_07: "帝级信仰之网连接"
 building_web_of_faith_07_desc: "整个圣地都在你的控制之下。"
 building_web_of_faith_08: "神级信仰之网连接"
 building_web_of_faith_08_desc: "在过去漫长的岁月中，这个圣地是无与伦比的，且塞赫从这个美丽的地方不断涌出。"
 building_mortal_army_04: "上等遗产"
 building_mortal_army_04_desc: "你的军队现在已经达到了专业标准。它可以与凡人和超自然的力量相抗衡。"
 building_mortal_army_05: "强力凡人军队"
 building_mortal_army_05_desc: "你现在拥有一支规模和技能都能让你的敌人感到恐惧而犹豫的军队。"
 building_mortal_army_06: "王级凡人军队"
 building_mortal_army_06_desc: "虽然你的这支军队由凡人组成，但他们将为你进军鬼门关。"
 building_mortal_army_07: "帝级凡人军队"
 building_mortal_army_07_desc: "如果克里奥帕特拉有这军队，那么埃及就不会成为罗马的一部分了。"
 building_mortal_army_08: "神级凡人军队"
 building_mortal_army_08_desc: "如果克里奥帕特拉有这军队，那么罗马就会成为埃及的一部分了。"
 building_sets_of_worshipers_04: "上等信徒密教"
 building_sets_of_worshipers_04_desc: "你在这片土地上的影响已经根深蒂固。你密教的成员已经在大多数重要机构中找到了自己的位置。"
 building_sets_of_worshipers_05: "强力信徒密教"
 building_sets_of_worshipers_05_desc: "这片土地上到处都能听到你的许多绰号的私语。一个公开的秘密是，有一位不朽者看守着这片土地。"
 building_sets_of_worshipers_06: "王级信徒密教"
 building_sets_of_worshipers_06_desc: "你的密教已经壮大。这片土地上的大多数居民要么在它的控制之下，要么是活跃的成员。"
 building_sets_of_worshipers_07: "帝级信徒密教"
 building_sets_of_worshipers_07_desc: "这个地方的居民公开地同情旧神，并会听从你的命令。"
 building_sets_of_worshipers_08: "神级信徒密教"
 building_sets_of_worshipers_08_desc: "你的话语在这片土地上是神圣的。古老的传统经常被奉行，隐秘的神殿也开始被建立起来。"
 building_comprador_residence_04: "上等买办住所"
 building_comprador_residence_04_desc: "由于你的网络已经增长，一些庇护所已经为你的新买办建造。这是一个地狱般的开始。"
 building_comprador_residence_05: "强力买办住所"
 building_comprador_residence_05_desc: "你的影响力正在进一步扩大，你能接触到的庇护所和买办也开始反映出这一点。"
 building_comprador_residence_06: "王级买办住所"
 building_comprador_residence_06_desc: "你现在可以指挥整个帮派或战群。你把他们带到你身边的成就是了不起的，也是你意志的证明。"
 building_comprador_residence_07: "帝级买办住所"
 building_comprador_residence_07_desc: "在你的领地和其他地方的超自然都听说了只有你能提供的机遇，其中一些人已经听从了你的召唤。"
 building_comprador_residence_08: "神级买办住所"
 building_comprador_residence_08_desc: "即使是$glossary_osirian_league$在这里也微不足道。"
 building_tomb_04: "上等陵墓"
 building_tomb_04_desc: "你现在有了一个合适的陵墓，最近还获得了一个护卫，可以在当你的灵魂在[UmbraGlossary('shadowlands')]时，照看你的躯体。"
 building_tomb_05: "强力陵墓"
 building_tomb_05_desc: "你的陵墓现在已经扩展到一个更大的墓室群中。更多你选的追随者守护着你的安息之地。"
 building_tomb_06: "王级陵墓"
 building_tomb_06_desc: "你的陵墓现在有一系列的陷阱、诅咒和武器，供你的凡人守卫使用。打搅你的躯体的人有祸了。"
 building_tomb_07: "帝级陵墓"
 building_tomb_07_desc: "你的陵墓可与古代法老的陵墓媲美。它被隐藏起来，不为无知的凡人所知，但任何偶然发现它的人都会心生敬畏。"
 building_tomb_08: "神级陵墓"
 building_tomb_08_desc: "你的陵墓虽然被隐藏起来不被人窥视，但却超过了古代的伟大国王的坟墓。要想打扰您的休眠，就需要一场围城。"
 building_legacy_04: "上等遗产"
 building_legacy_04_desc: "你现在是整个地区的一个神话，你过去的故事和事迹成为激励儿童的故事。"
 building_legacy_05: "强力遗产"
 building_legacy_05_desc: "说起你的名字，人们都很尊敬和敬畏，认为你是当地的传奇人物，是影响力的来源，现在当地的政治家引用你的名字，也是一种威望的来源。"
 building_legacy_06: "王级遗产"
 building_legacy_06_desc: "你的遗产和神话如此伟大，以至于当地贵族通过宣称有你的血统来声称正统。"
 building_legacy_07: "帝级遗产"
 building_legacy_07_desc: "国王们现在从你的血统中声称正统，对古老的神王和神后进行认祖宗。"
 building_legacy_08: "神级遗产"
 building_legacy_08_desc: "即使是亚历山大大帝的遗产，与你的遗产相比也是一个可悲的、呜咽的阴影。"
 building_type_shemsu_heru_central_port_01: "贤荷鲁中心港"
 building_type_shemsu_heru_central_port_01_desc: "#F 荷鲁斯带着一群最忠诚的弟子离开后，位于亚历山大的贤荷鲁中心港口。#!"
 building_shemsu_heru_central_port_01: "贤荷鲁中心港"
 building_shemsu_heru_central_port_01_desc: "荷鲁斯带着一群最忠诚的弟子离开后，位于亚历山大的贤荷鲁中心港口。"
 building_type_horus_hidden_tomb_01: "荷鲁斯的疑冢"
 building_type_horus_hidden_tomb_01_desc: "#F 荷鲁斯在阿尔卑斯山建造的隐秘陵墓，接近凡人的日内瓦城。#!"
 building_horus_hidden_tomb_01: "荷鲁斯的疑冢"
 building_horus_hidden_tomb_01_desc: "荷鲁斯在阿尔卑斯山建造的隐秘陵墓，接近凡人的日内瓦城。"
 building_type_temple_of_horus_01: "荷鲁斯神庙"
 building_type_temple_of_horus_01_desc: "#F 复仇者最大的神庙，介乎伊斯纳及阿斯旺之间的埃德富。虽然原来的埃德富城市已经大部分沦为废墟，但荷鲁斯神庙仍然矗立。#!"
 building_temple_of_horus_01: "荷鲁斯神庙"
 building_temple_of_horus_01_desc: "复仇者最大的神庙，介乎伊斯纳及阿斯旺之间的埃德富。虽然原来的埃德富城市已经大部分沦为废墟，但荷鲁斯神庙仍然矗立着，像它的神一样顽强。"
 building_type_scarlet_screen_family_01: "家族障幕"
 building_type_scarlet_screen_family_01_desc: "#F 最重要的障幕。像幽影颂一样的[Glossary('心法','podgloss.dharma')]甚至有维护家族的义务。此外，[GetTrait('kueijin').GetName( GetNullCharacter )]的凡人家庭往往是他们最忠诚的支持者。#!"
 building_scarlet_screen_family_01: "次级家族障幕"
 building_scarlet_screen_family_01_desc: "你已经为家族障幕奠定了基础。这是一个起步，但需要一些工作。"
 building_scarlet_screen_family_02: "中级家族障幕"
 building_scarlet_screen_family_02_desc: "你现在有数个家族和一代人组成的家族障幕。这是很好的进展。"
 building_scarlet_screen_family_03: "高级家族障幕"
 building_scarlet_screen_family_03_desc: "你现在有数个家族和一代人组成的家族障幕。这是很好的进展。"
 building_type_scarlet_screen_usagigumi_01: "兔队障幕"
 building_type_scarlet_screen_usagigumi_01_desc: "#F 兔队的价值仅在于人数。#!"
 building_scarlet_screen_usagigumi_01: "次级兔队障幕"
 building_scarlet_screen_usagigumi_01_desc: "你已经开始为你的兔队开始了一场小规模的募兵。他们现在还行。"
 building_scarlet_screen_usagigumi_02: "中级兔队障幕"
 building_scarlet_screen_usagigumi_02_desc: "你的兔队现在是一个实际的、值得尊敬的部队。有时，你可以为他们感到骄傲。"
 building_scarlet_screen_usagigumi_03: "高级兔队障幕"
 building_scarlet_screen_usagigumi_03_desc: "你的兔队现在是一个实际的、值得尊敬的部队。有时，你可以为他们感到骄傲。"
 building_type_scarlet_screen_inugumi_01: "犬幢障幕"
 building_type_scarlet_screen_inugumi_01_desc: "#F 犬幢更加忠诚，有时甚至与超自然有联系。#!"
 building_scarlet_screen_inugumi_01: "次级犬幢障幕"
 building_scarlet_screen_inugumi_01_desc: "你的犬幢刚刚被安置好了。目前，他们能够达成职务，但他们可以做得更好。"
 building_scarlet_screen_inugumi_02: "中级犬幢障幕"
 building_scarlet_screen_inugumi_02_desc: "你的犬幢现在是一个真正值得尊敬的机构，有些已经开始将你的影响力扩展到变化妖怪和天宗的隐秘领域。总有一天。"
 building_scarlet_screen_inugumi_03: "高级犬幢障幕"
 building_scarlet_screen_inugumi_03_desc: "你的犬幢现在是一个真正值得尊敬的机构，有些已经开始将你的影响力扩展到变化妖怪和天宗的隐秘领域。总有一天。"
 building_type_scarlet_screen_ryugumi_01: "龙军障幕"
 building_type_scarlet_screen_ryugumi_01_desc: "#F 龙军被训练用于打击对其[GetTrait('kueijin').GetName( GetNullCharacter )]主人的高度威胁。#!"
 building_scarlet_screen_ryugumi_01: "次级龙军障幕"
 building_scarlet_screen_ryugumi_01_desc: "你的龙军现在是一支强有力的仪仗队。他们现在只是少数人，但现在你可以在白天睡得很香。"
 building_scarlet_screen_ryugumi_02: "中级龙军障幕"
 building_scarlet_screen_ryugumi_02_desc: "你的龙军现在遍布你的整个巢穴，而且你有足够的余力让他们可以加入你的战斗中。不单独作战的感觉真好。"
 building_scarlet_screen_ryugumi_03: "高级龙军障幕"
 building_scarlet_screen_ryugumi_03_desc: "你的龙军现在遍布你的整个巢穴，而且你有足够的余力让他们可以加入你的战斗中。不单独作战的感觉真好。"
 building_type_scarlet_screen_spies_01: "细作障幕"
 building_type_scarlet_screen_spies_01_desc: "#F 细作障幕是用于收集情报的。#!"
 building_scarlet_screen_spies_01: "次级细作障幕"
 building_scarlet_screen_spies_01_desc: "你现在在这个地区有一个间谍网络，为你提供当地的八卦信息。琐碎，但在慢慢熟练。"
 building_scarlet_screen_spies_02: "中级细作障幕"
 building_scarlet_screen_spies_02_desc: "区域性事务现在对你来说是一个已知的因素，因为你已经开始在所有地方都有耳目。"
 building_scarlet_screen_spies_03: "高级细作障幕"
 building_scarlet_screen_spies_03_desc: "区域性事务现在对你来说是一个已知的因素，因为你已经开始在所有地方都有耳目。"
 building_type_scarlet_screen_merchants_01: "商贾障幕"
 building_type_scarlet_screen_merchants_01_desc: "#F 商贾障幕负责[GetTrait('kueijin').GetName( GetNullCharacter )]的财务需求。#!"
 building_scarlet_screen_merchants_01: "次级商贾障幕"
 building_scarlet_screen_merchants_01_desc: "你已经开始从这个地区吸走少量的硬币，为你的事业提供支持。"
 building_scarlet_screen_merchants_02: "中级商贾障幕"
 building_scarlet_screen_merchants_02_desc: "你的地方财政现在是安全的，源自于你对该地区看不见的“税收”。"
 building_scarlet_screen_merchants_03: "高级商贾障幕"
 building_scarlet_screen_merchants_03_desc: "你的地方财政现在是安全的，源自于你对该地区看不见的“税收”。"
 building_type_scarlet_screen_artisans_01: "匠师障幕"
 building_type_scarlet_screen_artisans_01_desc: "#F 匠师障幕通过民事手段，努力提高他们主人在城市中的影响力。#!"
 building_scarlet_screen_artisans_01: "次级匠师障幕"
 building_scarlet_screen_artisans_01_desc: "你已经资助了一群手艺人和艺术家。这是个很有启发性的经验。"
 building_scarlet_screen_artisans_02: "中级匠师障幕"
 building_scarlet_screen_artisans_02_desc: "你的影响现在在地区内传播，因为你已经成为当地作坊的中心。"
 building_scarlet_screen_artisans_03: "高级匠师障幕"
 building_scarlet_screen_artisans_03_desc: "你的影响现在在地区内传播，因为你已经成为当地作坊的中心。"
 building_type_scarlet_screen_peasants_01: "民众障幕"
 building_type_scarlet_screen_peasants_01_desc: "#F 民众障幕负责保护[GetTrait('kueijin').GetName( GetNullCharacter )]的安全。在[Glossary('第五纪元','game_concept_fifth_age_desc')]，地方政治团体也被归类为“民众”。#!"
 building_scarlet_screen_peasants_01: "次级民众障幕"
 building_scarlet_screen_peasants_01_desc: "你的藏身处现在由一小群凡人“守卫”，因为任何攻击者都必须先穿过他们才能接近你。"
 building_scarlet_screen_peasants_02: "中级民众障幕"
 building_scarlet_screen_peasants_02_desc: "现在，你的藏身处被一个镇子守着，被普通农民保护得很好，他们中的一些人甚至知道他们在做什么。"
 building_scarlet_screen_peasants_03: "高级民众障幕"
 building_scarlet_screen_peasants_03_desc: "现在，你的藏身处被一个镇子守着，被普通农民保护得很好，他们中的一些人甚至知道他们在做什么。"
 building_type_occult_affiliation_01: "玄秘隶属"
 building_type_occult_affiliation_01_desc: "#F 许多玄秘团体，如俄耳甫斯法会、贝南丹蒂或秘术士会，的队伍中都有卡比里，他们躲避他们的同胞，扩大他们的神秘学知识，以促进他们自己的议程。#!"
 building_occult_affiliation_01: "简易玄秘隶属"
 building_occult_affiliation_01_desc: "你只是一位落后玄秘团体中的新人。"
 building_occult_affiliation_02: "下等玄秘隶属"
 building_occult_affiliation_02_desc: "你只是一位小型玄秘团体中的侍从。"
 building_occult_affiliation_03: "中等玄秘隶属"
 building_occult_affiliation_03_desc: "你只是本地玄秘团体中的新人。"
 building_occult_affiliation_04: "上等玄秘隶属"
 building_occult_affiliation_04_desc: "你是一位像样玄秘团体中的受敬成员。"
 building_occult_affiliation_05: "强力玄秘隶属"
 building_occult_affiliation_05_desc: "你是一位强力玄秘团体中的知名成员。"
 building_occult_affiliation_06: "王级玄秘隶属"
 building_occult_affiliation_06_desc: "你是一位重大玄秘团体中的重要成员。"
 building_occult_affiliation_07: "帝级玄秘隶属"
 building_occult_affiliation_07_desc: "你是一位地区玄秘团体首领的心腹。"
 building_occult_affiliation_08: "神级玄秘隶属"
 building_occult_affiliation_08_desc: "你是地区玄秘关系网的幕后负责人，所有的人都秘密地听从你的召唤。"
 building_type_tianchi_dragon_nest_01: "天池龙穴"
 building_type_tianchi_dragon_nest_01_desc: "#F 白虎皇朝在西部的控制的第二大龙穴。#!"
 building_tianchi_dragon_nest_01: "天池龙穴"
 building_tianchi_dragon_nest_01_desc: "位于天池，一座寒冷得令人窒息的美丽冰川湖的岸边，"
 building_type_influence_animals_01: "驯服动物"
 building_type_influence_animals_01_desc: "#F 有人类的地方，就有动物为他们提供衣物、食物和货运，与他们作伴或靠他们生产的垃圾生活。你的野心和能力包括这个地方的所有生物。#!"
 building_influence_animals_01: "阴沟助手"
 building_influence_animals_01_desc: "你设法成为当地害虫中的权威，并得到训练有素的猫咪们的帮助，使它们受到控制。"
 building_influence_animals_02: "牧场合伙人"
 building_influence_animals_02_desc: "你对镇上牧场的拜访得到了回报，那就是牲畜和看守牲畜的狗们的信任和忠诚。"
 building_influence_animals_03: "养狗场同伴"
 building_influence_animals_03_desc: "确保进入养狗场的安全通道，让你成为猎犬的真正主人。它们为了运动兴趣与贵族们一起打猎，但它们为在夜里为你工作。"
 building_influence_animals_04: "丛林家庭"
 building_influence_animals_04_desc: "你对本伯爵领动物的权威是如此全面，甚至连远在天边的狼群都听到你的名字在夜里嚎叫赞美。"
 building_type_forest_people_01: "森林中人"
 building_type_forest_people_01_desc: "#F 你的狩猎场位于城镇之外，居住在这些郊区的居民是你需要依靠的人，他们是你的棋子或猎物。#!"
 building_forest_people_01: "追踪牧羊人"
 building_forest_people_01_desc: "一只人形野兽在荒野中徘徊的故事并没有给城市人留下什么印象，但那些在牲畜吃草的地方度过许多夜晚的人已经学会了害怕和服从你。"
 building_forest_people_02: "向偷猎者施压"
 building_forest_people_02_desc: "这片荒野只有一只顶级掠食者，且不是凡人贵族。与他不同，你愿意与那些承诺忠诚的人分赃。"
 building_forest_people_03: "召集匪徒"
 building_forest_people_03_desc: "有足够多的人往返于这个小镇，使捕杀他们成为一项团队工作，只要那些希望参与的人明白谁在负责。"
 building_type_forest_treasures_01: "森林之宝"
 building_type_forest_treasures_01_desc: "#F 荒野曾经是我们所有人的家园，仍然有一些人没有用在荒野中茁壮成长所需的知识来交换文明的舒适。你要把他们的才能都用上。#!"
 building_forest_treasures_01: "灌木丛中的丰收"
 building_forest_treasures_01_desc: "需要有敏锐的眼光和对森林的初步了解，才能以觅食森林的财富为生。你确保那些拥有它的人愿意分享。"
 building_forest_treasures_02: "飞掠者"
 building_forest_treasures_02_desc: "荒野发出无数的声音，都证明了它维持生命的能力。你和那些懂得倾听的人结成了亲密的朋友。"
 building_forest_treasures_03: "大型狩猎"
 building_forest_treasures_03_desc: "只有真正的森林之主才能参与森林中捕食者和猎物之间的永恒军备竞赛，并获得回报。在这的狩猎者中，没有人敢拒绝上贡你的份额。"
 building_type_forest_paths_01: "森林路径"
 building_type_forest_paths_01_desc: "#F 在外人看来，荒野就像一个迷宫，到处都是难以逾越的障碍，但对你来说，它将成为一个配备了丰富地隐藏通道和秘密捷径的堡垒。#!"
 building_forest_paths_01: "峡谷和沟壑"
 building_forest_paths_01_desc: "过去和现在的水流形成了森林的天然道路网。那些对它了如指掌的人不费吹灰之力就能智胜闯入者。"
 building_forest_paths_02: "山洞和隧道"
 building_forest_paths_02_desc: "许多林地生物在地下宣称自己的统治权，挖掘出的巢穴和洞穴往往连接成复杂的隧道网络。那些学会模仿它们并利用它们的劳动的人永远不必打一场他们没主动发起的战斗。"
 building_forest_paths_03: "树顶公路"
 building_forest_paths_03_desc: "在森林最密集的地方，天空被为争夺阳光而搏斗的树枝所遮蔽，最敏捷的捕食者可以从上面跟踪他们的猎物，在树顶上远距离移动而不被注意。"
 building_type_inquisition_knightly_01: "骑士大区"
 building_type_inquisition_knightly_01_desc: "#F 军事组织的地产。宣过誓的战士们在这里生活和训练。#!"
 building_inquisition_knightly_01: "骑士管领地"
 building_inquisition_knightly_01_desc: "管领地是一个骑士团所能拥有的最小的土地划分。它由骑士们在一位指挥官的领导下维持。"
 building_inquisition_knightly_02: "骑士辖区"
 building_inquisition_knightly_02_desc: "辖区代表着军事集团的权力范围，其中包含的设施构成了宗教社会的基础设施骨干。"
 building_inquisition_knightly_03: "骑士大区"
 building_inquisition_knightly_03_desc: "大区是一个强大的权力中心，骑士团的高级成员在这里管理它的许多地产并计划军事行动。"
 building_type_inquisition_lay_01: "社群大厅"
 building_type_inquisition_lay_01_desc: "#F 你的家庭和其赞助下的信众的力量来自于他们的虔诚，而不是任何物质财富。然而，即使是已经极其神圣的努力，若有一个屋顶在头上，也将能更顺利地进行。#!"
 building_inquisition_lay_01: "集会大厅"
 building_inquisition_lay_01_desc: "勉强比直接邀请信徒群体到你的寝室更有尊严，然而，这个小而简陋的房间却容纳了宏大而高贵的想法。"
 building_inquisition_lay_02: "社群大厅"
 building_inquisition_lay_02_desc: "就像教堂滋养一个人的灵魂一样，这个专业的大厅也滋养那些寻求摆脱邪恶的人的集体意志。"
 building_inquisition_lay_03: "社群地产"
 building_inquisition_lay_03_desc: "由于你的家庭的慷慨赞助，这个庄园拥有所有的空间、设施和安保，使其成为正义的堡垒和使馆。"
 building_type_inquisition_contemplative_01: "默观修道院"
 building_type_inquisition_contemplative_01_desc: "#F 这些庄严的大厅是为了远离淹没上帝的声音的世俗噪音而建造的。#!"
 building_inquisition_contemplative_01: "默观修会庄园"
 building_inquisition_contemplative_01_desc: "修道院的斯巴达式生活条件是理想的特点，但在空间和可用设施方面的一些扩展可以帮助修道士专注于祈祷工作。"
 building_inquisition_contemplative_02: "默观小隐修院"
 building_inquisition_contemplative_02_desc: "这个院落的每一个物质方面都提醒其居民期望他们过什么样的生活。在这里，肉体的需求只不过是令人遗憾地分散了对造物主的思考。"
 building_inquisition_contemplative_03: "默观隐修院"
 building_inquisition_contemplative_03_desc: "仅仅是踏入这座献给上帝智慧的朴素宫殿，就能让一个坚定的非信徒重新找到信仰，因为他的声音在无所不在的寂静中轰鸣。"
 building_type_inquisition_mendicant_01: "托钵修道院"
 building_type_inquisition_mendicant_01_desc: "#F 受苦是走基督的道途，但减轻他人的痛苦也同样是基督会做的。这些设施使它成为可能。#!"
 building_inquisition_mendicant_01: "托钵修会庄园"
 building_inquisition_mendicant_01_desc: "这远远不能反映出你的教友们的无限同情心，但这微不足道的设施还是让他们在照顾羊群的漫长一天后得以恢复。"
 building_inquisition_mendicant_02: "托钵修士院"
 building_inquisition_mendicant_02_desc: "虽然这座建筑的主要目的是成为祈祷用地，但它同时也是一个相当大的慈善活动物流中心。"
 building_inquisition_mendicant_03: "托钵隐修院"
 building_inquisition_mendicant_03_desc: "在冷漠之情的边界上有一座同情心之堡垒。这片土地上的羊群望着这座高耸的建筑，提醒自己世界上还有善的存在。"
 building_type_rookery_01: "群栖地"
 building_type_rookery_01_desc: "#F 一处聚集#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!同伴的避难所。#!"
 building_rookery_01: "简易栖地"
 building_rookery_01_desc: "小型栖地坐落于此，新来聚集于此的#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!大都是出逃者，来寻求自主和庇护。\n\n这里很少#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!聚集或被创造出来。"
 building_rookery_02: "体面栖地"
 building_rookery_02_desc: "现在规模可观的栖地吸引到更远处的[GetTrait('gargoyle').GetName(GetNullCharacter)]。\n\n这里有些#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!聚集或被创造出来。"
 building_rookery_03: "精雕栖地"
 building_rookery_03_desc: "宏伟的栖地确切呈现了#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!的辉煌。\n\n这里有许多新#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L 石像鬼#!#!聚集或被创造出来。"
 building_type_maats_haven_01: "玛阿特圣所"
 building_type_maats_haven_01_desc: "#F 信仰之地以外的地方深受$glossary_wyrm_apophis$力量的影响，使得塞赫更加难以获得。虽然仍有少数玛阿特仍然占据优势的孤立场地，但它们往往受到其他超自然势力的掌控。#!"
 building_maats_haven_01: "简易玛阿特圣所"
 building_maats_haven_01_desc: "你截下了一丁点的塞赫脉流，但没法再多了。"
 building_maats_haven_02: "下等玛阿特圣所"
 building_maats_haven_02_desc: "你截下了一丝丝的塞赫脉流，但没法再多了。"
 building_maats_haven_03: "中等玛阿特圣所"
 building_maats_haven_03_desc: "你截下了微弱的塞赫脉流，但没法再多了。"
 building_maats_haven_04: "上等玛阿特圣所"
 building_maats_haven_04_desc: "你在这一地区截下一小股塞赫脉流。"
 building_maats_haven_05: "强力玛阿特圣所"
 building_maats_haven_05_desc: "你在这个地区截下一定的塞赫脉流。"
 building_maats_haven_06: "王级玛阿特圣所"
 building_maats_haven_06_desc: "你截下了这地区的一股强力塞赫脉流。"
 building_maats_haven_07: "帝级玛阿特圣所"
 building_maats_haven_07_desc: "整个圣地都在你的控制之下。"
 building_maats_haven_08: "神级玛阿特圣所"
 building_maats_haven_08_desc: "在过去漫长的岁月中，这个圣地是无与伦比的，且塞赫从这个美丽的地方不断涌出。"
 building_pairidaeza_02: "体面的波斯庭院"
 building_pairidaeza_02_desc: "个休息和缅怀失去已久的黄金时代的地方。内心风暴的风暴眼。"
 building_pairidaeza_03: "壮丽的波斯庭院"
 building_pairidaeza_03_desc: "一个隐藏的奇迹国度。一个被遗忘的信仰的不驯堡垒。"
 building_type_patroned_temple_01: "资助神殿"
 building_type_patroned_temple_01_desc: "#F 礼拜场所，无论是清真寺、教堂还是其他场所，都是黑暗时代艺术能够真正繁荣的最后一个地方。#!"
 building_patroned_temple_01: "资助神殿"
 building_patroned_temple_01_desc: "礼拜场所，无论是清真寺、教堂还是其他场所，都是黑暗时代艺术能够真正繁荣的最后一个地方。"
 building_type_patroned_musicians_01: "资助音乐家"
 building_type_patroned_musicians_01_desc: "#F 游吟诗人、吟游诗人，甚至是牧师的复调和声……黑暗时代对音乐艺术爱好者来说是一个令人兴奋的时代。#!"
 building_patroned_musicians_01: "资助音乐家"
 building_patroned_musicians_01_desc: "游吟诗人、吟游诗人，甚至是牧师的复调和声……黑暗时代对音乐艺术爱好者来说是一个令人兴奋的时代。"
 building_type_patroned_theaters_01: "资助剧院"
 building_type_patroned_theaters_01_desc: "#F 虽然古典戏剧的鼎盛时期早已过去，但仍有许多文艺演出，往往是由希望获得曝光的富商赞助。#!"
 building_patroned_theaters_01: "资助剧院"
 building_patroned_theaters_01_desc: "虽然古典戏剧的鼎盛时期早已过去，但仍有许多文艺演出，往往是由希望获得曝光的富商赞助。"
 building_type_patroned_manuscripts_01: "资助书写者"
 building_type_patroned_manuscripts_01_desc: "#F 在一个黑暗的世界里，书面文字是真正知识的最后堡垒。#!"
 building_patroned_manuscripts_01: "资助书写者"
 building_patroned_manuscripts_01_desc: "在一个黑暗的世界里，书面文字是真正知识的最后堡垒。"
 building_type_patroned_painters_01: "资助画家"
 building_type_patroned_painters_01_desc: "#F 绘画仍处于起步阶段，但对于那些愿意使自己的故事化为不朽并有能力做到这一点的人来说，它已经是一个有利可图的生意。#!"
 building_patroned_painters_01: "资助画家"
 building_patroned_painters_01_desc: "绘画仍处于起步阶段，但对于那些愿意使自己的故事化为不朽并有能力做到这一点的人来说，它已经是一个有利可图的生意。"
 building_type_crescent_moon_dragon_nest_01: "月牙泉龙穴"
 building_type_crescent_moon_dragon_nest_01_desc: "#F 塔克拉玛干的两大龙穴之一，位于敦煌外的月牙泉中。#!"
 building_crescent_moon_dragon_nest_01: "月牙泉龙穴"
 building_crescent_moon_dragon_nest_01_desc: "该水体给凶民的预言家们带来了极大的信心，因为它确实刻画出几乎是数学级精确的新月。这无疑是月亮上的女神发出的信号，但这个信号的含义是一个有争议的话题。"
 building_type_perugia_chantry_01: "佩鲁贾秘所"
 building_type_perugia_chantry_01_desc: "#F 依偎在乡间小城的荒凉山丘上，这秘所远离着塞奥里斯的阴谋诡计和[GetTrait('tzimisce').GetName(GetNullCharacter)]的侵略肆虐。再加上宜人的气候，这里是饱受风霜的[GetTrait('tremere').GetName(GetNullCharacter)]最喜欢的度假地。#!"
 building_perugia_chantry_01: "佩鲁贾秘所：中立地"
 building_perugia_chantry_01_desc: "佩鲁贾由不太重要的雏儿们管理，与议会的权力斗争相去甚远。"
 building_perugia_chantry_02: "佩鲁贾秘所：远离风暴"
 building_perugia_chantry_02_desc: "在意大利[GetTrait('tzimisce').GetName(GetNullCharacter)]的存在感不强。厌倦了战争的法师们经常前往佩鲁贾，以便在远离着暗淡和血腥的特兰西瓦尼亚的地方获得休息。"
 building_perugia_chantry_03: "佩鲁贾秘所：度假胜地"
 building_perugia_chantry_03_desc: "由豪华别墅组成的庞大建筑群在等待着疲惫不堪的[GetTrait('tremere').GetName(GetNullCharacter)]，他们在这里逗留，诗歌、游戏和雕塑竞相缓解他们的心灵。"
 building_type_abbey_crown_01: "圣冠隐修院"
 building_type_abbey_crown_01_desc: "#F 圣冠隐修院坐落在小型高地上（150英尺高），所处空地的周围混杂生长着森林和荆棘丛（有些像小树一样高）。隐修院建于12世纪初，由受一堵坚固的石墙围绕的建筑群组成。#!"
 building_abbey_crown_01: "小型圣冠隐修院"
 building_abbey_crown_01_desc: "圣冠隐修院最令人满意的特点是位于隐修院下面的一列地下房间。这些小房间旨在作为冥想区或忏悔室使用，为访客提供了足够的休息场所。"
 building_abbey_crown_02: "大型圣冠隐修院"
 building_abbey_crown_02_desc: "圣冠隐修院的名字来自一个传说，该传说将荆棘丛的起源归结为公元一世纪亚利马太的约瑟对英格兰的造访。"
 building_abbey_crown_03: "著名圣冠隐修院"
 building_abbey_crown_03_desc: "自成立以来，该隐修院一直被作为一个中立场所，用于解决争斗中的贵族甚至互争的吸血鬼领主之间的争吵。"
 POD_has_special_building_slot_tt: "该建筑只能建在有特殊建筑槽的省份。"
 building_type_hanging_gardens_01: "空中花园"
 building_type_hanging_gardens_01_desc: "#F 巴比伦空中花园是古代世界七大奇迹之一，又称悬园。#!"
 building_hanging_gardens_01: "空中花园"
 building_hanging_gardens_01_desc: "空中花园，又称悬苑，是古代七大奇迹之一。传说是公元前6世纪由巴比伦王国的尼布甲尼撒二世在巴比伦城附近为其患思乡病的王妃安美依迪丝修建。据说空中花园采用立体造园手法，将花园放在四层平台之上，由沥青及砖块建成，平台由25米高的柱子支撑，并且有灌溉系统，奴隶不停地推动连系着齿轮的把手。园中种植各种花草树木，远看犹如花园悬在半空中，由此得名空中花园。"
 building_type_ramessu_court_01: "拉美苏之庭"
 building_type_ramessu_court_01_desc: "#F 拉美苏的宫廷仿效古埃及习俗，对潜藏不屑一顾，却对古老的礼仪、华丽和荣耀十分在意。#!"
 building_ramessu_court_01: "拉美苏之庭"
 building_ramessu_court_01_desc: "拉美苏的宫廷仿效古埃及习俗，对潜藏不屑一顾，却对古老的礼仪、华丽和荣耀十分在意。"
 building_type_sundervere_cult_01: "孙陀罗伐罗密教"
 building_type_sundervere_cult_01_desc: "#F 孙陀罗伐罗是操纵和煽动狂热的大师，他的信徒比大多数人想象的要多得多。#!"
 building_sundervere_cult_01: "小型密教"
 building_sundervere_cult_01_desc: "即使是在早期阶段，孙陀罗伐罗的影响力也让许多热血沸腾的狂热分子愿意为他的功业献身。"
 building_sundervere_cult_02: "中型密教"
 building_sundervere_cult_02_desc: "孙陀罗伐罗的邪恶影响渗透到这个地区，给了他打击不信者的力量。"
 building_sundervere_cult_03: "大型密教"
 building_sundervere_cult_03_desc: "无论你走到哪里，都会被孙陀罗伐罗的狂热分子盯上。不管别人知道与否，这片土地都是他的。"
 building_type_necromantic_sekhem_01: "亡灵塞赫源泉"
 building_type_necromantic_sekhem_01_desc: "#F 由于远离埃及，又被[UmbraGlossaryLocalized('shadowlands','冥界')]的力量所包围，伊努哈顿不得不适应环境，寻找一些…….不同寻常的塞赫来源。#!"
 building_necromantic_sekhem_01: "小型亡灵塞赫源泉"
 building_necromantic_sekhem_01_desc: "来自[UmbraGlossary('shadowlands')]的一些能量正被伊努哈顿引导到这里，用于他的神秘目的。"
 building_necromantic_sekhem_02: "中型亡灵塞赫源泉"
 building_necromantic_sekhem_02_desc: "在这，通过伊努哈顿的自创仪式，死者的能量以神秘的方式与塞赫融合。"
 building_necromantic_sekhem_03: "大型亡灵塞赫源泉"
 building_necromantic_sekhem_03_desc: "这一地区的[UmbraGlossary('shadowlands')]散发着令人毛骨悚然的灵光，被伊努哈顿完全吸收，为他奇特而繁多的仪式提供能量。"
 building_iron_pillar_of_delhi_02: "失衡的德里铁柱"
 building_iron_pillar_of_delhi_02_desc: "这根柱子散发着纯粹的阳力。然而，明眼人也能感受到在其表面下的阴力。真正的平衡已经接近，但尚未实现。"
 building_iron_pillar_of_delhi_03: "平衡的德里铁柱"
 building_iron_pillar_of_delhi_03_desc: "这根柱子由最纯净的铁锻造而成，其构成和形状在阴阳之间达到了完美的平衡，以至于风吹雨打、日晒雨淋和时间本身都没有损坏其表面。"
 building_type_kashi_bazaar_01: "喀什集市"
 building_type_kashi_bazaar_01_desc: "#F 喀什是一座在多种文化之间保持平衡的城市，是一片充满机遇和危险的土地。#!"
 building_kashi_bazaar_01: "起步的喀什集市"
 building_kashi_bazaar_01_desc: "喀什是任何超自然进入中原的最可能的入口，因此这里是在中国朝廷不知情的情况下达成许多交易的地方。"
 building_kashi_bazaar_02: "扩张的喀什集市"
 building_kashi_bazaar_02_desc: "来自中国的刁蛮[Glossary('万鬼','game_concept_kuei_jin_desc')]经常流亡西方，因此他们经过喀什，使整个城市成为一个边陲小镇。"
 building_kashi_bazaar_03: "繁华的喀什集市"
 building_kashi_bazaar_03_desc: "从金钱到最微不足道的哲学辩论，这里应有尽有。喀什本身就是一个小世界。"
 building_type_flaming_mountain_01: "火焰山"
 building_type_flaming_mountain_01_desc: "#F 塔克拉玛干的两大龙穴之一。据说它曾是通往[UmbraGlossary('hell_of_being_skinned_alive')]的入口，在[Glossary('第三纪元','game_concept_third_age_desc')]末期被[Glossary('万仙','game_concept_kuei_jin_desc')]净化。#!"
 building_flaming_mountain_01: "危险的火焰山"
 building_flaming_mountain_01_desc: "[Glossary('斗姆','podgloss.toumu')]的地狱军团的残余势力仍不时出没，使得前往龙穴的旅途险象环生。"
 building_flaming_mountain_02: "稳定的火焰山"
 building_flaming_mountain_02_desc: "加强[Glossary('万仙','game_concept_kuei_jin_desc')]的古老防护仪式可确保门户永远关闭。"
 building_flaming_mountain_03: "安全的火焰山"
 building_flaming_mountain_03_desc: "净化了[Glossary('斗姆','podgloss.toumu')]的魔气后，火焰山如今已成为强大的龙穴。"
 building_type_black_dragon_nest_01: "黑龙穴"
 building_type_black_dragon_nest_01_desc: "#F 从土地本身涌出腐化之气的地方，往往会自行溃烂或消逝。#!"
 building_black_dragon_nest_01: "受释的黑龙穴"
 building_black_dragon_nest_01_desc: "玄武皇朝曾经负责捣毁这些龙穴，但由于他们的堕落，这项职责已被弃置一旁。"
 building_black_dragon_nest_02: "稳定的黑龙穴"
 building_black_dragon_nest_02_desc: "大草原上的$glossary_fera$——凶民——搜寻并摧毁那些腐化的龙穴，但出现的龙穴数量远远超过了他们的记录。"
 building_black_dragon_nest_03: "受驭的黑龙穴"
 building_black_dragon_nest_03_desc: "如此强大的气源，即使已经腐化，对于不太在意灵性腐化的[Glossary('万鬼','game_concept_kuei_jin_desc')]来说，仍然是一笔巨大的财富。"
 building_type_pataliputra_01: "华氏城"
 building_type_pataliputra_01_desc: "#F 华氏城曾是古印度主要强国的首都，如幼龙王朝、难陀王朝、孔雀王朝、笈多王朝和波罗王朝。在孔雀王朝时期，它是世界上最大的城市之一。#!"
 building_pataliputra_01: "荒芜的华氏城"
 building_pataliputra_01_desc: "华氏城从300年代开始逐渐衰落，从这一时期到约600年期间，建筑越来越少，也越来越不精致。此后的一千年里，再也没有人类活动的痕迹，该地址似乎已被遗弃。"
 building_pataliputra_02: "废弃的华氏城"
 building_pataliputra_02_desc: "关于这座曾经伟大的城市突然消失的原因，有很多说法，有的说是洪水泛滥，有的说是外敌入侵。无论如何，只要视力正常，就能看到昔日辉煌的遗迹。"
 building_pataliputra_03: "神秘的华氏城"
 building_pataliputra_03_desc: "出土记录显示，华氏城是世界上最早拥有高效地方自治政府的城市之一。这个例子即使在今天也值得借鉴。"
 building_scarlet_screen_family_04: "强力家族障幕"
 building_scarlet_screen_family_04_desc: "你现在有数个家族和一代人组成的家族障幕。这是很好的进展。"
 building_scarlet_screen_family_05: "天级家族障幕"
 building_scarlet_screen_family_05_desc: "在一个特别老的[GetTrait('kueijin').GetName( GetNullCharacter )]的带领下，世世代代养成的，对其他事情一无所知的世家。"
 building_scarlet_screen_usagigumi_04: "强力兔队障幕"
 building_scarlet_screen_usagigumi_04_desc: "你的兔队现在是一个实际的、值得尊敬的部队。有时，你可以为他们感到骄傲。"
 building_scarlet_screen_usagigumi_05: "天级兔队障幕"
 building_scarlet_screen_usagigumi_05_desc: "你的兔队现在甚至可以击溃[Glossary('阎魔王','podgloss.yamaking')]的军队。"
 building_scarlet_screen_inugumi_04: "强力犬幢障幕"
 building_scarlet_screen_inugumi_04_desc: "你的犬幢现在是一个真正值得尊敬的机构，有些已经开始将你的影响力扩展到变化妖怪和天宗的隐秘领域。总有一天。"
 building_scarlet_screen_inugumi_05: "天级犬幢障幕"
 building_scarlet_screen_inugumi_05_desc: "你的犬幢已经成为你在整个地区的眼睛和耳朵，因为你的野心一直在向外延伸。"
 building_scarlet_screen_ryugumi_04: "强力龙军障幕"
 building_scarlet_screen_ryugumi_04_desc: "你的龙军现在遍布你的整个巢穴，而且你有足够的余力让他们可以加入你的战斗中。不单独作战的感觉真好。"
 building_scarlet_screen_ryugumi_05: "天级龙军障幕"
 building_scarlet_screen_ryugumi_05_desc: "你的龙军会让所有帝国的皇家卫队感到畏惧，因为任何人在你的精英面前都会颤抖，无论是妖魔、鬼神，还是凡人。"
 building_scarlet_screen_spies_04: "强力细作障幕"
 building_scarlet_screen_spies_04_desc: "区域性事务现在对你来说是一个已知的因素，因为你已经开始在所有地方都有耳目。"
 building_scarlet_screen_spies_05: "天级细作障幕"
 building_scarlet_screen_spies_05_desc: "你的触角现在支配着这个地方，没有什么能逃过你强硬的目光。"
 building_scarlet_screen_merchants_04: "强力商贾障幕"
 building_scarlet_screen_merchants_04_desc: "你的地方财政现在是安全的，源自于你对该地区看不见的“税收”。"
 building_scarlet_screen_merchants_05: "天级商贾障幕"
 building_scarlet_screen_merchants_05_desc: "在你的“照顾”下，黄金现在像破碎蜂巢流出的蜂蜜一样从中流进你的库房。"
 building_scarlet_screen_artisans_04: "强力匠师障幕"
 building_scarlet_screen_artisans_04_desc: "你的影响现在在地区内传播，因为你已经成为当地作坊的中心。"
 building_scarlet_screen_artisans_05: "天级匠师障幕"
 building_scarlet_screen_artisans_05_desc: "在这地区，即使是行会首领也比不上你对工民的掌控。"
 building_scarlet_screen_peasants_04: "强力次级民众障幕"
 building_scarlet_screen_peasants_04_desc: "现在，你的藏身处被一个镇子守着，被普通农民保护得很好，他们中的一些人甚至知道他们在做什么。"
 building_scarlet_screen_peasants_05: "天级民众障幕"
 building_scarlet_screen_peasants_05_desc: "攻击你就是攻击城市本身。"
 POD_requirements_rookery: "[holder|E]必须是[GetTrait('gargoyle').GetName( GetPlayer )]或者是[GetScriptedCharacterByHistoryID('790870').GetFirstName]"
 building_type_hunter_merchants_01: "团结商贾"
 building_type_hunter_merchants_01_desc: "#F 他们有钱。你有需求。#!"
 building_hunter_merchants_01: "亲近商贾"
 building_hunter_merchants_01_desc: "猎魔是一项耗资巨大的工作。他们肯定能提供一些急需的帮助吧？"
 building_hunter_merchants_02: "劝服商贾"
 building_hunter_merchants_02_desc: "如果他们的钱不是用来打击黑暗中的怪物，那又有什么用呢？"
 building_hunter_merchants_03: "结盟商贾"
 building_hunter_merchants_03_desc: "强大的资助，终于相信你的功业的重要性。"
 building_type_hunter_nobles_01: "团结贵族"
 building_type_hunter_nobles_01_desc: "#F 高高在上的权贵们已被超自然侵蚀。不管他们愿不愿意，他们都需要你的帮助。#!"
 building_hunter_nobles_01: "亲近贵族"
 building_hunter_nobles_01_desc: "除掉纠缠他们的超自然探员，就能确保贵族们接受你的警告。"
 building_hunter_nobles_02: "劝服贵族"
 building_hunter_nobles_02_desc: "他们的权力小把戏与你无关，但他们对民众的影响力肯定与你有关。"
 building_hunter_nobles_03: "结盟贵族"
 building_hunter_nobles_03_desc: "他们终于看到了一直在他们眼皮底下的威胁。迟到总比不到好。"
 building_type_hunter_militia_01: "团结民兵"
 building_type_hunter_militia_01_desc: "#F 他们害怕黑暗是理所当然的。但也许他们会更害怕你。#!"
 building_hunter_militia_01: "亲近民兵"
 building_hunter_militia_01_desc: "一群单纯的年轻人，随时会被噩梦中的怪物杀死。你将进行干涉。"
 building_hunter_militia_02: "劝服民兵"
 building_hunter_militia_02_desc: "在你向他们展示了这些之后，他们几乎都没怎么睡觉。这说明他们在学习。"
 building_hunter_militia_03: "结盟民兵"
 building_hunter_militia_03_desc: "他们中的一些人可能会活下来，再战一夜。甚至两夜。"
 building_type_hunter_soldiers_01: "团结士兵"
 building_type_hunter_soldiers_01_desc: "#F 与伟大的斗争相比，他们无足轻重的战争算不了什么。你要教导他们。#!"
 building_hunter_soldiers_01: "亲近士兵"
 building_hunter_soldiers_01_desc: "在训练期间把他们吓得魂飞魄散，这样当真正的战斗来临时，他们就不会逃跑了。"
 building_hunter_soldiers_02: "劝服士兵"
 building_hunter_soldiers_02_desc: "当你让他们相信，如果现在不反击，等待他们的将是怎样的恐怖时，无足轻重的世俗顾虑和忠君思想就会消失。"
 building_hunter_soldiers_03: "结盟士兵"
 building_hunter_soldiers_03_desc: "他们都是白发老兵，希望在未来的斗争中，他们能成为你的坚强后盾。"
 building_type_hunter_clergy_01: "团结圣职"
 building_type_hunter_clergy_01_desc: "#F 信仰可以成为对抗对手的有力武器。只要信仰没有错指。#!"
 building_hunter_clergy_01: "亲近圣职"
 building_hunter_clergy_01_desc: "在参与伟大斗争的宿命中，他们所关心的无足轻重的教条并不重要。他们为什么不明白呢？"
 building_hunter_clergy_02: "劝服圣职"
 building_hunter_clergy_02_desc: "只要他们和你一样憎恨魔物，你就不在乎他们崇拜哪个神。"
 building_hunter_clergy_03: "结盟圣职"
 building_hunter_clergy_03_desc: "他们会拯救那些还能被拯救的人。剩下的由你来处理。"
 building_type_hunter_ducal_01: "确保地区"
 building_type_hunter_ducal_01_desc: "#F 只要你在这里，这里的居民就能安然入睡。你要确保这一点。#!"
 building_hunter_ducal_01: "确保邻里"
 building_hunter_ducal_01_desc: "你在这个区域开始你的旅程，每次杀死一只怪物。"
 building_hunter_ducal_02: "确保村庄"
 building_hunter_ducal_02_desc: "虽然还不多，但你所救的几个人的感激之情还是值得的。"
 building_hunter_ducal_03: "确保城镇"
 building_hunter_ducal_03_desc: "你的名字开始在这里广为人知。为了阻止你，这里布下了陷阱，擦亮了匕首。"
 building_hunter_ducal_04: "确保城市"
 building_hunter_ducal_04_desc: "不管他们知道与否，你把这座城市从黑暗中拯救了出来。至少现在是这样"
 building_hunter_ducal_05: "确保地区"
 building_hunter_ducal_05_desc: "它们每一只都死了。你的使命必须在别处继续。"
 building_type_hunter_akritai_01: "边防军修道院学校"
 building_type_hunter_akritai_01_desc: "#F 边防军主要由东正教僧侣和修女组成，他们的祈祷和训练并重，以对抗黑暗。#!"
 building_hunter_akritai_01: "小型边防军修道院学校"
 building_hunter_akritai_01_desc: "东正教猎人的修士会堂，小到足以容纳几名僧侣和修女。"
 building_hunter_akritai_02: "中型边防军修道院学校"
 building_hunter_akritai_02_desc: "在这里，虔诚的男男女女学习如何让自己的身心做好准备，以应对即将面临的神圣使命所带来的严峻考验。"
 building_hunter_akritai_03: "大型边防军修道院学校"
 building_hunter_akritai_03_desc: "在这个气势恢宏的边防军总部，日夜都能听到祈祷的歌声和刀剑的碰撞声。"
 building_type_hunter_judge_01: "民长安全屋"
 building_type_hunter_judge_01_desc: "#F 民长的人数并不多，也缺乏一个中央组织。不过，他们的影响力比大多数人想象的要大，他们可以在最不可能的地方找到帮助。#!"
 building_hunter_judge_01: "小型民长安全屋"
 building_hunter_judge_01_desc: "一些食物、几件生锈的武器和一个栖身之所。这比大多数怪物猎人所期望的要多得多。"
 building_hunter_judge_02: "中型民长安全屋"
 building_hunter_judge_02_desc: "这是一个众所周知的地址，为旅行的民长们提供了一个亟需的避难所。"
 building_hunter_judge_03: "大型民长安全屋"
 building_hunter_judge_03_desc: "在这里可以找到猎魔所需的一切，这是大多数怪物猎人梦寐以求的奢华。"
 building_type_hunter_ikhwan_01: "精诚兄弟社部落场地"
 building_type_hunter_ikhwan_01_desc: "#F 精诚兄弟社首先以家庭为纽带。一旦孩子到了可以独自骑马的年龄，父母就会教导他们猎杀怪物。#!"
 building_hunter_ikhwan_01: "小型部落场地"
 building_hunter_ikhwan_01_desc: "一个猎人小家庭团结一致，对抗黑夜中的怪物。"
 building_hunter_ikhwan_02: "中型部落场地"
 building_hunter_ikhwan_02_desc: "他们分享了自己在这些地方的生活以及对功业的承诺。"
 building_hunter_ikhwan_03: "大型部落场地"
 building_hunter_ikhwan_03_desc: "从父亲到儿子，从母亲到女儿，部落的每个成员都被灌输了神圣的使命和反击黑暗的职责。"
 building_type_hunter_independent_01: "猎魔军械库"
 building_type_hunter_independent_01_desc: "#F 你所需要的一切，让你在与任何人的较量中占据上风。#!"
 building_hunter_independent_01: "小型猎魔军械库"
 building_hunter_independent_01_desc: "一些武器藏得很好，以备不时之需。虽然不多，但却能决定生死。"
 building_hunter_independent_02: "中型猎魔军械库"
 building_hunter_independent_02_desc: "你这里有足够的东西来抵御围城。或者更有可能启动一项。"
 building_hunter_independent_03: "大型猎魔军械库"
 building_hunter_independent_03_desc: "武器、药品、陷阱、古老的禁书……你的个人宝库会让你猎杀的怪物们羡慕不已。"
 building_type_hunter_qorjin_01: "科尔沁怯薛"
 building_type_hunter_qorjin_01_desc: "#F 科尔沁的猎人拥有得天独厚的优势，他们得到了世界上最大的凡人王国——蒙古帝国的支持。科尔沁的保镖们就是这种资源丰厚的精英战士的代表。#!"
 building_hunter_qorjin_01: "小型科尔沁怯薛"
 building_hunter_qorjin_01_desc: "科尔沁的保镖由大汗亲自挑选，人数不多，但战斗力很强。"
 building_hunter_qorjin_02: "中型科尔沁怯薛"
 building_hunter_qorjin_02_desc: "现在，科尔沁的怯薛接受了训练，能够理解和抵御超自然，与草原上游荡的普通怪物相比，科尔沁的怯薛更胜一筹。"
 building_hunter_qorjin_03: "大型科尔沁怯薛"
 building_hunter_qorjin_03_desc: "科尔沁的怯薛是族人心目中的英雄，他们是技艺高超、经验丰富的猎人。"
 building_type_hunter_dazbog_01: "达兹博格战士门房"
 building_type_hunter_dazbog_01_desc: "#F 如同他们伟大的创始人一样，当代达兹博格战士日夜训练，为再征服家园做好充分准备。#!"
 building_hunter_dazbog_01: "小型达兹博格门房"
 building_hunter_dazbog_01_desc: "只有少数战士在这里训练，这是伟大的达兹博格时代留下的可怜遗迹。"
 building_hunter_dazbog_02: "中型达兹博格门房"
 building_hunter_dazbog_02_desc: "在白发老兵的注视下，新皈依者在这个小屋中扛起斧头，履行达兹博格的职责。"
 building_hunter_dazbog_03: "大型达兹博格门房"
 building_hunter_dazbog_03_desc: "如果达兹博格本人看到众多年轻和年老的战士在这里备战，一定会感到非常自豪。这终于是一道能让那些可恨魔物害怕的风景线！"
 building_type_sanctified_area_01: "圣化区域"
 building_type_sanctified_area_01_desc: "#F 最虔诚的真信大师可以永久圣化一个区域，使任何不受欢迎的超自然生物在经过该区域时都会经历一些非常不愉快的结果。#!"
 building_sanctified_area_01: "圣化区域"
 building_sanctified_area_01_desc: "由虔诚之人祝福的小型区域。大敌的爪牙走过时会感到非常不适。"
 building_sanctified_area_02: "祝圣区域"
 building_sanctified_area_02_desc: "这片土地得到了他们那个时代最令人印象深刻的真信徒之一的祝福，此地是对大敌的诅咒。"
 building_type_cult_of_amkhat_01: "阿姆卡特邪教"
 building_type_cult_of_amkhat_01_desc: "#F 作为供奉$glossary_wyrm_apophis$的金字塔的基础，阿姆卡特邪教侵扰着从君士坦丁堡到卡拉奇的各个城市。其成员都是凡人中的弃儿或权力追求者，他们背弃理性，沉溺于骇人听闻的食人和谋杀仪式。#!"
 building_cult_of_amkhat_01: "简易阿姆卡特邪教"
 building_cult_of_amkhat_01_desc: "很少的邪教徒聚集在这里，崇拜和侍奉$glossary_wyrm_apophis$。"
 building_cult_of_amkhat_02: "下等阿姆卡特邪教"
 building_cult_of_amkhat_02_desc: "一些邪教徒聚集在这里，崇拜和侍奉$glossary_wyrm_apophis$。"
 building_cult_of_amkhat_03: "中等阿姆卡特邪教"
 building_cult_of_amkhat_03_desc: "许多邪教徒聚集在这里，崇拜和侍奉$glossary_wyrm_apophis$。"
 building_cult_of_amkhat_04: "上等阿姆卡特邪教"
 building_cult_of_amkhat_04_desc: "大堆邪教徒聚集在这里，崇拜和侍奉$glossary_wyrm_apophis$。"
 building_cult_of_amkhat_05: "强力阿姆卡特邪教"
 building_cult_of_amkhat_05_desc: "大量的虔诚邪教徒侍从崇拜和侍奉$glossary_wyrm_apophis$的地方。"
 building_cult_of_amkhat_06: "王级阿姆卡特邪教"
 building_cult_of_amkhat_06_desc: "大量的虔诚邪教徒侍从崇拜和侍奉$glossary_wyrm_apophis$的热门聚集地。"
 building_cult_of_amkhat_07: "帝级阿姆卡特邪教"
 building_cult_of_amkhat_07_desc: "邪教徒崇拜和侍奉$glossary_wyrm_apophis$的区域性聚集地。"
 building_cult_of_amkhat_08: "神级阿姆卡特邪教"
 building_cult_of_amkhat_08_desc: "一个全国范围内崇拜和侍奉$glossary_wyrm_apophis$的邪教徒聚集地。"
 building_type_hagia_sophia_02: "阿亚索菲亚清真寺"
 building_type_hagia_sophia_02_desc: "阿亚索菲亚清真寺是一个真正的工程学奇迹，巨大的穹顶是其最为壮观的特征。该建筑由皇帝查士丁尼一世始建于公元537年，后来被改造为一座气势恢宏的清真寺。\n\n因此她将永恒存在，毫无疑问，因为没有什么能颠覆罗姆强大的力量。"
 building_type_st_andrew_01: "圣安德鲁修道院"
 building_type_st_andrew_01_desc: "#F 一座建在臭名昭著的丹布罗坑上的修道院。#!"
 building_st_andrew_01: "西多会修道院遗址"
 building_st_andrew_01_desc: "因来自地坑的疯狂而被遗弃的回廊式修道院废墟。这一事件引发了裁判所对该遗址的调查。"
 building_st_andrew_02: "红修会前哨站"
 building_st_andrew_02_desc: "红修会教友的一个猎群正在废弃的回廊式修道院里筹建一个研究中心，以调查深坑。"
 building_st_andrew_03: "红修会研究中心"
 building_st_andrew_03_desc: "红修会对修道院进行了全面翻修，并正在对坑洞和里面的魔物进行调查。有人担心，它们可能是蔓延地疯狂的真正源头。"
 building_type_holy_mother_01: "圣母修女院"
 building_type_holy_mother_01_desc: "#F 圣约翰修女会最重要的修女院。与其说它是医院，不如说它是学校，是宁静的花园，是远离战火的喘息之地。#!"
 building_holy_mother_01: "修女院医院"
 building_holy_mother_01_desc: "来自各修会的裁判官们都会来到这座修女院进行冥想、反思和恢复。"
 building_holy_mother_02: "圣约翰修女会行政部"
 building_holy_mother_02_desc: "圣约翰修女会的每项活动都是在这里规划、组织和支持的。"
 building_holy_mother_03: "圣约翰修女会圣母办公室"
 building_holy_mother_03_desc: "修女会圣母的办公室就在这里。修女院、罗马和其他修会的领导层之间有直接联系。"
 building_type_st_john_01: "圣者约翰修女院"
 building_type_st_john_01_desc: "#F 修女会的修女总部，也是修女会创始人修女特蕾莎的安息之地。#!"
 building_st_john_01: "修女会总部"
 building_st_john_01_desc: "修女会最大的教学设施最近在政治上黯然失色，但仍是修女会的核心。"
 building_st_john_02: "特蕾莎之墓"
 building_st_john_02_desc: "第一位修女最后的安息之地是一片福地。"
 building_st_john_03: "圣约翰朝圣地"
 building_st_john_03_desc: "特蕾莎的墓和圣物箱可以创造奇迹，人们从四面八方来到修女院参观。"
 building_type_st_james_01: "长子圣雅各伯安宁病房"
 building_type_st_james_01_desc: "#F 安宁疗养院是亚柯骑士运营的最大的非军事建筑。#!"
 building_st_james_01: "长子圣雅各伯医院"
 building_st_james_01_desc: "修会成员和前往孔波斯特拉朝圣的旅行者的医院。"
 building_st_james_02: "长子圣雅各孤儿院"
 building_st_james_02_desc: "亚柯的孤儿院，收容被监护人和潜在的未来骑士。许多未来的骑士团斗士都是在这里度过童年的。"
 building_st_james_03: "长子圣雅各指挥部"
 building_st_james_03_desc: "兄弟会拥有成功猎杀魔物所需的一切——盔甲、马匹和圣物随时可得。"
 building_type_bookshop_01: "善书者书店"
 building_type_bookshop_01_desc: "#F 图卢兹的一家不起眼的书店。#!"
 building_bookshop_01: "小型书店"
 building_bookshop_01_desc: "这家小书店的店主似乎有很多人脉，能接触到很多书籍。"
 building_bookshop_02: "繁华书店"
 building_bookshop_02_desc: "这家书店有许多来自欧洲各地的顾客。在这里能找到任何书，这让有关神职人员瞠目结舌。"
 building_bookshop_03: "艾格尼恩神目神龛"
 building_bookshop_03_desc: "前神目领导人艾格尼恩的安息之地就在这里。虽然教会永远不会承认他为更大的善所做的令人难以置信的工作，但神目不会忘记。"
 building_prince_city_08: "都城亲王"
 building_prince_city_08_desc: "此处凡人的言语传播甚广，你的言辞亦然。"
 building_prince_city_09: "大都会亲王"
 building_prince_city_09_desc: "世界上最伟大的城市之一在你的阴影中生存。它只是你领域内的一部分，你的影响几乎无所不及。"
 building_type_bloodflowers_fleshpits_01: "血花肉池"
 building_type_bloodflowers_fleshpits_01_desc: "#F 既是飨宴厅，也是无尽狂欢场，更是祭祀坛——凡人于此膜拜她们的[Glossary('庞南加兰','podgloss.penangallan')]。纵使极乐蚀骨，仍有人能侥幸生还。#!"
 building_bloodflowers_fleshpits_01: "血花肉池"
 building_bloodflowers_fleshpits_01_desc: "既是飨宴厅，也是无尽狂欢场，更是祭祀坛——凡人于此膜拜她们的[Glossary('庞南加兰','podgloss.penangallan')]。纵使极乐蚀骨，仍有人能侥幸生还。"
 building_type_longmen_caves_01: "龙门石窟"
 building_type_longmen_caves_01_desc: "#F 焚书时期，士对$pod_kueijin$社会造成重创。珍贵典籍被紧急藏匿于龙门石窟，这一险招终得保全。此地至今仍是备受尊崇的学府。#!"
 building_longmen_caves_01: "简陋的龙门石窟"
 building_longmen_caves_01_desc: "焚书时期，士对$pod_kueijin$社会造成重创。珍贵典籍被紧急藏匿于龙门石窟，这一险招终得保全。此地至今仍是备受尊崇的学府。"
 building_longmen_caves_02: "翻新的龙门石窟"
 building_longmen_caves_02_desc: "经整修增置，如今的龙门石窟已成为一座天然图书馆，更能接纳外客。"
 building_type_zero_kilometer_01: "零公里"
 building_type_zero_kilometer_01_desc: "#F 此处乃日本气机核心，对$pod_kueijin$而言如同巨型灵能反应堆。全岛所有$pod_kueijin$栖居的寺庙皆仰赖此中枢供能。#!"
 building_zero_kilometer_01: "零公里"
 building_zero_kilometer_01_desc: "此处乃日本气机核心，对$pod_kueijin$而言如同巨型灵能反应堆。全岛所有$pod_kueijin$栖居的寺庙皆仰赖此中枢供能。"
 building_type_mt_meru_01: "须弥山"
 building_type_mt_meru_01_desc: "#F 须弥山乃$pod_kueijin$传说中的极乐净土，亦是其堕落前的起源之地。虽有人认为其早已湮灭仅为寓言，但西藏探险已发现确凿证据……尽管至今无$pod_kueijin$能成功登顶带回实证。#!"
 building_mt_meru_01: "须弥山"
 building_mt_meru_01_desc: "须弥山乃$pod_kueijin$传说中的极乐净土，亦是其堕落前的起源之地。虽有人认为其早已湮灭仅为寓言，但西藏探险已发现确凿证据……尽管至今无$pod_kueijin$能成功登顶带回实证。"
 building_type_library_of_the_jade_court_01: "玉之庭图书馆"
 building_type_library_of_the_jade_court_01_desc: "#F 尽管被白骨图书馆所掩盖，玉之庭图书馆却以其对被广泛认为是异端文本的“开放”政策而闻名。#!"
 building_library_of_the_jade_court_01: "玉之庭图书馆"
 building_library_of_the_jade_court_01_desc: "尽管被白骨图书馆所掩盖，玉之庭图书馆却以其对被广泛认为是异端文本的“开放”政策而闻名。"
 building_type_black_lotus_temple_01: "黑莲寺"
 building_type_black_lotus_temple_01_desc: "#F 由至静黑珠女士亲自建造，这是最古老的影颂寺庙。作为阴与虚无的至高圣地，它的寂静和闹鬼的走廊即使是对最冷酷的访客也是一种考验。#!"
 building_black_lotus_temple_01: "黑莲寺"
 building_black_lotus_temple_01_desc: "由至静黑珠女士亲自建造，这是最古老的影颂寺庙。作为阴与虚无的至高圣地，它的寂静和闹鬼的走廊即使是对最冷酷的访客也是一种考验。"
 building_type_garden_of_samchok_01: "三陟花园"
 building_type_garden_of_samchok_01_desc: "#F 安秀景自己的住所是一个学习和交易的地方。来访者经常购买青龙皇朝著名的玉石，而女主人则用她许多夸大的故事来娱乐听众。#!"
 building_garden_of_samchok_01: "三陟花园"
 building_garden_of_samchok_01_desc: "安秀景自己的住所是一个学习和交易的地方。来访者经常购买青龙皇朝著名的玉石，而女主人则用她许多夸大的故事来娱乐听众。"
 building_type_the_bone_library_01: "白骨图书馆"
 building_type_the_bone_library_01_desc: "#F 简而言之，这是由$pod_kueijin$中骨花一派所管理的最大图书馆，所有访客都需经过严格筛查。作为这一隐世[Glossary('心法','podgloss.dharma')]派系最强大的政治资产，每一位上官在修行之路上都不得不前来此处寻求帮助。#!"
 building_the_bone_library_01: "白骨图书馆"
 building_the_bone_library_01_desc: "简而言之，这是由$pod_kueijin$中骨花一派所管理的最大图书馆，所有访客都需经过严格筛查。作为这一隐世[Glossary('心法','podgloss.dharma')]派系最强大的政治资产，每一位上官在修行之路上都不得不前来此处寻求帮助。"
 building_type_thousand_crane_monastery_01: "千鹤寺"
 building_type_thousand_crane_monastery_01_desc: "#F 千鹤母悟道之地。虽历经沧桑，此处仍是腾龙舞[Glossary('心法','podgloss.dharma')]中最神圣的圣地。#!"
 building_thousand_crane_monastery_01: "千鹤寺"
 building_thousand_crane_monastery_01_desc: "千鹤母悟道之地。虽历经沧桑，此处仍是腾龙舞[Glossary('心法','podgloss.dharma')]最神圣的圣地。"
 building_type_temple_of_the_lotus_pond_in_winter_01: "冬荷潭寺"
 building_type_temple_of_the_lotus_pond_in_winter_01_desc: "#F 八莲开[Glossary('心法','podgloss.dharma')]根据地。这里举办研讨会、会议和辩论。学生们从远方赶来，只为聆听这里经常出现的受人尊敬的老师们的教诲。#!"
 building_temple_of_the_lotus_pond_in_winter_01: "冬荷潭寺"
 building_temple_of_the_lotus_pond_in_winter_01_desc: "八莲开[Glossary('心法','podgloss.dharma')]根据地。这里举办研讨会、会议和辩论。学生们从远方赶来，只为聆听这里经常出现的受人尊敬的老师们的教诲。"
 building_type_beijing_temples_01: "鹤寺"
 building_type_beijing_temples_01_desc: "#F 由华鹤道[Glossary('心法','podgloss.dharma')]大小寺院组成的修行网络，提供从传道授业到典籍查阅等多项服务，是该派修行者的集结中枢。#!"
 building_beijing_temples_01: "鹤寺"
 building_beijing_temples_01_desc: "由华鹤道[Glossary('心法','podgloss.dharma')]大小寺院组成的修行网络，提供从传道授业到典籍查阅等多项服务，是该派修行者的集结中枢。"
 building_type_temple_three_mountains_01: "三山寺"
 building_type_temple_three_mountains_01_desc: "#F 一群华鹤派进行的社会学实验场。寺院暗中观察凡俗村落的发展，偶尔设置“考题”以验证其最新理论。#!"
 building_temple_three_mountains_01: "三山寺"
 building_temple_three_mountains_01_desc: "一群华鹤派进行的社会学实验场。寺院暗中观察凡俗村落的发展，偶尔设置“考题”以验证其最新理论。"
 building_type_hall_of_the_black_tortoise_01: "玄武殿"
 building_type_hall_of_the_black_tortoise_01_desc: "#F 一座名为喀拉哈的宏伟殿堂——北方玄武皇朝——曾在此统治，直到[Glossary('安达','podgloss.anda')]部族到来。这座殿堂被付之一炬，多数居民葬身火海，如今它屹立于此，作为多布鲁尔子嗣力量的见证。#!"
 building_hall_of_the_black_tortoise_01: "玄武殿"
 building_hall_of_the_black_tortoise_01_desc: "一座名为喀拉哈的宏伟殿堂——北方玄武皇朝——曾在此统治，直到[Glossary('安达','podgloss.anda')]部族到来。这座殿堂被付之一炬，多数居民葬身火海，如今它屹立于此，作为多布鲁尔子嗣力量的见证。"
 building_type_daisen_mountain_01: "大山"
 building_type_daisen_mountain_01_desc: "#F 这座美丽而险峻的山峰据传是迦具土命的居所，长久以来一直是$pod_kueijin$刺客的训练之地。黑様是此地最负盛名的导师，但绝非唯一一位。#!"
 building_daisen_mountain_01: "大山"
 building_daisen_mountain_01_desc: "这座美丽而险峻的山峰据传是火之迦具土神的居所，长久以来一直是$pod_kueijin$刺客的训练场。黑様是此处最著名的导师，但绝非唯一一位。"
 building_type_ruins_of_bhuvar_01: "浮屠废墟"
 building_type_ruins_of_bhuvar_01_desc: "#F 在天族的圣城蒂鲁马拉，人们熟稔于游荡在灵界（浮屠，西方称为影界）的巨型生物。几个世纪以来，这已成为一种成人仪式，通常于排灯节的连宵庆典中举行：新加入天族的饿殍（多为两三名神童，有时仅一人）将在这险恶之境中经受试炼。#!"
 building_ruins_of_bhuvar_01: "浮屠废墟"
 building_ruins_of_bhuvar_01_desc: "在天族的圣城蒂鲁马拉，人们熟稔于游荡在灵界（浮屠，西方称为影界）的巨型生物。几个世纪以来，这已成为一种成人仪式，通常于排灯节的连宵庆典中举行：新加入天族的饿殍（多为两三名神童，有时仅一人）将在这险恶之境中经受试炼。"
 building_type_secret_library_of_shigatse_01: "日喀则秘藏经阁"
 building_type_secret_library_of_shigatse_01_desc: "#F 日喀则的骨花僧侣以通晓危险秘闻为业。因此，他们的藏书阁不仅不对外开放，甚至鲜为人知。#!"
 building_secret_library_of_shigatse_01: "日喀则秘藏经阁"
 building_secret_library_of_shigatse_01_desc: "日喀则的骨花僧侣以通晓危险秘闻为业。因此，他们的藏书阁不仅不对外开放，甚至鲜为人知。"
 building_dragon_nest_04: "掌握龙井"
 building_dragon_nest_04_desc: "在超自然存在的妥善维护下，此处气源已能随时供人取用。\n$POD_dragon_nest_requirements_development_20$"
 building_dragon_nest_05: "掌握龙脉"
 building_dragon_nest_05_desc: "当龙脉生长至一定规模时，会泛起流光，如河水般蜿蜒流动。色彩的微妙变化既昭示着气的类型，也指向通往不同目的地的各条支流。\n$POD_dragon_nest_requirements_development_30$"
 building_dragon_nest_06: "掌握龙脉群"
 building_dragon_nest_06_desc: "当与其他气源交汇时，龙穴的效力将大幅增强，并分化为多条龙脉。\n$POD_dragon_nest_requirements_development_40$"
 building_dragon_nest_07: "掌握龙门"
 building_dragon_nest_07_desc: "一旦水门被控制，龙脉将成为栖居者取之不竭的力量源泉——只要龙门屹立不倒。当然，觊觎此地的超自然邻居们或许不会容忍太久。\n$POD_dragon_nest_requirements_development_60$"
 building_type_ashirra_mosque_01: "阿什拉清真寺"
 building_type_ashirra_mosque_01_desc: "#F 清真寺是阿什拉派社区的核心。#!"
 building_ashirra_mosque_01: "清真寺"
 building_ashirra_mosque_01_desc: "当地伊玛目在此引领信徒祈祷，以期救赎他们的灵魂。"
 building_ashirra_mosque_02: "大型清真寺"
 building_ashirra_mosque_02_desc: "众多穆斯林聚集于此祈祷并倾诉疾苦。"
 building_ashirra_mosque_03: "大清真寺"
 building_ashirra_mosque_03_desc: "这座清真寺是所有该隐子嗣的庇护所，无论信仰为何，皆可在此寻得宁静与敬拜之地。"
 building_type_unique_dragon_nest_01: "核心龙穴"
 building_type_unique_dragon_nest_01_desc: "#F 龙穴虽可现于多处，然唯有少数坐落于主要龙脉交汇之地。此类龙穴乃能量之枢纽，争夺激烈。#!"
 building_unique_dragon_nest_01: "核心龙穴"
 building_unique_dragon_nest_01_desc: "龙穴虽可现于多处，然唯有少数坐落于主要龙脉交汇之地。此类龙穴乃能量之枢纽，争夺激烈。"
 building_type_dragon_nested_alchemy_laboratory_01: "龙脉嵌套炼金实验室"
 building_type_dragon_nested_alchemy_laboratory_01_desc: "#F 一组相互连接的复杂建筑群，与下方的龙脉相融共生。#!"
 building_dragon_nested_alchemy_laboratory_01: "初级龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_01_desc: "一组相互连接的复杂建筑群，与下方的龙脉相融共生。\n\n目前设施非常简陋，功能有限。"
 building_dragon_nested_alchemy_laboratory_02: "简易龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_02_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前是一套与龙脉高度协调的复杂建筑群，可提供少量增益。"
 building_dragon_nested_alchemy_laboratory_03: "标准龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_03_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前是一套与龙脉紧密交织的复杂建筑群。"
 building_dragon_nested_alchemy_laboratory_04: "复合龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_04_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前是一套与龙脉深度交织的复杂建筑群，可带来显著增益。"
 building_dragon_nested_alchemy_laboratory_05: "扩展龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_05_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前是一套与龙脉深度交织并放大其效能的复杂建筑群，为使用者提供额外益处。"
 building_dragon_nested_alchemy_laboratory_06: "自然化龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_06_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前与龙脉的连接已达到浑然一体的境界，乍看之下难以区分彼此。"
 building_dragon_nested_alchemy_laboratory_07: "深层龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_07_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前与龙脉的连接极为紧密，大幅提升了该区域的炼金潜力。"
 building_dragon_nested_alchemy_laboratory_08: "脉络龙脉嵌套炼金实验室"
 building_dragon_nested_alchemy_laboratory_08_desc: "一组相互连接的复杂建筑群，与周围的龙脉相融共生。\n\n目前与龙脉的连接确保使用者能直接利用其能量进行炼金创造。"
 POD_dragon_nest_requirements_development_20: "#help 这个级别需要#bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_20_value', '20' )]#![development|E]来建立。#!"
 POD_dragon_nest_requirements_development_20_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_4_requirement')]"
 POD_dragon_nest_requirements_development_30: "#help 这个级别需要#bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_30_value', '30' )]#![development|E]来建立。#!"
 POD_dragon_nest_requirements_development_30_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_5_requirement')]"
 POD_dragon_nest_requirements_development_40: "#help 这个级别需要#bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_40_value', '40' )]#![development|E]来建立。#!"
 POD_dragon_nest_requirements_development_40_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_6_requirement')]"
 POD_dragon_nest_requirements_development_60: "#help 这个级别需要#bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_60_value', '60' )]#![development|E]来建立。#!"
 POD_dragon_nest_requirements_development_60_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_7_requirement')]"
 building_type_corrupted_dragon_nest_01_general: "这座龙穴已被黑暗魔法彻底腐化，无可救药，唯有心怀不洁者方可利用。"
 building_type_corrupted_dragon_nest_01: "掌握腐化龙穴"
 building_type_corrupted_dragon_nest_01_desc: "#F 一些特殊地区积蓄着大量的气，这会吸引大量的鬼神和感知敏锐的凡人，此类地区被鬼神称作圣地，节点，鬼屋，中原族裔则称其为龙穴。\n\n$building_type_corrupted_dragon_nest_01_general$#!"
 building_corrupted_dragon_nest_01: "掌握腐化龙脉"
 building_corrupted_dragon_nest_01_desc: "此处气机旺盛，值得深入探查。\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_02: "掌握腐化龙桥"
 building_corrupted_dragon_nest_02_desc: "龙脉是连接多个龙穴的强大气脉，拥有足够力量的神灵可借龙脉实现远距离传送等伟力。\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_03: "掌握腐化龙源"
 building_corrupted_dragon_nest_03_desc: "虽规模尚小且未充分开发，但此地气源潜力深厚。\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_04: "掌握腐化龙井"
 building_corrupted_dragon_nest_04_desc: "在超自然存在的妥善维护下，此处气源已能随时供人取用。\n$POD_dragon_nest_requirements_development_20$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_05: "掌握腐化龙河"
 building_corrupted_dragon_nest_05_desc: "当龙脉生长至一定规模时，会泛起流光，如河水般蜿蜒流动。色彩的微妙变化既昭示着气的类型，也指向通往不同目的地的各条支流。\n$POD_dragon_nest_requirements_development_30$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_06: "掌握腐化龙脉群"
 building_corrupted_dragon_nest_06_desc: "当与其他气源交汇时，龙穴的效力将大幅增强，并分化为多条龙脉。\n$POD_dragon_nest_requirements_development_40$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_07: "掌握腐化龙门"
 building_corrupted_dragon_nest_07_desc: "一旦水门被控制，龙脉将成为栖居者取之不竭的力量源泉——只要龙门屹立不倒。当然，觊觎此地的超自然邻居们或许不会容忍太久。\n$POD_dragon_nest_requirements_development_60$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_type_feng_shui_harmonized_area_01: "风水调和之地"
 building_type_feng_shui_harmonized_area_01_desc: "#F “风水”一词在汉语中意为“风与水”，是中国堪舆学的实践，旨在协调建筑与环境，使其与大地精魂及自然能量脉络和谐共存。#!"
 building_feng_shui_harmonized_area_01: "次级风水调和之地"
 building_feng_shui_harmonized_area_01_desc: "在动土之前，风水师会被请至拟建地点，勘测区域内的自然力场与能量脉络，确保建筑设计符合大地固有的能量流向。"
 building_feng_shui_harmonized_area_02: "中级风水调和之地"
 building_feng_shui_harmonized_area_02_desc: "风水师通晓仪式与法门，可调节某地与灵界之间的绝壁强度。通过遵循风水原理建造建筑，能够为场地注入和谐能量，从而将当地的绝壁削弱一至两级。"
 building_feng_shui_harmonized_area_03: "高级风水调和之地"
 building_feng_shui_harmonized_area_03_desc: "风水在$pod_kueijin$社会中备受重视。风水师（即风水实践者）被视为与建筑师和勘测师同等重要，其服务报酬丰厚。在建筑建造过程中，风水师之言即为律法。"
 building_feng_shui_harmonized_area_04: "上乘风水调和之地"
 building_feng_shui_harmonized_area_04_desc: "某些$pod_kueijin$研习了他们独有的风水之术，常在夜间以术士身份活动。此法被称为“左道”（即“黑法”），用于将$pod_kueijin$墓穴与气脉精准对齐、构建最佳巢穴布局，甚至可在中国广袤乡野中探寻隐秘洞窟。"
 building_type_extended_dragon_nest_01: "扩展龙穴"
 building_type_extended_dragon_nest_01_desc: ""
 building_extended_dragon_nest_01: "轻度扩展龙穴"
 building_extended_dragon_nest_01_desc: ""
 building_extended_dragon_nest_02: "扩展龙穴"
 building_extended_dragon_nest_02_desc: ""
 building_type_feng_dragon_nest_01: "风龙穴"
 building_type_feng_dragon_nest_01_desc: "#F 风龙穴是天堂之地众多龙穴之一。#!"
 building_feng_dragon_nest_01: "风龙穴"
 building_feng_dragon_nest_01_desc: "高山之巅，狂风环伺，此地的能量美得令人心悸。"
 building_type_mestha_farmstead_01: "姆塞塔农场"
 building_type_mestha_farmstead_01_desc: "#F 一座早已被历史遗忘的、不起眼的小农庄。然而在明眼人看来，此地却显得异乎寻常地重要。#!"
 building_mestha_farmstead_01: "姆塞塔农场 ：历史碎片"
 building_mestha_farmstead_01_desc: "伊西斯与阿努比斯为躲避赛特追兵，曾藏身于此屋，受到一户虔诚人家的庇护。"
 building_mestha_farmstead_02: "姆塞塔农场：神话记忆"
 building_mestha_farmstead_02_desc: "这座小屋见证了第一位木乃伊升华为亡生，这是伊西斯为拯救荷鲁斯与奥西里斯而匆忙进行的试验。"
 building_mestha_farmstead_03: "姆塞塔农场：众神战场"
 building_mestha_farmstead_03_desc: "赛特追上了伊西斯和阿努比斯，一场神与神之间的激战在此爆发。"
 POD_eastern_religion_trigger_tt: "你的信仰必须源于亚洲（鬼人、星占、可汗、士、苦行血僧、无天等等）"
 building_type_silbury_hill_01: "Silbury Hill"
 building_type_silbury_hill_01_desc: "#F Silbury Hill is an enigma. The chalk mound, which stands over 130 feet high and covers nearly 6 acres, was built long before the Romans came. Fianna legends say a faerie king or worshipful tribesmen built the mound, but no one really knows for sure, as centuries of contemplation by mage and Garou have formed a caern of Enigmas.\nDuring the unrest of Stephen’s reign, the Garou lost the caern; a powerful group of book-learned mages forced the local sept out with great magicks.#!"
 building_silbury_hill_01: "Silbury Hill"
 building_silbury_hill_01_desc: "$building_type_silbury_hill_01_desc$"
 building_type_draycott_castle_01: "Ruins of Draycott Castle"
 building_type_draycott_castle_01_desc: "#F Baron Draycott, a cruel man, punished the peasantry harshly at the merest suggestion of an infraction. An old man who wandered too close to the castle was whipped and then hung from the battlements as an example to others.\nThat night, every Get for miles gathered to avenge their Kinfolk. Storming the castle, they killed the baron — slowly — and then proceeded to take the castle apart, stone by stone and timber by timber. The foundations and many of the stones are there today, a testament to the will of the Garou.#!"
 building_draycott_castle_01: "Ruins of Draycott Castle"
 building_draycott_castle_01_desc: "$building_type_draycott_castle_01_desc$"
 building_type_fir_chreig_01: "Fir Chreig"
 building_type_fir_chreig_01_desc: "#F  A chambered cairn and a low mound lie inside a stone circle. Ancient priests performed ceremonies here, and the Garou continue the practice. In times of the most dire need, the Theurges perform a ritual which transforms a stone from the northern avenue into a rock giant. The giant will fight, carry or perform other simple requests until the next sunrise or sunset; at that time, the stone shatters.#!"
 building_fir_chreig_01: "Fir Chreig"
 building_fir_chreig_01_desc: "$building_type_fir_chreig_01_desc$"
 building_type_loch_ness_01: "Loch Ness"
 building_type_loch_ness_01_desc: "#F In Glen Mor lies Loch Ness — twenty-four miles long, a mile wide, bottomless (according to many) and bitterly cold.\nFianna from around the Highlands meet at the Loch every summer to feast, revel and hold contests of every kind. Besides the typical Fianna pursuits of music and storytelling competitions, visitors will find mountain climbing contests, foot races, spear throwing and wrestling. The most famous contest is the swim across the Loch, a near impossibility for normal humans and only slightly easier for Garou.#!"
 building_loch_ness_01: "Loch Ness"
 building_loch_ness_01_desc: "$building_type_loch_ness_01_desc$"
 building_type_yr_wyddfa_fawr_01: "Yr Wyddfa Fawr"
 building_type_yr_wyddfa_fawr_01_desc: "#F The second highest peak in the British Isles, Yr Wyddfa Fawr rises above its neighbors in the range, overlooking green valleys and stony blasted plains of northern Gwynedd. Its Welsh name means “the great tomb,” and there are several legends behind the name. Some say a giant sleeps beneath the mountain; others suggest that some of King Arthur’s knights — or even King Arthur himself — rests there. Everyone knows it is a place of power.#!"
 building_yr_wyddfa_fawr_01: "Yr Wyddfa Fawr"
 building_yr_wyddfa_fawr_01_desc: "$building_type_yr_wyddfa_fawr_01_desc$"
 building_type_shrine_st_olwen_01: "The Shrine of St. Olwen"
 building_type_shrine_st_olwen_01_desc: "#F Wales is blessed with an overabundance of saints who may or may not be recognized by Rome. St. Olwen is one of these. A kind and caring young woman, she aided the poor and even took care of helpless or injured animals until her death at the hands of brigands.\nA small stone shrine now stands beside the stream where she died, where the sick and leprous come to drink and bathe in the healing waters. The site is maintained by a nearby abbey, which keeps the saint’s bones in a reliquary.#!"
 building_shrine_st_olwen_01: "The Shrine of St. Olwen"
 building_shrine_st_olwen_01_desc: "$building_type_shrine_st_olwen_01_desc$"
 building_type_silver_tara_01: "Silver Tara"
 building_type_silver_tara_01_desc: "#F Silver Tara, properly called Air-geteamhair, is the palace of the Ard Righ of the Fianna. No place, not even Bru na Boinne, is more sacred to the tribe.\nA powerful caern of Honor, Tara is the place where disputes are settled and honors are given. It’s thought that the original Tara was built several hundred years before the birth of Christ; some claim it was built with the aid of the Tuatha de Danaan.\nThe complex sits atop a hill rising to 200 feet above the surrounding plain, surrounded by seven great earth-and-stone ramparts. Each of the seven gates is faced with silver and hung with the heads of vanquished foes.#!"
 building_silver_tara_01: "Silver Tara"
 building_silver_tara_01_desc: "$building_type_silver_tara_01_desc$"
 building_type_wounded_unicorn_01: "Caern of the Wounded Unicorn"
 building_type_wounded_unicorn_01_desc: "#F Perhaps the most renowned Caern of Healing in the land, the Wounded Unicorn's Children of Gaia caretakers welcome one and all to be soothed both mentally and physically.\nThis doesn't make them weak fools however, as a reckless group of Shadow Lords learned when trying to conquer the area.#!"
 building_wounded_unicorn_01: "Wounded Unicorn"
 building_wounded_unicorn_01_desc: "$building_type_wounded_unicorn_01_desc$"
 building_type_caern_vigilance_01: "Caern of Vigilance"
 building_type_caern_vigilance_01_desc: "#F Founded by the Silent Striders after the Beziers massacre during the Albigensian Crusade, this Caern soon swelled in power with the help of the bitter wraiths killed during the siege who blame vampires and mortals alike for the event.#!"
 building_caern_vigilance_01: "Caern of Vigilance"
 building_caern_vigilance_01_desc: "$building_type_caern_vigilance_01_desc$"
 building_type_blood_fist_01: "Caern of the Blood Fist"
 building_type_blood_fist_01_desc: "#F Founded by the Fenrir after their victory against the Romans long ago, this caern is the center of their power in the Black Forest.\nAll those who enter to bask upon the engraved names of the Fenrir heroes of old must first win a challenge by combat.#!"
 building_blood_fist_01: "Caern of the Blood Fist"
 building_blood_fist_01_desc: "$building_type_blood_fist_01_desc$"
 building_type_caern_sybil_01: "Caern of the Sybil"
 building_type_caern_sybil_01_desc: "#F Once a respected Black Fury caern said to have influence over the Kings of Rome, this was taken from them by the Shadow Lords.\nIts new owners still continue the tradition of having a Theurge Sybil answers questions from visitors, at the cost of a favor owed to the Shadow Lords of course.#!"
 building_caern_sybil_01: "Caern of the Sybil"
 building_caern_sybil_01_desc: "$building_type_caern_sybil_01_desc$"
 building_type_iron_wood_01: "铁木圣地"
 building_type_iron_wood_01_desc: "#F This caern stands where a group a Christian knights tried to disrupt a Pagan ceremony and were slaughtered by the spirits standing guard.\nFenrir now use it as a base to plan counterattacks against the encroachment of the Church on the Baltic.#!"
 building_iron_wood_01: "铁木圣地"
 building_iron_wood_01_desc: "$building_type_iron_wood_01_desc$"
 building_type_white_nights_01: "Caern of the White Nights"
 building_type_white_nights_01_desc: "#F Far beyond most humans settlements, this Red Talon caern has gained prominence for being the site where the prophecies of shadows were revealed.\nIt is also known to be a prized place for the spirit of Helios and visitors often spend long hours basking in his rejuvenating light.#!"
 building_white_nights_01: "Caern of the White Nights"
 building_white_nights_01_desc: "$building_type_white_nights_01_desc$"
 building_type_bygone_visions_01: "Caern of the Bygone Visions"
 building_type_bygone_visions_01_desc: "#F The most powerful (and well defended) caern of the Black Furies is one of the few places where the Wyld is running free.\nOpening new glens of this type has always been a dream of the warrior-women of the island, in the hopes of returning the world to its primal state.#!"
 building_bygone_visions_01: "Caern of the Bygone Visions"
 building_bygone_visions_01_desc: "$building_type_bygone_visions_01_desc$"
 building_type_unshriven_zealot_01: "Caern of the Unshriven Zealot"
 building_type_unshriven_zealot_01_desc: "#F What is now known as Fearn Abbey was the first caern conquered by the Black Spiral Dancers soon after their return from the Wyrm's embrace. It has remained a place that the sane of mind avoid at all costs while the corrupted werewolves use it as their most powerful hive in Scotland.\nNo amount of purification, exorcism or other rituals can save this dreaded land.#!"
 building_unshriven_zealot_01: "Caern of the Unshriven Zealot"
 building_unshriven_zealot_01_desc: "$building_type_unshriven_zealot_01_desc$"