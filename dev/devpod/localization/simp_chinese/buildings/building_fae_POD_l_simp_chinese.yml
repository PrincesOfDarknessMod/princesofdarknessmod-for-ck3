 building_type_land_trod_01: "地之仙路"
 building_type_land_trod_01_desc: "#F 地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。它们可以穿过田园诗般的妖精城镇，也可以经过真的在燃烧的沙漠，或者穿过迷雾和低吟的森林。换生灵可以沿着这些道路步行、骑马或开车；旅行方式只受地形的限制。#!"
 building_land_trod_01: "小型地之仙路"
 building_land_trod_01_desc: "地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。"
 building_land_trod_02: "中型地之仙路"
 building_land_trod_02_desc: "地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。"
 building_land_trod_03: "大型地之仙路"
 building_land_trod_03_desc: "地之仙路可以是任何东西，从宽阔的高速公路到沿着悬崖的窄径。"
 building_type_water_trod_01: "水之仙路"
 building_type_water_trod_01_desc: "#F 这些仙路可能小如山涧，也可能大如汪洋。由于缺乏可识别的地标，在该类型的仙路上旅行的人必须依靠海图和其他导航珍宝来安全地穿越。#!"
 building_water_trod_01: "小型水之仙路"
 building_water_trod_01_desc: "这些仙路可能小如山涧，也可能大如汪洋。"
 building_water_trod_02: "中型水之仙路"
 building_water_trod_02_desc: "这些仙路可能小如山涧，也可能大如汪洋。"
 building_water_trod_03: "大型水之仙路"
 building_water_trod_03_desc: "这些仙路可能小如山涧，也可能大如汪洋。"
 building_type_sun_trod_01: "日之仙路"
 building_type_sun_trod_01_desc: "#F 日之仙路是只在白天开放的天路。只有那些会飞的换生灵（即使是使用气球）才可以穿越这些空灵的公路。日之仙路可能以聚焦的太阳光轴的形式出现，也可能是照着阳光的云层路径。在日之仙路上旅行的换生灵必须提前找到月之仙路，以便在天黑后继续他们的旅行。#!"
 building_sun_trod_01: "小型日之仙路"
 building_sun_trod_01_desc: "日之仙路是只在白天开放的天路。"
 building_sun_trod_02: "中型日之仙路"
 building_sun_trod_02_desc: "日之仙路是只在白天开放的天路。"
 building_sun_trod_03: "大型日之仙路"
 building_sun_trod_03_desc: "日之仙路是只在白天开放的天路。"
 building_type_moon_trod_01: "月之仙路"
 building_type_moon_trod_01_desc: "#F 月之仙路是只在夜间开放的天路。只有那些会飞的换生灵可以穿越这些月光幻影小径。月之仙路可能以在苍白的月光下飞舞的尘埃微粒的形式显现，或者以夜空中的云朵为路面。#!"
 building_moon_trod_01: "小型月之仙路"
 building_moon_trod_01_desc: "月之仙路是只在夜间开放的天路。"
 building_moon_trod_02: "中型月之仙路"
 building_moon_trod_02_desc: "月之仙路是只在夜间开放的天路。"
 building_moon_trod_03: "大型月之仙路"
 building_moon_trod_03_desc: "月之仙路是只在夜间开放的天路。"
 building_type_chimerical_trod_01: "奇魅仙路"
 building_type_chimerical_trod_01_desc: "#F 奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。一些奥秘术艺可以让换生灵进入这些奇异仙路。即使是对最强大的戚族来说，这种道路也是非常危险的。银之径并没有延伸到这等仙路上。#!"
 building_chimerical_trod_01: "小型奇魅仙路"
 building_chimerical_trod_01_desc: "奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。"
 building_chimerical_trod_02: "中型奇魅仙路"
 building_chimerical_trod_02_desc: "奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。"
 building_chimerical_trod_03: "大型奇魅仙路"
 building_chimerical_trod_03_desc: "奇魅仙路对于像妖精这样的物质生物来说太虚无缥缈了，但奇魅在使用这些富含梦华的道路就几乎没有问题。"
 building_type_nightmare_trod_01: "噩梦仙路"
 building_type_nightmare_trod_01_desc: "#F [Glossary('噩梦界域','game_concept_nightmare_realm_desc')]在[UmbraGlossary('deep_dreaming')]中发酵，就像贪得无厌的癌变。黑暗和扭曲的仙路盘旋而过，几乎触及[UmbraGlossary('dreaming')]的每一个部分。邪恶奇魅和更黑暗的生物在这些可怕的道路上游荡。一些哀怒廷利用这些仙路进行秘密任务，但即使对他们来说这些道路也很危险。银之径就存在于这等仙路的某些地方。大多数人相信达南神族在与弗摩尔族的战争中建造了这些道路。#!"
 building_nightmare_trod_01: "小型噩梦仙路"
 building_nightmare_trod_01_desc: "[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]在[UmbraGlossary('deep_dreaming')]中发酵，就像贪得无厌的癌变。"
 building_nightmare_trod_02: "中型噩梦仙路"
 building_nightmare_trod_02_desc: "[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]在[UmbraGlossary('deep_dreaming')]中发酵，就像贪得无厌的癌变。"
 building_nightmare_trod_03: "大型噩梦仙路"
 building_nightmare_trod_03_desc: "[Glossary('噩梦界域','game_concept_nightmare_realm_desc')]在[UmbraGlossary('deep_dreaming')]中发酵，就像贪得无厌的癌变。"
 building_type_wild_portal_01: "狂乱传送门"
 building_type_wild_portal_01_desc: "#F 没人确切地知道这些现象来自哪里，或者它们是如何存在的。喜乐廷妖精认为它们是哀怒廷的作品，而哀怒廷则把它们归咎于喜乐廷。双方都声称，强大的妖精故意制作了这些传送门来引诱和捕捉敌人。还有人推测，这些传送门是[Glossary('大碎溃','game_concept_shattering_desc')]时期的梦界本身的造物……当旧的通道败坏并关闭时，魔法试图维持与凡界的联系的最后挣扎。#!"
 building_wild_portal_01: "小型狂乱传送门"
 building_wild_portal_01_desc: "狂乱传送门是一种不受控制的、未知的[UmbraGlossary('dreaming')]入口。"
 building_wild_portal_02: "中型狂乱传送门"
 building_wild_portal_02_desc: "狂乱传送门是一种不受控制的、未知的[UmbraGlossary('dreaming')]入口。"
 building_wild_portal_03: "大型狂乱传送门"
 building_wild_portal_03_desc: "狂乱传送门是一种不受控制的、未知的[UmbraGlossary('dreaming')]入口。"
 building_type_silvers_gate_01: "银之门"
 building_type_silvers_gate_01_desc: "#F 梦幻岛在水面上闪闪发光，一望无际的翠绿土地缓缓上升，岛中央的圆形山丘将它推向顶峰。山顶上，一座由水晶尖塔和棱柱塔组成的妖精城堡耸立在岛屿的最高点。城堡门前矗立着一对石像，他们都是衣着优雅、长发飘飘的骑士。#!"
 building_silvers_gate_01: "银之门"
 building_silvers_gate_01_desc: "在岛屿的中心，有一扇银之门，它是通往提尔纳诺主心的通道——现在被称为[UmbraGlossary('arcadia')]。"
 building_type_gwyddnos_track_01: "圭德诺的脚步"
 building_type_gwyddnos_track_01_desc: "#F 只有在谣传和传说中才被铭记，通往远古之力的萨恩（威尔士语：仙路）入口就隐藏在波伊斯。#!"
 building_gwyddnos_track_01: "圭德诺的脚步"
 building_gwyddnos_track_01_desc: "该萨恩的最后一次使用是在圭德诺·加兰希尔国王统治时期，它扩展到了科姆里和希伯尼亚的所有郡。"
 building_type_pookas_favor_01: "噗咔之惠"
 building_type_pookas_favor_01_desc: "#F 这条仙路从格温特一直延伸到爱丁堡，控制它的[GetTrait('pooka').GetName(GetNullCharacter)]对从科姆里到苏格兰首府的旅行不收取任何费用。#!"
 building_pookas_favor_01: "噗咔之惠"
 building_pookas_favor_01_desc: "这条仙路从格温特一直延伸到爱丁堡，控制它的[GetTrait('pooka').GetName(GetNullCharacter)]对从科姆里到苏格兰首府的旅行不收取任何费用。\n\n然而，当旅行者试图从苏格兰返回格温特时，来回的车费是昂贵的，至少在面子方面是如此。[GetTrait('pooka').GetName(GetNullCharacter)]对单纯的金钱毫无兴趣；他们更喜欢拍在脸上的馅饼、剃光头或裸体，这取决于他们的心情和旅行者的个性。"
 building_type_pen_mynydd_01: "彭默纳兹"
 building_type_pen_mynydd_01_desc: "#F 从威尔士的斯诺登山通往苏格兰的本尼维斯山，这是一个被苏格兰的[GetTrait('sluagh').GetName(GetNullCharacter)]受嫉地守护着的秘密哀怒廷仙路，这些邪恶的生物将这条仙路称为班杜拉格之蠕动。#!"
 building_pen_mynydd_01: "彭默纳兹"
 building_pen_mynydd_01_desc: "班杜拉格之蠕动是一系列连接苏格兰本尼维斯山的高地、格拉斯哥的下水道以及威尔士斯诺登山的悬崖的仙路。掌控这些仙路的班杜拉格组成了一群哀怒廷[GetTrait('sluagh').GetName(GetNullCharacter)]，他们利用这些通道来隐藏他们的受害者的尸体和交流信息。只有[GetTrait('sluagh').GetName(GetNullCharacter)]才能够挤进这些通道的入口。"
 building_type_cefn_yr_oguf_01: "切夫尼·伊尔·奥戈夫"
 building_type_cefn_yr_oguf_01_desc: "#F 从克鲁伊德流经伦敦桥并延伸至切斯特的这条仙路在克鲁伊德地区备受争议，是一项备受争夺的宝贵资源。#!"
 building_cefn_yr_oguf_01: "切夫尼·伊尔·奥戈夫"
 building_cefn_yr_oguf_01_desc: "从克鲁伊德一路延伸至伦敦桥，再延伸至切斯特的这条仙路，在克鲁伊德地区是一个备受争夺的宝贵资源。"
 building_type_camelot_01: "卡美洛"
 building_type_camelot_01_desc: "#F 卡美洛就是最好的证明。没有多少人记得，亚瑟王的传说最早出现在科姆里，出现在无与伦比的基尔胡赫与奥尔文的故事中，这个故事太长了，在这里就讲不完了。我要说的是，亚瑟王的传说源自威尔士这片土地，不管你现在听到的是黑暗时代的版本，还是科盟编造的宣传。#!"
 building_camelot_01: "废弃的卡美洛"
 building_camelot_01_desc: "真正的传奇、卡美洛的核心，已经在[UmbraGlossary('dreaming')]中茁壮成长。亚瑟传说中的所有景象都存在于那里，并且都是正确的。故事中的人们确实生活在那里，就像你我在这里一样，但他们有很多方面，我们接触到的他们一次只能看到一个方面，就像你可能只能看到钻石众多切面中闪闪发光的一面。"
 building_camelot_02: "复苏的卡美洛"
 building_camelot_02_desc: "真正的传奇、卡美洛的核心，已经在[UmbraGlossary('dreaming')]中茁壮成长。亚瑟传说中的所有景象都存在于那里，并且都是正确的。故事中的人们确实生活在那里，就像你我在这里一样，但他们有很多方面，我们接触到的他们一次只能看到一个方面，就像你可能只能看到钻石众多切面中闪闪发光的一面。"
 building_camelot_03: "凯旋的卡美洛"
 building_camelot_03_desc: "真正的传奇、卡美洛的核心，已经在[UmbraGlossary('dreaming')]中茁壮成长。亚瑟传说中的所有景象都存在于那里，并且都是正确的。故事中的人们确实生活在那里，就像你我在这里一样，但他们有很多方面，我们接触到的他们一次只能看到一个方面，就像你可能只能看到钻石众多切面中闪闪发光的一面。"
 building_type_chaw_gully_mine_01: "渠沟矿井"
 building_type_chaw_gully_mine_01_desc: "#F 早在[Glossary('神话纪元','game_concept_mythic_age_desc')]，当#TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L 诺克#!#!还只是一个年轻的戚系时，他们来到了有朝一日被称为康沃尔和查拉科姆山脊的地方。为了贪图土地下面的锡，但更多的是里面的黄金，他们撕毁了荒地的核心。#!"
 building_chaw_gully_mine_01: "受封矿井"
 building_chaw_gully_mine_01_desc: "传说中，除了该地区的锡之外，还有黄金。而且有……很多的黄金。#TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L 诺克#!#!只暗示了足以维持人们梦想它的数量，但很少允许凡人去寻找它。"
 building_type_balors_tower_01: "巴烙之塔"
 building_type_balors_tower_01_desc: "#F 在托里岛的东部边缘，有一座名为巴烙之塔的岩石岬角，标志着传说中邪眼巴烙的故居。#!"
 building_balors_tower_01: "巴烙之塔"
 building_balors_tower_01_desc: "在托里岛的东部边缘，有一座名为巴烙之塔的岩石岬角，标志着传说中邪眼巴烙的故居。"
 building_type_brides_lodge_01: "新娘小舍"
 building_type_brides_lodge_01_desc: "#F 在格拉斯顿伯里以西的河岸上有一座小山，当地人称之为新娘丘。在新娘丘山脚下，有一座三层楼的外有一小片花园的房子，位于新娘巷19号。#!"
 building_brides_lodge_01: "新娘小舍"
 building_brides_lodge_01_desc: "在格拉斯顿伯里以西的河岸上有一座小山，当地人称之为新娘丘。在新娘丘山脚下，有一座三层楼的外有一小片花园的房子，位于新娘巷19号。\n\n这座房子是整个阿尔比恩最古老的永契堡之一。它由十几间小卧室（大多位于二楼和三楼）、厨房、浴室和位于中央的大会议室组成。尽管多年来这所房子发生了许多变化，但有一样东西始终未变：壁炉。主厅的焦点是一个大石炉，自古以来，阿尔比恩的大烽火就在这里燃烧。"
 building_type_bullring_01: "斗牛场"
 building_type_bullring_01_desc: "#F 斗牛场位于西班牙巴塞罗那，至于它的名字是源于客人们在其上的大胆行为，还是源于他们分享的故事背后的真相，这就见仁见智了。#!"
 building_bullring_01: "斗牛场"
 building_bullring_01_desc: "斗牛场位于西班牙巴塞罗那，至于它的名字是源于客人们在其上的大胆行为，还是源于他们分享的故事背后的真相，这就见仁见智了。\n\n无论如何，这都是一个不错的地方：在凡人眼中，它是一座时尚的大院；在奇魅眼里，它是一座摩尔风格的宏伟古堡。"
 building_type_rock_of_cashel_01: "卡舍尔石堡"
 building_type_rock_of_cashel_01_desc: "#F 这座陡峭的小山高出蒂珀雷里郡平原 200 英尺，被称为卡舍尔岩，既是芒斯特国王的统治地，也是宗教地标。#!"
 building_rock_of_cashel_01: "卡舍尔石堡"
 building_rock_of_cashel_01_desc: "卡舍尔岩高出蒂珀雷里郡平原 200 英尺，陡峭嶙峋，既是芒斯特国王的统治地，也是宗教地标。\n\n通过山脚下的暗门可以进入岩石内部，那里就是卡舍尔石堡。"
 building_type_dun_aenghus_01: "安格斯城堡"
 building_type_dun_aenghus_01_desc: "#F 安格斯城堡曾是被达南神族全族流放到爱尔兰西部的伯格之裔的一位传奇酋长的堡垒，后来成为一片强大的妖精魔法之地。#!"
 building_dun_aenghus_01: "安格斯城堡"
 building_dun_aenghus_01_desc: "安格斯城堡曾是被达南神族全族流放到爱尔兰西部的伯格之裔的一位传奇酋长的堡垒，后来成为一片强大的妖精魔法之地。\n\n在被原住民遗弃后，杜伽尔世家的一位王子发现了三层石圈与大地沉睡魔法的内在联系。这位无名王子用梦华唤起并唤醒了沉睡的力量，并建造了一个巨大的藏宝库，用来存放仙族最珍贵的财产。"
 building_type_glenlea_01: "格莱利"
 building_type_glenlea_01_desc: "#F 格伦科伦基尔不远处，虽然在任何地图上都找不到，有着格莱利妖精乡，这是一个完全由戚族和少数受迷诱的凡人居住的小村庄，这些凡人曾幸运（或不幸运）地与其中一位村民搭上了线，并收到了“抛开尘世烦恼”的邀请。#!"
 building_glenlea_01: "格莱利"
 building_glenlea_01_desc: "格伦科伦基尔不远处，虽然在任何地图上都找不到，有着格莱利妖精乡，这是一个完全由戚族和少数受迷诱的凡人居住的小村庄，这些凡人曾幸运（或不幸运）地与其中一位村民搭上了线，并收到了“抛开尘世烦恼”的邀请。\n\n小镇本身由一条主要街道组成，街道两旁是商店和茅草房，还有几条小巷通往其他住宅。"
 building_type_shalott_01: "夏洛特"
 building_type_shalott_01_desc: "#F 学者们认为，有一处没有存留下来的永契堡是关于夏洛特的故事的基础。#!"
 building_shalott_01: "失落的夏洛特"
 building_shalott_01_desc: "学者们认为，有一处没有存留下来的永契堡是关于夏洛特的故事的基础。\n\n一个被施了魔法的塔，里面的居民被诅咒了，只能通过一幅魔法挂毯上出现的景象来了解凡人的世界。"
 building_type_tuath_of_chronos_01: "时刻神丘"
 building_type_tuath_of_chronos_01_desc: "#F 时刻神丘是一个神秘的地方，据说位于泰河畔的某个妖精土丘中。许多妖精相信，一位强大的时刻术艺预言者和他的妖精妻子设法隐藏了一个[Glossary('大碎溃','game_concept_shattering_desc')]前的遗址，以躲避时间和板讷的摧残。#!"
 building_tuath_of_chronos_01: "时刻神丘"
 building_tuath_of_chronos_01_desc: "如果换生灵在泰河畔漫步时发现了一个山岗，上面有一棵巨大的树，树上长满了许多枝条，每根枝条上都有新的叶芽，那么他们可能来到了时刻之丘。树枝上挂着一只银角，树根下有一口白石井。生活在这棵树上的法师和妖精都在小心翼翼地守护着它的秘密。"
 building_type_pearl_of_dawn_01: "黎明珍珠"
 building_type_pearl_of_dawn_01_desc: "#F 该永契堡包含着一片郁郁葱葱的绿洲，矗立在[UmbraGlossary('dreaming')]中几条主要仙路的交汇处，在部族内部享有盛誉，是许多独特旅程的起点。由于这里的妖精混杂在一起，几乎能保证迟早会有冒险发生。#!"
 building_pearl_of_dawn_01: "黎明珍珠"
 building_pearl_of_dawn_01_desc: "该永契堡包含着一片郁郁葱葱的绿洲，矗立在[UmbraGlossary('dreaming')]中几条主要仙路的交汇处，在部族内部享有盛誉，是许多独特旅程的起点。由于这里的妖精混杂在一起，几乎能保证迟早会有冒险发生。"
 building_type_garden_of_olives_01: "橄榄园"
 building_type_garden_of_olives_01_desc: "#F 橄榄园接待着来自世界各地的换生灵。统治者定期指导并参与经典希腊戏剧的演出。#!"
 building_garden_of_olives_01: "橄榄园"
 building_garden_of_olives_01_desc: "橄榄园接待着来自世界各地的换生灵。统治者定期指导并参与经典希腊戏剧的演出。"
 building_type_eternal_story_01: "永恒的故事"
 building_type_eternal_story_01_desc: "#F 在永恒的故事的附近，位于亚的斯亚贝巴的郊区，统治者掌控着了一支庞大的逸抒、羊人和 #TOOLTIP:GAME_TRAIT,pooka,[GetNullCharacter] #L 噗咔#!#!群体。#!"
 building_eternal_story_01: "永恒的故事"
 building_eternal_story_01_desc: "在永恒的故事的附近，位于亚的斯亚贝巴的郊区，统治者掌控着了一支庞大的逸抒、羊人和 #TOOLTIP:GAME_TRAIT,pooka,[GetNullCharacter] #L 噗咔#!#!群体。"
 building_type_oasis_of_lingering_dreams_01: "留梦绿洲"
 building_type_oasis_of_lingering_dreams_01_desc: "#F 沙特阿拉伯的换生灵将沙漠时尚与贝都因部族的浪漫传说相结合。当前的统治者居住在他们的永契堡，名为留梦绿洲，位于首都利雅得郊外的沙漠中。#!"
 building_oasis_of_lingering_dreams_01: "留梦绿洲"
 building_oasis_of_lingering_dreams_01_desc: "沙特阿拉伯的换生灵将沙漠时尚与贝都因部族的浪漫传说相结合。当前的统治者居住在他们的永契堡，名为留梦绿洲，位于首都利雅得郊外的沙漠中。"
 building_type_grimsfen_tor_01: "格里姆斯芬丘"
 building_type_grimsfen_tor_01_desc: "#F 位于英格兰中部的格里姆斯芬丘是一座特别强大而古老的妖精丘陵。#!"
 building_grimsfen_tor_01: "格里姆斯芬丘"
 building_grimsfen_tor_01_desc: "位于英格兰中部的格里姆斯芬丘是一座特别强大而古老的妖精丘陵。"
 glade_freehold_effect_desc: "若建在首都，每月额外恢复梦华（每一级增加33%的概率）。"
 building_chaw_gully_mine_02: "再开矿井"
 building_chaw_gully_mine_02_desc: "传说中，除了该地区的锡之外，还有黄金。而且有……很多的黄金。#TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L 诺克#!#!只暗示了足以维持人们梦想它的数量，但很少允许凡人去寻找它。"
 building_chaw_gully_mine_03: "深掘矿井"
 building_chaw_gully_mine_03_desc: "传说中，除了该地区的锡之外，还有黄金。而且有……很多的黄金。#TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L 诺克#!#!只暗示了足以维持人们梦想它的数量，但很少允许凡人去寻找它。"
 building_type_emain_macha_01: "艾曼玛查"
 building_type_emain_macha_01_desc: "#F 传说将纳文堡垒称为艾曼玛查（玛查的双子），并将其与奔跑而死的克朗齐鲁之妻的临死诅咒联系在一起。#!"
 building_emain_macha_01: "艾曼玛查"
 building_emain_macha_01_desc: "传说将纳文堡垒称为艾曼玛查（玛查的双子），并将其与奔跑而死的克朗齐鲁之妻的临死诅咒联系在一起。\n这座宫殿美丽异常，其奇特的几何结构和内部深沉而浓烈的颜色，唤起一种充满历史和传说沉重感的忧郁情绪，充溢着潜在的暴力和深刻的炽情。"
 land_trod_effect_desc: "若建在首都，允许在灵游时进入[UmbraGlossary('dreaming')]。"
 building_type_grand_bazaar_01: "大巴扎"
 building_type_grand_bazaar_01_desc: "#F 那些迷失于无尽沙丘或隐匿于荒漠中的人，或许有机会在地平线上看到这片绿洲与帐篷之城，仿佛模糊的海市蜃楼一般。\n\n机会无穷无尽，但这座集市如同一幅华丽的织锦，轻轻覆盖在蛇窝之上。#!"
 building_grand_bazaar_01: "大巴扎"
 building_grand_bazaar_01_desc: "那些迷失于无尽沙丘或隐匿于荒漠中的人，或许有机会在地平线上看到这片绿洲与帐篷之城，仿佛模糊的海市蜃楼一般。\n\n机会无穷无尽，但这座集市如同一幅华丽的织锦，轻轻覆盖在蛇窝之上。"