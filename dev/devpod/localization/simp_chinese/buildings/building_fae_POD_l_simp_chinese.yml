l_simp_chinese:
 GLADE_FREEHOLD_BUILDING_ENABLED: "省份是丛林[terrain|E]、森林[terrain|E]、或针叶林[terrain|E]"
 EYRIE_FREEHOLD_BUILDING_ENABLED: "省份是山地[terrain|E]或沙漠山地[terrain|E]"
 building_type_glade_freehold_01: "秘境"
 building_type_glade_freehold_01_desc: "#F 秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。与大多数永契堡不同，秘境是自然形成的梦华之源。#!"
 building_glade_freehold_01: "小型秘境"
 building_glade_freehold_01_desc: "秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。"
 building_glade_freehold_02: "中型秘境"
 building_glade_freehold_02_desc: "秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。"
 building_glade_freehold_03: "大型秘境"
 building_glade_freehold_03_desc: "秘境是林中幽谷，通常位于森林深处。换生灵们喜欢用秘境来举办他们的许多节日。"
 building_type_hearth_freehold_01: "炉地"
 building_type_hearth_freehold_01_desc: "#F 炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。只要有东西可以交易，所有的换生灵都受到欢迎。#!"
 building_hearth_freehold_01: "小型炉地"
 building_hearth_freehold_01_desc: "炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。"
 building_hearth_freehold_02: "中型炉地"
 building_hearth_freehold_02_desc: "炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。"
 building_hearth_freehold_03: "大型炉地"
 building_hearth_freehold_03_desc: "炉地永契堡是妖精们的客栈、酒吧或咖啡馆，通常有一个后巷入口。"
 building_type_lodge_freehold_01: "门房"
 building_type_lodge_freehold_01_desc: "#F 村舍、房屋和豪宅，统称为门房，都能是永契堡。门房通常是贵胄的据点，他们大部分时间都在那里居住。#!"
 building_lodge_freehold_01: "小型门房"
 building_lodge_freehold_01_desc: "村舍、房屋和豪宅，统称为门房，都能是永契堡。"
 building_lodge_freehold_02: "中型门房"
 building_lodge_freehold_02_desc: "村舍、房屋和豪宅，统称为门房，都能是永契堡。"
 building_lodge_freehold_03: "大型门房"
 building_lodge_freehold_03_desc: "村舍、房屋和豪宅，统称为门房，都能是永契堡。"
 building_type_manor_freehold_01: "庄园"
 building_type_manor_freehold_01_desc: "#F 庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。#!"
 building_manor_freehold_01: "小型庄园"
 building_manor_freehold_01_desc: "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_manor_freehold_02: "中型庄园"
 building_manor_freehold_02_desc: "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_manor_freehold_03: "大型庄园"
 building_manor_freehold_03_desc: "庄园是围绕棚屋或其他建筑物的小型妖精幽谷，通常位于荒野中。"
 building_type_eyrie_freehold_01: "鹰巢"
 building_type_eyrie_freehold_01_desc: "#F 鹰巢是高山上的永契堡，通常是被遗弃者的避难所。#!"
 building_eyrie_freehold_01: "小型鹰巢"
 building_eyrie_freehold_01_desc: "鹰巢是高山上的永契堡，通常是被遗弃者的避难所。"
 building_eyrie_freehold_02: "中型鹰巢"
 building_eyrie_freehold_02_desc: "鹰巢是高山上的永契堡，通常是被遗弃者的避难所。"
 building_eyrie_freehold_03: "大型鹰巢"
 building_eyrie_freehold_03_desc: "鹰巢是高山上的永契堡，通常是被遗弃者的避难所。"
 building_type_grotto_freehold_01: "石窟"
 building_type_grotto_freehold_01_desc: "#F 石窟通常是杂草丛生的秘境或废弃矿井。[GetTrait('sluagh').GetName(GetNullCharacter)]和#TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L 诺克#!#!经常聚集在这样偏僻的永契堡上，不过其他族也经常使用它。#!"
 building_grotto_freehold_01: "小型石窟"
 building_grotto_freehold_01_desc: "石窟通常是杂草丛生的秘境或废弃矿井。"
 building_grotto_freehold_02: "中型石窟"
 building_grotto_freehold_02_desc: "石窟通常是杂草丛生的秘境或废弃矿井。"
 building_grotto_freehold_03: "大型石窟"
 building_grotto_freehold_03_desc: "石窟通常是杂草丛生的秘境或废弃矿井。"
 building_type_faerie_ring_freehold_01: "妖精环"
 building_type_faerie_ring_freehold_01_desc: "#F 妖精环通常是一种位于森林深处的非常小的幽谷。随着荒野的减少，这些自然形成的永契堡越来越稀有。#!"
 building_faerie_ring_freehold_01: "小型妖精环"
 building_faerie_ring_freehold_01_desc: "妖精环通常是一种位于森林深处的非常小的幽谷。"
 building_faerie_ring_freehold_02: "中型妖精环"
 building_faerie_ring_freehold_02_desc: "妖精环通常是一种位于森林深处的非常小的幽谷。"
 building_faerie_ring_freehold_03: "大型妖精环"
 building_faerie_ring_freehold_03_desc: "妖精环通常是一种位于森林深处的非常小的幽谷。"
 building_type_isle_freehold_01: "隐岛"
 building_type_isle_freehold_01_desc: "#F 这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。隐岛是私人的避难所，是最具价值的永契堡之一。#!"
 building_isle_freehold_01: "小型隐岛"
 building_isle_freehold_01_desc: "这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。"
 building_isle_freehold_02: "中型隐岛"
 building_isle_freehold_02_desc: "这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。"
 building_isle_freehold_03: "大型隐岛"
 building_isle_freehold_03_desc: "这些被受施魔法的岛屿很少出现在地图上或被凡人的脚所玷污。"
 building_type_thorpe_freehold_01: "妖精乡"
 building_type_thorpe_freehold_01_desc: "#F 妖精乡即是妖精的村镇。#!"
 building_thorpe_freehold_01: "小型妖精乡"
 building_thorpe_freehold_01_desc: "妖精乡即是妖精的村镇。"
 building_thorpe_freehold_02: "中型妖精乡"
 building_thorpe_freehold_02_desc: "妖精乡即是妖精的村镇。"
 building_thorpe_freehold_03: "大型妖精乡"
 building_thorpe_freehold_03_desc: "妖精乡即是妖精的村镇。"
 building_type_urban_freehold_01: "都市契堡"
 building_type_urban_freehold_01_desc: "#F 只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。这里的板讷是最高的，而未受污染的梦华是稀缺的。这些永契堡处于永冬末日的边缘。#!"
 building_urban_freehold_01: "小型都市契堡"
 building_urban_freehold_01_desc: "只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。"
 building_urban_freehold_02: "中型都市契堡"
 building_urban_freehold_02_desc: "只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。"
 building_urban_freehold_03: "大型都市契堡"
 building_urban_freehold_03_desc: "只有最顽强的戚族敢于生活在黑暗世界的令人窒息的城市中。"
 building_type_market_freehold_01: "市场"
 building_type_market_freehold_01_desc: "#F 妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。这些地方通常与人类市场暗中共享空间，尽管它们大概率完全存在于[UmbraGlossary('dreaming')]中，如[UmbraGlossary('goblin_market')]。有时人类会“意外”地购买到一件妖精制品。这交易对疏忽的人类来说可能是幸运的，也可能是灾难性的。#!"
 building_market_freehold_01: "小型市场"
 building_market_freehold_01_desc: "妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。"
 building_market_freehold_02: "中型市场"
 building_market_freehold_02_desc: "妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。"
 building_market_freehold_03: "大型市场"
 building_market_freehold_03_desc: "妖精市场通常是永契堡，换生灵来到这里购买、出售和交易来自万千异界的奇异珍宝。"
 building_type_homestead_freehold_01: "宅地"
 building_type_homestead_freehold_01_desc: "#F 宅地是完全在[UmbraGlossary('dreaming')]中的永契堡，但没有通往梦梯的入口。它们不具备大多数永契堡的双重性质；它们的主要优点是稳定。戚族建造宅地，以抵御[UmbraGlossary('dreaming')]的严酷考验。宅地的人数不多，但却有强烈的独立性。来自各族的换生灵在近[UmbraGlossary('dreaming')]建立了宅地（甚至是小村庄）。#!"
 building_homestead_freehold_01: "小型宅地"
 building_homestead_freehold_01_desc: "宅地是完全在[UmbraGlossary('dreaming')]中的永契堡，但没有通往梦梯的入口。"
 building_homestead_freehold_02: "中型宅地"
 building_homestead_freehold_02_desc: "宅地是完全在[UmbraGlossary('dreaming')]中的永契堡，但没有通往梦梯的入口。"
 building_homestead_freehold_03: "大型宅地"
 building_homestead_freehold_03_desc: "宅地是完全在[UmbraGlossary('dreaming')]中的永契堡，但没有通往梦梯的入口。"
