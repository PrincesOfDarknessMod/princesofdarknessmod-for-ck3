 building_type_market_01: "Market"
 building_type_market_01_desc: "#flavor Many freeholds wither under the choking weight of Banality in urban environments, but markets thrive where others fail. Almost all markets are located in large towns or cities, and their raths are hidden in back alleys or behind “Employees Only” doors of human businesses. Bustling day and night, markets are where changelings go to buy, sell, and trade chimerical items and employment opportunities.#!"
