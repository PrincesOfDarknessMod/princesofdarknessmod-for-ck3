 building_type_workshop_01: "Workshop"
 building_type_workshop_01_desc: "#flavor Workshops are freeholds with an almost completely physical presence, and only a footprint in the Dreaming. They may be owned by nobles, but almost all of them are staffed and run by commoners (usually nockers or boggans). Workshops are where chimerical steel is forged, voile sewn, and ale brewed. Glamour is rarely harvested for personal use, but is instead used in the creation of Treasures and other faerie goods.#!"
