 building_type_rome_colosseum_01: "罗马竞技场"
 building_type_rome_colosseum_01_desc: "有史以来最大的圆形剧场。尽管岁月侵蚀，地震损坏，石材被拿去用于其他建筑项目，但它仍然矗立着，就像古代一样雄伟。"
 building_rome_colosseum_01: "罗马竞技场"
 building_rome_colosseum_01_desc: "$building_type_rome_colosseum_01_desc$\n\n显赫的统治者可以复原它的原初用途。\n\n#X 如果你想升级它，你必须是[GetTrait('august').GetName(GetNullCharacter)]或雇用一位具有极佳[aptitude|E]的[GetCourtPositionType('seneschal_court_position').GetName()]。#!"
 building_rome_colosseum_02: "复原的罗马竞技场"
 building_rome_colosseum_02_desc: "在白天，这座宏伟的圆形剧场为凡人举办舞台剧、音乐会，和其他的娱乐活动。在夜晚……不光彩的活动开始了。"
 building_type_rome_hadrianstomb_01: "哈德良的陵墓"
 building_type_rome_hadrianstomb_01_desc: "这座圆柱形坟墓是整个城市最高的建筑。曾经存放过许多罗马皇帝的骨灰坛，直到西哥特掠夺者洗劫罗马时失散。"
 building_rome_hadrianstomb_01: "哈德良的陵墓"
 building_rome_hadrianstomb_01_desc: "$building_type_rome_hadrianstomb_01_desc$\n\n聪颖的统治者能强化其防御并改造成宝库。\n\n#X 如果你想升级它，你必须是[GetTrait('scholar').GetName(GetNullCharacter)]或雇用一位具有极佳[aptitude|E]的[GetCourtPositionType('antiquarian_court_position').GetName()]。#!"
 building_rome_hadrianstomb_02: "圣天使城堡"
 building_rome_hadrianstomb_02_desc: "此古代陵墓已经改造成安全的堡垒。坐落在城市中间，也许没有太多军事价值，但却是储藏贵重物品的宝地。"
 building_type_rome_aqueduct_01: "水道桥"
 building_type_rome_aqueduct_01_desc: "最后一座仍在运作的古罗马水道桥。在巅峰时期，每天可为口渴的市民提供一亿升水……或是供给想要享受奢华沐浴的皇帝们。"
 building_rome_aqueduct_01: "维尔戈水道"
 building_rome_aqueduct_01_desc: "$building_type_rome_aqueduct_01_desc$\n\n精于工程学的统治者可以翻新它来改善城市的生活水准。\n\n#X 如果你想升级它，你必须是[GetTrait('architect').GetName(GetNullCharacter)]或雇用一位具有极佳[aptitude|E]的[GetCourtPositionType('royal_architect_court_position').GetName()]。#!"
 building_rome_aqueduct_02: "维尔戈水道"
 building_rome_aqueduct_02_desc: "这座古老的水道桥使用最先进的工程技术进行了扩建和改造。提供罗马最纯净的饮用水，可以看到许多人带容器来装饮用和烹饪用水。"
 building_type_rome_pasquino_01: "谈话雕像"
 building_type_rome_pasquino_01_desc: "最近出土的某个希腊英雄雕像。罗马市民将其用作布告栏，在底座上张贴匿名批评和讽刺诗歌，假装雕像正在对他们说话。\n\n有人说这座雕像很像墨涅拉俄斯，但听起来像是无稽之谈。"
 building_rome_pasquino_01: "帕斯魁诺"
 building_rome_pasquino_01_desc: "最近出土的某个希腊英雄雕像。罗马市民将其用作布告栏，在底座上张贴匿名批评和讽刺诗歌，假装雕像正在对他们说话。\n\n狡猾的统治者可以使用它影响大众好感。\n\n#X 如果你想升级它，你必须是[GetTrait('schemer').GetName(GetNullCharacter)]或是在[council|E]有一位至少20[intrigue|E]的[spymaster|E]。#!"
 building_rome_pasquino_02: "雄辩的帕斯魁诺"
 building_rome_pasquino_02_desc: "在这座雕像上发布匿名信息的市民认为他们是在批评这座城市的统治者。事实上，他们只是说#italic 统治者想让#!他们说的。"
 building_type_rome_tiber_01: "$building_rome_tiber_01$"
 building_type_rome_tiber_01_desc: "$building_rome_tiber_01_desc$"
 building_rome_tiber_01: "台伯河"
 building_rome_tiber_01_desc: "文明已经束缚了这个地区。所剩无几的自然目前正被城市居民驯化。\n\n然而，一些有进取心的狼族成功地对这座大都市发动了夜间袭击，带回了武器和其他物资。"
 POD_rome_colosseum_bonus: "[Select_CString(IsInGame,GuiScope.Custom('POD_colosseum_loc'),GuiScope.Custom('POD_colosseum_loc_null'))]"
 POD_rome_hadrianstomb_bonus: "#P 此建筑的拥有者可以购买[artifact_claims|E]，且花费会更低。#!"
 POD_rome_aqueduct_bonus: "#P 此建筑的拥有者可以使用[diligent_development_focus_decision|E]，如果罗马是首都。#!"
 POD_rome_pasquino_bonus: "#P 该建筑的拥有者可以使用#V 宣传#![character_interaction|E]来移除一个罪犯特质。#!"
 building_type_constantinople_plundered_constantinople_01: "掠夺君士坦丁堡"
 building_type_constantinople_plundered_constantinople_01_desc: "世界渴望之城，被人类最卑劣的欲望毁灭。"
 building_constantinople_plundered_constantinople_01: "被掠夺的君士坦丁堡"
 building_constantinople_plundered_constantinople_01_desc: "曾经辉煌的罗马人的首都，如今被那些声称遵循来自罗马的旨意之人所玷污。"
 building_constantinople_plundered_constantinople_02: "被洗劫的君士坦丁堡"
 building_constantinople_plundered_constantinople_02_desc: "在威尼斯，富人们为自己的好运而饮酒。在君士坦丁堡，衰败的城市残骸则成就了这些好运。"
 building_constantinople_plundered_constantinople_03: "被洗劫一空的君士坦丁堡"
 building_constantinople_plundered_constantinople_03_desc: "1204年是一个梦想的终结，但至少它确实让一些人变得富有。"
 building_type_constantinople_plundered_great_palace_01: "大皇宫"
 building_type_constantinople_plundered_great_palace_01_desc: "君士坦丁堡的大皇宫，也被称为圣宫，是位于半岛东南端最大的拜占庭皇宫建筑群。它是东罗马皇帝的主要居住场所，直到1081年起成为皇帝处理帝国政事的重要中心。\n如今，它已经成为一片废墟，拉丁人掠夺者在大肆吞噬残余的财富。"
 building_constantinople_plundered_great_palace_01: "被征服的大皇宫"
