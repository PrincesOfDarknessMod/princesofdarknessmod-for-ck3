 building_type_constantinople_plundered_monastery_of_st_myrelaion_01: "圣米瑞拉修道院"
 building_type_constantinople_plundered_monastery_of_st_myrelaion_01_desc: "米瑞拉修道院建立在一个公元五世纪风格的巨大圆形穹顶之上，后来被改建为修女院。这座建筑是第一个拜占庭皇帝私人墓地教堂，但在第四次十字军东征期间遭遇火灾，自此被遗弃。\n作为富有的皇帝的墓地，它成为了君士坦丁堡最贪婪的征服者们的热门抢劫地点。"
