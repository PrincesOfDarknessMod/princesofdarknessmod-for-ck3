 building_type_constantinople_reform_hagia_sophia_01: "圣索菲亚大教堂"
 building_type_constantinople_reform_hagia_sophia_01_desc: "作为东正教会近千年的宗教和属灵的中心，这座教堂被献给了神圣智慧。它有着世界上最大的室内空间，并且是最早采用完全悬挂穹顶的建筑之一，被认为是拜占庭建筑的典范。\n由君士坦丁堡的新统治者重建的圣索非亚大教堂现在虽然大为不同，但仍然是一个受人喜爱且颇具声誉的礼拜场所。"
