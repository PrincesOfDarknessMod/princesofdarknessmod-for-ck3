 building_type_constantinople_rebuild_the_hippodrome_01: "大竞技场"
 building_type_constantinople_rebuild_the_hippodrome_01_desc: "大竞技场是君士坦丁堡的体育和社交中心，以举办赛马和战车竞赛而闻名。\n恢复这个地方并重新开始竞赛将会使民众感到振奋（尽管这可能也会导致骚动的支持者的回归）。"
