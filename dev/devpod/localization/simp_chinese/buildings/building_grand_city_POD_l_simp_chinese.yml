 building_type_constantinople_rebuild_the_great_bazar_01: "大巴扎"
 building_type_constantinople_rebuild_the_great_bazar_01_desc: "尽管君士坦丁堡的城墙后满目破败和废墟，但没有什么能扑灭大巴扎那不熄的火花。大巴扎是商业中心，拉丁人和希腊人、东方和西方、凡人和该隐之子，尽皆汇聚于此，成就一幅辉煌的城市交响画。由于长达几个世纪的吸血鬼的影响，这个市场从未沉寂。\n生意从未真正停歇，商人们也迅速适应了君士坦丁堡真正主人的回归。"
