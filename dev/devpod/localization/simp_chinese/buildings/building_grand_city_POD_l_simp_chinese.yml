 building_type_baghdad_sinful_baghdad_01: "巴比伦，人间地狱"
 building_type_baghdad_sinful_baghdad_01_desc: "美索不达米亚的术士通过向冥界求宠来追求奢华与权力。在地狱存在于人类想象之前，巴比伦就力图成为人间地狱。"
 building_baghdad_sinful_baghdad_01: "巴比伦，罪恶之忆"
 building_baghdad_sinful_baghdad_01_desc: "公元前五世纪，希罗多德游历地中海世界。关于巴比伦，他写下了一份毁灭性的恐怖记述。当然，其中内容与事实大相径庭。\n\n他所错过的真相，远比那更糟。"
 building_baghdad_sinful_baghdad_02: "巴比伦，罪恶之城"
 building_baghdad_sinful_baghdad_02_desc: "随之而来的是熵之仆从，那些侍奉原初毁灭之灵的存在；地狱恶魔，显然是某个地狱的仆从，那个地狱要么深藏在影界之中，要么位于空间的某处裂隙之中；以及本不应存在之物，外部黑暗、虚空的居民，那些难以言喻、喃喃低语的造物，它们渴望进入这个宇宙。\n\n这三者共同占据了巴比伦。"
 building_baghdad_sinful_baghdad_03: "巴比伦，人间地狱"
 building_baghdad_sinful_baghdad_03_desc: "那是一个丧失灵魂的光辉时代。来自虚空的存在，以及很快随之而来的冥府恶魔和其他恶魔，都在城中畅行无阻。它们惊扰孩童的睡眠，在君王耳畔低语。"
 building_type_baghdad_sinful_palace_of_etemenanki_01: "埃特曼南基宫殿"
 building_type_baghdad_sinful_palace_of_etemenanki_01_desc: "在旧巴比伦的西墙附近，矗立着一座七层塔庙，名为“埃特曼南基”，意为“天地之基”。"
 building_baghdad_sinful_palace_of_etemenanki_01: "阿努纳库"
 building_baghdad_sinful_palace_of_etemenanki_01_desc: "在创世之前，阿努纳库便已存在。元神们曾以终将化为实相的魔素进行实验。但有些古老的神祇将自己困在了织锦丝线的缠结之中。这些被困的神祇化为了虚空，而群星便是它们的囚笼。"
 building_baghdad_sinful_palace_of_etemenanki_02: "虚空之力"
 building_baghdad_sinful_palace_of_etemenanki_02_desc: "但即便在最初的时代，人类也知晓无名诸神的名讳。人们在夜晚仰望星空，向天际低语，祈求力量。他们的祈祷得到了回应。"
 building_baghdad_sinful_palace_of_etemenanki_03: "埃特曼南基结社崛起"
 building_baghdad_sinful_palace_of_etemenanki_03_desc: "了尼布甲尼撒的时代，巴比伦将近半数的官员和祭司都加入了那个黑暗社团。有影响力的虚空追随者确保了马尔杜克的伊恩，即便他自己并非阴谋的一分子，也对埃特曼南基顶端马尔杜克神庙中每夜举行的仪式视而不见。"
 building_baghdad_sinful_palace_of_etemenanki_04: "不洁祭司"
 building_baghdad_sinful_palace_of_etemenanki_04_desc: "密谋者从他们当中选出一位祭司，称为贝尔，以此嘲弄马杜克。遴选过程历经数百年有所变化，但在尼布甲尼撒时代，这是一场召唤最强大恶魔的竞赛。"
 building_baghdad_sinful_palace_of_etemenanki_05: "埃特曼南基：第一座迷宫"
 building_baghdad_sinful_palace_of_etemenanki_05_desc: "埃特曼南基在一位又一位贝尔的指引下，成为最早的“迷宫”，其历史甚至早于这个词本身的使用。占星术士们从俯瞰全城的高台上观测天象，实现主上的愿望。"
 building_type_baghdad_sinful_hanging_gardens_01: "空中花园"
 building_type_baghdad_sinful_hanging_gardens_01_desc: "古巴比伦最著名的遗迹，正等待着一位值得的征服者将其发掘并据为己有，他会欣赏其超凡脱俗之美。"
 building_baghdad_sinful_hanging_gardens_01: "寻常花园"
 building_baghdad_sinful_hanging_gardens_01_desc: "人类奇观仍处于惨淡状态。不过，修复与重建工作已经开始，或许有朝一日能重现昔日的辉煌。"
 building_baghdad_sinful_hanging_gardens_02: "大花园"
 building_baghdad_sinful_hanging_gardens_02_desc: "$building_baghdad_sinful_hanging_gardens_01_desc$"
 building_baghdad_sinful_hanging_gardens_03: "悬吊花园"
 building_baghdad_sinful_hanging_gardens_03_desc: "这座宏伟的花园尚非古巴比伦的那座，但其繁多的品类与华美气象，足以让任何人再三斟酌，不敢说你在撒谎。"
 building_baghdad_sinful_hanging_gardens_04: "空中花园"
 building_baghdad_sinful_hanging_gardens_04_desc: "终于！即便是辉煌往昔的那些恶魔，也会因你重建尼布甲尼撒二世奇观的伟业，而承认你的威望与力量。"
 building_baghdad_sinful_hanging_gardens_05: "飞行花园"
 building_baghdad_sinful_hanging_gardens_05_desc: "悬吊花园？太俗气了，你的花园会飞！让所有来到你城市的人都来参观，并为你的力量而惊叹。毕竟，这是迈向崇拜的第一步。"
 building_type_baghdad_sinful_gate_of_ishtar_01: "伊什塔尔之门"
 building_type_baghdad_sinful_gate_of_ishtar_01_desc: "“巴比伦”之名意为“神之门”，但穿过此门的，却绝非神圣之物。"
 building_baghdad_sinful_gate_of_ishtar_01: "地狱十字路口"
 building_baghdad_sinful_gate_of_ishtar_01_desc: "尽管神秘的东方与异教欧洲的闹鬼森林自史前时代便已知晓恶魔的存在，巴比伦城却是地狱实体的交汇之地。"
 building_baghdad_sinful_gate_of_ishtar_02: "熵之门"
 building_baghdad_sinful_gate_of_ishtar_02_desc: "熵之仆役，来自外层虚空的星辰束缚之物，以及深坑中的住民，皆巢居于第一座伟大城市的城墙之内。"
 building_baghdad_sinful_gate_of_ishtar_03: "召唤术发源地"
 building_baghdad_sinful_gate_of_ishtar_03_desc: "尽管与恶魔交易及束缚诸灵如今已是灭世者与其他卖魂者的惯常行径，但巴比伦才是召唤技艺的发源地"
 building_baghdad_sinful_gate_of_ishtar_04: "怨恨与渎神之城"
 building_baghdad_sinful_gate_of_ishtar_04_desc: "巴比伦群魔乱舞。从汉谟拉比时代到塞琉古治下城市衰落之前，埃特曼南基的密谋者们将恶毒与亵渎迎入城中。"
 building_baghdad_sinful_gate_of_ishtar_05: "恶魔化伊什塔尔之门"
 building_baghdad_sinful_gate_of_ishtar_05_desc: "归根结底，一座城市是由其恶魔所定义的。"
 building_type_baghdad_sinful_tower_of_babel_01: "巴别塔"
 building_type_baghdad_sinful_tower_of_babel_01_desc: "来吧，我们要建造一座城和一座塔，塔顶通天，为要传扬我们的名，免得我们分散在全地上。"
 building_baghdad_sinful_tower_of_babel_01: "发掘高塔"
 building_baghdad_sinful_tower_of_babel_01_desc: "那时，天下人的口音言语都是一样。他们往东边迁移的时候，在示拿地遇见一片平原，就住在那里。"
 building_baghdad_sinful_tower_of_babel_02: "高塔废墟"
 building_baghdad_sinful_tower_of_babel_02_desc: "他们彼此商量说，来吧，我们要作砖，把砖烧透。他们就拿砖当石头，又拿石漆当灰泥。"
 building_baghdad_sinful_tower_of_babel_03: "修复高塔"
 building_baghdad_sinful_tower_of_babel_03_desc: "他们说，来吧，我们要建造一座城和一座塔，塔顶通天，为要传扬我们的名，免得我们分散在全地上。"
 building_baghdad_sinful_tower_of_babel_04: "重建高塔"
 building_baghdad_sinful_tower_of_babel_04_desc: "耶和华降临，要看看世人所建造的城和塔。耶和华说，看哪，他们成为一样的人民，都是一样的言语，如今既作起这事来，以后他们所要作的事就没有不成就的了。"
 building_baghdad_sinful_tower_of_babel_05: "巴别塔：对神的冒犯"
 building_baghdad_sinful_tower_of_babel_05_desc: "所以那城名叫巴别，因为耶和华在那里变乱天下人的言语，使众人分散在全地上。"
 building_type_baghdad_sinful_tomb_of_nergal_01: "受诅咒之墓"
 building_type_baghdad_sinful_tomb_of_nergal_01_desc: "一座近期被发掘的神庙成了怪事频发之地。有人说那是一座坟墓，被某位被遗忘的神祇所诅咒。若非被迫，无人敢于靠近。"
 building_baghdad_sinful_tomb_of_nergal_01: "开启陵墓"
 building_baghdad_sinful_tomb_of_nergal_01_desc: "当你深入陵墓时，现实闪烁不定、逐渐磨损，唯有真正无比强大的存在才能造成如此景象。而如此强大的存在，绝不像表面看起来那样死寂……"
 building_baghdad_sinful_tomb_of_nergal_02: "清理瓦砾"
 building_baghdad_sinful_tomb_of_nergal_02_desc: "$building_baghdad_sinful_tomb_of_nergal_01_desc$"
 building_baghdad_sinful_tomb_of_nergal_03: "识别该造物"
 building_baghdad_sinful_tomb_of_nergal_03_desc: "你找到了石棺及其上的铭文，对于你所发现之物……你所发现之人，已毋庸置疑。"
 building_baghdad_sinful_tomb_of_nergal_04: "开启石棺"
 building_baghdad_sinful_tomb_of_nergal_04_desc: "$building_baghdad_sinful_tomb_of_nergal_03_desc$"
 building_baghdad_sinful_tomb_of_nergal_05: "敞开的陵墓"
 building_baghdad_sinful_tomb_of_nergal_05_desc: "石棺空空如也，其主人早已离去，但无人需要知晓此事，因为他们的恐惧是一件强大的武器，足以迫使他们就范。"
 building_type_baghdad_sinful_temples_of_the_gods_01: "魔王神殿"
 building_type_baghdad_sinful_temples_of_the_gods_01_desc: "巴比伦首次陷落，是在马杜克战胜那座地狱之城之时。但希腊与罗马文明的崩溃迎来了一个新的时代：魔王时代。"
 building_baghdad_sinful_temples_of_the_gods_01: "被遗忘的神殿"
 building_baghdad_sinful_temples_of_the_gods_01_desc: "神殿再度崛起。黑石再度被恶魔之手吊装就位，成群的受害者剥皮刀下惨嚎不绝。"
 building_baghdad_sinful_temples_of_the_gods_02: "重启祭仪"
 building_baghdad_sinful_temples_of_the_gods_02_desc: "$building_baghdad_sinful_temples_of_the_gods_01_desc$"
 building_baghdad_sinful_temples_of_the_gods_03: "重建神殿"
 building_baghdad_sinful_temples_of_the_gods_03_desc: "一连串强大的巫师祭司复兴了巴比伦和乌尔的荣光，建造了规模虽小却奢华颓靡的城市。"
 building_baghdad_sinful_temples_of_the_gods_04: "重掌霸权"
 building_baghdad_sinful_temples_of_the_gods_04_desc: "近六百年来，守门者及其盟友尽享秘法统治的果实。"
 building_baghdad_sinful_temples_of_the_gods_05: "魔王遗物"
 building_baghdad_sinful_temples_of_the_gods_05_desc: "当伊斯兰军队最终终结他们的复辟之时，魔王们已在城市下方凿刻出精雕细琢的神殿、图书馆与地下墓穴。即便得胜的军队也无法尽数发掘。"
 building_type_baghdad_sinful_desecrated_second_temple_01: "巴特残迹"
 building_type_baghdad_sinful_desecrated_second_temple_01_desc: "这座恶魔盘踞的城市为古巴比伦投下了恐怖的阴影。它的最终败亡留下了许多地狱遗物，于今日或许仍有用途。"
 building_baghdad_sinful_desecrated_second_temple_01: "活城残迹"
 building_baghdad_sinful_desecrated_second_temple_01_desc: "留存至今的少量记载称，内尔伽勒与埃列什基伽勒的恶魔仆从在一夜之间将其建起。在巨大的黑色大理石城墙之内，尖刺植物与扭曲的林木被塑造成一座怪异的活体城市。"
 building_baghdad_sinful_desecrated_second_temple_02: "鲜血残迹"
 building_baghdad_sinful_desecrated_second_temple_02_desc: "白天，居民们沉睡，或从以人血浇灌的树上采摘芬芳的果实；夜晚，市民们举行狂野的纵欲狂欢，或对邻近城邦发起劫掠。"
 building_baghdad_sinful_desecrated_second_temple_03: "巴比伦败亡残迹"
 building_baghdad_sinful_desecrated_second_temple_03_desc: "在恶魔仆从与恐怖战争机器的协助下（这些机器由构成城市本身的同一种木材制成），巴托里教徒多次攻破巴比伦的城墙，掳走俘虏用于献祭。"
 building_baghdad_sinful_desecrated_second_temple_04: "萨姆西-阿达德王胜利的遗迹"
 building_baghdad_sinful_desecrated_second_temple_04_desc: "最终，邻国发起了反击；在一场代价高昂的战役之后，亚述国王萨姆希-阿达德率领一支庞大的联军对抗巴托尔人。按照那个时代的习俗，巴特城中的男女老幼全被屠杀殆尽。"
 building_baghdad_sinful_desecrated_second_temple_05: "战利品的残余"
 building_baghdad_sinful_desecrated_second_temple_05_desc: "据说，巴比伦时代的许多魔典都是写在巴托莱特皮卷上的；相传，整个界域的巫师们不惜重金求购这些战利品，认为它们在城邦陷落3000多年后仍蕴藏着秘法之力。"
 building_type_baghdad_sinful_prideful_statue: "巴比伦的耶洗别"
 building_type_baghdad_sinful_prideful_statue_desc: "这座雕像纪念的是这位夏娃之女（或莉莉丝），她为了尘世炽情而忘了基督徒的贞洁。如同巴比伦淫妇，她身着华服，常使无辜之人受折磨并被杀害。"
 building_baghdad_sinful_prideful_statue: "巴比伦的耶洗别"
 building_baghdad_sinful_prideful_statue_desc: "$building_type_baghdad_sinful_prideful_statue_desc$"
 building_type_baghdad_sinful_enforced_rest_times: "建立在泪水之上的城市"
 building_type_baghdad_sinful_enforced_rest_times_desc: "当奴隶们死去并被新奴隶替代时，恶魔正以他们亲自培育的统治阶级的冷酷与怠惰为食。"
 building_baghdad_sinful_enforced_rest_times: "建立在泪水之上的城市"
 building_baghdad_sinful_enforced_rest_times_desc: "$building_type_baghdad_sinful_enforced_rest_times_desc$"
 building_type_baghdad_sinful_pleasure_houses: "神圣婚姻"
 building_type_baghdad_sinful_pleasure_houses_desc: "地狱阴谋的祭司们用一场名为“圣婚”的仪式激活了他们的门径。他们削弱了险棘，让马尔杜克的神庙背离其神圣用途。那些通常对诸神崇敬仰望的雕像，如今闭上了双眼。一座台脚雕成兽形的祭坛，在内殿中央显现出来。"
 building_baghdad_sinful_pleasure_houses: "神圣婚姻"
 building_baghdad_sinful_pleasure_houses_desc: "共谋者们带着他们的妻子、女儿和女奴登上塔庙的台阶。“伊南娜”等待着贝尔的恩宠。数小时的吟唱与交合——贝尔站立着，伊南娜伏于祭坛之上——其强度给予了虚空在巴比伦显形的力量。"
 building_type_baghdad_sinful_feast_halls: "梅尔沙库什图·库尔杜"
 building_type_baghdad_sinful_feast_halls_desc: "“胜利的马尔杜克”仪式在每年年初举行，神殿祭司宣布一段复兴时期，伴随着宴饮、歌唱、陪伴及其他庆祝活动……"
 building_baghdad_sinful_feast_halls: "梅尔沙库什图·库尔杜"
 building_baghdad_sinful_feast_halls_desc: "$building_type_baghdad_sinful_feast_halls_desc$"
 building_type_baghdad_sinful_spy_passages: "哀悼搭模斯"
 building_type_baghdad_sinful_spy_passages_desc: "每年播种季节伊始，苏美尔各城邦都会重演搭模斯重返冥界的仪式。每座城市都会选出最受爱戴的年轻男子，将其活埋。全体民众着黑衣八日，而伊什塔尔神庙的祭司与女祭司则身着黑衣整整一个月，为这位神明象征性的死亡哀悼。"
 building_baghdad_sinful_spy_passages: "哀悼搭模斯"
 building_baghdad_sinful_spy_passages_desc: "$building_type_baghdad_sinful_spy_passages_desc$"
 building_type_baghdad_sinful_gold_hoard: "黄金与硫磺"
 building_type_baghdad_sinful_gold_hoard_desc: "巴比伦是一座被诅咒的城市。但即便如此，它仍然是一座富庶的被诅咒之城。与恶魔的讨价还价带来了许多迷失的灵魂，但也造就了少数强大的赢家。"
 building_baghdad_sinful_gold_hoard: "黄金与硫磺"
 building_baghdad_sinful_gold_hoard_desc: "$building_type_baghdad_sinful_gold_hoard_desc$"
 building_type_baghdad_sinful_fighting_pits: "安祖深坑"
 building_type_baghdad_sinful_fighting_pits_desc: "安祖是一只巨大的狮首鸟，出现在吉尔伽美什的传说中。它在胡卢帕树上筑巢，显然与一条巨蛇和莉莉丝本人共同生活。"
 building_baghdad_sinful_fighting_pits: "安祖深坑"
 building_baghdad_sinful_fighting_pits_desc: "$building_type_baghdad_sinful_fighting_pits_desc$"
 building_type_baghdad_jewel_of_allah_baghdad_01: "巴格达：千清真寺之城"
 building_type_baghdad_jewel_of_allah_baghdad_01_desc: "伊斯兰黄金时代的明珠虽已黯淡，但其声誉犹存。许多事物尚可重建与复兴。"
 building_baghdad_jewel_of_allah_baghdad_01: "巴格达：唯有独一清真寺之城"
 building_baghdad_jewel_of_allah_baghdad_01_desc: "在阿拔斯王朝时期，它曾是伊斯兰的明珠，但如今已非如此；然而，或许凭借决心与努力，它能够再次焕发光彩。"
 building_baghdad_jewel_of_allah_baghdad_02: "巴格达：十二清真寺之城"
 building_baghdad_jewel_of_allah_baghdad_02_desc: "康复之路漫长，但大部分已经走过，离重回巅峰仅剩几步之遥。"
 building_baghdad_jewel_of_allah_baghdad_03: "巴格达：千清真寺之城"
 building_baghdad_jewel_of_allah_baghdad_03_desc: "伊斯兰的瑰宝，其重要性堪比麦加和麦地那，永不被玷污！"
 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "阿拔斯宫殿"
 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "阿拔斯王朝的宫殿，从这里他们统治着从科尔多瓦直至中国的疆域，其记忆是值得骄傲的，可为巴格达的荣耀所利用。"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "接管皇宫"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "一连串无能的统治者和冷漠的征服者使宫廷陷入混乱。是时候整顿局面了。"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02: "清除所有觊觎者"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02_desc: "$building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc$"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03: "控制禁卫军"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03_desc: "你已显露威仪术，其效应将随之而来。"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04: "控制贵族"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04_desc: "权势之人需要明智的谏言。唯有你能提供此助。"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05: "影响哈里发"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05_desc: "在此处，精神与世俗之事交织。尽管所展示的信仰可能起到威慑作用，你的效应依然在增长。"
 building_type_baghdad_jewel_of_allah_house_of_wisdom_01: "智慧宫"
 building_type_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "智慧宫，又称巴格达大图书馆，是阿拔斯时代巴格达的一所重要公共学院与知识中心，在伊斯兰黄金时代作为世界上最大的公共图书馆之一而闻名。"
 building_baghdad_jewel_of_allah_house_of_wisdom_01: "无知的民众"
 building_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "你的权势在这些学者面前不值一提，他们太过沉迷于书籍，无暇顾及世界其余部分。你不得不让他们学会倾听你的声音。"
 building_baghdad_jewel_of_allah_house_of_wisdom_02: "无知的导师"
 building_baghdad_jewel_of_allah_house_of_wisdom_02_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_01_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_03: "受控研究"
 building_baghdad_jewel_of_allah_house_of_wisdom_03_desc: "赠予与谏言，在恰当的耳边低语，使你成为智慧宫内部政治中最重要的人物，但并非唯一一人。"
 building_baghdad_jewel_of_allah_house_of_wisdom_04: "受控智慧"
 building_baghdad_jewel_of_allah_house_of_wisdom_04_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_03_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_05: "智慧之家"
 building_baghdad_jewel_of_allah_house_of_wisdom_05_desc: "在那里可以学到引人入胜的知识，许多人希望那座神秘宅邸的大师能赐予他们进入的机会。"
 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "阿布·哈尼法清真寺"
 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "城中最大的清真寺是学问、虔诚，更重要的是，影响力的中心。"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "执意伊玛目"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "城市中最宏伟的清真寺不会因为你三言两语就低头。信仰是个障碍，但并非无法逾越。"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02: "聋鸦群"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03: "专注的圣训"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc: "他们遵循你的话语，倾听你的声音，服从你的命令，只是他们自己尚未意识到这一点。"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04: "受控学者"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05: "影响访客"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05_desc: "所有经过此地的人，最终都会成为你计划的一部分。无论其是否知晓。"
 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "穆斯坦西里耶大学"
 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "伊斯兰世界的第一所大学，由阿拔斯王朝哈里发穆斯坦绥尔建立。"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "申请加入"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "看来他们并非来者不拒。你得在这里提升你的效应……或者通过一项考验。"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02: "第二次尝试"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02_desc: "$building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc$"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03: "终于进来了"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03_desc: "他们三次都无法阻止你，现在这所大学的所有知识都归你调遣了！只等你抽空去研读一番。"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04: "学习如何去学习"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04_desc: "这里没有什么惊天大秘密，但伊斯兰最伟大城市的集体智慧，依然是值得珍视的宝藏。"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05: "无尽道途"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05_desc: "重点不在于知道多少，而在于学习，并享受这一过程。这里不是炫耀已有成就的地方，而是属于那些乐于给自己的知识之塔添砖加瓦的人，他们明白总有更多值得学习，并为此感到欣喜。"
 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "米尔贾尼耶经学院与米尔詹汗建筑群"
 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "一个学习中心与客栈巧妙结合，使两者互不喧宾夺主。"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "控制学者"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "接手将会很困难，你需要同时在两线行动，这样任何一方都无法干预。"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02: "控制商人"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03: "敲诈旅人"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc: "你尚未拥有完全的控制权。但已经足够了，可以抬高价格，确保学生们不会误入那些他们最好不知晓的事情之中。"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04: "对学生们撒谎"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05: "勒索财富与知识，二者并重"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05_desc: "一方无法吞并另一方，但这恰恰使他们对外部干预显得脆弱，而现在，财富与知识皆握于你手。"
 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "祖穆鲁德·卡图恩陵墓"
 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "一座献给哈里发穆斯塔迪妻子的陵墓，是穿越时代回响的最真挚爱情象征。"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "常规陵墓"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "这座城市中众多陵墓中的一座，只因宏伟而特别，见证了万物终将消亡的事实。但你的直觉告诉你，事情或许比这要复杂一些……"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02: "著名的陵墓"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03: "神秘的陵墓"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc: "逝者诸灵萦绕于这座陵墓周围，尽皆悲泣，此处空气稀薄，两界之间的界限极易破碎。"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04: "联系死灵"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05: "通往冥界的通道"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05_desc: "你做到了俄耳甫斯所做的一切，以真爱之力踏入冥界。那并非你自己的真爱，这一点无关紧要。"
 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "阿杜迪医院"
 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "医院诞生于布伊王朝国王阿杜德·道莱决定在其去世前几年建造该医院之时。阿杜迪医院被认为是伊斯兰世界最具创新性和现代性的医院之一。"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "腐化医生"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "你拥有他们渴求的知识与疗方，而你会将其给予他们，但需付出代价。"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02: "学习他们的方法"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03: "带来奇怪病人"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc: "有医生站在你这边，你就可以开始研究地球上那些更加……神秘莫测的生物了。"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04: "引人入胜的发现"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05: "一座被阴影笼罩的医院"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05_desc: "你治愈那些你想让他们活着的人，并从那些你不想让他们活着的人身上学习，一个完美的体系。"
 building_type_baghdad_jewel_of_allah_taj_palace_01: "阿拔斯宫"
 building_type_baghdad_jewel_of_allah_taj_palace_01_desc: "底格里斯河畔，位于东巴格达南部，紧邻古老的哈萨尼宫以南，这里是庞大宫殿建筑群的最南端，被称为“哈里发宫邸”。"
 building_baghdad_jewel_of_allah_taj_palace_01: "渗透宫殿"
 building_baghdad_jewel_of_allah_taj_palace_01_desc: "宫殿中仍驻守着许多卫士与贵族，他们因长期无警而养尊处优。这正是绝佳的机会。"
 building_baghdad_jewel_of_allah_taj_palace_02: "控制禁卫军"
 building_baghdad_jewel_of_allah_taj_palace_02_desc: "$building_baghdad_jewel_of_allah_taj_palace_01_desc$"
 building_baghdad_jewel_of_allah_taj_palace_03: "添加新的驻军"
 building_baghdad_jewel_of_allah_taj_palace_03_desc: "既然人民已在掌控之中，现在正是确保城中一举一动皆在你的掌握之下的时机。"
 building_baghdad_jewel_of_allah_taj_palace_04: "增加巡逻"
 building_baghdad_jewel_of_allah_taj_palace_04_desc: "$building_baghdad_jewel_of_allah_taj_palace_03_desc$"
 building_baghdad_jewel_of_allah_taj_palace_05: "管理城市"
 building_baghdad_jewel_of_allah_taj_palace_05_desc: "从这里，你尽览一切，每一桩罪行，每一句低语，每一次未遂的政变，这座城市里没有哪件事不经你允许就能发生，而所有人都心知肚明。"
 building_type_baghdad_looted_baghdad_01: "巴格达被洗劫"
 building_type_baghdad_looted_baghdad_01_desc: "旭烈兀汗曾以刀剑屠戮此城，而它至今仍在缓慢而痛苦地走向灭亡。"
 building_baghdad_looted_baghdad_01: "巴格达已成废墟"
 building_baghdad_looted_baghdad_01_desc: "我将使你从苍穹之巅坠落，\n如雄狮般将你投入最深的深渊。\n我必不让你国中留下一人存活，\n我要将你的城池、疆土与帝国化为烈焰。若你尚存保全头颅与古老家族之心，\n且细听我的忠告。\n若你拒不接受，我便让你见识上帝旨意的真义。"
 building_baghdad_looted_baghdad_02: "巴格达重建"
 building_baghdad_looted_baghdad_02_desc: "巴格达或许曾遭焚毁，但绝不会就此消亡。凭借不懈努力，创伤终能愈合，它亦能重拾在世界中的显赫地位。"
 POD_baghdad_rebuild_tooltip: "巴格达将被#P 重建#!，且新的[buildings|E]建筑将变得可用"
 building_type_baghdad_starving_population_01: "饥荒中的民众"
 building_type_baghdad_starving_population_01_desc: "没有食物，店铺也荡然无存，人们无以为食。你不得不自掏腰包，以确保百姓不至于饿死或逃散。"
 building_baghdad_starving_population_01: "大规模饥荒"
 building_baghdad_starving_population_01_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_02: "度过饥荒"
 building_baghdad_starving_population_02_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_03: "日益严重的饥荒"
 building_baghdad_starving_population_03_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_type_baghdad_destroyed_infrastructure_01: "燃烧之城"
 building_type_baghdad_destroyed_infrastructure_01_desc: "目前尚不清楚有多少居民遇害：穆斯林作家估计死亡人数在80万至200万之间，而旭烈兀本人在致法国路易九世的信中则提到，他的军队已杀死20万人。"
 building_baghdad_destroyed_infrastructure_01: "无尽梦魇"
 building_baghdad_destroyed_infrastructure_01_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_02: "大规模混乱"
 building_baghdad_destroyed_infrastructure_02_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_03: "终焉之光"
 building_baghdad_destroyed_infrastructure_03_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_type_baghdad_rivers_of_ink_01: "墨河之书"
 building_type_baghdad_rivers_of_ink_01_desc: "巴格达图书馆中如此多的书籍被抛入底格里斯河，以至于“河水的颜色因书之多而变黑”。"
 building_baghdad_rivers_of_ink_01: "黑水河"
 building_baghdad_rivers_of_ink_01_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_02: "墨流如河"
 building_baghdad_rivers_of_ink_02_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_03: "染血的河流"
 building_baghdad_rivers_of_ink_03_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_type_baghdad_desecrated_mosques_01: "千座燃烧清真寺之城"
 building_type_baghdad_desecrated_mosques_01_desc: "不再有声音宣告祈祷时刻，它们如今仅展现吞噬巴格达的痛苦与恐怖。"
 building_baghdad_desecrated_mosques_01: "千座燃烧清真寺之城"
 building_baghdad_desecrated_mosques_01_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_02: "千座坍塌清真寺之城"
 building_baghdad_desecrated_mosques_02_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_03: "千座伤痕清真寺之城"
 building_baghdad_desecrated_mosques_03_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_type_baghdad_ruined_palaces_01: "残破的宫殿"
 building_type_baghdad_ruined_palaces_01_desc: "旭烈兀将哈里发关在堆满财宝的牢房里，结果他在四天内饿死了。其他一切都由蒙古征服者运走，巴格达恐怕再也不会见到它们了。"
 building_baghdad_ruined_palaces_01: "残破的宫殿"
 building_baghdad_ruined_palaces_01_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_02: "掠夺宫殿"
 building_baghdad_ruined_palaces_02_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_03: "废弃宫殿"
 building_baghdad_ruined_palaces_03_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "泰西封：波斯凤凰"
 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "泰西封曾是伊朗帝国帕提亚与萨珊时期的王都，历时逾八百年。它曾是世界之珠，而今或可再度辉煌。"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "泰西封：余烬"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "从一个小型军事营地发展为村庄，泰西封的起源十分卑微。"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02: "泰西封：烈焰"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02_desc: "作为萨珊王朝的首都，泰西封发展为富庶的商业大都会，与底格里斯河两岸的周边城市融为一体。"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03: "泰西封：凤凰"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03_desc: "在6世纪末至7世纪初，有人称它成为当时世界上最大的城市，其留下的遗产至今犹存。"
 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01: "白宫"
 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "白色宫殿是萨珊王朝万王之王在首都泰西封的主要居所，极有可能由第二位萨珊君主沙普尔一世所建。"
 building_ctesiphon_the_shadowed_pheonix_white_palace_01: "尘世之宫"
 building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "这处地方已有数百年未曾使用，而且理由充分。要翻新此地，需要投入大量工作。"
 building_ctesiphon_the_shadowed_pheonix_white_palace_02: "残垣断壁"
 building_ctesiphon_the_shadowed_pheonix_white_palace_02_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03: "雇佣守卫"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc: "再次适宜居住的焕然一新的白宫，如今正需要技艺精湛的人员。"
 building_ctesiphon_the_shadowed_pheonix_white_palace_04: "召见廷臣"
 building_ctesiphon_the_shadowed_pheonix_white_palace_04_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05: "帕迪沙阿宫殿"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05_desc: "仿佛岁月未曾侵蚀白石宫殿。它再一次成为一个生机勃勃的波斯王朝的宫廷，尽管这王朝更显幽暗。"
 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "泰西封拱门"
 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "有时被称为泰西封拱门，这是该城主要宫殿的正面，也是这座古都唯一可见的现存建筑。"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "帝国建筑废墟"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "这座拱门曾是皇宫建筑群的一部分。御座厅堂——想必就位于拱门之下或其后——早已在岁月的变迁中湮没无存。"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02: "帝国残影"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03: "残破的朝觐见厅"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc: "今天所留下的结构，是萨珊王朝觐见厅的主门廊，他们沿用了帕提亚人所选的同一地点。"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04: "修复完成的朝觐见厅"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05: "泰西封拱门"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05_desc: "你从一根幸存的柱子，重建了泰西封辉煌的主宫殿。这是你权力与坚韧的象征，为世人所见。"
 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "维赫-阿拉达希尔"
 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "这座城市最初名为塞琉西亚，是泰西封最富庶的郊区。"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "洪水的遗迹"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "公元5世纪中叶，维赫-阿拉达希尔发生洪水，将城市一分为二，导致其衰落。你的首要任务是修复所造成的损害。"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02: "弥合分歧"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03: "宗主教座堂"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc: "东方教会曾在此地设立机构。这段历史的记忆，或许能成为吸引民众重返重建后的泰西封的有力工具。"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04: "新的朝圣之地"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05: "维赫·阿拉达希尔"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05_desc: "随着这片郊区的复兴，泰西封离全面复苏又近了一步。"
 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "巴格·伊·欣杜万"
 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "霍斯劳二世国王统治时期建造的“印度花园”。一个美丽而休憩的场所，在你为泰西封制定的雄心勃勃的计划中，这将不可或缺。"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "尘土与黄沙"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "今日仅余尘土与沙砾，古典世界的奇物除了记忆，已什么都不剩了。"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02: "新鲜蔬菜"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03: "羞涩花朵"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc: "一座新兴城市中的一座蓬勃发展的花园，两者皆为满足其神秘统治者的怀旧之情而建。"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04: "阴暗树冠"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05: "巴格·伊·欣杜万"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05_desc: "大概与古典的那座不尽相同，但这座花园在你复兴的泰西封城中，依然是一道壮丽的风景。"
 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "维赫·安提奥克·科斯洛"
 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "“比安条克更优，霍斯劳所建”这座城市由沙阿霍斯劳一世在底格里斯河东岸、泰西封附近建立，居民是被驱逐的罗马战俘。"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "并不比安条克好多少"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "这个头衔对任何听到它的人来说都意味着许多承诺，而你的任务就是确保这些承诺得以实现。"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02: "几乎与安条克一样良好"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03: "比安条克更好"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc: "好吧，城市之间并没有官方的竞赛来判定你是否胜出，但如果你能自夸一番，那你算是表现得很不错了。"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04: "由你亲手建造"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05: "维赫·安条克"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05_desc: "去掉名字里的“霍斯劳”部分确实显得有点小心眼，但老实说，这名字本身就是小心眼的产物。"
 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01: "达斯塔吉尔德"
 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "萨珊王朝的皇家住所，拥有自己的宫廷和堡垒，是泰西封政治权力的关键部分。"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01: "罗马的伤痕"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "628年，达斯塔吉尔德被罗马皇帝希拉克略洗劫。此后，这座城市便杳无音讯。是时候重建罗马人所毁坏的一切了。"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02: "超越希拉克略"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03: "旧阿尔特米塔"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc: "这里曾屹立着一座古老的城市，它是希腊世界与帕提亚世界之间的交通要冲。它或许能再度成为这样的中心。"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04: "两座故城焕新颜"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05: "达斯塔吉尔德"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05_desc: "从你的窗户欣赏底格里斯河的景色，达斯塔吉尔德再次成为你重建的泰西封的政治与外交中心。"
 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01: "瓦拉沙巴德"
 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "泰西封的郊外，这座城市见证了萨珊王朝覆灭的关键战役。其重建将传递出强有力的信号。"
 building_ctesiphon_the_shadowed_pheonix_valashabad_01: "帕提亚的遗产"
 building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "瓦拉沙巴德由帕提亚国王沃洛吉西斯一世建立，后为萨珊人所占。在你治下，这悠久的波斯文化传统将继续得以传承。"
 building_ctesiphon_the_shadowed_pheonix_valashabad_02: "帕提亚与萨珊"
 building_ctesiphon_the_shadowed_pheonix_valashabad_02_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03: "萨巴特之死"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc: "阿拉伯人与波斯人之间的一场决定性战役曾在此地发生。此地迷障稀薄，正如你所怀疑的，那些早已阵亡的士兵仍在死后世界持续交锋。"
 building_ctesiphon_the_shadowed_pheonix_valashabad_04: "冥界的萨巴特"
 building_ctesiphon_the_shadowed_pheonix_valashabad_04_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05: "瓦拉沙巴德"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05_desc: "这座重建的城市对未开化者而言，依然亵渎神圣。然而，通晓亡者之道的人却深知，[UmbraGlossary('shadowlands')]从未如此临近于此。"
 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "提丰尼克·泰西封"
 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "尽管埃及从未真正统治过这片区域，但新王国时期的扩张却将一些胆大的赛特之子带至此地。仿佛这座城市从一开始就注定要荣耀赛特之名。"
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "提丰尼克·泰西封"
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "$building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "在以诺之前"
 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "塔尔玛埃拉历史悠久，比这座城市本身还要古老。但它铭记着自己在当地的起源，并思考着未来的道路。"
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "在以诺之前"
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "$building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid: "金字塔般的家乡风味"
 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "即使是古埃及全盛时期，也从未达到如此地步，而今却已实现。你必须确保这壮举永铭人心。"
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid: "金字塔般的家乡风味"
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "$building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth: "太阳诞生地"
 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "太阳神本人曾在此诞生，如今这片土地再次掌握在信徒手中。埃及妖妇的背叛与罗马秃鹫的征服，这次不会再击垮我们。"
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth: "太阳诞生地"
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "$building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame: "圣火"
 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "阿胡拉·马兹达的圣火再次照耀在他的城市之上。或许不久之后，这火焰也将照亮整个世界。"
 building_ctesiphon_the_shadowed_pheonix_sacred_flame: "圣火"
 building_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "$building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "奥西里斯神庙"
 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "暗影之地近在咫尺。若奥西里斯从阿蒙提注视着我们，这将是为他打造新权力枢纽的绝佳之地。"
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "奥西里斯神庙"
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "奥林匹斯神庙"
 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "一座祭拜十字与新月之前的旧神的神庙，那时你们公开统治，并与不朽的同僚们分割世界。"
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "奥林匹斯神庙"
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc$"
 building_type_baghdad_rebuilt_baghdad_01: "巴格达重建"
 building_type_baghdad_rebuilt_baghdad_01_desc: "$building_baghdad_rebuilt_baghdad_01_desc$"
 building_baghdad_rebuilt_baghdad_01: "巴格达：村庄"
 building_baghdad_rebuilt_baghdad_01_desc: "风摇动树枝。迷障已散，我们祈祷晴空万里。"
 building_baghdad_rebuilt_baghdad_02: "巴格达：城市"
 building_baghdad_rebuilt_baghdad_02_desc: "此地，即是永恒。风暴无法将其终结，凡人也难以撼动。"
 building_baghdad_rebuilt_baghdad_03: "巴格达：大都会"
 building_baghdad_rebuilt_baghdad_03_desc: "巴格达之上，天空曾坠落。如今已修复，它渴望生存。"
 building_type_baghdad_city_of_a_thousand_mosques_01: "千清真之城"
 building_type_baghdad_city_of_a_thousand_mosques_01_desc: "$building_baghdad_city_of_a_thousand_mosques_01_desc$"
 building_baghdad_city_of_a_thousand_mosques_01: "唯有独一清真寺之城"
 building_baghdad_city_of_a_thousand_mosques_01_desc: "一朝陨落，两度崛起。天堂在召唤。我们能否当得起这份眷顾？"
 building_baghdad_city_of_a_thousand_mosques_02: "十二清真寺之城"
 building_baghdad_city_of_a_thousand_mosques_02_desc: "这是世界之眼。祈祷永远向上。在外面，什么都没有。"
 building_baghdad_city_of_a_thousand_mosques_03: "千清真之城"
 building_baghdad_city_of_a_thousand_mosques_03_desc: "灾祸降临。我们挺过了。愿我们能够攀升至足够的高度。"
 building_type_baghdad_center_of_the_world_learning_01: "世界学问的中心"
 building_type_baghdad_center_of_the_world_learning_01_desc: "$building_baghdad_center_of_the_world_learning_01_desc$"
 building_baghdad_center_of_the_world_learning_01: "巴格达文盲"
 building_baghdad_center_of_the_world_learning_01_desc: "黑红交织暗淡。吾等再试门派之艺。愿铭记于心。"
 building_baghdad_center_of_the_world_learning_02: "睿智的巴格达"
 building_baghdad_center_of_the_world_learning_02_desc: "记忆。唯有记录才能留存生命。如此，恒久不变。"
 building_baghdad_center_of_the_world_learning_03: "世界学问的中心"
 building_baghdad_center_of_the_world_learning_03_desc: "我们岂能忘却恐惧？不，不能。因为在我们的困境中，言语再度飞扬。"
 building_type_baghdad_oldest_city_01: "最古老的城市"
 building_type_baghdad_oldest_city_01_desc: "$building_baghdad_oldest_city_01_desc$"
 building_baghdad_oldest_city_01: "被遗忘的废墟"
 building_baghdad_oldest_city_01_desc: "然而，巴别塔的阴魂之地仍在注视。从它的石砾中，我们再次筑起。"
 building_baghdad_oldest_city_02: "忆城"
 building_baghdad_oldest_city_02_desc: "在幼发拉底河畔，巴比伦曾安息。因傲慢，它招致了毁灭。而这一毁灭，却鼓舞了巴格达。"
 building_baghdad_oldest_city_03: "永恒的遗产"
 building_baghdad_oldest_city_03_desc: "骄傲所造成的一切，我们无法弥补。在侍奉中，赎罪之痕伴随着我们的每一步。"
 building_type_baghdad_heart_of_trade_01: "贸易中心"
 building_type_baghdad_heart_of_trade_01_desc: "$building_baghdad_heart_of_trade_01_desc$"
 building_baghdad_heart_of_trade_01: "熙熙攘攘的集市"
 building_baghdad_heart_of_trade_01_desc: "烈日之下，金色的河流再度奔涌不息。"
 building_baghdad_heart_of_trade_02: "贸易中心"
 building_baghdad_heart_of_trade_02_desc: "看啊，惊叹吧！万径交汇于此，在这宇宙的十字路口。"
 building_baghdad_heart_of_trade_03: "贸易中心"
 building_baghdad_heart_of_trade_03_desc: "狂乱的血管，不灭的心脏。巴格达便是那颗心脏。"
 POD_baghdad_sacked_rebuilt_modifier: "灰烬中重生"
 POD_baghdad_complacency_modifier: "辉煌的自满"
 POD_baghdad_complacency_modifier_desc: "巴格达，世界之中心，已然完美无缺。无需再有任何作为。\n\n#R 然而，有些末日预言者预测1258年将发生巨变......#!\n\n"
 POD_baghdad_looted_1_modifier: "化为灰烬"
 POD_baghdad_looted_1_modifier_desc: "凡人已遭重创，其城恢复需时多年。\n#help 一切创伤终将愈合...#!"
 POD_baghdad_looted_2_modifier: "缠绵之死"
 POD_baghdad_looted_2_modifier_desc: "大部分废墟已被清理，但空气中仍弥漫着死亡的气息。"
 POD_baghdad_looted_3_modifier: "愈合旧伤"
 POD_baghdad_looted_3_modifier_desc: "庄稼已重新播种，家园已重建。巴格达的民众正辛勤劳作，治愈这座昔日伟大城市的最后伤痕。"
 building_type_bjarkarey_hollr_01: "忠实桦岛"
 building_type_bjarkarey_hollr_01_desc: "#F 皑皑白雪被献给阿萨神族的鲜血染红。众神之父的影子仍在此徘徊，傲然对抗着十字架。#!"
 building_bjarkarey_hollr_01: "背信桦岛"
 building_bjarkarey_hollr_01_desc: "尘世艰辛，淫乱横行，刀剑之世；盾牌破碎，风暴咆哮，豺狼之世。若问何时休止？直至世界沉沦。"
 building_bjarkarey_hollr_02: "忠信桦岛"
 building_bjarkarey_hollr_02_desc: "牛羊亡，亲朋离，烛终尽，人终死；唯一能永存者，生时功业之名。"
 building_bjarkarey_hollr_03: "竞锋桦岛"
 building_bjarkarey_hollr_03_desc: "大日黑，土地沉，星辰坠。世界树的枝桠在燃烧，火光直冲云霄。"
 building_type_bjarkarey_leynikirkja_01: "秘隐教堂"
 building_type_bjarkarey_leynikirkja_01_desc: "#F 一些该隐之子仍蔑视阿萨神族，固守其异端信仰。他们赞美的并非众神之父，而是首位弑亲者。#!"
 building_bjarkarey_leynikirkja_01: "潜伏秘隐教堂"
 building_bjarkarey_leynikirkja_01_desc: "异端们在黑暗中聚集，遮掩面容，躲避阿萨神族的怒火。"
 building_bjarkarey_leynikirkja_02: "附属秘隐教堂"
 building_bjarkarey_leynikirkja_02_desc: "他们的避难所被焚毁，名字遭到吟游诗人的诅咒，但不信者依然固执地坚守其信仰。"
 building_bjarkarey_leynikirkja_03: "岬角秘隐教堂"
 building_bjarkarey_leynikirkja_03_desc: "异端的鲜血洒在雪地上，其秘密教堂已破碎不堪。仅余寥寥残存者，哭喊着呼唤一个不予回应的神明。"
 building_bjarkarey_leynikirkja_04: "重筑秘隐教堂"
 building_bjarkarey_leynikirkja_04_desc: "虚假的祭司们已尽数献于血鹰。他们隐秘的祭坛如今向北方寒地的真神敞开。"
 POD_bjarkarey_leynikirkja_bonus: "建造完成后，三位强大的冈格罗将加入你的宫廷。"
 building_type_bjarkarey_throndarnes_01: "特隆德内斯"
 building_type_bjarkarey_throndarnes_01_desc: "#F 桦岛上基督世界的中心，教堂里总是挤满了向其南方神明祈祷的凡人。#!"
 building_bjarkarey_throndarnes_01: "微缩特隆德内斯"
 building_bjarkarey_throndarnes_01_desc: "白基督的钟声仍在回响，但信徒日渐稀少。"
 building_bjarkarey_throndarnes_02: "阴影特隆德内斯"
 building_bjarkarey_throndarnes_02_desc: "神父的声音颤抖着，隐约传来向众神之父的祈祷。"
 building_bjarkarey_throndarnes_03: "洞穴特隆德内斯"
 building_bjarkarey_throndarnes_03_desc: "教堂已被亵渎，十字架倒悬，乌鸦啄食着被献祭祭司的肉。"
 building_bjarkarey_throndarnes_04: "易主特隆德内斯"
 building_bjarkarey_throndarnes_04_desc: "如今，基督与其教堂一同被遗忘，深埋于雪中。曾经的神圣之地，现在成了举行血祭仪式的开阔场地。"
 POD_bjarkarey_throndarnes_bonus: "建造完成后，你将解锁一个新兵士，并获得掠夺者特质。"
 building_type_bjarkarey_drekafloti_01: "龙舰港"
 building_type_bjarkarey_drekafloti_01_desc: "#F 岸边脆弱的渔船旁，停泊着一支黑船红帆的舰队。英灵战士们从这里出发踏入世间，渴求鲜血与黄金。#!"
 building_bjarkarey_drekafloti_01: "休眠龙舰港"
 building_bjarkarey_drekafloti_01_desc: "船队停靠在岸边，旁边是辛勤劳作的渔民，凡人畏惧着那些扬起绯红船帆的夜晚。"
 building_bjarkarey_drekafloti_02: " 劫掠码头"
 building_bjarkarey_drekafloti_02_desc: "越来越多的长船整装待发，而渔民被挤到一旁。船员们焦躁不安地坐着，等待他们最终离开这片安静海岸的夜晚。"
 building_bjarkarey_drekafloti_03: " 狼皮狂战营"
 building_bjarkarey_drekafloti_03_desc: "狂战士们端坐在巨舰之上，深红船帆展开，遮蔽了夜空。这支舰队蓄势待发，准备横扫南部海岸，掠夺沿途的一切。"
 building_bjarkarey_drekafloti_04: "神舰港"
 building_bjarkarey_drekafloti_04_desc: "在血帆舰队的黑色船体下，整片海域仿佛都化为了一片漆黑。这些无可争议的海上霸主逼近异国海岸，其绯红船帆在天穹边缘显现时，当地居民能做的唯有祈求慈悲。"
 building_type_bjarkarey_blodga_langhus_01: "染血长屋"
 building_type_bjarkarey_blodga_langhus_01_desc: "#F 曾经矗立高厅的山丘上，现在坐落着一间古朴的教堂，其上可见桦岛不朽统治者长长的阴影。#!"
 building_bjarkarey_blodga_langhus_01: "灰烬大厅"
 building_bjarkarey_blodga_langhus_01_desc: "山丘上的礼拜堂被拆毁，改建为了一座阴森残酷的厅堂。"
 building_bjarkarey_blodga_langhus_02: "钢铁大厅"
 building_bjarkarey_blodga_langhus_02_desc: "英灵战士的武器、盾牌战利品挂满了墙壁。血畜们不安地移开目光，唯恐招来某位黑暗主人的怒火。"
 building_bjarkarey_blodga_langhus_03: "战士大厅"
 building_bjarkarey_blodga_langhus_03_desc: "昏暗的木墙上总是沾染着一抹鲜红。强悍的战士们舒适地坐在屋内，尽情欢笑夸耀，随心所欲地打斗。"
 building_bjarkarey_blodga_langhus_04: "永恒大厅"
 building_bjarkarey_blodga_langhus_04_desc: "坐落于山丘之上，染血长屋堪称不可攻破的堡垒。侍卫们畅饮，血奴们侍奉。在这围墙之内，众神之父的统治是绝对的。"
 building_type_bjarkarey_frjalsir_menn_01: "自由民众"
 building_type_bjarkarey_frjalsir_menn_01_desc: "#F 当地人在农田上、海岸边辛勤劳作，希望能让他们的领主满意，以免招致其怒火。#!"
 building_bjarkarey_frjalsir_menn_01: "自主民众"
 building_bjarkarey_frjalsir_menn_01_desc: "这片土地的住民为自己劳作，疏忽了对你和阿萨神族的供奉。"
 building_bjarkarey_frjalsir_menn_02: "义务民众"
 building_bjarkarey_frjalsir_menn_02_desc: "民众们全身心投入，为他们的黑暗霸主勤勉劳作。"
 building_bjarkarey_frjalsir_menn_03: "可靠民众"
 building_bjarkarey_frjalsir_menn_03_desc: "桦岛日益壮大，人们对你、众神之父，以及他们家园的忠诚也随之增长。"
 building_bjarkarey_frjalsir_menn_04: "热忱民众"
 building_bjarkarey_frjalsir_menn_04_desc: "桦岛的居民如今已全然效忠于其主人。没有什么能阻挡他们履行自己的职责。"
 bjarkarey_frjalsir_menn_bonus: "你将解锁持烛者和近卫官宫廷职位。"
 building_type_bjarkarey_blothaugr_01: "血冢"
 building_type_bjarkarey_blothaugr_01_desc: "#F 在一座偏僻的山丘上，有一处血迹斑斑的献祭之地，符文和石头遍布四周。这里经常举行献祭仪式，以崇拜阿萨神族。#!"
 building_bjarkarey_blothaugr_01: "小型血冢"
 building_bjarkarey_blothaugr_01_desc: "献祭之地不过是一个小小的圆圈，上面刻满了符文和石头。"
 building_bjarkarey_blothaugr_02: "成长血冢"
 building_bjarkarey_blothaugr_02_desc: "祭祀小丘不断扩大，每晚参与血祭的信众也越来越多。"
 building_bjarkarey_blothaugr_03: "大型血冢"
 building_bjarkarey_blothaugr_03_desc: "祭祀之地如今覆盖了广袤的土地。山丘因献给奥丁的鲜血而染红。"
 building_bjarkarey_blothaugr_04: "无尽血冢"
 building_bjarkarey_blothaugr_04_desc: "如今整个桦岛都参与盛大的血祭。无数信徒，无论凡俗还是不朽，都来到这片山丘，取悦阿萨神族。"
 building_type_bjarkarey_solarhvelfing_01: "日轮地宫"
 building_type_bjarkarey_solarhvelfing_01_desc: "#F 山丘上的长屋之下，有片广阔的空间供侍卫们休憩，使其免受烈日灼晒之苦。#!"
 building_bjarkarey_solarhvelfing_01: "朴素日轮地宫"
 building_bjarkarey_solarhvelfing_01_desc: "日轮地宫仍是长屋下方的一片简朴之地，仅适合隐居，别无他用。"
 building_bjarkarey_solarhvelfing_02: "华丽日轮地宫"
 building_bjarkarey_solarhvelfing_02_desc: "地下的墙壁上现在挂满了战利品，证明了其信徒的力量。"
 building_bjarkarey_solarhvelfing_03: "坚固日轮地宫"
 building_bjarkarey_solarhvelfing_03_desc: "日轮地宫本就坚固非凡，如今更被进一步强化，更有战士守护其中。如今，再没有什么能将其攻破。"
 building_bjarkarey_solarhvelfing_04: "宏伟日轮地宫"
 building_bjarkarey_solarhvelfing_04_desc: "日轮地宫不再仅仅是一个地下避难所，如今它矗立为所有英灵战士力量与坚韧的宏伟纪念碑。"
 building_type_bjarkarey_myrkvidir_01: "幽暗密林"
 building_type_bjarkarey_myrkvidir_01_desc: "#F 桦岛周围危险且杂草丛生的树林，构成了这座城镇的天然防线。无数人消失在密林深处，从此再无音讯。#!"
 building_bjarkarey_myrkvidir_01: "原始幽暗密林"
 building_bjarkarey_myrkvidir_01_desc: "即便对于当地人而言，这片森林依旧是个危险而令人恐惧的地方。无人自愿踏入其中，而敢于进入者，鲜有生还。"
 building_bjarkarey_myrkvidir_02: "野生幽暗密林"
 building_bjarkarey_myrkvidir_02_desc: "得益于众多辛勤的劳动者和猎人的奉献，桦岛郊外的野林已呈现出一种秩序井然的面貌。"
 building_bjarkarey_myrkvidir_03: "温顺幽暗密林"
 building_bjarkarey_myrkvidir_03_desc: "桦岛的林木贸易流通顺畅，而野生动植物与猎人们则维持着这里的平衡。"
 building_bjarkarey_myrkvidir_04: "掌控幽暗密林"
 building_bjarkarey_myrkvidir_04_desc: "野生动植物如今守护着桦岛的森林，使其免受外界威胁，而广袤的林木则为民众提供了丰饶的物产。"
 building_type_bjarkarey_gullveigr_lundi_01: "古尔薇格树林"
 building_type_bjarkarey_gullveigr_lundi_01_desc: "#F 一处神圣的林地，传说中古尔薇格在此被阿萨神族以矛刺穿，三次焚毁，又三次重生。#!"
 building_bjarkarey_gullveigr_lundi_01: "梣树林"
 building_bjarkarey_gullveigr_lundi_01_desc: "对大多数人而言，这片小树林不过是林间一段令人不安的路途。然而，对于旧礼的践行者来说，这是一处圣所，其土壤至今仍蕴藏着力量。"
 building_bjarkarey_gullveigr_lundi_02: "余烬树林"
 building_bjarkarey_gullveigr_lundi_02_desc: "空气中弥漫着浓烈的灰烬气息，树液流淌出纯金的色泽。女巫与术士纷纷涌向这片树林，汲取其中的古老力量。"
 building_bjarkarey_gullveigr_lundi_03: "灼烧树林"
 building_bjarkarey_gullveigr_lundi_03_desc: "古尔薇格焚烧与重生的记忆，如今已深深烙印在大地的根基之中。即便是凡人，也能感受到那股力量。"
 building_bjarkarey_gullveigr_lundi_04: "光焱树林"
 building_bjarkarey_gullveigr_lundi_04_desc: "这片林地已被改造成一个既美丽又可怕的地方，公然藐视着白基督。空气中弥漫着不自然的灰烬，林地流淌着鲜红的精血。"
 POD_bjarkarey_gullveigr_lundi_rune_wise: "建造完成后，你将获得#Y 符文之智#!特质，开启以精血为代价的诺斯术法符文之道。某些禁忌之术仍将保持封闭：炼金术、召唤术、传送术与地狱火。"
 building_type_bjarkarey_ulfahus_01: "狼屋"
 building_type_bjarkarey_ulfahus_01_desc: "#F 桦岛凶猛的狼群和猎犬被关在笼中，等待着被释放，随时准备扑向任何胆敢攻击他们的愚昧之人。#!"
 building_bjarkarey_ulfahus_01: "狂野狼屋"
 building_bjarkarey_ulfahus_01_desc: "森林深处一座粗犷的小屋，其中养着桦岛上异常强壮而凶残的野兽。凡人往往避之不及，但必要时，这些动物会充当城镇的可怕守卫。"
 building_bjarkarey_ulfahus_02: "贪婪狼屋"
 building_bjarkarey_ulfahus_02_desc: "小屋已扩建以容纳更多动物，大厅现在装饰着巨兽的硕大毛皮。它们的嚎叫声数英里外都能听到，有效地警示着任何外来者。"
 building_bjarkarey_ulfahus_03: "血腥狼屋"
 building_bjarkarey_ulfahus_03_desc: "曾经只是一个带着笼子的小棚屋，如今已扩建为黑夜顶级掠食者令人胆寒的堡垒，其地板似乎永远浸透着鲜血。"
 building_bjarkarey_ulfahus_04: "芬里尔狼屋"
 building_bjarkarey_ulfahus_04_desc: "这座庞大的兽穴如今已能与古代的宏伟蜜酒厅相媲美。桦岛的人们声称，芬里尔亲自守护着其中的生灵。"
 building_type_bjarkarey_hvitakristr_01: "基督桦岛"
 building_type_bjarkarey_hvitakristr_01_desc: "#F 白雪因献给上帝的贡品而染红。十字架已粉碎旧时代最后顽固的残余。#!"
 building_bjarkarey_hvitakristr_01: "臣服桦岛"
 building_bjarkarey_hvitakristr_01_desc: "你们不要想我来是叫地上太平；我来并不是叫地上太平，乃是叫地上动刀兵。——《马太福音》10:34"
 building_bjarkarey_hvitakristr_02: "鞭笞桦岛"
 building_bjarkarey_hvitakristr_02_desc: "你们要拆毁他们的祭坛，打碎他们的神柱，焚烧他们的殿堂，砍倒他们神明的雕像……——《申命记》12:3"
 building_bjarkarey_hvitakristr_03: "圣化桦岛"
 building_bjarkarey_hvitakristr_03_desc: "他们必暴尸在外， 臭气熏天， 血浸山岭。——《以赛亚书》34:3"
 building_type_bjarkarey_cathedral_god_01: "天主教堂"
 building_type_bjarkarey_cathedral_god_01_desc: "#F 在这片寒冷而陌生的土地上，特隆德内斯是基督教世界的堡垒。#!"
 building_bjarkarey_cathedral_god_01: "基督礼拜堂"
 building_bjarkarey_cathedral_god_01_desc: "在这座简陋的教堂里，信徒们聚集一堂，抵御刺骨的寒冷与黑暗中的怪物，向主祈祷庇护。\n“光照进黑暗里，黑暗不能吞灭光。”——《约翰福音》1:5"
 building_bjarkarey_cathedral_god_02: "信者圣所"
 building_bjarkarey_cathedral_god_02_desc: "随着“羊群”的信仰日益坚定，教会也随之壮大。木料已为坚固的石材所取代，人们在这些墙壁之内呼吸也更为舒畅。\n“我我告诉你，你是彼得 ，我要在这磐石上建立我的教会，阴间的势力不能胜过它。”——《马太福音》16:18"
 building_bjarkarey_cathedral_god_03: "扩建教堂"
 building_bjarkarey_cathedral_god_03_desc: "钟声回荡，尖塔直指苍穹，异教信仰四散而去。特隆德内斯巍然屹立，见证上帝的光辉甚至照耀至这片寒冷之地。\n“现在，我为你建造了雄伟的殿宇， 作你永远的居所。”——《列王纪上》8:13"
 building_bjarkarey_cathedral_god_04: "天主之光"
 building_bjarkarey_cathedral_god_04_desc: "特隆德内斯已成为世界边缘的信仰灯塔。白基督已将黑暗从这片土地驱逐，人民欢欣鼓舞。\n“我听见从宝座中传来响亮的声音说：看啊！上帝的居所设立在人间，祂要与人同住……”——《启示录》21:3"
 POD_bjarkarey_cathedral_god_bonus: "朝圣活动的花费将减少。"
 building_type_bjarkarey_cathedral_caine_01: "该隐大教堂"
 building_type_bjarkarey_cathedral_caine_01_desc: "#F 曾是基督徒避难所的特隆德内斯，如今却侍奉着一位更为黑暗的神祇。#!"
 building_bjarkarey_cathedral_caine_01: "黑暗之父礼拜堂"
 building_bjarkarey_cathedral_caine_01_desc: "这座谦卑的教堂，对黑暗神父的信徒而言，是孤独的希望灯塔。\n“于是，耶和华在该隐身上留下一个记号，免得见到他的人杀他。”——《创世记》4:15"
 building_bjarkarey_cathedral_caine_02: "黑暗圣所"
 building_bjarkarey_cathedral_caine_02_desc: "随着异端的影响日益增强，教会得到了巩固。在这神圣之地，上帝之光被摒弃，所有崇拜转而归于该隐。\n“吃我肉、喝我血的人有永生，在末日，我要叫他复活。”——《约翰福音》6:54"
 building_bjarkarey_cathedral_caine_03: "根信大教堂"
 building_bjarkarey_cathedral_caine_03_desc: "作为对上帝的嘲弄，黑暗扭曲的尖塔直插云霄，每晚不祥的钟声响起，让民众知晓他们不朽的牧者已苏醒且饥肠辘辘。\n“根据律法，几乎所有的器具都要用血来洁净，因为若不流血，罪就得不到赦免。”——《希伯来书》9:22"
 building_bjarkarey_cathedral_caine_04: "首位谋杀者之怒"
 building_bjarkarey_cathedral_caine_04_desc: "该隐异端如今在这座由熏黑玻璃与石头筑成的教堂中有了新的据点。其巨大的阴影笼罩着整个桦岛，宣告着异端们的一场伟大胜利。\n“因为肉体的生命在血中，我把血赐给你们，使你们可以用血在祭坛上为自己赎罪……”——《利未记》17:11"
 POD_bjarkarey_cathedral_caine_bonus: "朝圣活动的花费将减少。"
 building_type_bjarkarey_knight_fortress_01: "骑士堡垒"
 building_type_bjarkarey_knight_fortress_01_desc: "#F 昔日的血腥粗陋长屋，如今已改造成上帝忠诚骑士的军械库。#!"
 building_bjarkarey_knight_fortress_01: "圣化长屋"
 building_bjarkarey_knight_fortress_01_desc: "The old timber walls that were soaked with the blood of Christians have been cleansed with holy water. It now serves as a modest outpost and armory for the first Christian warriors brave enough to hold this frozen land.\n\"And what agreement hath the temple of God with idols? for ye are the temple of the living God...\" - 2 Corinthians 6:16"
 building_bjarkarey_knight_fortress_02: "狂热驻军"
 building_bjarkarey_knight_fortress_02_desc: "Heavy stone walls have been erected around the old longhouse, guarded by disciplined knights clad in blessed swords and shields. The barbaric trophies of the interior have all been replaced by crosses.\n\"Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.\" - Ephesians 6:11"
 building_bjarkarey_knight_fortress_03: "北方十字军的家园"
 building_bjarkarey_knight_fortress_03_desc: "The longhouse stands completely converted as a formidable fortress of faith and military might. Monks, blacksmiths and warriors roam the halls, all working in unison to create a force strong enough to tame these lands.\n\"Blessed be the LORD my strength, which teacheth my hands to war, and my fingers to fight.\" - Psalm 144:1"
 building_bjarkarey_knight_fortress_04: "神之军械"
 building_bjarkarey_knight_fortress_04_desc: "The fortress now stands as a shining, impregnable armory for the champions of the White Christ, where holy knights gather their strength to wage eternal war upon heathens.\n\"Thou art my battle axe and weapons of war: for with thee will I break in pieces the nations, and with thee will I destroy kingdoms.\" - Jeremiah 51:20"
 POD_bjarkarey_knight_fortress_bonus: "Three skilled martial Ventrue will join your court upon completion of this building."
 building_type_bjarkarey_hammer_god_01: "上帝之锤"
 building_type_bjarkarey_hammer_god_01_desc: "#F Once a mighty fleet for the Pagan Norse, the Dragon Fleets now serve to destroy God's enemies instead.#!"
 building_bjarkarey_hammer_god_01: "Converted Ships"
 building_bjarkarey_hammer_god_01_desc: "The Dragon Fleets that once struck fear into Christian shores have been sawed away and replaced with the holy cross.\n\"They that go down to the sea in ships, that do business in great waters; These see the works of the LORD, and his wonders in the deep.\" - Psalm 107:23-24"
 building_bjarkarey_hammer_god_02: "Blessed Sails"
 building_bjarkarey_hammer_god_02_desc: "Manned by faithful sailors and priests, the might ships cut through the northern waves to deliver divine justice.\n\"Thus saith the LORD, which maketh a way in the sea, and a path in the mighty waters.\" - Isaiah 43:16"
 building_bjarkarey_hammer_god_03: "Armada of the Cross"
 building_bjarkarey_hammer_god_03_desc: "A formidable navy has been crafted in Bjarkarey, made from blessed oak and iron.\n\"Thou rulest the raging of the sea: when the waves thereof arise, thou stillest them.\" - Psalm 89:9"
 building_bjarkarey_hammer_god_04: "God's Thunder"
 building_bjarkarey_hammer_god_04_desc: "A vast, thundering armada of God now controls the northern seas. The fearsome Dragon Fleets have been reborn as the Hammer of God, ready to crush any heretic and nonbeliever.\n\"Thy right hand, O LORD, is become glorious in power: thy right hand, O LORD, hath dashed in pieces the enemy.\" - Exodus 15:6"
 POD_bjarkarey_hammer_god_bonus: "You will unlock the ability to raid upon completion of this building."
 building_type_bjarkarey_hammer_caine_01: "Hammer of Caine"
 building_type_bjarkarey_hammer_caine_01_desc: "#F The mightiest armada of the Einherjar now serve the spread the word and terror of the Dark Father.#!"
 building_bjarkarey_hammer_caine_01: "Blood-Christened Sails"
 building_bjarkarey_hammer_caine_01_desc: "The conquered Viking ships have been baptized in the vitae of the unfaithful. These dark vessels now serve the Heresy.\n\"And the second angel poured out his vial upon the sea; and it became as the blood of a dead man: and every living soul died in the sea.\" - Revelation 16:3"
 building_bjarkarey_hammer_caine_02: "Shadowed Fleets"
 building_bjarkarey_hammer_caine_02_desc: "Manned by loyal ghouls and guided by blood-bound captains, the ships are a terrifyingly effective way of spreading the Heretics' cause.\n\"Raging waves of the sea, foaming out their own shame; wandering stars, to whom is reserved the blackness of darkness for ever.\" - Jude 1:13"
 building_bjarkarey_hammer_caine_03: "Armada of the Dark Father"
 building_bjarkarey_hammer_caine_03_desc: "These raiding ships are now infamous among northern shores for the terror they represent. Dark banners snap in the bitter winds while the undead warriors slumbering inside the fleet wait patiently to unleash the Father's wrath.\n\"And the second angel sounded, and as it were a great mountain burning with fire was cast into the sea: and the third part of the sea became blood...\" - Revelation 8:8"
 building_bjarkarey_hammer_caine_04: "Caine's Fury"
 building_bjarkarey_hammer_caine_04_desc: "The armada has evolved into an apocalyptic one that claims dominion over the seas. The dragon fleets are no more. Only the Hammer of Caine, and their desire to drown the world in blood remains.\n\"I will set his hand also in the sea, and his right hand in the rivers.\" - Psalm 89:25"
 POD_bjarkarey_hammer_caine_bonus: "You will unlock the ability to raid upon completion of this building."
 building_type_bjarkarey_godfearing_subjects_01: "God-Fearing Subjects"
 building_type_bjarkarey_godfearing_subjects_01_desc: "#F Once the pagan thralls of cruel masters, the people of Bjarkarey remain doubtful about their new overlords.#!"
 building_bjarkarey_godfearing_subjects_01: "Penitent Flock"
 building_bjarkarey_godfearing_subjects_01_desc: "The descendants of pagan thralls understand who their new masters are. Though their understanding is simple, these newly baptized villagers look to the Cross with faith already.\n\"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.\" - 2 Corinthians 5:17"
 building_bjarkarey_godfearing_subjects_02: "Pious Laborers"
 building_bjarkarey_godfearing_subjects_02_desc: "The old heathen superstitions have been firmly rooted out, replaced by a rigid and unwavering devotion.\n\"The fear of the LORD is the beginning of wisdom: a good understanding have all they that do his commandments...\" - Psalm 111:10"
 building_bjarkarey_godfearing_subjects_03: "True Believers"
 building_bjarkarey_godfearing_subjects_03_desc: "Faith has become the bedrock of this community. Unified in their righteous fervor, the people of Bjarkarey stand ready to toil hard and defend their masters.\n\"In the fear of the LORD is strong confidence: and his children shall have a place of refuge.\" - Proverbs 14:26"
 building_bjarkarey_godfearing_subjects_04: "Zealous Hands of Christ"
 building_bjarkarey_godfearing_subjects_04_desc: "Bjarkarey's populace has been converted into a fiercely loyal and pious population.\n\"Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man.\" - Ecclesiastes 12:13"
 building_type_bjarkarey_terror_christ_01: "Terror of Christ"
 building_type_bjarkarey_terror_christ_01_desc: "#F The once-calm town square has been transformed into a brutal, bloody stage for divine retribution.#!"
 building_bjarkarey_terror_christ_01: "Sinner's Post"
 building_bjarkarey_terror_christ_01_desc: "A simple wooden post has been erected in the town square, where thieves and minor sinners are bound and whipped to serve as a warning to others.\n\"Judgments are prepared for scorners, and stripes for the back of fools.\" - Proverbs 19:29"
 building_bjarkarey_terror_christ_02: "Smiting the Sinners"
 building_bjarkarey_terror_christ_02_desc: "The square has been expanded to host gallows and sturdy whipping posts. The screams of the sinners and the unfaithful echo all across Bjarkarey, ensuring that the righteous flock remains fearful, obedient, and untempted by the old heathen ways.\n\"Then will I visit their transgression with the rod, and their iniquity with stripes.\" - Psalm 89:32"
 building_bjarkarey_terror_christ_03: "Cages of Repentance"
 building_bjarkarey_terror_christ_03_desc: "The plaza now lays permanently soaked in blood, dedicated to punishment. Pyres and brutal executions provide a horrifying, mandatory spectacle that purifies the community through sheer terror.\n\"And now also the axe is laid unto the root of the trees: therefore every tree which bringeth not forth good fruit is hewn down, and cast into the fire.\" - Matthew 3:10"
 building_bjarkarey_terror_christ_04: "Righteous Wrath of God"
 building_bjarkarey_terror_christ_04_desc: "The town square stands as a monument to terrifying divine retribution. Corpses hang from small iron cages suspended in air, with a few living among them crying out for the release of death. The people of Bjarkarey now know that the Lord's authority is absolute, and no sin will go unanswered.\n\"It is a fearful thing to fall into the hands of the living God.\" - Hebrews 10:31"
 POD_terror_christ_bonus: "You will unlock a new execution option upon completion of this building."
 building_type_bjarkarey_hall_judgment_01: "Hall of Judgment"
 building_type_bjarkarey_hall_judgment_01_desc: "#F What was once the town hall of the local mortals has been converted into an imposing seat of holy law.#!"
 building_bjarkarey_hall_judgment_01: "Chamber of Light"
 building_bjarkarey_hall_judgment_01_desc: "A modest, timbered room within the town center where disputes are settled and the King's law is read. The locals find comfort in the fact that the law remains, even now.\n\"The LORD is known by the judgment which he executeth: the wicked is snared in the work of his own hands.\" - Psalm 9:16"
 building_bjarkarey_hall_judgment_02: "Tribunal of Faith"
 building_bjarkarey_hall_judgment_02_desc: "Strict judges appointed by the Church's authority weight the deeds and crimes of men, bringing harsh but necessary order.\n\"It is joy to the just to do judgment: but destruction shall be to the workers of iniquity.\" - Proverbs 21:15"
 building_bjarkarey_hall_judgment_03: "Judgment of God"
 building_bjarkarey_hall_judgment_03_desc: "The small town hall has been expanded into a grand court of law. Heavy banners bearing the sword and the cross hang above the judge's seat as every ruling is delivered according to the laws of both man and God.\n\"These are the things that ye shall do; Speak ye every man the truth to his neighbour; execute the judgment of truth and peace in your gates.\" - Zechariah 8:16"
 building_bjarkarey_hall_judgment_04: "Seat of Righteousness"
 building_bjarkarey_hall_judgment_04_desc: "Beneath the watchful, unblinking eyes of carved angels, the judges determine the fates of every man and woman in Bjarkarey.\n\"For God shall bring every work into judgment, with every secret thing, whether it be good, or whether it be evil.\" - Ecclesiastes 12:14"
 POD_bjarkarey_hall_judgment_bonus: "You will gain True Faith upon completion of this building."
 building_type_bjarkarey_dark_libraries_01: "Dark Libraries"
 building_type_bjarkarey_dark_libraries_01_desc: "#F Deep in the secret vaults, forbidden knowledge, heretical scriptures, and occult lore remains, hidden from the orthodox Church.#!"
 building_bjarkarey_dark_libraries_01: "Hidden Archives"
 building_bjarkarey_dark_libraries_01_desc: "A concealed collection of forbidden scrolls and heretical texts lay hidden by the scholars of Bjarkarey, away from the eyes of the zealous orthodoxy.\n\"And I will give thee the treasures of darkness, and hidden riches of secret places...\" - Isaiah 45:3"
 building_bjarkarey_dark_libraries_02: "Secretive Scriptorium"
 building_bjarkarey_dark_libraries_02_desc: "Christian scribes tirelessly copy forbidden manuscripts in their efforts to use the occult lore to fight back against the Pagans.\n\"And further, by these, my son, be admonished: of making many books there is no end; and much study is a weariness of the flesh.\" - Ecclesiastes 12:12"
 building_bjarkarey_dark_libraries_03: "Damned Archives"
 building_bjarkarey_dark_libraries_03_desc: "The small vaults have been expanded into a great archive. The shelves groan beneath the weight of blasphemous texts.\n\"This wisdom descendeth not from above, but is earthly, sensual, devilish.\" - James 3:15"
 building_bjarkarey_dark_libraries_04: "Labyrinth of Sin"
 building_bjarkarey_dark_libraries_04_desc: "The archives resemble a labyrinth now, with unending, forbidden knowledge. Anyone bold enough to seek wisdom here may find more than they've bargained for.\n\"But unto you I say... as many as have not this doctrine, and which have not known the depths of Satan, as they speak; I will put upon you none other burden.\" - Revelation 2:24"
 building_type_bjarkarey_taema_01: "Temja Bjarkarey"
 building_type_bjarkarey_taema_01_desc: "#F Hidden upon a mist-shrouded island accessible only to the rune-wise, Ulf's Hall is a house of great wealth left over from the days of the Viking. The village itself may be a small, insignificant one still following the old ways, but the Hall itself still holds great riches and power.#!"
 building_bjarkarey_taema_01: "Njord's Bjarkarey"
 building_bjarkarey_taema_01_desc: "I ween that I hung on the windy tree,\nHung there for nights full nine;\nWith the spear I was wounded, and offered I was\nTo Othin, myself to myself,\nOn the tree that none may ever know\nWhat root beneath it runs."
 building_bjarkarey_taema_02: "Raven's Bjarkarey"
 building_bjarkarey_taema_02_desc: "None made me happy with loaf or horn,\nAnd there below I looked;\nI took up the runes, shrieking I took them,\nAnd forthwith back I fell."
 building_bjarkarey_taema_03: "Ulf's Bjarkarey"
 building_bjarkarey_taema_03_desc: "Runes shalt thou find, and fateful signs,\nThat the king of singers colored,\nAnd the mighty gods have made;\nFull strong the signs, full mighty the signs\nThat the ruler of gods doth write."
 building_type_bjarkarey_ulf_hall_01: "Ulf's Hall"
 building_type_bjarkarey_ulf_hall_01_desc: "#F On the northern edges of Bjarkarey lays a hall on a misty island, where commoners and wizards both practice the old ways in safety from the cross. Those who lack the gift of Odin's sight never find these halls, but the wisest may witness the hall's splendors.#!"
 building_bjarkarey_ulf_hall_01: "Veiled Longhouse"
 building_bjarkarey_ulf_hall_01_desc: "The halls are made of sturdy timber, concealed by the harsh northern elements. It serves as a refuge for those who shun the encroaching mortal Church."
 building_bjarkarey_ulf_hall_02: "Warded Safehouse"
 building_bjarkarey_ulf_hall_02_desc: "Wooden pillars of the halls are covered in mystical runes, protecting the wise against the prying eyes of outsiders."
 building_bjarkarey_ulf_hall_03: "Ashen Halls"
 building_bjarkarey_ulf_hall_03_desc: "Ulf's Hall remains a grand stronghold of pagan power. Here, the true masters of the old ways practice their craft in peace."
 building_bjarkarey_ulf_hall_04: "House of Ulf"
 building_bjarkarey_ulf_hall_04_desc: "The legendary sanctuary of Ulf Grimsson lays preserved in Bjarkarey in all it's glory. The very roots of this hall are bound to the land of Scandinavia, and nothing can ever break that bond."
 building_type_bjarkarey_ashen_throne_01: "Ashen Throne of Ulf"
 building_type_bjarkarey_ashen_throne_01_desc: "#F The throne of the legendary Ulf Grimsson, it holds significant power in these lands, even though many years have passed since he last sat upon it.#!"
 building_bjarkarey_ashen_throne_01: "Carved High Seat"
 building_bjarkarey_ashen_throne_01_desc: "A heavy chair made of dark timber lays reserved for Ulf, always left empty. Detailed carvings of great krakens and snarling beasts decorate the wood all along the throne."
 building_bjarkarey_ashen_throne_02: "Blood-Stained Throne"
 building_bjarkarey_ashen_throne_02_desc: "Long dried blood can still be spotted along the throne, filling any would-be pretenders to the high seat with dread."
 building_bjarkarey_ashen_throne_03: "Seat of Pagans"
 building_bjarkarey_ashen_throne_03_desc: "While no one knows what exactly the throne is made from, many claim that Ulf himself carved it from a sacred ash tree he felled himself."
 building_bjarkarey_ashen_throne_04: "Ulf's Seat of Power"
 building_bjarkarey_ashen_throne_04_desc: "The seat itself is a grand symbol for Pagans all over Scandinavia. As long this hall and throne remains, they will never be defeated. The old ways will live on."
 POD_bjarkarey_ashen_throne_bonus: "You will gain a powerful artifact upon the completion of this building."
 building_type_bjarkarey_grimsson_armory_01: "Grimsson's Armory"
 building_type_bjarkarey_grimsson_armory_01_desc: "#F Ulf Grimsson kept many treasures in his hall. The weapons he left behind are the best in the land.#!"
 building_bjarkarey_grimsson_armory_01: "Raider's Cache"
 building_bjarkarey_grimsson_armory_01_desc: "The entrance to the armory greets the warriors with a modest collection of rusted iron, scarred shields, and blood-stained axes gathered from forgotten skirmishes."
 building_bjarkarey_grimsson_armory_02: "Warlord's Arsenal"
 building_bjarkarey_grimsson_armory_02_desc: "High-quality steel weapons and heavy chainmail armor reveal themselves deeper in the armory, showing off the trophies taken from Ulf's raids overseas."
 building_bjarkarey_grimsson_armory_03: "Vaults of the Slain"
 building_bjarkarey_grimsson_armory_03_desc: "Masterwork blades, the shattered armor of fallen foreign knights, and the plunder of a hundred burned villages are kept sharp and ready."
 building_bjarkarey_grimsson_armory_04: "Armory of the Aesir"
 building_bjarkarey_grimsson_armory_04_desc: "The weapons in this legendary hall could fend off Ragnarök itself."
 POD_bjarkarey_grimsson_armory_bonus: "You will gain a powerful artifact upon the completion of this building."
 building_type_bjarkarey_prized_jewels_01: "Prized Jewels"
 building_type_bjarkarey_prized_jewels_01_desc: "#F Ulf had amassed a mighty hoard of treasure from his many adventures over his life. Housing trinkets of all kinds, it is a testament to how far he sailed across the world.#!"
 building_bjarkarey_prized_jewels_01: "Plundered Silver"
 building_bjarkarey_prized_jewels_01_desc: "Tarnished silver, copper and gold are stored in the vaults, taken from foreign men in their foreign lands."
 building_bjarkarey_prized_jewels_02: "Dragon's Hoard"
 building_bjarkarey_prized_jewels_02_desc: "The heavy, iron chests, filled to the brim with gleaming plunder are proof to prowess of Ulf and his raiders."
 building_bjarkarey_prized_jewels_03: "Deep Vaults"
 building_bjarkarey_prized_jewels_03_desc: "The deepest vaults store an awe-inspiring hoard of treasures claimed from rival immortals and legendary heroes who dared challenge Ulf Grimsson."
 building_bjarkarey_prized_jewels_04: "Jewels of Grimsson"
 building_bjarkarey_prized_jewels_04_desc: "Ulf's legendary hoard houses flawless rubies, masterwork weapons, and other such priceless trinkets that radiate an intoxicating aura of power and wealth."
 POD_bjarkarey_prized_jewels_bonus: "You will gain a powerful artifact upon the completion of this building."
 building_type_bjarkarey_bones_njord_01: "Bones of Njörðr"
 building_type_bjarkarey_bones_njord_01_desc: "#F The shores of Bjarkarey house the skeleton of a great sea beast that the mortals use as a place of worship.#!"
 building_bjarkarey_bones_njord_01: "Bleached Ribs of the Deep"
 building_bjarkarey_bones_njord_01_desc: "A scattering of massive, pale white bones rest half-buried on the shores of Bjarkarey. The mortal fisherfolk that still worship the Aesir often come here to leave offerings, praying for good hauls or winds."
 building_bjarkarey_bones_njord_02: "Shrine of the Sea-Beast"
 building_bjarkarey_bones_njord_02_desc: "The towering ribs have been hauled to point upright and lashed together to create an imposing archway. Beneath these bones, the descendants of thralls gather to wprship and beseech Njörðr to grant them favorable winds on the sea."
 building_bjarkarey_bones_njord_03: "Temple of the Tide"
 building_bjarkarey_bones_njord_03_desc: "The sands beneath the bones seem to carry a permanent red stain on them as the chants and prayers of the faithful mix with the crashing waves of the sea."
 building_bjarkarey_bones_njord_04: "Great Cathedral of Njörðr"
 building_bjarkarey_bones_njord_04_desc: "A breathtaking, imposing sanctuary for the followers of the old ways have been created beneath the bones of this dead sea-beast."
 building_type_bjarkarey_loyal_thralls_01: "Loyal Thralls"
 building_type_bjarkarey_loyal_thralls_01_desc: "#F The mortals of Bjarkarey toil away on the shores and fields, their hard work benefiting only their new overlords.#!"
 building_bjarkarey_loyal_thralls_01: "Subjugated Fisherfolk"
 building_bjarkarey_loyal_thralls_01_desc: "The villagers toil endlessly on the freezing shores, willingly trading away their freedom for the promise of protection. They prefer the dark over the cold."
 building_bjarkarey_loyal_thralls_02: "Bound Servants"
 building_bjarkarey_loyal_thralls_02_desc: "Fear has become the driving force for the locals. They work the icy seas with empty eyes and watch as their efforts go into the pockets of their masters."
 building_bjarkarey_loyal_thralls_03: "Sworn Serfs"
 building_bjarkarey_loyal_thralls_03_desc: "Generations of terror and manipulation have broken the mortals. The villagers now offer up their labor, their children, and their own veins without question."
 building_bjarkarey_loyal_thralls_04: "Devoted Vassals"
 building_bjarkarey_loyal_thralls_04_desc: "The people of Bjarkarey have been reduced to an entirely broken and fiercely devoted populace. Stripped of all autonomy and hope, they find a twisted pride in making their masters happy."
 building_type_bjarkarey_divided_throndarnes_01: "Divided Thróndarnes"
 building_type_bjarkarey_divided_throndarnes_01_desc: "#F The sole Christian church of Bjarkarey remains divided from the rest of the pagan populace.#!"
 building_bjarkarey_divided_throndarnes_01: "Compromised Parish"
 building_bjarkarey_divided_throndarnes_01_desc: "The priests of the White Christ preach, but their words have become strangely tolerant. Whispers in the dark have convinced them it is the best way to keep the peace."
 building_bjarkarey_divided_throndarnes_02: "Syncretic Congregation"
 building_bjarkarey_divided_throndarnes_02_desc: "The line between the Aesir and the Cross are deliberately blurred. Christian and Pagan alike now attend the tolerant sermons of Thróndarnes."
 building_bjarkarey_divided_throndarnes_03: "Shepherded Flock"
 building_bjarkarey_divided_throndarnes_03_desc: "The church has been brought under control, and the clergy enforce the will of their secret masters, preaching unity and hard labor to ensure the blended populace toils tirelessly for the prosperity of the domain."
 building_bjarkarey_divided_throndarnes_04: "United Thróndarnes"
 building_bjarkarey_divided_throndarnes_04_desc: "Thróndarnes now stands as a monument to the power of undead manipulation. The Christians and Pagans of Bjarkarey have been united into a single, efficient populace."
 building_type_bjarkarey_shadow_fleets_01: "Shadow Fleets"
 building_type_bjarkarey_shadow_fleets_01_desc: "#F The dragon fleets of the Viking age, stripped of their Pagan glory and repurposed into an efficient, dark armada.#!"
 building_bjarkarey_shadow_fleets_01: "Night Stalkers"
 building_bjarkarey_shadow_fleets_01_desc: "The dragon prows of old have been painted black as pitch, same as the sails. These swift ships no longer seek to terrorize, but slip silently through dark waters to raid and plunder."
 building_bjarkarey_shadow_fleets_02: "Silent Flotilla"
 building_bjarkarey_shadow_fleets_02_desc: "Manned by utterly silent, blood-bound thralls, this growing fleet strikes silently at night, plundering towns for blood and gold."
 building_bjarkarey_shadow_fleets_03: "Ghost Ships"
 building_bjarkarey_shadow_fleets_03_desc: "The people of Scandinavia whisper of a fleet of ghost ships, out for their blood."
 building_bjarkarey_shadow_fleets_04: "Armada of the Night"
 building_bjarkarey_shadow_fleets_04_desc: "This apocalyptic armada claims dominion over the northern seas. The Dragon Fleets are buried, replaced by the Shadow Fleets, an unstoppable armada that ensures the immortal masters of the north can strike and raid shores all over the world."
 POD_bjarkarey_shadow_fleets_bonus: "You will unlock the ability to raid upon completion of this building."