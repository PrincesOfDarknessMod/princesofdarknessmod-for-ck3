 building_type_constantinople_rebuild_constantinople_01: "重建中的君士坦丁堡"
 building_type_constantinople_rebuild_constantinople_01_desc: "因贪婪的拉丁人将之掠夺殆尽，君士坦丁堡已经成为昔日辉煌的影子。重建它将是一项巨大的工程，但这是必须完成的任务。"
 building_constantinople_rebuild_constantinople_01: "重建中的君士坦丁堡"
 building_constantinople_rebuild_constantinople_01_desc: "拉丁人梦魇后的初现生机，或许希望仍存。"
 building_constantinople_rebuild_constantinople_02: "恢复中的君士坦丁堡"
 building_constantinople_rebuild_constantinople_02_desc: "虽然不如往日般辉煌，但君士坦丁堡现在至少是一个从困顿沉睡中苏醒的繁荣城市。"
 building_constantinople_rebuild_constantinople_03: "永恒君士坦丁堡"
 building_constantinople_rebuild_constantinople_03_desc: "1204年的噩梦终于过去了。君士坦丁堡重新夺回了它作为世界渴望之城的应有地位，从今往后，永远如此。"
 building_type_constantinople_rebuild_great_palace_01: "大皇宫"
 building_type_constantinople_rebuild_great_palace_01_desc: "君士坦丁堡的大皇宫，也被称为圣宫，是位于半岛东南端最大的拜占庭皇宫建筑群。它是东罗马皇帝的主要居住场所，直到1081年起成为皇帝处理帝国政事的重要中心。\n曾毁于拉丁十字军之手，其重建将恢复在这黑暗时代中极为重要的帝国合法性。"
