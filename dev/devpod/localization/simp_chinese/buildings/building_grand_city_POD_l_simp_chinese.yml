 building_type_constantinople_reform_harbor_of_sophia_01: "索菲亚港"
 building_type_constantinople_reform_harbor_of_sophia_01_desc: "一个位于被城墙环绕的军械库旁的港湾，这个港口历史上曾有过许多名字。在第四次十字军东征之前，它是拜占庭的海军基地。\n它对君士坦丁堡的新统治者仍具有重要战略意义，因此将其堡垒化将是一个稳固的防御措施。"
