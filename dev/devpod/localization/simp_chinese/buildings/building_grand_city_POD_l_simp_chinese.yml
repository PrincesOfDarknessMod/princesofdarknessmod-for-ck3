 building_type_cairo_khitta_lama_01_desc: "#F 隶属阿什拉派的吸血鬼$glossary_khitta$。\n\n由勒森魃氏族的谢里夫·拉姆建立，这里是开罗勒森魃的领地。此处的市集被视为所有吸血鬼的避世圣地，只要他们遵守规则。#!"
