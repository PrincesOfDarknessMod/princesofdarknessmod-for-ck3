 building_type_cairo_vampiric_01: "吸血鬼统治下的开罗"
 building_type_cairo_vampiric_01_desc: "#F 充斥吸血鬼的大都市，不过是一场潜藏的浩劫#!"
 building_cairo_vampiric_01: "纷争之开罗"
 building_cairo_vampiric_01_desc: "诸多吸血鬼在此潜伏，但无人能真正掌控这座城市。"
 building_cairo_vampiric_02: "一统之开罗 "
 building_cairo_vampiric_02_desc: "血族低语反抗，却无一敢违背新主的意志。"
 building_cairo_vampiric_03: "命定开罗"
 building_cairo_vampiric_03_desc: "开罗的命运乃是成为该隐之子世界的中心。"
