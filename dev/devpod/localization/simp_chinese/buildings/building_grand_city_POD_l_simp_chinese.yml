 building_type_cairo_khitta_fen_01_desc: "#F 隶属阿什拉派的吸血鬼$glossary_khitta$。\n\n这里是阿什拉派妥芮朵氏族的家园，他们终日钻研书法和其他艺术形式。大多独善其身，仅偶尔与他人探讨哲学或艺术。#!"
