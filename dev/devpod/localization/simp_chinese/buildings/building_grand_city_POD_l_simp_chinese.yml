 building_type_constantinople_plundered_seraglio_lighthouse_01: "塞拉吉奥灯塔"
 building_type_constantinople_plundered_seraglio_lighthouse_01_desc: "塞拉吉奥灯塔在马尔马拉海中金角湾附近，这座灯塔为试图进出城市的船只提供了黑暗中的指引。\n它在拉丁人入侵期间很快被占领，如今引导着那些装载了城市中的财富的拉丁船只离开港口。"
