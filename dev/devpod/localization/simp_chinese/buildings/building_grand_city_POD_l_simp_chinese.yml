 building_type_rome_st_peters_city_01: "梵蒂冈"
 building_type_rome_st_peters_city_01_desc: "自从圣伯多禄建立教会以来，梵蒂冈一直是圣座所在。"
 building_rome_st_peters_city_01: "圣伯多禄的希望"
 building_rome_st_peters_city_01_desc: "$building_type_rome_st_peters_city_01_desc$\n\n圣父教宗意识到裁判所的存在，但裁判所仍然需要证明自己。"
 building_rome_st_peters_city_02: "圣伯多禄的决心"
 building_rome_st_peters_city_02_desc: "$building_type_rome_st_peters_city_01_desc$\n\n裁判所一直忙于净化这座城市的超自然灾害。"
 building_rome_st_peters_city_03: "圣伯多禄的城市"
 building_rome_st_peters_city_03_desc: "$building_type_rome_st_peters_city_01_desc$\n\n罗马城终于被拯救。她的市民得知在黑夜里再也没有伏击他们的危险存在，可以高枕无忧了。"
 building_type_rome_eternal_rome_01: "永恒罗马"
 building_type_rome_eternal_rome_01_desc: "罗马帝国的辉煌岁月也许早已消逝，但如果你仔细听，你仍然可以听到其回音。"
 building_rome_eternal_rome_01: "分裂的罗马"
 building_rome_eternal_rome_01_desc: "$building_type_rome_eternal_rome_01_desc$"
 building_rome_eternal_rome_02: "不败的罗马"
 building_rome_eternal_rome_02_desc: "罗马市民感到焕然一新，知道这座城市有着光明的未来。"
 building_rome_eternal_rome_03: "永恒罗马"
 building_rome_eternal_rome_03_desc: "罗马再一次成为地中海皇冠上的宝石。尽管凡人不知向谁感谢复兴罗马，但他们仍然心存感激。"
 POD_rome_san_michele_library_desc: "这是全世界最令人钦佩的神秘学藏馆之一。包括超自然、恶魔学，和魔法典籍都可以在此找到。许多裁判官也捐赠他们的私人收藏予图书馆。"
 POD_rome_san_michele_library_bonus: "#P 此建筑的拥有者使用代祷时，目标必定会得到[GetTrait('truefaith').GetName(GetNullCharacter)]。#!"
