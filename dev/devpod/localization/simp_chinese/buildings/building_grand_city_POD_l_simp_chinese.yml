 building_type_constantinople_rebuild_seraglio_lighthouse_01: "塞拉吉奥灯塔"
 building_type_constantinople_rebuild_seraglio_lighthouse_01_desc: "塞拉吉奥灯塔在马尔马拉海中金角湾附近，这座灯塔为试图进出城市的船只提供了黑暗中的指引。\n随着拉丁人被驱逐出城市，灯塔再次成为商船的道标，而非掠夺者的指引。"
