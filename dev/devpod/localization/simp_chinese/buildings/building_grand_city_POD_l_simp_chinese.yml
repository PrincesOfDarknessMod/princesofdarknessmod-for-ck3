 building_constantinople_rebuild_hagia_sophia_01_desc: "作为东正教会近千年的宗教和属灵的中心，这座教堂被献给了神圣智慧。它有着世界上最大的室内空间，并且是最早采用完全悬挂穹顶的建筑之一，被认为是拜占庭建筑的典范。\n在虔诚的统治者的再次统御下，圣索非亚大教堂正在重新修缮，力图超越第四次十字军东征前的辉煌。"
