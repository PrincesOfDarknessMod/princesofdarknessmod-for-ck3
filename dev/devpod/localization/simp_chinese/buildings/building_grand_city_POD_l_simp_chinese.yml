 building_type_constantinople_plundered_aqueduct_of_valens_01: "瓦伦斯水道桥"
 building_type_constantinople_plundered_aqueduct_of_valens_01_desc: "瓦伦斯水道桥是一个建于公元4世纪末的罗马水道桥系统，用于供给君士坦丁堡。水道桥的建设始于罗马皇帝康斯坦提乌斯二世时期，373年由皇帝瓦伦斯完成。至今，水道桥仍在被使用，并由拜占庭人进行了扩展和维护。\n由于该建筑的建材缺乏金银财富，拉丁人对其大多置之不理。然而，其建筑材料已经开始被用来“装饰”拉丁官员的宫殿。"
