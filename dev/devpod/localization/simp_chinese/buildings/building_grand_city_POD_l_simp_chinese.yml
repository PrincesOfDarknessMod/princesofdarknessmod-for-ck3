 building_type_constantinople_reform_the_hippodrome_01: "大竞技场"
 building_type_constantinople_reform_the_hippodrome_01_desc: "大竞技场是君士坦丁堡的体育和社交中心，以举办赛马和战车竞赛而闻名。\n战车比赛早已成为过往的记忆，但这座建筑所使用的石料仍然完好无损，可以帮助比预期更快地重建城市。"
