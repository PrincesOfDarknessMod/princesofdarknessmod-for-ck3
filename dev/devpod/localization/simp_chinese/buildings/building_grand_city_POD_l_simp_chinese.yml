 building_type_constantinople_plundered_the_hippodrome_01: "大竞技场"
 building_type_constantinople_plundered_the_hippodrome_01_desc: "大竞技场是君士坦丁堡的体育和社交中心，以举办赛马和战车竞赛而闻名。\n自从被拉丁人占领后，它变得异常沉寂，而威尼斯人现在将被偷走的凯旋四重奏雕像作为他们城市的象征。"
