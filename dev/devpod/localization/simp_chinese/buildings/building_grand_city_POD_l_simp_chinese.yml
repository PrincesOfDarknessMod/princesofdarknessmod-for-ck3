 building_type_cairo_khitta_hajj_01: "巴努·哈吉教区"
 building_type_cairo_khitta_hajj_01_desc: "#F 隶属阿什拉派的吸血鬼$glossary_khitta$。\n\n可能是人口最稠密的吸血鬼领地，此处的诺斯费拉图族也最为自治。任何非阿什拉派成员，尤其是其他诺斯费拉图族，在这里都会遭到严厉迫害。#!"
 building_cairo_khitta_hajj_01: "小型巴努·哈吉区"
 building_cairo_khitta_hajj_01_desc: "一处效忠于阿什拉派的$glossary_khitta$。\n\n或许是最为拥挤的辖域，这里的诺斯费拉图也是最为独立的一群。任何非阿什拉派成员，尤其是其他诺斯费拉图，在此都会遭受严酷的迫害。"
