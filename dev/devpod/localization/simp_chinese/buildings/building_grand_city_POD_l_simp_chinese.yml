 building_type_constantinople_rebuild_harbor_of_sophia_01: "索菲亚港"
 building_type_constantinople_rebuild_harbor_of_sophia_01_desc: "一个位于被城墙环绕的军械库旁的港湾，这个港口历史上曾有过许多名字。在第四次十字军东征之前，它是拜占庭的海军基地。\n重建它是理所当然的，因为君士坦丁堡需要一支强大的海军，以避免未来再次遭遇1204年的灾难。"
