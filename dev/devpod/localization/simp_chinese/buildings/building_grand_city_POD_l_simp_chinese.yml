 building_type_constantinople_reform_monastery_of_st_myrelaion_01: "圣米瑞拉修道院"
 building_type_constantinople_reform_monastery_of_st_myrelaion_01_desc: "米瑞拉修道院建立在一个公元五世纪风格的巨大圆形穹顶之上，后来被改建为修女院。这座建筑是第一个拜占庭皇帝私人墓地教堂，但在第四次十字军东征期间遭遇火灾，自此被遗弃。\n重建并被改变用途的修道院获得了新生，看起来这座建筑似乎无法长时间服务于同一目的。"
