 building_type_constantinople_reform_constantinople_01: "改革中的君士坦丁堡"
 building_type_constantinople_reform_constantinople_01_desc: "君士坦丁堡将永远无法回到从前。是时候前行了，在旧址的废墟上，迈向更美好的未来。"
 building_constantinople_reform_constantinople_01: "愈疗中的君士坦丁堡"
 building_constantinople_reform_constantinople_01_desc: "一座过去被与现在撕裂开来的城市，君士坦丁堡仍在恢复中。"
 building_constantinople_reform_constantinople_02: "完成改革的君士坦丁堡"
 building_constantinople_reform_constantinople_02_desc: "1204年的创伤正在消退，希腊遗产也在褪去。君士坦丁堡正迈入它的下一阶段。"
 building_constantinople_reform_constantinople_03: "新君士坦丁堡"
 building_constantinople_reform_constantinople_03_desc: "虽然它永远不会完全忘记过去，但君士坦丁堡现在是一个全新的城市，努力实现曾经的辉煌。"
 building_type_constantinople_reform_great_palace_01: "大皇宫"
 building_type_constantinople_reform_great_palace_01_desc: "君士坦丁堡的大皇宫，也被称为圣宫，是位于半岛东南端最大的拜占庭皇宫建筑群。它是东罗马皇帝的主要居住场所，直到1081年起成为皇帝处理帝国政事的重要中心。\n皇帝的时代正在迅速消退，现在这一废墟将会用来安置需要帮助的人，以展现新统治者的仁慈。"
 building_constantinople_reform_great_palace_01: "大皇宫的废墟"
 building_constantinople_reform_great_palace_01_desc: "君士坦丁堡的大皇宫，也被称为圣宫，是位于半岛东南端最大的拜占庭皇宫建筑群。它是东罗马皇帝的主要居住场所，直到1081年起成为皇帝处理帝国政事的重要中心。\n皇帝的时代正在迅速消退，现在这一废墟将会用来安置需要帮助的人，以展现新统治者的仁慈。"
