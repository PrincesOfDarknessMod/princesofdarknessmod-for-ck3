 building_type_constantinople_plundered_harbor_of_sophia_01: "索菲亚港"
 building_type_constantinople_plundered_harbor_of_sophia_01_desc: "一个位于被城墙环绕的军械库旁的港湾，这个港口历史上曾有过许多名字。在第四次十字军东征之前，它是拜占庭的海军基地。\n如今，它成为了从陷落的城市运送被盗物品到西方新主人处的主要地点。"
