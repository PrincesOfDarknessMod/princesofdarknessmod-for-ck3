l_simp_chinese:
 grand_city_holding: "大城邦"
 grand_city_holding_concept_key: "[grand_city|E]"
 building_type_grand_city_01: "大城邦"
 building_type_grand_city_01_desc: "人口稠密的中心，对凡俗和超自然世界都有巨大影响力。"
 building_grand_city_01: "人民聚集之处"
 building_grand_city_01_desc: "该城大量的凡人人口代表着犹待开发的纯粹潜力。唯一缺少的就是一位富有进取心的统治者敢于把握住机会。"
 building_grand_city_02: "人民繁荣之处"
 building_grand_city_02_desc: "该城以机会之地名闻遐迩，凡人蜂拥而至以寻求更好的生活。这是他们的繁荣之处，也是你的。"
 building_grand_city_03: "文化形塑之处"
 building_grand_city_03_desc: "这座世界知名的城市是大量发明与多元潮流的发祥地，其他文明都笼罩在她巨大的阴影之中。"
 building_grand_city_04: "历史创造之处"
 building_grand_city_04_desc: "这座城市发生的重大事件将确保她的名字永远不会被忘记。"
 building_type_rome_roma_aeterna_01: "罗马永恒"
 building_type_rome_roma_aeterna_01_desc: "#F 罗马是[Glossary('Cainite','game_concept_cainite_desc')]的中心，也是人类世界的中心。恢复它不死的伟大将是一个巨大的成就。#!"
 building_rome_roma_aeterna_01: "分裂的罗马"
 building_rome_roma_aeterna_01_desc: "圣职人员在街道上徘徊，反对任何直接控制欧洲世界中心的企图。在这个阶段，罗马对他的主人来说是一个有声望也是危险的头衔。"
 building_rome_roma_aeterna_02: "无敌的罗马"
 building_rome_roma_aeterna_02_desc: "慢慢地，罗马的信仰被侵蚀，吸血鬼可以再次利用他们微妙的影响力为亲王谋利。"
 building_rome_roma_aeterna_03: "罗马永恒"
 building_rome_roma_aeterna_03_desc: "最后，罗马又回到了吸血鬼的手中。当该隐子嗣歌颂征服圣城的伟大统治者时，圣职人员在黑暗中畏缩。"
 POD_rome_ventrue_desc: "这里是崇高的古罗马广场所在地，从很久以前它就是这座城市脉动的心脏。在破败的外观下隐藏着舒适美丽的房间。"
