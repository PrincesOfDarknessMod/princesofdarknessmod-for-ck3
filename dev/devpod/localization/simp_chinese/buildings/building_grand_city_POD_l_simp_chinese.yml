 building_type_cairo_canton_disciples_01_desc: "#F 为阿努比斯门徒建造的城区。\n他们是埃及古老的该隐之子教派，由冈格罗玛土撒拉安普领导，与$glossary_osirian_league$共同对抗赛特之子，投身于永恒的[Glossary('平衡之战','podgloss.warofbalance')]。#!"
