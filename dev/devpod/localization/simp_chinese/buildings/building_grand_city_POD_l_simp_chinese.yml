 POD_rome_san_michele_cloisters_desc: "这座三层楼的建筑容纳了所有居住於此的审判官。包括两个厨房、一个餐厅和两个较小的餐室。回廊的一楼有大礼拜堂，通常仅用于私下祈祷，而不受打扰的小型礼拜堂可以在顶部两层找到。"
