 building_type_constantinople_reform_seraglio_lighthouse_01_desc: "塞拉吉奥灯塔在马尔马拉海中金角湾附近，这座灯塔为试图进出城市的船只提供了黑暗中的指引。\n在新统治者到来时得以重建的它，再次成为了航行船只前来探访这座恢复中的城市时的光明灯塔。"
