 building_type_constantinople_rebuild_aqueduct_of_valens_01: "瓦伦斯水道桥"
 building_type_constantinople_rebuild_aqueduct_of_valens_01_desc: "瓦伦斯水道桥是一个建于公元4世纪末的罗马水道桥系统，用于供给君士坦丁堡。水道桥的建设始于罗马皇帝康斯坦提乌斯二世时期，373年由皇帝瓦伦斯完成。至今，水道桥仍在被使用，并由拜占庭人进行了扩展和维护。\n幸运的是，它的大部分并未被拉丁人破坏，现在已重新投入使用，为君士坦丁堡的真正主人服务。"
