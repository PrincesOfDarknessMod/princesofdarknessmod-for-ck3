 building_type_constantinople_plundered_hagia_sophia_01: "圣索菲亚大教堂"
 building_type_constantinople_plundered_hagia_sophia_01_desc: "作为东正教会近千年的宗教和属灵的中心，这座教堂被献给了神圣智慧。它有着世界上最大的室内空间，并且是最早采用完全悬挂穹顶的建筑之一，被认为是拜占庭建筑的典范。\n第四次十字军东征后，它被转变为天主教堂，并在第一次十字军入侵者的劫掠下失去了大部分装饰。"
