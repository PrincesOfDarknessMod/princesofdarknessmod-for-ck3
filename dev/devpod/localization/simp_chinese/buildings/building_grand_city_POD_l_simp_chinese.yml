 building_constantinople_reform_aqueduct_of_valens_02_desc: "瓦伦斯水道桥是一个建于公元4世纪末的罗马水道桥系统，用于供给君士坦丁堡。水道桥的建设始于罗马皇帝康斯坦提乌斯二世时期，373年由皇帝瓦伦斯完成。至今，水道桥仍在被使用，并由拜占庭人进行了扩展和维护。\n它仍然为社区执行着非常重要的任务，已经被修复并纳入了君士坦丁堡新统治者的维护工作中。"
 building_constantinople_reform_aqueduct_of_valens_03: "建造中的灰鹰水道桥"
 building_constantinople_reform_aqueduct_of_valens_03_desc: "瓦伦斯水道桥是一个建于公元4世纪末的罗马水道桥系统，用于供给君士坦丁堡。水道桥的建设始于罗马皇帝康斯坦提乌斯二世时期，373年由皇帝瓦伦斯完成。至今，水道桥仍在被使用，并由拜占庭人进行了扩展和维护。\n它仍然为社区执行着非常重要的任务，已经被修复并纳入了君士坦丁堡新统治者的维护工作中。"
 building_constantinople_reform_aqueduct_of_valens_04: "灰鹰水道桥"
 building_constantinople_reform_aqueduct_of_valens_04_desc: "瓦伦斯水道桥是一个建于公元4世纪末的罗马水道桥系统，用于供给君士坦丁堡。水道桥的建设始于罗马皇帝康斯坦提乌斯二世时期，373年由皇帝瓦伦斯完成。至今，水道桥仍在被使用，并由拜占庭人进行了扩展和维护。\n它仍然为社区执行着非常重要的任务，已经被修复并纳入了君士坦丁堡新统治者的维护工作中。"
 building_constantinople_reform_aqueduct_of_valens_05: "竣工的灰鹰水道桥"
 building_constantinople_reform_aqueduct_of_valens_05_desc: "瓦伦斯水道桥是一个建于公元4世纪末的罗马水道桥系统，用于供给君士坦丁堡。水道桥的建设始于罗马皇帝康斯坦提乌斯二世时期，373年由皇帝瓦伦斯完成。至今，水道桥仍在被使用，并由拜占庭人进行了扩展和维护。\n它仍然为社区执行着非常重要的任务，已经被修复并纳入了君士坦丁堡新统治者的维护工作中。"
 building_type_paris_chivalric_01: "骑士之都巴黎"
 building_type_paris_chivalric_01_desc: "#F 由高贵的妥芮朵与梵卓氏族统治，巴黎有潜力成为该隐子嗣世界的中心#!"
 building_paris_chivalric_01: "分裂之都巴黎"
 building_paris_chivalric_01_desc: "饱受冲突与阴谋摧残，巴黎的辉煌已成过往云烟"
 building_paris_chivalric_02: "宫廷之都巴黎"
 building_paris_chivalric_02_desc: "巴黎正缓慢而坚定地重拾昔日荣光"
 building_paris_chivalric_03: "骑士之都巴黎"
 building_paris_chivalric_03_desc: "这般盛景在该隐子嗣世界前所未见，巴黎的璀璨令所有见证者目眩神迷"
 building_type_paris_courts_love_01: "爱之皇庭"
 building_type_paris_courts_love_01_desc: "#F 爱之皇庭是由法兰西妥芮朵建立的吸血鬼领地与封建制度，主要吸引崇尚诗意骑士精神的妥芮朵成员，迅速成为热衷骑士道的该隐子嗣聚集地#!"
 building_paris_courts_love_01: "停滞皇庭"
 building_paris_courts_love_01_desc: "法兰西陷入动荡，巴黎皇庭已被遗弃。能否复兴尚待时间验证"
 building_paris_courts_love_02: "兴盛皇庭"
 building_paris_courts_love_02_desc: "部分皇庭已在巴黎权威下重光，美的火花再次点燃"
 building_paris_courts_love_03: "主宰皇庭"
 building_paris_courts_love_03_desc: "爱之皇庭再度掌控法兰西全境，巴黎重获煊赫地位"
 building_paris_courts_love_04: "至高爱之庭"
 building_paris_courts_love_04_desc: "世间再无皇庭能媲美巴黎的优雅与华美，该隐子嗣从世界各地蜂拥而至，只为一睹盛景"
 POD_paris_courts_love_bonus:0 "建造完成后获得[GetTrait('lifestyle_poet').GetName(GetNullCharacter)]特质"
 POD_requirements_paris_courts_love_02: "[holder|E]需直接控制或通过其[GetTrait('toreador').GetName(GetNullCharacter)]臣属控制三处$glossary_courts_of_love$[Concept('duchy','公国')|E]"
 POD_requirements_paris_courts_love_03: "[holder|E]需直接控制或通过其[GetTrait('toreador').GetName(GetNullCharacter)]臣属控制四处$glossary_courts_of_love$[Concept('duchy','公国')|E]"
 POD_requirements_paris_courts_love_04: "[holder|E]需直接控制或通过其[GetTrait('toreador').GetName(GetNullCharacter)]臣属控制全部$glossary_courts_of_love$[Concept('duchy','公国')|E]"
 building_type_paris_night_tournaments_01: "暗夜比武大会"
 building_type_paris_night_tournaments_01_desc: "#F 骑士道的根基在于武艺精熟，吸血鬼骑士们在此相互切磋较量#!"
 building_paris_night_tournaments_01: "地契购置"
 building_paris_night_tournaments_01_desc: "首先需要选址建造我们的厅堂与训练场"
 building_paris_night_tournaments_02: "玫瑰厅"
 building_paris_night_tournaments_02_desc: "随着玫瑰厅的落成，骑士训练正式展开"
 building_paris_night_tournaments_03: "暗黑竞技"
 building_paris_night_tournaments_03_desc: "吸血鬼需极大克制才能在战斗中不将彼此撕碎——这种战斗本能虽实用，却与骑士对决的荣誉准则相悖"
 building_paris_night_tournaments_04: "骑士比武大会"
 building_paris_night_tournaments_04_desc: "随着吸血鬼暴力冲动的抑制，如今凡人得以观赏这些比武盛会。虽有人质疑为何比武总在夜间举行，但在骑士们精湛武艺与英姿面前，这般疑问很快便被抛诸脑后。"
 POD_paris_night_tournaments_bonus:0 "建造完成后获得[GetTrait('lifestyle_blademaster').GetName(GetNullCharacter)]特质"
 building_type_paris_grand_court_01: "大皇庭"
 building_type_paris_grand_court_01_desc: "#F 至高皇庭是由梵卓玛土撒拉亚历山大创立的吸血鬼封建制度，最初是巴黎梵卓与妥芮朵强大成员的联盟#!"
 building_paris_grand_court_01: "式微王庭"
 building_paris_grand_court_01_desc: "自亚历山大遭放逐后，皇庭便分崩离析。必须倾尽全力方能重振梵卓的威势。"
 building_paris_grand_court_02: "衰颓王庭"
 building_paris_grand_court_02_desc: "虽不及昔日荣光，但影响力与控制权正逐步收复"
 building_paris_grand_court_03: "崛起王庭"
 building_paris_grand_court_03_desc: "随着巴黎及周边重归梵卓掌控，王国终得稳定"
 building_paris_grand_court_04: "大皇庭"
 building_paris_grand_court_04_desc: "大皇庭在新主统治下重获新生，此等王国必将令所有梵卓艳羡不已。"
 building_type_paris_alexander_court_01: "亚历山大的大皇庭"
 building_type_paris_alexander_court_01_desc: "#F 亚历山大是位梵卓玛土撒拉，罗马陷落后统治巴黎数百年。他在巴黎创立大皇庭，通过与数位妥芮朵长者合作，以恐惧与正义并施的手段统治。#!"
 building_paris_alexander_court_01: "王者归来"
 building_paris_alexander_court_01_desc: "巴黎真正的亲王亚历山大已重返他的城市，宏图伟业方才启程。"
 building_paris_alexander_court_02: "稳固王庭"
 building_paris_alexander_court_02_desc: "随着昔日影响力大半恢复，这位玛土撒拉如今可进一步扩张权势。"
 building_paris_alexander_court_03: "鼎盛王庭"
 building_paris_alexander_court_03_desc: "宫廷中充斥着顺从的臣民、往来的外交使节和高贵的骑士，众人皆欲赢得亚历山大的青睐。"
 building_paris_alexander_court_04: "万皇之尊"
 building_paris_alexander_court_04_desc: "亚历山大对法兰西的掌控无可撼动，必将永世为王。那些因恐惧与敬畏而追随的吸血鬼们需当心了。"
 POD_requirements_paris_ventrue_01: "[holder|E]必须同时持有[GetTitleByKey('d_valois').GetName]头衔"
 POD_requirements_paris_ventrue_02: "[holder|E]必须同时持有[GetTitleByKey('k_grand_court').GetName]头衔"
 building_type_paris_tremere_chantry_01: "睿魔尔秘所"
 building_type_paris_tremere_chantry_01_desc: "#F 对睿魔尔氏族而言，秘所的重要性无出其右。它既是家园，也是据点，既是堡垒，更是知识圣殿。每当睿魔尔进驻一座城市，建立秘所永远是首要之务，即便流尽最后一滴血也要誓死捍卫。巴黎睿魔尔秘所是全氏族最古老的据点之一，其实力与影响力仅次于塞里奥斯秘所。#!"
 building_paris_tremere_chantry_01: "小型秘所"
 building_paris_tremere_chantry_01_desc: "这座秘所规模有限且无足轻重，缺乏大多数秘所应具备的基础设施。"
 building_paris_tremere_chantry_02: "扩建秘所"
 building_paris_tremere_chantry_02_desc: "配备图书馆后，秘所正逐步吸引新成员加入。"
 building_paris_tremere_chantry_03: "大型秘所"
 building_paris_tremere_chantry_03_desc: "随着规模扩大，秘所已通过驯服众多石像鬼来满足安保需求。"
 building_paris_tremere_chantry_04: "尊崇秘所"
 building_paris_tremere_chantry_04_desc: "凭借新增资源与影响力，巴黎秘所已成为许多强大睿魔尔的栖身之所。"
 POD_paris_tremere_chantry_bonus_1: "允许招募[GetMaA('gargoyle_razorbats').GetName]作为[men_at_arms|E]"
 POD_paris_tremere_chantry_bonus_2: "$POD_paris_tremere_chantry_bonus_1$\n允许招募[GetMaA('gargoyle_scouts').GetName]与[GetMaA('gargoyle_sentinels').GetName]作为[men_at_arms|E]"
 POD_paris_tremere_chantry_bonus_3: "$POD_paris_tremere_chantry_bonus_2$\n允许招募[GetMaA('gargoyle_warriors').GetName]作为[men_at_arms|E]"
 POD_paris_tremere_chantry_bonus_4: "当地[GetTrait('tremere').GetName(GetNullCharacter)]将向你献上“礼物”\n\n$POD_paris_tremere_chantry_bonus_3$"
 building_type_paris_nosferatu_warren_01: "诺斯费拉图地窟"
 building_type_paris_nosferatu_warren_01_desc: "#F 这座诺斯费拉图地窟的历史可追溯至塞纳河畔最早的定居点时期，孕育了独特的诺斯费拉图血脉——谟涅摩夫人半透明的帕里西族#!"
 building_paris_nosferatu_warren_01:0 "探索深渊"
 building_paris_nosferatu_warren_01_desc: "诺斯费拉图族潜伏在巴黎地下墓穴深处。若能获得他们的忠诚——或者哪怕只是找到他们——其能力将带来巨大助益"
 building_paris_nosferatu_warren_02:0 "迂回曲径"
 building_paris_nosferatu_warren_02_desc: "察觉到入侵迹象的诺斯费拉图，已派出族人探查你的意图"
 building_paris_nosferatu_warren_03:0 "地底王宫"
 building_paris_nosferatu_warren_03_desc: "成功与吸血鬼达成协议后，你被引至他们的地底王宫。这座堪称王宫的建筑，其存在甚至早于巴黎建城之初"
 building_paris_nosferatu_warren_04:0 "巴黎暗影"
 building_paris_nosferatu_warren_04_desc: "通过给予诺斯费拉图通常只有高等氏族才能享有的特权，他们同意成为你在巴黎各处的耳目"
 building_type_paris_royal_palace_01: "西岱宫"
 building_type_paris_royal_palace_01_desc: "#F 坐落于塞纳河西岱岛的西岱宫，既是法兰西国王的居所，也是皇家档案馆、国库及法庭所在之处#!"
 building_paris_royal_palace_01: "控御仆从"
 building_paris_royal_palace_01_desc: "在宫中布下眼耳，是掌控全局的关键一步。"
 building_paris_royal_palace_02: "操控贵族阶层"
 building_paris_royal_palace_02_desc: "不同阶层的贵族往来穿梭，他们唇枪舌剑的言辞，如今皆可为你所用。"
 building_paris_royal_palace_03: "蛊惑总管"
 building_paris_royal_palace_03_desc: "作为宫廷第二重要人物，控制他便等于开启了所有门禁。"
 building_paris_royal_palace_04: "王座魅影"
 building_paris_royal_palace_04_desc: "或有血族认为操控凡人君主违背避世戒律，实则那些反对者不过是无力企及你的成就。"
 building_type_paris_food_market_01: "尚波市场"
 building_type_paris_food_market_01_desc: "#F 原为谷物市场，后逐渐发展为巴黎主要食品集市#!"
 building_paris_food_market_01: "铺砌市场"
 building_paris_food_market_01_desc: "铺设市场道路是促进商业活动的简易之策。"
 building_paris_food_market_02: "说服商贾"
 building_paris_food_market_02_desc: "商贩虽不愿降价，但你总有办法让他们“心甘情愿”。"
 building_paris_food_market_03: "掌控摊位"
 building_paris_food_market_03_desc: "直接控制摊位将巩固对食品市场的支配，确保农民饱腹——毕竟，温饱的农民才是顺民。"
 building_paris_food_market_04: "温和的家主"
 building_paris_food_market_04_desc: "食物充盈，众人在每次用膳时都会低声祷念你的名字。微末之举，却养成一群忠心耿耿的信众——你最锋利的暗刃。"
 building_type_paris_guilds_01: "行会"
 building_type_paris_guilds_01_desc: "#F 巴黎的众多匠师与工匠早已编入各自的行会。这些行会原是为了防范竞争与失业而设立——所幸，吸血鬼既不竞争，也无失业之虞。#!"
 building_paris_guilds_01: "扩建行会馆"
 building_paris_guilds_01_desc: "夜中，一位富贵之人伸出援手，许以庇护与赞助。如此良机，又有谁能抗拒？"
 building_paris_guilds_02: "剔除旧供者，引入新血"
 building_paris_guilds_02_desc: "若他们别无选择，只能向你采购——那真正掌控一切的人，又是谁？"
 building_paris_guilds_03: "魅惑匠师"
 building_paris_guilds_03_desc: "财富的诱惑，再加上一点吸血鬼的“劝导”，足以让他们毫无异议地俯首听命。"
 building_paris_guilds_04: "夜之行会首领"
 building_paris_guilds_04_desc: "虽有行会林立，如今唯有一位大师执掌其上。他们的财富，正源源不断地流入你的囊中。"
 building_type_paris_university_01: "索邦学院"
 building_type_paris_university_01_desc: "#F 又称巴黎大学，欧洲最古老的学术堡垒之一，其历史早已深埋于暗影之中。#!"
 building_paris_university_01: "取而代之的教化"
 building_paris_university_01_desc: "这些典籍中蕴藏着大量有用的知识——也许对凡人来说，过于有用了。知得越少，对他们越好。"
 building_paris_university_02: "操控导师"
 building_paris_university_02_desc: "有时，凡人知得太多，便开始提出不该问的问题。给予一个虚假的答案，便能将他们重新引回无知之中。"
 building_paris_university_03: "扩建藏书馆"
 building_paris_university_03_desc: "吸血鬼或许不朽，世间却永不停歇地更迭。掌握的知识越多，适应变局就越轻而易举。"
 building_paris_university_04: "知识的灯塔"
 building_paris_university_04_desc: "各种学者纷纷涌向你所积聚的浩瀚知识——那是经过精心筛选的真理幻影，只为将他们引离真实的道路。"
 building_type_paris_walls_augustus_01: "腓力二世·奥古斯都之墙"
 building_type_paris_walls_augustus_01_desc: "#F 腓力·奥古斯都下令修建，并亲自出资修筑的这道城墙，旨在抵御外敌，为巴黎提供坚实的防护。#!"
 building_paris_walls_augustus_01: "加固城墙"
 building_paris_walls_augustus_01_desc: "虽然这些城墙已足以抵御凡人，但仍有一些超自然生物可以轻易潜入，甚至摧毁部分城墙。"
 building_paris_walls_augustus_02: "让守卫成为血仆"
 building_paris_walls_augustus_02_desc: "血仆忠诚，血仆知晓，血仆高效，血仆可弃。"
 building_paris_walls_augustus_03: "提升塔楼"
 building_paris_walls_augustus_03_desc: "诸多夜行之物翱翔于天际。占据更高的瞭望点，将使你新近血仆化的守卫更易察觉这些潜行者的踪迹。"
 building_paris_walls_augustus_04: "午夜守卫"
 building_paris_walls_augustus_04_desc: "随着你对防御的全面强化，巴黎如今已准备好应对任何潜在的超自然袭击。"
 building_type_paris_monastery_01: "圣日耳曼德佩"
 building_type_paris_monastery_01_desc: "#F 圣日耳曼德佩修道院位于城墙之外，但这并未削弱它作为巴黎灵性中心的地位#!"
 building_paris_monastery_01: "播下种子"
 building_paris_monastery_01_desc: "质疑，即是动摇信念。"
 building_paris_monastery_02: "欺瞒修士"
 building_paris_monastery_02_desc: "疑妄为堕渊之径"
 building_paris_monastery_03: "信仰篡改"
 building_paris_monastery_03_desc: "而堕落永世不灭"
 building_paris_monastery_04: "匿神"
 building_paris_monastery_04_desc: "异信低语已扎根，凡人如今向未知真身之力祈祷。盲信尤为可怖"
 POD_paris_monastery_bonus: "增加从凡人处获取的[hunger_with_icon|E]"
 building_type_paris_umbral_01: "暗影巴黎"
 building_type_paris_umbral_01_desc: "#F 阴影笼罩骄傲的巴黎#!"
 building_paris_umbral_01: "抗争巴黎"
 building_paris_umbral_01_desc: "此城仍在抗拒夜之生物"
 building_paris_umbral_02: "陷落巴黎"
 building_paris_umbral_02_desc: "诡暗已蔓延全城"
 building_paris_umbral_03: "暗影巴黎"
 building_paris_umbral_03_desc: "阴影吞噬之城，今侍其黑暗主宰"
 building_type_paris_free_01: "自由巴黎"
 building_type_paris_free_01_desc: "#F 脱黑暗的巴黎已准备重绽光芒#!"
 building_paris_free_01: "复苏的巴黎"
 building_paris_free_01_desc: "夜色影响仍在这座伟大城市留下印记"
 building_paris_free_02: "辉煌巴黎"
 building_paris_free_02_desc: "在凡人眼中，巴黎依旧辉煌如昔"
 building_paris_free_03: "自由巴黎"
 building_paris_free_03_desc: "巴黎犹如对抗黑暗的闪耀明灯"
 building_type_paris_st_dennis_01: "圣丹尼修道院"
 building_type_paris_st_dennis_01_desc: "#F 红修会在法兰西王室领地最重要的据点。这座由令人敬畏的狂热者热尔韦斯领导的堡垒，既是传统的守护者，也是学术的中心。#!"
 building_paris_st_dennis_01: "圣丹尼图书馆"
 building_paris_st_dennis_01_desc: "红修会众多男性成员在此宏伟图书馆研习。"
 building_paris_st_dennis_02: "圣丹尼学者"
 building_paris_st_dennis_02_desc: "红修会男性成员可通过修道院进入巴黎大学深造。"
 building_paris_st_dennis_03: "圣丹尼典籍守护者"
 building_paris_st_dennis_03_desc: "凭借丰富的典籍资源，红修会提供消灭夜之生物所需的知识。"
 building_paris_st_dennis_04: "圣丹尼审判官"
 building_paris_st_dennis_04_desc: "修道院长热尔韦斯领导着最激进的行动组，为净化巴黎街道上与神圣事业为敌的野兽而战。"
 POD_paris_st_dennis_bonus: "解锁[endowments_lifestyle|E]的仪式技能树"
 building_type_paris_knights_templar_01: "圣殿神殿"
 building_type_paris_knights_templar_01_desc: "#F 圣殿骑士团是天主教的法兰西军事修会，也是西方基督教世界最富有、最受欢迎的军事组织之一。#!"
 building_paris_knights_templar_01: "圣殿骑士团"
 building_paris_knights_templar_01_desc: "圣殿骑士团是一个信奉天主教的法国军事修会，也是西方基督教世界最富有、最受欢迎的军事组织之一。"
 building_paris_knights_templar_02: "招募低阶成员"
 building_paris_knights_templar_02_desc: "圣殿骑士团大多并不知晓暗影审判庭的存在。若能让他们一些地位较低的成员协助我们教团的日常运作，将是一个良好的开端。"
 building_paris_knights_templar_03: "招纳成员"
 building_paris_knights_templar_03_desc: "坚定虔诚之人，永远受我们事业的欢迎。但在此之前，他们必须知晓自己所对抗的究竟是什么。"
 building_paris_knights_templar_04: "上帝之剑"
 building_paris_knights_templar_04_desc: "圣殿骑士已整装待发，将与我们一同对抗地狱的爪牙。"
 POD_paris_knights_templar_bonus: "在寻找巢穴[journey|E]中[planning_speed|E]翻倍"
 building_type_paris_knights_hospitaller_01: "医院骑士团驻地"
 building_type_paris_knights_hospitaller_01_desc: "#F 医院骑士团是一支天主教宗教骑士团，致力于照料患病、贫困或受伤的基督教朝圣者。#!"
 building_paris_knights_hospitaller_01: "医院骑士团"
 building_paris_knights_hospitaller_01_desc: "医院骑士团是一支天主教宗教骑士团，致力于照料患病、贫困或受伤的基督教朝圣者。"
 building_paris_knights_hospitaller_02: "支持医院骑士团"
 building_paris_knights_hospitaller_02_desc: "简单的捐赠不足以让医院骑士团为即将到来的战争做好准备。我们必须积极支持他们。"
 building_paris_knights_hospitaller_03: "传授神术"
 building_paris_knights_hospitaller_03_desc: "普通医术或许能治疗寻常疾病，但对超自然力量却收效甚微。他们需要神圣之术。"
 building_paris_knights_hospitaller_04: "邪恶监护者"
 building_paris_knights_hospitaller_04_desc: "医院骑士团将成为我们抵御腐朽与邪恶之盾。"
 building_type_paris_free_carnivals_01: "巴黎庆典"
 building_type_paris_free_carnivals_01_desc: "#F 城中行会皆有其守护圣徒，每逢圣徒日必大庆。\n\n王室未婚文吏自组\"巴索什行会\"，以游行、闹剧与讽刺剧庆贺节日。#!"
 building_paris_free_carnivals_01: "巴黎庆典"
 building_paris_free_carnivals_01_desc: "城中行会皆有其守护圣徒，每逢圣徒日必大庆。\n\n王室未婚文吏自组\"巴索什行会\"，以游行、闹剧与讽刺剧庆贺节日。"
 building_paris_free_carnivals_02: "受扶持的庆典"
 building_paris_free_carnivals_02_desc: "$building_paris_free_carnivals_01_desc$"
 building_paris_free_carnivals_03: "扶植的庆典"
 building_paris_free_carnivals_03_desc: "$building_paris_free_carnivals_01_desc$"
 building_paris_free_carnivals_04: "巴黎盛大庆典"
 building_paris_free_carnivals_04_desc: "$building_paris_free_carnivals_01_desc$"
 building_type_cairo_ancient_01: "开罗古城"
 building_type_cairo_ancient_01_desc: "#F 旧城静候一位真正的大师。#!"
 building_cairo_ancient_01: "重掌开罗"
 building_cairo_ancient_01_desc: "开罗终将成为奥西里斯信徒命定的都城。"
 building_cairo_ancient_02: "净化的开罗"
 building_cairo_ancient_02_desc: "盘踞在这片土地上的邪祟已被肃清。光明重新照耀凯姆之地。"
 building_cairo_ancient_03: "神圣开罗"
 building_cairo_ancient_03_desc: "如今得众神赐福，这里成为信仰之心。开罗屹立于此。"
 building_type_cairo_temple_ra_01: "拉神庙"
 building_type_cairo_temple_ra_01_desc: "#F 拉，伟大的太阳神。众神之父，世界创造者。自远古时代便受崇拜#!"
 building_cairo_temple_ra_01: "拉神神龛"
 building_cairo_temple_ra_01_desc: "拉神子孙众多，但都比不上他的两个孙子——兄弟奥西里斯与赛特。他们与孙女伊西斯共同塑造了凯姆之地。"
 building_cairo_temple_ra_02: "拉神祭坛"
 building_cairo_temple_ra_02_desc: "拉日渐衰老，指定奥西里斯为继任者。这令赛特不满，因他本是众神中最勇猛的战士，每夜守护拉的太阳船，与黑暗大蛇$glossary_wyrm_apophis$战斗。"
 building_cairo_temple_ra_03: "拉神庙"
 building_cairo_temple_ra_03_desc: "当两兄弟冲突爆发时，拉已垂垂老矣。虽有人指责他决策的后果，他仍被尊为强大的太阳神。"
 building_cairo_temple_ra_04: "拉大神庙"
 building_cairo_temple_ra_04_desc: "拉从冥界守护凯姆，他的光芒温暖笼罩大地。当$glossary_wyrm_apophis$的爪牙在他的威能下颤抖时，人们仍来朝拜太阳神。对吸血鬼而言，能违逆神的诅咒行走于阳光之下——哪怕仅有一天——正是拉神伟力的明证。"
 POD_cairo_temple_ra_bonus: "获得对所有埃及起源[artifact|El]的[artifact_claim|E]"
 building_type_cairo_temple_osiris_01: "奥西里斯神庙"
 building_type_cairo_temple_osiris_01_desc: "#F 奥西里斯，复活之王。最初被堤丰初拥，后超越诅咒成为第一个不死者#!"
 building_cairo_temple_osiris_01: "奥西里斯神龛"
 building_cairo_temple_osiris_01_desc: "奥西里斯将兄弟赛特放逐至沙漠，“永世不得再见故土阳光”。此言成为预言，黑暗很快笼罩了黑土地。"
 building_cairo_temple_osiris_02: "奥西里斯祭坛"
 building_cairo_temple_osiris_02_desc: "名为堤丰的陌生人来到奥西里斯皇庭。他的甜言蜜语与可怕预言引起了奥西里斯的兴趣。在第四次拜访后，奥西里斯以全新形态苏醒，接受了诅咒——只为应对堤丰预言的威胁。"
 building_cairo_temple_osiris_03: "奥西里斯神庙"
 building_cairo_temple_osiris_03_desc: "赛特归来时已完全接受吸血鬼诅咒，自愿成为$glossary_wyrm_apophis$的蛇。他用诡计将奥西里斯分尸十四块，黑血渗入尼罗河与沙土，永远将黑土地与死者之国相连。"
 building_cairo_temple_osiris_04: "奥西里斯大神庙"
 building_cairo_temple_osiris_04_desc: "诚追随者收集奥西里斯遗骸，以血为媒施法复活了他。当赛特用火焰裹尸布将其焚为随风飘散的骨灰时，奥西里斯的灵魂已回归杜亚特，如今在沙之冥府阿蒙提守望人间。"
 POD_cairo_temple_osiris_bonus: "#help 如果你已经掌握[hekau_necromancy_lifestyle|E]:#!\n束缚的$POD_splat_wraith_plural$将不会消耗任何[stress|E]来维持\n\n#help 如果你未掌握:#!\n解锁[hekau_necromancy_lifestyle|E]"
 building_type_cairo_temple_isis_01: "伊西斯神庙"
 building_type_cairo_temple_isis_01_desc: "#F 伊西斯，伟力大法师，众神之母。生命神咒的创造者#!"
 building_cairo_temple_isis_01: "伊西斯神龛"
 building_cairo_temple_isis_01_desc: "赛特背叛后，伊西斯带着儿子荷鲁斯与妹妹奈芙蒂斯逃往凯米斯岛，试图用魔法定位奥西里斯遗体。"
 building_cairo_temple_isis_02: "伊西斯祭坛"
 building_cairo_temple_isis_02_desc: "赛特囚禁了母子，每夜折磨，最终挖出荷鲁斯之眼与其巴魂。此后全赖伊西斯的强大魔法维系荷鲁斯生命。"
 building_cairo_temple_isis_03: "伊西斯神庙"
 building_cairo_temple_isis_03_desc: "获救的伊西斯找回奥西里斯残躯。复活后的奥西里斯将冥界所学尽授姐妹，伊西斯由此创出生命神咒拯救了荷鲁斯。"
 building_cairo_temple_isis_04: "伊西斯大神庙"
 building_cairo_temple_isis_04_desc: "当赛特来袭时，受生命神咒强化的荷鲁斯阉割了赛特，夺回被窃的眼睛解放巴魂。伊西斯随后将生命神咒传授给精通赫考的追随者，让他们在未来辅佐其子。"
 POD_cairo_temple_isis_bonus: "#help 若可学习#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter]  #L 术法#!:#!#!\n提升任何宗师之道[journey|E]的进度\n\n#help 若不可:#!\n解锁强化[crafting_node|E]，根据宝物类型添加[GetPerk('numina_enchantment_5_perk').GetName(GetPlayer)]强度的修正"
 building_type_cairo_temple_thoth_01: "托特神庙"
 building_type_cairo_temple_thoth_01_desc: "#F 托特，魔法之神与知识传播者。他的教导改变了黑暗之地的命运#!"
 building_cairo_temple_thoth_01: "托特神龛"
 building_cairo_temple_thoth_01_desc: "又一位陌生人白昼造访奥西里斯王庭。不同于堤丰，他直接求见伊西斯姐妹。"
 building_cairo_temple_thoth_02: "托特祭坛"
 building_cairo_temple_thoth_02_desc: "托特向精通赫考的姐妹传授万物[Glossary('真名','podgloss.truename')]与深层魔法奥秘，使她们成为凯姆最伟大的巫师。"
 building_cairo_temple_thoth_03: "托特神庙"
 building_cairo_temple_thoth_03_desc: "教导数月后托特离去，但他的知识遗产永存。"
 building_cairo_temple_thoth_04: "托特大神庙"
 building_cairo_temple_thoth_04_desc: "托特在梦中教导伊西斯复活奥西里斯的方法，这些知识成为伊西斯密教与阿蒙提共修的赫考之道基础。"
 POD_cairo_temple_thoth_bonus: "#help 如果你[GetTrait('mummy').GetName(GetNullCharacter)]或[GetTrait('bastet').GetName(GetNullCharacter)]:#!\n降低制造[gold|E]消耗25%\n\n#help 若非:#!\n解锁强化[crafting_node|E]，添加提升随机[skill|E]的[modifier|E] ([GetModifier('enchantment_attribute_diplomacy_modifier').GetNameWithTooltip])."
 building_type_cairo_temple_bast_01: "芭丝特神庙"
 building_type_cairo_temple_bast_01_desc: "#F 芭丝特，布巴斯提猫人的女神。埃及的慈母与暴怒守护者#!"
 building_cairo_temple_bast_01: "芭丝特神龛"
 building_cairo_temple_bast_01_desc: "伊西斯一行逃亡时曾受布巴斯提族庇护"
 building_cairo_temple_bast_02: "芭丝特祭坛"
 building_cairo_temple_bast_02_desc: "赛特获胜后诅咒了布巴斯提族。若所有布巴斯提离开黑土地，他们将很快灭绝。"
 building_cairo_temple_bast_03: "芭丝特神殿"
 building_cairo_temple_bast_03_desc: "伴随诅咒，卑劣的赛特之子捕获了布巴斯提的猫族亲族凯布尔猫，将其杀害或喂血改造成畸形怪物。"
 building_cairo_temple_bast_04: "芭丝特大神殿"
 building_cairo_temple_bast_04_desc: "随着开罗光复和赛特之子败退，布巴斯提重获自由。如今布巴斯提带着新仇与赛特之子开战。"
 POD_cairo_temple_bast_bonus: "#help 如果你是$glossary_fera$:#!\n在[infiltration_missions|E]中以[EmptyScope.ScriptValue('infiltration_small_perk_suspicion_offset')|V0][suspicion_with_icon|E]开始\n\n#help 若非:#!\n解锁决议来培养[GetTrait('beast_born').GetName(GetNullCharacter)][GetTrait('bastet').GetName(GetNullCharacter)]"
 building_type_cairo_temple_sobek_01: "索贝克神殿"
 building_type_cairo_temple_sobek_01_desc: "#F 鳄鱼神索贝克，尼罗河莫科莱的酋长，众神守护者#!"
 building_cairo_temple_sobek_01: "索贝克神龛"
 building_cairo_temple_sobek_01_desc: "除布巴斯提外，还有一群庇护伊西斯同盟的存在——尼罗河的鳄鱼化形者及其酋长索贝克，他们公然反抗赛特。"
 building_cairo_temple_sobek_02: "索贝克祭坛"
 building_cairo_temple_sobek_02_desc: "他们虽强大但寡不敌众，鳄鱼化形者最终被赛特大军击败。"
 building_cairo_temple_sobek_03: "索贝克神殿"
 building_cairo_temple_sobek_03_desc: "伟大的索贝克被赛特的血祭仪式腐蚀，成为首个也是唯一的莫科莱恶煞。"
 building_cairo_temple_sobek_04: "索贝克大神殿"
 building_cairo_temple_sobek_04_desc: "如今索贝克沉睡在被豢养的鳄鱼群中，昔日神格沦为笑谈。但鳄鱼神仍有希望重归玛特之道。"
 POD_cairo_temple_sobek_bonus: "#help 若已掌握或可学习天气魔法:#!\n将[GetModifier('weather_magic_flood_modifier').GetNameWithTooltip]替换为[GetModifier('weather_magic_greater_flood_modifier').GetNameWithTooltip]\n\n#help 若非:#!\n[GetModifier('weather_magic_flood_modifier').GetNameWithTooltip]的影响范围扩展至[duchy|E]"
 building_type_cairo_caern_wind_01: "季风圣地"
 building_type_cairo_caern_wind_01_desc: "#F 寂静漫游者自奥西里斯时代便已存在。这处古老圣地拥有全埃及最多的月桥#!"
 building_cairo_caern_wind_01: "破败的季风圣地"
 building_cairo_caern_wind_01_desc: "荷鲁斯初次重生并阉割赛特后，他与母亲伊西斯在西奈半岛的寂静漫游者处避难"
 building_cairo_caern_wind_02: "新兴的季风圣地"
 building_cairo_caern_wind_02_desc: "寂静漫游者加入荷鲁斯圣战，成为首批加入$glossary_osirian_league$的部族"
 building_cairo_caern_wind_03: "扩张的季风圣地"
 building_cairo_caern_wind_03_desc: "赛特败北时诅咒他们，切断部族与祖先精魂的联系，并将其驱逐出凯姆之地"
 building_cairo_caern_wind_04: "宏伟的季风圣地"
 building_cairo_caern_wind_04_desc: "尽管无法真正回归凯姆，豺首的漫游者仍是玛特之道的坚定捍卫者"
 POD_cairo_caern_wind_bonus: "#help 如果你是[GetTrait('werewolf').GetName(GetNullCharacter)]:#!\n[umbra|E]行星[artifacts|E]成本降低500[grace_i]\n\n#help 如果不是:#!\n解锁月桥[character_interaction|E]"
