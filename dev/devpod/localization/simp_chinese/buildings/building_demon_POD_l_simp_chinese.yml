l_simp_chinese:
 building_type_bastion_01: "要塞"
 building_type_bastion_01_desc: "#F 要塞是反叛的耶洛因在地球上的天怒之战中的据点，他们在那里聚集力量，完善他们的技能，并辅导他们的凡人妻妾。#!"
 building_bastion_01: "小型要塞"
 building_bastion_01_desc: "这里建立了一个小前哨。要建成要塞，还有很多工作要做。"
 building_bastion_02: "大型要塞"
 building_bastion_02_desc: "曾经的小前哨已经变成了一处不错的据点，你的地位现在相当强大。"
 building_bastion_03: "巨型要塞"
 building_bastion_03_desc: "这处庞大的建筑群错综复杂、勾心斗角，足以抵御你的敌人。"
 building_bastion_04: "超巨型要塞"
 building_bastion_04_desc: "威严而光荣的堡垒，这是你的力量，是你意志的证明。"
 building_bastion_05: "极巨型要塞"
 building_bastion_05_desc: "足以与天堂之门相匹敌，你的要塞可以抵御任何致命的攻击。"
 building_bastion_06: "至巨型要塞"
 building_bastion_06_desc: "在这里，你甚至可以经受启示录之火的考验。"
 building_type_ministry_of_dragons_01: "密教监察官"
 building_type_ministry_of_dragons_01_desc: "#F 龙部也被称为监察官，其使命是质疑和挑战权威。当然，这里的权威指上帝。#!"
 building_ministry_of_dragons_01: "次等密教监察官"
 building_ministry_of_dragons_01_desc: "在这，你有一些致力于其等愚蠢凡俗迷信的灵魂。"
 building_ministry_of_dragons_02: "像样密教监察官"
 building_ministry_of_dragons_02_desc: "模仿着仍被困在深渊中的堕天者，监察官已经开始成长。"
 building_ministry_of_dragons_03: "高级密教监察官"
 building_ministry_of_dragons_03_desc: "甚至你们周围的凡人也开始质疑他们的目的和神性本身，回应你的监察官的呼唤。"
 building_ministry_of_dragons_04: "上阶密教监察官"
 building_ministry_of_dragons_04_desc: "你们的监察机构现在在整个地区都有影响力，扩大了他们的权力，也扩大了你们的权力。"
 building_ministry_of_dragons_05: "强力密教监察官"
 building_ministry_of_dragons_05_desc: "现在，即使是其他地球生物也会在你的监察官的风化问题下犹豫，你们的影响是不可否认的。"
 building_ministry_of_dragons_06: "永恒密教监察官"
 building_ministry_of_dragons_06_desc: "万物非虚，万事皆允。除了你和你的真理。没有其他的信仰是安全的。"
 building_type_ministry_of_eagles_01: "密教观察者"
 building_type_ministry_of_eagles_01_desc: "#F 鹰部，也称观察者，其使命是获得有关潜在敌人的情报。#!"
 building_ministry_of_eagles_01: "次等密教观察者"
 building_ministry_of_eagles_01_desc: "你现在有一些间谍，你的第一批观察者，开始扩大你的视野。"
 building_ministry_of_eagles_02: "像样密教观察者"
 building_ministry_of_eagles_02_desc: "你的观察者现在已经遍布你的行动基地，并定期向你汇报。"
 building_ministry_of_eagles_03: "高级密教观察者"
 building_ministry_of_eagles_03_desc: "此地的人口中心现在就在你的注视下，很少有事情在你不知情的情况下发生。"
 building_ministry_of_eagles_04: "上阶密教观察者"
 building_ministry_of_eagles_04_desc: "秘密和八卦都为你所知，你的观察者的目光现在覆盖了农村地区，几乎没有什么东西能逃过你的视线。"
 building_ministry_of_eagles_05: "强力密教观察者"
 building_ministry_of_eagles_05_desc: "你的观察者现在知道这个地区的所有事情，你的间谍是无与伦比的，甚至让其他地球生物都羡慕不已。"
 building_ministry_of_eagles_06: "永恒密教观察者"
 building_ministry_of_eagles_06_desc: "据说凡人间流传着关于“老大哥”的传说。而你已经远超“老大哥”。"
 building_type_ministry_of_aurochs_01: "密教护卫者"
 building_type_ministry_of_aurochs_01_desc: "#F 牛部，也被称为护卫者，其使命是保卫王庭并执行其法律。#!"
 building_ministry_of_aurochs_01: "次等密教护卫者"
 building_ministry_of_aurochs_01_desc: "你现在有一小队保镖，即你的第一批护卫者，目的是在该领地保护你。"
 building_ministry_of_aurochs_02: "像样密教护卫者"
 building_ministry_of_aurochs_02_desc: "现在这里已有一小队部队，足以提供不错的安保。"
 building_ministry_of_aurochs_03: "高级密教护卫者"
 building_ministry_of_aurochs_03_desc: "现在你的权力程度足以让你拥有一支听命于你的护卫者小军队。"
 building_ministry_of_aurochs_04: "上阶密教护卫者"
 building_ministry_of_aurochs_04_desc: "你的护卫者开始在你的王庭蔓延，仅他们的影响力就能劝阻暴力（或在需要时鼓励它）。"
 building_ministry_of_aurochs_05: "强力密教护卫者"
 building_ministry_of_aurochs_05_desc: "护卫者现在相当于一支军队，其强度很少有人能与之相比，其力量几乎无人能及。"
 building_ministry_of_aurochs_06: "永恒密教护卫者"
 building_ministry_of_aurochs_06_desc: "天堂本身也需要考虑攻击这样的军队的利弊。"
 building_type_ministry_of_lions_01: "密教利剑"
 building_type_ministry_of_lions_01_desc: "#F 狮部，又称利剑，其使命是对抗对王庭的威胁。#!"
 building_ministry_of_lions_01: "次等密教利剑"
 building_ministry_of_lions_01_desc: "你已经与一些利剑签订了契约，他们现在充当你想要清除的当地人的“清洁工”。"
 building_ministry_of_lions_02: "像样密教利剑"
 building_ministry_of_lions_02_desc: "足以打一场漂亮的小仗的军事势力，你的利剑现在是你信任的心腹。"
 building_ministry_of_lions_03: "高级密教利剑"
 building_ministry_of_lions_03_desc: "你的利剑现在对整个城市进行控制，在你的召唤下在内部起义。"
 building_ministry_of_lions_04: "上阶密教利剑"
 building_ministry_of_lions_04_desc: "这是你扩大影响力的第一个迹象，其他堕天者已经开始惧怕你信任的利剑。"
 building_ministry_of_lions_05: "强力密教利剑"
 building_ministry_of_lions_05_desc: "凡人军队会害怕面对你的利剑，而你的触角更进一步，使之成为你野心的燃烧之剑。"
 building_ministry_of_lions_06: "永恒密教利剑"
 building_ministry_of_lions_06_desc: "天堂也该在你的势力面前颤抖。"
 building_type_ministry_of_dust_01: "密教引导者"
 building_type_ministry_of_dust_01_desc: "#F 尘部，也被称为人部或引导者，其使命是保管凡人群众，以及推动王庭的发展。#!"
 building_ministry_of_dust_01: "次等密教引导者"
 building_ministry_of_dust_01_desc: "一些守卫已经被安排到你的密教徒中，目前是一股看不见的势力，在需要时必须警告你。"
 building_ministry_of_dust_02: "像样密教引导者"
 building_ministry_of_dust_02_desc: "你的引导者现在在他们居住的小地方对你的密教保持着警惕。"
 building_ministry_of_dust_03: "高级密教引导者"
 building_ministry_of_dust_03_desc: "引导者经常充当联络人，现在是你的密教徒和他们敌人的生活中永远的关注点。"
 building_ministry_of_dust_04: "上阶密教引导者"
 building_ministry_of_dust_04_desc: "引导者现在掌握着本地领地的更大权力，坚定地守护着你的信仰和力量来源。"
 building_ministry_of_dust_05: "强力密教引导者"
 building_ministry_of_dust_05_desc: "引导者现在是你领地的杰出者，你的信徒安全并受到保护，他们的敌人不敢伤害你珍贵的信仰储备。"
 building_ministry_of_dust_06: "永恒密教引导者"
 building_ministry_of_dust_06_desc: "尘归尘，土归土，这里的一切都在你永恒的注视下保持安全。"
 building_type_theistic_cults_01: "有神论密教"
 building_type_theistic_cults_01_desc: "#F 有神论，或相信存在着对人类有个人兴趣的神，给了恶魔无数机会进入已经建立的宗教体系并颠覆它们。这些密教围绕着对冒充神或女神的恶魔崇拜而展开，通常为民族神，模仿传说中的神灵并亲自与他们的信徒互动。#!"
 building_theistic_cults_01: "微型有神论密教"
 building_theistic_cults_01_desc: "在数个神圣之地内，你的力量的低语已经开始。"
 building_theistic_cults_02: "小型有神论密教"
 building_theistic_cults_02_desc: "一些圣洁的人不再圣洁了，你的魔奴数现在开始真正增长。"
 building_theistic_cults_03: "中型有神论密教"
 building_theistic_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_theistic_cults_04: "大型有神论密教"
 building_theistic_cults_04_desc: "城里的每个人都知道你的首席牧师的名字，让你可以随意吸食信仰，真好！"
 building_theistic_cults_05: "巨型有神论密教"
 building_theistic_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_theistic_cults_06: "永恒有神论密教"
 building_theistic_cults_06_desc: "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_pseudo_angelic_cults_01: "伪天使密教"
 building_type_pseudo_angelic_cults_01_desc: "#F 易受骗的盲目群众是极好的信徒，准备好听关于你是救赎和上帝选民的谎言。#!"
 building_pseudo_angelic_cults_01: "微型伪天使密教"
 building_pseudo_angelic_cults_01_desc: "在数个社群内，你的力量的低语已经开始。"
 building_pseudo_angelic_cults_02: "小型伪天使密教"
 building_pseudo_angelic_cults_02_desc: "人们对他们的救世主有了更多的了解，你的魔奴数现在开始真正增长。"
 building_pseudo_angelic_cults_03: "中型伪天使密教"
 building_pseudo_angelic_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_pseudo_angelic_cults_04: "大型伪天使密教"
 building_pseudo_angelic_cults_04_desc: "城里的每个人都知道他们的神的名字，让你可以随意吸食信仰，真好！"
 building_pseudo_angelic_cults_05: "巨型伪天使密教"
 building_pseudo_angelic_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_pseudo_angelic_cults_06: "永恒伪天使密教"
 building_pseudo_angelic_cults_06_desc: "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_demonic_cults_01: "恶魔密教"
 building_type_demonic_cults_01_desc: "#F 虽然实际上来讲，所有有恶魔崇拜的密教都可以被称为恶魔密教，但这个词在这里指的是服务于恶魔的密教，它没有试图掩盖其真实性质。恶魔密教的信徒对他们所崇拜的生物不抱任何妄想。#!"
 building_demonic_cults_01: "微型恶魔密教"
 building_demonic_cults_01_desc: "在数个被玷污的家庭内，你的力量的低语已经开始。"
 building_demonic_cults_02: "小型恶魔密教"
 building_demonic_cults_02_desc: "一些罪人出现了，你的魔奴数现在开始真正增长。"
 building_demonic_cults_03: "中型恶魔密教"
 building_demonic_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_demonic_cults_04: "大型恶魔密教"
 building_demonic_cults_04_desc: "城里的每个人都知道罪恶的真正乐趣，让你可以随意吸食信仰，真好！"
 building_demonic_cults_05: "巨型恶魔密教"
 building_demonic_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_demonic_cults_06: "永恒恶魔密教"
 building_demonic_cults_06_desc: "他们知道你的真实身份，并因此爱你。"
 building_type_noble_cults_01: "贵族密教"
 building_type_noble_cults_01_desc: "#F 贵族是非常容易腐化的。毕竟，他们的生活方式使他们沉溺于许多罪恶之中，使“多体验一点”的推动更加有效。#!"
 building_noble_cults_01: "微型贵族密教"
 building_noble_cults_01_desc: "在数个城堡墙内，你的力量的低语已经开始。"
 building_noble_cults_02: "小型贵族密教"
 building_noble_cults_02_desc: "一些堕落的贵族听从你的号召，你的魔奴数现在开始真正增长。"
 building_noble_cults_03: "中型贵族密教"
 building_noble_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_noble_cults_04: "大型贵族密教"
 building_noble_cults_04_desc: "城里的每个人都知道你能提供的享受，让你可以随意吸食信仰，真好！"
 building_noble_cults_05: "巨型贵族密教"
 building_noble_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_noble_cults_06: "永恒贵族密教"
 building_noble_cults_06_desc: "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_tower_of_pride_01: "Tower of Babel"
 building_type_tower_of_pride_01_desc: "Mortals had the right idea back in the day. They just lacked the willpower to truly defy God."
 building_tower_of_pride_01: "Tiny Tower of Babel"
 building_tower_of_pride_01_desc: "Now the whole earth had one language and the same words. And as they migrated from the east, they came upon a plain in the land of Shinar and settled there. And they said to one another, \"Come, let us make bricks and fire them thoroughly.\" And they had brick for stone and bitumen for mortar."
 building_tower_of_pride_02: "Small Tower of Babel"
 building_tower_of_pride_02_desc: "Then they said, \"Come, let us build ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves; otherwise we shall be scattered abroad upon the face of the whole earth."
 building_tower_of_pride_03: "Medium Tower of Babel"
 building_tower_of_pride_03_desc: "The Lord came down to see the city and the tower, which mortals had built. And the Lord said, \"Look, they are one people, and they have all one language, and this is only the beginning of what they will do; nothing that they propose to do will now be impossible for them."
 building_tower_of_pride_04: "Huge Tower of Babel"
 building_tower_of_pride_04_desc: "Come, let us go down and confuse their language there, so that they will not understand one another's speech.\" So the Lord scattered them abroad from there over the face of all the earth, and they left off building the city."
 building_tower_of_pride_05: "Massive Tower of Babel"
 building_tower_of_pride_05_desc: "Therefore it was called Babel, because there the Lord confused (balal) the language of all the earth, and from there the Lord scattered them abroad over the face of all the earth."
 building_type_treasury_of_avarice_01: "Golden Calf"
 building_type_treasury_of_avarice_01_desc: "The true symbol of greed, once struck down by God, now returned to enthrall mortals."
 building_treasury_of_avarice_01: "Tiny Golden Calf"
 building_treasury_of_avarice_01_desc: "Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal."
 building_treasury_of_avarice_02: "Small Golden Calf"
 building_treasury_of_avarice_02_desc: "But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal."
 building_treasury_of_avarice_03: "Medium Golden Calf"
 building_treasury_of_avarice_03_desc: "For where your treasure is, there will your heart be also. No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other."
 building_treasury_of_avarice_04: "Huge Golden Calf"
 building_treasury_of_avarice_04_desc: "Ye cannot serve God and Mammon"
 building_treasury_of_avarice_05: "Massive Golden Calf"
 building_treasury_of_avarice_05_desc: "They think only of Mammon, whose God is the purse"
 building_type_pit_of_wrath_01: "Pit Of Wrath"
 building_type_pit_of_wrath_01_desc: "They fear the truth. In the end, they are just monsters denying themselves their rightful urges."
 building_pit_of_wrath_01: "Tiny Pit Of Wrath"
 building_pit_of_wrath_01_desc: "Cease from anger, and forsake wrath: fret not thyself in any wise to do evil."
 building_pit_of_wrath_02: "Small Pit Of Wrath"
 building_pit_of_wrath_02_desc: "Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord."
 building_pit_of_wrath_03: "Medium Pit Of Wrath"
 building_pit_of_wrath_03_desc: "For the wrath of man worketh not the righteousness of God."
 building_pit_of_wrath_04: "Huge Pit Of Wrath"
 building_pit_of_wrath_04_desc: "And I will execute great vengeance upon them with furious rebukes; and they shall know that I am the LORD, when I shall lay my vengeance upon them."
 building_pit_of_wrath_05: "Massive Pit Of Wrath"
 building_pit_of_wrath_05_desc: "Be ye angry, and sin not: let not the sun go down upon your wrath: Neither give place to the devil."
 building_type_hall_of_gluttony_01: "Hall Of Gluttony"
 building_type_hall_of_gluttony_01_desc: "Eat, drink and never ever deny yourself whatever desire you crave."
 building_hall_of_gluttony_01: "Tiny Hall Of Gluttony"
 building_hall_of_gluttony_01_desc: "Be not among drunkards or among gluttonous eaters of meat, for the drunkard and the glutton will come to poverty, and slumber will clothe them with rags."
 building_hall_of_gluttony_02: "Small Hall Of Gluttony"
 building_hall_of_gluttony_02_desc: "If you have found honey, eat only enough for you, lest you have your fill of it and vomit it."
 building_hall_of_gluttony_03: "Medium Hall Of Gluttony"
 building_hall_of_gluttony_03_desc: "So, whether you eat or drink, or whatever you do, do all to the glory of God."
 building_hall_of_gluttony_04: "Huge Hall Of Gluttony"
 building_hall_of_gluttony_04_desc: "But put on the Lord Jesus Christ, and make no provision for the flesh, to gratify its desires."
 building_hall_of_gluttony_05: "Massive Hall Of Gluttony"
 building_hall_of_gluttony_05_desc: "For many, of whom I have often told you and now tell you even with tears, walk as enemies of the cross of Christ. Their end is destruction, their god is their belly, and they glory in their shame, with minds set on earthly things."
 activity_feast_province_desc_hall_of_gluttony_01: "#P + $building_hall_of_gluttony_01$#!"
 activity_feast_province_desc_hall_of_gluttony_02: "#P + $building_hall_of_gluttony_02$#!"
 activity_feast_province_desc_hall_of_gluttony_03: "#P ++ $building_hall_of_gluttony_03$#!"
 activity_feast_province_desc_hall_of_gluttony_04: "#P +++ $building_hall_of_gluttony_04$#!"
 activity_feast_province_desc_hall_of_gluttony_05: "#P ++++ $building_hall_of_gluttony_05$#!"
 feast_cost_discount_hall_of_gluttony_01: "Location has $building_hall_of_gluttony_01$"
 feast_cost_discount_hall_of_gluttony_02: "Location has $building_hall_of_gluttony_02$"
 feast_cost_discount_hall_of_gluttony_03: "Location has $building_hall_of_gluttony_03$"
 feast_cost_discount_hall_of_gluttony_04: "Location has $building_hall_of_gluttony_04$"
 feast_cost_discount_hall_of_gluttony_05: "Location has $building_hall_of_gluttony_05$"
 building_type_inn_of_lust_01: "Garden of Pleasures"
 building_type_inn_of_lust_01_desc: "Nothing is forbidden here, except repressing your darkest desires."
 building_inn_of_lust_01: "Tiny Garden of Pleasures"
 building_inn_of_lust_01_desc: "For all that is in the world—the desires of the flesh and the desires of the eyes and pride of life—is not from the Father but is from the world."
 building_inn_of_lust_02: "Small Garden of Pleasures"
 building_inn_of_lust_02_desc: "But I say to you that everyone who looks at a woman with lustful intent has already committed adultery with her in his heart."
 building_inn_of_lust_03: "Medium Garden of Pleasures"
 building_inn_of_lust_03_desc: "But I say, walk by the Spirit, and you will not gratify the desires of the flesh."
 building_inn_of_lust_04: "Huge Garden of Pleasures"
 building_inn_of_lust_04_desc: "Put to death therefore what is earthly in you: sexual immorality, impurity, passion, evil desire, and covetousness, which is idolatry."
 building_inn_of_lust_05: "Massive Garden of Pleasures"
 building_inn_of_lust_05_desc: "Flee from sexual immorality. Every other sin a person commits is outside the body, but the sexually immoral person sins against his own body."
 building_type_house_of_sloth_01: "House of Sloth"
 building_type_house_of_sloth_01_desc: "The sleep, the void, the darkness... the natural state of reality that you long to return to."
 building_house_of_sloth_01: "Tiny House of Sloth"
 building_house_of_sloth_01_desc: "The soul of the sluggard craves and gets nothing, while the soul of the diligent is richly supplied."
 building_house_of_sloth_02: "Small House of Sloth"
 building_house_of_sloth_02_desc: "The hand of the diligent will rule, while the slothful will be put to forced labor."
 building_house_of_sloth_03: "Medium House of Sloth"
 building_house_of_sloth_03_desc: "Whatever you do, work heartily, as for the Lord and not for men."
 building_house_of_sloth_04: "Huge House of Sloth"
 building_house_of_sloth_04_desc: "The way of a sluggard is like a hedge of thorns, but the path of the upright is a level highway."
 building_house_of_sloth_05: "Massive House of Sloth"
 building_house_of_sloth_05_desc: "Through sloth the roof sinks in, and through indolence the house leaks."
 building_type_department_of_envy_01: "Palace of Envy"
 building_type_department_of_envy_01_desc: "When you have it all, they will envy you and crave what you will never give them."
 building_department_of_envy_01: "Tiny Palace of Envy"
 building_department_of_envy_01_desc: "Let us not become conceited, provoking and envying each other"
 building_department_of_envy_02: "Small Palace of Envy"
 building_department_of_envy_02_desc: "Therefore, rid yourselves of all malice and all deceit, hypocrisy, envy, and slander of every kind."
 building_department_of_envy_03: "Medium Palace of Envy"
 building_department_of_envy_03_desc: "They have become filled with every kind of wickedness, evil, greed and depravity. They are full of envy, murder, strife, deceit and malice. They are gossips."
 building_department_of_envy_04: "Huge Palace of Envy"
 building_department_of_envy_04_desc: "But if you harbor bitter envy and selfish ambition in your hearts, do not boast about it or deny the truth."
 building_department_of_envy_05: "Massive Palace of Envy"
 building_department_of_envy_05_desc: "For where you have envy and selfish ambition, there you find disorder and every evil practice."
 feast_cost_discount_min_medium_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_min_medium_value')|P0%]"
 feast_cost_discount_medium_max_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_medium_max_value')|P0%]"