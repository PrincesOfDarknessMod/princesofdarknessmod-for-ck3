 building_type_inn_of_lust_01: "愉悦庭园"
 building_type_inn_of_lust_01_desc: "在这里没有什么是被禁止的，除了压抑你最黑暗的欲望。"
 building_inn_of_lust_01: "微型纵欲之庭"
 building_inn_of_lust_01_desc: "#italic 因为，凡世界上的事，就像肉体的情欲、眼目的情欲，并今生的骄傲，都不是从父来的，乃是从世界来的。#!"
 building_inn_of_lust_02: "小型纵欲之庭"
 building_inn_of_lust_02_desc: "#italic 但是我告诉你们：所有怀着欲念看女人的，就已经在心里和她通奸了。#!"
 building_inn_of_lust_03: "中型纵欲之庭"
 building_inn_of_lust_03_desc: "#italic 我说，你们当顺着圣灵而行，就不放纵肉体的情欲了。#!"
 building_inn_of_lust_04: "大型纵欲之庭"
 building_inn_of_lust_04_desc: "#italic 所以，要治死你们在地上的肢体，就如淫乱、污秽、邪情、恶欲，和贪婪，就与拜偶像一样。#!"
 building_inn_of_lust_05: "巨型纵欲之庭"
 building_inn_of_lust_05_desc: "#italic 远离不道德的性行为。人所犯的其他一切罪都是在身体之外，但淫乱的人是对自己的身体犯罪。岂不知你们的身体是你们里面圣灵的殿吗？#!"
 building_type_house_of_sloth_01: "怠惰之屋"
 building_type_house_of_sloth_01_desc: "沉睡，虚空，黑暗……你所渴望回归的自然现实。"
 building_house_of_sloth_01: "微型怠惰之屋"
 building_house_of_sloth_01_desc: "#italic 懒惰人贪得无厌，但他的欲望一无所得；殷勤人的欲求，却必得满足。#!"
 building_house_of_sloth_02: "小型怠惰之屋"
 building_house_of_sloth_02_desc: "#italic 殷勤人的手必掌权，懒惰人却必服苦役。#!"
 building_house_of_sloth_03: "中型怠惰之屋"
 building_house_of_sloth_03_desc: "#italic 无论作什么，都要从心里作，像是给主作的，不是给人作的。#!"
 building_house_of_sloth_04: "大型怠惰之屋"
 building_house_of_sloth_04_desc: "#italic 懒惰人的路好像荆棘篱笆，正直人的路却是平坦大道。#!"
 building_house_of_sloth_05: "巨型怠惰之屋"
 building_house_of_sloth_05_desc: "#italic 因人懒惰，房顶塌下：因人手懒，房屋滴漏。#!"
 building_type_department_of_envy_01: "嫉妒之宫"
 building_type_department_of_envy_01_desc: "当你拥有一切时，他们会嫉妒你，渴求你永远不会给予他们的东西。"
 building_department_of_envy_01: "微型嫉妒之宫"
 building_department_of_envy_01_desc: "#italic 我们不要自高自大，彼此惹气，互相嫉妒。#!"
 building_department_of_envy_02: "小型嫉妒之宫"
 building_department_of_envy_02_desc: " #italic 所以要除去一切恶毒、一切诡诈、虚伪、嫉妒和一切毁谤的话。#!"
 building_department_of_envy_03: "中型嫉妒之宫"
 building_department_of_envy_03_desc: "#italic 他们充满了各种不义、邪恶、贪心、恶毒；满心是嫉妒、凶杀、纷争、欺诈、狠毒。他们搬弄是非。#!"
 building_department_of_envy_04: "大型嫉妒之宫"
 building_department_of_envy_04_desc: "#italic 你们心里若怀着苦毒的嫉恨与纷争，就不可夸口，也不可谎言说自己得着真理。#!"
 building_department_of_envy_05: "巨型嫉妒之宫"
 building_department_of_envy_05_desc: "#italic 因为凡有嫉妒和自私的地方，就必有扰乱和各样的坏事。 #!"
