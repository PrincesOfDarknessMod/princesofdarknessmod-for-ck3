l_simp_chinese:
 building_type_bastion_01: "要塞"
 building_type_bastion_01_desc: "#F 要塞是反叛的耶洛因在地球上的天怒之战中的据点，他们在那里聚集力量，完善他们的技能，并辅导他们的凡人妻妾。#!"
 building_bastion_01: "小型要塞"
 building_bastion_01_desc: "这里建立了一个小前哨。要建成要塞，还有很多工作要做。"
 building_bastion_02: "大型要塞"
 building_bastion_02_desc: "曾经的小前哨已经变成了一处不错的据点，你的地位现在相当强大。"
 building_bastion_03: "巨型要塞"
 building_bastion_03_desc: "这处庞大的建筑群错综复杂、勾心斗角，足以抵御你的敌人。"
 building_bastion_04: "超巨型要塞"
 building_bastion_04_desc: "威严而光荣的堡垒，这是你的力量，是你意志的证明。"
 building_bastion_05: "极巨型要塞"
 building_bastion_05_desc: "足以与天堂之门相匹敌，你的要塞可以抵御任何致命的攻击。"
 building_bastion_06: "至巨型要塞"
 building_bastion_06_desc: "在这里，你甚至可以经受启示录之火的考验。"
 building_type_ministry_of_dragons_01: "密教监察官"
 building_type_ministry_of_dragons_01_desc: "#F 龙部也被称为监察官，其使命是质疑和挑战权威。当然，这里的权威指上帝。#!"
 building_ministry_of_dragons_01: "次等密教监察官"
 building_ministry_of_dragons_01_desc: "在这，你有一些致力于其等愚蠢凡俗迷信的灵魂。"
 building_ministry_of_dragons_02: "像样密教监察官"
 building_ministry_of_dragons_02_desc: "模仿着仍被困在深渊中的堕天者，监察官已经开始成长。"
 building_ministry_of_dragons_03: "高级密教监察官"
 building_ministry_of_dragons_03_desc: "甚至你们周围的凡人也开始质疑他们的目的和神性本身，回应你的监察官的呼唤。"
 building_ministry_of_dragons_04: "上阶密教监察官"
 building_ministry_of_dragons_04_desc: "你们的监察机构现在在整个地区都有影响力，扩大了他们的权力，也扩大了你们的权力。"
 building_ministry_of_dragons_05: "强力密教监察官"
 building_ministry_of_dragons_05_desc: "现在，即使是其他地球生物也会在你的监察官的风化问题下犹豫，你们的影响是不可否认的。"
 building_ministry_of_dragons_06: "永恒密教监察官"
 building_ministry_of_dragons_06_desc: "万物非虚，万事皆允。除了你和你的真理。没有其他的信仰是安全的。"
 building_type_ministry_of_eagles_01: "密教观察者"
 building_type_ministry_of_eagles_01_desc: "#F 鹰部，也称观察者，其使命是获得有关潜在敌人的情报。#!"
 building_ministry_of_eagles_01: "次等密教观察者"
 building_ministry_of_eagles_01_desc: "你现在有一些间谍，你的第一批观察者，开始扩大你的视野。"
 building_ministry_of_eagles_02: "像样密教观察者"
 building_ministry_of_eagles_02_desc: "你的观察者现在已经遍布你的行动基地，并定期向你汇报。"
 building_ministry_of_eagles_03: "高级密教观察者"
 building_ministry_of_eagles_03_desc: "此地的人口中心现在就在你的注视下，很少有事情在你不知情的情况下发生。"
 building_ministry_of_eagles_04: "上阶密教观察者"
 building_ministry_of_eagles_04_desc: "秘密和八卦都为你所知，你的观察者的目光现在覆盖了农村地区，几乎没有什么东西能逃过你的视线。"
 building_ministry_of_eagles_05: "强力密教观察者"
 building_ministry_of_eagles_05_desc: "你的观察者现在知道这个地区的所有事情，你的间谍是无与伦比的，甚至让其他地球生物都羡慕不已。"
 building_ministry_of_eagles_06: "永恒密教观察者"
 building_ministry_of_eagles_06_desc: "据说凡人间流传着关于“老大哥”的传说。而你已经远超“老大哥”。"
 building_type_ministry_of_aurochs_01: "密教护卫者"
 building_type_ministry_of_aurochs_01_desc: "#F 牛部，也被称为护卫者，其使命是保卫王庭并执行其法律。#!"
 building_ministry_of_aurochs_01: "次等密教护卫者"
 building_ministry_of_aurochs_01_desc: "你现在有一小队保镖，即你的第一批护卫者，目的是在该领地保护你。"
 building_ministry_of_aurochs_02: "像样密教护卫者"
 building_ministry_of_aurochs_02_desc: "现在这里已有一小队部队，足以提供不错的安保。"
 building_ministry_of_aurochs_03: "高级密教护卫者"
 building_ministry_of_aurochs_03_desc: "现在你的权力程度足以让你拥有一支听命于你的护卫者小军队。"
 building_ministry_of_aurochs_04: "上阶密教护卫者"
 building_ministry_of_aurochs_04_desc: "你的护卫者开始在你的王庭蔓延，仅他们的影响力就能劝阻暴力（或在需要时鼓励它）。"
 building_ministry_of_aurochs_05: "强力密教护卫者"
 building_ministry_of_aurochs_05_desc: "护卫者现在相当于一支军队，其强度很少有人能与之相比，其力量几乎无人能及。"
 building_ministry_of_aurochs_06: "永恒密教护卫者"
 building_ministry_of_aurochs_06_desc: "天堂本身也需要考虑攻击这样的军队的利弊。"
 building_type_ministry_of_lions_01: "密教利剑"
 building_type_ministry_of_lions_01_desc: "#F 狮部，又称利剑，其使命是对抗对王庭的威胁。#!"
 building_ministry_of_lions_01: "次等密教利剑"
 building_ministry_of_lions_01_desc: "你已经与一些利剑签订了契约，他们现在充当你想要清除的当地人的“清洁工”。"
 building_ministry_of_lions_02: "像样密教利剑"
 building_ministry_of_lions_02_desc: "足以打一场漂亮的小仗的军事势力，你的利剑现在是你信任的心腹。"
 building_ministry_of_lions_03: "高级密教利剑"
 building_ministry_of_lions_03_desc: "你的利剑现在对整个城市进行控制，在你的召唤下在内部起义。"
 building_ministry_of_lions_04: "上阶密教利剑"
 building_ministry_of_lions_04_desc: "这是你扩大影响力的第一个迹象，其他堕天者已经开始惧怕你信任的利剑。"
 building_ministry_of_lions_05: "强力密教利剑"
 building_ministry_of_lions_05_desc: "凡人军队会害怕面对你的利剑，而你的触角更进一步，使之成为你野心的燃烧之剑。"
 building_ministry_of_lions_06: "永恒密教利剑"
 building_ministry_of_lions_06_desc: "天堂也该在你的势力面前颤抖。"
 building_type_ministry_of_dust_01: "密教引导者"
 building_type_ministry_of_dust_01_desc: "#F 尘部，也被称为人部或引导者，其使命是保管凡人群众，以及推动王庭的发展。#!"
 building_ministry_of_dust_01: "次等密教引导者"
 building_ministry_of_dust_01_desc: "一些守卫已经被安排到你的密教徒中，目前是一股看不见的势力，在需要时必须警告你。"
 building_ministry_of_dust_02: "像样密教引导者"
 building_ministry_of_dust_02_desc: "你的引导者现在在他们居住的小地方对你的密教保持着警惕。"
 building_ministry_of_dust_03: "高级密教引导者"
 building_ministry_of_dust_03_desc: "引导者经常充当联络人，现在是你的密教徒和他们敌人的生活中永远的关注点。"
 building_ministry_of_dust_04: "上阶密教引导者"
 building_ministry_of_dust_04_desc: "引导者现在掌握着本地领地的更大权力，坚定地守护着你的信仰和力量来源。"
 building_ministry_of_dust_05: "强力密教引导者"
 building_ministry_of_dust_05_desc: "引导者现在是你领地的杰出者，你的信徒安全并受到保护，他们的敌人不敢伤害你珍贵的信仰储备。"
 building_ministry_of_dust_06: "永恒密教引导者"
 building_ministry_of_dust_06_desc: "尘归尘，土归土，这里的一切都在你永恒的注视下保持安全。"
 building_type_theistic_cults_01: "有神论密教"
 building_type_theistic_cults_01_desc: "#F 有神论，或相信存在着对人类有个人兴趣的神，给了恶魔无数机会进入已经建立的宗教体系并颠覆它们。这些密教围绕着对冒充神或女神的恶魔崇拜而展开，通常为民族神，模仿传说中的神灵并亲自与他们的信徒互动。#!"
 building_theistic_cults_01: "微型有神论密教"
 building_theistic_cults_01_desc: "在数个神圣之地内，你的力量的低语已经开始。"
 building_theistic_cults_02: "小型有神论密教"
 building_theistic_cults_02_desc: "一些圣洁的人不再圣洁了，你的魔奴数现在开始真正增长。"
 building_theistic_cults_03: "中型有神论密教"
 building_theistic_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_theistic_cults_04: "大型有神论密教"
 building_theistic_cults_04_desc: "城里的每个人都知道你的首席牧师的名字，让你可以随意吸食信仰，真好！"
 building_theistic_cults_05: "巨型有神论密教"
 building_theistic_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_theistic_cults_06: "永恒有神论密教"
 building_theistic_cults_06_desc: "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_pseudo_angelic_cults_01: "伪天使密教"
 building_type_pseudo_angelic_cults_01_desc: "#F 易受骗的盲目群众是极好的信徒，准备好听关于你是救赎和上帝选民的谎言。#!"
 building_pseudo_angelic_cults_01: "微型伪天使密教"
 building_pseudo_angelic_cults_01_desc: "在数个社群内，你的力量的低语已经开始。"
 building_pseudo_angelic_cults_02: "小型伪天使密教"
 building_pseudo_angelic_cults_02_desc: "人们对他们的救世主有了更多的了解，你的魔奴数现在开始真正增长。"
 building_pseudo_angelic_cults_03: "中型伪天使密教"
 building_pseudo_angelic_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_pseudo_angelic_cults_04: "大型伪天使密教"
 building_pseudo_angelic_cults_04_desc: "城里的每个人都知道他们的神的名字，让你可以随意吸食信仰，真好！"
 building_pseudo_angelic_cults_05: "巨型伪天使密教"
 building_pseudo_angelic_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_pseudo_angelic_cults_06: "永恒伪天使密教"
 building_pseudo_angelic_cults_06_desc: "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 building_type_demonic_cults_01: "恶魔密教"
 building_type_demonic_cults_01_desc: "#F 虽然实际上来讲，所有有恶魔崇拜的密教都可以被称为恶魔密教，但这个词在这里指的是服务于恶魔的密教，它没有试图掩盖其真实性质。恶魔密教的信徒对他们所崇拜的生物不抱任何妄想。#!"
 building_demonic_cults_01: "微型恶魔密教"
 building_demonic_cults_01_desc: "在数个被玷污的家庭内，你的力量的低语已经开始。"
 building_demonic_cults_02: "小型恶魔密教"
 building_demonic_cults_02_desc: "一些罪人出现了，你的魔奴数现在开始真正增长。"
 building_demonic_cults_03: "中型恶魔密教"
 building_demonic_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_demonic_cults_04: "大型恶魔密教"
 building_demonic_cults_04_desc: "城里的每个人都知道罪恶的真正乐趣，让你可以随意吸食信仰，真好！"
 building_demonic_cults_05: "巨型恶魔密教"
 building_demonic_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_demonic_cults_06: "永恒恶魔密教"
 building_demonic_cults_06_desc: "他们知道你的真实身份，并因此爱你。"
 building_type_noble_cults_01: "贵族密教"
 building_type_noble_cults_01_desc: "#F 贵族是非常容易腐化的。毕竟，他们的生活方式使他们沉溺于许多罪恶之中，使“多体验一点”的推动更加有效。#!"
 building_noble_cults_01: "微型贵族密教"
 building_noble_cults_01_desc: "在数个城堡墙内，你的力量的低语已经开始。"
 building_noble_cults_02: "小型贵族密教"
 building_noble_cults_02_desc: "一些堕落的贵族听从你的号召，你的魔奴数现在开始真正增长。"
 building_noble_cults_03: "中型贵族密教"
 building_noble_cults_03_desc: "你现在有一整座建筑秘密地献给对你的信仰，一个只属于你的力量和信仰的灯塔。"
 building_noble_cults_04: "大型贵族密教"
 building_noble_cults_04_desc: "城里的每个人都知道你能提供的享受，让你可以随意吸食信仰，真好！"
 building_noble_cults_05: "巨型贵族密教"
 building_noble_cults_05_desc: "你在凡人心中的影响力和信仰，已经发展成为这个地区的官方教义，比你过去所要求的更虔诚。"
 building_noble_cults_06: "永恒贵族密教"
 building_noble_cults_06_desc: "即使是很久以前的耶洛因的密教也不能与你们现在的情况相提并论。"
 feast_cost_discount_min_medium_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_min_medium_value')|P0%]"
 feast_cost_discount_medium_max_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_medium_max_value')|P0%]"