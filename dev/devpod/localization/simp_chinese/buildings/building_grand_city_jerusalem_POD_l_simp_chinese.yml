 building_type_jerusalem_divided_jewish_quarter_01: "犹太人区"
 building_type_jerusalem_divided_jewish_quarter_01_desc: "#F 犹太人区是耶路撒冷境内受压迫的犹太人和那些进行阿利亚者的家园。若他们的区得到改善，他们或许会允许接触其口传知识及隐秘图书馆。#!"
 building_jerusalem_divided_jewish_quarter_01: "犹太人区"
 building_jerusalem_divided_jewish_quarter_01_desc: "犹太人区是耶路撒冷境内受压迫的犹太人和那些进行阿利亚者的家园。若他们的区得到改善，他们或许会允许接触其口传知识及隐秘图书馆。"
