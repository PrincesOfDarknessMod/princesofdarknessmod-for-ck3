 jerusalem_christian_influence_1: "基督教:微弱影响"
 jerusalem_christian_influence_1_desc: "耶路撒冷城内的基督徒对当地经济、政治及宗教局势仅保有微弱的影响。$POD_jerusalem_modifier_suffix$"
 jerusalem_christian_influence_2: "基督教:统一权威"
 jerusalem_christian_influence_2_desc: "耶路撒冷城内的基督徒已巩固其权力，以对当地经济、政治与宗教局势施加更大影响。$POD_jerusalem_modifier_suffix$"
 jerusalem_christian_influence_3: "基督教:初显优势"
 jerusalem_christian_influence_3_desc: "耶路撒冷城内的基督徒已在当地经济、政治及宗教局势中建立起初显的优势。$POD_jerusalem_modifier_suffix$  "
 jerusalem_christian_influence_4: "基督教:政治主导"
 jerusalem_christian_influence_4_desc: "耶路撒冷城内的基督徒已在当地经济、政治及宗教局势中建立起政治主导地位。$POD_jerusalem_modifier_suffix$  "
