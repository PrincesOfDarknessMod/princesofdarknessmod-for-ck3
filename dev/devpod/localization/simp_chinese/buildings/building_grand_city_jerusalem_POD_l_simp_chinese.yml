 building_jerusalem_muslim_madrasa_03_desc: "$building_jerusalem_muslim_madrasa_01_desc$"
 building_type_jerusalem_muslim_al_yaqubi_01: "雅古比清真寺"
 building_type_jerusalem_muslim_al_yaqubi_01_desc: "#F 这座清真寺以一位伟大的阿拉伯历史学家和地理学家的名字命名，他记录了许多贾希利耶时代的传说以及从拜占庭帝国到中国关键城市的详细信息。他甚至追踪统计了这些城市的数据、税收细节和地形信息。#!"
 building_jerusalem_muslim_al_yaqubi_01: "雅古比清真寺"
 building_jerusalem_muslim_al_yaqubi_01_desc: "这座清真寺以一位伟大的阿拉伯历史学家和地理学家的名字命名，他记录了许多贾希利耶时代的传说以及从拜占庭帝国到中国关键城市的详细信息。他甚至追踪统计了这些城市的数据、税收细节和地形信息。"
 building_jerusalem_muslim_al_yaqubi_02: "翻新的雅古比清真寺"
 building_jerusalem_muslim_al_yaqubi_02_desc: "$building_jerusalem_muslim_al_yaqubi_01_desc$"
 building_jerusalem_muslim_al_yaqubi_03: "祝圣的雅古比清真寺"
 building_jerusalem_muslim_al_yaqubi_03_desc: "$building_jerusalem_muslim_al_yaqubi_01_desc$"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01: "萨拉希耶道堂清真寺"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "#F 这座清真寺以萨拉丁·优素福·本·阿尤布的名字命名，并曾为他扮演重要角色。在他生前，这座清真寺为他的军官提供住所，是他个人的灵修静居处，用于授课，并作为清真寺运作。此外，它先前是一座道堂，这意味着它在和平时期作为行会运作，在战争时期则作为军事修会。#!"
 building_jerusalem_muslim_al_khanqah_salahiyya_01: "萨拉希耶道堂清真寺"
 building_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "这座清真寺以萨拉丁·优素福·本·阿尤布的名字命名，并曾为他扮演重要角色。在他生前，这座清真寺为他的军官提供住所，是他个人的灵修静居处，用于授课，并作为清真寺运作。此外，它先前是一座道堂，这意味着它在和平时期作为行会运作，在战争时期则作为军事修会。"
 building_jerusalem_muslim_al_khanqah_salahiyya_02: "翻新的萨拉希耶道堂清真寺"
 building_jerusalem_muslim_al_khanqah_salahiyya_02_desc: "$building_jerusalem_muslim_al_khanqah_salahiyya_01_desc$"
 building_jerusalem_muslim_al_khanqah_salahiyya_03: "祝圣的萨拉希耶道堂清真寺"
