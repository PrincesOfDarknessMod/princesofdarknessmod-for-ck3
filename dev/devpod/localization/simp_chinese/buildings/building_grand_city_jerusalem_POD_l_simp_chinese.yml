 building_type_jerusalem_muslim_dome_rock_01: "圆顶清真寺"
 building_type_jerusalem_muslim_dome_rock_01_desc: "#F 圆顶清真寺建于公元690年代，坐落于亚当被创造、亚伯拉罕险些献祭其子、以及穆罕默德开始夜行登霄之地。尽管历经数个世纪，该建筑结构依然完好，但十字军东征和地震已对其造成了损害。#!"
 building_jerusalem_muslim_dome_rock_01: "圆顶清真寺"
 building_jerusalem_muslim_dome_rock_01_desc: "圆顶清真寺建于公元690年代，坐落于亚当被创造、亚伯拉罕险些献祭其子、以及穆罕默德开始夜行登霄之地。尽管历经数个世纪，该建筑结构依然完好，但十字军东征和地震已对其造成了损害。"
 building_jerusalem_muslim_dome_rock_02: "修缮一新的圆顶清真寺"
 building_jerusalem_muslim_dome_rock_02_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_03: "装饰一新的圆顶清真寺"
 building_jerusalem_muslim_dome_rock_03_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_04: "祝圣后的圆顶清真寺"
 building_jerusalem_muslim_dome_rock_04_desc: "圆顶清真寺建于公元690年代，坐落于亚当被创造、亚伯拉罕险些献祭其子、以及穆罕默德开始夜行登霄之地。随着损毁被修复，这处伊斯兰教第三大圣地终于得以妥善颂扬安拉在此地的伟大功绩。"
 building_type_jerusalem_muslim_damascus_market_01: "大马士革市场"
 building_type_jerusalem_muslim_damascus_market_01_desc: "#F 大马士革市场交易从进口货品到牲畜的一切商品，是耶路撒冷的金融中心。#!"
 building_jerusalem_muslim_damascus_market_01: "大马士革市场"
 building_jerusalem_muslim_damascus_market_01_desc: "大马士革集市交易从进口商品到牲畜的一切货物，是耶路撒冷的金融心脏。"
 building_jerusalem_muslim_damascus_market_02: "大马士革集市"
 building_jerusalem_muslim_damascus_market_02_desc: "大马士革集市交易从进口商品到牲畜的一切货物，是耶路撒冷的金融心脏。任何可以合法购买的东西都能在这里找到。"
 building_jerusalem_muslim_damascus_market_03: "大马士革巨贾集市"
 building_jerusalem_muslim_damascus_market_03_desc: "大马士革集市交易从进口商品到牲畜的一切货物，是耶路撒冷的金融心脏。耶路撒冷是世界贸易围绕的焦点，而大马士革巨贾集市正是这个焦点的中心。"
 building_type_jerusalem_muslim_zawiya_01: "艾哈迈德扎维耶"
 building_type_jerusalem_muslim_zawiya_01_desc: "#F 此扎维耶以“战争之子”艾哈迈德·伊本·哈布之名命名，以纪念这位古老的传统主义者和圣战战士。与其他扎维耶一样，它如同基督教十字军骑士团一般，是一个宗教军事修会。#!"
 building_jerusalem_muslim_zawiya_01: "艾哈迈德扎维耶"
 building_jerusalem_muslim_zawiya_01_desc: "此扎维耶以“战争之子”艾哈迈德·伊本·哈布之名命名，以纪念这位古老的传统主义者和圣战战士。与其他扎维耶一样，它如同基督教十字军骑士团一般，是一个宗教军事修会。"
 building_jerusalem_muslim_zawiya_02: "翻新的艾哈迈德扎维耶"
 building_jerusalem_muslim_zawiya_02_desc: "$building_jerusalem_muslim_zawiya_01_desc$"
 building_jerusalem_muslim_zawiya_03: "扩建的艾哈迈德扎维耶"
 building_jerusalem_muslim_zawiya_03_desc: "$building_jerusalem_muslim_zawiya_01_desc$"
 building_type_jerusalem_muslim_madrasa_01: "祖农经学院"
 building_type_jerusalem_muslim_madrasa_01_desc: "#F 该经学院以祖农·米斯里之名命名，以纪念这位古代的神秘主义者、圣人和魔法大师。与其他经学院一样，它是一所教育机构，教授世俗、宗教和神秘学相结合的课程。#!"
 building_jerusalem_muslim_madrasa_01: "祖农经学院"
 building_jerusalem_muslim_madrasa_01_desc: "该经学院以祖农·米斯里之名命名，以纪念这位古代的神秘主义者、圣人和魔法大师。与其他经学院一样，它是一所教育机构，教授世俗、宗教和神秘学相结合的课程。"
