 building_type_jerusalem_divided_armenian_quarter_01: "亚美尼亚区"
 building_type_jerusalem_divided_armenian_quarter_01_desc: "#F 作为四个区中最小的一个，亚美尼亚区是亚美尼亚使徒教会基督徒的家园。如果您能吸引更多亚美尼亚人来耶路撒冷，您便能受益于他们的工匠技艺以及他们调和另外三个区之间冲突的经验——这是一个他们很乐意交出去的、相当压力山大的角色。#!"
 building_jerusalem_divided_armenian_quarter_01: "亚美尼亚区"
 building_jerusalem_divided_armenian_quarter_01_desc: "作为四个区中最小的一个，亚美尼亚区是亚美尼亚使徒教会基督徒的家园。如果您能吸引更多亚美尼亚人来耶路撒冷，您便能受益于他们的工匠技艺以及他们调和另外三个区之间冲突的经验——这是一个他们很乐意交出去的、相当压力山大的角色。"
