 building_type_jerusalem_jewish_third_temple_01: "第三圣殿"
 building_type_jerusalem_jewish_third_temple_01_desc: "#F 圣殿是所有犹太崇拜的中心。尽管拉比的教义提供了替代方案，但所有希伯来人都期盼着能再次将圣殿作为他们真正崇拜中心的那一天。#!"
 building_jerusalem_jewish_third_temple_01: "哭墙"
 building_jerusalem_jewish_third_temple_01_desc: "这面挡土墙是第二圣殿在毁灭战争中被夷平后仅存的遗迹。或许我们可以在这些废墟上重建圣殿……"
 building_jerusalem_jewish_third_temple_02: "外部庭院与门廊"
 building_jerusalem_jewish_third_temple_02_desc: "在我们重建圣殿之前，必须首先重建外院、祭坛、洗濯盆，以及门廊的两根铜柱——雅斤和波阿斯。此处将是大多数外邦人与希伯来人所能抵达的最深处，也将是复兴献祭仪式的核心场所。因此，我们必须打造一个既符合其神圣用途，又能恰如其分映照舍金纳荣光的区域。"
 building_jerusalem_jewish_third_temple_03: "前殿与圣所"
 building_jerusalem_jewish_third_temple_03_desc: "主圣所是祭司们的工作场所，也是许多重要象征的安放之地。我们将找回或重制这些象征，使它们能再次荣显圣殿之堂。 "
 building_jerusalem_jewish_third_temple_04: "第三圣殿竣工"
 building_jerusalem_jewish_third_temple_04_desc: "随着至圣所的完成与约柜的寻回，第三圣殿再次完整。利未祭司再次主持祭祀，并在人们前往圣城过节时引导上主之民。愿它存立的时间所罗门圣殿的7×7×7倍！愿它向万国见证上主对其选民的信实！  "
 building_type_jerusalem_jewish_library_01: "耶路撒冷档案库"
 building_type_jerusalem_jewish_library_01_desc: "#F $building_jerusalem_jewish_library_01_desc$#!"
 building_jerusalem_jewish_library_01: "耶路撒冷档案库"
 building_jerusalem_jewish_library_01_desc: "作为“圣书之民”，希伯来人素来深知文字的价值。如今，是时候将我们的知识汇聚成一座可媲美史上最伟大图书馆的档案库了。 "
 building_jerusalem_jewish_library_02: "耶路撒冷图书馆"
 building_jerusalem_jewish_library_02_desc: "尽管我们的工作尚未完成，但我们在集中收藏关于自然与超自然世界的知识方面已取得良好进展。"
 building_jerusalem_jewish_library_03: "耶路撒冷大图书馆"
 building_jerusalem_jewish_library_03_desc: "曾几何时，《塔纳赫》的希腊语译本曾陈列于亚历山大图书馆的书架上。而今，希伯来语版的柏拉图《理想国》与维吉尔《埃涅阿斯纪》并排矗立在耶路撒冷大图书馆中，与我们收藏的所有关于万物起源、本质与弱点的典籍共处一隅——无论其属于生灵、亡者，还是非生非死之物。"
 building_type_jerusalem_jewish_castle_01: "大卫之塔"
 building_type_jerusalem_jewish_castle_01_desc: "#F $building_jerusalem_jewish_castle_01_desc$#!"
 building_jerusalem_jewish_castle_01: "大卫之塔"
 building_jerusalem_jewish_castle_01_desc: "基于哈斯蒙尼时期和希律王时代要塞的废墟，现存的大卫塔建于公元5世纪。自穆斯林征服耶路撒冷、驱逐塔内居住的修士后，它一直被用作军事堡垒。"
 building_jerusalem_jewish_castle_02: "大卫要塞"
 building_jerusalem_jewish_castle_02_desc: "虽然这座塔楼曾被拜占庭人误认为是大卫王宫殿的一部分，但它确实是耶路撒冷防御体系与历史中重要的一环。为彰显其意义，我们已将塔楼扩建为一座真正的要塞。"
 building_jerusalem_jewish_castle_03: "大卫堡"
 building_jerusalem_jewish_castle_03_desc: "大卫堡历史上，耶路撒冷城已无数次沦陷于敌手。随着大卫堡的建成，任何企图夺取这座城市的威胁，若胆敢进犯希伯来的耶路撒冷，都将面临远比以往更为严峻的挑战。"
 building_type_jerusalem_jewish_palace_01: "皇家宫殿"
 building_type_jerusalem_jewish_palace_01_desc: "#F 这建筑坐落于犹太区内，由希律王时期大祭司亚那曾居住的一座宅邸废墟改建而成，是犹太人重返耶路撒冷的有力象征。#!"
 building_jerusalem_jewish_palace_01: "贵族庄园"
 building_jerusalem_jewish_palace_01_desc: "这座建筑由犹太区内一座曾是大希律王时期大祭司亚纳斯府邸的宅邸废墟改建而成，是犹太人重返耶路撒冷的强力象征，如今已成为适合耶路撒冷贵族统治者的庄园。"
 building_jerusalem_jewish_palace_02: "亲王居所"
 building_jerusalem_jewish_palace_02_desc: "这座建筑由犹太区内一座曾是大希律王时期大祭司亚纳斯府邸的宅邸废墟改建而成，是犹太人重返耶路撒冷的强力象征，如今已成为适合从耶路撒冷统治的亲王居住的府邸。"
 building_jerusalem_jewish_palace_03: "国王宫殿"
 building_jerusalem_jewish_palace_03_desc: "这座建筑由犹太区内一座曾是大希律王时期大祭司亚纳斯府邸的宅邸废墟改建而成，是犹太人重返耶路撒冷的强力象征，如今已成为真正配得上从这座伟大城市耶路撒冷统治的国王的宫殿。"
 building_type_jerusalem_jewish_pools_01: "耶路撒冷蓄水系统"
 building_type_jerusalem_jewish_pools_01_desc: "#F 与许多沙漠大城市一样，耶路撒冷拥有一个复杂但破败的供水系统。重建这套古老系统将使得耶路撒冷的人口得以大幅增长。#!"
 building_jerusalem_jewish_pools_01: "希西家池"
 building_jerusalem_jewish_pools_01_desc: "这座古老的水池由希西家王所建，旨在为城市提供1100万升水。此池曾一度被高塔与巨柱环绕，使得历代国王将其用作接见外国使节之地。"
 building_jerusalem_jewish_pools_02: "希西家水道"
 building_jerusalem_jewish_pools_02_desc: "这条古老的隧道将水源从远在城外的基训泉，跨越583码引至城墙内的西罗亚池。基训泉是耶路撒冷主要但间歇性的水源，这使得在水泉不流淌时，水道和西罗亚池变得必不可少。"
 building_jerusalem_jewish_pools_03: "所罗门池"
 building_jerusalem_jewish_pools_03_desc: "初建时，这三座位于伯利恒西南的蓄水池储存了近2.85亿升水。它们曾为伯利恒、圣殿山和希律王宫供水。随着我们完成所有修复工作，水源再次流入耶路撒冷，满足了我们的所有需求。"
 building_type_jerusalem_jewish_synagogue_01: "兰班犹太会堂"
 building_type_jerusalem_jewish_synagogue_01_desc: "#F 当拉比摩西·本·拿曼于1267年来到耶路撒冷时，他为城中犹太人的稀少以及不死生物在这圣城内掌握的权柄深感悲痛。甚至在他到来之前，他的门徒们就已在此城中活动。  #!"
 building_jerusalem_jewish_synagogue_01: "兰班学堂"
 building_jerusalem_jewish_synagogue_01_desc: "在成为信徒聚集的会堂之前，它必须首先是一所引导和教导信徒的学校。"
 building_jerusalem_jewish_synagogue_02: "兰班犹太会堂"
 building_jerusalem_jewish_synagogue_02_desc: "随着希伯来人口的增加，兰班学堂已扩展成一所正式的信徒集会"
 building_jerusalem_jewish_synagogue_03: "兰班集会所"
 building_jerusalem_jewish_synagogue_03_desc: "昔日的小型聚会场所和学校，如今已壮大为信徒的大型集会之所。有传言称，审判官们从世界各地伪装成朝圣者来到此地，并在此交换情报。"
 building_jerusalem_jewish_synagogue_04: "拿曼尼德集会所"
 building_jerusalem_jewish_synagogue_04_desc: "随着拿曼尼德亲临耶路撒冷，他现在亲自领导这座以他命名的会堂。在他的指导下，审判官的使命取得了巨大进展。"
 building_type_jerusalem_christian_holy_sepulcher_01: "圣墓教堂"
 building_type_jerusalem_christian_holy_sepulcher_01_desc: "#F 圣墓教堂被认为是基督教最神圣的场所，建于耶稣受难及其空墓遗址之上。此外，教堂内还包含苦路最后的4站。#!"
 building_jerusalem_christian_holy_sepulcher_01: "圣墓小堂"
 building_jerusalem_christian_holy_sepulcher_01_desc: "尽管拜占庭人和十字军曾努力重建教堂，但其大部分仍因哈基姆的破坏而处于废墟状态。"
 building_jerusalem_christian_holy_sepulcher_02: "圣墓教堂"
 building_jerusalem_christian_holy_sepulcher_02_desc: "圣墓教堂终于恢复了其在君士坦丁大帝主持下祝圣的古老荣耀。"
 building_jerusalem_christian_holy_sepulcher_03: "圣墓主教座堂"
 building_jerusalem_christian_holy_sepulcher_03_desc: "教堂已被扩建为耶路撒冷东正教牧首和拉丁牧首的正式驻地。"
 building_jerusalem_christian_holy_sepulcher_04: "宏伟的圣墓主教座堂"
 building_jerusalem_christian_holy_sepulcher_04_desc: "最终，这一圣地配上了应有的主教座堂，一座恰如其分彰显上帝荣耀与威严的殿堂。整个基督教世界都将为之惊叹。"
 building_type_jerusalem_christian_lazarus_01: "圣拉撒路骑士团"
 building_type_jerusalem_christian_lazarus_01_desc: "#F 圣拉撒路骑士团更常被称为麻风骑士，他们为许多医院提供医师，并守护这些医院免遭潜在危险。此外，他们为患有致命型麻风病的人提供了机会，让他们能在为上帝服务中光荣而尊贵地死去。#!"
 building_jerusalem_christian_lazarus_01: "圣拉撒路修会堂"
 building_jerusalem_christian_lazarus_01_desc: "该会堂为少数麻风骑士提供住所，并充当隔离站。"
 building_jerusalem_christian_lazarus_02: "圣拉撒路骑士兄弟会"
 building_jerusalem_christian_lazarus_02_desc: "该会所为相当数量的麻风骑士提供住所，并充当野战医院。  "
 building_jerusalem_christian_lazarus_03: "圣拉撒路的十字堡垒"
 building_jerusalem_christian_lazarus_03_desc: "该堡垒为大量麻风骑士提供住所，他们致力于通过军事力量和提供广泛的医疗服务来推进十字架的使命"
 building_type_jerusalem_christian_john_01: "圣约翰骑士团"
 building_type_jerusalem_christian_john_01_desc: "#F 更常被称为医院骑士团，圣约翰骑士团照顾并保护来到圣地的病患、伤者和贫穷朝圣者。此外，他们以管理关键堡垒（如骑士堡）而闻名，并偶尔协助安排基督教统治者之间的某些条约。  #!"
 building_jerusalem_christian_john_01: "圣约翰修会堂"
 building_jerusalem_christian_john_01_desc: "该会堂为少数医院骑士提供住所，并为寻求保护的朝圣者充当小型堡垒。"
 building_jerusalem_christian_john_02: "圣约翰骑士兄弟会"
 building_jerusalem_christian_john_02_desc: "此会所为相当数量的医院骑士提供住所，并为寻求保护的朝圣者充当中型堡垒。  "
 building_jerusalem_christian_john_03: "圣约翰的十字堡垒"
 building_jerusalem_christian_john_03_desc: "该堡垒为大量医院骑士提供住所，他们致力于通过军事力量和保护所有朝圣者来推进十字架的使命。  "
 building_type_jerusalem_christian_sepulchre_01: "圣墓骑士团"
 building_type_jerusalem_christian_sepulchre_01_desc: "#F 圣墓骑士团保护并管理耶路撒冷内的关键圣地。此外，他们授予最伟大的战士骑士身份，使其对普通人更具吸引力。#!  "
 building_jerusalem_christian_sepulchre_01: "圣墓修会堂"
 building_jerusalem_christian_sepulchre_01_desc: "该会堂为少数圣墓骑士提供住所，并充当小型招募中心。  "
 building_jerusalem_christian_sepulchre_02: "圣墓骑士兄弟会"
 building_jerusalem_christian_sepulchre_02_desc: "该会所为相当数量的圣墓骑士提供住所，并充当中型招募中心。  "
 building_jerusalem_christian_sepulchre_03: "圣墓十字堡垒"
 building_jerusalem_christian_sepulchre_03_desc: "该堡垒为大量圣墓骑士提供住所，他们致力于通过军事力量并招募普通人加入事业来推进十字架的使命。  "
 building_type_jerusalem_christian_supreme_templar_01: "所罗门圣殿骑士团"
 building_type_jerusalem_christian_supreme_templar_01_desc: "#F 更常被称为圣殿骑士，所罗门圣殿骑士团是耶路撒冷内5个主要十字军修会中最具军事导向的之一。他们尤其以重骑兵和步兵闻名。  #!"
 building_jerusalem_christian_supreme_templar_01: "至高修会堂"
 building_jerusalem_christian_supreme_templar_01_desc: "该会堂为少数圣殿骑士提供住所，并充当训练营。  "
 building_jerusalem_christian_supreme_templar_02: "至高修会骑士兄弟会"
 building_jerusalem_christian_supreme_templar_02_desc: "该会所为相当数量的圣殿骑士提供住所，并充当中型训练营。"
 building_jerusalem_christian_supreme_templar_03: "至高修会十字堡垒"
 building_jerusalem_christian_supreme_templar_03_desc: "该堡垒为大量圣殿骑士提供住所，他们致力于通过压倒性的军事力量来推进十字架的使命。"
 building_type_jerusalem_christian_german_mary_01: "圣玛丽修会"
 building_type_jerusalem_christian_german_mary_01_desc: "#F 圣玛丽修会更常被称为条顿骑士团，致力于在其领土内维持秩序与控制。尽管距离他们在立沃尼亚的鼎盛时期尚有很长一段路，但他们仍在协助规管耶路撒冷境内的其他势力方面发挥着作用。  #!"
 building_jerusalem_christian_german_mary_01: "圣玛丽修会堂"
 building_jerusalem_christian_german_mary_01_desc: "该会堂为少数条顿骑士提供住所，并充当临时拘留所。"
 building_jerusalem_christian_german_mary_02: "圣玛丽骑士兄弟会隐修所"
 building_jerusalem_christian_german_mary_02_desc: "这座隐修所为相当数量的条顿骑士提供住所，并充当次级法庭。"
 building_jerusalem_christian_german_mary_03: "圣玛丽十字壁垒"
 building_jerusalem_christian_german_mary_03_desc: "这座壁垒为大量条顿骑士提供住所，他们致力于通过军事力量与司法行动进一步推进十字架的使命。"
 building_type_jerusalem_divided_temple_mount_catacombs_01: "圣殿山地下墓穴"
 building_type_jerusalem_divided_temple_mount_catacombs_01_desc: "#F 与圣墓教堂不同，圣殿山下的通道几乎不受凡人信仰向上导向的影响，令人不适感较低。这些地下墓穴在表层之下多层空间中三维交织，伴有诡异变幻的厅堂，并非可轻率探索之地。有人或许会在此徘徊永恒，以鼠类和盲眼鱼类的血液为食，再也无法重见天日。然而，它们仍为躲避其他血族与阳光提供了绝佳的藏身之处。#!"
 building_jerusalem_divided_temple_mount_catacombs_01: "破败迷宫般的扩展区域"
 building_jerusalem_divided_temple_mount_catacombs_01_desc: "圣殿山与耶路撒冷下方的洞穴潮湿滑腻，遍布多次坍塌的痕迹与曲折通道。即便是轻微的冲击也可能导致大片廊道坍塌。"
 building_jerusalem_divided_temple_mount_catacombs_02: "隐蔽地下墓穴"
 building_jerusalem_divided_temple_mount_catacombs_02_desc: "通过一些加固措施，你改善了圣殿山下的环境。一系列房间、陷阱与通道依旧错综复杂、变幻莫测，但坍塌的风险已大大降低。"
 building_jerusalem_divided_temple_mount_catacombs_03: "萦回廊道"
 building_jerusalem_divided_temple_mount_catacombs_03_desc: "一种古老的黑暗似乎沉睡在隧道之中，许多深层的隧道似乎是从下往上开凿的。然而，居住在这些地下墓穴中的其他血族曾是你计划中的障碍。或者说，他们曾经是…… "
 building_jerusalem_divided_temple_mount_catacombs_04: "暗影宫殿"
 building_jerusalem_divided_temple_mount_catacombs_04_desc: "隧道无穷无尽，通向隐藏的秘密、失落的遗物以及比大多数玛土撒拉更古老的城市。你的探索与努力取得了惊人的成果，使你能在这些地下墓穴中建造一座宏伟的宫殿。你从这座隐秘的宫殿中以铁腕统治这座圣城，若有任何存在惹恼了你，总有无尽的迷宫——那些通过疯狂变幻的走廊永恒向下延伸、困住一切闯入者的地方——在等待。唯一的代价是那些廊道中传出的疯狂大笑与尖叫，这确实是一个小小的代价。"
 building_type_jerusalem_divided_christian_quarter_01: "基督徒区"
 building_type_jerusalem_divided_christian_quarter_01_desc: "#F 基督徒区目前容纳了大量朝圣者、商人和十字军战士。扩展该区域将提升你的军事能力，并为你在圣地的战争提供额外资金。#!"
 building_jerusalem_divided_christian_quarter_01: "基督徒区"
 building_jerusalem_divided_christian_quarter_01_desc: "基督徒区目前容纳了大量朝圣者、商人和十字军战士。扩展该区域将提升你的军事能力，并为你在圣地的战争提供额外资金。"
