 building_jerusalem_muslim_damascus_market_04: "Grand Damascus Bazaar"
 building_jerusalem_muslim_damascus_market_04_desc: "The Grand Damascus Bazaar deals in everything from imported wares to livestock and is the financial heart of Jerusalem. Jerusalem is the focal point around which the world's trade swings, and the Great Damascus Bazaar is the center of that focal point."
 JERUSALEM_MUSLIM_DAMASCUS_MARKET: "[GetBuilding('building_jerusalem_muslim_damascus_market_04').GetName]"
 building_jerusalem_muslim_zawiya_04: "Consecrated Zawiya Ahmad"
 building_jerusalem_muslim_zawiya_04_desc: "After its recent reconsecration and other improvements, this zawiya truly honors its namesake: Ahmad ibn Harb \"the Son of War\". From its halls march forth an organzied and devout force, ready to defend and expand these lands."
 JERUSALEM_MUSLIM_ZAWIYA: "[GetBuilding('building_jerusalem_muslim_zawiya_04').GetName]"
 building_jerusalem_muslim_madrasa_04: "Consecrated Madrasa Dho 'l-Nun"
 building_jerusalem_muslim_madrasa_04_desc: "After its recent reconsecration and other improvements, this madrasa truly honors its namesake: Dho 'l-Nun al-Misri. From its halls issue forth many students prepared to use their understanding of secular, religious, and mystical topics."
 JERUSALEM_MUSLIM_MADRASA: "[GetBuilding('building_jerusalem_muslim_madrasa_04').GetName]"
 POD_jerusalem_muslim_madrasa_bonus: "$EFFECT_LIST_BULLET$Passive [crafting_brewing|E] #weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#! [trait_level_track_xp|E]: #P +0.25#!\n$EFFECT_LIST_BULLET$"
 building_jerusalem_muslim_al_yaqubi_04: "Consecrated al-Ya'qubi Mosque"
 building_jerusalem_muslim_al_yaqubi_04_desc: "After its recent reconsecration and other improvements, this mosque truly honors its namesake: Abu l-Abbas Ahmad bin Abi Ya'qub bin Ja'far bin Wahb bin Wadih al-Ya'qubi. From its halls issue forth many explorers and historians who remember how he recorded many Jahiliyyah-era fables and detailed information regarding cities from the Byzantine Empire to China"
 JERUSALEM_MUSLIM_AL_YAQUBI: "[GetBuilding('building_jerusalem_muslim_al_yaqubi_04').GetName]"
 building_jerusalem_muslim_al_khanqah_salahiyya_04: "Consecrated al-Khanqah as-Salahiyya Mosque"
 building_jerusalem_muslim_al_khanqah_salahiyya_04_desc: "After its recent reconsecration and other improvements, this mosque truly honors its namesake: Salah ad-Din Yusuf ibn Ayyub. In his time, the mosque provided housing to his officers and served as his personal spiritual retreat. His legacy guides future sultans and rulers as they plan for the future."
 JERUSALEM_MUSLIM_AL_KHANQAH_SALAHIYYA: "[GetBuilding('building_jerusalem_muslim_al_khanqah_salahiyya_04').GetName]"
 building_type_pit_of_malkav_01: "Pit of Ketef Hinnom"
 building_type_pit_of_malkav_01_desc: "#F An open gap lies below Jerusalem. Even coming close is painful. Your head feels like it is about to explode.#!"
 building_pit_of_malkav_01: "Open Pit of Ketef Hinnom"
 building_pit_of_malkav_01_desc: "So many voices saying so many contradicting things... even though you can still glimpse a faint edge of wisdom in some of those."
 building_pit_of_malkav_02: "Concealed Pit of Ketef Hinnom"
 building_pit_of_malkav_02_desc: "You have thrown rocks into the pit and the voices are less frantic now. You are better able to understand them."
 building_pit_of_malkav_03: "Closed Pit of Ketef Hinnom"
 building_pit_of_malkav_03_desc: "The voices are quiet now, unless you are very close to the pit itself. Being close to it allows you to separate the mad from the insightful with ease now."
 building_pit_of_malkav_04: "Sanctified Pit of Ketef Hinnom"
 building_pit_of_malkav_04_desc: "Where once there were mad voices, now there are hymns whispering on the winds. Where once madness spilled forth upon this holy land, now blessings and wisdom go forth. Where once an evil beast ravaged the minds of all those nearby, now prayers rise up from the land. Where once a ravenous maw consumed the unwary and the sinful, now the faithful make prilgrimages to the grand temple built upon the once-profane."
 POD_requirements_purified_pit_malkav: "The [holder|E] must be a [GetTrait('supehunter').GetName( GetPlayer )] and have purified the Pit via [decision|E]."