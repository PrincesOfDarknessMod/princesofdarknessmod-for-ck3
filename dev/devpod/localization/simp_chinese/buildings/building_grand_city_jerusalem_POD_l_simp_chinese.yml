 building_type_jerusalem_jewish_third_temple_01: "第三圣殿"
 building_type_jerusalem_jewish_third_temple_01_desc: "#F 圣殿是所有犹太崇拜的中心。尽管拉比的教义提供了替代方案，但所有希伯来人都期盼着能再次将圣殿作为他们真正崇拜中心的那一天。#!"
 building_jerusalem_jewish_third_temple_01: "哭墙"
 building_jerusalem_jewish_third_temple_01_desc: "这面挡土墙是第二圣殿在毁灭战争中被夷平后仅存的遗迹。或许我们可以在这些废墟上重建圣殿……"
 building_jerusalem_jewish_third_temple_02: "外部庭院与门廊"
 building_jerusalem_jewish_third_temple_02_desc: "在我们重建圣殿之前，必须首先重建外院、祭坛、洗濯盆，以及门廊的两根铜柱——雅斤和波阿斯。此处将是大多数外邦人与希伯来人所能抵达的最深处，也将是复兴献祭仪式的核心场所。因此，我们必须打造一个既符合其神圣用途，又能恰如其分映照舍金纳荣光的区域。"
 building_jerusalem_jewish_third_temple_03: "前殿与圣所"
 building_jerusalem_jewish_third_temple_03_desc: "主圣所是祭司们的工作场所，也是许多重要象征的安放之地。我们将找回或重制这些象征，使它们能再次荣显圣殿之堂。 "
 building_jerusalem_jewish_third_temple_04: "第三圣殿竣工"
 building_jerusalem_jewish_third_temple_04_desc: "随着至圣所的完成与约柜的寻回，第三圣殿再次完整。利未祭司再次主持祭祀，并在人们前往圣城过节时引导上主之民。愿它存立的时间所罗门圣殿的7×7×7倍！愿它向万国见证上主对其选民的信实！  "
 building_type_jerusalem_jewish_library_01: "$building_jerusalem_jewish_library_02$"
 building_type_jerusalem_jewish_library_01_desc: "#F $building_jerusalem_jewish_library_02_desc$#!"
 building_jerusalem_jewish_library_01: "耶路撒冷档案库"
 building_jerusalem_jewish_library_01_desc: "作为“圣书之民”，希伯来人向来深知文字的价值。目前，我们仅有一个存放破损或陈旧文本、行政记录、信函和收据的储藏空间。或许将来，我们会有需要且有能力获得更大的空间。 "
 building_jerusalem_jewish_library_02: "耶路撒冷档案"
 building_jerusalem_jewish_library_02_desc: "作为“圣书之民”，希伯来人向来深知文字的价值。如今，是时候将我们的知识汇集于一堂，建立一座堪与史上最伟大图书馆媲美的宝库了。"
 building_jerusalem_jewish_library_03: "耶路撒冷大图书馆"
 building_jerusalem_jewish_library_03_desc: "虽然我们的工作尚未完成，但在形成关于自然与超自然世界知识的集中汇编方面，我们已经取得了良好进展。"
 building_type_jerusalem_jewish_castle_01: "大卫之塔"
 building_type_jerusalem_jewish_castle_01_desc: "#F $building_jerusalem_jewish_castle_01_desc$#!"
 building_jerusalem_jewish_castle_01: "大卫之塔"
 building_jerusalem_jewish_castle_01_desc: "基于哈斯蒙尼时期和希律王时代要塞的废墟，现存的大卫塔建于公元5世纪。自穆斯林征服耶路撒冷、驱逐塔内居住的修士后，它一直被用作军事堡垒。"
 building_jerusalem_jewish_castle_02: "大卫要塞"
 building_jerusalem_jewish_castle_02_desc: "尽管拜占庭人误将其当作大卫王宫殿的一部分，这座塔楼仍是耶路撒冷防御与历史的重要组成部分。为表认可，我们已将塔楼扩建为一座与其历史和价值相称的要塞。"
 building_jerusalem_jewish_castle_03: "大卫要塞"
 building_jerusalem_jewish_castle_03_desc: "曾经矗立着一座塔楼的地方，如今一座宏伟的堡垒拔地而起。这座新建的堡垒将保护我们的人民，并作为我军行动的稳固据点。"
 building_type_jerusalem_jewish_palace_01: "$building_jerusalem_jewish_palace_01$"
 building_type_jerusalem_jewish_palace_01_desc: "#F $building_jerusalem_jewish_palace_01_desc$#!"
 building_jerusalem_jewish_palace_01: "安娜斯的废墟宅邸"
 building_jerusalem_jewish_palace_01_desc: "此地曾是希律王时期大祭司亚那斯的居所，于公元70年与耶路撒冷其余部分一同被毁。如今，除废墟外，所剩无几。"
 building_jerusalem_jewish_palace_02: "安娜斯重建的宅邸"
 building_jerusalem_jewish_palace_02_desc: "这座宏伟建筑曾化为灰烬，如今重建一新，令人回想起耶路撒冷尚有大祭司驻锡的时代。"
 building_jerusalem_jewish_palace_03: "安娜斯的豪华宅邸"
 building_jerusalem_jewish_palace_03_desc: "经过全面重建甚至扩建，这里确实是一座配得上国王的家园。"
 building_type_jerusalem_jewish_pools_01: "耶路撒冷蓄水系统"
 building_type_jerusalem_jewish_pools_01_desc: "#F 如同许多大型沙漠城市，耶路撒冷有一套复杂却已破旧的水源供应系统。重建这一古老系统将让耶路撒冷的人口再度增长，让商业如水流般畅通。#!"
 building_jerusalem_jewish_pools_01: "希西家池"
 building_jerusalem_jewish_pools_01_desc: "This ancient reservoir was built by King Hezekiah to provide 11 million liters of water to the city. The pool was once surrounded by great towers and pillars, leading kings to use it as a place where they met foreign diplomats."
 building_jerusalem_jewish_pools_02: "希西家水道"
 building_jerusalem_jewish_pools_02_desc: "这条古老的隧道将水源从远在城外的基训泉，跨越583码引至城墙内的西罗亚池。基训泉是耶路撒冷主要但间歇性的水源，这使得在水泉不流淌时，水道和西罗亚池变得必不可少。"
 building_jerusalem_jewish_pools_03: "大卫的齐诺尔"
 building_jerusalem_jewish_pools_03_desc: "公元前第二个千年，基训泉附近建造了水利工程和一些防御工事。在随后的几个世纪里，它们被加深和延长，既阻挡了围攻者的进入，又保护了城市的供水。有人说大卫正是通过这些隧道发动突袭的。无论如何，这项工程的挖掘为城市提供了更可靠的水源。"
 building_type_jerusalem_jewish_synagogue_01: "$building_jerusalem_jewish_synagogue_02$"
 building_type_jerusalem_jewish_synagogue_01_desc: "#F 当拉比摩西·本·拿曼于1267年来到耶路撒冷时，他为城中犹太人的稀少以及不死生物在这圣城内掌握的权柄深感悲痛。甚至在他到来之前，他的门徒们就已在此城中活动。而他大力助长了他们的努力。#!"
 building_jerusalem_jewish_synagogue_01: "兰班学堂"
 building_jerusalem_jewish_synagogue_01_desc: "在成为信徒聚集的会堂之前，它必须首先是一所引导和教导他们的学校。"
 building_jerusalem_jewish_synagogue_02: "兰班犹太会堂"
 building_jerusalem_jewish_synagogue_02_desc: "随着希伯来人口的增加，兰班学堂已扩展成一所正式的信徒集会"
 building_jerusalem_jewish_synagogue_03: "兰班集会所"
 building_jerusalem_jewish_synagogue_03_desc: "昔日的小型聚会场所和学校，如今已壮大为信徒的大型集会之所。有传言称，审判官们从世界各地伪装成朝圣者来到此地，并在此交换情报。"
 building_jerusalem_jewish_synagogue_04: "拿曼尼德集会所"
 building_jerusalem_jewish_synagogue_04_desc: "他们抵达耶路撒冷后，纳赫曼尼德及其追随者现在领导着以他命名的会堂。在其指引下，成效显著，协助了士师们完成伟大使命。"
 building_type_jerusalem_christian_holy_sepulcher_01: "圣墓教堂"
 building_type_jerusalem_christian_holy_sepulcher_01_desc: "#F 圣墓教堂被认为是基督教最神圣的场所，建于耶稣受难及其空墓遗址之上。此外，教堂内还包含苦路最后的4站。#!"
 building_jerusalem_christian_holy_sepulcher_01: "圣墓小堂"
 building_jerusalem_christian_holy_sepulcher_01_desc: "尽管拜占庭人和十字军曾努力重建教堂，但其大部分仍因哈基姆的破坏而处于废墟状态。"
 building_jerusalem_christian_holy_sepulcher_02: "圣墓教堂"
 building_jerusalem_christian_holy_sepulcher_02_desc: "圣墓教堂终于恢复了其在君士坦丁大帝主持下祝圣的古老荣耀。"
 building_jerusalem_christian_holy_sepulcher_03: "圣墓主教座堂"
 building_jerusalem_christian_holy_sepulcher_03_desc: "教堂已被扩建为耶路撒冷东正教牧首和拉丁牧首的正式驻地。"
 building_jerusalem_christian_holy_sepulcher_04: "圣墓大殿"
 building_jerusalem_christian_holy_sepulcher_04_desc: "最终，这一圣地配上了应有的主教座堂，一座恰如其分彰显上帝荣耀与威严的殿堂。整个基督教世界都将为之惊叹。"
 building_type_jerusalem_christian_lazarus_01: "圣拉撒路骑士团"
 building_type_jerusalem_christian_lazarus_01_desc: "#F 圣拉撒路骑士团更常被称为麻风骑士，他们为许多医院提供医师，并守护这些医院免遭潜在危险。此外，他们为患有致命型麻风病的人提供了机会，让他们能在为上帝服务中光荣而尊贵地死去。#!"
 building_jerusalem_christian_lazarus_01: "圣拉撒路修会堂"
 building_jerusalem_christian_lazarus_01_desc: "该会堂为少数麻风骑士提供住所，并充当隔离站。"
 building_jerusalem_christian_lazarus_02: "圣拉撒路骑士兄弟会"
 building_jerusalem_christian_lazarus_02_desc: "该会所为相当数量的麻风骑士提供住所，并充当野战医院。  "
 building_jerusalem_christian_lazarus_03: "圣拉撒路十字骑士团"
 building_jerusalem_christian_lazarus_03_desc: "此修道院容纳着一大批麻风骑士，并作为区域中心管理各医院，协助受伤的骑士教友。"
 building_type_jerusalem_christian_john_01: "圣约翰骑士团"
 building_type_jerusalem_christian_john_01_desc: "#F 更常被称为医院骑士团，圣约翰骑士团照顾并保护来到圣地的病患、伤者和贫穷朝圣者。此外，他们以管理关键堡垒（如骑士堡）而闻名，并偶尔协助安排基督教统治者之间的某些条约。  #!"
 building_jerusalem_christian_john_01: "圣约翰修会堂"
 building_jerusalem_christian_john_01_desc: "该会堂为少数医院骑士提供住所，并为寻求保护的朝圣者充当小型堡垒。"
 building_jerusalem_christian_john_02: "圣约翰骑士兄弟会"
 building_jerusalem_christian_john_02_desc: "此会所为相当数量的医院骑士提供住所，并为寻求保护的朝圣者充当中型堡垒。  "
 building_jerusalem_christian_john_03: "圣约翰十字团指挥区"
 building_jerusalem_christian_john_03_desc: "该军区驻扎着大量医院骑士团成员，并作为区域中心管理各类慈善事业，保护朝圣者在圣地道路上的安全。"
 building_type_jerusalem_christian_sepulchre_01: "圣墓骑士团"
 building_type_jerusalem_christian_sepulchre_01_desc: "#F 圣墓骑士团保护并管理耶路撒冷内的关键圣地。此外，他们授予最伟大的战士骑士身份，使其对普通人更具吸引力。#!  "
 building_jerusalem_christian_sepulchre_01: "圣墓修会堂"
 building_jerusalem_christian_sepulchre_01_desc: "该会堂为少数圣墓骑士提供住所，并充当小型招募中心。  "
 building_jerusalem_christian_sepulchre_02: "圣墓骑士兄弟会"
 building_jerusalem_christian_sepulchre_02_desc: "该会所为相当数量的圣墓骑士提供住所，并充当中型招募中心。  "
 building_jerusalem_christian_sepulchre_03: "圣墓十字军指挥所"
 building_jerusalem_christian_sepulchre_03_desc: "该指挥官辖区驻扎着一大批圣墓骑士团成员，并作为地区中心，负责招募骑士教友以保卫圣地内的关键地点。"
 building_type_jerusalem_christian_supreme_templar_01: "所罗门圣殿骑士团"
 building_type_jerusalem_christian_supreme_templar_01_desc: "#F 更常被称为圣殿骑士，所罗门圣殿骑士团是耶路撒冷内5个主要十字军修会中最具军事导向的之一。他们尤其以重骑兵和步兵闻名。  #!"
 building_jerusalem_christian_supreme_templar_01: "至高修会堂"
 building_jerusalem_christian_supreme_templar_01_desc: "该会堂为少数圣殿骑士提供住所，并充当训练营。  "
 building_jerusalem_christian_supreme_templar_02: "至高修会骑士兄弟会"
 building_jerusalem_christian_supreme_templar_02_desc: "该会所为相当数量的圣殿骑士提供住所，并充当中型训练营。"
 building_jerusalem_christian_supreme_templar_03: "圣约翰十字团指挥区"
 building_jerusalem_christian_supreme_templar_03_desc: "此驻地内驻有大量圣殿骑士，并作为区域中心，训练能抵御任何进攻的骑士教友。"
 building_type_jerusalem_christian_german_mary_01: "圣玛丽修会"
 building_type_jerusalem_christian_german_mary_01_desc: "#F 圣玛丽修会更常被称为条顿骑士团，致力于在其领土内维持秩序与控制。尽管距离他们在立沃尼亚的鼎盛时期尚有很长一段路，但他们仍在协助规管耶路撒冷境内的其他势力方面发挥着作用。  #!"
 building_jerusalem_christian_german_mary_01: "圣玛丽修会堂"
 building_jerusalem_christian_german_mary_01_desc: "该会堂为少数条顿骑士提供住所，并充当临时拘留所。"
 building_jerusalem_christian_german_mary_02: "圣玛丽骑士兄弟会隐修所"
 building_jerusalem_christian_german_mary_02_desc: "这座隐修所为相当数量的条顿骑士提供住所，并充当次级法庭。"
 building_jerusalem_christian_german_mary_03: "圣玛丽十字军领地"
 building_jerusalem_christian_german_mary_03_desc: "这个军区驻扎着大量条顿骑士团成员，并作为执行和裁决基督教世界法律的地方中心。"
 building_type_jerusalem_divided_temple_mount_catacombs_01: "圣殿山地下墓穴"
 building_type_jerusalem_divided_temple_mount_catacombs_01_desc: "#F 与圣墓教堂不同，圣殿山下的通道几乎不受凡人信仰向上导向的影响，令人不适感较低。这些地下墓穴在表层之下多层空间中三维交织，伴有诡异变幻的厅堂，并非可轻率探索之地。有人或许会在此徘徊永恒，以鼠类和盲眼鱼类的血液为食，再也无法重见天日。然而，它们仍为躲避其他血族与阳光提供了绝佳的藏身之处。#!"
 building_jerusalem_divided_temple_mount_catacombs_01: "破败迷宫般的扩展区域"
 building_jerusalem_divided_temple_mount_catacombs_01_desc: "圣殿山与耶路撒冷下方的洞穴潮湿滑腻，遍布多次坍塌的痕迹与曲折通道。即便是轻微的冲击也可能导致大片廊道坍塌。"
 building_jerusalem_divided_temple_mount_catacombs_02: "隐蔽地下墓穴"
 building_jerusalem_divided_temple_mount_catacombs_02_desc: "通过一些加固措施，你改善了圣殿山下的环境。一系列房间、陷阱与通道依旧错综复杂、变幻莫测，但坍塌的风险已大大降低。"
 building_jerusalem_divided_temple_mount_catacombs_03: "萦回廊道"
 building_jerusalem_divided_temple_mount_catacombs_03_desc: "一种古老的黑暗似乎沉睡在隧道之中，许多深层的隧道似乎是从下往上开凿的。然而，居住在这些地下墓穴中的其他血族曾是你计划中的障碍。或者说，他们曾经是…… "
 building_jerusalem_divided_temple_mount_catacombs_04: "暗影宫殿"
 building_jerusalem_divided_temple_mount_catacombs_04_desc: "隧道无穷无尽，通向隐藏的秘密、失落的遗物以及比大多数玛土撒拉更古老的城市。你的探索与努力取得了惊人的成果，使你能在这些地下墓穴中建造一座宏伟的宫殿。你从这座隐秘的宫殿中以铁腕统治这座圣城，若有任何存在惹恼了你，总有无尽的迷宫——那些通过疯狂变幻的走廊永恒向下延伸、困住一切闯入者的地方——在等待。唯一的代价是那些廊道中传出的疯狂大笑与尖叫，这确实是一个小小的代价。"
 building_type_jerusalem_muslim_dome_rock_01: "圆顶清真寺"
 building_type_jerusalem_muslim_dome_rock_01_desc: "#F 圆顶清真寺建于公元690年代，坐落于亚当被创造、亚伯拉罕险些献祭其子、以及穆罕默德开始夜行登霄之地。尽管历经数个世纪，该建筑结构依然完好，但十字军东征和地震已对其造成了损害。#!"
 building_jerusalem_muslim_dome_rock_01: "圆顶清真寺"
 building_jerusalem_muslim_dome_rock_01_desc: "圆顶清真寺建于公元690年代，坐落于亚当被创造、亚伯拉罕险些献祭其子、以及穆罕默德开始夜行登霄之地。尽管历经数个世纪，该建筑结构依然完好，但十字军东征和地震已对其造成了损害。"
 building_jerusalem_muslim_dome_rock_02: "修缮一新的圆顶清真寺"
 building_jerusalem_muslim_dome_rock_02_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_03: "装饰一新的圆顶清真寺"
 building_jerusalem_muslim_dome_rock_03_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_04: "祝圣后的圆顶清真寺"
 building_jerusalem_muslim_dome_rock_04_desc: "圆顶清真寺建于公元690年代，坐落于亚当被创造、亚伯拉罕险些献祭其子、以及穆罕默德开始夜行登霄之地。随着损毁被修复，这处伊斯兰教第三大圣地终于得以妥善颂扬安拉在此地的伟大功绩。"
 building_type_jerusalem_muslim_damascus_market_01: "$building_jerusalem_muslim_damascus_market_02$"
 building_type_jerusalem_muslim_damascus_market_01_desc: "#F $building_jerusalem_muslim_damascus_market_02_desc$#!"
 building_jerusalem_muslim_damascus_market_01: "大马士革市场"
 building_jerusalem_muslim_damascus_market_01_desc: "在迷宫般蜿蜒的巷弄网中，从进口商品到家畜，应有尽有，皆可买卖。"
 building_jerusalem_muslim_damascus_market_02: "大马士革集市"
 building_jerusalem_muslim_damascus_market_02_desc: "摊位上摆满了五颜六色的香料、糖果、木雕、陶瓷、新鲜农产品、纺织品，以及更多琳琅满目的商品。几乎找不到什么在这里是买不到的。"
 building_jerusalem_muslim_damascus_market_03: "Damascus Bazaar"
 building_jerusalem_muslim_damascus_market_03_desc: "The Damascus Bazaar deals in everything from imported wares to livestock and is the financial heart of Jerusalem. Whatever may be purchased legally can be found here."
 building_type_jerusalem_muslim_zawiya_01: "$building_jerusalem_muslim_zawiya_01$"
 building_type_jerusalem_muslim_zawiya_01_desc: "#F $building_jerusalem_muslim_zawiya_02_desc$#!"
 building_jerusalem_muslim_zawiya_01: "艾哈迈德扎维耶"
 building_jerusalem_muslim_zawiya_01_desc: "Named for an important but mostly forgotten religious leader, it serves as a place of worship, a school, a monastery, and a home to a local brotherhood."
 building_jerusalem_muslim_zawiya_02: "翻新的艾哈迈德扎维耶"
 building_jerusalem_muslim_zawiya_02_desc: "With the recent renovations, the Zawiya Ahmad is once more reminding people of an ancient traditionalist and warrior of the jihad. He once inspired many a soldier and a hunter; perhaps he will again."
 building_jerusalem_muslim_zawiya_03: "扩建的艾哈迈德扎维耶"
 building_jerusalem_muslim_zawiya_03_desc: "The brotherhood has taken advantage of their home's recent expansions to recruit new brothers and to begin training them for war."
 building_type_jerusalem_muslim_madrasa_01: "祖农经学院"
 building_type_jerusalem_muslim_madrasa_01_desc: "#F $building_jerusalem_muslim_madrasa_02_desc$#!"
 building_jerusalem_muslim_madrasa_01: "祖农经学院"
 building_jerusalem_muslim_madrasa_01_desc: "Named for an important but mostly forgotten religious leader, it serves as an educational institution for both secular and religious matters."
 building_jerusalem_muslim_madrasa_02: "翻新的祖农经学院"
 building_jerusalem_muslim_madrasa_02_desc: "With the recent renovations, the Madrasa Dho 'l-Nun is once more reminding people of an ancient mystic and saint. He once inspired many a scholar and a hunter; perhaps he will again."
 building_jerusalem_muslim_madrasa_03: "扩建的祖农经学院"
 building_jerusalem_muslim_madrasa_03_desc: "The scholars have taken advantage of their home's recent expansions to teach some new classes on certain mystical arts."
 building_type_jerusalem_muslim_al_yaqubi_01: "雅古比清真寺"
 building_type_jerusalem_muslim_al_yaqubi_01_desc: "#F $building_jerusalem_muslim_al_yaqubi_02_desc$#!"
 building_jerusalem_muslim_al_yaqubi_01: "雅古比清真寺"
 building_jerusalem_muslim_al_yaqubi_01_desc: "Named for an important but mostly forgotten leader, it serves as a conventional mosque, though one encouraging exploration and the study of history."
 building_jerusalem_muslim_al_yaqubi_02: "翻新的雅古比清真寺"
 building_jerusalem_muslim_al_yaqubi_02_desc: "With the recent renovations, the al-Ya'qubi Mosque is once more reminding people of an ancient historian and geographer. He once inspired many an explorer and a hunter; perhaps he will again."
 building_jerusalem_muslim_al_yaqubi_03: "Expanded al-Ya'qubi Mosque"
 building_jerusalem_muslim_al_yaqubi_03_desc: "The explorers, merchants, and historians have taken advantage of the mosque's recent expansions to encourage exploration, the collection of oral tales, and spreading the name of the mosque's sponsor."
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01: "萨拉希耶道堂清真寺"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "#F $building_jerusalem_muslim_al_khanqah_salahiyya_02_desc$#!"
 building_jerusalem_muslim_al_khanqah_salahiyya_01: "萨拉希耶道堂清真寺"
 building_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "Named for an Salah ad-Din Yusuf ibn Ayyub, it serves as a conventional mosque and remembers his time here. A few remnants of the mosque's time as a khanqah linger in the corners."
 building_jerusalem_muslim_al_khanqah_salahiyya_02: "翻新的萨拉希耶道堂清真寺"
 building_jerusalem_muslim_al_khanqah_salahiyya_02_desc: "With the recent renovations, the al-Khanqah as-Salahiyya Mosque is once more reminding people of the great general and sultan while sustaining the khanqah's traditions. He has inspired many a ruler and a hunter; perhaps this place will play a part in keeping his legacy alive"
 building_jerusalem_muslim_al_khanqah_salahiyya_03: "Expanded al-Khanqah as-Salahiyya Mosque"
 building_jerusalem_muslim_al_khanqah_salahiyya_03_desc: "The local leaders have taken advantage of the mosque's recent expansions to further their own legends and prestige."
