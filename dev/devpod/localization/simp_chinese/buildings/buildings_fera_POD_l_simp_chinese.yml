 building_type_crescent_moon_01: "新月圣地"
 building_type_crescent_moon_01_desc: "#F 银牙坐落于俄罗斯的权力中心，也许这是他们在全世界当中最大的圣地。#!"
 building_crescent_moon_01: "萌芽的新月圣地"
 building_crescent_moon_01_desc: "新月圣地是在刀耕之治时期被发现的，它坐落在乌拉尔山脉深处的一个隐蔽山谷中。"
 building_crescent_moon_02: "扩张的新月圣地"
 building_crescent_moon_02_desc: "这里最初是可怕的戈里尼奇的家园，许多银牙的传奇英雄为了给部族夺取该地区的控制权而牺牲"
 building_crescent_moon_03: "雄伟的新月圣地"
 building_crescent_moon_03_desc: "在赶走了戈里尼奇之后，强大的眉月狼净化了这片土地，确保新月将作为银牙的余威矗立在未来的岁月里。"
 building_type_snow_leopard_01: "雪豹圣地"
 building_type_snow_leopard_01_desc: "#F 世上最知名的星占圣地，一座无与伦比的学习与协作中心。#!"
 building_snow_leopard_01: "萌芽的雪豹圣地"
 building_snow_leopard_01_desc: "这座圣地是由拜占庭的星占查士丁尼所建立，也是与一位名为米拉日巴的神秘吸血鬼共同努力的成果。"
 building_snow_leopard_02: "扩张的雪豹圣地"
 building_snow_leopard_02_desc: "就在这里，查士丁尼面对强大的节点爬行者做出了最后的抵抗。虽然他在战斗中失去了生命，但圣地的安全却得到了保证。"
 building_snow_leopard_03: "雄伟的雪豹圣地"
 building_snow_leopard_03_desc: "在查士丁尼对节点爬行者的胜利之后，圣地的名气迅速增长，并很快成为星占文化的一个重要中心。"
 building_type_field_stars_01: "星域圣地"
 building_type_field_stars_01_desc: "#F 一座靠近河流源头的强大领导圣地。这座圣地的位置非常暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。#!"
 building_field_stars_01: "萌芽的星域圣地"
 building_field_stars_01_desc: "一座靠近河流源头的强大领导圣地。这座圣地的位置非常暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_field_stars_02: "扩张的星域圣地"
 building_field_stars_02_desc: "一座靠近河流源头的强大领导圣地。这座圣地的位置非常暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_field_stars_03: "雄伟的星域圣地"
 building_field_stars_03_desc: "一座靠近河流源头的强大领导圣地。这座圣地的位置相当暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_type_den_realm_01: "巢域"
 building_type_den_realm_01_desc: "#F 巢域是一个与$glossary_fera$联系在一起，作为她的个人退路的[umbra|E]补丁。大多数巢域与物质现实中的区域相联系，并提供一条进入近影界的通道，这样从小撇步或用类似的方式进入[umbra|E]就会更容易。巢域受到很好地防护，很难突破它们的防御。#!"
 den_realm_effect_desc: "#help 如果这是你的首都：#!\n进入[umbra|E]的$POD_energy_gnosis$消耗降低：\n#P -25%#!/建筑等级"
 building_den_realm_01: "小型巢域"
 building_den_realm_01_desc: "一个通往[umbra|E]口袋位面的小而实用的传送门。"
 building_den_realm_02: "中型巢域"
 building_den_realm_02_desc: "一个通往[umbra|E]口袋位面的传送门，且有小型防御系统保护。"
 building_den_realm_03: "大型巢域"
 building_den_realm_03_desc: "一条通往[umbra|E]大型领域的隧道，设有坚固防御，是其主人静修的理想之地。"
 building_type_spiritual_sanctuary_01: "灵性圣所"
 building_type_spiritual_sanctuary_01_desc: "#F 由于$glossary_triat$的狂乱，平衡正逐渐离开这个世界。但仍有一些区域得以存续，通常受到那些通灵之人的保护。#!"
 building_spiritual_sanctuary_01: "小型灵性圣所"
 building_spiritual_sanctuary_01_desc: "这是垂死世界之平衡发出的小小却象征性的反抗宣言。"
 building_spiritual_sanctuary_02: "灵性圣所"
 building_spiritual_sanctuary_02_desc: "生长与腐朽，生命与死亡，这里的循环正遵循其自然轨迹。"
 building_spiritual_sanctuary_03: "大型灵性圣所"
 building_spiritual_sanctuary_03_desc: "完美平衡，万物皆应如此。"
 building_type_wyld_overgrowth_01: "$glossary_wyld$繁茂林"
 building_type_wyld_overgrowth_01_desc: "#F 被$glossary_weaver$扼制，又遭$glossary_wyrm$侵袭，大自然母亲在此地展开了她的复仇。#!"
 building_wyld_overgrowth_01: "小型$glossary_wyld$繁茂林"
 building_wyld_overgrowth_01_desc: "一小片狂野自然的突显，跃动不息，渴望繁荣。$POD_fera_requirements_development_below_t1$"
