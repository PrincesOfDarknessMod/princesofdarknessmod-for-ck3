l_simp_chinese:
 building_type_hanshii_arena_01: "汉什竞技场"
 building_type_hanshii_arena_01_desc: "#F 芭丝特文化的基石，汉什是用于娱乐或决定领土权利的仪式性战斗。这些比赛可能是猜谜游戏、正式决斗或爪牙之战。#!"
 building_hanshii_arena_01: "小型汉什竞技场"
 building_hanshii_arena_01_desc: "一个专为汉什挑战预留的小场地。"
 building_hanshii_arena_02: "体面的的汉什竞技场"
 building_hanshii_arena_02_desc: "在这个受到良好保护的区域，各种类型的挑战都在这里发生。"
 building_hanshii_arena_03: "大型汉什竞技场"
 building_hanshii_arena_03_desc: "芭丝特们聚集在这里，热切地观看来自世界各地的参赛者在提供的挑战中争取自己的权益。"
 POD_needs_hanshii_arbiter: "#X 你需要雇佣[GetCourtPositionType('hanshii_arbiter_court_position').GetName()]#!"
 POD_needs_hanshii_arbiter_2: "#X 你需要雇佣一位良好以上称职度的[GetCourtPositionType('hanshii_arbiter_court_position').GetName()]#!"
 POD_needs_hanshii_arbiter_3: "#X 你需要雇佣一个极佳以上称职度的[GetCourtPositionType('hanshii_arbiter_court_position').GetName()]#!"
 building_type_altar_seline_01: "塞勒涅祭坛"
 building_type_altar_seline_01_desc: "#F 盖亚富有同情心的姐妹，月亮，显然偏爱猫人，并将它们视为她最杰出的创造。她孕育了该化形种族作为赠予地球的礼物，而她的身体据说是所有芭丝特的最终圣所。#!"
 building_altar_seline_01: "小型塞勒涅祭坛"
 building_altar_seline_01_desc: "猫族之母即使在最简陋的居所中也慈爱地守望着她自豪的孩子们。"
 building_altar_seline_02: "体面的塞勒涅祭坛"
 building_altar_seline_02_desc: "很少有人真正理解变幻莫测的月亮女神，但芭丝特仍然能感受到她的温暖，当他们站在这个神圣的地方时。"
 building_altar_seline_03: "塞勒涅大祭坛"
 building_altar_seline_03_desc: "向月亮女士致敬，她是各地猫族的真正守护者。她的许多孩子聚集在这里向她表示敬意。"
 POD_needs_seline_oracle: "#X 你需要雇佣一位[GetCourtPositionType('seline_oracle_court_position').GetName()]#!"
 POD_needs_seline_oracle_2: "#X 你需要雇佣一位良好以上称职度的[GetCourtPositionType('seline_oracle_court_position').GetName()]#!"
 POD_needs_seline_oracle_3: "#X 你需要雇佣一位极佳以上称职度的[GetCourtPositionType('seline_oracle_court_position').GetName()]#!"
 building_type_taghairm_gathering_01: "塔格海姆聚会"
 building_type_taghairm_gathering_01_desc: "#F 塔格海姆是一种猫族聚会，常被召集以交换信息或寒暄。其通常在月圆之夜进行。#!"
 building_taghairm_gathering_01: "小型塔格海姆聚会"
 building_taghairm_gathering_01_desc: "一个小型区域，芭丝特们聚集在这里进行非正式的交谈和玩耍。"
 building_taghairm_gathering_02: "体面的塔格海姆聚会"
 building_taghairm_gathering_02_desc: "这些场地特别为塔格海姆保留，举办了许多猫族的聚会。"
 building_taghairm_gathering_03: "大型塔格海姆聚会"
 building_taghairm_gathering_03_desc: "一个宏伟且设备齐全的区域，来自遥远地区的芭丝特来到这里与当地的同胞交流信息和知识。"
 POD_needs_master_taghairm: "#X 你需要雇佣一位[GetCourtPositionType('master_taghairm_court_position').GetName()]#!"
 POD_needs_master_taghairm_2: "#X 你需要雇佣一位良好以上称职度的[GetCourtPositionType('master_taghairm_court_position').GetName()]#!"
 POD_needs_master_taghairm_3: "#X 你需要雇佣一位极佳以上称职度的[GetCourtPositionType('master_taghairm_court_position').GetName()]#!"
 building_type_taklah_training_01: "塔喀赫训练场"
 building_type_taklah_training_01_desc: "#F 塔喀赫是一个由各种猫人组成的精英随从团体，他们为了一个共同的目的聚集在一起。#!"
 building_taklah_training_01: "小型塔喀赫训练场"
 building_taklah_training_01_desc: "芭丝特的战士们可能没有他们狼族表亲那么有名，但任何低估他们的人都是愚蠢的。"
 building_taklah_training_02: "体面的塔喀赫训练场"
 building_taklah_training_02_desc: "芭丝特是独居生物，但是当一个共同的目标将他们联合起来时，他们出人意料地能够很好地协同工作。"
 building_taklah_training_03: "大型塔喀赫训练场"
 building_taklah_training_03_desc: "巨猫会使凡人心中激发敬畏和尊重。这个芭丝特塔喀赫也会对其敌人产生同样的影响。"
 POD_needs_warleader_taklah: "#X 你需要雇佣一位[GetCourtPositionType('warleader_taklah_court_position').GetName()]#!"
 POD_needs_warleader_taklah_2: "#X 你需要雇佣一位良好以上称职度的[GetCourtPositionType('warleader_taklah_court_position').GetName()]#!"
 POD_needs_warleader_taklah_3: "#X 你需要雇佣一位极佳以上称职度的[GetCourtPositionType('warleader_taklah_court_position').GetName()]#!"
 building_type_yava_court_01: "雅瓦学廷"
 building_type_yava_court_01_desc: "#F 雅瓦是一个部族的秘密，对外人严格保密，据说如果被外人得知，就能赋予对方对你的控制力。这是芭丝特传说中保护得最严密的。只有在最极端的情况下才会被暴露，即使是这样、也极为罕见。#!"
 building_yava_court_01: "小型雅瓦学庭"
 building_yava_court_01_desc: "一个小型区域，博学的芭丝特在这里沉思雅瓦，而更注重实践的人则在这里思考如何惩罚那些窃取这些部族秘密的外来者。"
 building_yava_court_02: "体面的雅瓦学庭"
 building_yava_court_02_desc: "对于那些泄露部族最大秘密的傻瓜，审判是迅速且无情的。"
 building_yava_court_03: "大型雅瓦学庭"
 building_yava_court_03_desc: "来自世界各地的部族成员来到这里，讨论与神圣的雅瓦有关的最新进展。"
 POD_needs_guardian_yava: "#X 你需要雇佣一位[GetCourtPositionType('guardian_yava_court_position').GetName()]#!"
 POD_needs_guardian_yava_2: "#X 你需要雇佣一位良好以上称职度的[GetCourtPositionType('guardian_yava_court_position').GetName()]#!"
 POD_needs_guardian_yava_3: "#X 你需要雇佣一位极佳以上称职度的[GetCourtPositionType('guardian_yava_court_position').GetName()]#!"
 building_type_bush_retreat_01: "布什巢窟"
 building_type_bush_retreat_01_desc: "#F  斯瓦拉是非常孤僻的生物。在对周遭环境的完美认知和极高的速度的结合下，它们对敌人来说几乎是不可捉摸的。#!"
 building_bush_retreat_01: "小型布什巢窟"
 building_bush_retreat_01_desc: "斯瓦拉是非常孤僻的生物。在对周遭环境的完美认知和极高的速度的结合下，它们对敌人来说几乎是不可捉摸的。"
 building_type_feline_law_01: "猫律法庭"
 building_type_feline_law_01_desc: "#F 巴希拉作为猫族的审判者而受造。尽管其他大多数部族不承认这一事实，但他们仍将荣誉和正义视为至高无上之物。#!"
 building_feline_law_01: "猫律法庭"
 building_feline_law_01_desc: "巴希拉作为猫族的审判者而受造。尽管其他大多数部族不承认这一事实，但他们仍将荣誉和正义视为至高无上之物。"
 building_type_temple_bast_01: "芭丝特神庙"
 building_type_temple_bast_01_desc: "#F 芭丝特之子曾经被古埃及人作为神明崇拜的日子早已一去不复返。然而，布巴斯提并未忘记，他们终有一天将使人类重回应有的位置，屈膝于他们面前。#!"
 building_temple_bast_01: "芭丝特神庙"
 building_temple_bast_01_desc: "芭丝特之子曾经被古埃及人作为神明崇拜的日子早已一去不复返。然而，布巴斯提并未忘记，他们终有一天将使人类重回应有的位置，屈膝于他们面前。"
 building_type_samhain_grounds_01: "夏末节场地"
 building_type_samhain_grounds_01_desc: "#F 尽管处境岌岌可危，祟利坎仍然沉迷于他们过度的激情中，利用传统的夏末节将凡人（以及其他生物）引向同样的情感狂潮。#!"
 building_samhain_grounds_01: "夏末节场地"
 building_samhain_grounds_01_desc: "尽管处境岌岌可危，祟利坎仍然沉迷于他们过度的激情中，利用传统的夏末节将凡人（以及其他生物）引向同样的情感狂潮。"
 building_type_warrior_scholar_lodge_01: "战斗学者营房"
 building_type_warrior_scholar_lodge_01_desc: "#F 可汗虎族追求自身的完美，无论是思想上还是身体上，以便以身作则领导猫国。#!"
 building_warrior_scholar_lodge_01: "战斗学者营房"
 building_warrior_scholar_lodge_01_desc: "可汗虎族追求自身的完美，无论是思想上还是身体上，以便以身作则领导猫国。"
 building_type_feline_throne_01: "猫王御座"
 building_type_feline_throne_01_desc: "#F 辛巴认为自己是猫族的正统统治者。当有人质疑这一主张时，会发现他们傲慢得几乎近于残忍。#!"
 building_feline_throne_01: "猫王御座"
 building_feline_throne_01_desc: "辛巴认为自己是猫族的正统统治者。当有人质疑这一主张时，会发现他们傲慢得几乎近于残忍。"
 building_type_chui_mal_01: "楚伊·摩罗"
 building_type_chui_mal_01_desc: "#F 巴希拉是与人类最为接近的芭丝特部族。在印度，像安巴里·马乔、楚伊·摩罗、贝拉尔·梅耶以及丘帕的豹人这样的社群将他们视为天赐的恩赐。并且愿意为他们的神祇付出生命。#!"
 building_chui_mal_01: "楚伊·摩罗"
 building_chui_mal_01_desc: "巴希拉是与人类最为接近的芭丝特部族。在印度，像安巴里·马乔、楚伊·摩罗、贝拉尔·梅耶以及丘帕的豹人这样的社群将他们视为天赐的恩赐。并且愿意为他们的神祇付出生命。"
 building_type_temple_bastet_01: "芭丝特神殿群"
 building_type_temple_bastet_01_desc: "#F 萨卡拉的芭丝特神庙建在特提金字塔东南的广阔区域。这一区域包括女神圣所、她的神庙建筑群以及她的地下墓穴。其被赛特之子毁坏标志着布巴斯提对埃及统治的结束。#!"
 building_temple_bastet_01: "芭丝特神殿群"
 building_temple_bastet_01_desc: "萨卡拉的芭丝特神庙建在特提金字塔东南的广阔区域。这一区域包括女神圣所、她的神庙建筑群以及她的地下墓穴。其被赛特之子毁坏标志着布巴斯提对埃及统治的结束。"
 building_type_ransacked_court_samhach_01: "被洗劫的萨姆哈奇王庭"
 building_type_ransacked_court_samhach_01_desc: "#F 在他们的宿敌萨姆哈奇被处理掉、被俘的族人终于被解救后，祟利坎终于可以尽情享受他们长久以来所渴望的诸多生活乐趣。而开始的最佳方式莫过于在他们倒下的敌人的王庭废墟中举办一场庆典。#!"
 building_ransacked_court_samhach_01: "被洗劫的萨姆哈奇王庭"
 building_ransacked_court_samhach_01_desc: "在他们的宿敌萨姆哈奇被处理掉、被俘的族人终于被解救后，祟利坎终于可以尽情享受他们长久以来所渴望的诸多生活乐趣。而开始的最佳方式莫过于在他们倒下的敌人的王庭废墟中举办一场庆典。"
 building_type_court_bright_kings_01: "光王王庭"
 building_type_court_bright_kings_01_desc: "#F 无论可汗虎族做什么，他们都会全力以赴，无论是战斗、狩猎还是思考。光王王庭体现了这种无畏的激情，充满了活力和生气。#!"
 building_court_bright_kings_01: "光王王庭"
 building_court_bright_kings_01_desc: "无论可汗虎族做什么，他们都会全力以赴，无论是战斗、狩猎还是思考。光王王庭体现了这种无畏的激情，充满了活力和生气。"
 building_type_throne_sunlight_01: "日光御座"
 building_type_throne_sunlight_01_desc: "#F 辛巴将自己比作太阳，像他们的狮王头上燃烧的鬃毛一样。然而，对其他部族而言，他们却是“黑暗之王”，通过恐吓和威慑来强行维持秩序的暴君。#!"
 building_throne_sunlight_01: "日光御座"
 building_throne_sunlight_01_desc: "辛巴将自己比作太阳，像他们的狮王头上燃烧的鬃毛一样。然而，对其他部族而言，他们却是“黑暗之王”，通过恐吓和威慑来强行维持秩序的暴君。"
 building_type_silver_refuge_01: "银之避难所"
 building_type_silver_refuge_01_desc: "#F 斯瓦拉，或称自为“银族”，是精神领域中不懈的治疗者。他们的速度和对这一使命的奉献精神，在这个平和而舒缓的避难所中得到了充分体现。#!"
 building_silver_refuge_01: "银之避难所"
 building_silver_refuge_01_desc: "斯瓦拉，或称自为“银族”，是精神领域中不懈的治疗者。他们的速度和对这一使命的奉献精神，在这个平和而舒缓的避难所中得到了充分体现。"
 building_type_kinfolk_meeting_grounds_01: "兽嫡聚集地"
 building_type_kinfolk_meeting_grounds_01_desc: "#F 在这里，附近部族的重要[GetTrait('kinfolk').GetName(GetNullCharacter)]聚集在一起，与当地民众打成一片，希望能培养出下一代的战士。#!"
 building_kinfolk_meeting_grounds_01: "小型兽嫡聚集地"
 building_kinfolk_meeting_grounds_01_desc: "一个专门为附近的[GetTrait('kinfolk').GetName(GetNullCharacter)]提供服务的小社区。虽然不怎么好看，但仍是他们的家。"
 building_kinfolk_meeting_grounds_02: "中型兽嫡聚集地"
 building_kinfolk_meeting_grounds_02_desc: "在这里，[GetTrait('kinfolk').GetName(GetNullCharacter)]与彼此和周围的环境互动，在不需响应部族的召集时，过着自己的生活。"
 building_kinfolk_meeting_grounds_03: "大型兽嫡聚集地"
 building_kinfolk_meeting_grounds_03_desc: "这里有大量得到很好的安置的[GetTrait('kinfolk').GetName(GetNullCharacter)]。甚至还有为下一代提供的房间。"
 building_type_kinfolk_healers_01: "兽嫡医师"
 building_type_kinfolk_healers_01_desc: "#F 草药与其他老秘方，在[GetTrait('kinfolk').GetName(GetNullCharacter)]之间代代相传。#!"
 building_kinfolk_healers_01: "兽嫡医师学徒"
 building_kinfolk_healers_01_desc: "在治疗师刚开启旅程时，他们仍然受到部族的重视。"
 building_kinfolk_healers_02: "兽嫡医师"
 building_kinfolk_healers_02_desc: "当必须为最不可能发生的疾病找到拯救办法时，部族知道该去哪里找。"
 building_kinfolk_healers_03: "训练有素的兽嫡医师"
 building_kinfolk_healers_03_desc: "部族的战士们毫无顾虑地投入战斗，他们清楚地知道，他们将被这些蒙福的人从死亡中拯救出来。"
 building_type_kinfolk_militia_01: "兽嫡民兵"
 building_type_kinfolk_militia_01_desc: "#F 在需要的时候，每个男人、女人和孩子都必须准备好保护族群。#!"
 building_kinfolk_militia_01: "小型兽嫡民兵"
 building_kinfolk_militia_01_desc: "并不多以真正吓到一个坚定的对手，但总比没有好。"
 building_kinfolk_militia_02: "中型兽嫡民兵"
 building_kinfolk_militia_02_desc: "足够数量的战士，准备好行军，保卫他们的家园。"
 building_kinfolk_militia_03: "大型兽嫡民兵"
 building_kinfolk_militia_03_desc: "该部族无法再要求比这更强大的坚定战士们在需要时支持他们。"
 building_type_kinfolk_markets_01: "兽嫡市场"
 building_type_kinfolk_markets_01_desc: "#F 在那里，你与部族成员聚集在一起，以物易物，讨价还价，讨论族群需要什么。#!"
 building_kinfolk_markets_01: "小型兽嫡市场"
 building_kinfolk_markets_01_desc: "一个小型兽嫡市场，供[GetTrait('kinfolk').GetName(GetNullCharacter)]聚在一起进行交易。"
 building_kinfolk_markets_02: "中型兽嫡市场"
 building_kinfolk_markets_02_desc: "一些当地居民被允许来到这里，允许与当地的[GetTrait('kinfolk').GetName(GetNullCharacter)]族群交易。"
 building_kinfolk_markets_03: "大型兽嫡市场"
 building_kinfolk_markets_03_desc: "令族群中的一些传统主义者懊恼的是，你的[GetTrait('kinfolk').GetName(GetNullCharacter)]现在已经是当地贸易不可分割的一部分了。"
 building_type_kinfolk_bonfire_01: "兽嫡篝火"
 building_type_kinfolk_bonfire_01_desc: "#F 你祖辈的伟大事迹被传于下一代之处。#!"
 building_kinfolk_bonfire_01: "小型兽嫡篝火"
 building_kinfolk_bonfire_01_desc: "讲故事是一门艺术，而有才华的艺术家在你的族群中目前还很少。"
 building_kinfolk_bonfire_02: "中型兽嫡篝火"
 building_kinfolk_bonfire_02_desc: "在此讲述旧日之传说，或将启发明日之传奇。"
 building_kinfolk_bonfire_03: "大型兽嫡篝火"
 building_kinfolk_bonfire_03_desc: "少者来此聆听，而长者来此追忆。部族成员们聚拢到一起。"
 building_type_wyrm_taint_01: "$glossary_wyrm$污染"
 building_type_wyrm_taint_01_desc: "#F 熵与腐朽是轮回的自然部分。但最终，它们渴望吞噬一切。#!"
 building_wyrm_taint_01: "微小玷污"
 building_wyrm_taint_01_desc: "受损、被诅咒或贫瘠的土地，这是$glossary_wyrm$胜利的开端，也是造物败亡的起点。"
 building_wyrm_taint_02: "严重污染"
 building_wyrm_taint_02_desc: "死亡潜伏在生命的阴影中。而在这里，它彻底藏匿无踪。"
 building_wyrm_taint_03: "$glossary_wyrm$腐地"
 building_wyrm_taint_03_desc: "这里是希望消亡之地，被原始熵的无尽饥渴所吞噬。"
 building_type_caern_rage_01: "魂怒圣地"
 building_type_caern_rage_01_desc: "#F 致力于追求战争的圣地，在这里，狼人和兽嫡一直在寻找新的值得一战的战斗。#!"
 building_caern_rage_01: "初建魂怒圣地"
 building_caern_rage_01_desc: "一个不断壮大的圣地，拥有熟练的战士，尽管数量很少。"
 building_caern_rage_02: "小型魂怒圣地"
 building_caern_rage_02_desc: "一座小型魂怒圣地，这里每天都能听到训练的声音。$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_rage_03: "中型魂怒圣地"
 building_caern_rage_03_desc: "战争与痛苦之灵在这圣地筑巢，将它们相当的专业知识借给这里的狼人。$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_rage_04: "大型魂怒圣地"
 building_caern_rage_04_desc: "在长者的指引下，新一代的战士将在此地诞生。$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_rage_05: "巨型魂怒圣地"
 building_caern_rage_05_desc: "该地区最令人印象深刻的圣地，在这里，战争是一种艺术，战斗是一种被需要的物资。$POD_fera_requirements_development_below_t5_ducal$"
 building_type_caern_leadership_01: "领导圣地"
 building_type_caern_leadership_01_desc: "#F 致力于部族团结的圣地，吸引了许多来自不同背景的战群来到这里。#!"
 building_caern_leadership_01: "初建领导圣地"
 building_caern_leadership_01_desc: "一位强大的领袖或将在此诞生，但此地规模对于如此宏伟的野心而言暂时还太小。"
 building_caern_leadership_02: "小型领导圣地"
 building_caern_leadership_02_desc: "令你的下属们牢记职责是一项不容搁置的任务。$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_leadership_03: "中型领导圣地"
 building_caern_leadership_03_desc: "狼群的强大程度取决于头狼；圣地的强大程度取决于君王。$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_leadership_04: "大型领导圣地"
 building_caern_leadership_04_desc: "如果领导能力能够后天习得，那么此处便是研习之所。$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_leadership_05: "巨型领导圣地"
 building_caern_leadership_05_desc: "当每个成员都各司其职，部族才能在明智而强大的领导下发展壮大。$POD_fera_requirements_development_below_t5_ducal$"
 building_type_caern_will_01: "意志圣地"
 building_type_caern_will_01_desc: "#F 致力于通过世俗和特异手段改善部族的圣地。#!"
 building_caern_will_01: "初建意志圣地"
 building_caern_will_01_desc: "狼人们在此处探究他们在当今世界中的角色。"
 building_caern_will_02: "小型意志圣地"
 building_caern_will_02_desc: "与邻近社区的试探性贸易正在缓解圣地不稳定的孤立状态。$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_will_03: "中型意志圣地"
 building_caern_will_03_desc: "一位祖灵对这圣地降下了祝福，带来了有关过去与未来的宝贵经验。$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_will_04: "大型意志圣地"
 building_caern_will_04_desc: "一位土元素保护着这个圣地，对其居民坚忍不拔的决心感到高兴。$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_will_05: "巨型意志圣地"
 building_caern_will_05_desc: "这座圣地与周围环境巧妙地融为一体，赢得了整个地区的尊重和感谢。$POD_fera_requirements_development_below_t5_ducal$"
 building_type_caern_enigmas_01: "隐谜圣地"
 building_type_caern_enigmas_01_desc: "#F 一个专门研究狼族最微妙的技艺的圣地，经常受到狡猾的影爵的青睐。#!"
 building_caern_enigmas_01: "初建隐谜圣地"
 building_caern_enigmas_01_desc: "这里满是千术和幻术，年轻的小崽子得以模仿，学会了更微妙的做事办法的价值。"
 building_caern_enigmas_02: "小型隐谜圣地"
 building_caern_enigmas_02_desc: "这座圣地的长者知道一些可以让你思考数周答案的谜题。如果真的有答案的话。$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_enigmas_03: "中型隐谜圣地"
 building_caern_enigmas_03_desc: "奇魅之灵祝福了这座圣地，很高兴看到这里的狡猾。$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_enigmas_04: "大型隐谜圣地"
 building_caern_enigmas_04_desc: "阴影混淆了这座圣地，成就了友好之灵聚集在一起，保卫并观察居住在其中的狡猾的居民的结果。$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_enigmas_05: "巨型隐谜圣地"
 building_caern_enigmas_05_desc: "在这甚至可以策划让吸血鬼感到疑惑的阴谋，逆转狼人作为无脑野蛮人的声誉。$POD_fera_requirements_development_below_t5_ducal$"
 building_type_caern_wisdom_01: "智慧圣地"
 building_type_caern_wisdom_01_desc: "#F 在一个被战争蹂躏的世界里的和平圣地，对于精神被削弱的狼人来说是一个非常有用的绿洲。#!"
 building_caern_wisdom_01: "初建智慧圣地"
 building_caern_wisdom_01_desc: "这里提供了灵魂和身体的憩息。在一个残酷的世界当中，这是一种难得的慈悲。"
 building_caern_wisdom_02: "小型智慧圣地"
 building_caern_wisdom_02_desc: "这座圣地的教义在整个地区以智慧和值得审议而闻名。$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_wisdom_03: "中型智慧圣地"
 building_caern_wisdom_03_desc: "一只睿智的枭灵把这个圣地当作自己的家，从上面暗中观察着它的居民。$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_wisdom_04: "大型智慧圣地"
 building_caern_wisdom_04_desc: "教导，辩论，治疗……各种形式的精神帮助都能在这里找到。$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_wisdom_05: "巨型智慧圣地"
 building_caern_wisdom_05_desc: "有了这样一处繁荣的智慧圣地，像魂怒之战这样的错误就有希望在未来当中被避免。$POD_fera_requirements_development_below_t5_ducal$"
 building_type_werewolf_hunting_party_01: "狼人狩猎队"
 building_type_werewolf_hunting_party_01_desc: "#F 总有一些人类试图侵犯你的领地。同样，总有殷切的部族幼崽们准备获取这垂手可得的荣耀。#!"
 building_werewolf_hunting_party_01: "小型狼人狩猎队"
 building_werewolf_hunting_party_01_desc: "一支简单的巡逻队，移除你领地上最猖獗的人类侵犯者。"
 building_werewolf_hunting_party_02: "中型狼人狩猎队"
 building_werewolf_hunting_party_02_desc: "殷切的部族幼崽们用靠近你族群的不明智人类来磨练他们的技能。$POD_fera_requirements_development_below_t2$"
 building_werewolf_hunting_party_03: "大型狼人狩猎队"
 building_werewolf_hunting_party_03_desc: "人类害怕狼群是有原因的。你绝不会让它们所谓的“文明”在此处猖獗。$POD_fera_requirements_development_below_t3$"
 building_type_werewolf_scouting_party_01: "狼人侦察队"
 building_type_werewolf_scouting_party_01_desc: "#F 每时每刻都有幼崽们经历他们的原始觉醒，而他们需要被找到。这就是这些熟练的追踪者们的任务。#!"
 building_werewolf_scouting_party_01: "小型狼人侦察队"
 building_werewolf_scouting_party_01_desc: "一两个熟练的追踪者，只够覆盖周围的村庄。"
 building_werewolf_scouting_party_02: "中型狼人侦察队"
 building_werewolf_scouting_party_02_desc: "这群训练有素的追踪者在广泛的区域中搜寻，寻找任何幼崽来帮助他们完成原始觉醒。$POD_fera_requirements_development_below_t2$"
 building_werewolf_scouting_party_03: "大型狼人侦察队"
 building_werewolf_scouting_party_03_desc: "多亏了你众多的侦察队，在这地区很少有幼崽能逃脱你的视线。对他们的救援使部族稳步发展。$POD_fera_requirements_development_below_t3$"
 building_type_werewolf_training_grounds_01: "狼人训练场"
 building_type_werewolf_training_grounds_01_desc: "#F 兽嫡必须得到训练才能成为成为族群的有用之材。#!"
 building_werewolf_training_grounds_01: "小型狼人训练场"
 building_werewolf_training_grounds_01_desc: "兽嫡们在这里得到基础的战斗训练。至少足够让他们知道剑的尖端在哪。"
 building_werewolf_training_grounds_02: "中型狼人训练场"
 building_werewolf_training_grounds_02_desc: "他们永远不会像狼人那样令人生畏。但他们会竭尽全力。$POD_fera_requirements_development_below_t2$"
 building_werewolf_training_grounds_03: "大型狼人训练场"
 building_werewolf_training_grounds_03_desc: "真正通晓战争之道者寥寥。但得益于你无与伦比的导师，你的[GetTrait('kinfolk').GetName(GetNullCharacter)]很快就能掌握。$POD_fera_requirements_development_below_t3$"
 building_type_werewolf_warden_01: "狼人看守"
 building_type_werewolf_warden_01_desc: "#F [GetTrait('kinfolk').GetName(GetNullCharacter)]对部族的未来至关重要。他们的安全远比他们的自由来得重要。#!"
 building_werewolf_warden_01: "宽松狼人看守"
 building_werewolf_warden_01_desc: "一个友好而合群的看守也许并非最好的保护者，但这至少是个开始"
 building_werewolf_warden_02: "严厉狼人看守"
 building_werewolf_warden_02_desc: "这位粗犷的长者确保愚蠢的[GetTrait('kinfolk').GetName(GetNullCharacter)]安分守己$POD_fera_requirements_development_below_t2$"
 building_werewolf_warden_03: "苛刻狼人看守"
 building_werewolf_warden_03_desc: "其等不能在他不知道的情况下出任何棉薄之力。尤其是在他不赞同的情况下。$POD_fera_requirements_development_below_t3$"
 building_type_werewolf_raiding_party_01: "狼人劫掠队"
 building_type_werewolf_raiding_party_01_desc: "#F 狼人们被惧怕是有原因的。他们会对任何觉察到的敌人发起难以预测且致命的攻击。#!"
 building_werewolf_raiding_party_01: "小型狼人劫掠队"
 building_werewolf_raiding_party_01_desc: "一小队熟练的战士，足够让周边地区对潜伏的狼群保持忌惮。"
 building_werewolf_raiding_party_02: "中型狼人劫掠队"
 building_werewolf_raiding_party_02_desc: "数个战群在乡村游荡，在任何有威胁的团体组织起来之前就对其进行攻击。$POD_fera_requirements_development_below_t2$"
 building_werewolf_raiding_party_03: "大型狼人劫掠队"
 building_werewolf_raiding_party_03_desc: "惧怕夜里的狼嚎吧。掠食到不敢来招惹，其等会意识到这是多么徒劳的行为。$POD_fera_requirements_development_below_t3$"
 building_type_amazon_camp_01: "亚马逊营地"
 building_type_amazon_camp_01_desc: "#F 部族中最年轻的女儿们将通过鲜血与狂怒证明她们自己。#!"
 building_amazon_camp_01: "亚马逊营地"
 building_amazon_camp_01_desc: "盖亚的女战士是如此可怖，显然是地母本人之狂怒的化身。"
 building_type_scavengers_01: "清道夫"
 building_type_scavengers_01_desc: "#F 聪明的啮骨者们从不会浪费任何好东西，尤其是他们倒下敌人的尸首。#!"
 building_scavengers_01: "清道夫"
 building_scavengers_01_desc: "聪明的啮骨者们从不会浪费任何好东西，尤其是他们倒下敌人的尸首。"
 building_type_black_spiral_01: "黑螺旋"
 building_type_black_spiral_01_desc: "#F 随着螺旋起舞。起舞，然后获得自由。起舞，直至你的理智散去，获得新生。#!"
 building_black_spiral_01: "黑螺旋"
 building_black_spiral_01_desc: "随着螺旋起舞。起舞，然后获得自由。起舞，直至你的理智散去，获得新生。"
 building_type_gaia_refuge_01: "盖亚的庇护所"
 building_type_gaia_refuge_01_desc: "#F 盖亚之子赐予落魄之人盖亚的怜悯，不管他们是来自其他部落还是人类当中的弃子。#!"
 building_gaia_refuge_01: "盖亚的庇护所"
 building_gaia_refuge_01_desc: "盖亚之子赐予落魄之人盖亚的怜悯，不管他们是来自其他部族还是来自人类的流浪者。"
 building_type_bard_gathering_01: "吟游诗人聚所"
 building_type_bard_gathering_01_desc: "#F 在这，人们在好伙伴中分享荒诞不经的故事，在肆意的狂欢中巩固了部族的团结。#!"
 building_bard_gathering_01: "吟游诗人聚所"
 building_bard_gathering_01_desc: "在这，人们在好伙伴中分享荒诞不经的故事，在肆意的狂欢中巩固了部族的团结。"
 building_type_heroes_summit_01: "英雄峰会"
 building_type_heroes_summit_01_desc: "#F 传说可不仅止于过去。只要诸神黄昏的阴影持续笼罩着，芬里斯的英雄们就会奋起迎接挑战。#!"
 building_heroes_summit_01: "英雄峰会"
 building_heroes_summit_01_desc: "萨迦可不仅止于过去。只要诸神黄昏的阴影持续逼近，芬里斯的英雄们就会奋起为这准备。"
 building_type_city_wolves_01: "城狼"
 building_type_city_wolves_01_desc: "#F 人类监护者与人类一起合作，试图引导它走向共同繁荣。#!"
 building_city_wolves_01: "城狼"
 building_city_wolves_01_desc: "人类监护者与人类一起合作，试图引导它走向共同繁荣。"
 building_type_constant_impergium_01: "刀耕之治"
 building_type_constant_impergium_01_desc: "#F 人类是一种瘟疫。赤爪会将他们一一宰杀，将瘟疫扑灭。#!"
 building_constant_impergium_01: "刀耕之治"
 building_constant_impergium_01_desc: "人类是一种瘟疫。赤爪会将他们一一宰杀，将瘟疫扑灭。"
 building_type_shadowy_summit_01: "暗影峰会"
 building_type_shadowy_summit_01_desc: "#F 狡黠的影爵经常被他们的狼人同伴称为无耻之徒，但没有人能够否认他们能够取得的成果。#!"
 building_shadowy_summit_01: "暗影峰会"
 building_shadowy_summit_01_desc: "狡黠的影爵经常被他们的狼人同伴称为无耻之徒，但没有人能够否认他们能够取得的成果。"
 building_type_travelers_lodging_01: "旅人宿处"
 building_type_travelers_lodging_01_desc: "#F 作为流浪者，寂静漫游者们比任何人都懂得一处可供休憩和分享旅途故事的宜人之所的价值。#!"
 building_travelers_lodging_01: "旅人宿处"
 building_travelers_lodging_01_desc: "作为流浪者，寂静漫游者们比任何人都懂得一处可供休憩和分享旅途故事的宜人之所的价值。"
 building_type_noble_trappings_01: "贵族标志"
 building_type_noble_trappings_01_desc: "#F 作为狼国的贵族，银牙被认为是万物光荣而公正的统治者。#!"
 building_noble_trappings_01: "贵族标志"
 building_noble_trappings_01_desc: "作为狼国的贵族，银牙被认为是万物光荣而公正的统治者。"
 building_type_hidden_retreat_01: "狡兔三窟"
 building_type_hidden_retreat_01_desc: "#F 星占部族完全掌控着他们的魂怒，在展开行动前总能作出冷静的判断。#!"
 building_hidden_retreat_01: "狡兔三窟"
 building_hidden_retreat_01_desc: "星占部族完全掌控着他们的魂怒，在展开行动前总能作出冷静的判断。"
 building_type_sun_glory_01: "日耀圣地"
 building_type_sun_glory_01_desc: "#F 这座以一个永冻的湖泊为中心的圣地也许是欧洲最重要的多部族聚会场所。#!"
 building_sun_glory_01: "萌芽的日耀圣地"
 building_sun_glory_01_desc: "在创立之初被称作大山圣地，后来为了表彰纪尧姆在该地区日耀的功绩而改名。"
 building_sun_glory_02: "扩张的日耀圣地"
 building_sun_glory_02_desc: "以纪尧姆为榜样，日耀圣地致力于消灭吸血鬼，为它赢得了可怕的名声。"
 building_sun_glory_03: "雄伟的日耀圣地"
 building_sun_glory_03_desc: "赫利俄斯保护着圣地，他那致命的射线确保没有吸血鬼可以毫无意外地进入这里。"
 building_type_white_sea_01: "白海圣地"
 building_type_white_sea_01_desc: "#F 芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。#!"
 building_white_sea_01: "萌芽的白海圣地"
 building_white_sea_01_desc: "芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。"
 building_white_sea_02: "扩张的白海圣地"
 building_white_sea_02_desc: "芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。"
 building_white_sea_03: "雄伟的白海圣地"
 building_white_sea_03_desc: "芬兰的盖亚之子都聚集在体力圣地。这处圣地拥有强大的防御能力，这也使它赢得了附近部族的尊重。"
 building_type_wild_sea_01: "狂海圣地"
 building_type_wild_sea_01_desc: "#F 这座圣地的中心是一座古老的原始教徒之墓，在凯尔特人到来之前，居住在这一带的鬼魂一直困扰着这里。#!"
 building_wild_sea_01: "萌芽的狂海圣地"
 building_wild_sea_01_desc: "这圣地是一处幽静之地，但自从接待被剥皮瘟疫肆虐的难民后使其资源紧张到极点。"
 building_wild_sea_02: "扩张的狂海圣地"
 building_wild_sea_02_desc: "原始教徒墓地的鬼魂的无声悲泣穿透了世界之间的迷障，并允许芬尼安眉月狼从[umbra|E]汲取灵知。"
 building_wild_sea_03: "雄伟的狂海圣地"
