 building_type_wheel_ptah_01: "卜塔之轮圣地"
 building_type_wheel_ptah_01_desc: "#F 一处神秘的圣地，显然是在寂静漫游者从埃及流亡出来后被赠送于他们作为新家。从那时起，它就一直很好地服务于这个部族。#!"
 building_wheel_ptah_01: "萌芽的卜塔之轮圣地"
 building_wheel_ptah_01_desc: "一处神秘的圣地，显然是在寂静漫游者从埃及流亡出来后被赠送于他们作为新家。从那时起，它就一直很好地服务于这个部族。"
 building_wheel_ptah_02: "扩张的卜塔之轮圣地"
