 building_type_mokole_wallow_01: "栖巢"
 building_type_mokole_wallow_01_desc: "栖巢是魔克拉群所使用的术语，用来指代他们自己以及其他鳄鱼或爬行动物的栖息地。"
 building_mokole_wallow_01: " 新兴栖巢"
 building_mokole_wallow_01_desc: "魔克拉过着比千年前粗陋得多的生活。但家就是家。"
 building_mokole_wallow_02: "小栖巢"
 building_mokole_wallow_02_desc: "蜥裔和兽嫡和谐共处之地，远离外界窥探的目光。$POD_fera_requirements_development_below_t2_ducal$"
 building_mokole_wallow_03: "中等栖巢"
 building_mokole_wallow_03_desc: "印度和尼罗河沿岸那些被遗忘神明所主宰的破败神庙，中国河边的渔村，那些与世隔绝的沼泽和湿地；任何一个这样的地方都有可能成为魔克拉社区的庞大庇护所。$POD_fera_requirements_development_below_t3_ducal$"
 building_mokole_wallow_04: "大栖巢"
 building_mokole_wallow_04_desc: "一座真正属于蜥蜴之王的神殿，隐匿于凡人所谓的文明的视线之外。$POD_fera_requirements_development_below_t4_ducal$"
 building_mokole_wallow_05: "巨大的栖巢"
 building_mokole_wallow_05_desc: "魔克拉的梦境向他们诉说着远古纪元里蜥蜴霸权的辉煌，那时先祖们栖息在爬行生物的奢华盛世中。这片泥沼，正是梦想成真之地。$POD_fera_requirements_development_below_t5_ducal$"
 building_type_thunder_blade_01: "雷刃圣地"
 building_type_thunder_blade_01_desc: "#F 井上家族的城堡以其悠久的历史而显得格外显眼。#!"
 building_thunder_blade_01: "萌芽的雷刃圣地"
 building_thunder_blade_01_desc: "许多八犬在此圣地磨砺刀技。只要八犬还有一口气在，圣地就会充盈刀剑交锋之声。"
 building_thunder_blade_02: "扩张的雷刃圣地"
 building_thunder_blade_02_desc: "$building_thunder_blade_01_desc$"
 building_thunder_blade_03: "雄伟的雷刃圣地"
 building_thunder_blade_03_desc: "$building_thunder_blade_01_desc$"
 building_type_emerald_palace_01: "翡翠宫"
 building_type_emerald_palace_01desc: "#F $building_emerald_palace_01_desc$#!"
 building_emerald_palace_01: "翡翠宫"
 building_emerald_palace_01_desc: "兽妖在日本的权力中心。根据八犬的荣誉准则，所有兽庭的盟友，无论出于何种目的，都欢迎来到这些殿堂。"
 building_type_scaled_encampment_01: "鳞甲营地"
 building_type_scaled_encampment_01_desc: "魔克拉战士常以彼此厚实的鳞甲锤炼武技。"
 building_scaled_encampment_01: "小型鳞甲营地"
 building_scaled_encampment_01_desc: "当魔克拉为战斗训练时，偶尔能听见金石铿锵之声。"
 building_scaled_encampment_02: "鳞甲营地"
 building_scaled_encampment_02_desc: "蜥蜴人魁梧的战士们相互搏斗时，震耳欲聋的战吼响彻天际。$POD_fera_requirements_development_below_t2$"
 building_scaled_encampment_03: "大型鳞甲营地"
 building_scaled_encampment_03_desc: "武器、利爪，及各式各样的半龙形武器回音组成反覆响起的合唱，自始至终不断回荡。$POD_fera_requirements_development_below_t3$"
 building_type_saurian_armory_01: "蜥蜴人军械库"
 building_type_saurian_armory_01_desc: "有时，一把藏在身上的可靠长剑所产生的威力，甚至能与半龙形的利爪相媲美。"
 building_saurian_armory_01: "小型蜥蜴人械库"
 building_saurian_armory_01_desc: "这间军械库的墙上陈列着几把技艺精湛的锻造刀剑。"
 building_saurian_armory_02: "蜥蜴人军械库"
 building_saurian_armory_02_desc: "锋利的剑，坚固的盾。任何能延长战士生命的东西都行。$POD_fera_requirements_development_below_t2$"
 building_saurian_armory_03: "大型蜥蜴人军械库"
 building_saurian_armory_03_desc: "这座大厅里陈列着古老的魔克拉剑、长矛、棍棒和斧头。它们正等待着一位强壮的臂膀来挥舞它们。$POD_fera_requirements_development_below_t3$"
 building_type_hall_elders_01: "长老厅"
 building_type_hall_elders_01_desc: "作为盖亚的记忆，魔克拉一族铭记着古老的知识，并以严谨的传承之心，将其交付于后世。他们的存在本身便是流动的记忆长河，在血脉与追忆中延续着世界的平衡与智慧。"
 building_hall_elders_01: "长老长厅"
 building_hall_elders_01_desc: "在魔克拉的社会中，一位受尊敬的长老不仅是知识的活载体，更是族群延续的基石。"
 building_hall_elders_02: "长老厅"
 building_hall_elders_02_desc: "对于那些比我们更接近蜥蜴王的存在而言，这里有很多东西值得学习。$POD_fera_requirements_development_below_t2$"
 building_hall_elders_03: "长老大厅"
 building_hall_elders_03_desc: "在这里，那些早在人类纪元之前便已存在的记忆，正以鲜活的方式被复述着$POD_fera_requirements_development_below_t3$"
 building_type_crafters_district_01: "工匠区"
 building_type_crafters_district_01_desc: "魔克拉在化形者世界中是备受尊敬的工匠。他们的一些作品历经了多个时代依然完好无损。"
 building_crafters_district_01: "小型工匠区"
 building_crafters_district_01_desc: "对于一个初具规模的魔克拉社区而言，这已经是最低的要求了，但在这里，它依然是社会生活中备受尊重的重要组成部分。"
 building_crafters_district_02: "工匠区"
 building_crafters_district_02_desc: "一些展示区的商品价格可能看起来偏高，但这恰恰体现了魔克拉工匠们的精湛技艺。$POD_fera_requirements_development_below_t2$"
 building_crafters_district_03: "大型工匠区"
 building_crafters_district_03_desc: "异国的统治者们自豪地佩戴着此匠造坊区的作品，却未曾察觉其创作者源自身披鳞甲的族裔。$POD_fera_requirements_development_below_t3$"
 building_type_nest_defences_01: "巢穴戍卫"
 building_type_nest_defences_01_desc: "谁会愚蠢到去攻击魔克拉的巢穴呢？只有那些极其勇敢的人……或者是极其绝望的人才会这么做。"
 building_nest_defences_01: "薄弱的巢穴防御体系"
 building_nest_defences_01_desc: "一些巡逻队，一些木制的障碍物……这个巢穴主要依靠其守卫者的力量来维持。"
 building_nest_defences_02: "巢穴戍卫"
 building_nest_defences_02_desc: "虽然这并非一座真正宏伟的城堡，但这座堡垒具备严格的管理机制和充足的物资储备，以便在必要时能够进行自卫。$POD_fera_requirements_development_below_t2$"
 building_nest_defences_03: "森严戍卫"
 building_nest_defences_03_desc: "这曾是蜥蜴王族的坚固堡垒，只有陨石才能将其攻破。$POD_fera_requirements_development_below_t3$"
 building_type_fields_strife_01: "冲突之场"
 building_type_fields_strife_01_desc: "恩托班的战士们虽遭挫折，却让敌人付出了更惨痛的代价。这种不屈的精神至今犹存。"
 building_fields_strife_01: "小型冲突之场"
 building_fields_strife_01_desc: "今日的训练建构明日的胜利。"
 building_fields_strife_02: "冲突之场"
 building_fields_strife_02_desc: "一名训练有素的魔克拉-姆边贝对你怒目而视或许比野蛮未训的向你冲锋更加令人恐惧。$POD_fera_requirements_development_below_t2$"
 building_fields_strife_03: "大型冲突之场"
 building_fields_strife_03_desc: "借着重演魔克拉昔日的辉煌战役，魔克拉-姆边贝为明日之战完善其战术。$POD_fera_requirements_development_below_t3$"
 building_type_dry_den_01: "干涸巢穴"
 building_type_dry_den_01_desc: "彩虹蛇族的孩子们过着与世隔绝且条件艰苦的生活。但他们却充分利用了这一切。"
 building_dry_den_01: "小型干涸巢穴 "
 building_dry_den_01_desc: "对于蜥蜴族人而言，沙漠不过是一个顽固的伙伴罢了。"
 building_dry_den_02: "干涸巢穴"
 building_dry_den_02_desc: "来到这个地方的游客寥寥无几，而这种状况对于古玛甘人来说已经习以为常了。$POD_fera_requirements_development_below_t2$"
 building_dry_den_03: "大型干涸巢穴"
 building_dry_den_03_desc: "如果说太阳是魔克拉整体的守护神，那么古马甘则是最能理解太阳的。$POD_fera_requirements_development_below_t3$"
 building_type_motley_haunt_01: "斑驳萦境"
 building_type_motley_haunt_01_desc: "这些魔克拉族人是与人类最为接近的族群，他们比其他许多同类更能理解并适应当今的世界。"
 building_motley_haunt_01: "小型斑驳萦境"
 building_motley_haunt_01_desc: "太阳虽是光芒万丈，但它亦是智慧之源。聪明的摩迦罗能分辨出这两者的不同。"
 building_motley_haunt_02: "斑驳萦境"
 building_motley_haunt_02_desc: "每当有关阿耆尼的论述传来，那熊熊燃烧的火焰所带来的宁静之声便能抚慰这里的居民的心灵。$POD_fera_requirements_development_below_t2$"
 building_motley_haunt_03: "宏伟斑驳萦境"
 building_motley_haunt_03_desc: "魔克拉帝国的一些最杰出的外交官曾在此接受教育，他们在贾雅的睿智宇宙指引下学习成长。$POD_fera_requirements_development_below_t3$"
 building_type_dragon_temple_01: "巨龙寺庙"
 building_type_dragon_temple_01_desc: "水之流脉注视着外面的世界，陷入沉思。它们的思绪或许正是拯救宇宙平衡的关键。"
 building_dragon_temple_01: "幼龙寺庙"
 building_dragon_temple_01_desc: "龙王的先祖们遥望着继任者们的作为。"
 building_dragon_temple_02: "巨龙寺庙"
 building_dragon_temple_02_desc: "虽然此地的居民珍视隐居避世，但人间关于智慧与力量并存的龙传说，正源于此处。$POD_fera_requirements_development_below_t2$"
 building_dragon_temple_03: "宏伟巨龙寺庙"
 building_dragon_temple_03_desc: "勇士寻龙为财宝，智者求龙为开悟。$POD_fera_requirements_development_below_t3$"
 building_type_crocodilopolis_01: "鳄鱼之城"
 building_type_crocodilopolis_01_desc: "曾是强大索贝克神凡人信仰中心的鳄鱼之城，是能证明蜥蜴王在人类心中所激发的敬畏之情的遗迹。"
 building_crocodilopolis_01: "毁灭的鳄鱼之城"
 building_crocodilopolis_01_desc: "这座城市曾崇拜一只被驯服的圣鳄，名为\"佩特苏霍斯\"，意为\"索霍斯之子\"，它身披黄金与宝石挂饰。当然，这是很久很久以前了……"
 building_crocodilopolis_02: "重建的鳄鱼之城"
 building_crocodilopolis_02_desc: "阿蒙涅姆赫特三世为神圣鳄鱼划定了城市专属区域。他是否受到了魔克拉的影响？即便在今天，他们自己也无法确定。"
 crocodilopolis_02_effect_desc: "搜索这些陵墓将发现两个古老的[GetTrait('mokole').GetName(GetNullCharacter)]。"
 building_crocodilopolis_03: "非凡的鳄鱼之城"
 building_crocodilopolis_03_desc: "据说鳄鱼之城的迷宫比金字塔里的还要宏伟、更加错综复杂。谁知道里面藏着什么，或者藏着谁呢？"
 crocodilopolis_03_effect_desc: "最后的[GetTrait('mokole').GetName(GetNullCharacter)]陵墓现世了。"
 building_type_oogleforp_01: "奥古尔弗普"
 building_type_oogleforp_01_desc: "座落于尼罗河畔，魔克拉为$glossary_osirian_league$奋战之处。纵使昔日战败，其耐心足以跨越时代，只为等待复仇的时刻到来。"
 building_oogleforp_01: "重建的奥古尔弗普"
 building_oogleforp_01_desc: "用来对抗蛇之子腐化的地方，也许是历史新篇章的开始，"
 building_oogleforp_02: "奥古尔弗普"
 building_oogleforp_02_desc: "往日辉煌回忆与今日阴暗现实的碰撞，也许是通往更光亮明日的关键。"
 building_oogleforp_03: "辉煌的奥古尔弗普"
 building_oogleforp_03_desc: "整装待发的魔克拉于奥古尔弗普再次出现。没有其受诅始祖的庇护，赛特之子将再次学会恐惧蜥蜴诸王。"
 oogleforp_03_effect_desc: "半龙形形态获得：[GetModifier('archid_glittering_scales_modifier').GetNameWithTooltip]"
 building_type_umbral_lake_tele_01: "影界的特莱湖"
 building_type_umbral_lake_tele_01_desc: "魔克拉-姆边贝的诞生之地早已淡出凡人的视野，其守护者将其迁入影界，使之远离外界的窥探。"
 building_umbral_lake_tele_01: "遮蔽的特莱湖"
 building_umbral_lake_tele_01_desc: "影界的严酷环境持续猛击泰莱湖，迫使其魔克拉居民投入宝贵资源以维持运作。"
 building_umbral_lake_tele_02: "隐藏的特莱湖"
 building_umbral_lake_tele_02_desc: "特莱湖现已稳定下来，对于那些想要受其始祖魔克拉-姆边贝智慧照耀的魔克拉，这是宁静之所。"
 building_umbral_lake_tele_03: "影界的特莱湖"
 building_umbral_lake_tele_03_desc: "泰莱湖已成为魔克拉的昌盛新都，激励着那些想目睹蜥蜴诸王再次昂首挺立的蜥裔。"
 building_type_oannes_01: "欧涅斯"
 building_type_oannes_01_desc: "从前，一些魔克拉看到了新兴人类的潜力。这里便是他们选择教导人类如何从野兽状态中获得精神上的成长之处。"
 building_oannes_01: "重建的欧涅斯"
 building_oannes_01_desc: "凡人还记得欧涅斯从海里升起来教导人类艺术和哲学，魔克拉想到这一点只是微微一笑。"
 building_oannes_02: "欧涅斯"
 building_oannes_02_desc: "对于那些被魔克拉教导、心怀敬畏的人类而言，欧涅斯成为\"智慧\"的同义词。也许这段记忆可以被再次利用。"
 building_oannes_03: "辉煌的欧涅斯"
 building_oannes_03_desc: "无论欧涅斯是城市、龙人还是神，他在魔克拉的记忆中始终占据着重要的位置。尽管结局令人唏嘘，但这项实验仍然展现了人类与蜥蜴诸王合作的可能性。"
 building_type_rainbow_stone_01: "彩虹石"
 building_type_rainbow_stone_01_desc: "#F 彩虹石，彩虹蛇的象征，也是古玛甘人的力量之源。 #!"
 building_rainbow_stone_01: "彩虹石"
 building_rainbow_stone_01_desc: "彩虹石，彩虹蛇的象征，也是古玛甘人的力量之源。虽然传统上是留在班达扬，但当源流为了共同目标而奋斗、需要一个团结象征时，也可以将之移动。"
 building_type_sacred_sky_temple_01: "苍穹圣殿"
 building_type_sacred_sky_temple_01_desc: "如果要赞美太阳，那么首先得有一个合适的角度去观赏它才行。"
 building_sacred_sky_temple_01: "天穹圣殿"
 building_sacred_sky_temple_01_desc: "从最微小的入口开始朝向最伟大的庇护者"
 building_sacred_sky_temple_02: "宏伟天穹圣殿"
 building_sacred_sky_temple_02_desc: "若他们筑殿向天，终有一日或可抵达苍穹 —— 但这愿景究竟是来自 “追忆” 中的启示，抑或只是血脉深处对云渊的渴望？"
 building_sacred_sky_temple_03: "苍穹圣殿"
 building_sacred_sky_temple_03_desc: "一座相称的建筑，为众多渴望沐浴恩主荣光的魔克拉而筑。"
 building_type_sacred_crocodile_temple_01: "神圣鳄神神庙"
 building_type_sacred_crocodile_temple_01_desc: "魔克拉的兽嫡曾一度被尊为视为自己部落神明。在此地，他们再度沐浴这份尊崇。"
 building_sacred_crocodile_temple_01: "鳄神神庙"
 building_sacred_crocodile_temple_01_desc: "找到了令它们满意的栖息地后，一些鳄鱼便纷纷聚集于此。而这里，终将成为它们荣耀的殿堂。"
 building_sacred_crocodile_temple_02: "大型鳄鱼神庙"
 building_sacred_crocodile_temple_02_desc: "凡人聚集于此，朝拜那些身披鳞甲的神明 —— 无论是匍匐于地的四足之形，还是昂然屹立的双足之姿。"
 building_sacred_crocodile_temple_03: "神圣鳄神神庙"
 building_sacred_crocodile_temple_03_desc: "显然，这些鳄鱼深知自己在这里所受到的尊重和崇拜，因此越来越多的鳄鱼聚集在寺庙周边，而魔克拉守护者们则在一旁密切注视着这一切。"
 building_type_sacred_eighth_sun_temple_01: "神圣的第八太阳神庙"
 building_type_sacred_eighth_sun_temple_01_desc: "如今，只有在少数偏远地区，强大的魔克拉才能获得应有的尊重。这里就是其中之一。"
 building_sacred_eighth_sun_temple_01: "第八太阳神庙"
 building_sacred_eighth_sun_temple_01_desc: "他们是在寻求好处，还是因为对“蜥蜴之王”这种存在感到人类特有的恐惧而行动呢？"
 building_sacred_eighth_sun_temple_02: "大型第八太阳神庙"
 building_sacred_eighth_sun_temple_02_desc: "有如此多的凡人崇拜者聚集在此，这片区域逐渐形成一个兽嫡阶层也就不足为奇了。"
 building_sacred_eighth_sun_temple_03: "神圣的第八太阳神庙"
 building_sacred_eighth_sun_temple_03_desc: "由于他们的兽嫡充当着祭司和守卫的角色，魔克拉在这个庄严的神庙中被视为神明而受到尊崇。"
 building_type_sacred_scorched_temple_01: "神圣的烈火神庙"
 building_type_sacred_scorched_temple_01_desc: "魔克拉并不热衷于建造奢华的建筑。但有时，某个特定的区域——那里往往蕴藏着丰富的能源资源，或者似乎受到了太阳的庇佑——会吸引他们的注意。然后，建设工作便开始了。"
 building_sacred_scorched_temple_01: "烈火神庙 "
 building_sacred_scorched_temple_01_desc: "一座逐渐升高的寺庙，虽然规模不大，却俯瞰着远方那无边无际的沙漠和大海。"
 building_sacred_scorched_temple_02: "巨大的烈火神庙"
 building_sacred_scorched_temple_02_desc: "或许在这片沙与海交织的地带，人们能够找到真正的平衡。魔克拉至少觉得这个地方非常适合他们的体质。"
 building_sacred_scorched_temple_03: "神圣的烈火神庙"
 building_sacred_scorched_temple_03_desc: "这座宏伟的建筑已成为蜥蜴王族最宏伟的神殿之一，它见证了“太阳之子”们的耐心与勤奋，是他们智慧与努力的有力见证。"