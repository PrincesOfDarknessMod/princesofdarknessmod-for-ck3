 building_type_taghairm_gathering_01: "塔格海姆聚会"
 building_type_taghairm_gathering_01_desc: "#F 塔格海姆是一种猫族聚会，常被召集以交换信息或寒暄。其通常在月圆之夜进行。#!"
 building_taghairm_gathering_01: "小型塔格海姆聚会"
 building_taghairm_gathering_01_desc: "一个小型区域，芭丝特们聚集在这里进行非正式的交谈和玩耍。"
 building_taghairm_gathering_02: "体面的塔格海姆聚会"
 building_taghairm_gathering_02_desc: "这些场地特别为塔格海姆保留，举办了许多猫族的聚会。"
 building_taghairm_gathering_03: "大型塔格海姆聚会"
 building_taghairm_gathering_03_desc: "一个宏伟且设备齐全的区域，来自遥远地区的芭丝特来到这里与当地的同胞交流信息和知识。"
