 building_field_stars_03: "雄伟的星域圣地"
 building_field_stars_03_desc: "一座靠近河流源头的强大领导圣地。这座圣地的位置相当暴露，也使它经历了超过其公平份额的战斗和损失，其守卫者中还孕育出一个幸存者的种族。"
 building_type_den_realm_01: "巢域"
 building_type_den_realm_01_desc: "#F 巢域是一个与$glossary_fera$联系在一起，作为她的个人退路的$pod_umbra$补丁。大多数巢域与物质现实中的区域相联系，并提供一条进入近影界的通道，这样从小撇步或用类似的方式进入$pod_umbra$就会更容易。巢域受到很好地防护，很难突破它们的防御。#!"
 den_realm_effect_desc: "#help 如果这是你的首都：#!\n进入$pod_umbra$的$gnosis_with_icon$消耗降低：\n#P -25%#!/建筑等级"
 building_den_realm_01: "小型巢域"
 building_den_realm_01_desc: "一个通往$pod_umbra$口袋位面的小而实用的传送门。"
 building_den_realm_02: "中型巢域"
 building_den_realm_02_desc: "一个通往$pod_umbra$口袋位面的传送门，且有小型防御系统保护。"
 building_den_realm_03: "大型巢域"
 building_den_realm_03_desc: "一条通往$pod_umbra$大型领域的隧道，设有坚固防御，是其主人静修的理想之地。"
 building_den_realm_04: "巨型巢域"
 building_den_realm_04_desc: "一个通往大型$pod_umbra$界域的隧道，且有坚固的防御系统保护，是拥有者安享晚年的理想场所。"
 building_type_spiritual_sanctuary_01: "灵性圣所"
 building_type_spiritual_sanctuary_01_desc: "#F 由于三相的狂乱，平衡正逐渐离开这个世界。但仍有一些区域得以存续，通常受到那些通灵之人的保护。#!"
 building_spiritual_sanctuary_01: "小型灵性圣所"
 building_spiritual_sanctuary_01_desc: "这是垂死世界之平衡发出的小小却象征性的反抗宣言。"
 building_spiritual_sanctuary_02: "灵性圣所"
 building_spiritual_sanctuary_02_desc: "生长与腐朽，生命与死亡，这里的循环正遵循其自然轨迹。"
 building_spiritual_sanctuary_03: "大型灵性圣所"
 building_spiritual_sanctuary_03_desc: "完美平衡，万物皆应如此。"
 building_type_wyld_overgrowth_01: "奇原蔓生"
 building_type_wyld_overgrowth_01_desc: "#F 被织者扼制，又遭妖蛆侵袭，大自然母亲在此地展开了她的复仇。#!"
 building_wyld_overgrowth_01: "小型奇原蔓生"
 building_wyld_overgrowth_01_desc: "一小片狂野自然的突显，跃动不息，渴望繁荣。$POD_fera_requirements_development_below_t1$"
