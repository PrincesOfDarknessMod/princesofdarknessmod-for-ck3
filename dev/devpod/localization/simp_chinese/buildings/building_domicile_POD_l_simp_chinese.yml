 vampire_military_ghoul_quarters_domicile_building: "血仆军营"
 vampire_military_ghoul_quarters_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_military_order_01').GetName]）#!\n虽然没有它们的吸血鬼主人那么强大，但血仆的数量更多，而且比普通凡人更强壮，这使得它们在战争时期很有用。"
 vampire_military_training_grounds_domicile_building: "训练场"
 vampire_military_training_grounds_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_military_order_01').GetName]）#!\n对于这些午夜生物来说，公开战争已经足够罕见了。因此，保持他们的技能敏锐至关重要。"
 vampire_military_war_planning_domicile_building: "作战室"
 vampire_military_war_planning_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_military_order_01').GetName]）#!\n这些不朽的生物们已经看到了凡人将军应用的许多策略。在这里，他们可以利用这些重要知识为自己面临的特定情况制定最佳计划。"
 vampire_military_mercenary_contracts_domicile_building: "雇佣军合同"
 vampire_military_mercenary_contracts_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_military_order_01').GetName]）#!\n许多小规模的雇佣兵被吸血鬼们秘密雇佣。虽然他们不经常出现在战场上，但他们非常擅长消灭受伤和逃跑的敌军。"
 vampire_caravan_01_domicile_building: "午夜商队"
 vampire_caravan_01_domicile_building_desc: "只有少数紧俏人才能够应对道路的危险，确保人员和货物安全到达要求苛刻的午夜领主或女士手中。"
