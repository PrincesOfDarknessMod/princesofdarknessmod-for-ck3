 vampire_caravan_bartering_grounds_domicile_building: "易货市场"
 vampire_caravan_bartering_grounds_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_caravan_01').GetName]）#!\n异国情调的商品（或人）是一种稀有商品，值得真正挑剔的统治者讨价还价。"
 vampire_caravan_blood_dolls_domicile_building: "值得的随从"
 vampire_caravan_blood_dolls_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_caravan_01').GetName]）#!\n商队是一个大团体，有时甚至是一个小村庄本身。从这些周游世界的人身上可以学到很多东西。"
 vampire_caravan_defenses_domicile_building: "外围防御"
 vampire_caravan_defenses_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_caravan_01').GetName]）#!\n道路上随时都可能出现危险。成功的商队能够在眨眼间进行自卫。"
