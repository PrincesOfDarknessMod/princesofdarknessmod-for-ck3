 oculi_dei_spying_bards_domicile_building: "间谍吟游诗人"
 oculi_dei_spying_bards_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n作为神目的耳目。吟游诗人在强大领主的宫廷和卑微的酒馆里都有其身影。"
 oculi_dei_wandering_poets_domicile_building: "英勇故事"
 oculi_dei_wandering_poets_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n向四面八方宣扬裁判所骑士的高尚和美德，给他们继续前进的勇气。"
 oculi_dei_capering_fools_domicile_building: "受宠的愚者"
 oculi_dei_capering_fools_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n由于不受神职人员法律的束缚，神目可以用更加……不那么正经的故事来轻松下气氛。"
 domicile_building_parameter_unlock_oculi_dei_prospect: "您的“邀请适任者”决议现在允许您召唤一位神目，而非潜在的门徒。"
 oculi_dei_traps_domicile_building: "陷阱与诡计"
 oculi_dei_traps_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n神目会用书中的所有（肮脏的）伎俩来确保周边的防御，而这时候他们的神职人员会友就装作没看见。"
 oculi_dei_local_hangers_on_domicile_building: "当地人脉"
 oculi_dei_local_hangers_on_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n当地民众更乐意与平民同僚而不是可怕的裁判官分享他们的担忧。"
 oculi_dei_nightly_debates_domicile_building: "深夜计划"
 oculi_dei_nightly_debates_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n在黑夜中，当他们的裁判官同僚们等待第二天的祝福时，神目已经在提前计划着任务了。"
 von_murnau_01_domicile_building: "冯·穆尔瑙区"
 von_murnau_01_domicile_building_desc: "巴伐利亚贵族家庭有手段、意愿和道德义务以任何方式支持宗教裁判所。他们的诅咒每天都在提醒这一事实。"
