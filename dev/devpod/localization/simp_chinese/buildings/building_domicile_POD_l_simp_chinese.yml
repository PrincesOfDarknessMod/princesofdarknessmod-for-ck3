 sisters_john_healing_ritual_domicile_building: "治疗祷告"
 sisters_john_healing_ritual_domicile_building_desc: "#weak （需要[GetDomicileBuilding('sisters_john_01').GetName]）#!\n对于那些回家的受伤裁判所骑士来说，看着修女们祈祷就像亲身进入了天堂一样。"
 sisters_john_torturers_tools_domicile_building: "酷刑室"
 sisters_john_torturers_tools_domicile_building_desc: "#weak （需要[GetDomicileBuilding('sisters_john_01').GetName]）#!\n修女们知晓治疗的技艺，但她们也知道如何让最顽固的地狱之子吐话。很少有人敢接近他们施刑的地下室。"
 sisters_john_thoughts_prayers_domicile_building: "关心与祈祷"
 sisters_john_thoughts_prayers_domicile_building_desc: "#weak （需要[GetDomicileBuilding('sisters_john_01').GetName]）#!\n修女们舒缓的歌声甚至可以让最疲惫的裁判官放松心神。"
