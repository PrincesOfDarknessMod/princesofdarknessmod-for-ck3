 dagon_throne_lord_of_genhinnom_domicile_building: "火狱之主"
 dagon_throne_lord_of_genhinnom_domicile_building_desc: "#weak （需要[GetDomicileBuilding('dagon_throne_01').GetName]）#!\n大衮及其军团建造了宏伟的堡垒，包括火狱本身。黑色大教堂是叛军最强大的要塞，也是路西法本人的居所。"
 dagon_throne_lord_of_shanmukha_domicile_building: "六面神之主"
 dagon_throne_lord_of_shanmukha_domicile_building_desc: "#weak （需要[GetDomicileBuilding('dagon_throne_01').GetName]）#!\n\n大衮在摩亨佐达罗的信徒被称作六面者。祂赐予他们知识，使其变成了一群疯狂建筑师的密教。"
 dagon_throne_that_withstands_lightning_domicile_building: "雷霆矗立者"
 dagon_throne_that_withstands_lightning_domicile_building_desc: "#weak （需要[GetDomicileBuilding('dagon_throne_01').GetName]）#!\n大衮的圣物匣是一台庞大而亵渎的奇异石质机械，其碾磨的岩石齿轮与火成岩操纵杆上皆刻满渎神的祷文。机械是他的领域，亦是他为人类准备的未来。"
