 knights_acre_calatrava_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n伊比利亚骑士团已经加入了你们的事业，并在游击战中提供了相当多的专业知识。"
 knights_acre_helena_domicile_building: "圣赫勒拿骑士团"
 knights_acre_helena_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n圣海伦娜骑士团以君士坦丁的母亲为榜样，尽管受到教会的怀疑，但如果一个正直的灵魂向她们伸出援手，她们将非常愿意提供帮助。"
 knights_acre_templars_domicile_building: "圣殿骑士团"
 knights_acre_templars_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n虽然神秘圣殿骑士对裁判所事业的忠诚连“可疑”都难称得上，但很少有人能否认他们的战斗力。"
 knights_acre_catherine_domicile_building: "圣凯瑟琳骑士团"
 knights_acre_catherine_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n圣凯瑟琳骑士团几乎被黎凡特的该隐之子们摧毁，那些幸存者们将竭尽全力为会友们复仇。"
 knights_acre_thomas_domicile_building: "圣托马斯骑士团"
 knights_acre_thomas_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n由于被更广泛的教会抛弃，圣托马斯骑士团作为重型单位缺乏资金来运作。这迫使他们专注于更非常规的战术。"
 knights_acre_teutonic_domicile_building: "条顿骑士团"
 knights_acre_teutonic_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n尽管有传言称他们已经被吸血鬼组织渗透，但条顿骑士团仍然致力于这场战斗。"
 knights_acre_livonia_domicile_building: "利沃尼亚骑士团"
 knights_acre_livonia_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n利沃尼亚骑士团在与波罗的海异教徒的斗争中久经考验，他们将会在裁判所召唤骑士团时为其提供帮助。"
 knights_acre_hospitalers_domicile_building: "医院骑士团"
 knights_acre_hospitalers_domicile_building_desc: "#weak （需要[GetDomicileBuilding('knights_acre_01').GetName]）#!\n医院骑士团在声誉上仅次于圣殿骑士团，他们也更愿意与其他骑士团甚至女性一起工作，这使他们成为联合裁判所的宝贵资产。"
 domicile_building_parameter_unlock_knights_acre_prospect: "您的“邀请适任者”决议现在允许您召唤一位亚柯骑士，而非潜在的门徒。"
 sisters_john_01_domicile_building: "圣约翰修女会舍"
 sisters_john_01_domicile_building_desc: "对一些人来说，修女是裁判所的治疗师和看护者。对其他人来说，他们是先知，是离上帝最近的人。对所有人来说，她们都是必不可少的。"
