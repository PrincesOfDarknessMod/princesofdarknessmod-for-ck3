 vampire_stable_beast_burden_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_stable_01').GetName]）#!\n用血液的力量增强你的普通驮兽，即使在困难的条件下，也能使它们更有用和耐用。"
