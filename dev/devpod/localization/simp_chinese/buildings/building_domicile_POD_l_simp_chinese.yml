 abbadon_throne_fifth_domicile_building: "信仰之主"
 abbadon_throne_fifth_domicile_building_desc: "#weak (需要[GetDomicileBuilding('abbadon_throne_01').GetName])#!\n亚巴顿是血肉之主，亦是腐化与堕落之主。祂通常赐予其魔奴对疾病的免疫力及散播的能力。"
 abbadon_throne_lord_wrath_domicile_building: "愤怒之主"
 abbadon_throne_lord_wrath_domicile_building_desc: "#weak (需要[GetDomicileBuilding('abbadon_throne_01').GetName])#!\n亚巴顿是愤怒恶魔，虽然祂拥有非人类的智力来抑制持续不断的愤怒，但其真正目标总是第一个倒在祂势不可挡的狂怒之下......"
 abbadon_throne_black_blood_tribe_domicile_building: "黑血部落"
 abbadon_throne_black_blood_tribe_domicile_building_desc: "#weak (需要[GetDomicileBuilding('abbadon_throne_01').GetName])#!\n黑血部落是一群狂战士，崇拜着伪装成洛基的亚巴顿。这些维京入侵者袭击了斯堪地那维亚到英格兰的无数城镇，劫掠一个又一个定居地。这些战团由大公最得力的魔奴率领，这些人精通暴力和恐怖之道。"
 abbadon_throne_thrall_strength_domicile_building: "暴行之主"
 abbadon_throne_thrall_strength_domicile_building_desc: "#weak (需要[GetDomicileBuilding('abbadon_throne_01').GetName])#!\n亚巴顿可以重塑其魔奴或无知者的血肉，或是在心血来潮下用肿瘤爆破或以痉挛撕碎肉体。祂经常赐予其魔奴非人的力量与韧性。"
 abbadon_throne_vampire_thrall_domicile_building: "吸血鬼实验"
 abbadon_throne_vampire_thrall_domicile_building_desc: "#weak （需要[GetDomicileBuilding('abbadon_throne_01').GetName]）#!\n亚巴顿对该隐之子产生了兴趣，他开始在自己的奴仆身上进行血液实验，希望使其血液既具有传染性，又能让该隐之子对其上瘾，以此获得他们的崇拜。"
 domicile_building_parameter_abbadon_wrath_parameter: "命令[thrall|E]参战时，其将在#V 5#!年内获得[GetModifier('warfare_wrathful_strategy_modifier').GetNameWithTooltip]。"
 domicile_building_parameter_black_blood_tribe_parameter: "解锁[GetMaA('black_blood_tribe_maa').GetName][men_at_arms|E]"
 domicile_building_parameter_thrall_strength_parameter: "你的所有[thralls|E]获得#V 5#![prowess|E]"
 domicile_building_parameter_vampire_thrall_parameter: "$POD_splat_vampire_plural$现在更容易被[Concept('thrall','奴化')|E]了。"
 black_blood_tribe_maa: "黑血部落"
 black_blood_tribe_maa_desc: "一群崇拜以洛基形象示人的亚巴顿的野蛮战士。这些战团由大公最珍贵的奴仆领导，这些人精通暴力和恐怖之道。黑血族与当地的狼族发生了冲突。"
 dagon_throne_01_domicile_building: "大衮王座"
 dagon_throne_01_domicile_building_desc: "铁血军团的大公在漫长岁月中假扮过十多位神祇。他收集的庞大信仰之力，使其计谋与教派获得了无与伦比的力量。"
