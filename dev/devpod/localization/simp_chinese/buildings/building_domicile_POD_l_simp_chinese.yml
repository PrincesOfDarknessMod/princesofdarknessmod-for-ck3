 belial_throne_shang_cultists_domicile_building: "无尽深渊之德"
 belial_throne_shang_cultists_domicile_building_desc: "#weak （需要[GetDomicileBuilding('belial_throne_01').GetName]）#!\n最初由商朝的巫师召唤而来，彼列已习惯让技艺精湛且地位崇高的奴仆侍奉左右。"
 belial_throne_elite_cults_domicile_building: "精英密教"
 belial_throne_elite_cults_domicile_building_desc: "#weak （需要[GetDomicileBuilding('belial_throne_01').GetName]）#!\n别西卜向来重质不重量。他的教派虽规模不大，却个个能力出众且忠心耿耿。"
 belial_throne_unlimited_hatred_domicile_building: "永恒仇恨"
 belial_throne_unlimited_hatred_domicile_building_desc: "#weak （需要[GetDomicileBuilding('belial_throne_01').GetName]）#!\n别西卜对路西法的憎恨堪称传奇。在他眼中，只要能摧毁晨星，哪怕整个宇宙化为灰烬也在所不惜。"
 domicile_building_parameter_improved_cult_leader_parameter: "[GetCourtPositionType('cult_leader_court_position').GetName()][aptitude|E]：#P +15#!"
 domicile_building_parameter_thrall_august_parameter: "你的所有[thralls|E]得到完整的[GetTrait('august').GetName(GetNullCharacter)]生活方式树。"
 tower_of_pride_01_domicile_building: "巴别塔"
 tower_of_pride_01_domicile_building_desc: "#italic 所以那城名叫巴别(就是“变乱”的意思)，因为主在那里变乱天下人的言语，使众人分散在全地上。#!"
 treasury_of_avarice_01_domicile_building: "金牛犊"
 treasury_of_avarice_01_domicile_building_desc: "#italic 他们满脑子想的都是玛门，他们的上帝就是钱囊。#!"
 pit_of_wrath_01_domicile_building: "愤怒之坑"
 pit_of_wrath_01_domicile_building_desc: "#italic 生气却不要犯罪，不可含怒到日落：也不可给魔鬼留地步。#!"
 hall_of_gluttony_01_domicile_building: "贪婪之堂"
 hall_of_gluttony_01_domicile_building_desc: "#italic 因为有许多人行事是基督十字架的仇敌，我屡次告诉你们，现在又流泪地告诉你们。 他们的结局就是沉沦，他们的神就是自己的肚腹！他们以自己的羞辱为荣耀，专以地上的事为念。#!"
 inn_of_lust_01_domicile_building: "愉悦之庭"
 inn_of_lust_01_domicile_building_desc: "#italic 你们要逃避淫行。人所犯的，无论什么罪，都在身子以外；唯有行淫的，是得罪自己的身子。#!"
 house_of_sloth_01_domicile_building: "怠惰之馆"
 house_of_sloth_01_domicile_building_desc: "#italic 因人懒惰，房顶塌下；因人手懒，房屋滴漏。#!"
 department_of_envy_01_domicile_building: "嫉妒之殿"
 department_of_envy_01_domicile_building_desc: "#italic 在何处有嫉妒、纷争，就在何处有扰乱和各样的坏事。#!"
 mummy_thanatology_library_01_domicile_building: "Library of Thanatology"
 mummy_thanatology_library_01_domicile_building_desc: "Thanks to your extensive travels, you have an unparalleled collection of precious tomes about death and the soul tied to various cultures."