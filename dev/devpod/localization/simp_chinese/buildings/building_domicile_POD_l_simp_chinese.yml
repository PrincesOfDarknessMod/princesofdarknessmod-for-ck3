 von_murnau_brewers_domicile_building: "冯·穆尔瑙酿酒师"
 von_murnau_brewers_domicile_building_desc: "#weak （需要[GetDomicileBuilding('von_murnau_01').GetName]）#!\n正如任何有自尊的（德国）贵族家庭所做的那样，冯·默诺家族也有酿酒专家为他们服务，他们也很乐意与普通军队分享。"
 von_murnau_contacts_domicile_building: "贵族纽带"
 von_murnau_contacts_domicile_building_desc: "#weak （需要[GetDomicileBuilding('von_murnau_01').GetName]）#!\n冯·穆尔瑙家族与欧洲许多有权势的家族都有联系。通过这些联系，他们可以为裁判所骑士配备廉价但优质的装备。"
 von_murnau_cooks_domicile_building: "随军厨师"
 von_murnau_cooks_domicile_building_desc: "#weak （需要[GetDomicileBuilding('von_murnau_01').GetName]）#!\n由于他们的神职人员兄弟们对养活一支真正的军队的复杂性一无所知，所以由冯·穆尔瑙家族负责制定确保上帝的士兵不挨饿所需的计划。"
 domicile_building_parameter_unlock_von_murnau_prospect: "您的“邀请适任者”决议现在允许您召唤一位冯·穆尔瑙家族成员，而非潜在的门徒。"
