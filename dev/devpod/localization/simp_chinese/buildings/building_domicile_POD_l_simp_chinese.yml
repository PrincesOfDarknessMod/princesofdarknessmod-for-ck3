 vampire_ambassador_poets_domicile_building: "合同诗人"
 vampire_ambassador_poets_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_ambassador_01').GetName]）#!\n作为许多宫廷的传统，诗人们从浪漫的法国妥芮朵风格到好战而可怕的特兰西瓦尼亚棘秘魑风格都有涉及。"
 vampire_ambassador_team_domicile_building: "外交人员"
 vampire_ambassador_team_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_ambassador_01').GetName]）#!\n最有权势的统治者的大使经常带着相当多的随从旅行，他们处理着许多更平凡的任务。"
 vampire_ambassador_foreign_contacts_domicile_building: "国际关系"
 vampire_ambassador_foreign_contacts_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_ambassador_01').GetName]）#!\n就像商队队长一样，成功的大使通常有很多人脉，他们可以依靠这些人脉来帮助自己履行职责，或者在外交失败时低调行事。"
 vampire_ambassador_musicians_domicile_building: "享有盛名的门厅"
 vampire_ambassador_musicians_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_ambassador_01').GetName]）#!\n大使首次进入宫廷时，迎接他的往往是一场盛大的活动，伴随着音乐和大量礼物。它越令人印象深刻（或堕落颓废），它给予大使及其赞助人的声望就越高。"
 vampire_cult_01_domicile_building: "灰之信仰会众"
 vampire_cult_01_domicile_building_desc: "在黑暗的中世纪，吸血鬼崇拜无处不在。从善意的到想要毁灭的，每个亲王都必须在某个时刻与他们打交道。许多国家都制定了具体的协议，在时机成熟时帮助、阻碍甚至摧毁它们。"
