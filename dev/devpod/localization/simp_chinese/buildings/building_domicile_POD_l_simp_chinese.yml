 vampire_cult_acolytes_domicile_building: "侍僧和追随者"
 vampire_cult_acolytes_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_cult_01').GetName]）#!\n每个宗教都有狂热分子，无论走到哪里，他们都准备传播自己的信仰。"
 vampire_cult_last_rites_domicile_building: "最终仪式"
 vampire_cult_last_rites_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_cult_01').GetName]）#!\n灰之信仰在危险地区茁壮成长。当绝望、疾病或战争摧毁了人们的意志时，它们提供了一种诱人的救赎。"
 vampire_cult_cells_domicile_building: "信仰之敌"
 vampire_cult_cells_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_cult_01').GetName]）#!\n很少有灰之信仰是完全和平主义的，即使是那些信仰有时也必须保护自己免受伤害，有时甚至是主动保护自己。"
 monthly_animal_lifestyle_xp_gain_add: "每月兽性生活方式经验获得"
 vampire_cult_sheperd_domicile_building: "羊群牧人"
 vampire_cult_sheperd_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_cult_01').GetName]）#!\n一个好的灰之信仰牧师会照顾其人民的精神需求，但其通常会委托更世俗的人来处理。"
 vampire_military_our_cause_1_domicile_building: "理解我们的事业"
 vampire_military_our_cause_1_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_military_order_01').GetName]）#!\n我们的价值观必须教给我们的新兵。只有这样，他们才会真正致力于我们的命令。"
 require_military_order_specific_1_tt: "你需要成为一项军事命令的[ashen_grandmaster|E]并且具有一项特定行动戒律。"
 vampire_military_our_cause_2_domicile_building: "坚持我们的事业"
 vampire_military_our_cause_2_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_military_order_01').GetName]）#!\n局外人可能会认为他们理解我们的立场。他们错了。只有那些属于秩序的人才真正知道。"
 require_military_order_specific_2_tt: "你需要成为一项军事命令的[ashen_grandmaster|E]并且具有一项升级后的特定行动戒律。"
