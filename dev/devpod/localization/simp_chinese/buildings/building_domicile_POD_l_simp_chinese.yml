 abbadon_throne_01_domicile_building: "亚巴顿王座"
 abbadon_throne_01_domicile_building_desc: "“翼之恩典”，黑檀军团的炽天使，是最早加入路西法的天使之一，也是最早背叛他的天使之一。他的军团比任何其他军团战斗得更多、流血更多、屠杀更多。"
