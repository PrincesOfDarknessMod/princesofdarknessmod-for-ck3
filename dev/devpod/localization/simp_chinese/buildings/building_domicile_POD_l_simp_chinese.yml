 vampire_stable_stable_domicile_building: "暗夜马厩"
 vampire_stable_stable_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_stable_01').GetName]）#!\n一个容纳你嗜血而可怕的战争坐骑的合适地方。"
 vampire_stable_trackers_domicile_building: "鲜血猎手"
 vampire_stable_trackers_domicile_building_desc: "#weak （需要[GetDomicileBuilding('vampire_stable_01').GetName]）#!\n经过适当训练（并通过血液增强）的野兽即使在晚上也能追踪到任何东西。"
