 asmodeus_throne_lord_of_anthropomancy_domicile_building: "人牲占卜之主"
 asmodeus_throne_lord_of_anthropomancy_domicile_building_desc: "#weak （需要[GetDomicileBuilding('asmodeus_throne_01').GetName]）#!\n阿斯莫德最初由苏美尔王室法师结社召唤而来，会向宣誓效忠他的艺术家与学者们许诺未来的景象。"
 asmodeus_throne_fear_humanity_domicile_building: "畏惧人类"
 asmodeus_throne_fear_humanity_domicile_building_desc: "#weak （需要[GetDomicileBuilding('asmodeus_throne_01').GetName]）#!\n正是阿斯莫德对人类超越天界众生的恐惧，驱使他试图通过拿非利的实验来束缚他们。他很快意识到了自己所犯下的严重错误。"
 domicile_building_parameter_improved_nephilim_parameters: "你的[GetTrait('nephilim').GetName(GetNullCharacter)]现在出生时将获得一个正面身体特质，若其未有任何正面身体特质。"
 asmodeus_throne_rome_china_domicile_building: "从罗马到中国"
 asmodeus_throne_rome_china_domicile_building_desc: "#weak  （需要 [GetDomicileBuilding('asmodeus_throne_01').GetName]）#!\n凭借其对罗马帝国的影响，阿斯莫德一度成为首屈一指的大公。其教派令其他教友望尘莫及。"
 domicile_building_parameter_unlock_nephilim_parameter: "你的[GetTrait('laham').GetName(GetNullCharacter)]子嗣如今将转变为[GetTrait('nephilim').GetName(GetNullCharacter)]，他们拥有不朽之躯，力量更为强大，且能运用[Concept('lore_lifestyle','秘义')|E]#weak （如果你是$POD_splat_demon$）#!"
 domicile_building_parameter_increased_thrall_cap_parameter: "你的[thralls|E]的最大数量增加#V 1#!"
