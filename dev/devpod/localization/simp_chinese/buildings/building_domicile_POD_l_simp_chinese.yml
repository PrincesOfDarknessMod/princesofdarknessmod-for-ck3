 haven_defenses_live_entertainment_domicile_building: "现场娱乐"
 haven_defenses_live_entertainment_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n有时你想要隐私，有时你想要陪伴。如果你处于后一种，他们将会很乐意取悦你。"
 haven_defenses_rumormonger_domicile_building: "游荡的谣言贩子"
 haven_defenses_rumormonger_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n虽然经常令人难以忍受，但为了了解在你边界之外发生的事情，这些以在这片土地上旅行和学习为生的人是必不可少的。"
 haven_defenses_capering_fools_domicile_building: "蹦蹦跳跳的小丑"
 haven_defenses_capering_fools_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n这是一个从这个时代的凡人那里学来的传统，许多夜晚的领主和女士们都有一个自己的傻瓜，而这个职位经常不单单用于简单的娱乐。"
 haven_defenses_traps_domicile_building: "隐蔽陷阱"
 haven_defenses_traps_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n任何想冒险的人在试图袭击你的城堡时都会大吃一惊。那些他们想方设法要打开的，但却被你把放了个杠杆在另一边的门的数量可真吓人。"
 haven_defenses_brutish_guards_domicile_building: "粗暴的守卫"
 haven_defenses_brutish_guards_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n也许他们并不像看起来那么可怕，但这并不重要，武力的象征有时比实际如何更重要。"
 haven_defenses_workforce_domicile_building: "受控劳动力"
 haven_defenses_workforce_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n你的避风港总是需要维修和维护的。最好让合适的人（在最该到的）时刻听候。"
 haven_defenses_majordomo_domicile_building: "藏身处总管"
 haven_defenses_majordomo_domicile_building_desc: "#weak （需要[GetDomicileBuilding('haven_defenses_01').GetName]）#!\n你营地的总管（当你不在的时候）将会确保一切都像钟表一样正常运转。任何发现的异常都会尽职尽责地报告。"
