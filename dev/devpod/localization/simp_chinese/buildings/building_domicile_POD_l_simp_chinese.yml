 azrael_throne_angel_shadows_domicile_building: "暗影天使"
 azrael_throne_angel_shadows_domicile_building_desc: "#weak （需要 [GetDomicileBuilding('azrael_throne_01').GetName]）#!\n在既无上帝亦无路西法监管的情况下创造第二个世界，亚兹拉尔由此促成了（后来被称为）冥界的诞生。"
 azrael_throne_heitsi_eibib_domicile_building: "海齐-艾比布"
 azrael_throne_heitsi_eibib_domicile_building_desc: "#weak （需要[GetDomicileBuilding('azrael_throne_01').GetName]）#!\n亚兹拉尔的教派以其学术倾向闻名，他们钻研亡灵术及其他禁忌之术以取悦其主君。"
 azrael_throne_scarecrow_domicile_building: "稻草人"
 azrael_throne_scarecrow_domicile_building_desc: "#weak （需要[GetDomicileBuilding('azrael_throne_01').GetName]）#!\n亚兹拉尔的圣骨匣是由数千根骸骨搭建的稻草人像，骨架覆盖着灰布，眼眶中镶嵌着歪斜的翡翠。"
