 red_order_herbalists_domicile_building: "植物汇编"
 red_order_herbalists_domicile_building_desc: "#weak （需要[GetDomicileBuilding('red_order_01').GetName]）#!\n虽然圣约翰修女会很擅长使用草药，但只有红修会真正掌握了植物从带来生机到死亡所能提供的一切。"
 red_order_siege_engineers_domicile_building: "敌人的覆灭"
 red_order_siege_engineers_domicile_building_desc: "#weak （需要[GetDomicileBuilding('red_order_01').GetName]）#!\n红修会知道在哪里打击敌人才能真正发挥作用。在他们的指导下，裁判所的进攻既精准又有力。"
 red_order_shrine_domicile_building: "虔诚的修会"
 red_order_shrine_domicile_building_desc: "#weak （需要[GetDomicileBuilding('red_order_01').GetName]）#!\n为了抵消他们作为危险组织的名声，红修会尽力展现出其完美虔诚的外表。"
 domicile_building_parameter_unlock_red_order_prospect: "您的“邀请适任者”决议现在允许您召唤一位红修会成员，而非潜在的门徒。"
 red_order_library_domicile_building: "红修会图书馆"
 red_order_library_domicile_building_desc: "#weak （需要[GetDomicileBuilding('red_order_01').GetName]）#!\n红修会是迄今为止裁判所成员中知识最渊博的。他们庞大的图书馆收藏了不少巨著，但许多人更希望看到这些巨著被烧毁。"
 red_order_ransom_cages_domicile_building: "红修会囚笼"
 red_order_ransom_cages_domicile_building_desc: "#weak (需要[GetDomicileBuilding('red_order_01').GetName]）#!\n敌人很狡猾。只有红修会拥有足够的知识来对抗他们的诡计，并确保他们待在该待的地方。"
 red_order_shared_quarters_domicile_building: "共享的修道院"
 red_order_shared_quarters_domicile_building_desc: "#weak （需要[GetDomicileBuilding('red_order_01').GetName]）#!\n红修会修女们认为，她们应该与红修会兄弟们共享住宿（和信息渠道）。教会以非常批判的眼光看待这件事。"
 oculi_dei_local_recruits_domicile_building: "当地征兵"
 oculi_dei_local_recruits_domicile_building_desc: "#weak （需要[GetDomicileBuilding('oculi_dei_01').GetName]）#!\n作为唯一一个真正平民化的裁判官组织，神目最终成为了非神职人员或贵族热切新兵的首选之地。"
