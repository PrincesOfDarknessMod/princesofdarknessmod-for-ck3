l_simp_chinese:
 building_type_tithe_of_the_dead_01: "死税"
 building_type_tithe_of_the_dead_01_desc: "#F 死税的要求是两枚压在刚死去的死灵眼睛里的硬币；这些遗器硬币将被交给努德里，而努德里又会用它们来制货。#!"
 building_tithe_of_the_dead_01: "宽松死税"
 building_tithe_of_the_dead_01_desc: "想要安全通行，就得交适度的死税。这对于那些过世的人来说很糟糕，但他们在这个问题上没有任何发言权。"
 building_tithe_of_the_dead_02: "高额死税"
 building_tithe_of_the_dead_02_desc: "高额的通行费，亡者们开始嘀咕“昂贵”，但让他们嘀咕吧。这些钱币都是你的了。"
 building_tithe_of_the_dead_03: "沉重死税"
 building_tithe_of_the_dead_03_desc: "你的收税官现在在你的领地内被人畏惧，情有可原。无论如何，钱还得交。"
 building_type_lux_veritatis_01: "真理之光"
 building_type_lux_veritatis_01_desc: "#F 真理之光规定所有的伟大人类作品都要收集起来，无论在哪里都要保存，并把它们存放在参议院下面的金库里，供所有人享有，以便所有的艺术和历史都能得到永久的保存。#!"
 building_lux_veritatis_01: "微型宝库"
 building_lux_veritatis_01_desc: "一个个人的金库，你把当地的艺术和美景的作为时间胶囊藏在这里，希望能把它从时间的风沙中保存下来。它可能对世界来说意义不大，但对你来说意义重大。"
 building_lux_veritatis_02: "小型宝库"
 building_lux_veritatis_02_desc: "你的人类遗物藏匿处已经扩大了，你有了一些真正值得保存的小饰品。你希望这已经足够了。"
 building_lux_veritatis_03: "大型宝库"
 building_lux_veritatis_03_desc: "你的艺术和文化碉堡得到了一些赞誉，因为你现在持有真正无价的遗物，希望能保护它不受历史的蹂躏。这可能真的有用！大概。"
 building_type_haunted_cemetery_01: "闹鬼墓园"
 building_type_haunted_cemetery_01_desc: "#F 诡域是死灵们寻求庇护的地方。某些地区在[Glossary('皮囊之地','game_concept_skinlands_desc')]以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。墓园总是好选择，因为它有能力收容非常多的死灵。#!"
 building_haunted_cemetery_01: "闹鬼坟地"
 building_haunted_cemetery_01_desc: "死者安眠之地，死灵可能会在他们骨头里的虫子中找到片刻的喘息。"
 building_haunted_cemetery_02: "闹鬼墓园"
 building_haunted_cemetery_02_desc: "死者安眠之地，死灵可能会找到一个地方停下来聚集，死亡恐怖中的一片小绿洲。"
 building_haunted_cemetery_03: "闹鬼荒冢"
 building_haunted_cemetery_03_desc: "死者的大聚会，无论是沉睡的还是不眠的死者，让这里呈现出和平的幻景。"
 building_haunted_cemetery_04: "闹鬼陵墓"
 building_haunted_cemetery_04_desc: "凡人惧怕这个地方，并用沙哑的耳语互传这里有死亡的搅动，还有其中的恐怖。他们是对的。"
 building_type_haunt_01: "鬼屋"
 building_type_haunt_01_desc: "#F 用于避免[UmbraGlossary('shadowlands')]危险的灵性避难所。#!"
 building_haunt_01: "鬼屋"
 building_haunt_01_desc: "用于避免[UmbraGlossary('shadowlands')]危险的灵性避难所。"
 haunt_effect_desc: "作为[umbra|E]行动，允许你削减压力。"
 wraith_hierarchy_building_requirement: "亡者律令要求不允许与生者接触"
 building_type_citadel_01: "影堡"
 building_type_citadel_01_desc: "#F 作为死者之城的心脏和铁之冥府的有形象征，影堡是一个巨大的场所，通常建在一个或多个用灵魂钢门和其他装备加固的建筑周围。#!"
