l_simp_chinese:
 building_type_necropolis_01: "死城"
 building_type_necropolis_01_desc: "#F 死城是死者的城市，是位于[UmbraGlossary('shadowlands')]的诡域混合体。死城是围绕着中央影堡组成的，这是一个巨大的加固诡域，以便在死涡中存留。#!"
 building_necropolis_01: "小型死城"
 building_necropolis_01_desc: "这里有一座小影堡，一些鬼魂在堡内的受诅大厅里活动。"
 building_necropolis_02: "中型死城"
 building_necropolis_02_desc: "影堡被一座小村庄的鬼魂所包围，而现在这个死城成为了村庄死灵的家。"
 building_necropolis_03: "大型死城"
 building_necropolis_03_desc: "这座死城现以是是死灵的城镇，矗立在它的领域之上，它的墙壁是抵御死涡的屏障，是疯狂之海中的理智之岛。至少对死灵来说是这样的。"
 building_necropolis_04: "巨型死城"
 building_necropolis_04_desc: "这座死城将在整个[umbra|E]冷寂之后继续存在，在这里，甚至没有任何死灵会颤栗。或者他们是这么想的。"
 building_type_haunted_house_01: "闹鬼鬼屋"
 building_type_haunted_house_01_desc: "#F 诡域是死灵们寻求庇护的地方。某些地区在[skinlands|E]以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。鬼房是最常见的，在那里他们可能会找到在亡生中的少量平静。#!"
 building_haunted_house_01: "闹鬼小屋"
 building_haunted_house_01_desc: "一座曾经有人居住过的小楼，现在已经成为了死灵的休憩场所。它又小又拥挤，但至少还能使用。"
 building_haunted_house_02: "闹鬼房屋"
 building_haunted_house_02_desc: "曾经的家庭居所，现在是[skinlands|E]的恐怖的简易庇护所。"
 building_haunted_house_03: "闹鬼豪宅"
 building_haunted_house_03_desc: "曾经的颓废与浪费之地，现在是悲惨和死亡的宫殿。"
 building_haunted_house_04: "闹鬼庄园"
 building_haunted_house_04_desc: "祸不单行。而在这里，有着一整个团队。"
 building_type_haunted_field_01: "闹鬼野地"
 building_type_haunted_field_01_desc: "#F 诡域是死灵们寻求庇护的地方。某些地区在[skinlands|E]以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。荒野并不明显，但不眠死者可以这里的空地晃荡，找到一丝内心平静。#!"
 building_haunted_field_01: "阴森野地"
 building_haunted_field_01_desc: "有时，田野间的孩子们会被风中的耳语和行间的沙沙声吓到。"
 building_haunted_field_02: "可怕野地"
 building_haunted_field_02_desc: "在此野外之地，有报告说看到无头骑士经过。"
 building_haunted_field_03: "恐怖野地"
 building_haunted_field_03_desc: "这片田野是当地人发癔的地方，因为关于死者在这里出没的传言比比皆是。"
 building_haunted_field_04: "骇人野地"
 building_haunted_field_04_desc: "这里的死者如此之多，人们会认为狂猎已经来到了这个受诅之地。"
 building_type_haunted_castle_01: "闹鬼城堡"
 building_type_haunted_castle_01_desc: "#F 诡域是死灵们寻求庇护的地方。某些地区在[skinlands|E]以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。城堡是顶级的诡域，一个至少可以给于死灵安全的假象的堡垒。#!"
 building_haunted_castle_01: "闹鬼城塞"
 building_haunted_castle_01_desc: "这里曾是战争的前哨，后来被遗弃了，现在当地人小声议论在这里出没的“士兵”。"
 building_haunted_castle_02: "闹鬼城堡"
 building_haunted_castle_02_desc: "这里的守卫说起地牢的死者在晚上在大厅里行走，盔甲偶尔会转过来注视这些守卫。"
 building_haunted_castle_03: "闹鬼堡垒"
 building_haunted_castle_03_desc: "当这个地方被围攻时，攻击者发现奇怪的力量似乎阻碍了他们。这并不让保卫这个地方的活人更安心了……"
 building_haunted_castle_04: "闹鬼要塞"
 building_haunted_castle_04_desc: "将会有一座叫做奥索威克的堡垒，死人将在那里复活。而这，这要塞是一面镜子，照出战争的恐怖、死亡的疯狂和死者的仇恨。"
 building_type_soulsmithy_01: "灵铸铺"
 building_type_soulsmithy_01_desc: "#F 灵铸是将一个死灵转化为物品的手艺。它既是一种惩罚，也是一种制作工艺。#!"
 building_soulsmithy_01: "小灵铸铺"
 building_soulsmithy_01_desc: "一座小型熔炉，担有处决和锻造的双重职责，这座灵魂熔炉至少能达成其用。"
 building_soulsmithy_02: "大灵铸铺"
 building_soulsmithy_02_desc: "你的熔炉后来被扩大了，现在死灵一想到被带到这个地方就会不寒而栗。"
 building_soulsmithy_03: "灵钢钢厂"
 building_soulsmithy_03_desc: "熔炉真正发展起来了，就连锻造厂在它面前会显得很不足道，即使是最喜欢砍头的刽子手也赶不上你在这里处理的死者数。"
 building_soulsmithy_04: "冥钢钢厂"
 building_soulsmithy_04_desc: "整个[umbra|E]的死灵对这可怕的死亡工厂感到恐惧，因为这里的武器和军火是以最完美的质量为标准而制造的。一个完美无瑕的产品需要付出可怕的代价。完美。"
 building_type_tithe_of_the_dead_01: "死税"
 building_type_tithe_of_the_dead_01_desc: "#F 死税的要求是两枚压在刚死去的死灵眼睛里的硬币；这些遗器硬币将被交给努德里，而努德里又会用它们来制货。#!"
 building_tithe_of_the_dead_01: "宽松死税"
 building_tithe_of_the_dead_01_desc: "想要安全通行，就得交适度的死税。这对于那些过世的人来说很糟糕，但他们在这个问题上没有任何发言权。"
 building_tithe_of_the_dead_02: "高额死税"
 building_tithe_of_the_dead_02_desc: "高额的通行费，亡者们开始嘀咕“昂贵”，但让他们嘀咕吧。这些钱币都是你的了。"
 building_tithe_of_the_dead_03: "沉重死税"
 building_tithe_of_the_dead_03_desc: "你的收税官现在在你的领地内被人畏惧，情有可原。无论如何，钱还得交。"
 building_tithe_of_the_dead_04: "严荷死税"
 building_tithe_of_the_dead_04_desc: "新死者、旧死者、死灵或其他旅行者，对你来说都是一样的。哪里有利益可图，哪里就是你的领地。"
 building_type_lux_veritatis_01: "真理之光"
 building_type_lux_veritatis_01_desc: "#F 真理之光规定所有的伟大人类作品都要收集起来，无论在哪里都要保存，并把它们存放在参议院下面的金库里，供所有人享有，以便所有的艺术和历史都能得到永久的保存。#!"
 building_lux_veritatis_01: "微型宝库"
 building_lux_veritatis_01_desc: "一个个人的金库，你把当地的艺术和美景的作为时间胶囊藏在这里，希望能把它从时间的风沙中保存下来。它可能对世界来说意义不大，但对你来说意义重大。"
 building_lux_veritatis_02: "小型宝库"
 building_lux_veritatis_02_desc: "你的人类遗物藏匿处已经扩大了，你有了一些真正值得保存的小饰品。你希望这已经足够了。"
 building_lux_veritatis_03: "大型宝库"
 building_lux_veritatis_03_desc: "你的艺术和文化碉堡得到了一些赞誉，因为你现在持有真正无价的遗物，希望能保护它不受历史的蹂躏。这可能真的有用！大概。"
 building_lux_veritatis_04: "巨型宝库"
 building_lux_veritatis_04_desc: "凡人最伟大的博物馆与你的传说、文化和历史的宝库相比，都是小巫见大巫。每位有进取心的考古学家都会想看一眼你的收藏，在这里，至少有一位可悲的灵魂会记住人类的传奇。"
 building_type_haunted_cemetery_01: "闹鬼墓园"
 building_type_haunted_cemetery_01_desc: "#F 诡域是死灵们寻求庇护的地方。某些地区在[skinlands|E]以“闹鬼”或“令人毛骨悚然”而闻名，因为这些建筑、道路或地区与一只或几只死灵有着密切的关联。墓园总是好选择，因为它有能力收容非常多的死灵。#!"
 building_haunted_cemetery_01: "闹鬼坟地"
 building_haunted_cemetery_01_desc: "死者安眠之地，死灵可能会在他们骨头里的虫子中找到片刻的喘息。"
 building_haunted_cemetery_02: "闹鬼墓园"
 building_haunted_cemetery_02_desc: "死者安眠之地，死灵可能会找到一个地方停下来聚集，死亡恐怖中的一片小绿洲。"
 building_haunted_cemetery_03: "闹鬼荒冢"
 building_haunted_cemetery_03_desc: "死者的大聚会，无论是沉睡的还是不眠的死者，让这里呈现出和平的幻景。"
 building_haunted_cemetery_04: "闹鬼陵墓"
 building_haunted_cemetery_04_desc: "凡人惧怕这个地方，并用沙哑的耳语互传这里有死亡的搅动，还有其中的恐怖。他们是对的。"
 building_type_haunt_01: "鬼屋"
 building_type_haunt_01_desc: "#F 用于避免[UmbraGlossary('shadowlands')]危险的灵性避难所。#!"
 building_haunt_01: "鬼屋"
 building_haunt_01_desc: "用于避免[UmbraGlossary('shadowlands')]危险的灵性避难所。"
 haunt_effect_desc: "作为[umbra|E]行动，允许你削减压力。"