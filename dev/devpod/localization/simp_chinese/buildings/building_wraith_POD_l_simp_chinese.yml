 building_type_haunted_blacksmiths_01: "闹鬼的铁匠铺"
 building_type_haunted_blacksmiths_01_desc: "#F 魂铸是一种将死灵注入物品的手段。它既是一种惩罚，又是一种生产工艺。#!"
 building_haunted_blacksmiths_01: "闹鬼的铁匠铺1"
 building_haunted_blacksmiths_01_desc: "一个小炉子，同时作为处刑场和锻造厂，但至少能完成这项工作。"
 building_haunted_blacksmiths_02: "闹鬼的铁匠铺2"
 building_haunted_blacksmiths_02_desc: "你的铁匠铺已经扩建了，现在死灵们一想到被带到这个地方就浑身发抖。"
 building_haunted_blacksmiths_03: "闹鬼的铁匠铺3"
 building_haunted_blacksmiths_03_desc: "锻造厂已然真正扩张，就连工厂的铁匠们都相形见绌，即使是最喜欢斧头的刽子手也无法赶上你在这里处理死者的数量。"
 building_haunted_blacksmiths_04: "闹鬼的铁匠铺4"
 building_haunted_blacksmiths_04_desc: "死灵们怀着对这座死亡工厂的恐惧穿越[umbra|E]震，此处生产的武器和装备的品质都已完美无瑕。当然价格也同样可怕。多么完美。"
 building_haunted_blacksmiths_05: "闹鬼的铁匠铺5"
 building_haunted_blacksmiths_05_desc: "死灵们怀着对这座死亡工厂的恐惧穿越[umbra|E]震，此处生产的武器和装备的品质都已完美无瑕。当然价格也同样可怕。多么完美。"
