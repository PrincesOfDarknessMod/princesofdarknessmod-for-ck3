 building_haunted_cemetery_05_desc: "冒险家经常进入此地，以为他们可以清除这个地方的幽灵主人。但其结果往往是加入它们。"
 building_type_haunted_mansions_01: "闹鬼宅邸"
 building_type_haunted_mansions_01_desc: "欢迎，愚蠢的凡人，来到这座闹鬼宅邸。我是这座屋子的主人，你的幽灵主人。请一路进来，给每个人腾出空间。现在已经没有回头路了。"
