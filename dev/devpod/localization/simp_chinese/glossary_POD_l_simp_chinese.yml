l_simp_chinese:
 podgloss.kisaeng: "一位受过训的交际花和一名合法的艺人"
 podgloss.kwanryong_kuibu_koryo_changwan: "已归顺高丽武士的指挥官。"
 podgloss.joseon_gyeonggukjeon: "一部详尽阐述新政府体制的鸿篇巨制，详述了一种以中国周朝时期儒家学派为蓝本的政治制度。"
 podgloss.uinyo: "一个专精于妇科疾病的女医生。"
 podgloss.sambyeolcho: "三别抄乃是高丽军政体系中的一支奇兵，由当权的崔氏家族所组建掌控。此三军集警察与战斗部队的职能于一身。"
 podgloss.taejo_joseon: "李成桂乃是朝鲜王朝的开国之君，取代了高丽王朝，建立起以新儒家思想为根基的全新政制。"
 podgloss.nobi: "奴婢是社会中的贱役阶层，被视作主人的财产，得以买卖、转赠。"
 podgloss.jajewi: "贵族子弟卫队由最有潜质的贵族子弟组成，旨在培养他们成为忠诚的下一代朝廷官员。"
 podgloss.hunminjeongeum: "#italic Hunminjeongeum，即《训民正音》#!是由集贤殿学者们编纂的文献，旨在规范和传播由世宗大王所创造的朝鲜文字——谚文。"
 podgloss.seonbi: "#italic Seonbis（士人） #!是学者之流，通常不担任官职，而以服务公众为志业。他们甘于放弃官场权势与利禄，只为潜心修学，弘道传知。"
 podgloss.sahwa: "士祸，亦称士林之祸，是针对士林学者——朝鲜政治权力斗争中相互纠缠的两大集团之一——的清洗行动。"
 podgloss.geobukseon: "龟船是史上最早设计出的驱逐舰之一。其构造旨在于敌军炮火下灵活穿梭，并阻止日本士兵登船搏斗。正是凭借这些战舰，朝鲜水师在多次海战中赢得赫赫战果。"
 podgloss.thai-to: "此庙号用来追尊一位开国之君。"
 podgloss.tran-trieu: "这些庙宇供奉着德圣兴道大王陈国峻之英灵，女庙祝则在其中主持祭祀，被这位英灵附体。"
 podgloss.hyangyak: "这是朝鲜王朝社会法律的核心，为地方事务保留了一定的自主权。"
 podgloss.guyen: "一部大型典籍集中的单卷。"
 podgloss.man_da_la: "曼陀罗花，亦称洋金花，乃神圣白花，令人沉入恍惚昏睡之境。"
 podgloss.thai_hoc_sinh: "陈朝统治期间，通过由大越朝廷所设的最高等级科举考试的学生。"
 podgloss.hanh_khien: "高官，地位仅次于宰相，相当于副宰相。晋升至此职位者，可获准身着红袍。"
 podgloss.chua: "这是一个掌握实权的机构，由郑氏与阮氏这两个敌对家族所设，借以统治大越，而黎朝皇帝则被削权至仅具象征意义的名义君主。"
 podgloss.stupa: "窣堵坡是一种冢状结构的佛塔，内藏佛教圣物，供修行者静坐参禅。"
 podgloss.binnya_thau: "老王后。"
 podgloss.miezu: "诛九族是在最严重的国家事件中所施以的极刑，意在彻底斩断罪犯血脉，绝其后世。凡犯人本人，其父母、祖父母、子孙、兄弟姐妹、姻亲、叔伯姑姨及其配偶、堂表亲、配偶及配偶父母，皆在诛杀之列。年幼子女虽得以免死，却常被发卖为奴。"
 glossary_clan_curse: "[Glossary('氏族诅咒', 'glossary_clan_curse_tt')]"
 glossary_clan_curse_tt: "氏族诅咒是$POD_splat_vampire$基于其$pod_clan$所承受的超自然限制。\n\n这些缺陷通常会对新生吸血鬼产生深远的心理影响，并迫使他们彻底重塑夜间生活。然而，不同氏族会以不同方式合理化自身的诅咒。有些将其视为隐藏的馈赠，或是伟大启蒙的副作用，以此自我麻痹。\n\n根据《挪得之书》记载，氏族诅咒是该隐对[GetTrait('vampgeneration3').GetName(GetNullCharacter)]的惩罚，源于他们对[GetTrait('vampgeneration2').GetName(GetNullCharacter)]的毁灭。"
 podgloss.dokhorkhan: "多科尔汗是[Glossary('刺链地狱','podgloss.hellspikedchains')]的[Glossary('阎魔王','podgloss.yamaking')]。\n截至1230年，他是当时最强大的[Glossary('阎魔王','podgloss.yamaking')]之一，对草原的掌控几乎无人能敌。他以痛苦与仇恨为食，并因其大胆，有时甚至以鲁莽的计谋而闻名，这些计谋旨在压制他的对手。"
 podgloss.hellspikedchains: "刺链地狱为[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]之一，展现为一片辽阔而平坦的原野，聚居着死于草原之上的凡人魂灵。这些魂灵被[Glossary('阎魔王','podgloss.yamaking')][Glossary('多科尔汗','podgloss.dokhorkhan')]随机分配至各个部落，他会定期选出其中一个部落作为受宠之族。\n\n其余部落则会被剥夺一项感官或肢体，且必须无条件服从受宠之族的所有命令。若违背规训，或受宠者意欲施压，则会被投入刺链。\n\n受刑者被幽冥锻造的带刺铁链紧缚，悬挂于巨洞的钟乳石间。每当他们挣扎，荆刺便愈加深深刺入其灵魂根基，吞噬其生命精华，以滋养[Glossary('阎魔王','podgloss.yamaking')]。"
 podgloss.yamaking: "阎魔，亦称魔王，乃是统御[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]的强大存在。\n\n传说他们曾为阴间审判亡灵的公正判官，然时光流转，腐化侵蚀，使他们自我膨胀，妄图攀升至天庭之上，成为颠覆天地的魔皇。\n\n虽各自性情迥异，喜好不同，但其无一例外皆借助[akuma|E]仆从，在凡世中布局谋算。"
 podgloss.dharma: "对于$pod_kueijin$而言，心法是一条超脱心魔本能的大彻大悟，让他们得以重归轮回。作为恶魔般的生物，$pod_kueijin$的悟道之路远比常人艰难，往往需要耗费数千年时间。\n\n传统上，由大罗汉血/学所创的五大心法（魔虎啸、幽影颂、华鹤道、千呤道和腾龙舞）被认为是正道心法，其他心法则或多或少地被视为异端邪说。"
 podgloss.hundredclouds: "云开雾散是[Glossary('心法','podgloss.dharma')]的最终目标。它意味着涤除自身的罪业，并重新融入轮回。\n\n云开雾散是一个象征终极平静的隐喻性术语，指一种超然的状态，在此状态下，即使是天庭的职责亦可搁置一旁。这“云雾”并非力量（尽管较弱的$pod_kueijin$可能会如此看待它）；它们也并非幻象（尽管对于无法理解它们的人来说可能如此）。通过融入云开雾散（智者明白这是一个象征，而非一个团体），一名$pod_kueijin$达到了其存在的巅峰，其境界甚至高于[Glossary('菩萨','podgloss.bodhisattva')]。大多数在达到如此高度后便超脱尘世，消失于未知的归宿。另一些则选择留下，转而指引他人。"
 podgloss.bodhisattva: "菩萨是那些已达到其选择的[Glossary('心法','podgloss.dharma')]最终阶段的$pod_kueijin$。\n\n能成为菩萨的$pod_kueijin$相对稀少；这一过程需要数百年甚至数千年的时间，而大多数$pod_kueijin$在达到菩萨阶段之前便已遭遇真正的死亡或屈服于内心的恶魔。那些达到此境界的存在拥有极其强大的力量，其层次轻易便可媲美西方的玛土撒拉级吸血鬼。\n\n尽管少数菩萨仍积极参与政治，但大多数都选择成为精神领袖。"
 podgloss.arhat: "罗汉是已经超脱了[Glossary('心法','podgloss.dharma')]并[Glossary('云开雾散','podgloss.hundredclouds')]飞升的$pod_kueijin$，从而摆脱了亡生诅咒。大多数罗汉在超脱之前已有数百年的修为。\n\n最著名且被铭记的罗汉是血/学，他创立了五行之道，由此衍生出五大正统[Glossary('心法','podgloss.dharma')]。至今，许多人仍认为效仿血/学是达到开悟的唯一正道。"
 podgloss.wheelofages: "纪元之轮是存在的永恒轮回，世界将历经日益深重的苦难时代，直至轮回的最低点，而后重新回归乐园。\n\n它由不同的纪元划分，尽管各类超自然存在对此有着不同的诠释。但多数存在认同，在重返乐园前的最后一个纪元，一位[Glossary('魔皇','podgloss.demonemperor')]将崛起，试图阻止轮回之轮，妄图永世统治。"
 podgloss.demonemperor: "在$pod_kueijin$的末世论中，第六纪元将以一位统御黑暗与恐怖的至高主宰降临为标志，他将以铁腕与尖刺统治世界。这位即将到来的魔皇将成为那个堕落时代的象征，而这一纪元唯一的仁慈在于——倘若宇宙运转仍正常——第六纪元将会极为短暂……\n\n猜测谁将成为魔皇是$pod_kueijin$间流行的消遣。[Glossary('阎魔王','podgloss.yamaking')]们普遍认为魔皇将在他们之中诞生，1230年最热门的候选者是[Glossary('艾玛·欧','podgloss.emmao')]。其他常见人选包括扫罗——他在东方游历时似乎接触过相关神话，并认为担任魔皇统治世界比与全能者和解更为可取。"
 podgloss.penangallan: "庞南加兰，源自马来语中对吸血鬼的称呼，最终成为东南亚地区$pod_kueijin$母系首领的统称。这些追随腾龙舞且严重阳力失衡的$pod_kueijin$奉行激进女性主义，其行径究竟是追求彻底的自我解放，还是堕落为残酷施虐的人间地狱——答案取决于你询问的对象。"
 podgloss.emmao: "艾玛·欧，[Glossary('断绝','podgloss.kakuri')]的黑暗主宰，乃当今[Glossary('阎魔王','podgloss.yamaking')]之间争夺[Glossary('魔皇','podgloss.demonemperor')]之位的最有力竞逐者。\n\n作为阴之相的化身，艾玛·欧精于算计，冷酷无情。他常显形为一位身形高大、长须披面、体毛浓密的男子，皮肤如黑曜石般，身披绘有战争、瘟疫与死亡纹饰的阿伊努织袍。他身边常伴随着美丽的[Glossary('泉津','podgloss.shikome')]仆从。\n\n艾玛·欧是当前唯一一位成功击败并吞噬了同僚的[Glossary('阎魔王','podgloss.yamaking')]，其兼并了曾经的平衡判官阎罗的疆域与力量。"
 podgloss.kakuri: "断绝亦被称为夜域，是由[Glossary('阎魔王','podgloss.yamaking')][Glossary('艾玛·欧','podgloss.emmao')]所掌控的[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]。\n乃是一个无光、无乐、无荣誉的阴性冰雪世界。\n作为阿伊努人的故有领地，断绝地狱为[Glossary('艾玛·欧','podgloss.emmao')]的原始崇拜者提供了一条秘密出路。"
 podgloss.shikome: "泉津是阎魔的冰山美人般的刺客和间谍，[Glossary('艾玛·欧','podgloss.emmao')]的保镖和嫔妃。他们都曾是$pod_kueijin$，每一位泉津都是由[Glossary('艾玛·欧','podgloss.emmao')]亲自挑选，并精心诱使其效忠于他。她们中的许多人在凡人之年曾遭受虐待、被忽视或遗忘，如今却欣然侍奉这位她们视如父、如情人、如君主的主人。而他，也回报以尊重。\n\n泉津最危险的能力在于她们操纵男性的技巧。她们以吞噬男性的意志力为食，就如同大多数$pod_kueijin$以“气”为生。女性会不由自主地憎恶泉津并试图攻击她们，而男性则会为她们做任何事，献上她们渴望的一切，甚至为博取她们的一抹青睐（而这永远不可能得到）而甘愿赴死。"
 podgloss.mikaboshi: "天津瓮星，[Glossary('妖邪之城','podgloss.wickedcity')]的领主，是一位曾为日本学者与建筑师的[Glossary('阎魔王','podgloss.yamaking')]。虽在同类中资历尚浅，但他执着于无情革新，妄图缔造一个将人类化为无魂空壳的“机械国度”。随着凡世文明日益扩张，他也如新星般崛起。"
 podgloss.wickedcity: "妖邪之城，是由[Glossary('阎魔王','podgloss.yamaking')][Glossary('瓮星','podgloss.mikaboshi')]掌控的[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]中一个充满了赛博朋克和极端动漫元素的世界，结合了疯狂的风水和管理理论，\n\n它是赛博朋克、癫狂风水与压榨灵魂的管理理论交织的噩梦。在这片贪婪与资本主义最恶劣元素汇聚之地，黄泉的腐蚀氛围笼罩一切。它同时也是发展最迅速的[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]之一。"
 podgloss.anda: "安答是[GetTrait('gangrel').GetName(GetNullCharacter)]的一个$pod_cainite$血系，存在于蒙古人之中。他们自认为是蒙古宗教中大地女神埃图根的后裔。\n\n由于他们在地理上接近$pod_kueijin$，双方经常发生冲突，而凡世蒙古人的征服可能会使局势进一步恶化。"
 podgloss.augustpersonageofjade: "在$pod_kueijin$的传说中，当前虽不活跃但仍是天庭的统治者与造物的化身。当第六纪元来临时，玉皇大帝将退位，由[Glossary('魔皇','podgloss.demonemperor')]取代。"
 podgloss.infantdevilcivilizer: "父母的温和劝说有其时间和地点，但在驯服那些从[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]归来的野生$pod_kueijin$时却没有这样的时间。幼鬼太傅是各地方幼鬼点化社团的监督者，他们致力于将这些重返阳世的魂灵开化，引渡，并护送至最近的皇朝。"
 podgloss.wu: "在$pod_kueijin$社会中，志同道合者之间自然互助的理念构成了其社会互动与身份定义的基础层级。他们通常以五人为一组，传统上称为“屋室”，这种结构成为$pod_kueijin$在第二次生命中替代家庭的单位。"
 podgloss.toumu: "$pod_kueijin$在[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]中有一个比其他任何敌人都更可怕的强大对手，她的名字是斗姆。\n\n斗姆是最恶毒的[Glossary(''阎魔','podgloss.yamaking')]之一，正是这种恶毒让她如此接近[Glossary('魔皇','podgloss.demonemperor')]的王座。这位铁血女皇是迄今为止最广为人知的阎魔女王，以其对东方血族的刻骨仇恨而闻名。\n\n其他[Glossary('阎魔王','podgloss.yamaking')]可能会试图腐蚀和诱捕他们，而为钢铁女皇效力充其量只是缓刑。"
 podgloss.wuhua: "乌邝，盐铁深渊之主，一位[Glossary('阎魔王','podgloss.yamaking')]。尽管其实力不如某些对手，但其邪恶程度却毫不逊色。\n\n他将囚犯压榨至骨枯髓干，只提供铁青楼作为可能的逃脱途径——许多选择此路者最终都追悔莫及。\n\n乌邝的组织结构模仿了先秦的官僚制度。顺从的仆从会得到赏赐和晋升。违逆的下属则会受到惩罚，直至最终被毁灭。任何在这扭曲等级中爬上来的生物，无疑都是狡黠奸邪之物，需谨慎对待。"
 glossary_fera: "[Glossary('化兽族裔', 'glossary_fera_tt')]"
 glossary_fera_tt: "#bold 化兽族裔#!是能够化身为动物形态的灵性种族。$POD_splat_werewolf_plural$是其中数量最多、最为人熟知的，但其他种类亦为数不少。\n\n根据化兽族裔的神话传说，他们由众生之母盖亚盖亚创造，各自肩负着守护其造物的使命。然而，许多族裔或因冷漠，或因愤世嫉俗，或因部族间的血腥冲突，逐渐背离了职责，而盖亚也愈发疏远。\n\n以下化兽族裔可以在[princes_of_darkness|E]中扮演：\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L;bold 狼族#!#!#weak （狼人）#!\n$BULLET_WITH_TAB$#bold [GetTrait('bastet').GetName(GetNullCharacter)]#!#weak (猫人)#!\n$BULLET_WITH_TAB$#bold [GetTrait('mokole').GetName(GetNullCharacter)]#!#weak (鳄鱼人与龙人)#!"
 pod_wod: "[Glossary('黑暗世界','game_concept_world_of_darkness_desc')]"
 pod_cainite: "[Glossary('该隐之子','game_concept_cainite_desc')]"
 pod_cainites: "[Glossary('该隐之子','game_concept_cainite_desc')]"
 pod_kueijin: "[Glossary('万鬼','game_concept_kuei_jin_desc')]"
 pod_Embrace: "[Glossary('初拥','game_concept_Embrace_desc')]"
 pod_diablerie: "[Glossary('吸榨','game_concept_diablerie_desc')]"
 pod_torpor: "[Glossary('蛰眠','game_concept_torpor_desc')]"
 pod_discipline: "[Glossary('血律','game_concept_discipline_desc')]"
 pod_clan: "[Glossary('氏族','game_concept_Clan_desc')]"
 podgloss.tachiuchi_ni_myo_o_etaru: "全方位斩击的艺术。"
 podgloss.chidori: "千鸟是一位忠诚武士的佩刀。"
 podgloss.raikiri: "雷切是一把持有者在被雷电袭击时，斩断了其中雷神的宝剑。"
 podgloss.kensho: "在禅宗中，见性是对自性本真的顿悟，这种本真即是指法界。"
 podgloss.nareswari: "伟大国王们的母亲。"
 podgloss.kerbau_yang_menyeberang: "如渡河的水牛一般，谦卑坚韧，负重前行，却又不可阻挡。"
 podgloss.rakryan_patih: "帕提是印度尼西亚群岛的大臣，其中拉克里安·帕提是最负盛名的职位，即负责管理满者伯夷王国的首相。"
 podgloss.kshatriya: "印度社会的四大种姓之一，刹帝利与武士贵族阶层相关联。"
 podgloss.maha_patih: "最伟大的[Glossary('帕提', 'podgloss.rakryan_patih')]权势滔天，其影响力远超普通大臣职责，更被视为摄政或副王，而非单纯的执政。"
 podgloss.bhayangkara: "满者伯夷的精锐皇家卫队，誓死保卫皇帝及其家人的生命安全。"
 podgloss.sumpah_palapa: "加查·玛达立下血誓，在满者伯夷帝国统治努山达拉群岛之前永不歇息。\n#italic “若我征服努山达拉群岛，方可安歇。若我征服古伦、塞兰、丹戎武啰、哈鲁、彭亨、栋波、巴厘、巽他、巴林冯、单马锡，方可安歇。”#!"
 podgloss.kinalakian: "基纳拉克是守护塔拉瓦西王国的精英全女战士团体，在群岛其他地区被视为努山塔拉的亚马逊女战士。"
 podgloss.kakawin: "卡卡温是一种爪哇诗歌形式，通常采用格律诗体。"
 podgloss.bhinneka_tunggal_ika: "#italic 多元一体。#!\n这句格言后来成为了印度尼西亚政府的座右铭。"
 podgloss.silat: "席拉是一个统称，用于指代一类以使用多种武器为核心的武术，这些武器通常由大师在其认为弟子有资格开始此类训练时锻造。"
 podgloss.bentahara: "盘陀诃罗是马来王国中的一个职位，相当于首相或财政大臣。"
 podgloss.wally_songo: "九[Glossary('瓦力', 'podgloss.wali')]是伊斯兰教的九位圣人，以他们在伊斯兰教传入印度尼西亚过程中的历史作用而受到敬仰。"
 podgloss.wali: "阿拉伯语中的“圣人”或“上帝之友”"
 podgloss.shahbander: "港务长负责管理商人和征收税款。"
 podgloss.laksamana: "马来苏丹国的海军上将。"
 glossary_triat: "[Glossary('三相', 'glossary_triat_tt')]"
 glossary_triat_tt: "三相是灵界中最强大的三个存在：$glossary_wyld$，$glossary_weaver$，和$glossary_wyrm$。\n\n原先三相处于平衡。奇原创造原始物质、生命、灵魂而织者赋予其造物形式与功能，最后妖蛆毁灭造物以腾出新空间。\n\n但是现在三相已不再平衡。织者汲取人类的力量‑其城市、科技、工业和科学‑前所未有的强大。随着自然资源的掠夺，世上的荒野遭到破坏，大自然被迫为人类服务，奇原的影响力逐渐减弱。然而最危险的是妖蛆，祂以邪恶为食，一视同仁地摧毁一切。"
 glossary_wyld: "[Glossary('奇原', 'glossary_wyld_tt')]"
 glossary_wyld_tt: "#bold 奇原#!是组成$glossary_triat$的无法估量强大之灵的三者之一。\n\n奇原是创生之力：其创造为纯粹混沌，由$glossary_weaver$赋予秩序，再由$glossary_wyrm$摧毁重新归于混沌。当三相中其他二灵发疯，被织者压迫排挤，被妖蛆肆意摧毁，奇原逐渐消退。\n\n奇原域是迅猛增长的自然，正被人类一步一步地破坏。"
 glossary_weaver: "[Glossary('织者', 'glossary_weaver_tt')]"
 glossary_weaver_tt: "#bold 织者#!是组成$glossary_triat$的无法估量强大之灵的三者之一。\n\n织者的职责曾是为$glossary_wyld$的造物赋予秩序，在被$glossary_wyrm$摧毁之前，予其存在期间的形式和功能，从而维持创造与毁灭之间的平衡。\n\n一般认为织者是三相失衡的罪魁祸首；织者逐渐厌倦被妖蛆破坏其秩序，于是织网囚禁妖蛆来阻止毁灭。如此囚禁逼疯妖蛆，使其开始摧毁一切，而不仅仅是那些时辰已到的事物。\n\n织者的化身和其子嗣经常采用蜘蛛型态，有时是昆虫。祂是法律、秩序、科学和技术的守护神。随着人类的发展，织者也不断发展。"
 glossary_wyrm: "[Glossary('妖蛆', 'glossary_wyrm_tt')]"
 glossary_wyrm_triatic: "[Glossary('三相妖蛆', 'glossary_wyrm_tt')]"
 glossary_wyrm_apep: "[Glossary('阿佩普', 'glossary_wyrm_tt')]"
 glossary_wyrm_apophis: "[Glossary('阿波菲斯', 'glossary_wyrm_tt')]"
 glossary_wyrm_tt: "#bold 妖蛆#!是组成$glossary_triat$的无法估量强大之灵的三者之一。\n\n妖蛆的使命曾是净化和纠正一切造物，使万物进一步沉入熵之中。祂藉由消灭$glossary_wyld$创生之物，$glossary_weaver$建构之物来完成从生到死的永恒循环。祂是第二个发疯的$glossary_triat$成员。当$glossary_weaver$发疯开始将一切包入网中来避免其织物毁灭，妖蛆逐渐受到限制，直到祂再也无法如愿实现其使命。祂被剥夺了实现其被创造出来使命的机会，陷入了纯粹的愤怒和疯狂之中，一心想要摧毁一切，无论事物预定的时间是否已经到来。\n\n\n如今，妖蛆以一位黑暗神祇的形态存在，主宰着[Glossary('灾祸', 'glossary_wyrm_calamity_tt')]，[Glossary('吞噬', 'glossary_wyrm_consumption_tt')]，和[Glossary('腐化', 'glossary_wyrm_corruption_tt')]。"
 glossary_wyrm_calamity: "[Glossary('战争蛆', 'glossary_wyrm_calamity_tt')]"
 glossary_wyrm_calamity_tt: "#bold 战争蛆#!或称#bold 灾祸之妖蛆#!是$glossary_wyrm_triatic$三头中的第一头首。\n\n它是一头无意识狂怒的怪物，随时准备摧毁沿途的一切。无穷无尽的愤怒驱使它，而毁灭性的本能则引导着其行动。其仆从形形色色——从投入战场的自杀突击兵，到沉溺于宰制与抹杀猎物的庞然蛮兽。\n\n此头首在性质上可与$glossary_wyld$对混沌的热爱相比，但在此混沌并非源自创生，而是经由毁灭性暴行所达成。"
 glossary_wyrm_consumption: "[Glossary('噬魂蛆', 'glossary_wyrm_consumption_tt')]"
 glossary_wyrm_consumption_tt: "#bold 噬魂蛆#!或称#bold 吞噬之妖蛆#!是$glossary_wyrm_triatic$三头中的第二头首。\n\n它是贪婪、情欲与暴食等啃噬渴望的具象化。其仆从一些已彻底放弃了自身的意志；另一些则成了目标单一的杀戮者，追逐着那些他们愚昧地以为能使自身圆满之物。噬魂蛆的仇恨如同恶疾般溃烂滋生，无可避免地摧残被感染的血肉，并侵蚀本就饱受折磨的心智。\n\n此一头首在性质上可与$glossary_weaver$对统一的渴求相比，然而在此所谓的统一，不过是透过吞食并最终加以消化而达成。"
 glossary_wyrm_corruption: "[Glossary('亵渎蛆', 'glossary_wyrm_corruption_tt')]"
 glossary_wyrm_corruption_tt: "#bold 亵渎蛆#!或称#bold 腐化之妖蛆#!是$glossary_wyrm_triatic$三头中的第三头首。\n\n它是世间一切腐化冲动与堕落本能的显现。亵渎蛆以阴险而无声的方式，从受害者的内在进行引诱，在心底低语诱惑，使猎物心甘情愿地走向其巨口。它既是伊甸园中的蛇，也是堕天使那愚昧的野心；既是[GetTrait('mage').GetName(GetNullCharacter)]妄图召唤超出自身掌控之力的傲慢，也是某个$glossary_fera$自以为能驾驭终将令其沉沦的灵知力量时所展现的狂妄。\n\n此一头首在性质上，与妖蛆原初所承担的净化职能相比。然而在凡俗世界中，它只能以无形、细微、且由内而外的方式啃噬受害者，直至其所剩无几——只留下一具被腐化到无法再存活的黑暗空壳。"
 podgloss.truename: "生灵的真名是其存在、历史与身份的体现。这是一个涵盖目标对象从内脏到灵魂每一部分的词汇。多种形式的魔法允许施法者呼唤其他生灵的真名，从而影响其现实本质。\n\n在[princes_of_darkness|E]中，学习其他角色的真名是某些[splats|E]可进行的缓慢[journey|E]。这是某些能力的前提条件——例如，#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L 恶魔学家#!#!需要知晓$POD_splat_demon$的真名才能[diabolism_bind|E]他们。\n\n$POD_splat_mummy_plural$广泛运用真名，他们称之为#italic 列涅#!。除了学习角色的真名外，他们还会通过[journey|E]学习金属、植物和动物的真名，并将其作为术言赫考的一部分。"
 pod_Embraced: "[Glossary('初拥','game_concept_Embrace_desc')]"
 pod_disciplines: "[Glossary('血律','game_concept_discipline_desc')]"
 pod_vitae: "[Glossary('精血','game_concept_vitae_desc')]"
 glossary_courts_of_love: "[Glossary('爱之皇庭', 'glossary_courts_of_love_tt')]"
 glossary_courts_of_love_tt: "爱之皇庭是法兰西[GetTrait('toreador').GetName(GetNullCharacter)]所建立的[GetTrait('vampire').GetName(GetNullCharacter)]封建制领地。其为许多爱之庭组成，每一个都是一位强大妥芮朵的领地。\n\n最著名最有权势的爱之庭及其史实主人为：\n$BULLET_WITH_TAB$母主萨利安娜治下的瓦卢瓦\n$BULLET_WITH_TAB$女王公正者海伦妮治下的香槟\n$BULLET_WITH_TAB$国王艾蒂安·德·普瓦捷治下的普瓦捷\n$BULLET_WITH_TAB$女王伊思妲·德·布莱斯治下的安茹\n$BULLET_WITH_TAB$女王埃丝克拉蒙德治下的图卢兹"
 glossary_osirian_league: "[Glossary('奥西里斯联盟', 'glossary_osirian_league_tt')]"
 glossary_osirian_league_tt: "奥西里斯联盟是一个致力于对抗[Glossary('赛特','game_concept_antediluvian_desc')]的组织。\n\n其成员包括：\n$BULLET_WITH_TAB$索贝克麾下的[GetTrait('mokole').GetName(GetNullCharacter)]。\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L 狼族#!的寂静漫游者部族。\n$BULLET_WITH_TAB$布巴斯提#TOOLTIP:GAME_TRAIT,bastet,[GetNullCharacter] #L 猫人#!。\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L 吸血鬼#!的奥西里斯之子和阿努比斯的门徒。\n$BULLET_WITH_TAB$凡人法师的伊西斯密教祭司。\n$BULLET_WITH_TAB$游荡的[GetTrait('eshu').GetName(GetNullCharacter)]。\n$BULLET_WITH_TAB$[GetTrait('shemsuheru').GetName(GetNullCharacter)]们。"
 glossary_khitta: "[Glossary('区', 'glossary_khitta_tt')]"
 glossary_khittas: "[Glossary('区', 'glossary_khitta_tt')]"
 glossary_khitta_tt: "开罗存在数个派系，其组织方式为\"区\"——一种松散划分的区域，通常由特定的$pod_clan$或世系管辖。这些领地大多实行自治，但最终都需向苏丹或亲王效忠。尽管开罗以穆斯林人口为主，但仅有少数区与[Glossary('阿什拉派','game_concept_ashirra_desc')]结盟。\n\n阿什拉派区：\n$BULLET_WITH_TAB$巴努·拉玛区：勒森魃领地。\n$BULLET_WITH_TAB$巴努·亚什库尔区区：阿刹迈领地。\n$BULLET_WITH_TAB$巴努·哈吉区：诺斯费拉图领地。\n$BULLET_WITH_TAB$巴努·芬区：妥芮朵领地。该区正史记载为巴努·杜瓦尔区，直至179年随拿破仑抵达开罗的妥芮朵成员建立后才成形。\n\n其他区：\n$BULLET_WITH_TAB$巴努·艾尔拉亚区：真布鲁赫领地。\n$BULLET_WITH_TAB$巴努·阿尔-赛迪区：赛特之子领地。\n$BULLET_WITH_TAB$巴努·扎马雷克区：自由领地，容纳各类血族聚居。\n$BULLET_WITH_TAB$巴努·阿兹拉克区：梵卓领地，由安东尼乌斯及其后裔统辖。\n$BULLET_WITH_TAB$巴努·吉萨区：阿努比斯门徒领地，坐落于开罗城郊。"