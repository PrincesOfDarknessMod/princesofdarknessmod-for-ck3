l_simp_chinese:
 trait_homid_born:0 "人子"
 trait_homid_born_desc:0 "人子是化形者血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_metis:0 "忌子"
 trait_metis_desc:0 "忌子是稀有的化形者血种之一。他们是两位为了爱或欲望而打破律令的化形者的后代。他们以半兽形形态出生，因此半兽形也是他们的自然形态——此外，他们是畸形的，不育的。"
 trait_lupus_born:0 "狼子"
 trait_lupus_born_desc:0 "狼子是狼族血种之一，作为狼出生并由狼抚养，因此狼形也是他们的自然形态。"
 trait_ahroun:0 "满月"
 trait_ahroun_desc:0 "狼族生而有之的五大月兆之一。满月狼是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_galliard:0 "隆月"
 trait_galliard_desc:0 "狼族生而有之的五大月兆之一。隆月狼唱诉狼族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_philodox:0 "半月"
 trait_philodox_desc:0 "狼族生而有之的五大月兆之一。半月意味着平衡和二元性，在其影响下出生的狼族经常充当其战群的顾问、调解人和守法者。"
 trait_theurge:0 "弦月"
 trait_theurge_desc:0 "狼族生而有之的五大月兆之一。弦月赋予了洞察力天赋。弦月狼是狼族的神秘主义者，比任何人都更接近影界和它的居民。"
 trait_ragabash:0 "新月"
 trait_ragabash_desc:0 "狼族生而有之的五大月兆之一。在新月期间出生的狼人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_gnosis:0 "灵知"
 trait_gnosis_desc:0 "灵知是一种灵性的、魔法的能量。一些有天赋的凡人可以获得它。 灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_gnosis_kinfolk:0 "兽嫡灵知"
 trait_gnosis_kinfolk_desc:0 "灵知是一种灵性的、魔法的能量。一些有天赋的兽嫡可以获得它。 灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_abomination:0 "恶煞"
 trait_abomination_desc:0 "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的害怕。他们非常强大，大多数很快就会被陷入疯狂，变得兽性大发，甚至无法表现得像人类。"
 trait_feline_born:0 "猫子"
 trait_feline_born_desc:0 "猫子是芭丝特血种之一，作为大猫出生并由大猫抚养，因此猫形也是他们的自然形态。"
 trait_hyaena_born:0 "鬣子"
 trait_hyaena_born_desc:0 "鬣子是阿迦巴血种之一，作为鬣狗出生并由鬣狗抚养，因此鬣形也是他们的自然形态。"
 trait_pryio_twilight:0 "暮光"
 trait_pryio_twilight_desc:0 "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暮光芭丝特是提问者和追查者，他们倾向于成为侦探、律师、间谍或神秘主义者。"
 trait_pryio_daylight:0 "日光"
 trait_pryio_daylight_desc:0 "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。日光芭丝特是开放和直接的，他们倾向于成为外交官、战士、执法者和保护者。"
 trait_pryio_night:0 "暗夜"
 trait_pryio_night_desc:0 "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暗夜芭丝特通常是孤僻和隐蔽的，他们往往是刺客、学者、科学家和黑暗魔法的实践者。"
 trait_breed:0 "血种"
 trait_auspice:0 "月兆"
 trait_pryio:0 "月宠"
 trait_corvid_born:0 "鸦子"
 trait_corvid_born_desc:0 "鸦子是科拉克斯血种之一，作为渡鸦出生并由渡鸦抚养，因此鸦形也是他们的自然形态。"
 trait_ursine_born:0 "熊子"
 trait_ursine_born_desc:0 "熊子是古拉赫勒血种之一，作为熊出生并由熊抚养，因此熊形也是他们的自然形态。"
 trait_roko_born:0 "狐子"
 trait_roko_born_desc:0 "狐子是狐妖血种之一，作为狐狸出生并由狐狸抚养，因此狐形也是他们的自然形态。"
 trait_suchid_born:0 "龙子"
 trait_suchid_born_desc:0 "龙子是莫科莱血种之一，作为爬行动物出生并由爬行动物抚养，因此龙形也是他们的自然形态。"
 trait_vasuki_born:0 "蛇子"
 trait_vasuki_born_desc:0 "蛇子是娜迦血种之一，作为蛇出生并由蛇抚养，因此蛇形也是他们的自然形态。"
 trait_latrani_born:0 "郊狼子"
 trait_latrani_born_desc:0 "郊狼子是努维狭血种之一，作为郊狼出生并由郊狼抚养，因此郊狼形也是他们的自然形态。"
 trait_rodens_born:0 "鼠子"
 trait_rodens_born_desc:0 "鼠子是鼠族血种之一，作为鼠出生并由鼠抚养，因此鼠形也是他们的自然形态。"
 trait_squamus_born:0 "鲨子"
 trait_squamus_born_desc:0 "鲨子是罗基阿血种之一，作为鲨鱼出生并由鲨鱼抚养，因此鲨鱼形也是他们的自然形态。"
 trait_bos_born:0 "牛子"
 trait_bos_born_desc:0 "牛子是阿皮斯血种之一，作为牛出生并由牛抚养，因此牛形也是他们的自然形态。"
 trait_chiroptera_born:0 "蝙蝠子"
 trait_chiroptera_born_desc:0 "蝙蝠子是卡玛佐兹血种之一，作为蝙蝠出生并由蝙蝠抚养，因此蝙蝠形也是他们的自然形态。"
 trait_scrofa_born:0 "猪子"
 trait_scrofa_born_desc:0 "猪子是格隆迪尔血种之一，作为野猪出生并由野猪抚养，因此野猪形也是他们的自然形态。"
 trait_arachnid_born:0 "蛛子"
 trait_arachnid_born_desc:0 "蛛子是阿南西血种之一，作为蜘蛛出生并由蜘蛛抚养，因此蜘蛛形也是他们的自然形态。"
 trait_kojin:0 "荒神"
 trait_kojin_desc:0 "荒神是狐妖血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_balaram:0 "婆罗罗摩"
 trait_balaram_desc:0 "婆罗罗摩是娜迦血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_shinju:0 "神狐"
 trait_shinju_desc:0 "神狐既不畸形，也不不育。然而，在所有狐妖与狐妖的后代中，只有10%是神狐，而不是正常的人类或狐嫡。此外，如果出生的是神狐，狐妖父母中的一方可能会死亡。神狐在王庭中长大后，通常会拥有令人难以忍受的傲慢和完美主义。"
 trait_ahi:0 "阿希"
 trait_ahi_desc:0 "在非常特殊的条件下，娜迦配对会产生一个可育的、非畸形的后代，称为阿希。一个母亲一生中只能生一个阿希；所有其他与雄性娜迦的配对都会产生蛇嫡，尽管她可以选择他们的血种。他们的皮肤在暴露于恶劣的污染环境下会起水泡，因为他们是在母亲的阿南塔的纯水中长大的。"
 trait_beast_born:0 "兽子"
 trait_beast_born_desc:0 "兽子是化形者血种之一，作为动物出生并由动物抚养，因此兽形也是他们的自然形态。"
 trait_uzmati:0 "乌兹马提"
 trait_uzmati_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。满月熊是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_kojubat:0 "科居巴特"
 trait_kojubat_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。隆月熊唱诉熊族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_rishi:0 "里舍"
 trait_rishi_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。半月意味着平衡和二元性，在该阶段的熊族经常充当其战群的顾问、调解人和守法者。 "
 trait_kieh:0 "基赫"
 trait_kieh_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。弦月赋予了洞察力天赋。弦月熊是狼族的神秘主义者，比任何人都更接近影界和它的居民。"
 trait_arcas:0 "阿卡斯"
 trait_arcas_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。在新月阶段的熊人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_werewolf_abomination:0 "狼族恶煞"
 trait_gurahl_abomination:0 "影堕"
 trait_mokole_abomination:0 "莫科莱恶煞"
 trait_dawn:0 "Dawn"
 trait_dawn_female_desc:0 "One of the two Aspect under which a Ajaba may be born. Akin to Garou Ahroun, female Dawn are warriors."
 trait_dawn_male_desc:0 "One of the two Aspect under which a Ajaba may be born. Akin to Garou Galliards, male Dawn are storytellers."
 trait_dusk:0 "Dusk"
 trait_dusk_female_desc:0 "One of the two Aspect under which a Ajaba may be born. A more violent version of Ragabash, female Dusk are assassins."
 trait_dusk_male_desc:0 "One of the two Aspect under which a Ajaba may be born. Like highly talented Theurges, male Dusk are mystics."
 trait_warriors:0 "Warriors"
 trait_warriors_desc:0 "As the name implies, fighters and killers, the first line in combat, much like the Garou's Ahroun. Also known as \"Blade Slaves\"."
 trait_bards:0 "Bards"
 trait_bards_desc:0 "吟游诗人是鼠人社会中迷失的一面。俗称“演讲者”，他们充当种族的和平缔造者：鼠族和其他种族之间的中间人，收集传说以增加他们的集体血液记忆。在世界早期，吟游诗人是狼族族群的使者，当他们的种族被背叛时，他们是第一个死去的人。"
 trait_knife_skulkers:0 "Knife Skulkers"
 trait_knife_skulkers_desc:0 "荣誉的鼠族刺客只按合同工作。他们还充当法官和调解员，就像半月狼族一样。"
 trait_shadow_seers:0 "Shadow Seers"
 trait_shadow_seers_desc:0 "Shamans and spiritual guides, much like a Theurge."
 trait_tunnel_runners:0 "Tunnel Runners"
 trait_tunnel_runners_desc:0 "Wandering scouts and spies, who link Ratkin Warrens around the world. Similar to Ragabash."
 trait_path:0 "道途"
 trait_eji:0 "卫士"
 trait_eji_desc:0 "战士之道，熔岩系，掌控土和火。"
 trait_doshi:0 "道士"
 trait_doshi_desc:0 "术士之道，雷电系，掌控气和火。"
 trait_gukutsushi:0 "仙术士"
 trait_gukutsushi_desc:0 "幻术使之道，雾系，掌控水与气。"
 trait_kataribe:0 "语部"
 trait_kataribe_desc:0 "说书人之道，黏土系，掌控土和水。"
 trait_sun_auspice:0 "日兆"
 trait_striking:0 "The Rising Sun"
 trait_striking_desc:0 "这些被称为“打击者”的莫科莱是对抗妖蛆和黑暗势力（如血族）的战士。"
 trait_unshading:0 "The Noonday Sun"
 trait_unshading_desc:0 "这些出生在太阳处于最高点时的莫科莱被称为“无影者”，是龙族的法官和守法者。"
 trait_warding:0 "The Setting Sun"
 trait_warding_desc:0 "这些于黄昏时出生的莫科莱被称为“守卫”，他们经常在对莫科莱具有重要意义的地方站岗。"
 trait_concealing:0 "The Shrouded Sun"
 trait_concealing_desc:0 "这些出生于阴云密布的天空下的莫科莱被称为“隐匿者”，他们是狡猾的萨满。"
 trait_shining:0 "The Midnight Sun"
 trait_shining_desc:0 "这些出生在晚上的莫科莱被称为“闪耀者”，是类似于新月狼族的诡计者。"
 trait_gathering:0 "The Decorated Sun"
 trait_gathering_desc:0 "Called \"Gathering\", these Mokolé are leaders responsible for directing the wallows and keeping their people organized, and are hatched or born under solar halos or \"sun-dogs.\""
 trait_crowning:0 "The Solar Eclipse"
 trait_crowning_desc:0 "这些非常罕见的莫科莱被称为“加冕者”，是部族无可争议的领袖。他们在日食期间出生，被族员视为皇室成员。因为如此，许多莫科莱母亲通常会尝试在日食期间生下自己的孩子。"
 trait_seasonal_auspice:0 "季兆"
 trait_kamakshi:0 "Kamakshi"
 trait_kamakshi_desc:0 "Spring - blessed by the forces of life and renewal, their element is earth."
 trait_kartikeya:0 "Kartikeya"
 trait_kartikeya_desc:0 "Summer - vigorous and true, their energy promotes the greatest passions to be found among the serpent people. Their element is fire."
 trait_kamsa:0 "Kamsa"
 trait_kamsa_desc:0 "Autumn - the mind of the target is their passion and their forte. Their element is air."
 trait_kali:0 "Kali"
 trait_kali_desc:0 "Winter - their blood is the coolest, their vision the truest, and their dedication to their cause knows no bounds. Their element is water."
 trait_freak:0 "畸变"
 trait_engineers:0 "Engineers"
 trait_engineers_desc:0 "科学家、发明家和工匠，他们喜欢与科技打交道。"
 trait_munchmausen:0 "Munchmausen"
 trait_munchmausen_desc:0 "Swashbuckler Ratkin, grandly deluded, one and all."
 trait_plague_lords:0 "Plague Lords"
 trait_plague_lords_desc:0 "Masters of disease and corruption."
 trait_twitchers:0 "Twitchers"
 trait_twitchers_desc:0 "Anarchists among anarchists, Twitchers are insane and unpredictable demolition men."
 trait_water_auspice:0 "海兆"
 trait_brightwater:0 "Brightwater"
 trait_brightwater_desc:0 "Rokea born during bright days or full moons. Brightwaters are similar to Garou Ahroun; they are warriors and heroes. However, they often desire to be the near the surface of the sea."
 trait_dimwater:0 "Dimwater"
 trait_dimwater_desc:0 "Dimwaters are born during clouded days or at night under any moon phase except full or new. Most Rokea fall under this auspice. They are the judges and leaders of the Rokea race and create what few fetishes the Rokea use."
 trait_darkwater:0 "Darkwater"
 trait_darkwater_desc:0 "Called the \"mad ones\" by their peers, Darkwaters are born under eclipses or the New Moon. They are curious, innovative, bright, and daring. They enjoy diving into the frigid depths of the sea or walking on land to uncover new secrets."
 trait_lunisolar_auspice:0 "日月兆"
 trait_lunar:0 "Lunar"
 trait_lunar_desc:0 "Born at night, these Apis acted as the breed's warriors, protecting their charges from outside threats."
 trait_twilight:0 "Twilight"
 trait_twilight_desc:0 "Born at either sunrise or sunset, these Apis were the closest to the spirit-realms."
 trait_solar:0 "Solar"
 trait_solar_desc:0 "Born at day, these Apis worked the closest with humans and other stocks."