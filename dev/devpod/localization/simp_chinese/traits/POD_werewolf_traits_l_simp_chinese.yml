l_simp_chinese:
 trait_homid_born:0 "人子"
 trait_homid_born_desc:0 "人子是化形者血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_metis:0 "忌子"
 trait_metis_desc:0 "忌子是稀有的化形者血种之一。他们是两位为了爱或欲望而打破律令的狼族的后代。他们以半兽形形态出生，因此半兽形也是他们的自然形态——此外，他们是畸形的，不育的。"
 trait_lupus_born:0 "狼子"
 trait_lupus_born_desc:0 "狼子是狼族血种之一，作为狼出生并由狼抚养，因此狼形也是他们的自然形态。"
 trait_ahroun:0 "满月"
 trait_ahroun_desc:0 "狼族生而有之的五大月兆之一。满月狼是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_galliard:0 "隆月"
 trait_galliard_desc:0 "狼族生而有之的五大月兆之一。隆月狼唱诉狼族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_philodox:0 "半月"
 trait_philodox_desc:0 "狼族生而有之的五大月兆之一。半月意味着平衡和二元性，在其影响下出生的狼族经常充当其兽群的顾问、调解人和守法者。"
 trait_theurge:0 "弦月"
 trait_theurge_desc:0 "狼族生而有之的五大月兆之一。弦月赋予了洞察力天赋。弦月狼是狼族的神秘主义者，比任何人都更接近影界和它的居民。"
 trait_ragabash:0 "新月"
 trait_ragabash_desc:0 "狼族生而有之的五大月兆之一。在新月期间出生的人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_gnosis:0 "灵知"
 trait_gnosis_desc:0 "灵知是一种灵性的、魔法的能量。一些有天赋的凡人可以获得它。 灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_gnosis_kinfolk:0 "兽嫡灵知"
 trait_gnosis_kinfolk_desc:0 "灵知是一种灵性的、魔法的能量。一些有天赋的兽嫡可以获得它。 灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_abomination:0 "恶煞"
 trait_abomination_desc:0 "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的害怕。他们非常强大，大多数很快就会被陷入疯狂，变得兽性大发，甚至无法表现得像人类。"
 trait_feline_born:0 "猫子"
 trait_feline_born_desc:0 "狼子是巴丝特血种之一，作为大猫出生并由大猫抚养，因此猫形也是他们的自然形态。"
 trait_hyaena_born:0 "鬣子"
 trait_hyaena_born_desc:0 "鬣子是阿迦巴血种之一，作为鬣狗出生并由鬣狗抚养，因此鬣形也是他们的自然形态。"
 trait_pryio_twilight:0 "黄昏"
 trait_pryio_twilight_desc:0 "Also known as 'Moon-Favor', Bastet to determine their place and how the cat approaches life and handles the challenges thrown their way through Pryio. While it is often determined by the time of day in which the Bastet achieved her First Change, Pryio can shift if the Bastet undergoes a severe life change. Twilight Bastet are questioners and seekers, they tend to be detectives, lawyers, spies, or mystics."
 trait_pryio_daylight:0 "日光"
 trait_pryio_daylight_desc:0 "Also known as 'Moon-Favor', Bastet to determine their place and how the cat approaches life and handles the challenges thrown their way through Pryio. While it is often determined by the time of day in which the Bastet achieved her First Change, Pryio can shift if the Bastet undergoes a severe life change. Twilight Bastet are open and direct, they tend to be diplomats, warriors, lawgivers, and protectors."
 trait_pryio_night:0 "暗夜"
 trait_pryio_night_desc:0 "Also known as 'Moon-Favor', Bastet to determine their place and how the cat approaches life and handles the challenges thrown their way through Pryio. While it is often determined by the time of day in which the Bastet achieved her First Change, Pryio can shift if the Bastet undergoes a severe life change. Twilight Bastet are often withdrawn and reclusive, they tend to be assassins, scholars, scientists, and practitioners of dark magics."