l_simp_chinese:
 trait_homid_born: "人子"
 trait_homid_born_desc: "人子是化形者血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_metis: "忌子"
 trait_metis_desc: "忌子是稀有的化形者血种之一。他们是两位为了爱或欲望而打破律令的化形者的后代。他们以半兽形形态出生，因此半兽形也是他们的自然形态——此外，他们是畸形的，不育的。"
 trait_lupus_born: "狼子"
 trait_lupus_born_desc: "狼子是狼族血种之一，作为狼出生并由狼抚养，因此狼形也是他们的自然形态。"
 trait_ahroun: "满月"
 trait_ahroun_desc: "狼族生而有之的五大月兆之一。满月狼是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_galliard: "凸月"
 trait_galliard_desc: "狼族生而有之的五大月兆之一。凸月狼唱诉狼族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_philodox: "半月"
 trait_philodox_desc: "狼族生而有之的五大月兆之一。半月意味着平衡和二元性，在其影响下出生的狼族经常充当其战群的顾问、调解人和守法者。"
 trait_theurge: "眉月"
 trait_theurge_desc: "狼族生而有之的五大月兆之一。眉月赋予了洞察力天赋。眉月狼是狼族的神秘主义者，比任何人都更接近[umbra|E]和它的居民。"
 trait_ragabash: "新月"
 trait_ragabash_desc: "狼族生而有之的五大月兆之一。在新月期间出生的狼人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_gnosis: "灵知"
 trait_gnosis_desc: "灵知是一种灵性的、魔法的能量。一些有天赋的凡人可以获得它。灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_gnosis_kinfolk: "兽嫡灵知"
 trait_gnosis_kinfolk_desc: "灵知是一种灵性的、魔法的能量。一些有天赋的兽嫡可以获得它。灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_abomination: "恶煞"
 trait_abomination_desc: "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的害怕。他们非常强大，大多数很快就会被陷入疯狂，变得兽性大发，甚至无法表现得像人类。"
 trait_feline_born: "猫子"
 trait_feline_born_desc: "猫子是芭丝特血种之一，作为大猫出生并由大猫抚养，因此猫形也是他们的自然形态。"
 trait_hyaena_born: "鬣子"
 trait_hyaena_born_desc: "鬣子是阿迦巴血种之一，作为鬣狗出生并由鬣狗抚养，因此鬣形也是他们的自然形态。"
 trait_pryio_twilight: "暮光"
 trait_pryio_twilight_desc: "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暮光芭丝特是提问者和追查者，他们倾向于成为侦探、律师、间谍或神秘主义者。"
 trait_pryio_daylight: "日光"
 trait_pryio_daylight_desc: "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。日光芭丝特是开放和直接的，他们倾向于成为外交官、战士、执法者和保护者。"
 trait_pryio_night: "暗夜"
 trait_pryio_night_desc: "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暗夜芭丝特通常是孤僻和隐蔽的，他们往往是刺客、学者、科学家和黑暗魔法的实践者。"
 trait_breed: "血种"
 trait_auspice: "月兆"
 trait_pryio: "月宠"
 trait_corvid_born: "鸦子"
 trait_corvid_born_desc: "鸦子是科拉克斯血种之一，作为渡鸦出生并由渡鸦抚养，因此鸦形也是他们的自然形态。"
 trait_ursine_born: "熊子"
 trait_ursine_born_desc: "熊子是古拉赫勒血种之一，作为熊出生并由熊抚养，因此熊形也是他们的自然形态。"
 trait_roko_born: "狐子"
 trait_roko_born_desc: "狐子是狐妖血种之一，作为狐狸出生并由狐狸抚养，因此狐形也是他们的自然形态。"
 trait_suchid_born: "龙子"
 trait_suchid_born_desc: "龙子是莫科莱血种之一，作为爬行动物出生并由爬行动物抚养，因此龙形也是他们的自然形态。"
 trait_vasuki_born: "蛇子"
 trait_vasuki_born_desc: "蛇子是娜迦血种之一，作为蛇出生并由蛇抚养，因此蛇形也是他们的自然形态。"
 trait_latrani_born: "郊狼子"
 trait_latrani_born_desc: "郊狼子是努维狭血种之一，作为郊狼出生并由郊狼抚养，因此郊狼形也是他们的自然形态。"
 trait_rodens_born: "鼠子"
 trait_rodens_born_desc: "鼠子是鼠族血种之一，作为鼠出生并由鼠抚养，因此鼠形也是他们的自然形态。"
 trait_squamus_born: "鲨子"
 trait_squamus_born_desc: "鲨子是罗基阿血种之一，作为鲨鱼出生并由鲨鱼抚养，因此鲨鱼形也是他们的自然形态。"
 trait_bos_born: "牛子"
 trait_bos_born_desc: "牛子是阿皮斯血种之一，作为牛出生并由牛抚养，因此牛形也是他们的自然形态。"
 trait_chiroptera_born: "蝙蝠子"
 trait_chiroptera_born_desc: "蝙蝠子是卡玛佐兹血种之一，作为蝙蝠出生并由蝙蝠抚养，因此蝙蝠形也是他们的自然形态。"
 trait_scrofa_born: "猪子"
 trait_scrofa_born_desc: "猪子是格隆迪尔血种之一，作为野猪出生并由野猪抚养，因此野猪形也是他们的自然形态。"
 trait_kojin: "荒神"
 trait_kojin_desc: "荒神是狐妖血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_balaram: "婆罗罗摩"
 trait_balaram_desc: "婆罗罗摩是娜迦血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_shinju: "神狐"
 trait_shinju_desc: "神狐既不畸形，也不不育。然而，在所有狐妖与狐妖的后代中，只有10%是神狐，而不是正常的人类或狐嫡。此外，如果出生的是神狐，狐妖父母中的一方可能会死亡。神狐在王廷中长大后，通常会拥有令人难以忍受的傲慢和完美主义。"
 trait_ahi: "阿希"
 trait_ahi_desc: "在非常特殊的条件下，娜迦配对会产生一个可育的、非畸形的后代，称为阿希。一个母亲一生中只能生一个阿希；所有其他与雄性娜迦的配对都会产生蛇嫡，尽管她可以选择他们的血种。他们的皮肤在暴露于恶劣的污染环境下会起水泡，因为他们是在母亲的阿南塔的纯水中长大的。"
 trait_beast_born: "兽子"
 trait_beast_born_desc: "兽子是化形者血种之一，作为动物出生并由动物抚养，因此兽形也是他们的自然形态。"
 trait_uzmati: "乌兹马提"
 trait_uzmati_desc: "古拉赫勒在其一生中经历的五大月兆之一。满月熊是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_kojubat: "科居巴特"
 trait_kojubat_desc: "古拉赫勒在其一生中经历的五大月兆之一。凸月熊唱诉熊族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_rishi: "里舍"
 trait_rishi_desc: "古拉赫勒在其一生中经历的五大月兆之一。半月意味着平衡和二元性，在该阶段的熊族经常充当其战群的顾问、调解人和守法者。"
 trait_kieh: "基赫"
 trait_kieh_desc: "古拉赫勒在其一生中经历的五大月兆之一。眉月赋予了洞察力天赋。眉月熊是狼族的神秘主义者，比任何人都更接近[umbra|E]和它的居民。"
 trait_arcas: "阿卡斯"
 trait_arcas_desc: "古拉赫勒在其一生中经历的五大月兆之一。在新月阶段的熊人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_werewolf_abomination: "狼族恶煞"
 trait_gurahl_abomination: "影堕"
 trait_mokole_abomination: "莫科莱恶煞"
 trait_dawn: "黎明"
 trait_dawn_female_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的满月狼，黎明女性是战士。"
 trait_dawn_male_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的凸月狼，黎明男性是叙事者。"
 trait_dusk: "黄昏"
 trait_dusk_female_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的新月狼，黎明女性是刺客。"
 trait_dusk_male_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的眉月狼，黄昏男性是秘术师。"
 trait_warriors: "战士"
 trait_warriors_desc: "顾名思义，他们是战士和杀手，是战斗的第一线，就像狼族的满月狼一样。也被称为“刀锋奴隶”。"
 trait_bards: "吟游诗人"
 trait_bards_desc: "吟游诗人是鼠人社会中迷失的一面。俗称“演讲者”，他们充当种族的和平缔造者：鼠族和其他种族之间的中间人，收集传说以增加他们的集体血液记忆。在世界早期，吟游诗人是狼族族群的使者，当他们的种族被背叛时，他们是第一个死去的人。"
 trait_knife_skulkers: "匕首游荡者"
 trait_knife_skulkers_desc: "荣誉的鼠族刺客只按契约工作。他们还充当法官和调解员，就像半月狼族一样。"
 trait_shadow_seers: "暗影先知"
 trait_shadow_seers_desc: "萨满和精神导师，与眉月狼很相似。"
 trait_tunnel_runners: "隧道行者"
 trait_tunnel_runners_desc: "游荡的侦察兵和间谍，他们将世界各地的鼠族洞窟连接起来。与新月狼相似。"
 trait_path: "道途"
 trait_eji: "卫士"
 trait_eji_desc: "战士之道，熔岩系，掌控土和火。"
 trait_doshi: "道士"
 trait_doshi_desc: "术士之道，雷电系，掌控气和火。"
 trait_gukutsushi: "仙术士"
 trait_gukutsushi_desc: "幻术使之道，雾系，掌控水与气。"
 trait_kataribe: "语部"
 trait_kataribe_desc: "说书人之道，黏土系，掌控土和水。"
 trait_sun_auspice: "日兆"
 trait_striking: "旭日"
 trait_striking_desc: "这些被称为“突击者”的莫科莱是对抗妖蛆和黑暗势力（如血族）的战士。"
 trait_unshading: "午日"
 trait_unshading_desc: "这些出生在太阳处于最高点时的莫科莱被称为“无影者”，是龙族的法官和守法者。"
 trait_warding: "夕日"
 trait_warding_desc: "这些于黄昏时出生的莫科莱被称为“守卫”，他们经常在对莫科莱具有重要意义的地方站岗。"
 trait_concealing: "掩日"
 trait_concealing_desc: "这些出生于阴云密布的天空下的莫科莱被称为“隐匿者”，他们是狡猾的萨满。"
 trait_shining: "夜日"
 trait_shining_desc: "这些出生在晚上的莫科莱被称为“闪耀者”，是类似于新月狼族的诡计者。"
 trait_gathering: "幻日"
 trait_gathering_desc: "这些莫科莱被称为“聚集者”，是负责指挥据点和维持族人组织的领导者，他们在日晕或“幻日”下孵化或出生。"
 trait_crowning: "日蚀"
 trait_crowning_desc: "这些非常罕见的莫科莱被称为“加冕者”，是部族无可争议的领袖。他们在日食期间出生，被族员视为皇室成员。因为如此，许多莫科莱母亲通常会尝试在日食期间生下自己的孩子。"
 trait_seasonal_auspice: "季兆"
 trait_kamakshi: "卡玛克什"
 trait_kamakshi_desc: "春——被生命和万物复苏的力量所眷顾，对应的元素是地。"
 trait_kartikeya: "迦絺吉夜"
 trait_kartikeya_desc: "夏——充满活力和真情实感，他们的元气促进了蛇人最大的激情。对应的元素是火。"
 trait_kamsa: "卡姆萨"
 trait_kamsa_desc: "秋——思想是他们的激情的目标所在，也是他们的强项。对应的元素是风。"
 trait_kali: "迦梨"
 trait_kali_desc: "冬——他们的血液是最酷的，他们的眼光是最真实的，他们对功业的奉献是无止境的。对应的元素是水。"
 trait_freak: "畸变"
 trait_engineers: "工程师"
 trait_engineers_desc: "科学家、发明家和工匠，他们喜欢与科技打交道。"
 trait_munchmausen: "孟乔森"
 trait_munchmausen_desc: "獐头鼠目的鼠族、每个都妄自尊大。"
 trait_plague_lords: "瘟疫领主"
 trait_plague_lords_desc: "疾病和腐败的主宰。"
 trait_twitchers: "扭曲者"
 trait_twitchers_desc: "无政府主义者中的无政府主义者，扭曲者是疯狂而不可预测的爆破手。"
 trait_water_auspice: "海兆"
 trait_brightwater: "澈水"
 trait_brightwater_desc: "在光天白日或满月时出生的罗基阿。澈水鲨与狼族的满月狼相似，都是战士和英雄。不过，他们常常渴望靠近海面。"
 trait_dimwater: "幽水"
 trait_dimwater_desc: "幽水鲨出生在阴天或除满月和新月外的月相的夜晚。大多数罗基阿都属于这种情况。他们是罗基阿族的法官和领导者，并创造了罗基阿族使用的少数灵具。"
 trait_darkwater: "暗水"
 trait_darkwater_desc: "暗水鲨被同伴称为“疯狂者”，他们在日食或新月时出生。他们好奇、创新、聪明、大胆。他们喜欢潜入寒冷的深海或在陆地上行走，以揭开新的秘密。"
 trait_lunisolar_auspice: "日月兆"
 trait_lunar: "月光"
 trait_lunar_desc: "这些阿皮斯在夜间出生，充当战士血种，保护他们的据点不受外界威胁。"
 trait_twilight: "暮光"
 trait_twilight_desc: "这些阿皮斯出生在日出或日落时分，是最接近灵界的生物。"
 trait_solar: "日光"
 trait_solar_desc: "这些阿皮斯生于白天，与人类和其他种群的关系最为密切。"
 trait_ajaba_abomination: "阿迦巴恶煞"
 trait_bastet_abomination: "芭丝特恶煞"
 trait_rokea_abomination: "罗基阿恶煞"
 trait_corax_abomination: "科拉克斯恶煞"
 trait_kitsune_abomination: "狐妖恶煞"
 trait_ratkin_abomination: "鼠族恶煞"
 trait_ananasi_abomination: "阿南西恶煞"
 trait_nagah_abomination: "娜迦恶煞"
 trait_nuwisha_abomination: "努维狭恶煞"
 trait_apis_abomination: "阿皮斯恶煞"
 trait_camazotz_abomination: "卡玛佐兹恶煞"
 trait_grondr_abomination: "格隆迪尔恶煞"
 trait_entomos: "虫族"
 trait_entomos_desc: "虫族是由织者间接创造的一类化形者，包括阿南西、昆虫一族和刻托。他们都是织者的子孙，对织者的信仰、科学和教条有着与生俱来的向往。"
 trait_track_entomos: "声望"
 trait_track_entomos_desc: "#bold 等级2：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级3：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +75%#!\n#italic 声望级别是虫族社会的核心，按照经验和技能组织结构，指导自己的社会。#!"
 trait_faction: "派系"
 trait_aspect: "倾向"
 trait_entomos_breed: "血种"
 trait_clade: "分支"
 trait_myrmidon: "密尔米顿"
 trait_myrmidon_desc: "虫族的士兵、侦察兵、将军和间谍，密尔米顿是虫族中以战斗为导向的派别。"
 trait_viskr: "维斯克"
 trait_viskr_desc: "虫族的贤者、审判者、神秘主义者和通灵者，维斯克是虫族的统治者和专家派别。"
 trait_wyrsta: "维尔斯塔"
 trait_wyrsta_desc: "虫族的阴谋家、哲学家、持不同政见者和塑造者，维尔斯塔是虫族内部变革的催化剂。"
 trait_succor: "苏科尔"
 trait_succor_desc: "疗愈者、治疗师、顾问和虫族的顾问，苏科尔是一个由同理心和理解定义的珍贵派别。"
 trait_tenere: "泰内雷"
 trait_tenere_desc: "织者阵营的阿南西，泰内雷拥有的力量和能力主要围绕记忆、时间和操纵险棘。"
 trait_kumoti: "库莫提"
 trait_kumoti_desc: "奇原阵营的阿南西，库莫提拥有再生和专精于元素的灵赋，能够像驾驭能量的流动。"
 trait_hatar: "哈塔尔"
 trait_hatar_desc: "妖蛆阵营的阿南西，哈塔尔是臭名昭著的诱惑者和熵的使用者，他们将血液转化为毒药，并从内部攻击妖蛆。"
 trait_human_born: "人子"
 trait_human_born_desc: "人类所生的虫族，人子虫族使灵类迷惑，并且是相较其他化形者是最有能力的。人子虫族是最不常见的一种虫族，因为它们经历原始觉醒所需的时间相对较长。"
 trait_macro_born: "䖵子"
 trait_macro_born_desc: "虫族分支中较大的一种，䖵子是同类中强大的泰坦，利用原始且极具破坏性的方式获得荣誉，以此夸耀自身庞大的形态。"
 trait_micro_born: "豸子"
 trait_micro_born_desc: "虫族分支中较小的一种，豸子是飘渺而灵活的渗透者，掌握了这种演化，不仅可以出现在任何地方，也可以逃离任何情况。"
 trait_shifter_born: "忌子"
 trait_shifter_born_desc: "在虫族于智慧生物体内注入的卵所孵化的虫族，忌子天生为战争形态，同时也是虫窝里最好的调解员。"
 trait_titan_born: "泰坦巨子"
 trait_titan_born_desc: "虫族分支中最可怕的一种，可怕的泰坦巨子是安娜纳莎的怪物，向所有非虫族传播妄悸的可怕的灭绝引擎。"
 trait_ananasi: "阿南西"
 trait_ananasi_desc: "安娜纳莎的子嗣，创造为虫族的秘密警察和历史学家，横跨世界的阿南西是一个分裂的种族，形象源自整个星球的不同蜘蛛。"
 trait_eshieho: "伊希埃霍"
 trait_eshieho_desc: "刻托的长子，伊希埃霍是她的建筑大师和中介者，作为小龙虾形态的刻托族的舒适中间地带。"
 trait_mishaho: "米沙霍"
 trait_mishaho_desc: "刻托的次子，米沙霍是她的大使和劳动者，采取螃蟹的多功能形态以确保刻托的繁荣。"
 trait_bahaesh: "巴哈什"
 trait_bahaesh_desc: "刻托的幼子，龙虾巴哈什是她的最坚韧的斗士和不可动摇的守护者，精通使用他们巨大的爪子来粉碎刻托的敌人。"
 trait_ishihambi: "伊希汉比"
 trait_ishihambi_desc: "虫族中天生的的领主，伊希汉比是一个极为罕见的族群，他们向更广阔的世界伪装了自己的死亡，以便专注于他们对卡·卢恩和齐格拉格尔的无尽战争。为了帮助他们对[umbra|E]的无尽探索，他们采取了高贵的飞蛾形态。"
 trait_iqhawe: "伊卡维"
 trait_iqhawe_desc: "虫族天生的斗士，伊卡维是他们的铠甲骑士，精通一系列灵赋，以对抗任何威胁织者的存在。正如适合她的剑术大师一样，织者的斗士们以螳螂作为他们的族群形态。"
 trait_umakhi: "乌玛希"
 trait_umakhi_desc: "虫族天生的建造者，乌玛希是古代暗影帝国最伟大工程的建筑师，为织者建立了持久的纪念碑。为了帮助完成这项职责，他们化身为白蚁来构建他们的遗产。"
 trait_umlimi: "乌姆利米"
 trait_umlimi_desc: "虫族天生的袭击者，乌姆利米是反对他们的人的灾祸，以他们掌握的群体形态攻击并吞噬他们面前的一切。自然而然地，作为饥荒的使者，他们将蝗虫和其他蚱蜢视为亲属。"
 trait_umbulali: "翁布拉利"
 trait_umbulali_desc: "虫族天生的屠夫，翁布拉利是虫族中令人畏惧且充满愤怒的刺客，他们化身为黄蜂，以更好地匹配他们在摧毁织者之敌时冷静的狂怒。"
 trait_umhloli: "乌姆霍利"
 trait_umhloli_desc: "虫族中天生的士兵，乌姆霍利是无数且适应性强的，像他们的蚂蚁亲族一样多样化，以支持他们在丰富和保护织者方面的同胞。"
 trait_injiki: "因吉齐"
 trait_injiki_desc: "虫族中天生的农夫，因吉齐在虫族中因其丰富而珍贵的蜂蜜而闻名，掌管他们的蜜蜂亲属，形成滋养的蜂蜜，以支持和哺育虫族帝国。"
 trait_kstyw: "克斯特乌"
 trait_kstyw_desc: "最年轻的虫族，也是很久以前被流放并从记录中抹去的种族，克斯特乌是顽强内向且坚韧的甲虫虫族，通过团结和耐力在威胁他们的敌人面前茁壮成长。"
 trait_eshieho_abomination: "伊希埃霍恶煞"
