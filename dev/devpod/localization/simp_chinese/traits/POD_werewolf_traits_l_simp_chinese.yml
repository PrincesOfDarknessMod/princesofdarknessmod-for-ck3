l_simp_chinese:
 trait_homid_born:0 "人子"
 trait_homid_born_desc:0 "人子是化形者血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_metis:0 "忌子"
 trait_metis_desc:0 "忌子是稀有的化形者血种之一。他们是两位为了爱或欲望而打破律令的化形者的后代。他们以半兽形形态出生，因此半兽形也是他们的自然形态——此外，他们是畸形的，不育的。"
 trait_lupus_born:0 "狼子"
 trait_lupus_born_desc:0 "狼子是狼族血种之一，作为狼出生并由狼抚养，因此狼形也是他们的自然形态。"
 trait_ahroun:0 "满月"
 trait_ahroun_desc:0 "狼族生而有之的五大月兆之一。满月狼是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_galliard:0 "凸月"
 trait_galliard_desc:0 "狼族生而有之的五大月兆之一。凸月狼唱诉狼族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_philodox:0 "半月"
 trait_philodox_desc:0 "狼族生而有之的五大月兆之一。半月意味着平衡和二元性，在其影响下出生的狼族经常充当其战群的顾问、调解人和守法者。"
 trait_theurge:0 "眉月"
 trait_theurge_desc:0 "狼族生而有之的五大月兆之一。眉月赋予了洞察力天赋。眉月狼是狼族的神秘主义者，比任何人都更接近影界和它的居民。"
 trait_ragabash:0 "新月"
 trait_ragabash_desc:0 "狼族生而有之的五大月兆之一。在新月期间出生的狼人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_gnosis:0 "灵知"
 trait_gnosis_desc:0 "灵知是一种灵性的、魔法的能量。一些有天赋的凡人可以获得它。灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_gnosis_kinfolk:0 "兽嫡灵知"
 trait_gnosis_kinfolk_desc:0 "灵知是一种灵性的、魔法的能量。一些有天赋的兽嫡可以获得它。灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_abomination:0 "恶煞"
 trait_abomination_desc:0 "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的害怕。他们非常强大，大多数很快就会被陷入疯狂，变得兽性大发，甚至无法表现得像人类。"
 trait_feline_born:0 "猫子"
 trait_feline_born_desc:0 "猫子是芭丝特血种之一，作为大猫出生并由大猫抚养，因此猫形也是他们的自然形态。"
 trait_hyaena_born:0 "鬣子"
 trait_hyaena_born_desc:0 "鬣子是阿迦巴血种之一，作为鬣狗出生并由鬣狗抚养，因此鬣形也是他们的自然形态。"
 trait_pryio_twilight:0 "暮光"
 trait_pryio_twilight_desc:0 "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暮光芭丝特是提问者和追查者，他们倾向于成为侦探、律师、间谍或神秘主义者。"
 trait_pryio_daylight:0 "日光"
 trait_pryio_daylight_desc:0 "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。日光芭丝特是开放和直接的，他们倾向于成为外交官、战士、执法者和保护者。"
 trait_pryio_night:0 "暗夜"
 trait_pryio_night_desc:0 "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暗夜芭丝特通常是孤僻和隐蔽的，他们往往是刺客、学者、科学家和黑暗魔法的实践者。"
 trait_breed:0 "血种"
 trait_auspice:0 "月兆"
 trait_pryio:0 "月宠"
 trait_corvid_born:0 "鸦子"
 trait_corvid_born_desc:0 "鸦子是科拉克斯血种之一，作为渡鸦出生并由渡鸦抚养，因此鸦形也是他们的自然形态。"
 trait_ursine_born:0 "熊子"
 trait_ursine_born_desc:0 "熊子是古拉赫勒血种之一，作为熊出生并由熊抚养，因此熊形也是他们的自然形态。"
 trait_roko_born:0 "狐子"
 trait_roko_born_desc:0 "狐子是狐妖血种之一，作为狐狸出生并由狐狸抚养，因此狐形也是他们的自然形态。"
 trait_suchid_born:0 "龙子"
 trait_suchid_born_desc:0 "龙子是莫科莱血种之一，作为爬行动物出生并由爬行动物抚养，因此龙形也是他们的自然形态。"
 trait_vasuki_born:0 "蛇子"
 trait_vasuki_born_desc:0 "蛇子是娜迦血种之一，作为蛇出生并由蛇抚养，因此蛇形也是他们的自然形态。"
 trait_latrani_born:0 "郊狼子"
 trait_latrani_born_desc:0 "郊狼子是努维狭血种之一，作为郊狼出生并由郊狼抚养，因此郊狼形也是他们的自然形态。"
 trait_rodens_born:0 "鼠子"
 trait_rodens_born_desc:0 "鼠子是鼠族血种之一，作为鼠出生并由鼠抚养，因此鼠形也是他们的自然形态。"
 trait_squamus_born:0 "鲨子"
 trait_squamus_born_desc:0 "鲨子是罗基阿血种之一，作为鲨鱼出生并由鲨鱼抚养，因此鲨鱼形也是他们的自然形态。"
 trait_bos_born:0 "牛子"
 trait_bos_born_desc:0 "牛子是阿皮斯血种之一，作为牛出生并由牛抚养，因此牛形也是他们的自然形态。"
 trait_chiroptera_born:0 "蝙蝠子"
 trait_chiroptera_born_desc:0 "蝙蝠子是卡玛佐兹血种之一，作为蝙蝠出生并由蝙蝠抚养，因此蝙蝠形也是他们的自然形态。"
 trait_scrofa_born:0 "猪子"
 trait_scrofa_born_desc:0 "猪子是格隆迪尔血种之一，作为野猪出生并由野猪抚养，因此野猪形也是他们的自然形态。"
 trait_kojin:0 "荒神"
 trait_kojin_desc:0 "荒神是狐妖血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_balaram:0 "婆罗罗摩"
 trait_balaram_desc:0 "婆罗罗摩是娜迦血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_shinju:0 "神狐"
 trait_shinju_desc:0 "神狐既不畸形，也不不育。然而，在所有狐妖与狐妖的后代中，只有10%是神狐，而不是正常的人类或狐嫡。此外，如果出生的是神狐，狐妖父母中的一方可能会死亡。神狐在王廷中长大后，通常会拥有令人难以忍受的傲慢和完美主义。"
 trait_ahi:0 "阿希"
 trait_ahi_desc:0 "在非常特殊的条件下，娜迦配对会产生一个可育的、非畸形的后代，称为阿希。一个母亲一生中只能生一个阿希；所有其他与雄性娜迦的配对都会产生蛇嫡，尽管她可以选择他们的血种。他们的皮肤在暴露于恶劣的污染环境下会起水泡，因为他们是在母亲的阿南塔的纯水中长大的。"
 trait_beast_born:0 "兽子"
 trait_beast_born_desc:0 "兽子是化形者血种之一，作为动物出生并由动物抚养，因此兽形也是他们的自然形态。"
 trait_uzmati:0 "乌兹马提"
 trait_uzmati_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。满月熊是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_kojubat:0 "科居巴特"
 trait_kojubat_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。凸月熊唱诉熊族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_rishi:0 "里舍"
 trait_rishi_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。半月意味着平衡和二元性，在该阶段的熊族经常充当其战群的顾问、调解人和守法者。"
 trait_kieh:0 "基赫"
 trait_kieh_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。眉月赋予了洞察力天赋。眉月熊是狼族的神秘主义者，比任何人都更接近影界和它的居民。"
 trait_arcas:0 "阿卡斯"
 trait_arcas_desc:0 "古拉赫勒在其一生中经历的五大月兆之一。在新月阶段的熊人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_werewolf_abomination:0 "狼族恶煞"
 trait_gurahl_abomination:0 "影堕"
 trait_mokole_abomination:0 "莫科莱恶煞"
 trait_dawn:0 "黎明"
 trait_dawn_female_desc:0 "阿迦巴生而有之的两大倾向之一。类似于狼族的满月狼，黎明女性是战士。"
 trait_dawn_male_desc:0 "阿迦巴生而有之的两大倾向之一。类似于狼族的凸月狼，黎明男性是叙事者。"
 trait_dusk:0 "黄昏"
 trait_dusk_female_desc:0 "阿迦巴生而有之的两大倾向之一。类似于狼族的新月狼，黎明女性是刺客。"
 trait_dusk_male_desc:0 "阿迦巴生而有之的两大倾向之一。类似于狼族的眉月狼，黄昏男性是秘术师。"
 trait_warriors:0 "战士"
 trait_warriors_desc:0 "顾名思义，他们是战士和杀手，是战斗的第一线，就像狼族的满月狼一样。也被称为“刀锋奴隶”。"
 trait_bards:0 "吟游诗人"
 trait_bards_desc:0 "吟游诗人是鼠人社会中迷失的一面。俗称“演讲者”，他们充当种族的和平缔造者：鼠族和其他种族之间的中间人，收集传说以增加他们的集体血液记忆。在世界早期，吟游诗人是狼族族群的使者，当他们的种族被背叛时，他们是第一个死去的人。"
 trait_knife_skulkers:0 "匕首游荡者"
 trait_knife_skulkers_desc:0 "荣誉的鼠族刺客只按契约工作。他们还充当法官和调解员，就像半月狼族一样。"
 trait_shadow_seers:0 "暗影先知"
 trait_shadow_seers_desc:0 "萨满和精神导师，与眉月狼很相似。"
 trait_tunnel_runners:0 "隧道行者"
 trait_tunnel_runners_desc:0 "游荡的侦察兵和间谍，他们将世界各地的鼠族洞窟连接起来。与新月狼相似。"
 trait_path:0 "道途"
 trait_eji:0 "卫士"
 trait_eji_desc:0 "战士之道，熔岩系，掌控土和火。"
 trait_doshi:0 "道士"
 trait_doshi_desc:0 "术士之道，雷电系，掌控气和火。"
 trait_gukutsushi:0 "仙术士"
 trait_gukutsushi_desc:0 "幻术使之道，雾系，掌控水与气。"
 trait_kataribe:0 "语部"
 trait_kataribe_desc:0 "说书人之道，黏土系，掌控土和水。"
 trait_sun_auspice:0 "日兆"
 trait_striking:0 "旭日"
 trait_striking_desc:0 "这些被称为“突击者”的莫科莱是对抗妖蛆和黑暗势力（如血族）的战士。"
 trait_unshading:0 "午日"
 trait_unshading_desc:0 "这些出生在太阳处于最高点时的莫科莱被称为“无影者”，是龙族的法官和守法者。"
 trait_warding:0 "夕日"
 trait_warding_desc:0 "这些于黄昏时出生的莫科莱被称为“守卫”，他们经常在对莫科莱具有重要意义的地方站岗。"
 trait_concealing:0 "掩日"
 trait_concealing_desc:0 "这些出生于阴云密布的天空下的莫科莱被称为“隐匿者”，他们是狡猾的萨满。"
 trait_shining:0 "夜日"
 trait_shining_desc:0 "这些出生在晚上的莫科莱被称为“闪耀者”，是类似于新月狼族的诡计者。"
 trait_gathering:0 "幻日"
 trait_gathering_desc:0 "这些莫科莱被称为“聚集者”，是负责指挥据点和维持族人组织的领导者，他们在日晕或“幻日”下孵化或出生。"
 trait_crowning:0 "日蚀"
 trait_crowning_desc:0 "这些非常罕见的莫科莱被称为“加冕者”，是部族无可争议的领袖。他们在日食期间出生，被族员视为皇室成员。因为如此，许多莫科莱母亲通常会尝试在日食期间生下自己的孩子。"
 trait_seasonal_auspice:0 "季兆"
 trait_kamakshi:0 "卡玛克什"
 trait_kamakshi_desc:0 "春——被生命和万物复苏的力量所眷顾，对应的元素是地。"
 trait_kartikeya:0 "迦絺吉夜"
 trait_kartikeya_desc:0 "夏——充满活力和真情实感，他们的元气促进了蛇人最大的激情。对应的元素是火。"
 trait_kamsa:0 "卡姆萨"
 trait_kamsa_desc:0 "秋——思想是他们的激情的目标所在，也是他们的强项。对应的元素是风。"
 trait_kali:0 "迦梨"
 trait_kali_desc:0 "冬——他们的血液是最酷的，他们的眼光是最真实的，他们对功业的奉献是无止境的。对应的元素是水。"
 trait_freak:0 "畸变"
 trait_engineers:0 "工程师"
 trait_engineers_desc:0 "科学家、发明家和工匠，他们喜欢与科技打交道。"
 trait_munchmausen:0 "孟乔森"
 trait_munchmausen_desc:0 "獐头鼠目的鼠族、每个都妄自尊大。"
 trait_plague_lords:0 "瘟疫领主"
 trait_plague_lords_desc:0 "疾病和腐败的主宰。"
 trait_twitchers:0 "扭曲者"
 trait_twitchers_desc:0 "无政府主义者中的无政府主义者，扭曲者是疯狂而不可预测的爆破手。"
 trait_water_auspice:0 "海兆"
 trait_brightwater:0 "澈水"
 trait_brightwater_desc:0 "在光天白日或满月时出生的罗基阿。澈水鲨与狼族的满月狼相似，都是战士和英雄。不过，他们常常渴望靠近海面。"
 trait_dimwater:0 "幽水"
 trait_dimwater_desc:0 "幽水鲨出生在阴天或除满月和新月外的月相的夜晚。大多数罗基阿都属于这种情况。他们是罗基阿族的法官和领导者，并创造了罗基阿族使用的少数灵具。"
 trait_darkwater:0 "暗水"
 trait_darkwater_desc:0 "暗水鲨被同伴称为“疯狂者”，他们在日食或新月时出生。他们好奇、创新、聪明、大胆。他们喜欢潜入寒冷的深海或在陆地上行走，以揭开新的秘密。"
 trait_lunisolar_auspice:0 "日月兆"
 trait_lunar:0 "月光"
 trait_lunar_desc:0 "这些阿皮斯在夜间出生，充当战士血种，保护他们的据点不受外界威胁。"
 trait_twilight:0 "暮光"
 trait_twilight_desc:0 "这些阿皮斯出生在日出或日落时分，是最接近灵界的生物。"
 trait_solar:0 "日光"
 trait_solar_desc:0 "这些阿皮斯生于白天，与人类和其他种群的关系最为密切。"
 trait_ajaba_abomination:0 "阿迦巴恶煞"
 trait_bastet_abomination:0 "芭丝特恶煞"
 trait_rokea_abomination:0 "罗基阿恶煞"
 trait_corax_abomination:0 "科拉克斯恶煞"
 trait_kitsune_abomination:0 "狐妖恶煞"
 trait_ratkin_abomination:0 "鼠族恶煞"
 trait_ananasi_abomination:0 "阿南西恶煞"
 trait_nagah_abomination:0 "娜迦恶煞"
 trait_nuwisha_abomination:0 "努维狭恶煞"
 trait_apis_abomination:0 "阿皮斯恶煞"
 trait_camazotz_abomination:0 "卡玛佐兹恶煞"
 trait_grondr_abomination:0 "格隆迪尔恶煞"
 trait_entomos:0 "虫族"
 trait_entomos_desc:0 "虫族是由织者间接创造的一类化形者，包括阿南西、昆虫一族和凯。他们都是织者的子孙，对织者的信仰、科学和教条有着与生俱来的向往。"
 trait_track_entomos:0 "声望"
 trait_track_entomos_desc:0 "#bold Level 2:#! Monthly Umbra Exploration Progress: [grace_i]#P +25%#!\n#bold Level 3:#! Monthly Umbra Exploration Progress: [grace_i]#P +25%#!\n#bold Level 4:#! Monthly Umbra Exploration Progress: [grace_i]#P +50%#!\n#bold Level 5:#! Monthly Umbra Exploration Progress: [grace_i]#P +50%#!\n#bold Level 6:#! Monthly Umbra Exploration Progress: [grace_i]#P +75%#!\n#italic Rank is a core way that the Éntomos organize themselves, structuring themselves within structures of experience and skill to direct their society.#!"
 trait_faction:0 "Faction"
 trait_aspect:0 "Aspect"
 trait_entomos_breed:0 "Breed"
 trait_clade:0 "Clade"
 trait_myrmidon:0 "Myrmidon"
 trait_myrmidon_desc:0 "The Soldiers, Scouts, Generals, and Spies of the Éntomos, Myrmidons are the combat oriented Faction of Éntomos."
 trait_viskr:0 "Viskr"
 trait_viskr_desc:0 "The Sages, Judges, Occultists, and Psychics of the Éntomos, Viskr are the rulers and specialist Faction of Éntomos."
 trait_wyrsta:0 "Wyrsta"
 trait_wyrsta_desc:0 "The Tricksters, Philosophers, Dissidents, and Shapers of the Éntomos, the Wyrsta are the catalysts of change within the Éntomos."
 trait_succor:0 "Succor"
 trait_succor_desc:0 "The Healers, Therapists, Counselors, and Advisors of the Éntomos, the Succor are a precious Faction defined by empathy and understanding."
 trait_tenere:0 "Tenere"
 trait_tenere_desc:0 "The Weaver Aligned Ananasi, Tenere have powers and abilities focused around memory, time, and the Gauntlet."
 trait_kumoti:0 "Kumoti"
 trait_kumoti_desc:0 "The Wyld Aligned Ananasi, Kumoti have regenerative and elemental focused gifts, able to wield the flux as Gifts."
 trait_hatar:0 "Hatar"
 trait_hatar_desc:0 "The Wyrm Aligned Ananasi, Hatar are infamous seducers and wielders of entropy, formenting their blood into poison and striking at the Wyrm from within."
 trait_human_born:0 "Homid"
 trait_human_born_desc:0 "Éntomos born to Humans, Homid Éntomos disorient Spirits and are the most competent shape shifters among them. Homid Éntomos are the least common kind of Éntomos, due to the comparatively long time it takes for them to undergo the First Change."
 trait_macro_born:0 "Macroborn"
 trait_macro_born_desc:0 "Éntomos born to larger organisms within their Clades, the Macroborn are powerful titans of their kind, emphasizing their larger forms in raw destructive glory."
 trait_micro_born:0 "Microborn"
 trait_micro_born_desc:0 "Éntomos born to smaller organisms within their Clades, the Microborn are evasive and nimble infiltrators, mastering their smaller forms to both be anywhere and escape any situation."
 trait_shifter_born:0 "Manipulator"
 trait_shifter_born_desc:0 "Éntomos born between Éntomos in eggs incubated in an intelligent creature, Manipulators are natural masters of the War Form, while also being the best mediators between their Colonies."
 trait_titan_born:0 "Titanborn"
 trait_titan_born_desc:0 "The most feared Breed, the horrifying Titanborn are Ananasa's Monsters, terrifying engines of extinction that invokes the Delirium in all non-Éntomos."
 trait_ananasi:0 "Ananasi"
 trait_ananasi_desc:0 "The Children of Ananasa and the intended Secret Police and Historians of the Éntomos, the Ananasi are a divided species across the planet, taking the cosmopolitan spider across the whole planet."
 trait_eshieho:0 "Eshieho"
 trait_eshieho_desc:0 "The Eldest Children of C'et, the Eshieho are her Masters of Construction and Intermediaries, the comfortable middle ground between the C'etites in the shape of the Crayfish."
 trait_mishaho:0 "Mishaho"
 trait_mishaho_desc:0 "The Middle Children of C'et, the Mishaho are her Ambassadors and Laborers, taking the versatile form of the Crab to see to C'et's prosperity."
 trait_bahaesh:0 "Bahaesh"
 trait_bahaesh_desc:0 "The Younger Children of C'et, the Lobster Bahaesh are her durable Champions and Implacable Defenders, mastering their massive claws to crush the foes of C'et."
 trait_ishihambi:0 "Ishihambi"
 trait_ishihambi_desc:0 "The Chosen Lords of the Insect Races, the Ishihambi are a very rare Clade, having faked their deaths to the wider world to focus on their unending war against the Ka Luon and Zigg'raugglur. To aid their endless exploration of the Umbra, they take the form of the noble Moth."
 trait_iqhawe:0 "Iqhawe"
 trait_iqhawe_desc:0 "The Chosen Champions of the Insect Races, the Iqhawe are their knights in shining armor, mastering an array of Gifts to stand tall against anything that would threaten the Weaver. As is fitting of her Blademasters, the Weaver's champions take the Mantis as their Clade Form."
 trait_umakhi:0 "Umakhi"
 trait_umakhi_desc:0 "The Chosen Builders of the Insect Races, the Umakhi are the architects of the greatest works of the Shadow Empire of the ancient past, establishing enduring monuments to the Weaver's glory. To aid in this duty, they take the form of the Termite to construct their legacies."
 trait_umlimi:0 "Umlimi"
 trait_umlimi_desc:0 "The Chosen Raiders of the Insect Races, the Umlimi are scourges of that which oppose them, striking in their mastered swarm form and devouring all before them. Naturally, as harbingers of famine, they take Locusts and other Grasshoppers as kin."
 trait_umbulali:0 "Umbulali"
 trait_umbulali_desc:0 "The Chosen Slayers of the Insect Races, the Umbulali are the fearsome and wrath consumed assassins of the Insect Races, taking the shape of the Wasp to better match their cold fury in destroying the enemies of the Weaver."
 trait_umhloli:0 "Umhloli"
 trait_umhloli_desc:0 "The Chosen Soldiers of the Insect Races, the Umhloli are innumerable and adaptive, as diverse as their Ant kin to support their cousins in the enrichment and protection of the Weaver."
 trait_injiki:0 "Injiki"
 trait_injiki_desc:0 "The Chosen Agriculturists of the Insect Races, the Injiki are renowned among the Éntomos for their rich and precious honey, mastering their Bee kin to form a nourishing honey to support and feed Éntomos Empires."
 trait_kstyw:0 "Kstyw"
 trait_kstyw_desc:0 "The youngest Insect Race and the ones exiled long ago and stripped from records, the Kstyw are the fiercely inward and enduring Beetle Éntomos, thriving through camaraderie and endurance against the threats that assail them."