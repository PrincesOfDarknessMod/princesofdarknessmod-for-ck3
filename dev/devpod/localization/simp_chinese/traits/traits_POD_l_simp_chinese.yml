 trait_hakken: "八犬"
 trait_hakken_desc: "日本的狼人，崇尚武士道哲学。"
 trait_kumo: "蜘蛛精"
 trait_kumo_desc: "堕落为妖蛆走狗的蜘蛛人。"
 trait_tengu: "天狗"
 trait_tengu_desc: "远东的渡鸦人，他们是兽庭的侦察兵和传令官。"
 trait_okuma: "大熊"
 trait_okuma_desc: "大熊是生活在东南亚（包括印度北部和日本东部）的古拉赫勒部族。他们的动物亲缘包括太阳熊、月亮熊和大熊猫。与其他崇拜盖亚为母亲的古拉赫勒部族，露娜女神是他们变形能力的源泉，大熊还与赫利俄斯有着特殊的关系。每位大熊的皮毛上都有鲜艳的斑纹。"
 trait_zhong_lung: "中龙"
 trait_zhong_lung_desc: "龙人是莫科莱的远亲，他们认为自己是玄龙和朱凰的伟大后裔。"
 trait_nezumi: "鼠妖"
 trait_nezumi_desc: "亚洲的鼠人，其等正在发动一场对抗人类的低劣战争。"
 trait_same_bito: "鲛人"
 trait_same_bito_desc: "鲨鱼人，其等认为自己比罗基阿高雅得多。"
 trait_ozuzo: "奥祖佐"
 trait_ozuzo_desc: "奥祖佐是堕落为妖蛆走狗的阿迦巴。"
 trait_histpah: "希斯塔帕"
 trait_histpah_desc: "希斯塔帕是撒谎大王，受妖蛆腐化的芭丝特。"
 trait_buzzards: "巴泽兹"
 trait_buzzards_desc: "巴泽兹是迷失之子，是被妖蛆污染的科拉克斯。"
 trait_purgers: "普格斯"
 trait_purgers_desc: "普格斯是堕落古拉赫勒。"
 trait_mnetics: "麦克尼茨"
 trait_mnetics_desc: "麦克尼茨是吞秘者，堕落莫科莱。"
 trait_nokhomi: "诺克霍米"
 trait_nokhomi_desc: "诺克霍米也被称为苦咧，是堕落努维沙。"
 trait_mad_destroyers: "疯狂毁灭者"
 trait_mad_destroyers_desc: "疯狂毁灭者是堕落鼠族。"
 trait_balefire_sharks: "恶火鲨"
 trait_balefire_sharks_desc: "恶火鲨是受妖蛆污染的罗基阿。"
 trait_xibalan: "西巴兰"
 trait_xibalan_desc: "西巴兰是通过守护神蝙蝠受污染的一面而忠于妖蛆的卡玛佐兹。"
 trait_skull_pig: "骸猪"
 trait_skull_pig_desc: "骸猪是一种与妖蛆相关的生物，是由格隆迪尔一族为了在魂怒之战中幸存下来而投靠妖蛆后随之诞生的。"
 trait_dragon_sleep: "龙眠"
 trait_dragon_sleep_desc: "莫科莱进入夏眠状态。莫科莱在休眠时不会变老，但她可能会做梦。"
 trait_anda: "安答"
 trait_anda_desc: "安答是冈格罗的蒙古间的血系。他们自己认为自己是蒙古宗教中大地女神埃图根的后裔。"
