 THEY_HAVE_TRAIT_WITH_IS_SPIRIT_FLAG_TRIGGER: "[CHARACTER.GetShortUIName|V]是灵体，无法被监禁、折磨、处决或在[single_combat_duel|E]中通过物理招式伤害"
 NOT_THEY_HAVE_TRAIT_WITH_IS_SPIRIT_FLAG_TRIGGER: "[CHARACTER.GetShortUIName|V]#bold 不#!灵体，能被监禁，处决或在[single_combat_duel|E]中通过物理招式伤害"
 trait_gaunt: "枯骨"
 trait_gaunt_desc: "已经解开了一个或多个它的[Fetters|E]的年长而强大的死灵。"
 trait_domem: "残魂"
 trait_domem_desc: "残魂是指[Fetters|E]全部被毁的死灵，他们无法在[shadowlands|E]逗留——虽然残魂一般意味着年长，但死灵可以在非常年轻的时候成为残魂，所需要的只是他们的[Fetters|E]被毁。"
 trait_enfant: "鬼婴"
 trait_enfant_desc: "鬼婴是指刚刚被死出来到[underworld|E]的死灵。"
 trait_track_fetter: "羁绊"
 trait_track_fetter_desc: "$game_concept_Fetter_desc$"
 trait_track_fetter_resolved: "已解羁绊"
 trait_track_fetter_resolved_desc: "[Fetters|E]也可以被解开，这意味着死灵获得了与生前所爱的事物和人告别的力量。一位成功解开了所有[Fetters|E]的死灵可以无限期地留在[shadowlands|E]，但这种成功是非常罕见的，甚至可以说是神话中的。"
 trait_track_spectre: "种姓"
 trait_track_spectre_desc: "怨灵有明确的阶级划分。死妖和游魂是怨灵种姓中最低级的，因为他们直接从[skinlands|E]进入[oblivion|E]，最不容易受到[oblivion|E]辐射的影响。二重身位居其次，他们经受住了真灵的考验，并通过对[oblivion|E]的奉献取得了胜利；不过，此时他们的身体上并没有[oblivion|E]的印记。渊影和幻影的地位更高，因为在他们身上已经开始显现出[oblivion|E]的痕迹。其次是亡骸，因为他们长期暴露在[oblivion|E]的环境中，打磨已经无法再掩盖他们的本性。曾诞者和百臂巨人是曾经是人类的怨灵所能达到的最高阶级；虽然他们献身于[oblivion|E]的功业，但他们仍然曾经活过。在这个系统的最顶端是未诞者，他们在过去的岁月里从[oblivion|E]中爬了出来。稚灵的独特之处在于他们存在于种姓系统之外，几乎服务于[oblivion|E]的所有阶级。"
 trait_stripling: "稚灵"
 trait_stripling_desc: "稚灵也被称为未生者，是怨灵的一种，他们在孩提时代进入[shadowlands|E]，最终被自己的黯影所取代。与其他怨灵一样，稚灵也属于怨灵种姓之一，这取决于他们与[oblivion|E]的亲近程度，但由于他们认为已建立的怨灵社会并不吸引人，因此他们组建了自己的独立团体。"
 trait_neverborn: "未诞者"
 trait_neverborn_desc: "未诞者是对沉睡在[labyrinth|E]深处的古代巨孽的称呼。他们也被称为原初者、永不死和怪诞。"
 trait_hekatonkhire: "百臂巨人"
 trait_hekatonkhire_desc: "百臂巨人是一种古老的怨灵，主要被巨孽用作坦克和撞锤，与敌方怨灵作战。他们被认为是被[oblivion|E]之力迷失了心智的曾诞者，变成了能同时攻击多个对手的巨大畸形野兽。"
 trait_onceborn: "曾诞者"
 trait_onceborn_desc: "曾诞者是对曾是人类的巨孽的称呼。他们也被称为曾生者、计谋者和阴谋者。"
 trait_nephwrack: "亡骸"
 trait_nephwrack_desc: "亡骸已经存在了很久，它们不断暴露在[oblivion|E]的环境中，导致它们失去人体形态，变得扭曲变形。许多亡骸为巨孽主人服务，成为他们的显性代理人。"
 trait_shade: "渊影"
 trait_shade_desc: "在最强大的怨灵中，渊影是曾经被扔进[tempest|E]、卷入死涡或大死涡、或在畏途中迷失自我的死灵。他们脆弱的心理被[oblivion|E]彻底摧毁，只留下充满仇恨和黑暗炽情的阴影，并被永久控制。他们的死诞方式让他们有了一个绰号，叫做[oblivion|E]之子。"
 trait_apparition: "幻影"
 trait_apparition_desc: "幻影是怨灵的中层管理者——开始向亡骸进化的二重身和死妖。因此，在[oblivion|E]引发的变异之后，很难再看到他们曾经的样子。鉴于他们早已不再是人，[Corpus|E]只反映了自我。"
 trait_doppelganger: "二重身"
 trait_doppelganger_desc: "二重身也被称为影食者，除了更苍白、更瘦弱之外，他们的外表与普通的死灵非常相似。他们身上经常有死亡印记，不过使用 打磨可以掩盖这些印记。最明显的特征是他们的眼睛里总是能看到黯影。"
 trait_mortwight: "死妖"
 trait_mortwight_desc: "死妖是那些死于极度暴力的人的灵魂。他们对死亡的愤怒和怨恨使他们在[shadowlands|E]觉醒成为怨灵，永远不会以幽灵的身份存在。许多死妖一开始就具有黑暗的本性，有些人认为他们从一开始就注定要成为怨灵。"
 trait_haint: "游魂"
 trait_haint_desc: "游魂进入[shadowlands|E]时受黯影所控，这一点与死妖非常相似。与死妖不同，游魂不是由他们的死法所定义，而是他们的活法。在他们死前，当他们还在生者中时，就已经沦落到几乎非人的生活方式。"
 trait_track_beatific: "神迹"
 trait_track_beatific_desc: "#bold 等级1：#!使$POD_demon_unearthbound_decision$[decision|E]免费。作为[character_interaction|E]，允许你放逐目标死灵角色到[dark_kingdom|E]。作为[character_interaction|E]，允许你放逐目标恶魔角色到[abyss|E]。解锁[GetBuilding('sanctified_area_01').GetName]建筑。\n#bold 等级2：#!作为强化选项，允许你祝福宝物。免疫谋杀。免疫妄悸。免疫[GetTrait('wraith').GetName( GetNullCharacter )]附身。\n#bold 等级3：#!目标永远接受信仰皈依要求。\n#bold 等级4：#!作为[character_interaction|E]，允许你解决死灵的所有[Fetter|E]。作为[character_interaction|E]，允许你杀死具有低虔诚的超自然。你不再需要牵制来放逐灵体。\n#bold 等级5：#!作为[character_interaction|E]，允许你使吸血鬼变回凡人或达成浩恩永生。允许招募[GetMaA('minion_of_the_divine').GetName]作为[men_at_arms|E]。允许你动用意志力免收伤害。允许你不死于受伤。\n#italic 信徒手中最强大的工具就是真正神迹的力量。整个宗教都诞生于这种真信的展示。#!"
 trait_automaton: "自动人形"
 trait_automaton_desc: "人工躯体。"
 trait_fallen: "堕天者"
 trait_fallen_desc: "他们是堕落天使，在创世之初选择站在路西法和人类一边，而不是上帝一边。为了惩罚他们的叛逆和不忠，大天使米迦勒将这些天使赶出了天堂，扔进了深渊。深渊之墙裂开了，堕天者开始逃回物质世界。"
 trait_servitor: "从者"
 trait_servitor_desc: "地缚魔可以为自己制造一个移动容器，在特制的物品中注入自己的污染，把它变成一个强大、持久的宿体。"
 trait_manifestation: "显象"
 trait_manifestation_desc: "对人类形态的丑陋模仿。例如，从血泊中凝结出的面孔、蝗虫制成的手臂或蛆虫形成的舌头。这些形体物理独立于显灵者，不具备精细的运动控制能力。另一方面，被制造出来的形体与制造它们的显灵者一样强大，并能对简单的命令做出反应，如甩动、撕咬、痉挛等。"
 trait_golem: "魔像"
 trait_golem_desc: "魔像是用术法制造的大型自动人形，因不稳定和容易发狂而臭名昭著。"
 trait_track_dharma_desc: "[SelectLocalization( IsInGame, 'trait_track_dharma_desc_in_game', 'trait_track_dharma_desc_in_wiki' )]"
 trait_track_dharma_desc_in_game: "你通过以下方式获得经验：\n$EFFECT_LIST_BULLET$[GetReligionByKey('boneflowers_religion').GetName]：束缚死灵，在拥有受缚死灵和/或驻扎在[yin_world|E]时被动获得经验\n$EFFECT_LIST_BULLET$[GetReligionByKey('deviltigers_religion').GetName]：杀人\n$EFFECT_LIST_BULLET$[GetReligionByKey('resplendentcranes_religion').GetName]：获得头衔，用财政总管转换文化，在拥有同文化首都时被动获得经验\n$EFFECT_LIST_BULLET$[GetReligionByKey('thousandwhispers_religion').GetName]：获得或失去关系（爱人、灵魂伴侣、朋友、至交、对手、死敌）\n$EFFECT_LIST_BULLET$[GetReligionByKey('thrashingdragons_religion').GetName]：完成拉拢/勾引/求爱计谋，发生性关系，驻扎在[yang_world|E]时被动获得经验\n$EFFECT_LIST_BULLET$[GetFaithByKey('flameoftherisingphoenix').GetName]：建造[GetTrait('kueijin').GetName( GetNullCharacter )]建筑\n$EFFECT_LIST_BULLET$[GetFaithByKey('faceofthegods').GetName]：用宫廷司祭转换信仰，通过真信大规模转换信仰，在拥有同信仰首都时被动获得经验\n$EFFECT_LIST_BULLET$[GetFaithByKey('inwardway').GetName]：冥想、移动到下一个[umbra|E]地点，或在[GetTrait('kueijin').GetName( GetNullCharacter )]生活方式树中获得技能\n$EFFECT_LIST_BULLET$[GetFaithByKey('wayofthetenthousandscreams').GetName]：建造龙穴污染，折磨囚犯，将囚犯/领地/区域献祭给恶魔，作为魔奴或唤魔者时被动获得经验"
 trait_track_dharma_desc_in_wiki: "你通过以下方式获得经验：\n$EFFECT_LIST_BULLET$骨花：束缚死灵，在拥有受缚死灵和/或驻扎在[yin_world|E]时被动获得经验\n$EFFECT_LIST_BULLET$魔虎：杀人\n$EFFECT_LIST_BULLET$华鹤：获得头衔，用财政总管转换文化，在拥有同文化首都时被动获得经验\n$EFFECT_LIST_BULLET$千呤：获得或失去关系（爱人、灵魂伴侣、朋友、至交、对手、死敌）\n$EFFECT_LIST_BULLET$腾龙：完成拉拢/勾引/求爱计谋，发生性关系，驻扎在[yang_world|E]时被动获得经验\n$EFFECT_LIST_BULLET$涅凤焱：建造[GetTrait('kueijin').GetName( GetNullCharacter )]建筑\n$EFFECT_LIST_BULLET$众佛相：用宫廷司祭转换信仰，通过真信大规模转换信仰，在拥有同信仰首都时被动获得经验\n$EFFECT_LIST_BULLET$内引众：冥想、移动到下一个[umbra|E]地点，或在[GetTrait('kueijin').GetName( GetNullCharacter )]生活方式树中获得技能\n$EFFECT_LIST_BULLET$万嚎道：建造龙穴污染，折磨囚犯，将囚犯/领地/区域献祭给恶魔，作为魔奴或唤魔者时被动获得经验"
 trait_elohim: "耶洛因"
 trait_elohim_desc: "耶洛因，又称天使，是长着翅膀的天人，他们是上帝在天国的使者和随从。"
 trait_track_werewolf: "声望"
 trait_track_werewolf_desc: "#bold 等级2：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级3：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +75%#!\n#italic 声望级别是狼族社会的基本组成部分，也是狼人阶级制度的最充分体现。#!"
 trait_track_ajaba: "声望"
 trait_track_ajaba_desc: "#bold 等级2：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级3：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +75%#!\n#italic 阿迦巴一直将狡诈和凶猛视为声望，但他们也重视恶名，许多成员担心这会造成长期影响。#!"
 trait_track_bastet: "声望"
 trait_track_bastet_desc: "#bold 等级2：#!允许在灵游时进入[spirit_wilds|E]。\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 芭丝特承认阶级制度，但其并不像狼族那样认为阶级制度代表着绝对权威，仅仅是出于对传统的认可而礼貌性地遵从。芭丝特的头衔总是具有等级之外的社会意义。#!"
 trait_track_corax: "声望"
 trait_track_corax_desc: "#bold 等级1：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级2：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级3：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +75%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +100%#!\n#italic 科拉克斯获得声望的方式如同新月狼，不过他们往往偏爱其等特有的智慧。脆弱的科拉克斯常常忽视荣耀。#!"
 trait_track_gurahl: "声望"
 trait_track_gurahl_desc: "#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 古拉赫勒承认三种声望：名誉，源自奉献和尊重；救助，源自治疗、净化或帮助他人；智慧，源自恢复、保存或发掘知识或加深对自身的了解。#!"
 trait_track_mokole: "声望"
 trait_track_mokole_desc: "#bold 等级2：#!允许在灵游时进入[spirit_wilds|E]。\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 莫科莱使用与狼族相同的声望系统，崇尚名誉、智慧和荣耀。每位莫科莱对每项信条的遵从程度完全取决于他们的倾向（日兆）。#!"
 trait_track_nagah: "声望"
 trait_track_nagah_desc: "#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 由于蛇巢是游牧的，娜迦必须寻找舍沙们，才能从他们那里获得声望。舍沙在听取了蛇巢的事迹后，会决定给予他们哪些声望。这决定了娜迦的阶级，反过来也决定了娜迦能学到的灵赋。#!"
 trait_track_nuwisha: "声望"
 trait_track_nuwisha_desc: "#bold 等级1：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级2：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级3：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +50%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +75%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +100%#!\n#italic 与大多数化兽族裔通过声望和部族的支持获得阶级不同，努维沙通过教导获得声望。他们拥有的不是名誉，而是幽默——在他们的神灵（郊狼神的化身）面前表现得越幽默，他们获得的声望就越高。#!"
 trait_track_ratkin: "声望"
 trait_track_ratkin_desc: "#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 鼠族聚居地有严格的内部阶级制度。鼠王统治着聚居地，鼠臣形成鼠群——通常都是鼠子。在鼠臣之下，鼠子享有优先权。忌子居中，充当守卫和看守，并希望有朝一日能成为鼠臣。#!"
 trait_track_rokea: "声望"
 trait_track_rokea_desc: "#bold 等级2：#!允许在灵游时进入[spirit_wilds|E]。\n#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 罗基阿接受三种形式的声望：勇气指的是鲨人在保卫石洞时的战斗力和英勇；和谐指的是鲨人接受自己在世界上的定位并按照这个位置行事的能力；创新则是授予那些通过新想法帮助族人保卫海洋并击退西里尔的造物的鲨人。#!"
 trait_track_apis: "声望"
 trait_track_apis_desc: "#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 阿皮斯是一种相对社会化的生物，它们以六到二十四只为一群生活在一起。每牛群都由一头强大的公牛统治，并捍卫自己的头衔，抵御所有挑战者。这头公牛负责保护族群，并在战斗中发挥领导作用。#!"
 trait_track_camazotz: "声望"
 trait_track_camazotz_desc: "#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 卡玛佐兹是一个高度社会化的种族，他们以平等的方式群居，成员人数在十几到一百之间。他们通常与蝙蝠嫡一起居住在洞穴中。虽然他们倾向于保密，但也试图与其他化形者保持友好和开放的关系。#!"
 trait_track_grondr: "声望"
 trait_track_grondr_desc: "#bold 等级4：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 格隆迪尔是一个活跃而好斗的种族。他们生活在名为豚群的部族中，每个群落由一个国王或女王领导。每个豚群统治者与其他所有豚群统治者都是平等的；他们没有超越豚群个体的阶级制度。#!"
 TRAIT_FLAG_DESC_bypass_mental_defenses: "无视过高精神防御"
 trait_crimson_fever: "阳疾"
 trait_crimson_fever_desc: "阳盛阴衰的中原族裔身上表现出来的一种超自然疾病。虽然这种疾病相当罕见，但据传传染性极强。它的罕见性也意味着人们从未真正探索过潜在的治疗方法，这使它成为一种可怕的疾病。"
 trait_chulorviosis: "克苏洛症"
 trait_chulorviosis_desc: "一种同时影响头足纲动物和人类的奇怪疾病。这种疾病纯粹是精神性的；对冲上岸的克苏洛夫亚的尸体进行的尸检没有发现任何相关信息。病毒会改变人类和头足纲动物，使它们变得更像对方：人类可能长出鸟嘴、斑驳的皮肤和吸盘，而章鱼可能长出发育不全的指甲或改变眼睛的颜色。\n\n人类的智慧让位于本能，而头足纲动物则变得更有知觉、更恶毒。这种转变可能需要几个月的时间，但一旦开始就几乎无法避免。大约六个月后，人类逃往海面，加入海底的同类。在达到这种状态之前，大多数克苏洛夫亚会尽可能多地感染人类。"
 trait_gift_of_melancholia: "忧郁之赠"
 trait_gift_of_melancholia_desc: "这是一种可怕的萎缩病，凡人和该隐之子都能患上它，它会导致头晕、虚弱、乏力和恶心。"
 trait_flaying_plague: "剥皮瘟疫"
 trait_flaying_plague_desc: "影响着兽嫡和狼族等的可怕瘟疫。起初，它似乎是一种奇怪的肺痨，然后出现疖子，接着皮肤从骨头上脱落，令人痛苦不堪。"
 trait_scourge: "灾疫"
 trait_scourge_desc: "灾疫是一种感染血液的吸血鬼特有瘟疫。这种疾病是麻风病与鼠疫杂交的变异品种，直接攻击吸血鬼的精血。一旦感染，受害者每次消耗精血时都必须消耗更多的血液。受害者每遭受灾疫折磨一晚，情况就会变得更糟。在某些情况下，受害者还会患上影响外观但不会危及生命的毁容性疾病。"
 trait_track_scourge: "严重度"
 trait_track_scourge_desc: "灾疫严重度。"
 trait_werewolf_kinfolk: "狼嫡"
 trait_werewolf_kinfolk_desc: "流有狼血，狼族的后裔。"
