l_simp_chinese:
 trait_unusual:0 "怪异"
 trait_unusual_desc:0 "关于这人似乎有什么不同寻常之处。"
 trait_vampire:0 "吸血鬼"
 trait_vampire_desc:0 "该角色是不死族的一员。"
 trait_diablerist:0 "吸榨者"
 trait_diablerist_desc:0 "该角色是一位[diablerist|E]，曾经吸食了其他吸血鬼的心血，吞噬其灵魂。"
 trait_infernalist:0 "崇魔者"
 trait_infernalist_desc:0 "该角色为了魔邪叙擢而与恶魔力量契约。"
 trait_ghoul:0 "血仆"
 trait_ghoul_desc:0 "吸食了吸血鬼血液的凡人，导致其需求更多的血液，并且（大多数情况下）愿意成为主人的奴仆。"
 trait_szlachta:0 "什拉赫塔"
 trait_szlachta_desc:0 "一个摄入了吸血鬼的血，然后被易变术[discipline|E]转变的凡人。"
 trait_mortal:0 "凡人"
 trait_mortal_desc:0 "一只普通的人类。可悲的短命种……"
 trait_werewolf:0 "狼人"
 trait_werewolf_desc:0 "一种能够转换形态的超自然生物。他们自称“狼族”。"
 trait_mage:0 "法师"
 trait_mage_desc:0 "觉醒了化身的人类，这允许他们使用真正的魔法并扭曲现实定律。"
 trait_wraith:0 "死灵"
 trait_wraith_desc:0 "一个被黑魔法或对他们留下的东西的依恋拖回了尘世的死去灵魂。"
 trait_wight:0 "尸妖"
 trait_wight_desc:0 "一位尸妖是一位失去了所有人性的吸血鬼。他们已经面目全非，彻底与心兽融为一体。一位堕落成尸妖的角色无法被挽回和被玩家扮演。"
 trait_assamite:0 "哈基姆圣裔"
 trait_assamite_desc:0 "他们盘踞在中东的隐蔽堡垒之中，一直以来都被西方的血族认为是危险的刺客和[diablerist|E]团体。"
 trait_assamite_laibon:0 "桑戈"
 trait_assamite_laibon_desc:0 "莱本的传承之一。作为约鲁巴风暴之神桑戈的崇拜者，桑戈也许是莱本最文明的传承，仅次于大贵族古鲁希。"
 trait_baali:0 "巴力"
 trait_baali_desc:0 "一支与恶魔崇拜相关的吸血鬼血系。"
 trait_brujah:0 "布鲁赫"
 trait_brujah_desc:0 "迅速发怒并总是充满激情，他们重新获得了崇高哲学家和活动家[Clan|E]的地位。"
 trait_brujah_laibon:0 "奥塞博"
 trait_brujah_laibon_desc:0 "莱本的传承之一。莱本的战士，奥塞博他们的名字来源于西部阿善堤著名的豹的传说。"
 trait_brujah_ashirra:0 "贝特·穆沙基"
 trait_brujah_ashirra_desc:0 "具有伊斯兰信仰的布鲁赫也称贝特·穆沙基，其中很多是迦太基血族。特别是在北非，其中的年轻者宣告了圣战，来惩罚破坏了大实验的罗马血族。"
 trait_cacophony:0 "嘈杂之女"
 trait_cacophony_desc:0 "目前，嘈杂之女主要由女性组成（由于在教育一个拥有大多数男性音域的人方面存在相关困难），她们练习的是魔音术，这一[discipline|E]允许她们通过唱歌来激发奇怪的效果。她们是最优秀的不死族合唱家，而举办她们的聚会是值得尊崇的。"
 trait_caitiff:0 "劣族"
 trait_caitiff_desc:0 "也称无氏族者，是那些不归于任何[Clan|E]的[cainites|E]。"
 trait_cappadocian:0 "卡帕多西亚"
 trait_cappadocian_desc:0 "离群索居的学者们痴迷于死亡和灵魂的奥秘。"
 trait_cappadocian_laibon:0 "姆拉·瓦图"
 trait_cappadocian_laibon_desc:0 "也许没有哪一群莱本像姆拉·瓦图一样受到冷落。尽管莱本作为一个整体已经失去了人性，但他们仍然按照许多非洲习俗的要求，对死者保持着健全的尊重。然而，姆拉·瓦图并不满足于仅仅与死去的祖先交流；他们试图在身体和灵魂上控制他们。"
 trait_cappadocian_ashirra:0 "卡比拉特·马特"
 trait_cappadocian_ashirra_desc:0 "卡帕多西亚[Clan|E]的伊斯兰分支在中东被称为卡比拉特·马特，是这些土地上最博学的血族之一。卡比拉特·马特在研究死者时必须小心谨慎，因为伊斯兰教高度重视死者；亵渎尸体可能会引起凡人和[ashirra|E]或有组织的伊斯兰血族的注意。"
 trait_gangrel:0 "冈格罗"
 trait_gangrel_desc:0 "野蛮人。原始，顽强，兽性。"
 trait_gangrel_laibon:0 "阿库南斯"
 trait_gangrel_laibon_desc:0 "莱本的传承之一。它们的名字和性质来自许多非洲民间传说中的“智慧蜘蛛”神话。他们以渊博的知识、睿智的决策和非政治性质而闻名。"
 trait_gangrel_ashirra:0 "瓦希恩"
 trait_gangrel_ashirra_desc:0 "虽然[ashirra|E]称所有的冈格罗为“瓦希恩”，但在这两个部分之间存在着一条独特的界线，类似于城市和乡村冈格罗之间的划分，尽管关系更加敌对。"
 trait_gargoyle:0 "石像鬼"
 trait_gargoyle_desc:0 "那些看起来就像活化石雕的吸血鬼。\n由睿魔尔制造，作为对抗棘秘魑的突击队，大多数石像鬼满足于为他们有魔法天赋的主人服务，但也有少数石像鬼表现出独立思想。"
 trait_giovanni:0 "乔凡尼"
 trait_giovanni_desc:0 "随着他的先祖升入血中，奥古斯都·乔凡尼立即开始[Embrace|E]出自己的家庭。在这样做的过程中，乔凡尼在卡帕多西亚[Clan|E]中变成了介于一支血系和密教之间的东西。作为[necromancy|E]的专家，乔凡尼与母[Clan|E]保持着轻微的分离。"
 trait_harbingersofskulls:0 "骸骨预告者"
 trait_harbingersofskulls_desc:0 "一支吸血鬼血系，面色苍白。此外，预告者们的皮肤收缩，使这些[cainites|E]显得骨瘦如柴，瘦骨嶙峋的四肢和脸都冻成了永生的死亡微笑。"
 trait_kiasyd:0 "吉雅希德"
 trait_kiasyd_desc:0 "一支有着妖精血的吸血鬼血系，遗传自勒森魃的斯特拉斯堡的马可纽斯。"
 trait_lasombra:0 "勒森魃"
 trait_lasombra_desc:0 "勒森魃[Clan|E]是社会达尔文主义者，掠食者，优雅而无人性。"
 trait_lasombra_laibon:0 "锡·敦杜"
 trait_lasombra_laibon_desc:0 "他们的名字来源于巴伐利语中“影子”的意思，锡·敦杜最初来自刚果，直到一个错误的仪式迫使他们离开了他们的家园。他们现在居住在非洲东部的马赛族人中间。"
 trait_lasombra_ashirra:0 "卡比拉特·卡哈耶"
 trait_lasombra_ashirra_desc:0 "这支阿拉伯的勒森魃在同况伊斯兰血族中很有名，因为他们是屈指可数的基督徒占多数的一支。伊斯兰教在[Clan|E]中只占有少数几个位置，基本集中在伊比利亚，这造成了严重的分裂。"
 trait_maeghar:0 "马伊格哈尔"
 trait_maeghar_desc:0 "诞生于当某[cainite|E]试图施加他的诅咒至某妖精血统生命时发生一系列孤立的意外。所有的马伊格哈尔都有一些身体特征表明他们的妖精本性，从细微的（雪白的皮肤和乌黑的头发）到显著的（六只手臂）。"
 trait_malkavian:0 "末卡维"
 trait_malkavian_desc:0 "被疯狂所诅咒的血族[Clan|E]。"
 trait_malkavian_ashirra:0 "巴耶特·马吉努"
 trait_malkavian_ashirra_desc:0 "[ashirra|E]末卡维族，贝特·马吉努，比西方的同族更受尊敬。许多人被当作顾问，保镖，甚至伊斯兰先知。"
 trait_nosferatu:0 "诺斯费拉图"
 trait_nosferatu_desc:0 "作祟者。隐秘、粗壮、可怕。"
 trait_nosferatu_ashirra:0 "贝特·穆塔沙尔"
 trait_nosferatu_ashirra_desc:0 "在伊斯兰教成为主导力量后，[ashirra|E]的诺斯费拉图经历了某种分裂。贝特·穆塔沙尔是那些拒绝皈依伊斯兰教或放弃他们古老的作为猎人和恶巫的身份的诺斯费拉图。"
 trait_nosferatu_laibon:0 "古鲁希"
 trait_nosferatu_laibon_desc:0 "古鲁希相信自己是非洲的主人，是非洲土地和人民的合法统治者。"
 trait_oldclantzimisce:0 "旧棘秘魑"
 trait_oldclantzimisce_desc:0 "没有加入魔宴的棘秘魑[Clan|E]的成员。"
 trait_ravnos:0 "雷伏诺"
 trait_ravnos_desc:0 "雷伏诺以四处流浪和叫卖而闻名，他们是江湖骗子，乐得行骗行窃。"
 trait_ravnos_ashirra:0 "贝特·穆吉里姆"
 trait_ravnos_ashirra_desc:0 "贝特·穆吉里姆是阿拉伯语中的欺诈之[Clan|E]（穆吉里姆字面意思是罪犯）。他们在伊斯兰世界不受欢迎，因为他们的恶习导致他们与[ashirra|E]发生了许多不友好的对抗。"
 trait_ravnos_laibon:0 "斤养异"
 trait_ravnos_laibon_desc:0 "莱本的传承之一。斤养异的名字来源于卢甘达语中“鸟”的意思，反映了他们不断旅行的癖好，甚至超过了求知者阿库南斯。"
 trait_salubri:0 "萨洛比"
 trait_salubri_desc:0 "曾经强大的萨洛比[Clan|E]在他们的始祖扫罗被毁灭后几乎没有血系留下。"
 trait_salubri_ashirra:0 "阿明"
 trait_salubri_ashirra_desc:0 "伊斯兰萨洛比，也被称为阿明（意为“有德之人”），他们的运气不比其欧洲萨洛比更差。几个世纪以来，他们从北非到亚洲都一直监视着巴力，通常把自己伪装成其他[Clan|E]的成员。"
 trait_salubri_laibon:0 "恩库卢·瞾"
 trait_salubri_laibon_desc:0 "莱本的小支传承。恩库卢·瞾是瞾喇一系的几乎灭绝的后裔，在这支遗留之辈被追杀了几个世纪之后，其数量已经很少了。"
 trait_samedi:0 "萨姆堤"
 trait_samedi_desc:0 "起源于加勒比海，该血系的成员看起来都像还魂尸或尸体。萨姆堤的外表看似如在不断腐烂。随着年龄的增长，腐烂的肉块会越来越频繁地从它们的身上脱落，无论它们走到哪里，死亡的气味都粘在它们身上。"
 trait_setite:0 "赛特之子"
 trait_setite_desc:0 "坚信他们的始祖是埃及神赛特的吸血鬼[Clan|E]。正统的赛特信仰认为赛特总有一天会回归统治或毁灭世界，虔诚的赛特之子为他的复活做准备。"
 trait_setite_raktasadhus:0 "底提耶"
 trait_setite_raktasadhus_desc:0 "底提耶是一个异教变体，它的始祖从埃及到印度寻找古老的神秘知识，并追杀谣言中逃往喜马拉雅山的奥西里斯的子嗣。"
 trait_setite_naktanchara:0 "那坦查拉"
 trait_setite_naktanchara_desc:0 "自从他们皈依佛教并开始反抗印度血族的种姓制度后，那坦查拉世系的血系就被排斥了。"
 trait_toreador:0 "妥芮朵"
 trait_toreador_desc:0 "吸血鬼[Clan|E]，以为最美丽、性感、诱惑、富有情感和魅力的血族而闻名。"
 trait_toreador_ashirra:0 "雷因·芬"
 trait_toreador_ashirra_desc:0 "伊斯兰妥芮朵为雷因·芬，通常被称为抄写吏，因为大多数都喜欢当书法家、作家和建筑师。"
 trait_toreador_laibon:0 "伊斯塔尔里"
 trait_toreador_laibon_desc:0 "莱本的传承之一。伊斯塔尔里声称是巴比伦女神伊斯塔尔的后裔，但目前缺乏类似于古鲁希所有的那种与非洲的个人联系。"
 trait_tremere:0 "睿魔尔"
 trait_tremere_desc:0 "学者之[Clan|E]，专注于[bloodsorcery|E]。其等因所谓的对[antediluvian|E]扫罗的攻击而受到谩骂，并因[cainite|E]社会中其他地方闻所未闻的强大的[Clan|E]纪律和凝聚力而受到畏惧。"
 trait_truebrujah:0 "真布鲁赫"
 trait_truebrujah_desc:0 "布鲁赫[Clan|E]的一支血系，声称是该世系始祖的[antediluvian|E]的后裔，而不是他的[diablerist|E]/子嗣特洛伊尔。真布鲁赫以其冷静、超然的行为而闻名。"
 trait_tzimisce:0 "棘秘魑"
 trait_tzimisce_desc:0 "封建规矩和残暴的形体塑造的[Clan|E]。"
 trait_tzimisce_laibon:0 "纳格罗珀"
 trait_tzimisce_laibon_desc:0 "纳格罗珀的名字来自于科伊科伊语，意为“邪恶术士”，他们没有辜负是最可怕的莱本的名声。他们允许心兽操控他们，引导他们进入任何你能想象到的堕落放纵，有的只被甚至认为可能在噩梦中出现。"
 trait_ventrue:0 "梵卓"
 trait_ventrue_desc:0 "统治者。高贵的，威严的，贵族气息的。"
 trait_ventrue_ashirra:0 "汉志"
 trait_ventrue_ashirra_desc:0 "汉志是梵卓的一个独特世系。与传统上与罗马人或基督教欧洲人联系在一起的[Clan|E]主体不同，汉志血系声称是阿拉伯本土世系的后裔。他们已经皈依了伊斯兰教，并被接纳为[ashirra|E]的一部分，但他们的数量也相对较少。"
 trait_ventrue_raktasadhus:0 "檀那婆"
 trait_ventrue_raktasadhus_desc:0 "檀那婆是梵卓[Clan|E]的血系，以印度次大陆为中心。檀那婆是高贵的圣贤、苦行者和僧侣，是印度种姓制度中最受尊敬的吸血鬼。"
 trait_kueijin:0 "鬼人"
 trait_kueijin_desc:0 "传说鬼人是古代万仙——玉皇大帝选中引导和保护宇宙的“万千仙神”——的堕落转世。万仙最初通过针对才能和勇气的试炼被选上，并以宇宙的气为食。然而，他们却误入歧途，学会了吸取生命之气，亵渎了这一证道试炼。"
 trait_animalism:0 "兽性术"
 trait_animalism_desc:0 "这一[discipline|E]让吸血鬼更接近他们兽性的本性。这不仅允许他们与自然生物交流并获得对它们的统治，而且给予他们对心兽本身的影响力。\n\n兽性术在远离人类的部落中尤其普遍，尽管它的许多力量专门针对凡人和[cainites|E]的心兽。"
 trait_animalismadvanced:0 "高阶兽性术"
 trait_animalismadvanced_desc:0 "这一[discipline|E]让吸血鬼更接近他们兽性的本性。这不仅允许他们与自然生物交流并获得对它们的统治，而且给予他们对心兽本身的影响力。\n\n兽性术在远离人类的部落中尤其普遍，尽管它的许多力量专门针对凡人和[cainites|E]的心兽。"
 trait_auspex:0 "观占术"
 trait_auspex_desc:0 "观占术是一种赋予吸血鬼超自然感知的[discipline|E]。\n它是[cainites|E]中最常见和最受欢迎[disciplines|E]之一，因为它既多功能，而且在吸血鬼生活的每个方面都很有用。此外，它还被认为可以赋予某种程度的预言能力，特别是在能让[cainite|E]注意到危险，即使他们处于[torpor|E]状态。"
 trait_auspexadvanced:0 "高阶观占术"
 trait_auspexadvanced_desc:0 "观占术是一种赋予吸血鬼超自然感知的[discipline|E]。\n它是[cainites|E]中最常见和最受欢迎[disciplines|E]之一，因为它既多功能，而且在吸血鬼生活的每个方面都很有用。此外，它还被认为可以赋予某种程度的预言能力，特别是在能让[cainite|E]注意到危险，即使他们处于[torpor|E]状态。"
 trait_celerity:0 "迅捷术"
 trait_celerity_desc:0 "迅捷术是一种使吸血鬼产生超自然的敏捷与反应能力的[discipline|E]。\n\n对一些[cainites|E]来说，凡人的世界是处于慢动作的。在紧张的时候，会迅捷术的吸血鬼可以以惊人的速度移动，对于任何不懂[discipline|E]者，无论是凡人还是永生者，他们的行动都是模糊的。"
 trait_celerityadvanced:0 "高阶迅捷术"
 trait_celerityadvanced_desc:0 "迅捷术是一种使吸血鬼产生超自然的敏捷与反应能力的[discipline|E]。\n\n对一些[cainites|E]来说，凡人的世界是处于慢动作的。在紧张的时候，会迅捷术的吸血鬼可以以惊人的速度移动，对于任何不懂[discipline|E]者，无论是凡人还是永生者，他们的行动都是模糊的。"
 trait_chimerstry:0 "虚幻术"
 trait_chimerstry_desc:0 "虚幻术是雷伏诺的标志性[discipline|E]，能允许其将幻象施加于现实。幻觉的真实度取决于[cainite|E]的能力程度。"
 trait_chimerstryadvanced:0 "高阶虚幻术"
 trait_chimerstryadvanced_desc:0 "虚幻术是雷伏诺的标志性[discipline|E]，能允许其将幻象施加于现实。幻觉的真实度取决于[cainite|E]的能力程度。"
 trait_daimonion:0 "崇魔术"
 trait_daimonion_desc:0 "崇魔术是一种魔类[discipline|E]，只有巴力和最坏的吸血鬼崇魔者才会修习。它的力量来自撒旦本身，通过使用崇魔术，巴力利用地狱的力量和那里的恶魔来挫败和堕落他们的敌人。"
 trait_daimonionadvanced:0 "高阶崇魔术"
 trait_daimonionadvanced_desc:0 "崇魔术是一种魔类[discipline|E]，只有巴力和最坏的吸血鬼崇魔者才会修习。它的力量来自撒旦本身，通过使用崇魔术，巴力利用地狱的力量和那里的恶魔来挫败和堕落他们的敌人。"
 trait_dementation:0 "疯狂术"
 trait_dementation_desc:0 "疯狂术是一门被熟知为末卡维的特征的[discipline|E]。\n\n疯狂术吸取吸血鬼自身的疯狂，并用它来获得深刻的洞察力或使他人疯狂。这种力量是末卡维[Clan|E]经常被认为既有洞察力又非常危险的主要原因之一。"
 trait_dementationadvanced:0 "高阶疯狂术"
 trait_dementationadvanced_desc:0 "疯狂术是一门被熟知为末卡维的特征的[discipline|E]。\n\n疯狂术吸取吸血鬼自身的疯狂，并用它来获得深刻的洞察力或使他人疯狂。这种力量是末卡维[Clan|E]经常被认为既有洞察力又非常危险的主要原因之一。"
 trait_dominate:0 "支配术"
 trait_dominate_desc:0 "支配术是一种以吸血鬼的意志压倒另一个人的思想的[discipline|E]，迫使受害者按照吸血鬼的命令思考或行动。"
 trait_dominateadvanced:0 "高阶支配术"
 trait_dominateadvanced_desc:0 "支配术是一种以吸血鬼的意志压倒另一个人的思想的[discipline|E]，迫使受害者按照吸血鬼的命令思考或行动。\n\n支配术的吸血鬼诅咒的一面是它贬低了真正友谊或亲密关系的基本要素。支配术也会削弱使用者的同理心，你必须注意不要习惯于总是被谄媚者包围。"
 trait_fortitude:0 "坚韧术"
 trait_fortitude_desc:0 "坚韧术是一种[discipline|E]，它能给予血族超凡的韧性，甚至能抵挡烈火和阳光。\n\n坚韧术也能防止操纵和控制，比如来自支配术和威仪术[disciplines|E]的。"
 trait_flight:0 "飞行术"
 trait_flight_desc:0 "先天的、嫁接的、进化出的或以其他方式获得的翅膀，此血律既指人体特征和也指使用经验。赋予了飞行的力量。"
 trait_flightadvanced:0 "高阶飞行术"
 trait_flightadvanced_desc:0 "飞行是一种超自然[discipline|E]，是石像鬼血系所独有的，它能让这些吸血鬼飞翔。\n\n由于太重而不能用自然方式飞行，石像鬼必须使用这门[discipline|E]飞行；其他能够飞行的[cainites|E]（例如，通过变形术变为蝙蝠或雾）不需要它，也无法学习。"
 trait_melpominee:0 "魔音术"
 trait_melpominee_desc:0 "魔音术[discipline|E]与嘈杂之女同时显现，并与这一血系有着固有的联系。它允许拥有者使用语言和歌曲来产生各种超自然效果。"
 trait_melpomineeadvanced:0 "高阶魔音术"
 trait_melpomineeadvanced_desc:0 "魔音术[discipline|E]与嘈杂之女同时显现，并与这一血系有着固有的联系。它允许拥有者使用语言和歌曲来产生各种超自然效果。\n\n也以希腊悲剧缪斯女神“墨尔波墨涅”为名，魔音术是一个嘈杂之女独有的[discipline|E]。它发掘音之力，震撼邻近者的灵魂，并让吸血鬼使用他人无法做到的声波能力。"
 trait_mytherceria:0 "仙灵术"
 trait_mytherceria_desc:0 "仙灵术是一种在妖精血吸血鬼身上显现出来的[discipline|E]，比如吉雅希德和马伊格哈尔。它赋予吸血鬼神秘的感知，窃取知识的能力，以及其他属于妖精的力量。"
 trait_mytherceriaadvanced:0 "高阶仙灵术"
 trait_mytherceriaadvanced_desc:0 "仙灵术是一种在妖精血吸血鬼身上显现出来的[discipline|E]，比如吉雅希德和马伊格哈尔。它赋予吸血鬼神秘的感知，窃取知识的能力，以及其他属于妖精的力量。\n\n作为一个由妖精拥有的力量的集合，并且倾向于揭露新的认知，仙灵术已经把它的许多受害者逼到胡言乱语的疯狂，或者至少是沮丧。"
 trait_necromancy:0 "亡灵术"
 trait_necromancy_desc:0 "[necromancy|E]是一种[bloodsorcery|E]，专门针对死者世界：死灵和[shadowlands|E]。相比于传统[bloodsorcery|E]有不同的风格，也有各种各样的[necromancy|E]实践。它主要由乔凡尼修习。"
 trait_necromancyadvanced:0 "高阶亡灵术"
 trait_necromancyadvanced_desc:0 "[necromancy|E]是一种[bloodsorcery|E]，专门针对死者世界：死灵和[shadowlands|E]。相比于传统[bloodsorcery|E]有不同的风格，也有各种各样的[necromancy|E]实践。它主要由乔凡尼修习。"
 trait_obeah:0 "魂愈术"
 trait_obeah_desc:0 "魂愈术是一种萨洛比独有的[discipline|E]，也被称为医者的魂健之道。\n\n魂愈术起源于扫罗在东方之旅中向鬼人学习的龙珠神通。学习魂愈术会导致第三眼在前额中部发育。"
 trait_obeahadvanced:0 "高阶魂愈术"
 trait_obeahadvanced_desc:0 "魂愈术是一种萨洛比独有的[discipline|E]，也被称为医者的魂健之道。\n\n魂愈术起源于扫罗在东方之旅中向鬼人学习的龙珠神通。学习魂愈术会导致第三眼在前额中部发育。"
 trait_obfuscate:0 "混淆术"
 trait_obfuscate_desc:0 "混淆术是一种[discipline|E]，允许吸血鬼隐藏自己，欺骗他人的思想，或使他们忽视使用者不想被看到的东西。\n\n混淆术是[antediluvians|E]身上该隐的诅咒的一部分，将他们从造物中抹去。"
 trait_obfuscateadvanced:0 "高阶混淆术"
 trait_obfuscateadvanced_desc:0 "混淆术是一种[discipline|E]，允许吸血鬼隐藏自己，欺骗他人的思想，或使他们忽视使用者不想被看到的东西。\n\n混淆术是[antediluvians|E]身上该隐的诅咒的一部分，将他们从造物中抹去。经常使用这个[discipline|E]的人发现自己脱离了社会，从不参与社会交往，只是观察。"
 trait_obtenebration:0 "幽暗术"
 trait_obtenebration_desc:0 "[obtenebration|E]据说会进一步诅咒使用它的吸血鬼，因为他将自己从天主的恩典中进一步移出，并步入黑暗的深渊。因此，动物和人形生物都会忌讳使用者。幽暗术召唤出的超自然的黑暗对凡人、动物，甚至其他不习惯使用它的[cainites|E]来说都是极其可怕的。"
 trait_obtenebrationadvanced:0 "高阶幽暗术"
 trait_obtenebrationadvanced_desc:0 "幽暗术据说会进一步诅咒使用它的吸血鬼，因为他将自己从天主的恩典中进一步移出，并步入黑暗的深渊。因此，动物和人形生物都会忌讳使用者。幽暗术召唤出的超自然的黑暗对凡人、动物，甚至其他不习惯使用它的[cainites|E]来说都是极其可怕的。"
 trait_potence:0 "蛮力术"
 trait_potence_desc:0 "蛮力术是赋予吸血鬼身体活力和不可思议的力量的[discipline|E]。具有蛮力术[discipline|E]的吸血鬼拥有超越凡人界限的身体力量。"
 trait_potenceadvanced:0 "高阶蛮力术"
 trait_potenceadvanced_desc:0 "蛮力术是赋予吸血鬼身体活力和不可思议的力量的[discipline|E]。具有蛮力术[discipline|E]的吸血鬼拥有超越凡人界限的身体力量。"
 trait_presence:0 "威仪术"
 trait_presence_desc:0 "威仪术是一种超自然的诱惑和情感操纵的[discipline|E]，允许血族吸引、拉拢和控制人群。\n\n威仪术软化了天主对[cainites|E]的诅咒，使吸血鬼成为众人关注的焦点。要么是迷惑，诱惑，或是恐吓附近的人。"
 trait_presenceadvanced:0 "高阶威仪术"
 trait_presenceadvanced_desc:0 "威仪术是一种超自然的诱惑和情感操纵的[discipline|E]，允许血族吸引、拉拢和控制人群。\n\n威仪术软化了天主对[cainites|E]的诅咒，使吸血鬼成为众人关注的焦点。要么是迷惑，诱惑，或是恐吓附近的人。"
 trait_protean:0 "变形术"
 trait_protean_desc:0 "变形术是一种让吸血鬼能够变身的[discipline|E]，从长出天然利爪到蒸发成一团烟雾。\n\n变形术是天主对该隐的诅咒的一部分，它剥去了每个吸血鬼必须坚持的人性的外表，显露了他灵魂中的心兽。"
 trait_proteanadvanced:0 "高阶变形术"
 trait_proteanadvanced_desc:0 "变形术是一种让吸血鬼能够变身的[discipline|E]，从长出天然利爪到蒸发成一团烟雾。\n\n变形术是天主对该隐的诅咒的一部分，它剥去了每个吸血鬼必须坚持的人性的外表，显露了他灵魂中的心兽。高阶使用者有时会发现自己的身体在未经自己同意的情况下移动，直接对自己的情绪做出反应，把自己带入尴尬的境地。"
 trait_quietus:0 "寂灭术"
 trait_quietus_desc:0 "寂灭术是阿刹迈的标志性[discipline|E]，赋予他们对他人血液的影响力。\n\n虽然每个阿刹迈种姓都拥有寂灭术作为一种[Clan|E]内的[discipline|E]，但它主要是以战士种姓手中的刺杀工具而闻名，而较低等级的能力主要是为了达到这个目的。"
 trait_quietusadvanced:0 "高阶寂灭术"
 trait_quietusadvanced_desc:0 "寂灭术是阿刹迈的标志性[discipline|E]，赋予他们对他人血液的影响力。\n\n虽然每个阿刹迈种姓都拥有寂灭术作为一种[Clan|E]内的[discipline|E]，但它主要是以战士种姓手中的刺杀工具而闻名，而较低等级的能力主要是为了达到这个目的。"
 trait_serpentis:0 "古蛇术"
 trait_serpentis_desc:0 "古蛇术是赛特信徒[Clan|E]的标志性[discipline|E]。它主要提供变形能力，虽然它也包含腐化和其他与蛇相关的特征。\n\n蛇对这个[Clan|E]有着近乎宗教意义的意义，尽管血族的科学家推测这与变形术的变化能力有关。"
 trait_serpentisadvanced:0 "高阶古蛇术"
 trait_serpentisadvanced_desc:0 "古蛇术是赛特信徒[Clan|E]的标志性[discipline|E]。它主要提供变形能力，虽然它也包含腐化和其他与蛇相关的特征。\n\n蛇对这个[Clan|E]有着近乎宗教意义的意义，尽管血族的科学家推测这与变形术的变化能力有关。"
 trait_spiritus:0 "精魂术"
 trait_spiritus_desc:0 "精魂术是阿里曼血系中一门独特的[discipline|E]，允许他们与兽灵互动。在最基本的层面上，它允许吸血鬼与灵类交谈并召唤灵类，但在更高的能力等级中，它可以从灵类中引导力量来增强阿里曼。"
 trait_spiritusadvanced:0 "高阶精魂术"
 trait_spiritusadvanced_desc:0 "精魂术是阿里曼血系中一门独特的[discipline|E]，允许他们与兽灵互动。在最基本的层面上，它允许吸血鬼与灵类交谈并召唤灵类，但在更高的能力等级中，它可以从灵类中引导力量来增强阿里曼。"
 trait_temporis:0 "时光术"
 trait_temporis_desc:0 "时光术是真布鲁赫所独有的一种[discipline|E]。据推测，时光术是对迅捷术的一种提纯，它赋予了[cainite|E]操纵时间本身的流动的能力。"
 trait_temporisadvanced:0 "高阶时光术"
 trait_temporisadvanced_desc:0 "时光术是真布鲁赫所独有的一种[discipline|E]。据推测，时光术是对迅捷术的一种提纯，它赋予了[cainite|E]操纵时间本身的流动的能力。\n\n虽然这个[discipline|E]很强大，但使用起来也会很吃力。"
 trait_thinbloodalchemy:0 "淡血种炼金术"
 trait_thinbloodalchemy_desc:0 "这是淡血种独有的[discipline|E]，它允许他们模仿纯血吸血鬼的[disciplines|E]。\n\n淡血种炼金术是具有二个步骤的修习：使用适当的配方蒸馏血液混合物，然后通过喝掉所谓的混合饮品来激活，并引导其力量。"
 trait_thinbloodalchemyadvanced:0 "高阶淡血种炼金术"
 trait_thinbloodalchemyadvanced_desc:0 "这是淡血种独有的[discipline|E]，它允许他们模仿纯血吸血鬼的[disciplines|E]。\n\n淡血种炼金术是具有二个步骤的修习：使用适当的配方蒸馏血液混合物，然后通过喝掉所谓的混合饮品来激活，并引导其力量。"
 trait_valeren:0 "魂健术"
 trait_valeren_desc:0 "魂健术是萨洛比的神秘[discipline|E]。其最基本的是，魂健术提供了对疼痛的控制和增强的军事能力，似乎允许战士们利用天堂的力量来征服他们的敌人。"
 trait_valerenadvanced:0 "高阶魂健术"
 trait_valerenadvanced_desc:0 "魂健术是萨洛比的神秘[discipline|E]。其最基本的是，魂健术提供了对疼痛的控制和增强的军事能力，似乎允许战士们利用天堂的力量来征服他们的敌人。"
 trait_vicissitude:0 "易变术"
 trait_vicissitude_desc:0 "易变术是[cainites|E]最可怕的能力之一，它是棘秘魑的标志性能力，在其[Clan|E]之外几乎不为人所知。有经验的制作者可以用它雕刻一个目标的血肉和骨头，使他们成为一个异样美丽的生物或扭曲他们成为一个畸形的怪物。"
 trait_vicissitudeadvanced:0 "高阶易变术"
 trait_vicissitudeadvanced_desc:0 "易变术是[cainites|E]最可怕的能力之一，它是棘秘魑的标志性能力，在其[Clan|E]之外几乎不为人所知。有经验的制作者可以用它雕刻一个目标的血肉和骨头，使他们成为一个异样美丽的生物或扭曲他们成为一个畸形的怪物。"
 trait_visceratika:0 "石变术"
 trait_visceratika_desc:0 "石变术[discipline|E]是石像鬼血系独有的，是他们对石头、土壤和由其制造的东西的自然亲和力的延伸。\n\n石变术的特色是变形能力，类似变形术的那些，但是更强调防御。"
 trait_visceratikaadvanced:0 "高阶石变术"
 trait_visceratikaadvanced_desc:0 "石变术[discipline|E]是石像鬼血系独有的，是他们对石头、土壤和由其制造的东西的自然亲和力的延伸。\n\n石变术的特色是变形能力，类似变形术的那些，但是更强调防御。"
 trait_bloodsorcery:0 "血术法"
 trait_bloodsorcery_desc:0 "[bloodsorcery|E]指的是由吸血鬼使用的魔法，由宗教或超自然现象和[cainite|E]精血的力量推动。\n\n通过对[bloodsorcery|E]的应用，[cainite|E]可以召唤火焰，控制天气，以及做许多其他即使以吸血鬼的标准来看也是不自然的事情。"
 trait_bloodsorceryadvanced:0 "高阶血术法"
 trait_bloodsorceryadvanced_desc:0 "[bloodsorcery|E]指的是由吸血鬼使用的魔法，由宗教或超自然现象和[cainite|E]精血的力量推动。\n\n通过对[bloodsorcery|E]的应用，[cainite|E]可以召唤火焰，控制天气，以及做许多其他即使以吸血鬼的标准来看也是不自然的事情。"
 trait_fortitudeadvanced:0 "高阶坚韧术"
 trait_fortitudeadvanced_desc:0 "坚韧术是一种[discipline|E]，它能给予血族超凡的韧性，甚至能抵挡烈火和阳光。\n\n坚韧术赋予了[cainite|E]抵抗各种伤害的能力，然而它却在滋生的傲慢和过度自信中完成了神的诅咒的一部分。"
 trait_oblivion:0 "湮灭术"
 trait_oblivion_desc:0 "湮灭术是一种[discipline|E]，它允许使用者利用完全超自然的东西；通过湮灭术可以从深渊召唤超自然的黑暗和奴役幽灵，类似于[necromancy|E]。"
 trait_oblivionadvanced:0 "高阶湮灭术"
 trait_oblivionadvanced_desc:0 "湮灭术是一种[discipline|E]，它允许使用者利用完全超自然的东西；通过湮灭术可以从深渊召唤超自然的黑暗和奴役幽灵，类似于[necromancy|E]。"
 trait_mortis:0 "死灵术"
 trait_mortis_desc:0 "死灵术[discipline|E]基于对死亡的控制和操纵。更具体地说，死灵术是[bloodsorcery|E]的一种，专门针对尸体及其死后的状态。卡帕多西亚[Clan|E]是唯一对这一[discipline|E]的有着自然亲和力的血族。"
 trait_mortisadvanced:0 "高阶死灵术"
 trait_mortisadvanced_desc:0 "死灵术[discipline|E]基于对死亡的控制和操纵。更具体地说，死灵术是[bloodsorcery|E]的一种，专门针对尸体及其死后的状态。卡帕多西亚[Clan|E]是唯一对这一[discipline|E]的有着自然亲和力的血族。"
 trait_nihilistics:0 "虚无术"
 trait_nihilistics_desc:0 "虚无术是那伽罗阇独会的一门[discipline|E]，它允许他们穿透尸幕并与湮灭相连。除了一些[underworld|E]居民有关的应用之外，它的力量还允许吸血鬼将湮灭引入物质位面。"
 trait_nihilisticsadvanced:0 "高阶虚无术"
 trait_nihilisticsadvanced_desc:0 "虚无术是那伽罗阇独会的一门[discipline|E]，它允许他们穿透尸幕并与湮灭相连。除了一些[underworld|E]居民有关的应用之外，它的力量还允许吸血鬼将湮灭引入物质位面。"
 trait_thanatosis:0 "坏死术"
 trait_thanatosis_desc:0 "坏死术是是萨姆堤血系独占的一种[discipline|E]，涉及控制死亡和腐烂造成的后果。在某些方面，它类似于[necromancy|E]。这门[discipline|E]研究各种形式的死亡。其使用者痴迷于死亡的表现，使除了最扭曲的血族外，其他血族都避着他们走。"
 trait_thanatosisadvanced:0 "坏死术"
 trait_thanatosisadvanced_desc:0 "坏死术是是萨姆堤血系独占的一种[discipline|E]，涉及控制死亡和腐烂造成的后果。在某些方面，它类似于[necromancy|E]。这门[discipline|E]研究各种形式的死亡。其使用者痴迷于死亡的表现，使除了最扭曲的血族外，其他血族都避着他们走。"
 trait_deimos:0 "恐怖术"
 trait_deimos_desc:0 "恐怖术是拉米亚在研究死者和莉莉丝的过程中创造的一门[discipline|E]。它为吸血鬼提供了一些对他们掌握的无生命形态，例如黑暗灵类，的控制以及源自黑暗之母的庇护。它也被称为四体液之道。"
 trait_deimosadvanced:0 "高阶恐怖术"
 trait_deimosadvanced_desc:0 "恐怖术是拉米亚在研究死者和莉莉丝的过程中创造的一门[discipline|E]。它为吸血鬼提供了一些对他们掌握的无生命形态，例如黑暗灵类，的控制以及源自黑暗之母的庇护。它也被称为四体液之道。"
 trait_abombo:0 "阿本博"
 trait_abombo_desc:0 "非洲的莱本所遵随的心路，专注于亡者与生者之间的联系；与[necromancy|E]的衣冠冢心路相似但又不同。它允许亡灵术师控制甚至重新分配幽灵的[Fetter|E]。"
 trait_abomboadvanced:0 "高阶阿本博"
 trait_abomboadvanced_desc:0 "非洲的莱本所遵随的心路，专注于亡者与生者之间的联系；与[necromancy|E]的衣冠冢心路相似但又不同。它允许亡灵术师控制甚至重新分配幽灵的[Fetter|E]。"
 trait_abombwe:0 "阿本威"
 trait_abombwe_desc:0 "阿本威是种由莱本的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的[discipline|E]。"
 trait_abombweadvanced:0 "高阶阿本威"
 trait_abombweadvanced_desc:0 "阿本威是种由莱本的阿库南斯传承和黑暗时代神秘的邦萨姆血系掌握的[discipline|E]。阿本威利用吸血鬼与自己的（以及其他人的）心兽的紧密联系并加以控制，将心兽的力量用于各种目的。"
 trait_sielanicthaumaturgy:0 "塞拉奇术"
 trait_sielanicthaumaturgy_desc:0 "塞拉奇术是受异教神特亚维的启发，由特亚维派睿魔尔掌握，一条原居立陶宛的睿魔尔血系。\n\n特亚维派学会了利用塞拉的力量，塞拉是潜伏在他们所居住的土地、石头、植物和动物中的万物之灵。"
 trait_sielanicthaumaturgyadvanced:0 "高阶塞拉奇术"
 trait_sielanicthaumaturgyadvanced_desc:0 "塞拉奇术是受异教神特亚维的启发，由特亚维派睿魔尔掌握，一条原居立陶宛的睿魔尔血系。\n\n特亚维派学会了利用塞拉的力量，塞拉是潜伏在他们所居住的土地、石头、植物和动物中的万物之灵。"
 trait_duranki:0 "杜–安–奇"
 trait_duranki_desc:0 "[durnaki|E]（天地之主）是一种[bloodsorcery|E]，由中东和非洲的血族掌握。这是一种非常古老的魔法，来自于各种各样的凡人宗教传统，存在于奇术之前，却于其在很多方面都很相似。"
 trait_durankiadvanced:0 "高阶杜–安–奇"
 trait_durankiadvanced_desc:0 "[durnaki|E]（天地之主）是一种[bloodsorcery|E]，由中东和非洲的血族掌握。这是一种非常古老的魔法，来自于各种各样的凡人宗教传统，存在于奇术之前，却于其在很多方面都很相似。"
 trait_ogham:0 "欧甘符文"
 trait_ogham_desc:0 "欧甘符文是一种基于凯尔特符文的非常受限的[bloodsorcery|E]，由菈亚南掌握，其借用血系中的灵类碎片，并集中力量于领域之中。"
 trait_oghamadvanced:0 "高阶欧甘符文"
 trait_oghamadvanced_desc:0 "欧甘符文是一种基于凯尔特符文的非常受限的[bloodsorcery|E]，由菈亚南掌握，其借用血系中的灵类碎片，并集中力量于领域之中。"
 trait_koldunicsorcery:0 "库都术法"
 trait_koldunicsorcery_desc:0 "库都术法或库都术是棘秘魑掌握的一种[cainite|E][bloodsorcery|E]。\n\n库都术法从概念上来说类似于奇术，但实际应用却天差地别。"
 trait_koldunicsorceryadvanced:0 "高阶库都术法"
 trait_koldunicsorceryadvanced_desc:0 "库都术法或库都术是棘秘魑掌握的一种[cainite|E][bloodsorcery|E]。\n\n库都术法从概念上来说类似于奇术，但实际应用却天差地别。"
 trait_abyssmysticism:0 "深渊秘术"
 trait_abyssmysticism_desc:0 "深渊秘术是[bloodsorcery|E]的一种，源于幽暗术[discipline|E]。显然，这种奥秘之术几乎完全由勒森魃[Clan|E]的成员掌握着。那些通晓着这些神秘之术的家伙被称为影化者。"
 trait_abyssmysticismadvanced:0 "高阶深渊秘术"
 trait_abyssmysticismadvanced_desc:0 "深渊秘术是[bloodsorcery|E]的一种，源于幽暗术[discipline|E]。显然，这种奥秘之术几乎完全由勒森魃[Clan|E]的成员掌握着。那些通晓着这些神秘之术的家伙被称为影化者。"
 trait_sadhana:0 "修持"
 trait_sadhana_desc:0 "修持是印度[bloodsorcery|E]的一种形式，早于睿魔尔[Clan|E]著名的赫耳墨斯奇术几千年。它由印度的印度教婆罗门[cainites|E]掌握，他们被称为苦行血僧或甚至血婆罗门。"
 trait_sadhanaadvanced:0 "高阶修持"
 trait_sadhanaadvanced_desc:0 "修持是印度[bloodsorcery|E]的一种形式，早于睿魔尔[Clan|E]著名的赫耳墨斯奇术几千年。它由印度的印度教婆罗门[cainites|E]掌握，他们被称为苦行血僧或甚至血婆罗门。"
 trait_sihr:0 "西尔"
 trait_sihr_desc:0 "西尔（源自阿拉伯语“法术”）是伊斯兰世界广泛使用的一种[bloodsorcery|E][discipline|E]。在黑暗时代，它与其他形式的[bloodsorcery|E]的不同之处在于它的使用者需要在社群之道或天国之路有很高的心路等级才能使用该魔法。"
 trait_sihradvanced:0 "高阶西尔"
 trait_sihradvanced_desc:0 "西尔（源自阿拉伯语“法术”）是伊斯兰世界广泛使用的一种[bloodsorcery|E][discipline|E]。在黑暗时代，它与其他形式的[bloodsorcery|E]的不同之处在于它的使用者需要在社群之道或天国之路有很高的心路等级才能使用该魔法。"
 trait_akhu:0 "咒术"
 trait_akhu_desc:0 "咒术，通常被外乡人称为赛特术法，是赛特信徒追遵的古老[bloodsorcery|E]学派。\n\n在埃及的全盛时期，也就是在因罗马帝国的统治而皈依基督教之前，魔法是很常见的，无论是对凡人还是吸血鬼都一样。"
 trait_akhuadvanced:0 "高阶咒术"
 trait_akhuadvanced_desc:0 "咒术，通常被外乡人称为赛特术法，是赛特信徒追遵的古老[bloodsorcery|E]学派。\n\n在埃及的全盛时期，也就是在因罗马帝国的统治而皈依基督教之前，魔法是很常见的，无论是对凡人还是吸血鬼都一样。"
 trait_darkthaumaturgy:0 "暗黑奇术"
 trait_darkthaumaturgy_desc:0 "暗黑奇术是指从恶魔那里学来的奇术。\n\n吸血鬼可能会与恶魔达成契约以得知[bloodsorcery|E]的秘密，就像凡人法师学习其他魔邪魔法一样；他们达成这项交易的代价为牺牲自己残余的灵魂，一种获取魔法力量的捷径。"
 trait_darkthaumaturgyadvanced:0 "高阶暗黑奇术"
 trait_darkthaumaturgyadvanced_desc:0 "暗黑奇术是指从恶魔那里学来的奇术。\n\n吸血鬼可能会与恶魔达成契约以得知[bloodsorcery|E]的秘密，就像凡人法师学习其他地狱魔法一样；他们达成这项交易的代价为牺牲自己残余的灵魂，一种获取魔法力量的捷径。"
 trait_thaumaturgy:0 "奇术"
 trait_thaumaturgy_desc:0 "奇术是睿魔尔[Clan|E]所使的一种被严控的[bloodsorcery|E]形式。\n\n通过详尽的研究和广泛的实验，奇术利用了睿魔尔家族还是一个法师集团时所使用的赫耳墨斯魔法，适应了由精血而不是用精髓的内在魔力来推动。"
 trait_thaumaturgyadvanced:0 "高阶奇术"
 trait_thaumaturgyadvanced_desc:0 "奇术是睿魔尔[Clan|E]所使的一种被严控的[bloodsorcery|E]形式。\n\n通过详尽的研究和广泛的实验，奇术利用了睿魔尔家族还是一个法师集团时所使用的赫耳墨斯魔法，适应了由精血而不是用精髓的内在魔力来推动。"
 trait_supehunter:0 "猎人"
 trait_supehunter_desc:0 "怪物猎人。"
 trait_turnedhunter:0 "被转化的猎人"
 trait_turnedhunter_desc:0 "此怪物猎人在行责期间被超自然力量转化了"
 trait_torpor:0 "蛰眠"
 trait_torpor_desc:0 "与吸血鬼通常在白天进行的睡眠相比，[torpor|E]只是一种更深层次的停滞状态。[torpor|E]的时间长短取决于吸血鬼的人性或心路的评定，可以持续一天到一千年以上。据说，古老吸血鬼经常感到需要自愿的进入[torpor|E]状态，也被称为年长之倦。"
 trait_canon:0 "原作角色"
 trait_canon_desc:0 ""
 trait_demon:0 "恶魔"
 trait_demon_desc:0 "恶魔是堕落的天使，他们在创世的第一天选择与路西法和人类站在一起，而不是与天主站在一起。为了惩罚他们的叛逆和不忠，天使长米迦勒把这些天使从天堂扔到深渊。"
 trait_vampgeneration1:0 "初代血族"
 trait_vampgeneration1_desc:0 "该隐，第一位吸血鬼。被上帝所诅咒而成的受诅者之源，使他事实上成为唯一的一代吸血鬼。"
 trait_vampgeneration2:0 "次代血族"
 trait_vampgeneration2_desc:0 "传说中的该隐三子嗣。被三代血族所谋杀。"
 trait_vampgeneration3:0 "三代血族"
 trait_vampgeneration3_desc:0 "通常被称为上古耆宿，这一代建立了吸血鬼的氏族。据说他们中的大多数人拥有比单纯的该隐之子更接近于上帝的力量。"
 trait_vampgeneration4:0 "第四代血族"
 trait_vampgeneration4_desc:0 "通常被称为玛土撒拉，这一代是黑暗时代及之后的最强大的活跃吸血鬼。"
 trait_vampgeneration5:0 "第五代血族"
 trait_vampgeneration5_desc:0 "这一代的力量只比第四代小一些，他们是掌握着吸血鬼政治中大多数真正权力的人物。"
 trait_vampgeneration6:0 "第六代血族"
 trait_vampgeneration6_desc:0 "数量最多的吸血鬼。他们通常以自己的身份成为重要的政治人物，但大多数时候是在（常在幕后的）前一代吸血鬼的领导下。"
 trait_vampgeneration7:0 "第七代血族"
 trait_vampgeneration7_desc:0 "数量最多的吸血鬼。他们通常以自己的身份成为重要的政治人物，但大多数时候是在（常在幕后的）前一代吸血鬼的领导下。"
 trait_vampgeneration8:0 "第八代血族"
 trait_vampgeneration8_desc:0 "数量最多的吸血鬼。他们通常以自己的身份成为重要的政治人物，但大多数时候是在（常在幕后的）前一代吸血鬼的领导下。"
 trait_vampgeneration9:0 "第九代血族"
 trait_vampgeneration9_desc:0 "数量最多的吸血鬼。他们通常以自己的身份成为重要的政治人物，但大多数时候是在（常在幕后的）前一代吸血鬼的领导下。"
 trait_vampgeneration10:0 "第十代血族"
 trait_vampgeneration10_desc:0 "该隐之子世界的乌合之众。他们被更前世代的同族嘲笑，或者经常被直接虐待，他们在黑夜的政治中拥有很少的权力。"
 trait_vampgeneration11:0 "第十一代血族"
 trait_vampgeneration11_desc:0 "该隐之子世界的乌合之众。他们被更前世代的同族嘲笑，或者经常被直接虐待，他们在黑夜的政治中拥有很少的权力。"
 trait_vampgeneration12:0 "第十二代血族"
 trait_vampgeneration12_desc:0 "该隐之子世界的乌合之众。他们被更前世代的同族嘲笑，或者经常被直接虐待，他们在黑夜的政治中拥有很少的权力。"
 trait_vampgeneration13:0 "第十三代血族"
 trait_vampgeneration13_desc:0 "该隐之子世界的乌合之众。他们被更前世代的同族嘲笑，或者经常被直接虐待，他们在黑夜的政治中拥有很少的权力。"
 trait_vampgeneration14:0 "第十四代血族"
 trait_vampgeneration14_desc:0 "在某些方面，“淡血种”只勉强算是吸血鬼。该隐的诅咒在他们身上被淡化了，以至于他们只表现出前代同族的部分传统优势和弱点。"
 trait_vampgeneration15:0 "第十五代血族"
 trait_vampgeneration15_desc:0 "在某些方面，“淡血种”只勉强算是吸血鬼。该隐的诅咒在他们身上被淡化了，以至于他们只表现出前代同族的部分传统优势和弱点。"
 trait_vampgeneration16:0 "第十六代血族"
 trait_something_unusual:0 "略有怪异"
 trait_something_unusual_desc:0 "关于其似乎有什么不同寻常之处。"
 trait_revenant:0 "祖传血仆"
 trait_revenant_desc:0 "一个体内流淌着吸血鬼血液的独立[ghoul|E]。[Revenants|E]通常被认为是吸血鬼和凡人之间的不洁混合体，其等被困在两族之间。"
 trait_zadruga:0 "家传血仆"
 trait_zadruga_desc:0 "棘秘魑称呼可遗传血仆的术语。在所有的[Clans|E]中，棘秘魑培育的[ghoul|E]家庭最多。"
 trait_oathbreaker:0 "破誓者"
 trait_oathbreaker_desc:0 "该角色违反了誓言。"
 trait_regnant:0 "血主"
 trait_regnant_desc:0 "这名角色制造了一位[ghoul|E]。"
 trait_massregnant:0 "多仆血主"
 trait_massregnant_desc:0 "这名角色一次性制造了大量血仆。这通常意味着[masquerade|E]的破漏。"
 trait_unbondable:0 "免疫血缚"
 trait_unbondable_desc:0 "该角色无法被血缚。"
 trait_exposed:0 "曝露"
 trait_exposed_desc:0 "该生物的超自然本质已经被凡人揭露。猎人会计划对他发起攻击。"
 trait_nagaraja:0 "那伽罗阇"
 trait_nagaraja_desc:0 "那伽罗阇是一种奇异的食肉吸血鬼血系，被千年圣战双方的所有血族成员所惧怕。"
 trait_hecata:0 "赫卡塔"
 trait_hecata_desc:0 "他们不是一个完全组织起来的[Clan|E]，并从单一的[antediluvian|E]和不间断的血系中派生出来，而是由乔凡尼和古老的卡帕多西亚[Clan|E]的残余以及他们相关的血系组成；包括那伽罗阇，尽管其与[antediluvian|E]没有联系。"
 trait_impundulu:0 "魔蛇鹫"
 trait_impundulu_desc:0 "依附于凡人巫师集会的吸血鬼血系，他们被认为是莱本的传承之一。魔蛇鹫生前是一位强大的亡灵术师，娶了一个同样强大的生命女巫邦卡齐。"
 trait_sire:0 "尊长"
 trait_sire_desc:0 "这名吸血鬼制造了另一位同类。"
 trait_masssire:0 "众之尊长"
 trait_masssire_desc:0 "这名吸血鬼制造了大量吸血鬼。大部分心道视之为对[masquerade|E]的违背。"
 trait_lamia:0 "拉米亚"
 trait_lamia_desc:0 "拉米亚是致力于保卫卡帕多西亚[Clan|E]的[cainites|E]血系，尽管最初他们是一群声称是亚当第一任妻子莉莉丝的后裔的密教徒。"
 trait_gangrel_greek:0 "希腊冈格罗"
 trait_gangrel_greek_desc:0 "希腊冈格罗是起源于黑暗时代的一条分支。\n\n早在巴比伦之前，冈格罗就已经在人类的城市中藏身。几个世纪过去了，这些冈格罗专注于在一个不同的环境中生存——一个充满独特危险的环境。"
 trait_ahrimane:0 "阿里曼"
 trait_ahrimane_desc:0 "阿里曼是一个罕见的，全女性血族的血系，最初存在于黑暗时代，由一位叫阿迪萨的女人领导。\n\n阿里曼的故事，正如她们所说的那样，从即是女武神也是北欧女神芙蕾雅的女儿的阿迪萨开始。"
 trait_patron:0 "赞助者"
 trait_patron_desc:0 "对本Mod赞助过的人物"
 trait_harbringersofskulls:0 "骸骨预告者"
 trait_harbringersofskulls_desc:0 ""
 trait_kinfolk:0 "兽嫡"
 trait_kinfolk_desc:0 "流有狼血，狼族的后裔。"
 trait_truefaith:0 "真信"
 trait_truefaith_desc:0 "这个角色真的信仰神的存在。这是他灵魂的核心部分，让他能够获得一些可能被称为非自然的能力。但是要注意，有罪的人最终会被剥夺他们神圣天赋。\n该特质解锁一颗新生活方式树。"
 trait_beatific:0 "荣福"
 trait_beatific_desc:0 "他是神的化身，是创造奇迹的人，是黑暗世界中信仰的真正典范。这让他获得了一些可能被称为非自然的能力。但是要注意，有罪的人最终会被剥夺他们神圣天赋。"
 trait_holy_seal:0 "神圣封印"
 trait_holy_seal_desc:0 "圣遗物和圣器残忍地，但却巧妙地嵌进了这个痛苦的个体的伤口，使其无法愈合。"
 trait_custom_bloodline:0 "自定义血系"
 trait_custom_bloodline_desc:0 "[cainites|E]的新生血系。尽管大多数血族都不将他们视同，但该血系已经准备好展示他人谁才是黑夜的真正统治者。"
 trait_leading_front:0 "领军于前"
 trait_leading_front_desc:0 "阿尔忒弥斯·欧西雅为每位梵卓提供了模范，有时杀进你的敌人可能比计谋和外交更好地解决问题"
 trait_hun_tactics:0 "狂野战术"
 trait_hun_tactics_desc:0 "玛塔孙塔为每位冈格罗提供了模范，对你野性的利用会帮助你赢得胜利"
 trait_swift_movement:0 "迅捷移动"
 trait_swift_movement_desc: "汉尼拔为每位布鲁赫提供了模范，要知兵贵神速"
 trait_samiel_follower:0 "萨麦尔的追随者"
 trait_samiel_follower_desc:0 "萨麦尔为每位萨洛比提供了模范，即使你的运势不佳，也要打击邪恶，因为邪恶会在不经磨难的心灵中兴盛"
 trait_shadow_warrior:0 "受人敬畏"
 trait_shadow_warrior_desc:0 "贾迈勒为每位哈基姆圣裔提供了模范，如果他们在见到你之前就害怕你的行为，那战斗就已经赢了"
 trait_faithful_warrior:0 "虔信战士"
 trait_faithful_warrior_desc:0 "塔利克为每位诺斯费拉图提供了模范，为信仰而战是一项崇高的功业"
 trait_shadow_reconquista_warrior:0 "暗影作战"
 trait_shadow_reconquista_warrior_desc:0 "西尔维斯特·德·鲁伊斯为每位勒森魃提供了模范，要知战争中兵不厌诈"
 trait_caitiff_warrior:0 "劣族战士"
 trait_caitiff_warrior_desc:0 "劣族在这个阴暗的世界里是孤独的，所以他们学会了如何在战斗中保护自己。"
 trait_salubri_healer:0 "萨洛比医者"
 trait_salubri_healer_desc:0 "医者种姓，组成了“普通”血系的大部分，他们的目的是执行治疗和教导[golconda|E]。"
 trait_salubri_warrior:0 "萨洛比武者"
 trait_salubri_warrior_desc:0 "武者种姓，由萨麦尔于巴力大战中建立。武者是流浪者，总是寻找着摧毁无论在何处滋生的邪恶。每位武者种姓的成员都会在引导仪式后获得一个天使名。"
 trait_salubri_watcher:0 "萨洛比观者"
 trait_salubri_watcher_desc:0 "观者种姓，由扫罗于东方之旅中建立。学者和盗贼，观者担当着其他萨洛比的保护者，保护他们不受那些否认他们存在和获得救赎的权利的人的伤害。"
 trait_teachings:0 "查古拉普夏的教导"
 trait_teachings_desc:0 "查古拉普夏为每位雷伏诺提供了模范，做一个好将军比做一个好战士更有用"
 trait_orison_compass:0 "道德罗盘"
 trait_orison_compass_desc:0 "这个人物无法忽视罪，甚至连他自己的罪也不能忽视。关于其周围的人对天主的过犯有多么严重，他有着近乎无懈可击的感觉。"
 trait_orison_innocent:0 "真纯真者"
 trait_orison_innocent_desc:0 "该角色是毫无污染的，是我们这个时代的黑暗中最纯洁的灯塔。"
 trait_orison_noah:0 "诺亚的宠爱"
 trait_orison_noah_desc:0 "该个体拥有一种独特的品质，可以抚慰自然界所有动物的心灵和脾气。"
 trait_orison_vigilance:0 "警惕之眼"
 trait_orison_vigilance_desc:0 "该角色需要的睡眠时间比一般人少得多，而且比其他人更容易从睡眠中被唤醒。"
 trait_orison_penitent:0 "忏悔者"
 trait_orison_penitent_desc:0 "只要知道自己在天主的计划中的位置，一个简单的人往往就能比最强大的君王或最博学的学者更理解这个浩瀚广阔的世界。"
 trait_orison_years:0 "岁月的祝福"
 trait_orison_years_desc:0 "该角色的头脑具有超越其年龄的智慧，而且具有相当轻松掌握新概念的能力。"
 trait_orison_hierophant:0 "圣显者"
 trait_orison_hierophant_desc:0 "还角色是优雅从容和泰然自若的典范，即使是在死亡的阴影下行走，也是如此。"
 trait_orison_sanguine:0 "血染圣歌"
 trait_orison_sanguine_desc:0 "该角色的信仰流淌在他们的血液中，使之成为对一切不洁之物的剧毒。"
 trait_orison_talespinner:0 "叙事者"
 trait_orison_talespinner_desc:0 "该个体对传播天主的话语有着天生的热忱和感染力。"
 trait_oculi_shepherd:0 "天国牧者"
 trait_oculi_shepherd_desc:0 "允许天主之眼在做天国之事时在众目之下隐藏。"
 trait_oculi_sight:0 "预见之力"
 trait_oculi_sight_desc:0 "允许裁判官通过该视觉看穿超自然生物，不管他们有多努力的去避免被观察。"
 trait_oculi_liturgy:0 "神圣礼拜"
 trait_oculi_liturgy_desc:0 "通过诵读经文，天主之眼可以把自己对功业的奉献强加给另一个人。"
 trait_oculi_trust:0 "吾相信汝"
 trait_oculi_trust_desc:0 "通过赞美天主，代理人可以将其对祂和祂的律法的爱注入他人。"
 trait_oculi_wine:0 "化水为酒"
 trait_oculi_wine_desc:0 "裁判官可以将一个普通的物体转化为其他的东西，或者将死亡或垂死的组织恢复到健康状态。"
 trait_acre_catechumen:0 "教理讲授"
 trait_acre_catechumen_desc:0 "允许裁判官在英勇、谦逊和恒心方面的早期教训中起到示范作用。"
 trait_acre_flesh:0 "显圣容之体"
 trait_acre_flesh_desc:0 "通过传唤他不可动摇的美德，骑士被赋予了改变自己身体能力的力量。"
 trait_acre_flight:0 "天使飞行"
 trait_acre_flight_desc:0 "允许裁判官在与对手的下仆战斗时获得神助旋风。"
 trait_acre_resurrection:0 "复生之灵"
 trait_acre_resurrection_desc:0 "有些骑士被神圣地赋予了控制自己和他人体内生命力起伏的力量。"
 trait_acre_auto:0 "信仰审判"
 trait_acre_auto_desc:0 "把自己的美德和力量集中为一发极强的打击。"
 trait_murnau_knowledge:0 "禁忌知识"
 trait_murnau_knowledge_desc:0 "与生俱来的熟稔和感知各种腐化的能力。"
 trait_murnau_oblige:0 "贵族规范"
 trait_murnau_oblige_desc:0 "激励他人的高贵。"
 trait_murnau_wreathed:0 "阴影环绕"
 trait_murnau_wreathed_desc:0 "掌握了穆尔瑙一族本性中的黑暗面，让其影响他人。"
 trait_murnau_mirror:0 "邪恶之镜"
 trait_murnau_mirror_desc:0 "能够以实力和知识为武器，在地面上迎战超自然的对手。"
 trait_murnau_arcana:0 "奥秘"
 trait_murnau_arcana_desc:0 "能够阻碍、转移或避开地狱衍体的行动。"
 trait_sisters_gospel:0 "福音"
 trait_sisters_gospel_desc:0 "赋予修女们高超的辩论、演说技巧，必要时还能进行审讯。"
 trait_sisters_lux:0 "要有光"
 trait_sisters_lux_desc:0 "呼应父的话，裁判官声明“要有光！”。"
 trait_sisters_chorale:0 "众赞歌"
 trait_sisters_chorale_desc:0 "从共唱中汲取力量、知识或保护。"
 trait_sisters_hosanna:0 "和散那"
 trait_sisters_hosanna_desc:0 "调入天歌，以自己的灵音影响死物。"
 trait_sisters_oratorio:0 "圣乐"
 trait_sisters_oratorio_desc:0 "让修女在歌声中发挥她的声音，让听众充满她的信仰的灿烂光辉，这对原罪之奴来说是一种毁灭性的体验。"
 trait_red_vigil:0 "蒙福警戒"
 trait_red_vigil_desc:0 "该仪式为主体提供了能量，缓解了他们对睡眠或休息的需求。"
 trait_red_sunstone:0 "太阳石"
 trait_red_sunstone_desc:0 "为一块普通的石头注入主的首创之物——太阳的祝福。"
 trait_red_march:0 "强行军"
 trait_red_march_desc:0 "该仪式允许了不顾疲劳和困难条件的迅速前行。"
 trait_red_fortunes:0 "战争之运"
 trait_red_fortunes_desc:0 "通过这个神圣的仪式，修行者可以祝福一群前往于敌人战斗的武装战斗人员。"
 trait_red_forge:0 "神之锻造"
 trait_red_forge_desc:0 "将锻造武器的过程神圣化，生产出蒙福的武器。"
 trait_yin_imbalanced:0 "阴盛阳衰"
 trait_yin_imbalanced_desc:0 "你是阴影与死亡的造物。"
 trait_yinyang_balanced:0 "阴阳平衡"
 trait_yinyang_balanced_desc:0 "你协调着你的气中对立的元素。"
 trait_yang_imbalanced:0 "阳盛阴衰"
 trait_yang_imbalanced_desc:0 "你投向光明与生命。"
 trait_dharma10:0 "十阶心法"
 trait_dharma10_desc:0 "彻悟心法，云开雾散，得道飞升。"
 trait_dharma10_stayed_desc:0 "被称作罗汉，是抵达到了苦海的尽头，已然大彻大悟者。大多数都毫不留念地飞升了，但这位却任在凡间徘徊。"
 trait_dharma9:0 "九阶心法"
 trait_dharma9_desc:0 "达到心法最后阶段的人被称为菩萨，到达这个阶段通常要花上一千年。并已然能够从环境吸取气。"
 trait_dharma8:0 "八阶心法"
 trait_dharma8_desc:0 "大多数老祖的境界，通常抵达这个阶段需要五百年。并已然能够从环境吸取气。"
 trait_dharma7:0 "七阶心法"
 trait_dharma7_desc:0 "大多数担任着上官（印度鬼人则称婆罗门），成为老祖的最低要求，通常抵达这个阶段需要二百五十年。并已然能够从环境吸取气。"
 trait_dharma6:0 "六阶心法"
 trait_dharma6_desc:0 "大多数担任着耆那（印度鬼人则称刹帝利）或上官（印度鬼人则称婆罗门），通常抵达这个阶段需要一百年。并已然能够从环境吸取气。"
 trait_dharma5:0 "五阶心法"
 trait_dharma5_desc:0 "大多数担任着着耆那（印度鬼人则称刹帝利）的角色，通常需要二十五年来达成这个阶段。并开始能够从吐息吸取气。"
 trait_dharma4:0 "四阶心法"
 trait_dharma4_desc:0 "大多数担任着耆那（印度鬼人则称刹帝利）的角色，通常需要五年来达成这个阶段。并只能够从血液吸取气。"
 trait_dharma3:0 "三阶心法"
 trait_dharma3_desc:0 "心法不得道的弟子（印度鬼人则称吠舍），通常要花三年来到达该阶段。并只能够从血液吸取气。"
 trait_dharma2:0 "二阶心法"
 trait_dharma2_desc:0 "心法不得道的弟子（印度鬼人则称吠舍），通常要花一年来到达该阶段。并只能够从血液吸取气。"
 trait_dharma1:0 "一阶心法"
 trait_dharma1_desc:0 "心法不得道的弟子（印度鬼人则称吠舍）。只能够从血液吸取气。"
 trait_dharma0:0 "零阶心法"
 trait_dharma0_desc:0 "䰢（印度鬼人则称首陀罗），那些摆脱魑魅阶段，但还没有成为鬼人社会的一份子所扮演的角色。"
 trait_chihmei:0 "魑魅"
 trait_chihmei_desc:0 "一只被对气的渴望所支配的没有理智的生物，只能依靠吞噬血肉汲气。一个堕落成魑魅的角色是不能被玩家扮演。"
 trait_chihmei_dharma_desc:0 "通过一个仪式，魑魅能恢复心法的平衡与智慧，唤醒他们的更高意识（神魂）并成为追随心法的有价值的不死者。"
 trait_shih:0 "士"
 trait_shih_desc:0 "根据传说，士起源于商朝的羿。这些猎人在黑暗中踽踽独行，只靠双手的力量和自己的意志来对抗无量地狱的力量。数千年前，士最先挺身而出与鬼神作战。虽然士那威武的主家已不复存在，但他们的传统仍在延续，他们的起源也是最崇敬的故事之一。"
 trait_little_death:0 "小死"
 trait_little_death_desc:0 "角色的躯体“死去”，但体内的魂魄依然躁动不休。万鬼畏惧小死，因在此期间其等会陷入层层幻象和噩梦，其等的灵对那些恶意的法术将十分脆弱。"
 trait_ha_holy_bulwark:0 "神圣坚垒"
 trait_ha_holy_bulwark_desc:0 "该角色无法被血缚。"
 trait_demonic_plague:0 "魔疫"
 trait_demonic_plague_desc:0 "源自特别邪恶的诅咒，魔疫是一种高度传染又高度致命的疾病，对血族的影响和对凡人的影响一样大。更糟糕的是，这种疾病使吸血鬼无法以任何方式自愈，并且随着肉体的自我撕裂而导致伤口逐渐恶化。"
 trait_demonic_plague_non_infectious:0 "魔疫"
 trait_demonic_plague_non_infectious_desc:0 "源自特别邪恶的诅咒，魔疫是一种高度致命的疾病，对血族的影响和对凡人的影响一样大。更糟糕的是，这种疾病使吸血鬼无法以任何方式自愈，并且随着肉体的自我撕裂而导致伤口逐渐恶化。"
 trait_demonic_plague_non_lethal:0 "魔疫"
 trait_demonic_plague_non_lethal_desc:0 "源自特别邪恶的诅咒，魔疫是一种高度传染的疾病，对血族的影响和对凡人的影响一样大。更糟糕的是，这种疾病使吸血鬼无法以任何方式自愈。"
 trait_demonic_plague_non_lethal_and_infectious:0 "魔疫"
 trait_demonic_plague_non_lethal_and_infectious_desc:0 "源自特别邪恶的诅咒，魔疫对血族的影响和对凡人的影响一样大。更糟糕的是，这种疾病使吸血鬼无法以任何方式自愈。"
 trait_vampire_smallpox:0 "吸血鬼天花"
 trait_vampire_bubonic_plague:0 "吸血鬼腺鼠疫"
 trait_vampire_typhus:0 "吸血鬼伤寒"
 trait_vampire_cancer:0 "吸血鬼癌症"
 trait_vampire_consumption:0 "吸血鬼肺痨"
 trait_vampire_gout_ridden:0 "吸血鬼痛风"
 trait_vampire_pneumonic:0 "吸血鬼肺炎"
 trait_vampire_great_pox:0 "吸血鬼梅毒"
 trait_vampire_leper:0 "吸血鬼麻风病"
 trait_vampire_ill:0 "患吸血鬼病"
 trait_akuma:0 "恶鬼"
 trait_akuma_desc:0 "恶鬼，或魔食者，背弃了美德并与阎魔同流合污。"
 trait_mummy:0 "木乃伊"
 trait_mummy_desc:0 "木乃伊，也被称为不朽者或重生者，是身体被仪式性地升华的永生者。"
 trait_wutian:0 "天宗"
 trait_wutian_desc:0 "天宗原本是圣人的弟子，其等从八仙处受赐了长生不老药，以回报他们对天道的永恒服务。"
 trait_wukuei:0 "诡宗"
 trait_wukuei_desc:0 "诡宗是归属幽冥的永生者，是在[sixth_age|E]来临之际为了自保而将自己的灵魂出卖给地狱的叛逆天宗。"
 trait_shemsuheru:0 "贤荷鲁"
 trait_shemsuheru_desc:0 "必须先有来者，而在永生者中，这一荣誉被赋予了贤荷鲁，荷鲁斯的朋友或同伴。他们由伊西斯和她的姐妹创造，最初是为了跟随和服务她的儿子荷鲁斯，他们是世界上最古老的不朽者。"
 trait_effigy:0 "俑像"
 trait_effigy_desc:0 "能够执行简单任务的小雕像。"
 trait_deactivated:0 "关停"
 trait_deactivated_desc:0 "被关停，不再耗费它们的制造者的能量。"
 trait_banemummy:0 "忌灵木乃伊"
 trait_banemummy_desc:0 "忌灵木乃伊，也被称阿佩普派，是受赛特本人没有完整理解而因此腐化的生命神咒创造的不祥木乃伊。"
 trait_cabiri:0 "卡比里"
 trait_cabiri_desc:0 "卡比里人是不朽者宗族之一，他们不起源于埃及，而是起源于希腊，他们与阿波菲斯和玛阿特之间的斗争几乎没有任何联系。"
 trait_immortal:0 "永生"
 trait_immortal_desc:0 "通过某种魔法手段，该角色不会再自然死亡。"
 trait_risen:0 "返生者"
 trait_risen_desc:0 "一位设法回到其尸体，在[skinlands|E]的活人中行走的死灵。"
 trait_spectre:0 "怨灵"
 trait_spectre_desc:0 "怨灵是屈服于其黯影的死灵。当灵魂积累了太多的黑暗情绪，它的黯影就会永久性地接管其，使成为怨灵。"
 trait_dhampyr:0 "半鬼人"
 trait_dhampyr_desc:0 "半鬼人，也被称作渊影行者或暮光之子，乃是鬼人所生的子嗣。"
 trait_vampgeneration16_desc_no_collide:0 "在某些方面，“淡血种”只勉强算是吸血鬼。该隐的诅咒在他们身上被淡化了，以至于他们只表现出前代同族的部分传统优势和弱点。"
 trait_slumber:0 "安息"
 trait_slumber_desc:0 "死灵用来自愈的深度沉眠。"
 trait_arcanos_castigate:0 "呵斥"
 trait_arcanos_castigate_desc:0 "呵斥的施展者可以操纵和控制死灵的黯影。"
 trait_arcanos_embody:0 "具象"
 trait_arcanos_embody_desc:0 "具象的施展者可以在物质世界中显现，在适当的情况下，可以作为一位活人出没。"
 trait_arcanos_fatalism:0 "宿命"
 trait_arcanos_fatalism_desc:0 "拥有宿命天赋的人能够看到另一个人的过去或未来，并读懂一位死灵的最终命运。"
 trait_arcanos_flux:0 "熔炼"
 trait_arcanos_flux_desc:0 "熔炼影响[skinlands|E]的物质结构和反应，也影响死灵遗物的运作。"
 trait_arcanos_inhabit:0 "栖身"
 trait_arcanos_inhabit_desc:0 "拥有栖身天赋的死灵可以操纵和控制无生命物体。"
 trait_arcanos_intimation:0 "暗示"
 trait_arcanos_intimation_desc:0 "暗示的施展者可以调整其他死灵的欲望和愿望。"
 trait_arcanos_keening:0 "哀歌"
 trait_arcanos_keening_desc:0 "那些能够使用哀歌技艺的人可以通过声音操纵情感。"
 trait_arcanos_lifeweb:0 "灵网"
 trait_arcanos_lifeweb_desc:0 "了解灵网的死灵可以用它来加强、削弱或看管[Fetters|E]。"
 trait_arcanos_mnemosynis:0 "识记"
 trait_arcanos_mnemosynis_desc:0 "识记的施展者可以追踪和阅读他人的记忆。"
 trait_arcanos_moliate:0 "打磨"
 trait_arcanos_moliate_desc:0 "会打磨的死灵能够重塑自己和他人的[Corpus|E]，使之成为迷人的，又或是可怕的形态。"
 trait_arcanos_outrage:0 "暴行"
 trait_arcanos_outrage_desc:0 "暴行通过以强大力量的形式显现出死灵的意志，从而影响到[skinlands|E]。"
 trait_arcanos_pandemonium:0 "魔舞"
 trait_arcanos_pandemonium_desc:0 "使用该冥法的死灵可以利用混沌的力量在活人世界中制造祸乱。"
 trait_arcanos_phantasm:0 "幻梦"
 trait_arcanos_phantasm_desc:0 "使用幻梦能力的人可以操纵梦境和创造幻觉。"
 trait_arcanos_puppetry:0 "傀儡"
 trait_arcanos_puppetry_desc:0 "掌握傀儡的人可以控制生者的身体。"
 trait_arcanos_usury:0 "借贷"
 trait_arcanos_usury_desc:0 "掌握借贷的人可以交易死灵赖以生存的力量。"
 trait_arcanos_argos:0 "古舟"
 trait_arcanos_argos_desc:0 "古舟的施展者可以操纵[tempest|E]和在其中导航和旅行。"
 trait_arcanos_kinesis:0 "念力"
 trait_arcanos_kinesis_desc:0 "拥有念力天赋的死灵可以操纵和控制无生命物体。"
 trait_asekh_sen:0 "阿塞赫子民"
 trait_asekh_sen_desc:0 "并非是完全的不朽者，他们通常类似于被忌灵附身的游荡尸体，该活化的存在充满了对所有生命的愤怒仇恨。"
 trait_ghost:0 "幽灵"
 trait_ghost_desc:0 "还没有去往[underworld|E]的死者。"
 trait_caul:0 "胎膜"
 trait_caul_desc:0 "当生者死后，进入[underworld|E]时，身上会覆盖被称为胎膜的灵质茧。茧存在时，鬼婴处于平和、入梦般的状态，对周围的环境毫无感知。"
 trait_barghest:0 "犬魔"
 trait_barghest_desc:0 "犬魔，也叫寻血猎犬，是被畸形改造的死灵，通过在他们的[Corpus|E]身上嫁接特别准备好的冥铁口套进行了“脑叶切除”。"
 trait_ajaba:0 "阿迦巴"
 trait_ajaba_desc:0 "鬣狗人是盖亚在非洲的战士，非洲大陆没有狼的种群。虽然魂怒之战并未波及非洲，但阿迦巴却因内讧与芭丝特的敌对而几乎被摧毁。"
 trait_bastet:0 "芭丝特"
 trait_bastet_desc:0 "猫人有许多不同的部族，就像狼族一样，尽管每个部族都声称自己拥有不同种类的野猫。它们痴迷于秘密知识，一直在追寻和囤积这些知识。许多人是伟大的施法者，其他人则是伟大的战士，但他们很少是群居动物，一般都是单独行动。他们中的一些部族在魂怒之战中遭受了巨大的损失。"
 trait_psychic:0 "灵能者"
 trait_psychic_desc:0 "该角色拥有一种或多种灵能天赋（也被称为灵能现象或精神能力）。"
 trait_sorcerer:0 "术士"
 trait_sorceress:0 "女术士"
 trait_sorcerer_desc:0 "该角色掌握着民间魔法的诸线性道途。"
 trait_theurgist:0 "神通术师"
 trait_theurgist_desc:0 "该角色践行犹太神秘主义和密传基督教教义。"
 trait_lament:0 "哀恸"
 trait_lament_desc:0 "哀恸是一个人用来投射灵体的方式，决定了角色究竟是如何与鬼魂世界接触的。"
 trait_projector:0 "皮影"
 trait_projector_desc:0 "皮影是能通过这样或那样的方式，可以抛开他们的肉体，变身幽灵的活人。"
 trait_ferryman:0 "摆渡人"
 trait_ferryman_desc:0 "通过断绝仪式，该角色的黯影和真灵被永久分隔，化出了一个帕西淮。"
 trait_truefallen:0 "堕落者"
 trait_truefallen_desc:0 "附身了人类宿主的恶魔。"
 trait_earthbound:0 "地缚魔"
 trait_earthbound_desc:0 "恶魔是从天堂堕落的天民，是跟随路西法进行注定失败的叛乱的反叛天使。他们的真实形态不再持久，地缚魔恶魔大多被关在宿匣里，而少数恶魔则设法附身在地点之上。"
 trait_shapeshifter:0 "化兽族裔"
 trait_ha_patris_mastery:0 "神术精通：全知圣父"
 trait_ha_patris_mastery_desc:0 "“ 要在主面前谦卑，他就使你们高升”"
 trait_ha_filius_mastery:0 "神术精通：全能圣子"
 trait_ha_filius_mastery_desc:0 "“胜过世界的是谁呢？不是那信耶稣是神儿子的吗？”"
 trait_ha_spiritus_mastery:0 "神术精通：全善圣灵"
 trait_ha_spiritus_mastery_desc:0 "“我必将我的灵放在你们里面，使你们顺从我的律例，谨守遵行我的典章。”"
 trait_fomori:0 "堕妖"
 trait_bakemono:0 "化物"
 trait_fomori_desc:0 "该角色被忌灵所附身。"
 trait_drone:0 "机蜂"
 trait_drone_desc:0 "该角色被织者属灵类所附身。"
 trait_gorgon:0 "戈尔贡"
 trait_gorgon_desc:0 "该角色被奇原属灵类所附身。"
 trait_kami:0 "社神"
 trait_kami_desc:0 "该角色被盖亚属灵类所附身。"
 trait_shadow:0 "黯影"
 trait_shadow_desc:0 "黯影是一个术语，用来描述死灵人格中希望看到死灵失败、停止挣扎并屈服于湮灭的那一面。"
 trait_pasiphae:0 "帕西淮"
 trait_pasiphae_desc:0 "帕西淮，即所谓的湮灭摆渡人或[labyrinth|E]行者，经常被无知的地狱旅者和其他少数冒险进入[labyrinth|E]的愚昧的死灵误认为是影食者的将军。"
 trait_khaibit:0 "黑影"
 trait_khaibit_desc:0 "被木乃伊斩出体外作为一位仆从的黑影。"
 trait_methuselahs_thirst:0 "玛土撒拉的饥渴"
 trait_methuselahs_thirst_desc:0 "该角色不再能通过喝凡人的血来维持自己，不管血能如何。其都必须以其他血族的精血为食。"
 trait_methuselahs_thirst_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]不再能通过喝凡人的血来维持自己，不管[ROOT.GetCharacter.GetHerselfHimself]血能如何。[ROOT.GetCharacter.GetSheHe|U]都必须以其他血族的精血为食。"
 trait_laham:0 "拉罕"
 trait_laham_desc:0 "恶魔的后代。寿命长得惊人，完全不惧疼痛，而且往往拥有非人的力量。恶魔之子（或拉罕）据说是地狱的特殊仆人。"
 trait_nephilim:0 "拿非利人"
 trait_nephilim_desc:0 "恶魔与人类的后代。他们拥有人类的天赋和恶魔的[lore_lifestyle|E]，且非常可怕——如果不是因为他们狰狞的面容，就是因为他们的潜力。"
 trait_po:0 "魄"
 trait_po_desc:0 "灵魂中与物质方面有关的部分；通常被称为灵魂的“兽性”一面。"
 trait_kuei:0 "鬼"
 trait_kuei_desc:0 "鬼源自[dark_kingdom_of_jade|E]，是没有按照当地的适当仪式和传统进行埋葬的死灵。他们变成了，用一个恰当的术语来说，行走的黯影。这些死灵非常危险，漫无目的地在[shadowlands|E]游荡，像饥饿的动物猎取食物一样猎取执念。"
 trait_tremere_india:0 "睿米拉"
 trait_rune_wise:0 "符文师"
 trait_mind_master:0 "心智大师"
 trait_mind_master_desc:0 "这个角色掌控了心智领域。"
 trait_entropy_master:0 "熵之大师"
 trait_entropy_master_desc:0 "这个角色掌控了熵之领域。"
 trait_life_master:0 "生命大师"
 trait_life_master_desc:0 "这个角色掌控了生命领域。"
 trait_forces_master:0 "力场大师"
 trait_forces_master_desc:0 "这个角色掌控了力场领域。"
 trait_matter_master:0 "物质大师"
 trait_matter_master_desc:0 "这个角色掌控了物质领域。"
 trait_prime_master:0 "根源大师"
 trait_prime_master_desc:0 "这个角色掌控了根源领域。"
 trait_time_master:0 "时间大师"
 trait_time_master_desc:0 "这个角色掌控了时间领域。"
 trait_correspondence_master:0 "空间大师"
 trait_correspondence_master_desc:0 "这个角色掌控了空间领域。"
 trait_statue:0 "雕像"
 trait_statue_desc:0 "人工躯体。"
 trait_mind_master_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]掌控了心智领域。"
 trait_entropy_master_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]掌控了熵之领域。"
