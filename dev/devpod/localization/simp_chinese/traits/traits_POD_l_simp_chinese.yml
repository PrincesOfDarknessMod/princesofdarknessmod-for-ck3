 POD_years_to_lose_vitae_passively_age_above_200: "你的年龄超过#V 200#!岁"
 trait_ghoul_vitae_dependency_chance: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_chance_to_lose_vitae_passively')]"
 trait_ghoul_highest_vitae_ingested_desc: "#medium [ROOT.Char.GetFirstNamePossessiveNoTooltip][ghoul_greatest_vitae_ingested|E]的血质浓度为[GetTrait(Concatenate('vampgeneration',GetString_int32(FixedPointToInt(ROOT.Char.MakeScope.ScriptValue('POD_highest_generation_ingested_value'))))).GetName(GetNullCharacter)]，可解锁最高[ROOT.Char.MakeScope.ScriptValue('POD_allowed_discipline_level_for_ghouls_or_revenants')|V0]级的[Glossary('血律','game_concept_discipline_desc')][perks|E]。#!\n\n"
 trait_bound_ghoul_desc: "#medium [ROOT.Char.GetFirstNameNoTooltip] is the [bound_ghoul|E] of #V [GetScriptedGui('POD_show_ghoul_domitor').BuildTooltip(GuiScope.AddScope('ghoul',ROOT.Char.MakeScope).End)]#!.#!\n\n"
 trait_bound_masterless_ghoul_desc: "#medium [ROOT.Char.GetFirstNameNoTooltip]是一名[masterless_ghoul|E]#!\n\n"
 trait_sielanic_thaumaturgy: "瑟拉尼克奇术"
 trait_sielanic_thaumaturgyadvanced: "高阶瑟拉尼克奇术"
 trait_sielanic_thaumaturgy_desc: "$bloodmagic_paths_display$\n\n瑟拉尼克奇术是受原始神祇特亚维的启发，由特亚维派睿魔尔——一只源自立陶宛的睿魔尔血系所掌握的一种奇术。\n\n特亚维派学会了利用瑟拉的力量，瑟拉是潜伏在他们所居住的土地、石头、植物和动物中的万物之灵。"
 trait_demonology_desc: "该角色知道关于恶魔的基本常识和他们的一些更不寻常的能力。该角色可能可以完成一次召唤，并且可能观察过甚至协助过一次召唤，但进行束缚则是另一回事……"
 trait_demonology_xp: "#medium;italic 每年被动获得[ROOT.Char.MakeScope.ScriptValue('POD_yearly_demonology_xp_gain')|V]点[trait_level_track_xp|E]：#!\n[ROOT.Char.MakeScope.GetScriptValueDesc('POD_yearly_demonology_xp_gain')]\n"
 trait_track_demonology: "恶魔学家"
 trait_track_demonology_desc: "#italic 研究恶魔的人。恶魔学家对恶魔在神学、神秘学或科学上的构成感兴趣，不一定打算召唤恶魔或与恶魔直接互动。然而，当好奇心或对力量的渴求变得不可遏制时，恶魔学就会成为#TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L 崇魔#!#!活动的跳板。#!"
 TRAIT_FLAG_DESC_demonology_unlocks_pacts: "允许签订$POD_splat_demon_plural$[demonic_pacts|E]:#P 是#!。"
 TRAIT_FLAG_DESC_demonology_xp_gain_decision: "允许通过[GetModifier('POD_focus_on_demonology_modifier').GetNameWithTooltip][decision|E]:#P 是#!"
 trait_ravnos_erk: "厄克"
 trait_ravnos_erk_desc: "一支盘踞在中亚草原、领地意识极强且纪律严明的血系。与他们居无定所的氏族不同，厄克的根基深深扎在自己的领地之中。他们发源于蕴藏铁矿、与世隔绝的额尔古涅·昆山谷，是一群务实的求生者，尤其擅长领地治理与后勤统筹。"
 trait_POD_grail_knight: "圣杯骑士"
 TRAIT_FLAG_DESC_stronger_ghouls_flag: "[ghouls|E]变得[GetTrait('physique_good_1').GetName(GetNullCharacter)]获得更多[prowess|E]"
 TRAIT_FLAG_DESC_order_bitter_ashes_maa_flag: "可以招募[GetMaA('order_bitter_ashes_maa').GetName][men_at_arms|E]"
 trait_POD_grail_knight_desc: "这名$POD_splat_vampire$曾饮用怨烬之杯且得以幸存。每位圣杯骑士在完成仪式时，皆会见证独一无二的幻视、觉醒截然不同的力量。无论过程如何，他们如今已跻身真正受赐福者的行列。"
 trait_nosferatu_mnemachien: "Mnemachien"
 trait_nosferatu_mnemachien_desc: "#medium $glossary_clan_curse$: Always [GetTrait('predatortype_consensualist').GetName(GetNullCharacter)]#!\n\nOriginating from the druidess Mnemach, the Mnemachiens use their strengths to keep a principle of balance with humankind."
 trait_baali_ennamaru: "恩那玛鲁之子"
 trait_baali_ennamaru_desc: "Descending from the mysterious Methuselah Nekys, the Children of Ennamaru are skilled manipulators who delight in psychologically torturing their targets."
 trait_toreador_volgirre: "伏尔杰"
 trait_toreador_volgirre_desc: "The darkly beautiful Volgirre are experts in the blackest pursuits of art, employing [GetTrait('vicissitude').GetName(GetNullCharacter)] to produce twisted and horrific works of repugnant beauty."
 trait_mindless_clone: "复制体"
 trait_mindless_clone_desc: "A facsimile of another being, animated through some form of magic. It cannot act independently."
 trait_shadow_twin: "暗影分身"
 trait_mirror_duplicate: "镜像倒影"
 trait_shadowy_duplicate: "暗影复制体"
 trait_phantom_shadow: "幻影"
 trait_separated_khaibit: "分离黑影"
 trait_separated_shadow: "Separated Shadow"
 trait_shadow_self: "黯影自我"
 trait_pilgrim_of_enoch: "Pilgrim of Enoch"
 trait_pilgrim_of_enoch_desc: "A [GetTrait('nagaraja').GetName(GetNullCharacter)] who has made the perilous journey to the ghost-city of Enoch in the [UmbraGlossaryLocalized('shadowlands','Underworld')] and returned with forbidden knowledge of the dead."
 trait_pilgrim_of_enoch_character_desc: "[ROOT.Char.GetFirstNameNoTooltip]'s pilgrimage to the ghost-city of Enoch has granted [ROOT.Char.GetHerHim] insight into the deepest mysteries of Necromancy."
 trait_itarajana_sorcerer: "Itarajana Sorcerer"
 trait_itarajana_sorcerer_desc: "A practitioner of Itarajana, a form of blood sorcery native to the Indian subcontinent that draws upon Hindu mystical traditions."