 trait_track_demonologist: "恶魔学家"
 trait_track_demonologist_desc: "#bold 等级3：#!允许放逐恶魔角色到[abyss|E]。\n#italic 研究恶魔的人。恶魔学家对恶魔在神学、神秘学或科学上的构成感兴趣，不一定打算召唤恶魔或与恶魔直接互动。然而，当好奇心或对力量的渴求变得不可遏制时，恶魔学就会成为唤魔活动的跳板。#!"
 trait_track_diabolist: "唤魔者"
 trait_track_diabolist_desc: "#bold 等级2：#!允许献祭囚犯来获得[investiture_lifestyle|E]经验。\n#bold 等级4：#!允许向大恶魔献祭以获得祝福。\n#italic 召唤恶魔并试图控制它们的人。这个词也适用于信仰恶魔的人。唤魔者通常有很强的恶魔学认知，但也不一定，尽管在没有适当的知识来进行束缚，就试图召唤一位强大的恶魔可能会有致命的结果。#!"
 trait_track_thrall: "魔奴"
 trait_track_thrall_desc: "#bold 等级2：#!允许献祭囚犯来获得[arcana_lifestyle|E]经验。\n#bold 等级4：#!允许将恶魔从[abyss|E]中召唤到一个容器中。\n#italic 通过与某一特定恶魔直接签订契约而为恶魔服务的人。魔奴不需要是恶魔学家，也很少有任何关于恶魔学的知识，尽管他可能很快就对恶魔的本质有了亲密的、第一手的了解。#!"
 TRAIT_FLAG_DESC_can_hurt_spirit: "能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。"
 trait_corax: "科拉克斯"
 trait_corax_desc: "渡鸦人是盖亚的信使、间谍和侦察兵，它们在天空中巡逻，时刻警惕着危险。它们是糟糕的话匣子，会把自己看到的一切告诉任何愿意倾听的人。在魂怒之战中，他们通过帮助狼族躲过了迫害，并与狼人保持着在所有化兽族裔中与其最友好的关系。"
 trait_gurahl: "古拉赫勒"
 trait_gurahl_desc: "熊人是盖亚的治疗师，他们与地球的联系比任何其他化兽族裔都更加紧密。许多狼族相信古拉赫勒已经灭绝，他们在魂怒之争中被杀死，因为他们不愿意放弃让死者恢复生命的秘密。"
 trait_kitsune: "狐妖"
 trait_kitsune_desc: "狐人是施法者和政治家，维系着亚洲化形者社会。在化兽族裔中，狐人是唯独只出现在中原的兽庭中的，主要生活在中国和日本。在露娜的庇佑下，狐妖还充当凡人社会中腐败当局的刺客，充当宫廷施法者和盗贼，以保护天命。"
 trait_mokole: "莫科莱"
 trait_mokole_desc: "鳄鱼人还记得龙王时代，那时可怕的爬行动物统治着地球。它们记得曾经发生过的一切，但对此保密，只对尊敬的人说。与鳄鱼相比，它们的战争形态更像恐龙或龙，因此有时也被称为龙人。"
 trait_nagah: "娜迦"
 trait_nagah_desc: "蛇人起源于印度。大多数（如果不是全部的话）其他化形族裔都认为它们已经死亡，但它们却依然存在。作为“盖亚的审判者”，娜迦既是无声的审判者，也是化形种族的隐藏刽子手。"
 trait_nuwisha: "努维狭"
 trait_nuwisha_desc: "郊狼人是盖亚的教师，不过和它们的图腾——老郊狼神——一样，它们更喜欢通过恶作剧来传授知识。由于对露娜的恶作剧，它们不再拥有魂怒，尽管它们比其他化兽族裔更亲近[umbra|E]。"
 trait_ratkin: "鼠族"
 trait_ratkin_desc: "鼠人曾经监护着人类，防止他们的数量变得过多。然而，狼族篡夺了这一身份，从那时起，鼠族就开始憎恨狼族。他们坚定地为奇原而战，并利用一切机会破坏科技。"
 trait_rokea: "罗基阿"
 trait_rokea_desc: "即使是大海也有它的保护者。鲨鱼人在海洋深处巡逻，很少被陆地居民看到。"
 trait_apis: "阿皮斯"
 trait_apis_desc: "原牛人或月牛，阿皮斯人负责种植和农业，被称为“盖亚的媒人”。他们在魂怒之战中被狼族赶尽杀绝。"
 trait_camazotz: "卡玛佐兹"
 trait_camazotz_desc: "卡玛佐兹是蝙蝠人，盖亚的夜间和南半球的信使，与科拉克斯相对应。"
 trait_grondr: "格隆迪尔"
 trait_grondr_desc: "野猪人位于北欧。他们的使命是清洁土地，被称为盖亚的美容师。在魂怒之战期间，他们被狼族赶尽杀绝；他们的祖灵落入了妖蛆之手，使其等成了畸形的骸猪。"
 trait_coccon: "魔茧"
 trait_coccon_desc: "角色将自己包裹在坚硬的茧壳中，同时她的新陈代谢减慢到近乎没有的状态。"
 trait_long_sleep: "长眠"
 trait_long_sleep_desc: "一种与熊的自然冬眠差不多的活动中止状态。"
