 trait_track_psychic: "灵能熟练度"
 trait_track_psychic_desc: "#bold 每一级增加灵能能力的成功概率#P 10#!#!\n灵能能力很难使用，尤其是对付超自然。但就像生活中的任何事情一样，对灵能的精通也可以通过掌握基础知识和积累经验来获得。"
 trait_judge_of_maat: "玛阿特的判官"
 trait_judge_of_maat_desc: "玛阿特的判官是一群执行玛阿特的法则的生物，当木乃伊死亡并回到阿努比斯身边时，阿努比斯引导他们走向判官，他们会判断木乃伊的平衡进展。"
 TRAIT_FLAG_DESC_access_to_charms: "解锁[charms_lifestyle|E]"
 TRAIT_FLAG_DESC_access_to_planetarygifts: "解锁[planetarygifts_lifestyle|E]"
 trait_truefaith_character_desc: "[ROOT.Char.GetFirstNameNoTooltip]真的信仰神的存在。[true_faith|E]是[ROOT.Char.GetHerHis]灵魂的核心部分，让[ROOT.Char.GetHerHim]能够获得一些可能被称为非自然的能力。但是要注意，有罪的人最终会被剥夺其神圣天赋。\n该特质将解锁一条新的生活方式。"
 trait_beatific_character_desc: "[ROOT.Char.GetFirstNameNoTooltip]是[ROOT.Char.GetHerHis]神的化身，是创造奇迹的人，是黑暗世界中[true_faith|E]的典范。这让[ROOT.Char.GetHerHim]获得了一些可能被称为非自然的能力。但是要注意，有罪的人最终会被剥夺其神圣天赋。"
 trait_use_ingame_chargen: "使用模组的背景生成器"
 trait_use_ingame_chargen_desc: "推荐新玩家使用\n\n进入游戏后，你将经过一系列事件来选择[splat|E]和各种超自然特质，且修正将自动设定。"
 trait_bloodsorcery_character_desc: "$bloodmagic_paths_display$\n\n$trait_bloodsorcery_desc$"
 bloodmagic_paths_display: "#medium [ROOT.Char.GetFirstNameNoTooltip]知晓以下[bs_traditions|E]：[AddTextIf(GetScriptedGui('has_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tremere_icon! Thaumaturgy')][AddTextIf(GetScriptedGui('has_dur_an_ki_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@assamite_icon! Dur-An-Ki')][AddTextIf(GetScriptedGui('has_akhu_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@setite_icon! Akhu')][AddTextIf(GetScriptedGui('has_sadhana_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@ravnos_icon! Sadhana')][AddTextIf(GetScriptedGui('has_koldunic_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tzimisce_icon! Koldunic')]#!"
 trait_koldunicsorcery: "库都术法"
 trait_koldunicsorcery_desc: "$bloodmagic_paths_display$\n\n库都术法或库都术是棘秘魑掌握的一种[cainite|E][bloodsorcery|E]。\n\n库都术法从概念上来说类似于奇术，但实际应用却天差地别。"
 trait_azhi_dahaka_scholar: "易变涅槃研习者"
 trait_azhi_dahaka_scholar_desc: "该角色希望深入了解阿兹·达哈卡，这是一种终极开悟境界，可能是通过广泛使用易变术这一血律带来的。"
 trait_azhi_dahaka_scholar_character_desc: "[ROOT.Char.GetFirstNameNoTooltip]希望深入了解阿兹·达哈卡，这是一种终极开悟境界，可能是通过广泛使用易变术这一血律带来的。"
 trait_track_azhi_dahaka_scholar: "蜕变"
 trait_track_azhi_dahaka_scholar_desc: "\n你的[trait_level_track_xp|E]，显示[GetTrait('azhi_dahaka').GetName(GetNullCharacter)][journey|E]最后阶段的成功率。"
 trait_azhi_dahaka: "易变涅槃"
 trait_azhi_dahaka_desc: "阿兹·达哈卡是棘秘魑氏族的吸血鬼用来描述一种开悟和终极存在状态的术语，可能通过大量使用易变术血律来实现。"
 trait_azhi_dahaka_character_desc: "$trait_azhi_dahaka_desc$\n\n摒弃了[ROOT.Char.GetHerHis]人性的最后一丝残余，[ROOT.Char.GetFirstNameNoTooltip]成为了真正可怕的存在：龙中之龙。"
 TRAIT_FLAG_DESC_infinite_blood_flag: "无尽血液"