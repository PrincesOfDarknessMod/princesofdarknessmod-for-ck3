 trait_track_kitsune: "尾巴"
 trait_track_kitsune_desc: "#bold 等级5：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级6：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级7：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级8：#![umbra_aptitude|E]：[grace_i]#P +25%#!\n#bold 等级9：#![umbra_aptitude|E]：[grace_i]#P +35%#!\n#italic 狐妖一开始都只有一条尾巴。盖亚会在它们的等级提升时额外增加一条尾巴。拥有九条尾巴的狐妖可以永生，并因其力量和美德而备受尊敬。#!"
 trait_spirit: "灵"
 trait_spirit_desc: "灵类是一种无肉体的虚体，起源于并通常居住在[umbra|E]中——由于这个原因，一些法师称它们为“影族”。"
 TRAIT_FLAG_DESC_umbra_aptitude_10: "[umbra_aptitude|E]：[grace_i]#P +50%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_9: "[umbra_aptitude|E]：[grace_i]#P +45%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_8: "[umbra_aptitude|E]：[grace_i]#P +40%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_7: "[umbra_aptitude|E]：[grace_i]#P +35%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_6: "[umbra_aptitude|E]：[grace_i]#P +30%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_5: "[umbra_aptitude|E]：[grace_i]#P +25%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_4: "[umbra_aptitude|E]：[grace_i]#P +20%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_3: "[umbra_aptitude|E]：[grace_i]#P +15%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_2: "[umbra_aptitude|E]：[grace_i]#P +10%#!"
 TRAIT_FLAG_DESC_umbra_aptitude_1: "[umbra_aptitude|E]：[grace_i]#P +5%#!"
 trait_track_demon: "[torment|E]"
 trait_track_demon_desc: "#I 参见[torment|E]用以知晓如何降低它。#!\n每级导致宿体死亡概率：#N +1%#!（[GetTrait('earthbound').GetName( GetNullCharacter )]则为#N +10%#!）\n#italic 磨难衡量一位恶魔相比上帝的正确意图堕落到什么程度，以及罪孽对它的诅咒有多可怕。#!"
 trait_alien: "外星人"
 trait_alien_desc: "地外生命。"
 trait_chulorviah: "克苏洛夫亚"
 trait_chulorviah_desc: "克苏洛夫亚也被称为深渊种群或克拉肯裔，是一种奇怪的影界生物，其行为类似于疾病。"
 HAS_TRAIT_WITH_IS_SPIRIT_FLAG_TRIGGER: "是灵体，无法被监禁、折磨、处决或在[single_combat_duel|E]中通过物理招式伤害"
