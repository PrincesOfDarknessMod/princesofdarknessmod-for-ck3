 trait_golden_children: "金童"
 trait_golden_children_desc: "黄金之子（或称金童）曾是传说中万仙那些受灵性祝福的后代。当他们还是凡人时，他们是人民的英雄，直到被他们堕落的$pod_kueijin$父母屠杀，并被贬低至半鬼人的状态。"
 trait_mod_guardian: "模组守护者"
 trait_mod_guardian_desc: "[ROOT.Char.GetFirstNameNoTooltip]必须存在才能使本模组中的某些脚本正常工作。如果你在宫廷中看到[ROOT.Char.GetHerHim]，只需微笑并挥手。[ROOT.Char.GetSheHe|U]很快就会消失。"
 trait_angered_malkav: "激怒的疯网"
 trait_angered_malkav_desc: "你激怒了疯网以及所有与之相关的人。有人说你甚至激怒了网络内部的某些事物或某个人。你已经能感觉到它那数不清的爪子正刺入你的脑海。"
 TRAIT_FLAG_DESC_unlock_vozhd: "可以招募[GetMaA('vozhd').GetName]作为[men_at_arms|E]。"
 trait_entoban_plague: "虫祸瘟"
 trait_entoban_plague_desc: "一种非常致命的古老疾病已冲破在非洲将其禁锢的防护法阵。"
 TRAIT_FLAG_DESC_fera_trait_healing: "@goodhealth_icon!每年治疗所有非永久性的伤残"
 trait_infernalist_diabolism_desc: "[ROOT.Char.GetFirstNameNoTooltip]走上了[diabolism|E]。"
 trait_infernalist_thralldom_desc: "[ROOT.Char.GetFirstNameNoTooltip]走上了[thralldom|E]。"
 trait_ghoul_vitae_dependency_desc: "#medium [ghoul_vitae_dependency|E]：有#underline;V;TOOLTIP:trait_ghoul_vitae_dependency_chance [ROOT.Char.MakeScope.ScriptValue('POD_chance_to_lose_vitae_passively')|V0]%#!的几率每#underline;TOOLTIP:trait_ghoul_vitae_dependency_years [ROOT.Char.MakeScope.ScriptValue('POD_years_to_lose_vitae_passively')|V0]#!年获得#N 1[hunger_with_icon|E]#!。#!\n\n"
