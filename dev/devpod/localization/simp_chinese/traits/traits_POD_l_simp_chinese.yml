 TRAIT_FLAG_DESC_immortality: "#P @goodhealth_icon!永生#!"
 trait_alien: "外星人"
 trait_alien_desc: "地外生命。"
 trait_chulorviah: "克苏洛夫亚"
 trait_chulorviah_desc: "克苏洛夫亚也被称为深渊种群或克拉肯裔，是一种奇怪的影界生物，其行为类似于疾病。"
 trait_gaunt: "枯骨"
 trait_gaunt_desc: "已经解开了一个或多个它的[Fetters|E]的年长而强大的死灵。"
 trait_domem: "残魂"
 trait_domem_desc: "残魂是指[Fetters|E]全部被毁的死灵，他们无法在[UmbraGlossary('shadowlands')]逗留——虽然残魂一般意味着年长，但死灵可以在非常年轻的时候成为残魂，所需要的只是他们的[Fetters|E]被毁。"
 trait_enfant: "鬼婴"
 trait_enfant_desc: "鬼婴是指刚刚被死出来到[UmbraGlossaryLocalized('shadowlands','冥界')]的死灵。"
 trait_track_fetter: "羁绊"
 trait_track_fetter_desc: "$game_concept_Fetter_desc$"
 trait_track_fetter_resolved: "已解羁绊"
 trait_track_fetter_resolved_desc: "[Fetters|E]也可以被解开，这意味着死灵获得了与生前所爱的事物和人告别的力量。一位成功解开了所有[Fetters|E]的死灵可以无限期地留在[UmbraGlossary('shadowlands')]，但这种成功是非常罕见的，甚至可以说是神话中的。"
 trait_track_spectre: "种姓"
 trait_track_spectre_desc: "怨灵有明确的阶级划分。死妖和游魂是怨灵种姓中最低级的，因为他们直接从[Glossary('皮囊之地','game_concept_skinlands_desc')]进入[UmbraGlossary('oblivion')]，最不容易受到[UmbraGlossary('oblivion')]辐射的影响。二重身位居其次，他们经受住了真灵的考验，并通过对[UmbraGlossary('oblivion')]的奉献取得了胜利；不过，此时他们的身体上并没有[UmbraGlossary('oblivion')]的印记。渊影和幻影的地位更高，因为在他们身上已经开始显现出[UmbraGlossary('oblivion')]的痕迹。其次是亡骸，因为他们长期暴露在[UmbraGlossary('oblivion')]的环境中，打磨已经无法再掩盖他们的本性。曾诞者和百臂巨人是曾经是人类的怨灵所能达到的最高阶级；虽然他们献身于[UmbraGlossary('oblivion')]的功业，但他们仍然曾经活过。在这个系统的最顶端是未诞者，他们在过去的岁月里从[UmbraGlossary('oblivion')]中爬了出来。稚灵的独特之处在于他们存在于种姓系统之外，几乎服务于[UmbraGlossary('oblivion')]的所有阶级。"
 trait_stripling: "稚灵"
 trait_stripling_desc: "稚灵也被称为未生者，是怨灵的一种，他们在孩提时代进入[UmbraGlossary('shadowlands')]，最终被自己的黯影所取代。与其他怨灵一样，稚灵也属于怨灵种姓之一，这取决于他们与[UmbraGlossary('oblivion')]的亲近程度，但由于他们认为已建立的怨灵社会并不吸引人，因此他们组建了自己的独立团体。"
 trait_neverborn: "未诞者"
 trait_neverborn_desc: "未诞者是对沉睡在[UmbraGlossary('pod_realm_labyrinth')]深处的古代巨孽的称呼。他们也被称为原初者、永不死和怪诞。"
 trait_hekatonkhire: "百臂巨人"
 trait_hekatonkhire_desc: "百臂巨人是一种古老的怨灵，主要被巨孽用作坦克和撞锤，与敌方怨灵作战。他们被认为是被[UmbraGlossary('oblivion')]之力迷失了心智的曾诞者，变成了能同时攻击多个对手的巨大畸形野兽。"
 trait_onceborn: "曾诞者"
 trait_onceborn_desc: "曾诞者是对曾是人类的巨孽的称呼。他们也被称为曾生者、计谋者和阴谋者。"
 trait_nephwrack: "亡骸"
 trait_nephwrack_desc: "亡骸已经存在了很久，它们不断暴露在[UmbraGlossary('oblivion')]的环境中，导致它们失去人体形态，变得扭曲变形。许多亡骸为巨孽主人服务，成为他们的显性代理人。"
 trait_shade: "渊影"
 trait_shade_desc: "在最强大的怨灵中，渊影是曾经被扔进[UmbraGlossary('tempest')]、卷入死涡或大死涡、或在畏途中迷失自我的死灵。他们脆弱的心理被[UmbraGlossary('oblivion')]彻底摧毁，只留下充满仇恨和黑暗炽情的阴影，并被永久控制。他们的死诞方式让他们有了一个绰号，叫做[UmbraGlossary('oblivion')]之子。"
 trait_apparition: "幻影"
 trait_apparition_desc: "幻影是怨灵的中层管理者——开始向亡骸进化的二重身和死妖。因此，在[UmbraGlossary('oblivion')]引发的变异之后，很难再看到他们曾经的样子。鉴于他们早已不再是人，[Corpus|E]只反映了自我。"
 trait_doppelganger: "二重身"
 trait_doppelganger_desc: "二重身也被称为影食者，除了更苍白、更瘦弱之外，他们的外表与普通的死灵非常相似。他们身上经常有死亡印记，不过使用 打磨可以掩盖这些印记。最明显的特征是他们的眼睛里总是能看到黯影。"
 trait_mortwight: "死妖"
 trait_mortwight_desc: "死妖是那些死于极度暴力的人的灵魂。他们对死亡的愤怒和怨恨使他们在[UmbraGlossary('shadowlands')]觉醒成为怨灵，永远不会以幽灵的身份存在。许多死妖一开始就具有黑暗的本性，有些人认为他们从一开始就注定要成为怨灵。"
 trait_haint: "游魂"
 trait_haint_desc: "游魂进入[UmbraGlossary('shadowlands')]时受黯影所控，这一点与死妖非常相似。与死妖不同，游魂不是由他们的死法所定义，而是他们的活法。在他们死前，当他们还在生者中时，就已经沦落到几乎非人的生活方式。"
 trait_automaton: "自动人形"
 trait_automaton_desc: "人工躯体。"
 trait_fallen: "堕天者"
 trait_fallen_desc: "他们是堕落天使，在创世之初选择站在路西法和人类一边，而不是上帝一边。为了惩罚他们的叛逆和不忠，大天使米迦勒将这些天使赶出了天堂，扔进了深渊。深渊之墙裂开了，堕天者开始逃回物质世界。"
 trait_servitor: "从者"
 trait_servitor_desc: "地缚魔可以为自己制造一个移动容器，在特制的物品中注入自己的污染，把它变成一个强大、持久的宿体。"
 trait_manifestation: "显象"
 trait_manifestation_desc: "对人类形态的丑陋模仿。例如，从血泊中凝结出的面孔、蝗虫制成的手臂或蛆虫形成的舌头。这些形体物理独立于显灵者，不具备精细的运动控制能力。另一方面，被制造出来的形体与制造它们的显灵者一样强大，并能对简单的命令做出反应，如甩动、撕咬、痉挛等。"
 trait_golem: "魔像"
 trait_golem_desc: "魔像是用术法制造的大型自动人形，因不稳定和容易发狂而臭名昭著。"
 trait_track_dharma_desc: "悟性值衡量你距离提升[Glossary('心法','podgloss.dharma')]的进度。当[trait_level_track_xp|E]达到第一级时，除第十级心法外，你的心法等级将会提升。"
 trait_elohim: "耶洛因"
 trait_elohim_desc: "耶洛因，又称天使，是长着翅膀的天人，他们是上帝在天国的使者和随从。"
 TRAIT_FLAG_DESC_bypass_mental_defenses: "无视强力精神防护"
 trait_crimson_fever: "阳疾"
 trait_crimson_fever_desc: "阳盛阴衰的中原族裔身上表现出来的一种超自然疾病。虽然这种疾病相当罕见，但据传传染性极强。它的罕见性也意味着人们从未真正探索过潜在的治疗方法，这使它成为一种可怕的疾病。"
 trait_chulorviosis: "克苏洛症"
 trait_chulorviosis_desc: "一种同时影响头足纲动物和人类的奇怪疾病。这种疾病纯粹是精神性的；对冲上岸的克苏洛夫亚的尸体进行的尸检没有发现任何相关信息。病毒会改变人类和头足纲动物，使它们变得更像对方：人类可能长出鸟嘴、斑驳的皮肤和吸盘，而章鱼可能长出发育不全的指甲或改变眼睛的颜色。\n\n人类的智慧让位于本能，而头足纲动物则变得更有知觉、更恶毒。这种转变可能需要几个月的时间，但一旦开始就几乎无法避免。大约六个月后，人类逃往海面，加入海底的同类。在达到这种状态之前，大多数克苏洛夫亚会尽可能多地感染人类。"
 trait_gift_of_melancholia: "忧郁之赠"
 trait_gift_of_melancholia_desc: "这是一种可怕的萎缩病，凡人和该隐之子都能患上它，它会导致头晕、虚弱、乏力和恶心。"
 trait_flaying_plague: "剥皮瘟疫"
 trait_flaying_plague_desc: "影响着兽嫡和狼族等的可怕瘟疫。起初，它似乎是一种奇怪的肺痨，然后出现疖子，接着皮肤从骨头上脱落，令人痛苦不堪。"
 trait_scourge: "灾疫"
 trait_scourge_desc: "灾疫是一种感染血液的吸血鬼特有瘟疫。这种疾病是麻风病与鼠疫杂交的变异品种，直接攻击吸血鬼的$pod_vitae$。一旦感染，受害者每次消耗$pod_vitae$时都必须消耗更多的血液。受害者每遭受灾疫折磨一晚，情况就会变得更糟。在某些情况下，受害者还会患上影响外观但不会危及生命的毁容性疾病。"
 trait_track_scourge: "严重度"
 trait_track_scourge_desc: "灾疫严重度。"
