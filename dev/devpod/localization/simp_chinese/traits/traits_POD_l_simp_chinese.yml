 trait_correspondence_master_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]掌控了空间领域。"
 trait_custom_bloodline_character:0 "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 trait_custom_bloodline_character_desc:0 "[cainites|E]的新生血系。尽管大多数血族都不将他们视同，但[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]已经准备好展示他人谁才是黑夜的真正统治者。"
 trait_demonology:0 "恶魔学"
 trait_demonology_1:0 "恶魔学门生"
 trait_demonology_1_desc:0 "该角色知道关于恶魔的基本常识和他们的一些更不寻常的能力。该角色可能可以完成一次召唤，并且可能观察过甚至协助过一次召唤，但进行束缚则是另一回事……"
 trait_demonology_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]知道关于恶魔的基本常识和他们的一些更不寻常的能力。[ROOT.GetCharacter.GetFirstNameNoTooltip]可能可以完成一次召唤，并且可能观察过甚至协助过一次召唤，但进行束缚则是另一回事……"
 trait_demonology_2:0 "恶魔学学者"
 trait_demonology_2_desc:0 "该角色了解地狱的奥秘和受诅者讲述的奇怪又亵渎的史前史的片段。该角色当然可以进行召唤和束缚仪式，并且可能知道少数几个可以使用的天名……如果他们想的话。"
 trait_demonology_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]了解地狱的奥秘和受诅者讲述的奇怪又亵渎的史前史的片段。[ROOT.GetCharacter.GetFirstNameNoTooltip]当然可以进行召唤和束缚仪式，并且可能知道少数几个可以使用的天名……如果[ROOT.GetCharacter.GetFirstNameNoTooltip]想的话。"
 trait_demonology_3:0 "恶魔学大师"
 trait_demonology_3_desc:0 "有可能路西法本人也出现在该角色面前，以便其可能成为他的书记员吗？恶魔们理所当然地害怕该角色的力量和学识。"
 trait_demonology_3_character_desc:0 "有可能路西法本人也出现在[ROOT.GetCharacter.GetFirstNameNoTooltip]面前，以便其可能成为他的书记员吗？恶魔们理所当然地害怕[ROOT.GetCharacter.GetFirstNameNoTooltip]的力量和学识。"
