 trait_cultist: "恶魔教徒"
 trait_cultist_desc: "该角色为了魔邪叙擢而与恶魔力量契约。"
 trait_demonology_kueijin_desc: "恶魔学是指召唤和驾驭忌灵、怨灵和其他邪恶的灵体的技艺。许多[GetTrait('kueijin').GetName( GetNullCharacter )]都在或多或少地从事这项工作。这种做法甚至是魔虎心法的特色之一。他们认为这是其宗教实践的自然组成部分，并编写了有关该主题实践方面的文献，其专业性不亚于巫龙和赫耳墨斯秘会的魔法图书馆。恶魔学是完全合法的，尽管在魔虎的圈子之外，它往往被认为品味极低。"
 trait_necromancy_character_desc: "$necromancy_paths_display$\n\n$trait_necromancy_desc$"
