 trait_ashen_adventurer_desc: "一位为财富、声名与鲜血所驱策的流浪冒险者"
 trait_track_ashen_ambassador: "[ashen_ambassador|E]"
 trait_track_ashen_ambassador_desc: "#bold 您可以通过使用大使访问角色互动来获得此特质轨道的经验#!\n这位外交官向外国统治者宣誓，在这片土地上漫游，寻找机会为他们的赞助人谋利。"
 trait_track_ashen_grandmaster: "[ashen_grandmaster|E]"
 trait_track_ashen_grandmaster_desc: "#bold 这类经验可以用来改善你作为吸血鬼无地角色的军事组织。或作为无地$pod_kueijin$的战略造诣。可通过完成军事类或无地战争契约来获取。\n该隐派有着悠久的战士团体传统，这些团体组织严密、目标统一，足以被视为军事修会。\n在东方，$pod_kueijin$更注重从战略层面提升他们的勇武造诣。#!"
 trait_track_ashen_caravan: "[ashen_caravan|E]"
 trait_track_ashen_caravan_desc: "#bold 这类经验可以通过完成运输合同获得#!\n灰烬商队首领是少数真正通晓如何在黑暗世界的致命道路上穿行的角色，他们将为有需要之人提供自己的专业服务。"
 trait_track_ashen_cult: "[ashen_cult|E]"
 trait_track_ashen_cult_desc: "#bold 你可以通过使用同名决议来提升这一特质路线。该机制允许你通过事件系统，以多种方式与你驻扎所在领地进行互动。#!\n先知、异端宗师、奇迹创造者……在这片黑暗世界中，无论凡人还是超凡存在，总有人执着追寻真理，并甘愿追随那些以个人魅力传播（他们版本）真理的领袖人物。"
