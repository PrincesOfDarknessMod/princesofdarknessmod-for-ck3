 trait_bardo: "中阴术"
 trait_bardo_desc: "中阴术是埃及神奥西里斯传给奥西里斯之子的招牌[Glossary('血律','game_concept_discipline_desc')]。"
 trait_bardoadvanced: "高阶中阴术"
 trait_bardoadvanced_desc: "中阴术是埃及神奥西里斯传给奥西里斯之子的招牌[Glossary('血律','game_concept_discipline_desc')]。"
 trait_bardodiscipline: "中阴术"
 trait_anathema: "咒逐"
 trait_anathema_desc: "咒逐指的是受到血猎的吸血鬼或其他生物。这个词有时专门用来指构成红名单的十三位“最高通缉犯”。"
 trait_anathema_character_desc: "咒逐指的是受到[blood_hunt|E]的吸血鬼或其他生物。这个词有时专门用来指构成红名单的十三位“最高通缉犯”。"
 trait_true_faith: "真信"
 TRAIT_FLAG_DESC_anathema_trait_flag: "[blood_hunt|E]目标"
 trait_forever_infamous: "#N;bold 终生恶名#!"
 trait_forever_infamous_desc: "由于知道整个超自然世界都想要其的命，该角色再也无法安心入睡了。"
 trait_forever_infamous_character_desc: "由于知道整个超自然世界都想要[ROOT.GetCharacter.GetHerHim]的命，[ROOT.GetCharacter.GetFirstNameNoTooltip]再也无法安心入睡了。"
 TRAIT_FLAG_DESC_permanent_masquerade5: "永久持有[GetModifier('masquerade5_modifier').GetNameWithTooltip]"
 trait_forever_indomitable: "#P;bold 永不屈服#!"
 trait_forever_indomitable_desc: "在超自然世界的眼中，该角色在造成大裁判之后……通过摧毁裁判所赎罪。"
 trait_forever_indomitable_character_desc: "在超自然世界的眼中，[ROOT.GetCharacter.GetFirstNameNoTooltip]在造成大裁判之后……通过摧毁裁判所赎[ROOT.GetCharacter.GetHerselfHimself]的罪。"
 trait_golconda: "浩恩永生"
 trait_golconda_desc: "该角色在[Concept('golconda','开悟')][Glossary('心兽','game_concept_beast_desc')]的真正本质后，获得了内心的平静。"
 trait_golconda_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]在[Glossary('开悟','game_concept_beast_desc')]的真正本质后，获得了内心的平静。"
 trait_golconda_seeker: "浩恩永生寻求者"
 trait_golconda_seeker_desc: "该角色正走在通往[enlightenment|E]的漫长道路上。"
 trait_golconda_seeker_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip]正走在通往[enlightenment|E]的漫长道路上。"
 TRAIT_FLAG_DESC_elder_perk_flag: "允许无视[Glossary('世代','game_concept_vampgeneration_desc')]点选[elder_perks|E]"
 TRAIT_FLAG_DESC_hungerless_flag: "[Concept('hungerless','No longer affected by hunger for blood')|E]"
 TRAIT_FLAG_DESC_immune_to_frenzy_flag: "不再[Glossary('血狂','game_concept_beast_desc')]"
 TRAIT_FLAG_DESC_perks_for_piety_flag: "能使用[piety|E]换取[resonance|E][perks|E]点"
 TRAIT_FLAG_DESC_warning_golconda_flag: "\n#X 该特质将在做出谋杀或盗窃后移除#!"
 TRAIT_FLAG_DESC_humanity_feast_flag: "允许举办#TOOLTIP:ACTIVITY_TYPE,activity_feast #L 宴会#!#!并且会从中获得[piety|E]"
 trait_track_golconda_seeker: "见解"
 trait_track_golconda_seeker_desc: "\n你的[trait_level_track_xp|E]显示[GetTrait('golconda').GetName(GetNullCharacter)][journey|E]最后阶段的成功率。\n\n#X 一旦犯下血狂、谋杀或盗窃，所有进度都会丢失#!"
 TRAIT_FLAG_DESC_golconda_mentoring_flag: "能够教导他人踏入[golconda|E]之道"
 TRAIT_FLAG_DESC_warning_golconda_seeker_flag: "\n#X 一旦犯下血狂、谋杀或盗窃，所有[trait_level_track_xp|E]都会丢失#!"
 trait_dragon_sleep: "龙眠"
 trait_dragon_sleep_desc: "魔克拉正处于的蛰眠之中。[ROOT.GetCharacter.GetSheHe|U]通过龙梦之力梦见过去。这些究竟是纯粹的梦境还是噩梦，无人能够断言。"
 trait_anda: "安答"
 trait_anda_desc: "安答是冈格罗氏族的一个$pod_cainite$血系，存在于蒙古人之中。他们自认为是蒙古宗教中大地女神埃图根的后裔。\n由于他们在地理上接近$pod_kueijin$，双方经常发生冲突，而凡世蒙古人的征服可能会使局势进一步恶化。"
