 trait_coccon_desc: "角色将自己包裹在坚硬的茧壳中，同时她的新陈代谢减慢到近乎没有的状态。"
 trait_long_sleep: "长眠"
 trait_long_sleep_desc: "一种与熊的自然冬眠差不多的活动中止状态。"
