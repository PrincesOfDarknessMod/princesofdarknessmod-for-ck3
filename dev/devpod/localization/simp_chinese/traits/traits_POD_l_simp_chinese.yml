 trait_chi_art_feng_shui: "风水"
 trait_chi_art_feng_shui_desc: "气功与其他技艺不同，是纯粹之气的高级运用新近发展而成。它们也与饿殍的存在相去甚远；学习气功需要导师指导。\n\n风水是一门古老的地相技艺，专精于根据天象辐射与地势形态，对建筑、墓穴及室内布局进行吉位排布，使气得以自由流动，从而实现人与周边环境的和谐统一。"
 trait_chi_art_obligation: "敕令"
 trait_chi_art_obligation_desc: "气功与其他技艺不同，是纯粹之气的高级运用新近发展而成。它们也与饿殍的存在相去甚远；学习气功需要导师指导。\n\n敕令是一门允许$pod_kueijin$对他人施加控制的技艺。它是对古代万仙及其源自[Glossary('玉皇大帝','podgloss.augustpersonageofjade')]亲自授予的权威之荣光的回溯。尽管他们已失去这份恩宠，但仍有部分鬼人能激发或支配周围生灵的精神。"
 trait_chi_art_tapestry: "堪舆"
 trait_chi_art_tapestry_desc: "气功与其他技艺不同，是纯粹之气的高级运用新近发展而成。它们也与饿殍的存在相去甚远；学习气功需要导师指导。\n\n堪舆是充分利用龙脉潜力的气功。通过学习堪舆，鬼人能使自身与风、水、土壤中的阴阳之力相调和，进而操纵这些力量实现多种目的。"
 trait_chi_art_prana: "炁"
 trait_chi_art_prana_desc: "气功与其他技艺不同，是纯粹之气的高级运用新近发展而成。它们也与饿殍的存在相去甚远；学习气功需要导师指导。\n\n炁是同时运用阴气与阳气的技艺。修习者可调和自身与生死能量，或利用二者的融合来治愈创伤。"
 trait_chi_art_kiai: "气合"
 trait_chi_art_kiai_desc: "气功与其他技艺不同，是纯粹之气的高级运用新近发展而成。它们也与饿殍的存在相去甚远；学习气功需要导师指导。\n\n气合是通过声音引导魔神之怒的气功，是一种在战场上具有多种用途的威慑技法。"
 trait_chi_art_tzu_wei: "紫微"
 trait_chi_art_tzu_wei_desc: "气功与其他技艺不同，是纯粹之气的高级运用新近发展而成。它们也与饿殍的存在相去甚远；学习气功需要导师指导。\n\n紫微是解读与操纵命盘的气功。当$pod_kueijin$修习紫微时，他们能塑造命运本身，并将运势之力扭转为己所用。"
