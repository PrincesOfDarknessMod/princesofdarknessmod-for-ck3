l_simp_chinese:
 trait_predatortype_farmer: "农场主"
 trait_predatortype_farmer_desc: "这位吸血鬼更倾向于从动物身上吸食血液。"
 trait_predatortype_bloodleech: "吸蛭者"
 trait_predatortype_bloodleech_desc: "这位吸血鬼更倾向于从其他吸血鬼身上吸食血液！"
 trait_predatortype_phlebotomist: "抽血师"
 trait_predatortype_phlebotomist_desc: "该吸血鬼伪装成一个放血的医生来获得$pod_vitae$。"
 trait_predatortype_bedlamite: "狂人"
 trait_predatortype_bedlamite_desc: "这位吸血鬼以疯子为猎物。他可能也是疯子，也可能不是。"
 trait_predatortype_cenobite: "修道士"
 trait_predatortype_cenobite_desc: "该吸血鬼在修道院这样的宗教机构里有[POD_herd|E]。"
 trait_predatortype_alleycat: "夜游猫"
 trait_predatortype_alleycat_desc: "该吸血鬼跟踪并暴力攻击人类来获取血液。这是一种粗俗的做法。"
 trait_predatortype_cauchemar: "梦魇"
 trait_predatortype_cauchemar_desc: "这种吸血鬼主要以熟睡中的猎物为食。"
 trait_predatortype_familias: "掠家者"
 trait_predatortype_familias_desc: "这位吸血鬼吸食的血液几乎来自同一个特定的家庭宗族。他们可能跟这个家庭存在某种关联，起码他们是这么认为的。"
 trait_predatortype_footpad: "拦路贼"
 trait_predatortype_footpad_desc: "该嘬血佬与社会的下等人一起活动，吸取穷人的血。这些人即使消失了，当局也不会感兴趣。"
 trait_predatortype_consensualist: "顺求者"
 trait_predatortype_consensualist_desc: "该吸血鬼从自愿者那吸食。这大大增加了[the_masquerade|E]的难度。"
 trait_predatortype_cultist: "密教主"
 trait_predatortype_cultist_desc: "该吸血鬼如同上古时期一般领导着一个血之密教。血畜将他们的信仰与自身奉献于该血神。"
 trait_predatortype_siren: "塞壬"
 trait_predatortype_siren_desc: "该吸血鬼通过迷吻来引诱爱人们并吸干他们的血。"
 trait_predatortype_gentry: "绅士"
 trait_predatortype_gentry_desc: "这吸血鬼在人类社会中有一定的地位。其利用这种地位去猎食有钱有势的人。没有人会相信这样文雅的人是怪物。"
 trait_predatortype_graverobber: "掘墓人"
 trait_predatortype_graverobber_desc: "这种吸血鬼会在墓地和墓穴附近徘徊，寻找新鲜的尸体或哀悼者们。其可以从新鲜的尸体上获得养分。"
 trait_predatortype_extortionist: "勒索者"
 trait_predatortype_extortionist_desc: "该吸血鬼强迫他的受害者给予他血液。从表面上看，勒索者是通过获取血液来换取安全或监护等服务，虽然很多时候，保护的需要是真实存在的，但这也往往是为了让交易让人觉得可以接受而编造的谎言。"