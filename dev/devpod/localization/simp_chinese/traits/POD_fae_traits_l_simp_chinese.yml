l_simp_chinese:
 trait_fae:0 "真妖精"
 trait_fae_desc:0 "真妖精是指任何原生于[dreaming|E]、不是奇魅、也没有化为过换生灵的灵体。虽然没有一个完整的实体清单，但它包括首生妖精、暗之一族，甚至是元素妖。"
 trait_changeling:0 "换生灵"
 trait_changeling_desc:0 "换生灵是生为人类的妖精。旧王廷认为，与第一位男人上床的第一位女人曾是一位首生妖精。从两人的结合中，第一位换生灵诞生了，尽管这对夫妇有更多的孩子，且第一个女人还有其他伴侣。其他的解释，特别是由更反人类的妖精作出的解释是，换生灵是畸形和不受欢迎的妖精的废料残余，他们跟凡人的孩子互相交换并在他们中间长大。"
 trait_kinain:0 "血亲"
 trait_kinain_desc:0 "血亲是一位拥有妖精血统的凡人，但不是一位彻底的换生灵。"
 trait_kithain:0 "戚族"
 trait_jinn:0 "镇尼"
 trait_african_kiths:0 "非洲戚系"
 trait_hsien:0 "妖仙"
 trait_phyla:0 "元素妖门属"
 trait_inanimae:0 "元素妖"
 trait_inanimae_desc:0 "元素妖是真妖精的表亲。虽然他们不是真正的元素之灵，但他们与元素有着密切的亲缘关系。每个元素妖都以一种特定的元素来塑造自己。"
 trait_sidhe:0 "仙族"
 trait_sidhe_desc:0 "仙族是妖精族高贵而美丽的统治者，是典型妖精领主中超凡脱俗的领导者。"
 trait_boggan:0 "博甘"
 trait_boggan_desc:0 "踏实又努力，博甘是家庭的守护者和勤劳的持家者。"
 trait_clurichaun:0 "克鲁尔坎"
 trait_clurichaun_desc:0 "这些戚族喜爱玩乐又充满魅力，是小矮妖故事的起源。"
 trait_eshu:0 "逸抒"
 trait_eshu_desc:0 "终极流浪者，逸抒是完美的叙事者和探险家。"
 trait_ghilledhu:0 "吉尔杜"
 trait_ghilledhu_desc:0 "绿色与自然之灵，吉尔杜曾是根据季节的变化而改变它们天性的繁荣生物。"
 trait_nocker:0 "诺克"
 trait_nocker_desc:0 "这些满嘴脏话的吝啬鬼看起来可能又小又奇怪，但他们对工艺和建筑的追求使他们成为戚族社会的天才发明者。"
 trait_piskey:0 "皮克西"
 trait_piskey_desc:0 "皮克西是天真无邪、眼界开阔的奇特群体，由天然的流浪者组成，他们寻求世界遍地的美和令人敬畏的美。"
 trait_pooka:0 "噗咔"
 trait_pooka_desc:0 "往好了是恶作剧家，往坏了是惊吓恐怖，该戚族每人都与一种特定动物有亲和力，且喜欢讲述笑话。"
 trait_troll:0 "巨魔"
 trait_troll_desc:0 "这些强大的巨人体现了妖精的忠诚、荣誉和力量。"
 trait_redcap:0 "红帽子"
 trait_redcap_desc:0 "这些狰狞的戚族是畸形的饮食机器，让人望而生畏，充满了恶劣态度和凶蛮暴力。"
 trait_riverhag:0 "河巫婆"
 trait_riverhag_desc:0 "这些浸水的妖精生活在快速流动的水体中，将毫无戒心的猎物拖入水中淹死。"
 trait_satyr:0 "羊人"
 trait_satyr_desc:0 "羊人是被赋予形态的快乐与激情之灵。"
 trait_sluagh:0 "斯珞俄"
 trait_sluagh_desc:0 "这些黑暗而神秘的妖精最擅长收集信息和守卫秘密。"
 trait_swanmaiden:0 "天鹅少女"
 trait_swanmaiden_desc:0 "天鹅少女是最近兴起的奇特戚系，诞生于浪漫和真爱之梦。"
 trait_wichtel:0 "维希特尔"
 trait_wichtel_desc:0 "矿工和其他工人是社区的基石，因为他们做的是无论多么不愉快都必须完成的任务，冒险进入黑暗和危险中寻找社会所依赖的资源，并在不期望名利的情况下从事危险的、艰苦的工作。工作之所以能完成，是因为它必须完成。维希特尔便是这精神的化身。"
 trait_ifrit:0 "伊夫利特"
 trait_ifrit_desc:0 "在火焰中受锻，在战斗中淬炼，伊夫利特对软弱没有耐心。"
 trait_lilin:0 "莉琳"
 trait_lilin_desc:0 "任性而诱人，莉琳知道她想要什么以及如何得到它。"
 trait_qareen:0 "卡伦"
 trait_qareen_desc:0 "卡伦有即是天赋又是诅咒的强大记忆力，其他镇尼称他们为“行走的图书馆”。"
 trait_shaytan:0 "晒衣陀乃"
 trait_shaytan_desc:0 "交易者、欺骗者、诱惑者、吹牛者——这些都是固定在晒衣陀乃身上的标签。"
 trait_biloko:0 "比洛科"
 trait_biloko_desc:0 "This kith emphasizes the value of tradition and heritage, being tightly bound to their culture and community and being wary of outsiders."
 trait_djedi:0 "杰迪"
 trait_djedi_desc:0 "Lovers of society, partying and merriment, the Djedi are instant celebrities who are as gifted with sorcery as they are cursed with blatancy."
 trait_kuino:0 "奎诺"
 trait_kuino_desc:0 "Hopeful, ambitious, and industrious - this kith is made up of the drive to achieve success and better living, though they must beware greed and the loss of their sacred objects on that quest."
 trait_obambo:0 "奥班博"
 trait_obambo_desc:0 "This kith is made up of gifted explorers and adventurers who know all the tricks of exploring the Land of Ancient Dreams and getting away with it and the spoils, as affable as they seem though they are dangerous when their beloved are threatened."
 trait_okubili:0 "奥库比里"
 trait_okubili_desc:0 "Level-headed and attuned to their past lives and focused on maintaining balance in all their current lives, this kith loves to teach but sometimes become wrapped up in the concerns of past lives."
 trait_chuihyu:0 "蚩尤"
 trait_chuihyu_desc:0 "A Kwannon-jin of the Eastern Hsien, the Chu-ih-yu are elemental nobles; Kamuii Shinma of the element of Metal."
 trait_chujung:0 "祝融"
 trait_chujung_desc:0 "A Kwannon-jin of the Eastern Hsien, the Chu Jung are elemental nobles; Kamuii Shinma of the element of Fire."
 trait_fuhsi:0 "伏羲"
 trait_fuhsi_desc:0 "A Kwannon-jin of the Eastern Hsien, the Fu Hsi are commoners; Hirayanu Shinma attuned to the element of Wood with the ability to turn into snakes. "
 trait_hanumen:0 "哈奴曼"
 trait_hanumen_desc:0 "A Kwannon-jin of the Eastern Hsien, the Hanumen are commoners; Hirayanu Shinma attuned to the element of Earth with the ability to turn into monkeys."
 trait_hengpo:0 "横公"
 trait_hengpo_desc:0 "A Kwannon-jin of the Eastern Hsien, the Heng Po are commoners; Hirayanu Shinma attuned to the element of Water with the ability to turn into fish."
 trait_houchi:0 "后稷"
 trait_houchi_desc:0 "A Kwannon-jin of the Eastern Hsien, the Hou-chi are elemental nobles; Kamuii Shinma of the element of Wood."
 trait_komuko:0 "土壻"
 trait_komuko_desc:0 "A Kwannon-jin of the Eastern Hsien, the Komuko are elemental nobles; Kamuii Shinma of the element of Earth."
 trait_nyan:0 "猫妖"
 trait_nyan_desc:0 "A Kwannon-jin of the Eastern Hsien, the Nyan are commoners; Hirayanu Shinma attuned to the element of Fire with the ability to turn into cats."
 trait_suijen:0 "水君"
 trait_suijen_desc:0 "A Kwannon-jin of the Eastern Hsien, the Suijen are elemental nobles; Kamuii Shinma of the element of Water."
 trait_tanuki:0 "狸妖"
 trait_tanuki_desc:0 "A Kwannon-jin of the Eastern Hsien, the Tanuki are commoners; Hirayanu Shinma attuned to the element of Metal with the ability to turn into tanuki or raccoon-dogs (often mis-translated as \"badgers\")."
 trait_glome:0 "格洛姆"
 trait_glome_desc:0 "Inanimae of Earth and members of the Empire of Stones."
 trait_kubera:0 "俱毗罗"
 trait_kubera_desc:0 "Inanimae of Wood and members of the Empire of Seeds."
 trait_ondine:0 "温蒂妮"
 trait_ondine_desc:0 "Inanimae of Water and members of the Empire of Tears."
 trait_paroseme:0 "帕罗塞米"
 trait_paroseme_desc:0 "Inanimae of Air and members of the Empire of Skies."
 trait_solimond:0 "索利蒙德"
 trait_solimond_desc:0 "Inanimae of Fire and former members of the Empire of Flames."
 trait_mannikin:0 "马内坎"
 trait_mannikin_desc:0 "Inanimae of human-shaped elements and members of the Empire of Dolls."
 trait_art_sovereign:0 "君临之艺"
 trait_art_sovereign_desc:0 "君临是控制平民和展现高贵的术艺。它是戚族最常用的政治术艺之一，其存在主要是为了确保维护他们的政治结构。"
 trait_art_chicanery:0 "诈瞒之艺"
 trait_art_chicanery_desc:0 "诈瞒是一种操纵幻觉和情感的幻惑魔法力量。那些广泛使用它的人通常被贵胄们认为不值得信任。"
 trait_art_legerdemain:0 "幻戏之艺"
 trait_art_legerdemain_desc:0 "幻戏允许换生灵通过念力控制环境，从远程扒口袋到抓取和投掷大型物体。这术艺还可以创造出固态的幻象物体和生物。"
 trait_art_primal:0 "原力之艺"
 trait_art_primal_desc:0 "原力允许换生灵操纵自然的力量，从召唤元素到与无生命的物体交流。它还赋予身体以力量，使妖精能够硬化皮肤到像树皮一样、治愈创伤、撕裂肉体，甚至变形。"
 trait_art_soothsay:0 "真言之艺"
 trait_art_soothsay_desc:0 "真言体现换生灵看到未来的能力。根据咒语使用的领域，换生灵可能会了解到关于某人、某地或某物的信息。"
 trait_art_wayfare:0 "飞路之艺"
 trait_art_wayfare_desc:0 "飞路之艺涉及到换生灵在空间中移动的能力。这包括弹跳到更远的距离，将脚步加速到匪夷所思的程度来前冲，甚至从一个地方传送到另一个地方。"
 trait_realm_actor:0 "角色领域精通"
 trait_realm_actor_desc:0 "角色是与所有世俗众生相连的领域，与你对他们的了解程度直接相关。你对一个特定的生命越不熟悉，无论是狼人、凡人、死灵、吸血鬼等等，对角色的精通程度就得越高。要影响敌视你的人，无论对其的了解如何，都需要最高级精通。"
 trait_realm_fae:0 "妖精领域精通"
 trait_realm_fae_desc:0 "妖精领域与其他[dreaming|E]生物相关。影响其他换生灵、仙族贵胄、魔妖、奇魅，甚至是控制妖精魔法本身，都属于妖精的范畴。"
 trait_realm_nature:0 "自然领域精通"
 trait_realm_nature_desc:0 "自然是对植物、动物和大地的控制。任何非人造的物事都在自然领域之下。"
 trait_realm_prop:0 "道具领域精通"
 trait_realm_prop_desc:0 "道具是对所有被制造的物体的控制和操纵。衣服、武器、建筑和其他任何“人造”的物品都属于道具。 设备越复杂，对道具领域的掌握就得更高。"
 trait_realm_scene:0 "场景领域精通"
 trait_realm_scene_desc:0 "场景是对空间的控制。你对场景领域掌握得越多，你就能影响更大的区域或（与其他领域结合）影响更多的目标。"
 trait_realm_time:0 "时间领域精通"
 trait_realm_time_desc:0 "时间是对你的魔咒何时发生或持续多久的控制。对时间的掌握决定了你的法术可以持续多长时间，或者你可以对它们设置的延后“触发”时间。"
 trait_realm_air:0 "气之领域精通"
 trait_realm_air_desc:0 "气是环绕全球的元素。它影响非生物环境，也影响操控天气、操控空气、操控温度、或者操控施法者或目标区域内任何东西的魔咒。"
 trait_realm_earth:0 "地之领域精通"
 trait_realm_earth_desc:0 "地影响非生物、非超自然物体，只要是自然的或是手工制作的。"
 trait_realm_fire:0 "火之领域精通"
 trait_realm_fire_desc:0 "火用来影响非超自然生物。它只影响这种生物的身体方面。这领域也会被用来影响凡人身体。"
 trait_realm_water:0 "水之领域精通"
 trait_realm_water_desc:0 "水只影响非超自然生物的精神。迷惑他人需要这领域。"
 trait_realm_spirit:0 "灵之领域精通"
 trait_realm_spirit_desc:0 "灵用来影响超自然生物或事物，包括其他妖精。它影响物理和精神区域。它也影响附魔的凡人。"
 trait_faerie_eternity:0 "妖精永恒"
 trait_faerie_eternity_desc:0 "在你经历了破蛹之后，你过了一个生日，然后又一个，然后又一个。然而很奇怪——你似乎没有在成长或变老。你被眷染到了曾经是所有妖精与生俱来的永生的残余。"
 trait_firstbornfae:0 "首生妖精"
 trait_firstbornfae_desc:0 "首生妖精是从原初迷雾涌现而生的生物。首生妖精声称他们统治甚至创造了整个世界，只有他们才有权利支配魔法界的法则和法令。虽然持怀疑态度，但许多妖精同意这一点，并称他们为“真妖精”。人类的兴起强烈地削弱了首生妖精的力量，许多人担心如果不采取行动，他们的命运会受到影响。一些已经离开地球，在阿卡迪亚避难。"
 trait_denizen:0 "魔妖"
 trait_denizen_desc:0 "戚族武断地称这些生物为“暗之一族”，因为他们有着担任弗摩尔族之仆的卑劣声誉。尽管他们突然离开了人类的土地，但魔妖依然与人类的心灵保持着直接的、尽管是微妙的联系。作为人类梦境或恐惧的不同方面的化身，魔妖的种类繁多且复杂。"
 trait_oba:0 "奥巴"
 trait_oba_desc:0 "埃拉巴拉的贵族，是逸抒的陆上表亲。"
 trait_art_chronos:0 "时刻之艺"
 trait_art_chronos_desc:0 "时刻是操纵时间的术艺。与已知的其他超自然改变时间的方法不同，时刻是相当间接的，而且几乎从不按线性顺序进行——相反，它是一种与时间顺序脱节的术艺，导致其使用者难以受时间魔法影响，并失去了时间应该如何运作的感知。"
 trait_art_dream_craft:0 "梦工之艺"
 trait_art_dream_craft_desc:0 "梦工是操纵[dreaming|E]原材料的术艺。这门术艺使仙族能够改变梦界中的物理形态，从而影响永契堡和梦界中其他灵地的外观。它还能影响魔翳，即换生灵在梦界中所穿的奇魅服装。"
 trait_art_naming:0 "命名之艺"
 trait_art_naming_desc:0 "命名是真名与文字之力的术艺。它是戚族所知的最阴险的术艺之一，因为虽然它在低等级看上去没有威胁性，但在高等级可以轻易地造成不可挽回的损失。贵胄们不会轻易使用命名，他们会迅速对那些滥用的人进行惩罚。"
 trait_art_infusion:0 "聚合之艺"
 trait_art_infusion_desc:0 "聚合是协助诺克制造他们所有奇妙的钟表和奇魅物品的术艺。它涉及到将“FUBARS”和其他奇魅实体转为物理或奇魅形态。"
 trait_art_tale_craft:0 "叙事之艺"
 trait_art_tale_craft_desc:0 "叙事是讲述奇妙故事的逸抒术艺，它通过提供特效、解读人群和操纵他们的情绪来实现。除少数情况外，叙事魔咒的基础都是一篇故事，无论是说的还是唱的。"
 trait_chicanery:0 "诈瞒"
 trait_legerdemain:0 "幻戏"
 trait_primal:0 "原力"
 trait_soothsay:0 "真言"
 trait_wayfare:0 "飞路"
 trait_chronos:0 "时刻"
 trait_dream_craft:0 "梦工"
 trait_naming:0 "命名"
