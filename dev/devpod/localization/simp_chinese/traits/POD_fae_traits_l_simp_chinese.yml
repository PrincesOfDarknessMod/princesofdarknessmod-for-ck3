l_simp_chinese:
 trait_fae:0 "真妖精"
 trait_fae_desc:0 "真妖精是指任何原生于[dreaming|E]、不是奇魅、也没有化为过换生灵的灵体。虽然没有一个完整的实体清单，但它包括首生妖精、暗之一族，甚至是元素妖。"
 trait_changeling:0 "换生灵"
 trait_changeling_desc:0 "换生灵是生为人类的妖精。旧王廷认为，与第一位男人上床的第一位女人曾是一位首生妖精。从两人的结合中，第一位换生灵诞生了，尽管这对夫妇有更多的孩子，且第一个女人还有其他伴侣。其他的解释，特别是由更反人类的妖精作出的解释是，换生灵是畸形和不受欢迎的妖精的废料残余，他们跟凡人的孩子互相交换并在他们中间长大。"
 trait_kinain:0 "血亲"
 trait_kinain_desc:0 "血亲是一位拥有妖精血统的凡人，但不是一位彻底的换生灵。"
 trait_kithain:0 "戚族"
 trait_jinn:0 "镇尼"
 trait_african_kiths:0 "非洲戚系"
 trait_hsien:0 "妖仙"
 trait_phyla:0 "元素妖门属"
 trait_inanimae:0 "元素妖"
 trait_inanimae_desc:0 "元素妖是真妖精的表亲。虽然他们不是真正的元素之灵，但他们与元素有着密切的亲缘关系。每个元素妖都以一种特定的元素来塑造自己。"
 trait_sidhe:0 "仙族"
 trait_sidhe_desc:0 "仙族是妖精族高贵而美丽的统治者，是典型妖精领主中超凡脱俗的领导者。"
 trait_boggan:0 "博甘"
 trait_boggan_desc:0 "踏实又努力，博甘是家庭的守护者和勤劳的持家者。"
 trait_clurichaun:0 "克鲁尔坎"
 trait_clurichaun_desc:0 "这些戚族喜爱玩乐又充满魅力，是小矮妖故事的起源。"
 trait_eshu:0 "逸抒"
 trait_eshu_desc:0 "终极流浪者，逸抒是完美的叙事者和探险家。"
 trait_ghilledhu:0 "吉尔杜"
 trait_ghilledhu_desc:0 "绿色与自然之灵，吉尔杜曾是根据季节的变化而改变它们天性的繁荣生物。"
 trait_nocker:0 "诺克"
 trait_nocker_desc:0 "这些满嘴脏话的吝啬鬼看起来可能又小又奇怪，但他们对工艺和建筑的追求使他们成为戚族社会的天才发明者。"
 trait_piskey:0 "皮克西"
 trait_piskey_desc:0 "皮克西是天真无邪、眼界开阔的奇特群体，由天然的流浪者组成，他们寻求世界遍地的美和令人敬畏的美。"
 trait_pooka:0 "噗咔"
 trait_pooka_desc:0 "往好了是恶作剧家，往坏了是惊吓恐怖，该戚族每人都与一种特定动物有亲和力，且喜欢讲述笑话。"
 trait_troll:0 "巨魔"
 trait_troll_desc:0 "这些强大的巨人体现了妖精的忠诚、荣誉和力量。"
 trait_redcap:0 "红帽子"
 trait_redcap_desc:0 "这些狰狞的戚族是畸形的饮食机器，让人望而生畏，充满了恶劣态度和凶蛮暴力。"
 trait_riverhag:0 "河巫婆"
 trait_riverhag_desc:0 "这些浸水的妖精生活在快速流动的水体中，将毫无戒心的猎物拖入水中淹死。"
 trait_satyr:0 "羊人"
 trait_satyr_desc:0 "羊人是被赋予形态的快乐与激情之灵。"
 trait_sluagh:0 "斯珞俄"
 trait_sluagh_desc:0 "这些黑暗而神秘的妖精最擅长收集信息和守卫秘密。"
 trait_swanmaiden:0 "天鹅少女"
 trait_swanmaiden_desc:0 "天鹅少女是最近兴起的奇特戚系，诞生于浪漫和真爱之梦。"
 trait_wichtel:0 "维希特尔"
 trait_wichtel_desc:0 "矿工和其他工人是社区的基石，因为他们做的是无论多么不愉快都必须完成的任务，冒险进入黑暗和危险中寻找社会所依赖的资源，并在不期望名利的情况下从事危险的、艰苦的工作。工作之所以能完成，是因为它必须完成。维希特尔便是这精神的化身。"
 trait_ifrit:0 "伊夫利特"
 trait_ifrit_desc:0 "在火焰中受锻，在战斗中淬炼，伊夫利特对软弱没有耐心。"
 trait_lilin:0 "莉琳"
 trait_lilin_desc:0 "任性而诱人，莉琳知道她想要什么以及如何得到它。"
 trait_qareen:0 "卡伦"
 trait_qareen_desc:0 "卡伦有即是天赋又是诅咒的强大记忆力，其他镇尼称他们为“行走的图书馆”。"
 trait_shaytan:0 "晒衣陀乃"
 trait_shaytan_desc:0 "交易者、欺骗者、诱惑者、吹牛者——这些都是固定在晒衣陀乃身上的标签。"
 trait_biloko:0 "比洛科"
 trait_biloko_desc:0 ""
