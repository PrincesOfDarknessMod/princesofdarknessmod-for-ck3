l_simp_chinese:
 trait_fae:0 "真妖精"
 trait_fae_desc:0 "真妖精是阿卡迪亚的永生的、强大的和无忧的居民，阿卡迪亚是位于树篱之外的界域。他们也被称为初子、异乡人、绅士、旧神、善族或就妖精，他们是绑架人类并逐渐将他们转化为换生灵的生物。"
 trait_changeling:0 "换生灵"
 trait_changeling_desc:0 "换生灵是生为人类的妖精。旧王廷认为，与第一位男人上床的第一位女人曾是一位初子。从两人的结合中，第一位换生灵诞生了，尽管这对夫妇有更多的孩子，且第一个女人还有其他伴侣。其他的解释，特别是由更反人类的妖精作出的解释是，换生灵是畸形和不受欢迎的妖精的废料残余，他们跟凡人的孩子互相交换并在他们中间长大。"
 trait_kinain:0 "血亲"
 trait_kinain_desc:0 "血亲是一位拥有妖精血统的凡人，但不是一位彻底的换生灵。"
