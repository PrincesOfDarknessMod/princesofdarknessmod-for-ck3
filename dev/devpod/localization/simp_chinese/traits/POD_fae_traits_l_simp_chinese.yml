 trait_prodigal_vampire_desc:0 "The first vampire was an Unseelie Redcap of long ago who swore a blood oath of friendship with his Seelie Sidhe rival after neither could best the other in combat. They became brothers, and performed mighty deeds; but, when they slew a dragon, the Sidhe took all the credit. Incensed, the Redcap bit off his former rival's head in front of the King of the realm, breaking his oath. \"Blood was his crime, blood was his legacy, and so blood would be the root of his power,\" as the story goes, and he was cursed with vampirism, never to know the Dreaming again."
 trait_prodigal_mage_desc:0 "Magi are mortals, but ones who have Awakened to an awareness of the Dreaming, and whose Dreaming talents and magics are far more powerful than those of the Kithain. Changeling myth says that they are the descendants of four children who fell from the sky and destroyed the mighty armies of the fae nobles who discovered them. Those children were Té the Mad (mother of change), Li the Shadow (mother of balance), Ihenn the Ironmaker (father of stasis) and Chla the Unbound (father of decay)."
 trait_prodigal_shifter_desc:0 "Werewolves and the other shapechangers are the descendants of fae who, not wishing to entirely give up the freedom of form possessed by the fae in days of old, chose to adopt animal forms as well as humanoid ones. These fae were closest to the Earth, and when a great and terrible Dark arose to engulf the land, they impatiently quit the ineffectual planning councils of the fae to throw themselves headlong into battle against the foe. While they succeeded in preventing the Dark's victory, they paid a great price - the loss of all their dreams, save the dream of battle."
 trait_prodigal_demon_desc:0 "House Balor assert their expertise on the subject of demons and demonic entities, claiming responsibility for the historic summoning and binding of multiple such creatures in their wars against the Fomorian Courts. House Balor states the demons were ancient fae in a time when Winter was upon the world, but their time passed, and they were exiled to a labyrinth in the Deep Dreaming. Their escape would only be permitted when the need became desperate."
 trait_prodigal_wraith_desc:0 "Ghosts are dark chimera, but chimera that create themselves from the memories of those who die. Only the most creative, imaginative and passionate souls are reformed in the dark chimerical reality called the Shadowlands. (Apart from this slightly different perspective, Changelings - thanks to the Sluagh - have a fairly accurate understanding of wraiths.)"
 trait_prodigal_mummy_desc:0 "Eshu records claim mummies were once enchanted mortals who became one with the chimerical reality of the Dreaming. These enchanted swore oaths to great and noble Arcadians, and through pacts sealed in body and spirit became eternally committed to the causes of their fae gods. Their bodies would never fester, and their spirits would never move on, for as long as they served their masters and maintained balance between the realms of the mundane and the sublime."
 trait_agemo:0 "Agemo"
 trait_agemo_desc:0 "In the common parlance of the Eshu, Agemo literally means chameleon. The word is used by the Elegbara for their kinain since they blend in with both faerie and mortal society."
 trait_itiyere:0 "Itiyere"
 trait_itiyere_desc:0 "Among the Eshu, Itiyere is an uncommon slang term for the Sidhe and comes from traditional ceremonial characters with extremely exaggerated long ears."
 trait_orisha_oko:0 "Orisha-Oko"
 trait_orisha_oko_desc:0 "Orisha-Oko is the orisha of agriculture and the hearth. The Eshu refer to the Boggan kith by this name or by the shortened version Oko."
 trait_taiyewo:0 "Taiyewo"
 trait_taiyewo_desc:0 "In the common parlance of the Eshu, Taiyewo means \"eldest of twins.\" It is the Elegbara name for the Clurichaun kith. See also Ibeji and Kehinde."
 trait_iroko:0 "Iroko"
 trait_iroko_desc:0 "In the common parlance of the Eshu, Iroko is a variety of oak tree and a minor Orisha. It is also the Elegbara name for the Ghille Dhu kith."
 trait_olokuta:0 "Olokuta"
 trait_olokuta_desc:0 "Olokuta is the Orisha of stone. This is also the Eshu name for the Nocker kith."
 trait_kehinde:0 "Kehinde"
 trait_kehinde_desc:0 "In the common parlance of the Eshu, Kehinde translates as the last born of twins. It is also the Elegbara name for the Piskey kith. See also Ibeji and Taiyewo."
 trait_ijapa:0 "Ijapa"
 trait_ijapa_desc:0 "In the common parlance of the Eshu, Ijapa literally means tortoise and was the animal trickster of Yoruba legend. It is the Elegbara name for the Pooka kith."
 trait_jakuta:0 "Jakuta"
 trait_jakuta_desc:0 "In the common parlance of the Eshu, Jakuta is a praise name for the lightening orisha Shango, meaning \"Stone Thrower.\" It is the Elegbara name for the Troll Kith."
 trait_oshosi:0 "Oshosi"
 trait_oshosi_desc:0 "Oshosi, or Oxóssi, is the orisha of the hunt, forest, wild animals, and wealth. He is also associated with meals. His colors are blue and green. The Eshu use this name for the Redcap kith."
 trait_olu_igbo:0 "Olu-Igbo"
 trait_olu_igbo_desc:0 "Olu-Igbo is the Orisha of the bush and wilderness. In the common parlance of the Eshu it is also the term for the Satyr Kith."
 trait_sonponno:0 "Sonponno"
 trait_sonponno_desc:0 "Sonponno or Sopona, is the Orisha of smallpox and by extension other diseases, especially those that produce sores or lesions. Other names include Babalú-Ayé and the praise name Ile-Titu. The Eshu use this name for the Sluagh Kith, derived from their appearance and not generally derogatory."
 trait_domovoi:0 "Domovoi"
 trait_domovoi_desc:0 "A powerful fae of dwellings, a domovoi often takes on the visage of a respected person of the family to speak to those whose home they guard. They know most of the secrets of their freehold. Unless given proper and constant respect, domovoi may divulge these secrets to enemies."
 trait_leshii:0 "Leshii"
 trait_leshii_desc:0 "Horned spirits of the forest, the leshii look like a combination of an old tree covered with moss and an antlered human. They refer to their leader as the \"Lord of the Forest.\""
 trait_kikimora:0 "Kikimora"
 trait_kikimora_desc:0 "The most helpful fae of the household, the kikimora does chores such as weaving and other domestic tasks. Anyone who sees them work should be certain to admire their talents or may find burnt bread, clothing tied in knots, or flasks filled with vinegar in retaliation."
 trait_polevik:0 "Polevik"
 trait_polevik_desc:0 "Lush and voluptuous, these field nymphs, both male and female, find fascination in the various fertility rites practiced by those who understand the connection between sex and plowing fertile ground."
 trait_vodyanoi:0 "Vodyanoi"
 trait_vodyanoi_desc:0 "These mercurial Inanimae of lakes and ponds are friendly to those who use the Anchors they protect as long as they receive gifts and respect. Trouble follows those ignorant of the need for proper thanks and an occasional splash of vodka in the water. The vodyanoi overturn boats of those who do not treat them properly. Anyone who deliberately snubs them should remember to stay off the water if they wish to survive, for the vodyanoi can call lightning down on those they dislike."
 trait_berenginy:0 "Berenginy"
 trait_berenginy_desc:0 "Beautiful nymphs with flowing, dark hair, these lovely fae sing to draw lovers to them but sometimes do not wish to let them go. They dwell along riverbanks and will pull their admirers down to stay with them forever in the murky water along the shore. Many russalki have been created this way. If it were not for their wisdom and their ability to know most of what happens along the river they serve, the dangers of consulting them would outweigh any benefit."
 trait_bannik:0 "Bannik"
 trait_bannik_desc:0 "The spirit of the bathhouse, the bannik is often malicious if not treated with deference and given the last bath of the evening. Banniks help those they favor by giving them visions in the waters they control."
 trait_dvorovoi:0 "Dvorovoi"
 trait_dvorovoi_desc:0 "An animal fae of the yard, the dvorovoi can be very mischievous to those who do not feed or treat them well. They often take the shape of cats to wander and explore their territory."