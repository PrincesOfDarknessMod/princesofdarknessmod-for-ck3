 trait_art_sovereign_advanced_desc:0 "君临是控制平民和展现高贵的术艺。它是戚族最常用的政治术艺之一，其存在主要是为了确保维护他们的政治结构。"
 trait_art_infusion_advanced:0 "聚合之艺精通"
 trait_art_infusion_advanced_desc:0 "聚合是协助诺克制造他们所有奇妙的钟表和奇魅物品的术艺。它涉及到将“FUBARS”和其他奇魅实体转为物理或奇魅形态。"
 trait_art_tale_craft_advanced:0 "叙事之艺精通"
 trait_art_tale_craft_advanced_desc:0 "叙事是讲述奇妙故事的逸抒术艺，它通过提供特效、解读人群和操纵他们的情绪来实现。除少数情况外，叙事魔咒的基础都是一篇故事，无论是说的还是唱的。"
 trait_prodigal:0 "浪子"
 trait_enchanted_dreamers:0 "附魔梦者"
 trait_dark_chimera:0 "黑暗奇魅"
 trait_aphrodesia:0 "催情"
 trait_kryos:0 "霜冻"
 trait_metamorphosis:0 "蜕变"
 trait_pyretics:0 "炎灼"
 trait_petros:0 "御地"
 trait_aquis:0 "御水"
 trait_pyros:0 "御火"
 trait_stratus:0 "御风"
 trait_verdage:0 "御生"
 trait_tieh_tan:0 "金丹"
 trait_lin_tan:0 "木丹"
 trait_shui_tan:0 "水丹"
 trait_hou_tan:0 "火丹"
 trait_di_tan:0 "土丹"
 trait_nei_tan:0 "内丹"
 trait_art_aphrodesia:0 "催情之艺"
 trait_art_aphrodesia_desc:0 "Aphrodesia is the Art of seduction. The fae version of \"Love Potion Number 9\", ranging anywhere from a decent attraction to the subject willing to kill themselves for the object of their affection."
 trait_art_kryos:0 "霜冻之艺"
 trait_art_kryos_desc:0 "Kryos is the Art of cold and ice. Unlike other elemental arts known to the changelings, the powers of Kryos are fairly literal, causing actual coldness, rather than metaphorical chills. Some fear that this Art is closely connected to Banality, given its immobilizing and paralyzing nature."
 trait_art_metamorphosis:0 "蜕变之艺"
 trait_art_metamorphosis_desc:0 "Metamorphosis is the Art of changing the shape of living beings. It differs notably from Primal in this in that, while Primal relates to shaping the unliving, Metamorphosis shapes the living. Through it, one fae can easily become whatever she wants, if only for a short time."
 trait_art_pyretics:0 "炎灼之艺"
 trait_art_pyretics_desc:0 "Pyretics is the art of manipulating real and chimerical fire. In addition to lighting things on fire, Pyretics can also tap into the less destructive aspects of fire, lighting the way and revealing the unseen."
 trait_art_petros:0 "御地"
 trait_art_petros_desc:0 "Petros, one of the two Slivers of Earth, governs shaping stone and imbuing the caster with the physical properties of solid rock. All Inanimae who know Petros can climb up a rocky surface with little difficulty."
 trait_art_aquis:0 "御水"
 trait_art_aquis_desc:0 "Aquis is the Sliver of Water, controlling the movement of water through the atmosphere, as well as reflecting water's association with empathy and medicine. All Inanimae who know Aquis are capable of breathing underwater, and automatically know how to swim."
 trait_art_pyros:0 "御火"
 trait_art_pyros_desc:0 "Pyros is the Sliver of Fire, producing heat and spontaneous combustion, as well as symbolically affecting hot-blooded passion. All Inanimae who know Pyros can spark a tiny flame without the need for matches or equipment."
 trait_art_stratus:0 "御风"
 trait_art_stratus_desc:0 "Stratus is the Sliver of Air, misdirecting both through blindingly fast movements and by producing misty illusions. All Inanimae who know Stratus can feel weather patterns coming from miles away."
 trait_art_verdage:0 "御生"
 trait_art_verdage_desc:0 "Verdage, one of the two Slivers of Earth, governs life and organic matter, especially that which comprises plants. All Inanimae who know Verdage are capable of immediately identifying plant life they see."
 trait_art_tieh_tan:0 "金丹"
 trait_art_tieh_tan_desc:0 "The element of Metal includes all precious and working metals: gold, silver, iron, brass, and steel. While it's scope is rather limited compared to Water or Earth, its overwhelming use is to fashion tools, especially for war. Masters of Metal can be incredible artisans or unassailable warriors."
 trait_art_lin_tan:0 "木丹"
 trait_art_lin_tan_desc:0 "Wood represents the power of the natural world and, as such, has power over much of the world. The natural phenomena it is associated with are any kind of plant, youth, health, and growth."
 trait_art_shui_tan:0 "水丹"
 trait_art_shui_tan_desc:0 "The Shui Fu, or Ministry of Water, is the most powerful, subtle, but inefficient force in the Middle Kingdom. Masters of Water are dreaded and venerated but most serve out of fear.\nWater is one of the most powerful elements. It encompasses all things liquid and gaseous: clouds, methane, water, blood, etc... Water is inherently vital yet dangerous and deceptive. It also controls winds and storms, but not lightning."
 trait_art_hou_tan:0 "火丹"
 trait_art_hou_tan_desc:0 "Masters of Fire are canny opponents and active rulers. They tend to be unable to rest and constantly seek activity and involvement. Fire is associated with lightening, light, flame and all other visible energies. It is found in storms, open flames, computer screens, and blazing magma."
 trait_art_di_tan:0 "土丹"
 trait_art_di_tan_desc:0 "Masters of Di Tan are often wise councillors or, at times, fearsome mandarins. The Yü particularly consider Masters of Earth to be insightful, balanced rulers. Many hsien will flock to the yellow banner of such a one.\nEarth represents all rock, soil, stone, gems, and minerals. Earth is the center of all the elements and the fulcrum of Chinese perceptions of the world. It represents the Middle Kingdom itself."
 trait_art_nei_tan:0 "内丹"
 trait_art_nei_tan_desc:0 "As this Alchemy is based on the Tao Te Hsien, we first need to know what the Tao Te Hsien is not. It is not the Taoism of Lao Tsu, though it was inspired by it. Its point is for the shinma to understand his or her place in the cosmos since the coming of the Wall. Unlike the human philosophy, it has a goal... to give the hsien the power to break through the Wall and journey to the Spirit Worlds.\nIt shares many of the Tao's characteristics. Followers tend to retreat from the trappings of the world and see a life of contemplative ease in nature. They love learning for its own sake but care little for politics. Some are scientists, others priests, others beggars, others warriors. The hsien of Japan have modified it to a more Zen-like philosophy called Hsien-do and, unlike some mortal religions, the Tao Te Hsien welcomes change and individualism, as long is it doesn't become self aggrandizement. It is quiet, mysterious, and profound.\nIt has five steps which roughly correspond to the Taoist creation story, but in reverse. For the Taoists there was first Wu-Wo: Not Nothing. From Wu-Wo came Wu Chi: No Limit. this spawned Hu T'un: Chaos. In the center of this Chaos was a still point, a speck at first that became T'ai Chi: the Great Pole and from this grew Great Change: T'ai I which is divided into two stages: T'ai Chu: the Great First or form, and T'ai Shih: the Great Beginning or the First Breath (Chi). All these eventually led to the creation of the [first_age|E]: T'ai Su: the Great Primordial.\nWhy are the steps in reverse? The steps represent the struggle to return to No Limit; to break the bonds that limit the shinma's travel to the Spirit Worlds. There are many paths back to No Limit but the surest is the Tao Te Hsien. It is rumored that the Profane Gods have their own version of Nei Tan called Hac Tao or the Black Way; a way dictated by a Yama King during the [third_age|E]."
