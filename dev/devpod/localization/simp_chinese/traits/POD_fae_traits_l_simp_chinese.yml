 trait_di_tan:0 "土丹"
 trait_nei_tan:0 "内丹"
 trait_art_aphrodesia:0 "催情之艺"
 trait_art_aphrodesia_desc:0 "催情是关于诱惑的术艺。它是妖精版的“第九号爱情香水”，范围从一般的吸引对象到让人愿意为其爱慕的对象自杀。"
 trait_art_kryos:0 "霜冻之艺"
 trait_art_kryos_desc:0 "霜冻是关于寒冷与冰雪的术艺。与妖精所知的其他元素术艺不同，霜冻的力量是相当真实的，它能造成实际的寒冷，而不是隐喻的寒意。有些人担心这种术艺与板讷有着密切的联系，因为它具有使人无法动弹和瘫痪的特性。"
 trait_art_metamorphosis:0 "蜕变之艺"
 trait_art_metamorphosis_desc:0 "蜕变是改变生物形状的术艺。它与原力的显著区别在于，原力与塑造非生物有关，而蜕变则塑造生物。通过它，妖精可以轻易地变成任何她想要的样子，哪怕只是短暂的。"
 trait_art_pyretics:0 "炎灼之艺"
 trait_art_pyretics_desc:0 "炎灼是一门操纵真实和虚幻之火的术艺。除了点燃东西，炎灼还能利用火的破坏性较小的一面，照亮道路，揭示不可见的事物。"
 trait_art_petros:0 "御地"
 trait_art_petros_desc:0 "御地是两种地之派衍之一，掌管塑造石头，并赋予施法者坚硬岩石的物理特性。所有了解御地的元素妖都能毫不费力地爬上岩石表面。"
 trait_art_aquis:0 "御水"
 trait_art_aquis_desc:0 "御水是水之派衍，控制水在大气中的流动，也反映了水与同理心和医学的联系。所有知道御水的元素妖都能在水下呼吸，并自动学会游泳。"
 trait_art_pyros:0 "御火"
 trait_art_pyros_desc:0 "御火是火之派衍，能产生热量和允许自燃，也象征着热血沸腾的激情。所有知道御火的元素妖都能在不需要火柴或设备的情况下点燃微小的火焰。"
 trait_art_stratus:0 "御风"
 trait_art_stratus_desc:0 "御风是气之派衍，允许通过令人眼花缭乱的快速移动和虚无缥缈的幻觉来误导方向。所有了解御风的元素妖都能感受到几英里外的天气变化。"
 trait_art_verdage:0 "御生"
 trait_art_verdage_desc:0 "御生是两种地之派衍之一，掌管生命和有机物，尤其是植物。所有了解御生的动物都能立即识别出它们所看到的植物生命。"
 trait_art_tieh_tan:0 "金丹"
 trait_art_tieh_tan_desc:0 "金元素包括所有贵金属和工用金属：金、银、铁、铜和钢。虽然与水丹或土丹相比，金丹的作用范围相当有限，但它的主要用途是制造工具，尤其是战争工具。"
 trait_art_lin_tan:0 "木丹"
 trait_art_lin_tan_desc:0 "木代表自然界的力量，因此对世界上的许多事物都有影响力。与木有关的自然现象包括各种植物、青春、健康和成长。"
 trait_art_shui_tan:0 "水丹"
 trait_art_shui_tan_desc:0 "水是最强大的元素之一。它包括所有液态和气态的东西：云、甲烷、水、血液等。水具有与生俱来的生命力，但也具有危险性和欺骗性。它还能控制风和风暴，但不能控制闪电。"
 trait_art_hou_tan:0 "火丹"
 trait_art_hou_tan_desc:0 "火与闪电、光和火焰（几乎任何形式的可见能量）有关。火存在于风暴、明火和炽热的岩浆中。"
 trait_art_di_tan:0 "土丹"
 trait_art_di_tan_desc:0 "土代表所有岩石、土壤、石头、宝石和矿物。土是所有元素的中心，因此连接着所有元素，是中国人认识世界的支点。土也代表中原本身。"
 trait_art_nei_tan:0 "内丹"
 trait_art_nei_tan_desc:0 "内丹是妖仙为追求[tao_te_hsien|E]而修炼的道家五丹。"
 trait_art_aphrodesia_advanced:0 "催情之艺精通"
 trait_art_aphrodesia_advanced_desc:0 "催情是关于诱惑的术艺。它是妖精版的“第九号爱情香水”，范围从一般的吸引对象到让人愿意为其爱慕的对象自杀。"
 trait_art_kryos_advanced:0 "霜冻之艺精通"
 trait_art_kryos_advanced_desc:0 "霜冻是关于寒冷与冰雪的术艺。与妖精所知的其他元素术艺不同，霜冻的力量是相当真实的，它能造成实际的寒冷，而不是隐喻的寒意。有些人担心这种术艺与板讷有着密切的联系，因为它具有使人无法动弹和瘫痪的特性。"
 trait_art_metamorphosis_advanced:0 "蜕变之艺精通"
 trait_art_metamorphosis_advanced_desc:0 "蜕变是改变生物形状的术艺。它与原力的显著区别在于，原力与塑造非生物有关，而蜕变则塑造生物。通过它，妖精可以轻易地变成任何她想要的样子，哪怕只是短暂的。"
 trait_art_pyretics_advanced:0 "炎灼之艺精通"
 trait_art_pyretics_advanced_desc:0 "炎灼是一门操纵真实和虚幻之火的术艺。除了点燃东西，炎灼还能利用火的破坏性较小的一面，照亮道路，揭示不可见的事物。"
 trait_art_petros_advanced:0 "御地精通"
 trait_art_petros_advanced_desc:0 "御地是两种地之派衍之一，掌管塑造石头，并赋予施法者坚硬岩石的物理特性。所有了解御地的元素妖都能毫不费力地爬上岩石表面。"
 trait_art_aquis_advanced:0 "御水精通"
 trait_art_aquis_advanced_desc:0 "御水是水之派衍，控制水在大气中的流动，也反映了水与同理心和医学的联系。所有知道御水的元素妖都能在水下呼吸，并自动学会游泳。"
 trait_art_pyros_advanced:0 "御火精通"
 trait_art_pyros_advanced_desc:0 "御火是火之派衍，能产生热量和允许自燃，也象征着热血沸腾的激情。所有知道御火的元素妖都能在不需要火柴或设备的情况下点燃微小的火焰。"
 trait_art_stratus_advanced:0 "御风精通"
 trait_art_stratus_advanced_desc:0 "御风是气之派衍，允许通过令人眼花缭乱的快速移动和虚无缥缈的幻觉来误导方向。所有了解御风的元素妖都能感受到几英里外的天气变化。"
 trait_art_verdage_advanced:0 "御生精通"
 trait_art_verdage_advanced_desc:0 "御生是两种地之派衍之一，掌管生命和有机物，尤其是植物。所有了解御生的动物都能立即识别出它们所看到的植物生命。"
 trait_art_tieh_tan_advanced:0 "金丹精通"
 trait_art_tieh_tan_advanced_desc:0 "金元素包括所有贵金属和工用金属：金、银、铁、铜和钢。虽然与水丹或土丹相比，金丹的作用范围相当有限，但它的主要用途是制造工具，尤其是战争工具。金丹大师可以是不可思议的工匠，也可以是不可战胜的战士。"
 trait_art_lin_tan_advanced:0 "木丹精通"
 trait_art_lin_tan_advanced_desc:0 "木代表自然界的力量，因此对世界上的许多事物都有影响力。与木有关的自然现象包括各种植物、青春、健康和成长。"
 trait_art_shui_tan_advanced:0 "水丹精通"
 trait_art_shui_tan_advanced_desc:0 "水府是中原最强大、最微妙但最低效的势力。水丹大师令人畏惧，也令人敬仰，但大多数人都因恐惧而为他们服务。\n水是最强大的元素之一。它包括所有液态和气态的东西：云、甲烷、水、血液等。水具有与生俱来的生命力，但也具有危险性和欺骗性。它还能控制风和风暴，但不能控制闪电。"
 trait_art_hou_tan_advanced:0 "火丹精通"
 trait_art_hou_tan_advanced_desc:0 "众所周知，火丹大师是狡猾的对手和活跃的统治者。因为他们无法休息，所以不断寻求行动和参与。\n火与闪电、光和火焰（几乎任何形式的可见能量）有关。火存在于风暴、明火和炽热的岩浆中。"
 trait_art_di_tan_advanced:0 "土丹精通"
 trait_art_di_tan_advanced_desc:0 "地丹大师通常是睿智的参谋，有时也是令人生畏的吏员。禹尤其认为地丹大师是有洞察力的、中庸的统治者。\n土代表所有岩石、土壤、石头、宝石和矿物。土是所有元素的中心，因此连接着所有元素，是中国人认识世界的支点。土也代表中原本身。"
 trait_art_nei_tan_advanced:0 "内丹精通"
 trait_art_nei_tan_advanced_desc:0 "内丹是妖仙为追求[tao_te_hsien|E]而修炼的道家五丹。"
 trait_prodigal_vampire_desc:0 "很久以前，第一位吸血鬼曾是一位哀怒廷红帽子，他与他的喜乐廷仙族对手以血誓发誓成为朋友，因为两者在战斗中都无法取胜。他们成为兄弟，一起完成了伟大的事业；但当他们杀死一条龙时，仙族将所有功劳归于自己。愤怒之下，红帽子在界域之王面前咬下了他曾经的对手的头颅，违背了他的誓言。故事中说：“血是他的罪孽，血是他的传承，因此血将成为他力量的根源”，于是他被诅咒成为吸血鬼，再也无法再次体验到[dreaming|E]的存在。"
 trait_prodigal_mage_desc:0 "魔法师是凡人，但是他们觉醒了对[dreaming|E]的意识，他们的[dreaming|E]才能和魔法比起戚族来更为强大。换生灵的神话说他们是四个从天而降、摧毁了发现他们的妖精贵胄的强大军队的孩子的后代。这些孩子分别是狂怒者——泰（变化之母），影子——理（均衡之母），铸铁者——伊亨（静滞之父）和无缚者——克拉（朽败之父）。"
 trait_prodigal_shifter_desc:0 "狼人和其他化形者是不愿完全放弃在古老时代所拥有的自由形态，选择同时采取动物形态和人形的仙族。这些仙族与大地最为亲近，当一股巨大而可怕的黑暗崛起来吞噬土地时，他们不耐烦地离开了妖精低效率的计划委员会，毅然投身于与敌人的战斗。虽然他们成功阻止了黑暗，但他们付出了巨大的代价——失去了除了战斗之梦以外的所有梦。"
 trait_prodigal_demon_desc:0 "巴烙世家声称在与弗摩尔族王廷的战争中，他们负责召唤和约束多个恶魔和邪恶实体，并在这方面具备专业知识。巴烙世家表示这些恶魔曾是远古的妖精，生活在世界入冬的时代，但他们的时代已经过去，被流放到了[deep_dreaming|E]的迷宫中。只有在形势危急时，他们才会被允许逃离迷宫。"
 trait_prodigal_wraith_desc:0 "幽灵是黑暗奇魅，但是是由死者的记忆自我创造的奇魅。只有最具创造力、想象力和激情的灵魂才能在被称为[shadowlands|E]的黑暗奇幻现实中得到改造。（除了这个略有不同的观点，换生灵——多亏了斯珞俄——对死灵有相当准确的理解）。"
 trait_prodigal_mummy_desc:0 "根据逸抒的记载，木乃伊曾是受附魔的凡人，他们与[dreaming|E]的奇魅现实融为一体。这些受附魔的人向伟大而高贵的阿卡迪亚族宣誓，并通过封印在身体和精神中的契约，永远致力于他们妖精神的事业。只要他们侍奉主人，维持世俗与崇高之间的平衡，他们的身体就永远不会溃烂，他们的灵魂也永远不会离世。"
 trait_agemo:0 "阿格莫"
 trait_agemo_desc:0 "在逸抒的通常说法中，阿格莫意为变色龙。埃拉巴拉用这个词来形容他们的亲族，因为他们既能融入妖精社会，也能融入凡人社会。"
 trait_itiyere:0 "伊蒂耶尔"
 trait_itiyere_desc:0 "在逸抒中，伊蒂耶尔是对仙族的一种不常见的俚语，来自于传统仪式中长着极其夸张的长耳朵的角色。"
 trait_orisha_oko:0 "奥里莎奥科"
 trait_orisha_oko_desc:0 "奥里莎奥科是农业和炉灶的奥里莎。逸抒用这个名字或简称奥科来称呼博甘戚系。"
 trait_taiyewo:0 "泰耶沃"
 trait_taiyewo_desc:0 "在逸抒的通俗语言中，泰耶沃的意思是“双胞胎中第一个出生的”。它是埃拉巴拉对克鲁尔坎戚系的称呼。"
 trait_iroko:0 "伊洛古"
 trait_iroko_desc:0 "在逸抒的通常说法中，伊洛古是一种橡木和一位次奥里莎，它是吉尔杜戚系的埃拉巴拉名。"
 trait_olokuta:0 "奥洛库塔"
 trait_olokuta_desc:0 "奥洛库塔是石头的奥里莎。这也是诺克戚系的逸抒名称。"
 trait_kehinde:0 "钦德"
 trait_kehinde_desc:0 "在逸抒的通俗语言中，钦德的意思是“双胞胎中后一个出生的”。它是埃拉巴拉对皮克西戚系的称呼。"
 trait_ijapa:0 "伊贾帕"
 trait_ijapa_desc:0 "在逸抒的通常说法中，伊贾帕的字面意思是乌龟，是约鲁巴传说中的捣蛋鬼。它是对噗咔的埃拉巴拉称呼。"
 trait_jakuta:0 "查库塔"
 trait_jakuta_desc:0 "在逸抒的通常说法中，查库塔是对闪电神尚戈的赞美之名，意为“投石者”。它是巨魔戚系的埃拉巴拉名。"
 trait_oshosi:0 "奥西西"
 trait_oshosi_desc:0 "奥西西是司掌狩猎，森林，动物和财富的奥里莎。他也和食物联系在一起。他的颜色是蓝色和绿色。逸抒用这个名字称呼红帽子戚系。"
 trait_olu_igbo:0 "奥卢·伊博"
 trait_olu_igbo_desc:0 "奥卢·伊博是丛林和荒野的奥里莎。在逸抒的常用说法中，它也是指羊人戚系的术语。"
 trait_sonponno:0 "索波诺"
 trait_sonponno_desc:0 "索波诺或索波娜，是天花之奥里莎，同时也代表其他疾病，尤其是那些会产生疮或溃疡的疾病。其他名字包括芭芭鲁·阿耶和赞美名伊莱·蒂图。逸抒使用这个名字来称呼斯珞俄戚系，这个名称是根据它们的外貌而来，并不带有贬义。"
 trait_domovoi:0 "多莫沃伊"
 trait_domovoi_desc:0 "一类强大的家养妖精，多莫沃伊是居所的守护者，通常会扮成家族中受人尊敬的人的形象与那些他们守护的家庭成员交谈。他们了解自己永契堡的大部分秘密。除非得到适当而持续的尊重，否则多莫沃伊可能会将这些秘密泄露给敌人。"
 trait_leshii:0 "莱西"
 trait_leshii_desc:0 "作为森林中的有角之灵，莱西的外貌看起来像是一棵长满苔藓的老树和带有鹿角的人的结合体。他们称自己的领导者为“森林之主”。"
 trait_kikimora:0 "奇奇莫拉"
 trait_kikimora_desc:0 "最有帮助的家中妖精，奇奇莫拉负责编织和其他家务事。任何看到她们工作的人都应该确信赞赏她们的才能，否则可能会遭遇烧焦的面包、打了结的衣物，或者充满醋的瓶子作为报复。"
 trait_polevik:0 "波列维克"
 trait_polevik_desc:0 "这些丰腴而妖娆的田野宁芙，无论是男性还是女性，都对那些理解性与耕作肥沃土地之间联系的人们所进行的各种生育仪式充满着迷。"
 trait_vodyanoi:0 "沃蒂亚诺伊"
 trait_vodyanoi_desc:0 "这些水潭和湖泊中多变的元素妖对那些使用它们所守护的锚点的人友善，只要他们得到礼物和尊重。对于那些不了解正确感恩和偶尔在水中泼洒伏特加的蠢货来说，麻烦就会接踵而至。沃蒂亚诺伊会翻覆那些不善待它们的船只。任何故意冷落它们的人应该记住，如果他们希望生存下去，就要远离水域，因为沃蒂亚诺伊可以向那些他们不喜欢的人召唤闪电。"
 trait_berenginy:0 "贝伦吉尼"
 trait_berenginy_desc:0 "优雅而美丽的宁芙们，长发飘逸、黑如夜幕，她们以歌声吸引恋人的靠近，但有时却不愿放他们离去。她们居住在河岸边，将仰慕者拖入浑浊的水中，永远与她们共度时光。许多俄罗斯水妖就是这样诞生的。若非她们的智慧和她们对所侍奉的河流中发生的大部分事情的了解，与她们交流所带来的危险将超过任何好处。"
 trait_bannik:0 "巴尼克"
 trait_bannik_desc:0 "浴室之灵——巴尼克，如果不受尊敬并没有得到晚间最后一次洗澡，通常会变得恶意。巴尼克通过在他们控制的水中给予幻象来帮助那些他们喜欢的人。"
 trait_dvorovoi:0 "护院精"
 trait_dvorovoi_desc:0 "护院精是一种院中动物妖精，对于那些不给它们食物或不善待它们的人来说，它们可能会非常调皮。它们经常化身为猫，四处游荡，探索自己的领地。"
 trait_hsien_desc:0 "在很久以前，中国的妖精是灵界的使者和仆从。在那个时代，他们自由穿梭于灵界和凡界之间，他们是自然的使者，圣地的守护者和保护者。妖仙是那些被困在人间的存在的后裔。在形态和王廷的分裂中，妖仙为了在一个背弃了灵界的凡界中生存而奋斗。"