 trait_paroseme_desc:0 ""
 trait_solimond:0 "索利蒙德"
 trait_solimond_desc:0 ""
 trait_mannikin:0 "马内坎"
 trait_mannikin_desc:0 ""
 trait_art_sovereign:0 "君临之艺"
 trait_art_sovereign_desc:0 "Sovereign is the Art of controlling commoners and noble majesty. It is one of the most political Arts commonly practiced by the Kithain, and exists largely to ensure the maintenance of their political structures."
 trait_art_chicanery:0 "诈瞒之艺"
 trait_art_chicanery_desc:0 "Chicanery is the deceptive magical power of illusion and emotional manipulation. Those who practice it extensively are often considered somewhat untrustworthy by nobles."
 trait_art_legerdemain:0 "幻戏之艺"
 trait_art_legerdemain_desc:0 "Legerdemain allows a changeling to control his environment through telekinetic means, from remotely picking pockets to grabbing and hurling large objects around. This Art also allows for the creation of solid illusionary objects and creatures."
 trait_art_primal:0 "原力之艺"
 trait_art_primal_desc:0 "Primal allows a changeling to manipulate the forces of nature, from summoning the elements to communing with inanimate objects. It also gives power over the body, allowing a fae to harden his skin like tree bark, heal injuries, rip flesh apart and even shapeshift."
 trait_art_soothsay:0 "真言之艺"
 trait_art_soothsay_desc:0 "Soothsay represents the changeling's ability to see into the future. Depending on the realms used in conjunction, the changeling may be able to learn information about a person, place, or item."
 trait_art_wayfare:0 "飞路之艺"
 trait_art_wayfare_desc:0 "The Art of Wayfare deals with a changeling's ability to move through space. This involves bouncing and covering far distances, speeding forward on feet that move impossibly fast, and even teleporting from one place to another."
 trait_realm_actor:0 "角色领域精通"
 trait_realm_actor_desc:0 "角色是与所有世俗众生相连的领域，与你对他们的了解程度直接相关。你对一个特定的生命越不熟悉，无论是狼人、凡人、死灵、吸血鬼等等，对角色的精通程度就得越高。要影响敌视你的人，无论对其的了解如何，都需要最高级精通。"
 trait_realm_fae:0 "妖精领域精通"
 trait_realm_fae_desc:0 "妖精领域与其他[dreaming|E]生物相关。影响其他换生灵、仙族贵胄、魔妖、奇魅，甚至是控制妖精魔法本身，都属于妖精的范畴。"
 trait_realm_nature:0 "自然领域精通"
 trait_realm_nature_desc:0 "自然是对植物、动物和大地的控制。任何非人造的物事都在自然领域之下。"
 trait_realm_prop:0 "道具领域精通"
 trait_realm_prop_desc:0 "道具是对所有被制造的物体的控制和操纵。衣服、武器、建筑和其他任何“人造”的物品都属于道具。 设备越复杂，对道具领域的掌握就得更高。"
 trait_realm_scene:0 "场景领域精通"
 trait_realm_scene_desc:0 "场景是对空间的控制。你对场景领域掌握得越多，你就能影响更大的区域或（与其他领域结合）影响更多的目标。"
 trait_realm_time:0 "时间领域精通"
 trait_realm_time_desc:0 "时间是对你的魔咒何时发生或持续多久的控制。对时间的掌握决定了你的法术可以持续多长时间，或者你可以对它们设置的延后“触发”时间。"
 trait_realm_air:0 "气之领域精通"
 trait_realm_air_desc:0 "Air is the element that surrounds the globe. It effects non-living environment and a cantrip that effects weather, air, temperature, or anything else within the area of the caster or target."
 trait_realm_earth:0 "地之领域精通"
 trait_realm_earth_desc:0 "Earth affects non-living, non-supernatural objects, natural and crafted."
 trait_realm_fire:0 "火之领域精通"
 trait_realm_fire_desc:0 "Fire is used to effect non-supernatural living creatures. It effects only the physical aspect of such creatures. This realm would also be used to affect mortal humans physically."
 trait_realm_water:0 "水之领域精通"
 trait_realm_water_desc:0 "Water only effects the mental environment of non-supernatural living creatures. Confusing others needs this realm."
 trait_realm_spirit:0 "灵之领域精通"
 trait_realm_spirit_desc:0 "Spirit is used to effect any aspect of a supernatural being or thing, including other Fae. It effects environment as well as the physical and mental realms. It also effects enchanted mortals."
 trait_faerie_eternity:0 "妖精永恒"
 trait_faerie_eternity_desc:0 "在你经历了破蛹之后，你过了一个生日，然后又一个，然后又一个。然而很奇怪——你似乎没有在成长或变老。你被眷染到了曾经是所有妖精与生俱来的永生的残余。"
 trait_firstbornfae:0 "首生妖精"
 trait_firstbornfae_desc:0 "首生妖精是从原初迷雾涌现而生的生物。首生妖精声称他们统治甚至创造了整个世界，只有他们才有权利支配魔法界的法则和法令。虽然持怀疑态度，但许多妖精同意这一点，并称他们为“真妖精”。人类的兴起强烈地削弱了首生妖精的力量，许多人担心如果不采取行动，他们的命运会受到影响。一些已经离开地球，在阿卡迪亚避难。"
 trait_denizen:0 "魔妖"
 trait_denizen_desc:0 "戚族武断地称这些生物为“暗之一族”，因为他们有着担任弗摩尔族之仆的卑劣声誉。尽管他们突然离开了人类的土地，但魔妖依然与人类的心灵保持着直接的、尽管是微妙的联系。作为人类梦境或恐惧的不同方面的化身，魔妖的种类繁多且复杂。"
 trait_oba:0 "奥巴"
 trait_oba_desc:0 "The Nobles of the Elegbara, land-bound cousins to the Eshu."
 trait_art_chronos:0 "时刻之艺"
 trait_art_chronos_desc:0 "Chronos is the Art of temporal manipulation. Unlike the methods of altering time known to other supernaturals, Chronos is fairly indirect, and almost never goes in linear order - instead, it is an Art of being disjunct from the proper order of time, causing its practitioners to be difficult to affect with Time magic, and lose sight of how time should operate."
 trait_art_dream_craft:0 "梦工之艺"
 trait_art_dream_craft_desc:0 "Dream-Craft is the Art of manipulating the raw stuff that the [dreaming|E] is made of. This art allows Sidhe to change the physical forms within the Dreaming, which can affect the way that freeholds and other sanctuaries of the Dreaming look. It can also affect voile, the chimerical clothing that changelings wear while in the Dreaming."
 trait_art_naming:0 "命名之艺"
 trait_art_naming_desc:0 "Naming is the Art of True Names and the power of words. It is one of the most insidious Arts known to the Kithain, as while its low levels are deceptively non-threatening, a master of Naming can easily cause irreparable damage. Overly frivolous uses of Naming are not taken lightly by the nobility, who swiftly bring justice to those who subvert its effects."
 trait_art_infusion:0 "聚合之艺"
 trait_art_infusion_desc:0 "Infusion is the Art that assists Nockers in creating all of their wonderful clockwork and chimerical items. It involves the connection of \"FUBARS\" and other chimerical entities into physical or chimerical forms."
 trait_art_tale_craft:0 "叙事之艺"
 trait_art_tale_craft_desc:0 "Tale Craft is the Eshu Art of telling wondrous stories, by means of providing special effects, reading the crowd, and manipulating their emotions. The Bunk for a Tale Craft cantrip is, with few exceptions, a story, whether spoken or sung."
