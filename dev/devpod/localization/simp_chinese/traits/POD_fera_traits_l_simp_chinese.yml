l_simp_chinese:
 trait_fera: "$glossary_fera$"
 trait_ajaba: "阿迦巴"
 trait_ajaba_desc: "鬣狗人是盖亚在非洲的战士，非洲大陆没有狼的种群。虽然魂怒之战并未波及非洲，但阿迦巴却因内讧与芭丝特的敌对而几乎被摧毁。"
 trait_track_ajaba: "声望"
 trait_track_ajaba_desc: "#italic 阿迦巴一族向来尊崇狡黠与凶暴为荣耀之道，但他们对恶名亦有所求，许多成员正忧虑这种追求可能带来的长远影响。#!"
 trait_ananasi: "阿南西"
 trait_ananasi_desc: "这些蜘蛛化形者并非盖亚子嗣，而是$glossary_weaver$之女；强大精魂安娜纳莎的后裔。其他$glossary_fera$视他们为诡异的存在不无道理：其兽形乃是成群的爬行蜘蛛，既不具狂怒之力，又以窃取人血为能量源泉。其名源自西非的诡计之神安纳西。"
 trait_track_ananasi: "声望"
 trait_track_ananasi_desc: "#italic 阿南西可通过$glossary_triat$获得荣誉：象征$glossary_wyrm$的狡智、代表$glossary_weaver$的服从、体现$glossary_wyld$的睿智。无论隶属何派，他们都试图兼顾三者，以参透存在之\"大网\"的真谛。#!"
 trait_apis: "阿皮斯"
 trait_apis_desc: "原牛人或月牛，阿皮斯人负责种植和农业，被称为“盖亚的媒人”。他们在魂怒之战中被狼族赶尽杀绝。"
 trait_track_apis: "声望"
 trait_track_apis_desc: "#italic 阿皮斯是一种相对社会化的生物，它们以六到二十四只为一群生活在一起。每牛群都由一头强大的公牛统治，并捍卫自己的头衔，抵御所有挑战者。这头公牛负责保护族群，并在战斗中发挥领导作用。#!"
 trait_bastet: "芭丝特"
 trait_bastet_desc: "猫人有许多不同的部族，就像狼族一样，尽管每个部族都声称自己拥有不同种类的野猫。它们痴迷于秘密知识，一直在追寻和囤积这些知识。许多人是伟大的施法者，其他人则是伟大的战士，但他们很少是群居动物，一般都是单独行动。他们中的一些部族在魂怒之战中遭受了巨大的损失。"
 trait_track_bastet: "声望"
 trait_track_bastet_desc: "#italic 芭丝特社会存在等级制度，虽不似狼族那般绝对权威，却代表着对资历的礼敬。其头衔在阶层之外更蕴含社会意义。#!"
 trait_camazotz: "卡玛佐兹"
 trait_camazotz_desc: "卡玛佐兹是蝙蝠人，盖亚的夜间和南半球的信使，与科拉克斯相对应。"
 trait_track_camazotz: "声望"
 trait_track_camazotz_desc: "#italic 卡玛佐兹曾是高度社会化的血种，以十二至百人的平等群落聚居，常与蝙蝠兽嫡共栖洞窟。虽天性隐秘，却竭力与其他$glossary_fera$维持友好往来。#!"
 trait_corax: "科拉克斯"
 trait_corax_desc: "渡鸦人是盖亚的信使、间谍和侦察兵，它们在天空中巡逻，时刻警惕着危险。它们是糟糕的话匣子，会把自己看到的一切告诉任何愿意倾听的人。在魂怒之战中，他们通过帮助狼族躲过了迫害，并与狼人保持着在所有化兽族裔中与其最友好的关系。"
 trait_track_corax: "声望"
 trait_track_corax_desc: "#italic 科拉克斯如狼族新月般赢取荣誉，但更侧重其特有的智慧之道。脆弱的鸦人常忽视勇名。#!"
 trait_grondr: "格隆迪尔"
 trait_grondr_desc: "野猪人位于北欧。他们的使命是清洁土地，被称为盖亚的美容师。在魂怒之战期间，他们被狼族赶尽杀绝；他们的祖灵落入了$glossary_wyrm$之手，使其等成了畸形的骸猪。"
 trait_track_grondr: "声望"
 trait_track_grondr_desc: "#italic 格隆迪尔是一个活跃而好斗的种族。他们生活在名为豚群的部族中，每个群落由一个国王或女王领导。每个豚群统治者与其他所有豚群统治者都是平等的；他们没有超越豚群个体的阶级制度。#!"
 trait_gurahl: "古拉赫勒"
 trait_gurahl_desc: "熊人是盖亚的治疗师，他们与地球的联系比任何其他化兽族裔都更加紧密。许多狼族相信古拉赫勒已经灭绝，他们在魂怒之争中被杀死，因为他们不愿意放弃让死者恢复生命的秘密。"
 trait_track_gurahl: "声望"
 trait_track_gurahl_desc: "#italic 古拉赫勒承认三种声望：名誉，源自奉献和尊重；救助，源自治疗、净化或帮助他人；智慧，源自恢复、保存或发掘知识或加深对自身的了解。#!"
 trait_kitsune: "狐妖"
 trait_kitsune_desc: "狐人是施法者和政治家，维系着亚洲化形者社会。在化兽族裔中，狐人是唯独只出现在中原的兽庭中的，主要生活在中国和日本。在露娜的庇佑下，狐妖还充当凡人社会中腐败当局的刺客，充当宫廷施法者和盗贼，以保护天命。"
 trait_track_kitsune: "尾巴"
 trait_track_kitsune_desc: "#italic 狐妖初生仅一尾。盖亚赐其每晋阶则增一尾。九尾者得永生，因其实力与德行备受尊崇。#!"
 trait_mokole: "魔克拉"
 trait_mokole_desc: "这些龙人是盖亚的记忆。远古龙王的后裔围绕着世界的四条原始河流，将自己组织成四大\"支流\"。一旦人类文明衰落，伟大的国王们将从荒原中崛起，重掌统治。"
 trait_track_mokole: "声望"
 trait_track_mokole_desc: "#italic 魔克拉沿用狼族荣誉体系，崇尚荣耀、智慧与勇名三大信条。每条信条的践行程度完全取决于其月兆。#!"
 trait_nagah: "娜迦"
 trait_nagah_desc: "蛇人起源于印度。大多数（如果不是全部的话）其他化形族裔都认为它们已经死亡，但它们却依然存在。作为“盖亚的审判者”，娜迦既是无声的审判者，也是化形种族的隐藏刽子手。"
 trait_track_nagah: "声望"
 trait_track_nagah_desc: "#italic 由于蛇巢是游牧的，娜迦必须寻找舍沙们，才能从他们那里获得声望。舍沙在听取了蛇巢的事迹后，会决定给予他们哪些声望。这决定了娜迦的阶级，反过来也决定了娜迦能学到的灵赋。#!"
 trait_nuwisha: "努维狭"
 trait_nuwisha_desc: "郊狼人是盖亚的教师，不过和它们的图腾——老郊狼神——一样，它们更喜欢通过恶作剧来传授知识。由于对露娜的恶作剧，它们不再拥有魂怒，尽管它们比其他化兽族裔更亲近[umbra|E]。"
 trait_track_nuwisha: "声望"
 trait_track_nuwisha_desc: "#italic 与其他大多数通过部族荣誉和青睐获得等级的$glossary_fera$不同，努维沙通过教导获取声望。他们不以荣誉为准则，而是以幽默为本，在郊狼化身的眼中表现得越幽默，他们获得的声望就越多。#!"
 trait_ratkin: "鼠族"
 trait_ratkin_desc: "鼠人曾经监护着人类，防止他们的数量变得过多。然而，狼族篡夺了这一身份，从那时起，鼠族就开始憎恨狼族。他们坚定地为$glossary_wyld$而战，并利用一切机会破坏科技。"
 trait_track_ratkin: "声望"
 trait_track_ratkin_desc: "#italic 鼠族虫窝等级森严。鼠王统御全族，侍从皆鼠形同族环绕。寻常鼠人则位列其下。#!"
 trait_rokea: "罗基阿"
 trait_rokea_desc: "即使是大海也有它的保护者。鲨鱼人在海洋深处巡逻，很少被陆地居民看到。"
 trait_track_rokea: "声望"
 trait_track_rokea_desc: "#italic 罗基阿接受三种形式的声望：勇气指的是鲨人在保卫石洞时的战斗力和英勇；和谐指的是鲨人接受自己在世界上的定位并按照这个位置行事的能力；创新则是授予那些通过新想法帮助族人保卫海洋并击退西里尔的造物的鲨人。#!"
 trait_entomos: "虫族"
 trait_entomos_desc: "虫族是由织者间接创造的一类$glossary_fera$，包括阿南西、昆虫一族和刻托。他们都是$glossary_weaver$的子孙，对织者的信仰、科学和教条有着与生俱来的向往。"
 trait_track_entomos: "声望"
 trait_track_entomos_desc: "#italic 位阶是虫族社会的核心架构，他们通过经验与技能体系来构建严密组织。#!"
 trait_hakken: "八犬"
 trait_hakken_desc: "日本的狼人，崇尚武士道哲学。"
 trait_kumo: "蜘蛛精"
 trait_kumo_desc: "堕落为$glossary_wyrm$走狗的蜘蛛人。"
 trait_tengu: "天狗"
 trait_tengu_desc: "远东的渡鸦人，他们是兽庭的侦察兵和传令官。"
 trait_okuma: "大熊"
 trait_okuma_desc: "大熊是生活在东南亚（包括印度北部和日本东部）的古拉赫勒部族。他们的动物亲缘包括太阳熊、月亮熊和大熊猫。与其他崇拜盖亚为母亲的古拉赫勒部族，露娜女神是他们变形能力的源泉，大熊还与赫利俄斯有着特殊的关系。每位大熊的皮毛上都有鲜艳的斑纹。"
 trait_zhong_lung: "中龙"
 trait_zhong_lung_desc: "中龙与其他亚洲化兽族裔合作，被称为哲人支流。他们认可四种季兆，这决定了他们在龙人社会和兽庭中的角色。"
 trait_nezumi: "鼠妖"
 trait_nezumi_desc: "亚洲的鼠人，其等正在发动一场对抗人类的低劣战争。"
 trait_same_bito: "鲛人"
 trait_same_bito_desc: "鲨鱼人，其等认为自己比罗基阿高雅得多。"
 trait_ozuzo: "奥祖佐"
 trait_ozuzo_desc: "奥祖佐是堕落为$glossary_wyrm$走狗的阿迦巴。"
 trait_histpah: "希斯塔帕"
 trait_histpah_desc: "希斯塔帕是撒谎大王，受$glossary_wyrm$腐化的芭丝特。"
 trait_buzzards: "巴泽兹"
 trait_buzzards_desc: "巴泽兹是迷失之子，是被$glossary_wyrm$污染的科拉克斯。"
 trait_purgers: "普格斯"
 trait_purgers_desc: "普格斯是堕落古拉赫勒。"
 trait_nokhomi: "诺克霍米"
 trait_nokhomi_desc: "诺克霍米也被称为苦咧，是堕落努维沙。"
 trait_mad_destroyers: "疯狂毁灭者"
 trait_mad_destroyers_desc: "疯狂毁灭者是堕落鼠族。"
 trait_balefire_sharks: "恶火鲨"
 trait_balefire_sharks_desc: "恶火鲨是受$glossary_wyrm$污染的罗基阿。"
 trait_xibalan: "西巴兰"
 trait_xibalan_desc: "西巴兰是通过守护神蝙蝠受污染的一面而忠于$glossary_wyrm$的卡玛佐兹。"
 trait_skull_pig: "骸猪"
 trait_skull_pig_desc: "骸猪是一种与妖蛆相关的生物，是由格隆迪尔一族为了在魂怒之战中幸存下来而投靠$glossary_wyrm$后随之诞生的。"
 trait_breed: "血种"
 trait_homid_born: "人子"
 trait_homid_born_desc: "人子是$glossary_fera$血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_kojin: "荒神"
 trait_kojin_desc: "荒神是狐妖血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_balaram: "婆罗罗摩"
 trait_balaram_desc: "婆罗罗摩是娜迦血种之一，作为人类出生并由人类抚养，因此人形也是他们的自然形态。"
 trait_beast_born: "兽子"
 trait_beast_born_desc: "兽子是$glossary_fera$血种之一，作为动物出生并由动物抚养，因此兽形也是他们的自然形态。"
 trait_lupus_born: "狼子"
 trait_lupus_born_desc: "狼子是狼族血种之一，作为狼出生并由狼抚养，因此狼形也是他们的自然形态。"
 trait_hyaena_born: "鬣子"
 trait_hyaena_born_desc: "鬣子是阿迦巴血种之一，作为鬣狗出生并由鬣狗抚养，因此鬣形也是他们的自然形态。"
 trait_bos_born: "牛子"
 trait_bos_born_desc: "牛子是阿皮斯血种之一，作为牛出生并由牛抚养，因此牛形也是他们的自然形态。"
 trait_feline_born: "猫子"
 trait_feline_born_desc: "猫子是芭丝特血种之一，作为大猫出生并由大猫抚养，因此猫形也是他们的自然形态。"
 trait_chiroptera_born: "蝙蝠子"
 trait_chiroptera_born_desc: "蝙蝠子是卡玛佐兹血种之一，作为蝙蝠出生并由蝙蝠抚养，因此蝙蝠形也是他们的自然形态。"
 trait_corvid_born: "鸦子"
 trait_corvid_born_desc: "鸦子是科拉克斯血种之一，作为渡鸦出生并由渡鸦抚养，因此鸦形也是他们的自然形态。"
 trait_scrofa_born: "猪子"
 trait_scrofa_born_desc: "猪子是格隆迪尔血种之一，作为野猪出生并由野猪抚养，因此野猪形也是他们的自然形态。"
 trait_ursine_born: "熊子"
 trait_ursine_born_desc: "熊子是古拉赫勒血种之一，作为熊出生并由熊抚养，因此熊形也是他们的自然形态。"
 trait_roko_born: "狐子"
 trait_roko_born_desc: "狐子是狐妖血种之一，作为狐狸出生并由狐狸抚养，因此狐形也是他们的自然形态。"
 trait_suchid_born: "龙子"
 trait_suchid_born_desc: "龙子是魔克拉血种之一，作为爬行动物出生并由爬行动物抚养，因此龙形也是他们的自然形态。"
 trait_vasuki_born: "蛇子"
 trait_vasuki_born_desc: "蛇子是娜迦血种之一，作为蛇出生并由蛇抚养，因此蛇形也是他们的自然形态。"
 trait_latrani_born: "郊狼子"
 trait_latrani_born_desc: "郊狼子是努维狭血种之一，作为郊狼出生并由郊狼抚养，因此郊狼形也是他们的自然形态。"
 trait_rodens_born: "鼠子"
 trait_rodens_born_desc: "鼠子是鼠族血种之一，作为鼠出生并由鼠抚养，因此鼠形也是他们的自然形态。"
 trait_squamus_born: "鲨子"
 trait_squamus_born_desc: "鲨子是罗基阿血种之一，作为鲨鱼出生并由鲨鱼抚养，因此鲨鱼形也是他们的自然形态。"
 trait_lunar_auspice: "月兆"
 trait_ahroun: "满月"
 trait_ahroun_desc: "狼族生而有之的五大月兆之一。满月狼是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_galliard: "凸月"
 trait_galliard_desc: "狼族生而有之的五大月兆之一。凸月狼唱诉狼族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_philodox: "半月"
 trait_philodox_desc: "狼族生而有之的五大月兆之一。半月意味着平衡和二元性，在其影响下出生的狼族经常充当其战群的顾问、调解人和守法者。"
 trait_theurge: "眉月"
 trait_theurge_desc: "狼族生而有之的五大月兆之一。眉月赋予了洞察力天赋。眉月狼是狼族的神秘主义者，比任何人都更接近[umbra|E]和它的居民。"
 trait_ragabash: "新月"
 trait_ragabash_desc: "狼族生而有之的五大月兆之一。在新月期间出生的狼人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_dawn: "黎明"
 trait_dawn_female_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的满月狼，黎明女性是战士。"
 trait_dawn_male_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的凸月狼，黎明男性是叙事者。"
 trait_dusk: "黄昏"
 trait_dusk_female_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的新月狼，黎明女性是刺客。"
 trait_dusk_male_desc: "阿迦巴生而有之的两大倾向之一。类似于狼族的眉月狼，黄昏男性是秘术师。"
 trait_uzmati: "乌兹马提"
 trait_uzmati_desc: "古拉赫勒在其一生中经历的五大月兆之一。满月熊是盖亚的活生生的武器。他们是战士种族中的战士，是尚武民族的勇士。他们时刻准备着杀戮，如果有必要，他们也会献身。"
 trait_kojubat: "科居巴特"
 trait_kojubat_desc: "古拉赫勒在其一生中经历的五大月兆之一。凸月熊唱诉熊族的灵魂。他们是人民的声音，呼唤他们去战斗，激励他们在生与死中取得伟大的成就。他们也是传统的守护者，从最初开始就一直延续着部族的知识。"
 trait_rishi: "里舍"
 trait_rishi_desc: "古拉赫勒在其一生中经历的五大月兆之一。半月意味着平衡和二元性，在该阶段的熊族经常充当其战群的顾问、调解人和守法者。"
 trait_kieh: "基赫"
 trait_kieh_desc: "古拉赫勒在其一生中经历的五大月兆之一。眉月赋予了洞察力天赋。眉月熊是狼族的神秘主义者，比任何人都更接近[umbra|E]和它的居民。"
 trait_arcas: "阿卡斯"
 trait_arcas_desc: "古拉赫勒在其一生中经历的五大月兆之一。在新月阶段的熊人就像神话中的诡术使，是交替愚笨与智慧的愚者。他扮演着反对者，质疑传统，以便找到最明智的道途。"
 trait_warriors: "战士"
 trait_warriors_desc: "顾名思义，他们是战士和杀手，是战斗的第一线，就像狼族的满月狼一样。也被称为“刀锋奴隶”。"
 trait_bards: "吟游诗人"
 trait_bards_desc: "吟游诗人是鼠人社会中迷失的一面。俗称“演讲者”，他们充当种族的和平缔造者：鼠族和其他种族之间的中间人，收集传说以增加他们的集体血液记忆。在世界早期，吟游诗人是狼族族群的使者，当他们的种族被背叛时，他们是第一个死去的人。"
 trait_knife_skulkers: "匕首游荡者"
 trait_knife_skulkers_desc: "荣誉的鼠族刺客只按契约工作。他们还充当法官和调解员，就像半月狼族一样。"
 trait_shadow_seers: "暗影先知"
 trait_shadow_seers_desc: "萨满和精神导师，与眉月狼很相似。"
 trait_tunnel_runners: "隧道行者"
 trait_tunnel_runners_desc: "游荡的侦察兵和间谍，他们将世界各地的鼠族洞窟连接起来。与新月狼相似。"
 trait_pryio: "月宠"
 trait_pryio_twilight: "暮光"
 trait_pryio_twilight_desc: "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暮光芭丝特是提问者和追查者，他们倾向于成为侦探、律师、间谍或神秘主义者。"
 trait_pryio_daylight: "日光"
 trait_pryio_daylight_desc: "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。日光芭丝特是开放和直接的，他们倾向于成为外交官、战士、执法者和保护者。"
 trait_pryio_night: "暗夜"
 trait_pryio_night_desc: "也被称为“月宠”，芭丝特通过普里亚（意为宠爱）来决定他们的位置以及猫如何对待生活和处理他们面临的挑战。虽然这通常是由芭丝特实现其原始觉醒的时间决定的，但如果芭丝特经历了严重的生活变化，普里亚也会发生变化。暗夜芭丝特通常是孤僻和隐蔽的，他们往往是刺客、学者、科学家和黑暗魔法的实践者。"
 trait_path: "道途"
 trait_eji: "卫士"
 trait_eji_desc: "战士之道，熔岩系，掌控土和火。"
 trait_doshi: "道士"
 trait_doshi_desc: "术士之道，雷电系，掌控气和火。"
 trait_gukutsushi: "仙术士"
 trait_gukutsushi_desc: "幻术使之道，雾系，掌控水与气。"
 trait_kataribe: "语部"
 trait_kataribe_desc: "说书人之道，黏土系，掌控土和水。"
 trait_solar_auspice: "日兆"
 trait_seasonal_auspice: "季兆"
 trait_kamakshi: "卡玛克什"
 trait_kamakshi_desc: "春——被生命和万物复苏的力量所眷顾，对应的元素是地。"
 trait_kartikeya: "迦絺吉夜"
 trait_kartikeya_desc: "夏——充满活力和真情实感，他们的元气促进了蛇人最大的激情。对应的元素是火。"
 trait_kamsa: "卡姆萨"
 trait_kamsa_desc: "秋——思想是他们的激情的目标所在，也是他们的强项。对应的元素是风。"
 trait_kali: "迦梨"
 trait_kali_desc: "冬——他们的血液是最酷的，他们的眼光是最真实的，他们对功业的奉献是无止境的。对应的元素是水。"
 trait_freak: "畸变"
 trait_engineers: "工程师"
 trait_engineers_desc: "科学家、发明家和工匠，他们喜欢与科技打交道。"
 trait_munchmausen: "孟乔森"
 trait_munchmausen_desc: "獐头鼠目的鼠族、每个都妄自尊大。"
 trait_plague_lords: "瘟疫领主"
 trait_plague_lords_desc: "疾病和腐败的主宰。"
 trait_twitchers: "扭曲者"
 trait_twitchers_desc: "无政府主义者中的无政府主义者，扭曲者是疯狂而不可预测的爆破手。"
 trait_aquatic_auspice: "海兆"
 trait_brightwater: "澈水"
 trait_brightwater_desc: "在光天白日或满月时出生的罗基阿。澈水鲨与狼族的满月狼相似，都是战士和英雄。不过，他们常常渴望靠近海面。"
 trait_dimwater: "幽水"
 trait_dimwater_desc: "幽水鲨出生在阴天或除满月和新月外的月相的夜晚。大多数罗基阿都属于这种情况。他们是罗基阿族的法官和领导者，并创造了罗基阿族使用的少数灵具。"
 trait_darkwater: "暗水"
 trait_darkwater_desc: "暗水鲨被同伴称为“疯狂者”，他们在日食或新月时出生。他们好奇、创新、聪明、大胆。他们喜欢潜入寒冷的深海或在陆地上行走，以揭开新的秘密。"
 trait_lunisolar_auspice: "日月兆"
 trait_lunar: "月光"
 trait_lunar_desc: "这些阿皮斯在夜间出生，充当战士血种，保护他们的据点不受外界威胁。"
 trait_twilight: "暮光"
 trait_twilight_desc: "这些阿皮斯出生在日出或日落时分，是最接近灵界的生物。"
 trait_solar: "日光"
 trait_solar_desc: "这些阿皮斯生于白天，与人类和其他种群的关系最为密切。"
 trait_gnosis: "灵知"
 trait_gnosis_desc: "灵知是一种灵性的、魔法的能量。一些有天赋的凡人可以获得它。灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_gnosis_kinfolk: "兽嫡灵知"
 trait_gnosis_kinfolk_desc: "灵知是一种灵性的、魔法的能量。一些有天赋的兽嫡可以获得它。灵知是可再生的，但也会不断缩减。它可以在圣地、通过冥想或与诸灵谈判来重新获得。圣地可以提供灵知，但如果它被玷污了，灵知就会腐蚀持有者，或者直接消失。"
 trait_abomination: "恶煞"
 trait_abomination_desc: "恶煞是一个用来描述被转为吸血鬼的化形者的术语。不用说，这些生物是非常罕见的，因为几乎所有的化兽族裔都对吸血鬼精血剧烈过敏。恶煞同时受到狼族和吸血鬼的害怕。他们非常强大，大多数很快就会被陷入疯狂，变得兽性大发，甚至无法表现得像人类。"
 trait_werewolf_abomination: "狼族恶煞"
 trait_gurahl_abomination: "影堕"
 trait_abomination_with_type: "[ROOT.Var('fera_type').Trait.GetNameNoTooltip(ROOT.Char.Self)]恶煞"
 trait_kinfolk: "兽嫡"
 trait_kinfolk_desc: "兽嫡，也被称为宗嗣，是指与$glossary_fera$有血缘关系的人类和野生动物，他们不容易罹患妄悸，但他们本身并不是真正的化形者。"
 trait_werewolf_kinfolk: "狼嫡"
 trait_werewolf_kinfolk_desc: "流有狼血，狼族的后裔。"
 trait_kinfolk_with_type: "[ROOT.Var('fera_type').Trait.GetNameNoTooltip(ROOT.Char.Self)]兽嫡"
 trait_faction: "派系"
 trait_aspect: "倾向"
 trait_entomos_breed: "血种"
 trait_clade: "分支"
 trait_myrmidon: "密尔米顿"
 trait_myrmidon_desc: "虫族的士兵、侦察兵、将军和间谍，密尔米顿是虫族中以战斗为导向的派别。"
 trait_viskr: "维斯克"
 trait_viskr_desc: "虫族的贤者、审判者、神秘主义者和通灵者，维斯克是虫族的统治者和专家派别。"
 trait_wyrsta: "维尔斯塔"
 trait_wyrsta_desc: "虫族的阴谋家、哲学家、持不同政见者和塑造者，维尔斯塔是虫族内部变革的催化剂。"
 trait_succor: "苏科尔"
 trait_succor_desc: "疗愈者、治疗师、顾问和虫族的顾问，苏科尔是一个由同理心和理解定义的珍贵派别。"
 trait_tenere: "泰内雷"
 trait_tenere_desc: "织者阵营的阿南西，泰内雷拥有的力量和能力主要围绕记忆、时间和操纵险棘。"
 trait_kumoti: "库莫提"
 trait_kumoti_desc: "$glossary_wyld$阵营的阿南西，库莫提拥有再生和专精于元素的灵赋，能够像驾驭能量的流动。"
 trait_hatar: "哈塔尔"
 trait_hatar_desc: "$glossary_wyrm$阵营的阿南西，哈塔尔是臭名昭著的诱惑者和熵的使用者，他们将血液转化为毒药，并从内部攻击妖蛆。"
 trait_human_born: "人子"
 trait_human_born_desc: "人类所生的虫族，人子虫族使灵类迷惑，并且是相较其他化形者是最有能力的。人子虫族是最不常见的一种虫族，因为它们经历原始觉醒所需的时间相对较长。"
 trait_macro_born: "䖵子"
 trait_macro_born_desc: "虫族分支中较大的一种，䖵子是同类中强大的泰坦，利用原始且极具破坏性的方式获得荣誉，以此夸耀自身庞大的形态。"
 trait_micro_born: "豸子"
 trait_micro_born_desc: "虫族分支中较小的一种，豸子是飘渺而灵活的渗透者，掌握了这种演化，不仅可以出现在任何地方，也可以逃离任何情况。"
 trait_fera_born: "忌子"
 trait_fera_born_desc: "在虫族于智慧生物体内注入的卵所孵化的虫族，忌子天生为战争形态，同时也是虫窝里最好的调解员。"
 trait_titan_born: "泰坦巨子"
 trait_titan_born_desc: "虫族分支中最可怕的一种，可怕的泰坦巨子是安娜纳莎的怪物，向所有非虫族传播妄悸的可怕的灭绝引擎。"
 trait_eshieho: "伊希埃霍"
 trait_eshieho_desc: "刻托的长子，伊希埃霍是她的建筑大师和中介者，作为小龙虾形态的刻托族的舒适中间地带。"
 trait_mishaho: "米沙霍"
 trait_mishaho_desc: "刻托的次子，米沙霍是她的大使和劳动者，采取螃蟹的多功能形态以确保刻托的繁荣。"
 trait_bahaesh: "巴哈什"
 trait_bahaesh_desc: "刻托的幼子，龙虾巴哈什是她的最坚韧的斗士和不可动摇的守护者，精通使用他们巨大的爪子来粉碎刻托的敌人。"
 trait_ishihambi: "伊希汉比"
 trait_ishihambi_desc: "虫族中天生的的领主，伊希汉比是一个极为罕见的族群，他们向更广阔的世界伪装了自己的死亡，以便专注于他们对卡·卢恩和齐格拉格尔的无尽战争。为了帮助他们对[umbra|E]的无尽探索，他们采取了高贵的飞蛾形态。"
 trait_iqhawe: "伊卡维"
 trait_iqhawe_desc: "虫族天生的斗士，伊卡维是他们的铠甲骑士，精通一系列灵赋，以对抗任何威胁$glossary_weaver$的存在。正如适合她的剑术大师一样，织者的斗士们以螳螂作为他们的族群形态。"
 trait_umakhi: "乌玛希"
 trait_umakhi_desc: "虫族天生的建造者，乌玛希是古代暗影帝国最伟大工程的建筑师，为$glossary_weaver$建立了持久的纪念碑。为了帮助完成这项职责，他们化身为白蚁来构建他们的遗产。"
 trait_umlimi: "乌姆利米"
 trait_umlimi_desc: "虫族天生的袭击者，乌姆利米是反对他们的人的灾祸，以他们掌握的群体形态攻击并吞噬他们面前的一切。自然而然地，作为饥荒的使者，他们将蝗虫和其他蚱蜢视为亲属。"
 trait_umbulali: "翁布拉利"
 trait_umbulali_desc: "虫族天生的屠夫，翁布拉利是虫族中令人畏惧且充满愤怒的刺客，他们化身为黄蜂，以更好地匹配他们在摧毁$glossary_weaver$之敌时冷静的狂怒。"
 trait_umhloli: "乌姆霍利"
 trait_umhloli_desc: "虫族中天生的士兵，乌姆霍利是无数且适应性强的，像他们的蚂蚁亲族一样多样化，以支持他们在丰富和保护$glossary_weaver$方面的同胞。"
 trait_injiki: "因吉齐"
 trait_injiki_desc: "虫族中天生的农夫，因吉齐在虫族中因其丰富而珍贵的蜂蜜而闻名，掌管他们的蜜蜂亲属，形成滋养的蜂蜜，以支持和哺育虫族帝国。"
 trait_kstyw: "克斯特乌"
 trait_kstyw_desc: "最年轻的虫族，也是很久以前被流放并从记录中抹去的种族，克斯特乌是顽强内向且坚韧的甲虫虫族，通过团结和耐力在威胁他们的敌人面前茁壮成长。"
 TRAIT_FLAG_DESC_can_become_ancestor_spirit: "@spirit_icon!可以成为[ancestor_spirit|E]"
 trait_werewolf: "狼人"
 trait_werewolf_desc: "一种能够转换形态的超自然生物。他们自称“狼族”。"
 trait_track_werewolf: "声望"
 trait_track_werewolf_desc: "#italic 声望级别是狼族社会的基本组成部分，也是狼人阶级制度的最充分体现。#!"
 TRAIT_FLAG_DESC_is_spirit: "如果没有特殊能力无法造成物理伤害"
 trait_spirit: "灵"
 trait_spirit_desc: "灵类是一种无肉体的虚体，起源于并通常居住在[umbra|E]中——由于这个原因，一些法师称它们为“影族”。"
 trait_track_spirit: "声望"
 trait_track_spirit_desc: "#italic 灵的阶位是其灵性力量的衡量标准。更强大的灵能更好地在物质界显现其力量并援助同伴#!"
