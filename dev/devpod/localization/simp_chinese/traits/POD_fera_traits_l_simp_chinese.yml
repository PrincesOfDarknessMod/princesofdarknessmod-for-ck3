 trait_spirit_mokole_desc: "$pact_tooltip$[GetModifier('spirit_mokole_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_balefire: "烽火元素忌灵"
 trait_spirit_balefire_desc: "$pact_tooltip$[GetModifier('spirit_balefire_pact_modifier').GetNameWithTooltip]\n\nOne of the four tainted Wyrm Elementals. These corrupted fire elementals are believed to be formed from the blood of the Wyrm and represent its intuition and force of will."
 trait_spirit_human_desc: "$pact_tooltip$[GetModifier('spirit_human_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_mokole_mbembe: "魔克拉-姆边贝"
 trait_mokole_mbembe_desc: "传统上，战士支流出没于非洲和美洲的沼泽与水道。他们以其族类的始祖命名，是目前为止最大的支流。在四大支流中，他们在魂怒之战中遭受的损失远超其他，这是一桩永不会被遗忘的罪行。"
 trait_gumagan: "古玛甘"
 trait_gumagan_desc: "被称为先源之流，因其对灵界，特别是梦时代的洞见而备受其他魔克拉尊重。古玛甘最常见于远离水域的地区，有些甚至终生生活在澳大利亚的广袤沙漠之中。"
 trait_makara: "摩迦罗"
 trait_makara_desc: "印度次大陆是摩迦罗众庶之流的诞生之地。印度的人类政治、宗教与秘法思想深刻地影响了这一支系。摩竭罗使用季兆，而非其表亲们的日兆。"
 trait_rising_sun: "旭日"
 trait_rising_sun_desc: "自东方天穹染上红晕至正午之间，阳光直击天宇。在此刻诞生的魔克拉，常出类拔萃于战士、猎人、探索者与追寻者之职。"
 trait_noonday_sun: "午日"
 trait_noonday_sun_desc: "日当正午，太阳君临大地，明察万物。诞生于此兆相下的龙人，大多成为裁判者、律法的执行者，或是巡逻于巢穴周边的卫士。"
 trait_setting_sun: "落日"
 trait_setting_sun_desc: "当太阳西沉，智者便需提防潜藏于渐浓暗影中的邪恶。诞生于此兆相下的龙人，多成为守卫、护士、医者或看护者。"
 trait_midnight_sun: "夜日"
 trait_midnight_sun_desc: "当太阳的生物诞生于黑夜，便会发生奇异而矛盾的事件。他们被黑暗吸引，却仍燃烧着赫利俄斯的光芒。许多人成为诗人、小丑、艺术家、神话创造者或亡者的向导。"
 trait_shrouded_sun: "掩日"
 trait_shrouded_sun_desc: "当太阳被遮蔽，无形的力量便图谋对付那些生活在光中之人。他们大多成为术士、灵魂知识的导师或隐秘学识的学者。"
 trait_decorated_sun: "幻日"
 trait_decorated_sun_desc: "当光芒汇聚，太阳便会被光晕环绕。他们视自己为勤劳的组织者、协调者或媒人。"
 trait_eclipsed_sun: "蚀日"
 trait_eclipsed_sun_desc: "在天文奇观的时刻，可能发生梦幻般的事件。所有魔克拉中最罕见的那些，诞生于日食期间。他们是魔克拉社会的统治祭司；所有龙人都对蚀日恭敬有加。"
 trait_vasanta: "春象"
 trait_vasanta_desc: "春季月兆，也是印度魔克拉的战士。他们同样是旅行者，总是渴望聆听新事物。"
 trait_grisma: "夏象"
 trait_grisma_desc: "夏季月兆，也是摩迦罗的裁判者。他们被期望寻求真理与正义。在一个根植于种姓与业报职责坚定信念的社会中，这可以是一项严苛的职责。"
 trait_zarad: "秋象"
 trait_zarad_desc: "秋季月兆者被视为神秘主义者与灵修者。因出身背景而无法担任祭司职责者，常会成为虔敬者，努力将日常生活的律动与宗教仪轨相融合。"
 trait_hemanta: "冬象"
 trait_hemanta_desc: "冬季月兆者是骗子与无赖。人们认为他们机巧，但也常被归以轻浮行径。"
 trait_tung_chun: "东春"
 trait_tung_chun_desc: "他们是战士与情人，生于春季。其色为青碧，有东风拂照其身。"
 trait_nam_hsia: "南夏"
 trait_nam_hsia_desc: "生于夏季，他们是裁判者与立法者。他们蒙受南风及其暖意的青睐。其色为帝王之黄。"
 trait_sai_chau: "西秋"
 trait_sai_chau_desc: "其色为死白者，生于秋季。他们是其尚学民族中的先知与学者。西王母麾下的西风拂照其身。"
 trait_pei_tung: "北冬"
 trait_pei_tung_desc: "他们是戏谑者与诡诈之徒。生于冬，北风警示他们，他们叛逆而喜悖论。其色为黑，即所谓“白昼之黑”。"
 trait_spirit_innocent: "无垢灵"
 trait_spirit_innocent_desc: "$pact_tooltip$[GetModifier('spirit_innocent_pact_modifier').GetNameWithTooltip]\n\n一种诞生自[GetTrait('mokole').GetName(GetNullCharacter)]噩梦的生物。这些畸形的精魂对所有的$glossary_fera$都具有攻击性，但对魔克拉除外——它们会以疯狂的激愤主动追猎魔克拉。"
 trait_spirit_drattosi: "抓托噬"
 trait_spirit_drattosi_desc: "$pact_tooltip$[GetModifier('spirit_drattosi_pact_modifier').GetNameWithTooltip]\n\n抓托噬是行踪难测的掠食者，设下陷阱猎捕一切愚蠢上钩之物。祂们具备智慧，甚至能与人沟通，但其根本目的，始终是吞噬他者的能量。"
 trait_spirit_ooralath: "奥拉拉慝"
 trait_spirit_ooralath_desc: "$pact_tooltip$[GetModifier('spirit_ooralath_pact_modifier').GetNameWithTooltip]\n\n奥拉拉慝曾为织者的仆从，如今游荡于影界的荒原之中，将所见一切非妖蛆的存在尽数抹除。"
 trait_spirit_nocturna: "夜魔"
 trait_spirit_nocturna_desc: "$pact_tooltip$[GetModifier('spirit_nocturna_pact_modifier').GetNameWithTooltip]\n\n夜魔(或称夜魇)是希望和梦的扭曲者。祂们寻找入睡之人，然后将其梦扭曲成邪恶的噩梦。"
 trait_spirit_raptor: "掠特"
 trait_spirit_raptor_desc: "$pact_tooltip$[GetModifier('spirit_raptor_pact_modifier').GetNameWithTooltip]\n\n掠特以性欲为食，却从不是一般源于爱与吸引的情感，只吞噬那由饥渴与征服所滋生的扭曲欲望。"
 trait_spirit_harpy: "哈比"
 trait_spirit_harpy_desc: "$pact_tooltip$[GetModifier('spirit_harpy_pact_modifier').GetNameWithTooltip]\n\n由捕获猎鹰之灵的精华形塑而成，哈比是天空中的恐怖存在。此忌灵喜欢窃取财物，并将之放置别处，在社群中散播混乱。"
 trait_spirit_rotwalker: "腐烂行者"
 trait_spirit_rotwalker_desc: "$pact_tooltip$[GetModifier('spirit_rotwalker_pact_modifier').GetNameWithTooltip]\n\n腐烂行者是腐败之灵：不是死亡之灵，而是死后随之而来的腐败之灵；不是终结之灵，而是任其腐烂的未决之灵。"
 trait_spirit_seeder: "植秽者"
 trait_spirit_seeder_desc: "植秽者是独行的极恶忌灵，其目的就是强行创造堕妖。"
 trait_spirit_dreammaker: "造梦者"
 trait_spirit_dreammaker_desc: "造梦者的存在，是为了腐化那些心怀怨怼之人，满足其渴望，并扶植受诱者获得权力。"
 trait_spirit_nihilach: "虚灵"
 trait_spirit_nihilach_desc: "虚灵是湮灭之忌灵，是超越妖蛆饥渴的、等待的一切之终结。有人相信祂们就是怒嚎末日之灵。"
 trait_spirit_shatteredhart: "破碎牡鹿"
 trait_spirit_shatteredhart_desc: "由捕获的牡鹿灵魂精华形塑，破碎牡鹿以痛苦和悲惨为食。祂们疯狂而暴力，在猎场上游荡，攻击任何可能终结其所沉浸的苦难之人。"
 trait_spirit_smog: "雾霾元素忌灵"
 trait_spirit_smog_desc: "$pact_tooltip$[GetModifier('spirit_smog_pact_modifier').GetNameWithTooltip]\n\n受污染的妖蛆四元素之一。这些被腐化的气元素据信是由妖蛆身体的气体部分所组成，代表着妖蛆的理性和智力。"
 trait_spirit_sludge: "污泥元素忌灵"
 trait_spirit_sludge_desc: "$pact_tooltip$[GetModifier('spirit_sludge_pact_modifier').GetNameWithTooltip]\n\n受污染的妖蛆四元素之一。这些被腐化的土元素被认为是由妖蛆身体的固态部分组成，代表了妖蛆的知觉和体感。"
 trait_spirit_toxin: "毒元素忌灵"
 trait_spirit_toxin_desc: "$pact_tooltip$[GetModifier('spirit_toxin_pact_modifier').GetNameWithTooltip]\n\n受污染的妖蛆四元素之一。这些被腐化的水元素被认为是由妖蛆体液形成，代表了妖蛆狂野的情绪。"