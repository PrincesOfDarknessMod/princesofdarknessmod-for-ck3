 countermeasures.desc.all_seeing_eye: "$EFFECT_LIST_BULLET$新[scheme_countermeasure_countermeasure|E]：$scheme_countermeasure_type_all_seeing_eye$\n减少$EFFECT_LIST_BULLET$[secrecy|E]"
