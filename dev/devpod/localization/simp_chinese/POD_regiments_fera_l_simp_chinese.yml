l_simp_chinese:
 kinfolk_militia: "兽嫡民兵"
 kinfolk_militia_flavor: "#F 卑微的兽裔往往是任何$glossary_fera$战帮的中坚力量。尽管他们装备简陋，但他们的坚定决心弥补了这一点。#!"
 kinfolk_leeches_hunters: "兽嫡吸血鬼猎人"
 kinfolk_leeches_hunters_flavor: "#F 所有兽裔都知道吸血鬼带来的危险。弓和弩是那些负责追捕这些威胁的首选武器。#!"
 kinfolk_outriders: "兽嫡入侵者"
 kinfolk_outriders_flavor: "#F 由于和他们的化形者亲族生活在一起，兽裔通常比其他凡人更习惯于荒野，这可以被利用来使他们成为强大而迅速的战斗力量。#!"
 werewolfpack: "狼人战群"
 battlescarred_fera: "化兽族裔"
 battlescarred_fera_flavor: "#F 一群经验丰富的$glossary_fera$，随时准备保护他们的同族。#!"
 amazons: "亚马逊狼嫡"
 amazons_flavor: "#F 这些从父权制枷锁中解放出来的女人，将像古代的传说一样为她们的黑怒恩人而战。#!"
 amazons_diana_maa: "狄安娜的亚马逊"
 amazons_diana_maa_flavor: "#F 戴安娜的亚马逊是一群更关注于成为鲁莽、不可阻挡的女战士而不是神圣的复仇者的狂怒女神。这个阵营很少被视为一个正式的团体，更多地是一个包含了那些更致力于在对抗$glossary_wyrm$的战斗中证明自己与任何男性平等的人的集合。#!"
 kinfolk_defenders: "防御者"
 kinfolk_defenders_flavor: "#F 人类需要被保卫，而这些强壮且准备充分的兽嫡已经准备好尽他们的职责。#!"
 imminent_strike_maa: "终末之击"
 imminent_strike_maa_flavor: "#F 终末之击是盖亚之子的战争阵营，致力于团结所有狼族为最后之战做准备。#!"
 luperci_maa: "狼神祭司"
 luperci_maa_flavor: "#F 意大利的人类监护者繁荣而强大，是处理众多吸血鬼对他们蓬勃发展的商业帝国的威胁的专家。他们的名字赋予了那些专门与该隐的诅咒后代作战的守卫者#!"
 herne: "赫恩兄弟"
 herne_flavor: "#F 一支几乎完全由满月狼组成的快速打击部队，随时准备保卫任何处于危险中的芬尼安圣地。#!"
 woad_raider_maa: "菘蓝突袭者"
 woad_raider_maa_flavor: "#F 菘蓝是一种在不列颠群岛发现的植物，可以从中提取蓝色颜料。古代的凯尔特战士在战斗前会用这种颜料涂抹自己，以显得更加可怕，从而震慑敌人。芬尼安兽裔在战斗中仍然保持着这一传统。#!"
 mjolnir: "妙尔尼尔之子"
 mjolnir_flavor: "#F 这些野蛮人战士甚至被其他芬里尔仔兽认为是嗜血狂人，只能远望不可近观。#!"
 berserkers_maa: "狂战士"
 berserkers_maa_flavor: "#F 芬里尔仔兽兽裔通常很少或根本不穿盔甲或衣服，只穿着熊皮或狼皮参加战斗。#!"
 heavenlysuccessors_maa: "圣传人"
 heavenlysuccessors_maa_flavor: "#F 钟馗的继承者，圣传人已经发誓要消灭吸血鬼和其他窃取盖亚灵魂的生物。#!"
 ratha_maa: "战车"
 ratha_maa_flavor: "#F 尽管自公元前300年左右战车在印度逐渐衰落，但由于它们在文化和宗教上的高度重要性，使得战车并未被废弃，尽管它们在战场上比骑兵和战象的效果要差，并且会与它们一起部署。星占的兽裔仍然在战斗中使用它们来骚扰他们部族的敌人。#!"
 bringers_light_maa: "光之使者"
 bringers_light_maa_flavor: "#F 如果说有一群影爵能够获得近乎普遍的尊重，那就是光之使者。这些影爵是处理邪恶力量的人，比如黑螺旋舞者或吸血鬼。#!"
 swarm_maa: "鼠群"
 swarm_maa_flavor: "#F 这个啃骨者阵营专注于老鼠的战争方面，专注于肮脏的战斗和利用他们所获得的每一个优势来对付敌人。他们专门从事游击战术，打击$glossary_wyrm$，然后立刻消失。#!"
 royal_guard_sf_maa: "皇族卫队"
 royal_guard_sf_maa_flavor: "#F 作为狼国的皇族，真正的银牙统治者总是由他们部族中最精英的战士护卫。#!"
 whitewolves: "白狼"
 whitewolves_flavor: "#F 据传闻，白狼是银牙的祖先，是最纯粹的银牙，在需要的时候出现，帮助部族。#!"
 daggers_nut_maa: "努特之匕"
 daggers_nut_maa_flavor: "#F 努特之匕致力于打破赛特后裔对埃及的控制，并由此扩展，打破吸血鬼对他们领土的普遍控制。#!"
 predator_kings_maa: "掠食之王"
 predator_kings_maa_flavor: "#F 掠食之王认为妥协的时候已经结束，人类必须被屠杀直到一个不剩。他们是赤爪中最具有侵略性的一支。#!"
 skull_pigs: "骸猪"
 skull_pigs_flavor: "#F 骸猪是曾经被称为格隆迪尔的化形族裔——盖亚的清洁和处理管家——的疯狂残余，他们曾经保持整个盖亚没有腐烂和衰败。#!"
 children_saraam: "沙罗摩的子嗣"
 children_saraam_flavor: "#F 巴希拉之母以看到她的孩子们纪律严明地保护她的传承为荣。#!"
 warriors_ubastet: "兀芭斯特战士"
 warriors_ubastet_flavor: "#F 布巴斯提斯曾经作为神统治过埃及。虽然那个时代已经远去，但他们仍然知道如何在他们的家园中战斗，无人能及。#!"
 samhach_bane: "萨姆哈奇克星"
 samhach_bane_flavor: "#F 祟利坎永远不会忘记那个几乎杀害了他们所有同胞的人。他的愚蠢行为将会付出代价。#!"
 durga_chosen: "杜尔迦的选民"
 durga_chosen_flavor: "#F 塞勒涅以杜尔迦女神的形象，向她选中的精英们——可汗最伟大的战士们——微笑。#!"
 seline_pride: "塞勒涅的狮群"
 seline_pride_flavor: "#F 自称月亮选中的人，辛巴是自豪且无情的战士。他们的历史还赋予了他们一个可疑的荣誉：知晓如何与其他变形者作战。#!"
 danaa_runners: "达娜的信使"
 danaa_runners_flavor: "#F 许多人对精瘦的斯瓦拉不以为然，但他们惊人的速度已经证明了许多潜在捕食者的失败。#!"
 children_of_cluid_maa: "克鲁伊德之子"
 children_of_cluid_maa_desc: "#F 许多克鲁伊提人自视为克鲁伊德最正统的后裔——这位英雄曾率先带领皮克特人抵达喀里多尼亚。这些战士以不洁的狂热践行其使命。#!"
 hakken_samurai_maa: "武士"
 hakken_samurai_maa_flavor: "#F 八犬倾尽一生磨砺刀技。荣誉感驱使其善用其技来抗衡$glossary_wyrm$之仆。#!"
 mokole_hatchlings: "巢穴守卫者"
 mokole_hatchlings_flavor: "#F 魔克拉一族已行将湮灭。正因如此，庇佑后代、延续血脉才是刻不容缓的使命。如今魔克拉族人们已能从容抵御绝大多数来犯之敌，无论对方是类人生物还是凶猛野兽。#!"
 primal_saurians: "原始蜥蜴族裔"
 primal_saurians_flavor: "#F 这些魔克拉族人与其原始本能最为契合。魔克拉-姆边贝的咆哮令人胆寒，它们为逝去的亲族复仇而来。#!"
 bronzescales: "青铜鳞鳄"
 bronzescales_flavor: "#F 沙砾粗糙、无孔不入，却是古玛甘的完美藏身处。它们会从沙中突袭，让胆敢在领地挑衅的蠢货付出死亡的代价。#!"
 hidden_fangs: "鳄影潜牙"
 hidden_fangs_flavor: "#F 丛林与森林之中藏着无数恐怖掠食者，但在潜行捕猎的摩迦罗面前，这些掠食者也只能沦为猎物。#!"
 sleeping_dragons: "沉眠之龙"
 sleeping_dragons_flavor: "#F 凡人口中的神话，唯有此事千真万确：绝不可惊扰沉眠的巨龙，其怒火足以焚尽一切。#!"
 royal_crocodiles: "皇家鳄鱼"
 royal_crocodiles_flavor: "#F 这些样貌威严的鳄鱼，在魔克拉族守护者的庇佑下，身形与力量都远超同类。#!"
 archators: "主宰者"
 archators_flavor: "#F 这些庞然大物是恐龙与龙裔形态的融合体。它们拥有许多魔克拉龙裔形态的特征，但性情却截然不同——这是许多亲历者逐渐发现的区别。只要尊重它们的力量并填饱它们的肚子，它们就会忠诚地服务于其蜥族伙伴。#!"
 dipeltas: "双盾龙"
 dipeltas_flavor: "#F 头骨上长有巨大骨板的恐龙。这些骨板比普通钢材都更坚固，能在它们冲向目标时提供保护。#!"
 avithons: "掠空龙"
 avithons_flavor: "#F 飞行的空中恐怖。这些恐龙翱翔于天际，以惊人的速度和精准度俯冲捕食猎物。#!"
 dicravenators: "驰猎龙"
 dicravenators_flavor: "#F 这些小型双足恐龙是许多食草动物的死神。它们追捕猎物时的敏捷与凶猛无与伦比。#!"
 rhincanthuses: "犀角龙"
 rhincanthuses_flavor: "#F 与其说是恐龙，不如说是一种巨大的爬行类犀牛，犀角龙是庞大的攻城槌，会冲撞一切障碍。#!"
 baroceratops: "重角龙"
 baroceratops_flavor: "#F 重角龙的厚重头骨和天然甲壳为它提供了保护，使其能够鲁莽地冲破防御工事。#!"
 dracomuses: "焚爪龙怪"
 dracomuses_flavor: "#F 巨大的龙形猛兽，使自身燃起烈焰，在撕裂猎物时将其焚烧殆尽。#!"
 archeorexes: "始祖霸王龙"
 archeorexes_flavor: "#F 魔克拉侏罗纪之梦中的顶级猎食者，现世只为了一个目的：毁灭。#!"
 dryptoraptors: "撕掠龙"
 dryptoraptors_flavor: "#F 这些小型双足恐龙体型不超过普通魔克拉，然而其数量之多足以致命。#!"
 army_aten: "阿顿战团"
 army_aten_flavor: "#F 这支魔克拉战团时刻准备着与[Glossary('妖蛆', 'glossary_wyrm_tt')]及其黑暗势力作战。他们还会在腐化之秽蔓延之前，搜寻并摧毁堕落的$glossary_fera$。#!"