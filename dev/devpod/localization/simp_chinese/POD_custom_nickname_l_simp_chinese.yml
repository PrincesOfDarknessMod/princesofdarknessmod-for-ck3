l_simp_chinese:
 POD_custom_nickname.10.t: "自定义绰号"
 POD_custom_nickname.10.desc: "黑暗世界的许多居民不仅只以他们的本名而闻名；你是其中的一员吗，或者你还没有赢得这样的荣誉？"
 POD_custom_nickname.10.a: "是的，让我选择我所受的称呼"
 POD_custom_nickname.10.b: "不，我还没有一个绰号"
 POD_custom_nickname.100.t: "自定义绰号"
 POD_custom_nickname.100.desc: "你必须做出重要地决定，你想被称为什么？\n\n如果你做了错误的决定，那么你将不得不在很长一段时间内忍受它。"
 POD_custom_nickname.100.a: "从此以后，我将被称为……"
 nick_POD_custom_nickname1: "[ROOT.Char.GetLocalizedText('POD_custom_nickname_text')]"
 nick_POD_custom_nickname2: "[CHARACTER.Custom('PODCustomNickname')]"
 nick_POD_custom_nickname_default: "已故者"