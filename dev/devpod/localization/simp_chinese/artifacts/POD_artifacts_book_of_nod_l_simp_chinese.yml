l_simp_chinese:
 artifact_book_of_nod_name: "挪得之书"
 artifact_book_of_nod_description: "一套古老的文书，被挪得学家该隐之子视为圣物。它由多页修订和残页组成，被不同的血族学者重新组合。传统上，该隐的故事的主要传播方式是口述，而带有该隐之子历史上最重要事件的文本则被严密保护，以保护该隐之子。必须提到的是，撇开个人信仰不谈，对于历代流传下来的文本和笔记，应该非常谨慎地对待。关于挪得之书的历史，有许多悬而未决的问题。它的作者不详，尽管末卡维、扫罗，甚至该隐都经常被引证为写了它的部分内容，即使不是全部内容。有些人认为整本书是神话或谎言，是吸血鬼为了解释他们的存在而编造的故事，或者是用来误导他人以某种方式思考和行动的工具。令这些疑虑更加严重的是，许多归于挪得之书的著作都非常模糊或自相矛盾，有时似乎是彻头彻尾的误导——这在挪得学家团体之间造成了一些大型（而且往往是暴力）的分歧。该书最古老的片段被确定为在苏美尔时代之前，大约是公元前4500年。"
 artifact_chronicle_of_caine_name: "该隐传"
 artifact_chronicle_of_caine_description: "挪得之书的篇章。这部巨著包括以下片段。原初时代、莉莉丝的来临、莉莉丝的魔法、该隐的诱惑、洗拉的故事、老妪的故事和第一城的故事。虽然该隐被认为是创世纪一书中提到的“该隐”，但这些故事与标准的圣经典籍相比并不准确。该隐用自己的话讲述了他导致自己被诅咒的动机，提出了他对人类堕落后的事件的个人观点，以及他作为黑暗之父的历史。"
 artifact_chronicle_of_shadows_name: "暗影史"
 artifact_chronicle_of_shadows_description: "挪得之书的篇章。收集了一些碎片和片段，这些碎片甚至被争论为是否是挪得之书的一部分。有分析家称，这部分内容被迦太基的学者和作家稀释了，他们采取诗意的方式写下了“该隐戒律”。甚至有人说，暗影史只是秘盟为支持其暴政而创作的宣传文集。虽然有些人认为这是末卡维精心策划的恶作剧，但也有人认为这些文本直接来自黑暗之父本人，尤其是在真实的远古石板上提供的十三条戒律。"
 artifact_chronicle_of_secrets_name: "秘闻录"
 artifact_chronicle_of_secrets_description: "挪得之书的篇章。它包含对一个名为火焚末日事件的预言和图景。在一些人看来，对这一事件的担忧已经代代相传，并引起了偏执和恐惧的涟漪，继续在该隐之子和凡俗人类中回荡。"
 artifact_first_of_times_name: "原初时代"
 artifact_first_of_times_description: "该隐解释说，他出于爱而献祭了他的兄弟亚伯。他的“父”将该隐赶走，让他在挪得之地的黑暗中流浪。挪得之书的该隐传的一部分。"
 artifact_coming_of_lilith_name: "莉莉丝的来临"
 artifact_coming_of_lilith_description: "该隐解释说，他出于爱而献祭了他的兄弟亚伯。他的“父”将该隐赶走，让他在挪得之地的黑暗中流浪。挪得之书的该隐传的一部分。"
 artifact_liliths_magick_name: "莉莉丝的魔法"
 artifact_liliths_magick_description: "该隐希望能拥有莉莉丝所拥有的力量天赋。经过一番坚持，犹豫不决的莉莉丝开始了觉醒仪式，她用刀切开自己，把血流到碗里让他喝下。该隐喝下了。挪得之书的该隐传的一部分。"
 artifact_temptation_of_caine_name: "该隐的诱惑"
 artifact_temptation_of_caine_description: "该隐被三位天使拜访，他们是主的信使。每位天使都为该隐提供了一个为亚伯的谋杀而忏悔的机会。拒绝了大天使米迦勒，该隐和他的子嗣们被诅咒有惧火的弱点。拒绝了拉斐尔，该隐和他的子嗣们被诅咒容易受到阳光的伤害。拒绝了乌列尔，该隐和他的子嗣们被诅咒有体内的心兽对血的渴望。第四位天使随后出现，他就是加百列。这位天使提供了神怜悯的通往“光明”的唯一途径——[golconda|E]。该隐“觉醒”，并随着[Glossary('血律','game_concept_discipline_desc')]的进步而发展。带着所有这些力量，他离开了莉莉丝。《挪得之书》的“该隐传”的一部分。"
 artifact_zillahs_tale_name: "洗拉的故事"
 artifact_zillahs_tale_description: "该隐爱上了洗拉，并寻求与她结婚。他做了他能想到的所有事情来使她渴望他，然而她不愿意嫁给他。该隐变得非常沮丧，他撕扯着自己的头发。他最终寻求了老妪的魔法，老妪最终骗他结成了血缚。这血缚的发现最终将洗拉与该隐绑在一起，这样他就可以让她嫁给他。挪得之书的该隐传的一部分。"
 artifact_tale_of_the_crone_name: "老妪的故事"
 artifact_tale_of_the_crone_description: "该隐与老妪之间血缚，让他处于她的奴役之下。在遵从和避开她的血液一年后，他问老妪如何比他的子嗣更强大，因为担心他们会逆反。这个询问实际上是利用这些信息来对付她的计划的一部分。她为他提供了歌斐木木桩，并解释了如何使用它。接受武器后，该隐用它刺入她的心脏，打破了血缚。挪得之书的该隐传的一部分。"
 artifact_tale_of_the_first_city_name: "第一城的故事"
 artifact_tale_of_the_first_city_description: "该隐表示自己在孤独中度过了无数的年代。他再次寻求与凡人在一起，并找到了一个由“舍特的子嗣”居住的城市。他们接受他为国王，他统治了一段时间，再次感到孤高。一个名叫以诺的年轻人恳求成为该隐的儿子。尽管乌列尔警告他不要拥有子嗣，该隐还是初拥了以诺，这是他的第一位子嗣。然后，该隐宣布这第一城被称为以诺城。他的新孩子以诺，然后恳求拥有血族族人。该隐同意了，并初拥了以拿和洗拉。他们反过来创造了更多的后代。由于害怕传播他的诅咒，该隐下令不再制造子嗣。他们服从命令，城市繁荣了很久，成为一个伟大的帝国。随后大洪水来了，摧毁了以诺城和所有的“舍特的子嗣”。该隐非常难过，于是他消失了。他幸存的子孙寻找他，当他们找到他时，该隐让他们离开。在他们自生自灭的情况下，一场大战接踵而至，十三[Glossary('上古耆宿','game_concept_antediluvian_desc')]“杀死”了他们的长者——以诺、以拿和洗拉。当该隐发现所发生的事情时，他开始追寻[Glossary('上古耆宿','game_concept_antediluvian_desc')]。他们重建了一个被称为第二城的新城市，并制造了另一代的吸血鬼。[Glossary('上古耆宿','game_concept_antediluvian_desc')]不知道的是，黑暗之父该隐诅咒了他的后代让每个氏族都特有弱点。最终，这座城市陷入了不断的战争，它亡了，而血族也散了。故事的最后，预言了一个最后的城市，即火焚末日之城。挪得之书的该隐传的一部分。"