l_simp_chinese:
 artifact_klaive_name: "[fetish_artifact_icon]月刃"
 artifact_klaive_description: "狼人最著名的武器，这把刀是镶银的邪恶武器，是狼人使用的神圣武器，比任何刀剑都要强大，里面缚着灵。所有使用它的非狼人都会因亵渎神明而被无休止地追杀。"
 artifact_eternal_waterskin_name: "[fetish_artifact_icon]无尽水袋"
 artifact_eternal_waterskin_description: "这牛皮袋在装满水后，无论喝多少都不会耗尽，是一件不强但有用的东西。遗憾的是，对许多部族来说，这物品只适用于淡水，不管是雨水还是开水，而对蜂蜜酒或葡萄酒等则不起作用。"
 artifact_beff_of_ice_name: "[fetish_artifact_icon]冰之不合"
 artifact_beff_of_ice_description: "一根由银覆蓝冰制成的小针，这件独特的有价值的灵具可以让人烧去疾病，因为使用者能够真正地抖出感染，因为里面的冰之灵会清除使用者生理系统中的疾病，甚至更强——毒。"
 artifact_spirit_astrolabe_name: "[fetish_artifact_icon]灵之星盘"
 artifact_spirit_astrolabe_description: "这件制作精良的星盘，缚有波浪之灵，对任何使用这个遗物的长者都有不可思议的指导作用，使人能够完全轻松地穿透距离的纱幔。"
 artifact_truth_earring_name: "[fetish_artifact_icon]真相耳环"
 artifact_truth_earring_description: "作为所有不忠配偶的灾祸，这缚有荣誉之灵的灵具，使佩戴者能够更准确地刺破谎言的面纱，更好地从谎言的海洋中摘取真相的果实。"
 artifact_blanket_of_peaceful_past_name: "[fetish_artifact_icon]安宁过往之毯"
 artifact_blanket_of_peaceful_past_description: "和平之灵具，佩戴后，内缚的母性之灵拥抱使用者，让其，哪怕是短暂的一瞬间，回到小时候或幼崽的状态，那时的世界是有意义的，其他什么都不重要，从黑暗世界的恐怖中幸运地逃脱，再次被慈爱的母亲拥抱或在她身边沉眠。"
 artifact_dark_mask_name: "[fetish_artifact_icon]黑暗面具"
 artifact_dark_mask_description: "这个奇怪的灵具的起源不为人知，但它的力量是明确的。弯曲阴影以辅助佩戴者，扭曲光线并掩盖佩戴者，在所有看到其的人中激发出一种深刻的恐惧。"
 artifact_eyes_of_the_night_name: "[fetish_artifact_icon]夜之眼"
 artifact_eyes_of_the_night_description: "一个非常奇异的灵具，这个铁盆，当被丢到空中旋转时，允许当地的白天和黑夜的光照程度颠倒过来，这是一件不可估量的有用地逃跑工具，对任何攻击者造成光亮或黑暗的冲击，在他们的眼睛适应时，受袭者将安然无恙地逃脱，或者说，对另一位可怜的受害者进行报复……"
 artifact_kinship_doll_name: "[fetish_artifact_icon]亲缘玩偶"
 artifact_kinship_doll_description: "这灵具以小孩子的玩具娃娃为形态，作用是作为兽嫡与$glossary_fera$的传话器，让他们远距离沟通并保持联系，这样他们就不会远离他们的伴侣。"
 artifact_law_skull_name: "[fetish_artifact_icon]律法颅骨"
 artifact_law_skull_description: "作为最可怕的灵具之一，这叛徒狼族的头骨一旦被激活，就能背诵律令，并要求在场的人发下誓言。甚至只是有可能使用这灵具就足以让人害怕……"
 artifact_moongleam_name: "[fetish_artifact_icon]月荧"
 artifact_moongleam_description: "这小卵石可以在夜间的任何时候被激活，当这样做的时候，就会像蜡烛一样发光，而没有引起火灾的风险，在夜间给予可变的光，而不会让自己陷入火焰的燃烧中。"
 artifact_air_foot_greaves_name: "[fetish_artifact_icon]空气护膝"
 artifact_air_foot_greaves_description: "一对简单的、印有翅膀的护胫，这件缚有风之灵的灵具，当佩戴者把它按在一起时，可以让他们以惊人的速度移动，能够把他们带到几乎任何佩戴者想要去的区域。"
 artifact_sun_axe_name: "[fetish_artifact_icon]日之斧"
 artifact_sun_axe_description: "这是一把镶有金珠的斧头，这把凶残的武器，虽然有可能让赫利俄斯的孩子难以负担，但在激活后，可以在阳光下燃烧，一件$glossary_fera$持剑者用来对抗可怕蚂蟥的珍贵武器，以结束他们对黑夜的暴政。"
 artifact_whistle_caff_name: "[fetish_artifact_icon]微风之哨"
 artifact_whistle_caff_description: "一个刻有圣书字的用木头和骨头做的哨子，缚有新生哺乳动物之灵，吹响后会发出无声的求救声，提醒使用者的家人和朋友，以便他们赶来帮助他们。"
 artifact_book_of_the_spirits_secrets_name: "[fetish_artifact_icon]灵秘之书"
 artifact_book_of_the_spirits_secrets_description: "这本缚有智慧之灵的牛皮纸小册子，在通读之后，将揭示许多关于[umbra|E]和灵类世界的秘密。作为任何眉月狼的典范书，这本有价值的书对任何传奇唤灵师来说都是必不可少的。"
 artifact_feathered_cloak_name: "[fetish_artifact_icon]羽毛斗篷"
 artifact_feathered_cloak_description: "最受追捧的灵具之一，原因很简单。这缚有风之灵的珍贵灵具的持有者，将获得与蝙蝠一样的飞行能力，实现佩戴者翱翔天空的梦想。"
 artifact_tangling_lance_name: "[fetish_artifact_icon]纠缠之枪"
 artifact_tangling_lance_description: "这把饱经风霜的荆棘长矛酷似一条巨大的蜥蜴尾巴，虽然看起来只是一支劣质的短矛，但一旦激活，长矛就会分裂，变成像一条巨蜥的尾巴，猛击并抓住恐惧的敌人。"
 artifact_time_piece_name: "[fetish_artifact_icon]时间碎片"
 artifact_time_piece_description: "这个奇特的灵具以计时仪器的方式出现，通常是一个钟表或日冕。当激活的时候，它将微妙地扭曲时间流,束缚所有在激活时不接近钟表之人"
 artifact_wind_hammer_name: "[fetish_artifact_icon]风之锤"
 artifact_wind_hammer_description: "这个巨大而沉重的战锤被激活后，将使灵具化为风暴，让使用者像狂暴的龙卷风一样打击，是无数屠杀的信标"
 artifact_bindrune_amulet_name: "[fetish_artifact_icon]宾得符文护符"
 artifact_bindrune_amulet_description: "这个银质的护身符上有用狼人的语言雕刻的符文。这件灵具让人能够传递语言的力量并驾驭它，洞察语言本身的神秘"
 artifact_cloud_string_name: "[fetish_artifact_icon]云之弦"
 artifact_cloud_string_description: "这串绳珠当展开时将飞向天空，然后引导苍穹，给人控制大气和雨水的力量。这种强大的能力使人能够为一个地区带来财富和繁荣，对于人类监护者这样的部族来说，这是一个非常有用的特质，而对于其他部族来说，就没那么实用了。"
 artifact_horn_of_the_white_stag_name: "[fetish_artifact_icon]白鹿之角"
 artifact_horn_of_the_white_stag_description: "塔拉山丢失的三件圣物之一。当这个巨大的号角吹响时，军队将以惊人的速度行军"
 artifact_golden_torc_name: "[fetish_artifact_icon]金颈环"
 artifact_golden_torc_description: "塔拉山丢失的三件神圣遗物之一。这件完美无瑕的王冠曾今是芬尼安至高王艾鲁的司部的标识，这件珍贵的文物是最古老的贵族的有力象征"
 artifact_crones_tongue_name: "[fetish_artifact_icon]老妪之舌"
 artifact_crones_tongue_description: "#bold 转化伤害为[POD_aggravated_damage|E]。#!\n\n塔拉山丢失的三件神圣遗物之一，老妪之舌是一柄惊人的简易长剑。但在妖蛆面前，它闪耀着燃烧的光芒，它的刀刃甚至比狼人的利爪更伤人。"
 artifact_beast_mask_name: "[fetish_artifact_icon]野兽面具"
 artifact_beast_mask_description: "一种变形面具，当使用者戴上它时，它会使使用者变成被指定的动物。给他们增加了动物的机动性，以及动物的无害性质，以满足持有者的任何要求。"
 artifact_belt_of_the_giants_name: "[fetish_artifact_icon]巨人腰带"
 artifact_belt_of_the_giants_description: "这是个非常稀有的灵具，当被佩戴者驱使时，会使他们的体型加倍，极大地增加他们的力量，给予对手破坏。然而不利的一面是，心脏的尺寸不能增长，这给使用者的身体带来了可怕的压力。"
 artifact_cloak_of_woven_mists_name: "[fetish_artifact_icon]雾织斗篷"
 artifact_cloak_of_woven_mists_description: "织雾斗篷是一条带有复杂胸针的链绳项链。当被佩戴者激活时，阴影和蒸汽会渗入空气中，使佩戴者变得朦胧和模糊，使其难以置信的隐秘，如同气流的低语。"
 artifact_staff_of_life_name: "[fetish_artifact_icon]生命之杖"
 artifact_staff_of_life_description: "一根大手杖，可以兼作木棍，这种有用的灵具可以增强佩戴者的健康，并通过增强他们的健康来保护他们免受伤害。"
 artifact_bone_flute_name: "[fetish_artifact_icon]骨笛"
 artifact_bone_flute_description: "一件精巧的遗物，能够激发不死族的痛苦、安抚生者，那些听到它的人会情不自禁地更尊敬他们的领主"
 artifact_forest_crown_name: "[fetish_artifact_icon]丛林王冠"
 artifact_forest_crown_description: "一件荆棘冠形状的灵具，会自动适应佩戴者的头部，已成为统治者的象征，因为其中的荒野之灵会辅助他们成为荒野共主。"
 artifact_iron_crown_name: "[fetish_artifact_icon]铁王冠"
 artifact_iron_crown_description: "一件铁冠形状的灵具，会自动适应佩戴者的头部，已成为统治者的象征，其中贵族之灵会辅助他们达到史诗般的领导权高度，因此在旧时代受到人类监护者的青睐。"
 artifact_keystone_name: "[fetish_artifact_icon]钥石"
 artifact_keystone_description: "这种符文石一旦被按在石头上，它就会像门一样打开，让使用者通过几乎所有的石头障碍。"
 artifact_dreamcaller_name: "[fetish_artifact_icon]唤梦者"
 artifact_dreamcaller_description: "这支极其珍贵的长笛能打开梦的裂缝，让人在其中舞蹈和学习，并探索思维的深处，为他们可能提供的任何见解。"
 artifact_harp_of_enchantment_name: "[fetish_artifact_icon]附魔之竖琴"
 artifact_harp_of_enchantment_description: "这把竖琴在弹奏时，将释放出优美和谐的旋律，一首真正令人惊叹的奏鸣曲，甚至可以让最久经战事的狼人陷入哀号、潸然泪下。"
 artifact_iceblade_name: "[fetish_artifact_icon]冰刃"
 artifact_iceblade_description: "这把珍贵的剑是用极北坚不可摧的蓝冰制成的，这把苍白的武器与刺骨的北方一样寒冷，同时也能让人如盛夏一般劈开寒风。"
 artifact_lionfang_name: "[fetish_artifact_icon]狮牙"
 artifact_lionfang_description: "这种强大的灵具是由一只可怕的野兽的尖牙雕刻而成的，据说是从猫人那里偷来的，这种极其危险的武器具有与狼国最古老的对手之一同样的力量。"
 artifact_ring_of_the_elements_name: "[fetish_artifact_icon]元素之戒"
 artifact_ring_of_the_elements_description: "作为最强大的灵具之一，元素之戒赋予狼人控制地水火风四种元素的力量。当被激活时，狼人不会被这些力量的攻击所伤害。例如，例如，火把会拒绝烧向狼人，石头甚至金属剑会从她的皮肤上弹起而无害，她也不会淹死在水下。"
 artifact_grand_klaive_name: "[fetish_artifact_icon]大月刃"
 artifact_grand_klaive_description: "#bold 对抗非狼人时，转化所有伤害为[POD_aggravated_damage|E]。#!\n\n作为最强大的英雄的月刃，这传奇武器在各方面都比其他月刃好，里面缚有战争之灵会随着持有者敌人的死亡而愤怒地嚎叫。"
 artifact_forge_crusher_name: "[fetish_artifact_icon]锻·碾"
 artifact_forge_crusher_description: "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。锻·碾当使用时，会咆哮燃烧的火焰，能够造成可怕的痛苦"
 artifact_grinding_tooth_name: "[fetish_artifact_icon]磨·牙"
 artifact_grinding_tooth_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。磨·牙能够粉碎任何石头，将面前的大地埋没。"
 artifact_spear_chaser_name: "[fetish_artifact_icon]矛·逐"
 artifact_spear_chaser_description: "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。这把令人印象深刻的铁锤在投掷时腾空而起，投掷到难以置信的距离，并且无法在投掷中被阻拦。"
 artifact_troll_eater_name: "[fetish_artifact_icon]妖·吞"
 artifact_troll_eater_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。妖·吞比其他任何酋长之锤更能摧毁护甲，如同撕裂桦树皮一样"
 artifact_bright_arm_name: "[fetish_artifact_icon]光·臂"
 artifact_bright_arm_description: "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。光·臂像太阳一样闪耀，哼唱着光芒，使对手致盲。"
 artifact_hag_talon_name: "[fetish_artifact_icon]巫·爪"
 artifact_hag_talon_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。巫·爪保护佩戴者的思想，给他们无与伦比的精神防御。"
 artifact_pain_eagle_name: "[fetish_artifact_icon]痛·鹰"
 artifact_pain_eagle_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。痛·鹰是酋长之锤中最具有破坏性的，会留下留下因痛苦而跳动的伤口"
 artifact_runestone_of_gab_name: "[fetish_artifact_icon]口舌符文石"
 artifact_runestone_of_gab_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力，允许使用者成为语言的大师"
 artifact_runestone_of_war_name: "[fetish_artifact_icon]战争符文石"
 artifact_runestone_of_war_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。特别是这些符文石上居有着一只战争之灵，让使用者在任何部队踏上战场之前就完全了解战场的情况。"
 artifact_runestone_of_control_name: "[fetish_artifact_icon]统御符文石"
 artifact_runestone_of_control_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些石头可以预测商业和人口的流动，让使用者对管理事务有无与伦比的洞察力。"
 artifact_runestone_of_cunning_name: "[fetish_artifact_icon]狡诈符文石"
 artifact_runestone_of_cunning_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些宝石可以让一个人维持和控制错综复杂的计划，让使用者成为无与伦比的间谍总管。"
 artifact_runestone_of_wisdom_name: "[fetish_artifact_icon]智慧符文石"
 artifact_runestone_of_wisdom_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些石头有着神学和医学的强大幻象，让使用者对秘法有强大的洞察力。"
 artifact_klaive_hammer_name: "[fetish_artifact_icon]月刃锤"
 artifact_klaive_hammer_description: "虽然只有狼族能够进行创造月刃所需的仪式，但一些技艺高超的狼嫡铁匠也能接受培训，锻造实际的武器，使其成为诸灵的容器。月刃锤是一种灵具，旨在帮助狼嫡打造一把完美的武器，以取悦能赋予力量的灵或诸灵。铁匠在使用锤打造月刃时必须消耗灵知。这种消耗是将月刃的银坚硬到与钢一样坚固的过程的一部分，使得月刃在战斗中比普通的银制武器更加可靠。"
 artifact_horn_of_distress_name: "[fetish_artifact_icon]危难号角"
 artifact_horn_of_distress_description: "这些号角只应在极度危急的时刻吹响。它们的外观因文化而异，常常带有制造者部族的标记。当成功启动时，一只危难号角会在10英里范围内向所有狼人发出警报，无论他们属于哪个部族。他们可以选择是否回应呼叫，但他们知道这只号角意味着“同族有难”。这些号角通常含有气、鹅、或孔雀之灵。"
 artifact_amulet_of_kinship_name: "[fetish_artifact_icon]亲情护符"
 artifact_amulet_of_kinship_description: "与其他兽嫡灵具不同的是，这个护身符并非由狼嫡携带者激活，而是由将护身符交给她的狼人激活。\n任何遇到佩戴这个护身符的族人的狼人都会立刻知道她不仅仅是族人，而是备受关注的族人。这个护身符并不立即要求帮助佩戴者，但大多数狼族都知道佩戴者至少应该得到公平对待。可悲的是，黑螺旋舞者也会认出佩戴者是狼嫡，可能会带来严重的后果。"
 artifact_lepers_rags_name: "[fetish_artifact_icon]麻风病人的破布"
 artifact_lepers_rags_description: "这件破烂肮脏的斗篷，一旦穿上，将使穿戴者假扮成一个低调的乞丐，无论他们之前是什么身份，这都为实施阴谋提供了大量的选择。"
 artifact_trail_branch_name: "[fetish_artifact_icon]寻踪树杈"
 artifact_trail_branch_description: "一根从灌木丛中取出的小树枝，缚有荒野之灵，这根树枝可以掩盖自己的踪迹，使穿越荒野变得更加容易，因为里面的器灵指引着它的持有者。"
 artifact_feather_of_the_waters_name: "[fetish_artifact_icon]水之羽"
 artifact_feather_of_the_waters_description: "一件羽毛斗篷，由来自遥远南方的不会飞的罕见鸟类羽毛制成。这件温暖的斗篷允许任何有灵知的人像鱼一样轻松灵游，使他们以极大的能力扩展可去的地方"
 artifact_heart_of_fire_name: "[fetish_artifact_icon]火之心"
 artifact_heart_of_fire_description: "这是一个非常危险的灵具，这个小小的红色水晶可以让它的持有者点燃物体。这是一个微小却致命的东西"
 artifact_shining_klaive_of_sokhta_name: "[fetish_artifact_icon]索赫塔的闪耀月刃"
 artifact_shining_klaive_of_sokhta_description: "这是一种由黄金和水银制成的月刃，与其他月刃不同，这一武器对所有$glossary_fera$来说都是完全安全的，事实上，它还能进一步增强他们的战斗力。这个扭曲可怕的武器让所有听说过它的人都感到恐惧，化形者可能会毫不屈服于他们传说中的弱点。"
 artifact_radiant_blade_of_katanka_sonnak_name: "[fetish_artifact_icon]卡坦卡·索纳克的光辉之剑"
 artifact_radiant_blade_of_katanka_sonnak_description: "这把可怕的剑由银和金混合而成，这把可怕的武器在太阳的化身，科拉克斯和魔克拉的支持者，卡坦卡·索纳克星君的光芒下燃烧。这种炽烈的武器激发了赫利俄斯划过天空的迅捷，以他同样的优雅和灵巧的呼吸移动着。"
 artifact_mercurial_mask_of_mitanu_name: "[fetish_artifact_icon]米塔努的水星面具"
 artifact_mercurial_mask_of_mitanu_description: "骗子的面具，来自水星灵君米塔努的礼物。这个奇物面具可以让一个人完全隐藏自己的存在，就像它的制造者一样，成为一个阴谋之王。"
 artifact_burning_mask_of_hakahe_name: "[fetish_artifact_icon]哈卡赫的燃烧面具"
 artifact_burning_mask_of_hakahe_description: "这个黑色的铁面具曾经是祝融星化身哈卡赫灵君的锻造面具，他是阴影星球的领主，它将锻造大师的一块面具传授给佩戴者，保护他们，并以黄金和知识的方式赋予他们自己的智慧。"
 artifact_radiant_dress_of_tambiyah_name: "[fetish_artifact_icon]坦比娅的光辉之裙"
 artifact_radiant_dress_of_tambiyah_description: "这件连衣裙是由最结实的铁制成的美丽挂毯，是金星化身坦比娅灵君的杰作，每一个佩戴它的人都忍住不住称赞。这件完美无瑕的连衣裙与穿着者相得益彰，并以其他形式成为许多精美的珠宝和小玩意，但即使穿过它，连衣裙也能保护穿着者免受任何侵犯。"
 artifact_eternal_grace_of_eshtarras_might_name: "[fetish_artifact_icon]埃什塔拉之力的永恒恩典"
 artifact_eternal_grace_of_eshtarras_might_description: "这个护身符里有盖亚化身，地球星君埃什塔拉的祝福。这个不可思议的圣物赋予佩戴者八个凡人的生命力，不受束缚的生育能力，以及她自己的领导智慧，一切之母。这珍贵的圣物是盖亚赐予的最好的材料制成的，她的触摸甚至在任何人身上都是她永恒的祝福和温暖的标志，由她的光辉宝座的一部分制成。"
 artifact_burning_horns_of_nerigal_name: "[fetish_artifact_icon]尼格尔的焚烧之角"
 artifact_burning_horns_of_nerigal_description: "这些红色粘土猎角是由火星化身尼格尔灵君用火星的尘埃制成的。当握住并吹响这些号角时，盖亚也会被震动，召唤着吹响号角的人投入战争，战争星君的力量和狡猾流入他们，召唤着所有人以他的名义赢得胜利"
 artifact_ruinous_talons_of_rorg_name: "[fetish_artifact_icon]罗尔格的毁灭之爪"
 artifact_ruinous_talons_of_rorg_description: "这些流星金属护手是由盖亚的配偶罗尔格星的残骸制成的，这些爪子是来自火星和木星之间的小行星带的灵君罗尔格的礼物，代表着复仇和愤怒。有了这些，他的意志就显现出来了，挥舞着它们的人成为了他的怒火，对他们面前的所有人发动屠杀。"
 artifact_imperious_crown_of_zarok_name: "[fetish_artifact_icon]扎罗克的盛气凌人之冠"
 artifact_imperious_crown_of_zarok_description: "万王之王的王冠，这顶完美无瑕，镶满宝石的王冠是由王与木星的化身扎罗克灵君手工打造的，扎罗克是盖亚的追求者，继露娜和赫利俄斯之后的最伟大者。当你戴上它，你就会变成最伟大的国王的活生生的面孔，无尽的财富将流入他们。"
 artifact_eternal_wings_of_lu_bat_name: "[fetish_artifact_icon]鲁·帕特的永恒之翼"
 artifact_eternal_wings_of_lu_bat_description: "这件羽毛斗篷是土星灵君，木星灵君和大猫头鹰的礼物。有了这些，持用者可以飞上天空，在[umbra|E]和[Glossary('皮囊之地','game_concept_skinlands_desc')]遨游，并在其中携带他自己的本性和智慧。"
 artifact_shadowed_stave_of_ruatma_name: "[fetish_artifact_icon]鲁阿特玛的暗影之杖"
 artifact_shadowed_stave_of_ruatma_description: "这个小的，手持的五线谱据说有天王星灵君的声音的一小片在它里面。通过它，星君与它的持有者交谈，低语许多关键的秘密和传说。然而，也许有些是不应该知晓的。"
 artifact_dancing_loom_of_shantar_name: "[fetish_artifact_icon]尚塔尔的轻快织机"
 artifact_dancing_loom_of_shantar_description: "这个发光的竖琴是完美的创造，由海王星灵君尚塔尔的手编织而成。与她的其他造物不同的是，这件作品是用她的专注力织成的，是送给她的斗士的礼物。在这台琴上，她优美的歌声潺潺流过，没有什么比这更能缓解紧张了。"
 artifact_whispering_ankh_of_meros_name: "[fetish_artifact_icon]梅罗斯的低语的生命之符"
 artifact_whispering_ankh_of_meros_description: "这枚饱经风霜的银十字章似乎饱经岁月的洗礼，来自梅罗斯灵君送给冥王星灵君的最珍贵的礼物。这个珍贵的徽章允许使用者以神奇的速度移动，当说话时，持有者将收到一个永恒流浪者的声音片段。"
 artifact_judgment_hammer_name: "[fetish_artifact_icon]审判槌"
 artifact_judgment_hammer_description: "#bold 转化所有伤害为[POD_aggravated_damage|E]。#!\n\n这件由可汗打造的珍贵遗物也许是猫国流传的最为强大的武器，能够使持有者的力量加倍，且每次打击都会引发强力的雷霆。然而，这武器同样重得离谱，只有最为孔武有力的可汗才能好好地使用它。"
 artifact_yuri_klaive_name: "[fetish_artifact_icon]尤里的月刃"
 artifact_yuri_klaive_description: "#bold 对抗非狼人时，转化伤害为[POD_aggravated_damage|E]。#!\n\n一把精心锻造的，看上去有点平庸的月刃。不过，对于那些能看透的人来说，可以感受到与这把武器相关的伟大命运。"
 artifact_head_hardrule_name: "[fetish_artifact_icon]哈德鲁尔的头"
 artifact_head_hardrule_description: "塔吉·哈德鲁尔是芬里尔仔兽有史以来最伟大的战士之一。但也是最暴虐的统治者之一，最终，当整个部族都反对他时，他付出了生命。他的头是一个提醒，让我们永远赞美伟大的战士，但也要警惕傲慢的代价。"
 artifact_antler_crown_name: "[fetish_artifact_icon]鹿角冠"
 artifact_antler_crown_description: "自部族早期的夜晚以来一直是芬尼安之王的象征。这强大的王冠只赋予配得上的人，所有牡鹿的后裔都有义务遵循它。"
 artifact_bronze_labrys_name: "[fetish_artifact_icon]路西帕斯的青铜双头斧"
 artifact_bronze_labrys_description: "#bold 转化所有伤害为[POD_aggravated_damage|E]。#!\n\n一把完美保存的黄金时代的青铜双头斧，也许曾经属于路西帕斯本人。这把巨大的双手斧是黑怒间迄今为止最可怕的武器，也是最受尊敬的遗物。"
 artifact_gaia_big_thumb_name: "[fetish_artifact_icon]盖亚的大拇指"
 artifact_gaia_big_thumb_description: "这个超大的、木乃伊化的人类拇指有一个奇怪的特性，可以确保适当的交通工具总是在附近……但不保证这些交通工具去往何方。对于任何自重的眉月狼来说都是个迷，一件受人喜爱的啮骨者宝物，也是许多恶作剧的开始。"
 artifact_chalice_renewal_name: "[fetish_artifact_icon]复兴之杯"
 artifact_chalice_renewal_description: "一个神秘的金杯，能够自动填满海水。任何喝下它的人都会经历来自盖亚本人的记忆，然后被治愈任何疾病或伤口。这个珍贵的宝物曾出现在盖亚之子历史上的数个关键时刻。"
 artifact_watcher_shield_name: "[fetish_artifact_icon]看守者之盾"
 artifact_watcher_shield_description: "一个盾牌形式的小木牌，可戴在脖子上。这个灵具可以保护佩戴者免受任何形式的暗器攻击，确保芬里尔仔兽总是按自己的意愿战斗。"
 artifact_crescent_moon_waterskin_name: "[fetish_artifact_icon]新月水袋"
 artifact_crescent_moon_waterskin_description: "一件非常通用的宝物，被人类监护者所珍视。它可以用来伪装自己，长出强大的爪子，甚至可以在喝下之后立即狂乱。"
 artifact_threefold_axe_name: "[fetish_artifact_icon]三重斧"
 artifact_threefold_axe_description: "#bold 转化所有伤害为[POD_aggravated_damage|E]。#!\n\n三重斧是芬尼安铁匠技艺的巅峰之作，它是一件精心打造的武器，可以最佳地对付任何敌人。在战斗中，它里面的器灵们会根据实际需要改变金属的成分，确保妖精面对金斧，狼人面对银斧等等。这武器极度罕见，因为让这么多的灵同居于其中确实是一个史诗般的壮举。"
 artifact_bramble_branch_name: "[fetish_artifact_icon]荆棘枝"
 artifact_bramble_branch_description: "一个强大的灵被缚在这枯枝上。一旦被激活，各种有毒的植物就会从地下冒出来，把这个地区封锁起来，不让任何干扰者进入。"
 artifact_assassin_klaive_name: "[fetish_artifact_icon]刺客的月刃"
 artifact_assassin_klaive_description: "像真正的影爵一样圆滑而致命，这种注入了蛇之灵的月刃很容易隐藏，即使在最公开的地方也能掩盖其主人的存在。"
 artifact_firebird_feather_name: "[fetish_artifact_icon]火鸟之羽"
 artifact_firebird_feather_description: "火鸟之羽的确切属性并不为人所知。它只是看起来像一根美丽的发光羽毛，但当它被带进银牙之王的房间时，房间就像被无数根蜡烛照亮。它看起来也出奇地坚固，同时像最光洁的月刃一样锋利。"
 artifact_owl_talon_name: "[fetish_artifact_icon]枭爪"
 artifact_owl_talon_description: "这把弯曲的刀，类似于猫头鹰的爪子，是寂静漫游者持有的最强大的月刃。它内部有两个器灵，据说它特别渴望埃及吸血鬼的血液，期待着部族最终获得复仇的那一天。"
 artifact_yellow_veil_name: "[fetish_artifact_icon]卡尔帕特里的黄面纱"
 artifact_yellow_veil_description: "无尽黑暗女士在审判不堪的星占时戴着这块面纱。这件宝物迫使持有者始终为正义而努力，任何接近它的人都要说出真相，坦白他们可能拥有的任何可耻的秘密。"
 artifact_devil_deck_name: "[fetish_artifact_icon]魔鬼牌"
 artifact_devil_deck_description: "芭丝特使用的这副“普通”扑克牌是一种灵具，它总能为主人抽到最有帮助的牌。芭丝特长久以来一直在探究这些奇异宝物的来源，但到目前为止还没有发现任何线索。"
 artifact_lotus_petals_name: "[fetish_artifact_icon]宝莲瓣"
 artifact_lotus_petals_description: "#bold 一位持有此宝物的芭丝特总会令其亲族子嗣在适龄时成为化形者。#!\n露娜的宫廷相传有着一座生长着千年莲花的池子。每一位有能力登月的芭丝特都可能从中撷取些许花瓣，而此种植物的神秘功效足以确保芭丝特能诞下维持世系的子嗣。"
 artifact_grandmothers_stones_name: "[fetish_artifact_icon]祖母之石"
 artifact_grandmothers_stones_description: "大洪水之后，留下了一些闪烁的石头，它们吸引着收集它们的女性，并将其变成了首饰。这些灵具得到了月光的祝福，与偶然发现它们的女性芭丝特的塞琳之血产生共鸣，增强了她们与月神露娜的联系。"
 artifact_truthspeaker_stick_name: "[fetish_artifact_icon]真言棍"
 artifact_truthspeaker_stick_description: "这一件看似不可捉摸的灵具外在表现为附有精美雕刻纹饰的文明棍，它会跃跃欲试地飞向附近口出谎言的骗子，用暴力殴打从他们的口中得出真相。如果被谎言包围，真言棍将会散发出宛如余火的微光，致力于将每一个口出谎言之徒血腥地粉碎。"
 artifact_silver_hakarr_name: "[fetish_artifact_icon]纯银飞镰"
 artifact_silver_hakarr_description: "像狼族的月刃一样，这些银制的飞镰在制造时危险重重，使用起来更是致命无比。作为用于解决最致命恩怨战斗的仪式武器，这些多刃的怪物是用生银打造，并被赋予了战争之灵的力量。"
 artifact_frog_skin_name: "[fetish_artifact_icon]蛙皮"
 artifact_frog_skin_description: "这块皮通常可以手套的形式包裹在手上，令持有者仅以一触便能中和所有种类的毒素。"
 artifact_ice_knife_name: "[fetish_artifact_icon]冰刃"
 artifact_ice_knife_description: "这一强力的灵具武器因其与冰之灵密切相关而被视为禁忌：而将其置于零度以上的环境亦会导致融化。因此持有者必须谨慎地仅在适当环境下使用之。"
 artifact_foe_heart_name: "[fetish_artifact_icon]仇敌之心"
 artifact_foe_heart_description: "如果一个芭丝特在不离开其血种形态的情况下成功击杀一个强大的敌人，那么敌人的心脏将被取出并注入$glossary_wyld$属灵。芭丝特可以使用灵知来激活这件灵具，恢复他们的意志力。"
 artifact_jade_arrows_name: "[fetish_artifact_icon]翠玉矢"
 artifact_jade_arrows_description: "#bold 转化所有伤害为[POD_aggravated_damage|E]。#!\n\n此类箭矢主要为可汗们使用，将一个死亡之灵注入翠玉而锻造成型。翠玉矢对各类超自然生物造成恶性伤害，并且在命中时撞击爆炸——只要爆炸产生的破片还有哪怕一块在受害者体内尚未取出，由翠玉矢造成的伤口就无法愈合。"
 artifact_quicksilver_name: "[fetish_artifact_icon]快银"
 artifact_quicksilver_description: "一小瓶与水灵绑定的水银，这个灵具允许使用者在[umbra|E]中多带一个人同行。"
 artifact_false_protection_name: "[fetish_artifact_icon]守护伪像"
 artifact_false_protection_description: "芭丝特最大的弱点是他们的雅瓦，也就是部族的秘密，而这件灵具是一种（有些亵渎的）保护这些秘密的方式。一旦激活，这件灵具会将其主人的雅瓦与另一个部族的雅瓦进行交换，确保他们最重要的秘密永远不会被知晓……但这可能会以牺牲另一个部族的一个秘密为代价。"
 fetish_no_gnosis: "[fetishes|E]需要至少5%$POD_energy_gnosis$回复才能保持激活。"
 fetish_no_companion: "每个装备的[fetishes|E]都需要一个[spirit_companion|E]伴护才能保持[fetish|E]激活。"
 artifact_stone_of_wealth_name: "[fetish_artifact_icon]财富之石"
 artifact_stone_of_wealth_description: "该灵具看起来不过是一块非常古老的“减压”石。当摩擦它时，它会为使用者带来财富。财富并不总是指金钱，被召唤来的财富也未必立刻出现。相反，这块石头会提供使用者完成任务所需的资源。"
 artifact_fish_swatter_name: "[fetish_artifact_icon]拍鱼杖"
 artifact_fish_swatter_description: "用这根棍子拍打水面，鱼就会飞到岸上，就像被熊从水里拍出来一样。"
 artifact_leaf_armor_name: "[fetish_artifact_icon]叶甲"
 artifact_leaf_armor_description: "这件叶甲几乎毫无重量，却能提供卓越的物理伤害防护。"
 artifact_bent_vine_name: "[fetish_artifact_icon]曲藤"
 artifact_bent_vine_description: "曲藤不过是一段枯萎干燥的藤蔓，上面费力地刻着一个符文。它仅三英寸长，看起来毫不起眼。然而，当它被扔到任何类型的土壤上时，曲藤会立刻焕发生机，如同一条充满生机的多头蛇般绿意勃发。由此产生的藤蔓浪潮具有攻击性，十分危险，并且倾向于抓住附近的任何东西，将其撕扯分裂。因此，在面对紧追不舍的敌人时，曲藤能为匆忙撤退提供极佳的掩护。"
 artifact_gnostic_bag_name: "[fetish_artifact_icon]灵知袋"
 artifact_gnostic_bag_description: "灵知袋是一个带有流苏的小皮袋，上面绘有奇异的图案和象形文字。这个袋子内里承载着灵知。使用者将手伸入袋中，“抓住”一份灵知并吞下，即可激活它。"
 artifact_dragon_crystal_name: "[fetish_artifact_icon]龙晶"
 artifact_dragon_crystal_description: "这是一块被抛光成透镜、灵板或圆盘形状的半宝石或琥珀碎块，并被镶嵌成项链等饰物。当其被启动时，能够揭示魔克拉的真身：若使用者透过它观察目标，对方将显现为其半龙形的模样。若将宝石贴触于魔克拉的身体，石头便会绽放出太阳之光。正因如此，这类宝石有时会被制成饰品，佩戴于聚会场合。"
 artifact_hatchlings_tail_name: "[fetish_artifact_icon]幼孵之尾"
 artifact_hatchlings_tail_description: "这件灵具看起来不过是一截风干的蜥蜴尾巴，但当魔克拉将其系于腰带佩戴时，能帮助他们更容易转化为半龙形。此物主要供幼孵者使用——那些尚未在战斗中累积经验的年轻魔克拉。随著成长，大多数人会逐渐\"不再需要\"这件灵具，并将它转交给更年幼的族人。"
 artifact_egg_basket_name: "[fetish_artifact_icon]蛋篮"
 artifact_egg_basket_description: "这是用来存放魔克拉一整巢蛋的篮子。篮子本身的大小只相当于单颗蛋，但却能轻松容纳整个亲巢。放入其中的蛋能够良好地维持温度。然而，它的缺点也同样明显：这个篮子在结构上与普通容器无异，同样脆弱易毁；而一旦被破坏，里面承载的将是整整一巢的生命。在魂怒之战期间不止一个亲巢，在狼族战士的鲁莽破坏下，被连同这类篮子一同彻底毁灭。"
 artifact_spirit_jar_name: "[fetish_artifact_icon]封灵陶罐"
 artifact_spirit_jar_description: "类似某些巫毒教法器，这件灵具是一个手工制作的陶罐，其盖子以沥青或蜡密封。罐中囚禁着一个灵体。持有者可以与该灵进行谈判，以承诺各种报酬来换取使用它的力量。这些承诺可能包括：提供灵知、允许它附身于媒介或最终将其释放。若陶罐被打破，灵便会立刻重获自由。"
 artifact_seeing_boomerang_name: "[fetish_artifact_icon]观视回力镖"
 artifact_seeing_boomerang_description: "观视回力镖专门用来侦察广阔区域，特别是在你被包围时非常有用。它被绑定了一个猫头鹰灵，因此在制作上刻意设计得轻巧且飞行稳定。这件物品的主要用途是容易回收，而不是作为狩猎武器使用；其下侧涂有两只巨大的眼睛图案。当启动并掷出后，回力镖会将其下方地面的影像直接传入使用者的视觉中枢，使其能够获得周围环境的鸟瞰视角。"
 artifact_kurdaitcha_name: "[fetish_artifact_icon]鸸鹋羽鞋"
 artifact_kurdaitcha_description: "这些鞋子是用鸸鹋羽毛和人发打结而成，并用相当于使用者生命值一级的血液粘合在一起。制作者必须将恶魔鸟托坎皮尼的灵类仆从束缚在鞋子里。启动后，这双鞋可以防止任何人听到穿著者的脚步声。"
 artifact_warshell_name: "[fetish_artifact_icon]战争之壳"
 artifact_warshell_description: "这是一个被塑造成三角形的锋利贝壳。它可以远距离切割敌人，使用者只需挥动贝壳向敌人劈砍即可。贝壳本身非常坚固，也可以用作盾牌。"
 artifact_beggars_mantle_name: "[fetish_artifact_icon]乞者斗篷"
 artifact_beggars_mantle_description: "此灵具用破布和蛇皮编织而成，遮蔽住一个人的光荣真形不被邪恶生物窥视。当启动时，此斗篷使穿戴者对吸血鬼、忌灵、堕落$glossary_fera$和其他$glossary_wyrm$生物完全隐形——他们全然忽视了穿戴者。"
 artifact_tokoyanga_name: "[fetish_artifact_icon]鸟灵绒"
 artifact_tokoyanga_description: "#bold 可以用来移除一个负面[stress|E][trait|E]#!\n\n这是一枚以鹅绒编成的颈饰，内蕴鸟灵之力。它能抚平悲痛——凡是咬住它的人，都不能哭泣。此外，当佩戴者开口时，所有巨大的爬行者，都无法听见他的言语。"
 artifact_mirror_amaterasu_omikami_name: "[fetish_artifact_icon]天照大神之镜"
 artifact_mirror_amaterasu_omikami_description: "这是一面青铜铸成的古镜，背面浮现着太阳的神圣纹章。世间仅存寥寥数面——相传它们皆由远古时代、乌鸦们用来引诱太阳从藏身之处出来的镜子碎片铸造而成的。镜面与凡镜无异，能映照万物；然而其倒影之中，总会浮现背面那枚太阳印记。此外，此镜能储存日光。持有者必须让它沐浴于阳光之下数个时辰，并付出相等时辰的灵知作为代价。而后呼唤太阳之名、唤醒此灵具之时——封存其中的光芒将奔涌而出，宛如万里无云之日正当天穹。"
 artifact_echo_of_ages_name: "[fetish_artifact_icon]纪元回音"
 artifact_echo_of_ages_description: "#bold 可用来发现随机的新[innovation|E]，此效果只能使用一次。 #!\n\n魔克拉记得许多事——这本来就是他们的职责。但他们的人数实在太少，不可能在每个时代、每个地方都亲身存在。因此，在盖亚的记忆中，许多地区都不可避免地存在巨大空白。然而，纪元回音能够帮助填补这些空隙。纪元回音是一只金色小钟，边缘刻满细小符文。钟中束缚着一个龟灵。当启动并敲响时，钟声会回荡进该地区的过去，重现曾在此发生之事件的幽影影像与声音。钟声敲得越响，回溯的年代就越久远。"
 artifact_bowl_of_mnesis_name: "[fetish_artifact_icon]龙梦之钵"
 artifact_bowl_of_mnesis_description: "#bold 能献祭[ancestor_spirit|E]来获得龙梦[lifestyle_experience|E]，或低机率获得一[skill|E]点。\n\n这个简单的土钵对魔克拉来说是神圣的。仅仅是知道这件神器的存在，对任何非魔克拉来说也等于死刑。此土钵可以用来保存魔克拉祖灵的记忆。灵类的位阶反映了可被回收的记忆数量；在极少数情况下使用者能重获该灵的力量。魔克拉真正尊重那些被选中以这种方式保存记忆的人；此灵具绝不会被轻率地使用。"
 artifact_dragon_skin_name: "[fetish_artifact_icon]龙鳞"
 artifact_dragon_skin_description: "这是中龙蜕下的皮，散发着柔和的五彩之光。在亲巢中拥有一张精美的蜕皮是极高的威望象征。当然，东方法师和其他兽妖亦希望拥有它。"
 artifact_seven_blades_inoue_name: "[fetish_artifact_icon]井上七刃"
 artifact_seven_blades_inoue_description: "[GetDynastyByID('POD_werewolf_dynasty_inoue').GetBaseName]氏族的七刃之一。\n[GetScriptedCharacterByHistoryID('795223').GetFirstName]为其妻铸造第一把刀，接着六名子女各有其一。每把刀都是用钢铁和政宗对家人的爱精心铸造而成的。战争诸灵寄宿其中，使之永恒锋利，一切只欠一位配得上的刀主。"
 artifact_thunder_inoue_name: "[fetish_artifact_icon]井上之雷"
 artifact_thunder_inoue_description: "#bold [GetPerk('storm_winds_slash_perk').GetName(GetPlayer)]现在除了原有的[POD_superficial_damage|E]还将造成1雷霆[POD_aggravated_damage|E]。 #!\n\n一把由[GetScriptedCharacterByHistoryID('795223').GetFirstName]以其细心缜密所完美铸造的大太刀。这是政宗精心锻造的第一把刀，至少他是如此主张的。除了尺寸和工艺之外，原本和其他刀没什么两样。直到他带着刀去富士山朝圣，在那里，骄傲的八犬向鸣神本尊发起了挑战。雷霆之神觉得可笑，派出一名奴仆去与年轻的狼人交战。政宗取得了胜利，并将雷神的奴仆束缚在刀刃之中。\n\n如今，震耳欲聋的雷声预示着刀主的到来。"
 artifact_wolven_oath_name: "[fetish_artifact_icon]狼誓"
 artifact_wolven_oath_description: "[GetDynastyByID('POD_werewolf_dynasty_chika').GetBaseName]氏族之刃。\n千夏在拔出打刀前立下誓言，只有在誓言完成时才会将此刀入鞘。"
 artifact_chiming_serpent_name: "[fetish_artifact_icon]铃响之蛇"
 artifact_chiming_serpent_description: "[GetDynastyByID('POD_werewolf_dynasty_kasutoshi').GetBaseName]氏族之刃。\n这把大太刀长短不一地系着小铃铛，当刀刃迎敌时，持续的叮当声会扰乱人的感官。"
 artifact_serrated_tempest_name: "[fetish_artifact_icon]锯齿暴风"
 artifact_serrated_tempest_description: "[GetDynastyByID('POD_werewolf_dynasty_chikara').GetBaseName]氏族之刃。\n大太刀刀身布满锯齿，使其能轻易撕裂血肉。这是一种粗犷而野蛮的武器，足以压制敌人。"
 artifact_lunar_dragon_tide_name: "[fetish_artifact_icon]月龙潮汐"
 artifact_lunar_dragon_tide_description: "[GetDynastyByID('POD_werewolf_dynasty_ozatu').GetBaseName]氏族之刃。\n这把精美的打刀与其持有者在优雅的死亡之舞中一同闪耀。这种独特的流派以完美的防御为核心，直到刀刃如咆哮的潮水般猛烈击落。"
 artifact_stalking_moon_name: "[fetish_artifact_icon]随形之月"
 artifact_stalking_moon_description: "[GetDynastyByID('POD_werewolf_dynasty_kintaro').GetBaseName]氏族之刃。\n一把锋利的胁差，设计给狼叼在嘴里而不是持于人手里。这种非常规的武器让许多人措手不及。"
 artifact_mask_of_mnante_name: "[fetish_artifact_icon]姆楠特面具"
 artifact_mask_of_mnante_description: "这是一枚雕刻而成的面具，可作为项链佩戴、覆于面部、装饰于头饰之上，或以其他方式配戴。这是一件诞生于魂怒之战期间的工具，旨在帮助魔克拉得以存续。当其被启动时，任何试图辨识该魔克拉所属血种的行为——例如透过真形嗅闻，其难度将根据该魔克拉当前的灵知而提升。若观察者失败，则会将该魔克拉视为自身种族的一员。"
 artifact_mace_of_winds_name: "[fetish_artifact_icon]灵风圆锤"
 artifact_mace_of_winds_description: "#bold 半龙形形态获得：[GetModifier('archid_gale_cloak_modifier').GetNameWithTooltip]#!\n\n这是一件摩迦罗独有的武器——一柄以黄铜镶嵌铁制成的华丽圆头锤。\n当持有者转化为半龙形形态时，这柄圆锤的真正力量才会显现：它能自行悬浮、盘旋与突袭，在持有者的指引下攻击敌人，并始终回到持有者头侧盘旋守护。同时，它还会在使用者周围掀起狂暴飓风，不仅能震慑并阻挡来袭者，更会将任何不幸卷入风暴之中的敌人直接吹飞。"
 artifact_sun_spear_thrower_name: "[fetish_artifact_icon]日矛掷具"
 artifact_sun_spear_thrower_description: "#bold 可以用来对另一角色施加太阳伤害，其强度依据[artifact_power_with_icon|E]。不像太阳之箭，此宝物使用时不会消耗。#!\n\n一种投矛器，也称为atlatl，是一种结构相当简单但极其巧妙的装置。它是一块弯曲的木片，沿前臂固定；只要以正确方式挥动，就能将长矛以惊人的速度与精准度投射到极远距离。日矛掷具本身会携带它的长矛，更准确地说，是它向赫利俄斯请求提供长矛。当被启动时，日矛掷具会生成一柄由纯粹阳光构成的长矛。当长矛命中目标后，稍过片刻便会在一场耀目的光爆中消散。"
 artifact_sword_of_fever_name: "[fetish_artifact_icon]瘟疫之剑"
 artifact_sword_of_fever_description: "#bold 可用来使一名角色获得[GetTrait('entoban_plague').GetName(GetNullCharacter)]。\n解锁一项决议，可在你所在地引发末日爆发级瘟疫。#!\n\n这柄恩托班钢铸成的长剑，具现了魔克拉-姆边贝亲手在恩托班周围设下的疫热结界。只要它被抽离剑鞘——哪怕仅一指之宽——疾病之灵便会被释放，瘟疫随之降临。持剑者可以宣告敌人的名字，使其染病。甚至整个国度，也能被点名为目标。然而，疾病之灵无法被约束。瘟疫将以所能及的最快速度蔓延，而历史上，魔克拉多次阻止此剑出鞘，只因疫病往往会连自己的族人一同吞噬。"
 artifact_blowpipe_anamnesis_name: "[fetish_artifact_icon]追忆吹管"
 artifact_blowpipe_anamnesis_description: "#bold 可以用来给予其他角色[GetTrait('mokole').GetName(GetNullCharacter)][mnesis_lifestyle|E][perk|E]点。#!\n\n此管以热带木棉神木所制，取材而不伤树身，并刻满古代诸王的符印。它用于施行启迪植物的仪式：将研成细粉的神圣植物填入管中，再逐侧鼻孔吹入受者体内，使其得以接受启示。"
 artifact_pearls_flood_ebb_name: "[fetish_artifact_icon]潮汐之珠。"
 artifact_pearls_flood_ebb_description: "#bold 解锁天气魔法选项：#V 大洪水#!和#V 滋养潮汐#!#!\n\n这些是收藏于海底龙王宫殿中的珍珠，能够掌控潮汐的涨落。其被注入了月之精华，并有月灵束缚于其中。这些珍珠能够使潮水上升或退去，既可带来灾厄，也能带来繁荣。"
 artifact_spear_mokole_mbembe_name: "[fetish_artifact_icon]魔克拉-姆边贝之矛"
 artifact_spear_mokole_mbembe_description: "#bold 半龙形形态获得：[GetModifier('archid_ancient_strength_modifier').GetNameWithTooltip]#!\n\n此武器外观上是一柄恩托班式战矛，但若仔细检视矛头，便会发现其材质其实是金银合金。此外，由于此武器材质独一无二的纯度，它对$glossary_fera$造成的影响，等同于同时具备银与黄金的性质。而除了魔克拉以外的化兽族裔通常难以辨识出这种合金所具备的银之特性。"
 artifact_brush_of_ancients_name: "[fetish_artifact_wyrm_icon]Brush of the Ancients"
 artifact_brush_of_ancients_description: "#bold $countermeasures_unlocks_t1_all_seeing_eye$#!\n\nAlso called the Omen Brush, this small paintbrush allows the user too paint intricate and accurate scenes, guided by the hands of an ancestor. These paintings often reflect signs of things which have past and things yet to come."
 artifact_wyrm_gut_bonds_name: "[fetish_artifact_wyrm_icon]Wyrm Gut Bonds"
 artifact_wyrm_gut_bonds_description: "#bold Prisoners have a lower chance of escaping.#!\n\nThis bizarre fetish takes the form of strands of especially strong gut that cannot be cut or burned. Struggling against the bonds only causes nausea to the victim."
 artifact_devilwhip_name: "[fetish_artifact_wyrm_icon]Devilwhip"
 artifact_devilwhip_description: "This thorned, black, fifteen-foot fetish is actually the severed tentacle of a Bane, specially treated to remain permanently in the material world. The lesser Bane that powers the Devilwhip can animate the whip on command, lashing and directing the whip as if it were wielded by another. The Devilwhip gives off a sound like a lunatic's laughter each time it draws blood. When cracked just before an opponent's face and activated, the whip compels the foe prostrate himself on the floor."
 artifact_umbrascope_name: "[fetish_artifact_wyrm_icon]Umbrascope"
 artifact_umbrascope_description: "Tarnished spyglasses, binoculars or even opera glasses within which a Scryer Bane is bound. This fetish allows its user to peek into the Umbra from the material world without actually stepping sideways."
 artifact_bane_lantern_name: "[fetish_artifact_wyrm_icon]忌灵提灯"
 artifact_bane_lantern_description: "A steel lantern painted with obscene glyphs and eldrich runes. When ordered to ignite in either Pictish, the Primal Tongue, or in the secret language of the Wyrm, it casts an unnatural purple light. It illuminates all spirits in the beam, even in the physical world. The lantern has a hypnotic affect on spirits, drawing them to it like moths to a flame."
 artifact_tambertails_heart_name: "[fetish_artifact_wyrm_icon]Tambertail's Heart"
 artifact_tambertails_heart_description: "The original version of this fetish was the mummified heart of a Fianna Theurge. Now a number of these Wyrm fetishes are in existence, each one the preserved heart of a Gaian Garou, but bearing the name of the original nonetheless. The heart begins to beat arrhythmically whenever danger menaces its attuned owner."
 artifact_deathrattler_name: "[fetish_artifact_wyrm_icon]Deathrattler"
 artifact_deathrattler_description: "This fetish is made from a dried rattle taken from some unknown rattlesnake-like creature. The rattler has the power to frighten away all animals or humans within hearing range, $glossary_fera$ included."
 artifact_spirit_net_name: "[fetish_artifact_wyrm_icon]灵类捕网"
 artifact_spirit_net_description: "This fetish is made from a dried rattle taken from some unknown rattlesnake-like creature. The rattler has the power to frighten away all animals or humans within hearing range, $glossary_fera$ included."
 SPIRIT_NET_REASON: "$artifact_spirit_net_name$：$VALUE|+=0$"
 artifact_wyrm_fang_dagger_name: "[fetish_artifact_wyrm_icon]Wyrm Fang Dagger"
 artifact_wyrm_fang_dagger_description: "These knives are said to be the rotten teeth of the Wyrm, fallen or pulled from it and made into combat weapons. Were they indeed the actual teeth, they would be very rare, but these fetishes are actually quite common. However, the strange thing about these knives is that some of them actually possess power. These knives inflict aggravated damage to any wounded by them, causing festering wounds."
 artifact_wyrmflesh_name: "[fetish_artifact_wyrm_icon]Wyrmflesh"
 artifact_wyrmflesh_description: "#bold Remove any weaknesses to Silver or Gold damage.#!\n\nTo create this gruesome fetish a human must be flayed over the course of a lunar month, carefully keeping him alive until the last moment. The creator tattoos the skin with eye-warping glyphs, tans it, and then makes into a tunic. Wyrmflesh increases the wearer's defence against all damage. It shapeshifts along with the wearer, providing protection in every form. Should any damage get through the Wyrmflesh's protection, it lets out a deafening shriek and blood flows thick and red from even the smallest cut."
 artifact_wyrmwood_name: "[fetish_artifact_wyrm_icon]Wyrm-wood"
 artifact_wyrmwood_description: "Wyrm-wood is a blackened, unnatural vine that grows deeps within the earth, absorbing the light of the balefires below. When enough of this woof is collected and burned, it has the power to protect all within the range of its horrible smell from attacks by spirits of all sorts, regardless of how powerful they are."
 artifact_magic_spewer_name: "[fetish_artifact_wyrm_icon]Magic Spewer"
 artifact_magic_spewer_description: "#bold Inflict 1 fire [POD_aggravated_damage_with_box|E] to enemy [knights|E] and [commanders|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].#!\n\nThis fetish is fashioned from a human skull. On command, the skull issues forth, as if vomiting, a stream of viscous, foul-smelling toxic waste. Anyone hit by the slime of the Spewer will take damage as if it were fire. The Magic Spewer's eyes glow red when it is active and the lower jaw moves on its own."
 artifact_goblin_ale_name: "[fetish_artifact_wyrm_icon]Goblin Ale"
 artifact_goblin_ale_description: "#bold Can be used to reduce [stress|E]#!\n\nThis alcoholic elixir is typically bartered from the goblin brewers of the Shadow Court. One quaff of these spirits causes the drinker to suffer violently intense hallucinations and may even shift them accidentally into the Umbra. Goblin Ale is completely intoxicating, and gets even the stoutest $glossary_fera$ drunker, quicker, than any human brew could. It's a perennial favorite at Black Spiral moots, and usually makes the evening bloodier than usual."
 artifact_voidstone_name: "[fetish_artifact_wyrm_icon]Voidstone"
 artifact_voidstone_description: "#bold Can be used to permanently trap a character in [UmbraGlossary('malfeas')]#!\n\nThis powerful object is a small, smoothy polished black stone. If it is thrown at any one target, that target is forever banished from the material world, though it may still exist in the Umbra. Voidstones may only be used once each, and they are exceedingly rare."
 artifact_storm_bottle_name: "[fetish_artifact_wyrm_icon]Storm in a Bottle"
 artifact_storm_bottle_description: "#bold Can be used unleash a #V Storm#! on a Kingdom and inflict #V [EmptyScope.ScriptValue('POD_base_lightning_damage')|0]#! Lightning damage to all enemies of the $glossary_wyrm$#!.\n\nThis opaque bottle contains an entire Wyrm-tainted storm within. Once unleashed, the storm rampages across physical world and Penumbra alike. Any enemy of the Wyrm caught without shelter will be struck by lightning. The lightning however, will only strike an individual once."
 artifact_dragons_ichor_name: "[fetish_artifact_wyrm_icon]Dragon's Ichor"
 artifact_dragons_ichor_description: "#bold Can be used to temporarily gain [GetModifier('dragons_ichor_temp_modifier').GetNameWithTooltip].#!\n\nUsually found in small jars or vials, Dragon's Ichor is black blood taken from a powerful Wyrm-creature. If the nearly-congealed gunk is rubbed all over one's body it will cause them to become temporarily immune to all attacks."
 dragons_ichor_temp_modifier: "黑血"
 dragons_ichor_temp_modifier_desc: "Can [soak_damage|E] [POD_aggravated_damage_with_box|E]"
 artifact_baneklaive_name: "[fetish_artifact_wyrm_icon]Baneklaive"
 artifact_baneklaive_description: "#bold Can be used to inflict up to #V [EmptyScope.ScriptValue('POD_double_balefire_damage')|0]#! [balefire|E] damage to a character. Their $POD_energy_gnosis$ will also be drained if they are a $glossary_fera$ or [GetTrait('spirit').GetName(GetNullCharacter)].#!\n\nThe Baneklaive is a sword-length silver blade, engraved with twisted runes and gleaming with Balefire. The blade can steal Gnosis from Fera and Spirits as the Balefires burn them."
 artifact_churjurocs_tusk_name: "[fetish_artifact_wyrm_icon]Churjuroc's Tusk"
 artifact_churjurocs_tusk_description: "#bold Can bypass delirium immunity.#!\n\nThis blackish-purple tusk once belonged to a massive, wormlike creature of the Wyrm. The Black Spiral Dancers gleefully fought alongside it until it began to turn on them out of stupidity and hunger, whereupon they destroyed it in a long, hard battle. The tusk is about two feet long; it's capped with a platinum ball on one end and covered with intricately perverse carvings along its length."
 artifact_soul_ruby_name: "[fetish_artifact_wyrm_icon]Soul Ruby"
 artifact_soul_ruby_description: "#bold Can be used to commune with the captive Spirit inside it.#!\n\nThe Soul Ruby is a ruby the size of a woman's fist, cut from the veins of rock at the heart of the Black Spiral Dancers' underground Pits. Priceless by virtue of the stone's value alone, each Soul Ruby also contains the spirit of a fallen Black Spiral Dancer. When activated, the ruby gives telepathic advice to its bearer, allowing the bearer access to whatever knowledge the Dancer possessed in life. The fallen Dancer's spirit may also visit the fetish holder in his dreams, possibly giving glimpses of the future."
 artifact_shadowflame_name: "[fetish_artifact_wyrm_icon]Shadowflame"
 artifact_shadowflame_description: "#bold Can be used to instantly teleport to your destination while [traveling|E].\nInflicts #V [EmptyScope.ScriptValue('POD_base_balefire_damage')|0]#! [balefire|E] damage to enemy [knights|E] and [commanders|E] when acting as a [commander|E] during the [combat_phase|E], or to your foe during [single_combat_duel_plural|E].#!\n\nA terrifying horse created from the darkest and deadliest of [balefires|E]. This mount will carry its rider through all the hells and back unscathed. Shadowflame's allegience is to the $glossary_wyrm$, and to its strongest servant."
 artifact_cauldron_dagda_name: "[fetish_artifact_icon]Cauldron of Dagda"
 artifact_cauldron_dagda_description: "When they first arrived in Ireland, the Tuatha de Danaan brought with them many great treasures. Two of them reside in the Fianna stronghold of Silver Tara. One is the Cauldron of the Dagda, which is ever full so that “no company would go from it unsatisfied“."
 artifact_harp_dagda_name: "[fetish_artifact_icon]Cauldron of Dagda"
 artifact_harp_dagda_description: "When they first arrived in Ireland, the Tuatha de Danaan brought with them many great treasures. Two of them reside in the Fianna stronghold of Silver Tara. One is is the Harp of the Dagda, which can bring life to the fields, weakness to the enemy and mirth to even the grimmest warrior; it’s even been known to cure Harano."
 artifact_silver_spear_name: "[fetish_artifact_icon]Silver Spear"
 artifact_silver_spear_description: "While the spear is an uncommon weapon for the warriors of Gaia, Kazimier's famous prowess with it has shown that it can be as deadly as any traditional Klaive."
 artifact_anklet_false_trails_name: "[fetish_artifact_icon]Anklet of False Trails"
 artifact_anklet_false_trails_description: "Made from the braided fur of an animal, this fetish disguises the trail of its wearer as that of another animal."
 artifact_eye_leech_name: "[fetish_artifact_icon]Eye of the Leech"
 artifact_eye_leech_description: "This dried and preserved eye of a vampire kept in a small pouch \"cries\" blood through its surface if its owner is watched by a vampire."
 artifact_owl_feather_name: "[fetish_artifact_icon]Owl Feather"
 artifact_owl_feather_description: "Braided into its owner hair or fur, this single owl feather allows increased stealth while active."
 artifact_owner_bridle_name: "[fetish_artifact_icon]Owner's Bridle"
 artifact_owner_bridle_description: "This simple leather bridle allows a Fera to mask their predatory nature, making it so a prospective mount won't be as afraid as they would be otherwise."
 artifact_dyonisian_horn_name: "[fetish_artifact_icon]Dionysian Horn"
 artifact_dyonisian_horn_description: "Decorated with engravings of satyrs and revelers dancing and feasting, this drinking horn transforms any liquid poured into a potent wine."
 artifact_shield_arrows_name: "[fetish_artifact_icon]Shield of Arrows"
 artifact_shield_arrows_description: "This small shield is nearly impervious to missiles. The turtle-spirit insides it makes sure they fall harmlessly to the ground before reaching their intended target."
 artifact_amulet_tongues_name: "[fetish_artifact_icon]Amulet of Tongues"
 artifact_amulet_tongues_description: "This small wooden talisman hung around the neck allows its user to understand any language, including spirit speech, while activated."
 artifact_unicorn_ire_name: "[fetish_artifact_icon]审判槌"
 artifact_unicorn_ire_description: "#bold Converts damage to [POD_aggravated_damage|E] against targets following a Wyrm Tainted faith.#!\n\nThis powerful fetish looks made of smooth ivory with a handle resembling an unicorn's horn. When activated, it does grievous damage against foes tainted by the Wyrm but loses most of its power against other targets."