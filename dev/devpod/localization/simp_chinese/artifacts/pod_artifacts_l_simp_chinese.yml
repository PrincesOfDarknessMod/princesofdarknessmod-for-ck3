l_simp_chinese:
 artifact_sword_of_nul_name: "空无之剑"
 artifact_sword_of_nul_description: "#bold 解锁独特事件。#!\n这柄剑短而直的青铜剑看起来很无害。整把武器随着时间的推移呈现为了青色。但它仍然很锋利，非常锋利，比最好的钢还要锋利。\n这柄剑背后的故事非常血腥，每一任它的主人都会离奇死亡。空无之剑终将与它真正的主人团聚，无论如何。"
 artifact_tablet_of_destiny_name: "命运石板"
 artifact_tablet_of_destiny_description: "#bold 解锁独特[decision|E]。#!\n根据埃努玛·埃利什，命运石板是人类的法律，由以诺亲自设立。这些泥板上到底写着什么，有很多猜测。最为公认的一种理论认为这是一本关于血之力量的编年史，解释了所有以诺魔法。无论如何，据说伊什塔尔曾试图从伊娜依娅处拿走这一物品，这引发了两位$pod_antediluvians$之间的激烈战斗，几乎使得妥芮朵氏族两度毁灭。"
 artifact_eye_of_hazimel_name: "哈济梅尔之眼"
 artifact_eye_of_hazimel_description: "#bold 解锁独特[decision|E]。#!\n这件遗物的故事充满了疯狂、血腥和绝望。哈济梅尔之眼似乎是一位强大的雷伏诺玛土撒拉的最后一块有活力的碎片，可以以巨大的代价为他的持用者提供不可思议的力量。想要了解它的秘密，用它替换你自己的眼睛只是你要做的第一件事，也是最简单的一件事……"
 artifact_ankaran_sarcophagus_name: "安卡拉石棺"
 artifact_ankaran_sarcophagus_description: "#bold 解锁独特[decision|E]。#!\n不要打开它。"
 artifact_kristrbani_name: "克里斯特巴尼"
 artifact_kristrbani_description: "弑主者是巴尔伯格女王选择的武器。这是一把凡人难以举起的巨型战锤，被鲜血一次又一次地浸染着。这是它无情的[einherjar|E]主人所热衷于继续的事业。"
 artifact_euagetaematikon_name: "闪耀圣血之经"
 artifact_euagetaematikon_description: "闪耀圣血之经是该隐教会的圣经。由君士坦丁堡的一位疯狂的僧侣撰写，这本几乎不连贯的文本宣布了该隐之子种族的命运，即在最后的弥赛亚身边行走，在无休止的血腥性爱狂欢中统治世界。"
 artifact_ainkurn_name: "安库恩"
 artifact_ainkurn_description: "根据传说，安库恩之剑可以让人摧毁玛土撒拉，单枪匹马地战胜贪婪的狼人，甚至进入亡者的国度。无论是幻想还是事实，这把强大的剑都是由突伽·辛制造的，作为一种更强大的武器的蓝本，用于未来的动荡时代。它最著名的事迹是克里斯托夫·罗慕铎对布拉格的吸血鬼的暴走，清楚地证明了它的有效性。"
 artifact_lamp_of_constantine_name: "君士坦丁的神灯"
 artifact_lamp_of_constantine_description: "#bold 即使没有[perk|E]，你也可以使用谴咒。#!\n据说，耶稣授予了君士坦丁大帝太阳本身的一部分，作为对他皈依的奖励。君士坦丁将这块圣物放在一盏交织印有希腊字母“χ”和“ρ”的灯中，以纪念他的异象并向基督致敬。据说这盏灯拥有以圣光消灭恶魔和其他夜行生物的力量。"
 artifact_magic_lantern_name: "魔法神灯"
 artifact_magic_lantern_description: "这是一个巨大但朴素的陶土瓮，这盏神灯曾经属于拉撒路，后来在火之庭的阴谋中丢失了。一旦暴露在阳光下，它就会呈现出奇怪的图案和有趣的谜题。"
 artifact_japhet_cloak_name: "雅弗的斗篷"
 artifact_japhet_cloak_description: "一块奇怪的半透明斗篷，可以抵御死灵。雅弗自己几乎不需要它，但他平静地回答说，这件圣物被使用的时刻将很快到来。"
 artifact_scarlet_rose_name: "亚历山大的猩红玫瑰"
 artifact_scarlet_rose_description: "当他的爱人洛林背叛了他时，亚历山大绑架了她，并在这花中慢慢地吸干了她的血。当她最终屈服时，洛林原谅了他，而玛土撒拉则被逼得发狂。这朵血淋淋的玫瑰现在正渴求着更多吸血鬼的血液，并不断提醒着亚历山大的失败。"
 artifact_infernal_tome_name: "魔邪书卷"
 artifact_infernal_tome_description: "恶魔用来引诱软弱的凡人和该隐之子崇拜他们的六本魔邪书卷之一。它没有包含什么有用的信息，也没有“真名”，因为它主要是恶魔的工具。"
 artifact_flagrum_passion_name: "受难之鞭"
 artifact_flagrum_passion_description: "#bold 解锁驱逐恶魔能力，允许解决死灵的所有[Fetter|E]。#!\n在受难期间一次又一次地刺穿基督的肉体的武器。由于以利亚撒的使用，这个遗物已经有些腐化，他的血与基督的血混合在了一起，但它仍然是信仰的强大灯塔。"
 artifact_night_lantern_name: "夜父之灯"
 artifact_night_lantern_description: "#bold 给予混淆术。#!\n这盏灯由一名诺斯费拉图玛土撒拉所精心制作，允许持有者使用类似于混淆术的[discipline|EL]。也有传言说，它有更险恶的秘密，但到目前为止，没有人能够证实这一点。"
 artifact_corona_ferrata_name: "铁之冠"
 artifact_corona_ferrata_description: "#bold 若有[true_faith|E]，免疫谋杀。#!\n作为圣费雷奥勒和圣费罗提欧的遗物，这个强大的冠冕对真信徒有抚慰作用。而对不信者则有更致命的影响。它的主人每天都会被它伤害一次，使圣血从他的前额溢出到他的下巴，形成一种令人毛骨悚然的自我鞭笞现象。"
 artifact_caecus_rose_name: "卡耶库斯玫瑰"
 artifact_caecus_rose_description: "由熟练的园丁卡耶库斯为美丽的海伦创造的，这朵玫瑰可以倾听附近的任何谈话，一种模仿观占术[discipline|EL]的微妙力量。"
 artifact_makeda_crown_name: "玛克达之冠"
 artifact_makeda_crown_description: "伟大的示巴女王的金冠有能力击退那些堕入恶魔崇拜的吸血鬼。兰斯亲王尼科迪默斯将它赠予海伦，她选择只在私下里佩戴，以示对已故女王的尊重。"
 artifact_goratrix_mirror_name: "格拉崔克斯之镜"
 artifact_goratrix_mirror_description: "一面被格拉崔克斯施了魔法的镜子，可以轻松地从一个地方传送到另一个地方。如果事先准备好镜子，它可以让使用者极度减少路途时间。"
 artifact_shemaziel_sarcophagus_name: "夏孟泽尔石棺"
 artifact_shemaziel_sarcophagus_description: "#bold 解锁独特[decision|E]。#!\n这是一副由未知的黑色岩石制成的沉重石棺，这个可怕的物品被坚固的锁链保护着。你觉得自己绝对绝对不应该打开它。"
 artifact_codex_mortis_name: "死灵抄本"
 artifact_codex_mortis_description: "#bold 解锁一项能给予乔凡尼亡灵术的决议。#!\n这抄本包含了许多亡灵仪式……以及死灵蒂蒂亚·赛比娜的受诅灵魂。她的丈夫奥勒留·弗拉维乌斯·约维安为了保护这本书和她的灵魂，自愿成为吸血鬼，不让任何人伤害他们。"
 artifact_slay_death_name: "弑死"
 artifact_slay_death_description: "这把巨大的斧头是彼得鲁斯选择的武器，他是科隆布亲王的刽子手。这也是他唯一的真爱。"
 artifact_michaelis_rosary_name: "米歇尔的玫瑰经"
 artifact_michaelis_rosary_description: "包含了米歇尔的回忆的106颗象牙珍珠，他是一位妥芮朵氏族的强大玛土撒拉。唯一没有被玷污的是他初拥埃斯克莱蒙德的记忆，他最爱的子嗣。"
 artifact_abraxas_sarcophagus_name: "阿卜拉克萨斯石棺"
 artifact_abraxas_sarcophagus_description: "这座由黄金和珍贵宝石制成的石棺是巴西里得的安息之地，巴西里得是一位被遗忘的基督教起源时代的圣人。他关于礼拜仪式的理论和检验对于任何一名神学家来说都是非常令人感兴趣的。"
 artifact_ermentrude_cross_name: "圣厄门特鲁德的十字"
 artifact_ermentrude_cross_description: "这位布列塔尼的殉道者遗留下了一个十字架，现在被做成了一条项链，它可以击退任何狼。它也会与[true_faith|E]产生共鸣。"
 artifact_odin_stone_name: "奥丁的符文石"
 artifact_odin_stone_description: "垂死的奥丁在这块石头上刻出了第一个如尼文。其中还蕴藏着三名渥尔娃女巫的灵魂，她们在被一名维京军阀屠杀前守护着这件圣物。"
 artifact_holy_flask_name: "圣瓶"
 artifact_holy_flask_description: "圣雷米在为法兰克第一任国王克洛维一世加冕时，用这个瓶子给他涂油。从那以后，它的圣油似乎总是用不完。"
 artifact_uraeus_osiris_name: "奥西里斯的圣毒蛇"
 artifact_uraeus_osiris_description: "这个金蛇雕像在奥西里斯本人的埃及头巾（冠冕）上。它有能力打开一扇通往阿蒙提——埃及的冥界之一——的门。在荷鲁斯突袭马赛的赛特之子神庙后，被格拉崔克斯偷走了。"
 artifact_ayr_sword_name: "艾尔之剑"
 artifact_ayr_sword_description: "传奇铁匠艾尔·铁砧创造的诸剑之一。为它的主人量身定做，几乎坚不可摧，并附上了强大的魔法。"
 artifact_ayr_armor_name: "艾尔之甲"
 artifact_ayr_armor_description: "传奇铁匠艾尔·铁砧创造的五盔甲之一。为它的主人量身定做，几乎坚不可摧，并附上了强大的魔法。"
 artifact_sofia_finger_name: "索菲亚的指骨"
 artifact_sofia_finger_description: "在内心深处，索菲亚总是知道关于黑夜的邪恶的真相。她被一位结仇的吸血鬼盯上了，当他来的时候，她已经准备好了，并牺牲了自己来阻止他。她的遗物授予你关于你周围的邪恶者的弱点的知识。"
 artifact_water_meriba_name: "梅里巴之水"
 artifact_water_meriba_description: "#bold 你的饥渴上升概率降低。#!\n梅里巴之水为走出埃及的干涸的希伯来人提供了救赎，但对摩西本人来说却是诅咒。在凡人教会的眼中，摩西的傲慢腐蚀了梅里巴的奇迹，但在该隐之子中仍然存在对它的交易。毕竟，摩西类似于该隐，被神诅咒永远找不到回家的路。"
 artifact_hand_nikolas_name: "尼古拉斯之手"
 artifact_hand_nikolas_description: "#bold 你将不再会血狂。#!\n尼古拉斯是一位圣洁、和平的诺斯费拉图，在被一位过度狂热的狂热者杀死之前，有着小型密教崇拜着他。他的手仍然没有腐烂成灰烬，它有一种不可思议的能力，甚至可以安抚最愤怒的心兽。"
 artifact_caul_jos_name: "乔斯的胎膜"
 artifact_caul_jos_description: "乔斯出生时就带着胎膜——这预示着他在生活中会很幸运。他的母亲小心翼翼地擦干皮肤，并将其缝入一个小袋子，让乔斯携带。事实上，乔斯有不寻常的好运气。尽管他无能又懒惰，但他有一份好工作，有很多情人，有很多朋友，并且免于艰难困苦。甚至也奇迹般地躲过了袭击他的吸血鬼的突然攻击。乔斯拿起武器，反击敌人，而不是逃跑，为自己的运气感到自豪。但一切都有限度……"
 artifact_labrys_name: "巴力双刃斧"
 artifact_labrys_description: "迷宫域的象征。巴尔的长角头颅的象征。胜利者对受害者的象征，狼对羊的象征。邪恶的象征。"
 artifact_guarded_rubrics_name: "封禁量规"
 artifact_guarded_rubrics_description: "巫妖伊努哈顿将这本书交给了塔尔玛埃拉的第一批成员。它包含了挪得之书的摘录和几千年来亡灵术实践的提炼。它还塑造了新生教派作为末日守护者的信仰。"
 artifact_jurgen_broadsword_name: "约根的阔剑"
 artifact_jurgen_broadsword_description: "一把闪亮的阔剑，镶嵌着珍贵的宝石，上面布满了装饰性的纹章。它被献给了约根，作为爱之庭的友谊信物。"
 artifact_true_cross_name: "真十字架的碎片"
 artifact_true_cross_description: "#bold 若你是猎人，允许你招募[GetMaA('minion_of_the_divine').GetName]。#!#weak （除非你崇魔）#!\n#bold 增强寻找巢穴[journey|E]（勇武选项）。#!\n一块三英尺长的黑木头，上面有着救世主本人的血迹。这个遗物保护了亚柯数个世纪，后来被戈捷·德·丹皮尔拿去作为亚柯骑士修士会的奠基石。"
 artifact_rowan_ring_name: "罗宛之戒"
 artifact_rowan_ring_description: "罗宛之戒是令人恐惧的暗杀工具，由哈基姆圣裔的长者成员或他们信任的稚子使用。戒指可以神秘地变尖并拉长成尖桩，作为武器使用。"
 artifact_tapestry_blood_name: "血之织锦"
 artifact_tapestry_blood_description: "一幅巨大的织锦，对那些注视它足够久的人来说具有预言的力量。这种景象几乎可以采取任何形式，从对古代文明的瞥见到对未来的瞥见。唯一可以确定的是，每个幻象的主题都会直接关系到使用者的命运。"
 artifact_michaelis_crown_name: "米歇尔之冠"
 artifact_michaelis_crown_description: "奥克西塔尼亚第一位真正的统治者的王冠。在他的继承人与法兰西人的斗争中，这是一个强有力的象征，可以凝聚他们的力量。"
 artifact_ignace_notes_name: "安条克的依纳爵的笔记"
 artifact_ignace_notes_description: "#bold 给予观占术特质。#!\n清洁派异端思想的创始人留下了这段文字。正确的解释是，它构成了一张普累若麻的地图，即灵界。仅仅拥有这张地图就足以激起该隐之子体内血液的潜在力量。"
 artifact_consolation_philosophy_name: "哲学的慰藉"
 artifact_consolation_philosophy_description: "#bold 含有[golconda|E]知识。#!\n作为波爱修斯的哲学书的典范，这本书由一位不知名的该隐之子作了注释，分享了他对吸血鬼状况和天主诅咒的看法。这本书在很多方面都很有启发性。"
 artifact_sword_arthur_name: "亚瑟之剑"
 artifact_sword_arthur_description: "传奇战将阿尔托利乌斯不顾密特拉密教的顽强抵抗，将基督教带到了群岛。他的剑至今仍是吸血鬼猎人所使用的强大宝物。"
 artifact_skull_saulot_name: "扫罗的头骨"
 artifact_skull_saulot_description: "被睿魔尔杀死的[antediluvian|E]的头骨标本。在事发后丢失，被卡帕多西亚找了回来研究。它在重新崛起的萨洛比首领手中时将是一个强大的象征。"
 artifact_scrolls_carthage_name: "迦太基卷轴"
 artifact_scrolls_carthage_description: "在这些著作中，真相被暴露无遗。乌托邦，和噩梦的真相。"
 artifact_great_book_name: "大书"
 artifact_great_book_description: "玛土撒拉萨尔米斯在旅行中了解到的一切都写在这里。这是一个有用的知识来源，尽管排版不怎样。"
 artifact_vassago_earring_name: "瓦沙克的耳环"
 artifact_vassago_earring_description: "#bold 给予高阶血术法特质。#!\n2000年前，一个印度的疯狂密教组织召唤了“咒怨先知”瓦沙克，他用这一小块珠宝作为他的灵魂的窥视口。它为它的宿主提供了腐化版的奇术。"
 artifact_marguerite_ring_name: "玛格丽特之戒"
 artifact_marguerite_ring_description: "#bold 给予支配术和观占术特质。#!\n一枚制作精良的墨洛温戒指，受救世主之声附魔。玛格丽特亲王把她的一部分灵魂放在其中，确保如果她发生什么事，她会通过她的子嗣活下来。"
 artifact_raquel_band_name: "拉贵尔的婚戒"
 artifact_raquel_band_description: "一个简单的木制婚戒。当一个吸血鬼要求圣拉贵尔放弃她的誓言并嫁给他时，她把布列塔尼的所有吸血鬼都烧成了灰烬，然后自己被当作女巫烧死。"
 artifact_pacifist_ji_name: "非攻戟"
 artifact_pacifist_ji_description: "曾经由一位虔诚的佛教徒携带的长矛，他在丝绸之路上保护朝圣者和商人。据说这武器将永远饶恕纯洁的心灵和灵魂。"
 artifact_lost_yoni_name: "失落女阴像"
 artifact_lost_yoni_description: "一座神奇的生育女神雕像，在亚历山大的征服期间被带回来。它让人们看到了故去的文化和宗教。"
 artifact_phrygian_codex_name: "弗里吉亚圣书"
 artifact_phrygian_codex_description: "一本由历代库都沿袭千年写成的书。实验笔记和经文一样多，前几章写于罗马时代之前，但最新的章节则在血肉塑造理论的前沿。"
 artifact_severed_head_name: "断头"
 artifact_severed_head_description: "只要喂一点血，这施洗约翰、埃赫那吞、耶稣或本丢·彼拉多（没人确定）的断头就会（隐晦地）说话。这里面可能有一些知识。"
 artifact_holy_grail_name: "圣杯"
 artifact_holy_grail_description: "#bold 解锁吸血鬼的独特[decision|E]。#!\n收集者组织在八世纪发现了这个杯子，它散发出一种前所未有的圣洁力量。虽然他们无法追踪它的确切历史，但收集者们确信它就是神话中的圣杯，这要归功于它在被用作血液容器时对吸血鬼诅咒显现的神奇特性。"
 artifact_orb_shadows_name: "控影之珠"
 artifact_orb_shadows_description: "#bold 给予幽暗术特质。#!\n由幽暗术的实践者使用的辅助专注物，帮助他们掌握这种非自然的[discipline|EL]。它对已熟练这门技艺的大师们几乎没有用处，但他们经常把它作为纪念品保存起来。"
 artifact_bone_osiris_name: "奥西里斯之骨"
 artifact_bone_osiris_description: "#bold 能够为猎杀赛特提供帮助。#!\n赛特的敌对兄弟奥西里斯的最后遗物之一。通过它仍然可以感受到死亡之神的力量，这可能是挫败赛特防御的关键。"
 artifact_bloodroot_name: "血根"
 artifact_bloodroot_description: "这是一种只在北非发现的稀有植物，是少数已知的甚至对该隐之子有毒的草药之一。主要用于近战武器，它能迅速将受害者的血液变成细小的，类似于火山灰的黑色灰尘。"
 artifact_gauthier_sword_name: "戈捷的大马士革剑"
 artifact_gauthier_sword_description: "戈捷杀死的第一位吸血鬼掉落了这把精巧的刀，这把武器他至今仍在使用。亚柯骑士们悄悄地说，在戈捷的不懈信仰的推动下，这把刀正逐渐成为一种遗物。"
 artifact_alashrad_eye_name: "阿什拉夫之眼"
 artifact_alashrad_eye_description: "#bold 给予高阶观占术特质。#!\n阿刹迈阿姆尔所使用的钻石左眼替代品。据传这东西能让他拥有超越视界的视力，但阿什拉夫本人并没有承认。"
 artifact_book_patriarch_name: "牧首之书"
 artifact_book_patriarch_description: "幻梦之牧首米迦勒的深刻见解，或疯狂的胡言乱语。这本书对他幸存的追随者来说是一部神圣的经文，尽管他们中没有人真正理解它。"
 artifact_librum_terrum_name: "大地之书"
 artifact_librum_terrum_description: "#bold 能够为猎杀棘秘魑提供帮助。#!\n这本“大地之书”指出了喀尔巴阡山脉的一座古老教堂，靠近一座现已被遗弃并成为废墟的要塞。一段神秘的文字提到了“躺在被他的故土包围的不洁祭坛下沉睡的巨兽”。"
 artifact_gaffari_scrolls_name: "加法里的卷轴"
 artifact_gaffari_scrolls_description: "#bold 解锁独特[decision|E]。#!\n阿刹迈氏族内部隐藏的阴谋在这些卷轴中暴露无遗。长者们被灭口以压制这一真相，在结束前还会有更多的人流血。"
 artifact_ashes_allhigh_name: "崇高之主的灰烬"
 artifact_ashes_allhigh_description: "据说是奥丁本人的骨灰，被梵卓松达菲利尔所杀。由于他是著名的骗子和吹牛者，所以很少有人相信这种说法。"
 artifact_karalavanisha_vrana_name: "喀拉拉瓦尼莎之伤"
 artifact_karalavanisha_vrana_description: "在这首诗中，雷伏诺的创世神话被写得非常广泛。它解释了他们作为对抗可恨的$pod_asuratizayya$的监守的神圣地位。"
 artifact_corpus_hermeticum_name: "赫耳墨斯全集"
 artifact_corpus_hermeticum_description: "这部作品是由神秘的赫耳墨斯·特里斯墨吉斯忒斯——赫耳墨斯秘会的先祖所写，由42本书组成，包含所有古代知识的总和。它最完整的版本被七人议会所拥有，藏在塞里奥斯的深处。"
 artifact_bernardo_ashes_name: "弗拉·贝纳多的灰烬"
 artifact_bernardo_ashes_description: "古比奥幼狼的和平主义创始人的骨灰，因其信念而被杀害。从这个骨灰盒中仍然可以感受到一种舒缓的气息。"
 artifact_hunger_satisfaction_name: "饥渴与满足"
 artifact_hunger_satisfaction_description: "这本书最初由原罪之道的创始人塔尼特巴尔·萨哈尔撰写，几个世纪以来一直作为罪人的（不洁）圣典。在他的导师失踪后，卡米拉对它进行了扩展，许多次级的罪人对它有自己的解释。"
 artifact_mithras_goblet_name: "密特拉陶杯"
 artifact_mithras_goblet_description: "一个装饰着神秘符号的古董高脚杯，多年来一直被用于无数的仪式中。密特拉本人在这个杯子里注入了他的精血，并把它传给他忠诚的追随者饮用。"
 artifact_mithras_cap_name: "密特拉的弗利吉亚帽"
 artifact_mithras_cap_description: "这件头饰是在罗马时代后期用精细的红色布料缝制的，是梵卓学者宾杜萨拉在亚历山大城第一次会面时赠送给密特拉的。密特拉只在他的神庙的特殊场合才戴上它，这也是它被保存下来并保持良好状态的原因。"
 artifact_mithras_ring_name: "红宝石戒指"
 artifact_mithras_ring_description: "这枚戒指是在梵卓定居不列颠尼亚之前，他们还是恋人时，赛特之子刻茉媞里送给密特拉的。在戒指的内表面有一个精美的埃及僧侣体铭文，大致翻译为“从女神到男神，永远的诅咒和祝福”。"
 artifact_mithras_dagger_name: "埃及匕首"
 artifact_mithras_dagger_description: "强大的复仇者荷鲁斯在13世纪的战斗后的礼物，自几个世纪以来，密特拉在密教仪式中使用这把匕首，例如杀死公牛的祭祀仪式。"
 artifact_mithras_seal_name: "密特拉印章"
 artifact_mithras_seal_description: "这枚印章是为密特拉制作的第一枚印章，用于盖印与阿瓦隆领地和伦敦宫廷有关的官方文件，是他权力的象征，必要时可以委托给忠诚的代理人。"
 artifact_ring_chrysostom_name: "金口圣若望之戒"
 artifact_ring_chrysostom_description: "#bold 即使没有[perk|E]，你也可以使用祝福。#!\n这枚戒指是银制的，上面刻着粗糙的十字架，据传是金口圣若望所戴的。"
 artifact_franciscan_aspergill_name: "方济会圣水勺"
 artifact_franciscan_aspergill_description: "含有圣方济各的骨头碎片，这圣水勺可以在整个房间里创造一种宁静的气氛。"
 artifact_martyr_fire_name: "殉道者之火"
 artifact_martyr_fire_description: "这盏灯是用殉道者骨头的灰烬铸造的。有信仰的人在这盏灯的半径范围内可以忽略所有的伤口，除了最严重的伤口。"
 artifact_eunuch_scapular_name: "宦官圣衣"
 artifact_eunuch_scapular_description: "#bold 即使没有[perk|E]，你也可以使用代祷。#!\n据称是一位虔诚的塞浦路斯圣徒生前的生殖器，他为了避免肉体的诱惑而阉割了自己，这件肩衣带有他的制造者的令人印象深刻的精神毅力。"
 artifact_dagger_thorns_name: "荆棘匕首"
 artifact_dagger_thorns_description: "#bold 给予[true_faith|E]特质。#!#weak （除非你崇魔）#!\n这把匕首是用基督受难时戴的荆棘冠冕上的一根荆棘锻造的，它散发着信仰的光芒，对超自然者尤其致命。"
 artifact_spear_destiny_name: "命运之矛"
 artifact_spear_destiny_description: "#bold 给予[true_faith|E]特质。#!#weak （除非你崇魔）#!\n朗基努斯之矛，他在耶稣被钉在十字架上时刺穿了他的身体。这是一个强大的信仰象征，众所周知，挥舞它的人都会产生幻象。"
 artifact_code_samiel_name: "萨麦尔圣书"
 artifact_code_samiel_description: "殉道者的创始人萨麦尔是扫罗的武者一系中最伟大的，据说他亲手写下了这篇文书。根据传说，在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了圣书，以及圣书中新武者获取力量和血化所必需的适当仪式。"
 artifact_valencia_chalice_name: "瓦伦西亚之杯"
 artifact_valencia_chalice_description: "教会学者对该杯的出处以及它的用途有不同的看法。有些人声称，它是最后的晚餐时用来招待使徒的杯子。还有人说，它是用来收集耶稣受难时的血。然而，双方都会同意，该杯确实盛有基督的血，这使得它无论是作为宗教遗物还是作为历史文物都几乎是无价的。"
 artifact_erciyes_fragments_name: "埃尔吉耶斯残篇"
 artifact_erciyes_fragments_description: "众所周知的挪得之书的次经合集，详细介绍了该隐之子的创世神话，由一些最负盛名的该隐之子学者作了注释。"
 artifact_erciyes_broken_fragments_name: "破碎的埃尔吉耶斯残篇"
 artifact_erciyes_broken_fragments_description: "详细介绍了该隐之子的创世神话的，挪得之书的次经合集——埃尔吉耶斯残篇的缺损副本。"
 artifact_correspondence_rodrigo_name: "罗德里戈的信件"
 artifact_correspondence_rodrigo_description: "作为“心兽之路”最重要的学者之一，罗德里戈一直在将他所有的发现和关于它的争论汇编成一份伟大的手稿，这让“心兽之路”更保守的成员感到恼火。"
 artifact_grey_book_name: "灰之书"
 artifact_grey_book_description: "从宫廷阴谋的入门到如何跟踪和杀死猎物的明确指示。由查瑞希·德·格雷亲自撰写，灰猎手之道的著名典范。"
 artifact_gabriel_trumpet_name: "加百列的小号"
 artifact_gabriel_trumpet_description: "末世将由一个巨大的、雷鸣般的号角吹响，即大天使加百列的号角。加百列在出现在穆罕默德面前后，故意将其留下，如果故事可信的话，将由凡人自己发出信号，召唤末日。"
 artifact_the_stone_name: "石头"
 artifact_the_stone_description: "似乎是该隐用来谋杀亚伯的石头。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的石头。"
 artifact_warding_iron_name: "守护铁环"
 artifact_warding_iron_description: "这是一件由铁制成的粗糙环状物，是信徒们用来防止包括吸血鬼在内的邪恶实体接近的小护身符。"
 artifact_gospel_laodice_name: "拉俄狄刻福音"
 artifact_gospel_laodice_description: "这是一本漫无边际的神学集，收集了关于该隐之子与及和天主的关系的幻觉、洞察和预言；并延伸为天国之道历史的重要记录。"
 artifact_the_bone_name: "骨头"
 artifact_the_bone_description: "似乎是该隐用来谋杀亚伯的颌骨。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的颌骨。"
 artifact_horns_hunter_name: "猎人号角"
 artifact_horns_hunter_description: "由伊娜依娅杀死的野兽的角制成，这件宝物的力量是神秘的。它们似乎能增强任何有能的战将的自然领导能力。"
 artifact_flesh_hunted_name: "受猎者的血肉"
 artifact_flesh_hunted_description: "吃下这神奇的肉的一部分，可以让任何该隐之子变身为被制成这肉的动物。"
 artifact_book_sun_name: "太阳之书"
 artifact_book_sun_description: "人性之道信仰的核心文本被认为是古代该隐之子寻找[golconda|E]的半准确记载。太阳之书充满了寓言和奇怪的比喻，是谜语和神话的结合体。"
 artifact_dialogues_troile_arikel_name: "特洛伊尔与亚力科的对言"
 artifact_dialogues_troile_arikel_description: "这显然是在柏拉图时代写的，是对两个$pod_antediluvians$之间的所谓对话的叙述。尽管该文本的真实性存在争议，但其对世界和血畜的见解是普罗米修斯之道所采用的信条的详细版本。"
 artifact_blade_of_enoch_name: "以诺之刃"
 artifact_blade_of_enoch_description: "#bold 你不再会血狂。#!\n这把看起来很粗糙的青铜刀是布鲁赫送给以诺的礼物。它被认为保留了其创造者的一些记忆片段，特别是他冷酷的逻辑和对情感的完全控制。"
 artifact_well_ashes_name: "尘之井"
 artifact_well_ashes_description: "一个非常深的大锅，显然是由扫罗或一位强大的巴力（也可能是共同）创造的，据传它能够使一个吸血鬼恢复到完全的凡俗状态。根据不同的传说，其代价可能高达咬一百个凡人在其中被焚烧。"
 artifact_martyr_icon_name: "殉道者图示"
 artifact_martyr_icon_description: "一幅关于亚伯的小画，被其制作者的血赋予了力量。一小部分早已失去的人性残余。"
 artifact_veddartha_chalice_name: "梵达多之杯"
 artifact_veddartha_chalice_description: "据称，梵卓氏族的创始人用这个杯子喝了他尊长的血，而不是在初拥时直接从他的血管中享用。梵卓氏族把这个东西作为他们创始人的决心和勇气的象征，即使被吸干了血，他还能坚持用杯子喝血。"
 artifact_tyrant_lash_name: "暴君之鞭"
 artifact_tyrant_lash_description: "暴君之鞭是一条简单的马鞭，顶端有一个小倒钩，是在睿魔尔崛起后不久，由一位棘秘魑库都创造的。这条鞭子会放大其击打的痛苦，每当它击中目标时都会产生一种虚弱和无助的感觉。"
 artifact_wax_seal_name: "蜡封"
 artifact_wax_seal_description: "只要有几滴血，王者之路的吸血鬼就能对普通的蜡封附魔，使其对窥探的手和眼睛有特别的抵抗力。"
 artifact_empowerment_justicars_name: "巡行裁决官的新生"
 artifact_empowerment_justicars_description: "一份神秘的文件，由欧洲一些最有权势的亲王签署，其中提到了统治者由他们的同僚来审判的权利。它设立了“巡行裁决官”的职能，作为法官和刽子手，是凌驾于诸亲王之上的唯一权威。"
 artifact_letters_acindynus_name: "阿辛底努斯的信件"
 artifact_letters_acindynus_description: "阿辛底努斯从罗马时代起就一直在编纂有关该隐之子亲王和国王权利的资料。随着征服之道的巩固，这些信件更加注重心路的历史和理念，作为王者之路的引子，一直到今天。"
 artifact_lyrics_aconia_name: "阿科尼亚·梅莎莉娜的诗歌"
 artifact_lyrics_aconia_description: "坦率地说，这些歌词具有色情特征，它们的想象力非常丰富，既挑逗又放肆，既怀念又充满憧憬，而且明目张胆地性感。纵欲之道的追随者认为对诗歌的精确形象进行再创造是一种神圣的艺术。"
 artifact_satires_name: "讽刺集"
 artifact_satires_description: "各种形式的社会和宗教评论作品合集，包括了恶毒的讽刺诗到游吟诗人歌曲。"
 artifact_pilgrim_badge_name: "朝圣者的徽章"
 artifact_pilgrim_badge_description: "为了反映和嘲笑凡人朝圣的趋势，罪人已经开始收集他们最终旅途的漂亮饰品，从布匿石碑的微小复制品到拜占庭风格的珠宝。"
 artifact_sigil_misrule_name: "狂宴之王的印记"
 artifact_sigil_misrule_description: "狂宴之王的传统农神节标志是由每个庆祝黑暗至点的罪人小团体在每个新年里制作的。"
 artifact_water_venus_name: "维纳斯之水"
 artifact_water_venus_description: "一种强烈的混合物，能使凡人的感官提高到极端程度，使他们的血更甜美。"
 artifact_enchanted_scimitar_name: "附魔弯刀"
 artifact_enchanted_scimitar_description: "大术士阿什拉夫并不经常使用这件武器。但是，当一名敌人证明了自己对血魔法的抵抗力特别强时，他已经为此做好准备。"
 artifact_code_chivalry_name: "骑士守则"
 artifact_code_chivalry_description: "骑士守则是对更古老和相当神秘的东西的转录，是任何有抱负的该隐之子骑士的准则，经常被批判，但仍然受到尊重。"
 artifact_chronicles_heartblood_name: "地血编年史"
 artifact_chronicles_heartblood_description: "这是一部由哈基姆本人撰写的哈基姆圣裔自创建以来的完整历史。遗憾的是，前几章是以传说的形式写成的，使其有很多争论和注解。"
 artifact_laws_haqim_name: "哈基姆律法"
 artifact_laws_haqim_description: "它们是鹰巢图书馆的核心，用以诺语镌刻在一系列泥板上，保存得近乎完美。由于以诺语是一种失传的语言，因此有相当多不同的翻译。"
 artifact_book_going_night_name: "离世夜之书"
 artifact_book_going_night_description: "#bold 允许你通过决议解锁咒术血术法。#!\n一本由赛特传下来的书卷，包含了所有必要的仪式，使赛特之子能够过渡到来世。"
 artifact_apostate_auguries_name: "叛教者鸟占集"
 artifact_apostate_auguries_description: "这是特黎佛撒的预言集，鸟占集详细描述了一个巨大的阴影从深渊中升起，以及一个被囚禁在那里的巨兽的逃脱。然后这只巨兽将攻击一些东西，研究者认为这在说儿子或太阳。这其中的一些内容指向了火焚末日和勒森魃[antediluvian|E]的崛起。"
 artifact_louhi_staff_name: "娄希之杖"
 artifact_louhi_staff_description: "#bold 施展血法术时，法术成功率提高10%，仪式速度加快。#!\n一根刻有各种符文的黑杖，由强大的女巫娄希所使用，据说她的力量甚至可以与最有成就的血术士相媲美。"
 artifact_shroud_kaymakli_name: "凯马克勒护碟"
 artifact_shroud_kaymakli_description: "被血浸透的圆盘上刻有用以诺语书写的铭文。很难读懂，翻译出来也没什么意义，但它仍然是一件令人印象深刻的遗物，似乎有更深层次的故事要讲。"
 artifact_spear_bathel_name: "伯特利之矛"
 artifact_spear_bathel_description: "一把长矛，据说可以保护持矛者免受伤害，同时杀死任何被它划伤的敌人。虽然可能是虚构的故事，但它在叛逆的梵卓西格弗里德身边赢得了相当大的声誉。"
 artifact_biblia_negra_name: "黑圣经"
 artifact_biblia_negra_description: "#bold;N 初次装备后给予[GetModifier('biblia_negra_curse_modifier').GetNameWithTooltip]，直到宝物被摧毁。#!\n圣经中提到了67个被困在大地中的远古实体，他们梦想着有朝一日能够获得自由并接管世界。在这67个实体中，有13个被命名为$pod_antediluvians$。这本书的每一页都散发着恐吓，使它越来越难阅读。"
 artifact_wooden_coffin_name: "木棺材"
 artifact_wooden_coffin_description: "一个用松木制成的长盒子，用来安放尸体。总比被扔进万人坑要好，但也仅限于此。"
 artifact_lupine_hide_name: "狼人毛皮"
 artifact_lupine_hide_description: "变化者——狼人——的毛皮标本。也可能只是一只非常大的狼的毛皮。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 artifact_lupine_skull_name: "狼人颅骨"
 artifact_lupine_skull_description: "变化者——狼人——的头骨标本。也可能只是一只非常大的狼的头骨。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 artifact_skull_vampire_name: "吸血鬼颅骨"
 artifact_skull_vampire_description: "吸血鬼的头骨标本。如果没有特别准备，当非常古老的吸血鬼被摧毁时，他们通常会碎成灰烬。\n\n禁汝灭同类。灭之权惟汝之长。惟尔中最长者乃可召血猎。"
 artifact_banner_carthage_name: "迦太基之旗"
 artifact_banner_carthage_description: "这面破烂的旗帜据说是第三次布匿战争期间被罗马的梵卓俘虏的迦太基布鲁赫的旗帜。\n\n布鲁赫仍然从迦太基繁荣的伟大学者和哲学家的传说中汲取灵感，在这文化中，血族和血畜的关系比以前或以后的任何时候都要密切。然而，对其他人来说，这是一个恐怖和疯狂的城市，在那里，儿童被献给崇魔的巴力，而布鲁赫却视而不见。\n迦太基在有史以来最广泛的吸血鬼联盟手中沦陷，直到今天晚上仍然被认为是该隐之子历史上的一个关键事件。"
 artifact_blood_horn_name: "血角"
 artifact_blood_horn_description: "#bold 允许通过[decision|E]随意补充血液。#!\n著名的奥丁血角，一个可以从任何液体中创造血液的神器。当崇高之主消失后，血角也随之消失，直到你最近战胜了入侵者。显然，这是诸神青睐的标志。"
 artifact_sword_of_troile_name: "特洛伊尔之剑"
 artifact_sword_of_troile_description: "这把水晶剑是该隐之子历史上最强大的武器之一，特洛伊尔本人曾在无数次保卫迦太基的战役中使用过这把水晶剑。"
 artifact_sword_of_dracula_name: "德古拉之剑"
 artifact_sword_of_dracula_description: "德古拉之剑是一把质量极好的阔剑，闪亮的剑身搭配着华丽的剑柄。沿着剑长刻有许多东方和库都符号，护手和剑柄上嵌有五彩的宝石。这把剑是由德古拉的父亲龙公伏拉德通过雷伏诺突伽·辛和她对恶魔库帕拉的了解的帮助下铸造的。龙公伏拉德专门制作了这把剑，以杀死库帕拉和这个大恶魔的邪恶仆人。"
 artifact_tapestry_jawbone_name: "骨之织锦"
 artifact_tapestry_jawbone_description: "该挂毯由一位匿名的妥芮朵制作，然后在1190年被复制到了法兰西某地的一份圣咏经手稿中。"
 artifact_tapestry_noir_name: "挪得织锦"
 artifact_tapestry_noir_description: "这幅挂毯据说是末卡维预言家雅各在昏迷状态下创作的，描绘了《挪得之书》中的《该隐传》。在第一格中，该隐杀死了亚伯。在第二格中，该隐受到了上帝的诅咒。在第三格中，该隐遇到了莉莉丝。在最后一格，该隐抛弃了莉莉丝。雅各的仇敌以扫，花了很多钱和很多人情，雇佣了各种各样的“无名氏”来破坏挂毯。到目前为止，每样尝试都失败了，往往最后都是以破坏偶像主义者式的死亡告终。它已经成为爱之庭的高度渴望之物，他们把它称为“黑之挂毯”，因为有许多盗贼和破坏者在寻找它时死亡。"
 artifact_sculpture_of_ishtar_name: "伊丝塔的雕塑"
 artifact_sculpture_of_ishtar_description: "一座宏伟的雕塑，据说是亚力科的自画像。对以诺城的玫瑰的才华、骄傲和时常的傲慢的完美一瞥。"
 artifact_iulus_sword_name: "尤路斯之剑"
 artifact_iulus_sword_description: "一把由永生的铸剑师尤路斯·卢夫斯·纳索锻造的罗马短剑。一把闪烁着罗马荣耀的完美工艺品，正如尤路斯本人所想的那样。"
 artifact_iulus_armor_name: "尤路斯之甲"
 artifact_iulus_armor_description: "一件由永生的铸剑师尤路斯·卢夫斯·纳索锻造的古典罗马盔甲。一把闪烁着罗马荣耀的完美工艺品，正如尤路斯本人所想的那样。"
 artifact_esoara_ax_name: "埃索拉之斧"
 artifact_esoara_ax_description: "睿魔尔的战帅埃索拉携带的巨斧。这把大得不能再大的武器对普通人来说太重了，甚至连大多数吸血鬼都觉得它不方便使用。"
 artifact_house_tremere_name: "《睿魔尔家族》"
 artifact_house_tremere_description: "在他死于睿魔尔的可怕初期夜晚之后，本蒂库斯成了一位死灵，以比图吉斯为手，写下了他曾经高贵的家族，现在被腐化成黑暗的全部可怕的故事。"
 artifact_tremere_chronicles_name: "《睿魔尔编年史》"
 artifact_tremere_chronicles_description: "这是一部关于睿魔尔家族早期日子的宏伟而极度偏面的历史。传统上，塞里奥斯的堡主在任何议会会议之前都会宣读这本书。"
 artifact_robe_nessus_name: "涅索斯的长袍"
 artifact_robe_nessus_description: "似乎是在著名的神话中杀死赫拉克勒斯的毒袍。在每个人看来都是恐惧和不幸的象征，除了末卡维，他们似乎觉得弥漫在这件艺术品中的不祥之感很舒畅。"
 artifact_fingerbone_hannah_name: "圣汉娜的指骨"
 artifact_fingerbone_hannah_description: "#bold 即使没有[perk|E]，你也可以使用祝福。#!\n渗透着[true_faith|E]的小遗物。它被声称于1197年在耶路撒冷地下找到末卡维灵魂的稚子小团体发现，然后又丢失了。"
 artifact_plait_lucrezia_name: "圣卢克蕾齐娅的辫子"
 artifact_plait_lucrezia_description: "卢克蕾齐娅是一位高贵的原始教徒女士，她在皈依后剪掉了头发以示对天主的顺从，她被她小心眼的父亲送进了一个居有怪物的坑里。\n第二天早上，卢克蕾齐娅把她的头发编成了绳子，制服了那只怪物。她的头发似乎和以前一样结实而有光泽，可以用来捆绑任何邪恶的生物。"
 artifact_rayzeel_song_name: "雷齐尔之歌"
 artifact_rayzeel_song_description: "“无汝无光”，是雷齐尔最著名的歌曲的片段。它是如此美丽，以至于据说当扫罗那话不多的子嗣开始唱歌时，鸟儿都停下来听。扫罗自己也是在听到雷齐尔治愈灵魂的声音后，才从失去萨麦尔的悲痛中唤醒自己。"
 artifact_portrait_saulot_name: "扫罗的肖像"
 artifact_portrait_saulot_description: "萨洛比[antediluvian|E]的唯一已知现存画像。在这幅质量不高的画中，一位身材矮小、黑发蓝眼的男人被表现出来。大多数萨洛比玛土撒拉在看到这幅画后，都认为它“粗看时”看起来像扫罗。"
 artifact_vitus_heel_name: "圣维特的脚跟"
 artifact_vitus_heel_description: "神经紊乱的主保圣人的遗物。虽然不能完全治愈末卡维的诅咒，但对他们还是有舒缓的作用。"
 artifact_dweomered_scimitar_name: "附咒的大马士革阿拉伯弯刀"
 artifact_dweomered_scimitar_description: "一把强大的大马士革弯刀，被赋予了巨灵的魔力，这刀在没有尝到血前是无法回到鞘中的。"
 artifact_weyland_wyrcan_name: "维兰德之作"
 artifact_weyland_wyrcan_description: "#bold 你必须得有35以上的勇武才能装备此武器。#!\n没有人知道维兰德是谁或者是什么，但他的刀剑却非常有名。几乎如同活物，它们会拒绝被弱小的人持有，甚至试图杀死不配的持有者。然而，如果被一位配得上的剑客持有，它们就将在战斗中高鸣，并在敌人群体中传播恐惧。"
 artifact_black_stake_name: "黑尖桩"
 artifact_black_stake_description: "这块铁木应该是特洛伊尔用来使在吸榨她的尊长布鲁赫前瘫痪他用的。它在布鲁赫为解放自己而进行的反抗过程中遭受了很多，但仍然保留着一种可触及的神话般的强烈灵光。"
 artifact_roll_damned_name: "受诅者之卷"
 artifact_roll_damned_description: "受《末日审判书》的启发，这个项目包含了所有该隐之子的封建义务、纽带和英格兰吸血鬼的小团体的清单。虽然不是面面俱到，但这已经是一个非常令人印象深刻的勒索工具……而且明显违反了潜藏戒律的规定。"
 artifact_toomler_femur_name: "托姆勒的股骨"
 artifact_toomler_femur_description: "托姆勒是一位棘秘魑玛土撒拉，因其能够分开身体的各个部分然后重新接上而闻名。不知何故，他的股骨在他死后仍然完好无损，并成为一种令人惊讶的有效但钝滞的武器。"
 artifact_cycle_lilith_name: "《莉莉丝始末记》"
 artifact_cycle_lilith_description: "《莉莉丝始末记》是一部据称是以莉莉丝的视角讲述的吸血鬼经文。它主要是巴哈里歌曲的集合（大部分是口头传下的），被编成一个循环曲。它更多的只有象征意义，而非真正讲述莉莉丝的故事本身。"
 artifact_veil_night_name: "暗夜之幔幕"
 artifact_veil_night_description: "这是一部关于穆斯林世界及其该隐之子的综合历史，以哈基姆圣裔维齐尔——阿布·法希姆·卡泰布以旅行日记的方式撰写。"
 artifact_tawiz_name: "塔维兹"
 artifact_tawiz_description: "戴在脖子上的小银质护身符，刻着《古兰经》语录。它被用来驱除邪灵或作为幸运符。"
 artifact_albuduh_name: "布杜"
 artifact_albuduh_description: "一个神秘的方块，刻画了一些数字，这些数字加起来是个幸运数值，其意义赋予了广泛的保护力量。"
 artifact_khoumsa_name: "五指之手"
 artifact_khoumsa_description: "画有法蒂玛之手的旗帜，五指的手代表穆罕默德、他的女儿法蒂玛、她的丈夫阿里和他的儿子们。它在很多情况下被使用，从吉祥物到战争旗帜。"
 artifact_inscrutable_eye_name: "高深之眼"
 artifact_inscrutable_eye_description: "一枚上面有埃及圣甲虫图案的戒指，在甲虫的甲壳中间有一颗眼睛形状的宝石。这枚戒指的做工非常古老，即使是吸血鬼的肉体也会感到它的寒冷。\n当用它专注于一个特定的吸血鬼时，有可能会确定他的位置和活动。"
 artifact_waxen_poetica_name: "蜡诗"
 artifact_waxen_poetica_description: "一块小蜡片，可以在让一滴血落入其中后扔向对手。如果它击中，蜡就会附着在受害者身上并开始扩散。它的温度极高，即使对该隐之子来说也是如此，它可以迅速地变得致命。"
 artifact_writings_cabirus_name: "卡比洛斯的秘密手稿"
 artifact_writings_cabirus_description: "完整的，但翻译得很糟糕的卡比洛斯的书，这位年轻的木乃伊描述了奥西里斯的生命神咒的内部运作。荷鲁斯的木乃伊们正在努力试图找到并摧毁它，担心如果被他们以外的人完全理解，它可能会被用于邪恶。"
 artifact_shattered_spear_name: "欧西雅的破碎长矛"
 artifact_shattered_spear_description: "#bold 能够通过吸血鬼限定决议修复。#!\n最勇敢的梵卓，阿尔忒弥斯·欧西雅的长矛的损坏残骸。这把武器具有传奇性的力量，但在迦太基的最后时刻，当阿尔忒弥斯倒下时，它就被折断了。然而，它仍然是一个强大的遗物，并且会拒绝由比斯巴达女神本人更不勇敢的人持有。"
 artifact_soulforged_artifact_name: "[killed.GetFirstNameNoTooltip]"
 artifact_soulforged_artifact_description: "用[killed.GetTitledFirstNameNoTooltip]的灵魂灵铸成的宝物，下手者为[owner.GetTitledFirstNameNoTooltip]。该宝物不断低语加呻吟，但大家都希望这只是意味着它能发声，而不意味别的。"
 artifact_fans_of_ma_yi_yuan_name: "袁马义的双扇"
 artifact_fans_of_ma_yi_yuan_description: "#bold 允许在灵游时进入[UmbraGlossary('dreaming')]。\n免疫妖精的魔咒。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是[GetTrait('fae').GetName( GetPlayer )]或[GetTrait('changeling').GetName( GetPlayer )]）。#!\n此双扇是伪装过的致命武器。薄薄的金属折叠扇如剃刀般锋利，如最好的剑刃一样坚固。在扇子精致的装饰下，隐藏着大量的神秘力量，以及对土居的血液的渴望。扇子的使用者可以抵御妖精施放的任何法术，并且能够进入其等的界域。"
 artifact_antler_crown_name: "鹿角冠"
 artifact_antler_crown_description: "自部族早期的夜晚以来一直是芬尼安之王的象征。这强大的王冠只赋予配得上的人，所有牡鹿的后裔都有义务遵循它。"
 artifact_yuri_klaive_name: "尤里的月刃"
 artifact_yuri_klaive_description: "一把精心锻造的，看上去有点平庸的月刃。不过，对于那些能看透的人来说，可以感受到与这把武器相关的伟大命运。"
 artifact_head_hardrule_name: "哈德鲁尔的头"
 artifact_head_hardrule_description: "塔吉·哈德鲁尔是芬里尔仔兽有史以来最伟大的战士之一。但也是最暴虐的统治者之一，最终，当整个部族都反对他时，他付出了生命。他的头是一个提醒，让我们永远赞美伟大的战士，但也要警惕傲慢的代价。"
 artifact_bronze_labrys_name: "路西帕斯的青铜双头斧"
 artifact_bronze_labrys_description: "一把完美保存的黄金时代的青铜双头斧，也许曾经属于路西帕斯本人。这把巨大的双手斧是黑怒间迄今为止最可怕的武器，也是最受尊敬的遗物。"
 artifact_artifact_pieces_name: "宝物碎片"
 artifact_artifact_pieces_description: "一块来自死涡的遗器或宝物碎片。也许某[GetTrait('wraith').GetName( GetNullCharacter )]可以把它重塑回单件宝物。"
 artifact_gaia_big_thumb_name: "盖亚的大拇指"
 artifact_gaia_big_thumb_description: "这个超大的、木乃伊化的人类拇指有一个奇怪的特性，可以确保适当的交通工具总是在附近……但不保证这些交通工具去往何方。对于任何自重的眉月狼来说都是个迷，一件受人喜爱的啮骨者宝物，也是许多恶作剧的开始。"
 artifact_chalice_renewal_name: "复兴之杯"
 artifact_chalice_renewal_description: "一个神秘的金杯，能够自动填满海水。任何喝下它的人都会经历来自盖亚本人的记忆，然后被治愈任何疾病或伤口。这个珍贵的宝物曾出现在盖亚之子历史上的数个关键时刻。"
 artifact_watcher_shield_name: "看守者之盾"
 artifact_watcher_shield_description: "一个盾牌形式的小木牌，可戴在脖子上。这个灵具可以保护佩戴者免受任何形式的暗器攻击，确保芬里尔仔兽总是按自己的意愿战斗。"
 artifact_crescent_moon_waterskin_name: "新月水袋"
 artifact_crescent_moon_waterskin_description: "一件非常通用的神器，被人类监护者所珍视。它可以用来伪装自己，长出强大的爪子，甚至可以在喝下之后立即狂乱。"
 artifact_threefold_axe_name: "三重斧"
 artifact_threefold_axe_description: "三重斧是芬尼安铁匠技艺的巅峰之作，它是一件精心打造的武器，可以最佳地对付任何敌人。在战斗中，它里面的器灵们会根据实际需要改变金属的成分，确保妖精面对金斧，狼人面对银斧等等。这武器极度罕见，因为让这么多的灵同居于其中确实是一个史诗般的壮举。"
 artifact_bramble_branch_name: "荆棘枝"
 artifact_bramble_branch_description: "一个强大的灵被缚在这枯枝上。一旦被激活，各种有毒的植物就会从地下冒出来，把这个地区封锁起来，不让任何干扰者进入。"
 artifact_assassin_klaive_name: "刺客的月刃"
 artifact_assassin_klaive_description: "像真正的影爵一样圆滑而致命，这种注入了蛇之灵的月刃很容易隐藏，即使在最公开的地方也能掩盖其主人的存在。"
 artifact_firebird_feather_name: "火鸟之羽"
 artifact_firebird_feather_description: "火鸟之羽的确切属性并不为人所知。它只是看起来像一根美丽的发光羽毛，但当它被带进银牙之王的房间时，房间就像被无数根蜡烛照亮。它看起来也出奇地坚固，同时像最光洁的月刃一样锋利。"
 artifact_owl_talon_name: "枭爪"
 artifact_yellow_veil_name: "卡尔帕特里的黄面纱"
 artifact_yellow_veil_description: "无尽黑暗女士在审判不堪的星占时戴着这块面纱。这件宝物迫使持有者始终为正义而努力，任何接近它的人都要说出真相，坦白他们可能拥有的任何可耻的秘密。"
 artifact_owl_talon_description: "这把弯曲的刀，类似于猫头鹰的爪子，是寂静漫游者持有的最强大的月刃。它内部有两个器灵，据说它特别渴望埃及吸血鬼的血液，期待着部族最终获得复仇的那一天。"
 artifact_djangalbi_name: "江加尔比"
 artifact_djangalbi_description: "赞助设定的非原作宝物\n江加尔比是一本巨大的书典，记录了该隐之子部队在永恒之战中的支出。其内容繁琐而密集，通过阅读它，可以提高人们对财政和王国管理的大局观理解。"
 artifact_sets_emasculation_name: "赛特之阉"
 artifact_sets_emasculation_description: "#bold 允许永久阉割。#!\n这把由陨铁和青铜打造的短刀看起来很不起眼，但刀身上的红色色调显示了它令人难以置信的传承。这把刀正是远古时期荷鲁斯用来阉割赛特的刀，无论谁来挥舞它，这把刀都散发着第一个持刀人的彭发能量和第一个受害者的残余生命力力量。信念和正义感本身都为这把传奇武器提供了动力。"
 artifact_pomegranate_name: "石榴"
 artifact_pomegranate_description: "#bold 允许将[GetTrait('wraith').GetName( GetNullCharacter )]转为[GetTrait('risen').GetName( GetPlayer )]。#!\n由珀尔塞福涅的母亲——法师德墨忒尔创造的一个强大遗器，可用来在生者之地和死者之地之间制造通道。"
 artifact_vassagos_reliquary_name: "瓦沙克的宿匣"
 artifact_vassagos_reliquary_description: "一颗价值无与伦比的巨大钻石。瓦沙克在这闪闪发光的监狱中计划他邪教的扩张。"
 artifact_klaive_name: "月刃"
 artifact_klaive_description: "狼人最著名的武器，这把刀是镶银的邪恶武器，是狼人使用的神圣武器，比任何刀剑都要强大，里面缚着灵。所有使用它的非狼人都会因亵渎神明而被无休止地追杀。"
 artifact_eternal_waterskin_name: "无尽水袋"
 artifact_eternal_waterskin_description: "这牛皮袋在装满水后，无论喝多少都不会耗尽，是一件不强但有用的东西。遗憾的是，对许多部族来说，这物品只适用于淡水，不管是雨水还是开水，而对蜂蜜酒或葡萄酒等则不起作用。"
 artifact_beff_of_ice_name: "冰之不合"
 artifact_beff_of_ice_description: "一根由银覆蓝冰制成的小针，这件独特的有价值的灵具可以让人烧去疾病，因为使用者能够真正地抖出感染，因为里面的冰之灵会清除使用者生理系统中的疾病，甚至更强——毒。"
 artifact_spirit_astrolabe_name: "灵之星盘"
 artifact_spirit_astrolabe_description: "这件制作精良的星盘，缚有波浪之灵，对任何使用这个遗物的长者都有不可思议的指导作用，使人能够完全轻松地穿透距离的纱幔。"
 artifact_truth_earring_name: "真相耳环"
 artifact_truth_earring_description: "作为所有不忠配偶的灾祸，这缚有荣誉之灵的灵具，使佩戴者能够更准确地刺破谎言的面纱，更好地从谎言的海洋中摘取真相的果实。"
 artifact_blanket_of_peaceful_past_name: "安宁过往之毯"
 artifact_blanket_of_peaceful_past_description: "和平之灵具，佩戴后，内缚的母性之灵拥抱使用者，让其，哪怕是短暂的一瞬间，回到小时候或幼崽的状态，那时的世界是有意义的，其他什么都不重要，从黑暗世界的恐怖中幸运地逃脱，再次被慈爱的母亲拥抱或在她身边沉眠。"
 artifact_dark_mask_name: "黑暗面具"
 artifact_dark_mask_description: "这个奇怪的灵具的起源不为人知，但它的力量是明确的。弯曲阴影以辅助佩戴者，扭曲光线并掩盖佩戴者，在所有看到其的人中激发出一种深刻的恐惧。"
 artifact_eyes_of_the_night_name: "夜之眼"
 artifact_eyes_of_the_night_description: "一个非常奇异的灵具，这个铁盆，当被丢到空中旋转时，允许当地的白天和黑夜的光照程度颠倒过来，这是一件不可估量的有用地逃跑工具，对任何攻击者造成光亮或黑暗的冲击，在他们的眼睛适应时，受袭者将安然无恙地逃脱，或者说，对另一位可怜的受害者进行报复……"
 artifact_kinship_doll_name: "亲缘玩偶"
 artifact_kinship_doll_description: "这灵具以小孩子的玩具娃娃为形态，作用是作为兽嫡与化兽族裔的传话器，让他们远距离沟通并保持联系，这样他们就不会远离他们的伴侣。"
 artifact_law_skull_name: "律法颅骨"
 artifact_law_skull_description: "作为最可怕的灵具之一，这叛徒狼族的头骨一旦被激活，就能背诵律令，并要求在场的人发下誓言。甚至只是有可能使用这灵具就足以让人害怕……"
 artifact_moongleam_name: "月荧"
 artifact_moongleam_description: "这小卵石可以在夜间的任何时候被激活，当这样做的时候，就会像蜡烛一样发光，而没有引起火灾的风险，在夜间给予可变的光，而不会让自己陷入火焰的燃烧中。"
 artifact_air_foot_greaves_name: "空气护膝"
 artifact_air_foot_greaves_description: "一对简单的、印有翅膀的护胫，这件缚有风之灵的灵具，当佩戴者把它按在一起时，可以让他们以惊人的速度移动，能够把他们带到几乎任何佩戴者想要去的区域。"
 artifact_sun_axe_name: "日之斧"
 artifact_sun_axe_description: "这是一把镶有金珠的斧头，这把凶残的武器，虽然有可能让赫利俄斯的孩子难以负担，但在激活后，可以在阳光下燃烧，一件化兽族裔持剑者用来对抗可怕蚂蟥的珍贵武器，以结束他们对黑夜的暴政。"
 artifact_whistle_caff_name: "微风之哨"
 artifact_whistle_caff_description: "一个刻有圣书字的用木头和骨头做的哨子，缚有新生哺乳动物之灵，吹响后会发出无声的求救声，提醒使用者的家人和朋友，以便他们赶来帮助他们。"
 artifact_book_of_the_spirits_secrets_name: "灵秘之书"
 artifact_book_of_the_spirits_secrets_description: "这本缚有智慧之灵的牛皮纸小册子，在通读之后，将揭示许多关于[umbra|E]和灵类世界的秘密。作为任何眉月狼的典范书，这本有价值的书对任何传奇唤灵师来说都是必不可少的。"
 artifact_feathered_cloak_name: "羽毛斗篷"
 artifact_feathered_cloak_description: "最受追捧的灵具之一，原因很简单。这缚有风之灵的珍贵灵具的持有者，将获得与蝙蝠一样的飞行能力，实现佩戴者翱翔天空的梦想。"
 artifact_tangling_lance_name: "纠缠之枪"
 artifact_tangling_lance_description: "这把饱经风霜的荆棘长矛酷似一条巨大的蜥蜴尾巴，虽然看起来只是一支劣质的短矛，但一旦激活，长矛就会分裂，变成像一条巨蜥的尾巴，猛击并抓住恐惧的敌人。"
 artifact_time_piece_name: "时间碎片"
 artifact_time_piece_description: "这个奇特的灵具以计时仪器的方式出现，通常是一个钟表或日冕。当激活的时候，它将微妙地扭曲时间流,束缚所有在激活时不接近钟表之人"
 artifact_wind_hammer_name: "风之锤"
 artifact_wind_hammer_description: "这个巨大而沉重的战锤被激活后，将使灵具化为风暴，让使用者像狂暴的龙卷风一样打击，是无数屠杀的信标"
 artifact_bindrune_amulet_name: "宾得符文护符"
 artifact_bindrune_amulet_description: "这个银质的护身符上有用狼人的语言雕刻的符文。这件灵具让人能够传递语言的力量并驾驭它，洞察语言本身的神秘"
 artifact_cloud_string_name: "云之弦"
 artifact_cloud_string_description: "这串绳珠当展开时将飞向天空，然后引导苍穹，给人控制大气和雨水的力量。这种强大的能力使人能够为一个地区带来财富和繁荣，对于人类监护者这样的部族来说，这是一个非常有用的特质，而对于其他部族来说，就没那么实用了。"
 artifact_horn_of_the_white_stag_name: "白鹿之角"
 artifact_horn_of_the_white_stag_description: "塔拉山丢失的三件圣物之一。当这个巨大的号角吹响时，军队将以惊人的速度行军"
 artifact_golden_torc_name: "金颈环"
 artifact_golden_torc_description: "塔拉山丢失的三件神圣遗物之一。这件完美无瑕的王冠曾今是芬尼安至高王艾鲁的司部的标识，这件珍贵的文物是最古老的贵族的有力象征"
 artifact_crones_tongue_name: "老妪之舌"
 artifact_crones_tongue_description: "塔拉山丢失的三件神圣遗物之一，老妪之舌是一柄惊人的简易长剑。但在妖蛆面前，它闪耀着燃烧的光芒，它的刀刃甚至比狼人的利爪更伤人。"
 artifact_lepers_rags_name: "麻风病人的破布"
 artifact_lepers_rags_description: "这件破烂肮脏的斗篷，一旦穿上，将使穿戴者假扮成一个低调的乞丐，无论他们之前是什么身份，这都为实施阴谋提供了大量的选择。"
 artifact_trail_branch_name: "寻踪树杈"
 artifact_trail_branch_description: "一根从灌木丛中取出的小树枝，缚有荒野之灵，这根树枝可以掩盖自己的踪迹，使穿越荒野变得更加容易，因为里面的器灵指引着它的持有者。"
 artifact_feather_of_the_waters_name: "水之羽"
 artifact_feather_of_the_waters_description: "一件羽毛斗篷，由来自遥远南方的不会飞的罕见鸟类羽毛制成。这件温暖的斗篷允许任何有灵知的人像鱼一样轻松灵游，使他们以极大的能力扩展可去的地方"
 artifact_heart_of_fire_name: "火之心"
 artifact_heart_of_fire_description: "这是一个非常危险的灵具，这个小小的红色水晶可以让它的持有者点燃物体。这是一个微小却致命的东西"
 artifact_sun_crystal_name: "日之晶"
 artifact_sun_crystal_description: "这颗黄色宝石内部含有一只光之灵，在使用者激活后，会使这个小玩意像一滴阳光一样发光，照亮持有者所希望的区域。"
 artifact_beast_mask_name: "野兽面具"
 artifact_beast_mask_description: "一种变形面具，当使用者戴上它时，它会使使用者变成被指定的动物。给他们增加了动物的机动性，以及动物的无害性质，以满足持有者的任何要求。"
 artifact_belt_of_the_giants_name: "巨人腰带"
 artifact_belt_of_the_giants_description: "这是个非常稀有的灵具，当被佩戴者驱使时，会使他们的体型加倍，极大地增加他们的力量，给予对手破坏。然而不利的一面是，心脏的尺寸不能增长，这给使用者的身体带来了可怕的压力。"
 artifact_cloak_of_woven_mists_name: "雾织斗篷"
 artifact_cloak_of_woven_mists_description: "织雾斗篷是一条带有复杂胸针的链绳项链。当被佩戴者激活时，阴影和蒸汽会渗入空气中，使佩戴者变得朦胧和模糊，使其难以置信的隐秘，如同气流的低语。"
 artifact_staff_of_life_name: "生命之杖"
 artifact_staff_of_life_description: "一根大手杖，可以兼作木棍，这种有用的灵具可以增强佩戴者的健康，并通过增强他们的健康来保护他们免受伤害。"
 artifact_bone_flute_name: "骨笛"
 artifact_bone_flute_description: "一件精巧的遗物，能够激发不死族的痛苦、安抚生者，那些听到它的人会情不自禁地更尊敬他们的领主"
 artifact_forest_crown_name: "丛林王冠"
 artifact_forest_crown_description: "一件荆棘冠形状的灵具，会自动适应佩戴者的头部，已成为统治者的象征，因为其中的荒野之灵会辅助他们成为荒野共主。"
 artifact_iron_crown_name: "铁王冠"
 artifact_iron_crown_description: "一件铁冠形状的灵具，会自动适应佩戴者的头部，已成为统治者的象征，其中贵族之灵会辅助他们达到史诗般的领导权高度，因此在旧时代受到人类监护者的青睐。"
 artifact_keystone_name: "钥石"
 artifact_keystone_description: "这种符文石一旦被按在石头上，它就会像门一样打开，让使用者通过几乎所有的石头障碍。"
 artifact_dreamcaller_name: "唤梦者"
 artifact_dreamcaller_description: "这支极其珍贵的长笛能打开梦的裂缝，让人在其中舞蹈和学习，并探索思维的深处，为他们可能提供的任何见解。"
 artifact_harp_of_enchantment_name: "附魔之竖琴"
 artifact_harp_of_enchantment_description: "这把竖琴在弹奏时，将释放出优美和谐的旋律，一首真正令人惊叹的奏鸣曲，甚至可以让最久经战事的狼人陷入哀号、潸然泪下。"
 artifact_iceblade_name: "冰刃"
 artifact_iceblade_description: "这把珍贵的剑是用极北坚不可摧的蓝冰制成的，这把苍白的武器与刺骨的北方一样寒冷，同时也能让人如盛夏一般劈开寒风。"
 artifact_lionfang_name: "狮牙"
 artifact_lionfang_description: "这种强大的灵具是由一只可怕的野兽的尖牙雕刻而成的，据说是从猫人那里偷来的，这种极其危险的武器具有与狼国最古老的对手之一同样的力量。"
 artifact_grand_klaive_name: "大月刃"
 artifact_grand_klaive_description: "作为最强大的英雄的月刃，这传奇武器在各方面都比其他月刃好，里面缚有战争之灵会随着持有者敌人的死亡而愤怒地嚎叫。"
 artifact_forge_crusher_name: "锻·碾"
 artifact_forge_crusher_description: "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。锻·碾当使用时，会咆哮燃烧的火焰，能够造成可怕的痛苦"
 artifact_grinding_tooth_name: "磨·牙"
 artifact_grinding_tooth_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。磨·牙能够粉碎任何石头，将面前的大地埋没。"
 artifact_spear_chaser_name: "矛·逐"
 artifact_spear_chaser_description: "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。这把令人印象深刻的铁锤在投掷时腾空而起，投掷到难以置信的距离，并且无法在投掷中被阻拦。"
 artifact_troll_eater_name: "妖·吞"
 artifact_troll_eater_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。妖·吞比其他任何酋长之锤更能摧毁护甲，如同撕裂桦树皮一样"
 artifact_bright_arm_name: "光·臂"
 artifact_bright_arm_description: "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。光·臂像太阳一样闪耀，哼唱着光芒，使对手致盲。"
 artifact_hag_talon_name: "巫·爪"
 artifact_hag_talon_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。巫·爪保护佩戴者的思想，给他们无与伦比的精神防御。"
 artifact_pain_eagle_name: "痛·鹰"
 artifact_pain_eagle_description: "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。痛·鹰是酋长之锤中最具有破坏性的，会留下留下因痛苦而跳动的伤口"
 artifact_runestone_of_gab_name: "口舌符文石"
 artifact_runestone_of_gab_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力，允许使用者成为语言的大师"
 artifact_runestone_of_war_name: "战争符文石"
 artifact_runestone_of_war_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。特别是这些符文石上居有着一只战争之灵，让使用者在任何部队踏上战场之前就完全了解战场的情况。"
 artifact_runestone_of_control_name: "统御符文石"
 artifact_runestone_of_control_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些石头可以预测商业和人口的流动，让使用者对管理事务有无与伦比的洞察力。"
 artifact_runestone_of_cunning_name: "狡诈符文石"
 artifact_runestone_of_cunning_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些宝石可以让一个人维持和控制错综复杂的计划，让使用者成为无与伦比的间谍总管。"
 artifact_runestone_of_wisdom_name: "智慧符文石"
 artifact_runestone_of_wisdom_description: "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些石头有着神学和医学的强大幻象，让使用者对秘法有强大的洞察力。"
 artifact_shining_klaive_of_sokhta_name: "索赫塔的闪耀月刃"
 artifact_shining_klaive_of_sokhta_description: "这是一种由黄金和水银制成的月刃，与其他月刃不同，这一武器对所有化兽族裔来说都是完全安全的，事实上，它还能进一步增强他们的战斗力。这个扭曲可怕的武器让所有听说过它的人都感到恐惧，化形者可能会毫不屈服于他们传说中的弱点。"
 artifact_radiant_blade_of_katanka_sonnak_name: "卡坦卡·索纳克的光辉之剑"
 artifact_radiant_blade_of_katanka_sonnak_description: "这把可怕的剑由银和金混合而成，这把可怕的武器在太阳的化身，科拉克斯和莫科莱的支持者，卡坦卡·索纳克星君的光芒下燃烧。这种炽烈的武器激发了赫利俄斯划过天空的迅捷，以他同样的优雅和灵巧的呼吸移动着。"
 artifact_mercurial_mask_of_mitanu_name: "米塔努的水星面具"
 artifact_mercurial_mask_of_mitanu_description: "骗子的面具，来自水星灵君米塔努的礼物。这个奇物面具可以让一个人完全隐藏自己的存在，就像它的制造者一样，成为一个阴谋之王。"
 artifact_burning_mask_of_hakahe_name: "哈卡赫的燃烧面具"
 artifact_burning_mask_of_hakahe_description: "这个黑色的铁面具曾经是祝融星化身哈卡赫灵君的锻造面具，他是阴影星球的领主，它将锻造大师的一块面具传授给佩戴者，保护他们，并以黄金和知识的方式赋予他们自己的智慧。"
 artifact_radiant_dress_of_tambiyah_name: "坦比娅的光辉之裙"
 artifact_radiant_dress_of_tambiyah_description: "这件连衣裙是由最结实的铁制成的美丽挂毯，是金星化身坦比娅灵君的杰作，每一个佩戴它的人都忍住不住称赞。这件完美无瑕的连衣裙与穿着者相得益彰，并以其他形式成为许多精美的珠宝和小玩意，但即使穿过它，连衣裙也能保护穿着者免受任何侵犯。"
 artifact_eternal_grace_of_eshtarras_might_name: "埃什塔拉之力的永恒恩典"
 artifact_eternal_grace_of_eshtarras_might_description: "在这个护身符里有盖亚化身地球星君埃什塔拉的祝福，。这个不可思议的圣物赋予佩戴者八个凡人的生命力，不受束缚的生育能力，以及她自己的领导智慧，一切之母。这珍贵的圣物是盖亚赐予的最好的材料制成的，她的触摸甚至在任何人身上都是她永恒的祝福和温暖的标志，由她的光辉宝座的一部分制成。"
 artifact_burning_horns_of_nerigal_name: "尼格尔的焚烧之角"
 artifact_burning_horns_of_nerigal_description: "这些红色粘土猎角是由火星化身尼格尔灵君用火星的尘埃制成的。当握住并吹响这些号角时，盖亚也会被震动，召唤着吹响号角的人投入战争，战争星君的力量和狡猾流入他们，召唤着所有人以他的名义赢得胜利"
 artifact_ruinous_talons_of_rorg_name: "罗尔格的毁灭之爪"
 artifact_ruinous_talons_of_rorg_description: "这些流星金属护手是由盖亚的配偶罗尔格星的残骸制成的，这些爪子是来自火星和木星之间的小行星带的灵君罗尔格的礼物，代表着复仇和愤怒。有了这些，他的意志就显现出来了，挥舞着它们的人成为了他的怒火，对他们面前的所有人发动屠杀。"
 artifact_imperious_crown_of_zarok_name: "扎罗克的盛气凌人之冠"
 artifact_imperious_crown_of_zarok_description: "万王之王的王冠，这顶完美无瑕，镶满宝石的王冠是由王与木星的化身扎罗克灵君手工打造的，扎罗克是盖亚的追求者，继露娜和赫利俄斯之后的最伟大者。当你戴上它，你就会变成最伟大的国王的活生生的面孔，无尽的财富将流入他们。"
 artifact_eternal_wings_of_lu_bat_name: "鲁·帕特的永恒之翼"
 artifact_eternal_wings_of_lu_bat_description: "这件羽毛斗篷是土星灵君，木星灵君和大猫头鹰的礼物。有了这些，持用者可以飞上天空，在[umbra|E]和[skinlands|E]遨游，并在其中携带他自己的本性和智慧。"
 artifact_shadowed_stave_of_ruatma_name: "鲁阿特玛的暗影之杖"
 artifact_shadowed_stave_of_ruatma_description: "这个小的，手持的五线谱据说有天王星灵君的声音的一小片在它里面。通过它，星君与它的持有者交谈，低语许多关键的秘密和传说。然而，也许有些是不应该知晓的。"
 artifact_dancing_loom_of_shantar_name: "尚塔尔的轻快织机"
 artifact_dancing_loom_of_shantar_description: "这个发光的竖琴是完美的创造，由海王星灵君尚塔尔的手编织而成。与她的其他造物不同的是，这件作品是用她的专注力织成的，是送给她的斗士的礼物。在这台琴上，她优美的歌声潺潺流过，没有什么比这更能缓解紧张了。"
 artifact_whispering_ankh_of_meros_name: "梅罗斯的低语的生命之符"
 artifact_whispering_ankh_of_meros_description: "这枚饱经风霜的银十字章似乎饱经岁月的洗礼，来自梅罗斯灵君送给冥王星灵君的最珍贵的礼物。这个珍贵的徽章允许使用者以神奇的速度移动，当说话时，持有者将收到一个永恒流浪者的声音片段。"
 eternal_love_artifact_name: "永恒之爱"
 eternal_love_artifact_description: "虽然不算是魔法，但不可否认的是，这把剑有某种神秘的咒力。它由银制成，能制造出吸血鬼无法治愈的伤口。只有将另一个吸血鬼的血与他们自己的血混合在一起，然后按在伤口上，伤口才能治愈。这把武器是迦太基的该隐之子工匠为帕里斯制作的，用于他猎杀吸血鬼的冒险。"
 artifact_ring_of_the_elements_name: "元素之戒"
 artifact_ring_of_the_elements_description: "作为最强大的灵具之一，元素之戒赋予狼人控制地水火风四种元素的力量。当被激活时，狼人不会被这些力量的攻击所伤害。例如，例如，火把会拒绝烧向狼人，石头甚至金属剑会从她的皮肤上弹起而无害，她也不会淹死在水下。"
 sword_samiel_artifact_name: "萨麦尔之剑"
 sword_samiel_artifact_description: "传说中的萨洛比第一武者是一位无以伦比的战士，他愿意超越自己的职责去对抗黑暗力量。他的武器强大到足以杀死一位[antediluvian|E]，直到今天晚上仍然散发着这不容恶的正义灵光。"
 artifact_bezariel_dagger_name: "仪式匕首"
 artifact_bezariel_dagger_description: "在被注入芭芭雅嘎的一小部分力量之前，这是一把无关紧要的仪式匕首，在贝撒列尔从深渊监狱逃出时，他用这把武器将他与地球缚在一起。"
 artifact_orobas_statue_name: "欧若博司雕像"
 artifact_orobas_statue_description: "一座由潮湿、粘稠的砂岩组成的雕像，被千年以来用与束缚欧若博司。此后，它转变的更像其怪诞的宿主。"
 artifact_heart_lamashtu_name: "拉玛什图之心"
 artifact_heart_lamashtu_description: "这个从未完成的盒子，与犹太教的约柜非常相似，承载着拉玛什图与凡人世界的联系。令恶魔感到沮丧的是，在最初的工匠死后，她再也找不到足够有天赋的工匠来完成它。"
 artifact_caliburn_name: "石中剑"
 artifact_caliburn_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('caliburn_light_modifier').GetNameWithTooltip]。\n被[GetTrait('enchanted').GetName( GetPlayer )]时，不再会失去临时梦华。#!\n“光之剑”，石中剑是极其强大的妖精珍宝。其名字大致可翻译为“雷霆”。有一些观点认为，石中剑实际上并不是一件妖精珍宝，而是一件独特的物品，它违背了所有的估计和解释，因为就石中剑而言，对妖精珍宝的通常规则似乎并不成立。"
 artifact_caliburns_sheath_name: "石中剑之鞘"
 artifact_caliburns_sheath_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予友方[knights|E]或在[single_combat_duel_plural|E]中给予自己[GetModifier('caliburn_shield_modifier').GetNameWithTooltip]。\n作为[character_interaction|E]，允许你治疗目标的伤口。#!\n石中剑的鞘是由简单的黑色皮革制成的，尽管有些妖精声称他们能辨认出在皮革上附有的“石中剑”一词。"
 artifact_caladbolg_name: "螺旋剑"
 artifact_caladbolg_description: "#bold 作为[character_interaction|E]，允许你召来天雷以伤害目标的所有骑士。#!\n据说持剑者在战斗中是无敌的，这把剑提供给持剑者再生之力，而且它是自动攻击的。如果这还不够，传说也表明这剑赋予了持剑者侦测谎言或虚假的能力，比最伟大吟游诗人的故事更激励人，还可从天空召下雷霆。"
 artifact_red_apple_of_avalon_name: "阿瓦隆的红苹果"
 artifact_red_apple_of_avalon_description: "#bold 作为[character_interaction|E]，允许你让目标获得负面精神特质或谋杀其的朋友/爱人。#!\n长于红泉水的红皮苹果是有毒的，它们看起来的确挺好看，存在一种明红的色泽，不过只要咬上一口，就会引发剧烈的痛苦和幻觉。虽然这些苹果本身并不致命，但许多曾经吃过一口红苹果的都已死去，跑下悬崖或错把朋友当成敌人，以及迫使他们所爱之人与他们战斗亦或死亡。"
 artifact_white_apple_of_avalon_name: "阿瓦隆的白苹果"
 artifact_white_apple_of_avalon_description: "#bold 作为[character_interaction|E]，允许你治疗目标的负面精神特质。#!\n白苹果有着疗愈心灵的力量。它们可以去除夜惊症，治疗精神错乱或恢复哑者言语的能力。值得注意的是它们无法医治身体上的疾患，只能治疗那些根植于精神的疾病。"
 artifact_chalice_of_rain_name: "雨之杯"
 artifact_chalice_of_rain_description: "雨之杯是少数广为人知的在法师们手上的妖精珍宝之一，一群隶属于旧日信仰居住在康沃尔郡的法师们和妖精制定了一个古老的契约，用以帮助守卫传奇群岛里奥纳斯，使其免受那些找寻它传说财宝之人的掠夺。作为对于他们伸以援手的回报，妖精将杯子交托与法师们。据说，倘若想要目睹奇迹，则需灌注这个看起来银制且边沿具有古老符文环绕的杯子。如果杯子已被注满并且这水洒在地上就像是献给仙民的祭品一般，那么在下个月亮升起前杯之将会带来雨水。这帮助了法师和他们亲属勉强维持着在崎岖之地上的生活，以及确保了他们的繁荣。"
 artifact_broach_of_scrying_name: "占卜胸针"
 artifact_broach_of_scrying_description: "这枚胸针能帮助佩戴者做出简单的决定。持有者就他所面临的问题或他想承担的任务提出一个简单的是或否的问题。然后，他用石头砸开胸针，或把它踩在脚下，把胸针砸开。翻出来的石头会保持白色或变成黑色。白色的石头表示问题的答案是肯定的，而黑色的石头则表示答案是否定的。"
 artifact_singing_sword_of_madog_cynydd_name: "马多格·赛尼德的歌咏之剑"
 artifact_singing_sword_of_madog_cynydd_description: "#bold 作为[character_interaction|E]，允许你发起[single_combat_duel|E]来给予剑[GetModifier('artifact_life_expectancy_40_modifier').GetNameWithTooltip][modifier|E]。#!\n据众家之言，这是一件巧夺天工和具有致命力量的兵器。当在战斗中挥舞它时，剑会为他使用者的敌人颂起挽歌。每个在战斗中被马多格·赛尼德之剑砍倒的敌手都会把他任何剩余的自然寿命交与凶手。因此，用马多格·赛尼德之剑杀掉一个年轻人就能令持剑者延寿40年。持剑者也会收获死者在将来可能拥有的任何好运，受害者的厄运则随他一并消逝。"
 artifact_black_torc_of_carniog_name: "卡尼奥格的黑颈环"
 artifact_black_torc_of_carniog_description: "#bold 解锁[summon_wraith_on_death_interaction|E]\n解锁[bind_wraith_interaction|E]\n解锁[command_wraith_interaction|E]\n解锁#italic $EXECUTION_CONVERT_TO_WRAITH$#![execution|E]选项。\n最大束缚死灵数量：#P +2#!#!\n传说卡尼奥格的黑色金属颈环有着能够盗取灵魂和使整支凡人军队都陷入近乎永恒（尽管很平静）沉眠的力量。一些人暗示它也授予了驱使妖精们的能力，不过在这个问题上他者们自身却沉默以对。"
 artifact_blazing_silver_torc_of_myfanwy_du_name: "米万维·杜的的闪银颈环"
 artifact_blazing_silver_torc_of_myfanwy_du_description: "米万维·杜的闪银颈环会让那些注视着佩戴者的人心中充满深切的敬意和喜爱之情，他们会竭尽所能的去帮助他，纵使佩戴者在戴上颈环前他们是最势如水火的敌人。如果佩戴者给出了恰当的暗示，一个这样的示意就会将对方心中的喜爱之情点燃成/转化为狂热的爱恋（无论佩戴者性别如何）。"
 artifact_cauldron_of_gruffydd_name: "格鲁菲德的大锅"
 artifact_cauldron_of_gruffydd_description: "#bold 能够招募[GetMaA('animated_tree').GetName]、[GetMaA('golems').GetName]、[GetMaA('guardians').GetName]和[GetMaA('homunculus').GetName]作为[men_at_arms|E]。#!\n格鲁菲兹大锅的主人不管往里放进去什么都会创造出来扭曲的战士。如果一个法师用岩石装满大锅，那么一尊石元素就会出现并为他而战。类似地，在格鲁菲兹大锅中装满匕首和黏土便会产生一个很像带刺魔像的恐怖（并且致命）仆人。显然，某些组合要比其他的更有效，但即使是一支柳条部队也要远比孤军奋战强。"
 artifact_cauldron_of_annwn_name: "安温圣锅"
 artifact_cauldron_of_annwn_description: "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n最令人垂涎的精灵珍宝之一便是安恩圣锅。它曾经位于盖世圣丘下面的[UmbraGlossaryLocalized('shadowlands','冥界')]，在摩根勒菲违背他的意愿并试图对亚瑟王使用圣锅后，妖精国王阿瓦拉克将它藏了起来，不让凡人看到。根据法师们的传言，一个没入安温圣锅水中的濒死之人再从里面出来后将会变得康健，复全以及年轻。"
 artifact_faerie_dust_name: "妖精尘"
 artifact_faerie_dust_description: "妖精尘通常装在小袋子里，必须与目标直接接触才能发挥作用。其他方法包括：从上方向目标洒粉；在目标的手套或衣服上洒满粉尘；在食物上洒粉；将粉尘与液体混合制成药水和药剂；甚至投掷整袋粉尘，粉尘在受到冲击时会爆炸，以达到更远的距离。"
 artifact_cabinet_stick_name: "魔柜棒"
 artifact_cabinet_stick_description: "这根看似普通的手杖能赋予使用者魔法能力，让他们可以进入遥远的妖精界域中某个隐蔽的橱柜或衣橱。使用者只需要在任何橱柜、门、大箱子，甚至是树皮上用这根手杖轻敲一敲，便可以激活到达魔法储物空间的链接。"
 artifact_cap_of_neglect_name: "忽视帽"
 artifact_cap_of_neglect_description: "尽管这些帽子不能真正地实现隐形效果，但这种魔法的要求并不多。只要没有人有意地寻找佩戴者，其他人就会忽略她在房间中的存在。只要佩戴者不引起注意，比如说讲话或者突然移动，她就可以悄悄地移动而不被察觉。"
 artifact_ring_of_linked_sight_name: "链目戒"
 artifact_ring_of_linked_sight_description: "这些戒指经过特殊的魔法附魔，来让它们之间创造一种魔法纽带。如果一枚戒指的持有者将其贴到右眼上，她会看到第二枚戒指的持有者，就好像他只站在几英尺远的地方一样。第二枚戒指的持有者周围的雾气和阴影会使环境显得模糊不清，但他的形体和动作依然可见。如果这枚戒指的持有者将其贴到左眼上，她会看到第二枚戒指的持有者所看到的景象，就好像她从他的左眼望出去一样。"
 artifact_sealing_needle_name: "封针"
 artifact_sealing_needle_description: "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n这些附魔的针是作为礼物送给女仆和裁缝以换取效忠的简单珍宝，一旦装备，就能神奇地缝上任何撕裂或开口。根据所使用的线的类型，针可以修复破损的衣服，封住谷物袋的开口，甚至缝合开放的伤口。制造这些珍宝的符咒很简单，针在皮革、丝绸或皮肤上的效果也一样好。虽然这些珍宝的大多数用途都很单纯，但冬之一族已经知道用这些宝物来封住受害者的嘴、鼻子和眼睛，或者把他们切开，用粗糙的麻布把他们缝合起来。"
 artifact_active_arrow_of_midnight_sun_name: "夜日箭#Weak （已激活）#!"
 artifact_arrow_of_midnight_sun_name: "夜日箭#Weak （未激活）#!"
 artifact_arrow_of_midnight_sun_description: "#bold 若激活，在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。#!\n这些附魔的箭矢是夏之王廷的最爱。当向夜空发射时，这些箭会迸发出璀璨的光芒，用正午的太阳之光照亮战场。这种光可以用来驱赶黑暗生物，或者简单地在没有光的地方创造光。"
 artifact_arrow_of_inky_noon_name: "墨午箭"
 artifact_arrow_of_inky_noon_description: "这些箭矢是夜日箭的对应物，受冬之王廷青睐。白天射向空中时，这些箭矢让天空变得漆黑如同无月之夜。"
 artifact_vulcans_hammer_name: "火神之锤"
 artifact_vulcans_hammer_description: "这种铁锤有时被北方文化的居民称为矮人之锤，它被施以魔法用于武器和盔甲的铸造。这个工具可以神奇地增加用于制造此类物品的金属的强度，使它们能够造成和承受更多的伤害。使用这铁锤锻造的任何武器都不需要研磨便能在战斗中造成额外的伤害。"
 artifact_pegasus_bridle_name: "飞马缰绳"
 artifact_pegasus_bridle_description: "关于翼马的凡间传说是否启发了这珍宝，或者说反之亦然，人文主义学者们存在不同的看法。当这个缰绳被套在任何动物身上（通常是马），它便能够飞翔，直到被取下为止。"
 artifact_rooting_amulet_name: "生根护符"
 artifact_rooting_amulet_description: "这珍宝最初是由一位木元素妖创造的，用来惩罚一个违反誓言而进入他的小树林的女王。妖精制作了一个美丽的护身符，并把它送给王后的一个宫女，作为送给他情妇的礼物。王后非常喜欢这条编织精美的银项链，并把它紧紧地戴在了脖子上。当她把脚放在家门口的地上时，她的双腿深深地扎进了泥土里，她的身体和手臂变成了树干和树枝。元素妖先是显露出自己是森林中的妖精，然后夺回了护身符，并对王后的宫廷给予警告，提醒他们不要在附近的森林里走得太深。"
 artifact_twin_glass_name: "双子镜"
 artifact_twin_glass_description: "一面被神奇地一分为二的镜子，双子镜可实现远距离通信。两面镜子的功能就像窗户，主人可以通过其中一面镜子观察或说话，也可以通过另一面镜子受视或聆听。"
 artifact_gale_flute_name: "大风长笛"
 artifact_gale_flute_description: "这个小乐器具蕴含了黎明之力，能够召唤出从微风到狂风暴雨的一切。从长笛吹出的单一、柔和的音符会将微风吹向演奏者。吹奏时间越长，风的力量就越强，仅仅几分钟后就会变成狂风。继续吹奏便会带来烈风，制造出难以置信且足以摧毁整个村庄的风暴。"
 artifact_excaliburs_scabbard_name: "湖中剑之鞘"
 artifact_excaliburs_scabbard_description: "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n虽然这不是传说中的湖中剑或石中剑的真正剑鞘，但这件稀世珍宝是如此古老，具有如此神秘的特性，以至于它已经与那把强大的武器联系在一起。任何从剑鞘中拔出的剑据说在战斗中都是牢不可破的，但这件珍宝的真正力量源于它的治疗能力。"
 artifact_shatterhammer_name: "碎石锤"
 artifact_shatterhammer_description: "这些可怕的武器是在四季之战最激烈的时期制作的，现今所知的已寥寥无几。因地震或山崩而诞生的灵通常会被誓言绑定在这些珍宝中。这些大地之灵会赋予普通武器力量，在击中目标时会产生震荡波纹。众所周知，这种锤子可以击碎盔甲和骨头，使内脏破裂，劈开大型橡木门，甚至击倒石塔。"
 artifact_sword_of_drowning_name: "溺水之剑"
 artifact_sword_of_drowning_description: "在四季之战期间制作的这些武器包含了水灵或水元素妖，它们要么出于某种原因而放弃了自由，要么被强制地束缚在其中。它们所固守的水性本质在战斗中显现，当命中目标时，会导致水流进目标的肺部。这些攻击会引发恐慌和偏执，因为对方在水中中呛咳和咳嗽。"
 artifact_cauldron_of_nightmares_name: "噩梦坩锅"
 artifact_cauldron_of_nightmares_description: "这些大锅被创造出来，用来在冬之王廷的敌人中制造恐慌和绝望，它们可以让目标最黑暗的恐惧在现实世界中短暂地显现出来。为了让魔法生效，必须将目标的某一部分——一缕头发、一颗掉落的牙齿，甚至是一截断的手指——与大锅内的药剂混合在一起。然后执行复杂的仪式，使目标最可怕的噩梦的形象具现化。"
 artifact_castors_star_name: "双子座之星"
 artifact_castors_star_description: "双子座之星在一场雷电风暴中坠落自天空，留下一道充满电光和火焰的裂痕尾迹，其中充满混沌能量，渴望着释放。刚被发现时，这颗巨大的金属岩石充满了来自闪电的能量，它在夜晚发出蓝光，使接近它的人在一阵剧痛后不得不放下他们的金属武器。"
 artifact_friars_cross_name: "修士十字架"
 artifact_friars_cross_description: "修士十字架起源于黑暗中世纪，是一个悬挂在编织绳上的大型华丽金色十字架。虽然曾被用作信仰和保护的象征，但修士十字架的历史却与对妖精魔法的消解和对幻生灵的毁灭息息相关。注入了一再抹煞的板讷，修士十字架已成为一种腐化装置，吞噬着不幸佩戴它的人的梦华。"
 artifact_gray_sword_name: "灰之剑"
 artifact_gray_sword_description: "灰之剑，虽然明显是奇魅的，却没有个性或装饰，看起来像一把普通的阔剑，带有简单的剑柄和平整无记号的刀刃。它的历史最多只能说是模糊不清。有人怀疑它是由一个哀怒廷领主制造的，他试图抹煞一位喜乐廷对手，但没有一个名字能明确地与这把剑的创造联系起来。"
 artifact_gauntlets_name: "护手套"
 artifact_gauntlets_description: "护手套，从最简单的层面来看，就是一双手套。然而，如果只是这样，红帽子们就不会那么喜欢它们了。然而，每一个制作护手套的红帽子都会在上面镶嵌鱼钩、剃刀片、破碎的玻璃、生锈的钉子和木屑。没有两双护手套是相同的，大多数红帽子发誓只能戴自己的。"
 artifact_dry_dust_name: "干尘"
 artifact_dry_dust_description: "干尘的作用很简单。它会让任何吞下它的人（尽管它必须与食物或饮料一起服下，不能单独服下）在一小时内感到极度饥饿和极度口渴。在这段时间内，受害者会试图吃掉一切——极端情况下连人都吃——只要能够伸手到的东西。干尘有各种各样的用途，从毒害到粗鲁的恶作剧。似乎只有红帽子知道它的制造秘密，而那些被询问的少数红帽子暗示他们曾经磨碎人骨来制作这种东西。他们可能在说真话，也可能只是试图让询问者感到不安。不管怎样，这都说明了很多问题。"
 artifact_blooded_gauntlets_name: "血护手套"
 artifact_blooded_gauntlets_description: "普通护手套上的刺、突起、刀片和钩子只是尖锐和危险，而血护手套上的这些部件则是自己能动出击的。当它们撕裂对手时，它们想要停留在那里，并尽可能多地造成伤害。目击者（以及极少数的幸存者）发誓，刀片和其他部件实际上会在拳头命中后移动，撕裂目标的肉体。钩子将血护手套卡在原地，而其余的装备则开始行动，撕裂直至骨头及更深的地方。不幸的是，那些被红帽子穿戴这种护手套的家伙注定只能忍受一瞬间的极度痛苦，别的什么都无法做。"
 artifact_grinder_name: "磨碎机"
 artifact_grinder_description: "无论如何强调都不为过，磨碎机几乎可以吞下任何东西。金属？没问题。尸体？轻而易举。大象？可能需要一些时间，但也能被吞下。而不管吞进去什么，最后都会输出一样的东西，就是一种不太好吃的东西。当然，被扔进去的物体的大小以及它所制造的原材料会影响磨碎机将其完全咀嚼掉需要多长时间，但最终，只要红帽子愿意转动曲柄，这个装置几乎可以处理几乎一切可以想象到的东西。"
 artifact_logis_ashes_name: "罗吉之烬"
 artifact_logis_ashes_description: "#bold 作为[character_interaction|E]，允许你对敌人的领地释放[GetModifier('POD_county_great_famine_modifier').GetNameWithTooltip]。\n作为[commander|E]时，在[combat_phase|E]中给予敌方[commanders|E][GetModifier('logis_ashes_modifier').GetNameWithTooltip][modifier|E]。#!\n即使是撒上一丁点罗吉之烬，也会产生恶劣的影响。一旦撒下，附近所有的食物和饮料都会在进食变成嘴里的灰尘。这影响像野火一样迅速蔓延，一般会延伸到数英里之外。整个公国都会被这荒废掉，因为任何被带入的食物都会在一年零一天内以这方式衰谢。"
 artifact_winterblade_name: "冬之镰"
 artifact_winterblade_description: "据说冬之镰就是将割去世界之夏并将一切陷入冬季的镰刀。它接触的地方，大地将会冷却，并永久荒芜。它的刃只需轻轻一割就足以枯萎数百年生长的树木，而微不足道的划痕就足以吸取生命。即使是那些侥幸闪躲开冬之镰的人也会在骨子里感到它的寒意，如果他们能够在其刃回砍之前连滚带爬的躲开，那就算是幸运了。"
 artifact_achen_name: "亚琛"
 artifact_achen_description: "#bold 作为战争参与者时，在[war|E]中给予敌方参与者[GetModifier('achen_modifier').GetNameWithTooltip]。#!\n亚琛是杜伽尔的双头锤，它的形状是杜伽尔世家的族徽。在战斗中，亚琛会自动给它击中的任何武器或盔甲附魔，使其不能用来对付杜伽尔世家的成员。有故事说，整个军队被锤子的力量所阻挡；盔甲和剑被冻结在原地。他们的所有者和穿戴者不得不把它们留在战场上，在亚琛的力量下裸体撤退。"
 artifact_anweyth_name: "安威斯"
 artifact_anweyth_description: "安威斯，钢铁之母，创新之刃，是一把美丽的短剑，银色花纹镶嵌其中，柄为黑玛瑙。它在杜伽尔世家的传说中拥有神秘的地位；它是杜伽尔最后的杰作，无与伦比的杰出之作。安威斯有两种已知的能力：它能够告诉任何铁匠制作钢铁的秘密；其次，它无法被垂涎。"
 artifact_caliper_of_aife_name: "埃斐的卡尺"
 artifact_caliper_of_aife_description: "杜伽尔的妻子埃斐用某种被遗忘的野兽的象牙精心制作了一套精美的游标卡尺，每只游标卡尺的尺长都和巨鬼的胳膊一样长。这些游标卡尺可以“测量”任何可以放在它们之间的事物：距离、重量、长度、纯度、诚实、爱情、仇恨等等。"
 artifact_mooncrystal_name: "月晶"
 artifact_mooncrystal_description: "#bold 更大概率在真言[bunk|E]成功。#!\n月晶大小各异，从弹珠到篮球大小不等，看起来就像你在占卜师那里期望看到的刻板形象的“水晶球”——球状，呈乳白色，似乎在你凝视着它时会不断变换和折射颜色。月晶允许其使用者每周一到三次，根据其威力和大小的不同，获取关于现在或最近发生的事情的洞察力。"
 artifact_elenas_mirror_name: "埃琳娜的魔镜"
 artifact_elenas_mirror_description: "作为[mythic_age|E]仅存的珍宝之一，没有人确切知道谁拥有这个极为强大的物品。据说埃莉娜之镜允许持有者在一天内的某个时间段内，最多持续一小时，清晰地看到世界上的任何地方。此外，它还允许持有者在镜中出现的人上施放小法术。人们相信这面镜子在施放“至高法术”方面尤为有帮助，因为在遥远的过去，有关使用这面镜子影响世界各地国王和亲王决策的传说。"
 artifact_balors_crystal_eye_name: "巴烙的水晶眼"
 artifact_balors_crystal_eye_description: "当强大的邪眼巴烙最终在战斗中倒下时，弗摩尔族的一位战士祭司取出了他破碎的眼睛并把它包裹在一个水晶里，水晶里也储存着一口井里的治愈之水。他希望能够保存和恢复它，以便再次用作对抗达南神族及其后裔的武器。然而，眼睛已经沉睡了几个世纪，但但随着红星在妖精称之为巴烙之眼的[UmbraGlossary('dreaming')]中出现，皇家卫士们在一个受保护的地方让它沐浴在它的光芒中。自那时以来，水晶眼开始发出暗红色的光芒，巨大的热量被包围的水晶所阻挡。"
 artifact_blood_dross_name: "血渣"
 artifact_blood_dross_description: "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。#!\n舞蹈大师们已经发现了一种方法，可以让与他们有关系的莉莉丝之子们为他们提供一种不同寻常的黑暗梦华。通过从那些被称为疯子的吸血鬼在表现出他们的疯狂或在妥内朵从事艺术追求时取几滴血液，大师们创造了所谓的血渣。血液储存在由结晶糖制成的小圆瓶中，然后涂上稍微坚硬的外壳以保持其中的液体。几个珠子可以一起存放在一个保护盒中长达一个月而不会失去其效力。"
 artifact_steaming_spear_of_vengeance_name: "气化之矛"
 artifact_steaming_spear_of_vengeance_description: "很久以前，长臂鲁格使用一支魔法矛来穿出巴烙之眼。作为回应，巴烙世家的工匠一直在制造反制喜乐廷统治者的武器，以待战争爆发之后拿来对付喜乐廷。被称为“气化之矛”，它使用了与伤害巴烙的矛相似的矛头。通过强大的附魔，这支矛充满了愤怒，使它成为一支追血矛。它的矛头必须不断浸泡在水中，因为它会融化触碰到的任何物体，而它的杆必须被沉在深水中的石头上的锁链拴住，以防止它飞出去寻找猎物。"
 artifact_cauldron_of_fear_name: "恐惧坩锅"
 artifact_cauldron_of_fear_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('cauldron_of_fear_modifier').GetNameWithTooltip][modifier|E]。#!\n这是一个巨大的黑色大锅，看起来略带锈迹，但当装满静水并放在火上时，它会产生一种精致的、几乎看不见的迷雾，随风散布到大厅或战场。被迷雾困住的人会在心头感到恐惧，即使是最勇敢的骑士和光荣的对手也会惊慌失措，通常会在匆忙中丢下武器或其他任何他们携带的东西以逃离。缺点是如果风向改变，使用这个大锅的人可能会被迷雾反噬。"
 artifact_rose_of_leanhaun_name: "恋难舍之玫瑰"
 artifact_rose_of_leanhaun_description: "#bold 允许通过[decision|E]补充梦华。#!\n这件珍宝是恋难舍死时放在她胸前的一朵白玫瑰。在菲尼利亚的诅咒下谴后，这是唯一一朵在与她接触时没有变黑的花，而且从那时起就一直保持着纯洁。世家成员认为它是希望的象征，因为它一直保持着纯洁和活力，而且无需乱梦就能维持持有者。持有玫瑰的妖精可以直接从中汲取梦华。"
 artifact_edanns_harp_name: "艾丹之竖琴"
 artifact_edanns_harp_description: "#bold 每月额外恢复一点梦华。#!\n这把古老的木制竖琴上有一条贯穿全身的大裂缝，琴弦看起来就像起毛的缝线一样，而且破损不堪，最多只能从对凯尔特历史感兴趣的人手中换来几块钱。然而，在附有魔力的眼中，这把竖琴虽然古老而有裂痕，但却镶嵌着黄金，银色的琴弦就像闪亮的头发一样细腻而脆弱。世家中没有人知道这究竟是偷走恋难舍芳心的吟游诗人——艾丹——的竖琴，还是精心制作的复制品，但上面强力的附魔让它成为了世家的珍宝。"
 artifact_crown_of_dreams_name: "梦之冠"
 artifact_crown_of_dreams_description: "#bold 不再需要最高压力等级来使用乱梦[character_interaction|E]。#!\n这件珍宝实际上并不是一顶王冠，而是一枚镶满珠宝的橡木簪子，形状就像一顶造型别致的王冠。戴上它的人，也就是戴着被发现者称之为王冠的人，就能了解附近区域（约一平方英里）的所有梦种，并知道如何发掘他们的潜能。通过对潜能的辨别，佩戴者可以知道谁最有可能从梦种的创造中获益。"
 artifact_masquers_eyes_name: "假面人之眼"
 artifact_masquers_eyes_description: "这珍宝实际上是一对普通而又精美装饰的假面舞会面具。当启动时，它们能够在佩戴者之间建立一种联系，使两人能够在远距离上共享感官，甚至情感。使用者戴上面具后，其他戚族可以看到和听到她的一切，只要面具不摘下。她甚至可以借用朋友的声音，前提是朋友同意传达信息。"
 artifact_passion_braceler_name: "炽情之镯"
 artifact_passion_braceler_description: "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。#!\n这些手镯看似简单的布质或银质手镯，但实际上是梦华或意志力的容器，可以为佩戴者储存魔力或意志力，直到需要时才释放出来。考虑到我们面临的巨大压力，这些手镯简直就是天赐之物。布质手镯总是用换生灵最喜欢的颜色编织而成，可以储存梦华；银质手镯则刻有佩戴者的名字，可以储存意志力。"
 artifact_eilaf_name: "埃拉夫"
 artifact_eilaf_description: "这把长弓曾经属于伊瓦尔德，一位伟大的战士，在与巨人的第九场也是最后一场战斗中殒命。渥尔娃女巫们将这把弓守护至有一天，一个技艺与伊瓦尔德相匹敌的新战士前来。从这把弓射出的箭永不失准，给予对手严重的伤害。"
 artifact_tapestry_of_fate_name: "命运织锦"
 artifact_tapestry_of_fate_description: "#bold 解锁独特[decision|E]。#!\n对于妖精来说，它是否真实存在尚未可知。根据传说，这幅织锦包含了所有真名，以及[UmbraGlossary('dreaming')]的命运。它所蕴含的力量和知识是无价之宝。它在很久以前就失落了，有传言说它可能存在于各个斯珞俄永契堡，甚至在银海之下。许多人为了寻找它而离开，但没有人返回。有一点是确定的：找到它的人可能会招致诺伦三女神的愤怒。"
 artifact_berserker_armor_name: "狂战士之甲"
 artifact_berserker_armor_description: "这件精美的盔甲能够保护佩戴者免受任何武器的攻击，并使他们能够超越正常的战斗能力。最大的世家秘密是这套盔甲对于魔法攻击或空手攻击是脆弱的。尽管强大，但这套盔甲也有代价：一旦装备狂战士之甲的人出战，除非他们死亡或他们所在的一方获胜，否则他们将无法停止战斗。"
 artifact_cudgel_of_conchobhair_name: "康胡尔之棒"
 artifact_cudgel_of_conchobhair_description: "康胡尔之棒是一根平凡的橡木杖，大约有8英尺高。它赋予持有者（仅限戴瑞恩世家成员）一些奇妙的力量。杖的底部用冷铁包覆，既作为一种警告，也在最严峻的情况下，可能作为一种武器使用。"
 artifact_cauldron_of_sceanbh_name: "萨森布的大锅"
 artifact_cauldron_of_sceanbh_description: "这个大锅有两种功能，取决于酿造师的愿望。它的第一个力量是酿造一种药剂，激发战士们做出伟大的事业。第二个力量更加隐匿，可以制作一种强力的安眠药剂。"
 artifact_amber_wyrm_name: "龙蛇琥珀"
 artifact_amber_wyrm_description: "在一个深红琥珀色的蛋中，蜷缩着一只小型沉睡的龙。它被悬挂在一条金链上，周围是由金色编织而成的图案网，这个蛋是半透明的，可以清晰地看到龙的每一个细节。偶尔，龙在沉睡中转动身体，仿佛琥珀只是水一般。"
 artifact_eyes_of_the_snow_maiden_name: "雪姑娘之眼"
 artifact_eyes_of_the_snow_maiden_description: "在很久以前，女术士夏洛代伊使用晶莹如阳光的金黄琥珀，制作了送给瓦里克的雪姑娘的眼睛。当他激情的热量摧毁了她时，琥珀眼睛被发现浸没在一池有着奇怪咸味的水中。瓦里克再也不愿意见到它们，但是家族中的其他成员一直保留着它们，因为有传言说它们能真正看到妖精的敌人：弗摩尔族。"
 artifact_firebird_name: "火鸟"
 artifact_firebird_description: "这件由诺克打造的珍宝是一只由红宝石和黄金制成的精巧机械火鸟。当暴露在太阳的光芒和月亮的光辉下，当命令它这样做时，火鸟便翱翔于天空中并歌唱。当它升至100英尺的高度时，它会爆发出辉煌的火焰，用金色的摇曳光芒照亮周围数英里的区域，并指引最近的仙路或由其主人指定的特定位置的方向。"
 artifact_havens_compass_name: "避风港罗盘"
 artifact_havens_compass_description: "这珍宝通常以古董指南针的形式呈现。与其指向北方，它会锁定最近的活跃永契堡或秘境。对于“没有选择余地”的探险者和流浪者来说，这不区分喜乐廷民团和厌恶平民的哀怒廷领主的指南针非常有用。由于一些永契堡将他们的家园隐藏起来，他们可能对这珍宝的主人并不太友好。"
 artifact_bakers_stone_name: "面包师之石"
 artifact_bakers_stone_description: "面包师之石可以呈现任何形状、颜色或大小，尽管大多数是圆形的，由棕色黏土制成。当任何有机材料被放在石头上时（是的，任何物质都可以），它们会神奇地变成朴素但可食用的蛋糕。在[UmbraGlossary('dreaming')]或充满梦华的地方，蛋糕会变得更加丰富和华丽，有糖霜、醋栗和水果装饰。"
 artifact_bane_dagger_name: "灾祸匕首"
 artifact_bane_dagger_description: "把恶毒的武器专为刺杀而设计，因此已被正式列为违禁品。这把匕首的柄上有一个小隔间。当被害者的一部分（一缕头发、一根眼睫毛或一滴血液）放入隔间时，刀刃便与那个人产生了共鸣，并且无法再与其他人产生共鸣。一旦目标被杀，刀刃开始腐蚀，在不到一个小时内消失无踪。"
 artifact_dreamstone_of_madoc_name: "马多克的梦石"
 artifact_dreamstone_of_madoc_description: "#bold 作为[character_interaction|E]，允许你传送到目标所在地。\n允许在灵游时进入[UmbraGlossary('dreaming')]。#!\n梦石有很多，但没有任何梦华容器能与马多克的梦石相比。它所聚集的梦华可能会“泄漏”，导致最靠近它的人做一些生动的梦，醒来后就会一直记得。不过，它最大的能力是塑造梦境。一个熟练的造梦师可以创造出具有巨大力量的奇魅生物，将梦界折叠在自己身上创造出口袋界域，或者在原来没有的地方建造一条仙路或通道。未经证实的传言称，它甚至可以找到并打开通往[UmbraGlossary('arcadia')的道路。"
 artifact_durable_sandals_name: "耐久凉鞋"
 artifact_durable_sandals_description: "你或许嗤之以鼻，但在埃拉巴拉中，这些鞋子是极为珍贵的珍宝。它们永不磨损，无需修理。无论气候如何，它们都舒适温暖，让你的双脚保持干燥。在行走或奔跑时，它们还能为你提供一丝能量助推。"
 artifact_trail_dust_name: "显路尘"
 artifact_trail_dust_description: "作为一项有用的宝藏，显路尘总是装在一个看似古旧的小皮袋中，上面饰有一个古老的象征着“路径”的符号。皮袋内装有一小部分是埃拉巴拉所旅行地区的土壤或沙子。当用一点梦华激活并洒在拥有者赤裸的双脚上时，他或她立刻获得了周围地区的详细地理地图和方向知识，与当地年龄大他们两倍的本土人所知相当。"
 artifact_blessed_opa_name: "受祝福的欧帕"
 artifact_blessed_opa_description: "欧帕是埃拉巴拉的传统武器。类似于一根长棍，通常经过精细雕刻，并饰有吉祥符和主人在旅途中收集的纪念品。大多数经过火烧或魔咒强化，坚硬如金属，因此可以在与锋利武器的战斗中使用，而无需担心断裂。它们被赋予了美丽和实用的双重价值。"
 artifact_basilisk_stone_name: "蛇怪石"
 artifact_basilisk_stone_description: "不幸的是，大多数人并不欣赏诺克的言语习惯，尽管诺克可能对这样的严厉评判表示不满，但他们也明白有时候需要保持沉默，而这可能是困难的。因此，在王庭上或在尘世间谋生时，巴塞利斯克石是无价之宝。尽管疱舌吉尔粉碎了最初也是最伟大的这些宝藏，但原始碎片仍然保留着一些拜扎梅达斯的古老魔力。"
 artifact_goblin_lantern_name: "哥布林提灯"
 artifact_goblin_lantern_description: "这灯笼在诺克的矿山中很常见。它能发出两种不同的光芒。第一种光芒对所有戚族都可见，但只要转动一个旋钮，诺克就能使其仅对其他诺克可见。"
 artifact_goblin_parchment_name: "哥布林羊皮纸"
 artifact_goblin_parchment_description: "哥布林羊皮纸是仙族和诺克发送秘密信息，尤其是威胁信息的首选媒介。哥布林羊皮纸上的文字只有收信人才能看到，并且纸张在被阅读后会立即燃烧。它还能防止一切复制信息的企图，即使是其他诺克或斯珞俄的文字蜘蛛。"
 artifact_goblin_shoes_name: "哥布林鞋"
 artifact_goblin_shoes_description: "诺克用一种白色的地下蠕虫奇魅的皮制作了这双鞋。它几乎可以覆盖任何大小的脚，让穿着者的脚步声几乎完全听不见。"
 artifact_razor_claws_name: "剃刀爪"
 artifact_razor_claws_description: "剃刀爪是红帽子最畅销的武器。这种特制的手套里藏有残忍的雕刻的小刀片，刀片延伸到指关节之外，按下隐藏在手套掌心的按钮就能延长刀片的长度。"
 artifact_goblin_bow_name: "哥布林连弩"
 artifact_goblin_bow_description: "这是一种连发弩，金属夹中装有六枚弩箭。每次射击时，弓弦都会推进弹夹，因此使用者可以进行多次射击，而无需停下来重新装弹。"
 artifact_goblin_cloak_name: "哥布林斗篷"
 artifact_goblin_cloak_description: "哥布林斗篷上镶嵌着黑色水晶，能使穿戴者周围的光线发生弯曲。"
 artifact_pendulum_name: "摆锤"
 artifact_pendulum_description: "这珍宝是一个空心金属小球，连接着一条银链。只要将任何一种金属放入球内，摆锤就会将使用者引向最近的矿藏。如果该地区没有，使用者可以在地图上搜索，摆锤就会在最近的矿藏大致区域上空盘旋。"
 artifact_universal_solvent_name: "万能溶剂"
 artifact_universal_solvent_description: "万能溶剂是诺克研究奇魅炼金术的成果，是这门学科最伟大（也是最稀有）的产品。该溶剂是一种二元化合物；炼金术师必须将其各部分分别装在两个瓶子里（通常是一黑一白）。炼金术师将两种成分混合后，就会产生一团浓稠的纯粹板讷之云，溶解所经之处的一切虚幻之物，包括换生灵的妖精本相。"
 artifact_magical_crumbs_name: "魔法面包屑"
 artifact_magical_crumbs_description: "魔法面包屑是噗咔中常见的珍宝，据称来自德意志的黑森林。从地面沿着一条特殊的小路收集，如果噗咔迷路，它们就能带噗咔回家。大多数噗咔都拥有两块：一块留在出发点，另一块随身携带，作为气味。只要噗咔记得把一只留在家里，不把随身携带的那只弄丢，它们最终就能嗅到回家的路。很显然，朋友之间也可以分享这些气味，这样一旦他们走散了，噗咔就能找到对方。"
 artifact_cat_boots_name: "猫靴"
 artifact_cat_boots_description: "据说，许多年前，伦敦的一位鞋匠在一只猫被大狗咬伤后，救了它一命。鞋匠把猫照顾得很好，而作为交换，这只猫化身的噗咔也帮助了鞋匠。在一年零一天的时间里，鞋匠制作的每一双靴子都具有一种特殊的品质，能让其他人忽略穿靴子的人的存在。世界各地的换生灵纷纷前来购买靴子，鞋匠生意兴隆，富足快乐地退休了，而噗咔也最终走上了自己的道路。"
 artifact_balthazars_bracelets_name: "巴尔萨泽手镯"
 artifact_balthazars_bracelets_description: "如果不出意外的话，这些配套手镯的精致美感会让喜欢漂亮闪亮东西的噗咔们爱不释手。不过，佩戴它们还有一个非常独特的好处。戴在手腕上时，它们会自动收紧，平稳地套在换生灵的前臂上，从手腕一直旋转到肘部。如果妖精在手镯上敲一下，手镯就会与皮肤融为一体，变成乌黑的纹身，当噗咔变身动物形态时，纹身也会随之变形。在这种形态下，纹身就像动物皮肤上的标记。"
 artifact_cleopatras_wings_name: "克莉奥帕特拉之翼"
 artifact_cleopatras_wings_description: "这款造型优美、独一无二的吊坠上有一个蝴蝶配饰，吊坠悬挂在贴合颈部的宽金带上。蝴蝶翅膀由琥珀制成，靠近金色翅膀的部分呈绯红色，靠近翅膀尖的部分则呈温暖的橙色。戴上项链的换生灵将获得飞行能力，其方式与风行魔咒类似。妖精的背后会出现一对闪亮的无形翅膀。翅膀本身没有实体，也不会损坏。一旦换生灵摘下吊坠，翅膀就会消失。"
 artifact_osiris_flail_name: "奥西里斯的连枷"
 artifact_osiris_flail_description: "古埃及第一位法老奥西里斯有两个权力象征。其中之一是他的连枷，被刻画在他之后的许多法老的石棺上。连枷通常是由一个钩子交叉在死去国王的胸前。连枷是一根短柄棍，上面悬挂着三根皮条，皮条上装饰着木珠和骨头。据说，它的骨和木珠上的奇妙雕刻记录了所有的历史。要想获得它的渊博智慧，一个人只需提出一个问题，然后将手杖触碰眉心，答案马上就会出现。"
 artifact_grapes_of_wrath_name: "怒之葡萄"
 artifact_grapes_of_wrath_description: "葡萄完美无瑕，呈浓郁的深紫色。它们闪烁着诱人的光芒，让任何一个仔细观察的人都能感受到它们的梦华。吃过葡萄的人都会感到微微陶醉，开始变得无拘无束。他们吃得越多，就越无拘无束。不过，葡萄不含酒精，因此不会影响身体运动。"
 artifact_horn_of_hermes_name: "赫尔墨斯号角"
 artifact_horn_of_hermes_description: "这件黯淡褪色的珍宝由黄铜制成，看起来像一个螺旋波，或是一个巨大的号角。它的表面有麻点和带翼靴的徽章，这是赫耳墨斯的标志。赫耳墨斯是奥林匹斯哀怒庭妖精的信使，在凡人中被称为旅行者的守护神。他和狄俄尼索斯建立了友谊，在赫拉第二次企图杀害狄俄尼索斯后，赫耳墨斯将号角送给了他。"
 artifact_halcyon_halter_name: "神翠鸟吊带套"
 artifact_halcyon_halter_description: "神翠鸟是一种与翠鸟同名的鸟，冬至时在海面上筑巢，有抚平风浪的能力。这种鸟的传说起源于希腊，水手们将甜饼干扔进地中海以吸引它，然后在平静的海面上将它引到港口附近。这款吊带用鸟的羽毛装饰，在佩戴者的胸前划出交叉，穿过心脏的位置，那里最亮的羽毛格外显眼。"
 artifact_minoan_mosaic_name: "米诺斯马赛克"
 artifact_minoan_mosaic_description: "马赛克的源头可以追溯到古希腊。它涉及将彩色瓷砖片镶嵌在砂浆中，形成图案或装饰设计。米诺斯马赛克起源于克里特岛，在米诺斯国王统治时期诞生。根据传说，这珍宝展现的是一个没有面孔的人，直到一个换生灵凝视它很长一段时间。消耗一点梦华，妖精能在瓷砖间看到他们真爱的面孔浮现。纳西索斯凝视米诺斯马赛克时感到失望，因为他在那里找到的唯一图像是自己的面孔。他宣称马赛克是伪造品。然而，显然他被证明是错误的。"
 artifact_sands_of_time_name: "时之沙"
 artifact_sands_of_time_description: "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n这些沙子是从爱琴海上由200个希腊岛屿组成的基克拉泽斯群岛的海岸上一粒一粒收集起来的，具有特殊的疗效。一些羊人学者推测，这实际上是冲到岸边的亚特兰蒂斯的小碎片。随着几个世纪的流逝，这种沙子变得越来越稀少。"
 artifact_syrinx_name: "绪林克斯"
 artifact_syrinx_description: "独一无二的绪林克斯是第一把制作出来的笛子。许多戚族都听说过这珍宝，并对其出现感到恐惧，因为它能够激发那些听到它歌声的人内心无与伦比的激情。然而，由于它诞生于真爱之中，它并不像潘的恩赐那样引发普通的激情。相反，它会让那些悼念失去爱情的人更加深刻地感受到苦乐参半的痛苦，并促使那些真爱的人以他们心仪之人为目标，表达他们的情感。音乐加深了所有这些情感，并使它们永远凝固。当那个爱人们听到绪林克斯的音乐时，他们将永远爱着那个人，甚至可能超越生死。"
 artifact_inner_spinners_name: "体内纺工"
 artifact_inner_spinners_description: "阴森、爬行、黑暗而潮湿，体内纺工是复仇和折磨的工具。本质上，它们是用黑漆和发条打造的微小的奇魅蜘蛛。当它们被放置在目标受害者的房屋或睡眠区时，它们开始行动。一旦目标安然入睡，纺工们就会爬过他们的身体，然后钻入他们的耳朵、鼻子和鼻孔。它们在那里纺织出奇魅蛛网，如此密集而粘稠，以至于目标可能会窒息、噎住或暂时失聪。"
 artifact_gray_vines_name: "灰藤蔓"
 artifact_gray_vines_description: "#bold 在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]。#!\n灰藤蔓的颜色像雾一样，看上去是模仿野生植物的生长而编织成的巧妙图案。仔细一看，就会发现该马甲其实是由缠绕的带刺藤蔓编织而成的，且很幸运的保持不动。"
 artifact_gloves_of_night_name: "夜之手套"
 artifact_gloves_of_night_description: "虽然地底一族可以扭曲他们的身体以适应几乎任何裂缝或开口，但有时即使是最灵活的人也会因为一扇上了锁的门而停下来。对于这些时刻，夜之手套非常方便。通过消耗一点梦华，手套内部的肉体可以根据佩戴者的心愿变得液态或凝固。这使得佩戴者可以将手指改造成爪子、吸盘，甚至是锁匠工具。用户还可以选择变异手指的坚硬程度，使得肉质锁匙能够在不划伤的情况下转动锁芯。"
 artifact_wordspider_name: "文字蜘蛛"
 artifact_wordspider_description: "一只奇魅、机械、有条不紊地破解密码和发现秘密的生物。足够小，可以放在普通爬行者的手掌中，文字蜘蛛看起来像是由绿色和金色玻璃纺织而成。它的颚部异常长，仔细观察可以发现每只“脚”上有细长的突起。"
 artifact_cold_light_name: "寒光"
 artifact_cold_light_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]或在[single_combat_duel_plural|E]中给予对手[GetModifier('cold_light_modifier').GetNameWithTooltip][modifier|E]。#!\n寒光是由一根泰坦冰柱雕刻而成的匕首，始终闪烁着令人毛骨悚然的蓝色光芒。它散发出强烈地寒冷，使周围的所有人都感到刺骨的寒意，除了它的持有者和他们的盟友（他们只会感到空气中弥漫着令人愉快的清爽）。根据指令，寒光还能增强其闪光强度，使所有站在它面前的人都睁不开眼睛。"
 artifact_brooch_of_the_true_suitor_name: "真命胸针"
 artifact_brooch_of_the_true_suitor_description: "这些是简单的金属胸针，除了其简约和精湛的工艺外，它们并不引起太多注意。然而，对于那些了解它们力量的人来说，在追求真爱的过程中，它们是无价的助手。如果真正的追求者在面对他们钟情的对象时佩戴一枚胸针，他们会显得比平常更加轻松自在。"
 artifact_highland_blade_name: "高地之刃"
 artifact_highland_blade_description: "这些附魔刀剑正日渐稀缺，因为它们的制造方法要么已经失传，要么是因为诺克们守口如瓶。其中最常见的是大剑，尽管还存在其他刀剑变种。只要使用者拥有至少一点梦华，他们就不会因地形而遭受任何不良影响。"
 artifact_rorys_bag_name: "罗里之袋"
 artifact_rorys_bag_description: "以红色罗里的名字命名，这些都是坚固结构的大型包袋，尽管颜色和结构可能有所不同。然而，每个包袋都足够大，可以容纳足够的食物和饮料，维持一个成年巨魔一天的生活所需。如果一位换生灵花费一点梦华，一份完整的旅行口粮将会出现。请注意，这些是真实的口粮，而不是奇魅的，因此能提供真正的营养。"
 artifact_shield_of_virtue_name: "美德之盾"
 artifact_shield_of_virtue_description: "这些又大又圆的盾牌是传说中的珍宝，目前已知的只有两块。据说这是孪生兄弟托瓦尔德和波尔的盾牌，每块盾牌都有一种力量，可以增强一个可敬的巨魔的意志，并在战斗中提供非凡的保护。只要巨魔信守他们的誓言和承诺，盾牌就会在战斗中没有重量，并提供额外的防御。"
 artifact_maul_of_thunder_name: "雷霆之锤"
 artifact_maul_of_thunder_description: "#bold 能够招募[GetMaA('electricity_elemental').GetName]作为[men_at_arms|E]。#!\n据说这把强大的巨锤是巨魔们在托尔的直接指示下精心打造的，以备托尔在失去妙尔尼尔时使用。据说它是所有巨魔武器中最强大的，甚至可能与大卫王的宝剑石中剑相当。传闻中它的能力包括：一跃就能跃过任何水体，一击就能夷平任何墙壁，指挥各种元素，据说每当它攻击时都会发出震耳欲聋的雷鸣声。"
 artifact_waystone_name: "路之石"
 artifact_waystone_description: "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n路之石是一颗深蓝色的蓝宝石，被赐予克鲁尔坎。它既是寻路器，也是定位器，可以将持有者带到他们需要去的地方，或找到他们需要找的人或物。它还有一个更深层次的用途，那就是它通常会引导人们找到自己的命运。"
 artifact_changestone_name: "变之石"
 artifact_changestone_description: "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n变之石是一颗火红的红宝石，被赐予羊人守护。它能改变持有者在凡间的外貌，并能改变环境，有时甚至会对周围的人造成伤害。不过，它真正的魔力在于它能让人变成真正的自己，恢复他们的妖精本性。有些人认为，宝石甚至可以逆转凡人的衰老过程。"
 artifact_shadowstone_name: "影之石"
 artifact_shadowstone_description: "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n影之石是一种黑色蛋白石，被委托给夏威夷的夜灵。它具有吸收和转化板讷的力量，能增强持有者在“影中”行动的能力，例如隐身或在黑暗中行动。当了解板讷与梦华之间真正相互作用的人使用时，这颗宝石可以净化换生灵，洗净他们身上所有的板讷，而不会产生导致悖廊的不幸副作用。在某些方面，它是四大宝石中最强大、最危险的一颗，除了最坚强的意志外，它不可避免地会让他们沉浸在板讷的严酷中，从而使他们堕落。它还会带来黑暗的梦境。"
 artifact_eye_of_opening_name: "钥之石"
 artifact_eye_of_opening_description: "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n钥之石，又称开启之眼，是一颗祖母绿宝石。它可以打开接触到的任何东西，无论该物体是被封闭还是被牢牢锁定和守护。它的威力足以打开通往其他界域的传送门，只要另一端没有被阻挡。不过，它真正的威力在于它能打开人们的心扉，揭开被锁住或遗忘的信息。它是记忆的激发器。"
 mount: "坐骑"
 artifact_slot_mount: "坐骑"
 artifact_ship: "船"
 artifact_ship_of_the_four_quarters_name: "四季之舟"
 artifact_ship_of_the_four_quarters_description: "#bold [umbra_sense|E]：$pod_grace_i$#P +20%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +100%#!#!\n四季之舟是古代妖精的至宝之一，外形酷似维京长船，并被元素妖赋予了控制五大元素的力量。杜伽尔世家的康纳负责监督这艘船的建造，而格威狄昂世家的基里亚·誓约者则前往伟大的缓慢帝国的领主们那里，与他们一一签订了援助协议。这艘船可以在水上自由航行，也可以在陆地上短暂航行，穿过岩石和树木，穿越空气，甚至穿越火焰。只要船长有贵胄血统，就只需一人掌舵。"
 artifact_warhorse_name: "[owner.Custom('WarhorseStoryName')]"
 artifact_warhorse_description: "一匹服从每一道命令的训练有素的战马。"
 artifact_animal: "动物"
 artifact_wolf_name: "狼"
 artifact_wolf_description: "自然界中很少有声音比狼的嚎叫更令人心寒。不知何故，它包含了人类对荒野的一切恐惧，也包含了我们所渴望的一切。"
 artifact_bear_name: "熊"
 artifact_bear_description: "熊用它粗壮的腿像人一样直立，它居住在寒冷、孤独的地方——邻水（和鱼）的茂密森林里。"
 artifact_lion_name: "狮"
 artifact_lion_description: "拥有金色外皮和长而饱满的鬃毛，狮子是一种宏伟的生物。"
 artifact_tiger_name: "虎"
 artifact_tiger_description: "这些美丽的动物巨大、圆滑、轻巧，在丛林的阴影中迅速移动，用它们的条纹进行潜伏。"
 artifact_blood_blade_name: "血刃"
 artifact_blood_blade_description: "由血制成的能造成更重伤害的武器。"
 artifact_goblin_sword_name: "精怪之剑"
 artifact_goblin_sword_description: "#bold 能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。#!\n一把火剑，可以伤害物质与灵体。"
 artifact_blade_of_stone_name: "石之神刃"
 artifact_blade_of_stone_description: "岩石化作的武器。"
 artifact_kohl_of_the_hawk_lord_name: "鹰神眼影"
 artifact_kohl_of_the_hawk_lord_description: "这罐永不褪色的眼影，是一种性感的眼妆，它汲取了一块消失已久的古代头巾的力量。佩戴者不会被太阳或火焰所眩晕或过热，他还能获得额外的社交优势。"
 artifact_screens_of_the_harem_name: "后宫帘幕"
 artifact_screens_of_the_harem_description: "这些印花壁挂借鉴了古代窗帘，这些窗帘画满了雅卢的美丽灵魂，他们组成了死去法老的后宫。它们被挂在会被看到的地方：在营地附近，在洗衣线上或在窗户上。任何看到它们的人都会立即看别的东西，而忘记他们来到这个地方或他们在那里的目的。木乃伊使用这些强大的法器来隐藏。"
 artifact_khopesh_of_balance_name: "平衡之镰形刀"
 artifact_khopesh_of_balance_description: "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n这法器是一把强大的治疗武器。一个木乃伊在对躺在[UmbraGlossaryLocalized('shadowlands','冥界')]的一把剑和一盒古老的治疗药膏进行尼菲什仪式时制造了它。当木乃伊花费生命力，向某人挥舞这把剑时，就能治愈他们身上的任何伤口。"
 artifact_ideograph_charm_description: "这些带有古代鬼书文字的象形文字的符咒，可能是由丝绸、玉石甚至是纸制成的；不过，玉石的保存效果最好。"
 artifact_fire_watch_charm_name: "防火符咒"
 artifact_fire_watch_charm_description: "$artifact_ideograph_charm_description$\n这符咒，放在物品上或房间内（不超过25英尺乘25英尺），可以阻挡火焰。当防火符咒生效时，普通的火会拒绝在此点燃，而抵抗魔法或超热（丙烷火炬等）的火的难度会降低。这个符咒只对无生命的物体有效。"
 artifact_harmony_charm_name: "和谐符咒"
 artifact_harmony_charm_description: "$artifact_ideograph_charm_description$\n只要吸血鬼保持冷静，没有威胁性或攻击性的言论或行动，所有在附近的人都必须使用意志力或心魔对吸血鬼采取攻击性的行动。"
 artifact_joss_charm_name: "气运符咒"
 artifact_joss_charm_description: "$artifact_ideograph_charm_description$\n气运符咒能将失败变为成功。"
 artifact_golden_talons_name: "金爪"
 artifact_golden_talons_description: "这10根金钉上有鬼书字样，适配大多数人的手指。激活后，钉子会僵化成钻石般的爪子。爪子能加重伤害，并降低攀爬的难度。"
 artifact_mandarin_mask_name: "上官面具"
 artifact_mandarin_mask_description: "[GetTrait('kueijin').GetName( GetPlayer )]上官使用这种无特征的玉面具来检查他们的牧群。激活后，[GetTrait('kueijin').GetName( GetNullCharacter )]可以指定一个他想伪装成的特定“种姓”的凡人。成功后，佩戴者会显现为一个相当不显眼的“种姓”（商人、乞丐、帮会打手，等等）的凡人。在使用过程中，吸血鬼的灵光看上去像是凡人的灵光；要发现[GetTrait('kueijin').GetName( GetNullCharacter )]的真实面目，旁观者必须使用适当的力量（气视，灵光感知等）。该面具不允许复制一个特定的人。"
 artifact_wayang_sash_name: "哇扬翁戏腰带"
 artifact_wayang_sash_description: "这条腰带是按照印尼服装的风格织成的。通过在腰带上注入两点阴气，吸血鬼可以使腰带化为生命，类似于哇扬皮影偶戏中的一种朦胧的龙形生物。这生物是有知觉的，可以与它的主人交流（以咝咝的低语），是一个优秀的间谍。它是绝对无声的，可以像变色龙一样与任何阴影融合。"
 artifact_star_shower_blade_name: "星雨手里剑"
 artifact_star_shower_blade_description: "这神奇的武器出现在日本[GetTrait('kueijin').GetName( GetNullCharacter )]的许多故事中。不过，在毗沙门中，只有少数英雄被称拥有这种武器。星雨手里剑是一种三刃武器；使用者将它握在中间，向受害者旋转。花费一点气，该武器可以被 充能。充能后，该武器可被抛出。当投掷时，武器会自动对准其目标。另外，当武器处于飞行状态时，持有者可以说出一个命令词，将武器分成三块碎片。这些碎片可以分别攻击相同或不同的目标。最重要的是，一旦投掷完毕（无论命中与否），武器（或其碎片）就会回旋到持有者的手中，并立即重新形成星雨手里剑。"
 artifact_soultaker_name: "狩魂"
 artifact_soultaker_description: "#bold 解锁$EXECUTION_SOULTAKER$[executions|E]。\n允许在需要花费决意时，首先花费存储在该决意容器中的决意。#!\n在天怒之战的血腥顶峰期锻造而出来，狩魂是一把邪秽而可怕的武器。一位恶魔——他的名字早已被遗忘——自愿将灵魂被束缚在黑色的金属中，在那里他可以对任何被剑触及的人使用这力量。剑的触碰将汲取它所伤害的任何人的能量和生命——如果它杀死了一位受害者，其的灵魂就会从其的尸体中被拉出来，囚禁在剑中，在那里被原来的恶魔折磨和吞食。凡人和天使都倒在了狩魂剑前，他们的信仰之力被撕碎，成为它的养料。\n然后，剑的持有者用它杀死了另一位恶魔，剑也随之改变。两个恶魔的灵魂在剑中争夺统治权，都无法获得优势。随着时间的推移，他们的灵魂开始相互渗透，化为了一个个体的分裂人格。随着战争中恶魔内讧越来越严重，更多的恶魔被吸入狩魂剑，他们的灵魂被吸收到一个单一的疯狂实体中——一个自称为军团的生命。狩魂剑在战争的最后几天遗失了，被落在一个被遗忘的武器库深处，由于没有新的受害者来吸收信仰之力，军团变得虚弱和消瘦。现在，它只想要食物——信仰之力——而且它将不惜一切代价再次吞噬新鲜的灵魂。"
 artifact_the_black_throne_of_genhinnom_name: "火狱黑王座"
 artifact_the_black_throne_of_genhinnom_description: "这个由路西法创造的由黑曜石和硫磺组成的宝座，在天怒之战时期坐落在火狱城的黑大教堂的中心。在这个宝座上，路西法指挥着他的军团，与他的将军们协商，并为人类的命运和耶洛因的堕天哭泣。在叛军被送入地狱后，火狱城被天使摧毁了，但如此强大、如此美丽的城市永远不可能被完全摧毁。黑大教堂的一部分仍然存在于现实的不同层面，黑王座，那20英尺高的指挥官之椅，仍然可以找到。\n该宝座是一把巨大的座椅，由石头和金属制成。它坐起来非常不舒服，但这是你为权力必须付出的代价——而这个宝座是强大的。它允许坐在座椅上的恶魔指挥追随者军团——数百或数千名忠诚的凡人，他们几乎会为你做任何事。"
 artifact_soulforge_name: "灵魂锻炉"
 artifact_soulforge_description: "#bold 作为[character_interaction|E]，允许你献祭恶魔来消灭目标王国境内的所有人#!\n灵魂锻炉是一个由铜和其他金属组成的大型、华丽的角形笼子，每个表面都刻有无法再翻译的符文和符号。笼子的内部有钩子和钉子，而四个宽大的、盘绕的凸缘从顶部辐射出来。\n这个可怕的装置是由鬼匠沙登科吉制作的，他是死亡和发明的大师，是天怒时代乌木军团的伟大遗器制造者之一。它可以让使用者随心所欲地屠杀数百名凡人。这些死者的灵魂可以被收集起来，并被奴役在恶魔的遗器中。"
 artifact_yin_artifact_name: "阴化[newly_created_artifact.GetNameNoTooltip]"
 artifact_javaniel_key_name: "贾瓦尼尔之钥"
 artifact_javaniel_key_description: "#bold 这是把钥匙，大概能解锁什么……#!\n这似乎是一个小小的、古老的、翻译盘。不过它应该翻译什么还不清楚，因为上面只能读出“贾瓦尼尔”这名字。"
 artifact_javaniel_journal_name: "贾瓦尼尔日志"
 artifact_javaniel_journal_description: "#bold 若能开启，解锁独特事件。#!\n一本圆形的小册子，它的封面似乎是由两片薄薄的琥珀制成的，有多种内含物，使它看起来有一种斑驳的感觉。它们包裹着几页压过的黄金。唯一容易阅读的部分是在第一页：#X “我是钥匙。在我双胞胎的心中，我将揭示真相。我们父亲的谎言将不再困住我们。所有的人现在都将知道隐藏在他美丽面孔背后的黑色腐烂。阅读他的背叛，为我们所有人哭泣吧。”#!"
 artifact_ivory_tablets_name: "象牙碑板"
 artifact_ivory_tablets_description: "#bold 单独一片，没有任何作用，但是，如果与其他相结合，可能是某些东西的关键……#!\n一组古老的象牙片，似乎几乎不受损害。上面刻有一个用原始中国方言写成的故事，但它本身并没有什么意义，好像缺少一把钥匙来真正理解它。"
 artifact_dawn_amulet_name: "黎明护符"
 artifact_dawn_amulet_description: "一块小型的玉石护身符，由致力于将瞾喇绳之以法的$pod_wan_kuei$世系使用。它可以为不死族遮挡数分钟的阳光。"
 artifact_accursed_dust_name: "受诅尘埃"
 artifact_accursed_dust_description: "哈基姆圣裔制造的一种炼金毒药。摄入后，受害者很快就会陷入瘫痪状态。"
 artifact_ancestor_talisman_name: "先祖护身符"
 artifact_ancestor_talisman_description: "#bold 免疫大多数精神能力。#!\n一个铸成阿拉伯文哈基姆名字的金吊坠。现存的这吊坠只有四个，据说它们能使佩戴者不辜负哈基姆的名誉，同时保护他们免受可能使他们偏离心路的邪恶魔法的影响。"
 artifact_arrows_vengeance_name: "复仇之箭"
 artifact_arrows_vengeance_description: "这五支箭由山楂木制成，箭尖经过火的淬炼，被施以魔法，总是能找到敌人的心脏。"
 artifact_book_grave_war_name: "墓战之书"
 artifact_book_grave_war_description: "这是一本在德语、古希腊语和米诺斯语之间交替书写的奇怪的书，这本书的外表并不显眼，看起来是一本质量很差的插图手稿。\n该书分为七大节。每一节在长度和结构上有很大的不同，有些完全是诗的形式。其他章节部分是诗，部分是散文，而其他章节则完全是散文。每一节涵盖了世界历史上的一个时代，并描述了该时期的千年圣战。"
 artifact_khazar_diary_name: "可萨日记"
 artifact_khazar_diary_description: "据传，可萨日记显然是由一个犹太人在当今时代开始时撰写的，其中包含一种仪式，可以消除物质世界和[UmbraGlossaryLocalized('shadowlands','冥界')]的界限。"
 artifact_camilla_crown_name: "卡米拉的桂冠"
 artifact_camilla_crown_description: "作为自该隐以来政治上最强大的吸血鬼的王冠，卡米拉的桂冠已经随着时间的推移而枯萎，但仍然有力地提醒着人们一个真正的梵卓领导时代。"
 artifact_final_day_name: "终末之日编年史"
 artifact_final_day_description: "法老埃赫那吞和他废除黑夜的企图的纪实。在一群强大的术师的帮助下，他几乎成功了，直到赛特信徒和奥西里斯之子之间的一个不太可能的联盟阻止了他。"
 artifact_testament_seterpenre_name: "赛特彭雷遗嘱"
 artifact_testament_seterpenre_description: "一部以赛特之子视角描述亚历山大大帝故事的编年史。声称他是神话中的赛特的儿子，他的征服为赛特信徒们带来了一个荣耀的时代，这是他们此后从未见过的。"
 artifact_travels_fedoso_name: "冯达索游记"
 artifact_travels_fedoso_description: "这本书由赫耳墨斯秘会的一名魔法师所写，讲述了一个漫长而艰辛的攀登到一个神秘山顶，但最终获得了究极回报的事。许多睿魔尔把这本书当作寓言，他们认为这本书反映了他们自己在氏族的金字塔阶级制度中的地位。"
 artifact_coin_muhammad_name: "穆罕默德金币"
 artifact_coin_muhammad_description: "这枚硬币由萨拉赫·丁赠予唯一配得上的人，一个后来成为伊本·贾法尔的乞丐男孩，它闪耀着一种超凡的光泽。众所周知，它能加强拥有它的人的真信，但它本身并不能授予[true_faith|E]，也许是作为一种考验，永远只能由有资格的人挥舞。"
 artifact_baizetu_fragment_name: "白泽图的残片"
 artifact_baizetu_fragment_description: "#bold 需要五块碎片来拼凑整本。#!\n一本传说中的宝图，其作者不是别人，正是神一样的黄帝，据说它包含了所有11520种超自然生物的秘密。\n有了完整的书，人们就会知道他们的敌人的每一个力量和弱点，有了这智慧，其将变得战无不胜。"
 artifact_ice_artifact_name: "冰制[newly_created_artifact.GetNameNoTooltip]"
 artifact_set_phallus_name: "赛特的阴茎"
 artifact_set_phallus_description: "赛特与荷鲁斯和伊西斯的战斗顶峰中，在姆塞塔庄园里留下的木乃伊化遗骸。虽然他最后取得了胜利，但这位埃及神还是在这里失去了自己的一部分，直到今天，姆塞塔仍然用它来保护和祝福他的家庭。"
 artifact_fragment_code_samiel_name: "萨麦尔圣书残卷"
 artifact_fragment_code_samiel_description: "#bold 圣书能够在找回两个残卷后被重组。#!\n殉道者的创始人萨麦尔是扫罗的武者一系中最伟大的，据说他亲手写下了这篇文书。根据传说，在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了圣书，以及圣书中新武者获取力量和血化所必需的适当仪式。\n该文本的一个副本在扫罗死后的黑暗日子里被打碎了。这是该书的残卷之一。"
 artifact_scroll_enlightenment_name: "启蒙卷轴"
 artifact_scroll_enlightenment_description: "一个长者三人组曾经与一些开悟的生命会面，从西藏僧侣、土著智者、强大的法师甚至是狼人长老。这些谈话和他们的假想被记录在成系列的十三个卷轴上，这些卷轴至今仍是一个名为启蒙密教的火焚末日教派的基础。"
 artifact_book_hidden_stars_name: "隐星之书"
 artifact_book_hidden_stars_description: "在巴比伦最强大的时候，一帮占卜师术士发现了一种可以看到隐藏的星星的方法，并通过这种方法大大增加了他们的力量和寿命。他们把自己的成果写在七块石板上，后来被波斯国王居鲁士洗劫一空。他的一位宫廷学者设法将这些石板誊写成书，然后将其销毁并逃离波斯。这随后转到君士坦丁堡，最后转到突尼斯，有人怀疑这本书仍在那里。"
 artifact_nightmare_horse_name: "梦魇"
 artifact_nightmare_horse_description: "弗拉基米尔·罗斯托维奇的山地马，这匹可怕的马在许多战役中伴随着他的主人。"
 artifact_sorn_name: "索恩"
 artifact_sorn_description: "索恩是一匹参杂着一点金白的黑马，是一匹平静而温顺的马。但一旦被逼急了，据说它也将是西欧最快的马。"
 artifact_vozhd_palanquin_name: "战王轿子"
 artifact_vozhd_palanquin_description: "科班乘着用骨雕的，镶嵌着精致金丝纹路的轿子去作战。精美的阿拉伯马马头构成了扶手。只有当它们安静地鸣叫，轿子站立起来时，人们才会意识到它实际上是一个完全由驼兽组成的战王血仆。\n没人感到意外，科班并不真正相信“低调”和血之缄默等概念。"
 artifact_somber_axe_name: "昏暗之斧"
 artifact_somber_axe_description: "#bold 能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。#!\n在天堂之战使用的所有武器之中，昏暗之斧最让人畏惧，其中的两柄被摧毁，剩余的四柄已经遗失或者损毁——现在的力量至多只能在人类面前耀武扬威，这是剩下两柄中的一柄。它的威能和当初第一次杀死天使时一样可怖。"
 artifact_bow_of_yi_name: "后羿弓"
 artifact_bow_of_yi_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。#!\n这把神射手的弓，从表面上看，相当普通。它的设计很优雅，而且经受了数个世纪的考验，但它没有什么值得一看的地方。它已经有数个世纪没有出现过了，但在[GetTrait('shih').GetName( GetPlayer )]中流传着它定期现世的传说。据说，这把古弓很结实，需要很大的力量来拉动和瞄准，但一旦箭离开了手，它总是能飞得很准——几乎就像羿本人在引导箭矢一样。某些传说称，从弓上射出的箭会让天空充满了太阳的光辉，但只有在遇到真正邪恶和强大的吸血鬼时才会如此。"
 artifact_staff_of_shing_tse_lee_name: "李成哲手杖"
 artifact_staff_of_shing_tse_lee_description: "#bold 能够监禁，处决或在[single_combat_duel_plural|E]中通过物理招式伤害灵体。\n在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是[GetTrait('kueijin').GetName( GetPlayer )]）。#!\n李成哲是最早离开天军的真正的[GetTrait('shih').GetName( GetPlayer )]之一。他只带了一块馒头、一本特别有启发性的鬼书手稿，以及他用昆仑堡垒附近的一棵树雕刻的手杖。馒头被吃掉了，手稿也丢了，但手杖——一根粗壮的手杖，上面安装着数个圆环——却一直保留着。\n李成哲的手杖是一个坚固的武器，但对饿殍来说，它是毁灭性的。手杖的每一击都能窃取他们的精华，将鬼魂的一部分永远地扯走，让鬼魂陷入永恒的痛苦之中。某些故事声称，该手杖已经吞下了数以千计的不眠鬼魂，尽管没有证据。关于李成哲的一个最古老的传说声称，在昆仑从地球上消失后不久，他曾经愤怒地使用过他的手杖。传说中，李成哲用手杖打倒了一位阎魔——皮鞭王，也就是鞭挞地狱的王——此后就再也没有听说过他的消息。"
 artifact_sword_of_shu_mo_pan_name: "潘书墨之剑"
 artifact_sword_of_shu_mo_pan_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是[GetTraitGroup('shapeshifter').GetName()]）。#!\n潘书墨是羿的曾孙女，也是[GetTrait('shih').GetName( GetPlayer )]中最优秀的战士之一。根据大多数传说，她在死于虎人之手之前，已经活到了不寻常的97岁。她所携带的剑在她与变化妖怪的战斗中经常被使用。\n潘书墨的剑能保护其持有者免受变化妖怪的攻击，以惊人的速度变动以阻挡攻击。这把剑还能更深地切入化形种族的肉体，造成更重地伤害。"
 artifact_the_alexiad_name: "阿莱克修斯传"
 artifact_the_alexiad_description: "阿莱克修斯传是阿莱克修斯一世皇帝的女儿拜占庭历史学家和公主安娜·科穆宁娜写的历史和传记文本。在书中，她描述了拜占庭帝国在她父亲统治期间的历史。它记录了拜占庭帝国与第一次十字军东征的合作以及他们对西方的看法。"
 historical_unique_artifact_tt: "该宝物是独特宝物！"
 summoned_artifact_tt: "该宝物是召唤物！"
 artifact_ananata_name: "阿难陀"
 artifact_ananata_description: "#bold 每级[rarity|E]使进入[umbra|E]花费：[gold_i]#P -25%#!\n每级[rarity|E]使[umbra_sense|E]：$pod_grace_i$#P +5%#!\n每级[rarity|E]使[umbra_aptitude|E]：$pod_grace_i$#P +25%#!#!\n阿难陀是[umbra|E]中的口袋界域，娜迦将其用作避难所，其作用与芭丝特的巢域类似。每个阿难陀都是独一无二的，是创造它的娜迦的一部分，但一个蛇巢也可以通过一些仪式共享同个阿难陀。与巢域不同，阿难陀可以随身携带，但一次只能携带一个。一般要通过淡水源才能进入。"
 artifact_dragon_jade_name: "龙玉"
 artifact_dragon_jade_description: "#bold 允许在需要花费气时，首先花费存储在该气容器中的气。#!\n该颜色的玉代表木元素。它通常被雕刻成花卉或森林动物的形状。"
 artifact_feng_jade_name: "凤玉"
 artifact_feng_jade_description: "#bold 允许在需要花费气时，首先花费存储在该气容器中的气。#!\n这是火玉，代表阳气。它通常被雕刻成火的形状或凤凰的形象。它也有可能保持原形，很少雕刻。"
 artifact_tiger_jade_name: "虎玉"
 artifact_tiger_jade_description: "#bold 允许在需要花费气时，首先花费存储在该气容器中的气。#!\n代表金元素。它经常被雕刻成与武术相关的造型，是武器鞍柄的常用装饰品。"
 artifact_tortoise_jade_name: "龟玉"
 artifact_tortoise_jade_description: "#bold 允许在需要花费气时，首先花费存储在该气容器中的气。#!\n该玉石属阴。工匠通常将其雕刻成水滴形或水中生物的形状。"
 artifact_mandarin_jade_name: "官玉"
 artifact_mandarin_jade_description: "#bold 允许在需要花费气时，首先花费存储在该气容器中的气。#!\n这种玉代表大地，质地均衡，最为珍贵。它通常被雕刻成高贵的瑞兽或王权的象征，如扇子或权杖。"
 possessed_artifact_tt: "该宝物已被附体！"
 artifact_glamour_vessel_name: "梦华容器"
 artifact_glamour_vessel_description: "#bold 允许在需要花费梦华时，首先花费存储在该梦华容器中的梦华。#!\n在诺克的俗语中，FUBAR是“糟到没法想（Fucked Up Beyond All Recognition）”的首字母缩写；一类糟糕的错误。也是一类鬼火（一种电属或火属奇魅），用于为诺克的奇魅发明提供动力。"
 artifact_pathos_vessel_name: "执念容器"
 artifact_pathos_vessel_description: "#bold 允许在需要花费执念时，首先花费存储在该执念容器中的执念。#!\n一个能够存储执念以备后用的遗物。"
 artifact_blood_vessel_name: "可憎血杯"
 artifact_blood_vessel_description: "#bold 允许在需要花费精血时，首先花费存储在该精血容器中的精血。#!\n这憎恶的造物是一为棘秘魑塑肉师的变态杰作，它被迫永久痛苦地为受诅者服务。当你杀死敌人时，杯会充满鲜血。饮用该杯，就获得其储存的精血。"
 artifact_thornstick_name: "荆棘棍"
 artifact_thornstick_description: "[UmbraGlossaryLocalized('shadowlands','冥界')]里散落着成千上万的遗器。这些源自于任何一种特别受主人喜爱且用于恶意行为的棍棒，在遗器形态，这些暴乱警棍和夜勤警棍上的末端会长出厚厚的锋利尖刺。"
 artifact_old_glory_name: "古老荣耀"
 artifact_old_glory_description: "一面破旧的战旗，古老荣耀不展现某个国家或政治运动的颜色。相反，它不断循环，一刻钟是内战团旗，下一刻是三色旗，再下一刻是海盗旗。据说它从未展示过相同的旗帜，尽管当它展开时，任何看见的人都会分散注意力。"
 artifact_sweeneys_pride_name: "疯狂理发师的骄傲"
 artifact_sweeneys_pride_description: "这把谦逊的剃刀，带着精细磨砺的刀刃和镶嵌着珍珠母的橡木手柄，看起来相当无害。然而，在它存在的三个世纪里，它夺去了比据传言所说的更多死灵的性命。从手到手，从主人到主人传承，这把讽刺地被称为疯狂理发师的骄傲的剃刀，在使用它时赋予持有者额外的力量。"
 artifact_emperors_nightingale_name: "帝皇的夜莺"
 artifact_emperors_nightingale_description: "这只精巧制作的发条鸟可以追溯到雅典的辉煌时代，它已经被彻底而反复地改造过。现在它身上镶嵌着珍贵宝石为外衣，其关节也经过了无数次的改进，同时它还获得了一种非常特殊的力量。也就是说，拥有这只发条鸟的人可以注入执念，并低声呢喃着想要找到的某个事物、某个地方或某个人的名字。鸟儿会立即飞起，朝着所要求的目标飞去。它飞行速度缓慢，但稳定而不间断，以便其主人可以跟随，尽管使用这只发条鸟的人必须做好艰难旅行的准备。这只鸟会不惜一切地去找到目标，无论是在[UmbraGlossaryLocalized('shadowlands','冥界')]的尽头，还是在[UmbraGlossary('far_shore')]或[UmbraGlossary('pod_realm_labyrinth')]的中心。"
 artifact_bell_of_summoning_name: "召唤之钟"
 artifact_bell_of_summoning_description: "这件物品从玉之帝国进口，它看起来像一个小玉铃和锤子。死灵可以选择将尽可能多的执念投入到铃中。此后，每当敲响铃声时，任何仍然在铃中投入了执念的死灵都能听到召唤并立即回应，对铃的位置了如指掌。"
 artifact_masks_name: "面具"
 artifact_masks_description: "大多数面具都象征着佩戴者所属的司。只要戴着对应某位大统领的面具，哪怕是最为邋遢的乌合之众也能获得周遭对于该司应有的尊重。因此，盗窃和仿冒面具一直是门炙手可热的灰色生意。一只质量上乘的仿造面具足以让死灵进入影堡，但能否从中离开就又是另一回事了。"
 artifact_instant_nihil_name: "即用虚洞"
 artifact_instant_nihil_description: "即用虚洞是犯罪分子、叛逆和在偏远哨站的军团成员中的最爱，它们看起来像装满墨水的玻璃瓶。它们很脆弱，必须小心处理，以免破碎，但一旦被激活（也就是说被打破），在一个回合内它们会产生一个六英尺宽的[GetModifier('nihil_modifier').GetNameWithTooltip]。一个紧紧追赶即用虚洞使用者的死灵可能会掉进去并陷入[UmbraGlossary('pod_realm_tempest')]。相反，一个陷入困境的非导航者可能会使用它来帮助他从困境中逃脱。"
 artifact_redeyes_name: "赤眼"
 artifact_redeyes_description: "#bold [umbra_sense|E]：$pod_grace_i$#P +2%#!#!\n赤眼是一对装在遗器玻璃球中的魂火火炬，它发出的光芒可以透过大风暴的泡沫和波涛在一英里外看到。每套赤眼的额定寿命为一整年，在大风暴中巡逻的每个军团士兵至少携带一套。当释放到[UmbraGlossary('pod_realm_tempest')]中时，一组赤眼会在原地徘徊，直到驱动灯笼的魂火晶体烧尽。赤眼可用于标记被派遣到大风暴中的死灵、搜救队和远离旁路的工作小组的巡逻路线。"
 artifact_scribblers_pen_name: "书写者之笔"
 artifact_scribblers_pen_description: "来自努德里的礼物，赐予大图书馆的守护者，书写者之笔让死灵能够记录那些本说不出的文字。经过训练，死灵可以使用这支笔书写执念或惧念，将其转化为闪烁银色或墨黑色的文字，永远不显干涸。"
 artifact_soulfire_mask_name: "魂火面具"
 artifact_soulfire_mask_description: "大多数面具都只作为某种象征和符号存在，但总有少数例外。某些冥秩成员将实用的功效与他们身份的象征——面具相结合，将之设计为一种致命的武器，这一作风主要流传在上级冥秩成员当中。他们将魂火水晶排列并镶嵌在面具上，只需激活便可喷出炙烧的火焰之舌。或者，其也可以激发为一道足以吸收伤害、守护物主的灼热灵光之环。"
 artifact_soulfire_lantern_name: "魂火提灯"
 artifact_soulfire_lantern_description: "这盏提灯的功效并非照明，而是将持有者笼罩在一团暗影中，将其隐藏起来。提灯的光源是一枚约10执念的魂火碎片。当持有者激活水晶时，其中储存的执念将被逐渐消耗，同时令提灯和持有者的身形消失在周遭的视线中。当并未激活时，这种提灯有着微弱的、闪烁的星星之光，奇怪地与尸幕上的光芒类似。"
 artifact_star_of_the_east_name: "东方之星"
 artifact_star_of_the_east_description: "东方之星看起来就像是用蔗糖纺制而成的圣诞树装饰品，它被一些人认为是一种古怪的装饰，而对于其他人来说则是一种救命的工具。当不活跃时，它会围绕着主人的头部维持着不规则的轨道。然而，一旦被激活，星星立即飞向死灵面临的最紧迫的危险方向。如果威胁在10码以内，星星会停留在上方。否则，在需要重新充能之前，它会在威胁的方向上保持一个小时的位置，或者返回到正常的轨道上。"
 artifact_candelabra_of_souls_name: "灵魂烛台"
 artifact_candelabra_of_souls_description: "尽管正如广泛流传的那般邪恶，但这类烛台似乎也是一件高雅的抛光黄铜雕塑。每只烛台都有九根枝，每根枝上都有数量不一的臂，而每支臂的末端都能够安置一根粗大的蜡烛，或者说是一只被做成蜡烛形状，正在痛苦燃烧的死灵。"
 artifact_stygian_steel_armor_name: "冥河铁甲"
 artifact_stygian_steel_armor_description: "不多人能够拥有这样的珍品。这套盔甲装饰华丽，常常镶有纹章和其他看似无用的元素，但实际上非常实用。每一套都不同，从古希腊重装步兵盔甲到完整的中世纪板甲。重要的是，在每种情况下，穿戴者的躯干都得到了保护。"
 artifact_stygian_wall_flies_name: "冥河墙蝇"
 artifact_stygian_wall_flies_description: "作为信使和间谍，这些巧妙制作的[skinlands|E]昆虫可以在现实的任何层面（冥河城或[UmbraGlossary('shadowlands')]）观察和报告，只有眼力敏锐的死灵才能发现它们。通过消耗执念，苍蝇的主人可以透过它的眼睛观察，无论它离多远。消耗更多，还可以听到声音；消耗再多，可以通过它说话。"
 artifact_living_chains_name: "活锁链"
 artifact_living_chains_description: "这类链条由冥钢而非灵钢制成，因此并非用于监禁他物。与之相反的是，它们赋予佩戴者以力量。在被激活之后，链条就会自动固定在使用者的背部，并给予严重的创伤（在链条解绑之前，这种伤害是无法治愈的）；而剩余的铁环便会佩戴在使用者身上，其攻防效果相当于一整套灵钢铸成的盔甲和攻击性武器。此外，链条可以根据使用者的意志指挥，攻击范围在20英尺内的单独目标。"
 artifact_fetterguard_name: "羁绊守护"
 artifact_fetterguard_description: "世上很少有遗物比羁绊守护更为珍贵，或者说更危险。它看起来不过是一枚灵钢铸成的小盒子，里面装着物主的$pod_Fetters$的微缩版代表物。每一枚盒子都必须由死灵自己制作——但无论方法是锻造厂加工、手工打磨，还是仅仅将在[UmbraGlossaryLocalized('shadowlands','冥界')]中找到的零碎拼合，实际上都没有什么区别。只要羁绊的象征安全地呆在盒子里，现实世界的对应物就不会受到伤害，即使是超自然力量，也会在尝试破坏的过程中以某种方式出现纰漏。"
 artifact_beasthide_name: "兽皮"
 artifact_beasthide_description: "兽皮，正如其名，是一块从灵质体或其他类似野兽肉体上剥下，晒干鞣制后的皮肤。这块兽皮粗粝而带有鳞片，呈现出一种有毒的绿色，但它确实有一种令人钦佩的特性：用兽皮来打磨一件遗物或一柄冥钢刀刃时，可以令后者的耐久与韧性变得超出以往。这种效果会持续到战斗结束之后。一块典型的兽皮在变得破碎无用之前，可以重复使用十几次。"
 artifact_bloodwebs_name: "血网"
 artifact_bloodwebs_description: "#bold 允许在需要花费执念时，首先花费存储在该执念容器中的执念。#!\n努德里非常重视卡戎不能浪费任何东西的训诫，他创造的血网就是最好的证明。血网是由巨兽的血管和动脉形成的蓝黑色网状物，可在10码范围内抛向目标。一旦被击中，它们就会缠住受害者，开始从他体内吸取执念之力。"
 artifact_shroudripper_gloves_name: "裂尸手套"
 artifact_shroudripper_gloves_description: "这些手套由最精良的灵质皮革制成，顶部点缀着精心收集的尸幕撕裂者的爪子，是对死灵武器库的致命强化。它们会将尸幕撕裂者的酸液渗入任何它们造成的伤口，使伤口在24小时内无法痊愈。"
 artifact_wail_tongue_name: "哀嚎之舌"
 artifact_wail_tongue_description: "据说，哀嚎之舌是导致努德里彻底决定不再制作皮肉宝物的原因。它是一小片灵质舌头，镶嵌着一张精细的冥河钢钢丝网。这种恶劣的装置必须由死灵自己放入口中，它会立即而痛苦地吞噬死灵自己的舌头。此外，死灵的言谈方式也会永久性地改变，变得更加刺耳、金属质感更强，往往令人毛骨悚然。"
 artifact_guardian_orb_name: "守护神球"
 artifact_guardian_orb_description: "这件宝物虽然笨重，但威力非凡。它是一个乳白色的沙滩球大小的眼球，完整地带有视神经，镶嵌在由冥河钢制成的薄圆形支架中。圆球的使用者佩戴一个较小的戒指，圆球会在使用者身后轻轻漂浮。圆球不仅让主人能够看到自己身后的事物，还能够在主人和任何来袭的投射攻击之间自行机动。圆球都会移动以拦截从纸飞机到狂奔的遗器战车的任何物体。"
 artifact_forgebait_name: "锻饵"
 artifact_forgebait_description: "锻饵看起来像一枚冥币。仔细观察会发现它是一件巧妙的伪造品，但大多数死灵没有理由怀疑它。锻饵会一直表现得像一枚冥币（发出呻吟声等），直到死灵试图用它来支付某物时。在那一刻，它会分解成一种恶臭的黏液。这种臭味会陪伴着潜在的买家一周，让所有经过的人都知道这是一位不可信任的死灵，他的硬币不可靠。"
 artifact_memory_net_name: "记忆捕网"
 artifact_memory_net_description: "#bold 更高概率在死涡冒险[umbra|E]行动中获得[artifact|E]。#!\n训练有素的怨灵经常能从[UmbraGlossary('pod_realm_tempest')]中拉出有用的漂浮物，但即使是最有天赋的怨灵，运气也参差不齐。不过，如果他们使用记忆捕网，就能提高胜算。据说记忆捕网是用被俘虏的类天使的头发和骨头制成的，它是一个由闪闪发光的丝线组成的金色网，连接着骨箍和杆状结构。仔细观察，整个结构疑似人类的手臂。骨箍开口的直径为三英尺，这是可以从海浪中捞起的东西的最大尺寸。"
 artifact_bean_nighe_caul_name: "洗衣鬼胎膜"
 artifact_bean_nighe_caul_description: "#bold 作为处决选项，允许你将对方的灵魂喂给胎膜来增强教育和属性。#!\n最令人厌恶的怨灵宝物之一就是被称为洗衣鬼胎膜的狰狞紧身衣。它是用各种死灵破烂不堪的面孔残骸制作而成的，其组成部分永远沉浸在痛苦的煎熬中。任何拥有胎膜的[GetTrait('spectre').GetName( GetNullCharacter )]都必须每周花费一点[Corpus|E]来喂养胎膜，否则胎膜就会开始自相残杀，直到什么都不剩。"
 artifact_bottle_of_fire_name: "火之瓶"
 artifact_bottle_of_fire_description: "一只矮胖的红玻璃瓶子，高四英寸，火之瓶表面看起来平凡无奇，直到黄铜瓶塞被取下，瓶子被颠倒过来。此时，一股炽热的液体从瓶子中涌出，并远离使用者。随着液体的流动，火焰会引发其经过的可燃物燃烧起来。当法师造成足够的破坏后，只需重新盖上瓶塞即可。"
 artifact_cauldron_of_spies_name: "间谍坩锅"
 artifact_cauldron_of_spies_description: "间谍坩锅是一件卓越的圣叶宝物。法师只需将釜中注满水，烧至沸腾状态，并念出正确的咒语，水中将会突然射出一群蝙蝠（如果是夜晚）或乌鸦（如果是白天）。这些动物与法师通过心灵感应相连，它们所见之物，她亦可见。这些生物的范围可达数英里，持续时间为12小时，之后它们会俯冲进最近、最深的阴影中消失（以免被追踪回创造它们的女巫身上）。"
 artifact_divine_staff_of_fortuitous_intervention_name: "幸运干预神杖"
 artifact_divine_staff_of_fortuitous_intervention_description: "这件防御宝物看起来只是一根由细腻白色木材雕刻而成的四英尺长的法杖。\n然而，在战斗中，这根幸运干预神杖能在法师手中旋转，阻挡、招架和偏转各种攻击和武器的火力，令人惊叹不已。"
 artifact_horn_of_distress_name: "危难号角"
 artifact_horn_of_distress_description: "这些号角只应在极度危急的时刻吹响。它们的外观因文化而异，常常带有制造者部族的标记。当成功启动时，一只危难号角会在10英里范围内向所有狼人发出警报，无论他们属于哪个部族。他们可以选择是否回应呼叫，但他们知道这只号角意味着“同族有难”。这些号角通常含有气、鹅、或孔雀之灵。"
 artifact_amulet_of_kinship_name: "亲情护符"
 artifact_amulet_of_kinship_description: "与其他兽嫡灵具不同的是，这个护身符并非由狼嫡携带者激活，而是由将护身符交给她的狼人激活。\n任何遇到佩戴这个护身符的族人的狼人都会立刻知道她不仅仅是族人，而是备受关注的族人。这个护身符并不立即要求帮助佩戴者，但大多数狼族都知道佩戴者至少应该得到公平对待。可悲的是，黑螺旋舞者也会认出佩戴者是狼嫡，可能会带来严重的后果。"
 artifact_klaive_hammer_name: "月刃锤"
 artifact_klaive_hammer_description: "#bold 灵具锻造将会有更好的产出。#!\n虽然只有狼族能够进行创造月刃所需的仪式，但一些技艺高超的狼嫡铁匠也能接受培训，锻造实际的武器，使其成为诸灵的容器。月刃锤是一种灵具，旨在帮助狼嫡打造一把完美的武器，以取悦能赋予力量的灵或诸灵。铁匠在使用锤打造月刃时必须消耗灵知。这种消耗是将月刃的银坚硬到与钢一样坚固的过程的一部分，使得月刃在战斗中比普通的银制武器更加可靠。"
 artifact_dream_spirit_bag_name: "梦灵包"
 artifact_dream_spirit_bag_description: "这个装饰袋布满了美丽的珠子，充满了沉睡之粉。当法师想让目标入睡时，他只需向目标吹散一把沉睡之粉。"
 artifact_great_sigil_pendant_name: "大秘徽吊坠"
 artifact_great_sigil_pendant_description: "赫尔墨斯家族的法师们经常与影族打交道，因此他们不得不开发出一些强有力的神器，以便在与诸灵打交道时占据上风。大秘徽吊坠是一个直径约三英寸的钢制圆盘，上面刻有复杂的魔法书字。"
 artifact_serpent_pen_name: "蛇笔"
 artifact_serpent_pen_description: "蛇笔是一种相对复杂的暗杀工具，用于对付那些防卫森严的人。这些宝物看起来像绿色或金色的笔，但除此之外，它们之间的差别很大。有的笔杆上有华丽的鳞片图案，有的则相对朴素。\n笔会以某种方式被塞进目标的口袋或包里。当目标忘了这支笔时，它就会变成一条剧毒的小蛇，趁目标熟睡时咬他一口。"
 artifact_spiritual_armor_name: "灵甲"
 artifact_spiritual_armor_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。#!\n战斗其实并不是天国颂歌的专长（尽管圣殿骑士和颂歌者一样可能使用这件宝物），但有些时候还是有必要的。法师若在出战前穿上这件细网甲，可以获得很多增益。"
 artifact_trance_drum_name: "入定之鼓"
 artifact_trance_drum_description: "入定之鼓主要由欢喜宗使用，使任何熟悉入定状态的人只需拍几拍就能进入其中。入定之鼓在敲击时产生一种空灵、共鸣而深沉愉悦的音调，有效地使人在演奏的同时轻松摆脱清醒意识。"
 artifact_restored_artifact_pieces_name: "宝物碎片+[newly_created_artifact.MakeScope.GetVariable('restored_artifact_piece_level').GetValue|0]"
 artifact_pieces_tt: "该宝物是宝物碎片！"
 artifact_warhorse_nostory_name: "马"
 artifact_clay_man_amulet_no_suffix_name: "泥人护符"
 artifact_clay_man_amulet_name: "泥人护符#Weak （[clay_man.MakeScope.GetVariable('clay_man_protection').GetValue|0]/5）#!"
 artifact_clay_man_amulet_description: "#bold 防止受伤。#!\n梦语者创造的最令人垂涎的护身符之一是泥人护符。泥人是一个小巧的、人形的、装饰华丽的泥土人偶，佩戴在脖子上的绳子上。任何想要获得泥人护符的保护效果的人，必须用自己的血液或精液涂抹它，使其与自己共鸣。一旦涂抹过，泥人就成为一种强大的保护护身符。接下来的五次角色受伤（佩戴护身符时），泥人会完全吸收伤势。这包括由身体战斗、毒药和魔法引起的伤口。每次受伤都会导致泥人的一个肢体化为尘土。在第五次也是最后一次受伤时，泥人的头颅崩溃，护身符也被摧毁。"
 clay_man_amulet_soaked_damage: "伤害转移"
 clay_man_amulet_soaked_damage_ct: "你对泥人护符保护了你免受伤害。"
 artifact_ebon_candles_of_manifest_nigrescence_name: "黑光乌烛"
 artifact_ebon_candles_of_manifest_nigrescence_description: "这些黑暗符咒最初是由一群虚无党结社创造的，他们希望保护自己的圣殿不被鬼鬼祟祟的间谍破坏。显黑的乌碳蜡烛点燃后有两个主要效果：它们会将目标区域的所有常规光源的亮度降低到标准亮度的四分之一，同时产生刺眼的灰光，加深并加厚目标区域的所有阴影，使阴影具有一定程度的可视性。饥饿的阴影会熄灭目标区域内的小火苗，包括火柴、香烟和其他蜡烛。"
 artifact_ginger_dragons_name: "姜龙"
 artifact_ginger_dragons_description: "这种嚼劲十足的龙形姜糖在各地都很少见，不过在中国似乎比较容易买到。它们通常装在玻璃纸袋中，每袋五颗，但单颗和每袋缺颗的姜糖比满袋的更为常见。满袋的姜龙是稀世珍宝。\n使用姜龙时，角色要把糖果塞进嘴里并开始咀嚼。接下来，角色就可以喷火了。"
 artifact_salvation_bell_name: "救赎之钟"
 artifact_salvation_bell_description: "这些小铜铃形状的护身符可以在夜间保护使用者免受伤害。当敲响救赎之钟时，它会散发出温暖的金色光芒。一旦钟开始发光，敲钟人就会开始祈祷、吟唱或歌唱，与钟声和谐一致。只要祈祷持续进行，钟声就不会消失，敲钟人的敌人也无法靠近她10英尺以内。此外，每与钟声和鸣一次，保护半径就会增加 10 英尺。如果敲钟人试图做吟唱以外的任何事情（如行走、阅读），咒语就会被打破，钟也会破裂。"
 artifact_seeds_of_decay_name: "腐朽之种"
 artifact_seeds_of_decay_description: "#bold 在[combat_phase|E]中（作为[commander|E]时）给予敌方[knights|E]和[commanders|E]或在[single_combat_duel_plural|E]中给予对手伤害（只要对方是[GetTrait('vampire').GetName( GetPlayer )]）。#!\n腐朽之种威力无穷且难以寻觅，它能让非自然之物回归自然的生命循环。这里的“非自然物”包括从机器到废铀再到吸血鬼的一切。一把种子就足以让12立方英尺的物质回归大地，无论它来自何方。"
 artifact_astral_tiki_name: "星界提基像"
 artifact_astral_tiki_description: "#bold 本地险棘等级：$pod_grace_i$#P -2#!#!\n星界提基（有时也叫幽灵提基或灵体提基）由黑色硬木雕刻而成，用绿色玻璃或宝石做眼睛。最常见的种类是一个约一英尺高的独立蹲立人形。"
 artifact_beast_cloak_name: "野兽斗篷"
 artifact_beast_cloak_description: "#bold 允许变形为随机一种动物形态。#!\n野兽斗篷是人类已知的最古老的灵具之一，由大型动物的全身皮毛（包括头部）制成。穿上斗篷，把动物的头套在自己的头上，斗篷的穿戴者就会变成这种动物的形状。熊、公牛、大型猫科动物、狼和野牛是最常见的斗篷，但也有一些非常奇特的斗篷可以让人类变成鲨鱼、科莫多龙或大象。"
 artifact_sebastiannas_ghost_devouring_jack_o_lantern_name: "塞巴斯蒂安娜的噬鬼杰克灯"
 artifact_sebastiannas_ghost_devouring_jack_o_lantern_description: "#bold 最大束缚死灵数量：#P +1#!#!\n这虚无党的灵具实际上是灵具和符咒的混合体。噬鬼南瓜灯会吸走半径 30 英尺范围内的鬼魂（或其他灵体，如果法师特定制作的话），并将一直吸到它们被释放或南瓜腐烂为止。"
 artifact_lens_of_zadkiel_name: "萨基尔透镜"
 artifact_lens_of_zadkiel_description: "萨基尔是知识和理解之天使。以其名字命名的灵具是一枚直径六英寸的水晶透镜。透镜的周围刻有以以诺语书写的束缚公式。\n当法师透过萨基尔透镜观望时，他所见的一切都会由被束缚在水晶中的天使为他翻译出来。外语、高级加密，甚至狼人的灵文和浸染猎人的奇异标记，都如同白昼一般清晰明了。\n透镜还能穿透魔法幻象，揭示吸血鬼的虚幻术幻象，甚至能揭示最令人信服的全息图的真面目。"
 colorized_artifact_name_illustrious: "#ILLUSTRIOUSPURPLE [ROOT.Artifact.GetName]#!"
 colorized_artifact_name_famed: "#FAMEDBLUE [ROOT.Artifact.GetName]#!"
 colorized_artifact_name_masterwork: "#color_dark_green [ROOT.Artifact.GetName]#!"
 colorized_artifact_name_common: "#COMMONBROWN [ROOT.Artifact.GetName]#!"
 colorized_artifact_name_illustrious_notooltip: "#ILLUSTRIOUSPURPLE [ROOT.Artifact.GetNameNoTooltip]#!"
 colorized_artifact_name_famed_notooltip: "#FAMEDBLUE [ROOT.Artifact.GetNameNoTooltip]#!"
 colorized_artifact_name_masterwork_notooltip: "#color_dark_green [ROOT.Artifact.GetNameNoTooltip]#!"
 colorized_artifact_name_common_notooltip: "#COMMONBROWN [ROOT.Artifact.GetNameNoTooltip]#!"
 need_dream_religion_tt: "你必须拥有[GetFaithByKey('viaarchangeli').GetName]或[GetFaithByKey('codexoflegacies').GetName]信仰。"
 need_ashirra_haqim_religion_tt: "你必须拥有[GetReligionByKey('ashirra_religion').GetName]宗教或[GetFaithByKey('tariqelhaqim').GetName]信仰。"
 need_shapeshifter_large_tt: "你必须是[GetTrait('kinfolk').GetName( GetPlayer )]、[GetTraitGroup('shapeshifter').GetName()]、[GetTrait('abomination').GetName( GetPlayer )]或有[GetPerk('fomori_spirit_ties_perk').GetName( GetPlayer )][perk|E]。"
 artifact_dragon_name: "[owner.Custom('DragonStoryName')]"
 artifact_dragon_description: "龙是自然秩序无情的执行者。它实质上是地星之天灾——是地母对傲慢人类不满的神罚。一条巨龙体现了人类与自然的关系。在它闪亮的螺旋之中，我们找不到一个可以征服、分类和培养的自然秩序，而是必须平息的野性之怒，以确保生存。\n幸运的是，即使是这些可怕的生物也需要成长到来获得巨大的体型。找到一条小龙是一项罕见的壮举，但肯定比找到一条成年龙更可取。"
 artifact_animal_hide_name_dragon: "[owner.Custom('DragonStoryNamePossessive')]的毛皮"
 artifact_dog_name: "[owner.Custom('DogStoryName')]"
 artifact_dog_description: "一条忠诚的狗。"
 artifact_cat_name: "[owner.Custom('CatStoryName')]"
 artifact_cat_description: "一只猫咪。"
 artifact_unicorn_name: "[owner.Custom('UnicornStoryName')]"
 artifact_unicorn_description: "现代传说中，独角兽被描绘为一匹雄伟的雪白色、长鬃毛的马，拥有精致的特征——额头上长着一只象牙色的角。然而实际上，除了体型大小，独角兽与马几乎没有什么相似之处。这些有角的生物的体型和特征，尤其是他们大而深邃的眼睛，与鹿类相似。它们的尾巴长达数英尺，像狮子的尾巴一样，尖端有着毛茸茸的簇状物。覆盖着柔软的米白色毛发，独角兽的身体成流线型，适合高速奔跑。独角兽的锐利蹄爪类似于山羊，是令人敬畏的武器。"
 artifact_animal_hide_name_unicorn: "[owner.Custom('UnicornStoryNamePossessive')]毛皮"
 artifact_pegasus_name: "[owner.Custom('PegasusStoryName')]"
 artifact_pegasus_description: "如同翅膀所借鉴的宝石——蓝宝石、红宝石、翡翠和紫水晶——一样野性而自然，飞驰而来的飞马是一种稀有而珍贵的生物。它如同水银般在空中滑翔，阳光下闪耀着光芒，并以极高的灵活性执行复杂的动作。一对宽大的翅膀在飞行时从肩膀上展开，静止时则平稳地折叠在身体旁。如传说中那匹在赫利孔山巅裂开岩石、释放缪斯圣水的神驹，它的黑曜石般的蹄爪在地面上轰鸣着。"
 artifact_animal_hide_name_pegasus: "[owner.Custom('PegasusStoryNamePossessive')]毛皮"
 artifact_isis_fragments_name: "伊西斯残卷"
 artifact_isis_fragments_description: "埃及木乃伊起源的全面历史。虽然这本书可能是伊西斯本人所著，但大多数人认为这是由她的信徒整合的。"
 artifact_book_enoch_name: "以诺之书"
 artifact_book_enoch_description: "这本书是血族最古老、最黑暗的传承之一，也许比挪德之书还要古老——虽然谁又能确定这些事情呢——它包含了各种预言、传奇和传说，围绕着即将到来的大清算——末日。"
 artifact_rasail_safa_name: "精诚兄弟社书信集"
 artifact_rasail_safa_description: "这是一部包含52篇书信的巨型汇编，是10世纪伊拉克巴士拉的一群哲学神秘主义者所写，他们是一个被称为精诚兄弟会的组织。他们的深奥教义和哲学对怪物猎人一直非常受用。"
 artifact_the_jawbone_name: "颌骨"
 artifact_the_jawbone_description: "似乎是该隐用来谋杀亚伯的颌骨。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的颌骨。\n这块颌骨声名远播，以至于在君士坦丁堡发现它的传言促使乔凡尼家族支持第四次十字军东征以找回它。"
 artifact_flying_dutchman_name: "飞翔的荷兰人"
 artifact_flying_dutchman_description: "#bold [umbra_sense|E]：$pod_grace_i$#P +10%#!\n[umbra_aptitude|E]：$pod_grace_i$#P +50%#!#!\n传说中的飞翔的荷兰人是一艘幽灵船，据说会显现在遇难船只上空。"
 artifact_siklos_name: "希克洛什"
 artifact_siklos_description: "希克洛什是卡戎的利刃。希克洛什是一把大镰刀，由卡戎获得的死税硬币和冥河城最恶劣的叛徒的灵魂组合而成，它具有一定的灵性，甚至能够做梦。"
 artifact_angst_vessel_name: "惧念容器"
 artifact_angst_vessel_description: "#bold 允许在需要花费惧念时，首先花费存储在该惧念容器中的惧念。#!\n一个能够存储惧念以备后用的遗物。"
 need_bastet_mage_tt: "你必须是[GetTrait('mage').GetName( GetPlayer )]或[GetTrait('bastet').GetName( GetPlayer )]。"
 need_middle_kingdom_splat_tt: "你必须是[GetTrait('shih').GetName( GetPlayer )]、[GetTrait('wutian').GetName( GetPlayer )]、[GetTrait('wukuei').GetName( GetPlayer )]、[GetTrait('kueijin').GetName( GetPlayer )]、[GetTrait('dhampyr').GetName( GetPlayer )]、[GetTrait('hsien').GetName( GetPlayer )]、或有[GetTrait('hun_and_po').GetName( GetPlayer )]。"
 chimerical_item_tt: "你必须是被[GetTrait('enchanted').GetName( GetPlayer )]、[GetTrait('fae').GetName( GetPlayer )]、[GetTrait('changeling').GetName( GetPlayer )]、[GetTrait('kinain').GetName( GetPlayer )]、[GetTrait('kiasyd').GetName( GetPlayer )]、[GetTrait('maeghar').GetName( GetPlayer )]或[GetFaithByKey('ceilican').GetName]信仰的[GetTrait('bastet').GetName( GetPlayer )]。"
 artifact_fleshcrafted_artifact_name: "[killed.GetFirstNameNoTooltip]"
 artifact_fleshcrafted_artifact_description: "用[killed.GetTitledFirstNameNoTooltip]的血肉塑造成的宝物，下手者为[owner.GetTitledFirstNameNoTooltip]。"
 artifact_forced_fetish_artifact_name: "[killed.GetFirstNameNoTooltip]"
 artifact_forced_fetish_artifact_description: "强行束缚[killed.GetTitledFirstNameNoTooltip]于内而制造成的灵具，下手者为[owner.GetTitledFirstNameNoTooltip]。"
 artifact_fetish_name: "灵具[newly_created_artifact.GetNameNoTooltip]"
 artifact_fetish_description: "有着[killed.GetTitledFirstNamePossessive]束缚于此，此灵具取得了[GetTrait('spirit').GetName( GetNullCharacter )]的部分特性。"
 artifact_new_fetish_name: "灵化[this_artifact.GetNameNoTooltip]"
 artifact_new_fetish_desc: "[this_artifact.GetDesc]\n\n$artifact_fetish_description$"
 artifact_old_fetish_desc: "[this_artifact.GetDesc]\n\n#X [killed.GetTitledFirstName]不再附身于此灵具。#!"
 fetish_destroyed_notification: "灵具被毁"
 artifact_necklace_of_tou_mu_name: "斗姆的项链"
 artifact_necklace_of_tou_mu_description: "斗姆的项链"
 artifact_rhinegold_name: "莱茵黄金"
 artifact_rhinegold_description: "莱茵黄金是在三位被称为莱茵少女的西尔芙居住的河底被阳光照亮后发现的，它是用最纯净的#N 黄金#!铸造而成的#N 诱人#!戒指。戴上戒指的人可以抛弃爱情，获得巨大的#N 力量#!。戒指能让他们变身成各种动物和怪物，并#N 统治#!世界。莱茵黄金被诺克族的阿尔贝里希从西尔芙们的手中偷走，然后在漫长的岁月中失传，一直在少女们的诅咒和#N 觊觎#!者的#N 贪婪#!中流传。"
 artifact_devil_deck_name: "魔鬼牌"
 artifact_devil_deck_description: "芭丝特使用的这副“普通”扑克牌是一种灵具，它总能为主人抽到最有帮助的牌。芭丝特长久以来一直在探究这些奇异宝物的来源，但到目前为止还没有发现任何线索。"
 artifact_lotus_petals_name: "宝莲瓣"
 artifact_lotus_petals_description: "#bold 一位持有此宝物的芭丝特总会令其亲族子嗣在适龄时成为化形者。#!\n露娜的宫廷相传有着一座生长着千年莲花的池子。每一位有能力登月的芭丝特都可能从中撷取些许花瓣，而此种植物的神秘功效足以确保芭丝特能诞下维持世系的子嗣。"
 artifact_grandmothers_stones_name: "祖母之石"
 artifact_grandmothers_stones_description: "#bold 拥有这个灵具的女性芭丝特将大大提升其灵知恢复的速率。#!\n大洪水之后，留下了一些闪烁的石头，它们吸引着收集它们的女性，并将其变成了首饰。这些灵具得到了月光的祝福，与偶然发现它们的女性芭丝特的塞琳之血产生共鸣，增强了她们与月神露娜的联系。"
 artifact_truthspeaker_stick_name: "真言棍"
 artifact_truthspeaker_stick_description: "这一件看似不可捉摸的灵具外在表现为附有精美雕刻纹饰的文明棍，它会跃跃欲试地飞向附近口出谎言的骗子，用暴力殴打从他们的口中得出真相。如果被谎言包围，真言棍将会散发出宛如余火的微光，致力于将每一个口出谎言之徒血腥地粉碎。"
 artifact_silver_hakarr_name: "纯银飞镰"
 artifact_silver_hakarr_description: "像狼族的月刃一样，这些银制的飞镰在制造时危险重重，使用起来更是致命无比。作为用于解决最致命恩怨战斗的仪式武器，这些多刃的怪物是用生银打造，并被赋予了战争之灵的力量。"
 artifact_frog_skin_name: "蛙皮"
 artifact_frog_skin_description: "这块皮通常可以手套的形式包裹在手上，令持有者仅以一触便能中和所有种类的毒素。"
 artifact_ice_knife_name: "冰刃"
 artifact_ice_knife_description: "这一强力的灵具武器因其与冰之灵密切相关而被视为禁忌：而将其置于零度以上的环境亦会导致融化。因此持有者必须谨慎地仅在适当环境下使用之。"
 artifact_judgment_hammer_name: "审判槌"
 artifact_judgment_hammer_description: "这件由可汗打造的珍贵遗物也许是猫国流传的最为强大的武器，能够使持有者的力量加倍，且每次打击都会引发强力的雷霆。然而，这武器同样重得离谱，只有最为孔武有力的可汗才能好好地使用它。"
 artifact_foe_heart_name: "仇敌之心"
 artifact_foe_heart_description: "如果一个芭丝特在不离开其血种形态的情况下成功击杀一个强大的敌人，那么敌人的心脏将被取出并注入奇原属灵。芭丝特可以使用灵知来激活这件灵具，恢复他们的意志力。"
 artifact_jade_arrows_name: "翠玉矢"
 artifact_jade_arrows_description: "此类箭矢主要为可汗们使用，将一个死亡之灵注入翠玉而锻造成型。翠玉矢对各类超自然生物拥有极为强力的特攻效果，并且在命中时附加撞击爆炸——只要爆炸产生的破片还有哪怕一块在受害者体内尚未取出，由翠玉矢造成的伤口就无法愈合。"
 artifact_quicksilver_name: "快银"
 artifact_quicksilver_description: "一小瓶与水灵绑定的水银，这个灵具允许使用者在[umbra|E]中多带一个人同行。"
 artifact_false_protection_name: "守护伪像"
 artifact_false_protection_description: "芭丝特最大的弱点是他们的雅瓦，也就是部族的秘密，而这件灵具是一种（有些亵渎的）保护这些秘密的方式。一旦激活，这件灵具会将其主人的雅瓦与另一个部族的雅瓦进行交换，确保他们最重要的秘密永远不会被知晓……但这可能会以牺牲另一个部族的一个秘密为代价。"
 artifact_catgut_name: "肠线[newly_created_artifact.GetNameNoTooltip]"
 artifact_the_righteous_fire_name: "正火"
 artifact_the_righteous_fire_description: "正火是一部先于心法的著作，被认为是探索云开雾散的人的圣典。有人认为它是由[GetScriptedCharacterByHistoryID('791111').GetFirstName]本人（发现了五大心法的著名[GetTrait('kueijin').GetName( GetNullCharacter )]哲学家）撰写的。"
 enchanted_artifact_tt: "该宝物已被附魔！"
 blessed_artifact_tt: "该宝物已被祝福！"
 reforged_artifact_tt: "该宝物已被重铸！"
 channelled_artifact_tt: "该宝物已被灌注！"
 strengthened_artifact_tt: "该宝物已被加强！"
 reworked_artifact_tt: "该宝物已被重制！"
 enhanced_artifact_tt: "该宝物已被强化！"
 artifact_incunabulum_fragment_name: "库帕拉条约"
 artifact_incunabulum_fragment_description: "#bold 如果收集到足够多的这些条约，就可以将它们汇编成一本能彻底（？）针对库帕拉的书本。#!\n关于库帕拉的知识片段以隐喻、密码、图表、四行诗、以诺启示，以及显然该有的预言进行了加密。"
 artifact_incunabulum_kupalam_name: "库帕拉摇篮本"
 artifact_incunabulum_kupalam_description: "这是一份卷帙浩繁的手稿，汇集了早期的零散资料。虽然大部分内容都是学术性的拉丁文，但其中部分内容用隐喻、密码、图表、四行诗、以诺启示，以及显然该有的预言进行了加密。一个学者团队可以用一个世纪的时间来解读文本中的层层含义，每个人都会得出库帕拉神话背后的不同真相。\n一些神秘主义者声称，书中的仪式旨在束缚库帕拉。其他人则坚持认为，这本小册子可以用来召唤和控制库帕拉。"
 artifact_broken_blade_michael_name: "米迦勒的断刃"
 artifact_broken_blade_michael_description: "#bold 能够通过吸血鬼限定决议修复。#!\n这把古老的刀刃是早在米海尔成为米迦勒之前所持有的。它曾被一个来自埃布拉城的女孩用来自杀，因为她永生的爱人没有来拯救他们。几个世纪后，这女孩找回了这把刀刃，她现在已经永生，并对抛弃她的人充满了魔化般的仇恨。\n最后，在1204年，这把刀刃回到了它最初的主人手中，而它的毁灭则因曾是埃布拉城小女孩的那人的第二次也是最后一次复仇行动。"
 artifact_bow_sun_name: "太阳之弓"
 artifact_bow_sun_description: "阿什拉夫亲手打造的强大魔法弓。据说，当被混淆的威胁靠近它的主人时，它就会闪耀出太阳的力量。"
 artifact_fang_kali_name: "迦梨之牙"
 artifact_fang_kali_description: "阿什拉夫拥有一把强大的魔法匕首，显然是他在作为法师的凡生时代的遗物。虽然术士对此不置可否，但这把匕首的来历可能是该神秘吸血鬼的凡生信仰和文化背景的线索。"
 artifact_cup_laezar_name: "沉睡者莱扎之杯"
 artifact_cup_laezar_description: "这是一件制作精美的银杯，据说源自沉睡者莱扎的失落墓穴，一些巴力将该传奇生物尊为界外之暗的子嗣。"
 artifact_ubar_chronicles_name: "武帕尔编年史"
 artifact_ubar_chronicles_description: "这本古籍受到一些吸血鬼学者的推崇，它试图将以诺神话和武帕尔神话合二为一。"
 artifact_gospels_irad_name: "以拿和亚大福音书"
 artifact_gospels_irad_description: "这是一部古代文献，总结了好战的次代吸血鬼以拿的几次战斗。这也是少数几个声称存在神秘的“失落”该隐子嗣亚大的资料来源之一。"
 artifact_codex_damned_name: "受诅者法典"
 artifact_codex_damned_description: "这是一部关于第一城和第二城的统治权和等级制度的古老经文。这是一部晦涩难懂的经文，但仍受到大多数挪得学家的推崇。"
 artifact_wounds_sword_name: "夜剑之伤"
 artifact_wounds_sword_description: "这是一首在印度吸血鬼中广为流传的吠陀经。它歌颂勇敢和以身作则。"
 artifact_canticle_japhet_name: "雅弗颂歌"
 artifact_canticle_japhet_description: "这本书被广泛认为是异端邪说（而且显然不是由德高望重的卡帕多西亚雅弗撰写的），书中说该隐已经死了，从而对该隐之子的最早历史提出了完全不同的看法。"
 artifact_gospel_consoler_name: "训慰师福音书"
 artifact_gospel_consoler_description: "最臭名昭著的恶魔学文本，又称米拿现福音。这份文献将路西法和地狱恶魔塑造成开明的天使，他们牺牲自己来教育和提升人类。它包含了几个最古老、最强大的恶魔名称，以及一般的召唤仪式。"
 artifact_book_thoth_name: "透特之书"
 artifact_book_thoth_description: "古埃及神话描述，这本书的法术能最终控制生死。有些人认为，这本书描述了存在的轮回，一连串在有记载的历史之前兴起和衰落的岁月。赛特之子补充说，这些逝去的世界依然存在，它们的统治者也依然存在，但只有傻瓜或疯子才会召唤这种邪恶的纯粹力量。\n木乃伊的看法更为细微，他们认为透特曾亲自指导伊西斯学习术法，因此他是为他们提供真正永生的人的导师。"
 artifact_dreams_angra_name: "安哥拉·曼纽之梦"
 artifact_dreams_angra_description: "这本手札出自巴尔的第一任大祭司之手，因此备受巴力尊崇。这本手抄本详细记载了他们最野蛮的仪式，最后还附带了一个黑暗而充满启示的预言：地狱将崛起，吞噬整个世界。"
 artifact_book_tobit_name: "多俾亚传"
 artifact_book_tobit_description: "多俾亚传的异端版本可追溯到古迦太基。这个版本被唤魔者视为珍宝，是圣经原文的复制品，特洛伊尔和她的情人摩洛对其进行了大量的文字注释。这个版本包含了关于氏族的古老魔邪传说，以及许多关于他们古城生活的秘密。"
 artifact_amala_doll_name: "阿玛拉的玩偶"
 artifact_amala_doll_description: "#bold 除了给法蒂玛·法卡迪提供情绪价值之外，这个玩偶对任何人都没有任何用处。#!\n她的第一位朋友，她的第一位恋人，她的第一次谋杀。法蒂玛原谅了自己，但没有忘记。"
 artifact_shard_copy_name: "[target.GetNameNoTooltip]"
 artifact_shard_copy_desc: "[target.GetDesc]"
 artifact_lilith_shard_name: "黑暗之母的圣典残篇"
 artifact_lilith_shard_description: "研究黑暗之母起源与动机的残篇，她曾教导黑暗之父掌握血律。这个残篇充满了她几乎无法抑制的愤怒与恶毒。字里行间都渗透着痛苦与悲伤，整个残篇似乎都在颤抖，但究竟是因悲伤还是愤怒，仍然不得而知。"
 artifact_enoch_shard_name: "以诺城圣典残篇"
 artifact_enoch_shard_description: "如同宫殿基石般的残篇，似乎记录着第一城——黑暗之父的乌托邦的语言。那古老文明根植在这残篇中，甚至仅凭此残篇散发的氛围，你便能感受到第一城的夜晚中那些事情的压迫。"
 artifact_sphere_shard_name: "滴血圣典残篇"
 artifact_sphere_shard_description: "布满锈红色精血痕迹和的残篇，在被扰动时，内部似乎有液体随之晃动，仿佛其中隐藏着某种液体。残篇低语着关于血液与秘法的艺术。每当你试图触碰它时，它都仿佛在对你耳语，而你的血液也随之震颤。"
 artifact_diplomacy_shard_name: "优雅圣典残篇"
 artifact_diplomacy_shard_description: "散发着高贵香水和美酒气息的残篇，上面的文字比其他残篇更加优雅。即使正在腐朽，它依然精致，在经历了千年的忽视后依旧优雅地老去。仅仅凝视它，你便能感受到你的精神被它的沉静庄重所振奋。"
 artifact_martial_shard_name: "战争圣典残篇"
 artifact_martial_shard_description: "对战争与训练进行全面分析的残篇，散发着纪律与凶猛的气息，蕴含着千场战斗的智慧。尽管残篇讨论的是战车作战和青铜武器的精炼，但其中许多信息所蕴含的永恒智慧依然具有现实意义。"
 artifact_stewardship_shard_name: "监管圣典残篇"
 artifact_stewardship_shard_description: "似乎是第二城管理者对牧群的全面记录与发展计划的报告的残篇，从建筑规划到商业流动的细节都记录在这片古老的泥板中。"
 artifact_intrigue_shard_name: "隐秘圣典残篇"
 artifact_intrigue_shard_description: "一个似乎在主动躲避你的残篇，记录了第二城两位该隐之子之间的禁忌恋情，以及他们在上古耆宿的注视下，在这座城市中隐瞒两人关系的故事。残篇的最后描述了他们被发现后，尊长对他们所做的事情，令人震撼。"
 artifact_learning_shard_name: "贤者圣典残篇"
 artifact_learning_shard_description: "一个包含极为详尽论文的残篇，探讨了最古老的道德心路，以及关于人性、王权和其他该隐之子神学问题的细微差别。相比其他残篇，这一块似乎充满了更多的激情与热爱。显然，卡帕多修斯从一开始就有他的偏好。"
 artifact_genesis_shard_name: "原初圣典残篇"
 artifact_genesis_shard_description: "一个古老得令人难以置信的残篇，上面还粘着一截桃树根。这个残篇所详细描述的事件既古老又矛盾，仿佛在无尽的时间与宇宙的创生之间徘徊。最奇异的是，这个残篇似乎脉动着生命，同时散发出一种奇妙且亵渎的智慧。"
 artifact_caine_shard_name: "黑暗之父的圣典残篇"
 artifact_caine_shard_description: "记录了对第一城之主、黑暗之父的观察的残篇，内容在试图理解第一位谋杀犯的内心与他治理子嗣时的习惯和倾向之间来回流转。奇怪的是，内容中缺少对诫律的描述，然而，当你阅读这个残篇时，似乎感觉某处有一双古老的眼睛正在注视着你。"
 artifact_soul_shard_name: "赋魂圣典残篇"
 artifact_soul_shard_description: "一个似乎拥有独特灵光的残篇，它隐约闪烁着来自死者世界和幽林荒野的气息。残篇仿佛在沉思，因为其上的文字充满了内省的意味。"
 artifact_body_shard_name: "脏器圣典残篇"
 artifact_body_shard_description: "由奇异黏土制成的残篇，手感多孔且柔软，仿佛接触到真实的内脏。其上详细记载了复杂的解剖学和该隐之子的生理学，甚至还有对古老者们恐怖技艺的观察。即使对一位吸血鬼长者而言，这块残篇及其内容依然令人感到……恶心。"
 artifact_seth_shard_name: "首猎圣典残篇"
 artifact_seth_shard_description: "阅读这残篇如同在浏览一场盛宴的菜单，它详细记录了第一位谋杀犯之幼弟的血脉谱系，以及其中各种口味的微妙差异。但它也警示了每条血脉的危险之处，展示出即使在那远去的血神之夜，猎人也同样存在。"
 POD_need_demonic_tt: "你必须是恶魔，巴力，或恶魔教徒（公开或秘密）。"
 POD_fleshcraft_tome_bloodmagic_paths_display: "#medium 此书包括以下$pod_bs_traditions$：[AddTextIf(GetScriptedGui('contains_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@tremere_icon! 奇术')][AddTextIf(GetScriptedGui('contains_dur_an_ki_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@assamite_icon! 杜–安–奇')][AddTextIf(GetScriptedGui('contains_akhu_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@setite_icon! 咒术')][AddTextIf(GetScriptedGui('contains_sadhana_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@ravnos_icon! 修持')][AddTextIf(GetScriptedGui('contains_koldunic_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@tzimisce_icon! 库都')]#!\n\n[newly_created_artifact.GetDesc]"
 artifact_day_armor_name: "昼行护甲"
 artifact_day_armor_description: "#bold 赋予日光抗性#!\n由层层交叠的钢制鳞甲构成，确保每一寸肌肤都被遮蔽，琥珀色面甲可完全阻隔太阳的恶毒光芒。头盔设计成猫科动物造型，獠牙状装饰覆盖面甲，后方饰有红色羽翎。据说此甲寄宿着伟大精魂（可能是曾为芙蕾雅拉车的猫之一特里古尔），能为获得阿迪萨赐福者带来类似灵兽的祝福。"
 iskender_saber_artifact_name: "伊斯肯德之剑"
 iskender_saber_artifact_description: "“尽管这把精工打造的武器并非魔法之物，但它让佐伊想起她曾犯下的可怕错误，以及赎罪所付出的代价。”"
 artifact_ayr_sword_convoquee_name: "艾尔之剑：召唤者"
 artifact_ayr_sword_convoquee_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n召唤者的特殊能力是：当持有者呼唤时，可传送至其手中。"
 artifact_ayr_sword_chanceuse_name: "艾尔之剑：幸运者"
 artifact_ayr_sword_chanceuse_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n幸运者的特殊能力是：为持有者提供不可思议的幸运。"
 artifact_ayr_sword_immaterielle_name: "艾尔之剑：虚无者"
 artifact_ayr_sword_immaterielle_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n虚无者的独特能力是：可伤害灵体等非实体存在。\n#bold 可囚禁、折磨、处决或物理伤害诸灵。[single_combat_duel_plural|E]"
 artifact_ayr_sword_mordante_name: "艾尔之剑：噬血者"
 artifact_ayr_sword_mordante_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n噬血者被附魔，可从被击中的该隐派身上吸取血液，使其成为夜之统治者们尤为畏惧的武器。"
 artifact_ayr_sword_vivace_name: "艾尔之剑：迅捷者"
 artifact_ayr_sword_vivace_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n迅捷者极为轻便易用，即使以艾尔的标准而言也是如此。仿佛武器自身使用了迅捷术的力量。"
 artifact_ayr_sword_faucheuse_name: "艾尔之剑：收割者"
 artifact_ayr_sword_faucheuse_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n这把武器以某种只有艾尔知晓的方式，可无视非魔法护甲。"
 artifact_ayr_sword_clepsydre_name: "艾尔之剑：时漏者"
 artifact_ayr_sword_clepsydre_description: "传奇铁匠艾尔·铁砧打造的七把名剑之一。为持有者量身定制，几乎不可摧毁，并附有强大魔法。\n时漏者蕴含时间术的火花，使持有者拥有完美的时间感知。"
 artifact_sorel_name: "索雷尔"
 artifact_sorel_description: "索雷尔是伊索达亲自赠予其爱子乔瑟林的礼物，自其幼驹时期便相伴左右。如主人般高贵英勇的索雷尔步履稳健，据说对任何危险都无所畏惧。"
 artifact_bygone_desc: "被凡世板讷摧毁的幻兽遗骸"