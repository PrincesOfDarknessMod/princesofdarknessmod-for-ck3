l_simp_chinese:
 artifact_sword_of_nul_name:0 "努尔之剑"
 artifact_sword_of_nul_description:0 "#bold 解锁[single_combat_duel|E]招式。解锁独特内容。#!\n这柄剑短而直的青铜剑看起来很无害。整把武器随着时间的推移呈现为了青色。但它仍然很锋利，非常锋利，比最好的钢还要锋利。\n这柄剑背后的故事非常血腥，每一任它的主人都会离奇死亡。努尔之剑终将与它真正的主人团聚，无论如何。"
 artifact_tablet_of_destiny_name:0 "命运石板"
 artifact_tablet_of_destiny_description:0 "#bold 解锁独特内容。#!\n根据埃努玛·埃利什，命运石板是人类的法律，由以诺亲自设立。这些泥板上到底写着什么，有很多猜测。最为公认的一种理论认为这是一本关于血之力量的编年史，解释了所有以诺魔法。无论如何，据说伊什塔尔曾试图从伊娜依娅处拿走这一物品，这引发了两位上古耆宿之间的激烈战斗，几乎使得妥芮朵氏族两度毁灭。"
 artifact_eye_of_hazimel_name:0 "哈济梅尔之眼"
 artifact_eye_of_hazimel_description:0 "#bold 解锁独特内容。#!\n这件遗物的故事充满了疯狂、血腥和绝望。哈济梅尔之眼似乎是一位强大的雷伏诺玛土撒拉的最后一块有活力的碎片，可以以巨大的代价为他的持用者提供不可思议的力量。想要了解它的秘密，用它替换你自己的眼睛只是你要做的第一件事，也是最简单的一件事……"
 artifact_ankaran_sarcophagus_name:0 "安卡拉石棺"
 artifact_ankaran_sarcophagus_description:0 "#bold 解锁独特内容。#!\n不要打开它。"
 artifact_kristrbani_name:0 "克里斯特巴尼"
 artifact_kristrbani_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n弑主者是巴尔伯格女王选择的武器。这是一把凡人难以举起的巨型战锤，被鲜血一次又一次地浸染着。这是它无情的[einherjar|E]主人所热衷于继续的事业。"
 artifact_euagetaematikon_name:0 "闪耀圣血之经"
 artifact_euagetaematikon_description:0 "闪耀圣血之经是该隐教会的圣经。由君士坦丁堡的一位疯狂的僧侣撰写，这本几乎不连贯的文本宣布了该隐之子种族的命运，即在最后的弥赛亚身边行走，在无休止的血腥狂欢中统治世界。"
 artifact_ainkurn_name:0 "安库恩"
 artifact_ainkurn_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n根据传说，安库恩之剑可以让人摧毁玛土撒拉，单枪匹马地战胜贪婪的狼人，甚至进入亡者的国度。无论是幻想还是事实，这把强大的剑都是由突伽·辛制造的，作为一种更强大的武器的蓝本，用于未来的动荡时代。它最著名的事迹是克里斯托夫·罗慕铎对布拉格的吸血鬼的暴走，清楚地证明了它的有效性。"
 artifact_lamp_of_constantine_name:0 "君士坦丁的神灯"
 artifact_lamp_of_constantine_description:0 "#bold 即使没有[perk|E]，你也可以使用谴咒。#!\n据说，耶稣授予了君士坦丁大帝太阳本身的一部分，作为对他皈依的奖励。君士坦丁将这块圣物放在一盏交织印有希腊字母“χ”和“ρ”的灯中，以纪念他的异象并向基督致敬。据说这盏灯拥有以圣光消灭恶魔和其他夜行生物的力量。"
 artifact_magic_lantern_name:0 "魔法神灯"
 artifact_magic_lantern_description:0 "这是一个巨大但朴素的陶土瓮，这盏神灯曾经属于拉撒路，后来在火之庭的阴谋中丢失了。一旦暴露在阳光下，它就会呈现出奇怪的图案和有趣的谜题。"
 artifact_japhet_cloak_name:0 "雅弗的斗篷"
 artifact_japhet_cloak_description:0 "一块奇怪的半透明斗篷，可以抵御死灵。雅弗自己几乎不需要它，但他平静地回答说，这件圣物被使用的时刻将很快到来。"
 artifact_scarlet_rose_name:0 "亚历山大的猩红玫瑰"
 artifact_scarlet_rose_description:0 "当他的爱人洛林背叛了他时，亚历山大绑架了她，并在这花中慢慢地吸干了她的血。当她最终屈服时，洛林原谅了他，而玛土撒拉则被逼得发狂。这朵血淋淋的玫瑰现在正渴求着更多吸血鬼的血液，并不断提醒着亚历山大的失败。"
 artifact_infernal_tome_name:0 "地狱书卷"
 artifact_infernal_tome_description:0 "恶魔用来引诱软弱的凡人和该隐之子崇拜他们的六本地狱书卷之一。它没有包含什么有用的信息，也没有“真名”，因为它主要是恶魔的工具。"
 artifact_flagrum_passion_name:0 "激情之鞭"
 artifact_flagrum_passion_description:0 "#bold 解锁[single_combat_duel|E]招式。解锁圣遗物决议。#!\n在受难期间一次又一次地刺穿基督的肉体的武器。由于以利亚撒的使用，这个遗物已经有些腐化，他的血与基督的血混合在了一起，但它仍然是信仰的强大灯塔。"
 artifact_night_lantern_name:0 "夜父之灯"
 artifact_night_lantern_description:0 "这盏灯由一名诺斯费拉图玛土撒拉所精心制作，允许持有者使用类似于混淆术的律能。也有传言说，它有更险恶的秘密，但到目前为止，没有人能够证实这一点。"
 artifact_corona_ferrata_name:0 "铁之冠"
 artifact_corona_ferrata_description:0 "作为圣费雷奥勒和圣费罗提欧的遗物，这个强大的冠冕对真信徒有抚慰作用。而对不信者则有更致命的影响。它的主人每天都会被它伤害一次，使圣血从他的前额溢出到他的下巴，形成一种令人毛骨悚然的自我鞭笞现象。"
 artifact_caecus_rose_name:0 "卡耶库斯玫瑰"
 artifact_caecus_rose_description:0 "由熟练的园丁卡耶库斯为美丽的海伦创造的，这朵玫瑰可以倾听附近的任何谈话，一种模仿观占术律能的微妙力量。"
 artifact_makeda_crown_name:0 "玛克达之冠"
 artifact_makeda_crown_description:0 "伟大的示巴女王的金冠有能力击退那些堕入恶魔崇拜的吸血鬼。兰斯亲王尼科迪默斯将它赠予海伦，她选择只在私下里佩戴，以示对已故女王的尊重。"
 artifact_goratrix_mirror_name:0 "格拉崔克斯之镜"
 artifact_goratrix_mirror_description:0 "一面被格拉崔克斯施了魔法的镜子，可以轻松地从一个地方传送到另一个地方。如果事先准备好镜子，它可以让使用者极度减少路途时间。"
 artifact_shemaziel_sarcophagus_name:0 "夏孟泽尔石棺"
 artifact_shemaziel_sarcophagus_description:0 "#bold 解锁独特内容。#!\n这是一副由未知的黑色岩石制成的沉重石棺，这个可怕的物品被坚固的锁链保护着。你觉得自己绝对绝对不应该打开它。"
 artifact_codex_mortis_name:0 "死灵圣书"
 artifact_codex_mortis_description:0 "#bold 解锁乔凡尼亡灵术。#!\n这本圣书包含了许多亡灵仪式……以及死灵蒂亚·赛比娜的受诅灵魂。她的丈夫奥勒留·弗拉维乌斯·约维安为了保护这本书和她的灵魂，自愿成为吸血鬼，不让任何人伤害他们。"
 artifact_slay_death_name:0 "弑死"
 artifact_slay_death_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n这把巨大的斧头是彼得鲁斯选择的武器，他是科隆布亲王的刽子手。这也是他唯一的真爱。"
 artifact_michaelis_rosary_name:0 "米歇尔的玫瑰经"
 artifact_michaelis_rosary_description:0 "包含了米歇尔的回忆的106颗象牙珍珠，他是一位妥芮朵氏族的强大玛土撒拉。唯一没有被玷污的是他初拥埃斯克莱蒙德的记忆，他最爱的子嗣。"
 artifact_abraxas_sarcophagus_name:0 "阿卜拉克萨斯石棺"
 artifact_abraxas_sarcophagus_description:0 "这座由黄金和珍贵宝石制成的石棺是巴西里得的安息之地，巴西里得是一位被遗忘的基督教起源时代的圣人。他关于礼拜仪式的理论和检验对于任何一名神学家来说都是非常令人感兴趣的。"
 artifact_ermentrude_cross_name:0 "圣厄门特鲁德的十字"
 artifact_ermentrude_cross_description:0 "这位布列塔尼的殉道者遗留下了一个十字架，现在被做成了一条项链，它可以击退任何狼。它也会与真信产生共鸣。"
 artifact_odin_stone_name:0 "奥丁的符文石"
 artifact_odin_stone_description:0 "垂死的奥丁在这块石头上刻出了第一个如尼文。其中还蕴藏着三名渥尔娃女巫的灵魂，她们在被一名维京军阀屠杀前守护着这件圣物。"
 artifact_holy_flask_name:0 "圣瓶"
 artifact_holy_flask_description:0 "圣雷米在为法兰克第一任国王克洛维一世加冕时，用这个瓶子给他涂油。从那以后，它的圣油似乎总是用不完。"
 artifact_uraeus_osiris_name:0 "奥西里斯的圣毒蛇"
 artifact_uraeus_osiris_description:0 "这个金蛇雕像在奥西里斯本人的埃及头巾（冠冕）上。它有能力打开一扇通往阿蒙提——埃及的冥界之一——的门。在荷鲁斯突袭马赛的赛特之子神庙后，被格拉崔克斯偷走了。"
 artifact_ayr_sword_name:0 "艾尔之剑"
 artifact_ayr_sword_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n传奇铁匠艾尔·铁砧创造的七柄剑之一。为它的主人量身定做，几乎坚不可摧，并附上了强大的魔法。"
 artifact_ayr_armor_name:0 "艾尔之甲"
 artifact_ayr_armor_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n传奇铁匠艾尔·铁砧创造的五盔甲之一。为它的主人量身定做，几乎坚不可摧，并附上了强大的魔法。"
 artifact_sofia_finger_name:0 "索菲亚的指骨"
 artifact_sofia_finger_description:0 "在内心深处，索菲亚总是知道关于黑夜的邪恶的真相。她被一位结仇的吸血鬼盯上了，当他来的时候，她已经准备好了，并牺牲了自己来阻止他。她的遗物授予你关于你周围的邪恶者的弱点的知识。"
 artifact_water_meriba_name:0 "梅里巴之水"
 artifact_water_meriba_description:0 "#bold 你的饥渴上升概率降低。#!\n梅里巴之水为走出埃及的干涸的希伯来人提供了救赎，但对摩西本人来说却是诅咒。在凡人教会的眼中，摩西的傲慢腐蚀了梅里巴的奇迹，但在该隐之子中仍然存在对它的交易。毕竟，摩西类似于该隐，被神诅咒永远找不到回家的路。"
 artifact_hand_nikolas_name:0 "尼古拉斯之手"
 artifact_hand_nikolas_description:0 "#bold 你将不再会血狂。#!\n尼古拉斯是一位圣洁、和平的诺斯费拉图，在被一位过度狂热的狂热者杀死之前，有着小型密教崇拜着他。他的手仍然没有腐烂成灰烬，它有一种不可思议的能力，甚至可以安抚最愤怒的心兽。"
 artifact_caul_jos_name:0 "乔斯的胎膜"
 artifact_caul_jos_description:0 "乔斯出生时就带着胎膜——这预示着他在生活中会很幸运。他的母亲小心翼翼地擦干皮肤，并将其缝入一个小袋子，让乔斯携带。事实上，乔斯有不寻常的好运气。尽管他无能又懒惰，但他有一份好工作，有很多情人，有很多朋友，并且免于艰难困苦。甚至也奇迹般地躲过了袭击他的吸血鬼的突然攻击。乔斯拿起武器，反击敌人，而不是逃跑，为自己的运气感到自豪。但一切都有限度……"
 artifact_labrys_name:0 "巴力双刃斧"
 artifact_labrys_description:0 "迷宫域的象征。巴尔的长角头颅的象征。胜利者对受害者的象征，狼对羊的象征。邪恶的象征。"
 artifact_guarded_rubrics_name:0 "封禁量规"
 artifact_guarded_rubrics_description:0 "巫妖伊努哈顿将这本书交给了塔尔玛埃拉的第一批成员。它包含了挪得之书的摘录和几千年来亡灵术实践的提炼。它还塑造了新生教派作为末日守护者的信仰。"
 artifact_jurgen_broadsword_name:0 "约根的阔剑"
 artifact_jurgen_broadsword_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n一把闪亮的阔剑，镶嵌着珍贵的宝石，上面布满了装饰性的纹章。它被献给了约根，作为爱之庭的友谊信物。"
 artifact_true_cross_name:0 "真十字的碎片"
 artifact_true_cross_description:0 "#bold 解锁圣遗物决议。增强寻找巢穴（勇武选项）计谋。#!\n一块三英尺长的黑木头，上面有着救世主本人的血迹。这个遗物保护了亚柯数个世纪，后来被戈捷·德·丹皮尔拿去作为亚柯骑士修士会的奠基石。"
 artifact_rowan_ring_name:0 "罗宛之戒"
 artifact_rowan_ring_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n罗宛之戒是令人恐惧的暗杀工具，由哈基姆圣裔的长者成员或他们信任的稚子使用。戒指可以神秘地变尖并拉长成尖桩，作为武器使用。"
 artifact_tapestry_blood_name:0 "血之织锦"
 artifact_tapestry_blood_description:0 "一幅巨大的织锦，对那些注视它足够久的人来说具有预言的力量。这种景象几乎可以采取任何形式，从对古代文明的瞥见到对未来的瞥见。唯一可以确定的是，每个幻象的主题都会直接关系到使用者的命运。"
 artifact_michaelis_crown_name:0 "米歇尔之冠"
 artifact_michaelis_crown_description:0 "奥克西塔尼亚第一位真正的统治者的王冠。在他的继承人与法兰西人的斗争中，这是一个强有力的象征，可以凝聚他们的力量。"
 artifact_ignace_notes_name:0 "安条克的依纳爵的笔记"
 artifact_ignace_notes_description:0 "#bold 给予观占术特质。#!\n清洁派异端思想的创始人留下了这段文字。正确的解释是，它构成了一张普累若麻的地图，即灵界。仅仅拥有这张地图就足以激起该隐之子体内血液的潜在力量。"
 artifact_consolation_philosophy_name:0 "哲学的慰藉"
 artifact_consolation_philosophy_description:0 "作为波爱修斯的哲学书的典范，这本书由一位不知名的该隐之子作了注释，分享了他对吸血鬼状况和天主诅咒的看法。这本书在很多方面都很有启发性。"
 artifact_sword_arthur_name:0 "亚瑟之剑"
 artifact_sword_arthur_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n传奇战将阿尔托利乌斯不顾密特拉密教的顽强抵抗，将基督教带到了群岛。他的剑至今仍是吸血鬼猎人所使用的强大宝物。"
 artifact_skull_saulot_name:0 "扫罗的头盖骨"
 artifact_skull_saulot_description:0 "被睿魔尔杀死的上古耆宿的头骨标本。在事发后丢失，被卡帕多西亚找了回来研究。它在重新崛起的萨洛比首领手中时将是一个强大的象征。"
 artifact_scrolls_carthage_name:0 "迦太基卷轴"
 artifact_scrolls_carthage_description:0 "在这些著作中，真相被暴露无遗。乌托邦，和噩梦的真相。"
 artifact_great_book_name:0 "大书"
 artifact_great_book_description:0 "玛土撒拉萨尔米斯在旅行中了解到的一切都写在这里。这是一个有用的知识来源，尽管排版不怎样。"
 artifact_vassago_earring_name:0 "瓦沙克的耳环"
 artifact_vassago_earring_description:0 "#bold 给予高阶血术法特质。#!\n2000年前，一个印度的疯狂密教组织召唤了“咒怨先知”瓦沙克，他用这一小块珠宝作为他的灵魂的窥视口。它为它的宿主提供了腐化版的奇术。"
 artifact_marguerite_ring_name:0 "玛格丽特之戒"
 artifact_marguerite_ring_description:0 "#bold 给予支配术和观占术特质。#!\n一枚制作精良的墨洛温戒指，受救世主之声附魔。玛格丽特亲王把她的一部分灵魂放在其中，确保如果她发生什么事，她会通过她的子嗣活下来。"
 artifact_raquel_band_name:0 "拉贵尔的婚戒"
 artifact_raquel_band_description:0 "一个简单的木制婚戒。当一个吸血鬼要求圣拉贵尔放弃她的誓言并嫁给他时，她把布列塔尼的所有吸血鬼都烧成了灰烬，然后自己被当作女巫烧死。"
 artifact_pacifist_ji_name:0 "非攻戟"
 artifact_pacifist_ji_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n曾经由一位虔诚的佛教徒携带的长矛，他在丝绸之路上保护朝圣者和商人。据说这武器将永远饶恕纯洁的心灵和灵魂。"
 artifact_lost_yoni_name:0 "失落女阴像"
 artifact_lost_yoni_description:0 "一座神奇的生育女神雕像，在亚历山大的征服期间被带回来。它让人们看到了故去的文化和宗教。"
 artifact_phrygian_codex_name:0 "弗里吉亚圣书"
 artifact_phrygian_codex_description:0 "一本由历代库都沿袭千年写成的书。实验笔记和经文一样多，前几章写于罗马时代之前，但最新的章节则在血肉塑造理论的前沿。"
 artifact_severed_head_name:0 "断头"
 artifact_severed_head_description:0 "只要喂一点血，这施洗约翰、埃赫那吞、耶稣或本丢·彼拉多（没人确定）的断头就会（隐晦地）说话。这里面可能有一些知识。"
 artifact_holy_grail_name:0 "圣杯"
 artifact_holy_grail_description:0 "#bold 解锁独特内容。#!\n收集者组织在八世纪发现了这个杯子，它散发出一种前所未有的圣洁力量。虽然他们无法追踪它的确切历史，但收集者们确信它就是神话中的圣杯，这要归功于它在被用作血液容器时对吸血鬼诅咒显现的神奇特性。"
 artifact_orb_shadows_name:0 "控影之珠"
 artifact_orb_shadows_description:0 "#bold 给予幽暗术特质。#!\n由幽暗术的实践者使用的辅助专注物，帮助他们掌握这种非自然的律能。它对已熟练这门技艺的大师们几乎没有用处，但他们经常把它作为纪念品保存起来。"
 artifact_bone_osiris_name:0 "奥西里斯之骨"
 artifact_bone_osiris_description:0 "赛特的敌对兄弟奥西里斯的最后遗物之一。通过它仍然可以感受到死亡之神的力量，这可能是挫败赛特防御的关键。"
 artifact_bloodroot_name:0 "血根"
 artifact_bloodroot_description:0 "这是一种只在北非发现的稀有植物，是少数已知的甚至对该隐之子有毒的草药之一。主要用于近战武器，它能迅速将受害者的血液变成细小的，类似于火山灰的黑色灰尘。"
 artifact_gauthier_sword_name:0 "戈捷的大马士革剑"
 artifact_gauthier_sword_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n戈捷杀死的第一位吸血鬼掉落了这把精巧的刀，这把武器他至今仍在使用。亚柯骑士们悄悄地说，在戈捷的不懈信仰的推动下，这把刀正逐渐成为一种遗物。"
 artifact_alashrad_eye_name:0 "阿什拉夫之眼"
 artifact_alashrad_eye_description:0 "#bold 给予高阶观占术特质。#!\n阿刹迈阿姆尔所使用的钻石左眼替代品。据传这东西能让他拥有超越视界的视力，但阿什拉夫本人并没有承认。"
 artifact_book_patriarch_name:0 "牧首之书"
 artifact_book_patriarch_description:0 "幻梦之牧首米迦勒的深刻见解，或疯狂的胡言乱语。这本书对他幸存的追随者来说是一部神圣的经文，尽管他们中没有人真正理解它。"
 artifact_librum_terrum_name:0 "大地之书"
 artifact_librum_terrum_description:0 "这本“大地之书”指出了喀尔巴阡山脉的一座古老教堂，靠近一座现已被遗弃并成为废墟的要塞。一段神秘的文字提到了“躺在被他的故土包围的不洁祭坛下沉睡的巨兽”。"
 artifact_gaffari_scrolls_name:0 "加法里的卷轴"
 artifact_gaffari_scrolls_description:0 "#bold 解锁独特内容。#!\n阿刹迈氏族内部隐藏的阴谋在这些卷轴中暴露无遗。长者们被灭口以压制这一真相，在结束前还会有更多的人流血。"
 artifact_ashes_allhigh_name:0 "崇高之主的灰烬"
 artifact_ashes_allhigh_description:0 "据说是奥丁本人的骨灰，被梵卓松达菲利尔所杀。由于他是著名的骗子和吹牛者，所以很少有人相信这种说法。"
 artifact_karalavanisha_vrana_name:0 "喀拉拉瓦尼莎之伤"
 artifact_karalavanisha_vrana_description:0 "在这首诗中，雷伏诺的创世神话被写得非常广泛。它解释了他们作为对抗可恨的阿修罗提伽耶的看守人的神圣地位。"
 artifact_corpus_hermeticum_name:0 "赫耳墨斯全集"
 artifact_corpus_hermeticum_description:0 "这部作品是由神秘的赫耳墨斯·特里斯墨吉斯忒斯——赫耳墨斯秘会的先祖所写，由42本书组成，包含所有古代知识的总和。它最完整的版本被七人议会所拥有，藏在塞里奥斯的深处。"
 artifact_bernardo_ashes_name:0 "弗拉·贝纳多的灰烬"
 artifact_bernardo_ashes_description:0 "古比奧幼狼的和平主义创始人的骨灰，因其信念而被杀害。从这个骨灰盒中仍然可以感受到一种舒缓的气息。"
 artifact_hunger_satisfaction_name:0 "饥渴与满足"
 artifact_hunger_satisfaction_description:0 "这本书最初由原罪之道的创始人塔尼特巴尔·萨哈尔撰写，几个世纪以来一直作为罪人的（不洁）圣典。在他的导师失踪后，卡米拉对它进行了扩展，许多次级的罪人对它有自己的解释。"
 artifact_mithras_goblet_name:0 "密特拉陶杯"
 artifact_mithras_goblet_description:0 "一个装饰着神秘符号的古董高脚杯，多年来一直被用于无数的仪式中。密特拉本人在这个杯子里注入了他的精血，并把它传给他忠诚的追随者饮用。"
 artifact_mithras_cap_name:0 "密特拉的弗利吉亚帽"
 artifact_mithras_cap_description:0 "这件头饰是在罗马时代后期用精细的红色布料缝制的，是梵卓学者宾杜萨拉在亚历山大城第一次会面时赠送给密特拉的。密特拉只在他的神庙的特殊场合才戴上它，这也是它被保存下来并保持良好状态的原因。"
 artifact_mithras_ring_name:0 "红宝石戒指"
 artifact_mithras_ring_description:0 "这枚戒指是在梵卓定居不列颠尼亚之前，他们还是恋人时，赛特之子齐茉媞里送给密特拉的。在戒指的内表面有一个精美的埃及僧侣体铭文，大致翻译为“从女神到男神，永远的诅咒和祝福”。"
 artifact_mithras_dagger_name:0 "埃及匕首"
 artifact_mithras_dagger_description:0 "强大的复仇者荷鲁斯在13世纪的战斗后的礼物，自几个世纪以来，密特拉在密教仪式中使用这把匕首，例如杀死公牛的祭祀仪式。"
 artifact_mithras_seal_name:0 "密特拉印章"
 artifact_mithras_seal_description:0 "这枚印章是为密特拉制作的第一枚印章，用于盖印与阿瓦隆领地和伦敦宫廷有关的官方文件，是他权力的象征，必要时可以委托给忠诚的代理人。"
 artifact_ring_chrysostom_name:0 "金口圣若望之戒"
 artifact_ring_chrysostom_description:0 "#bold 即使没有[perk|E]，你也可以使用祝福。#!\n这枚戒指是银制的，上面刻着粗糙的十字架，据传是金口圣若望所戴的。"
 artifact_franciscan_aspergill_name:0 "方济会圣水勺"
 artifact_franciscan_aspergill_description:0 "含有圣方济各的骨头碎片，这圣水勺可以在整个房间里创造一种宁静的气氛。"
 artifact_martyr_fire_name:0 "殉道者之火"
 artifact_martyr_fire_description:0 "这盏灯是用殉道者骨头的灰烬铸造的。有信仰的人在这盏灯的半径范围内可以忽略所有的伤口，除了最严重的伤口。"
 artifact_eunuch_scapular_name:0 "宦官圣衣"
 artifact_eunuch_scapular_description:0 "#bold 即使没有[perk|E]，你也可以使用代祷。#!\n据称是一位虔诚的塞浦路斯圣徒生前的生殖器，他为了避免肉体的诱惑而阉割了自己，这件肩衣带有他的制造者的令人印象深刻的精神毅力。"
 artifact_dagger_thorns_name:0 "荆棘匕首"
 artifact_dagger_thorns_description:0 "#bold 解锁[single_combat_duel|E]招式。给予真信特质。#!\n这把匕首是用基督受难时戴的荆棘冠冕上的一根荆棘锻造的，它散发着信仰的光芒，对超自然者尤其致命。"
 artifact_spear_destiny_name:0 "命运之矛"
 artifact_spear_destiny_description:0 "#bold 解锁[single_combat_duel|E]招式。给予真信特质。#!\n朗基努斯之矛，他在耶稣被钉在十字架上时刺穿了他的身体。这是一个强大的信仰象征，众所周知，挥舞它的人都会产生幻象。"
 artifact_code_samiel_name:0 "萨麦尔圣书"
 artifact_code_samiel_description:0 "殉道者的创始人萨麦尔是扫罗的武者一系中最伟大的，据说他亲手写下了这篇文书。根据传说，在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了圣书，以及圣书中新武者获取力量和血化所必需的适当仪式。"
 artifact_valencia_chalice_name:0 "瓦伦西亚之杯"
 artifact_valencia_chalice_description:0 "教会学者对该杯的出处以及它的用途有不同的看法。有些人声称，它是最后的晚餐时用来招待使徒的杯子。还有人说，它是用来收集耶稣受难时的血。然而，双方都会同意，该杯确实盛有基督的血，这使得它无论是作为宗教遗物还是作为历史文物都几乎是无价的。"
 artifact_erciyes_fragments_name:0 "埃尔吉耶斯残篇"
 artifact_erciyes_fragments_description:0 "众所周知的挪得之书的次经合集，详细介绍了该隐之子的创世神话，由一些最负盛名的该隐之子学者作了注释。"
 artifact_erciyes_broken_fragments_name:0 "破碎的埃尔吉耶斯残篇"
 artifact_erciyes_broken_fragments_description:0 "详细介绍了该隐之子的创世神话的，挪得之书的次经合集——埃尔吉耶斯残篇的缺损副本。"
 artifact_correspondence_rodrigo_name:0 "罗德里戈的信件"
 artifact_correspondence_rodrigo_description:0 "作为“心兽之路”最重要的学者之一，罗德里戈一直在将他所有的发现和关于它的争论汇编成一份伟大的手稿，这让“心兽之路”更保守的成员感到恼火。"
 artifact_grey_book_name:0 "灰之书"
 artifact_grey_book_description:0 "从宫廷阴谋的入门到如何跟踪和杀死猎物的明确指示。由查瑞希·德·格雷亲自撰写，灰猎手之道的著名典范。"
 artifact_gabriel_trumpet_name:0 "加百列的小号"
 artifact_gabriel_trumpet_description:0 "末世将由一个巨大的、雷鸣般的号角吹响，即大天使加百列的号角。加百列在出现在穆罕默德面前后，故意将其留下，如果故事可信的话，将由凡人自己发出信号，召唤末日。"
 artifact_the_stone_name:0 "石头"
 artifact_the_stone_description:0 "似乎是该隐用来谋杀亚伯的石头。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的石头。"
 artifact_warding_iron_name:0 "守护铁环"
 artifact_warding_iron_description:0 "这是一件由铁制成的粗糙环状物，是信徒们用来防止包括吸血鬼在内的邪恶存在体接近的小护身符。"
 artifact_gospel_laodice_name:0 "拉俄狄刻福音"
 artifact_gospel_laodice_description:0 "这是一本漫无边际的神学集，收集了关于该隐之子与及和天主的关系的幻觉、洞察和预言；并延伸为天国之道历史的重要记录。"
 artifact_the_bone_name:0 "骨头"
 artifact_the_bone_description:0 "似乎是该隐用来谋杀亚伯的颌骨。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的颌骨。"
 artifact_horns_hunter_name:0 "猎人号角"
 artifact_horns_hunter_description:0 "由伊娜依娅杀死的野兽的角制成，这件宝物的力量是神秘的。它们似乎能增强任何有能的战将的自然领导能力。"
 artifact_flesh_hunted_name:0 "受猎者的血肉"
 artifact_flesh_hunted_description:0 "吃下这神奇的肉的一部分，可以让任何该隐之子变身为被制成这肉的动物。"
 artifact_book_sun_name:0 "太阳之书"
 artifact_book_sun_description:0 "人性之道信仰的核心文本被认为是古代该隐之子寻找浩恩永生的半准确记载。太阳之书充满了寓言和奇怪的比喻，是谜语和神话的结合体。"
 artifact_dialogues_troile_arikel_name:0 "特洛伊尔与亚力科的对言"
 artifact_dialogues_troile_arikel_description:0 "这显然是在柏拉图时代写的，是对两个上古耆宿之间的所谓对话的叙述。尽管该文本的真实性存在争议，但其对世界和血畜的见解是普罗米修斯之道所采用的信条的详细版本。"
 artifact_blade_of_enoch_name:0 "以诺之刃"
 artifact_blade_of_enoch_description:0 "#bold 解锁[single_combat_duel|E]招式。你不再会血狂。#!\n这把看起来很粗糙的青铜刀是布鲁赫送给以诺的礼物。它被认为保留了其创造者的一些记忆片段，特别是他冷酷的逻辑和对情感的完全控制。"
 artifact_well_ashes_name:0 "尘之井"
 artifact_well_ashes_description:0 "一个非常深的大锅，显然是由扫罗或一位强大的巴力（也可能是共同）创造的，据传它能够使一个吸血鬼恢复到完全的凡俗状态。根据不同的传说，其代价可能高达咬一百个凡人在其中被焚烧。"
 artifact_martyr_icon_name:0 "殉道者图示"
 artifact_martyr_icon_description:0 "一幅关于亚伯的小画，被其制作者的血赋予了力量。一小部分早已失去的人性残余。"
 artifact_veddartha_chalice_name:0 "梵达多之杯"
 artifact_veddartha_chalice_description:0 "据称，梵卓氏族的创始人用这个杯子喝了他尊长的血，而不是在初拥时直接从他的血管中享用。梵卓氏族把这个东西作为他们创始人的决心和勇气的象征，即使被吸干了血，他还能坚持用杯子喝血。"
 artifact_tyrant_lash_name:0 "暴君之鞭"
 artifact_tyrant_lash_description:0 "暴君之鞭是一条简单的马鞭，顶端有一个小倒钩，是在睿魔尔崛起后不久，由一位棘秘魑库都创造的。这条鞭子会放大其击打的痛苦，每当它击中目标时都会产生一种虚弱和无助的感觉。"
 artifact_wax_seal_name:0 "蜡封"
 artifact_wax_seal_description:0 "只要有几滴血，王者之路的吸血鬼就能对普通的蜡封附魔，使其对窥探的手和眼睛有特别的抵抗力。"
 artifact_empowerment_justicars_name:0 "司法官的新生"
 artifact_empowerment_justicars_description:0 "一份神秘的文件，由欧洲一些最有权势的亲王签署，其中提到了统治者由他们的同僚来审判的权利。它设立了“司法官”的职能，作为法官和刽子手，是凌驾于诸亲王之上的唯一权威。"
 artifact_letters_acindynus_name:0 "阿辛底努斯的信件"
 artifact_letters_acindynus_description:0 "阿辛底努斯从罗马时代起就一直在编纂有关该隐之子亲王和国王权利的资料。随着征服之道的巩固，这些信件更加注重心路的历史和理念，作为王者之路的引子，一直到今天。"
 artifact_lyrics_aconia_name:0 "阿科尼亚·梅莎莉娜的诗歌"
 artifact_lyrics_aconia_description:0 "坦率地说，这些歌词具有色情特征，它们的想象力非常丰富，既挑逗又放肆，既怀念又充满憧憬，而且明目张胆地性感。纵欲之道的追随者认为对诗歌的精确形象进行再创造是一种神圣的艺术。"
 artifact_satires_name:0 "讽刺集"
 artifact_satires_description:0 "各种形式的社会和宗教评论作品合集，包括了恶毒的讽刺诗到游吟诗人歌曲。"
 artifact_pilgrim_badge_name:0 "朝圣者的徽章"
 artifact_pilgrim_badge_description:0 "为了反映和嘲笑凡人朝圣的趋势，罪人已经开始收集他们最终旅途的漂亮饰品，从布匿石碑的微小复制品到拜占庭风格的珠宝。"
 artifact_sigil_misrule_name:0 "狂宴之王的印记"
 artifact_sigil_misrule_description:0 "狂宴之王的传统农神节标志是由每个庆祝黑暗至点的罪人小团体在每个新年里制作的。"
 artifact_water_venus_name:0 "维纳斯之水"
 artifact_water_venus_description:0 "一种强烈的混合物，能使凡人的感官提高到极端程度，使他们的血更甜美。"
 artifact_enchanted_scimitar_name:0 "附魔弯刀"
 artifact_enchanted_scimitar_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n大术士阿什拉夫并不经常使用这件武器。但是，当一名敌人证明了自己对血魔法的抵抗力特别强时，他已经准备好了。"
 artifact_code_chivalry_name:0 "骑士守则"
 artifact_code_chivalry_description:0 "骑士守则是对更古老和相当神秘的东西的转录，是任何有抱负的该隐之子骑士的准则，经常被批判，但仍然受到尊重。"
 artifact_chronicles_heartblood_name:0 "地血编年史"
 artifact_chronicles_heartblood_description:0 "这是一部由哈基姆本人撰写的哈基姆圣裔自创建以来的完整历史。遗憾的是，前几章是以传说的形式写成的，使其有很多争论和注解。"
 artifact_laws_haqim_name:0 "哈基姆律法"
 artifact_laws_haqim_description:0 "它们是鹰巢图书馆的核心，用以诺语镌刻在一系列泥板上，保存得近乎完美。由于以诺语是一种失传的语言，因此有相当多不同的翻译。"
 artifact_book_going_night_name:0 "离世夜之书"
 artifact_book_going_night_description:0 "一本由赛特传下来的书卷，包含了所有必要的仪式，使赛特之子能够过渡到来世。"
 artifact_apostate_auguries_name:0 "叛教者鸟占集"
 artifact_apostate_auguries_description:0 "这是特黎佛撒的预言集，鸟占集详细描述了一个巨大的阴影从深渊中升起，以及一个被囚禁在那里的巨兽的逃脱。然后这只巨兽将攻击一些东西，研究者认为这在说儿子或太阳。这其中的一些内容指向了火焚末日和勒森魃上古耆宿的崛起。"
 artifact_louhi_staff_name:0 "娄希之杖"
 artifact_louhi_staff_description:0 "一根刻有各种符文的黑杖，由强大的女巫娄希所使用，据说她的力量甚至可以与最有成就的血术士相媲美。"
 artifact_shroud_kaymakli_name:0 "凯马克勒护碟"
 artifact_shroud_kaymakli_description:0 "被血浸透的圆盘上刻有用以诺语书写的铭文。很难读懂，翻译出来也没什么意义，但它仍然是一件令人印象深刻的遗物，似乎有更深层次的故事要讲。"
 artifact_spear_bathel_name:0 "伯特利之矛"
 artifact_spear_bathel_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n一把长矛，据说可以保护持矛者免受伤害，同时杀死任何被它划伤的敌人。虽然可能是虚构的故事，但它在叛逆的梵卓西格弗里德身边赢得了相当大的声誉。"
 artifact_biblia_negra_name:0 "黑圣经"
 artifact_biblia_negra_description:0 "圣经中提到了67个被困在大地中的远古存在体，他们梦想着有朝一日能够获得自由并接管世界。在这67个存在体中，有13个被命名为上古耆宿。这本书的每一页都散发着恐吓，使它越来越难阅读。"
 artifact_wooden_coffin_name:0 "木棺材"
 artifact_wooden_coffin_description:0 "一个用松木制成的长盒子，用来安放尸体。总比被扔进万人坑要好，但也仅限于此。"
 artifact_lupine_hide_name:0 "狼人毛皮"
 artifact_lupine_hide_description:0 "变化者——狼人——的毛皮标本。也可能只是一只非常大的狼的毛皮。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 artifact_lupine_skull_name:0 "狼人颅骨"
 artifact_lupine_skull_description:0 "变化者——狼人——的头骨标本。也可能只是一只非常大的狼的头骨。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 artifact_skull_vampire_name:0 "吸血鬼颅骨"
 artifact_skull_vampire_description:0 "吸血鬼的头骨标本。如果没有特别准备，当非常古老的吸血鬼被摧毁时，他们通常会碎成灰烬。\n\n禁汝灭同类。灭之权惟汝之长。惟尔中最长者乃可召血猎。"
 artifact_banner_carthage_name:0 "迦太基之旗"
 artifact_banner_carthage_description:0 "这面破烂的旗帜据说是第三次布匿战争期间被罗马的梵卓俘虏的迦太基布鲁赫的旗帜。\n\n布鲁赫仍然从迦太基繁荣的伟大学者和哲学家的传说中汲取灵感，在这文化中，血族和血畜的关系比以前或以后的任何时候都要密切。然而，对其他人来说，这是一个恐怖和疯狂的城市，在那里，儿童被献给崇魔的巴力，而布鲁赫却视而不见。\n迦太基在有史以来最广泛的吸血鬼联盟手中沦陷，直到今天晚上仍然被认为是该隐之子历史上的一个关键事件。"
 artifact_blood_horn_name:0 "血角"
 artifact_blood_horn_description:0 "#bold 允许通过[decision|E]随意补充血液。#!\n著名的奥丁血角，一个可以从任何液体中创造血液的神器。当崇高之主消失后，血角也随之消失，直到你最近战胜了入侵者。显然，这是诸神青睐的标志。"
 artifact_sword_of_troile_name:0 "特洛伊尔之剑"
 artifact_sword_of_troile_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n这把水晶剑是该隐之子历史上最强大的武器之一，特洛伊尔本人曾在无数次保卫迦太基的战役中使用过这把水晶剑。"
 artifact_sword_of_dracula_name:0 "德古拉之剑"
 artifact_sword_of_dracula_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n德古拉之剑是一把质量极好的阔剑，闪亮的剑身搭配着华丽的剑柄。沿着剑长刻有许多东方和库都符号，护手和剑柄上嵌有五彩的宝石。这把剑是由德古拉的父亲龙公伏拉德通过雷伏诺突伽·辛和她对恶魔库帕拉的了解的帮助下铸造的。龙公伏拉德专门制作了这把剑，以杀死库帕拉和这个大恶魔的邪恶仆人。"
 artifact_tapestry_jawbone_name:0 "骨之织锦"
 artifact_tapestry_jawbone_description:0 "该挂毯由一位匿名的妥芮朵制作，然后在1190年被复制到了法兰西某地的一份圣咏经手稿中。"
 artifact_tapestry_noir_name:0 "挪得织锦"
 artifact_tapestry_noir_description:0 "这幅挂毯据说是末卡维预言家雅各在昏迷状态下创作的，描绘了《挪得之书》中的《该隐传》。在第一格中，该隐杀死了亚伯。在第二格中，该隐受到了上帝的诅咒。在第三格中，该隐遇到了莉莉丝。在最后一格，该隐抛弃了莉莉丝。雅各的仇敌以扫，花了很多钱和很多人情，雇佣了各种各样的“无名氏”来破坏挂毯。到目前为止，每样尝试都失败了，往往最后都是以破坏偶像主义者式的死亡告终。它已经成为爱之庭的高度渴望之物，他们把它称为“黑之挂毯”，因为有许多盗贼和破坏者在寻找它时死亡。"
 artifact_sculpture_of_ishtar_name:0 "伊丝塔的雕塑"
 artifact_sculpture_of_ishtar_description:0 "一座宏伟的雕塑，据说是亚力科的自画像。对以诺城的玫瑰的才华、骄傲和时常的傲慢的完美一瞥。"
 artifact_iulus_sword_name:0 "尤路斯之剑"
 artifact_iulus_sword_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n一把由永生的铸剑师尤路斯·卢夫斯·纳索锻造的罗马短剑。一把闪烁着罗马荣耀的完美工艺品，正如尤路斯本人所想的那样。"
 artifact_iulus_armor_name:0 "尤路斯之甲"
 artifact_iulus_armor_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n一件由永生的铸剑师尤路斯·卢夫斯·纳索锻造的古典罗马盔甲。一把闪烁着罗马荣耀的完美工艺品，正如尤路斯本人所想的那样。"
 artifact_esoara_ax_name:0 "埃索拉之斧"
 artifact_esoara_ax_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n睿魔尔的战将埃索拉携带的巨斧。这把大得不能再大的武器对普通人来说太重了，甚至连大多数吸血鬼都觉得它不方便使用。"
 artifact_house_tremere_name:0 "《睿魔尔家族》"
 artifact_house_tremere_description:0 "在他死于睿魔尔的可怕初期夜晚之后，本蒂库斯成了一位死灵，以比图吉斯为手，写下了他曾经高贵的家族，现在被腐化成黑暗的全部可怕的故事。"
 artifact_tremere_chronicles_name:0 "《睿魔尔编年史》"
 artifact_tremere_chronicles_description:0 "这是一部关于睿魔尔家族早期日子的宏伟而极度偏面的历史。传统上，塞里奥斯的堡主在任何议会会议之前都会宣读这本书。"
 artifact_robe_nessus_name:0 "涅索斯的长袍"
 artifact_robe_nessus_description:0 "似乎是在著名的神话中杀死赫拉克勒斯的毒袍。在每个人看来都是恐惧和不幸的象征，除了末卡维，他们似乎觉得弥漫在这件艺术品中的不祥之感很舒畅。"
 artifact_fingerbone_hannah_name:0 "圣汉娜的指骨"
 artifact_fingerbone_hannah_description:0 "#bold 即使没有[perk|E]，你也可以使用祝福。#!\n渗透着真信的小遗物。它被声称于1197年在耶路撒冷地下找到末卡维灵魂的稚子小团体发现，然后又丢失了。"
 artifact_plait_lucrezia_name:0 "圣卢克蕾齐娅的辫子"
 artifact_plait_lucrezia_description:0 "卢克蕾齐娅是一位高贵的原始教徒女士，她在皈依后剪掉了头发以示对天主的顺从，她被她小心眼的父亲送进了一个居有怪物的坑里。\n第二天早上，卢克蕾齐娅把她的头发编成了绳子，制服了那只怪物。她的头发似乎和以前一样结实而有光泽，可以用来捆绑任何邪恶的生物。"
 artifact_rayzeel_song_name:0 "雷齐尔之歌"
 artifact_rayzeel_song_description:0 "“无汝无光”，是雷齐尔最著名的歌曲的片段。它是如此美丽，以至于据说当扫罗那话不多的子嗣开始唱歌时，鸟儿都停下来听。扫罗自己也是在听到雷齐尔治愈灵魂的声音后，才从失去萨麦尔的悲痛中唤醒自己。"
 artifact_portrait_saulot_name:0 "扫罗的肖像"
 artifact_portrait_saulot_description:0 "萨洛比上古耆宿的唯一已知现存画像。在这幅质量不高的画中，一位身材矮小、黑发蓝眼的男人被表现出来。大多数萨洛比玛土撒拉在看到这幅画后，都认为它“粗看时”看起来像扫罗。"
 artifact_vitus_heel_name:0 "圣维特的脚跟"
 artifact_vitus_heel_description:0 "神经紊乱的主保圣人的遗物。虽然不能完全治愈末卡维的诅咒，但对他们还是有舒缓的作用。"
 artifact_dweomered_scimitar_name:0 "附咒的大马士革阿拉伯弯刀"
 artifact_dweomered_scimitar_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n一把强大的大马士革弯刀，被赋予了巨灵的魔力，这刀在没有尝到血前是无法回到鞘中的。"
 artifact_weyland_wyrcan_name:0 "维兰德之作"
 artifact_weyland_wyrcan_description:0 "#bold 解锁[single_combat_duel|E]招式。\n你必须得有35以上的勇武才能装备此武器。#!\n没有人知道维兰德是谁或者是什么，但他的刀剑却非常有名。几乎如同活物，它们会拒绝被弱小的人持有，甚至试图杀死不配的持有者。然而，如果被一位配得上的剑客持有，它们就将在战斗中高鸣，并在敌人群体中传播恐惧。"
 artifact_black_stake_name:0 "黑尖桩"
 artifact_black_stake_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n这块铁木应该是特洛伊尔用来使在吸榨她的尊长布鲁赫前瘫痪他用的。它在布鲁赫为解放自己而进行的反抗过程中遭受了很多，但仍然保留着一种可触及的神话般的强烈灵光。"
 artifact_roll_damned_name:0 "受诅者之卷"
 artifact_roll_damned_description:0 "受《末日审判书》的启发，这个项目包含了所有该隐之子的封建义务、纽带和英格兰吸血鬼的小团体的清单。虽然不是面面俱到，但这已经是一个非常令人印象深刻的勒索工具……而且明显违反了潜藏戒律的规定。"
 artifact_toomler_femur_name:0 "托姆勒的股骨"
 artifact_toomler_femur_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n托姆勒是一位棘秘魑玛土撒拉，因其能够分开身体的各个部分然后重新接上而闻名。不知何故，他的股骨在他死后仍然完好无损，并成为一种令人惊讶的有效但钝滞的武器。"
 artifact_cycle_lilith_name:0 "《莉莉丝始末记》"
 artifact_cycle_lilith_description:0 "《莉莉丝始末记》是一部据称是以莉莉丝的视角讲述的吸血鬼经文。它主要是巴哈里歌曲的集合（大部分是口头传下的），被编成一个循环曲。它更多的只有象征意义，而非真正讲述莉莉丝的故事本身。"
 artifact_veil_night_name:0 "暗夜之幔幕"
 artifact_veil_night_description:0 "这是一部关于穆斯林世界及其该隐之子的综合历史，以哈基姆圣裔维齐尔——阿布·法希姆·卡泰布以旅行日记的方式撰写。"
 artifact_tawiz_name:0 "塔维兹"
 artifact_tawiz_description:0 "戴在脖子上的小银质护身符，刻着《古兰经》语录。它被用来驱除邪灵或作为幸运符。"
 artifact_albuduh_name:0 "布杜"
 artifact_albuduh_description:0 "一个神秘的方块，刻画了一些数字，这些数字加起来是个幸运数值，其意义赋予了广泛的保护力量。"
 artifact_khoumsa_name:0 "五指之手"
 artifact_khoumsa_description:0 "画有法蒂玛之手的旗帜，五指的手代表穆罕默德、他的女儿法蒂玛、她的丈夫阿里和他的儿子们。它在很多情况下被使用，从吉祥物到战争旗帜。"
 artifact_inscrutable_eye_name:0 "高深之眼"
 artifact_inscrutable_eye_description:0 "一枚上面有埃及圣甲虫图案的戒指，在甲虫的甲壳中间有一颗眼睛形状的宝石。这枚戒指的做工非常古老，即使是吸血鬼的肉体也会感到它的寒冷。\n当用它专注于一个特定的吸血鬼时，有可能会确定他的位置和活动。"
 artifact_waxen_poetica_name:0 "蜡诗"
 artifact_waxen_poetica_description:0 "一块小蜡片，可以在让一滴血落入其中后扔向对手。如果它击中，蜡就会附着在受害者身上并开始扩散。它的温度极高，即使对该隐之子来说也是如此，它可以迅速地变得致命。"
 artifact_writings_cabirus_name:0 "卡比洛斯的秘密手稿"
 artifact_writings_cabirus_description:0 "完整的，但翻译得很糟糕的卡比洛斯的书，这位年轻的木乃伊描述了奥西里斯的生命神咒的内部运作。荷鲁斯的木乃伊们正在努力试图找到并摧毁它，担心如果被他们以外的人完全理解，它可能会被用于邪恶。"
 artifact_shattered_spear_name:0 "欧西雅的破碎长矛"
 artifact_shattered_spear_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n最勇敢的梵卓，阿尔忒弥斯·欧西雅的长矛的损坏残骸。这把武器具有传奇性的力量，但在迦太基的最后时刻，当阿尔忒弥斯倒下时，它就被折断了。然而，它仍然是一个强大的遗物，并且会拒绝由比斯巴达女神本人更不勇敢的人持有。"
 artifact_soulforged_artifact_name:0 "[killed.GetFirstNameNoTooltip]"
 artifact_soulforged_artifact_description:0 "用[killed.GetTitledFirstNameNoTooltip]的灵魂灵铸成的宝物，下手者为[owner.GetTitledFirstNameNoTooltip]。该宝物不断低语加呻吟，但大家都希望这只是意味着它能发声，而不意味别的。"
 artifact_fans_of_ma_yi_yuan_name:0 "马沂源的双扇"
 artifact_fans_of_ma_yi_yuan_description:0 "#Bold 允许在灵游时进入[dreaming|E]。#!\n此双扇是伪装过的致命武器。薄薄的金属折叠扇如剃刀般锋利，如最好的剑刃一样坚固。在扇子精致的装饰下，隐藏着大量的神秘力量，以及对土居的血液的渴望。扇子的使用者可以抵御妖精施放的任何法术，并且能够进入其等的界域。"
 artifact_antler_crown_name:0 "鹿角冠"
 artifact_antler_crown_description:0 "自部族早期的夜晚以来一直是芬尼安之王的象征。这强大的王冠只赋予配得上的人，所有牡鹿的后裔都有义务遵循它。"
 artifact_yuri_klaive_name:0 "尤里的月刃"
 artifact_yuri_klaive_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n一把精心锻造的，看上去有点平庸的月刃。不过，对于那些能看透的人来说，可以感受到与这把武器相关的伟大命运。"
 artifact_head_hardrule_name:0 "哈德鲁尔的头"
 artifact_head_hardrule_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n塔吉·哈德鲁尔是芬里尔仔兽有史以来最伟大的战士之一。但也是最暴虐的统治者之一，最终，当整个部族都反对他时，他付出了生命。他的头是一个提醒，让我们永远赞美伟大的战士，但也要警惕傲慢的代价。"
 artifact_bronze_labrys_name:0 "路西帕斯的青铜双头斧"
 artifact_bronze_labrys_description:0 "#bold 解锁[single_combat_duel|E]招式。#! \n一把完美保存的黄金时代的青铜双头斧，也许曾经属于路西帕斯本人。这把巨大的双手斧是黑怒间迄今为止最可怕的武器，也是最受尊敬的遗物。"
 artifact_artifact_pieces_name:0 "宝物碎片"
 artifact_artifact_pieces_description:0 "一块来自恶湍的遗物或宝物碎片。也许某[GetTrait('wraith').GetName( GetPlayer )]可以把它重塑回单件宝物。"
 artifact_gaia_big_thumb_name:0 "盖亚的大拇指"
 artifact_gaia_big_thumb_description:0 "这个超大的、木乃伊化的人类拇指有一个奇怪的特性，可以确保适当的交通工具总是在附近……但不保证这些交通工具去往何方。对于任何自重的弦月狼来说都是个迷，一件受人喜爱的啮骨者宝物，也是许多恶作剧的开始。"
 artifact_chalice_renewal_name:0 "复兴之杯"
 artifact_chalice_renewal_description:0 "一个神秘的金杯，能够自动填满海水。任何喝下它的人都会经历来自盖亚本人的记忆，然后被治愈任何疾病或伤口。这个珍贵的宝物曾出现在盖亚之子历史上的数个关键时刻。"
 artifact_watcher_shield_name:0 "看守者之盾"
 artifact_watcher_shield_description:0 "一个盾牌形式的小木牌，可戴在脖子上。这个灵具可以保护佩戴者免受任何形式的暗器攻击，确保芬里尔仔兽总是按自己的意愿战斗。"
 artifact_crescent_moon_waterskin_name:0 "新月水袋"
 artifact_crescent_moon_waterskin_description:0 "一件非常通用的神器，被人类监护者所珍视。它可以用来伪装自己，长出强大的爪子，甚至可以在喝下之后立即狂乱。"
 artifact_threefold_axe_name:0 "三重斧"
 artifact_threefold_axe_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n三重斧是芬尼安铁匠技艺的巅峰之作，它是一件精心打造的武器，可以最佳地对付任何敌人。在战斗中，它里面的器灵们会根据实际需要改变金属的成分，确保妖精面对金斧，狼人面对银斧等等。这武器极度罕见，因为让这么多的灵同居于其中确实是一个史诗般的壮举。"
 artifact_bramble_branch_name:0 "荆棘枝"
 artifact_bramble_branch_description:0 "一个强大的灵被缚在这枯枝上。一旦被激活，各种有毒的植物就会从地下冒出来，把这个地区封锁起来，不让任何干扰者进入。"
 artifact_assassin_klaive_name:0 "刺客的月刃"
 artifact_assassin_klaive_description:0 "#bold 解锁[single_combat_duel|E]招式。#!\n像真正的影爵一样圆滑而致命，这种注入了蛇之灵的月刃很容易隐藏，即使在最公开的地方也能掩盖其主人的存在。"
 artifact_firebird_feather_name:0 "火鸟之羽"
 artifact_firebird_feather_description:0 "火鸟之羽的确切属性并不为人所知。它只是看起来像一根美丽的发光羽毛，但当它被带进银牙之王的房间时，房间就像被无数根蜡烛照亮。它看起来也出奇地坚固，同时像最光洁的月刃一样锋利。"
 artifact_owl_talon_name:0 "枭爪"
 artifact_yellow_veil_name:0 "卡尔帕特里的黄面纱"
 artifact_yellow_veil_description:0 "无尽黑暗女士在审判不堪的星占时戴着这块面纱。这件宝物迫使持有者始终为正义而努力，任何接近它的人都要说出真相，坦白他们可能拥有的任何可耻的秘密。"
 artifact_owl_talon_description:0 "#bold 解锁[single_combat_duel|E]招式。#! \n这把弯曲的刀，类似于猫头鹰的爪子，是寂静漫游者持有的最强大的月刃。它内部有两个器灵，据说它特别渴望埃及吸血鬼的血液，期待着部族最终获得复仇的那一天。"
 artifact_djangalbi_name:0 "江加尔比"
 artifact_djangalbi_description:0 "赞助设定的非原作宝物\n江加尔比是一本巨大的书典，记录了该隐之子部队在永恒之战中的支出。其内容繁琐而密集，通过阅读它，可以提高人们对财政和王国管理的大局观理解。"
 artifact_sets_emasculation_name:0 "赛特之去势"
 artifact_sets_emasculation_description:0 "#bold 解锁独特内容。#!\n这把由陨铁和青铜打造的短刀看起来很不起眼，但刀身上的红色色调显示了它令人难以置信的传承。这把刀正是远古时期荷鲁斯用来阉割赛特的刀，无论谁来挥舞它，这把刀都散发着第一个持刀人的彭发能量和第一个受害者的残余生命力力量。信念和正义感本身都为这把传奇武器提供了动力。"
 artifact_pomegranate_name:0 "石榴"
 artifact_pomegranate_description:0 "#Bold 允许将[GetTrait('wraith').GetName( GetPlayer )]转为[GetTrait('risen').GetName( GetPlayer )]。#!\n由珀尔塞福涅的母亲——法师德墨忒尔创造的一个强大遗物，可用来在生者之地和死者之地之间制造通道。"
 artifact_vassagos_reliquary_name:0 "瓦沙克的宿匣"
 artifact_vassagos_reliquary_description:0 "$artifact_reliquarie_description$"
 artifact_klaive_name:0 "月刃"
 artifact_klaive_description:0 "The most famed weapons of all Garou, this blade is a silver lined and wicked weapon, a holy weapon wielded by Garou, stronger than any sword and bound with a spirit inside, a weapon so all non-garou who wield it are hunted endlessly for the blasphemous transgression."
 artifact_eternal_waterskin_name:0 "Eternal Waterskin"
 artifact_eternal_waterskin_description:0 "Benign but useful, this cowhide bag, when filled with water, never runs out no matter how much is drank from it. Sadly for many tribes, this only works with fresh water, either taken from rain or boiled, and does not work for things like mead or wine."
 artifact_beff_of_ice_name:0 "Beff of Ice"
 artifact_beff_of_ice_description:0 "A small needle made of blue ice encasing silver, this uniquely valuable fetish lets one burn out illness, as the user is able to literally shiver out infection, as the ice spirit within purges the user's system of illness, or more valuably, poison."
 artifact_spirit_astrolabe_name:0 "Spirit Astrolabe"
 artifact_spirit_astrolabe_description:0 "This wonderfully made astrolabe, bound with wave spirits, is a source of incredible guidance to any elder who uses this relic, allowing one to pierce the veils of distance with utter ease."
 artifact_truth_earring_name:0 "Truth Earring"
 artifact_truth_earring_description:0 "The bane of all unfaithful spouses, these fetishes, bound with spirits of honor, allow the wearers to more accutely pierce the veils of lies, and better pluck the kernals of truth from the oceans of lies."
 artifact_blanket_of_peaceful_past_name:0 "Blanket of Peaceful Past"
 artifact_blanket_of_peaceful_past_description:0 "A fetish of peace, when worn, the mother spirit within embraces the user, letting them, even if for a brief moment, return to being a small child or pup, when the world made sense, and nothing esle mattered, a blessed escape from the horrors of the world of darkness, to be held again by a loving mother or sleep at her side."
 artifact_dark_mask_name:0 "Dark Mask"
 artifact_dark_mask_description:0 "The subject of much debate, the origin of this strange fetish is unknown, buts its power is clear. Shadows bend and contort to aid the wearer, distorting light and blurring the wearer, inspiring a terrible dread in all who see them."
 artifact_eyes_of_the_night_name:0 "Eyes of the Night"
 artifact_eyes_of_the_night_description:0 "An utterly bizarre fetish, this iron basin, when spun into the air, allows the local areas day and night to be reversed in terms of light, an invaluably useful escape tool to cause brightness or darkness shock to any attacker, as their eyes adjust, letting the potential victim escape unharmed, or rather, exact vengeance on another poor victim..."
 artifact_kinship_doll_name:0 "Kinship Doll"
 artifact_kinship_doll_description:0 "Taking the form of a small child's toy doll, this fetish is meant to act a liason for the kinfolk to speak to a fera, letting them communicate and keep contact over long distances, so that they may never be far from their mate."
 artifact_law_skull_name:0 "Law Skull"
 artifact_law_skull_description:0 "One of the more macabre fetishes, this skull of a traitorous garou, when activated, can recite the litany, and demand oaths from those present. The fact one would even use this fetish is frightening enough..."
 artifact_moongleam_name:0 "Moongleam"
 artifact_moongleam_description:0 "This small pebble can be activated at any point during the night, and when done so, shines like a candle without the risk of fire, granting on the gift of variable light in the night without exposing oneself to the burning grasp of flames."
 artifact_air_foot_greaves_name:0 "Air Foot Greaves"
 artifact_air_foot_greaves_description:0 "A simple pair of shin guards emblazoned with wings, this fetish, bound with wind spirits, when clicked together by the wearer, lets them move with blinding speed, able to carry them to nigh any field the wearer desires."
 artifact_sun_axe_name:0 "Sun Axe"
 artifact_sun_axe_description:0 "An axe lined with golden beads, this cruel weapon, while bearing the potential to rend the children of Helios, when activated, can burn with sunlight, giving the fera wielder a precious weapon against the dreaded leeches, to end their tyranny of the night."
 artifact_whistle_caff_name:0 "Whistle Caff"
 artifact_whistle_caff_description:0 "A small wooden and bone whistle carved with glyphs, bound with the spirit of a newborn mammal, when blown, it emits a silent cry for help, alerting the family and friends of the user, so they may rush to their aid."
 artifact_book_of_the_spirits_secrets_name:0 "Book of the Spirit's Secrets"
 artifact_book_of_the_spirits_secrets_description:0 "This vellum tome, bound with spirits of wisdom, when read through, reveals many secrets about the umbra and world of the spirits, a textbook for any theurge, this valuable text essential for any legendary theurge."
 artifact_feathered_cloak_name:0 "Feathered Cloak"
 artifact_feathered_cloak_description:0 "One of the most heavily sought out fetishes, for a simple reason. The holders of this precious fetish, bound with wind spirits, gain the ability to fly with the same skill as a bat, the ability to soar into the skies a dream the wearer may finally achieve."
 artifact_tangling_lance_name:0 "Tangling Lance"
 artifact_tangling_lance_description:0 "This weathered, bramble lance resembles that of a large lizard tail, one that merely looks like a jousting lance of poor make, but when activated, the lance splits apart, and becomes like that of a giant lizard's tail, lashing out and grasping out at the wielder's now terrified foes."
 artifact_time_piece_name:0 "Time Piece"
 artifact_time_piece_description:0 "This curious fetish takes the form of a means of counting time, usually an hour glass or sun dial, that when activated, subtly twists the flow of time to hamper all those not close to the time piece at activation."
 artifact_wind_hammer_name:0 "Wind Hammer"
 artifact_wind_hammer_description:0 "This large, heavy warhammer, when activated, causes the fetish to dissolve into a storm of winds, letting the user strike like a raging twister, an untold beacon of carnage."
 artifact_bindrune_amulet_name:0 "Bindrune Amulet"
 artifact_bindrune_amulet_description:0 "This silver amulet of glyphs has on it, carved into silver and written in the language of the garou, this precious fetish allows one to channel the power of language and harness the words, offering insight into the mystique of language itself."
 artifact_cloud_string_name:0 "Cloud String"
 artifact_cloud_string_description:0 "This string of twine and beads, when unflurled, soars into the air, and then guides the heavens, allowing one to control rain and the weather. This powerful ability lets one bring wealth and prosperity to a region, an incredibly useful trait for tribes like the Warders of Men, less so to other tribes."
 artifact_horn_of_the_white_stag_name:0 "Horn of the White Stag"
 artifact_horn_of_the_white_stag_description:0 "One of the three lost sacred relics of the Hill of Tara, this massive hunting horn, when bellowed into, causes soldiers to flock to the side of the blower, as the army marches with blinding speed."
 artifact_golden_torc_name:0 "Golden Torc"
 artifact_golden_torc_description:0 "One of the three lost sacred relics of the Hill of Tara, this immaculate crown was once the badge of office for the Fianna High Kings of Eiru, this treasured relic a potent symbol of a most ancient nobility."
 artifact_crones_tongue_name:0 "Crone's Tongue"
 artifact_crones_tongue_description:0 "One of the three lost sacred relics of the Hill of Tara, the Corne's Tongue is a suprisingly simple longsword, but in the presence of wyrmthralls, it shines with burning light, and the blade bites far worse than even the talons of a Garou."
 artifact_lepers_rags_name:0 "Leper's Rags"
 artifact_lepers_rags_description:0 "This ratty, mangy cloak, when worn, allows the wearer to assume the form of an unassuming begger, no matter what they were before, allowing for a massive slew of options for intrigue."
 artifact_trail_branch_name:0 "Trail Branch"
 artifact_trail_branch_description:0 "A small twig taken from the underbrush, bonded with a spirit of the wilds, this twig covers ones tracks and makes traversing the wilderness far more easy, as the spirit within guides its holder."
 artifact_feather_of_the_waters_name:0 "Feather of the Waters"
 artifact_feather_of_the_waters_description:0 "A cloak of the feathers made from unusual flightless birds from the far south, this warming cloak allows anything with Gnosis to swim with the same degree of ease as a fish, letting them extend the places they can go with tremendous ability."
 artifact_heart_of_fire_name:0 "Heart of Fire"
 artifact_heart_of_fire_description:0 "A surprisingly dangerous fetish, this tiny red crystal allows its owner to set objects on fire, a small but amazingly deadly thing to have on hand."
 artifact_sun_crystal_name:0 "Sun Crystal"
 artifact_sun_crystal_description:0 "This yellow gem contains a light spirit within, that upon the user's activation, causes this little bauble to shine like a small drop of sunlight, illuminating areas of the holder's desire."
 artifact_beast_mask_name:0 "Beast Mask"
 artifact_beast_mask_description:0 "A mask of shapeshifting, this useful mask, when worn, causes the user to shapeshift into the animal it is designed as, giving them the added mobility of the animal, and the innocous nature of said animal, for whatever the user desires."
 artifact_belt_of_the_giants_name:0 "Belt of the Giants"
 artifact_belt_of_the_giants_description:0 "This very rare fetish, when driven to action by the wearer, causes them to double in size, increasing their strength tremendously, and letting them wrech havoc. On the downside, however, is the heart does not grow in size, making it horribly stressful for the user's body."
 artifact_cloak_of_woven_mists_name:0 "Cloak of Woven Mists"
 artifact_cloak_of_woven_mists_description:0 "The Cloak of Woven Mists appears as a chain rope necklace with an intricate brooch. When activated by the wearer, shadows and vapors creep into the air, making the wearer hazy and indistinct, making them incredibly stealthy, as quite as the whisper of a draft."
 artifact_staff_of_life_name:0 "Staff of Life"
 artifact_staff_of_life_description:0 "A large walking stick that can double as a bonking stick, this useful fetish can fortify the health of the wearer and protect them from harm through the bolstering of their health."
 artifact_bone_flute_name:0 "Bone Flute"
 artifact_bone_flute_description:0 "A clever relic that inspires pain against the undead, it soothes the living, and those that hear it can't help but respect their lord further."
 artifact_forest_crown_name:0 "Forest Crown"
 artifact_forest_crown_description:0 "A fetish in the shape of a bramble crown that fits to the weaerer's head, becoming an icon of rulership, of the spirit of wilds inspires them to be a sovereign lord of the wilds on behalf of the wild."
 artifact_iron_crown_name:0 "Iron Crown"
 artifact_iron_crown_description:0 "A fetish in the shape of an iron crown that fits to the wearer's head, becomes an icon of rulership, as the spirit of nobility within inpsires them to epic heights of leadership, and as such was favored in older eras by the Warders of Men."
 artifact_keystone_name:0 "Keystone"
 artifact_keystone_description:0 "This runestone, betraying its apperance, whenever pressed to a stone material, allows it to open like a door, letting the user pass through nearly any stone obstacle."
 artifact_dreamcaller_name:0 "Dreamcaller"
 artifact_dreamcaller_description:0 "This incredibly valuable flute lets one open rifts into dreams, letting one dance and learn within them, and explore the depths of the thinking mind, for any insights they may provide."
 artifact_harp_of_enchantment_name:0 "Harp of Enchantment"
 artifact_harp_of_enchantment_description:0 "This harp, when strum, lets loose a beautiful concordant melody, a truly breathtaking sonnata that can drive even the most war hardened garou in harano to tears."
 artifact_iceblade_name:0 "Iceblade"
 artifact_iceblade_description:0 "A precious blade made from the unmelting blue ice of the artic north, this pallid weapon strikes with the same chill of the biting north, while also letting one cleave through the elements as if it was summer."
 artifact_lionfang_name:0 "Lionfang"
 artifact_lionfang_description:0 "This potent fetish is carved from the fangs of a terrible beast, rumored to have been even stolen from the bastet, making this incredibly dangerous weapon strike with the same force of one of the garou nation's oldest rivals."
 artifact_ring_of_elements_name:0 "Ring of the Elements"
 artifact_ring_of_elements_description:0 "One of the most potent of fetishes, a Ring of the Elements gives a Garou power over all four of the elements, earth, air, fire and water. When activated, a Garou may not be harmed by attacks involving these forces. For example, torches would refuse to burn a Garou, stones or even a metal sword would bounce harmlessly off her skin, and she would not drown underwater."
 artifact_grand_klaive_name:0 "Grand Klaive"
 artifact_grand_klaive_description:0 "The klaives of the mightiest heroes, these legendary weapons are better than klaives in all respects, the bound war spirit within howling with rage for the death of the wielder's foes."
 artifact_forge_crusher_name:0 "Forge-Crusher"
 artifact_forge_crusher_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. Forge-Crusher, when used, burns with a roaring flame, capable of inflicting horrible pain."
 artifact_grinding_tooth_name:0 "Grinding-Tooth"
 artifact_grinding_tooth_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. Grinding-Tooth can grind any stone to powder, laying low all of the earth before it."
 artifact_spear_chaser_name:0 "Spear-Chaser"
 artifact_spear_chaser_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. This impressive hammer soars when thrown, hurling to incredible distances, impossible to be broken in a throw."
 artifact_troll_eater_name:0 "Troll-Eater"
 artifact_troll_eater_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. Troll-Eater, more than any other Jarl Hammer, obliterates armor, rending it like birch bark."
 artifact_bright_arm_name:0 "Bright-Arm"
 artifact_bright_arm_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. Bright-Arm, when wielded, shines like the sun, humming with light and blinding opponents."
 artifact_hag_talon_name:0 "Hag-Talon"
 artifact_hag_talon_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. Hag-Talon shields its wearer's mind, giving them unparalleled mental defenses."
 artifact_pain_eagle_name:0 "Pain-Eagle"
 artifact_pain_eagle_description:0 "One of the Jarl Hammers, these mighty two-handed hammers are the pinnacle of craftsmanship. Like lesser klaives, these hammers are forged with silver, cooled in the blood of enemies of Gaia. Pain-Eagle is the most ruinous of the Jarl Hammers, leaving throbbing, agony wracking wounds."
 artifact_runestone_of_gab_name:0 "Runestone of Gab"
 artifact_runestone_of_gab_description:0 "A collection of precious prophetic stones, these heavily enchanted reading stones offer the user valuable insights into the future. These runestones offer key insights into the art of conversation craft, allowing the user to be a master of speechcraft."
 artifact_runestone_of_war_name:0 "Runestone of War"
 artifact_runestone_of_war_description:0 "A collection of precious prophetic stones, these heavily enchanted reading stones offer the user valuable insights into the future. These runestones in particular are inhabited by a war spirit, giving the user utterly total knowledge of the battlefield before any troops even set foot on the fields of war."
 artifact_runestone_of_control_name:0 "Runestone of Control"
 artifact_runestone_of_control_description:0 "A collection of precious prophetic stones, these heavily enchanted reading stones offer the user valuable insights into the future. These stones can predict the flow of commerce and population, giving the user an unparalleled insight into matters of stewardship."
 artifact_runestone_of_cunning_name:0 "Runestone of Cunning"
 artifact_runestone_of_cunning_description:0 "A collection of precious prophetic stones, these heavily enchanted reading stones offer the user valuable insights into the future. These stones allow one to maintain and control schemes of byzantine and dizzying complexity, allowing othe user to become a spymaster without peer."
 artifact_runestone_of_wisdom_name:0 "Runestone of Wisdom"
 artifact_runestone_of_wisdom_description:0 "A collection of precious prophetic stones, these heavily enchanted reading stones offer the user valuable insights into the future. These stones read of powerful visions of theology and medicine, giving the user powerful insights into the mystic traditions."
 artifact_shining_klaive_of_sokhta_name:0 "Shining Klaive of Sohkta"
 artifact_shining_klaive_of_sokhta_description:0 "A klaive made of gold and quicksilver, unlike other Klaives, this weapon is perfectly safe for all Fera to use, and in fact bolsters them even further. This warping, terrifying weapon inspires dread in all who hear of it, a Fera that may act unbowed of their legendary weakness."
 artifact_radiant_blade_of_katanka_sonnak_name:0 "Radiant Blade of Katanka-Sonnak"
 artifact_radiant_blade_of_katanka_sonnak_description:0 "This terrifying blade made of a mix of silver and gold, this terrifying weapon burns with the light of the Incarna Avatar of the Helios, Katanka-Sonnak, patron of the Corax and Mokole. This blazing weapon inspires the same swiftness of which Helios traverses the sky, moving with his same breath of grace and deftness."
 artifact_mercurial_mask_of_mitanu_name:0 "Mercurial Mask of Mitanu"
 artifact_mercurial_mask_of_mitanu_description:0 "The mask of the trickster, a gift from the Incarna of Mercury, Mitanu, this wonder dress mask allows one to totally hide their presence, becoming just as its maker, a lord of intrigue."
 artifact_burning_mask_of_hakahe_name:0 "Burning Mask of Hakahe"
 artifact_burning_mask_of_hakahe_description:0 "Once the forge-mask of the Incarna of Vulcan, Hakahe, Lord of the Shadowed Planet, this black iron mask imparts a piece of the forge master into the wearer, protecting them and giving them his own wisdom, both in the manners of gold and wisdom."
 artifact_radiant_dress_of_tambiyah_name:0 "Radiant Dress of Tambiyah"
 artifact_radiant_dress_of_tambiyah_description:0 "A beautiful tapestry made of the strongest iron, this dress, the masterpiece of the Tambiyah, the Incarna of Venus, does credit to anyone who wears it. This immaculate dress shapes with the wearer, and becomes many fine jewelry pieces and baubles in other forms, but even across it, the dress guards the wearer, against all affronts."
 artifact_eternal_grace_of_eshtarras_might_name:0 "Eternal Grace of Eshtarra's Might"
 artifact_eternal_grace_of_eshtarras_might_description:0 "Within this amulet is the blessing of Eshtarra, the Incarna of Earth, the Avatar of Gaia. This incredible relic gives the wearer the vitality of 8 mortal men, unbound ferility, and her own wisdom of leadership, the mother of all. This precious relic is of the finest materials of Gaia's bounty, and her touch even on anyone is a sign of her unfailing blessing and warmth, made from a piece of her radiant throne."
 artifact_burning_horns_of_nerigal_name:0 "Burning Horns of Nerigal"
 artifact_burning_horns_of_nerigal_description:0 "These red clay hunting horns were made from the Dust of the Red Planet, by the Incarna of Mars, Nerigal. When held and blown, these horns shake Gaia herself, calling all loyal to the blower to war, as the might and cunning of the War Incarna flow into them, calling all to win in his name."
 artifact_ruinous_talons_of_rorg_name:0 "Ruinous Talons of Rorg"
 artifact_ruinous_talons_of_rorg_description:0 "These meteor metal gauntlets made of the broken remains of the Turog, the consort of Gaia, these talons are a gift from Rorg, the Incarna of the Asteroids between Mars and Jupiter, and of vengeance and of rage. With these, his will is made manifest, as the wielders who branish them become his living rage, unleashing carnage against all before them."
 artifact_imperious_crown_of_zarok_name:0 "Imperious Crown of Zarok"
 artifact_imperious_crown_of_zarok_description:0 "The crown of the King of Kings, this immaculate, gem encrusted crown was hand tooled by the Incarna of Kings and Jupiter, Zarok, the one time suitor of Gaia, the Greatest of the Incarna after Luna and Helios. When worn, one becomes a living visage of the greatest of kings, as the wealth of magnificence flows into them."
 artifact_eternal_wings_of_lu_bat_name:0 "Eternal Wings of Lu-Bat"
 artifact_eternal_wings_of_lu_bat_description:0 "This feathered cloak is a gift from the Incarna of Saturn, the Incarna of Jupiter, the Great Owl. With these, the wielder may take to the skies, and soar through both the Umbra and the Skinlands, and carry within them his own nature and wisdom."
 artifact_shadowed_stave_of_ruatma_name:0 "Shadowed Stave of Ruatma"
 artifact_shadowed_stave_of_ruatma_description:0 "This small, handhelf staff is said to have a small sliver of Ruatma's voice, the Incarna Uranus, within it. Through it, the Incarna speaks to its holder, whispering many critical secrets and lores. However, perhaps some of these were not meant to be learned..."
 artifact_dancing_loom_of_shantar_name:0 "Dancing Loom of Shantar"
 artifact_dancing_loom_of_shantar_description:0 "This luminous harp is of immaculate creation, woven by the hands of Shantar, the Incarna of Neptune. unlike all her other Looms, this one was made with her regular focus, a gift to her champion, and in it, the waves of her beautiful songs flow through them, easing the nerves like nothing else."
 artifact_whispering_ankh_of_meros_name:0 "Whispering Ankh of Meros"
 artifact_whispering_ankh_of_meros_description:0 "This weathered, silver ankh seems to bear much of the wears of age, and is the most precious gift from the Incarna Meros, the Incarna of Pluto. This precious hand held symbol allows the user to move with mystifying speeds, and when speaking, the holder has a fragment of the voice of the Eternal Wanderer."
 eternal_love_artifact_name:0 "Eternal Love"
 eternal_love_artifact_description:0 "#bold Unlock [single_combat_duel|E] moves. #! \nWhile it is not exactly magical, it cannot be denied that this sword has a certain mystical dweomer. Made of silver, it creates wounds that cannot be healed by vampires. Only by mixing another Vampire's blood with their own and then pressing it to the wound can they heal it. This weapon was crafted for Prias by the Cainite craftsmen of Carthage for use in his vampire-hunting expeditions."