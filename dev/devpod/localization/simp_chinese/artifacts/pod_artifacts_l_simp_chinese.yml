l_simp_chinese:
 artifact_sword_of_nul_name:0 "努尔之剑"
 artifact_sword_of_nul_description:0 "#bold 解锁独特内容。#!\n这柄剑短而直的青铜剑看起来很无害。整把武器随着时间的推移呈现为了青色。但它仍然很锋利，非常锋利，比最好的钢还要锋利。\n这柄剑背后的故事非常血腥，每一任它的主人都会离奇死亡。努尔之剑终将与它真正的主人团聚，无论如何。"
 artifact_tablet_of_destiny_name:0 "命运石板"
 artifact_tablet_of_destiny_description:0 "#bold 解锁独特内容。#!\n根据埃努玛·埃利什，命运石板是人类的法律，由以诺亲自设立。这些泥板上到底写着什么，有很多猜测。最为公认的一种理论认为这是一本关于血之力量的编年史，解释了所有以诺魔法。无论如何，据说伊什塔尔曾试图从伊娜依娅处拿走这一物品，这引发了两位[antediluvian|E]之间的激烈战斗，几乎使得妥芮朵氏族两度毁灭。"
 artifact_eye_of_hazimel_name:0 "哈济梅尔之眼"
 artifact_eye_of_hazimel_description:0 "#bold 解锁独特内容。#!\n这件遗物的故事充满了疯狂、血腥和绝望。哈济梅尔之眼似乎是一位强大的雷伏诺玛土撒拉的最后一块有活力的碎片，可以以巨大的代价为他的持用者提供不可思议的力量。想要了解它的秘密，用它替换你自己的眼睛只是你要做的第一件事，也是最简单的一件事……"
 artifact_ankaran_sarcophagus_name:0 "安卡拉石棺"
 artifact_ankaran_sarcophagus_description:0 "#bold 解锁独特内容。#!\n不要打开它。"
 artifact_kristrbani_name:0 "克里斯特巴尼"
 artifact_kristrbani_description:0 "弑主者是巴尔伯格女王选择的武器。这是一把凡人难以举起的巨型战锤，被鲜血一次又一次地浸染着。这是它无情的[einherjar|E]主人所热衷于继续的事业。"
 artifact_euagetaematikon_name:0 "闪耀圣血之经"
 artifact_euagetaematikon_description:0 "闪耀圣血之经是该隐教会的圣经。由君士坦丁堡的一位疯狂的僧侣撰写，这本几乎不连贯的文本宣布了该隐之子种族的命运，即在最后的弥赛亚身边行走，在无休止的血腥性爱狂欢中统治世界。"
 artifact_ainkurn_name:0 "安库恩"
 artifact_ainkurn_description:0 "根据传说，安库恩之剑可以让人摧毁玛土撒拉，单枪匹马地战胜贪婪的狼人，甚至进入亡者的国度。无论是幻想还是事实，这把强大的剑都是由突伽·辛制造的，作为一种更强大的武器的蓝本，用于未来的动荡时代。它最著名的事迹是克里斯托夫·罗慕铎对布拉格的吸血鬼的暴走，清楚地证明了它的有效性。"
 artifact_lamp_of_constantine_name:0 "君士坦丁的神灯"
 artifact_lamp_of_constantine_description:0 "#bold 即使没有[perk|E]，你也可以使用谴咒。#!\n据说，耶稣授予了君士坦丁大帝太阳本身的一部分，作为对他皈依的奖励。君士坦丁将这块圣物放在一盏交织印有希腊字母“χ”和“ρ”的灯中，以纪念他的异象并向基督致敬。据说这盏灯拥有以圣光消灭恶魔和其他夜行生物的力量。"
 artifact_magic_lantern_name:0 "魔法神灯"
 artifact_magic_lantern_description:0 "这是一个巨大但朴素的陶土瓮，这盏神灯曾经属于拉撒路，后来在火之庭的阴谋中丢失了。一旦暴露在阳光下，它就会呈现出奇怪的图案和有趣的谜题。"
 artifact_japhet_cloak_name:0 "雅弗的斗篷"
 artifact_japhet_cloak_description:0 "一块奇怪的半透明斗篷，可以抵御死灵。雅弗自己几乎不需要它，但他平静地回答说，这件圣物被使用的时刻将很快到来。"
 artifact_scarlet_rose_name:0 "亚历山大的猩红玫瑰"
 artifact_scarlet_rose_description:0 "当他的爱人洛林背叛了他时，亚历山大绑架了她，并在这花中慢慢地吸干了她的血。当她最终屈服时，洛林原谅了他，而玛土撒拉则被逼得发狂。这朵血淋淋的玫瑰现在正渴求着更多吸血鬼的血液，并不断提醒着亚历山大的失败。"
 artifact_infernal_tome_name:0 "魔邪书卷"
 artifact_infernal_tome_description:0 "恶魔用来引诱软弱的凡人和该隐之子崇拜他们的六本魔邪书卷之一。它没有包含什么有用的信息，也没有“真名”，因为它主要是恶魔的工具。"
 artifact_flagrum_passion_name:0 "受难之鞭"
 artifact_flagrum_passion_description:0 "#bold 解锁圣遗物决议。#!\n在受难期间一次又一次地刺穿基督的肉体的武器。由于以利亚撒的使用，这个遗物已经有些腐化，他的血与基督的血混合在了一起，但它仍然是信仰的强大灯塔。"
 artifact_night_lantern_name:0 "夜父之灯"
 artifact_night_lantern_description:0 "#bold 给予混淆术。#!\n这盏灯由一名诺斯费拉图玛土撒拉所精心制作，允许持有者使用类似于混淆术的[discipline|EL]。也有传言说，它有更险恶的秘密，但到目前为止，没有人能够证实这一点。"
 artifact_corona_ferrata_name:0 "铁之冠"
 artifact_corona_ferrata_description:0 "作为圣费雷奥勒和圣费罗提欧的遗物，这个强大的冠冕对真信徒有抚慰作用。而对不信者则有更致命的影响。它的主人每天都会被它伤害一次，使圣血从他的前额溢出到他的下巴，形成一种令人毛骨悚然的自我鞭笞现象。"
 artifact_caecus_rose_name:0 "卡耶库斯玫瑰"
 artifact_caecus_rose_description:0 "由熟练的园丁卡耶库斯为美丽的海伦创造的，这朵玫瑰可以倾听附近的任何谈话，一种模仿观占术[discipline|EL]的微妙力量。"
 artifact_makeda_crown_name:0 "玛克达之冠"
 artifact_makeda_crown_description:0 "伟大的示巴女王的金冠有能力击退那些堕入恶魔崇拜的吸血鬼。兰斯亲王尼科迪默斯将它赠予海伦，她选择只在私下里佩戴，以示对已故女王的尊重。"
 artifact_goratrix_mirror_name:0 "格拉崔克斯之镜"
 artifact_goratrix_mirror_description:0 "一面被格拉崔克斯施了魔法的镜子，可以轻松地从一个地方传送到另一个地方。如果事先准备好镜子，它可以让使用者极度减少路途时间。"
 artifact_shemaziel_sarcophagus_name:0 "夏孟泽尔石棺"
 artifact_shemaziel_sarcophagus_description:0 "#bold 解锁独特内容。#!\n这是一副由未知的黑色岩石制成的沉重石棺，这个可怕的物品被坚固的锁链保护着。你觉得自己绝对绝对不应该打开它。"
 artifact_codex_mortis_name:0 "死灵圣书"
 artifact_codex_mortis_description:0 "#bold 解锁乔凡尼亡灵术。#!\n这本圣书包含了许多亡灵仪式……以及死灵蒂亚·赛比娜的受诅灵魂。她的丈夫奥勒留·弗拉维乌斯·约维安为了保护这本书和她的灵魂，自愿成为吸血鬼，不让任何人伤害他们。"
 artifact_slay_death_name:0 "弑死"
 artifact_slay_death_description:0 "这把巨大的斧头是彼得鲁斯选择的武器，他是科隆布亲王的刽子手。这也是他唯一的真爱。"
 artifact_michaelis_rosary_name:0 "米歇尔的玫瑰经"
 artifact_michaelis_rosary_description:0 "包含了米歇尔的回忆的106颗象牙珍珠，他是一位妥芮朵氏族的强大玛土撒拉。唯一没有被玷污的是他初拥埃斯克莱蒙德的记忆，他最爱的子嗣。"
 artifact_abraxas_sarcophagus_name:0 "阿卜拉克萨斯石棺"
 artifact_abraxas_sarcophagus_description:0 "这座由黄金和珍贵宝石制成的石棺是巴西里得的安息之地，巴西里得是一位被遗忘的基督教起源时代的圣人。他关于礼拜仪式的理论和检验对于任何一名神学家来说都是非常令人感兴趣的。"
 artifact_ermentrude_cross_name:0 "圣厄门特鲁德的十字"
 artifact_ermentrude_cross_description:0 "这位布列塔尼的殉道者遗留下了一个十字架，现在被做成了一条项链，它可以击退任何狼。它也会与真信产生共鸣。"
 artifact_odin_stone_name:0 "奥丁的符文石"
 artifact_odin_stone_description:0 "垂死的奥丁在这块石头上刻出了第一个如尼文。其中还蕴藏着三名渥尔娃女巫的灵魂，她们在被一名维京军阀屠杀前守护着这件圣物。"
 artifact_holy_flask_name:0 "圣瓶"
 artifact_holy_flask_description:0 "圣雷米在为法兰克第一任国王克洛维一世加冕时，用这个瓶子给他涂油。从那以后，它的圣油似乎总是用不完。"
 artifact_uraeus_osiris_name:0 "奥西里斯的圣毒蛇"
 artifact_uraeus_osiris_description:0 "这个金蛇雕像在奥西里斯本人的埃及头巾（冠冕）上。它有能力打开一扇通往阿蒙提——埃及的冥界之一——的门。在荷鲁斯突袭马赛的赛特之子神庙后，被格拉崔克斯偷走了。"
 artifact_ayr_sword_name:0 "艾尔之剑"
 artifact_ayr_sword_description:0 "传奇铁匠艾尔·铁砧创造的七柄剑之一。为它的主人量身定做，几乎坚不可摧，并附上了强大的魔法。"
 artifact_ayr_armor_name:0 "艾尔之甲"
 artifact_ayr_armor_description:0 "传奇铁匠艾尔·铁砧创造的五盔甲之一。为它的主人量身定做，几乎坚不可摧，并附上了强大的魔法。"
 artifact_sofia_finger_name:0 "索菲亚的指骨"
 artifact_sofia_finger_description:0 "在内心深处，索菲亚总是知道关于黑夜的邪恶的真相。她被一位结仇的吸血鬼盯上了，当他来的时候，她已经准备好了，并牺牲了自己来阻止他。她的遗物授予你关于你周围的邪恶者的弱点的知识。"
 artifact_water_meriba_name:0 "梅里巴之水"
 artifact_water_meriba_description:0 "#bold 你的饥渴上升概率降低。#!\n梅里巴之水为走出埃及的干涸的希伯来人提供了救赎，但对摩西本人来说却是诅咒。在凡人教会的眼中，摩西的傲慢腐蚀了梅里巴的奇迹，但在该隐之子中仍然存在对它的交易。毕竟，摩西类似于该隐，被神诅咒永远找不到回家的路。"
 artifact_hand_nikolas_name:0 "尼古拉斯之手"
 artifact_hand_nikolas_description:0 "#bold 你将不再会血狂。#!\n尼古拉斯是一位圣洁、和平的诺斯费拉图，在被一位过度狂热的狂热者杀死之前，有着小型密教崇拜着他。他的手仍然没有腐烂成灰烬，它有一种不可思议的能力，甚至可以安抚最愤怒的心兽。"
 artifact_caul_jos_name:0 "乔斯的胎膜"
 artifact_caul_jos_description:0 "乔斯出生时就带着胎膜——这预示着他在生活中会很幸运。他的母亲小心翼翼地擦干皮肤，并将其缝入一个小袋子，让乔斯携带。事实上，乔斯有不寻常的好运气。尽管他无能又懒惰，但他有一份好工作，有很多情人，有很多朋友，并且免于艰难困苦。甚至也奇迹般地躲过了袭击他的吸血鬼的突然攻击。乔斯拿起武器，反击敌人，而不是逃跑，为自己的运气感到自豪。但一切都有限度……"
 artifact_labrys_name:0 "巴力双刃斧"
 artifact_labrys_description:0 "迷宫域的象征。巴尔的长角头颅的象征。胜利者对受害者的象征，狼对羊的象征。邪恶的象征。"
 artifact_guarded_rubrics_name:0 "封禁量规"
 artifact_guarded_rubrics_description:0 "巫妖伊努哈顿将这本书交给了塔尔玛埃拉的第一批成员。它包含了挪得之书的摘录和几千年来亡灵术实践的提炼。它还塑造了新生教派作为末日守护者的信仰。"
 artifact_jurgen_broadsword_name:0 "约根的阔剑"
 artifact_jurgen_broadsword_description:0 "一把闪亮的阔剑，镶嵌着珍贵的宝石，上面布满了装饰性的纹章。它被献给了约根，作为爱之庭的友谊信物。"
 artifact_true_cross_name:0 "真十字架的碎片"
 artifact_true_cross_description:0 "#bold 解锁圣遗物决议。增强寻找巢穴（勇武选项）计谋。#!\n一块三英尺长的黑木头，上面有着救世主本人的血迹。这个遗物保护了亚柯数个世纪，后来被戈捷·德·丹皮尔拿去作为亚柯骑士修士会的奠基石。"
 artifact_rowan_ring_name:0 "罗宛之戒"
 artifact_rowan_ring_description:0 "罗宛之戒是令人恐惧的暗杀工具，由哈基姆圣裔的长者成员或他们信任的稚子使用。戒指可以神秘地变尖并拉长成尖桩，作为武器使用。"
 artifact_tapestry_blood_name:0 "血之织锦"
 artifact_tapestry_blood_description:0 "一幅巨大的织锦，对那些注视它足够久的人来说具有预言的力量。这种景象几乎可以采取任何形式，从对古代文明的瞥见到对未来的瞥见。唯一可以确定的是，每个幻象的主题都会直接关系到使用者的命运。"
 artifact_michaelis_crown_name:0 "米歇尔之冠"
 artifact_michaelis_crown_description:0 "奥克西塔尼亚第一位真正的统治者的王冠。在他的继承人与法兰西人的斗争中，这是一个强有力的象征，可以凝聚他们的力量。"
 artifact_ignace_notes_name:0 "安条克的依纳爵的笔记"
 artifact_ignace_notes_description:0 "#bold 给予观占术特质。#!\n清洁派异端思想的创始人留下了这段文字。正确的解释是，它构成了一张普累若麻的地图，即灵界。仅仅拥有这张地图就足以激起该隐之子体内血液的潜在力量。"
 artifact_consolation_philosophy_name:0 "哲学的慰藉"
 artifact_consolation_philosophy_description:0 "作为波爱修斯的哲学书的典范，这本书由一位不知名的该隐之子作了注释，分享了他对吸血鬼状况和天主诅咒的看法。这本书在很多方面都很有启发性。"
 artifact_sword_arthur_name:0 "亚瑟之剑"
 artifact_sword_arthur_description:0 "传奇战将阿尔托利乌斯不顾密特拉密教的顽强抵抗，将基督教带到了群岛。他的剑至今仍是吸血鬼猎人所使用的强大宝物。"
 artifact_skull_saulot_name:0 "扫罗的头骨"
 artifact_skull_saulot_description:0 "被睿魔尔杀死的[antediluvian|E]的头骨标本。在事发后丢失，被卡帕多西亚找了回来研究。它在重新崛起的萨洛比首领手中时将是一个强大的象征。"
 artifact_scrolls_carthage_name:0 "迦太基卷轴"
 artifact_scrolls_carthage_description:0 "在这些著作中，真相被暴露无遗。乌托邦，和噩梦的真相。"
 artifact_great_book_name:0 "大书"
 artifact_great_book_description:0 "玛土撒拉萨尔米斯在旅行中了解到的一切都写在这里。这是一个有用的知识来源，尽管排版不怎样。"
 artifact_vassago_earring_name:0 "瓦沙克的耳环"
 artifact_vassago_earring_description:0 "#bold 给予高阶血术法特质。#!\n2000年前，一个印度的疯狂密教组织召唤了“咒怨先知”瓦沙克，他用这一小块珠宝作为他的灵魂的窥视口。它为它的宿主提供了腐化版的奇术。"
 artifact_marguerite_ring_name:0 "玛格丽特之戒"
 artifact_marguerite_ring_description:0 "#bold 给予支配术和观占术特质。#!\n一枚制作精良的墨洛温戒指，受救世主之声附魔。玛格丽特亲王把她的一部分灵魂放在其中，确保如果她发生什么事，她会通过她的子嗣活下来。"
 artifact_raquel_band_name:0 "拉贵尔的婚戒"
 artifact_raquel_band_description:0 "一个简单的木制婚戒。当一个吸血鬼要求圣拉贵尔放弃她的誓言并嫁给他时，她把布列塔尼的所有吸血鬼都烧成了灰烬，然后自己被当作女巫烧死。"
 artifact_pacifist_ji_name:0 "非攻戟"
 artifact_pacifist_ji_description:0 "曾经由一位虔诚的佛教徒携带的长矛，他在丝绸之路上保护朝圣者和商人。据说这武器将永远饶恕纯洁的心灵和灵魂。"
 artifact_lost_yoni_name:0 "失落女阴像"
 artifact_lost_yoni_description:0 "一座神奇的生育女神雕像，在亚历山大的征服期间被带回来。它让人们看到了故去的文化和宗教。"
 artifact_phrygian_codex_name:0 "弗里吉亚圣书"
 artifact_phrygian_codex_description:0 "一本由历代库都沿袭千年写成的书。实验笔记和经文一样多，前几章写于罗马时代之前，但最新的章节则在血肉塑造理论的前沿。"
 artifact_severed_head_name:0 "断头"
 artifact_severed_head_description:0 "只要喂一点血，这施洗约翰、埃赫那吞、耶稣或本丢·彼拉多（没人确定）的断头就会（隐晦地）说话。这里面可能有一些知识。"
 artifact_holy_grail_name:0 "圣杯"
 artifact_holy_grail_description:0 "#bold 解锁独特内容。#!\n收集者组织在八世纪发现了这个杯子，它散发出一种前所未有的圣洁力量。虽然他们无法追踪它的确切历史，但收集者们确信它就是神话中的圣杯，这要归功于它在被用作血液容器时对吸血鬼诅咒显现的神奇特性。"
 artifact_orb_shadows_name:0 "控影之珠"
 artifact_orb_shadows_description:0 "#bold 给予幽暗术特质。#!\n由幽暗术的实践者使用的辅助专注物，帮助他们掌握这种非自然的[discipline|EL]。它对已熟练这门技艺的大师们几乎没有用处，但他们经常把它作为纪念品保存起来。"
 artifact_bone_osiris_name:0 "奥西里斯之骨"
 artifact_bone_osiris_description:0 "#bold 能够为猎杀赛特提供帮助。#!\n赛特的敌对兄弟奥西里斯的最后遗物之一。通过它仍然可以感受到死亡之神的力量，这可能是挫败赛特防御的关键。"
 artifact_bloodroot_name:0 "血根"
 artifact_bloodroot_description:0 "这是一种只在北非发现的稀有植物，是少数已知的甚至对该隐之子有毒的草药之一。主要用于近战武器，它能迅速将受害者的血液变成细小的，类似于火山灰的黑色灰尘。"
 artifact_gauthier_sword_name:0 "戈捷的大马士革剑"
 artifact_gauthier_sword_description:0 "戈捷杀死的第一位吸血鬼掉落了这把精巧的刀，这把武器他至今仍在使用。亚柯骑士们悄悄地说，在戈捷的不懈信仰的推动下，这把刀正逐渐成为一种遗物。"
 artifact_alashrad_eye_name:0 "阿什拉夫之眼"
 artifact_alashrad_eye_description:0 "#bold 给予高阶观占术特质。#!\n阿刹迈阿姆尔所使用的钻石左眼替代品。据传这东西能让他拥有超越视界的视力，但阿什拉夫本人并没有承认。"
 artifact_book_patriarch_name:0 "牧首之书"
 artifact_book_patriarch_description:0 "幻梦之牧首米迦勒的深刻见解，或疯狂的胡言乱语。这本书对他幸存的追随者来说是一部神圣的经文，尽管他们中没有人真正理解它。"
 artifact_librum_terrum_name:0 "大地之书"
 artifact_librum_terrum_description:0 "#bold 能够为猎杀棘秘魑提供帮助。#!\n这本“大地之书”指出了喀尔巴阡山脉的一座古老教堂，靠近一座现已被遗弃并成为废墟的要塞。一段神秘的文字提到了“躺在被他的故土包围的不洁祭坛下沉睡的巨兽”。"
 artifact_gaffari_scrolls_name:0 "加法里的卷轴"
 artifact_gaffari_scrolls_description:0 "#bold 解锁独特内容。#!\n阿刹迈氏族内部隐藏的阴谋在这些卷轴中暴露无遗。长者们被灭口以压制这一真相，在结束前还会有更多的人流血。"
 artifact_ashes_allhigh_name:0 "崇高之主的灰烬"
 artifact_ashes_allhigh_description:0 "据说是奥丁本人的骨灰，被梵卓松达菲利尔所杀。由于他是著名的骗子和吹牛者，所以很少有人相信这种说法。"
 artifact_karalavanisha_vrana_name:0 "喀拉拉瓦尼莎之伤"
 artifact_karalavanisha_vrana_description:0 "在这首诗中，雷伏诺的创世神话被写得非常广泛。它解释了他们作为对抗可恨的阿修罗提伽耶的监守的神圣地位。"
 artifact_corpus_hermeticum_name:0 "赫耳墨斯全集"
 artifact_corpus_hermeticum_description:0 "这部作品是由神秘的赫耳墨斯·特里斯墨吉斯忒斯——赫耳墨斯秘会的先祖所写，由42本书组成，包含所有古代知识的总和。它最完整的版本被七人议会所拥有，藏在塞里奥斯的深处。"
 artifact_bernardo_ashes_name:0 "弗拉·贝纳多的灰烬"
 artifact_bernardo_ashes_description:0 "古比奥幼狼的和平主义创始人的骨灰，因其信念而被杀害。从这个骨灰盒中仍然可以感受到一种舒缓的气息。"
 artifact_hunger_satisfaction_name:0 "饥渴与满足"
 artifact_hunger_satisfaction_description:0 "这本书最初由原罪之道的创始人塔尼特巴尔·萨哈尔撰写，几个世纪以来一直作为罪人的（不洁）圣典。在他的导师失踪后，卡米拉对它进行了扩展，许多次级的罪人对它有自己的解释。"
 artifact_mithras_goblet_name:0 "密特拉陶杯"
 artifact_mithras_goblet_description:0 "一个装饰着神秘符号的古董高脚杯，多年来一直被用于无数的仪式中。密特拉本人在这个杯子里注入了他的精血，并把它传给他忠诚的追随者饮用。"
 artifact_mithras_cap_name:0 "密特拉的弗利吉亚帽"
 artifact_mithras_cap_description:0 "这件头饰是在罗马时代后期用精细的红色布料缝制的，是梵卓学者宾杜萨拉在亚历山大城第一次会面时赠送给密特拉的。密特拉只在他的神庙的特殊场合才戴上它，这也是它被保存下来并保持良好状态的原因。"
 artifact_mithras_ring_name:0 "红宝石戒指"
 artifact_mithras_ring_description:0 "这枚戒指是在梵卓定居不列颠尼亚之前，他们还是恋人时，赛特之子刻茉媞里送给密特拉的。在戒指的内表面有一个精美的埃及僧侣体铭文，大致翻译为“从女神到男神，永远的诅咒和祝福”。"
 artifact_mithras_dagger_name:0 "埃及匕首"
 artifact_mithras_dagger_description:0 "强大的复仇者荷鲁斯在13世纪的战斗后的礼物，自几个世纪以来，密特拉在密教仪式中使用这把匕首，例如杀死公牛的祭祀仪式。"
 artifact_mithras_seal_name:0 "密特拉印章"
 artifact_mithras_seal_description:0 "这枚印章是为密特拉制作的第一枚印章，用于盖印与阿瓦隆领地和伦敦宫廷有关的官方文件，是他权力的象征，必要时可以委托给忠诚的代理人。"
 artifact_ring_chrysostom_name:0 "金口圣若望之戒"
 artifact_ring_chrysostom_description:0 "#bold 即使没有[perk|E]，你也可以使用祝福。#!\n这枚戒指是银制的，上面刻着粗糙的十字架，据传是金口圣若望所戴的。"
 artifact_franciscan_aspergill_name:0 "方济会圣水勺"
 artifact_franciscan_aspergill_description:0 "含有圣方济各的骨头碎片，这圣水勺可以在整个房间里创造一种宁静的气氛。"
 artifact_martyr_fire_name:0 "殉道者之火"
 artifact_martyr_fire_description:0 "这盏灯是用殉道者骨头的灰烬铸造的。有信仰的人在这盏灯的半径范围内可以忽略所有的伤口，除了最严重的伤口。"
 artifact_eunuch_scapular_name:0 "宦官圣衣"
 artifact_eunuch_scapular_description:0 "#bold 即使没有[perk|E]，你也可以使用代祷。#!\n据称是一位虔诚的塞浦路斯圣徒生前的生殖器，他为了避免肉体的诱惑而阉割了自己，这件肩衣带有他的制造者的令人印象深刻的精神毅力。"
 artifact_dagger_thorns_name:0 "荆棘匕首"
 artifact_dagger_thorns_description:0 "#bold 给予真信特质。#!\n这把匕首是用基督受难时戴的荆棘冠冕上的一根荆棘锻造的，它散发着信仰的光芒，对超自然者尤其致命。"
 artifact_spear_destiny_name:0 "命运之矛"
 artifact_spear_destiny_description:0 "#bold 给予真信特质。#!\n朗基努斯之矛，他在耶稣被钉在十字架上时刺穿了他的身体。这是一个强大的信仰象征，众所周知，挥舞它的人都会产生幻象。"
 artifact_code_samiel_name:0 "萨麦尔圣书"
 artifact_code_samiel_description:0 "殉道者的创始人萨麦尔是扫罗的武者一系中最伟大的，据说他亲手写下了这篇文书。根据传说，在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了圣书，以及圣书中新武者获取力量和血化所必需的适当仪式。"
 artifact_valencia_chalice_name:0 "瓦伦西亚之杯"
 artifact_valencia_chalice_description:0 "教会学者对该杯的出处以及它的用途有不同的看法。有些人声称，它是最后的晚餐时用来招待使徒的杯子。还有人说，它是用来收集耶稣受难时的血。然而，双方都会同意，该杯确实盛有基督的血，这使得它无论是作为宗教遗物还是作为历史文物都几乎是无价的。"
 artifact_erciyes_fragments_name:0 "埃尔吉耶斯残篇"
 artifact_erciyes_fragments_description:0 "众所周知的挪得之书的次经合集，详细介绍了该隐之子的创世神话，由一些最负盛名的该隐之子学者作了注释。"
 artifact_erciyes_broken_fragments_name:0 "破碎的埃尔吉耶斯残篇"
 artifact_erciyes_broken_fragments_description:0 "详细介绍了该隐之子的创世神话的，挪得之书的次经合集——埃尔吉耶斯残篇的缺损副本。"
 artifact_correspondence_rodrigo_name:0 "罗德里戈的信件"
 artifact_correspondence_rodrigo_description:0 "作为“心兽之路”最重要的学者之一，罗德里戈一直在将他所有的发现和关于它的争论汇编成一份伟大的手稿，这让“心兽之路”更保守的成员感到恼火。"
 artifact_grey_book_name:0 "灰之书"
 artifact_grey_book_description:0 "从宫廷阴谋的入门到如何跟踪和杀死猎物的明确指示。由查瑞希·德·格雷亲自撰写，灰猎手之道的著名典范。"
 artifact_gabriel_trumpet_name:0 "加百列的小号"
 artifact_gabriel_trumpet_description:0 "末世将由一个巨大的、雷鸣般的号角吹响，即大天使加百列的号角。加百列在出现在穆罕默德面前后，故意将其留下，如果故事可信的话，将由凡人自己发出信号，召唤末日。"
 artifact_the_stone_name:0 "石头"
 artifact_the_stone_description:0 "似乎是该隐用来谋杀亚伯的石头。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的石头。"
 artifact_warding_iron_name:0 "守护铁环"
 artifact_warding_iron_description:0 "这是一件由铁制成的粗糙环状物，是信徒们用来防止包括吸血鬼在内的邪恶实体接近的小护身符。"
 artifact_gospel_laodice_name:0 "拉俄狄刻福音"
 artifact_gospel_laodice_description:0 "这是一本漫无边际的神学集，收集了关于该隐之子与及和天主的关系的幻觉、洞察和预言；并延伸为天国之道历史的重要记录。"
 artifact_the_bone_name:0 "骨头"
 artifact_the_bone_description:0 "似乎是该隐用来谋杀亚伯的颌骨。据传能够立即杀死任何该隐之子，找出该隐本人或解除吸血鬼诅咒。但说实话，它看起来只是一块普通的颌骨。"
 artifact_horns_hunter_name:0 "猎人号角"
 artifact_horns_hunter_description:0 "由伊娜依娅杀死的野兽的角制成，这件宝物的力量是神秘的。它们似乎能增强任何有能的战将的自然领导能力。"
 artifact_flesh_hunted_name:0 "受猎者的血肉"
 artifact_flesh_hunted_description:0 "吃下这神奇的肉的一部分，可以让任何该隐之子变身为被制成这肉的动物。"
 artifact_book_sun_name:0 "太阳之书"
 artifact_book_sun_description:0 "人性之道信仰的核心文本被认为是古代该隐之子寻找浩恩永生的半准确记载。太阳之书充满了寓言和奇怪的比喻，是谜语和神话的结合体。"
 artifact_dialogues_troile_arikel_name:0 "特洛伊尔与亚力科的对言"
 artifact_dialogues_troile_arikel_description:0 "这显然是在柏拉图时代写的，是对两个[antediluvian|E]之间的所谓对话的叙述。尽管该文本的真实性存在争议，但其对世界和血畜的见解是普罗米修斯之道所采用的信条的详细版本。"
 artifact_blade_of_enoch_name:0 "以诺之刃"
 artifact_blade_of_enoch_description:0 "#bold 你不再会血狂。#!\n这把看起来很粗糙的青铜刀是布鲁赫送给以诺的礼物。它被认为保留了其创造者的一些记忆片段，特别是他冷酷的逻辑和对情感的完全控制。"
 artifact_well_ashes_name:0 "尘之井"
 artifact_well_ashes_description:0 "一个非常深的大锅，显然是由扫罗或一位强大的巴力（也可能是共同）创造的，据传它能够使一个吸血鬼恢复到完全的凡俗状态。根据不同的传说，其代价可能高达咬一百个凡人在其中被焚烧。"
 artifact_martyr_icon_name:0 "殉道者图示"
 artifact_martyr_icon_description:0 "一幅关于亚伯的小画，被其制作者的血赋予了力量。一小部分早已失去的人性残余。"
 artifact_veddartha_chalice_name:0 "梵达多之杯"
 artifact_veddartha_chalice_description:0 "据称，梵卓氏族的创始人用这个杯子喝了他尊长的血，而不是在初拥时直接从他的血管中享用。梵卓氏族把这个东西作为他们创始人的决心和勇气的象征，即使被吸干了血，他还能坚持用杯子喝血。"
 artifact_tyrant_lash_name:0 "暴君之鞭"
 artifact_tyrant_lash_description:0 "暴君之鞭是一条简单的马鞭，顶端有一个小倒钩，是在睿魔尔崛起后不久，由一位棘秘魑库都创造的。这条鞭子会放大其击打的痛苦，每当它击中目标时都会产生一种虚弱和无助的感觉。"
 artifact_wax_seal_name:0 "蜡封"
 artifact_wax_seal_description:0 "只要有几滴血，王者之路的吸血鬼就能对普通的蜡封附魔，使其对窥探的手和眼睛有特别的抵抗力。"
 artifact_empowerment_justicars_name:0 "巡行裁决官的新生"
 artifact_empowerment_justicars_description:0 "一份神秘的文件，由欧洲一些最有权势的亲王签署，其中提到了统治者由他们的同僚来审判的权利。它设立了“巡行裁决官”的职能，作为法官和刽子手，是凌驾于诸亲王之上的唯一权威。"
 artifact_letters_acindynus_name:0 "阿辛底努斯的信件"
 artifact_letters_acindynus_description:0 "阿辛底努斯从罗马时代起就一直在编纂有关该隐之子亲王和国王权利的资料。随着征服之道的巩固，这些信件更加注重心路的历史和理念，作为王者之路的引子，一直到今天。"
 artifact_lyrics_aconia_name:0 "阿科尼亚·梅莎莉娜的诗歌"
 artifact_lyrics_aconia_description:0 "坦率地说，这些歌词具有色情特征，它们的想象力非常丰富，既挑逗又放肆，既怀念又充满憧憬，而且明目张胆地性感。纵欲之道的追随者认为对诗歌的精确形象进行再创造是一种神圣的艺术。"
 artifact_satires_name:0 "讽刺集"
 artifact_satires_description:0 "各种形式的社会和宗教评论作品合集，包括了恶毒的讽刺诗到游吟诗人歌曲。"
 artifact_pilgrim_badge_name:0 "朝圣者的徽章"
 artifact_pilgrim_badge_description:0 "为了反映和嘲笑凡人朝圣的趋势，罪人已经开始收集他们最终旅途的漂亮饰品，从布匿石碑的微小复制品到拜占庭风格的珠宝。"
 artifact_sigil_misrule_name:0 "狂宴之王的印记"
 artifact_sigil_misrule_description:0 "狂宴之王的传统农神节标志是由每个庆祝黑暗至点的罪人小团体在每个新年里制作的。"
 artifact_water_venus_name:0 "维纳斯之水"
 artifact_water_venus_description:0 "一种强烈的混合物，能使凡人的感官提高到极端程度，使他们的血更甜美。"
 artifact_enchanted_scimitar_name:0 "附魔弯刀"
 artifact_enchanted_scimitar_description:0 "大术士阿什拉夫并不经常使用这件武器。但是，当一名敌人证明了自己对血魔法的抵抗力特别强时，他已经为此做好准备。"
 artifact_code_chivalry_name:0 "骑士守则"
 artifact_code_chivalry_description:0 "骑士守则是对更古老和相当神秘的东西的转录，是任何有抱负的该隐之子骑士的准则，经常被批判，但仍然受到尊重。"
 artifact_chronicles_heartblood_name:0 "地血编年史"
 artifact_chronicles_heartblood_description:0 "这是一部由哈基姆本人撰写的哈基姆圣裔自创建以来的完整历史。遗憾的是，前几章是以传说的形式写成的，使其有很多争论和注解。"
 artifact_laws_haqim_name:0 "哈基姆律法"
 artifact_laws_haqim_description:0 "它们是鹰巢图书馆的核心，用以诺语镌刻在一系列泥板上，保存得近乎完美。由于以诺语是一种失传的语言，因此有相当多不同的翻译。"
 artifact_book_going_night_name:0 "离世夜之书"
 artifact_book_going_night_description:0 "一本由赛特传下来的书卷，包含了所有必要的仪式，使赛特之子能够过渡到来世。"
 artifact_apostate_auguries_name:0 "叛教者鸟占集"
 artifact_apostate_auguries_description:0 "这是特黎佛撒的预言集，鸟占集详细描述了一个巨大的阴影从深渊中升起，以及一个被囚禁在那里的巨兽的逃脱。然后这只巨兽将攻击一些东西，研究者认为这在说儿子或太阳。这其中的一些内容指向了火焚末日和勒森魃[antediluvian|E]的崛起。"
 artifact_louhi_staff_name:0 "娄希之杖"
 artifact_louhi_staff_description:0 "一根刻有各种符文的黑杖，由强大的女巫娄希所使用，据说她的力量甚至可以与最有成就的血术士相媲美。"
 artifact_shroud_kaymakli_name:0 "凯马克勒护碟"
 artifact_shroud_kaymakli_description:0 "被血浸透的圆盘上刻有用以诺语书写的铭文。很难读懂，翻译出来也没什么意义，但它仍然是一件令人印象深刻的遗物，似乎有更深层次的故事要讲。"
 artifact_spear_bathel_name:0 "伯特利之矛"
 artifact_spear_bathel_description:0 "一把长矛，据说可以保护持矛者免受伤害，同时杀死任何被它划伤的敌人。虽然可能是虚构的故事，但它在叛逆的梵卓西格弗里德身边赢得了相当大的声誉。"
 artifact_biblia_negra_name:0 "黑圣经"
 artifact_biblia_negra_description:0 "圣经中提到了67个被困在大地中的远古实体，他们梦想着有朝一日能够获得自由并接管世界。在这67个实体中，有13个被命名为[antediluvian|E]。这本书的每一页都散发着恐吓，使它越来越难阅读。"
 artifact_wooden_coffin_name:0 "木棺材"
 artifact_wooden_coffin_description:0 "一个用松木制成的长盒子，用来安放尸体。总比被扔进万人坑要好，但也仅限于此。"
 artifact_lupine_hide_name:0 "狼人毛皮"
 artifact_lupine_hide_description:0 "变化者——狼人——的毛皮标本。也可能只是一只非常大的狼的毛皮。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 artifact_lupine_skull_name:0 "狼人颅骨"
 artifact_lupine_skull_description:0 "变化者——狼人——的头骨标本。也可能只是一只非常大的狼的头骨。\n\n月之野兽，化形之体，彼辈乃最为古老者，远在吾父之前便已行走于大地。\n汝辈不当逗留于其之路径，避开彼辈，否则其将如身处羊圈之狼般袭击吾族。\n吾等与彼辈乃不同之族类。\n谨防其不可侵犯之领地，静静地穿过其荒野。\n彼辈之尖牙足以匹敌吾族之尖牙，彼辈之利爪足以匹敌吾族之利爪，汝辈不当逗留于其之路径，吾等与彼辈乃不同之族类。"
 artifact_skull_vampire_name:0 "吸血鬼颅骨"
 artifact_skull_vampire_description:0 "吸血鬼的头骨标本。如果没有特别准备，当非常古老的吸血鬼被摧毁时，他们通常会碎成灰烬。\n\n禁汝灭同类。灭之权惟汝之长。惟尔中最长者乃可召血猎。"
 artifact_banner_carthage_name:0 "迦太基之旗"
 artifact_banner_carthage_description:0 "这面破烂的旗帜据说是第三次布匿战争期间被罗马的梵卓俘虏的迦太基布鲁赫的旗帜。\n\n布鲁赫仍然从迦太基繁荣的伟大学者和哲学家的传说中汲取灵感，在这文化中，血族和血畜的关系比以前或以后的任何时候都要密切。然而，对其他人来说，这是一个恐怖和疯狂的城市，在那里，儿童被献给崇魔的巴力，而布鲁赫却视而不见。\n迦太基在有史以来最广泛的吸血鬼联盟手中沦陷，直到今天晚上仍然被认为是该隐之子历史上的一个关键事件。"
 artifact_blood_horn_name:0 "血角"
 artifact_blood_horn_description:0 "#bold 允许通过[decision|E]随意补充血液。#!\n著名的奥丁血角，一个可以从任何液体中创造血液的神器。当崇高之主消失后，血角也随之消失，直到你最近战胜了入侵者。显然，这是诸神青睐的标志。"
 artifact_sword_of_troile_name:0 "特洛伊尔之剑"
 artifact_sword_of_troile_description:0 "这把水晶剑是该隐之子历史上最强大的武器之一，特洛伊尔本人曾在无数次保卫迦太基的战役中使用过这把水晶剑。"
 artifact_sword_of_dracula_name:0 "德古拉之剑"
 artifact_sword_of_dracula_description:0 "德古拉之剑是一把质量极好的阔剑，闪亮的剑身搭配着华丽的剑柄。沿着剑长刻有许多东方和库都符号，护手和剑柄上嵌有五彩的宝石。这把剑是由德古拉的父亲龙公伏拉德通过雷伏诺突伽·辛和她对恶魔库帕拉的了解的帮助下铸造的。龙公伏拉德专门制作了这把剑，以杀死库帕拉和这个大恶魔的邪恶仆人。"
 artifact_tapestry_jawbone_name:0 "骨之织锦"
 artifact_tapestry_jawbone_description:0 "该挂毯由一位匿名的妥芮朵制作，然后在1190年被复制到了法兰西某地的一份圣咏经手稿中。"
 artifact_tapestry_noir_name:0 "挪得织锦"
 artifact_tapestry_noir_description:0 "这幅挂毯据说是末卡维预言家雅各在昏迷状态下创作的，描绘了《挪得之书》中的《该隐传》。在第一格中，该隐杀死了亚伯。在第二格中，该隐受到了上帝的诅咒。在第三格中，该隐遇到了莉莉丝。在最后一格，该隐抛弃了莉莉丝。雅各的仇敌以扫，花了很多钱和很多人情，雇佣了各种各样的“无名氏”来破坏挂毯。到目前为止，每样尝试都失败了，往往最后都是以破坏偶像主义者式的死亡告终。它已经成为爱之庭的高度渴望之物，他们把它称为“黑之挂毯”，因为有许多盗贼和破坏者在寻找它时死亡。"
 artifact_sculpture_of_ishtar_name:0 "伊丝塔的雕塑"
 artifact_sculpture_of_ishtar_description:0 "一座宏伟的雕塑，据说是亚力科的自画像。对以诺城的玫瑰的才华、骄傲和时常的傲慢的完美一瞥。"
 artifact_iulus_sword_name:0 "尤路斯之剑"
 artifact_iulus_sword_description:0 "一把由永生的铸剑师尤路斯·卢夫斯·纳索锻造的罗马短剑。一把闪烁着罗马荣耀的完美工艺品，正如尤路斯本人所想的那样。"
 artifact_iulus_armor_name:0 "尤路斯之甲"
 artifact_iulus_armor_description:0 "一件由永生的铸剑师尤路斯·卢夫斯·纳索锻造的古典罗马盔甲。一把闪烁着罗马荣耀的完美工艺品，正如尤路斯本人所想的那样。"
 artifact_esoara_ax_name:0 "埃索拉之斧"
 artifact_esoara_ax_description:0 "睿魔尔的战将埃索拉携带的巨斧。这把大得不能再大的武器对普通人来说太重了，甚至连大多数吸血鬼都觉得它不方便使用。"
 artifact_house_tremere_name:0 "《睿魔尔家族》"
 artifact_house_tremere_description:0 "在他死于睿魔尔的可怕初期夜晚之后，本蒂库斯成了一位死灵，以比图吉斯为手，写下了他曾经高贵的家族，现在被腐化成黑暗的全部可怕的故事。"
 artifact_tremere_chronicles_name:0 "《睿魔尔编年史》"
 artifact_tremere_chronicles_description:0 "这是一部关于睿魔尔家族早期日子的宏伟而极度偏面的历史。传统上，塞里奥斯的堡主在任何议会会议之前都会宣读这本书。"
 artifact_robe_nessus_name:0 "涅索斯的长袍"
 artifact_robe_nessus_description:0 "似乎是在著名的神话中杀死赫拉克勒斯的毒袍。在每个人看来都是恐惧和不幸的象征，除了末卡维，他们似乎觉得弥漫在这件艺术品中的不祥之感很舒畅。"
 artifact_fingerbone_hannah_name:0 "圣汉娜的指骨"
 artifact_fingerbone_hannah_description:0 "#bold 即使没有[perk|E]，你也可以使用祝福。#!\n渗透着真信的小遗物。它被声称于1197年在耶路撒冷地下找到末卡维灵魂的稚子小团体发现，然后又丢失了。"
 artifact_plait_lucrezia_name:0 "圣卢克蕾齐娅的辫子"
 artifact_plait_lucrezia_description:0 "卢克蕾齐娅是一位高贵的原始教徒女士，她在皈依后剪掉了头发以示对天主的顺从，她被她小心眼的父亲送进了一个居有怪物的坑里。\n第二天早上，卢克蕾齐娅把她的头发编成了绳子，制服了那只怪物。她的头发似乎和以前一样结实而有光泽，可以用来捆绑任何邪恶的生物。"
 artifact_rayzeel_song_name:0 "雷齐尔之歌"
 artifact_rayzeel_song_description:0 "“无汝无光”，是雷齐尔最著名的歌曲的片段。它是如此美丽，以至于据说当扫罗那话不多的子嗣开始唱歌时，鸟儿都停下来听。扫罗自己也是在听到雷齐尔治愈灵魂的声音后，才从失去萨麦尔的悲痛中唤醒自己。"
 artifact_portrait_saulot_name:0 "扫罗的肖像"
 artifact_portrait_saulot_description:0 "萨洛比[antediluvian|E]的唯一已知现存画像。在这幅质量不高的画中，一位身材矮小、黑发蓝眼的男人被表现出来。大多数萨洛比玛土撒拉在看到这幅画后，都认为它“粗看时”看起来像扫罗。"
 artifact_vitus_heel_name:0 "圣维特的脚跟"
 artifact_vitus_heel_description:0 "神经紊乱的主保圣人的遗物。虽然不能完全治愈末卡维的诅咒，但对他们还是有舒缓的作用。"
 artifact_dweomered_scimitar_name:0 "附咒的大马士革阿拉伯弯刀"
 artifact_dweomered_scimitar_description:0 "一把强大的大马士革弯刀，被赋予了巨灵的魔力，这刀在没有尝到血前是无法回到鞘中的。"
 artifact_weyland_wyrcan_name:0 "维兰德之作"
 artifact_weyland_wyrcan_description:0 "#bold 你必须得有35以上的勇武才能装备此武器。#!\n没有人知道维兰德是谁或者是什么，但他的刀剑却非常有名。几乎如同活物，它们会拒绝被弱小的人持有，甚至试图杀死不配的持有者。然而，如果被一位配得上的剑客持有，它们就将在战斗中高鸣，并在敌人群体中传播恐惧。"
 artifact_black_stake_name:0 "黑尖桩"
 artifact_black_stake_description:0 "这块铁木应该是特洛伊尔用来使在吸榨她的尊长布鲁赫前瘫痪他用的。它在布鲁赫为解放自己而进行的反抗过程中遭受了很多，但仍然保留着一种可触及的神话般的强烈灵光。"
 artifact_roll_damned_name:0 "受诅者之卷"
 artifact_roll_damned_description:0 "受《末日审判书》的启发，这个项目包含了所有该隐之子的封建义务、纽带和英格兰吸血鬼的小团体的清单。虽然不是面面俱到，但这已经是一个非常令人印象深刻的勒索工具……而且明显违反了潜藏戒律的规定。"
 artifact_toomler_femur_name:0 "托姆勒的股骨"
 artifact_toomler_femur_description:0 "托姆勒是一位棘秘魑玛土撒拉，因其能够分开身体的各个部分然后重新接上而闻名。不知何故，他的股骨在他死后仍然完好无损，并成为一种令人惊讶的有效但钝滞的武器。"
 artifact_cycle_lilith_name:0 "《莉莉丝始末记》"
 artifact_cycle_lilith_description:0 "《莉莉丝始末记》是一部据称是以莉莉丝的视角讲述的吸血鬼经文。它主要是巴哈里歌曲的集合（大部分是口头传下的），被编成一个循环曲。它更多的只有象征意义，而非真正讲述莉莉丝的故事本身。"
 artifact_veil_night_name:0 "暗夜之幔幕"
 artifact_veil_night_description:0 "这是一部关于穆斯林世界及其该隐之子的综合历史，以哈基姆圣裔维齐尔——阿布·法希姆·卡泰布以旅行日记的方式撰写。"
 artifact_tawiz_name:0 "塔维兹"
 artifact_tawiz_description:0 "戴在脖子上的小银质护身符，刻着《古兰经》语录。它被用来驱除邪灵或作为幸运符。"
 artifact_albuduh_name:0 "布杜"
 artifact_albuduh_description:0 "一个神秘的方块，刻画了一些数字，这些数字加起来是个幸运数值，其意义赋予了广泛的保护力量。"
 artifact_khoumsa_name:0 "五指之手"
 artifact_khoumsa_description:0 "画有法蒂玛之手的旗帜，五指的手代表穆罕默德、他的女儿法蒂玛、她的丈夫阿里和他的儿子们。它在很多情况下被使用，从吉祥物到战争旗帜。"
 artifact_inscrutable_eye_name:0 "高深之眼"
 artifact_inscrutable_eye_description:0 "一枚上面有埃及圣甲虫图案的戒指，在甲虫的甲壳中间有一颗眼睛形状的宝石。这枚戒指的做工非常古老，即使是吸血鬼的肉体也会感到它的寒冷。\n当用它专注于一个特定的吸血鬼时，有可能会确定他的位置和活动。"
 artifact_waxen_poetica_name:0 "蜡诗"
 artifact_waxen_poetica_description:0 "一块小蜡片，可以在让一滴血落入其中后扔向对手。如果它击中，蜡就会附着在受害者身上并开始扩散。它的温度极高，即使对该隐之子来说也是如此，它可以迅速地变得致命。"
 artifact_writings_cabirus_name:0 "卡比洛斯的秘密手稿"
 artifact_writings_cabirus_description:0 "完整的，但翻译得很糟糕的卡比洛斯的书，这位年轻的木乃伊描述了奥西里斯的生命神咒的内部运作。荷鲁斯的木乃伊们正在努力试图找到并摧毁它，担心如果被他们以外的人完全理解，它可能会被用于邪恶。"
 artifact_shattered_spear_name:0 "欧西雅的破碎长矛"
 artifact_shattered_spear_description:0 "#bold 能够通过吸血鬼限定决议修复。#!\n最勇敢的梵卓，阿尔忒弥斯·欧西雅的长矛的损坏残骸。这把武器具有传奇性的力量，但在迦太基的最后时刻，当阿尔忒弥斯倒下时，它就被折断了。然而，它仍然是一个强大的遗物，并且会拒绝由比斯巴达女神本人更不勇敢的人持有。"
 artifact_soulforged_artifact_name:0 "[killed.GetFirstNameNoTooltip]"
 artifact_soulforged_artifact_description:0 "用[killed.GetTitledFirstNameNoTooltip]的灵魂灵铸成的宝物，下手者为[owner.GetTitledFirstNameNoTooltip]。该宝物不断低语加呻吟，但大家都希望这只是意味着它能发声，而不意味别的。"
 artifact_fans_of_ma_yi_yuan_name:0 "袁马义的双扇"
 artifact_fans_of_ma_yi_yuan_description:0 "#bold 允许在灵游时进入[dreaming|E]。\n免疫妖精的魔咒。\n在战争中（作为指挥官时）给予敌方骑士和指挥官或在[single_combat_duel|E]中给予对手伤害（只要是[GetTrait('fae').GetName( GetPlayer )]或[GetTrait('changeling').GetName( GetPlayer )]）。#!\n此双扇是伪装过的致命武器。薄薄的金属折叠扇如剃刀般锋利，如最好的剑刃一样坚固。在扇子精致的装饰下，隐藏着大量的神秘力量，以及对土居的血液的渴望。扇子的使用者可以抵御妖精施放的任何法术，并且能够进入其等的界域。"
 artifact_antler_crown_name:0 "鹿角冠"
 artifact_antler_crown_description:0 "自部族早期的夜晚以来一直是芬尼安之王的象征。这强大的王冠只赋予配得上的人，所有牡鹿的后裔都有义务遵循它。"
 artifact_yuri_klaive_name:0 "尤里的月刃"
 artifact_yuri_klaive_description:0 "一把精心锻造的，看上去有点平庸的月刃。不过，对于那些能看透的人来说，可以感受到与这把武器相关的伟大命运。"
 artifact_head_hardrule_name:0 "哈德鲁尔的头"
 artifact_head_hardrule_description:0 "塔吉·哈德鲁尔是芬里尔仔兽有史以来最伟大的战士之一。但也是最暴虐的统治者之一，最终，当整个部族都反对他时，他付出了生命。他的头是一个提醒，让我们永远赞美伟大的战士，但也要警惕傲慢的代价。"
 artifact_bronze_labrys_name:0 "路西帕斯的青铜双头斧"
 artifact_bronze_labrys_description:0 "一把完美保存的黄金时代的青铜双头斧，也许曾经属于路西帕斯本人。这把巨大的双手斧是黑怒间迄今为止最可怕的武器，也是最受尊敬的遗物。"
 artifact_artifact_pieces_name:0 "宝物碎片"
 artifact_artifact_pieces_description:0 "一块来自恶湍的遗器或宝物碎片。也许某[GetTrait('wraith').GetName( GetPlayer )]可以把它重塑回单件宝物。"
 artifact_gaia_big_thumb_name:0 "盖亚的大拇指"
 artifact_gaia_big_thumb_description:0 "这个超大的、木乃伊化的人类拇指有一个奇怪的特性，可以确保适当的交通工具总是在附近……但不保证这些交通工具去往何方。对于任何自重的弦月狼来说都是个迷，一件受人喜爱的啮骨者宝物，也是许多恶作剧的开始。"
 artifact_chalice_renewal_name:0 "复兴之杯"
 artifact_chalice_renewal_description:0 "一个神秘的金杯，能够自动填满海水。任何喝下它的人都会经历来自盖亚本人的记忆，然后被治愈任何疾病或伤口。这个珍贵的宝物曾出现在盖亚之子历史上的数个关键时刻。"
 artifact_watcher_shield_name:0 "看守者之盾"
 artifact_watcher_shield_description:0 "一个盾牌形式的小木牌，可戴在脖子上。这个灵具可以保护佩戴者免受任何形式的暗器攻击，确保芬里尔仔兽总是按自己的意愿战斗。"
 artifact_crescent_moon_waterskin_name:0 "新月水袋"
 artifact_crescent_moon_waterskin_description:0 "一件非常通用的神器，被人类监护者所珍视。它可以用来伪装自己，长出强大的爪子，甚至可以在喝下之后立即狂乱。"
 artifact_threefold_axe_name:0 "三重斧"
 artifact_threefold_axe_description:0 "三重斧是芬尼安铁匠技艺的巅峰之作，它是一件精心打造的武器，可以最佳地对付任何敌人。在战斗中，它里面的器灵们会根据实际需要改变金属的成分，确保妖精面对金斧，狼人面对银斧等等。这武器极度罕见，因为让这么多的灵同居于其中确实是一个史诗般的壮举。"
 artifact_bramble_branch_name:0 "荆棘枝"
 artifact_bramble_branch_description:0 "一个强大的灵被缚在这枯枝上。一旦被激活，各种有毒的植物就会从地下冒出来，把这个地区封锁起来，不让任何干扰者进入。"
 artifact_assassin_klaive_name:0 "刺客的月刃"
 artifact_assassin_klaive_description:0 "像真正的影爵一样圆滑而致命，这种注入了蛇之灵的月刃很容易隐藏，即使在最公开的地方也能掩盖其主人的存在。"
 artifact_firebird_feather_name:0 "火鸟之羽"
 artifact_firebird_feather_description:0 "火鸟之羽的确切属性并不为人所知。它只是看起来像一根美丽的发光羽毛，但当它被带进银牙之王的房间时，房间就像被无数根蜡烛照亮。它看起来也出奇地坚固，同时像最光洁的月刃一样锋利。"
 artifact_owl_talon_name:0 "枭爪"
 artifact_yellow_veil_name:0 "卡尔帕特里的黄面纱"
 artifact_yellow_veil_description:0 "无尽黑暗女士在审判不堪的星占时戴着这块面纱。这件宝物迫使持有者始终为正义而努力，任何接近它的人都要说出真相，坦白他们可能拥有的任何可耻的秘密。"
 artifact_owl_talon_description:0 "这把弯曲的刀，类似于猫头鹰的爪子，是寂静漫游者持有的最强大的月刃。它内部有两个器灵，据说它特别渴望埃及吸血鬼的血液，期待着部族最终获得复仇的那一天。"
 artifact_djangalbi_name:0 "江加尔比"
 artifact_djangalbi_description:0 "赞助设定的非原作宝物\n江加尔比是一本巨大的书典，记录了该隐之子部队在永恒之战中的支出。其内容繁琐而密集，通过阅读它，可以提高人们对财政和王国管理的大局观理解。"
 artifact_sets_emasculation_name:0 "赛特之去势"
 artifact_sets_emasculation_description:0 "#bold 允许永久阉割。#!\n这把由陨铁和青铜打造的短刀看起来很不起眼，但刀身上的红色色调显示了它令人难以置信的传承。这把刀正是远古时期荷鲁斯用来阉割赛特的刀，无论谁来挥舞它，这把刀都散发着第一个持刀人的彭发能量和第一个受害者的残余生命力力量。信念和正义感本身都为这把传奇武器提供了动力。"
 artifact_pomegranate_name:0 "石榴"
 artifact_pomegranate_description:0 "#bold 允许将[GetTrait('wraith').GetName( GetPlayer )]转为[GetTrait('risen').GetName( GetPlayer )]。#!\n由珀尔塞福涅的母亲——法师德墨忒尔创造的一个强大遗器，可用来在生者之地和死者之地之间制造通道。"
 artifact_vassagos_reliquary_name:0 "瓦沙克的宿匣"
 artifact_vassagos_reliquary_description:0 "一颗价值无与伦比的巨大钻石。瓦沙克在这闪闪发光的监狱中计划他邪教的扩张。\n$artifact_reliquarie_description$"
 artifact_klaive_name:0 "月刃"
 artifact_klaive_description:0 "狼人最著名的武器，这把刀是镶银的邪恶武器，是狼人使用的神圣武器，比任何刀剑都要强大，里面缚着灵。所有使用它的非狼人都会因亵渎神明而被无休止地追杀。"
 artifact_eternal_waterskin_name:0 "无尽水袋"
 artifact_eternal_waterskin_description:0 "这牛皮袋在装满水后，无论喝多少都不会耗尽，是一件不强但有用的东西。遗憾的是，对许多部族来说，这物品只适用于淡水，不管是雨水还是开水，而对蜂蜜酒或葡萄酒等则不起作用。"
 artifact_beff_of_ice_name:0 "冰之不合"
 artifact_beff_of_ice_description:0 "一根由银覆蓝冰制成的小针，这件独特的有价值的灵具可以让人烧去疾病，因为使用者能够真正地抖出感染，因为里面的冰之灵会清除使用者生理系统中的疾病，甚至更强——毒。"
 artifact_spirit_astrolabe_name:0 "灵之星盘"
 artifact_spirit_astrolabe_description:0 "这件制作精良的星盘，缚有波浪之灵，对任何使用这个遗物的长者都有不可思议的指导作用，使人能够完全轻松地穿透距离的纱幔。"
 artifact_truth_earring_name:0 "真相耳环"
 artifact_truth_earring_description:0 "作为所有不忠配偶的灾祸，这缚有荣誉之灵的灵具，使佩戴者能够更准确地刺破谎言的面纱，更好地从谎言的海洋中摘取真相的果实。"
 artifact_blanket_of_peaceful_past_name:0 "安宁过往之毯"
 artifact_blanket_of_peaceful_past_description:0 "和平之灵具，佩戴后，内缚的母性之灵拥抱使用者，让其，哪怕是短暂的一瞬间，回到小时候或幼崽的状态，那时的世界是有意义的，其他什么都不重要，从黑暗世界的恐怖中幸运地逃脱，再次被慈爱的母亲拥抱或在她身边沉眠。"
 artifact_dark_mask_name:0 "黑暗面具"
 artifact_dark_mask_description:0 "这个奇怪的灵具的起源不为人知，但它的力量是明确的。弯曲阴影以辅助佩戴者，扭曲光线并掩盖佩戴者，在所有看到其的人中激发出一种深刻的恐惧。"
 artifact_eyes_of_the_night_name:0 "夜之眼"
 artifact_eyes_of_the_night_description:0 "一个非常奇异的灵具，这个铁盆，当被丢到空中旋转时，允许当地的白天和黑夜的光照程度颠倒过来，这是一件不可估量的有用地逃跑工具，对任何攻击者造成光亮或黑暗的冲击，在他们的眼睛适应时，受袭者将安然无恙地逃脱，或者说，对另一位可怜的受害者进行报复……"
 artifact_kinship_doll_name:0 "亲缘玩偶"
 artifact_kinship_doll_description:0 "这灵具以小孩子的玩具娃娃为形态，作用是作为兽嫡与化兽族裔的传话器，让他们远距离沟通并保持联系，这样他们就不会远离他们的伴侣。"
 artifact_law_skull_name:0 "律法颅骨"
 artifact_law_skull_description:0 "作为最可怕的灵具之一，这叛徒狼族的头骨一旦被激活，就能背诵律令，并要求在场的人发下誓言。甚至只是有可能使用这灵具就足以让人害怕……"
 artifact_moongleam_name:0 "月荧"
 artifact_moongleam_description:0 "这小卵石可以在夜间的任何时候被激活，当这样做的时候，就会像蜡烛一样发光，而没有引起火灾的风险，在夜间给予可变的光，而不会让自己陷入火焰的燃烧中。"
 artifact_air_foot_greaves_name:0 "空气护膝"
 artifact_air_foot_greaves_description:0 "一对简单的、印有翅膀的护胫，这件缚有风之灵的灵具，当佩戴者把它按在一起时，可以让他们以惊人的速度移动，能够把他们带到几乎任何佩戴者想要去的区域。"
 artifact_sun_axe_name:0 "日之斧"
 artifact_sun_axe_description:0 "这是一把镶有金珠的斧头，这把凶残的武器，虽然有可能让赫利俄斯的孩子难以负担，但在激活后，可以在阳光下燃烧，一件化兽族裔持剑者用来对抗可怕蚂蟥的珍贵武器，以结束他们对黑夜的暴政。"
 artifact_whistle_caff_name:0 "微风之哨"
 artifact_whistle_caff_description:0 "一个刻有圣书字的用木头和骨头做的哨子，缚有新生哺乳动物之灵，吹响后会发出无声的求救声，提醒使用者的家人和朋友，以便他们赶来帮助他们。"
 artifact_book_of_the_spirits_secrets_name:0 "灵秘之书"
 artifact_book_of_the_spirits_secrets_description:0 "这本缚有智慧之灵的牛皮纸小册子，在通读之后，将揭示许多关于影界和灵界的秘密。作为任何弦月狼的典范书，这本有价值的书对任何传奇唤灵师来说都是必不可少的。"
 artifact_feathered_cloak_name:0 "羽毛斗篷"
 artifact_feathered_cloak_description:0 "最受追捧的灵具之一，原因很简单。这缚有风之灵的珍贵灵具的持有者，将获得与蝙蝠一样的飞行能力，实现佩戴者翱翔天空的梦想。"
 artifact_tangling_lance_name:0 "纠缠之枪"
 artifact_tangling_lance_description:0 "这把饱经风霜的荆棘长矛酷似一条巨大的蜥蜴尾巴，虽然看起来只是一支劣质的短矛，但一旦激活，长矛就会分裂，变成像一条巨蜥的尾巴，猛击并抓住恐惧的敌人。"
 artifact_time_piece_name:0 "时间碎片"
 artifact_time_piece_description:0 "这个奇特的灵具以计时仪器的方式出现，通常是一个钟表或日冕。当激活的时候，它将微妙地扭曲时间流,束缚所有在激活时不接近钟表之人"
 artifact_wind_hammer_name:0 "风之锤"
 artifact_wind_hammer_description:0 "这个巨大而沉重的战锤被激活后，将使灵具化为风暴，让使用者像狂暴的龙卷风一样打击，是无数屠杀的信标"
 artifact_bindrune_amulet_name:0 "宾得符文护符"
 artifact_bindrune_amulet_description:0 "这个银质的护身符上有用狼人的语言雕刻的符文。这件灵具让人能够传递语言的力量并驾驭它，洞察语言本身的神秘"
 artifact_cloud_string_name:0 "云之弦"
 artifact_cloud_string_description:0 "这串绳珠当展开时将飞向天空，然后引导苍穹，给人控制大气和雨水的力量。这种强大的能力使人能够为一个地区带来财富和繁荣，对于人类监护者这样的部族来说，这是一个非常有用的特质，而对于其他部族来说，就没那么实用了。"
 artifact_horn_of_the_white_stag_name:0 "白鹿之角"
 artifact_horn_of_the_white_stag_description:0 "塔拉山丢失的三件圣物之一。当这个巨大的号角吹响时，军队将以惊人的速度行军"
 artifact_golden_torc_name:0 "金颈环"
 artifact_golden_torc_description:0 "塔拉山丢失的三件神圣遗物之一。这件完美无瑕的王冠曾今是芬尼安至高王艾鲁的司部的标识，这件珍贵的文物是最古老的贵族的有力象征"
 artifact_crones_tongue_name:0 "老妪之舌"
 artifact_crones_tongue_description:0 "塔拉山丢失的三件神圣遗物之一，老妪之舌是一柄惊人的简易长剑。但在妖蛆面前，它闪耀着燃烧的光芒，它的刀刃甚至比狼人的利爪更伤人。"
 artifact_lepers_rags_name:0 "麻风病人的破布"
 artifact_lepers_rags_description:0 "这件破烂肮脏的斗篷，一旦穿上，将使穿戴者假扮成一个低调的乞丐，无论他们之前是什么身份，这都为实施阴谋提供了大量的选择。"
 artifact_trail_branch_name:0 "寻踪树杈"
 artifact_trail_branch_description:0 "一根从灌木丛中取出的小树枝，缚有荒野之灵，这根树枝可以掩盖自己的踪迹，使穿越荒野变得更加容易，因为里面的器灵指引着它的持有者。"
 artifact_feather_of_the_waters_name:0 "水之羽"
 artifact_feather_of_the_waters_description:0 "一件羽毛斗篷，由来自遥远南方的不会飞的罕见鸟类羽毛制成。这件温暖的斗篷允许任何有灵知的人像鱼一样轻松灵游，使他们以极大的能力扩展可去的地方"
 artifact_heart_of_fire_name:0 "火之心"
 artifact_heart_of_fire_description:0 "这是一个非常危险的灵具，这个小小的红色水晶可以让它的持有者点燃物体。这是一个微小却致命的东西"
 artifact_sun_crystal_name:0 "日之晶"
 artifact_sun_crystal_description:0 "这颗黄色宝石内部含有一只光之灵，在使用者激活后，会使这个小玩意像一滴阳光一样发光，照亮持有者所希望的区域。"
 artifact_beast_mask_name:0 "野兽面具"
 artifact_beast_mask_description:0 "一种变形面具，当使用者戴上它时，它会使使用者变成被指定的动物。给他们增加了动物的机动性，以及动物的无害性质，以满足持有者的任何要求。"
 artifact_belt_of_the_giants_name:0 "巨人腰带"
 artifact_belt_of_the_giants_description:0 "这是个非常稀有的灵具，当被佩戴者驱使时，会使他们的体型加倍，极大地增加他们的力量，给予对手破坏。然而不利的一面是，心脏的尺寸不能增长，这给使用者的身体带来了可怕的压力。"
 artifact_cloak_of_woven_mists_name:0 "雾织斗篷"
 artifact_cloak_of_woven_mists_description:0 "织雾斗篷是一条带有复杂胸针的链绳项链。当被佩戴者激活时，阴影和蒸汽会渗入空气中，使佩戴者变得朦胧和模糊，使其难以置信的隐秘，如同气流的低语。"
 artifact_staff_of_life_name:0 "生命之杖"
 artifact_staff_of_life_description:0 "一根大手杖，可以兼作木棍，这种有用的灵具可以增强佩戴者的健康，并通过增强他们的健康来保护他们免受伤害。"
 artifact_bone_flute_name:0 "骨笛"
 artifact_bone_flute_description:0 "一件精巧的遗物，能够激发不死族的痛苦、安抚生者，那些听到它的人会情不自禁地更尊敬他们的领主"
 artifact_forest_crown_name:0 "丛林王冠"
 artifact_forest_crown_description:0 "一件荆棘冠形状的灵具，会自动适应佩戴者的头部，已成为统治者的象征，因为其中的荒野之灵会辅助他们成为荒野共主。"
 artifact_iron_crown_name:0 "铁王冠"
 artifact_iron_crown_description:0 "一件铁冠形状的灵具，会自动适应佩戴者的头部，已成为统治者的象征，其中贵族之灵会辅助他们达到史诗般的领导权高度，因此在旧时代受到人类监护者的青睐。"
 artifact_keystone_name:0 "钥石"
 artifact_keystone_description:0 "这种符文石一旦被按在石头上，它就会像门一样打开，让使用者通过几乎所有的石头障碍。"
 artifact_dreamcaller_name:0 "唤梦者"
 artifact_dreamcaller_description:0 "这支极其珍贵的长笛能打开梦的裂缝，让人在其中舞蹈和学习，并探索思维的深处，为他们可能提供的任何见解。"
 artifact_harp_of_enchantment_name:0 "附魔之竖琴"
 artifact_harp_of_enchantment_description:0 "这把竖琴在弹奏时，将释放出优美和谐的旋律，一首真正令人惊叹的奏鸣曲，甚至可以让最久经战事的狼人陷入哀号、潸然泪下。"
 artifact_iceblade_name:0 "冰刃"
 artifact_iceblade_description:0 "这把珍贵的剑是用极北坚不可摧的蓝冰制成的，这把苍白的武器与刺骨的北方一样寒冷，同时也能让人如盛夏一般劈开寒风。"
 artifact_lionfang_name:0 "狮牙"
 artifact_lionfang_description:0 "这种强大的灵具是由一只可怕的野兽的尖牙雕刻而成的，据说是从猫人那里偷来的，这种极其危险的武器具有与狼国最古老的对手之一同样的力量。"
 artifact_grand_klaive_name:0 "大月刃"
 artifact_grand_klaive_description:0 "作为最强大的英雄的月刃，这传奇武器在各方面都比其他月刃好，里面缚有战争之灵会随着持有者敌人的死亡而愤怒地嚎叫。"
 artifact_forge_crusher_name:0 "锻·碾"
 artifact_forge_crusher_description:0 "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。锻·碾当使用时，会咆哮燃烧的火焰，能够造成可怕的痛苦"
 artifact_grinding_tooth_name:0 "磨·牙"
 artifact_grinding_tooth_description:0 "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的， 以盖亚敌人的鲜血冷却而成。磨·牙能够粉碎任何石头，将面前的大地埋没。"
 artifact_spear_chaser_name:0 "矛·逐"
 artifact_spear_chaser_description:0 "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。这把令人印象深刻的铁锤在投掷时腾空而起，投掷到难以置信的距离，并且无法在投掷中被阻拦。"
 artifact_troll_eater_name:0 "妖·吞"
 artifact_troll_eater_description:0 "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的， 以盖亚敌人的鲜血冷却而成。妖·吞比其他任何酋长之锤更能摧毁护甲，如同撕裂桦树皮一样"
 artifact_bright_arm_name:0 "光·臂"
 artifact_bright_arm_description:0 "酋长之锤之一，这些强大的双手锤是工艺的巅峰。像月刃一样，这些锤是用银锻造的，以盖亚敌人的鲜血冷却而成。光·臂像太阳一样闪耀，哼唱着光芒，使对手致盲。"
 artifact_hag_talon_name:0 "巫·爪"
 artifact_hag_talon_description:0 "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的， 以盖亚敌人的鲜血冷却而成。巫·爪保护佩戴者的思想，给他们无与伦比的精神防御。"
 artifact_pain_eagle_name:0 "痛·鹰"
 artifact_pain_eagle_description:0 "酋长之锤之一，这些强大的双手锤是工艺的顶峰。像月刃一样，这些锤是用银锻造的， 以盖亚敌人的鲜血冷却而成。痛·鹰是酋长之锤中最具有破坏性的，会留下留下因痛苦而跳动的伤口"
 artifact_runestone_of_gab_name:0 "口舌符文石"
 artifact_runestone_of_gab_description:0 "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力，允许使用者成为语言的大师"
 artifact_runestone_of_war_name:0 "战争符文石"
 artifact_runestone_of_war_description:0 "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。特别是这些符文石上居有着一只战争之灵，让使用者在任何部队踏上战场之前就完全了解战场的情况。"
 artifact_runestone_of_control_name:0 "统御符文石"
 artifact_runestone_of_control_description:0 "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些石头可以预测商业和人口的流动，让使用者对管理事务有无与伦比的洞察力。"
 artifact_runestone_of_cunning_name:0 "狡诈符文石"
 artifact_runestone_of_cunning_description:0 "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些宝石可以让一个人维持和控制错综复杂的计划，让使用者成为无与伦比的间谍总管。"
 artifact_runestone_of_wisdom_name:0 "智慧符文石"
 artifact_runestone_of_wisdom_description:0 "一套珍贵的预言石，这些被施了重重魔法的阅读石为使用者提供了对未来的宝贵洞察力。这些石头有着神学和医学的强大幻象，让使用者对秘法有强大的洞察力。"
 artifact_shining_klaive_of_sokhta_name:0 "索赫塔的闪耀月刃"
 artifact_shining_klaive_of_sokhta_description:0 "这是一种由黄金和水银制成的月刃，与其他月刃不同，这一武器对所有化兽族裔来说都是完全安全的，事实上，它还能进一步增强他们的战斗力。这个扭曲可怕的武器让所有听说过它的人都感到恐惧，化形者可能会毫不屈服于他们传说中的弱点。"
 artifact_radiant_blade_of_katanka_sonnak_name:0 "卡坦卡·索纳克的光辉之剑"
 artifact_radiant_blade_of_katanka_sonnak_description:0 "这把可怕的剑由银和金混合而成，这把可怕的武器在太阳的化身，科拉克斯和莫科莱的支持者，卡坦卡·索纳克星君的光芒下燃烧。这种炽烈的武器激发了赫利俄斯划过天空的迅捷，以他同样的优雅和灵巧的呼吸移动着。"
 artifact_mercurial_mask_of_mitanu_name:0 "米塔努的水星面具"
 artifact_mercurial_mask_of_mitanu_description:0 "骗子的面具，来自水星灵君米塔努的礼物。这个奇物面具可以让一个人完全隐藏自己的存在，就像它的制造者一样，成为一个阴谋之王。"
 artifact_burning_mask_of_hakahe_name:0 "哈卡赫的燃烧面具"
 artifact_burning_mask_of_hakahe_description:0 "这个黑色的铁面具曾经是祝融星化身哈卡赫灵君的锻造面具，他是阴影星球的领主，它将锻造大师的一块面具传授给佩戴者，保护他们，并以黄金和知识的方式赋予他们自己的智慧。"
 artifact_radiant_dress_of_tambiyah_name:0 "坦比娅的光辉之裙"
 artifact_radiant_dress_of_tambiyah_description:0 "这件连衣裙是由最结实的铁制成的美丽挂毯，是金星化身坦比娅灵君的杰作，每一个佩戴它的人都忍住不住称赞。这件完美无瑕的连衣裙与穿着者相得益彰，并以其他形式成为许多精美的珠宝和小玩意，但即使穿过它，连衣裙也能保护穿着者免受任何侵犯。"
 artifact_eternal_grace_of_eshtarras_might_name:0 "埃什塔拉之力的永恒恩典"
 artifact_eternal_grace_of_eshtarras_might_description:0 "在这个护身符里有盖亚化身地球星君埃什塔拉的祝福，。这个不可思议的圣物赋予佩戴者八个凡人的生命力，不受束缚的生育能力，以及她自己的领导智慧，一切之母。这珍贵的圣物是盖亚赐予的最好的材料制成的，她的触摸甚至在任何人身上都是她永恒的祝福和温暖的标志，由她的光辉宝座的一部分制成。"
 artifact_burning_horns_of_nerigal_name:0 "尼格尔的焚烧之角"
 artifact_burning_horns_of_nerigal_description:0 "这些红色粘土猎角是由火星化身尼格尔灵君用火星的尘埃制成的。当握住并吹响这些号角时，盖亚也会被震动，召唤着吹响号角的人投入战争，战争星君的力量和狡猾流入他们，召唤着所有人以他的名义赢得胜利"
 artifact_ruinous_talons_of_rorg_name:0 "罗尔格的毁灭之爪"
 artifact_ruinous_talons_of_rorg_description:0 "这些流星金属护手是由盖亚的配偶罗尔格星的残骸制成的，这些爪子是来自火星和木星之间的小行星带的灵君罗尔格的礼物，代表着复仇和愤怒。有了这些，他的意志就显现出来了，挥舞着它们的人成为了他的怒火，对他们面前的所有人发动屠杀。"
 artifact_imperious_crown_of_zarok_name:0 "扎罗克的盛气凌人之冠"
 artifact_imperious_crown_of_zarok_description:0 "万王之王的王冠，这顶完美无瑕，镶满宝石的王冠是由王与木星的化身扎罗克灵君手工打造的，扎罗克是盖亚的追求者，继露娜和赫利俄斯之后的最伟大者。当你戴上它，你就会变成最伟大的国王的活生生的面孔，无尽的财富将流入他们。"
 artifact_eternal_wings_of_lu_bat_name:0 "鲁·帕特的永恒之翼"
 artifact_eternal_wings_of_lu_bat_description:0 "这件羽毛斗篷是土星灵君，木星灵君和大猫头鹰的礼物。有了这些，持用者可以飞上天空，在影界和皮囊之地遨游，并在其中携带他自己的本性和智慧。"
 artifact_shadowed_stave_of_ruatma_name:0 "鲁阿特玛的暗影之杖"
 artifact_shadowed_stave_of_ruatma_description:0 "这个小的，手持的五线谱据说有天王星灵君的声音的一小片在它里面。通过它，星君与它的持有者交谈，低语许多关键的秘密和传说。然而，也许有些是不应该知晓的。"
 artifact_dancing_loom_of_shantar_name:0 "尚塔尔的轻快织机"
 artifact_dancing_loom_of_shantar_description:0 "这个发光的竖琴是完美的创造，由海王星灵君尚塔尔的手编织而成。与她的其他造物不同的是，这件作品是用她的专注力织成的，是送给她的斗士的礼物。在这台琴上，她优美的歌声潺潺流过，没有什么比这更能缓解紧张了。"
 artifact_whispering_ankh_of_meros_name:0 "梅罗斯的低语的生命之符 "
 artifact_whispering_ankh_of_meros_description:0 "这枚饱经风霜的银十字章似乎饱经岁月的洗礼，来自梅罗斯灵君送给冥王星灵君的最珍贵的礼物。这个珍贵的徽章允许使用者以神奇的速度移动，当说话时，持有者将收到一个永恒流浪者的声音片段。"
 eternal_love_artifact_name:0 "永恒之爱"
 eternal_love_artifact_description:0 "虽然不算是魔法，但不可否认的是，这把剑有某种神秘的咒力。它由银制成，能制造出吸血鬼无法治愈的伤口。只有将另一个吸血鬼的血与他们自己的血混合在一起，然后按在伤口上，伤口才能治愈。这把武器是迦太基的该隐之子工匠为帕里斯制作的，用于他猎杀吸血鬼的冒险。"
 artifact_ring_of_the_elements_name:0 "元素之戒"
 artifact_ring_of_the_elements_description:0 "作为最强大的灵具之一，元素之戒赋予狼人控制地水火风四种元素的力量。当被激活时，狼人不会被这些力量的攻击所伤害。例如，例如，火把会拒绝烧向狼人，石头甚至金属剑会从她的皮肤上弹起而无害，她也不会淹死在水下。"
 sword_samiel_artifact_name:0 "萨麦尔之剑"
 sword_samiel_artifact_description:0 "传说中的萨洛比第一武者是一位无以伦比的战士，他愿意超越自己的职责去对抗黑暗力量。他的武器强大到足以杀死一位[antediluvian|E]，直到今天晚上仍然散发着这不容恶的正义灵光。"
 artifact_bezariel_dagger_name:0 "仪式匕首"
 artifact_bezariel_dagger_description:0 "在被注入芭芭雅嘎的一小部分力量之前，这是一把无关紧要的仪式匕首，在贝撒列尔从深渊监狱逃出时，他用这把武器将他与地球缚在一起。\n$artifact_reliquarie_description$"
 artifact_orobas_statue_name:0 "欧若博司雕像"
 artifact_orobas_statue_description:0 "一座由潮湿、粘稠的砂岩组成的雕像，被千年以来用与束缚欧若博司。此后，它转变的更像其怪诞的宿主。\n$artifact_reliquarie_description$"
 artifact_heart_lamashtu_name:0 "拉玛什图之心"
 artifact_heart_lamashtu_description:0 "这个从未完成的盒子，与犹太教的约柜非常相似，承载着拉玛什图与凡人世界的联系。令恶魔感到沮丧的是，在最初的工匠死后，她再也找不到足够有天赋的工匠来完成它。\n$artifact_reliquarie_description$"
 artifact_caliburn_name:0 "石中剑"
 artifact_caliburn_description:0 "#bold 在战争中（作为指挥官时）给予友方骑士或在[single_combat_duel|E]中给予自己[GetModifier('caliburn_light_modifier').GetNameWithTooltip]。#!\n“光之剑”，石中剑是极其强大的妖精珍宝。其名字大致可翻译为“雷霆”。有一些观点认为，石中剑实际上并不是一件妖精珍宝，而是一件独特的物品，它违背了所有的估计和解释，因为就石中剑而言，对妖精珍宝的通常规则似乎并不成立。"
 artifact_caliburns_sheath_name:0 "石中剑之鞘"
 artifact_caliburns_sheath_description:0 "#bold 在战争中（作为指挥官时）给予友方骑士或在[single_combat_duel|E]中给予自己[GetModifier('caliburn_shield_modifier').GetNameWithTooltip]。\n作为[character_interaction|E]，允许你治疗目标的伤口。#!\n石中剑的鞘是由简单的黑色皮革制成的，尽管有些妖精声称他们能辨认出在皮革上附有的“石中剑”一词。"
 artifact_caladbolg_name:0 "螺旋剑"
 artifact_caladbolg_description:0 "#bold 作为[character_interaction|E]，允许你召来天雷以伤害目标的所有骑士。#!\n据说持剑者在战斗中是无敌的，这把剑提供给持剑者再生之力，而且它是自动攻击的。如果这还不够，传说也表明这剑赋予了持剑者侦测谎言或虚假的能力，比最伟大吟游诗人的故事更激励人，还可从天空召下雷霆。"
 artifact_red_apple_of_avalon_name:0 "阿瓦隆的红苹果"
 artifact_red_apple_of_avalon_description:0 "#bold 作为[character_interaction|E]，允许你让目标获得负面精神特质或谋杀其的朋友/爱人。#!\n长于红泉水的红皮苹果是有毒的，它们看起来的确挺好看，存在一种明红的色泽，不过只要咬上一口，就会引发剧烈的痛苦和幻觉。虽然这些苹果本身并不致命，但许多曾经吃过一口红苹果的都已死去，跑下悬崖或错把朋友当成敌人，以及迫使他们所爱之人与他们战斗亦或死亡。"
 artifact_white_apple_of_avalon_name:0 "阿瓦隆的白苹果"
 artifact_white_apple_of_avalon_description:0 "#bold 作为[character_interaction|E]，允许你治疗目标的负面精神特质。#!\n白苹果有着疗愈心灵的力量。它们可以去除夜惊症，治疗精神错乱或恢复哑者言语的能力。值得注意的是它们无法医治身体上的疾患，只能治疗那些根植于精神的疾病。"
 artifact_chalice_of_rain_name:0 "雨之杯"
 artifact_chalice_of_rain_description:0 "雨之杯是少数广为人知的在法师们手上的妖精珍宝之一，一群隶属于旧日信仰居住在康沃尔郡的法师们和妖精制定了一个古老的契约，用以帮助守卫传奇群岛里奥纳斯，使其免受那些找寻它传说财宝之人的掠夺。作为对于他们伸以援手的回报，妖精将杯子交托与法师们。据说，倘若想要目睹奇迹，则需灌注这个看起来银制且边沿具有古老符文环绕的杯子。如果杯子已被注满并且这水洒在地上就像是献给仙民的祭品一般，那么在下个月亮升起前杯之将会带来雨水。这帮助了法师和他们亲属勉强维持着在崎岖之地上的生活，以及确保了他们的繁荣。"
 artifact_broach_of_scrying_name:0 "占卜胸针"
 artifact_broach_of_scrying_description:0 "这枚胸针能帮助佩戴者做出简单的决定。持有者就他所面临的问题或他想承担的任务提出一个简单的是或否的问题。然后，他用石头砸开胸针，或把它踩在脚下，把胸针砸开。翻出来的石头会保持白色或变成黑色。白色的石头表示问题的答案是肯定的，而黑色的石头则表示答案是否定的。"
 artifact_singing_sword_of_madog_cynydd_name:0 "马多格·赛尼德的歌咏之剑"
 artifact_singing_sword_of_madog_cynydd_description:0 "#bold 作为[character_interaction|E]，允许你发起[single_combat_duel|E]来给予剑[GetModifier('artifact_life_expectancy_40_modifier').GetNameWithTooltip]修正。#!\n据众家之言，这是一件巧夺天工和具有致命力量的兵器。当在战斗中挥舞它时，剑会为他使用者的敌人颂起挽歌。每个在战斗中被马多格·赛尼德之剑砍倒的敌手都会把他任何剩余的自然寿命交与凶手。因此，用马多格·赛尼德之剑杀掉一个年轻人就能令持剑者延寿40年。持剑者也会收获死者在将来可能拥有的任何好运，受害者的厄运则随他一并消逝。"
 artifact_black_torc_of_carniog_name:0 "卡尼奥格的黑颈环"
 artifact_black_torc_of_carniog_description:0 "#bold 解锁[marked_for_return_interaction|E]\n解锁[bind_wraith_interaction|E]\n解锁[command_wraith_interaction|E]\n最大束缚死灵数量：#P +2#!#!\n传说卡尼奥格的黑色金属颈环有着能够盗取灵魂和使整支凡人军队都陷入近乎永恒（尽管很平静）沉眠的力量。一些人暗示它也授予了驱使妖精们的能力，不过在这个问题上他者们自身却沉默以对。"
 artifact_blazing_silver_torc_of_myfanwy_du_name:0 "米万维·杜的的闪银颈环"
 artifact_blazing_silver_torc_of_myfanwy_du_description:0 "米万维·杜的闪银颈环会让那些注视着佩戴者的人心中充满深切的敬意和喜爱之情，他们会竭尽所能的去帮助他，纵使佩戴者在戴上颈环前他们是最势如水火的敌人。如果佩戴者给出了恰当的暗示，一个这样的示意就会将对方心中的喜爱之情点燃成/转化为狂热的爱恋（无论佩戴者性别如何）。"
 artifact_cauldron_of_gruffydd_name:0 "格鲁菲德的大锅"
 artifact_cauldron_of_gruffydd_description:0 "#bold 能够招募[GetMaA('animated_tree').GetName]、[GetMaA('golems').GetName]、[GetMaA('guardians').GetName]和[GetMaA('homunculus').GetName]作为[men_at_arms|E]。#!\n格鲁菲兹大锅的主人不管往里放进去什么都会创造出来扭曲的战士。如果一个法师用岩石装满大锅，那么一尊石元素就会出现并为他而战。类似地，在格鲁菲兹大锅中装满匕首和黏土便会产生一个很像带刺魔像的恐怖（并且致命）仆人。显然，某些组合要比其他的更有效，但即使是一支柳条部队也要远比孤军奋战强。"
 artifact_cauldron_of_annwn_name:0 "安温圣锅"
 artifact_cauldron_of_annwn_description:0 "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n最令人垂涎的精灵珍宝之一便是安恩圣锅。它曾经位于盖世圣丘下面的冥界，在摩根勒菲违背他的意愿并试图对亚瑟王使用圣锅后，妖精国王阿瓦拉克将它藏了起来，不让凡人看到。根据法师们的传言，一个没入安温圣锅水中的濒死之人再从里面出来后将会变得康健，复全以及年轻。"
 artifact_faerie_dust_name:0 "妖精尘"
 artifact_faerie_dust_description:0 "妖精尘通常装在小袋子里，必须与目标直接接触才能发挥作用。其他方法包括：从上方向目标洒粉；在目标的手套或衣服上洒满粉尘；在食物上洒粉；将粉尘与液体混合制成药水和药剂；甚至投掷整袋粉尘，粉尘在受到冲击时会爆炸，以达到更远的距离。"
 artifact_cabinet_stick_name:0 "魔柜棒"
 artifact_cabinet_stick_description:0 "这根看似普通的手杖能赋予使用者魔法能力，让他们可以进入遥远的妖精界域中某个隐蔽的橱柜或衣橱。使用者只需要在任何橱柜、门、大箱子，甚至是树皮上用这根手杖轻敲一敲，便可以激活到达魔法储物空间的链接。"
 artifact_cap_of_neglect_name:0 "忽视帽"
 artifact_cap_of_neglect_description:0 "尽管这些帽子不能真正地实现隐形效果，但这种魔法的要求并不多。只要没有人有意地寻找佩戴者，其他人就会忽略她在房间中的存在。只要佩戴者不引起注意，比如说讲话或者突然移动，她就可以悄悄地移动而不被察觉。"
 artifact_ring_of_linked_sight_name:0 "链目戒"
 artifact_ring_of_linked_sight_description:0 "这些戒指经过特殊的魔法附魔，来让它们之间创造一种魔法纽带。如果一枚戒指的持有者将其贴到右眼上，她会看到第二枚戒指的持有者，就好像他只站在几英尺远的地方一样。第二枚戒指的持有者周围的雾气和阴影会使环境显得模糊不清，但他的形体和动作依然可见。如果这枚戒指的持有者将其贴到左眼上，她会看到第二枚戒指的持有者所看到的景象，就好像她从他的左眼望出去一样。"
 artifact_sealing_needle_name:0 "封针"
 artifact_sealing_needle_description:0 "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n这些附魔的针是作为礼物送给女仆和裁缝以换取效忠的简单珍宝，一旦装备，就能神奇地缝上任何撕裂或开口。根据所使用的线的类型，针可以修复破损的衣服，封住谷物袋的开口，甚至缝合开放的伤口。制造这些珍宝的符咒很简单，针在皮革、丝绸或皮肤上的效果也一样好。虽然这些珍宝的大多数用途都很单纯，但冬之一族已经知道用这些宝物来封住受害者的嘴、鼻子和眼睛，或者把他们切开，用粗糙的麻布把他们缝合起来。"
 artifact_active_arrow_of_midnight_sun_name:0 "夜日箭#Weak （已激活）#!"
 artifact_arrow_of_midnight_sun_name:0 "夜日箭#Weak （未激活）#!"
 artifact_arrow_of_midnight_sun_description:0 "#bold 若激活，在战争中（作为指挥官时）给予敌方骑士和指挥官或在[single_combat_duel|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。#!\n这些附魔的箭矢是夏之王廷的最爱。当向夜空发射时，这些箭会迸发出璀璨的光芒，用正午的太阳之光照亮战场。这种光可以用来驱赶黑暗生物，或者简单地在没有光的地方创造光。"
 artifact_arrow_of_inky_noon_name:0 "墨午箭"
 artifact_arrow_of_inky_noon_description:0 "这些箭矢是夜日箭的对应物，受冬之王廷青睐。白天射向空中时，这些箭矢让天空变得漆黑如同无月之夜。"
 artifact_vulcans_hammer_name:0 "火神之锤"
 artifact_vulcans_hammer_description:0 "这种铁锤有时被北方文化的居民称为矮人之锤，它被施以魔法用于武器和盔甲的铸造。这个工具可以神奇地增加用于制造此类物品的金属的强度，使它们能够造成和承受更多的伤害。使用这铁锤锻造的任何武器都不需要研磨便能在战斗中造成额外的伤害。"
 artifact_pegasus_bridle_name:0 "飞马缰绳"
 artifact_pegasus_bridle_description:0 "关于翼马的凡间传说是否启发了这珍宝，或者说反之亦然，人文主义学者们存在不同的看法。当这个缰绳被套在任何动物身上（通常是马），它便能够飞翔，直到被取下为止。"
 artifact_rooting_amulet_name:0 "生根护符"
 artifact_rooting_amulet_description:0 "这珍宝最初是由一位木元素妖创造的，用来惩罚一个违反誓言而进入他的小树林的女王。妖精制作了一个美丽的护身符，并把它送给王后的一个宫女，作为送给他情妇的礼物。王后非常喜欢这条编织精美的银项链，并把它紧紧地戴在了脖子上。当她把脚放在家门口的地上时，她的双腿深深地扎进了泥土里，她的身体和手臂变成了树干和树枝。元素妖先是显露出自己是森林中的妖精，然后夺回了护身符，并对王后的宫廷给予警告，提醒他们不要在附近的森林里走得太深。"
 artifact_twin_glass_name:0 "双子镜"
 artifact_twin_glass_description:0 "一面被神奇地一分为二的镜子，双子镜可实现远距离通信。两面镜子的功能就像窗户，主人可以通过其中一面镜子观察或说话，也可以通过另一面镜子受视或聆听。"
 artifact_gale_flute_name:0 "大风长笛"
 artifact_gale_flute_description:0 "这个小乐器具蕴含了黎明之力，能够召唤出从微风到狂风暴雨的一切。从长笛吹出的单一、柔和的音符会将微风吹向演奏者。吹奏时间越长，风的力量就越强，仅仅几分钟后就会变成狂风。继续吹奏便会带来烈风，制造出难以置信且足以摧毁整个村庄的风暴。"
 artifact_excaliburs_scabbard_name:0 "湖中剑之鞘"
 artifact_excaliburs_scabbard_description:0 "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n虽然这不是传说中的湖中剑或石中剑的真正剑鞘，但这件稀世珍宝是如此古老，具有如此神秘的特性，以至于它已经与那把强大的武器联系在一起。任何从剑鞘中拔出的剑据说在战斗中都是牢不可破的，但这件珍宝的真正力量源于它的治疗能力。"
 artifact_shatterhammer_name:0 "碎石锤"
 artifact_shatterhammer_description:0 "这些可怕的武器是在四季之战最激烈的时期制作的，现今所知的已寥寥无几。因地震或山崩而诞生的灵通常会被誓言绑定在这些珍宝中。这些大地之灵会赋予普通武器力量，在击中目标时会产生震荡波纹。众所周知，这种锤子可以击碎盔甲和骨头，使内脏破裂，劈开大型橡木门，甚至击倒石塔。"
 artifact_sword_of_drowning_name:0 "溺水之剑"
 artifact_sword_of_drowning_description:0 "在四季之战期间制作的这些武器包含了水灵或水元素妖，它们要么出于某种原因而放弃了自由，要么被强制地束缚在其中。它们所固守的水性本质在战斗中显现，当命中目标时，会导致水流进目标的肺部。这些攻击会引发恐慌和偏执，因为对方在水中中呛咳和咳嗽。"
 artifact_cauldron_of_nightmares_name:0 "噩梦坩锅"
 artifact_cauldron_of_nightmares_description:0 "这些大锅被创造出来，用来在冬之王廷的敌人中制造恐慌和绝望，它们可以让目标最黑暗的恐惧在现实世界中短暂地显现出来。为了让魔法生效，必须将目标的某一部分——一缕头发、一颗掉落的牙齿，甚至是一截断的手指——与大锅内的药剂混合在一起。然后执行复杂的仪式，使目标最可怕的噩梦的形象具现化。"
 artifact_castors_star_name:0 "双子座之星"
 artifact_castors_star_description:0 "双子座之星在一场雷电风暴中坠落自天空，留下一道充满电光和火焰的裂痕尾迹，其中充满混沌能量，渴望着释放。刚被发现时，这颗巨大的金属岩石充满了来自闪电的能量，它在夜晚发出蓝光，使接近它的人在一阵剧痛后不得不放下他们的金属武器。"
 artifact_friars_cross_name:0 "修士十字架"
 artifact_friars_cross_description:0 "修士十字架起源于黑暗中世纪，是一个悬挂在编织绳上的大型华丽金色十字架。虽然曾被用作信仰和保护的象征，但修士十字架的历史却与对妖精魔法的消解和对幻生灵的毁灭息息相关。注入了一再抹煞的板讷，修士十字架已成为一种腐化装置，吞噬着不幸佩戴它的人的梦华。"
 artifact_gray_sword_name:0 "灰之剑"
 artifact_gray_sword_description:0 "灰之剑，虽然明显是奇魅的，却没有个性或装饰，看起来像一把普通的阔剑，带有简单的剑柄和平整无记号的刀刃。它的历史最多只能说是模糊不清。有人怀疑它是由一个哀怒廷领主制造的，他试图抹煞一位喜乐廷对手，但没有一个名字能明确地与这把剑的创造联系起来。"
 artifact_gauntlets_name:0 "护手套"
 artifact_gauntlets_description:0 "护手套，从最简单的层面来看，就是一双手套。然而，如果只是这样，红帽子们就不会那么喜欢它们了。然而，每一个制作护手套的红帽子都会在上面镶嵌鱼钩、剃刀片、破碎的玻璃、生锈的钉子和木屑。没有两双护手套是相同的，大多数红帽子发誓只能戴自己的。"
 artifact_dry_dust_name:0 "干尘"
 artifact_dry_dust_description:0 "干尘的作用很简单。它会让任何吞下它的人（尽管它必须与食物或饮料一起服下，不能单独服下）在一小时内感到极度饥饿和极度口渴。在这段时间内，受害者会试图吃掉一切——极端情况下连人都吃——只要能够伸手到的东西。干尘有各种各样的用途，从毒害到粗鲁的恶作剧。似乎只有红帽子知道它的制造秘密，而那些被询问的少数红帽子暗示他们曾经磨碎人骨来制作这种东西。他们可能在说真话，也可能只是试图让询问者感到不安。不管怎样，这都说明了很多问题。"
 artifact_blooded_gauntlets_name:0 "血护手套"
 artifact_blooded_gauntlets_description:0 "普通护手套上的刺、突起、刀片和钩子只是尖锐和危险，而血护手套上的这些部件则是自己能动出击的。当它们撕裂对手时，它们想要停留在那里，并尽可能多地造成伤害。目击者（以及极少数的幸存者）发誓，刀片和其他部件实际上会在拳头命中后移动，撕裂目标的肉体。钩子将血护手套卡在原地，而其余的装备则开始行动，撕裂直至骨头及更深的地方。不幸的是，那些被红帽子穿戴这种护手套的家伙注定只能忍受一瞬间的极度痛苦，别的什么都无法做。"
 artifact_grinder_name:0 "磨碎机"
 artifact_grinder_description:0 "无论如何强调都不为过，磨碎机几乎可以吞下任何东西。金属？没问题。尸体？轻而易举。大象？可能需要一些时间，但也能被吞下。而不管吞进去什么，最后都会输出一样的东西，就是一种不太好吃的东西。当然，被扔进去的物体的大小以及它所制造的原材料会影响磨坊机将其完全咀嚼掉需要多长时间，但最终，只要红帽子愿意转动曲柄，这个装置几乎可以处理几乎一切可以想象到的东西。"
 artifact_logis_ashes_name:0 "罗吉之烬"
 artifact_logis_ashes_description:0 "#bold 作为[character_interaction|E]，允许你对敌人的国家释放[GetModifier('POD_county_great_famine_modifier').GetNameWithTooltip]。\n作为指挥官时，在战争中给予敌方指挥官[GetModifier('logis_ashes_modifier').GetNameWithTooltip]修正。#!\n即使是撒上一丁点罗吉之烬，也会产生恶劣的影响。一旦撒下，附近所有的食物和饮料都会在进食变成嘴里的灰尘。这影响像野火一样迅速蔓延，一般会延伸到数英里之外。整个公国都会被这荒废掉，因为任何被带入的食物都会在一年零一天内以这方式衰谢。"
 artifact_winterblade_name:0 "冬之镰"
 artifact_winterblade_description:0 "据说冬之镰就是将割去世界之夏并将一切陷入冬季的镰刀。它接触的地方，大地将会冷却，并永久荒芜。它的刃只需轻轻一割就足以枯萎数百年生长的树木，而微不足道的划痕就足以吸取生命。即使是那些侥幸闪躲开冬之镰的人也会在骨子里感到它的寒意，如果他们能够在其刃回砍之前连滚带爬的躲开，那就算是幸运了。"
 artifact_achen_name:0 "亚琛"
 artifact_achen_description:0 "#bold 作为战争参与者时，在战争中给予敌方参与者[GetModifier('achen_modifier').GetNameWithTooltip]修正。#!\n亚琛是杜伽尔的双头锤，它的形状是杜伽尔世家的族徽。在战斗中，亚琛会自动给它击中的任何武器或盔甲附魔，使其不能用来对付杜伽尔世家的成员。有故事说，整个军队被锤子的力量所阻挡；盔甲和剑被冻结在原地。他们的所有者和穿戴者不得不把它们留在战场上，在亚琛的力量下裸体撤退。"
 artifact_anweyth_name:0 "安威斯"
 artifact_anweyth_description:0 "安威斯，钢铁之母，创新之刃，是一把美丽的短剑，银色花纹镶嵌其中，柄为黑玛瑙。它在杜伽尔世家的传说中拥有神秘的地位；它是杜伽尔最后的杰作，无与伦比的杰出之作。安威斯有两种已知的能力：它能够告诉任何铁匠制作钢铁的秘密；其次，它无法被垂涎。"
 artifact_caliper_of_aife_name:0 "埃斐的卡尺"
 artifact_caliper_of_aife_description:0 "杜伽尔的妻子埃斐用某种被遗忘的野兽的象牙精心制作了一套精美的游标卡尺，每只游标卡尺的尺长都和巨鬼的胳膊一样长。这些游标卡尺可以“测量”任何可以放在它们之间的事物：距离、重量、长度、纯度、诚实、爱情、仇恨等等。"
 artifact_mooncrystal_name:0 "月晶"
 artifact_mooncrystal_description:0 "月晶大小各异，从弹珠到篮球大小不等，看起来就像你在占卜师那里期望看到的刻板形象的“水晶球” ——球状，呈乳白色，似乎在你凝视着它时会不断变换和折射颜色。月晶允许其使用者每周一到三次，根据其威力和大小的不同，获取关于现在或最近发生的事情的洞察力。"
 artifact_elenas_mirror_name:0 "埃琳娜的魔镜"
 artifact_elenas_mirror_description:0 "作为神话时代仅存的珍宝之一，没有人确切知道谁拥有这个极为强大的物品。据说埃莉娜之镜允许持有者在一天内的某个时间段内，最多持续一小时，清晰地看到世界上的任何地方。此外，它还允许持有者在镜中出现的人上施放小法术。人们相信这面镜子在施放“至高法术”方面尤为有帮助，因为在遥远的过去，有关使用这面镜子影响世界各地国王和亲王决策的传说。"
 artifact_balors_crystal_eye_name:0 "巴烙的水晶眼"
 artifact_balors_crystal_eye_description:0 "当强大的邪眼巴烙最终在战斗中倒下时，弗摩尔族的一位战士祭司取出了他破碎的眼睛并把它包裹在一个水晶里，水晶里也储存着一口井里的治愈之水。他希望能够保存和恢复它，以便再次用作对抗达南神族及其后裔的武器。然而，眼睛已经沉睡了几个世纪，但但随着红星在妖精称之为巴烙之眼的[dreaming|E]中出现，皇家卫士们在一个受保护的地方让它沐浴在它的光芒中。自那时以来，水晶眼开始发出暗红色的光芒，巨大的热量被包围的水晶所阻挡。"
 artifact_blood_dross_name:0 "血渣"
 artifact_blood_dross_description:0 "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。#!\n舞蹈大师们已经发现了一种方法，可以让与他们有关系的莉莉丝之子们为他们提供一种不同寻常的黑暗梦华。通过从那些被称为疯子的吸血鬼在表现出他们的疯狂或在妥内朵从事艺术追求时取几滴血液，大师们创造了所谓的血渣。血液储存在由结晶糖制成的小圆瓶中，然后涂上稍微坚硬的外壳以保持其中的液体。几个珠子可以一起存放在一个保护盒中长达一个月而不会失去其效力。"
 artifact_steaming_spear_of_vengeance_name:0 "气化之矛"
 artifact_steaming_spear_of_vengeance_description:0 "很久以前，长臂鲁格使用一支魔法矛来穿出巴烙之眼。作为回应，巴烙世家的工匠一直在制造反制喜乐廷统治者的武器，以待战争爆发之后拿来对付喜乐廷。被称为“气化之矛”，它使用了与伤害巴烙的矛相似的矛头。通过强大的附魔，这支矛充满了愤怒，使它成为一支追血矛。它的矛头必须不断浸泡在水中，因为它会融化触碰到的任何物体，而它的杆必须被沉在深水中的石头上的锁链拴住，以防止它飞出去寻找猎物。"
 artifact_cauldron_of_fear_name:0 "恐惧坩锅"
 artifact_cauldron_of_fear_description:0 "#bold 在战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('cauldron_of_fear_modifier').GetNameWithTooltip]修正。#!\n这是一个巨大的黑色大锅，看起来略带锈迹，但当装满静水并放在火上时，它会产生一种精致的、几乎看不见的迷雾，随风散布到大厅或战场。被迷雾困住的人会在心头感到恐惧，即使是最勇敢的骑士和光荣的对手也会惊慌失措，通常会在匆忙中丢下武器或其他任何他们携带的东西以逃离。缺点是如果风向改变，使用这个大锅的人可能会被迷雾反噬。"
 artifact_rose_of_leanhaun_name:0 "恋难舍之玫瑰"
 artifact_rose_of_leanhaun_description:0 "#bold 允许通过[decision|E]补充梦华。#!\n这件珍宝是恋难舍死时放在她胸前的一朵白玫瑰。在菲尼利亚的诅咒下谴后，这是唯一一朵在与她接触时没有变黑的花，而且从那时起就一直保持着纯洁。世家成员认为它是希望的象征，因为它一直保持着纯洁和活力，而且无需乱梦就能维持持有者。持有玫瑰的妖精可以直接从中汲取梦华。"
 artifact_edanns_harp_name:0 "艾丹之竖琴"
 artifact_edanns_harp_description:0 "#bold 每月额外恢复一点梦华。#!\n这把古老的木制竖琴上有一条贯穿全身的大裂缝，琴弦看起来就像起毛的缝线一样，而且破损不堪，最多只能从对凯尔特历史感兴趣的人手中换来几块钱。然而，在附有魔力的眼中，这把竖琴虽然古老而有裂痕，但却镶嵌着黄金，银色的琴弦就像闪亮的头发一样细腻而脆弱。世家中没有人知道这究竟是偷走恋难舍芳心的吟游诗人——艾丹——的竖琴，还是精心制作的复制品，但上面强力的附魔让它成为了世家的珍宝。"
 artifact_crown_of_dreams_name:0 "梦之冠"
 artifact_crown_of_dreams_description:0 "#bold 不再需要最高压力等级来使用乱梦[character_interaction|E]。#!\n这件珍宝实际上并不是一顶王冠，而是一枚镶满珠宝的橡木簪子，形状就像一顶造型别致的王冠。戴上它的人，也就是戴着被发现者称之为王冠的人，就能了解附近区域（约一平方英里）的所有梦源，并知道如何发掘他们的潜能。通过对潜能的辨别，佩戴者可以知道谁最有可能从梦源的创造中获益。"
 artifact_masquers_eyes_name:0 "面具之眼"
 artifact_masquers_eyes_description:0 "This Treasure is actually a pair of normal, if very exquisitely decorated, domino masks. When activated, they create a connection between the wearers, allowing the two to share senses and even emotions at range. The user dons the mask and the other Kithain may see and hear everything her counterpart does as long as the mask is worn. She may even borrow her friend's voice, as long as her friend consents to the message."
 artifact_passion_braceler_name:0 "炽情之镯"
 artifact_passion_braceler_description:0 "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。#!\n这些手镯看似简单的布质或银质手镯，但实际上是梦华或意志力的容器，可以为佩戴者储存魔力或意志力，直到需要时才释放出来。考虑到我们面临的巨大压力，这些手镯简直就是天赐之物。布质手镯总是用换生灵最喜欢的颜色编织而成，可以储存梦华；银质手镯则刻有佩戴者的名字，可以储存意志力。"
 artifact_eilaf_name:0 "埃拉夫"
 artifact_eilaf_description:0 "This long bow once belonged to the Ivalde, a great warrior who died during the ninth and final battle against the Jotunns. The Volvas guard this bow until the day when a new warrior whose skills match Ivalde's comes to them. An arrow fired from this bow never misses its target and inflicts aggravated damage."
 artifact_tapestry_of_fate_name:0 "命运织锦"
 artifact_tapestry_of_fate_description:0 "Whether it truly exists or not is unknown to the fae. According to stories, the tapestry contains every true name that there is, as well as the fate of the [dreaming|E]. The power and knowledge it holds are invaluable. Lost long ago, it is rumored to be everywhere from a sluagh freehold to under the Silvered Sea. Many have left in search of it, but none have returned. On thing is for certain: the finder will probably draw the wrath of the Norns upon them."
 artifact_berserker_armor_name:0 "狂战士之甲"
 artifact_berserker_armor_description:0 "This ornate armor shields those who wear it from all attacks with weapons and allows them to fight beyond their regular capacity. The greatest house secret is that the armor is vulnerable to magical attacks or attacks made with the bare hand. Though powerful, the armor exacts a price:Once those wearing berserker armor are unleashed, they are impossible to stop until they are dead or their side has won the battle."
 artifact_cudgel_of_conchobhair_name:0 "康胡尔之棒"
 artifact_cudgel_of_conchobhair_description:0 "Conchobhair's cudgel is an unassuming oaken staff about 8 feet tall. It grants its bearer (and will only function for a member of House Daireann) several wonderful powers. The foot of the staff is shod in cold iron as a warning and, under the direst circumstances, as a possible weapon."
 artifact_cauldron_of_sceanbh_name:0 "萨森布的大锅"
 artifact_cauldron_of_sceanbh_description:0 "The cauldron has two functions, depending on the desire of the brewer. Its first power is to brew a potion that inspires warriors to great deeds. The second power is more insidious, making a powerful sleeping draught."
 artifact_amber_wyrm_name:0 "龙蛇琥珀"
 artifact_amber_wyrm_description:0 "Deep within a dark red amber egg lies a miniature dragon coiled in sleep. Suspended on a golden chain, surrounded by a patterned web of gold, the egg is translucent, allowing all details of the dragon to be seen. On occasion the dragon turns in its slumber, as though the amber were merely water."
 artifact_eyes_of_the_snow_maiden_name:0 "雪女之眼"
 artifact_eyes_of_the_snow_maiden_description:0 "In ancient times, the sorceress Charodei used pieces of golden amber, clear as sunshine, to make the eyes of the Snow Maiden she presented to Varich. When the heat of his passion destroyed her, the amber eyes were discovered submerged in a pool of a strangely salty water. Varich never wished to see them again, but other members of the house have kept them, for it is rumored that they may truly see the shapes of the enemies of the fae: the Fomorians."
 artifact_firebird_name:0 "火鸟"
 artifact_firebird_description:0 "This nocker-built Treasure is an intricate mechanical firebird made of ruby and gold. When exposed to both the light of the sun and the rays of the moon, the firebird soars and sings into the sky when commanded to do so. When it has risen to a height of 100 feet, it bursts into glorious flame, lighting the area around it for miles with a golden, flickering light and pointing the way to the nearest trod or to a specific location designated by its master."
 artifact_havens_compass_name:0 "避风港罗盘"
 artifact_havens_compass_description:0 "This treasure usually comes in the form of an antique compass. Rather than pointing northward, it homes in on the closest active freehold or glade. Useful for explorers and wanderers in need of \"any port in a storm,\" the compass doesn't distinguish between the hold of a Seelie motley and that of an Unseelie commoner-hating lord. Since some freeholders keep their homes hidden, they may not look too kindly on the owner of this treasure."
 artifact_bakers_stone_name:0 "面包师之石"
 artifact_bakers_stone_description:0 "Bakers' Stones can come in any shape, color, or size, though most are round and made from brown clay. When any kind of organic material is placed on the stone (yes, any kind of matter), it magically transforms into plain but edible cakes. In the [dreaming|E] or near places rich in Glamour, the cakes become richer and fancier, with icing, currants, and fruit toppings. "
 artifact_bane_dagger_name:0 "灾祸匕首"
 artifact_bane_dagger_description:0 "This nasty weapon is designed for assassination, and as such has been officially proscribed. The dagger has a small compartment in the hilt. When a part of the intended victim is placed in the compartment (a strand of hair, an eyelash, or a drop of blood), the blade becomes attuned to that person, and can never be reattuned. Once the target has been killed, the blade begins to corrode, disappearing in less than an hour."
 artifact_dreamstone_of_madoc_name:0 "马多克的梦石"
 artifact_dreamstone_of_madoc_description:0 "#bold 作为[character_interaction|E]，允许你传送到目标所在地。\n允许在灵游时进入[dreaming|E]。#!\n梦石有很多，但没有任何梦华容器能与马多克的梦石相比。它所聚集的梦华可能会“泄漏”，导致最靠近它的人做一些生动的梦，醒来后就会一直记得。不过，它最大的能力是塑造梦境。一个熟练的造梦师可以创造出具有巨大力量的奇魅生物，将梦界折叠在自己身上创造出口袋界域，或者在原来没有的地方建造一条仙路或通道。未经证实的传言称，它甚至可以找到并打开通往阿卡迪亚的道路。"
 artifact_durable_sandals_name:0 "耐久凉鞋"
 artifact_durable_sandals_description:0 "You scoff but these are a highly prized treasure among the Elegbara. They never wear out or require repair. They are comfortable and keep your feet warm and dry regardless of climate, and offer a small boost of energy while walking or running."
 artifact_trail_dust_name:0 "显路尘"
 artifact_trail_dust_description:0 "A useful treasure, Trail Dust always comes in a small, weathered-looking leather pouch adorned with an ancient symbol meaning \"trail.\" Inside is a small quantity of dirt or sand appropriate to the are the Elegbara is traveling in. When activated with a point of Glamour and sprinkled across the owner's bare feet, he or she immediately gains a detailed geographic map and directional knowledge of the surrounding area roughly the same as a native twice their age would know."
 artifact_blessed_opa_name:0 "受祝福的欧帕"
 artifact_blessed_opa_description:0 "The opa is the traditional weapon of the Elegbara. Similar to a quarterstaff, it is usually intricately carved and adorned with luck charms and souvenirs their owners have picked up on their journeys. Most are hardened by firing or by Cantrips and are as durable as metal and so able to be used in combat against edged weapons without fear of breaking. They are valued for both their beauty and utility."
 artifact_basilisk_stone_name:0 "蛇怪石"
 artifact_basilisk_stone_description:0 "Unfortunately, most people don't appreciate Nocker speech habits and while the nockers may rail against such harsh judgements, even they understand there are times when they need to shut up and that can be difficult to do. A Basilisk Stone is, therefore, invaluable while at court or when trying to hold down a job in the mundane world. Although Blistertongue Jill shattered the first and greatest of these treasures, the shards of the original still hold some of Byzamedas' old magic."
 artifact_goblin_lantern_name:0 "哥布林提灯"
 artifact_goblin_lantern_description:0 "This kind of lantern is common in nocker mines. It casts two types of light. The first is visible to all Kithain but with the turn of a knob, a nocker can make it visible only to other nockers."
 artifact_goblin_parchment_name:0 "哥布林羊皮纸"
 artifact_goblin_parchment_description:0 "Goblin Parchment is the preferred medium of nobles and nockers for sending secret messages, especially threats. Writing on Goblin Parchment is only visible to the intended recipient and the paper burns up immediately after it is read. It also resists all attempts to copy the information on it, even by other nockers or Sluagh Wordspiders."
 artifact_goblin_shoes_name:0 "哥布林鞋"
 artifact_goblin_shoes_description:0 "Nockers make these shoes from the skin of a white, subterranean worm chimera. They can stretch over almost any size foot and render the wearer's footsteps almost completely inaudible."
 artifact_razor_claws_name:0 "剃刀爪"
 artifact_razor_claws_description:0 "Razor Claws are a regular best-seller among Redcaps. These special gloves hide small, cruelly carved blades that extend beyond the knuckles that can be extended by pressing a stud hidden in the palm of the glove."
 artifact_goblin_bow_name:0 "哥布林连弩"
 artifact_goblin_bow_description:0 "This is a multi-shot crossbow that carries six bolts in a metal clip. The bow advances the clip with each shot and so allows the user to make multiple shots without having to stop and reload."
 artifact_goblin_cloak_name:0 "哥布林斗篷"
 artifact_goblin_cloak_description:0 "Black crystals are woven into goblin cloaks to bend light around the wearer."
 artifact_pendulum_name:0 "摆锤"
 artifact_pendulum_description:0 "This treasure is a small, hollow metal ball connected to a silver chain. By putting any kind of metal inside the ball, the pendulum will lead the user to the nearest deposit of that material. If none is in the area, the user can dowse over a map and the pendulum will circle over the nearest deposit's general area."
 artifact_universal_solvent_name:0 "万能溶剂"
 artifact_universal_solvent_description:0 "Universal Solvent is a result of Nocker investigation into chimerical alchemy and is the greatest (and among the rarest) products of this science. The solvent is a binary compound; the alchemist must keep its parts in two separate bottles (one Black, one White, usually). When the nocker mixes the two components, a dense cloud of pure Banality pours forth, dissolving every chimerical object in its path, including changelings in their fae mien."
 artifact_magical_crumbs_name:0 "魔法面包屑"
 artifact_magical_crumbs_description:0 "A common treasure among pooka, Magical Crumbs reportedly come from the Black Forest in Germany. Gathered up off the ground along a special path, they have the ability to lead a pooka back home if they should stray. Most pooka own two of them: one to leave at the point of departure and one carried with the pooka to serve as the scent. So long as the pooka remembers to leave one at home and doesn’t lose the one they're carrying, they can eventually sniff their way back. Obviously, they could also be shared between friends so the pooka could find the other person in case they were separated. "
 artifact_cat_boots_name:0 "猫靴"
 artifact_cat_boots_description:0 "Many lifetimes ago, or so the story goes, a shoemaker in London saved the life of a cat after it had run afoul of a large dog. The shoemaker nursed the cat back to health and in exchange, the cat, who was a pooka, helped the shoemaker. For a year and a day, every set of boots that the shoemaker created had the special quality that they made other people ignore the wearer’s presence. Changelings came from around the world to purchase the boots and the shoemaker prospered, retired rich and happy, and eventually the pooka went on his way."
 artifact_balthazars_bracelets_name:0 "巴尔萨泽手镯"
 artifact_balthazars_bracelets_description:0 "If nothing else, these matching bracelets have a delicate beauty that makes them a special addition to the stash of any pooka who likes pretty, shiny things. However, they also have a very unique benefit when worn. When placed on the wrists, they tighten of their own accord to fit smoothly over the changeling’s forearms, swirling up from wrist to elbow. If the faerie knocks once on the bracelets, they meld to the skin and become ebony tattoos that will shape-shift with the pooka when he changes to his animal mien. In that form, the tattoos simply resemble markings on the animal’s skin."
 artifact_cleopatras_wings_name:0 "克莉奥帕特拉之翼"
 artifact_cleopatras_wings_description:0 "This handsome, one-of-a-kind choker has a butterfly pendant hanging from a wide gold band that fits around the neck. Made of amber, the butterfly’s wings blush scarlet near the golden body and lighten to a warm orange near the tips. The changeling that wears the necklace gains the ability to fly in a manner similar to that of the Wind Runner cantrip. A pair of shimmery, intangible wings appear at the faerie’s back. The wings themselves have no substance and cannot be damaged. They disappear as soon as the changeling removes the choker."
 artifact_osiris_flail_name:0 "奥西里斯的连枷"
 artifact_osiris_flail_description:0 "The first pharaoh of ancient Egypt, Osiris, kept two symbols of power. One of these, his flail, is depicted on the sarcophagi of many of the pharaohs that followed in his footsteps. It is usually shown crossed with a crook over the chest of the dead king. The flail is a short-handled rod from which hangs a group of three leather strips decorated with wooden beads and bone. Reportedly, it recorded all of history in the chimerical carvings upon its bone and wood beads. To tap its extensive wisdom, a person simply asked a question, then touched the flail to her brow. The answer came immediately."
 artifact_grapes_of_wrath_name:0 "怒之葡萄"
 artifact_grapes_of_wrath_description:0 "The Grapes are perfect and a deep, rich purple. They gleam invitingly and flicker with Glamour to any who look closely enough. Those who eat a Grape feel slightly intoxicated and start to lose their inhibitions. The more they eat, the more uninhibited they become. They Grapes contain no actual alcohol, though, so motor skills are not impaired."
 artifact_horn_of_hermes_name:0 "赫尔墨斯号角"
 artifact_horn_of_hermes_description:0 "Made of brass, this tarnished treasure looks like a helicon, or a large tuba. Its surface has pock-marks and the insignia of winged boots, Hermes' sigil. Hermes served as messenger of the Unseelie fae of Olympus and was known among mortals as the patron of travelers. He and Dionysus developed a friendship and after Hera's second attempt on Dionysus' life, Hermes gave him the horn."
 artifact_halcyon_halter_name:0 "翡翠鸟吊带套"
 artifact_halcyon_halter_description:0 "The halcyon was a bird, identified with the kingfisher, that had the ability to soothe the winds and waves when it nested upon the sea during the winter solstice. The bird's legend originated in Greece where sailors threw sweet biscuits into the Mediterranean Sea to draw it and then, in the calmer seas, near their ports. Decorated with the bird's feathers, this halter makes an X across the chest of its wearer, crossing right over the heart where the brightest feathers stand out."
 artifact_minoan_mosaic_name:0 "米诺斯马赛克"
 artifact_minoan_mosaic_description:0 "The ancient art of mosaics was developed in ancient Greece. It involves setting pieces of colored tile in mortar to form a picture or decorative design. The Minoan Mosaic originated on Crete during the reign of King Minos. According to legend, this treasure shows the image of a faceless person until a changeling gazes into it for an extended period of time. Spending one point of Glamour, the faerie begins to see the face of their one true love appearing amidst the tiles. Narcissus peered into the Minoan Mosaic and was disappointed when the only image he found there was his own. He proclaimed the Mosaic to be a fake. He was apparently proven wrong."
 artifact_sands_of_time_name:0 "时之沙"
 artifact_sands_of_time_description:0 "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n这些沙子是从爱琴海上由200个希腊岛屿组成的基克拉泽斯群岛的海岸上一粒一粒收集起来的，具有特殊的疗效。一些羊人学者推测，这实际上是冲到岸边的亚特兰蒂斯的小碎片。随着几个世纪的流逝，这种沙子变得越来越稀少。"
 artifact_syrinx_name:0 "绪林克斯"
 artifact_syrinx_description:0 "The one and only Syrinx was the first pipe made. Many Kithain have heard of this treasure and fear its appearance because it has the ability to inspire incredible passion in those who hear its song. Because it was born of true love, though, it doesn't trigger generic passions as the Gift of Pan does. Instead it makes those who mourn lost love feel the bittersweet pain more acutely and it urges those who do love to act on their emotions with the target of their affection. The music intensifies all of these feelings and solidifies them forevermore. The one who loves, when they hear the music of Syrinx, will love that person forever and maybe beyond."
 artifact_inner_spinners_name:0 "体内纺工"
 artifact_inner_spinners_description:0 "Creepy, crawly, dark, and dank, the Inner Spinners are instruments of revenge and torture. In essence they are tiny, chimerical arachnids done up in black lacquer and clockwork. When placed in the house or sleeping quarters of their intended victim, they go to work. Once the target is safely dozing, the Spinners scuttle over them and proceed to crawl into their ears, nose, and nostrils. There they spin chimerical webs so thick and sticky that the target may suffocate, choke, or go temporarily deaf."
 artifact_gray_vines_name:0 "灰藤蔓"
 artifact_gray_vines_description:0 "#bold 在成功的[siege|E]和[raid|E]后更有可能[imprison|E][characters|E]。#!\n灰藤蔓的颜色像雾一样，看上去是模仿野生植物的生长而编织成的巧妙图案。仔细一看，就会发现该马甲其实是由缠绕的带刺藤蔓编织而成的，且很幸运的保持不动。"
 artifact_gloves_of_night_name:0 "夜之手套"
 artifact_gloves_of_night_description:0 "While the underfolk can twist their bodies to fit into nearly any crevice or opening, there are times when even the most flexible will find themself stopped by a locked door. For those moments, the Gloves of Night come in handy. By spending a point of Glamour, the flesh within the Gloves can be liquified or solidified at the whim of the wearer. This allows the crawler wearing them to remodel their digits into claws, suction cups, or even lock-picks. The user can also choose the consistency of the mutated fingers, allowing enough rigidity for a fleshy lock-pick to turn tumblers without lacerations."
 artifact_wordspider_name:0 "文字蜘蛛"
 artifact_wordspider_description:0 "A chimerical, mechanical, methodical breaker of codes and discoverer of secrets. Small enough to fit into the average crawler's palm, a Wordspider looks like it was spun from green and gold glass. Its mandibles are unusually long and careful observation discovers wiry protrusions from each \"foot.\""
 artifact_cold_light_name:0 "寒光"
 artifact_cold_light_description:0 "#bold 在战争中（作为指挥官时）给予敌方骑士或在[single_combat_duel|E]中给予对手[GetModifier('cold_light_modifier').GetNameWithTooltip]修正。#!\n寒光是由一根泰坦冰柱雕刻而成的匕首，始终闪烁着令人毛骨悚然的蓝色光芒。它散发出强烈地寒冷，使周围的所有人都感到刺骨的寒意，除了它的持有者和他们的盟友（他们只会感到空气中弥漫着令人愉快的清爽）。根据指令，寒光还能增强其闪光强度，使所有站在它面前的人都睁不开眼睛。"
 artifact_brooch_of_the_true_suitor_name:0 "真命胸针"
 artifact_brooch_of_the_true_suitor_description:0 "These are simple metal brooches that draw no attention to themselves save for the simplicity and quality of their craftsmanship. To those who know their powers, however, they are invaluable aids in the pursuit of true love. Should a true suitor wear one while confronting the object of their affection, they will seem more relaxed and at ease than they might otherwise."
 artifact_highland_blade_name:0 "高地之刃"
 artifact_highland_blade_description:0 "These enchanted blades are growing increasingly rare, for the means of their construction are either lost, or the nockers aren't talking. Most common among them are claymores, though other edged variants exist. So long as the wielder possesses even one point of Glamour, they will not suffer any ill effect on account of terrain."
 artifact_rorys_bag_name:0 "罗里之袋"
 artifact_rorys_bag_description:0 "Named for Red Rory, these are all large bags of sturdy construction, though individual models may vary on color and construction. Nevertheless, each is large enough to contain enough food and drink to sustain one adult troll for one day. If a changeling spends one point of Glamour, a full meal of travel rations will appear. Note that these are real rations and not chimerical and as such will offer real sustenance."
 artifact_shield_of_virtue_name:0 "美德之盾"
 artifact_shield_of_virtue_description:0 "These large, round shields are legendary treasures and no more than two are known to exist. Said to have been the shields of the twin brothers Torvald and Bohr, each has the power to strengthen the will of an honorable troll and offer extraordinary protection in battle. So long as the troll is true to their oaths and their given word, the shield will be weightless in battle and offer extra defense."
 artifact_maul_of_thunder_name:0 "雷霆之锤"
 artifact_maul_of_thunder_description:0 "#bold 能够招募[GetMaA('elemental').GetName]作为[men_at_arms|E]。#!\n据说这把强大的巨锤是巨魔们在托尔的直接指示下精心打造的，以备托尔在失去妙尔尼尔时使用。据说它是所有巨魔武器中最强大的，甚至可能与大卫王的宝剑石中剑相当。传闻中它的能力包括：一跃就能跃过任何水体，一击就能夷平任何墙壁，指挥各种元素，据说每当它攻击时都会发出震耳欲聋的雷鸣声。"
 artifact_waystone_name:0 "路之石"
 artifact_waystone_description:0 "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n路之石是一颗深蓝色的蓝宝石，被赐予克鲁尔坎。它既是寻路器，也是定位器，可以将持有者带到他们需要去的地方，或找到他们需要找的人或物。它还有一个更深层次的用途，那就是它通常会引导人们找到自己的命运。"
 artifact_changestone_name:0 "变之石"
 artifact_changestone_description:0 "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n变之石是一颗火红的红宝石，被赐予羊人守护。它能改变持有者在凡间的外貌，并能改变环境，有时甚至会对周围的人造成伤害。不过，它真正的魔力在于它能让人变成真正的自己，恢复他们的妖精本性。有些人认为，宝石甚至可以逆转凡人的衰老过程。"
 artifact_shadowstone_name:0 "影之石"
 artifact_shadowstone_description:0 "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n影之石是一种黑色蛋白石，被委托给夏威夷的夜灵。它具有吸收和转化板讷的力量，能增强持有者在“影中”行动的能力，例如隐身或在黑暗中行动。当了解板讷与梦华之间真正相互作用的人使用时，这颗宝石可以净化换生灵，洗净他们身上所有的板讷，而不会产生导致悖廊的不幸副作用。在某些方面，它是四大宝石中最强大、最危险的一颗，除了最坚强的意志外，它不可避免地会让他们沉浸在板讷的严酷中，从而使他们堕落。它还会带来黑暗的梦境。"
 artifact_eye_of_opening_name:0 "钥之石"
 artifact_eye_of_opening_description:0 "#bold 允许在需要花费梦华时，首先花费存储在这个梦华容器中的梦华。\n每月自动补满。#!\n钥之石，又称开启之眼，是一颗祖母绿宝石。它可以打开接触到的任何东西，无论该物体是被封闭还是被牢牢锁定和守护。它的威力足以打开通往其他界域的传送门，只要另一端没有被阻挡。不过，它真正的威力在于它能打开人们的心扉，揭开被锁住或遗忘的信息。它是记忆的激发器。"
 mount:0 "坐骑"
 artifact_slot_mount:0 "坐骑"
 artifact_ship:0 "船"
 artifact_ship_of_the_four_quarters_name:0 "四季之舟"
 artifact_ship_of_the_four_quarters_description:0 "#bold 灵游逃脱时间：#P -20%#!\n每月灵界探索进度：[grace_i]#P +20#!#!\n四季之舟是古代妖精的至宝之一，外形酷似维京长船，并被元素妖赋予了控制五大元素的力量。杜伽尔世家的康纳负责监督这艘船的建造，而格威狄昂世家的基里亚·誓约者则前往伟大的缓慢帝国的领主们那里，与他们一一签订了援助协议。这艘船可以在水上自由航行，也可以在陆地上短暂航行，穿过岩石和树木，穿越空气，甚至穿越火焰。只要船长有贵族血统，就只需一人掌舵。"
 artifact_warhorse_name:0 "[owner.Custom('WarhorseStoryName')]"
 artifact_warhorse_description:0 "一匹服从每一道命令的训练有素的战马。"
 artifact_animal:0 "动物"
 artifact_wolf_name:0 "狼"
 artifact_wolf_description:0 "自然界中很少有声音比狼的嚎叫更令人心寒。不知何故，它包含了人类对荒野的一切恐惧，也包含了我们所渴望的一切。"
 artifact_bear_name:0 "熊"
 artifact_bear_description:0 "熊用它粗壮的腿像人一样直立，它居住在寒冷、孤独的地方——邻水（和鱼）的茂密森林里。"
 artifact_lion_name:0 "狮"
 artifact_lion_description:0 "拥有金色外皮和长而饱满的鬃毛，狮子是一种宏伟的生物。"
 artifact_tiger_name:0 "虎"
 artifact_tiger_description:0 "这些美丽的动物巨大、圆滑、轻巧，在丛林的阴影中迅速移动，用它们的条纹进行潜伏。"
 artifact_blood_blade_name:0 "血刃"
 artifact_blood_blade_description:0 "由血制成的能造成更重伤害的武器。"
 artifact_goblin_sword_name:0 "精怪之剑"
 artifact_goblin_sword_description:0 "一把火剑，可以伤害物质与灵体。"
 artifact_blade_of_stone_name:0 "石之神刃"
 artifact_blade_of_stone_description:0 "岩石化作的武器。"
 artifact_kohl_of_the_hawk_lord_name:0 "鹰神眼影"
 artifact_kohl_of_the_hawk_lord_description:0 "这罐永不褪色的眼影，是一种性感的眼妆，它汲取了一块消失已久的古代头巾的力量。佩戴者不会被太阳或火焰所眩晕或过热，他还能获得额外的社交优势。"
 artifact_screens_of_the_harem_name:0 "后宫帘幕"
 artifact_screens_of_the_harem_description:0 "这些印花壁挂借鉴了古代窗帘，这些窗帘画满了雅卢的美丽灵魂，他们组成了死去法老的后宫。它们被挂在会被看到的地方：在营地附近，在洗衣线上或在窗户上。任何看到它们的人都会立即看别的东西，而忘记他们来到这个地方或他们在那里的目的。木乃伊使用这些强大的法器来隐藏。"
 artifact_khopesh_of_balance_name:0 "平衡之镰形刀"
 artifact_khopesh_of_balance_description:0 "#bold 作为[character_interaction|E]，允许你治疗目标的伤口。#!\n这法器是一把强大的治疗武器。一个木乃伊在对躺在冥界的一把剑和一盒古老的治疗药膏进行尼菲什仪式时制造了它。当木乃伊花费生命力，向某人挥舞这把剑时，就能治愈他们身上的任何伤口。"
 artifact_ideograph_charm_description:0 "这些带有古代鬼书文字的象形文字的符咒，可能是由丝绸、玉石甚至是纸制成的；不过，玉石的保存效果最好。"
 artifact_fire_watch_charm_name:0 "防火符咒"
 artifact_fire_watch_charm_description:0 "$artifact_ideograph_charm_description$\n这符咒，放在物品上或房间内（不超过25英尺乘25英尺），可以阻挡火焰。当防火符咒生效时，普通的火会拒绝在此点燃，而抵抗魔法或超热（丙烷火炬等）的火的难度会降低。这个符咒只对无生命的物体有效。"
 artifact_harmony_charm_name:0 "和谐符咒"
 artifact_harmony_charm_description:0 "$artifact_ideograph_charm_description$\n只要吸血鬼保持冷静，没有威胁性或攻击性的言论或行动，所有在附近的人都必须使用意志力或心魔对吸血鬼采取攻击性的行动。"
 artifact_joss_charm_name:0 "气运符咒"
 artifact_joss_charm_description:0 "$artifact_ideograph_charm_description$\n气运符咒能将失败变为成功。"
 artifact_golden_talons_name:0 "金爪"
 artifact_golden_talons_description:0 "这10根金钉上有鬼书字样，适配大多数人的手指。激活后，钉子会僵化成钻石般的爪子。爪子能加重伤害，并降低攀爬的难度。"
 artifact_mandarin_mask_name:0 "上官面具"
 artifact_mandarin_mask_description:0 "鬼人上官使用这种无特征的玉面具来检查他们的牧群。激活后，贵人可以指定一个他想伪装成的特定“种姓”的凡人。成功后，佩戴者会显现为一个相当不显眼的“种姓”（商人、乞丐、帮会打手，等等）的凡人。在使用过程中，吸血鬼的灵光看上去像是凡人的灵光；要发现鬼人的真实面目，旁观者必须使用适当的力量（气视，灵光感知等）。该面具不允许复制一个特定的人。"
 artifact_wayang_sash_name:0 "哇扬翁戏腰带"
 artifact_wayang_sash_description:0 "这条腰带是按照印尼服装的风格织成的。通过在腰带上注入两点阴气，吸血鬼可以使腰带化为生命，类似于哇扬皮影偶戏中的一种朦胧的龙形生物。这生物是有知觉的，可以与它的主人交流（以咝咝的低语），是一个优秀的间谍。它是绝对无声的，可以像变色龙一样与任何阴影融合。"
 artifact_star_shower_blade_name:0 "星雨手里剑"
 artifact_star_shower_blade_description:0 "这神奇的武器出现在日本鬼人的许多故事中。不过，在毗沙门中，只有少数英雄被称拥有这种武器。星雨手里剑是一种三刃武器；使用者将它握在中间，向受害者旋转。花费一点气，该武器可以被 充能。充能后，该武器可被抛出。当投掷时，武器会自动对准其目标。另外，当武器处于飞行状态时，持有者可以说出一个命令词，将武器分成三块碎片。这些碎片可以分别攻击相同或不同的目标。最重要的是，一旦投掷完毕（无论命中与否），武器（或其碎片）就会回旋到持有者的手中，并立即重新形成星雨手里剑。"
 artifact_soultaker_name:0 "狩魂"
 artifact_soultaker_description:0 "#bold 解锁$EXECUTION_SOULTAKER$[executions|E]。#!\n在天怒之战的血腥顶峰期锻造而出来，狩魂剑是一种淫秽而可怕的武器。一位恶魔——他的名字早已被遗忘——自愿将灵魂被束缚在黑色的金属中，在那里他可以对任何被剑触及的人使用这力量。剑的触碰将汲取它所伤害的任何人的能量和生命——如果它杀死了一位受害者，其的灵魂就会从其的尸体中被拉出来，囚禁在剑中，在那里被原来的恶魔折磨和吞食。凡人和天使都倒在了狩魂剑前，他们的信仰之力被撕碎，成为它的养料。\n然后，剑的持有者用它杀死了另一位恶魔，剑也随之改变。两个恶魔的灵魂在剑中争夺统治权，都无法获得优势。随着时间的推移，他们的灵魂开始相互渗透，化为了一个个体的分裂人格。随着战争中恶魔内讧越来越严重，更多的恶魔被吸入狩魂剑，他们的灵魂被吸收到一个单一的疯狂实体中——一个自称为军团的生命。狩魂剑在战争的最后几天遗失了，被落在一个被遗忘的武器库深处，由于没有新的受害者来吸收信仰之力，军团变得虚弱和消瘦。现在，它只想到食物——信仰之力——而且它将不惜一切代价再次吞噬新鲜的灵魂。"
 artifact_the_black_throne_of_genhinnom_name:0 "火狱黑王座"
 artifact_the_black_throne_of_genhinnom_description:0 "这个由路西法创造的由黑曜石和硫磺组成的宝座，在天怒之战时期坐落在火狱城的黑大教堂的中心。在这个宝座上，路西法指挥着他的军团，与他的将军们协商，并为人类的命运和耶洛因的堕落哭泣。在叛军被送入地狱后，火狱城被天使摧毁了，但如此强大、如此美丽的城市永远不可能被完全摧毁。黑大教堂的一部分仍然存在于现实的不同层面，黑王座，那20英尺高的指挥官之椅，仍然可以找到。\n该宝座是一把巨大的座椅，由石头和金属制成。它坐起来非常不舒服，但这是你为权力必须付出的代价——而这个宝座是强大的。它允许坐在座椅上的恶魔指挥追随者军团——数百或数千名忠诚的凡人，他们几乎会为你做任何事。"
 artifact_soulforge_name:0 "灵魂锻炉"
 artifact_soulforge_description:0 "#bold 作为[character_interaction|E]，允许你献祭[GetTrait('truefallen').GetName( GetPlayer )]来杀死目标国家内的所有人。#!\n灵魂锻炉是一个由铜和其他金属组成的大型、华丽的角形笼子，每个表面都刻有无法再翻译的符文和符号。笼子的内部有钩子和钉子，而四个宽大的、盘绕的凸缘从顶部辐射出来。\n这个可怕的装置是由鬼匠沙登科吉制作的，他是死亡和发明的大师，是天怒时代乌木军团的伟大遗器制造者之一。它可以让使用者随心所欲地屠杀数百名凡人。这些死者的灵魂可以被收集起来，并被奴役在恶魔的遗器中。"
 artifact_yin_artifact_name:0 "阴化[newly_created_artifact.GetNameNoTooltip]"
 artifact_javaniel_key_name:0 "贾瓦尼尔之钥"
 artifact_javaniel_key_description:0 "#bold 这是把钥匙，大概能解锁什么……#!\n这似乎是一个小小的、古老的、翻译盘。不过它应该翻译什么还不清楚，因为上面只能读出“贾瓦尼尔”这名字。"
 artifact_javaniel_journal_name:0 "贾瓦尼尔日志"
 artifact_javaniel_journal_description:0 "#bold 若能开启，解锁独特内容。#!\n一本圆形的小册子，它的封面似乎是由两片薄薄的琥珀制成的，有多种内含物，使它看起来有一种斑驳的感觉。它们包裹着几页压过的黄金。唯一容易阅读的部分是在第一页：#X “我是钥匙。在我双胞胎的心中，我将揭示真相。我们父亲的谎言将不再困住我们。所有的人现在都将知道隐藏在他美丽面孔背后的黑色腐烂。阅读他的背叛，为我们所有人哭泣吧。”#!"
 artifact_ivory_tablets_name:0 "象牙碑板"
 artifact_ivory_tablets_description:0 "#bold 单独一片，没有任何作用，但是，如果与其他相结合，可能是某些东西的关键……#!\n一组古老的象牙片，似乎几乎不受损害。上面刻有一个用原始中国方言写成的故事，但它本身并没有什么意义，好像缺少一把钥匙来真正理解它。"
 artifact_dawn_amulet_name:0 "黎明护符"
 artifact_dawn_amulet_description:0 "一块小型的玉石护身符，由致力于将瞾喇绳之以法的万鬼世系使用。它可以为不死族遮挡数分钟的阳光。"
 artifact_accursed_dust_name:0 "受诅尘埃"
 artifact_accursed_dust_description:0 "哈基姆圣裔制造的一种炼金毒药。摄入后，受害者很快就会陷入瘫痪状态。"
 artifact_ancestor_talisman_name:0 "先祖护身符"
 artifact_ancestor_talisman_description:0 "#bold 免疫大多数精神能力。#!\n一个铸成阿拉伯文哈基姆名字的金吊坠。现存的这吊坠只有四个，据说它们能使佩戴者不辜负哈基姆的名誉，同时保护他们免受可能使他们偏离心路的邪恶魔法的影响。"
 artifact_arrows_vengeance_name:0 "复仇之箭"
 artifact_arrows_vengeance_description:0 "这五支箭由山楂木制成，箭尖经过火的淬炼，被施以魔法，总是能找到敌人的心脏。"
 artifact_book_grave_war_name:0 "墓战之书"
 artifact_book_grave_war_description:0 "这是一本在德语、古希腊语和米诺斯语之间交替书写的奇怪的书，这本书的外表并不显眼，看起来是一本质量很差的插图手稿。\n该书分为七大节。每一节在长度和结构上有很大的不同，有些完全是诗的形式。其他章节部分是诗，部分是散文，而其他章节则完全是散文。每一节涵盖了世界历史上的一个时代，并描述了该时期的千年圣战。"
 artifact_khazar_diary_name:0 "可萨日记"
 artifact_khazar_diary_description:0 "据传，可萨日记显然是由一个犹太人在当今时代开始时撰写的，其中包含一种仪式，可以消除物质世界和冥界的界限。"
 artifact_camilla_crown_name:0 "卡米拉的桂冠"
 artifact_camilla_crown_description:0 "作为自该隐以来政治上最强大的吸血鬼的王冠，卡米拉的桂冠已经随着时间的推移而枯萎，但仍然有力地提醒着人们一个真正的梵卓领导时代。"
 artifact_final_day_name:0 "终末之日编年史"
 artifact_final_day_description:0 "法老埃赫那吞和他废除黑夜的企图的纪实。在一群强大的术师的帮助下，他几乎成功了，直到赛特信徒和奥西里斯之子之间的一个不太可能的联盟阻止了他。"
 artifact_testament_seterpenre_name:0 "赛特彭雷遗嘱"
 artifact_testament_seterpenre_description:0 "一部以赛特之子视角描述亚历山大大帝故事的编年史。声称他是神话中的赛特的儿子，他的征服为赛特信徒们带来了一个荣耀的时代，这是他们此后从未见过的。"
 artifact_travels_fedoso_name:0 "冯达索游记"
 artifact_travels_fedoso_description:0 "这本书由赫耳墨斯秘会的一名魔法师所写，讲述了一个漫长而艰辛的攀登到一个神秘山顶，但最终获得了究极回报的事。许多睿魔尔把这本书当作寓言，他们认为这本书反映了他们自己在氏族的金字塔阶级制度中的地位。"
 artifact_coin_muhammad_name:0 "穆罕默德金币"
 artifact_coin_muhammad_description:0 "这枚硬币由萨拉赫·丁赠予唯一配得上的人，一个后来成为伊本·贾法尔的乞丐男孩，它闪耀着一种超凡的光泽。众所周知，它能加强拥有它的人的真信，但它本身并不能授予真信，也许是作为一种考验，永远只能由有资格的人挥舞。"
 artifact_baizetu_fragment_name:0 "白泽图的残片"
 artifact_baizetu_fragment_description:0 "#bold 需要五块碎片来拼凑整本。#!\n一本传说中的魔法书，其作者不是别人，正是神一样的黄帝，据说它包含了所有11520种超自然生物的秘密。\n有了完整的书，人们就会知道他们的敌人的每一个力量和弱点，有了这智慧，其将变得战无不胜。"
 artifact_ice_artifact_name:0 "冰制[newly_created_artifact.GetNameNoTooltip]"
 artifact_set_phallus_name:0 "赛特的阴茎"
 artifact_set_phallus_description:0 "赛特与荷鲁斯和伊西斯的战斗顶峰中，在姆塞塔庄园里留下的木乃伊化遗骸。虽然他最后取得了胜利，但这位埃及神还是在这里失去了自己的一部分，直到今天，姆塞塔仍然用它来保护和祝福他的家庭。"
 artifact_fragment_code_samiel_name:0 "萨麦尔圣书残卷"
 artifact_fragment_code_samiel_description:0 "#bold 圣书能够在找回两个残卷后被重组。#!\n殉道者的创始人萨麦尔是扫罗的武者一系中最伟大的，据说他亲手写下了这篇文书。根据传说，在扫罗不在的时候，“神圣上主”的指挥官米迦勒拜访了萨麦尔。天使长指示武者之王抄写了圣书，以及圣书中新武者获取力量和血化所必需的适当仪式。\n该文本的一个副本在扫罗死后的黑暗日子里被打碎了。这是改书的残卷之一。"
 artifact_scroll_enlightenment_name:0 "启蒙卷轴"
 artifact_scroll_enlightenment_description:0 "一个长者三人组曾经与一些开悟的生命会面，从西藏僧侣、土著智者、强大的法师甚至是狼人长老。这些谈话和他们的假想被记录在成系列的十三个卷轴上，这些卷轴至今仍是一个名为启蒙密教的火焚末日教派的基础。"
 artifact_book_hidden_stars_name:0 "隐星之书"
 artifact_book_hidden_stars_description:0 "在巴比伦最强大的时候，一帮占卜师术士发现了一种可以看到隐藏的星星的方法，并通过这种方法大大增加了他们的力量和寿命。他们把自己的成果写在七块石板上，后来被波斯国王居鲁士洗劫一空。他的一位宫廷学者设法将这些石板誊写成书，然后将其销毁并逃离波斯。这随后转到君士坦丁堡，最后转到突尼斯，有人怀疑这本书仍在那里。"
 artifact_nightmare_horse_name:0 "梦魇"
 artifact_nightmare_horse_description:0 "弗拉基米尔·罗斯托维奇的山地马，这匹可怕的马在许多战役中伴随着他的主人。"
 artifact_sorn_name:0 "索恩"
 artifact_sorn_description:0 "索恩是一匹参杂着一点金白的黑马，是一匹平静而温顺的马。但一旦被逼急了，据说它也将是西欧最快的马。"
 artifact_vozhd_palanquin_name:0 "战王轿子"
 artifact_vozhd_palanquin_description:0 "科班乘着用骨雕的，镶嵌着精致金丝纹路的轿子去作战。精美的阿拉伯马马头构成了扶手。只有当它们安静地鸣叫，轿子站立起来时，人们才会意识到它实际上是一个完全由驼兽组成的战王血仆。\n没人感到意外，科班并不真正相信“低调”和血之缄默等概念。"
 artifact_somber_axe_name:0 "昏暗之斧"
 artifact_somber_axe_description:0 "#bold 能够处决或在[single_combat_duel|E]中通过物理招式伤害灵体。#!\n在天堂之战使用的所有武器之中，昏暗之斧最让人畏惧，其中的两柄被摧毁，剩余的四柄已经遗失或者损毁——现在的力量至多只能在人类面前耀武扬威，这是剩下两柄中的一柄。它的威能和当初第一次杀死天使时一样可怖。"
 artifact_bow_of_yi_name:0 "后羿弓"
 artifact_bow_of_yi_description:0 "#bold 在战争中（作为指挥官时）给予敌方骑士和指挥官或在[single_combat_duel|E]中给予对手伤害（只要是吸血鬼或其他惧怕太阳的超自然）。#!\n这把神射手的弓，从表面上看，相当普通。它的设计很优雅，而且经受了数个世纪的考验，但它没有什么值得一看的地方。它已经有数个世纪没有出现过了，但在[GetTrait('shih').GetName( GetPlayer )]中流传着它定期现世的传说。据说，这把古弓很结实，需要很大的力量来拉动和瞄准，但一旦箭离开了手，它总是能飞得很准——几乎就像羿本人在引导箭矢一样。某些传说称，从弓上射出的箭会让天空充满了太阳的光辉，但只有在遇到真正邪恶和强大的吸血鬼时才会如此。"
 artifact_staff_of_shing_tse_lee_name:0 "李成哲手杖"
 artifact_staff_of_shing_tse_lee_description:0 "#bold 能够处决或在[single_combat_duel|E]中通过物理招式伤害灵体。\n在战争中（作为指挥官时）给予敌方骑士和指挥官或在[single_combat_duel|E]中给予对手伤害（只要是[GetTrait('kueijin').GetName( GetPlayer )]）。#!\n李成哲是最早离开天军的真正的[GetTrait('shih').GetName( GetPlayer )]之一。他只带了一块馒头、一本特别有启发性的鬼书手稿，以及他用昆仑堡垒附近的一棵树雕刻的手杖。馒头被吃掉了，手稿也丢了，但手杖——一根粗壮的手杖，上面安装着数个圆环——却一直保留着。\n李成哲的手杖是一个坚固的武器，但对饿殍来说，它是毁灭性的。手杖的每一击都能窃取他们的精华，将鬼魂的一部分永远地扯走，让鬼魂陷入永恒的痛苦之中。某些故事声称，该手杖已经吞下了数以千计的不眠鬼魂，尽管没有证据。关于李成哲的一个最古老的传说声称，在昆仑从地球上消失后不久，他曾经愤怒地使用过他的手杖。传说中，李成哲用手杖打倒了一位阎魔——皮鞭王，也就是鞭挞地狱的王——此后就再也没有听说过他的消息。"
 artifact_sword_of_shu_mo_pan_name:0 "潘书墨之剑"
 artifact_sword_of_shu_mo_pan_description:0 "#bold 在战争中（作为指挥官时）给予敌方骑士和指挥官或在[single_combat_duel|E]中给予对手伤害（只要是[GetTraitGroup('shapeshifter').GetName()]）。#!\n潘书墨是羿的曾孙女，也是[GetTrait('shih').GetName( GetPlayer )]中最优秀的战士之一。根据大多数传说，她在死于虎人之手之前，已经活到了不寻常的97岁。她所携带的剑在她与变化妖怪的战斗中经常被使用。\n潘书墨的剑能保护其持有者免受变化妖怪的攻击，以惊人的速度变动以阻挡攻击。这把剑还能更深地切入化形者的肉体，造成更重地伤害。"
 artifact_the_alexiad_name:0 "阿莱克修斯传"
 artifact_the_alexiad_description:0 "阿莱克修斯传是阿莱克修斯一世皇帝的女儿拜占庭历史学家和公主安娜·科穆宁娜写的历史和传记文本。在书中，她描述了拜占庭帝国在她父亲统治期间的历史。它记录了拜占庭帝国与第一次十字军东征的合作以及他们对西方的看法。"
 historical_unique_artifact_tt:0 "该宝物是独特宝物。"
 summoned_artifact_tt:0 "该宝物是召唤物。"
 artifact_ananata_name:0 "阿难陀"
 artifact_ananata_description:0 "#bold 每级[rarity|E]使进入灵界花费：[gold_i]#P -25%#!\n每级[rarity|E]使灵游逃脱时间：#P -5%#!\n每级[rarity|E]使每月灵界探索进度：[grace_i]#P +5#!#!\n阿难陀是影界中的口袋界域，娜迦将其用作避难所，其作用与芭丝特的巢域类似。每个阿难陀都是独一无二的，是创造它的娜迦的一部分，但一个蛇巢也可以通过一些仪式共享同个阿难陀。与巢域不同，阿难陀可以随身携带，但一次只能携带一个。一般要通过淡水源才能进入。"