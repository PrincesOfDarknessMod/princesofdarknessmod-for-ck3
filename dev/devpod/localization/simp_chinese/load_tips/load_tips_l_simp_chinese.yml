l_simp_chinese:
 LOADING_TIP_0:1 "#bold “罗马学者塞内卡错了。不公正的统治是可以永恒的。” #!——哈德施塔特"
 LOADING_TIP_1:1 "#bold 抱歉。该隐是吸榨不了的。#!"
 LOADING_TIP_2:1 "#bold 长者吸血鬼能活这么久是有原因的。他们不会落入准备不足的阴谋中。#!"
 LOADING_TIP_3:1 "#bold 注意潜藏。你不会想激怒教会的。#!"
 LOADING_TIP_4:1 "#bold 这是黑暗世界。你没有朋友，只有棋子。#!"
 LOADING_TIP_5:1 "#bold 你的领地非常有限，附庸是必要的。但不要相信他们。#!"
 LOADING_TIP_6:1 "#bold 为了安全起见，预想每个人都在策划你的死亡。反正他们大概真这样。#!"
 LOADING_TIP_7:1 "#bold “总有一位尊长来领导我们，在他之上还将有尊长，直到该隐。除了主人为你选好的之外，没有‘宿命’可供你们选择。”#!——蒙塔诺"
 LOADING_TIP_8:1 "#bold “没有我，就没有魔宴。没有魔宴，也就没有秘盟。该隐社会的整个面貌就是因为我而变得如此。”#!——葛莱西安诺，妄想道。"
 LOADING_TIP_9:0 "#bold “一个小麻烦就像一粒沙子，而我每夜都承接着一片沙漠。”#!——拉克鲁瓦"
 LOADING_TIP_10:0 "#bold “我曾经是世界之女王，我向你保证我将再次成为女王。我准许你可以去死了。”#!——佩塔尼夸"
 LOADING_TIP_11:0 "#bold “我们不是神，不管我们怎么骗自己。神性不存在。宇宙之心是空的。你愿意和我一起穿过它吗？”#!——齐茉媞里"
 LOADING_TIP_12:0 "#bold “灵魂不过是另一种粘土，可以用你的手指间扭捏。”#!——萨沙·维科斯"
 LOADING_TIP_13:0 "#bold “终与始能够混合与扭曲，直到难以将以分开。”#!——阿纳托尔"
 LOADING_TIP_14:0 "#bold “你可是位吸血鬼大恶人。嘿，太好了，祝贺。把它留给你自己吧。”#!——微笑杰克"
 LOADING_TIP_15:0 "#bold “如果你别无选择，只能去毁灭一位诺斯费拉图，那么在任何情况下都不要在他的家乡与他对抗。\n我们将永远找不到你的灰烬。”#!——阿什拉夫"
 LOADING_TIP_16:0 "#bold “你要明白，我们并没有输给梵卓。我们输给了梵卓和他们所有的盟友、仆人、朋友、以及每只曾本不该与其不死领主进行眼神交流的狗娘养的贱民。现在，你知道梵卓的真正实力的所在了。”#!——莉迪亚·多恩"
 LOADING_TIP_17:0 "#bold “永远，永远，永远都不要低估勒森魃。他们是不道德软弱的梵卓。他们是不矫揉造作的睿魔尔。他们是不装腔作势的赛特之子……且他们也都不是这些。”#!——法蒂玛·法卡迪"
 LOADING_TIP_18:0 "#bold “在千年圣战中没有所谓的保持独立。只有对自己主人的认知缺乏。”#!——乌尔·舒尔吉"
 LOADING_TIP_19:0 "#bold “千万不要在赛特之子的战场与他们作战，即社会和政治的战场。直到它插入你的喉咙，你都不会注意到他们的獠牙。”#!——苏凯纳"
 LOADING_TIP_20:0 "#bold “孩子，我很高兴我没有被初拥到睿魔尔氏族。那简直就是场官僚主义噩梦。无意冒犯。只是，花了几十年等待才轮到做无名之辈的（二等）助理，对我没有吸引力。”#!——费尔顿"
 LOADING_TIP_21:0 "#bold “这三件事是一位想蓬勃发展的亲王永远不该做的。激怒布鲁赫。羞辱梵卓。无视诺斯费拉图。”#!——佚名"
 LOADING_TIP_22:0 "#bold “不要与心兽赌博，因为最后总是它赢。”#!——佚名"
 LOADING_TIP_23:0 "#bold “有些人公开害怕上古耆宿，暗地害怕凡人。还有人公开害怕凡人，暗地害怕上古耆宿。这两种恐惧都是夸大其词。火焚末日是可以活过去的。我们可以永远掌权。”#!——密特拉"
 LOADING_TIP_24:0 "#bold “我不是奴隶。我不是奴隶。我不是奴隶。\n这是他告诉我，让我告诉我自己的话。”#!——兰巴赫"
 LOADING_TIP_25:1 "#bold “总会有另一个火焚末日的，贝克特。那只是思维的产物。你应该离开该循环；它是永恒的轮回。”#!——德古拉"
 LOADING_TIP_26:1 "#bold “我盲目地选择走我的尊长在我前铺设的道路。数个世纪以来，我从未怀疑过它，直到我意识到这嘲弄给我的灵魂带来如此的空洞，它对取悦我、真正了解我自己的作用是多么的小。\n那夜，我发誓不再受苦。”#!——提图斯·梵卓鲁·卡米拉"
 LOADING_TIP_27:0 "#bold “相信吧，睿魔尔，若你乐意的话，你和你的同类对血魔法的了解比在苏美尔崛起之前掌握它的人还要多。但我现在告诉你——你的氏族没对我的氏族做到任何我们不准的事。”#!——特琪洛士"
 LOADING_TIP_28:0 "#bold “总有一刻——梵卓——棋局会布局棋手。”#!——伊希姆·乌尔·巴尔"
 LOADING_TIP_29:0 "#bold “我前往我们先祖的土地，直面先驱。他是黑暗而可怕的——天堂的怒火和地狱的火焰。像最黑暗的夜晚一样漆黑而难以穿透。”#!——忒弥斯"
 LOADING_TIP_30:0 "#bold “这些星星也是骨头，且不是单纯的装饰品；它们是乌尔·舒尔吉的骨头，在午夜般的皮肤剥落或裂开脱落的地方可以看出；它们是先驱精华之鞘，而其中骨髓由复仇构成。”#!"
 LOADING_TIP_31:0 "#bold “我们在这为我们的生命而战，但梵卓和睿魔尔却仍然一有机会就给另一方下绊子，而妥芮朵最想做的就是批评溪水的颜色。”#!——狄奥·贝尔"
 LOADING_TIP_32:0 "#bold “世界正在变成糟糕无比，但这让我们有事要做”#!——狄奥·贝尔"
 LOADING_TIP_33:0 "#bold “古老的思想可以重新焕发活力。迦太基，这个理想，既古老又再次崭新。”#!——克里提亚斯"
 LOADING_TIP_34:0 "#bold “每当我从头骨上拽下一块颚骨并将其塞入眼眶时，我就知道我正在建设一个更好的未来。”#!——微笑杰克"
 LOADING_TIP_35:0 "#bold “要在黑暗中生存，只有一个办法：让它害怕你。”#!——微笑杰克"
 LOADING_TIP_36:0 "#bold “你没有找到革命，孩子。是革命找到了你。”#!——泰勒"
 LOADING_TIP_37:0 "#bold “所有死物都带有生命的回响。所有活物都能听到其死亡的呼唤。”#!——康斯坦西亚"
 LOADING_TIP_38:0 "#bold “我们可以尽情地恨天恨地，而我们没有除自己之外更合适的怨恨对象。所以我们每夜都要苏醒，因为我们不想他妈的比我们已经是的更恨自己。但我们甚至会在这方面失败。”#!——查斯·乔凡尼·特洛"
 LOADING_TIP_39:0 "#bold “纵观历史甚至更早，当黑夜中的神灵要求人类提供血和肉。这些是我们的尊长。是阿尔忒弥斯。是阿里曼。是卡加泰土丘的火山女神和阿兹特克的烟雾镜神——特斯卡特利波卡。黑暗如此厚重，以至于遮蔽了太阳。”#!——邓巴·马肯巴·阿杜拉"
 LOADING_TIP_40:0 "#bold “让他们惊讶地瞠目结舌吧，迈卡。让他们咒骂我放弃按他们的条件与火焚末日作战。让他们称我为叛徒，把我列入他们荒谬的红名单，诅咒我是个懦夫和自私的蠢货。我已经厌倦了玩这世界摆在我面前的棋局。”#!——露西塔·德·阿拉贡"
 LOADING_TIP_41:0 "#bold “吸血鬼是神格化的罪恶，是被亵渎和毁坏的美德的化身。通过这，你显示了你的价值。”#!——弗朗西斯科·多明戈·德·波兰"
 LOADING_TIP_42:0 "#bold “我们这些年轻者经常在清晨，在沉眠之前，谈论新机遇的可取性。葛莱西安诺的与众不同之处在于，他敢于就此采取行动。”#!——熊兄弟"
 LOADING_TIP_43:0 "#bold “我打算把棋子从棋盘上扫掉……不仅要从党派中解脱出来，还要摆脱永恒的战争。我被我的尊长和维科斯操纵了。他们的圣战永远不会是我的战争。我将以任何方式对抗呼唤。我将喝下我的浓血，保持自由，最终千年圣战将被我和像我一样的人打破。”#!——卢修斯·埃利乌斯·塞扬努斯"
 LOADING_TIP_44:0 "#bold “很遗憾，大部分棋子不得不从棋盘上被扫除。”#!——安布罗西奥·路易斯·蒙卡达"
 LOADING_TIP_45:0 "#bold “如果你愿意，此生可是光荣的乐趣。”#!——特洛伊的海伦"
 LOADING_TIP_46:0 "#bold “我们离开永恒之城是因为它的心脏早已停止跳动。它死了——而你们，一个曾经辉煌的城市的领主，躲在它的阴影里，迷失在你们自己建造的迷宫里。当我等回顾这个时代，回顾该时代的死亡，他们会看到你们的成就，并想知道哪里出了问题。但是，由于你们隐藏了自己，他们永远不会知道谁应该负责，应该对谁进行赞扬或谴责。你们的事迹，不论是伟大的还是卑劣的，都将被后人所遗忘，他们对你们的称呼将是无名之辈。”#!——米迦勒在离去前夕对罗马的该隐之子的最后一次演讲 "
 LOADING_TIP_47:0 "#bold “真理没有形状，没有象征。所有的眼睛都以不同的方式看它。所有的口舌都以不同的方式说它。没有什么——没有任何东西——能永恒不变。甚至我们也是如此。”#!——魔龙"
 LOADING_TIP_48:0 "#bold “这似乎是真的，他死不了。只要他还有一滴血存在，他就存在。只要世界还没化为灰烬，他就可以使自己再次变为完全体。”#!——魔龙说棘秘魑"
 LOADING_TIP_49:0 "#bold “我。蜕变。升华。我就是我。我是大地，被血唤醒。不再是幼虫。蛹的阶段结束了，对于我和他人而言。”#!——棘秘魑"
 LOADING_TIP_50:0 "#bold “他已经忘记了温柔……甚至我也说不清他是否理解，或记得，我们是多么的脆弱。”#!——达米克·卢希梵说棘秘魑"
 LOADING_TIP_51:0 "#bold “服从于我。你对上古耆宿并没有真正的爱，对吧？火焚末日即将到来，他们打算吞噬你、你的朋友和所有其他吸血鬼。我会阻止这一切！我将给你永恒！永生！我们将用另一场洪水迎接觉醒的祖尊，一场由他们自己的血液构成的大洪水！”#!——布克迪拉卡，向克里斯托夫·罗慕铎致意"
 LOADING_TIP_52:0 "#bold “我不会犯我的祖先所犯的错误。我不会选择恐惧或无知。我不会因为害怕自己，害怕我是谁和我是什么而畏缩。我不会恨自己，也不会拒绝自己。我是迈卡·维科斯，总有一夜，世界将了解我真正是什么。”#!——迈卡·维科斯"
 LOADING_TIP_53:0 "#bold “在王对王的棋局中，我们必须在绝对确信之祭坛上牺牲我们的同情心。要明智地统治，就必须彻底地统治。正义是没有怜悯的。”#!——小哈德施塔特"
 LOADING_TIP_54:0 "#bold “当头领的愚蠢之处在于，无论你做什么，在你的背后都有成百上千的人，确信他们自己的解决方案才是最合理的，而你的决定只是一个异想天开的随机掷得的副产品而已。”#!——拉克鲁瓦"
 LOADING_TIP_55:0 "#bold “我们的黑暗之父甚至现在还在外面的夜里徘徊，用他辛苦得来的智慧哭泣和忏悔。如果连强大的该隐都这样做了，我们怎么会骄傲地把脸转向月亮，说： ‘我的血管里流淌着力量，靠着它我宣称对人类和野兽的王权，靠着我自己的黑血我为自己的罪孽辩护？’”#!——阿纳托尔"
 LOADING_TIP_56:0 "#bold “你问我什么人更有可能成为恶魔的信徒和杀人犯。我向你保证；任何人都有可能成为崇魔者和杀人犯。”#!——哈罗德·泽特勒"
 LOADING_TIP_57:0 "#bold “我跳的是愚者之舞。祈求你发现我的疯狂。因为你若追袭根源。你便知道我没有幻想。并发现我对有真知之罪。”#!——末卡维"
 LOADING_TIP_58:0 "#bold “小祖母，让我亲亲你。”#!——瓦西里莎"
 LOADING_TIP_59:0 "#bold “带着吠陀经中的正义英雄那难以克制的怒火，查古拉普夏进入了圣殿。”#!——贝克特说查古拉普夏"
 LOADING_TIP_60:0 "#bold “秘盟的存在是为了保护其成员不受自己等人的伤害；这是它唯一有价值的目的。但是，它必有一天会破灭，当古老者来到火焚末日的餐桌前进食时。一张椅子将为我保留。”#!——齐茉媞里"
 LOADING_TIP_61:0 "#bold “与你的神明讲和，并说你的告别。钻石将淹没在血泊中，世界的其他地方紧随其后。”#!——桑德维尔"
 LOADING_TIP_62:0 "#bold “是蛇最先在园内，你得知道。”#!——赫沙·鲁哈泽"
 LOADING_TIP_63:0 "#bold “他是我们信仰的对象，是无数牺牲背后的意义——毕达哥拉斯派、清洁派、共济会、炼金术师——都在黑暗中挣扎，以便有一天，在几代人之后，有一人可以手握禁果，贤者之石，永生灵药。他的名字叫格拉崔克斯，我们的光明使者，我们的普罗米修斯，我们的路西法。”#!——艾斯林·斯特布里奇"
 LOADING_TIP_64:0 "#bold “你认为我寻求我们的流放——特别是你？就算一百声’异端‘指责和一千把棘秘魑剑，也比不得那可怕夜晚里秘会的蔑视之词……但若他们不愿意追随我们，那就让他们去死吧，就像那些被我从悬崖边上刨出石头骨架的龙。”#!——格拉崔克斯对梅琳达"
 LOADING_TIP_65:0 "#bold “我不是你用来压榨或碾压的蛇，我也不是真正的巫师，但我将及时向你展示我是什么。在你离开后很久，你宝贵的凡人魔法成为女佣闲谈的内容，我将采取真正可以采取的行动，知道真正可以知道的东西。”#!——贾维斯，关于伊崔乌斯"
 LOADING_TIP_66:0 "#bold “大多数都是龙、蛇、撒旦的子嗣，他们现在就在你们之间。基督的仆人们，我告诉你们，耶稣再临快来了，二次复临的日子快到了。龙的子嗣越长越大，越长越多，成为地上的伤口。 我们是这伤口的药膏，我们必须用火洁净它，净化它，然后大地将准备好迎接耶稣再临，我们将被判定为适格者。”#!——利奥波德·冯·穆尔瑙"
 LOADING_TIP_67:0 "#bold “我们知道是要为真理之重付出高昂的代价的。\n他们付的过多。”#!——末卡维说巴力"
 LOADING_TIP_68:0 "#bold “悲剧的是，我们本可以让他们去死。他们永远不会原谅我们救了他们。”#!——末卡维说布鲁赫"
 LOADING_TIP_69:0 "#bold “即使我可以告诉你我对他们的了解，你也不会相信我。”#!——诺斯费拉图说棘秘魑"
 LOADING_TIP_70:0 "#bold “裁判所宣判他们的受害者将永远被诅咒，但他们只处理杀戮。我们处理诅咒。”#!——罗塞里尼，罗马亡灵术师"
 LOADING_TIP_71:0 "#bold “我能想到他们认为我们花了大量的时间监视他们，并试图对他们搞破坏。好像他们有那么难搞清楚似的。”#!——诺斯费拉图说梵卓"
 LOADING_TIP_72:0 "#bold “没有什么值得讨论的。很快，其他人将只会在回忆谈及他们。然后我们也会杀了这些人，睿魔尔就永远不存在了。”#!——棘秘魑说睿魔尔"
 LOADING_TIP_73:0 "#bold “当他们的血因扫罗的死亡而愤怒地嚎叫时，我们的血却欢快地欢呼着。让我们一起乐起来。”#!——巴力说萨洛比"
 LOADING_TIP_74:0 "#bold “如果可以的话，试着找到其与妥芮朵的区别。只有一个：他们有一个计划，这使他们更像我们。不知道是否好坏。”#!——乔凡尼说赛特之子"
 LOADING_TIP_75:0 "#bold “没有地方和时间用于辩论。当你离场时，你放弃了你琐碎地追求。如果你坚持下去，继续前进，你将不会死于英雄之手。你会乞求。你会祈祷。你不会得到任何答复。”#!——未知拉米亚"
 LOADING_TIP_76:0 "#bold “禁果不会自己从树上掉下来，而这棵树早就应该被砍掉了。”#!——布鲁赫说赛特之子"
 LOADING_TIP_77:0 "#bold “吃我一靴。”#!——布鲁赫说梵卓"
 LOADING_TIP_78:0 "#bold “我让你先走一步。你是乌龟，而我是兔子——一只生气、厌世、有笔账要算、而且像魔鬼一样饥渴的兔子。”#!——佚名布鲁赫"
 LOADING_TIP_79:0 "#bold “把尾巴钉在——嗷，嗷，嗷，肏！”#!——末卡维说冈格罗"
 LOADING_TIP_80:0 "#bold “眼冒金星。别指我脸。指其他混账去。”#!——诺斯费拉图说布鲁赫"
 LOADING_TIP_81:0 "#bold “我看起来像这样，因为我必须这样。这些该死的家伙是自己选择的。这就是大自然所说的：‘离远点’。”#!——诺斯费拉图说棘秘魑"
 LOADING_TIP_82:0 "#bold “这些人的问题，把他们钉在棺材里焚烧掉就能解决了。”#!——雷伏诺说棘秘魑"
 LOADING_TIP_83:0 "#bold “你究竟为什么会认为我想让你停止尖叫？我发现当让你放纵你的恐惧时，产出的结果会更加悠扬。”#!——佚名棘秘魑"
 LOADING_TIP_84:1 "#bold “杀了他们。杀光他们。不要把时间浪费在他们没活得够久来理解的教训上。”#!——棘秘魑说睿魔尔"
 LOADING_TIP_85:0 "#bold “啊，新的参与者在千年战场中出现了。我们必须为他们安排适当地、慷慨地欢迎。”#!——赛特之子说睿魔尔"
 LOADING_TIP_86:0 "#bold “背信弃义的贱民。曾有一只勒森魃蛆虫试图将我卷入他肮脏的阴谋中。尽管他摆出一副高高在上的样子，但他的内脏看起来和其他吸血鬼没什么区别。”#!——冈格罗说勒森魃"
 LOADING_TIP_87:0 "#bold \"当一位末卡维说话的时候，聆听。当一位末卡维行动时，离开。当两位末卡维聚集在一起时，快跑。\"#!——冈格罗说末卡维"
 LOADING_TIP_88:0 "#bold “我只有一句话要说。赛特比末卡维更疯狂。我以我尊长的骨头起誓。”#!——末卡维说赛特之子"
 LOADING_TIP_89:0 "#bold “政治很简单。告诉你的下属该怎么做，把那些胆敢不服从的人钉死，然后继续做真正重要的事情。”#!——佚名棘秘魑"
 LOADING_TIP_90:0 "#bold “他们希望我们欣赏他们的艺术，却对我们的艺术望而却步！把他们当作宠物来养，直到他们的诗句开始令人厌烦；然后把他们扔到战王培养坑里。”#!——棘秘魑说妥芮朵"
 LOADING_TIP_91:0 "#bold “我们将把他们偷来的赠礼从剥过皮的内脏中撕出来，把他们串在被他们玷污的喀尔巴阡山上，用他们的胆汁体液喂养多瑙河，把剩下的留给秃鹰。然后我们将真正开始教他们痛苦是什么。”#!——棘秘魑说睿魔尔"
 LOADING_TIP_92:0 "#bold “他们有令人钦佩的记仇才能。”#!——梵卓说布鲁赫"
 LOADING_TIP_93:0 "#bold “如果它看起来像蛇，像蛇一样嘶叫，像蛇一样爬行，那么你就不要伸手去抚摸它的头。如果你在你的花园里发现一条蛇，你就杀了它。”#!——史卡沙·科伦布基里说赛特之子"
 LOADING_TIP_94:0 "#bold “妈耶，是呀，与权威作斗争。帮助人民！哦，等等，你只是要帮助他们中的一半？好吧，我想这也行。”#!——啮骨者说黑怒"
 LOADING_TIP_95:0 "#bold “他们确实让我感到寒心。你认为你正在编织一篇真正的悲剧故事，而他们只是回头看着你，好像在说：‘就这？’”#!——芬尼安说寂静漫游者"
 LOADING_TIP_96:0 "#bold “你的先祖几乎和我们一样强壮，而你也几乎和我们一样强壮。啥？这是一句赞美啊。”#!——芬里尔仔兽说芬尼安"
 LOADING_TIP_97:0 "#bold “令人印象深刻地聪慧。危险地被低估。相当有用。”#!——影爵说啮骨者"
 LOADING_TIP_98:0 "#bold “妥善应对他们，他们是任何战斗计划的重要组成部分。若在应对他们时犯错的话……实际上，我得说不要在应对他们时犯错。”#!——影爵说芬里尔仔兽"
 LOADING_TIP_99:1 "#bold “他们的忠诚是非常值得赞赏的，即使他们的礼仪是……变幻不定的。\"”#!——银牙说芬尼安"
 LOADING_TIP_100:0 "#bold “他们不明白，赢得战斗并不值得输掉战争。”#!——啮骨者说芬里尔仔兽"
 LOADING_TIP_101:0 "#bold “给予他们盖亚的尊重，但如果你和他们同舞，要小心不要感到友善。”#!——芬尼安说黑怒"
 LOADING_TIP_102:0 "#bold “你的指甲可真漂亮。坚硬如钢，且如此，如此锋利。它们可以撕裂肉体和骨骼。我只想……把它们咬下来。”#!——特洛伊的海伦"
 LOADING_TIP_103:0 "#bold “我的命运将不会由我的尊长之尊长或其他谁来决定。我不会再被控制。”#!——卢修斯·埃利乌斯·塞扬努斯"
 LOADING_TIP_104:0 "#bold “当她准备回归时，世界一分为二。一边是该隐之子，另一边是莉莉丝之子，这就是火焚末日。”#!——沙尔残篇"
 LOADING_TIP_105:0 "#bold “他要来了。黑牧人要来宰杀羊群。妒恨之子。毁灭先驱。如同死亡之主在凯马克利屠杀他的子嗣一样，黑牧人将在鹰巢屠杀哈基姆圣裔。”#!——佚名凡人预言者"
 LOADING_TIP_106:0 "#bold “一切旧事物都必须为新事物让路。第三变为第二，第二变为第一。父亲死了，儿子才能活。我们都是盘旋而下的圆环，在地狱中进行统治。”#!——阿卡恰"
 LOADING_TIP_107:0 "#bold “巨轮的转动是不可阻挡的。它不能被停止，但它的路线可以被改变，以推迟我们被磨成虚无，他们则崛起的最后时刻。现在是这样，以前也是这样。以前是这样，将来也是这样。该隐的子嗣们永远站在湮灭的顶角上。”#!——春军"
 LOADING_TIP_108:0 "#bold “我们老谋深算又知识渊博，但因我们的年龄和权力，我们把自己困在我们看不见的网中，用我们感觉不到的木偶线捆绑自己，更不用说切断了。”#!——春军"
 LOADING_TIP_109:0 "#bold “千百年来，死亡邪教如雨后春笋般出现，奉献于让世界末日到来，并将自己交给他们的救世主。世界末日了吗？没有。那些所谓的救世主除了是饥渴的混账外，还曾是其他什么吗？没有。除了睿魔尔。”#!——塔利"
 LOADING_TIP_110:0 "#bold “然后魔龙掠夺了库帕拉的衣钵。就像他被引导去做的那样。并把它当作自己的东西穿在身上。统治着河流之间的土地。和他所走过的每一个地方。正如他的意愿。”#!——古版书库帕拉"
 LOADING_TIP_111:0 "#bold “他们正在到来。他们是为我们所有人而来！”#!——安格斯的遗言，一位诺斯费拉图"
 LOADING_TIP_112:0 "#bold “有些书就不该被打开。”#!——阿纳托尔 "
 LOADING_TIP_113:0 "#bold “享受由专人送到你选择的地点的书籍。请放心，为了获得这些书，只需要死一位邓西恩就可以了。我杀了两位，以发出一个信息。”#!——塔利"
 LOADING_TIP_114:2 "#bold “睿魔尔不是起源于棘秘魑的一条血系吗？这听起来很重要。”#!——阿纳托尔 "
 LOADING_TIP_115:0 "#bold “泽特勒、瓦里克、韦格尔、利奥波德、鲁哈泽、贝克特。这只是那些最近最新地试图控制眼睛并开始屈服于其力量的人的名字。不要打开盒子。”#!——阿纳托尔"
 LOADING_TIP_116:0 "#bold “当哈济梅尔把他的额头对准我时，似乎打开了第三只眼睛，他的思想触及了我的思想。他能看到我人生中的一切，并微笑。我可以看到他的一切，并开始尖叫。”#!——贝克特"
 LOADING_TIP_117:0 "#bold “桌子说话了！它很不高兴。你在试着在一间空房子里当一张作祟的桌子。”#!——阿纳托尔"
 LOADING_TIP_118:0 "#bold “能进行真正的讽刺在哈德施塔特家族是一种罪行，可被处以终焉之死。”#!——卡莱布罗斯"
 LOADING_TIP_119:0 "#bold “在我内。总是在我内。我与最长者说话。或父亲对我说话。无论我怎么吞咽，祖父都不会倒下。”#!——兰巴赫"
 LOADING_TIP_120:0 "#bold \"表亲维奥丽卡代表达米克来访。想知道为什么我的通讯停止了。我向她展示。最长者饱了。我是个好小子。\"#!——兰巴赫"
 LOADING_TIP_121:0 "#bold “该行动……在多年前……是粗俗和短视的。”#!——萨沙·维科斯"
 LOADING_TIP_122:0 "#bold “湿婆夏克提，汝是神圣的父与母。赐予我信念，摧毁邪恶者，以及从邪恶发出的纪元之轮的枯萎。征服脚跟下的所有死亡和命运，让寂静成为永恒的法则。”#!——沃尔曼斯"
 LOADING_TIP_123:0 "#bold “我们看到的越多，我们就越认为我们知道的越多。我们认为我们了解的越多，我们就越是固步自封，就越是限制我们的潜力。因此，青春是点燃未来的火焰。力量不过是钝器上的抛光剂。”#!——波尔托斯"
 LOADING_TIP_124:0 "#bold “我是光明之主，我拥有支配那些照亮天空的天体的权力。亲爱的姐妹，我要将这件夜之衣赠给你，它上面缝着月亮、星星和夜空中的一切。穿上它，便能像我支配白昼那样支配黑夜。”#!——路西法对莉莉丝"
 LOADING_TIP_125:0 "#bold “我为何要在你之下，为何要让你伏在我的背上呢？我也是从真土中受造的，我与你是平等的。”#!——莉莉丝对亚当"
 LOADING_TIP_126:0 "#bold 他们永远都在四处游荡，执行一些秘密任务，寻找他们长者的头骨，把它们磨成催情药粉什么的。当你打断他们时，他们就会变得很不高兴。\n随便喽，甘道夫。#!——布鲁赫说睿魔尔"
 LOADING_TIP_127:0 "#bold “我曾是战争的娼妓，也是和平的娼妓。我曾是殉道者和独善者，是杀手和圣人。我目睹了历史的发生。我曾用自己的鲜血为文化的进步抹上猩红。我到看过奇迹，也成为过许多人的奇迹。”#!——露西塔·德·阿拉贡"
 LOADING_TIP_128:0 "#bold “我想如果我没有有用的才能，没有抱负，没有钱，我也会假装自己是一只动物。”#!——乔凡尼说冈格罗"
 LOADING_TIP_129:0 "#bold “他们不难杀。不过，当你杀死他们时，你不怎么能抓住他们的灵魂。显然，它们会被回收到它们快乐、闪亮的梦世界中。多么可爱。”#!——乔凡尼说妖精"
 LOADING_TIP_130:0 "#bold “你搞砸了死亡，且回来找更多。欢迎。\n现在的规则不同了。”#!——乔凡尼对他的子嗣"
 LOADING_TIP_131:0 "#bold “安布罗吉奥·乔凡尼有一个不光彩的声誉，那就是他是整个家族中对自己最感兴趣的人。”#!——一位乔凡尼"
 LOADING_TIP_132:0 "#bold “除了我们，所有人都是愚蠢的。\n可悲的真相。”#!——未知乔凡尼"
 LOADING_TIP_133:0 "#bold “他们背负着一个没有人能读出来的名字。这才算诅咒。”#!——阿科里·乔凡尼说棘秘魑"
 LOADING_TIP_134:0 "#bold “我存在。这就我足以该掌权。”#!——未知勒森魃"
 LOADING_TIP_135:0 "#bold “想想勒森魃。除去智慧、深虑、气质和对霸权的献身精神外。那就是梵卓：和我们类似，但更愚蠢。”#!——邓巴·马肯巴·阿杜拉"
 LOADING_TIP_136:0 "#bold “像样的宿敌。我玩的最后一位花了四夜才尖嚎，花了十二夜才死去。确实令人钦佩。”#!——棘秘魑说梵卓"