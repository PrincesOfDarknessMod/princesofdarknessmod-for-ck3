l_simp_chinese:
 LOADING_TIP_0: "#high “罗马学者塞内卡错了。不公正的统治是可以永恒的。”#!——哈德施塔特"
 LOADING_TIP_1: "#high 抱歉。该隐是吸榨不了的。#!"
 LOADING_TIP_2: "#high 吸血鬼长者能活这么久是有原因的。他们不会落入准备不足的阴谋中。#!"
 LOADING_TIP_3: "#high 注意潜藏。你不会想激怒教会的。#!"
 LOADING_TIP_4: "#high 这是黑暗世界。你没有朋友，只有棋子。#!"
 LOADING_TIP_5: "#high 你的领地非常有限，附庸是必要的。但不要相信他们。#!"
 LOADING_TIP_6: "#high 为了安全起见，预想每个人都在策划你的死亡。反正他们大概真这样。#!"
 LOADING_TIP_7: "#high “总有一位尊长来领导我们，在他之上还将有尊长，直到该隐。除了主人为你选好的之外，没有‘宿命’可供你们选择。”#!——蒙塔诺"
 LOADING_TIP_8: "#high “没有我，就没有魔宴。没有魔宴，也就没有秘盟。该隐社会的整个面貌就是因为我而变得如此。”#!——格拉齐亚诺，妄想道。"
 LOADING_TIP_9: "#high “一个小麻烦就像一粒沙子，而我每夜都承接着一片沙漠。”#!——拉克鲁瓦"
 LOADING_TIP_10: "#high “我曾经是世界之女王，我向你保证我将再次成为女王。我准许你可以受死了。”#!——佩塔尼奎亚"
 LOADING_TIP_11: "#high “我们不是神，不管我们怎么骗自己。神性不存在。宇宙之心是空的。你愿意和我一起穿过它吗？”#!——刻茉媞里"
 LOADING_TIP_12: "#high “灵魂不过是另一种粘土，可以用你的手指间扭捏。”#!——萨沙·维科斯"
 LOADING_TIP_13: "#high “终与始能够混合与扭曲，直到难以将以分开。”#!——阿纳托尔"
 LOADING_TIP_14: "#high “你可是位吸血鬼大恶人。嘿，太好了，祝贺。把它留给你自己吧。”#!——微笑杰克"
 LOADING_TIP_15: "#high “如果你别无选择，只能去毁灭一位诺斯费拉图，那么在任何情况下都不要在他的家乡与他对抗。\n我们将永远找不到你的灰烬。”#!——阿什拉夫"
 LOADING_TIP_16: "#high “你要明白，我们并没有输给梵卓。我们输给了梵卓和他们所有的盟友、仆人、朋友、以及每只根本不该与其不死领主进行眼神交流的狗娘养的贱民。现在，你知道梵卓的真正实力的所在了。”#!——莉迪亚·多恩"
 LOADING_TIP_17: "#high “永远，永远，永远都不要低估勒森魃。他们是不道德软弱的梵卓。他们是不矫揉造作的睿魔尔。他们是不装腔作势的赛特之子……且他们也都不是这些。”#!——法蒂玛·法卡迪"
 LOADING_TIP_18: "#high “在千年圣战中没有所谓的保持独立。只有对自己主人的认知缺乏。”#!——乌尔·舒尔吉"
 LOADING_TIP_19: "#high “千万不要在赛特之子的战场与他们作战，即社会和政治的战场。直到它插入你的喉咙，你都不会注意到他们的獠牙。”#!——苏凯纳"
 LOADING_TIP_20: "#high “孩子，我很高兴我没有被初拥到睿魔尔氏族。那简直就是场官僚主义噩梦。无意冒犯。只是，花了几十年等待才轮到做无名之辈的（二等）助理，对我没有吸引力。”#!——费尔顿"
 LOADING_TIP_21: "#high “这三件事是一位想蓬勃发展的亲王永远不该做的。激怒布鲁赫。羞辱梵卓。无视诺斯费拉图。”#!——佚名"
 LOADING_TIP_22: "#high “不要与心兽赌博，因为最后总是它赢。”#!——佚名"
 LOADING_TIP_23: "#high “有些人公开害怕上古耆宿，暗地害怕凡人。还有人公开害怕凡人，暗地害怕上古耆宿。这两种恐惧都是夸大其词。火焚末日是可以活过去的。我们可以永远掌权。”#!——密特拉"
 LOADING_TIP_24: "#high “我不是奴隶。我不是奴隶。我不是奴隶。\n这是他告诉我，让我告诉我自己的话。”#!——兰巴赫"
 LOADING_TIP_25: "#high “总会有另一个火焚末日的，贝克特。那只是思维的产物。你应该离开该循环；它是永恒的轮回。”#!——德古拉"
 LOADING_TIP_26: "#high “我盲目地选择走我的尊长在我前铺设的道路。数个世纪以来，我从未怀疑过它，直到我意识到这嘲弄给我的灵魂带来如此的空洞，它对取悦我、真正了解我自己的作用是多么的小。\n那夜，我发誓不再受苦。”#!——提图斯·梵卓鲁·卡米拉"
 LOADING_TIP_27: "#high “相信吧，睿魔尔，若你乐意的话，你和你的同类对血魔法的了解比在苏美尔崛起之前掌握它的人还要多。但我现在告诉你——你的氏族没对我的氏族做到任何我们不准的事。”#!——特琪洛士"
 LOADING_TIP_28: "#high “总有一刻——梵卓——棋局会布局棋手。”#!——伊希姆·乌尔·巴尔"
 LOADING_TIP_29: "#high “我前往我们先祖的土地，直面先驱。他是黑暗而可怕的——天堂的怒火和地狱的火焰。像最黑暗的夜晚一样漆黑而难以穿透。”#!——忒弥斯"
 LOADING_TIP_30: "#high “这些星星也是骨头，且不是单纯的装饰品；它们是乌尔·舒尔吉的骨头，在午夜般的皮肤剥落或裂开脱落的地方可以看出；它们是先驱精华之鞘，而其中骨髓由复仇构成。”#!"
 LOADING_TIP_31: "#high “我们在这为我们的生命而战，但梵卓和睿魔尔却仍然一有机会就给另一方下绊子，而妥芮朵最想做的就是批评溪水的颜色。”#!——狄奥·贝尔"
 LOADING_TIP_32: "#high “世界正在变成糟糕无比，但这让我们有事要做”#!——狄奥·贝尔"
 LOADING_TIP_33: "#high “古老的思想可以重新焕发活力。迦太基，这个理想，既古老又再次崭新。”#!——克里提亚斯"
 LOADING_TIP_34: "#high “每当我从头骨上拽下一块颚骨并将其塞入眼眶时，我就知道我正在建设一个更好的未来。”#!——微笑杰克"
 LOADING_TIP_35: "#high “要在黑暗中生存，只有一个办法：让它害怕你。”#!——微笑杰克"
 LOADING_TIP_36: "#high “你没有找到革命，孩子。是革命找到了你。”#!——泰勒"
 LOADING_TIP_37: "#high “所有死物都带有生命的回响。所有活物都能听到其死亡的呼唤。”#!——康斯坦西娅"
 LOADING_TIP_38: "#high “我们可以尽情地恨天恨地，而我们没有除自己之外更合适的怨恨对象。所以我们每夜都要苏醒，因为我们不想他妈的比我们已经是的更恨自己。但我们甚至会在这方面失败。”#!——查斯·乔凡尼·特洛"
 LOADING_TIP_39: "#high “纵观历史甚至更早，当黑夜中的神灵要求人类提供血和肉。这些是我们的尊长。是阿尔忒弥斯。是阿里曼。是卡加泰土丘的火山女神和阿兹特克的烟雾镜神——特斯卡特利波卡。黑暗如此厚重，以至于遮蔽了太阳。”#!——邓巴·马肯巴·阿杜拉"
 LOADING_TIP_40: "#high “让他们惊讶地瞠目结舌吧，迈卡。让他们咒骂我放弃按他们的条件与火焚末日作战。让他们称我为叛徒，把我列入他们荒谬的红名单，诅咒我是个懦夫和自私的蠢货。我已经厌倦了玩这世界摆在我面前的棋局。”#!——露西塔·德·阿拉贡"
 LOADING_TIP_41: "#high “吸血鬼是神格化的罪恶，是被亵渎和毁坏的美德的化身。通过这，你显示了你的价值。”#!——弗朗西斯科·多明戈·德·波兰"
 LOADING_TIP_42: "#high “我们这些年轻者经常在清晨，在沉眠之前，谈论新机遇的可取性。格拉齐亚诺的与众不同之处在于，他敢于就此采取行动。”#!——熊兄弟"
 LOADING_TIP_43: "#high “我打算把棋子从棋盘上扫掉……不仅要从党派中解脱出来，还要摆脱永恒的战争。我被我的尊长和维科斯操纵了。他们的圣战永远不会是我的战争。我将以任何方式对抗呼唤。我将喝下我的浓血，保持自由，最终千年圣战将被我和像我一样的人打破。”#!——卢修斯·埃利乌斯·塞扬努斯"
 LOADING_TIP_44: "#high “很遗憾，大部分棋子不得不从棋盘上被扫除。”#!——安布罗西奥·路易斯·蒙卡达"
 LOADING_TIP_45: "#high “如果你愿意，此生可是光荣的乐趣。”#!——特洛伊的海伦"
 LOADING_TIP_46: "#high “我们离开永恒之城是因为它的心脏早已停止跳动。它死了——而你们，一个曾经辉煌的城市的领主，躲在它的阴影里，迷失在你们自己建造的迷宫里。当我等回顾这个时代，回顾该时代的死亡，他们会看到你们的成就，并想知道哪里出了问题。但是，由于你们隐藏了自己，他们永远不会知道谁应该负责，应该对谁进行赞扬或谴责。你们的事迹，不论是伟大的还是卑劣的，都将被后人所遗忘，他们对你们的称呼将是无名之辈。”#!——米迦勒在离去前夕对罗马的该隐之子的最后一次演讲"
 LOADING_TIP_47: "#high “真理没有形状，没有象征。所有的眼睛都以不同的方式看它。所有的口舌都以不同的方式说它。没有什么——没有任何东西——能永恒不变。甚至我们也是如此。”#!——魔龙"
 LOADING_TIP_48: "#high “这似乎是真的，他死不了。只要他还有一滴血存在，他就存在。只要世界还没化为灰烬，他就可以使自己再次变为完全体。”#!——魔龙论棘秘魑"
 LOADING_TIP_49: "#high “我。蜕变。升华。我就是我。我是大地，被血唤醒。不再是幼虫。蛹的阶段结束了，对于我和他人而言。”#!——棘秘魑"
 LOADING_TIP_50: "#high “他已经忘记了温柔……甚至我也说不清他是否理解，或记得，我们是多么的脆弱。”#!——达米克·卢希梵论棘秘魑"
 LOADING_TIP_51: "#high “服从于我。你对上古耆宿并没有真正的爱，对吧？火焚末日即将到来，他们打算吞噬你、你的朋友和所有其他吸血鬼。我会阻止这一切！我将给你永恒！永生！我们将用另一场洪水迎接觉醒的祖尊，一场由他们的血液构成的大洪水！”#!——布克迪拉卡，向克里斯托夫·罗慕铎致意"
 LOADING_TIP_52: "#high “我不会犯我的祖先所犯的错误。我不会选择恐惧或无知。我不会因为害怕自己，害怕我是谁和我是什么而畏缩。我不会恨自己，也不会拒绝自己。我是迈卡·维科斯，总有一夜，世界将了解我真正是什么。”#!——迈卡·维科斯"
 LOADING_TIP_53: "#high “在王对王的棋局中，我们必须在绝对确信之祭坛上牺牲我们的同情心。要明智地统治，就必须彻底地统治。正义是没有怜悯的。”#!——小哈德施塔特"
 LOADING_TIP_54: "#high “当头领的愚蠢之处在于，无论你做什么，在你的背后都有成百上千的人，确信他们自己的解决方案才是最合理的，而你的决定只是一个异想天开的随机掷得的副产品而已。”#!——拉克鲁瓦"
 LOADING_TIP_55: "#high “我们的黑暗之父甚至现在还在外面的夜里徘徊，用他辛苦得来的智慧哭泣和忏悔。如果连强大的该隐都这样做了，我们怎么会骄傲地把脸转向月亮，说：‘我的血管里流淌着力量，靠着它我宣称对人类和野兽的王权，靠着我自己的黑血我为自己的罪孽辩护？’”#!——阿纳托尔"
 LOADING_TIP_56: "#high “你问我什么人更有可能成为恶魔的信徒和杀人犯。我向你保证；任何人都有可能成为唤魔者和杀人犯。”#!——哈罗德·泽特勒"
 LOADING_TIP_57: "#high “我跳的是愚者之舞。祈求你发现我的疯狂。因为你若追袭根源。你便知道我没有妄想。并发现我有真知之罪。”#!——末卡维"
 LOADING_TIP_58: "#high “小祖母，让我亲亲你。”#!——瓦西丽莎"
 LOADING_TIP_59: "#high “带着吠陀经中的正义英雄那难以克制的怒火，查古拉普夏进入了圣殿。”#!——贝克特论查古拉普夏"
 LOADING_TIP_60: "#high “秘盟的存在是为了保护其成员不受自己等人的伤害；这是它唯一有价值的目的。但是，它必有一天会破灭，当古老者来到火焚末日的餐桌前进食时。一张椅子将为我保留。”#!——刻茉媞里"
 LOADING_TIP_61: "#high “与你的神明讲和，并说你的告别。钻石将淹没在血泊中，世界的其他地方紧随其后。”#!——孙陀罗伐罗"
 LOADING_TIP_62: "#high “是蛇最先在园内，你得知道。”#!——赫沙·鲁哈泽"
 LOADING_TIP_63: "#high “他是我们信仰的对象，是无数牺牲背后的意义——毕达哥拉斯派、清洁派、共济会、炼金术师——都在黑暗中挣扎，以便有一天，在几代人之后，有一人可以手握禁果，贤者之石，永生灵药。他的名字叫格拉崔克斯，我们的光明使者，我们的普罗米修斯，我们的路西法。”#!——艾斯林·斯特布里奇"
 LOADING_TIP_64: "#high “你认为我寻求我们的流放——特别是你？就算一百声‘异端’指责和一千把棘秘魑剑，也比不得那可怕夜晚里秘会的蔑视之词……但若他们不愿意追随我们，那就让他们去死吧，就像那些被我从悬崖边上刨出石头骨架的龙。”#!——格拉崔克斯对梅琳达"
 LOADING_TIP_65: "#high “我不是你用来压榨或碾压的蛇，我也不是真正的巫师，但我将及时向你展示我是什么。在你离开后很久，你宝贵的凡人魔法成为女佣闲谈的内容，我将采取真正可以采取的行动，知道真正可以知道的东西。”#!——热尔韦，关于埃特里乌斯"
 LOADING_TIP_66: "#high “大多数都是龙、蛇、撒旦的子嗣，他们现在就在你们之间。基督的仆人们，我告诉你们，耶稣再临快来了，二次复临的日子快到了。龙的子嗣越长越大，越长越多，成为地上的伤口。我们是这伤口的药膏，我们必须用火洁净它，净化它，然后大地将准备好迎接耶稣再临，我们将被判定为适格者。”#!——利奥波德·冯·穆尔瑙"
 LOADING_TIP_67: "#high “我们知道是要为真理之重付出高昂的代价的。\n他们付的过多。”#!——末卡维论巴力"
 LOADING_TIP_68: "#high “悲剧的是，我们本可以让他们去死。他们永远不会原谅我们救了他们。”#!——末卡维论布鲁赫"
 LOADING_TIP_69: "#high “即使我可以告诉你我对他们的了解，你也不会相信我。”#!——诺斯费拉图论棘秘魑"
 LOADING_TIP_70: "#high “裁判所宣判他们的受害者将永远被诅咒，但他们只处理杀戮。我们处理诅咒。”#!——罗塞里尼，罗马亡灵术师"
 LOADING_TIP_71: "#high “我能想到他们认为我们花了大量的时间监视他们，并试图对他们搞破坏。好像他们有那么难搞清楚似的。”#!——诺斯费拉图论梵卓"
 LOADING_TIP_72: "#high “没有什么值得讨论的。很快，其他人将只会在回忆谈及他们。然后我们也会杀了这些人，睿魔尔就永远不存在了。”#!——棘秘魑论睿魔尔"
 LOADING_TIP_73: "#high “当他们的血因扫罗的死亡而愤怒地嚎叫时，我们的血却欢快地欢呼着。让我们一起乐起来。”#!——巴力论萨洛比"
 LOADING_TIP_74: "#high “如果可以的话，试着找到其与妥芮朵的区别。只有一个：他们有一个计划，这使他们更像我们。不知道是否好坏。”#!——乔凡尼论赛特之子"
 LOADING_TIP_75: "#high “没有地方和时间用于辩论。当你离场时，你放弃了你琐碎地追求。如果你坚持下去，继续前进，你将不会死于英雄之手。你会乞求。你会祈祷。你不会得到任何答复。”#!——未知拉米亚"
 LOADING_TIP_76: "#high “禁果不会自己从树上掉下来，而这棵树早就应该被砍掉了。”#!——布鲁赫论赛特之子"
 LOADING_TIP_77: "#high “吃我一靴。”#!——布鲁赫论梵卓"
 LOADING_TIP_78: "#high “我让你先走一步。你是乌龟，而我是兔子——一只生气、厌世、有笔账要算、而且像魔鬼一样渴血的兔子。”#!——佚名布鲁赫"
 LOADING_TIP_79: "#high “把尾巴钉在——嗷，嗷，嗷，肏！”#!——末卡维论冈格罗"
 LOADING_TIP_80: "#high “能喷射火花。别喷我脸。喷其他混账去。”#!——诺斯费拉图论布鲁赫"
 LOADING_TIP_81: "#high “我看起来像这样，因为我必须这样。这些该死的家伙是自己选择的。这就是大自然所说的：‘离远点’。”#!——诺斯费拉图论棘秘魑"
 LOADING_TIP_82: "#high “这些人的问题，把他们钉在棺材里焚烧掉就能解决了。”#!——雷伏诺论棘秘魑"
 LOADING_TIP_83: "#high “你究竟为什么会认为我想让你停止尖叫？我发现当让你放纵你的恐惧时，产出的结果会更加悠扬。”#!——佚名棘秘魑"
 LOADING_TIP_84: "#high “杀了他们。杀光他们。不要把时间浪费在他们没活得够久来理解的教训上。”#!——棘秘魑论睿魔尔"
 LOADING_TIP_85: "#high “啊，新的参与者在千年战场中出现了。我们必须为他们安排适当地、慷慨地欢迎。”#!——赛特之子论睿魔尔"
 LOADING_TIP_86: "#high “背信弃义的贱民。曾有一只勒森魃蛆虫试图将我卷入他肮脏的阴谋中。尽管他摆出一副高高在上的样子，但他的内脏看起来和其他吸血鬼没什么区别。”#!——冈格罗论勒森魃"
 LOADING_TIP_87: "#high “当一位末卡维说话的时候，聆听。当一位末卡维行动时，离开。当两位末卡维聚集在一起时，快跑。”#!——冈格罗论末卡维"
 LOADING_TIP_88: "#high “我只有一句话要说。赛特比末卡维更疯狂。我以我尊长的骨头起誓。”#!——末卡维论赛特之子"
 LOADING_TIP_89: "#high “政治很简单。告诉你的下属该怎么做，把那些胆敢不服从的人钉死，然后继续做真正重要的事情。”#!——佚名棘秘魑"
 LOADING_TIP_90: "#high “他们希望我们欣赏他们的艺术，却对我们的艺术望而却步！把他们当作宠物来养，直到他们的诗句开始令人厌烦；然后把他们扔到战王培养坑里。”#!——棘秘魑论妥芮朵"
 LOADING_TIP_91: "#high “我们将把他们偷来的赠礼从剥过皮的内脏中撕出来，把他们串在被他们玷污的喀尔巴阡山上，用他们的胆汁体液喂养多瑙河，把剩下的留给秃鹰。然后我们将真正开始教他们痛苦是什么。”#!——棘秘魑论睿魔尔"
 LOADING_TIP_92: "#high “他们有令人钦佩的记仇才能。”#!——梵卓论布鲁赫"
 LOADING_TIP_93: "#high “如果它看起来像蛇，像蛇一样嘶叫，像蛇一样爬行，那么你就不要伸手去抚摸它的头。如果你在你的花园里发现一条蛇，你就杀了它。”#!——史卡沙·科伦布基里论赛特之子"
 LOADING_TIP_94: "#high “好耶，与权威作斗争。帮助人民！哦，等等，你只是要帮助其中的一半？好吧，我想这也行。”#!——啮骨者论黑怒"
 LOADING_TIP_95: "#high “他们确实让我感到寒心。你认为你正在编织一篇真正的悲剧故事，而他们只是回头看着你，好像在说：‘就这？’”#!——芬尼安论寂静漫游者"
 LOADING_TIP_96: "#high “你的先祖几乎和我们一样强壮，而你也几乎和我们一样强壮。啥？这是一句赞美啊。”#!——芬里尔仔兽论芬尼安"
 LOADING_TIP_97: "#high “令人印象深刻地聪慧。危险地被低估。相当有用。”#!——影爵论啮骨者"
 LOADING_TIP_98: "#high “妥善应对他们，他们是任何战斗计划的重要组成部分。若在应对他们时犯错的话……实际上，我得说不要在应对他们时犯错。”#!——影爵论芬里尔仔兽"
 LOADING_TIP_99: "#high “他们的忠诚是非常值得赞赏的，即使他们的礼仪是……变幻不定的。”#!——银牙论芬尼安"
 LOADING_TIP_100: "#high “他们不明白，赢得战斗并不值得输掉战争。”#!——啮骨者论芬里尔仔兽"
 LOADING_TIP_101: "#high “给予他们盖亚的尊重，但如果你和他们同舞，要小心不要感到友善。”#!——芬尼安论黑怒"
 LOADING_TIP_102: "#high “你的指甲可真漂亮。坚硬如钢，且如此，如此锋利。它们可以撕裂肉体和骨骼。我只想……把它们咬下来。”#!——特洛伊的海伦"
 LOADING_TIP_103: "#high “我的命运将不会由我的尊长之尊长或其他谁来决定。我不会再被控制。”#!——卢修斯·埃利乌斯·塞扬努斯"
 LOADING_TIP_104: "#high “当她准备回归时，世界一分为二。一边是该隐之子，另一边是莉莉丝之子，这就是火焚末日。”#!——沙尔残篇"
 LOADING_TIP_105: "#high “他要来了。黑牧人要来宰杀羊群。妒恨之子。毁灭先驱。如同死亡之主在凯马克利屠杀他的子嗣一样，黑牧人将在鹰巢屠杀哈基姆圣裔。”#!——佚名凡人预言者"
 LOADING_TIP_106: "#high “一切旧事物都必须为新事物让路。第三变为第二，第二变为第一。父亲死了，儿子才能活。我们都是盘旋而下的圆环，在地狱中进行统治。”#!——阿卡恰"
 LOADING_TIP_107: "#high “巨轮的转动是不可阻挡的。它不能被停止，但它的路线可以被改变，以推迟我们被磨成虚无，他们则崛起的最后时刻。现在是这样，以前也是这样。以前是这样，将来也是这样。该隐的子嗣们永远站在湮灭的顶角上。”#!——春军"
 LOADING_TIP_108: "#high “我们老谋深算又知识渊博，但因我们的年龄和权力，我们把自己困在我们看不见的网中，用我们感觉不到的木偶线捆绑自己，更不用说切断了。”#!——春军"
 LOADING_TIP_109: "#high “千百年来，死亡邪教如雨后春笋般出现，奉献于让世界末日到来，并将自己交给他们的救世主。世界末日了吗？没有。那些所谓的救世主除了是饥渴的混账外，还曾是其他什么吗？没有。除了睿魔尔。”#!——塔利"
 LOADING_TIP_110: "#high “然后魔龙掠夺了库帕拉的衣钵。就像他被引导去做的那样。并把它当作自己的东西穿在身上。统治着河流之间的土地。和他所走过的每一个地方。正如他的意愿。”#!——库帕拉摇篮本"
 LOADING_TIP_111: "#high “他们正在到来。他们是为我们所有人而来！”#!——安格斯的遗言，一位诺斯费拉图"
 LOADING_TIP_112: "#high “有些书就不该被打开。”#!——阿纳托尔"
 LOADING_TIP_113: "#high “享受由专人送到你选择的地点的书籍。请放心，为了获得这些书，只需要死一位邓西恩就可以了。我杀了两位，以发出一个信息。”#!——塔利"
 LOADING_TIP_114: "#high “睿魔尔不是起源于棘秘魑的一条血系吗？这听起来很重要。”#!——阿纳托尔"
 LOADING_TIP_115: "#high “泽特勒、瓦里克、韦格尔、利奥波德、鲁哈泽、贝克特。这只是那些最近最新地试图控制眼睛并开始屈服于其力量的人的名字。不要打开盒子。”#!——阿纳托尔"
 LOADING_TIP_116: "#high “当哈济梅尔把他的额头对准我时，似乎打开了第三只眼睛，他的思想触及了我的思想。他能看到我人生中的一切，并微笑。我可以看到他的一切，并开始尖叫。”#!——贝克特"
 LOADING_TIP_117: "#high “桌子说话了！它很不高兴。你在试着在一间空房子里当一张作祟的桌子。”#!——阿纳托尔"
 LOADING_TIP_118: "#high “能进行真正的讽刺在哈德施塔特家族是一种罪行，可被处以终焉之死。”#!——卡莱布罗斯"
 LOADING_TIP_119: "#high “在我内。总是在我内。我与最长者说话。或父亲对我说话。无论我怎么吞咽，祖父都不会倒下。”#!——兰巴赫"
 LOADING_TIP_120: "#high “表亲维奥丽卡代表达米克来访。想知道为什么我的通讯停止了。我向她展示。最长者饱了。我是个好小子。”#!——兰巴赫"
 LOADING_TIP_121: "#high “该行动……在多年前……是粗俗和短视的。”#!——萨沙·维科斯"
 LOADING_TIP_122: "#high “湿婆夏克提，汝是神圣的父与母。赐予我信念，摧毁邪恶者，以及从邪恶发出的纪元之轮的枯萎。征服脚跟下的所有死亡和命运，让寂静成为永恒的法则。”#!——沃尔曼斯"
 LOADING_TIP_123: "#high “我们看到的越多，我们就越认为我们知道的越多。我们认为我们了解的越多，我们就越是固步自封，就越是限制我们的潜力。因此，青春是点燃未来的火焰。力量不过是钝器上的抛光剂。”#!——波尔托斯"
 LOADING_TIP_124: "#high “我是光明之主，我拥有支配那些照亮天空的天体的权力。亲爱的姐妹，我要将这件夜之衣赠给你，它上面缝着月亮、星星和夜空中的一切。穿上它，便能像我支配白昼那样支配黑夜。”#!——路西法对莉莉丝"
 LOADING_TIP_125: "#high “我为何要在你之下，为何要让你伏在我的背上呢？我也是从真土中受造的，我与你是平等的。”#!——莉莉丝对亚当"
 LOADING_TIP_126: "#high “他们永远都在四处游荡，执行一些秘密任务，寻找他们长者的头骨，把它们磨成催情药粉什么的。当你打断他们时，他们就会变得很不高兴。\n随你咋说，甘道夫。”#!——布鲁赫论睿魔尔"
 LOADING_TIP_127: "#high “我曾是战争的娼妓，也是和平的娼妓。我曾是殉道者和独善者，是杀手和圣人。我目睹了历史的发生。我曾用自己的鲜血为文化的进步抹上猩红。我到看过奇迹，也成为过许多人的奇迹。”#!——露西塔·德·阿拉贡"
 LOADING_TIP_128: "#high “我想如果我没有有用的才能，没有抱负，没有钱，我也会假装自己是一只动物。”#!——乔凡尼论冈格罗"
 LOADING_TIP_129: "#high “他们不难杀。不过，当你杀死他们时，你不怎么能抓住他们的灵魂。显然，它们会被回收到它们快乐、闪亮的梦世界中。多么可爱。”#!——乔凡尼论妖精"
 LOADING_TIP_130: "#high “你搞砸了死亡，且回来找更多。欢迎。\n现在的规则不同了。”#!——乔凡尼对他的子嗣"
 LOADING_TIP_131: "#high “安布罗吉奥·乔凡尼有一个不光彩的声誉，那就是他是整个最自以为是的氏族中最自以为是的混蛋。”#!——一位乔凡尼"
 LOADING_TIP_132: "#high “除了我们，所有人都是愚蠢的。\n可悲的真相。”#!——佚名乔凡尼"
 LOADING_TIP_133: "#high “他们背负着一个没有人能拼读出来的名字。这才算诅咒。”#!——阿科里·乔凡尼论棘秘魑"
 LOADING_TIP_134: "#high “我存在。这就我足以该掌权。”#!——佚名勒森魃"
 LOADING_TIP_135: "#high “想想勒森魃。除去智慧、深虑、气质和对霸权的献身精神外。那就是梵卓：和我们类似，但更愚蠢。”#!——邓巴·马肯巴·阿杜拉"
 LOADING_TIP_136: "#high “像样的宿敌。我玩的最后一位花了四夜才尖嚎，花了十二夜才死去。确实令人钦佩。”#!——棘秘魑论梵卓"
 LOADING_TIP_137: "#high “我们的氏族大概率是由大家所能得出的最坏的阴暗小人组成，但他们是我们的阴暗小人。”#!——弗里德里希·冯·韦伯，一位梵卓"
 LOADING_TIP_138: "#high “似乎总是有奇怪的小事故发生在那些与他们擦肩而过的人身上。如果这些事故不能除掉你，他们向你抛出的轰脑的死亡念咒就能。”#!——诺斯费拉图论法师"
 LOADING_TIP_139: "#high “我很少遇到这样的生物，它们如此确信自己对宇宙的重要性，却又如此缺乏证据来支持它们的妄想。”#!——雷伏诺论妥芮朵"
 LOADING_TIP_140: "#high “他们非常勇敢，非常坚强，作为个体有强大的杀伤力……作为群体却完全没有作用。”#!——赛特之子论冈格罗"
 LOADING_TIP_141: "#high “布鲁赫声称因为他们有卓越的智力，只有他们知道如何建立完美的社会。你大可通过恐怖的尖叫声和物体破碎的撞击声来找到这些智者。”#!——赛特之子论布鲁赫"
 LOADING_TIP_142: "#high “当你意识到妥芮朵已经发了脾气时，你的头可能已经离你的身体好几英尺了。”#!——赛特之子论妥芮朵"
 LOADING_TIP_143: "#high “少数长者没有什么可藏的。他们被称为‘死者’”#!——撒迦利亚·谢尔"
 LOADING_TIP_144: "#high “现在我有个问题要问你。在一位聪明、无情、狂热、充满控制欲并决心整垮你的勒森魃长者，和一位聪明、无情、狂热、充满控制欲并相信你很优秀的勒森魃长者之间，哪个更可怕。”#!——纳迪亚"
 LOADING_TIP_145: "#high “追随冈格罗？何不向亲王吐痰，或者去享受日光浴呢？”#!——皮埃尔"
 LOADING_TIP_146: "#high “为了你，露西塔，我所做的一切……以及为了我自己所做的一切。”#!——蒙卡达"
 LOADING_TIP_147: "#high “那条路的名字叫做火焚末日，它铺满了垂死的梦想。”#!——克里·科德什"
 LOADING_TIP_148: "#high 当筛选降临时，杀亲者将站在叛血者的面前。哀嚎和咬牙切齿是叛血者的阴影，比日夜更加确凿。\n看哪，大地将展开她的子宫，兽将爬行而出，寻找鲜血以满足其渴望。米迦勒，荣耀军团中最崇高的存在，因不洁的三位一体而颤抖。兽行走在地上。该隐的子嗣的毁灭即将来临。#!——亚利马太的约瑟"
 LOADING_TIP_149: "#high “他们一直在密谋为布鲁赫之死而复仇，也就大约一万年吧。我相信他们随时都会动手的。”#!——布鲁赫论真布鲁赫"
 LOADING_TIP_150: "#high “一半的魔宴氏族在魔宴那里只因为这让他们有机会杀睿魔尔。”#!——佚名冈格罗"
 LOADING_TIP_151: "#high “可悲的是，好几个世纪以来，我们不得不听梵卓和布鲁赫抱怨迦太基。事实上，如果迦太基真的很重要，我们早就从他们手中夺走了。”#!——佚名勒森魃"
 LOADING_TIP_152: "#high “你可以想象，组织一群自私、自负、野心勃勃的杀人犯、小偷和掮客并不是一件容易的事。”#!——勒森魃论自等"
 LOADING_TIP_153: "#high “每位勒森魃都希望敌人的遗言是‘啊，我明白了。玩得漂亮。’”#!——佚名勒森魃"
 LOADING_TIP_154: "#high “我是该隐？你是该隐？我们是该隐？”#!——佚名末卡维"
 LOADING_TIP_155: "#high “最后，但肯定不是最不重要的，我们还有阴暗、神秘的遁世会，一个以阴暗神秘著称的吸血鬼教派。我可以告诉你真相，但我必须杀了你。\n我是说，再杀一遍。”#!——佚名末卡维"
 LOADING_TIP_156: "#high “玩笑是一个很难向氏族以外的人解释的概念，而‘结果难以捉摸的可怕叛党阴谋’也不太容易让人接受。”#!——佚名末卡维"
 LOADING_TIP_157: "#high “你可能会听到一些自视甚高的血族说什么‘幕后大师’，说吸血鬼是人类历史的罪魁祸首。亲爱的，这是个动听的故事，但事实并非如此。我们几乎无法控制自己的社会而不分裂成“教派”、“圈子”什么的，我们怎么可能控制人类呢？”#!——佚名妥芮朵"
 LOADING_TIP_158: "#high “妥芮朵在血族世界中是独一无二的。我并不是说我们比其他氏族更优秀……当然我们确实比其他氏族更优秀——你和他们谈过吗？”#!——佚名妥芮朵"
 LOADING_TIP_159: "#high “今晚的布鲁赫傻瓜们声称迦太基是一座血族和血畜和谐共处的城市。我想是的，如果你把“和谐”定义为凡人在吸血鬼抢走他们的亲人并吸干他们的血时，连反抗的念头都不会有的话。”#!——佚名梵卓"
 LOADING_TIP_160: "#high “我们要求的宝座是十字架，因为不做统治者的唯一选择就是做奴隶。”#!——佚名梵卓"
 LOADING_TIP_161: "#high “据说祟利坎已经灭绝了。同为已经灭绝的，我很难相信这说法。”#!——未知布巴斯提"
 LOADING_TIP_162: "#high “我曾经派一位可汗去对付一只吸血鬼。结果令人欣喜。”#!——佚名布巴斯提"
 LOADING_TIP_163: "#high “是是，我想他们是高贵的，但态度真有问题！”#!——祟利坎论辛巴"
 LOADING_TIP_164: "#high “没有国王能如此强大，没有牧师能如此神圣，没有处女能如此纯洁，以至于他们的血液在老虎面前都不会凝固。在我面前，你们什么都不是。”#!——佚名可汗"
 LOADING_TIP_165: "#high “我们告诉巴希拉和可汗：如果你们是比我们更优秀的王，就努力夺取王冠吧。\n值得称赞的是，他们尝试了”#!——佚名辛巴"
 LOADING_TIP_166: "#high “可悲。还亡了。太遗憾了”#!——辛巴论祟利坎"
 LOADING_TIP_167: "#high “我不会相信一个人到我能丢金字塔丢出的距离，而那并不太远。”#!——阿迦巴论布巴斯提"
 LOADING_TIP_168: "#high “欢迎来到白珍珠。我们专做狂野的美梦和更狂野的噩梦。我想知道你来这里是为了什么，嗯？”#!——沙鲁罗，红天的卡迪"
 LOADING_TIP_169: "#high “我们与其他同类的主要区别在于，他们只喝受害者的血，而那伽罗阇还必须吃肉。因此，我们的绰号叫食肉者。就像其他血族让他们四岁的侄女给我们起名字但我跑题了一样。”#!——佚名那伽罗阇"
 LOADING_TIP_170: "#high “一个人问灵媒是否真的能预知未来，灵媒的回答是肯定的。于是，那人一拳打在灵媒脸上。灵媒躺在地上流血不止，不知道自己做了什么惹来如此暴力，攻击他的人走过来说：‘我敢打赌，你肯定没料到会这样！’。\n我们经常听到这样的笑话。”#!——佚名真布鲁赫"
 LOADING_TIP_171: "#high “米迦勒在爱人的仇恨中找到了救赎，但那已经超越了幻梦，再也回不来了。他的失败几乎和她的胜利一样痛苦。\n而米迦勒笑了”#!"
 LOADING_TIP_172: "#high “那座城市曾经如此宏伟。如此的高贵典雅。现在，跪倒在地，君士坦丁堡被降到了另一个级别——我的级别，且她要重新站起来时，我相信她会用我的项圈扼着她的喉咙”#!——威尼斯的阿丰佐"
 LOADING_TIP_173: "#high “幻梦？米迦勒对一座伟大城市的幻梦如往昔一般：它既在我们身后，又在我们前方。我们携带着它，可以以任何我们能想象的形象重建它，甚至许多连我们之中任何一个人都无法想象的形象。”#! ——马拉希底斯"
 LOADING_TIP_174: "#high “受诅？克里斯托夫，你乃是宇宙的巅峰。你的力量超越了最德高望重之人。你是自成一法，更像神而非人。你是永生不朽！无论形体还是力量，你都是天使；享受你的地位吧。品味上帝赐予你的无上力量。用它去将你的意志施加于这个罪人的世界上。”#! ——塞蕾娜"
 LOADING_TIP_175: "#high “最后的机会，恶魔。我知道如何干净利落地消灭你们，但我会很乐意装作我并不知道。”#!——戈捷·德·丹皮尔致阿纳托尔"
 LOADING_TIP_176: "#high 我们将在教会内部——却不让教会知晓——建立一支“若上帝允许，女性亦可加入”的队伍。这支队伍将为圣父执行审判，对抗尘世的地狱军团。#!——红衣主教巴蒂斯塔·马佐内"
 LOADING_TIP_177: "#high “该隐确是典范。他是我们的黑暗之父，血族的始祖。他是流浪者，如我们一般寻求宽恕与理解。他是暴虐的导师，惩罚那些背弃其教诲者。但他并非弥赛亚。#!——阿纳托尔"
 LOADING_TIP_178: "#high “亲王就像宴会上的烤鹅。那些没有动手宰割你的人则伺机将你大快朵颐。”#!——奥利维尔"
 LOADING_TIP_179: "#high “我怜悯你，因你从未真正达成过任何渴望。你无法爱，只能占有；你无法统治，只能支配。我愿你终有一夜寻得安宁——我虽不认为你会，但仍如此希望。你是我的尊长，但我向你屈膝臣服的日子已结束。你不再是此地的亲王。”#!——若弗鲁瓦对亚历山大"
 LOADING_TIP_180: "#high “我们曾以荣誉、勇气与精钢之刃为武装。如今，我们以上帝的正义之怒直面他。纵使他从地狱深渊召唤大军，#italic 他也无法与我们抗衡！#!”#!——约根·冯·费尔登谈及弗拉基米尔·罗斯托维奇"
 LOADING_TIP_181: "#high “‘疾驰。’这个词几乎难以辨认。‘疾驰，仿佛魔鬼正咬住你的脚跟。\n’喀喇露出狼一般的牙齿微笑。‘因为他确实会。’”#!——喀喇对马库斯 德 朗格"
 LOADING_TIP_182: "#high “美猴王真令尔等汗颜。佛祖和诸相之力出手才教会了他如何自持。”#!——《华鹤千呤录》"
 LOADING_TIP_183: "#high 看着罗莎蒙欢笑，是任何神智正常的吸血鬼胆敢靠近阳光的极限。听她歌唱或吟诵诗篇，便如同聆听塞壬的歌喉。看她步履轻盈，便如目睹上帝之爱的化身在翩然律动。\n而看她哭泣，则令人心碎难忍。#!约根·冯·费尔登"
 LOADING_TIP_184: "#high “若战端开启，你会逃吗？”哈德施塔特与勒森魃四目相对，月光都为之驻足凝视。戈宗将双眼微微睁大，让哈德施塔特得以窥见其眼底深处。哈德斯塔德后退了一步——他已有百年，或许更久未曾向敌人示弱。\n但此刻，他确实亲眼见到了地狱。#!"
 LOADING_TIP_185: "#high \"Stay away from them. Stay away from their lands. Stay away from their whispers. Stay away from their friends, and the hell away from their enemies.\" -Bone Gnawers about the Shadow Lords#!"