 NEED_MASSREGNANT_TO_UNLOCK_MAA_TEXT: "#Weak 你需要先使用解锁[men_at_arms|E][character_interaction|E]解锁$POD_ghoul_maa$型[men_at_arms|E]。#!"
 NEED_MASSSIRE_TO_UNLOCK_MAA_TEXT: "#Weak 你需要先使用解锁[men_at_arms|E][character_interaction|E]解锁吸血鬼型[men_at_arms|E]。#!"
 ghouls: "精选血仆"
 ghouls_flavor: "#F 吸血鬼的血债血奴，他们拥有超强的力量和韧性。再加上他们的永生之身（虽然依赖于吸血鬼的血液），使他们成为技艺精湛的战士。#!"
 szlachta: "什拉赫塔"
 szlachta_flavor: "#F 血仆是被易变术重塑血肉而成的，以增加他们的战斗勇武。在增加他们的力量的同时，他们也变得可怕的畸形。#!"
 vozhd: "战王"
 vozhd_flavor: "#F 通过库都术法融合十几个血仆而成的15英尺高的生物兵器。一堆生物混杂物融混为一个大象大小的多肢体怪物。#!"
 zmei: "戈里尼奇"
 zmei_flavor: "#F 具有宏大力量的可怕生物，曾经的$glossary_wyrm$仆从，现在束缚于小祖母芭芭雅嘎。#!"
 massvampires: "刚被初拥的吸血鬼群"
 massvampires_flavor: "#R 最大规模=3#!\n#F 一群由大规模$pod_Embrace$造成的吸血鬼雏儿。血液使他们比凡人更强壮，但是他们才刚刚得到他们的力量。#!"
 witchhunters: "猎巫人"
 witchhunters_flavor: "#F 专精于追杀怪物的凡人。#!"
 wolves_flavor: "#F 自然界中很少有声音比狼的嚎叫更令人心寒。不知何故，它包含了人类对荒野的一切恐惧，也包含了我们所渴望的一切。#!"
 bats: "蝙蝠"
 bats_flavor: "#F 蝙蝠是一种神秘而令人生畏的动物，它们白天倒睡在树上和洞穴里，晚上飞来飞去，寻找昆虫、水果，有时还有人血等食物。#!"
 gargoyle_warriors: "石像鬼战士"
 gargoyle_warriors_flavor: "#F #!"
 gargoyle_sentinels: "石像鬼哨兵"
 gargoyle_sentinels_flavor: "#F #!"
 gargoyle_scouts: "石像鬼斥候"
 gargoyle_scouts_flavor: "#F #!"
 gargoyle_razorbats: "刮刀蝙蝠"
 gargoyle_razorbats_flavor: "#F #!"
 rats: "老鼠"
 rats_flavor: "#F 老鼠象征着城市的无序扩张——污秽、疾病和秘密的疏忽积累，但也象征着精明和坚韧。一些狼族——尤其是一些居住在城市里的狼人——对老鼠充满了友情，但这些啮齿动物偶尔也会与潜伏吸血鬼或术士及其使魔联系在一起。不过毫无疑问的是，老鼠无处不在。#!"
 scorpions: "蝎子"
 scorpions_flavor: "#F 这些蛛形纲动物的大小不一，小的如拇指，大的如手掌，它们只需闪电般快速射出弯曲的尾巴，就能注入可怕的毒液。#!"
 snakes: "蛇"
 snakes_flavor: "#F 诱惑者，欺骗者，开门者，玷污无知心灵的毒害者，它在人类的想象中盘旋、滑行和咬噬。#!"
 insects: "昆虫"
 insects_flavor: "#F #!"
 maniacs: "疯子"
 maniacs_flavor: "#F #!"
 demonic_thralls: "魔奴"
 demonic_thralls_flavor: "#F 侍奉着可怕的巴力主子的魔奴#!"
 ghouled_cavalry: "血仆化骑兵"
 ghouled_cavalry_flavor: "#F 血仆化骑士随时准备与他们的主人要杀的人战斗。在战斗中也经常使用血仆化坐骑。#!"
 guards_guards: "血仆化卫兵"
 guards_guards_flavor: "#F 这些凡人曾经是当地重要贵族的护卫，但现在却被赋予了为更伟大（也更阴暗）的主顾服务的血。#!"
 brigands: "血仆化匪徒"
 brigands_flavor: "#F 这些凡人曾经是法律的反方，与当地的该隐之子领主的相遇改变了他们的一生。不过，这并没有让他们真正成为更好的人，只是让他们的行事更加有能而已。#!"
 cultists: "密教徒"
 cultists_flavor: "#F 信奉超自然魔物和邪神，被$pod_cainites$所掌控的凡人。#!"
 serpentis_monsters: "提丰魔兽"
 serpentis_monsters_flavor: "#F 用古蛇术$pod_discipline$制造的可怕的魔兽，随时准备开始撕咬。#!"
 crowds: "受控群众"
 crowds_flavor: "#F 一群凡人，自以为的信任你的功业并尽全力帮助你。#!"
 musketmen: "火枪兵"
 musketmen_flavor: "#F 可怕的火药开始得到广泛使用，使凡人在面对超自然时的劣势越来越小。#!"
 thinbloods: "淡血种"
 thinbloods_flavor: "#F 大量初拥的第十四代或更后的吸血鬼。#!"
 the_lost_ancients: "失落古孽"
 the_lost_ancients_flavor: "#F 被宇宙遗忘的无形影子，被木乃伊召唤而来协助其。#!"
 POD_controlled_animals: "受控动物"
 POD_controlled_animals_flavor: "#F 天哪，这么多松鼠……#!"
 POD_ronin_hatamoto: "大名浪人旗本"
 POD_ronin_hatamoto_flavor: "#F 经你强化的凡人精锐骑兵，誓死效忠于你的事业。#!"
 POD_ronin: "大名浪人"
 POD_ronin_flavor: "#F 经你强化的凡人精锐重步兵，誓死效忠于你的事业。#!"
 POD_yumihiki: "大名弓引"
 POD_yumihiki_flavor: "#F 经你强化的凡人精锐弓手，誓死效忠于你的事业。#!"
 POD_yumihiki_riders: "大名弓引骑手"
 POD_yumihiki_riders_flavor: "#F 经你强化的凡人精锐骑射手，誓死效忠于你的事业。#!"
 POD_sojutsuka: "大名枪术家武士"
 POD_sojutsuka_flavor: "#F 经你强化的凡人精锐枪兵，誓死效忠于你的事业。#!"
 POD_sojutsuka_riders: "大名枪术家骑手"
 POD_sojutsuka_riders_flavor: "#F 经你强化的凡人精锐枪骑兵，誓死效忠于你的事业。#!"
 POD_teppo_gunners: "大名铁炮射手"
 POD_teppo_gunners_flavor: "#F 经吧强化的凡人精锐火枪手，誓死效忠于你的事业。#!"
 war_avatar_of_great_fenris: "大芬里斯的战争化身"
 war_avatar_of_great_fenris_flavor: "#F 鲜有灵类——除却灵君本体外——能够有大芬里斯的战争化身那般可怕与危险。魔狼芬里斯的化身是一头巨大的狼，肩高超过10英尺，双眼燃烧着熊熊怒火，无数仇敌的鲜血自它的下颌滴落。它的皮毛是深灰色的，但在光线穿过它时，似乎会从黑色变成红色，甚至变成白色。芬里斯的战争化身并不如灵君本体那般强大，但依然违背了灵类的通常限制，它的特质甚至超越了节点爬行者。#!"
 enochian_guards: "以诺血殿卫士"
 enochian_guards_flavor: "#F 远古的战士们再次聚集在一起，保护他们永生的主人。#!"
 maryannu: "战车射手"
 maryannu_flavor: "#F 骑乘战车勇敢贵族可能已经被凡人遗忘，但这种自豪的传统仍然存在于那些在曾经知道它的人身上。#!"
 romani_scouts: "罗姆斥候"
 romani_scouts_flavor: "#F 迅速而坚韧的骑兵，善于寻找最佳的战斗方式。#!"
 cockatrices: "鸡蛇"
 cockatrices_flavor: "#F 一条蛰伏于大漠流沙之中的邪恶毒蛇，并利用它恶毒的凝视和吐息杀死了无数勇士。#!"
 drake: "龙兽"
 drake_flavor: "#F 龙兽有着厚重的装甲，使其几乎免受弓与剑的任何攻击。#!"
 orm: "龙蛇"
 orm_flavor: "#F 龙蛇在寒冷的气候中筑巢，其与巨蛇或鳗鱼非常相似。#!"
 wyverns_flavor: "#F 双足飞龙是一种蜷曲的有翼蛇类，其猎场从欧洲最北部一直延伸到希腊和埃塞俄比亚。#!"
 lindworm: "鳞龙"
 lindworm_flavor: "#F 诡秘难寻的鳞龙，废瘠荒原的潜行者。#!"
 amphiptere: "翼蛇"
 amphiptere_flavor: "#F 翼蛇是一种有翼但无足的蛇类，只能依靠飞行移动。#!"
 sphinx: "斯芬克斯"
 sphinx_flavor: "#F 斯芬克斯或者说“龙猫”在长相上如同兼具膜翅、巨大獠牙以及蛇目并不时吐息的老虎或豹子。#!"
 fu_guardian: "石狮"
 fu_guardian_flavor: "#F 作为秩序与文明的监督者，这种小型龙类生物类似于狮子、龙以及狗三者的杂交产物。#!"
 feng_huang: "凤凰"
 feng_huang_flavor: "#F 新的火焰可以把旧的火焰扑灭，大的苦痛可以使小的苦痛减轻。#!"
 ghul: "食尸鬼"
 ghul_flavor: "#F 易卜劣斯之子，黑暗亲王，爱好混入人类以魅惑和进食。#!"
 gryphon: "狮鹫"
 gryphon_flavor: "#F 早于埃及辉煌时期的文物描绘了狮鹫，这种形态上半狮半猛禽的动物施展曙光之翼翱翔天际。它是赤爪部族的传统图腾之灵。#!"
 harpy: "鹰身女妖"
 harpy_flavor: "#F 在希腊传说的早期记载中，鹰身女妖是死亡的预兆和高傲的惩罚者。#!"
 hippocampi: "马头鱼尾兽"
 hippocampi_flavor: "#F 沿着湖泊和海洋奔跑的马，会与波浪和水的守护灵相伴。有时，他们的玩耍会结束于做爱。#!"
 hippogryph: "骏鹰"
 hippogryph_flavor: "#F 就像关于其起源的黑暗传说一样，被称为骏鹰的鹰马结合体拥有忧郁的气息和凶恶的性情。#!"
 manticore: "蝎尾狮"
 manticore_flavor: "#F 每种动物在食物链和生命循环中都有自己的位置，而蝎尾狮是这秩序的异端。#!"
 pegasus: "天马"
 pegasus_flavor: "#F 就像其翅膀上的宝石——蓝宝石、红宝石、祖母绿和紫水晶——一样野性和自然，天马是一种稀有和宝贵的生物。#!"
 peryton: "鹿鹰兽"
 peryton_flavor: "#F 鹿鹰兽奇怪又恰当地适用于危险动物这一词。它的鹿头有柔软的黑色、棕色或灰色毛皮。#!"
 phoboros: "福波斯"
 phoboros_flavor: "#F 福波斯看上去像是一只白色的小公牛。这生物的许多方面都把它象征性地与月亮联系起来，从而与世界的水联系起来。#!"
 roc: "大鹏"
 roc_flavor: "#F 大鹏是巨大的鸟类，斯看上去像是亮白色的有金色斑点的鹰。#!"
 seabishop: "主教鱼"
 seabishop_flavor: "#F 难以捉摸的“主教鱼”是一个谜团。一个人被搁浅发现了他们，这些实体隐藏在海浪之下，避开人类，避免与地表世界接触。#!"
 sea_serpent: "大海蛇"
 sea_serpent_flavor: "#F 大海蛇在大洋和大海和海湾的最深处出没，是远行船只的天灾。#!"
 shadhavar: "独角羚"
 shadhavar_flavor: "#F 独角羚是一种羚羊类动物，在风吹草低的平原上游荡。#!"
 simurgh: "西摩格"
 simurgh_flavor: "#F 德尔菲的神谕、山中老人和山洞里的三位命运之神都是全知隐士的典范，他们将自己与人类隔离开来。#!"
 umkovu: "姆科夫"
 umkovu_flavor: "#F 可怕的沙漠形成了它的形状，傲慢而紧缩的豺狼。为了寻找你，我摸索着穿过起伏最缓慢的夜晚。#!"
 unicorn: "独角兽"
 unicorn_flavor: "#F 在月光下排成一队，在萦魂空气中响亮嘶鸣。独角兽步入了海中。#!"
 vodayany: "伏地诺"
 vodayany_flavor: "#F 远古的生物从静止的湖泊阴暗的表面爬出来，在岸上留下让后来凡人沉思的痕迹。#!"
 wilde_beast: "蛮兽"
 wilde_beast_flavor: "#F 蛮兽结合了狮子最好地捕食技能和猎鹬犬温顺、忠诚的个性特征。#!"
 demonhound: "恶魔猎犬"
 demonhound_flavor: "#F 被深渊的灵体所控制，这些猎犬精瘦又阴险，一双炯炯有神的眼睛长在骷髅般的头上，燃火的下巴滴着沸腾的唾液。#!"
 imps: "小恶魔"
 imps_flavor: "#F 小恶魔是深渊中的下阶恶魔，是足智多谋的诡术师。虽然不喜欢直接战斗，但当他们被逼到墙角时，会出人意料地强韧。#!"
 lucifergia: "路西法兽"
 lucifergia_flavor: "#F 寻魂猎犬是魔鬼的执行者。当契约没有得到履行时，如果有必要，这些恶魔能追到天堂。#!"
 malebranche: "马拉布兰卡"
 malebranche_flavor: "#F 地狱的磨难者们有着永恒的时间来完善他们的技艺。人类身体和灵魂中没有什么弱点是他们不知道的。#!"
 war_servitors: "战争从者"
 war_servitors_flavor: "#F 作为深渊的战斗种姓，这些可怕的实体只向大恶魔俯首（通常是勉强地）。他们是力量的化身，是爪子、地狱火和魔邪武器的汹涌旋风。#!"
 the_unnamable: "不可名状"
 the_unnamable_flavor: "#F 地缚者可以在宇宙与混沌之间撕开一个小裂隙，并把一些东西拉来——一只过于怪异和危险而难以在此现实存在的生物。这召唤所召唤的生物总是危险的怪兽，具有可怕的杀伤力和对毁灭的渴望。#!"
 nervosa: "孽伏煞"
 nervosa_flavor: "#F 从疯狂中诞生，可以看起来像人、动物或奇异生物，甚至根本没有身体。#!"
 monster_under_the_bed: "床底下的怪物"
 monster_under_the_bed_flavor: "#F 有像巨大紫蛇般的东西，等待你的手或脚伸出床的边缘，这样它们就可以抓住你，还有一些只是坐在那里的小东西，在手电筒的光束之外（用一双巨大的黄色眼睛）回望着你。#!"
 nocnitsa: "梦魇妖"
 nocnitsa_flavor: "#F 这些从换生灵的噩梦中诞生的怪物是一些最令人恐惧的奇魅，通常直接或象征性地从它们的制造者最大和最怕的恐惧中获取它们的形态。#!"
 sprites: "小精灵"
 sprites_flavor: "#F 小精灵生于幻想和喜悦。它们通常很顽皮，最坏能是捣蛋鬼。#!"
 monsters: "怪物"
 monsters_flavor: "#F 怪物是给不符合妖精所知的奇魅生物类别的的活化奇魅的名字。#!"
 feral_chimera: "野奇魅"
 feral_chimera_flavor: "#F 大多数野奇魅是[UmbraGlossary('dreaming')]中的世俗野生动物的对应物：兔、猫、狼、马等等。#!"
 urban_legends: "都市传说"
 urban_legends_flavor: "#F 都市传说几乎和梦魇妖一样多样化，像孽伏煞一样不可预测。它们可能表现为下水道中的鳄鱼，屋内作祟的骚灵，或介于两者之间的任何东西。#!"
 sidhe_wild_hunt: "仙族狂猎"
 sidhe_wild_hunt_flavor: "#F 狂猎是永契堡领主的选民，是换生灵中最好的骑手，是伟大狩猎中的杰出骑士。他们是妖精可以释放给注定会失败的敌人的最优秀的战士之一，甚至连旧神都害怕他们的马匹踩踏。#!"
 troll_berserkers: "巨魔狂战士"
 troll_berserkers_flavor: "#F 巨魔比最高的人类还要高两个头，初看，他们与人类只有身材上的不同。他们的脸就像不太文明的民族的人们那样粗犷而棱角分明。他们的头发很长，每只耳朵上都挂着辫子，直到生长到背的中部，头发永远不会被消剪。#!"
 nuckelavee: "海人马"
 nuckelavee_flavor: "#F 海人马是一种海洋生物，其上半身是人形，下半身则像马一样。虽然海洋版的半人马可能会让某些人觉得滑稽，但这个生物却不是这样的。海人马有一种令所有懦弱的人都害怕的能力：没有皮肤，取而代之的是一团搏动的器官和跳动的血液。因此，当人们不幸目睹这样的生物从海浪中升起时，自然会感到恐惧。#!"
 duergar: "灰矮人"
 duergar_flavor: "#F 灰矮人是生活在山丘上的居民。他们大约只有一到两英尺高，但除此之外，他们看起来像是有长胡子和锐利眼神的人类男性。尽管个头小，但灰矮人拥有最强壮的男人的力量和同样具有火爆脾气。灰矮人极度爱护自己的领土，会对任何侵犯他们领地的人会采取攻击行动。唯一能抵御他们怒火的方法就是乞求他们的款待，并提供礼物作为交换。#!"
 skoggra: "木妻"
 skoggra_flavor: "#F 木妻对人类可以相当友好。虽然外表看起来充满野性，但是她们都是漂亮的女性。她们的下身包裹着树皮，树叶和春花，却有着美丽的脸庞，像苔藓一样绿的眼睛，和缠绕在肩膀上的棕色头发。#!"
 ovinniks: "黯火精"
 ovinniks_flavor: "#F 黯火精乍看之下，似乎与棕精灵非常相似。他们住在谷仓或马厩里，特别喜欢动物。事实上，他们被认为有能力用自己的语言与动物交谈。然而，相似性到此为止。棕精灵一般都很乐于助人，只有在他们觉得自己不受重视时才会生气，而黯火精则是彻头彻尾的恶毒生物。虽然他们不会做任何伤害动物的事情，但对人类就无所谓。#!"
 brownies: "棕精灵"
 brownies_flavor: "#F 这些乐于助人的生物生活在欧洲各地的家庭里和周围。它们只会在晚上出来，在家里做一些必要的家务，从清洁和擦洗到抛光和缝补。就在他们被发现的那一刻，他们便会消失得无影无踪，这让大多数人想知道某只破烂的靴子到底是怎么修好的，或者是谁给木箱填的料。#!"
 night_elves: "暗夜精灵"
 night_elves_flavor: "#F 巴伐利亚的暗精灵长期以来成为当地村庄的骇人传说。他们的习性和栖息地在很大程度上不为人知。有关暗精灵存的讲述，只来自于那些发现过他们所居住的树顶村的人。介于很少有人能在这种经历中完好无损地存活下来，这间接损害了这些故事的可信度。#!"
 goblins: "哥布林"
 goblins_flavor: "#F 这些魔物般的野兽生活在欧洲大部分地区的黑暗森林中。它们看起来就像畸形的儿童玩偶，在泥炭中放置数月后复活，充满了人肉的兴趣。#!"
 malicious_faerie: "恶毒妖精"
 malicious_faerie_flavor: "#F 这些可憎的生物是人类的灾祸。他们除了制造恶作剧之外啥也不想，从无害的恶作剧到摧毁村庄，还更喜欢让迷路的旅行者走向错误的道路，变出毒药来“净化”井水，甚至带领着一队哥布林袭击商人的营地。#!"
 chitterers: "尖鸣兽"
 chitterers_flavor: "#F 由两只狼的后躯组成，粉红色的无毛身体上布满了几十张怪叫的鸟嘴；尖鸣兽是有史以来完成的最令人不安的睿魔尔作品。#!"
 reapers: "收割者"
 reapers_flavor: "#F 收割者，因其两只被设计用于完美地斩首的大而有力的前肢而得名，是一种人形大小的甲虫，本该是脸的位置上有一串争斗的、嘶叫的老鼠头。#!"
 skin_eaters: "食皮者"
 skin_eaters_flavor: "#F 有着贪婪胃口的像跳蚤一样微小的昆虫，食皮者被设计成能听从简单的命令，并渴望吞噬皮肤而不是血。#!"
 crocodiles_flavor: "#F 短吻鳄、凯门鳄和鳄鱼有长长的身体和粗糙的、像树皮一样的皮，很容易被误认为是腐烂的木头，这是一个致命的错误。#!"
 bears_flavor: "#F 熊用它粗壮的腿像人一样直立，它居住在寒冷、孤独的地方——邻水（和鱼）的茂密森林里。#!"
 lions_flavor: "#F 拥有金色外皮和长而饱满的鬃毛，狮子是一种宏伟的生物。#!"
 tigers: "老虎"
 tigers_flavor: "#F 这些美丽的动物巨大、圆滑、轻巧，在丛林的阴影中迅速移动，用它们的条纹进行潜伏。#!"
 bulls_flavor: "#F 牛在人类文明的历史中发挥了至关重要的作用，在人类的神话中也是如此。#!"
 horses: "马"
 horses_flavor: "#F 这些野兽高大，肌肉发达，有长长的拱形脖子，聪明的眼睛，以及流动的鬃毛和尾巴，看起来具有着一切生命的基本要素。#!"
 camels_flavor: "#F 骆驼是阿拉伯的劳动马，一种坏脾气的野兽，除了最强烈的权威之声外，它通常不理会其他声音。#!"
 stags_flavor: "#F 鹿的四肢纤细，蹄子小得不象话，眼睛大而有神，很容易看出鹿是如何得到它们像精灵那般的声誉。#!"
 goats: "山羊"
 goats_flavor: "#F 山羊比野羊更瘦甚至更蓬松，但却有令人难以置信的敏捷性。#!"
 rams: "羊"
 rams_flavor: "#F 绵羊是脸色平淡、毛发卷曲的动物，只要在能吃草的地方就能生活。#!"
 boars_flavor: "#F 野猪比家猪大（肩高三至四英尺），更粗，而且比家猪卑鄙得多，是脾气不好的肉球。#!"
 monkeys: "猴"
 monkeys_flavor: "#F 从非洲和南美洲的丛林到亚洲的山区，人猿投下的阴影与人类惊人地相似。#!"
 cats_flavor: "#F 猫科动物是行走的谜，是接受了人类壁炉的一点野性。#!"
 foxes_flavor: "#F 狐狸是一种狡猾的动物。它们不是通过威胁或蛮力来达到目的，而是通过狡猾和敏捷的思维。#!"
 raptors: "猛禽"
 raptors_flavor: "#F 猛禽——鹰、隼、雕——对鸟类就像狮子和老虎对野兽一样。#!"
 gooses: "鹅"
 gooses_flavor: "#F 在空中或在水上滑行，天鹅是美丽和优雅的缩影。#!"
 owls: "猫头鹰"
 owls_flavor: "#F 猫头鹰拥有柔软的羽毛，可以无声无息地飞行，巨大而敏感的眼睛让它们在几乎完全黑暗的环境中也能看到东西，它们是夜空的主人。#!"
 ravens_flavor: "#F 大型鸟类，渡鸦，张开翅膀时像一件优雅而不祥的斗篷。#!"
 toads: "蛙"
 toads_flavor: "#F 青蛙和蟾蜍曾被认为是自发地从泥土中生长出来的。#!"
 golems: "魔像"
 golems_flavor: "#F 在欧洲，关于用棍子、石头、粘土、泥土甚至是小麦制成的怪物的故事充斥着当地的传说。#!"
 guardians_flavor: "#F 强大教团的祭司、实力强大的秘密巫师，甚至少量的民间女巫，都知道把力量注入通常没有生命的物体上，以守护他们的密所。#!"
 homunculus: "人造人"
 homunculus_flavor: "#F 每个人造人都是其创造者的标志性作品，拥有对其创造者的目标和愿望以及产生它的魔法理论的真正认知。#!"
 sebau: "塞保"
 sebau_flavor: "#F 塞保，时刻准备为制造者献身的泥土仆人#!"
 hidden: "隐尸"
 hidden_flavor: "#F 隐尸是一种高度独立和自发行动的活尸，通常可以冒充人类——与其他活尸不同。#!"
 walker: "行尸"
 walker_flavor: "#F 在微妙的隐尸和实在卑劣的跛行尸之间的中间点，行尸缓慢地腐烂，尽管大多数有足够的意识用香水、衣服和类似的东西来掩盖他们的缺陷。#!"
 shambler: "跛行尸"
 shambler_flavor: "#F 他们是蹒跚的、液涌的、腐烂的尸体，不应该活着却活着。它们之所以被命名，是因为它们在移动时摇晃和抽搐，因为它们腐烂的肌腱和腐烂的韧带无法正常移动它们的身体。#!"
 skeletons: "骷髅"
 skeletons_flavor: "#F 那些没有新鲜材料可供利用的人仍然可以把一些骨头串起来，重新活化。活化的骷髅战士是一道令人不寒而栗的风景。#!"
 dragons_teeth: "龙牙兵"
 dragons_teeth_flavor: "#F 由于无法完全依靠人类走狗，许多术士都能随身携带他的守卫，把他们藏在袋子里，直到需要为止。一个简单的袋子加上一把犬齿，就能装下一支由这些不洁战士组成的军队——每颗牙齿一旦被扔到地上，就会长出一个完整的骷髅战士，准备按照主人的吩咐进行撕咬、残害和杀戮。#!"
 yulan_jin: "盂兰人"
 yulan_jin_flavor: "#F 盂兰人是那些灵魂被[UmbraGlossary('yomi_wan')]折磨得支离破碎的[GetTrait('kueijin').GetName( GetNullCharacter )]，因此无法居在自己的身体里。#!"
 ban_ren_guei: "半人鬼"
 ban_ren_guei_flavor: "#F 半人鬼，或称半魔人，是睡诱忌灵和凡人的后代。他们经常受魔虎的命令和束缚，为魔虎服务。#!"
 unwholesome_nightmare_inducing_ghost: "不正梦魇鬼"
 unwholesome_nightmare_inducing_ghost_flavor: "#F 这些生命是一种怨灵，是幽灵堕给心魔时剩下的强大的鬼由，魔虎控制，他们在敌人的梦境中激发恐怖。#!"
 unrighteous_cult_leading_ghost: "不义教邪鬼"
 unrighteous_cult_leading_ghost_flavor: "#F 在西方被称为幻影的一种鬼魂，这些阴魂乐于在活人中取得崇拜信仰，魔虎经常为被这种灵魂欺骗的凡人找到创造性的用途。#!"
 twice_crimson_tigers_maa: "双赤虎帮"
 twice_crimson_tigers_maa_flavor: "#F 出生于南方的魔虎特别好斗和好战。他们是$pod_kueijin$的先锋。#!"
 polong_maa: "泼隆"
 polong_maa_flavor: "#F 尽管它可以拥有吸血鬼想要的任何形态，一个被创造的泼隆总是一种由软骨和生肉组成的生物，智力有限。肉体神胎的女主人可以远程控制泼隆并看到它们所看到的一切#!"
 hungry_red_dragons_maa: "贪婪赤龙"
 hungry_red_dragons_maa_flavor: "#F 腾龙舞勇众皆精通龙舞战技。披耶·帕永被誉为有史以来最伟大的赤龙，世间无数人试图效仿她的风采。#!"
 wayang_kulit_maa: "哇扬皮影戏"
 wayang_kulit_maa_flavor: "#F 一种[Glossary('庞南加兰','podgloss.penangallan')]的战术，运用肉神体扰乱敌人视听。其名源自爪哇的皮影戏术。#!"
 lianfang_maa: "莲房"
 lianfang_maa_flavor: "#F 战火纷飞之际，华鹤道可召集屋室与游离的$pod_kueijin$结成临时联军，共御强敌。#!"
 heaven_hell_legion_maa: "天魔军团"
 heaven_hell_legion_maa_flavor: "#F 尽管建军尚浅，马将军麾下的严整军团却已是华夏$pod_kueijin$中最为精锐高效的兵锋之一。#!"
 triumphant_hares_maa: "凯旋兔儿"
 triumphant_hares_maa_flavor: "#F 这是对那些毫无真本事的$pod_kueijin$武者的一种戏谑称呼。每当局势危急，华鹤道便会将那些桀骜无状、技艺拙劣之辈派往必死之地。#!"
 majestic_warriors_maa: "庄严力士"
 majestic_warriors_maa_flavor: "#F 华鹤道精英以那位神秘却备受尊崇的[Glossary('菩萨','podgloss.bodhisattva')]命名，乃是沙场之上纪律严明的均衡之师。#!"
 dark_jade_lovers_maa: "暗玉情人"
 dark_jade_lovers_maa_flavor: "#F 千呤道的死亡化身，精于暗杀，百变易容。#!"
 still_earth_flowers_maa: "静土花"
 still_earth_flowers_maa_flavor: "#F 坚如磐石，亦善变幻，千呤道战士欲化身大地之灵。#!"
 jade_mask_ghost_killers_maa: "玉面斩鬼者"
 jade_mask_ghost_killers_maa_flavor: "#F 有些千呤道肩负起引渡幽魂与妖灵离去的使命，渐渐成为对抗冥界爪牙的高手。#!"
 xiang_qi_masters_maa: "象棋大师"
 xiang_qi_masters_maa_flavor: "#F 骨花视战争如棋局，善用棋盘上的每一枚棋子谋利。#!"
 black_pearl_masters_maa: "黑珠大师"
 black_pearl_masters_maa_flavor: "#F 这些战士以骨花最尊贵的[Glossary('罗汉','podgloss.arhat')]为名，是为数不多真正将求知渴望献给战艺修炼的骨花精英。#!"
 keepers_black_metal_maa: "黑金卵守护者"
 keepers_black_metal_maa_flavor: "#F 那些真正掌握阴之奥秘的骨花几乎能免疫痛苦，毫无畏惧，皆为战场上无可估量的利器。#!"
 kataragama_chosen_maa: "卡塔拉伽马选民"
 kataragama_chosen_maa_flavor: "#F 这些战士以崇高的涅凤焱祖师为名，效仿他在斯里兰卡对抗恶狱吸血鬼的凯旋战役。#!"
 jade_warriors_maa: "玉勇"
 jade_warriors_maa_flavor: "#F 玉勇乃掌握护持[Glossary('心法','podgloss.dharma')]所需身心技艺的门徒。至此境界，可被征赴前线。#!"
 lotus_mist_warriors_maa: "雾莲伏兵"
 lotus_mist_warriors_maa_flavor: "#F 凭借唯有其[Glossary('心法','podgloss.dharma')]弟子方知的秘术，这些战士借助环境掩护，几近隐形。#!"
 children_sita_maa: "悉多之子"
 children_sita_maa_flavor: "#F 被冤屈流放的女神之子，唯有凭借教团能买得起的最良骏马与装备方能踏上战场。#!"
 celestial_guard_maa: "天卫"
 celestial_guard_maa_flavor: "#F 天族再世神祇须由其最虔诚且技艺超群的信徒时刻守护。#!"
 kabalyeru_maa: "卡巴列鲁"
 kabalyeru_maa_flavor: "#F 当一名求道者通过战斗证明自己时，他们将成为卡巴列鲁，从此被视为教派中合格的战士。#!"
 fighting_cloud_maa: "战云大师"
 fighting_cloud_maa_flavor: "#F 此道大师可刺破笼罩世界的幻象帷幕。施展此技时，他们能如从未存在般攻退自如。#!"
 illusion_shattering_maa: "破幻击"
 illusion_shattering_maa_flavor: "#F 内道大师通晓虚实。他们运用秘法，一击即可驱散不属于此界的生灵。#!"
 disciples_riyan_maa: "里扬门徒"
 disciples_riyan_maa_flavor: "#F 青帷先祖曾历经险阻重重的漫长旅程。这些武者通过磨砺自身适应极端环境，向他的试炼致敬。#!"
 shikome_assassin: "泉津"
 shikome_assassin_flavor: "#F 泉津是阎魔的冰山美人般的刺客和间谍，[Glossary('艾玛·欧','podgloss.emmao')]的保镖和嫔妃。他们都曾是$pod_kueijin$，是他亲自奴役来为他服务的。#!"
 kumo_huntress: "蜘蛛精猎手"
 kumo_huntress_flavor: "#F 瘦弱而苍白，[UmbraGlossary('kakuri')][UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]的蜘蛛精居民即使在人形形态下也像蜘蛛。#!"
 raksha_of_ravana: "罗波那罗刹"
 raksha_of_ravana_flavor: "#F 罗刹经常到中原进食和做生意，并偷偷摸摸地在[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]寻找供品给兰卡。#!"
 the_children_of_tou_mou: "斗姆之子"
 the_children_of_tou_mou_flavor: "#F 块状的、驼背的、黑铁的、红眼的，一半是人形的自动装置，一半是昆虫，[Glossary('斗姆','podgloss.toumu')]的子嗣们被设计用来在阎魔女王的界域的恶劣条件下生存。#!"
 mikaboshis_demons_of_iron_and_violence: "瓮星的钢铁与暴力之魔"
 mikaboshis_demons_of_iron_and_violence_flavor: "#F 寻找目标。终结目标。在终结的过程中尽可能多地造成不必要残害。#!"
 shinjuku_undercity_scavengers: "新宿城下清道夫"
 shinjuku_undercity_scavengers_flavor: "#F 没有人能活着离开[Glossary('妖邪之城','podgloss.wickedcity')]。大多数人在街头和体力劳动之间来回奔波，直到他们最终精疲力尽（不久之后，便消亡）。但对于那些设法从残酷的磨砺中挣扎出来的人来说，那无法避免的堕落会更加糟糕。新宿不是一个友善的情妇#!"
 fat_striders_of_the_hell_of_boiling_oil: "滚油地狱的肥胖飞兽"
 fat_striders_of_the_hell_of_boiling_oil_flavor: "#F 从外表看，这些生物有点像蚊子幼虫和某种特别邪恶的蝗虫或蝉的幼体杂交的产物，附带着“水黾”纤细的腿。肥足虫用其闪电般快速伸缩的吻部末端的钢齿口器进行攻击#!"
 wu_huas_corpse_tiger_demons: "乌邝的尸虎魔"
 wu_huas_corpse_tiger_demons_flavor: "#F 尸虎魔似乎是巨大的（三米高）肌肉发达的男女，有着虎头虎尾，又长又黑的可伸缩的虎爪，而不是手。#!"
 kani_no_jingoku: "地狱蟹"
 kani_no_jingoku_flavor: "#F 地狱蟹是七大火海的居民，是神秘的阎魔女王——珍珠女帝的仆人。#!"
 generic_servitor: "通常从者"
 generic_servitor_flavor: "#F 在[UmbraGlossaryLocalized('yomi_wan','幽冥地狱')]，不是每个人都能成为引人注目和独一无二的邪恶仆从。必须有人担任中层怪人的身份，担任蹒跚怖物，担任组成[UmbraGlossaryLocalized('yomi_wan','幽冥地府')]军团的普通折磨者。#!"
 the_unfaced_ones_maa: "无面者"
 the_unfaced_ones_maa_flavor: "#F 无面者是游荡在玄龙之路上过久的怨灵残骸，裹着破布，扭曲畸形。尽管形貌腐朽，无面者却迅捷无比，常被[Glossary('阎魔王','podgloss.yamaking')]用作看门犬。#!"
 the_guardians_yomi_maa: "绝壁守卫"
 the_guardians_yomi_maa_flavor: "#F [Glossary('阎魔王','podgloss.yamaking')]专为守护幽冥世界的绝壁而创造了这些精魂，它们是中土掠食者与幽冥恶魔的恐怖结合体。典型的守卫以六条覆鳞利爪移动，蜿蜒的身躯覆盖着黑玉甲片。#!"
 shades: "渊影"
 shades_flavor: "#F 最强大的怨灵之一，渊影是被扔进[UmbraGlossary('tempest')]中的死灵，其被卷入死涡或大死涡中，或在畏途中失去自我。#!"
 wraiths_flavor: "#F 从[UmbraGlossaryLocalized('shadowlands','冥界')]召唤出来的形体化死灵。#!"
 spectres: "怨灵"
 spectres_flavor: "#F 从[UmbraGlossary('pod_realm_labyrinth')]召唤而来的形体化怨灵。#!"
 the_reavers_of_ur: "乌尔的掠夺者"
 the_reavers_of_ur_flavor: "#F 一群可怕的起伏不定的灰色形体，将残酷地分尸敌人。#!"
 soldiers_of_the_emperor: "皇帝禁兵"
 soldiers_of_the_emperor_flavor: "#F 士兵们在玉之帝国享有巨大的威望，因为他们保卫帝国，对抗恶魔、怨灵和其他入侵者。#!"
 bureaucrats_of_jade_palace: "玉宫官僚"
 bureaucrats_of_jade_palace_flavor: "#F 居住在帝皇暴风笼罩的皇宫大厅和庭院里的大臣们是独特的，是整个帝国最强的密谋者和官僚。#!"
 demon_jailer: "化魔狱卒"
 demon_jailer_flavor: "#F 地狱中的狱卒、拷问者和监工都曾利用打磨力量将自己塑造成传说中的恶魔。#!"
 phantasies: "幻念"
 phantasies_flavor: "#F 类似于活物的灵质体存在，类似与鲸鱼或鸟类等。幻念可能有足够的智慧，可以与人交流，有时还会在[UmbraGlossary('tempest')]中帮助死灵。就像[Glossary('皮囊之地','game_concept_skinlands_desc')]的动物一样，有些动物对人类充满敌意，有些则很友好，有些则最好不要靠近。#!"
 deliriums: "谵念"
 deliriums_flavor: "#F 看起来是经过改造的动物灵质体，如有翅膀的马或有触角的猫。谵念往往比幻念更聪明、更强大。#!"
 legendaries: "传奇"
 legendaries_flavor: "#F 模仿某种神兽（如凤凰）的灵质体。传奇往往聪慧、强大、稀有。#!"
 angelics: "类天使"
 angelics_flavor: "#F 正如他们的名字所示的那样，类天使以犹太教–基督教传统中美丽的天使形象出现：长袍、光环和翅膀是常见的装饰，但有些类天使可能会采取更加雌雄同体或闪烁的形态。他们通常在[UmbraGlossary('tempest')]中飘荡，帮助死灵完成旅程。#!"
 demonics: "类恶魔"
 demonics_flavor: "#F 顾名思义，类恶魔是一种样貌丑陋、色欲或两者兼而有之的生物。类恶魔的唯一目的似乎就是折磨、奴役或毁灭它们遇到的任何死灵。有些类恶魔可以暂时化身为类天使，在显露真身并施以惩罚之前引导死灵。#!"
 archangelics: "类大天使"
 archangelics_flavor: "#F 类大天使最初可能与类天使相似，但在某些时候会变成炽热的形态，令人望而生畏。他们通常手持宝剑或审判卷轴，并会使用特殊的呵斥引出死灵的黯影，以摧毁它。然后，死灵的真灵会被类大天使带走，用途不明，但人们怀疑真灵在锻造类大天使的火焰之剑时发挥了作用。#!"
 archdemonics: "类大恶魔"
 archdemonics_flavor: "#F 类大恶魔与类大天使相反，他们会试图强化而非净化死灵的黯影。起初，他们会向死灵传授新的冥法，但只会传授能让死灵获得惧念的技能。最终，类大恶魔会消磨受害者的意志，让黯影获得控制权，使他们成为[UmbraGlossary('oblivion')]的仆人。#!"
 djinn: "类巨灵"
 djinn_flavor: "#F 一些类天使和类恶魔化身为灯神或火巨灵，似乎拥有这些生物所拥有的力量。他们可以为死灵提供巨额财富——当然是冥河城硬币——以及其他物质财富，如宫殿和飞毯遗器。这些财富会让死灵付出沉重的代价。#!"
 wyrds: "诡异"
 wyrds_flavor: "#F 与活物或传说生物没有任何类似的灵质体。诡异一般都是异类；即使他们有足够的智慧与死灵交流（而大多数的智慧都高得吓人），他们的要求或请求一般都过于玄妙，没有任何意义。#!"
 ailerons: "空翼"
 ailerons_flavor: "#F 空翼的身体并不强壮；一张充满钩子的吸盘大嘴、一条长长的鞭状尾巴和一双用来在[UmbraGlossary('tempest')]气流中滑翔的大翅膀就是它们的全部。它们瘦小的身体和绚丽的色彩让它们在风暴卷起的碎片中几乎无所遁形。#!"
 cerements: "墓泥"
 cerements_flavor: "#F 墓泥表现为一大团灵质，整体表现出脉动。墓泥是虚诡中比较善良的一种，很少会去惹麻烦。然而，如果死灵遇到了这东西，他们的日子就不好过了；不幸被墓泥缠住的死灵每被困一天，就会失去一年的记忆。墓泥甚至能将受害者的[Fetters|E]和炽情分解出来，并将它们当作自己的记忆使用。最终，被俘虏的死灵自己也会变成墓泥。#!"
 kraken: "克拉肯"
 kraken_flavor: "#F 克拉肯之所以可怕，是因为它的体型庞大；事实上，它的体型是如此之大，以至于从未有任何死灵报告说见过它的全貌。人们知道它有触手和巨大的眼睛，但对它的外形和身体结构却一无所知。克拉肯也是相当古老的生物；据冥河城大图书馆的报告，在卡戎完成在泣绝岛建立他的伟大王国之前，克拉肯就已经存在了。#!"
 mourners: "送葬者"
 mourners_flavor: "#F 送葬者乍一看很像摆渡人披着斗篷的身影。不过，送葬者没有提着灯笼和镰刀，而是戴着大量沉重的锁链。他们的脸被笼罩在斗篷的黑暗中，看不见。他们总是成群结队地旅行，一个特定群体中的所有送葬者都被锁在其中最强大的人身上。与许多[UmbraGlossary('tempest')]生物不同，送葬者出现时似乎总是有一个特定的目标，从[UmbraGlossary('tempest')]向[UmbraGlossary('shadowlands')]进军。#!"
 shroudrippers: "尸幕撕裂者"
 shroudrippers_flavor: "#F 尸幕撕裂者是虚诡中最难以捉摸的一种，很难发现，也几乎不可能捕捉和检查。虽然还没有对它们进行详细的研究，但人们普遍认为尸幕撕裂者拥有小而紧凑的身体，十根“手指”之间有薄薄的蹼，使它们能够飞行。蹼上还有小喷嘴，可以喷出酸液，手指的末端各有一个非常锋利的爪子。不过，尸幕撕裂者裹非常脆弱；被摧毁的尸幕撕裂者的[Corpus|E]中会在几秒钟内融化成一堆不成形的灵质粒子。#!"
 tindelhounds: "廷德罗斯猎犬"
 tindelhounds_flavor: "#F 顾名思义，廷德罗斯猎犬表面上很像狗。然而，由于[UmbraGlossary('oblivion')]的污染，这些狗的脑袋、嘴巴和眼睛都比普通犬类多得多；最多的是十张嘴巴和十五只眼睛。它们的体型也比一般的狗大得多，肩高约15英尺。除了大嘴和体型之外，它们还长着倒钩而非皮毛，从嘴里喷出绿色火焰，并在身后留下烟灰痕迹。如果这还不够的话，廷德罗斯猎犬还相当聪明，能够很快适应异常情况。幸运的是，它们中的大多数都避开了[UmbraGlossary('shadowlands')]，生活在[UmbraGlossary('tempest')]的深处。#!"
 shadow_beasts: "影兽"
 shadow_beasts_flavor: "#F 由血魔法从深渊召唤出的形体化影兽。#!"
 hungry_shade: "饥饿渊影"
 hungry_shade_flavor: "#F 使用血魔法从深渊召唤出的形体化渊影#!"
 mist_dragons: "雾龙"
 mist_dragons_flavor: "#F 在这些魔法雾气的深处，有比猫大不了多少的小龙。#!"
 giants_flavor: "#F 他们有巨大的身体，通常超过20英尺高，外表类似于肌肉发达的人类，有着粗糙的石肤，促使人们认为他们可能是岩石元素妖的远亲。#!"
 tarrkel: "塔克尔"
 tarrkel_flavor: "#F 桥底的深渊孕育着人类无法理解的扭曲、噩梦般的生物，这些生物以痛苦为生，以活人的血肉为生。#!"
 fire_salamanders: "火蝾螈"
 fire_salamanders_flavor: "#F 这些生物虽然类似于它们的凡俗表亲，但却是魔法生物，主要生活在自然界之外的妖精界域。#!"
 firebirds: "火鸟"
 firebirds_flavor: "#F 火鸟是一种来自东欧斯拉夫地区的色彩艳丽的生物。#!"
 aughisky: "水马"
 aughisky_flavor: "#F 黑暗的恶魔之马在十字路口出没，或在咸水池塘和溪流附近徘徊。#!"
 sirens: "塞壬"
 sirens_flavor: "#F 海上的长发诱惑者，塞壬引诱水手在看不见的暗礁上或在危险的海峡里走向水的坟墓。#!"
 incubus: "淫魔"
 incubus_flavor: "#F 淫魔是诱惑和欲望的恶魔的男性形式，几乎所有的文化都有（尽管名称不同）。#!"
 succubus: "魅魔"
 succubus_flavor: "#F 魅魔是诱惑和欲望的恶魔的女性形式，几乎所有的文化都有（尽管名称不同）。#!"
 pelesit: "巫蛊"
 pelesit_flavor: "#F 用自己血肉建造的微小生物，用于探测或其他多种用途。#!"
 vampires_hunters: "吸血鬼猎人"
 vampires_hunters_flavor: "#F 弩是猎杀吸血怪物的首选武器。还有什么更好的方法能让木桩直击要害呢？#!"
 demons_hunters: "恶魔猎人"
 demons_hunters_flavor: "#F 他们接受过抵抗腐败和驱散幻觉的训练，能无情地打击大敌的爪牙。#!"
 monsters_hunters: "怪物猎人"
 monsters_hunters_flavor: "#F 对于普通人来说，怪物般的化形者太可怕了。幸运的是，他们不是普通人。#!"
 dazbog_hunters: "达兹博格战士"
 dazbog_hunters_flavor: "#F 这些英雄是伟大的太阳战神的继承者，他们所到何地都能杀死强大的怪物。#!"
 dragons_flavor: "#F 哦，龙\n上天力量的象征。#!"
 minion_of_the_divine: "蒙福战士"
 minion_of_the_divine_flavor: "#F 在你神圣灵光的激励下，这些骄傲的战士像天使一样战斗。#!"
 hoplites: "希腊重装步兵"
 hoplites_flavor: "#F 带著你的盾牌回来，或是在盾牌上被抬回来。#!"
 companion_cavalry: "伙友骑兵"
 companion_cavalry_flavor: "#F “如果你到达世界的尽头还会做什么？”\n“我会反过来去征服另一半。”#!"
 envy_dragon: "嫉妒"
 envy_dragon_flavor: "#F 嫉妒的本体是一条巨大的海蛇，比任何船只都要长。青面獠牙的龙头位于庞大的蛇身顶端，蛇身有两对爪鳍。嫉妒的身体光滑而柔软，它喜欢多次缠绕船只，让船上的船员和货物无路可逃，最后全部送入深海。#!"
 gluttony_dragon: "暴食"
 gluttony_dragon_flavor: "#F 这条又大又胖的蛇盘绕在离它出生的地方不远的黑森林北部。这只煤黑色的蜥蜴不需要走很远就能找到一个适合它需要的家。不像他的一些亲族，他没有翅膀，因此不能飞。然而，他在毒蛇形态下的速度足以弥补他的缺陷。他能在短短几分钟内快速穿过大片的土地，在身后留下大片的灰尘和碎片。#!"
 greed_dragon: "贪婪"
 greed_dragon_flavor: "#F 贪婪之蛇逃入意大利山区，寻找新的家园。很少有人看到这只黑色巨兽划破黑夜。没有人看到他化身为乞丐来到这里，向人们索要礼物，他那银色的舌头总能让最拮据的人松开钱袋。很快，他就积累了足够的财富，开始做生意。这一次，他再次用他的甜言蜜语说服了那些不知情的人，为他的企业吸引了合作伙伴。他们的财富被他收走的同时也在增长。没过多久，他就成为了商业界的一股势力。#!"
 lust_dragon: "色欲"
 lust_dragon_flavor: "#F 这只红色巨兽在出生后就飞上了天空，越过海水来到了不列颠群岛。色欲之蛇是一只纤细柔韧的龙兽，体型不像某些同类那么大，但仍然十分威猛。它的翅膀有一半体长长。它闪闪发光的鳞片像红宝石一样红，如果不是长着像人一样大的獠牙和长矛一样长的爪子，它就是一只很有吸引力的生物。#!"
 pride_dragon: "傲慢"
 pride_dragon_flavor: "#F 傲慢之蛇的巢穴位于罗马地下墓穴的深处，他的仆人们早已将隧道封死。一扇厚重、上锁的门是唯一可用的出入口；门外的走廊通向他现在人类形态的宫殿式住所。他在这里与上流社会的人打交道，总是小心翼翼地表现得比别人更英俊一点，衣着更得体一点，令人惊讶的是，举止也更得体一点。他把大部分模拟凡人的事务都交给了值得信赖的人类仆人——通常是被骗的人类仆人。#!"
 sloth_dragon: "怠惰"
 sloth_dragon_flavor: "#F 怠惰是一只巨大的、脏兮兮的棕色龙蛇，完全不在乎自己的外表。与他的亲戚不同，他没有翅膀或四肢。它是一条长着龙头的巨大肥蛇。正如它的名字一样，它的身体像是一圈坚实的爬行动物绳子，光滑的表面只有偶尔被还在消化的食物块突出。#!"
 wrath_dragon: "暴怒"
 wrath_dragon_flavor: "#F 当暴怒之蛇来到这个世界时，她的敌意震撼了大地。她的侵略和复仇之念四处蔓延，直到为她的愤怒找到一个心甘情愿的宿主。匈奴人横扫欧洲，满足了这头凶兽的脾气。她沉睡在俄罗斯西部的冰霜之下。当她下次醒来时，一定会有屠杀的气息。#!"
 mob_maa: "乱民"
 mob_maa_flavor: "#F 一群几乎没有武装的凡人被欺骗或说服，为他们永生的上主献出生命。#!"
 poachers_maa: "偷猎者"
 poachers_maa_flavor: "#F 来自荒野的流氓被更不道德的雇主雇佣来为他们作战。#!"
 outriders_maa: "掠袭骑兵"
 outriders_maa_flavor: "#F 精通骑术且毫无道德顾忌者在夜之统治者眼中乃稀缺之才#!"
 rabble_maa: "民兵"
 rabble_maa_flavor: "#F 草叉也算是一种长矛，不是吗？乞丐不能挑三拣四。#!"
 retainers_maa: "家臣"
 retainers_maa_flavor: "#F 任何有自尊的不朽领主的凡人卫士。通常报酬很高（或被支配），以确保他们的忠诚度。#!"
 disgraced_nobles_maa: "失宠贵族"
 disgraced_nobles_maa_flavor: "#F 贵族的幼子们因为性格可疑和不光彩的伙伴而失去了他们的荣誉。#!"
 neteru_medjay: "守护者奈特鲁"
 neteru_medjay_flavor: "#F 重生战团的“辅助部队”大多从不朽木乃伊在各个时代培育的庞大王朝树的熟人中征召而来。#!"
 neteru_slingers: "奈特鲁投石兵"
 neteru_slingers_flavor: "#F 地位低下的投石索在历史上击倒了许多强大的战士。凭借木乃伊训练出的这些奈特鲁的技能，他们将再次做到这一点。#!"
 neteru_khopesh: "奈特鲁镰剑守卫"
 neteru_khopesh_flavor: "#F 法老的精英卫队通过这些由木乃伊亲自训练的奈特鲁战士重生了。#!"
 neteru_tomb_guard: "奈特鲁陵寝守卫"
 neteru_tomb_guard_flavor: "#F 被选中守护不朽领主安息的奈特鲁是精英守卫者，多年来击退肆无忌惮的盗墓者磨练了他们的技能。#!"
 flagellants_maa: "鞭笞者"
 flagellants_maa_flavor: "#F 为了上帝的天使的荣耀而流血和牺牲……还有什么比这更值得的事业吗？#!"
 chanters_cultists: "不洁合唱团"
 chanters_cultists_flavor: "#F 他们歌唱着他们的主人将带来的救赎……以及他们敌人不可避免的厄运。#!"
 silver_hunters: "白银猎人"
 silver_hunters_flavor: "#F 由银色迷障构成的幻象，这些梦界斗士如银色光芒的游侠般穿越森林。他们源自夜晚猎杀可怕野兽的猎人的故事，他们猎捕最危险的猎物，并将恐惧植入盖亚之子的心中。#!"
 coffin_makers: "棺材制造者"
 coffin_makers_flavor: "#F 据说，这些斗士的荆棘会冲刷并燃烧疯狂的原初谋杀犯肮脏血统的鲜血，从而为饮血者的阴影带来灭绝。就像被培育来杀戮的玫瑰花丛一样，他们和他们的猎物一样渴望鲜血。#!"
 guardian_angels: "守护天使"
 guardian_angels_flavor: "#F 根据童话故事塑造而成，父母告诉他们的孩子有特殊的保护者来守护他们，命运的奇异转折使得来自深渊的奇怪生物特别厌恶这些光之梦界战士。#!"
 unfettered_phantoms: "无形幻影"
 unfettered_phantoms_flavor: "#F 它呈现出看到它的可怜灵魂视为‘未竟之事’的任何形态，妖精认为这些战士的形状特别让死者感到不安，因为他们的形状非常可怕，会让死灵尖叫着逃到其他地方。#!"
 vigiles_francia_maa: "法兰克守夜人"
 vigiles_francia_maa_flavor: "#F “守夜人”是由萨莉安娜在接管法兰西后创建的，是法兰西妥芮朵骑士组建的精英骑士团，因其对迅捷术的掌握而令人害怕。#!"
 faydits_maa: "法伊迪特"
 faydits_maa_flavor: "#F 由埃丝克拉蒙德创建，用以保卫奥克西塔尼，这个由不同氏族组成的骑士团，专为迅速应对来自法兰西的任何入侵而设立。#!"
 centuries_epines_maa: "荆棘冠冕"
 centuries_epines_maa_flavor: "#F 首次创建是为了击退10世纪奥克西塔尼亚来自伊比利亚的[Glossary('阿什拉派','game_concept_ashirra_desc')]该隐之子的入侵，这个组织已经演变成在法兰西和伊比利亚半岛活动的无情佣兵团队。#!"
 white_company_maa: "白色军团"
 white_company_maa_flavor: "#F 这些来自西班牙的具有骑士风度的该隐之子骑士以其无可挑剔的正直和严格遵守其领袖唐娜·卢帕·曼里克所建立的道德准则而闻名。#!"
 fellowship_lady_maa: "圣母团契"
 fellowship_lady_maa_flavor: "#F 由一位在第一次十字军东征期间获得圣母玛利亚异象的英格兰妥芮朵骑士创立，这个军团致力于保护和帮助女性。他们相信这项神圣的任务将使他们摆脱该隐的诅咒。#!"
 order_chanticleer_maa: "雄鸡骑士团"
 order_chanticleer_maa_flavor: "#F 这个直言不讳的该隐之子恶魔猎人团体有着令人印象深刻的记录。然而，他们鲁莽的天性却招致了许多敌人，越来越多的统治者将他们驱逐出境。#!"
 dispossessed_maa: "无依者"
 dispossessed_maa_flavor: "#F 当他们的十字军吸血鬼主人最终死在圣地时，由留下的血仆组成的“无依者”很快组建了一个自由血仆网络，他们互相帮助，有时甚至直接反对血族的压迫。#!"
 order_star_morning_maa: "晨星骑士团"
 order_star_morning_maa_flavor: "#F 敌对者之道的追随者将猎杀地狱作为他们的神圣职责，众所周知，骑士团对与志同道合的派系结盟持开放态度，比如他们在雄鸡骑士团或难以捉摸的塔尔玛埃拉中的伙伴。#!"
 order_crooked_cross_maa: "扭曲十字骑士团"
 order_crooked_cross_maa_flavor: "#F 一个遵循他们自己对末卡维意志的怪诞解释的末卡维骑士团。试图解读他的疯狂会让他们最终陷入最不可能的境地。#!"
 order_bitter_ashes_maa: "怨烬骑士团"
 order_bitter_ashes_maa_flavor: "#F 传说中的圣杯骑士团更多是神话而非现实，除了少数在圣杯探寻中幸存下来的被选中者。他们的力量使他们不仅仅是吸血鬼，更是无与伦比的战士。#!"
 order_of_vengeance_maa: "祂最神圣的复仇骑士团"
 order_of_vengeance_maa_flavor: "#F 天罚之道追随者的统称，他们组织自己成立的骑士团。#!"
 leper_knights_maa: "麻风骑士"
 leper_knights_maa_flavor: "#F 诺斯费拉图的麻风骑士团是凡人中那些患有疾病和瘟疫缠身者的赞助人和守护者。当他们的神圣职责受到威胁时，他们会利用部族经常被忽视的体力形成一支可怕的战斗力量。#!"
 the_unblooded_maa: "不纯者"
 the_unblooded_maa_flavor: "#F 从两个试图拯救其垂死氏族传统和仪式的萨洛比开始，“不纯者”已经发展成为一个混合骑士团，致力于保护曾经骄傲的萨洛比稚子的残余。#!"
 mahgrib_maa: "马格里布追寻者"
 mahgrib_maa_flavor: "#F 作为阿什拉派的神秘分支，马格里布致力于对抗一切形态的腐化力量。其成员因冷酷的勤勉而备受敬畏。#!"
 banu_sasan_maa: "萨珊之子"
 banu_sasan_maa_flavor: "#F 萨珊之子之子自称波斯王室后裔。这些声名狼藉的浪人受雇于许多需要隐秘手段解决问题的吸血鬼。#!"
 the_wardens_maa: "守望者"
 the_wardens_maa_flavor: "#F 守护着心兽之路圣地的守望者们，非常擅长处理贪婪的法师、妖精以及其他试图利用这些场所神秘力量来实现自己目标的$glossary_fera$。#!"
 order_twilight_maa: "暮光骑士"
 order_twilight_maa_flavor: "#F 这个骑士团也被称为日落下的真正骑士，因其猎杀那些堕落后被心兽支配的吸血鬼而闻名。#!"
 knights_black_cross_maa: "黑十字骑士"
 knights_black_cross_maa_flavor: "#F 颠覆凡人条顿骑士团的该隐之子骑士团，黑十字是德意志梵卓的主要军事力量。由约根·冯·费尔登组建和训练，他们是氏族中最被尊敬的战斗力量。#!"
 knights_avalon_maa: "阿瓦隆骑士"
 knights_avalon_maa_flavor: "#F 效仿圆桌骑士，这些尊贵的战士已将自己奉献给密特拉。英格兰的神王委派他们去消灭威胁他领土的各种敌人，无论是尸妖、狼人、猎巫人，还是更为难以捉摸的存在。#!"
 woodwose_savages_maa: "森林野人"
 woodwose_savages_maa_flavor: "#F 森林野人是一群不再遵守骑士精神或骑士行为准则的不死族骑士。相反，他们组成游牧团伙，从一个村庄游荡到另一个村庄，拿走任何他们看上的东西，并惩罚任何敢于暗示某个大锅/华丽的金十字架/年轻女子不是他们可以随意取走的人。#!"
 knights_shroud_maa: "尸墓骑士"
 knights_shroud_maa_flavor: "#F 由阿什拉夫本人赞助，这些“术士骑士”充当他的先锋，与魔邪和其他对哈基姆圣裔不太明显的威胁作斗争。#!"
 knights_blood_maa: "血之骑士"
 knights_blood_maa_flavor: "#F 血之骑士团是在野蛮人入侵的黑暗时期成立的，这些梵卓拒绝了自己的氏族传统，不惜一切代价专注于军事力量。他们不停地接受战争训练，对整个氏族非常忠诚，尽管他们往往过于狂热，不符合其他梵卓的口味。#!"
 valkyries_maa: "瓦尔基里骑士团"
 valkyries_maa_flavor: "#F 一群女战士，她们实际上是杀戮的选民，她们的头衔和地位可以追溯到吸血鬼还可以被制度化为宗教的时候。瓦尔基里的身份是决定战斗的命运：她们能在一场重大的战斗中出现，扭转局势，使之有利于一方。如今，他们仍然是抵抗基督教入侵的英灵之道吸血鬼的主要精英力量。#!"
 order_rose_sable_maa: "黑玫瑰骑士团"
 order_rose_sable_maa_flavor: "#F 作为医院骑士团内部的一个秘密分支，这些技艺高超的血仆骑士因其军事实力而受到尊敬和追捧。到目前为止，他们的妥芮朵赞助人成功地避免了被迫向试图控制骑士团的许多外部力量屈膝。#!"
 knights_rose_sable_maa: "黑玫瑰兄弟会"
 knights_rose_sable_maa_flavor: "#F 成立于公元1125年，由一群前往参加十字军东征的旅行贵族骑士组成的骑士团，以其艺术性打造的盔甲和武器而闻名。他们的异端信仰并不公开展示，他们能够在凡人社会中为他们的主人，妥芮朵的安德鲁，进行活动。#!"
 disciples_anubis_maa: "阿努比斯的门徒"
 disciples_anubis_maa_flavor: "#F 阿努比斯的门徒是埃及的一个古老该隐之子组织。他们的起源可以追溯到一个名叫安普的冈格罗玛土撒拉，他是奥西里斯在对抗赛特斗争中的朋友和盟友。他的后代支持荷鲁斯的$glossary_osirian_league$，与狼族寂静漫游者和凡人的伊西斯密教都有紧密的联系。#!"
 disciples_anubis_maa_upgraded: "阿努比斯复仇使徒"
 disciples_anubis_maa_upgraded_flavor: "#F 阿努比斯的门徒是埃及的一个古老该隐之子组织。他们的起源可以追溯到一个名叫安普的冈格罗玛土撒拉，他是奥西里斯在对抗赛特斗争中的朋友和盟友。他的后代支持荷鲁斯的$glossary_osirian_league$，与狼族寂静漫游者和凡人的伊西斯密教都有紧密的联系。#!"
 warrior_setites_maa: "赛特战团"
 warrior_setites_maa_flavor: "#F 并不是所有的赛特信徒都是微妙的、口是心非的诱惑者。他们中的一些人更喜欢走一条更为尚武的道途，成为他们神的神圣战士。赛特战团为了蛮力术而避开了混淆术——他们不会在黑暗中潜行。他们是赛特的骄傲和残暴的士兵，完全愿意投入战斗来支持他们更狡猾的兄弟。#!"
 lions_rodrigo_maa: "罗德里戈之狮"
 lions_rodrigo_maa_flavor: "#F 致力于暗影再征服事业的这些“骑士”希望在伊比利亚半岛上彻底消灭所有伊比利亚半岛的[Glossary('阿什拉派','game_concept_ashirra_desc')]。他们的无情为他们赢得了许多胜利，但也赢得了许多不朽的敌人，而且不仅仅在阿什拉派之中。#!"
 knights_templar_maa: "圣殿骑士团"
 knights_templar_maa_flavor: "#F 尽管圣殿骑士团被相互竞争的超自然力量所淹没，但他们仍然是一支可怕的战斗力量。#!"
 knights_hospitaler_maa: "医院骑士团"
 knights_hospitaler_maa_flavor: "#F “圣战中的高尚骑士”的理念在耶路撒冷圣约翰医院骑士团中根深蒂固。无论被钦佩还是被厌恶，他们都是受尊敬的战士。#!"
 teutonic_knights_maa: "条顿骑士团"
 teutonic_knights_maa_flavor: "#F 北方十字军以其贪婪和无情的热情而闻名。尽管如此，他们在上帝的战士中的坚韧几乎无与伦比。#!"
 knights_calatrava_maa: "卡拉特拉瓦骑士团"
 knights_calatrava_maa_flavor: "#F 西班牙军事修会是基督教再征服运动的坚定盟友，尽管有时被伊比利亚半岛国王和女王幕后的阴谋所误导。#!"
 knights_livonia_maa: "利沃尼亚骑士团"
 knights_livonia_maa_flavor: "#F 利沃尼亚的骑士对任何阶层的人都开放。这有助于他们人数的增加，但因为这个选择，修会的质量（以及道德品质）已经受到了相当大的影响。#!"
 knights_st_thomas_maa: "圣托马斯的亚柯骑士团"
 knights_st_thomas_maa_flavor: "#F 这个小型的英格兰军事修会面临着来自教会的压力，要求其与圣殿骑士团或医院骑士团合并。由于他们自己在圣地对超自然现象的调查，它在暗影裁判所中找到了庇护。#!"
 knights_st_catherine_maa: "西奈圣凯瑟琳骑士团"
 knights_st_catherine_maa_flavor: "#F 这个日渐衰微的修会在过去几十年中几乎被奇怪但致命的攻击所摧毁。察觉到超自然力量的介入迹象，暗影裁判所庇护了它的残破遗骸。#!"
 knights_st_helena_maa: "圣赫勒拿的女骑士"
 knights_st_helena_maa_flavor: "#F 这个自封的修会并没有得到教会的祝福。被既定秩序所唾弃和嘲笑，他们的美德声誉帮助他们避免了抵抗，但对他们存在不满的情绪每天都在增长，现在有人悬赏要将这些固执的女性（有时是强行）送往修道院。#!"
 twilight_light_footmen_maa: "暮光散兵"
 twilight_light_footmen_maa_flavor: "#F 一个有抱负的统治者的精英游击部队，想要证明自己是垂暮之战的大师。#!"
 midnight_light_footmen_maa: "午夜散兵"
 midnight_light_footmen_maa_flavor: "#F 一群几乎没有经过训练的暴徒在不择手段时被派往敌人。主要用作分散注意力或以绝对数量压倒敌人。#!"
 twilight_archers_maa: "暮光弓箭手"
 twilight_archers_maa_flavor: "#F 作为暮光战争的大师，精英射手随时准备在正式的挑战或战场上保卫他们的领主。#!"
 midnight_archers_maa: "午夜弓箭手"
 midnight_archers_maa_flavor: "#F 在午夜战争的混乱中，有时仅仅给某人一张弓并指向敌人的大致方向就足够了。#!"
 twilight_light_horsemen_maa: "暮光轻骑兵"
 twilight_light_horsemen_maa_flavor: "#F 在暮光战争的大师们手中，轻骑兵单位发挥了巨大的作用，他们利用速度和打了就跑的战术，无人能及。轻骑兵以其快速的移动能力和灵活的战术，在战场上迅速打击敌人并撤退，避免正面硬碰硬的战斗，从而有效地发挥了他们的长处。#!"
 midnight_light_horsemen_maa: "午夜轻骑兵"
 midnight_light_horsemen_maa_flavor: "#F 即使轻骑兵是在匆忙中集结的，使用相当数量的轻骑兵进行侧翼包抄总是有效的。轻骑兵的高机动性使它们能够快速地从侧翼对敌人进行打击，即使在没有充分准备的情况下，也能给敌人造成压力和混乱。#!"
 twilight_pikemen_maa: "暮光长枪兵"
 twilight_pikemen_maa_flavor: "#F 在暮光战争中，作为经验丰富的参与者的精英守卫，这些士兵已经将他们的技能磨练到了几乎超自然的境界。他们通过不断的战斗和挑战，掌握了战术和策略，能够在战场上发挥关键作用，对抗强大的敌人。无论是在直接的战斗还是执行特殊任务中，这些精英守卫都展现出了卓越的能力。#!"
 midnight_pikemen_maa: "午夜长枪兵"
 midnight_pikemen_maa_flavor: "#F 一群挥舞着干草叉的农民向敌人投掷，希望发生一些好事（对他们的秘密主人，而不是对他们自己）。#!"
 twilight_armored_footmen_maa: "暮光步兵"
 twilight_armored_footmen_maa_flavor: "#F 在暮光战争大师的棋盘上的棋子。装备精良且非常熟练的棋子，但终究只是棋子。#!"
 midnight_armored_footmen_maa: "午夜步兵"
 midnight_armored_footmen_maa_flavor: "#F 丰富的高质量盔甲与缺乏技能和训练相结合，导致了……参差不齐的结果。#!"
 twilight_armored_horsemen_maa: "暮光重骑兵"
 twilight_armored_horsemen_maa_flavor: "#F 在任何暮光战争中，决定性的一击往往是由那些装备了领主所能提供的最好装备的精英战士所发起的。#!"
 midnight_armored_horsemen_maa: "午夜重骑兵"
 midnight_armored_horsemen_maa_flavor: "#F 一次令人印象深刻的冲锋可以扭转许多午夜战争的局势。遗憾的是，这些骑士装备精良，但训练不足。#!"
 massghouls_maa: "血仆化暴徒"
 massghouls_maa_flavor: "#F 一群凡人匆匆灌下吸血鬼的鲜血，并指向最近的敌人。结果可能会有所不同#!"
 lesser_ushabti_maa: "小型巫沙布提俑"
 lesser_ushabti_maa_flavor: "#F 小型生物如老鼠或麻雀的小俑像。它们有限的智力和战斗能力被它们易于被创造的特性所抵消。这些小型生物在战斗中可能不是最强大的，但由于可以大量制造，它们在战场上的数量优势可能会产生一定的影响。#!"
 medium_ushabti_maa: "中型巫沙布提俑"
 medium_ushabti_maa_flavor: "#F 中型生物的俑像，如猫、狗或眼镜蛇，它们比小型生物更加忠诚和坚韧，但更难制作。这些中型生物的俑像可能在某些方面比小型生物的俑像更具优势，例如在战斗中可能更加耐用或更有战斗力，但制作它们可能需要更多的资源和更高级的技术。#!"
 overseer_ushabti_maa: "巫沙布提俑主管"
 overseer_ushabti_maa_flavor: "#F 一种更智能的仆从形式，巫沙布提俑主管能够指挥它们较弱的同类，这使它们成为木乃伊战斗编队中的关键组成部分。#!"
 great_ushabti_maa: "巫沙布巨像"
 great_ushabti_maa_flavor: "#F 巨大的巫沙布提俑，高如一只大象的尺寸，这些罕见而珍贵的构造物能够轻易地粉碎敌人的阵型。#!"
 guard_ushabti_maa: "巫沙布提俑守卫"
 guard_ushabti_maa_flavor: "#F 守卫最强大的木乃伊墓穴的守卫，这种构造物因其坚韧和不可思议的恢复力而广为人惧。#!"
 ravnos_kshatriya_maa: "雷伏诺刹帝利"
 ravnos_kshatriya_maa_flavor: "#F 雷伏诺的战争种姓陷入了与[Glossary('阿修罗提伽耶','game_concept_kuei_jin_desc')]的全面战争，这场战争已经持续了如此之久，以至于没有人记得它开始的时间。这使他们成为了强大而有纪律的战士。#!"
 lamia_warmaidens_maa: "拉米亚戈尔贡"
 lamia_warmaidens_maa_flavor: "#F 莉莉丝的女战士们激烈战斗，无论是为了保卫她们的卡帕多西亚族人还是为了黑暗母亲的荣耀。#!"
 agitators_maa: "布鲁赫煽动者"
 agitators_maa_flavor: "#F 最初以罗宾·李兰德的叛军（和强盗）队伍命名，煽动者已经成为那些希望推翻现行秩序的布鲁赫们的统称。#!"
 corsairs_lasombra_maa: "勒森魃海盗"
 corsairs_lasombra_maa_flavor: "#F 所有勒森魃在其亡生中的某个时刻都会感受到大海的召唤。他们中的大多数人以英勇的姿态回应它，手持剑，趁夜色掩护登上其他船只。#!"
 salubri_warriors_maa: "萨洛比战士"
 salubri_warriors_maa_flavor: "#F 萨洛比的后代自其诞生之夜起就一直在与邪恶作战。他们的领袖可能已经不在，但他们的使命仍在继续。#!"
 web_assassins_maa: "刀锋之网刺客"
 web_assassins_maa_flavor: "#F 神秘莫测的刀锋之网很少亲自走上战场。然而，当绝对必要之时，他们会成为令人担忧的高效特种战士。#!"
 tmr_column_maa: "吸血鬼之柱"
 tmr_column_maa_flavor: "#F 支柱是黑手行动的基本单位。由支配术形成和领导，支配是永久性的，但强度不一。支配根据任务参数组建由几个突击队（称为卡穆特）组成的伙伴关系，每个突击队由一打特工组成。#!"
 ravnos_purified_maa: "净化者"
 ravnos_purified_maa_flavor: "#F 雷伏诺中的一个激进派别，致力于对抗超自然威胁，被称为“净化者”，他们是游击战的大师。#!"
 ghouled_cultists: "血仆化教徒"
 ghouled_cultists_flavor: "#F 凡人狂热地献身于该隐之子神明，以血作为他们完全献身的终极奖赏。#!"
 anda_jagun_maa: "安答"
 anda_jagun_maa_flavor: "#F 由百人组成的蒙古军队，[Glossary('安答','podgloss.anda')]血系作为成员加强了该蒙古骑队，使这些骑射手的名声比平时更加响亮。#!"
 the_leviathan: "利维坦"
 the_leviathan_flavor: "#F 利维坦被描述为一股黑暗之潮，一支拥有坚石般握力的触须的军团。黑暗是它的力量，它抓住受害者时，黑暗将会完全笼罩它。那些不幸被这生物拥抱的人可以听到曾经被折磨的忏悔者发出的绝望的尖叫和困于其中的回声。#!"
 army_of_leviathans: "利维坦"
 the_dragon_kung_kung: "共工"
 the_dragon_kung_kung_flavor: "#F 巨龙共工曾撞倒天柱引发灭世洪水。作为万公义的挚友，他在那场对抗超自然联军的关键战役中助阵，此后杳无踪迹，似在等待配得上其友灵魂的继承者。#!"
 celestial_army: "天军"
 celestial_army_flavor: "#F  这支为复仇万公义之死而集结的猎魔大军，虽已迷失初心变得冷酷，但其战斗技艺始终毋庸置疑。#!"
 pharaohs_sentry: "法老禁卫"
 pharaohs_sentry_flavor: "#F 法老禁卫是被复生的无魂躯壳，永远遵循术士敕令。这些无惧死亡、杀戮成性的战士，既是无情杀手亦是永恒哨兵。#!"
 sheddim_maa: "舍迪姆"
 sheddim_maa_flavor: "#F 来自异界的神秘存在。它们形似烈焰构成，却怀有灵智，对上帝造物燃烧着彻骨憎恨。#!"
 stone_lions: "石狮"
 stone_lions_flavor: "#F 庙宇神社的镇守神兽在饿殍意志下苏醒#!"
 terracottan_fodder_maa: "兵马俑"
 terracottan_fodder_maa_flavor: "#F 秦始皇不朽大军中最卑微的存在，为一具木乃伊的俑兵军队提供骨干力量。#!"
 terracottan_warriors_maa: "兵马俑战士"
 terracottan_warriors_maa_flavor: "#F 秦始皇不朽大军中久负盛名的士兵，如今效命于一具东方木乃伊的意志。#!"
 terracottan_scouts_maa: "兵马俑战车"
 terracottan_scouts_maa_flavor: "#F 尽管它们曾叱咤风云的战争形式早已不复存在，但这些俑兵的效率依然足以发挥作用。#!"
 terracottan_knights_maa: "兵马俑骑兵"
 terracottan_knights_maa_flavor: "#F 即便是战马也有其专属的小型俑像，随时准备被一次次召唤，追随其不朽主人的号令。#!"
 terracottan_guards_maa: "兵马俑锐士"
 terracottan_guards_maa_flavor: "#F 曾是史上最伟大军队中的精锐之师，如今却沦为俑像，受八仙后裔的意志所驱使。#!"
 POD_illusionary_maa: "[POD_illusionary_maa|E]"
 illusionary_combatants: "幻影战士"
 illusionary_combatants_flavor: "#flavor 重甲战士的假象，能够有效地吸引敌人的注意。#!"
 black_crows_maa: "黑鸦"