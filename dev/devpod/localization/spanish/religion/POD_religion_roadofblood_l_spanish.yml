 tariqelhaqim_desc:0 "Los que siguen la Vía Sanguinus se encuentran entre los más mortíferos para sus compañeros cainitas, ya que el acto de la diablura es casi un rito de purificación entre los centinelas. De hecho, uno de los principales principios de la vía es que sus seguidores purguen todo lo que es indigno de la sangre de Caine y purifiquen las líneas de sangre."

