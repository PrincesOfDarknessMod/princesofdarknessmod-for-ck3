 wyrm_religion_desc:0 "En la teología de los Garou, el Wyrm es una de las Celestinas superiores. El propósito del Wyrm es la limpieza y rectificación de la Creación, favoreciendo su descenso a la Entropía. Con la llegada de la humanidad, el Wyrm se vio progresivamente limitado hasta que se volvió loco, empeñado en destruirlo todo. En consecuencia, el Wyrm es ahora un espíritu de destrucción, caos, oscuridad y corrupción, la esencia de todo a lo que se oponen los Garou".
