 modernanarch_religion_adherent_plural:0 "Anarcas"
 modernanarch_religion_desc:0 "Los anarcas son vampiros que rechazan el statu quo de la sociedad cainita".
 modernanarch_high_god_name:0 "Libertad"
 modernanarch_high_god_name_alternate:0 "Libertad"
