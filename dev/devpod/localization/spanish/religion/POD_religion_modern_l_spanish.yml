 #ModernAnarch-Group Faiths
 
 freeanarch:0 "Anarquía libre"
 freeanarch_adj:0 "Anarca"
 freeanarch_adherent:0 "Anarca"
 freeanarch_adherent_plural:0 "Anarcas"
 freeanarch_desc:0 "Estos cainitas nunca se inclinarán ante ninguna autoridad que no sea la que ellos mismos elijan, sin importar las probabilidades. Los bastiones de los anarcas suelen ser salvajes y revoltosos, pero son un faro de esperanza y libertad para muchos jóvenes vampiros. Y algo que aplastar rápidamente para sus mayores".
 
 #LocalizaciónComúndeCamarilla
 camarilla_religion:0 "Camarilla"
 camarilla_religion_adherent:0 "Camarilla"
 camarilla_religion_adj:0 "Camarilla"
 camarilla_religion_adjerent:0 "Camarilla"
 camarilla_religion_adherent_plural:0 "Camarilla"
 camarilla_religion_desc:0 "Además de evitar que las crecientes masas de mortales descubran la existencia de los vampiros, la Camarilla pretende mantener el statu quo de la sociedad Kindred; como tal, gran parte de su estructura y tradiciones reflejan la de la sociedad cainita en la Europa feudal de la Edad Oscura."
 
 #Camarilla-Group Faiths
 
 camahumanity:0 "Camarilla (Humanidad)"
 camahumanity_adj:0 "Camarilla"
 camahumanity_adherent:0 "Camarilla"
 camahumanity_adherent_plural:0 "Camarilla"
 camaanarchs:0 "Camarilla (Anarquistas)"
 camaanarchs_adj:0 "Anarquista"
 camaanarchs_adherent:0 "Anarquista"
 camaanarchs_adherent_plural:0 "Anarquistas"
 camaanarchs_desc:0 "La mayoría de los Anarquistas respetan y defienden la Mascarada y algunas de las otras Tradiciones, incluso si no respetan a los vampiros que las imponen o al sistema que se beneficia de ellas.\nBajo los términos de la Convención de Thorns, los Anarquistas son considerados un facción de la Camarilla por sus miembros, pero a diferencia del Sabbat, son tolerados."
 camahumanity_desc:0 "Se anima a los Kindred a que se mezclen con los mortales lo mejor posible y a que conserven el civismo y la compostura que se derivan de mantener sus características humanas. Casi todos los miembros de la Camarilla están en la "Senda" de la Humanidad, siendo otras Sendas de la Iluminación fuertemente desaconsejadas y normalmente sólo practicadas por los ancianos."
  
 #Localización común del Sabbat
 sabbat_religion:0 "Sabbat"
 sabbat_religion_adherent:0 "Sabbat"
 sabbat_religion_adj:0 "Sabbat"
 sabbat_religion_adjerent:0 "Sabbat"
 sabbat_religion_adherent_plural:0 "Sabbat"
 sabbat_religion_desc:0 "El Sabbat es una organización informal de cainitas que rechazan las Tradiciones. A diferencia de la Camarilla, el Sabbat cree en los Antediluvianos y en Caine. También se les conoce como la Espada de Caine, ya que creen que serán el ejército que utilizará para destruir a los antediluvianos una vez que llegue la Gehenna."
 sabbat_religious_head_title:0 "Priscus"
 sabbat_religious_head_title_name:0 "Prisco"
 sabbat_religious_text:0 "Libro de Nod"

 #Sabbat-Grupo de Fe
 
 pathofhonorableaccord:0 "Senda de la Concordia Honorable"
 pathofhonorableaccord_adj:0 "Patriotas del Sabbat"
 pathofhonorableaccord_adherent:0 "Patriota"
 pathofhonorableaccord_adherent_plural:0 "Patriotas"
 pathofhonorableaccord_desc:0 "La Senda del Acuerdo Honorable es una Senda de la Iluminación que aprovecha a la Bestia mediante la práctica rigurosa de un comportamiento honorable y caballeresco. Los Cainitas en la Senda del Acuerdo Honorable dan un gran valor al ritual y a la ceremonia. Por lo tanto, los Caballeros del Sabbat siempre participan en Fiestas de Guerra, ritae, ceremonias y otros eventos de la manada. En conjunto, los seguidores de la Senda buscan unir a las facciones dispares de la secta bajo el estandarte común de la lealtad a una causa".
 
 pathofdeathandthesoul:0 "Camino de la muerte y el alma"
 pathofdeathandthesoul_adj:0 "Necronomistas del Sabbat"
 pathofdeathandthesoul_adherent:0 "Necronomista"
 pathofdeathandthesoul_adherent_plural:0 "Necronomistas"
 pathofdeathandthesoul_desc:0 "El Camino de la Muerte y el Alma es un Camino de la Iluminación que suprime a la Bestia mediante el estudio independiente de la muerte, la no-muerte y el alma.\nComo uno de los caminos más eruditos, los necronomistas ven la existencia vampírica como un medio para explorar los misterios de la vida. y muerte Dividen el universo en el reino racional de la carne y la física y el reino irracional del dolor, los misterios y los fenómenos sobrenaturales. Para explorar estas diferencias y encontrar la respuesta a sus preguntas, un vampiro tiene que explorar su propio estado y la naturaleza del alma."
 
 pathofpowerandtheinnervoice:0 "Camino del poder y la voz interior"
 pathofpowerandtheinnervoice_adj:0 "Unificadores del Sabbat"
 pathofpowerandtheinnervoice_adherent:0 "Unificadores"
 pathofpowerandtheinnervoice_adherent_plural:0 "Unificadores"
 pathofpowerandtheinnervoice_desc:0 "El Camino del Poder y la Voz Interior es un Camino de la Iluminación que controla a la Bestia a través de una determinación rigurosa y la acumulación de poder mundano.\nLos seguidores de este Camino creen que la verdad se encuentra dentro de ellos mismos y se encuentra mejor mediante una búsqueda interna de la iluminación personal que conduce en última instancia a la acumulación de poder. El control de uno mismo y del mundo exterior es el único objetivo que vale la pena perseguir. Con este fin, un vampiro debe desarrollar sus habilidades, extender su influencia y colocar sus peones."
 
 pathofthebeast:0 "Camino de la bestia"
 pathofthebeast_adj:0 "Bestias del Sabbat"
 pathofthebeast_adherent:0 "Bestia"
 pathofthebeast_adherent_plural:0 "Bestias"
 pathofthebeast_desc:0 "Bestias"
 
 pathofmetamorphosis:0 "Senda de la metamorfosis"
 pathofmetamorphosis_adj:0 "Senda de la metamorfosis"
 pathofmetamorphosis_adherent:0 "Metamorfoseadores"
 pathofmetamorphosis_adherent_plural:0 "Metamorfosistas"
 pathofmetamorphosis_desc:0 "El Camino de la Metamorfosis es un Camino de la Iluminación que controla a la Bestia mediante el estudio de sus límites y los límites del vampirismo en general.\nCreen que el siguiente paso es un estado similar a la apoteosis, al que llaman Azhi Dahaka, en honor al dragón de Persia mitología, y harán cualquier cosa, cualquier cosa, para lograrlo. Es una filosofía lejana, solitaria, alejada de cualquier otra necesidad que no sea la del sustento."
 
 pathofcathari:0 "Senda de Cathari"
 pathofcathari_adj:0 "Albigenses del Sabbat"
 pathofcathari_adherent:0 "Albigenses"
 pathofcathari_adherent_plural:0 "Albigenses"
 pathofcathari_desc:0 "El Camino de los Cátaros se presenta como la contraparte directa de los Cátaros medievales: los vampiros son espíritus arcónticos, carceleros del Demiurgo, colocados en este mundo para asegurar que la humanidad nunca lo trascienda. Caín fue condenado por el buen creador a la fisicalidad y al sufrimiento sin fin, pero colocado por encima de la humanidad en el proceso, para evaluar a los humanos y alejarlos de la gnosis. Con este fin, los albigenses (la titulación formal de un seguidor del camino) fomentan el exceso mortal y el materialismo y rompen deliberadamente los numerosos tabúes de los antiguos cátaros."
 
 pathofcaine:0 "Senda de Caine"
 pathofcaine_adj:0 "Noddistas del Sabbat"
 pathofcaine_adherent:0 "Noddistas"
 pathofcaine_adherent_plural:0 "Noddistas"
 pathofcaine_desc:0 "Nodistas"
 
 pathofharmony:0 "Camino de la armonía"
 pathofharmony_adj:0 "Armonistas del Sabbat"
 pathofharmony_adherent:0 "Armonista"
 pathofharmony_adherent_plural:0 "Armonistas""
 pathofharmony_desc:0 "Una variante del Camino de la Bestia que acepta a la Bestia como necesaria para la supervivencia del vampiro.\nLos Armonistas no creen que nada de lo que existe sea antinatural. Simplemente ser significa que un individuo o fuerza tiene un lugar. Esto incluye a los vampiros. Sí, el papel del vampiro en el orden natural es algo desagradable, pero es probable que el conejo sienta lo mismo por el zorro."
 
 pathofnight:0 "Camino de la noche"
 pathofnight_adj:0 "Nihilistas del Sabbat"
 pathofnight_adherent:0 "Nihilista"
 pathofnight_adherent_plural:0 "Nihilistas"
 pathofnight_desc:0 "Nihilistas"

 vasantasenadharma:0 "Vasantasenadharma"
 vasantasenadharma_adj:0 "Sabbat Vasantasenadharma"
 vasantasenadharma_adherent:0 "Seguidor de Vasantasena"
 vasantasenadharma_adherent_plural:0 "Seguidores de Vasantasena"
 pathofredemption:0 "Camino de la redención"
 pathofredemption_adj:0 "Mártires del Sabbat"
 pathofredemption_adherent:0 "Mártir"
 pathofredemption_adherent_plural:0 "mártires"
 pathofredemption_desc:0 "El Camino de la Redención es un Camino de la Iluminación que lucha contra la Bestia luchando por la salvación al servicio de Dios. Naturalmente, estas afirmaciones son algo inconvenientes en las sociedades actuales de los Condenados, pero los seguidores del camino a menudo están más decididos a ganar gracia que a preocuparse por los demás."
 vasantasenadharma_desc:0 "Vasantasena y su padre Malkavian Unmada viajaron por el mundo a lo largo de la Edad Media, predicando contra el Vínculo de Sangre. Rechazaron el vinculum, la jerarquía tradicional de los Vástagos y toda pérdida del libre albedrío. Finalmente, condenaron a los Antediluvianos por su cruel tiranía a través de la Yihad, uniéndose al Sabbat durante su formación."
    
