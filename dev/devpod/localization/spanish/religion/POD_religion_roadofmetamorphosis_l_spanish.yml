 holy_order_order_of_oradea:0 "La Orden de Oradea"
 pathofasakku:0 "Camino de Asakku"
 pathofasakku_adj:0 "corrupto"
 pathofasakku_adherent:0 "corrupto"
 pathofasakku_adherent_plural:0 "corrupto"
 pathofasakku_desc:0 "Esta versión del camino no es canónica y ha sido encargada por un Patrón\nUn místico errante, Dragastes usó su Vicisitud para curar a los enfermos y heridos tanto del Kine como de los Vástagos. Sin embargo, con cada sanación, su sangre contaminada se extendió a las masas, pudriéndolas de adentro hacia afuera y corrompiéndolas hasta convertirlas en meras extensiones de la voluntad de Asakku. Potencialmente, la maldición de Dragastes puede haberse extendido por gran parte del Mediterráneo. Sin embargo, los Asakku, o más correctamente los Vigilantes que dominaban su voluntad, habían subestimado a los otros Vástagos de la Ciudad. El Dracon, un antiguo Tzimisce cuyo conocimiento de la Vicisitud eclipsó incluso al de los Asakku, eliminó muchos cultos y rápidamente obligó a los rebeldes Tzimisce a huir de la ciudad. Sin embargo, algunos restos de la locura de Dragastes permanecieron en los márgenes de la antigua Bizancio, aunque siglos de preparación y conspiración se deshicieron en unos breves años. Desde entonces, el culto ha migrado a los páramos de Siberia dirigido por su hierofante Matthaios Yelbeghen."
 holy_order_knez_of_dacia:0 "Knez de Dacia"
 holy_order_dragons_of_wallachia:0 "Dragones de Valaquia"

 
 
