 #Cazadores_religión_desc:0

 independenthunters:0 "Cazadores independientes"
 independenthunters_adj:0 "Independientes"
 independenthunters_adherent:0 "Cazador"
 independenthunters_adherent_plural:0 "Cazadores"
 independenthunters_desc:0 "Independientes de cualquier cuerpo eclesiástico gobernante, estos cazadores siguen sus propias guerras idiosincrásicas contra los horrores sobrenaturales del Mundo de las Tinieblas. Aunque carecen de los recursos de una gran institución, tampoco están sujetos a ninguna engorrosa norma étnica o burocrática. La mayoría de estos cazadores descubrieron la amenaza de las criaturas sobrenaturales por sí mismos, aunque unos pocos, irritados por las reglas de la Inquisición de la Sombra, dejaron de responder a las órdenes de lo alto y ahora recorren su propio camino".
 
 shadowinquisition:0 "Inquisición de las Sombras"
 shadowinquisition_adj:0 "Inquisición"
 shadowinquisition_adherent:0 "Inquisidor"
 shadowinquisition_adherent_plural:0 "Inquisidores"
 shadowinquisition_desc:0 "La Inquisición en la sombra es una campaña secreta orquestada por la Iglesia católica durante el Medievo oscuro. A diferencia de la Inquisición Papal, cuyo objetivo son los herejes, la Inquisición en la Sombra tiene como objetivo a los vampiros, hombres lobo, magos y otros "siervos de Satán" para su destrucción o salvación. Su existencia será breve, pero sus éxitos cambiarán el mundo cainita para siempre".
 shadowinquisition_religious_head_title:0 "Gran Inquisidor"
 shadowinquisition_religious_head_title_name:0 "Oficina del Gran Inquisidor"
 shih_faith:0 "La creencia de Shih"
 shih_faith_adj:0 "Creencia"
 shih_faith_adherent:0 "Shih"
 shih_faith_adherent_plural:0 "Shih"
 shih_faith_desc:0 "Los Shih se han diversificado y extendido por todo el Reino Medio a lo largo de los siglos, y han adaptado las filosofías que les enseñaron para que tengan sentido en las áreas donde habitan.\nPero ninguna de estas creencias es su principal fuente de fe. Todos los Shih entienden que lo que practican a nivel personal tiene poco que ver con la verdad que siguen como cazadores de demonios."

 
