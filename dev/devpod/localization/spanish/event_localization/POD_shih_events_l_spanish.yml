l_spanish:
 podshih.100.t:0 "Solicitud de paz"
 podshih.100.desc:0 "[shih.GetFirstName] quiere hacer una tregua contigo. Una práctica común entre los Shih errantes, ya que a menudo necesitan tiempo para reenfocar su P'o interior lejos de la constante hostilidad y agresión necesarias en su sangriento trabajo."
 podshih.100.a:0 "Estoy de acuerdo."
 podshih.100.b:0 "No aceptaré esto."
 podshih.1010.t:0 "El Ejército Celestial y la Inquisición"
 podshih.1010.desc:0 "Después de cien años de reforma del Ejército Celestial, ha aparecido la oportunidad de una guerra total contra los Shen.\nEn Occidente, la Inquisición de la Sombra de la Iglesia Católica ha comenzado a purgar sus propias tierras, dándote la posibilidad de aumentar tus agresiones también. Es hora de terminar con esto."
 podshih.1010.a:0 "participaré"
 podshih.1010.a.tt:0 "Puedo usar [GetPlayer.GetFaith.Custom('GHWName')] para [empire|E] [casus_belli|E]."
