 podmummy.4201.desc_true_name_tree:0 ""Árbol""
 podmummy.4201.desc_true_name_mushroom:0 ""Champiñón""
 podmummy.4201.desc_true_name_eye:0 ""Ojo""
 podmummy.4201.desc_true_name_leg:0 ""Pierna""
 podmummy.4201.desc_true_name_face:0 ""Cara""
