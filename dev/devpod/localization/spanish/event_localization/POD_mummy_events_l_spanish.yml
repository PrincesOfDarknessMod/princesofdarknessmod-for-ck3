 learning_true_names_head:0 "Aprendiendo los nombres verdaderos:"
 podmummy.4000.t:0 "$aprendiendo_nombres_verdaderos_cabeza$ Elige"
 podmummy.4000.desc:0 "¿Qué quieres hacer?"
 podmummy.4000.a:0 "Practicar la pronunciación".
 podmummy.4000.b:0 "Aprender un nuevo nombre verdadero".
 
 podmummy.4100.t:0 "$aprender_nombres_verdaderos$ Practicar la pronunciación"
 podmummy.4100.desc:0 "La magia de los nombres verdaderos no es fácil: Un nombre verdadero debe entenderse y pronunciarse con mucho cuidado. Un escriba impaciente descubrirá que su ren pronunciado incorrectamente no tiene ningún efecto".
 podmummy.4100.a:0 "Tengo tiempo".
 
 podmummy.4101.t:0 "$learning_true_names_head$ Manera de articular"
 podmummy.4101.desc_nasal:0 "Has practicado un poco sobre cómo pronunciar las consonantes nasales".
 podmummy.4101.desc_plosive:0 "Has practicado un poco sobre cómo pronunciar las consonantes plosivas".
 podmummy.4101.desc_trill:0 "Has practicado un poco sobre cómo pronunciar las consonantes trilladas".
 podmummy.4101.desc_flap:0 "Has practicado un poco sobre cómo pronunciar las consonantes flap".
 podmummy.4101.desc_fricative:0 "Has practicado un poco sobre cómo pronunciar las consonantes fricativas".
 podmummy.4101.desc_aproximant:0 "Has practicado un poco sobre cómo pronunciar las consonantes aproximantes".
 podmummy.4101.desc_approximant:0 "Practicaste un poco sobre cómo pronunciar las consonantes aproximadas."
 podmummy.4101.desc_lateral:0 "Has practicado un poco sobre cómo pronunciar las consonantes laterales".
 podmummy.4101.desc_clicks:0 "Has practicado un poco sobre cómo pronunciar las consonantes clics".
 podmummy.4101.desc_implosive:0 "Has practicado un poco sobre cómo pronunciar las consonantes implosivas".
 podmummy.4101.desc_ejective:0 "Has practicado un poco sobre cómo pronunciar las consonantes eyectivas".
 podmummy.4101.desc_affricate:0 "Has practicado un poco sobre cómo pronunciar las consonantes africadas".
 podmummy.4101.desc_vowels:0 "Has practicado un poco sobre cómo pronunciar las vocales".
 podmummy.4101.a:0 "Chogh, Chogh".
 
 podmummy.4200.t:0 "$learning_true_names_head$ Descubriendo un nuevo ren"
 podmummy.4200.desc:0 "Aprender un nombre verdadero no es una simple cuestión de escuchar un nombre una vez. Es una cuestión de descomponer el nombre en las palabras que lo componen, aprender el significado de cada una de ellas, aprender su correcta enunciación y ritmo, y luego volver a unirlas en el ren completo."
 podmummy.4200.a:0 "Lleva tiempo y dedicación".
 
 podmummy.4201.t:0 "$learning_true_names_head$ New Ren Discoverd"
 podmummy.4201.desc_opening:0 "Has aprendido con éxito un nuevo ren -"
 podmummy.4201.desc_true_name_crop:0 ""Crop""
 podmummy.4201.desc_true_name_weed:0 ""Hierba""
 podmummy.4201.desc_true_name_flower:0 ""Flor""
