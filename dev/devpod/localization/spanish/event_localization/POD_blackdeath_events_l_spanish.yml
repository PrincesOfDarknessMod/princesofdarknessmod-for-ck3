l_spanish:
 POD_blackdeath.0002.t:0 "Rumores de una plaga"
POD_blackdeath.0002.desc:0 "Las enfermedades son un hecho en esta época, pero un rumor incipiente te ha hecho reflexionar. Habla de una plaga más terrible que cualquier otra, procedente del lejano oriente. Esta terrible infección parece extenderse a un ritmo alarmante y el número de muertos aumenta cada día.\NTu gobierno, aunque algo alejado de las preocupaciones de los mortales, sigue estando muy ligado al bienestar de los frágiles seres de tu reino. ¿Qué pasaría si de repente sólo gobernaras cadáveres y pulgas? Esta es una perspectiva sombría, suficiente para que hasta el más cruel de los señores tenga algo en qué pensar.\NSin embargo, el tiempo se está acabando, y tienes que tomar una decisión, ¿intentarás preparar sutilmente a los mortales de tu zona para los tiempos difíciles que se avecinan?"
 POD_blackdeath.0002.a:0 "¡Oremos por la salvación!"
 POD_blackdeath.0002.b:0 "¡Necesito que mis mortales estén sanos!"
 POD_blackdeath.0002.c:0 "Eso está muy por debajo de mi preocupación"
 POD_blackdeath_preparations:0 "Estarás más preparado cuando llegue el jinete pálido".
 small_blackdeath_devastation_modifier:0 "Pequeña devastación de la muerte negra"
 small_blackdeath_devastation_modifier_desc:0 "El jinete pálido está aquí, su toque es frío y mortal, pero algo suave en comparación con el resto del mundo."
 medium_blackdeath_devastation_modifier:0 "Devastación media de la Muerte Negra"
 medium_blackdeath_devastation_modifier_desc:0 "El Jinete Pálido está aquí. Afortunados, pero pocos, son los que logran escapar de su abrazo mortal."
 high_blackdeath_devastation_modifier:0 "Alta devastación de la Muerte Negra"
 high_blackdeath_devastation_modifier_desc:0 "El Jinete Pálido está aquí. Este es su reino, y ningún alma viviente puede entrar aquí ya".
 POD_blackdeath.0004.t:0 "La Muerte Negra"
 POD_blackdeath.0004.desc:0 "El mundo ha conocido su cuota de plagas y enfermedades, pero ¿ha conocido alguna vez algo tan mortal como esta Peste Negra? Incluso con tus grandes conocimientos, no recuerdas un acontecimiento tan funesto como éste.\NLos mortales mueren en tropel, reclamados por el Jinete Pálido que avanza de ciudad en ciudad, dejando sólo cadáveres y pulgas a su paso. Plegarias, fuego, culpas... nada parece poder detenerlo, ni siquiera ralentizarlo. Comunidades enteras han sido reducidas a cenizas y el espeluznante silencio que impregna el aire de día y de noche es revelador... ¿Es este el final?"
 POD_blackdeath.0004.a:0 "¿Un final lento y agotador para la humanidad?"
 POD_blackdeath_happening:0 "La Peste Negra ha llegado. Los reinos han sido devastados, perdiendo desarrollo y edificios dependiendo de la escala de la infección. Verás un modificador de condado que indica la cantidad de daño hecho en cada condado."
 POD_blackdeath.0005.t:0 "El Azote"
 POD_blackdeath.0005.desc:0 "Está empeorando.\NDe alguna manera, la cepa de la Peste Negra parece haber mutado. Hasta ahora, sólo afectaba a los mortales y tenía pocas consecuencias directas para los vampiros, pero ya no es así. Esta variante, apodada "el Azote" por los estudiosos, ataca directamente la vitae del vampiro. Hace que la sangre sea menos poderosa de lo que es, y como tal requiere un mayor gasto para que funcione realmente. Combinado con el limitado suministro de sangre debido a que los mortales siguen muriendo a diestro y siniestro con la Peste Negra... La única buena noticia es que el Azote no parece ser letal para los vampiros, sólo debilitante a lo sumo. A pesar de las frenéticas pesquisas, nadie tiene la menor idea de cómo ha podido ocurrir esto o si alguien es responsable de ello..."
 POD_blackdeath.0005.a:0 "¿Hay un final para esta pesadilla?"
 POD_blackdeath.0005.b:0 "¡Los Tremere tienen la culpa seguro!"
 POD_blackdeath.0005.c:0 "¡Los capadocios se han metido con los cadáveres de los mortales!"
 POD_blackdeath.0005.d:0 "Es evidente que la culpa es de los setitas".
 POD_scourge_tremere:0 "A los Tremere de tu reino no les gustará eso".
 POD_scourge_cappadocian:0 "A los capadocios de tu reino no les gustará eso".
 POD_scourge_setite:0 "A los setitas de tu reino no les gustará eso".
 POD_scourge_warning:0 "Algunos vampiros han empezado a infectarse por el Azote y a propagarlo".
 weak_scourge_modifier:0 "Pequeños síntomas de azote"
 weak_scourge_modifier_desc:0 "Has sido infectado por el Azote. Por suerte, de momento sólo experimentas una leve debilidad".
 medium_scourge_modifier:0 "Síntomas de azote medio"
 medium_scourge_modifier_desc:0 "Has sido infectado por el Azote. Estás muy debilitado y te cuesta mantener la apariencia de un gobernante fuerte."
 high_scourge_modifier:0 "Síntomas de azote severos"
 high_scourge_modifier_desc:0 "Has sido infectado por el Azote. Te sientes muy débil y, lo que es peor, pareces muy débil ante el resto del mundo cainita."
 POD_blackdeath.0007.t:0 "El Azote : ¡Infectado!"
 POD_blackdeath.0007.desc:0 "El Azote no perdona a nadie... al menos a ti. Es una sensación extraña en realidad, la enfermedad ha sido un débil recuerdo de tus días de respiración durante mucho tiempo en este punto y ahora ha vuelto para perseguirte.\NTe sientes débil, tu sangre tiene problemas para conjurar el poder que una vez tuvo y puedes ver en los ojos de tu entorno el miedo a ser expuesto a ti... y el brillo codicioso de las oportunidades que se ponderan mientras estás así debilitado.\NSe avecinan tiempos difíciles."
 POD_blackdeath.0007.a:0 "Sólo necesito acostarme un poco..."
 POD_scourge_happening:0 "Has sido infectado por el Azote. Con la naturaleza infecciosa de la enfermedad, tu entorno también lo está o lo estará pronto probablemente.\NPuedes comprobar la gravedad de tu estado actual como modificador de carácter."
 POD_blackdeath.0008.t:0 "¿El final de una pesadilla?"
 POD_blackdeath.0008.desc:0 "La Peste Negra está perdiendo terreno lentamente en el reino de los mortales. Y aunque es un acontecimiento totalmente devastador, no ha acabado con la humanidad como algunos temían. La civilización tardará mucho tiempo en volver a ser lo que era antes, pero los esfuerzos de reconstrucción han comenzado.\NEl Azote, esa enfermedad vampírica que les afectó, también está disminuyendo, probablemente debido a su conexión parasitaria con la propia Peste Negra. Parece que la raza condenada de Caine ha ganado un poco más de tiempo bajo el cielo nocturno".
 POD_blackdeath.0008.a:0 "El Jinete Pálido ha tenido piedad".