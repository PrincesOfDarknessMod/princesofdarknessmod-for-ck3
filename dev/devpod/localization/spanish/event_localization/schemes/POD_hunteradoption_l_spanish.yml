l_spanish:

 POD_hunteradoption.100.t:0 "Una nueva luz"
 POD_hunteradoption.100.desc:0 "Después de un minucioso entrenamiento, estás seguro de que tu escudero está preparado para unirse a la lucha contra la oscuridad. Con este esfuerzo, te aseguras de que la obra de Dios te sobreviva y continúe, hasta la inevitable victoria. Esperas que tu pupilo, algún día, haga retroceder a las fuerzas del infierno con su sola presencia. Pero hasta entonces, queda mucho trabajo por hacer..."
 POD_hunteradoption.100.option.a:0 "Enseñé sobre asuntos militares"
 POD_hunteradoption.100.option.a.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te alcance"  
 POD_hunteradoption.100.option.b:0 "La habilidad con las armas fue nuestro principal objetivo"
 POD_hunteradoption.100.option.b.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero si la oscuridad te alcanza" 
 POD_hunteradoption.100.option.c:0 "Mi escudero sabe que hay agentes del infierno en cada sombra"
 POD_hunteradoption.100.option.c.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.101.t:0 "Una nueva luz"
 POD_hunteradoption.101.desc:0 "Como corazón palpitante de la Inquisición de la Sombra, las Hermanas de San Juan tienen una pesada carga que no se comparte fácilmente. A pesar de ello, confías en las habilidades de tu nueva pupila tras este periodo de entrenamiento exhaustivo. Otra novia de Dios está lista para tomar tu manto si, o cuando, la oscuridad te alcance. Un pequeño consuelo, pero un consuelo al fin y al cabo".
 POD_hunteradoption.101.option.a:0 "Ella ha aprendido mucho"
 POD_hunteradoption.101.option.a.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza"  
 POD_hunteradoption.101.option.b:0 "Ella ayudará a la Santa Iglesia a prosperar"
 POD_hunteradoption.101.option.b.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.101.option.c:0 "Está lista para difundir la palabra"
 POD_hunteradoption.101.option.c.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.102.t:0 "Una nueva luz"
 POD_hunteradoption.102.desc:0 "A menudo difamada, la Orden Roja es, sin embargo, una parte crucial de la Inquisición. Impulsados por una interminable sed de conocimiento, muchos de sus miembros se vieron a menudo atraídos por un camino más oscuro. Usted enseñó a su alumno lo mejor que pudo para evitar ese destino".
 POD_hunteradoption.102.option.a:0 "Mi alumno ha aprendido mucho"
 POD_hunteradoption.102.option.a.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza"  
 POD_hunteradoption.102.option.b:0 "Mi alumno ayudará a la Santa Iglesia a prosperar"
 POD_hunteradoption.102.option.b.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.102.option.c:0 "Mi alumno conoce el poder de los secretos"
 POD_hunteradoption.102.option.c.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.103.t:0 "Una nueva luz"
 POD_hunteradoption.103.desc:0 "Una fuerza legítimamente temida, incluso por los demás Inquisidores, los Oculi Dei son la policía secreta de los Cazadores. Saben mucho, mucho más de lo que la mayoría de la gente cree y son la fuente de información más creíble sobre los habitantes de la noche. Sin embargo, los miembros del Oculi tienden a ser paranoicos en extremo, viendo complots en todas partes... pero la mayoría de las veces, en realidad tienen razón".
 POD_hunteradoption.103.option.a:0 "¡Abre los ojos!"
 POD_hunteradoption.103.option.a.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza"  
 POD_hunteradoption.104.t:0 "Una nueva luz"
 POD_hunteradoption.104.desc:0 "La familia von Murnau tiene la dudosa bendición de poder "oler" el mal. Como tal, son los sabuesos de la Inquisición y un activo valioso, aunque sus formas no clericales los conviertan en extraños compañeros de cama con las otras órdenes. Es una práctica común que un Inquisidor de la familia tome a otro miembro más joven de la misma como alumno hasta que sea capaz de luchar contra la oscuridad por sí mismo."
 POD_hunteradoption.104.option.a:0 "Mi alumno conoce el poder de los secretos"
 POD_hunteradoption.104.option.a.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza"  
 POD_hunteradoption.104.option.b:0 "Mi pupilo ayudará a la Santa Iglesia a prosperar"
 POD_hunteradoption.104.option.b.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.104.option.c:0 "Mi alumno está listo para difundir la palabra de Dios"
 POD_hunteradoption.104.option.c.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.105.t:0 "Una nueva luz"
 POD_hunteradoption.105.desc:0 "Atrás quedaron los días en los que el peso de la protección del rebaño fiel frente a los siervos de la oscuridad lo llevaban solo Bayezid y Basil. Una nueva generación de pastores guiará a las almas puras hacia la luz".
 POD_hunteradoption.105.option.a:0 "Mi alumno dirigirá la ira de los fieles".
 POD_hunteradoption.105.option.a.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te alcance"  
 POD_hunteradoption.105.option.b:0 "Mi alumno avivará las llamas del celo".
 POD_hunteradoption.105.option.b.tt:0 "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero por si la oscuridad te alcanza" 
 POD_hunteradoption.106.t:0 "Una nueva luz"
 POD_hunteradoption.106.desc:0 "Atrás quedaron los días en que el peso de mantener el equilibrio entre shen y mortal estaba solo sobre tus hombros. Una nueva generación ayudará a mantener esta paz."
 POD_hunteradoption.106.option.a:0 "Mi alumno seguirá el rastro de Yi."
 POD_hunteradoption.106.option.a.tt:0 "El período de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te alcance."
 POD_hunteradoption.106.option.b:0 "Mi alumno me ayudará en mi venganza."
 POD_hunteradoption.106.option.b.tt:0 "El período de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te alcance."
 POD_hunteradoption.107.t:0 "Una nueva luz"
 POD_hunteradoption.107.desc:0 "Atrás quedaron los días en que el peso de proteger a la humanidad contra los monstruos de la noche estaba solo sobre tus hombros. Una nueva generación se levantará y luchará."
 POD_hunteradoption.107.option.a:0 "Mi alumno se convertirá en un líder extraordinario."
 POD_hunteradoption.107.option.a.tt:0 "El período de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te alcance."
 POD_hunteradoption.107.option.b:0 "Mi alumno se unirá a la causa."
 POD_hunteradoption.107.option.b.tt:0 "El período de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te alcance."
   
 

