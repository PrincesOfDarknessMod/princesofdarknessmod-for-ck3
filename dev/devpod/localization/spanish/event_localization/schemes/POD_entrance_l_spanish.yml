l_spanish:

 POD_entrance.100.t:0 "Estás siendo encantado"
 POD_entrance.100.desc:0 "Te gusta [schemer.GetTitledFirstName]. Te gusta mucho, mucho, [schemer.GetHerHim]".
 POD_entrance.100.option.a:0 "Ejercer mi fuerza de voluntad para resistir la entrada".
 POD_entrance.100.option.b:0 "Rechazar la entrada".
 POD_entrance.100.option.c:0 "Aceptar la entrada".
 
 POD_entrance.200.t:0 "Entrar [target.GetFirstNameNoTooltip]"
 POD_entrance.200.desc:0 "Siento que mi energía mística toca la mente de [target.GetTitledFirstName]. [target.GetSheHe|U] se resiste a la entrada".
 POD_entrance.200.option.a:0 "Despierta la sangre para entrar en [target.GetHerHim]."
 POD_entrance.200.a.tt_fortitude:0 "[target.GetFirstNameNoTooltip] es hábil en la disciplina de la fortaleza y se resiste a mis poderes."
 POD_entrance.200.a.tt_willpower:0 "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir mis poderes."
 POD_entrance.200.a.success.desc:0 "Victoria"
 POD_entrance.200.a.tt_success:0 "[target.GetTitledFirstName] estará en trance de gustarme".
 POD_entrance.200.a.failure.desc:0 "Derrota"
 POD_entrance.200.a.tt_failure:0 "[target.GetTitledFirstName] se resistirá a mi entrada".
 POD_entrance.200.option.b:0 "Despierta la sangre y ejerce mi voluntad. No se me negará"
 POD_entrance.200.option.b.tt.beast:0 "#R [target.GetSheHe|U] debe amarnos! #"
 POD_entrance.200.option.c:0 "Abandona este esfuerzo, ya no deseo entrar en [target.GetHerHim]".
 POD_entrance.200.option.c.tt:0 "La entrada fallará".

 POD_entrance.300.t:0 "[target.GetFirstNameNoTooltip] Entranado"
 POD_entrance.300.desc:0 "Mediante el uso de mi poder místico, [target.GetTitledFirstName] ha sido hechizado."
 POD_entrance.300.option.a:0 "Por supuesto, [target.GetSheHe] me ama. Todos me querrán".
 POD_entrance.300.option.a.tt.beast:0 "#R ¡Todos nos mirarán y se desesperarán! #"

 POD_entrance.400.t:0 "Has llegado"
 POD_entrance.400.desc:0 "Te encuentras en la corte de [schemer.GetTitledFirstName]". 
 POD_entrance.400.option.a:0 "Mi nuevo hogar".
 
 POD_entrance.500.t:0 "Resiste la entrada"
 POD_entrance.500.desc:0 "[target.GetTitledFirstName] se ha resistido a mi entrada". 
 POD_entrance.500.option.a:0 "¡Frustrado!"
 POD_entrance.500.option.a.tt.beast:0 "#R ¡Rechazarnos significa la muerte! #"

 POD_entrance.600.t:0 "Entrada resistida"
 POD_entrance.600.desc:0 "Ya no sientes la entrada de [schemer.GetTitledFirstName]". 
 POD_entrance.600.option.a:0 "¡No te metas en mi cabeza!"

 

