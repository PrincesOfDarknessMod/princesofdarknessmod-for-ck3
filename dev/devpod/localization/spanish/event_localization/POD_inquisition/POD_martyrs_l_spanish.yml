l_spanish:
 POD_martyrs.1.t:0 "Una procesión de mártires"
 POD_martyrs.1.desc:0 "Uno tras otro, las personas que aprecias perecen en la lucha contra el Adversario. Por muy brillantes que puedan brillar con virtud, parece ser solo cuestión de tiempo antes de que su llama sea engullida, sofocada y extinguida por la implacable oscuridad. A veces, cuando cierras los ojos, ves los rostros de los que murieron, violenta y prematuramente, mirándote con expresiones indescifrables."
 POD_martyrs.1.a:0 "Y me siento honrado de seguir sus pasos."
 POD_martyrs.1.a.tt:0 "Esta opción está disponible porque tengo el rasgo [GetTrait('beatific').GetName( GetPlayer )]."
 POD_martyrs.1.b:0 "¿Qué me está diciendo Dios?"
 POD_martyrs.1.b.tt:0 "Orarás por guía."
 POD_martyrs.1.c:0 "¡No permitiré que esto me pase a mí!"
 POD_martyrs.1.c.tt:0 "Tomará un curso intensivo de defensa personal."
 POD_martyrs.1.d:0 "Todos tienen que morir eventualmente."
 POD_martyrs.2.t:0 "La verdadera fe no cuestiona."
 POD_martyrs.2.desc:0 "Tú lo sabes desde hace mucho tiempo: solo hay una dirección a seguir y esa es hacia la luz de Dios. Es completamente irrelevante qué tipo de sufrimiento se encuentra en el camino para ti o cualquier otra persona, simplemente no hay otra opción que hacer. No te molesta si estás a punto de pisar brasas ardientes o serpientes venenosas porque estás siguiendo al Señor."
 POD_martyrs.2.a:0 "Nunca hubo ninguna duda."
 POD_martyrs.3.t:0 "¡Toma tu cruz!"
 POD_martyrs.3.desc:0 "Poco tiempo después de su oración, experimenta una especie de empujón suave que envía su mente a una conclusión única y clara: toda su vida prometió seguir el camino de Cristo, ¿por qué debería desviarse de él en su sección final? La convicción de que seguir al Señor hasta el martirio sería la máxima expresión de tu fe te inunda como el agua fresca de un manantial en un sofocante día de verano. Tu corazón se endereza y se llena de alegría."
 POD_martyrs.3.a:0 "¡Aleluya!"
 POD_martyrs.4.t:0 "Un silencio ensordecedor."
 POD_martyrs.4.desc:0 "Te recluyes para rezar en paz y en lugar del habitual sentimiento reconfortante de cercanía a Dios te invade una sensación de soledad aplastante. No hay el más mínimo susurro de tranquilidad en tu cabeza, ni el más sutil toque acariciando tu alma, solo silencio. Estás solo, más que nunca."
 POD_martyrs.4.a:0 "Dios mío, Dios mío, ¿por qué me has desamparado?"
 POD_martyrs.5.t:0 "Armado y listo."
 POD_martyrs.5.desc:0 "Ya sea que uno se enfrente a abominaciones infernales o matones comunes, nunca está de más dominar un arma y después de semanas de intensos ejercicios y combates, te sientes mucho más competente. Es muy incierto si este conjunto de técnicas recién adquiridas te permitirá salir ileso de la próxima confrontación con el enemigo, pero te tranquiliza tener el arma en tus manos. Sabes que no eres invencible, pero al menos no te sientes indefenso."
 POD_martyrs.5.a:0 "Llegaré a sus corazones con el evangelio o con esta afilada punta de acero."
 POD_martyrs.6.t:0 "Irremediablemente indefenso."
 POD_martyrs.6.desc:0 "Han pasado semanas y apenas puedes ejecutar las técnicas que te enseñan sin lastimarte o asumir las posturas sin caerte. Es cierto que te saltaste algunas clases, pero una persona no puede hacer mucho en un día. Cualquiera que sea la causa, los resultados del entrenamiento son dolorosamente decepcionantes, sientes que apenas puedes defenderte de un maniquí de práctica, y mucho menos de un engendro del infierno."
 POD_martyrs.6.a:0 "Me siento más vulnerable que antes de empezar."
 POD_martyrs.7.t:0 "La vida es cruel y luego mueres."
 POD_martyrs.7.desc:0 "¿Qué diferencia hay si mueres desmembrado por un engendro de Satanás o por alguna plaga inmunda? ¿Hay alguien que pueda decir que uno es mejor o peor que el otro? Uno debe atesorar cada momento en que no tenga un dolor horrible, porque solo empeora a partir de ahí."
 POD_martyrs.7.a:0 "Es lo que es."
