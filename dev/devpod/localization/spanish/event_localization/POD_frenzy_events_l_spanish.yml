l_spanish:

 POD_vampire_frenzy_events.001.t:0 "¡Frenesí de hambre!"
 POD_vampire_frenzy_events.001.desc:0 "La bestia aúlla en tu interior, luchando por liberarse. La has matado de hambre durante demasiado tiempo, y ahora te exige que le des las riendas para que pueda realizarse a sí misma. La bestia pretende liberarse y encontrar un vasallo del que alimentarse para saciar su insaciable sed de sangre de la fuente más cercana. Su control sobre tu cuerpo aumenta a cada momento, y los bordes de tu vista se vuelven rojos. Puedes intentar luchar contra la bestia, pero dejarte llevar se sentiría tan bien...... #R ¿Por qué luchar, cuando ambos sabemos que voy a ganar? "
 POD_vampire_frenzy_events.001.succumb:0 "Sucumbir al frenesí"
 POD_vampire_frenzy_events.001.succumb.beast:0 "#R Deja que te muestre la verdadera satisfacción"
 POD_vampire_frenzy_events.001.fight:0 "Lucha contra el frenesí"
 POD_vampire_frenzy_events.001.fight.beast:0 "#R Esto no es suficiente. TÚ no eres suficiente".
 POD_vampire_frenzy_events.001.fightwp:0 "Lucha contra el frenesí con toda tu fuerza de voluntad"
 POD_vampire_frenzy_events.001.fightwp.beast:0 "#R Si no es hoy, que sea mañana.... mejor ríndete ahora cariño"
 POD_vampire_frenzy_events.001.fight.failed:0 "La bestia toma el control"
 POD_vampire_frenzy_events.001.drain:0 "Iré a buscar a uno de mis sirvientes mortales y los drenaré."
 POD_vampire_frenzy_events.001.desc.instinct:0 "La bestia aúlla dentro de ti, luchando por liberarse. La has matado de hambre durante demasiado tiempo, y ahora exige que le des las riendas para poder realizarse. La bestia pretende liberarse y encontrar un vasallo del que alimentarse para saciar su insaciable sed de sangre de la fuente más cercana. Su control sobre tu cuerpo aumenta a cada momento, y los bordes de tu vista se vuelven rojos. Puedes sentir la presión detrás de tus ojos, y sabes que ha llegado el momento de montar la ola y dejar que la bestia salga a jugar. pero ¿cómo lo harás?"
 POD_vampire_frenzy_events.001.vamp.beast:0 "#R ¿Beber de otro vampiro? ¡Qué exótico!"
 POD_vampire_frenzy_events.001.drain.beast:0 "#R Simple y al grano. Me gusta".
 POD_vampire_frenzy_events.001.vamp:0 "Puedo oler la dulce vitae en los otros kindred en la corte".
 POD_vampire_frenzy_events.001.vamp:0 "#R ¿Beber de otro vampiro? Qué exótico!"
 POD_vampire_frenzy_events.001.breach.beast:0 "#R Porque eso siempre funciona, ¿verdad?"
 POD_vampire_frenzy_events.001.social:0 "Me alimentaré aquí y ahora. No me importa lo que piense el tribunal".
 POD_vampire_frenzy_events.001.social.beast:0 "#R Escandaloso!"
 POD_vampire_frenzy_events.001.breach:0 "Correré a las calles y me alimentaré de un mortal que pase".
 POD_vampire_frenzy_events.001.breach:0 "#R Porque eso siempre funciona, ¿verdad?"
 POD_vampire_frenzy_events.201.t:0 "Frenesí de hambre: Repercusiones"
 POD_vampire_frenzy_events.201.desc:0 "Te despiertas en completo éxtasis, incapaz de concentrarte en nada de lo que te rodea. Pasan unos instantes y te das cuenta de que el placer emana de la mortal que está bajo tus colmillos. Te apartas para descubrir a [mortal.GetTitledFirstName], uno de tus sirvientes humanos. Parece que la bestia le ha atacado utilizando tu cuerpo.\N[mortal.GetTitledFirstName] no se mueve, y una rápida comprobación demuestra que a [mortal.GetSheHe] no le queda sangre. A menos que hagas algo, [mortal.GetTitledFirstName] morirá en tus brazos. #R [mortal.GetSheHe] nos sirvió más en la muerte que en la vida".
 POD_vampire_frenzy_events.201.kill:0 "No hay nada que pueda hacer. [mortal.GetTitledFirstName] morirá".
 POD_vampire_frenzy_events.201.kill.beast:0 "#R El mortal cumplió su propósito".  
 POD_vampire_frenzy_events.201.embrace:0 "Los abrazaré para salvar su vida".
 POD_vampire_frenzy_events.201.embrace.beast:0 "#R ¿Es su vida lo que estás salvando, o tu conciencia? "
 POD_vampire_frenzy_events.301.t:0 "Frenesí del hambre: Repercusiones"
 POD_vampire_frenzy_events.301.desc:0 "Lo último que viste antes de descender al frenesí fue [bonder.GetTitledFirstName]. Ahora te despiertas en las cámaras de [bonder.GetHerHis], con la sangre goteando de tus colmillos. [bonder.GetTitledFirstName] está ante ti con el ceño fruncido en su rostro ceniciento. Notas que [bonder.GetSheHe] sostiene la mano sangrante de [bonder.GetHerHis]. El rastro de sangre te lleva a ti, y sientes una punzada de dolor al pensar que has herido a [bonder.GetTitledFirstName]. Las nuevas emociones hacia [bonder.GetTitledFirstName] son confusas, pero más lo es el hecho de que tu frenesí te lleve a beber de otro vampiro. [bonder.GetTitledFirstName] tampoco parece dispuesto a dar explicaciones. "
 POD_vampire_frenzy_events.301.a:0 "Me temo que esto volverá a perseguirme".
 POD_vampire_frenzy_events.301.a.beast:0 "#R Tendremos que asegurarnos de que no sea así. "
 POD_vampire_frenzy_events.401.t:0 "Frenesí del hambre: Repercusiones"
 POD_vampire_frenzy_events.401.desc:0 "La bestia eligió el peor momento para asomar la cabeza: estabas en medio de una reunión de la corte suprema. Intentas huir, pero la bestia se niega a esperar. Acabas lanzándote sobre un mortal menor sirviente de un vampiro cuyo nombre no recuerdas. El mortal sobrevivió y su dueño era demasiado insignificante como para exigir una recompensa, pero tu corte te considera ahora débil. Sientes que has perdido el respeto de tu reino".
 POD_vampire_frenzy_events.501.a:0 "Debo ocuparme de esto."
 POD_vampire_frenzy_events.501.a.beast:0 "#R Qué adorable es el terror en sus ojos."
 POD_vampire_frenzy_events.401.opinion_malus:0 "La opinión de tus vasallos sobre ti baja."
 POD_vampire_frenzy_events.401.a:0 "Me aseguraré de tener un mortal a mano en el futuro".
 POD_vampire_frenzy_events.401.a.beast:0 "#R No servirá de nada".
 POD_vampire_frenzy_events.501.t:0 "Frenesí del hambre: Repercusiones"
 POD_vampire_frenzy_events.501.desc:0 "La bestia eligió el peor momento para asomar la cabeza: estabas en medio de una reunión de la corte suprema. Consigues alejarte antes de que la bestia se apodere de ti, lo que te ahorra la humillación en la corte. Fuera, la bestia salta sobre el mortal más cercano, haciendo que hundas tus colmillos en su carne. Te despiertas después de que se haya extinguido. Te limpias la sangre de los labios, creyendo que el problema ha terminado. Sólo entonces te das cuenta de que el mortal te mira fijamente".
 
 POD_vampire_frenzy_events.601.t:0 "¡Frenesí de rabia!"
 POD_vampire_frenzy_events.601.desc.instinct:0 "Todos los vampiros tienen una bestia en su interior: una fuerza animal de malicia, rabia y hambre. Cuando los afines pierden el control, la bestia los supera, tomando la correa y persiguiendo sus deseos más básicos, ya sea la venganza, la sangre o la seguridad. Los seres humanos de tu camino intentan dominar a la bestia, montar la ola de frenesí para conseguir sus objetivos. Utilizar su poder. \Tu bestia ha sido provocada por la rabia que sientes ahora, y está tratando de liberarse. Los bordes de tu visión se enrojecen mientras afinas tu vista en lo que se te cruzó. Tus puños se cierran dolorosamente mientras intentas contenerte. El momento del frenesí es ahora, pero ¿a quién dirigirás tu rabia? "
 POD_vampire_frenzy_events.601.desc:0 "Todos los vampiros tienen una bestia en su interior: una fuerza animal de malicia, rabia y hambre. Cuando los seres queridos pierden el control, la bestia se apodera de ellos, tomando la correa y persiguiendo sus deseos más básicos, ya sea la venganza, la sangre o la seguridad. Los hermanos de tu camino intentan luchar contra la bestia, mantenerla encerrada dentro de ti. Negarle el control. \Tu bestia ha sido provocada por la rabia que sientes ahora, y está tratando de liberarse. Los bordes de tu visión se enrojecen mientras afinas tu vista en lo que te cruzó. Tus puños se cierran dolorosamente mientras intentas contenerte. Si hay un momento para luchar contra la bestia, es ahora, pero dejar que resuelva el problema por ti sería muy fácil.... "
 POD_vampire_frenzy_events.601.succumb:0 "Sucumbir al frenesí"
 POD_vampire_frenzy_events.601.succumb.beast:0 "#R Deja que te muestre la verdadera satisfacción"
 POD_vampire_frenzy_events.601.fight:0 "Lucha contra el frenesí"
 POD_vampire_frenzy_events.601.fight.beast:0 "#R Esto no es suficiente. TÚ no eres suficiente".
 POD_vampire_frenzy_events.601.fightwp:0 "Lucha contra el frenesí con toda tu fuerza de voluntad"
 POD_vampire_frenzy_events.601.fightwp.beast:0 "#R Si no es hoy, que sea mañana.... mejor ríndete ahora cariño"
 POD_vampire_frenzy_events.601.breach.beast:0 "#R ¡Sí, que se acobarden ante nosotros!"
 POD_vampire_frenzy_events.601.troops:0 "Esos guardias de ahí parecen una buena pelea...."
 POD_vampire_frenzy_events.601.troops.beast:0 "#R ¿Qué? ¿Ellos? Al menos elige a alguien que sea un reto".
 POD_vampire_frenzy_events.601.person:0 "Llevo años queriendo luchar contra esa persona..."
 POD_vampire_frenzy_events.601.person.beast:0 "#R ¿Cuánto tiempo vas a dejar que te pisoteen?"
 POD_vampire_frenzy_events.601.social:0 "¡Destrozo el objeto que esté más cerca de mí!"
 POD_vampire_frenzy_events.601.social.beast:0 "#R Golpear una pared... Qué original".
 POD_vampire_frenzy_events.601.breach:0 "¡Mostraré mi ira a los mansos mortales!"
 POD_vampire_frenzy_events.601.breach:0 "#R Sí, ¡que se acobarden ante nosotros!"
 POD_vampire_frenzy_events.601.fight.failed:0 "La bestia toma el control"
 POD_vampire_frenzy_events.701.desc:0 "Estabas caminando por el patio cuando uno de tus cortesanos se atrevió a hacer un comentario malintencionado sobre tu personaje. Inmediatamente, te pusiste frenético y te abalanzaste sobre el cortesano. Por suerte, un regimiento de guardias entrenados y equipados se interpuso entre tú y el pobre cortesano. Estás muy orgulloso de estos hombres de élite: tú mismo los entrenaste, precisamente para enfrentarse a los vampiros. Sin embargo, puede que ahora te arrepientas de haberlos entrenado, ya que utilizan tus propias tácticas en tu contra. \Eres apresado antes de que puedas causar un daño mayor, pero no saliste ileso y tampoco tu reputación. "
 POD_vampire_frenzy_events.701.a:0 "Frustrado por mis propios hombres".
 POD_vampire_frenzy_events.701.t:0 "Frenesí de ira: Repercusiones"
 POD_vampire_frenzy_events.801.t:0 "Frenesí de Furia: Repercusiones"
 POD_vampire_frenzy_events.801.desc:0 "Frenesí de ira: Repercusiones"
 POD_vampire_frenzy_events.801.victorydesc:0 "Miras a tu vasallo [target.GetTitledFirstName] tendido en el suelo, dolorido. Recuerdas lo sucedido: [target.GetTitledFirstName] te ha estado tratando con desprecio últimamente, y estaba empezando a afectar a vuestra relación profesional. Fuiste a las habitaciones privadas de [target.GetTitledFirstName] para enfrentarte a [target.GetHerHim], ¡y [target.GetSheHe] se atrevió a difamarte! \N - La escandalosa afirmación te puso frenético, y el resultado está ante ti. Si lo ocurrido sale a la luz, el resultado será desastroso. No sólo tu vasallo estará resentido, sino que todo tu reino ridiculizará tu falta de control. \Y sin embargo... Tú y [target.GetTitledFirstName] están solos aquí. Todavía es posible asegurarse de que lo que pasó se quede en esta habitación. "
 POD_vampire_frenzy_events.801.lossdesc:0 "Miras a tu vasallo [target.GetTitledFirstName], sujetando tu estómago raptado por el dolor.. Recuerdas lo sucedido - [target.GetTitledFirstName] te ha estado tratando con desprecio últimamente, y estaba empezando a afectar a vuestra relación profesional. Fuiste a las habitaciones privadas de [target.GetTitledFirstName] para enfrentarte a [target.GetHerHim], ¡y [target.GetSheHe] se atrevió a difamarte! \N - La escandalosa afirmación te puso frenético, y el dolor y la vergüenza resultantes te recorren. Si lo ocurrido sale a la luz, el resultado será desastroso. No sólo tu vasallo estará resentido, sino que todo tu reino ridiculizará tu falta de control. Y encima, ¡has perdido! \Y sin embargo... Tú y [target.GetTitledFirstName] están solos aquí. Todavía es posible asegurar que lo que pasó se quede en esta habitación. "
 POD_vampire_frenzy_events.801.kill:0 "No pueden decirle a nadie si están muertos...."
 POD_vampire_frenzy_events.801.bribe:0 "Si [target.GetSheHe] promete no decírselo a nadie, yo le prometo a [target.GetHerHim] un favor."
 POD_vampire_frenzy_events.801.leave:0 "No me quedaré aquí ni un momento más, independientemente de las opiniones de los tribunales."
 POD_vampire_frenzy_events.901.t:0 "Frenesí de ira: Repercusiones"
 POD_vampire_frenzy_events.901.desc:0 "La fiesta iba bien hasta que dos de tus invitados borrachos deciden pelearse en medio de la pista de baile. Les ordenas que se detengan y te ignoran descaradamente. Repites tu orden, esta vez más fuerte. Siguen desafiando. Con la rabia que te caracteriza, te acercas a ellos y les gritas que se detengan, pero no surte efecto. ¡Qué indignidad! \Intentas separarlos físicamente y tienen la audacia de empujarte. ¡Tú, su legítimo señor! Tu rabia sobrepasa tu razón mientras gritas y golpeas un pilar con la fuerza suficiente para hacerlo añicos. Todos te miran ahora, y te das cuenta de lo que debe parecer: has perdido los nervios y has causado daños en tu propio castillo. Ya puedes ver algunas miradas de desaprobación".
 POD_vampire_frenzy_events.901.a:0 "Esto costará oro arreglarlo".
 POD_vampire_frenzy_events.101.t:0 "Frenesí de Furia: Repercusiones"
 POD_vampire_frenzy_events.101.desc:0 "Miras tus manos ensangrentadas, tu boca gotea gotas de vitae sobre tus ropas rotas y sucias. Ha sido toda una noche.... No recuerdas cómo empezó, pero sí que saliste a las calles mortales con rabia y destruiste todo lo que tenías a la vista. Te sentías como un dios: imparable, todopoderoso y aterrador. Los mortales huían despavoridos, y los pocos que se resistían caían ante tus colmillos. \Dejando de lado las implicaciones morales de tus horribles acciones, has causado un gran revuelo en el mundo mortal. No muchos escaparon, pero los que lo hicieron seguramente difundirán historias sobre tu gran poder y monstruosidad. Seguro que frustra a tus súbditos, pero también atraerá una atención no deseada".
 POD_vampire_frenzy_events.101.a:0 "Las cosas que puedo hacer si cedo el control...."
 
 POD_vampire_frenzy_events.801.toast:0 "Has perdido un combate con [target.GetTitledFirstName]"
 
 
 
 
 
