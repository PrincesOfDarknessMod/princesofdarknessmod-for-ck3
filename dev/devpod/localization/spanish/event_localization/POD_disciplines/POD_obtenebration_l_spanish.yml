l_spanish:
 POD_drain_the_life.001.t:0 "Drenar la vida"
POD_drain_the_life.001.desc:0 "Con tu nivel actual de obtención puedes cubrir de oscuridad la capital de [target.GetFirstName]. Pero tal poder tiene un coste".
POD_drain_the_life.001.desc.ahrimans_demesne:0 "Eres el maestro de la oscuridad. Con tu gran dominio de Abyss, puedes cubrir todo el reino que controla [target.GetFirstName] con una oscuridad que devora todo lo que toca. Semejante poder tiene un coste, y a [target.GetFirstName] no le gustará".
POD_drain_the_life.001.option.a:0 "¡Con mi inmenso control sobre el Abismo, cubriré de oscuridad el reino de [target.GetHerHis]!"
POD_drain_the_life.001.option.a.tt:0 "Intentarás lanzar el poder Drenar la vida en el reino de [target.GetFirstName], este poder afectará a todos los condados que [target.GetSheHe] controle, incluso a las tierras que [target.GetHerHis] vasallas"
POD_drain_the_life.001.option.a.desc:0 "Desafío oscuro"
POD_drain_the_life.001.option.a.success:0 "Usas con éxito el poder Drenar la Vida"
POD_drain_the_life.001.option.a.tt.attacker_wins:0 "El reino de [target.GetFirstName] se sumerge en la oscuridad que devora todo lo que toca"
POD_drain_the_life.001.option.a.failure:0 "Fallas al usar el poder Drenar la vida"
POD_drain_the_life.001.option.a.tt.attacker_lost:0 "Fallas"
POD_drain_the_life.001.option.b:0 "Pronto, la capital de [target.GetFirstName] quedará envuelta en la oscuridad"
POD_drain_the_life.001.option.b.tt:0 "Has lanzado el poder Drenar la vida sobre el condado capital de [target.GetFirstName]"
POD_drain_the_life.001.option.c:0 "No es el momento adecuado"
POD_drain_the_life.001.option.c.tt:0 "Dejarás de intentar lanzar Drenar la vida sobre el dominio de [target.GetFirstName]"

POD_todo_el_reino_fue_drenado_toast:0 "Una horrible oscuridad fue lanzada sobre tu reino por [atacante.GetFirstName]"
 POD_whole_realm_was_drained_toast:0 "[Attacker.GetFirstName] lanzó una horrible oscuridad en tu reino."
 POD_drained_enemy_realm_toast:0 "Has lanzado con éxito una horrible oscuridad sobre el reino de [target.GetFirstName]"
POD_drain_realm_toast:0 "Has lanzado con éxito oscuridad horrible sobre el reino de [target.GetFirstName]"
POD_drain_the_life_failed_toast:0 "No has podido lanzar oscuridad horrible sobre el reino de [target.GetFirstName]"
POD_capital_county_drained_toast:0 "La horrible oscuridad fue lanzada sobre tu capital por [atacante.GetFirstName]"


POD_shadow_twin.001.t:0 "Gemelo de sombra"
POD_shadow_twin.001.desc:0 "Con tu dominio de la Obtenebración puedes intentar animar tu propia sombra y convertirla en un duplicado de ti mismo. Una criatura así será de gran ayuda en la eterna lucha del Jyhad, pero tales poderes tienen un coste."
POD_shadow_twin.001.option.a:0 "Ordeno a las sombras, es hora de que obedezcan"
POD_shadow_twin.001.option.a.tt:0 "Intentarás crear una Sombra Gemela"
POD_shadow_twin.001.option.a.desc:0 "Una lucha con tu oscuridad interior"
POD_shadow_twin.001.option.a.tt.success:0 "Se ha creado un Gemelo de Sombra con éxito"
POD_shadow_twin.001.option.a.tt.failure:0 "No consigues crear un Gemelo de Sombra"
POD_shadow_twin.001.option.b:0 "No es el momento adecuado"
POD_shadow_twin.001.option.b.tt:0 "Vas a abandonar tu idea de crear un Gemelo de Sombra"

POD_shadow_twin.002.t:0 "Shadow Twin II"
POD_shadow_twin.002.desc:0 "Con tu dominio de la Obtenebración consigues crear con éxito un Gemelo de Sombra, ahora es el momento de dar órdenes."
POD_shadow_twin.002.option.a:0 "Incluso las Sombras me obedecen"
POD_shadow_twin.002.option.a.tt:0 "Se ha creado con éxito un Gemelo de Sombra".

POD_shadow_twin.003.t:0 "Gemelo de sombra II"
POD_shadow_twin.003.desc:0 "Ni siquiera tu dominio de la Obtenebración es suficiente para crear un Gemelo de Sombra... por ahora".
POD_shadow_twin.003.option.a:0 "Todavía no estoy preparado para comandar sombras"
POD_shadow_twin.003.option.a.tt:0 "No has conseguido crear un Gemelo de Sombra"

POD_shadow_twin.death_management.t:0 "Perder una parte de ti mismo"
POD_shadow_twin.death_management.desc:0 "Han llegado noticias graves, tu Gemelo de Sombra, una parte de tu propia alma, ha muerto. Puedes sentir un terrible vacío en tu interior".
POD_shadow_twin.death_management.option.a:0 "Otro que muerde el polvo"
POD_shadow_twin.death_management.option.a.tt:0 "Tu gemelo de la sombra ha muerto"
