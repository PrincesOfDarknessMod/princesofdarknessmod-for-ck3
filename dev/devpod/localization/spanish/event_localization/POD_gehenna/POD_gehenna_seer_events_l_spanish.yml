l_spanish:
 POD_gehenna_seer.100.t:0 "Aparece un extraño místico"
POD_gehenna_seer.100.desc:0 "Durante tus muchas noches, has conocido a bastantes individuos locos y sabios, pero en última instancia insignificantes. Esta noche, sin embargo, tu corte está llena de susurros sobre un vampiro que ha estado predicando profecías sobre horribles acontecimientos que traerán la Gehenna. Aunque normalmente ignorarías a esa figura, hay algo en las profecías que es extrañamente convincente. Un individuo así podría ser peligroso si se le deja desatendido".
POD_gehenna_seer.100.a:0 "Las revelaciones pueden ser ciertas..."
POD_gehenna_seer.100.b:0 "¡Saca a este lunático desquiciado de mis dominios!"

#Loc genérico para las profecías de Gehenna Seer
POD_gehenna_seer.gen.t:0 "Profecía de Gehenna"
POD_gehenna_seer.gen.a:0 "¡Acepta la profecía!"
POD_gehenna_seer.gen.b:0 "¡Rechazar la profecía!"

#Locs no genéricos para las profecías de Gehenna Seer
POD_gehenna_seer.300.desc:0 "[gehenna_seer.GetTitledFirstName] anuncia una funesta profecía a su corte:\n'Y la Madre Oscura\nserá traída a la luz\ny allí, en el valle de Enoch, habrá una batalla\nun duelo de Padre Oscuro y Madre Oscura\nLa Reina Demonio morderá profundamente\nEl Rey Maldito morderá más profundamente.'"
POD_gehenna_seer.400.desc:0 "[gehenna_seer.GetTitledFirstName] marca los signos de Gehenna:\n'Marca la sombra que\nfluye\nmarca el dragón\nque se levanta\nmarca la oscuridad\nque se mueve\nmarca la sombra de la\nluna.'"
POD_gehenna_seer.500.desc:0 "[gehenna_seer.GetTitledFirstName] cae en trance murmurando, 'Conocerás estos tiempos, porque una mano negra se alzará y ahogará a todos los que se opongan a ella, y los que coman sangre de corazón florecerán, y los Kindred se agolparán cada uno a lo suyo, y la vitae será tan rara como los diamantes.'"
POD_gehenna_seer.600.desc:0 "[gehenna_seer.GetTitledFirstName] tiene una revelación:\n'Llegará un momento,\ncuando las cabezas de tres Príncipes\nvigilarán el ardor de la aurora\nen una columna de blanco.'"
POD_gehenna_seer.700.desc:0 "[gehenna_seer.GetTitledFirstName] tiene una advertencia profética:\n'Y conocerás estos últimos tiempos\npor el Tiempo de la Sangre Fina,\nque marcará a los vampiros que\nno pueden Engendrar,\nlos conocerás por los Sin Clan,\nque vendrán a gobernar.'"
POD_gehenna_seer.800.desc:0 "[gehenna_seer.GetTitledFirstName] revela que la esperanza vendrá de la kine:\Nla última Hija de Eva,\Ny en ella se decidirá el destino de todos.\NY no conocerás a esta mujer, excepto por la\Nmarca de la Luna en ella,\Ny se enfrentará a la traición, el odio y el dolor\Npero en ella está la última esperanza.'"
POD_gehenna_seer.900.desc:0 "[gehenna_seer.GetTitledFirstName] advierte de la llegada de la madre devoradora:\n'Llegará un momento en que un hambre ancestral despertará\nen lo profundo de los bosques del norte\ny consumirá a todos sus hijos'."
POD_gehenna_seer.1000.desc:0 "[gehenna_seer.GetTitledFirstName] profetiza una amenaza subterránea:\n'Llegará un momento\nen el que una oscuridad anciana\nse despertará\nen lo profundo de una ciudad que ha olvidado\ny sorprenderá a los ancianos, sus hijos.'"
POD_gehenna_seer.1100.desc:0 "[gehenna_seer.GetTitledFirstName] advierte sobre el fin de los tiempos:\n'Sobre estos signos, debes saber,\nque Gehenna espera, incluso en la puerta,\ncomo un actor espera en las alas\n¡Está llegando! Está cerca. Brilla el sol negro, brilla la sangre de la luna.
 POD_gehenna_seer.1100.desc:0 "[gehenna_seer.GetTitledFirstName] advierte sobre el fin de los tiempos:\n\n'En estas señales, debes saber,\nque Gehenna espera, incluso en la puerta,\como un actor espera entre bastidores\n¡Se acerca! ¡Está cerca!\n\n¡Brilla negro el sol!\n¡Brilla sangre la luna!\nLa Gehenna llegará pronto.'"
POD_gehenna_seer.1200.desc:0 "Cayendo en trance, [gehenna_seer.GetTitledFirstName] balbucea:\N¡Silencio! Escuchad el grito del cuervo. La quietud del viento se levanta caliente en la calle, las torres se esconden, la oscuridad del día, cuando los sueños de Lasombra se hacen realidad, el día en que la luna corre como la sangre y el sol se levanta negro en el cielo, ese es el día de los condenados, cuando los hijos de Caine resucitarán".
 POD_gehenna_seer.1300.desc:0 "[gehenna_seer.GetTitledFirstName] mira al suelo y luego al cielo:\n\n'Y el mundo se enfriará\ny cosas inmundas hervirán del suelo\ny grandes tormentas rodarán, relámpagos encenderán\nfuegos, animales se pudrirán y sus cuerpos,\ntretorcidos, caerán.\nAsí, también, nuestros abuelos se levantarán\ndel suelo\nRomperán su ayuno en la\nprimera parte de nosotros\nNos consumirán enteros.'"
 POD_gehenna_seer.1400.desc:0 "Murmurando en lenguas, las palabras de [gehenna_seer.GetTitledFirstName] de repente ganan claridad:\n\n'No sabremos lo que sucederá,\npero el cielo se rasgará, y la tierra abajo\nY las fuerzas del Infierno se brotarán de la tierra\nEn el Tercer Día, habrá silencio\nlos cuervos se alimentarán de la carroña\nla peste bailará entre las ruinas\nlos últimos de los Salvajes dejarán este lugar\nlos últimos de las Bestias Lunares luchará\ny caerá.'"
POD_gehenna_seer.1300 .desc:0 "[gehenna_seer.GetTitledFirstName] mira al suelo y luego al cielo:\n'Y el mundo se enfriará\ny las cosas inmundas hervirán desde el suelo\ny rodarán grandes tormentas, se encenderán\nlos fuegos, los animales se pudrirán\ny sus cuerpos, retorcidos, caerán. \Así, también, nuestros Abuelos se levantarán de la tierra y romperán su ayuno en la primera parte de nosotros y nos consumirán por completo".
POD_gehenna_seer.1400 .desc:0 "Murmurando en lenguas, [gehenna_seer. GetTitledFirstName] ganan repentinamente claridad: "No sabremos lo que ocurrirá, pero el cielo se desgarrará y la tierra se hundirá, y las fuerzas del infierno surgirán de la tierra. En el tercer día, habrá silencio, los cuervos se alimentarán de la carroña, la peste bailará entre las ruinas, los últimos salvajes abandonarán este lugar, las últimas bestias de la luna lucharán y caerán".
 POD_gehenna_seer.1700.desc:0 "[gehenna_seer.GetTitledFirstName] presagia:\n\nNo te convertirás en un dios para los Hijos de Set.\nPorque el de Arriba, cada vez más celoso en su cielo,\nderribará el linaje de Caín para siempre.\nRecuerda amable Astareth de rostro,\nRecuerda al Baal gordo y dorado.\nRecuerda al fuerte Tammauz,\nSabe que los Hijos de Seth se levantarán\ncon armas del Uno de Arriba,\ny nos conquistarán, si somos como Dioses para ellos.'"
 POD_gehenna_seer.1800.desc:0 "[gehenna_seer.GetTitledFirstName] pronostica:\n\n'Nos servirán mientras el Sol pasea por el cielo,\ny velarán por nuestras casas, con agua que apaga,\ncontra el Fuego de Miguel.\nNos alimentarán. y nos darán ropa,\nDanzarán para nosotros, y nos darán canciones,\nSe acostarán con nosotros, y nos darán consuelo.\nNos aconsejarán, y escucharemos sus consejos.\nEllos adorarán nosotros, y no debemos permitir su adoración.'"
 POD_gehenna_seer.1900.desc:0 "[gehenna_seer.GetTitledFirstName] profetiza:\n\n'¡Y de aquellos cuya sangre es agua!\nLas ciudades del Oeste arderán de furia,\nY una gran rueda del Este,\nDesde las tierras sin forma,\nLas aplastará !\nEn la última noche\nCuando la luna es plata de oscuridad\n¡Llega el [Abrazo|E] final!\n¡Brilla negro el sol!\n¡Brilla negro la luna!\n¡Las aguas suben!"
POD_gehenna_seer.1500.desc:0 "[gehenna_seer.GetTitledFirstName] cae en trance y murmura:\NY los [antediluvianos|E] harán para sí mismos\Nun Imperio de la Sangre\NGobernarán con garras de hierro\Ny desgarrarán los corazones de todos los que aún están vivos\NY toda la suma de los vivos de la tierra vendrá\Na vivir en la Última Ciudad, llamada Gehenna.'"
POD_gehenna_seer.1600.desc:0 "[gehenna_seer.GetTitledFirstName] dice: "Y habrá un reinado de mil años, y no habrá amor, ni vida, ni piedad, los poderosos serán como esclavos, los virtuosos se convertirán en sucios, todo buen regalo, y todo regalo perfecto será manchado por el Padre de las Tinieblas, cuyo poder vendrá de los reinos inferiores".
POD_gehenna_seer.1700 .desc:0 "[gehenna_seer.GetTitledFirstName] presagia: "No te convertirás en un Dios para los hijos de Seth". \Recuerda a Ashtareth, de rostro amable, recuerda a Baal, de grasa dorada, recuerda a Tammauz, sabe que los Hijos de Seth se levantarán con las armas de los de arriba y nos conquistarán, si somos como dioses para ellos".
POD_gehenna_seer.1800  y nos proveerán de ropa,\Nellos bailarán para nosotros, y nos proveerán de canciones,\Nellos se acostarán con nosotros, y nos proveerán de consuelo.\NEllos nos aconsejarán, y nosotros escucharemos sus consejos.\NEllos nos adorarán, y nosotros no debemos permitir su adoración.'"
 POD_gehenna_seer.2400.desc:0 "[gehenna_seer.GetTitledFirstName] aconseja:\n\n'Escucha las palabras del profeta sobre sueños llenos de sangre y noches acortadas.\nSobre el hambre que se levanta para reclamar lo suyo, sobre la arrogancia convertida en ceniza.\nEscucha las palabras del vidente, cuya visión rasga el velo del tiempo\nY al guerrero de las noches perdidas, cuya espada clama venganza.\nEscucha la palabra del erudito, para quien el conocimiento es una maldición.'"
POD_gehenna_seer.1900 ¡.desc:0 "[gehenna_seer.GetTitledFirstName] profetiza:\N¡Y de aquellos cuya sangre es Agua!\NLas ciudades del Oeste arderán de rabia,\Ny una gran rueda del Este,\Nde las tierras sin forma,\Nlos aplastará! \En la última noche, cuando la luna sea una plata de oscuridad, ¡vendrá el [abrazo] final! ¡Brilla el sol! ¡Brilla la luna! ¡Las aguas se levantan!"
POD_gehenna_seer.2000.desc:0 "[gehenna_seer.GetTitledFirstName] predice:\NVean al coloso de acero a horcajadas sobre el mundo\NMantengan a los gusanos en sus pies.\NCuando el gigante se tambalea, los gusanos se regocijan,\Nporque habrá comida en abundancia cuando el gigante caiga.'"
 POD_gehenna_seer.2700.desc:0 "[gehenna_seer.GetTitledFirstName] presagia:\n\n'He aquí, uno muere en silencio, llora sin ser escuchado.\nLos niños llevarán su nombre pero no su sangre.\nBienaventurados en la ignorancia, saboreando la ceguera,\nSus hijos vivirán los minutos uno a uno. uno,\nMientras aquellos que saborean el conocimiento secreto tiemblan,\nRecorren el mundo en busca de hasta la última gota de verdad.\nNo hay salvación en matar.\Ni los condenados jamás olvidan.'"
POD_gehenna_seer.2100.desc:0 "[gehenna_seer.GetTitledFirstName] fortells:\n'Hear the howls in the night\nAs the wolves of Adam\nCast themselves into the Dragon's coils.\nSmell the brother's blood from time's beginning.'"
POD_gehenna_seer.2200.desc:0 "[gehenna_seer.GetTitledFirstName] presagia:\NVe la cámara rota de 500 años\Ny el cristal destrozado en el suelo.\NVe las piedras llorando y los dragones libres.\NLilith está aquí.\NLilith está libre.'"
POD_gehenna_seer.2300.desc:0 "[gehenna_seer.GetTitledFirstName] declara:\N "Quinientos años se unirán a siete\Nreglando en desafío a los ángeles\Nbuscando la unidad entre los condenados.\NCuidado con el [cainita|E] que olvida tanto su maldición\Ncomo para soñar con la armonía de los mortales.'"
POD_gehenna_seer.2400 .desc:0 "[gehenna_seer.GetTitledFirstName] aconseja:\NEscucha las palabras del profeta sobre los sueños llenos de sangre y las noches acortadas.\NDel hambre que se levanta para reclamar lo suyo, de la arrogancia convertida en ceniza. \Escuchad las palabras del vidente, cuya visión rasga el velo del tiempo.Y del guerrero de las noches perdidas, cuya espada clama venganza.Escuchad la palabra del erudito, para quien el conocimiento es una maldición".
POD_gehenna_seer.2500.desc:0 "[gehenna_seer.GetTitledFirstName] advierte:\NLos antiguos horrores no son más que sueños de lo que vendrá.\NDe ellos vendrá la advertencia.\NDe ellos vendrá la sabiduría.\NDe ellos vendrá la matanza.'"
POD_gehenna_seer.2600.desc:0 "[gehenna_seer.GetTitledFirstName] profetiza:\NDentro del get de Caine hay un hambre que se agita.\NUna, dos, tres veces la llamada al poder y la muerte\Ndesgarrará las almas de los Trece.\NEsta es la muerte sin derramamiento de sangre,\Nesta es la tumba que no tiene fantasmas.'"
POD_gehenna_seer.2700 .desc:0 "[gehenna_seer.GetTitledFirstName] presagia:\N "He aquí que uno muere en silencio, llora sin ser escuchado.\NLos hijos llevarán su nombre pero no su sangre. \Mientras los que saborean el conocimiento secreto tiemblan, buscando en el mundo hasta la última gota de verdad.
