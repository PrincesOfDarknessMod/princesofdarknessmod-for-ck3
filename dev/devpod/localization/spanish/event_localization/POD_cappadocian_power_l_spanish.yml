l_spanish:
 POD_cappadocian_power.2000.title:0 "Niño estudioso"
 POD_cappadocian_power.2000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo tuvo un gran éxito! Han reparado errores de juicio, suavizado agravios y construido nuevos puentes. \n [recipient.GetName] Está muy contento con el regalo que le diste. Le han notificado que su chiquillo permanecerá al lado de [recipient.HerHis] por el momento, y que le deben un favor por los servicios prestados."
 POD_cappadocian_power.3000.title:0 "Niño estudioso"
 POD_cappadocian_power.3000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo tuvo un gran éxito! Han aumentado los ingresos, eliminado gastos innecesarios y mejorado los lazos con la población. \n [recipient.GetName] Está muy contento con el regalo que le diste. Le han notificado que su chiquillo permanecerá al lado de [recipient.HerHis] por el momento, y que le deben un favor por los servicios prestados."
 POD_cappadocian_power.4000.title:0 "Niño estudioso"
 POD_cappadocian_power.4000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo tuvo un gran éxito! Han entrenado tropas, construido líneas de suministro y fabricado nuevas estrategias. \n [recipient.GetName] Está muy contento con el regalo que le diste. Le han notificado que su chiquillo permanecerá al lado de [recipient.HerHis] por el momento, y que le deben un favor por los servicios prestados."
 POD_cappadocian_power.5000.title:0 "Niño estudioso"
 POD_cappadocian_power.5000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo tuvo un gran éxito! Han construido conexiones, eliminado posibles fugas y capacitado a operarios clandestinos. \n [recipient.GetName] Está muy contento con el regalo que le diste. Le han notificado que su chiquillo permanecerá al lado de [recipient.HerHis] por el momento, y que le deben un favor por los servicios prestados."
 POD_cappadocian_power.6000.title:0 "Niño estudioso"
 POD_cappadocian_power.6000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo tuvo un gran éxito! Han leído las Escrituras, han actuado con virtud y han mejorado los lazos con la población. \n [recipient.GetName] Está muy contento con el regalo que le diste. Le han notificado que su chiquillo permanecerá al lado de [recipient.HerHis] por el momento, y que le deben un favor por los servicios prestados."
 POD_cappadocian_power.7000.title:0 "Chiquillos desastrosos"
 POD_cappadocian_power.7000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo había fracasado por completo! Han causado daños incalculables y caos en su campo elegido. \n [recipient.GetName] Está furioso por el 'regalo' que les diste. Te han notificado que tu chiquillo regresará a tu corte lo antes posible y que están muy decepcionados por cómo decidiste abusar de su confianza. Esperarán que hagas las paces, tarde o temprano."
 POD_cappadocian_power.8000.title:0 "Chiquillos desastrosos"
 POD_cappadocian_power.8000.desc:0 "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo había fracasado por completo! Han causado daños incalculables y caos en su campo elegido. \n [recipient.GetName] Está furioso por el 'regalo' que les diste. Te han notificado que tu chiquillo se quedará al lado de [recipient.HerHis], pero ya no como invitado, y están muy decepcionados por cómo decidiste abusar de su confianza. Esperarán que hagas las paces, tarde o temprano."
 POD_cappadocian_power.optiongood:0 "Excelente."
 POD_cappadocian_power.optionbad:0 "¿Había cometido un error?....."
 POD_cappadocian_power.toast:0 "Childe ya no es concejal de [recipient.GetName]"
