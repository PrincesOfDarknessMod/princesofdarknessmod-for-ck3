 inquihunt_desc:0 "Destruiré [SCHEME.GetTarget.GetShortUINameNoTooltip] y purgaré su sucia mancha de esta tierra"
 inquihunt_desc_general:0 "Intenta localizar al demonio antes de lanzar un asalto"
 INQUIHUNT_SUCCESS_DESC:0 "Iniciarás el ataque final contra [TARGET_CHARACTER.GetShortUIName]"
 INQUIHUNT_DISCOVERY_DESC:0 "¡Icono de advertencia! Estás expuesto por el [crimen|E] de caza de brujas"
 inquihunt_my_intrigue:1 "Tu Intriga: $VALUE|=+0$"
 inquihunt_my_rival:1 "Tu víctima: $VALUE|=+0$"
 POD_inquihunt.667.t:0 "Perdido el rastro"
 POD_inquihunt.667.desc:0 "Tu presa ha conseguido escapar de tus persistentes intentos de localizarla. Probablemente ayudada por otros agentes del Diablo, se ha arrastrado desde el agujero del que salió, escondiéndose de ti. Sin embargo, Dios es paciente y tú también. No evitarán la hoguera para siempre".
 POD_inquihunt.667.option.a:0 "Parece que me esperaban"
 POD_inquihunt.1.t:0 "A la caza"
 POD_inquihunt.1.desc:0 "Por fin has rastreado al demonio hasta su guarida. No puede haber errores ya que la pobre gente de los alrededores ha perdido claramente el amor de Dios. Son paranoicos, cáscaras sin alma que temen salir de noche e incluso la Iglesia yace estéril.\NTú y tu pequeño séquito son claramente la única esperanza de este lugar. Mientras instalas tu campamento, es hora de reflexionar sobre tu próximo movimiento. El Señor ciertamente os ha guiado hasta esta guarida del mal, pero cómo destruirla queda a vuestra apreciación..."
 POD_inquihunt.1.option.a:0 "El pueblo pequeño aún no está perdido en la oscuridad. Prediquemos".
 POD_inquihunt.1.option.aa.effect.success.desc:0 "Un éxito crítico asegurará una rápida victoria para tu causa"  
 POD_inquihunt.1.option.ab.effect.success.desc:0 "Un empate... el demonio seguirá causando problemas"      
 POD_inquihunt.1.option.ac.effect.success.desc:0 "No cometas errores, o el enemigo seguramente acabará contigo rápidamente"      
 POD_inquihunt.1.option.f:0 "Tengo un mal presentimiento sobre esto"       
 POD_inquihunt.1.option.f.custom:0 "Este no es el lugar ni el momento. Volverás en otro momento".       
 POD_inquihunt.1.option.b:0 "¡Soldados de Dios! Asaltamos este castillo hoy!"
 POD_inquihunt.1.option.c:0 "Destruyamos sus activos y aislemos al demonio primero".
 POD_inquihunt.1.option.d:0 "Temen la luz de Dios. Actuemos durante el día".
 POD_inquihunt.1.option.e:0 "Puede que tenga algo sobre este demonio en particular en mis libros..."
 POD_inquihunt.1.option.g:0 "¡Te mataré yo mismo, demonio!"
 POD_inquihunt.2.t:0 "Una hoguera satisfactoria"
 POD_inquihunt.2.desc:0 "Fue más fácil de lo que pensabas devolver a estas pobres almas a la luz de Dios. Estaban ansiosos por escuchar y aprender después de tantos años perdidos en la oscuridad.\NUna vez hecho esto, fue aún más fácil aliarse con ellos y utilizar todo lo que sabían sobre el demonio que acecha en la noche. Y así, con todo el pueblo a cuestas, asaltaste su guarida, conteniéndolo fácilmente por su número y con la ayuda de la luz dada por Dios.\NY con todo eso dicho y hecho, ahora estás disfrutando de ver al demonio arder en la hoguera con todo el pueblo vitoreando a Dios, y a tu nombre."
 POD_inquihunt.2.option.a:0 "Semejante espectáculo calienta mi corazón"
 POD_inquihunt.3.t:0 "Hijos contra padres"
 POD_inquihunt.3.desc:0 "Parece que el demonio tiene sus garras bien puestas en este pueblo. Su predicación ha reunido a un gran número de seguidores, pero también a un número menor de rebeldes, que ahora se oponen a su santa procesión a la entrada de la guarida del demonio.\NEstá claro que han sido corrompidos por el Diablo, pero no tienes tiempo de salvar sus almas, ya que el vampiro seguramente escapará en cuanto se entere de la conmoción que hay fuera. Sin embargo, hay otra opción, más rápida sin duda, pero también moralmente dudosa..."
 POD_inquihunt.3.option.a:0 "Mátalos a todos y deja que Dios los resuelva"
 POD_inquihunt.3.option.b:0 "Ningún inocente saldrá herido, ni siquiera los inocentes equivocados"
 POD_inquihunt.4.t:0 "Ironía ardiente"
 POD_inquihunt.4.desc:0 "Subestimasteis gravemente el tirón que este demonio tenía sobre este pueblo. Tu prédica fue recibida con escepticismo o incluso con ira. Era demasiado tarde cuando descubriste la verdad: todos estaban bajo la esclavitud del vampiro desde el principio. Mientras las llamas comienzan a envolverte, recuerdas que Dios es misericordia. Y así, que Él se apiade de tu fracaso y de las almas de estos inocentes descarriados".
 POD_inquihunt.4.option.a:0 "Amén"
 POD_inquihunt.5.t:0 "El plan perfecto"
 POD_inquihunt.5.desc:0 "El orgullo es un pecado, pero debes admitirlo: fue un asalto impecable, y ejecutado con pericia por los valientes Caballeros de Dios bajo tu mando. A pesar de los numerosos esclavos que defendían la zona y de las aún más numerosas trampas, al final conseguisteis asaltar el lugar con pocas pérdidas.\NObviamente, atacasteis a plena luz del día, y debéis dar crédito a la luz de Dios por haber mantenido al demonio dormido durante la batalla. Después de tomar el castillo, fue un momento anticlimático -pero satisfactorio- cuando decapitaste al vampiro dormido. La victoria es tuya una vez más".
 POD_inquihunt.5.option.a:0 "Me encanta cuando un plan sale bien".
 POD_inquihunt.6.t:0 "¿Victoria pírrica?"
 POD_inquihunt.6.desc:0 "Mientras la batalla aún se libra dentro del castillo, sabes que la victoria está a tu alcance. Pero, ¿merece la pena el coste? Sus defensores estaban preparados, y numerosas trampas ya se han cobrado la vida de buenos soldados de Dios. ¿Acaso un demonio muerto es suficiente retribución para estas pobres almas? No es demasiado tarde, y aún podrías cancelar el ataque por hoy, pero el vampiro aprovechará la cobertura de la noche para escapar. O sigues adelante y siempre llevas la carga de los buenos hombres perdidos por una causa digna".
 POD_inquihunt.6.option.a:0 "Dios los acogerá en su reino".
 POD_inquihunt.6.option.b:0 "No vale la pena"
 POD_inquihunt.7.t:0 "La última batalla"
 POD_inquihunt.7.desc:0 "Ha salido horriblemente mal. El castillo estaba preparado, y ni siquiera pudisteis abrir una brecha en las murallas. Peor aún, llegaron refuerzos de un pueblo cercano, aparentemente también esclavizado por el Señor Oscuro del castillo. El demonio está tan cerca, pero tan lejos. No hay escapatoria para ti y tus valientes caballeros, y parece que Dios te llamará a su reino hoy. Esperas ser digno de su misericordia, pero antes de eso... cortarás tantos de estos demonios como puedas".
 POD_inquihunt.7.option.a:0 "Es un buen día para morir"
 POD_inquihunt.8.t:0 "Activos en llamas"
 POD_inquihunt.8.desc:0 "Tu ataque fue metódico. Apuntaste a cada gremio, milicia o grupo de cultistas en los que el demonio tenía sus garras. Utilizaste dos poderosas armas: el atractivo del oro para los codiciosos y el miedo de la Iglesia para los corruptos.\NAsí que llegaste a esto, tu campaña ha aislado al vampiro, alejado a sus aliados, y dispersado a sus secuaces. Ahora ves el último refugio del demonio arder ante tus ojos, los gritos de la criatura en su interior como música para tus oídos."
 POD_inquihunt.8.option.a:0 "Estás despedido"
 POD_inquihunt.9.t:0 "Una vida mercenaria para mí"
 POD_inquihunt.9.desc:0 "Esta malvada criatura tenía más tirón en la región de lo que pensabas al principio. Pero parece que el vampiro no caerá fácilmente, ya que una poderosa banda de mercenarios está marchando hacia tu posición, aparentemente empleada por tu enemigo para eliminarte. Tienes que elegir: a los mercenarios les encanta el oro, y podrías volverlos contra su empleador antes de que pueda huir. O puedes cortar tus pérdidas y aceptar un empate por esta vez".
 POD_inquihunt.9.option.a:0 "Ofrezco oro y salvación a los hombres piadosos como tú"
 POD_inquihunt.9.option.b:0 "Atraparé a este diablo la próxima vez"
 POD_inquihunt.10.t:0 "Cambio de dirección"
 POD_inquihunt.10.desc:0 "Has calculado mal. Tus acciones fueron contrarrestadas a cada paso. Este vampiro acababa de tener más oro, más agentes y más influencia sobre esta comunidad de lo que podrías haber previsto.Y ahora, todo se viene abajo, literalmente, después de que tu último error revelara tu posición al demonio. Un grupo de "mercenarios" endurecidos no tardó en aparecer y, con sólo tus fieles caballeros para protegerte, no tardaste en ser asediado en tu propia base. Mientras los últimos sonidos de la batalla se apagan en el exterior, ahora oyes los sonidos de las antorchas que se lanzan por la ventana. Afortunadamente, tienes tiempo para un último Pater Noster".
 POD_inquihunt.10.option.a:0 "Pater noster qui es in caelis..."
 POD_inquihunt.11.t:0 "El enemigo de mi enemigo..."
 POD_inquihunt.11.desc:0 "Una cosa que sabes de los vampiros es que en su mayoría son hostiles entre sí. Y te has convertido en un experto en utilizar este hecho en tu beneficio.\NDejando algunas pistas sobre esta guarida en particular a un conocido nido de demonios vecino, te limitaste a observar como tu objetivo era asaltado durante la noche por unos matones contratados por su rival. Ganó, pero quedó lo suficientemente debilitado como para que tus Caballeros lo sometieran fácilmente. Rápidamente le encontraste un nuevo hogar en tu cámara de tortura personal. Luego pasaste unos días muy perspicaces con él hasta que lo dejaste desangrarse hasta la muerte verdadera. La voluntad de Dios está hecha".
 POD_inquihunt.11.option.a:0 "Los gritos que hacen en presencia de una Reliquia Sagrada eran bastante interesantes..."
 POD_inquihunt.12.t:0 "Cruz y daga"
 POD_inquihunt.12.desc:0 "Estás impresionado por la astucia de este demonio. La mayoría de tus objetivos anteriores cayeron con bastante facilidad una vez que tejiste tu red de intriga a su alrededor, pero este... este contraatacó. Tu propia red es atacada, con rumores viciosos que te apuntan a ti en particular. Sabes que puedes con esta guerra de sombras, pero te costará mucho reparar el daño causado por tu enemigo. Empujar sólo un poco más te permitiría la alegría de llevar a este vampiro a tu mejor cámara de tortura, aunque... Decisiones, decisiones".
 POD_inquihunt.12.option.a:0 "La reputación no lo es todo"
 POD_inquihunt.12.option.b:0 "Este demonio no merece la pena"
 POD_inquihunt.13.t:0 "Encontrar a tu mejor"
 POD_inquihunt.13.desc:0 "No tenías ninguna posibilidad. Cada una de tus acciones fue anticipada, cada movimiento que hiciste fue fácilmente contrarrestado. No eras más que un niño jugando una partida de ajedrez sin conocer las reglas. Este vampiro probablemente inventó el juego. Incluso cuando comprendiste el peligro que corrías, fue demasiado tarde. Y así, ahora estás siendo torturado cada noche por aquel que tontamente querías destruir. E incluso en este campo en particular, él sabe mucho más que tú..."
 POD_inquihunt.13.option.a:0 "La noche es oscura y llena de terrores"
 POD_inquihunt.14.t:0 "Conoce a tu enemigo"
 POD_inquihunt.14.desc:0 "Te alegraste bastante al ver que tenías en tus libros algunas viejas menciones del particular desalmado que rastreaste. Te alegró aún más saber de su peculiar apego a una familia mortal aún viva. Como si esas criaturas pudieran sentir todavía las emociones de los mortales. Usando a estos mortales como cebo, lograste atraer al vampiro a una trampa cuidadosamente planeada en tierra sagrada. Este demonio en concreto se convirtió instantáneamente en cenizas al entrar en la zona, una observación que te apresuraste a consignar en tu diario."
 POD_inquihunt.14.option.a:0 "Esto podría ser útil para la próxima"
 POD_inquihunt.15.t:0 "Un libro demasiado lejos"
 POD_inquihunt.15.desc:0 "Este demonio es escurridizo. Ya ha evitado dos de tus trampas cuidadosamente planeadas, y estás empezando a perder algo de terreno, ya que varios de tus agentes han desaparecido.\NSin embargo, queda una posibilidad, una que decides no utilizar hasta ahora dada su... naturaleza "mística". La Santa Iglesia ciertamente no aprobaría tal elección, pero quizás la muerte de este vampiro en concreto valga más que tu reputación."
 POD_inquihunt.15.option.a:0 "Dios es indulgente después de todo..."
 POD_inquihunt.15.option.b:0 "Es una línea que no cruzaré".
 POD_inquihunt.16.t:0 "Si miras al Abismo..."
 POD_inquihunt.16.desc:0 "No sabes realmente cuándo empezó. Encontraste una referencia del vampiro en un libro antiguo, luego otra... y empezaste a leer. Y aún más cuando te trajeron nuevos libros unos agentes que no recuerdas haber contratado.\NHas estado perdido durante bastante tiempo en tu trabajo y has escarbado en lo más profundo, probablemente demasiado. Al menos, eso es lo que piensa la Iglesia, ya que fuiste denunciado por uno de sus Caballeros por tus lecturas "heréticas". Y así, aquí estás, en una hoguera una vez más, pero esta vez no en público..."
 POD_inquihunt.16.option.a:0 "¡Estuve tan cerca de la verdad! Tan cerca!"
 POD_inquihunt.17.t:0 "Furia Sagrada"
 POD_inquihunt.17.desc:0 "No esperaban un asalto frontal. Eso es lo que concluyes después de haberte abierto paso a través de un número considerable de siervos desprevenidos del vampiro antes de encontrar su lugar de descanso. Aunque has atacado de día, el jaleo de la batalla ha despertado al demonio que te estaba esperando.\NDebes admitir que ha hecho un buen espectáculo, tan lento como son de día, pero con todo, le has cortado la cabeza con bastante facilidad antes de que pudiera orientarse en esta batalla. Un chupasangre menos en la hermosa Tierra de Dios".
 POD_inquihunt.17.option.a:0 "Entonces, ¿dónde está el siguiente?"
 POD_inquihunt.18.t:0 "Un oponente digno"
 POD_inquihunt.18.desc:0 "Este es duro. A pesar de haber despachado fácilmente a la mayoría de sus guardias y de haber atacado durante el día, este demonio sigue siendo un enemigo formidable. Confías en que ganarás, gracias a la luz de Dios, pero es un proceso lento y arduo.\NPeor aún, esta larga batalla ha dado tiempo a que intervengan otros siervos del vampiro. Probablemente tú también podrías vencerlos, pero no saldrás ileso de semejante lucha..."
 POD_inquihunt.18.option.a:0 "Ganaré, cueste lo que cueste".
 POD_inquihunt.18.option.b:0 "Debo preservarme para futuras batallas".
 POD_inquihunt.19.t:0 "Superado"
 POD_inquihunt.19.desc:0 "Así es como termina. El demonio, a pesar de haber sido atacado de día, es mucho más fuerte, rápido y duro que tú. Llegasteis a esta conclusión bastante pronto en vuestro enfrentamiento y habéis hecho las paces con ello.\NAhora, sólo es cuestión de retenerlo lo suficiente para que vuestras tropas retrocedan y vivan un día más, lo cual estáis bastante seguros de que finalmente se ha hecho. Con un último golpe, el vampiro se prepara para acabar contigo. Pero tú estás más tranquilo de lo que él estará nunca, ya que Dios te espera al otro lado".
 POD_inquihunt.19.option.a:0 "La luz nunca se apagará de verdad"

