 POD_mentoring_disciplines.0001.desc:0 "Si tu posible mentor conoce una disciplina que tú no conoces, puedes pedirle que comparta sus conocimientos contigo.\NSin embargo, no es un proceso gratuito, el mentor tendrá que compartir su sangre contigo, lo que provoca un débil vínculo sanguíneo. También es algo denigrante pedir ayuda en la política vampírica. Por ello, tu prestigio se verá afectado".
