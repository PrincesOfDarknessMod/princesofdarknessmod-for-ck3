l_spanish:
 trait_homid_born:0 "homínido"
 trait_homid_born_desc:0 "Los homínidos son una raza de Garou nacidos y criados por humanos, que es su forma natural."
 trait_metis:0 "Metis"
 trait_metis_desc:0 "Metis es una rara raza de Garou. Son descendientes de dos Garou que rompieron la Letanía por amor o lujuria. Nacen en la forma Crinos y esa es su forma natural, sin embargo, son deformes y estériles."
 trait_lupus_born:0 "Lupus"
 trait_lupus_born_desc:0 "Los lupus son una raza de Garou que nació y creció como lobo, que es su forma natural."
 trait_ahroun:0 "Ahroun"
 trait_ahroun_desc:0 "Uno de los cinco Auspicios bajo los cuales puede nacer un Garou. La Luna Llena convierte al Ahroun en el arma viviente de Gaia. Son el guerrero entre una raza de guerreros, el campeón de un pueblo marcial. Siempre listo para matar, y para morir si es necesario."
 trait_galliard:0 "gallarda"
 trait_galliard_desc:0 "Uno de los cinco Auspicios bajo los cuales puede nacer un Garou. Representado por la Luna Gibosa, Galliard canta el alma del Garou. Ellos son la voz del Pueblo, llamándolos a la batalla e inspirándolos a la grandeza en la vida y en la muerte. También son guardianes de las tradiciones, llevando la tradición de las tribus desde el principio."
 trait_philodox:0 "Philodox"
 trait_philodox_desc:0 "Uno de los cinco Auspicios bajo los cuales puede nacer un Garou. La media luna significa equilibrio y dualidad, un Garou nacido bajo su influencia suele actuar como consejero, mediador y guardián de la ley de su manada."
 trait_theurge:0 "Theurge"
 trait_theurge_desc:0 "Uno de los cinco Auspicios bajo los cuales puede nacer un Garou. La luna creciente en forma de hoz otorga el don de la intuición. Los Theurges son los místicos de los Garou, más cercanos que nadie a la Umbra y sus habitantes."
 trait_ragabash:0 "Ragabash"
 trait_ragabash_desc:0 "Uno de los cinco Auspicios bajo los cuales puede nacer un Garou. El que nace durante la Luna Nueva actúa como el embaucador mítico, el tonto que es alternativamente tonto y sabio. Hace el papel de lo contrario, cuestionando la tradición para encontrar el camino más sabio."
